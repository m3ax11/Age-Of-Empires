 AOEIW9_AUS_focus_tree:0 "Schwerpunktbaum Österreich-Ungarns"
 AOEIW9_AUS_politics_p1_2:0 "Reichsrat versöhnen"
 AOEIW9_AUS_politics_p1_2_desc:0 "Die Stellung von „Reichsrat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Föderation der Kronen“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_AUS_politics_p1_3:0 "Kronländer reformieren"
 AOEIW9_AUS_politics_p1_3_desc:0 "Die Verfahren von „Kronländer“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Föderation der Kronen“ arbeitsfähig bleibt."
 AOEIW9_AUS_politics_p1_4:0 "Wiener Hof einbinden"
 AOEIW9_AUS_politics_p1_4_desc:0 "„Wiener Hof“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Föderation der Kronen“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_AUS_politics_p1_5:0 "Ministerien der Donaumonarchie ausbalancieren"
 AOEIW9_AUS_politics_p1_5_desc:0 "Weder die Ausschaltung von „Ministerien der Donaumonarchie“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Föderation der Kronen“ austariert."
 AOEIW9_AUS_politics_p1_6:0 "Der Reichsrat hört die Kronländer"
 AOEIW9_AUS_politics_p1_6_desc:0 "Die Reichsabgeordneten hören öffentliche Eingaben der Kronländer zu Sprache, Steuern und Wehrdienst. Die Einheit muss das Protokoll der Debatte überstehen."
 AOEIW9_AUS_politics_p2_2:0 "Kronländer öffnen"
 AOEIW9_AUS_politics_p2_2_desc:0 "Der Zugang zu „Kronländer“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Autorität aus Wien“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_AUS_politics_p2_3:0 "Wiener Hof garantieren"
 AOEIW9_AUS_politics_p2_3_desc:0 "Die Stellung von „Wiener Hof“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Autorität aus Wien“ einzubinden."
 AOEIW9_AUS_politics_p2_4:0 "Ministerien der Donaumonarchie erweitern"
 AOEIW9_AUS_politics_p2_4_desc:0 "„Ministerien der Donaumonarchie“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Autorität aus Wien“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_AUS_politics_p2_5:0 "Provinz Diets Verantwortung übertragen"
 AOEIW9_AUS_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Provinz Diets“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Autorität aus Wien“ durch delegierte Autorität regieren kann."
 AOEIW9_AUS_politics_p2_6:0 "Ein Staatsgrundgesetz für die Donau"
 AOEIW9_AUS_politics_p2_6_desc:0 "Der Reichsrat legt gemeinsame Befugnisse und Garantien der Kronländer in einem neuen Staatsgrundgesetz fest. Weder Budapest noch Wien darf den Ausgleich allein ändern."
 AOEIW9_AUS_politics_p3_2:0 "Wiener Hof mobilisieren"
 AOEIW9_AUS_politics_p3_2_desc:0 "„Wiener Hof“ wird zu einem organisatorischen Träger des Projekts „Deutsche Nationalitätenfrage“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_AUS_politics_p3_3:0 "Die Macht von Ministerien der Donaumonarchie brechen"
 AOEIW9_AUS_politics_p3_3_desc:0 "Die eigenständige Macht von „Ministerien der Donaumonarchie“ ist mit dem Projekt „Deutsche Nationalitätenfrage“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_AUS_politics_p3_4:0 "Provinz Diets ersetzen"
 AOEIW9_AUS_politics_p3_4_desc:0 "„Provinz Diets“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Deutsche Nationalitätenfrage“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_AUS_politics_p3_5:0 "Schließt den Reichsrat"
 AOEIW9_AUS_politics_p3_5_desc:0 "Wachen versiegeln die Kammer, und Ministerien regieren per Dekret aus der Hofburg. Das Regime trägt nun jede Beschwerde, die zuvor das Parlament auffing."
 AOEIW9_AUS_politics_p3_6:0 "Wien weist den Anschluss zurück"
 AOEIW9_AUS_politics_p3_6_desc:0 "Deutsche Nationalisten erfahren, dass sich die Donaumonarchie nicht in Berlins Reich auflösen wird. Polizei, Schulen und Garnisonen setzen eine österreichische Antwort durch."
 AOEIW9_AUS_politics_settlement:0 "Ein Reich der Kronländer"
 AOEIW9_AUS_politics_settlement_desc:0 "Krone, Reichsrat und Landesregierungen wissen nun, wem Steuern, Ernennungen und Wehrpflichten zustehen. Der Donaustaat kann durch seine Vielfalt regieren."
 AOEIW9_AUS_eco_root:0 "Bestandsaufnahme: Wiener Werkstätten"
 AOEIW9_AUS_eco_root_desc:0 "Wiener Werkstätten, Donaukorridor und Alpine Wasserkraftwerke arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Österreich-Ungarn am schnellsten ausbauen kann."
 AOEIW9_AUS_eco_civ_2:0 "Schienen nach Donaukorridor"
 AOEIW9_AUS_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Donaukorridor“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_AUS_eco_civ_5:0 "Ausbau von Trieste Commerce"
 AOEIW9_AUS_eco_civ_5_desc:0 "Für „Trieste Commerce“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_AUS_eco_civ_6:0 "Fahrpläne von Wien nach Lemberg"
 AOEIW9_AUS_eco_civ_6_desc:0 "Die Reichsbahnen stimmen Personen- und Güterwege über Kronlandgrenzen hinweg ab. Kohle und Maschinen müssen Lemberg erreichen, ohne an rivalisierenden Verwaltungen zu stranden."
 AOEIW9_AUS_eco_civ_7:0 "Eine zweite Schicht bei Wiener Werkstätten"
 AOEIW9_AUS_eco_civ_7_desc:0 "Bei „Wiener Werkstätten“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_AUS_eco_civ_8:0 "Öffentliche Bauprogramme bei Donaukorridor"
 AOEIW9_AUS_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Donaukorridor“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_AUS_eco_war_1:0 "Rüstungsaudit: Bohemian Foundries"
 AOEIW9_AUS_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Bohemian Foundries“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_AUS_eco_war_2:0 "Rüstungsaufträge für Trieste Commerce"
 AOEIW9_AUS_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Trieste Commerce“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_AUS_eco_war_3:0 "Werkzeugmaschinen entlang der Südbahn"
 AOEIW9_AUS_eco_war_3_desc:0 "Bahnwerkstätten von Wien bis Triest erhalten gemeinsame Drehbänke, Lehren und Ersatzteile. Die südliche Strecke muss ihren Wagenpark bei Mobilmachung selbst reparieren."
 AOEIW9_AUS_eco_war_4:0 "Wiener Werkstätten für die Aufrüstung ausbauen"
 AOEIW9_AUS_eco_war_4_desc:0 "Rund um „Wiener Werkstätten“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_AUS_eco_war_5:0 "Donaukorridor standardisieren"
 AOEIW9_AUS_eco_war_5_desc:0 "Die mit „Donaukorridor“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_AUS_eco_war_6:0 "Nachtproduktion bei Alpine Wasserkraftwerke"
 AOEIW9_AUS_eco_war_6_desc:0 "Bei „Alpine Wasserkraftwerke“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_AUS_eco_war_7:0 "Langfristige Verträge für Bohemian Foundries"
 AOEIW9_AUS_eco_war_7_desc:0 "Langfristige Verträge sichern „Bohemian Foundries“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_AUS_eco_science_1:0 "Technische Hochschule Wien ausstatten"
 AOEIW9_AUS_eco_science_1_desc:0 "„Technische Hochschule Wien“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_AUS_eco_science_2:0 "Neue Labore an Kaiserliche Akademie der Wissenschaften"
 AOEIW9_AUS_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kaiserliche Akademie der Wissenschaften“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_AUS_eco_science_3:0 "Die Wiener Akademie öffnet ihre Labore"
 AOEIW9_AUS_eco_science_3_desc:0 "Die Akademie teilt Instrumente und Forscher mit Bahn-, Elektro- und Rüstungswerken. Reichswissenschaft muss Probleme lösen, die Kronlandgrenzen überschreiten."
 AOEIW9_AUS_eco_science_4:0 "Industriephysik an Technische Hochschule Wien"
 AOEIW9_AUS_eco_science_4_desc:0 "Die Industriephysik an „Technische Hochschule Wien“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_AUS_eco_science_5:0 "Produktionsforschung an Kaiserliche Akademie der Wissenschaften"
 AOEIW9_AUS_eco_science_5_desc:0 "Bei „Kaiserliche Akademie der Wissenschaften“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_AUS_eco_science_6:0 "Forschungsmittel von der Ringstraße"
 AOEIW9_AUS_eco_science_6_desc:0 "Wien fördert aussichtsreiche Arbeiten an Metallurgie, Funk und Motoren über mehrere Jahre. Provinzlabore dürfen konkurrieren, ohne jede Werkbank in die Hauptstadt zu verlegen."
 AOEIW9_AUS_eco_infra_2:0 "Frachtkapazität bei Bohemian Foundries"
 AOEIW9_AUS_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Bohemian Foundries“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_AUS_eco_infra_3:0 "Arbeiterwohnungen bei Trieste Commerce"
 AOEIW9_AUS_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Trieste Commerce“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_AUS_eco_infra_4:0 "Ein Güterplan für die Monarchie"
 AOEIW9_AUS_eco_infra_4_desc:0 "Fahrdienstleiter reservieren Wagen, Brücken und Depots nach einem gemeinsamen Reichsplan. Innere Grenzen dürfen Militärfracht nicht länger aufhalten."
 AOEIW9_AUS_eco_final:0 "Ein donauweites Industriesystem"
 AOEIW9_AUS_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Österreich-Ungarn wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_AUS_mil_root:0 "k.u.k. Generalstab überprüfen"
 AOEIW9_AUS_mil_root_desc:0 "„K.u.k. Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_AUS_mil_army_2:0 "Die Donau-Infanteriearmee"
 AOEIW9_AUS_mil_army_2_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_AUS_mil_army_5:0 "Die imperiale bewegliche Reserve"
 AOEIW9_AUS_mil_army_5_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_AUS_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_AUS_mil_army_6_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_AUS_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_AUS_mil_army_7_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_AUS_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_AUS_mil_army_8_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_AUS_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_AUS_mil_army_9_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_AUS_mil_air_1:0 "Kaiserliches Fliegerkorps neu ordnen"
 AOEIW9_AUS_mil_air_1_desc:0 "„Kaiserliches Fliegerkorps“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_AUS_mil_air_2:0 "Jagdfliegerausbildung bei Wiener Neustadt Fliegerschule"
 AOEIW9_AUS_mil_air_2_desc:0 "„Wiener Neustadt Fliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_AUS_mil_air_3:0 "Österreich-Ungarn: Bodenunterstützungsdoktrin unter Donau-Luftkommando"
 AOEIW9_AUS_mil_air_3_desc:0 "Unter „Donau-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Österreich-Ungarn gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_AUS_mil_air_4:0 "Die Reichweite von Kaiserliches Fliegerkorps erhöhen"
 AOEIW9_AUS_mil_air_4_desc:0 "„Kaiserliches Fliegerkorps“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Österreich-Ungarn verlangen."
 AOEIW9_AUS_mil_air_5:0 "Radarnetze für Wiener Neustadt Fliegerschule"
 AOEIW9_AUS_mil_air_5_desc:0 "„Wiener Neustadt Fliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_AUS_mil_air_6:0 "Österreich-Ungarn: Das Luftkommando unter Donau-Luftkommando vereinigen"
 AOEIW9_AUS_mil_air_6_desc:0 "„Donau-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Österreich-Ungarn gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_AUS_mil_sea_1:0 "Adriatic Geschwader überprüfen"
 AOEIW9_AUS_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Adriatic Geschwader“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_AUS_mil_sea_2:0 "Ausbau: Marinearsenal Triest"
 AOEIW9_AUS_mil_sea_2_desc:0 "„Marinearsenal Triest“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_AUS_mil_sea_3:0 "Österreich-Ungarn: Flottenmanöver – Kaiserliche Küstenflotte"
 AOEIW9_AUS_mil_sea_3_desc:0 "Flottenmanöver mit „Kaiserliche Küstenflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein. In Österreich-Ungarn gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_AUS_mil_sea_4:0 "Sicherungsdoktrin für Adriatic Geschwader"
 AOEIW9_AUS_mil_sea_4_desc:0 "„Adriatic Geschwader“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_AUS_mil_sea_5:0 "Marineflieger bei Marinearsenal Triest"
 AOEIW9_AUS_mil_sea_5_desc:0 "Marineflieger werden mit „Marinearsenal Triest“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_AUS_mil_sea_6:0 "Österreich-Ungarn: Neue Schiffskörper – Kaiserliche Küstenflotte"
 AOEIW9_AUS_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Kaiserliche Küstenflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden. In Österreich-Ungarn gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_AUS_mil_final:0 "Österreich-Ungarn: Elastische Verteidigung"
 AOEIW9_AUS_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Österreich-Ungarn verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_AUS_dip_root:0 "Die Doktrin „Danubian“ festlegen"
 AOEIW9_AUS_dip_root_desc:0 "Österreich-Ungarn muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_AUS_dip_a_2:0 "Die Mission Wien–Berlin"
 AOEIW9_AUS_dip_a_2_desc:0 "Eine Mission zwischen Wien und Berlin schafft direkte Kanäle für Streitfragen, die sonst nur durch rivalisierende Bündnissysteme gefiltert würden."
 AOEIW9_AUS_dip_a_3:0 "Donauhandel mit Deutschland"
 AOEIW9_AUS_dip_a_3_desc:0 "Handelsbeziehungen mit Deutschland können die Donauwirtschaft stärken, ohne politische Eingliederung zu bedeuten."
 AOEIW9_AUS_dip_a_4:0 "Militärische Verbindung über Böhmen"
 AOEIW9_AUS_dip_a_4_desc:0 "Begrenzte militärische Verbindung verringert das Risiko von Zwischenfällen an Böhmen und schafft Transparenz ohne gemeinsames Kommando."
 AOEIW9_AUS_dip_a_5:0 "Habsburgische Unabhängigkeit bewahren"
 AOEIW9_AUS_dip_a_5_desc:0 "Wien kooperiert bei gemeinsamen Interessen und bewahrt zugleich ausdrücklich die verfassungsrechtliche und diplomatische Eigenständigkeit der Doppelmonarchie."
 AOEIW9_AUS_dip_a_6:0 "Das Abkommen von Wien und Berlin"
 AOEIW9_AUS_dip_a_6_desc:0 "Das Abkommen schafft Nichtangriff und praktische Zusammenarbeit, ohne Österreich-Ungarn aus The Old Order herauszulösen."
 AOEIW9_AUS_dip_b_1:0 "Balkan Balance"
 AOEIW9_AUS_dip_b_1_desc:0 "„Balkan Balance“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Österreich-Ungarn tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_AUS_dip_b_2:0 "Eine Mission zu „Balkan Balance“ entsenden"
 AOEIW9_AUS_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Balkan Balance“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_AUS_dip_b_3:0 "Wirtschaftlicher Druck: „Balkan Balance“"
 AOEIW9_AUS_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Balkan Balance“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_AUS_dip_b_4:0 "Stabsgespräche: „Balkan Balance“"
 AOEIW9_AUS_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Balkan Balance“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_AUS_dip_b_5:0 "Formelle Warnung: „Balkan Balance“"
 AOEIW9_AUS_dip_b_5_desc:0 "Eine formelle Warnung zu „Balkan Balance“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_AUS_dip_b_6:0 "Bedingungen für „Balkan Balance“"
 AOEIW9_AUS_dip_b_6_desc:0 "Für „Balkan Balance“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_AUS_dip_final:0 "Wien zwischen den Blöcken"
 AOEIW9_AUS_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Österreich-Ungarn sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_BEL_focus_tree:0 "Kingdom of Belgium Schwerpunktbaum"
 AOEIW9_BEL_politics_p1_2:0 "Belgien: Abgeordnetenkammer versöhnen"
 AOEIW9_BEL_politics_p1_2_desc:0 "Die Stellung von „Abgeordnetenkammer“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Königliche Koalition“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_BEL_politics_p1_3:0 "Belgien: Senat reformieren"
 AOEIW9_BEL_politics_p1_3_desc:0 "Die Verfahren von „Senat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Königliche Koalition“ arbeitsfähig bleibt."
 AOEIW9_BEL_politics_p1_4:0 "Katholischer Block einbinden"
 AOEIW9_BEL_politics_p1_4_desc:0 "„Katholischer Block“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Königliche Koalition“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_BEL_politics_p1_5:0 "Belgien: Königspalast und Nation"
 AOEIW9_BEL_politics_p1_5_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Königliche Koalition“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_BEL_politics_p2_2:0 "Belgien: Senat öffnen"
 AOEIW9_BEL_politics_p2_2_desc:0 "Der Zugang zu „Senat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Parlament über den Fraktionen“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_BEL_politics_p2_3:0 "Katholischer Block garantieren"
 AOEIW9_BEL_politics_p2_3_desc:0 "Die Stellung von „Katholischer Block“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Parlament über den Fraktionen“ einzubinden."
 AOEIW9_BEL_politics_p2_4:0 "Liberale Liga erweitern"
 AOEIW9_BEL_politics_p2_4_desc:0 "„Liberale Liga“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Parlament über den Fraktionen“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_BEL_politics_p2_5:0 "Eine neue Charta für Königreich Belgien"
 AOEIW9_BEL_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Parlament über den Fraktionen“ in einen dauerhaften Rahmen für Belgien. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_BEL_politics_p3_2:0 "Katholischer Block mobilisieren"
 AOEIW9_BEL_politics_p3_2_desc:0 "„Katholischer Block“ wird zu einem organisatorischen Träger des Projekts „Korporatistischer Staat“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_BEL_politics_p3_3:0 "Die Macht von Liberale Liga brechen"
 AOEIW9_BEL_politics_p3_3_desc:0 "Die eigenständige Macht von „Liberale Liga“ ist mit dem Projekt „Korporatistischer Staat“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_BEL_politics_p3_4:0 "Wallonische Räte ersetzen"
 AOEIW9_BEL_politics_p3_4_desc:0 "„Wallonische Räte“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Korporatistischer Staat“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_BEL_politics_p3_5:0 "Neuordnung: Korporatistischer Staat"
 AOEIW9_BEL_politics_p3_5_desc:0 "Der politische Konflikt um „A Korporatistischer Staat“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Korporatistischer Staat“ untergeordnet werden."
 AOEIW9_BEL_politics_settlement:0 "Der belgische Verfassungsausgleich"
 AOEIW9_BEL_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Abgeordnetenkammer und Senat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Belgien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_BEL_eco_root:0 "Bestandsaufnahme: Wallonisches Stahlrevier"
 AOEIW9_BEL_eco_root_desc:0 "Wallonisches Stahlrevier, Antwerpener Hafenanlagen und Werkstätten von Lüttich arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Belgien am schnellsten ausbauen kann."
 AOEIW9_BEL_eco_civ_2:0 "Schienen nach Antwerpener Hafenanlagen"
 AOEIW9_BEL_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Antwerpener Hafenanlagen“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_BEL_eco_civ_5:0 "Ausbau von Kongo-Handelsamt"
 AOEIW9_BEL_eco_civ_5_desc:0 "Für „Kongo-Handelsamt“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_BEL_eco_civ_6:0 "Albertkanal erneuern"
 AOEIW9_BEL_eco_civ_6_desc:0 "„Albertkanal“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_BEL_eco_civ_7:0 "Eine zweite Schicht bei Wallonisches Stahlrevier"
 AOEIW9_BEL_eco_civ_7_desc:0 "Bei „Wallonisches Stahlrevier“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_BEL_eco_civ_8:0 "Öffentliche Bauprogramme bei den Antwerpener Hafenanlagen"
 AOEIW9_BEL_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Antwerpener Hafenanlagen“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_BEL_eco_civ_9:0 "Entwicklungsrat für Werkstätten von Lüttich"
 AOEIW9_BEL_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Werkstätten von Lüttich“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_BEL_eco_war_1:0 "Rüstungsaudit: Brüsseler Kredithäuser"
 AOEIW9_BEL_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Brüsseler Kredithäuser“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_BEL_eco_war_2:0 "Rüstungsaufträge für Kongo-Handelsamt"
 AOEIW9_BEL_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Kongo-Handelsamt“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_BEL_eco_war_3:0 "Präzisionswerkzeuge für Albertkanal"
 AOEIW9_BEL_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Albertkanal“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_BEL_eco_war_4:0 "Wallonisches Stahlrevier für die Aufrüstung ausbauen"
 AOEIW9_BEL_eco_war_4_desc:0 "Rund um „Wallonisches Stahlrevier“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_BEL_eco_war_5:0 "Antwerpener Hafenanlagen standardisieren"
 AOEIW9_BEL_eco_war_5_desc:0 "Die mit „Antwerpener Hafenanlagen“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_BEL_eco_war_6:0 "Nachtproduktion bei Werkstätten von Lüttich"
 AOEIW9_BEL_eco_war_6_desc:0 "Bei „Werkstätten von Lüttich“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_BEL_eco_science_1:0 "Université Libre de Bruxelles ausstatten"
 AOEIW9_BEL_eco_science_1_desc:0 "„Université Libre de Bruxelles“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_BEL_eco_science_2:0 "Neue Labore an Liège Technisches Institut"
 AOEIW9_BEL_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Liège Technisches Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_BEL_eco_science_3:0 "Angewandte Forschung an Königliche Wissenschaftsgesellschaft"
 AOEIW9_BEL_eco_science_3_desc:0 "„Königliche Wissenschaftsgesellschaft“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_BEL_eco_science_4:0 "Industriephysik an Université Libre de Bruxelles"
 AOEIW9_BEL_eco_science_4_desc:0 "Die Industriephysik an „Université Libre de Bruxelles“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_BEL_eco_science_5:0 "Produktionsforschung an Liège Technisches Institut"
 AOEIW9_BEL_eco_science_5_desc:0 "Bei „Liège Technisches Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_BEL_eco_infra_2:0 "Frachtkapazität bei Brüsseler Kredithäuser"
 AOEIW9_BEL_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Brüsseler Kredithäuser“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_BEL_eco_infra_3:0 "Arbeiterwohnungen bei Kongo-Handelsamt"
 AOEIW9_BEL_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Kongo-Handelsamt“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_BEL_eco_infra_4:0 "Logistik über Albertkanal"
 AOEIW9_BEL_eco_infra_4_desc:0 "„Albertkanal“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_BEL_eco_final:0 "Der belgische Industriepakt"
 AOEIW9_BEL_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Belgien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_BEL_mil_root:0 "belgischer Generalstab überprüfen"
 AOEIW9_BEL_mil_root_desc:0 "„Belgischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_BEL_mil_army_2:0 "Feldmanöver mit Fortress Troops"
 AOEIW9_BEL_mil_army_2_desc:0 "Großmanöver mit „Fortress Troops“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_BEL_mil_army_5:0 "Belgien: Königliche Militärakademie motorisieren"
 AOEIW9_BEL_mil_army_5_desc:0 "Der Motortransport von „Königliche Militärakademie“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann. In Belgien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_BEL_mil_army_6:0 "Stabsverfahren bei belgischer Generalstab"
 AOEIW9_BEL_mil_army_6_desc:0 "Bei „Belgischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_BEL_mil_army_7:0 "Panzerstudien bei Fortress Troops"
 AOEIW9_BEL_mil_army_7_desc:0 "„Fortress Troops“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Belgien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_BEL_mil_air_1:0 "Belgische Luftkomponente neu ordnen"
 AOEIW9_BEL_mil_air_1_desc:0 "„Belgische Luftkomponente“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_BEL_mil_air_2:0 "Jagdfliegerausbildung bei Fliegerschule Evere"
 AOEIW9_BEL_mil_air_2_desc:0 "„Fliegerschule Evere“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_BEL_mil_air_3:0 "Belgien: Bodenunterstützung – Nationales Luftkommando"
 AOEIW9_BEL_mil_air_3_desc:0 "Unter „Nationales Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Belgien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_BEL_mil_air_4:0 "Die Reichweite von Belgische Luftkomponente erhöhen"
 AOEIW9_BEL_mil_air_4_desc:0 "„Belgische Luftkomponente“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Belgien verlangen."
 AOEIW9_BEL_mil_air_5:0 "Radarnetze für Fliegerschule Evere"
 AOEIW9_BEL_mil_air_5_desc:0 "„Fliegerschule Evere“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_BEL_mil_sea_1:0 "Antwerp Flottille überprüfen"
 AOEIW9_BEL_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Antwerp Flottille“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_BEL_mil_sea_2:0 "Ausbau: Marinestützpunkt Ostende"
 AOEIW9_BEL_mil_sea_2_desc:0 "„Marinestützpunkt Ostende“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_BEL_mil_sea_3:0 "Flottenmanöver mit Scheldt Patrouille"
 AOEIW9_BEL_mil_sea_3_desc:0 "Flottenmanöver mit „Scheldt Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_BEL_mil_sea_4:0 "Sicherungsdoktrin für Antwerp Flottille"
 AOEIW9_BEL_mil_sea_4_desc:0 "„Antwerp Flottille“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_BEL_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Ostende"
 AOEIW9_BEL_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Ostende“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_BEL_mil_final:0 "Befestigte Verteidigung"
 AOEIW9_BEL_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Belgien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_BEL_dip_root:0 "Die Doktrin „Low Countries“ festlegen"
 AOEIW9_BEL_dip_root_desc:0 "Königreich Belgien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_BEL_dip_a_2:0 "Eine Mission zu „niederländische Grenze“ entsenden"
 AOEIW9_BEL_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Niederländische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_BEL_dip_a_3:0 "Wirtschaftlicher Druck: „niederländische Grenze“"
 AOEIW9_BEL_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Niederländische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_BEL_dip_a_4:0 "Stabsgespräche: „niederländische Grenze“"
 AOEIW9_BEL_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Niederländische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_BEL_dip_a_5:0 "Formelle Warnung: „niederländische Grenze“"
 AOEIW9_BEL_dip_a_5_desc:0 "Eine formelle Warnung zu „Niederländische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_BEL_dip_b_1:0 "Die Brüsseler-Pariser Verteidigungskonvention"
 AOEIW9_BEL_dip_b_1_desc:0 "Belgiens Unabhängigkeit soll durch eine formelle Sicherheitskonvention mit Frankreich statt durch eine improvisierte Garantie geschützt werden."
 AOEIW9_BEL_dip_b_2:0 "Ständige Stabsverbindung"
 AOEIW9_BEL_dip_b_2_desc:0 "Eine ständige belgisch-französische Verbindungsmission koordiniert Mobilmachungspläne, Aufklärung und Grenzverteidigung."
 AOEIW9_BEL_dip_b_3:0 "Beschaffung an der Maas koordinieren"
 AOEIW9_BEL_dip_b_3_desc:0 "Gemeinsame Standards für Artillerie, Munition und Funk machen die Verteidigung an der Maas zu einem zusammenhängenden System."
 AOEIW9_BEL_dip_b_4:0 "Stabsgespräche Lüttich–Sedan"
 AOEIW9_BEL_dip_b_4_desc:0 "Regelmäßige Stabsgespräche verbinden die Festungen von Lüttich mit der französischen Planung um Sedan und die Maaszugänge."
 AOEIW9_BEL_dip_b_5:0 "Belgien in The Old Order"
 AOEIW9_BEL_dip_b_5_desc:0 "Belgien bleibt souverän, verankert seine Sicherheit jedoch in einem funktionsfähigen Verteidigungssystem von The Old Order."
 AOEIW9_BEL_dip_final:0 "Belgien in der Alten Ordnung"
 AOEIW9_BEL_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Belgien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_BRA_focus_tree:0 "Brazilian Empire Schwerpunktbaum"
 AOEIW9_BRA_politics_p1_2:0 "Kaiserlicher Senat versöhnen"
 AOEIW9_BRA_politics_p1_2_desc:0 "Die Stellung von „Kaiserlicher Senat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Imperiale Autonomie“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_BRA_politics_p1_3:0 "Provinzversammlungen reformieren"
 AOEIW9_BRA_politics_p1_3_desc:0 "Die Verfahren von „Provinzversammlungen“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Imperiale Autonomie“ arbeitsfähig bleibt."
 AOEIW9_BRA_politics_p1_4:0 "Coffee Oligarchs einbinden"
 AOEIW9_BRA_politics_p1_4_desc:0 "„Coffee Oligarchs“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Imperiale Autonomie“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_BRA_politics_p1_5:0 "Lissabons Gesandte im Palast"
 AOEIW9_BRA_politics_p1_5_desc:0 "Portugiesische Gesandte erscheinen in Rio und erwarten bevorzugten Zugang zum Kaiserhof. Vargas und die Provinznotabeln entscheiden, wie viel Einfluss atlantische Verwandtschaft wert ist."
 AOEIW9_BRA_politics_p1_6:0 "Hof von Rio und Nation"
 AOEIW9_BRA_politics_p1_6_desc:0 "„Hof von Rio“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Imperiale Autonomie“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_BRA_politics_p2_2:0 "Provinzversammlungen öffnen"
 AOEIW9_BRA_politics_p2_2_desc:0 "Der Zugang zu „Provinzversammlungen“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Lusophone Pakt“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_BRA_politics_p2_3:0 "Coffee Oligarchs garantieren"
 AOEIW9_BRA_politics_p2_3_desc:0 "Die Stellung von „Coffee Oligarchs“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Lusophone Pakt“ einzubinden."
 AOEIW9_BRA_politics_p2_4:0 "Eine Kammer für die portugiesische Welt"
 AOEIW9_BRA_politics_p2_4_desc:0 "Delegierte aus der lusophonen Welt dürfen in Rio bitten und beraten, doch brasilianische Abgeordnete schreiben ihre Befugnisse. Gemeinschaft muss auf Zustimmung statt Hofritual beruhen."
 AOEIW9_BRA_politics_p2_5:0 "Heeresministerium Verantwortung übertragen"
 AOEIW9_BRA_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Heeresministerium“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Lusophone Pakt“ durch delegierte Autorität regieren kann."
 AOEIW9_BRA_politics_p2_6:0 "Die Verfassung von 1934"
 AOEIW9_BRA_politics_p2_6_desc:0 "Geheime Wahl, föderale Vertretung und soziale Rechte werden über Palastintrigen gestellt. Das Kaiserreich muss unter einer Verfassung leben, die seine Wähler erkennen."
 AOEIW9_BRA_politics_p3_2:0 "Coffee Oligarchs mobilisieren"
 AOEIW9_BRA_politics_p3_2_desc:0 "„Coffee Oligarchs“ wird zu einem organisatorischen Träger des Projekts „Brasilianischer Nationalstaat“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_BRA_politics_p3_3:0 "Rio spricht für sich selbst"
 AOEIW9_BRA_politics_p3_3_desc:0 "Das Regime löst die Vorrechte lusophoner Delegierter auf und zieht die Atlantikpolitik in den Präsidentenkreis. Ausländische Verwandtschaft begrenzt Brasiliens Befehl nicht länger."
 AOEIW9_BRA_politics_p3_4:0 "Heeresministerium ersetzen"
 AOEIW9_BRA_politics_p3_4_desc:0 "„Heeresministerium“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Brasilianischer Nationalstaat“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_BRA_politics_p3_5:0 "Hof von Rio unter direkte Führung stellen"
 AOEIW9_BRA_politics_p3_5_desc:0 "„Hof von Rio“ wird den durch den Kurs „Brasilianischer Nationalstaat“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_BRA_politics_p3_6:0 "Estado Novo"
 AOEIW9_BRA_politics_p3_6_desc:0 "Der Kongress wird geschlossen, Parteien werden verboten und der Catete-Palast beansprucht das Recht, die Nation per Dekret umzuformen. Industrialisierung und Arbeitsrecht tragen nun die Unterschrift des Regimes."
 AOEIW9_BRA_politics_settlement:0 "Die Krone kehrt nach São Cristóvão zurück"
 AOEIW9_BRA_politics_settlement_desc:0 "Hof und Regierung haben nach dem Streit über Gouverneure, Kaffeeinteressen und Heer ihr Verhältnis festgelegt. Zeremoniell in São Cristóvão gibt der kaiserlichen Ordnung ein sichtbares Zentrum."
 AOEIW9_BRA_eco_root:0 "Bestandsaufnahme: São Paulo Machine Shops"
 AOEIW9_BRA_eco_root_desc:0 "São Paulo Machine Shops, Bergwerke von Minas Gerais und Rio Werften arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Brasilien am schnellsten ausbauen kann."
 AOEIW9_BRA_eco_civ_2:0 "Schienen nach Bergwerke von Minas Gerais"
 AOEIW9_BRA_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Bergwerke von Minas Gerais“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_BRA_eco_civ_5:0 "Ausbau von Central do Brasil Eisenbahnen"
 AOEIW9_BRA_eco_civ_5_desc:0 "Für „Central do Brasil Eisenbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_BRA_eco_civ_6:0 "Vermesst den Amazonas"
 AOEIW9_BRA_eco_civ_6_desc:0 "Flussmannschaften, Ingenieure und Ärzte kartieren Routen und Standorte jenseits der Küstenwirtschaft. Entwicklung beginnt mit dem Wissen, wo Menschen und Fracht sich bewegen können."
 AOEIW9_BRA_eco_civ_7:0 "Eine zweite Schicht bei São Paulo Machine Shops"
 AOEIW9_BRA_eco_civ_7_desc:0 "Bei „São Paulo Machine Shops“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_BRA_eco_civ_8:0 "Öffentliche Bauprogramme bei den Bergwerken von Minas Gerais"
 AOEIW9_BRA_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Bergwerke von Minas Gerais“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_BRA_eco_war_1:0 "Kaffee bezahlt die Kanonen"
 AOEIW9_BRA_eco_war_1_desc:0 "Exporterlöse fließen in Werkzeugmaschinen, Sprengstoff und Heeresaufträge. Die Säcke am Kai müssen mehr finanzieren als die nächste Saison der Preisstützung."
 AOEIW9_BRA_eco_war_2:0 "Rüstungsaufträge für Central do Brasil Eisenbahnen"
 AOEIW9_BRA_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Central do Brasil Eisenbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_BRA_eco_war_3:0 "Werkzeugmaschinen den Amazonas hinauf"
 AOEIW9_BRA_eco_war_3_desc:0 "Drehbänke, Pumpen und Reparatursätze reisen mit den neuen Flussdepots. Werkstätten im Inneren müssen ihre Ausrüstung warten können, wenn der Nachschub von der Küste ausfällt."
 AOEIW9_BRA_eco_war_4:0 "São Paulo Machine Shops für die Aufrüstung ausbauen"
 AOEIW9_BRA_eco_war_4_desc:0 "Rund um „São Paulo Machine Shops“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_BRA_eco_war_5:0 "Bergwerke von Minas Gerais standardisieren"
 AOEIW9_BRA_eco_war_5_desc:0 "Die mit „Bergwerke von Minas Gerais“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_BRA_eco_war_6:0 "Nachtproduktion bei Rio Werften"
 AOEIW9_BRA_eco_war_6_desc:0 "Bei „Rio Werften“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_BRA_eco_war_7:0 "Die Kaffeeverträge halten"
 AOEIW9_BRA_eco_war_7_desc:0 "Der Staat garantiert Ankauf und Verschiffung lange genug, damit Exporteure trotz Kriegsstörungen planen können. Dafür dienen die Devisen der Mobilmachung."
 AOEIW9_BRA_eco_science_1:0 "Universität von São Paulo ausstatten"
 AOEIW9_BRA_eco_science_1_desc:0 "„Universität von São Paulo“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_BRA_eco_science_2:0 "Neue Labore an Nationalobservatorium"
 AOEIW9_BRA_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Nationalobservatorium“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_BRA_eco_science_3:0 "Angewandte Forschung an Oswaldo Cruz Institut"
 AOEIW9_BRA_eco_science_3_desc:0 "„Oswaldo Cruz Institut“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_BRA_eco_science_4:0 "Industriephysik an Universität von São Paulo"
 AOEIW9_BRA_eco_science_4_desc:0 "Die Industriephysik an „Universität von São Paulo“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_BRA_eco_science_5:0 "Produktionsforschung an Nationalobservatorium"
 AOEIW9_BRA_eco_science_5_desc:0 "Bei „Nationalobservatorium“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_BRA_eco_science_6:0 "Forschungszuschüsse für Oswaldo Cruz Institut"
 AOEIW9_BRA_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Oswaldo Cruz Institut“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_BRA_eco_infra_2:0 "Räumt den Kaffee in Santos ab"
 AOEIW9_BRA_eco_infra_2_desc:0 "Zusätzliche Gleise, Lager und Ladekolonnen in Santos lösen die Schlangen auf, die Exportware im Inland festhalten. Einnahmen verteidigen Brasilien nicht, solange sie neben den Gleisen warten."
 AOEIW9_BRA_eco_infra_3:0 "Arbeiterwohnungen bei Central do Brasil Eisenbahnen"
 AOEIW9_BRA_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Central do Brasil Eisenbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_BRA_eco_infra_4:0 "Flussdepots hinter Manaus"
 AOEIW9_BRA_eco_infra_4_desc:0 "Treibstoff-, Funk- und Reparaturdepots verlängern den regelmäßigen Verkehr über Manaus hinaus. Der Amazonas wird zum verbundenen Inneren statt zum leeren Versprechen auf Ministeriumskarten."
 AOEIW9_BRA_eco_final:0 "Ein integrierter brasilianischer Markt"
 AOEIW9_BRA_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Brasilien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_BRA_mil_root:0 "brasilianischer Generalstab überprüfen"
 AOEIW9_BRA_mil_root_desc:0 "„Brasilianischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_BRA_mil_army_2:0 "Feldmanöver mit Jungle Brigades"
 AOEIW9_BRA_mil_army_2_desc:0 "Großmanöver mit „Jungle Brigades“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_BRA_mil_army_5:0 "Escola Militar motorisieren"
 AOEIW9_BRA_mil_army_5_desc:0 "Der Motortransport von „Escola Militar“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_BRA_mil_army_6:0 "Stabsverfahren bei brasilianischer Generalstab"
 AOEIW9_BRA_mil_army_6_desc:0 "Bei „Brasilianischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_BRA_mil_army_7:0 "Panzerstudien bei Jungle Brigades"
 AOEIW9_BRA_mil_army_7_desc:0 "„Jungle Brigades“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Brasilien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_BRA_mil_army_8:0 "Operationsplanung bei Kaiserlich Field Armee"
 AOEIW9_BRA_mil_army_8_desc:0 "Operationsplanung mit „Kaiserlich Field Armee“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_BRA_mil_army_9:0 "Kanonen aus dem Arsenal von Realengo"
 AOEIW9_BRA_mil_army_9_desc:0 "Das Arsenal von Realengo vereinheitlicht Feldgeschütze, Munition und Schießtafeln. Einheiten im Inneren müssen Waffen erhalten, die sich nach denselben Zeichnungen reparieren lassen."
 AOEIW9_BRA_mil_air_1:0 "Brasilianische Luftwaffe neu ordnen"
 AOEIW9_BRA_mil_air_1_desc:0 "„Brasilianische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_BRA_mil_air_2:0 "Jagdfliegerausbildung bei Campo dos Afonsos"
 AOEIW9_BRA_mil_air_2_desc:0 "„Campo dos Afonsos“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_BRA_mil_air_3:0 "Bodenunterstützungsdoktrin unter South Atlantik-Luftkommando"
 AOEIW9_BRA_mil_air_3_desc:0 "Unter „South Atlantik-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_BRA_mil_air_4:0 "Die Reichweite von Brasilianische Luftwaffe erhöhen"
 AOEIW9_BRA_mil_air_4_desc:0 "„Brasilianische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Brasilien verlangen."
 AOEIW9_BRA_mil_air_5:0 "Radarnetze für Campo dos Afonsos"
 AOEIW9_BRA_mil_air_5_desc:0 "„Campo dos Afonsos“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_BRA_mil_air_6:0 "Das Luftkommando unter South Atlantik-Luftkommando vereinigen"
 AOEIW9_BRA_mil_air_6_desc:0 "„South Atlantik-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_BRA_mil_sea_1:0 "Rio Geschwader überprüfen"
 AOEIW9_BRA_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Rio Geschwader“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_BRA_mil_sea_2:0 "Ausbau: Niterói Arsenal"
 AOEIW9_BRA_mil_sea_2_desc:0 "„Niterói Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_BRA_mil_sea_3:0 "Flottenmanöver mit South Atlantikflotte"
 AOEIW9_BRA_mil_sea_3_desc:0 "Flottenmanöver mit „South Atlantikflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_BRA_mil_sea_4:0 "Sicherungsdoktrin für Rio Geschwader"
 AOEIW9_BRA_mil_sea_4_desc:0 "„Rio Geschwader“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_BRA_mil_sea_5:0 "Marineflieger bei Niterói Arsenal"
 AOEIW9_BRA_mil_sea_5_desc:0 "Marineflieger werden mit „Niterói Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_BRA_mil_sea_6:0 "Neue Schiffskörper für South Atlantikflotte"
 AOEIW9_BRA_mil_sea_6_desc:0 "Neue Entwurfsstandards für „South Atlantikflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_BRA_mil_final:0 "Brasilien: Mobile Verteidigung"
 AOEIW9_BRA_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Brasilien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_BRA_dip_root:0 "Die Doktrin „South Atlantic“ festlegen"
 AOEIW9_BRA_dip_root_desc:0 "Brasilien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_BRA_dip_a_2:0 "Die Delegation aus Rio entsenden"
 AOEIW9_BRA_dip_a_2_desc:0 "Rio entsendet eine ständige Delegation mit dem Mandat, direkt mit der portugiesischen Regierung zu verhandeln."
 AOEIW9_BRA_dip_a_3:0 "Ein gemeinsamer Atlantikmarkt"
 AOEIW9_BRA_dip_a_3_desc:0 "Brasilianischer Zugang zu portugiesischen Märkten und portugiesischer Zugang zu brasilianischen Ressourcen werden durch gegenseitige Regeln geordnet."
 AOEIW9_BRA_dip_a_4:0 "Escudos über den Atlantik"
 AOEIW9_BRA_dip_a_4_desc:0 "Banken in Rio und Lissabon verrechnen Investitions- und Schifffahrtsverträge in beiden Währungen. Das Abkommen macht die Reichsverbindung in Häfen, Schienen und Fabriken sichtbar."
 AOEIW9_BRA_dip_a_5:0 "Brasilianische Rechte im Imperium"
 AOEIW9_BRA_dip_a_5_desc:0 "Anerkannte Rechte und Vertretung sind der Preis dafür, die portugiesische Verbindung langfristig tragfähig zu machen."
 AOEIW9_BRA_dip_a_6:0 "Eine Krone, zwei Ozeane"
 AOEIW9_BRA_dip_a_6_desc:0 "Rio und Lissabon ratifizieren gemeinsame Regeln für Verteidigung, Handel und Konsultation bei getrennten Regierungen. Der kaiserliche Anspruch bringt nun auf beiden Seiten des Atlantiks Pflichten."
 AOEIW9_BRA_dip_b_1:0 "Den Südatlantik sichern"
 AOEIW9_BRA_dip_b_1_desc:0 "„Den Südatlantik sichern“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Brasilien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_BRA_dip_b_2:0 "Eine Mission zu „Den Südatlantik sichern“ entsenden"
 AOEIW9_BRA_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Den Südatlantik sichern“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_BRA_dip_b_3:0 "Wirtschaftlicher Druck: „Den Südatlantik sichern“"
 AOEIW9_BRA_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Den Südatlantik sichern“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_BRA_dip_b_4:0 "Stabsgespräche: „Den Südatlantik sichern“"
 AOEIW9_BRA_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Den Südatlantik sichern“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_BRA_dip_b_5:0 "Formelle Warnung: „Den Südatlantik sichern“"
 AOEIW9_BRA_dip_b_5_desc:0 "Eine formelle Warnung zu „Den Südatlantik sichern“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_BRA_dip_b_6:0 "Bedingungen für „Den Südatlantik sichern“"
 AOEIW9_BRA_dip_b_6_desc:0 "Für „Den Südatlantik sichern“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_BRA_dip_final:0 "Brasilien und die lusophone Welt"
 AOEIW9_BRA_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Brasilien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_BUL_focus_tree:0 "Tsardom of Bulgaria Schwerpunktbaum"
 AOEIW9_BUL_politics_p1_2:0 "Bulgarien: Nationalversammlung versöhnen"
 AOEIW9_BUL_politics_p1_2_desc:0 "Die Stellung von „Nationalversammlung“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Krone und Sobranje“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_BUL_politics_p1_3:0 "Bulgarien: Offiziersbund reformieren"
 AOEIW9_BUL_politics_p1_3_desc:0 "Die Verfahren von „Offiziersbund“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Krone und Sobranje“ arbeitsfähig bleibt."
 AOEIW9_BUL_politics_p1_4:0 "Agrarunion einbinden"
 AOEIW9_BUL_politics_p1_4_desc:0 "„Agrarunion“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Krone und Sobranje“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_BUL_politics_p1_5:0 "Zarenhof und Nation"
 AOEIW9_BUL_politics_p1_5_desc:0 "„Zarenhof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Krone und Sobranje“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_BUL_politics_p2_2:0 "Bulgarien: Offiziersbund öffnen"
 AOEIW9_BUL_politics_p2_2_desc:0 "Der Zugang zu „Offiziersbund“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Königliche Zentralisierung“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_BUL_politics_p2_3:0 "Agrarunion garantieren"
 AOEIW9_BUL_politics_p2_3_desc:0 "Die Stellung von „Agrarunion“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Königliche Zentralisierung“ einzubinden."
 AOEIW9_BUL_politics_p2_4:0 "Sofioter Ministerien erweitern"
 AOEIW9_BUL_politics_p2_4_desc:0 "„Sofioter Ministerien“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Königliche Zentralisierung“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_BUL_politics_p2_5:0 "Eine neue Charta für Tsardom von Bulgaria"
 AOEIW9_BUL_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Königliche Zentralisierung“ in einen dauerhaften Rahmen für „Tsardom von Bulgaria“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_BUL_politics_p3_2:0 "Agrarunion mobilisieren"
 AOEIW9_BUL_politics_p3_2_desc:0 "„Agrarunion“ wird zu einem organisatorischen Träger des Projekts „Nationale Erneuerung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_BUL_politics_p3_3:0 "Die Macht von Sofioter Ministerien brechen"
 AOEIW9_BUL_politics_p3_3_desc:0 "Die eigenständige Macht von „Sofioter Ministerien“ ist mit dem Projekt „Nationale Erneuerung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_BUL_politics_p3_4:0 "Bulgarien: Provinzpräfekten ersetzen"
 AOEIW9_BUL_politics_p3_4_desc:0 "„Provinzpräfekten“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationale Erneuerung“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_BUL_politics_p3_5:0 "Neuordnung: Nationale Wiedergeburt"
 AOEIW9_BUL_politics_p3_5_desc:0 "Der politische Konflikt um „Nationale Wiedergeburt“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationale Erneuerung“ untergeordnet werden."
 AOEIW9_BUL_politics_settlement:0 "Der Sofioter Ausgleich"
 AOEIW9_BUL_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Zarenhof, Nationalversammlung und Offiziersbund eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Zarentum Bulgarien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_BUL_eco_root:0 "Bestandsaufnahme: Sofia Werkstätten"
 AOEIW9_BUL_eco_root_desc:0 "Sofia Werkstätten, Mariza-Tal und Black Sea Commerce arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Zarentum Bulgarien am schnellsten ausbauen kann."
 AOEIW9_BUL_eco_civ_2:0 "Schienen nach Mariza-Tal"
 AOEIW9_BUL_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Mariza-Tal“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_BUL_eco_civ_5:0 "Ausbau von Hafenanlagen von Varna"
 AOEIW9_BUL_eco_civ_5_desc:0 "Für „Hafenanlagen von Varna“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_BUL_eco_civ_6:0 "Nationales Eisenbahndirektorat erneuern"
 AOEIW9_BUL_eco_civ_6_desc:0 "„Nationales Eisenbahndirektorat“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_BUL_eco_civ_7:0 "Eine zweite Schicht bei Sofia Werkstätten"
 AOEIW9_BUL_eco_civ_7_desc:0 "Bei „Sofia Werkstätten“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_BUL_eco_civ_8:0 "Öffentliche Bauprogramme im Mariza-Tal"
 AOEIW9_BUL_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Mariza-Tal“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_BUL_eco_civ_9:0 "Entwicklungsrat für Black Sea Commerce"
 AOEIW9_BUL_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Black Sea Commerce“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_BUL_eco_war_1:0 "Rüstungsaudit: Pernik Kohle Basin"
 AOEIW9_BUL_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Pernik Kohle Basin“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_BUL_eco_war_2:0 "Rüstungsaufträge für Hafenanlagen von Varna"
 AOEIW9_BUL_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Hafenanlagen von Varna“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_BUL_eco_war_3:0 "Präzisionswerkzeuge für Nationales Eisenbahndirektorat"
 AOEIW9_BUL_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Nationales Eisenbahndirektorat“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_BUL_eco_war_4:0 "Sofia Werkstätten für die Aufrüstung ausbauen"
 AOEIW9_BUL_eco_war_4_desc:0 "Rund um „Sofia Werkstätten“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_BUL_eco_war_5:0 "Mariza-Tal standardisieren"
 AOEIW9_BUL_eco_war_5_desc:0 "Die mit „Mariza-Tal“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_BUL_eco_war_6:0 "Nachtproduktion bei Black Sea Commerce"
 AOEIW9_BUL_eco_war_6_desc:0 "Bei „Black Sea Commerce“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_BUL_eco_science_1:0 "Sofia Universität ausstatten"
 AOEIW9_BUL_eco_science_1_desc:0 "„Sofia Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_BUL_eco_science_2:0 "Neue Labore an Militärtechnische Schule"
 AOEIW9_BUL_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Militärtechnische Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_BUL_eco_science_3:0 "Angewandte Forschung an bulgarisch Akademie"
 AOEIW9_BUL_eco_science_3_desc:0 "„Bulgarisch Akademie“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_BUL_eco_science_4:0 "Industriephysik an Sofia Universität"
 AOEIW9_BUL_eco_science_4_desc:0 "Die Industriephysik an „Sofia Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_BUL_eco_science_5:0 "Produktionsforschung an Militärtechnische Schule"
 AOEIW9_BUL_eco_science_5_desc:0 "Bei „Militärtechnische Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_BUL_eco_infra_2:0 "Frachtkapazität bei Pernik Kohle Basin"
 AOEIW9_BUL_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Pernik Kohle Basin“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_BUL_eco_infra_3:0 "Arbeiterwohnungen bei Hafenanlagen von Varna"
 AOEIW9_BUL_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Hafenanlagen von Varna“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_BUL_eco_infra_4:0 "Logistik über Nationales Eisenbahndirektorat"
 AOEIW9_BUL_eco_infra_4_desc:0 "„Nationales Eisenbahndirektorat“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_BUL_eco_final:0 "Der bulgarische Entwicklungsstaat"
 AOEIW9_BUL_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Bulgarien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_BUL_mil_root:0 "bulgarischer Generalstab überprüfen"
 AOEIW9_BUL_mil_root_desc:0 "„Bulgarischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_BUL_mil_army_2:0 "Feldmanöver mit Macedonian Regiments"
 AOEIW9_BUL_mil_army_2_desc:0 "Großmanöver mit „Macedonian Regiments“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_BUL_mil_army_5:0 "Kriegsschule Sofia motorisieren"
 AOEIW9_BUL_mil_army_5_desc:0 "Der Motortransport von „Kriegsschule Sofia“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_BUL_mil_army_6:0 "Stabsverfahren bei bulgarischer Generalstab"
 AOEIW9_BUL_mil_army_6_desc:0 "Bei „Bulgarischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_BUL_mil_army_7:0 "Panzerstudien bei Macedonian Regiments"
 AOEIW9_BUL_mil_army_7_desc:0 "„Macedonian Regiments“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Bulgarien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_BUL_mil_air_1:0 "Königlich-bulgarische Luftwaffe neu ordnen"
 AOEIW9_BUL_mil_air_1_desc:0 "„Königlich-bulgarische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_BUL_mil_air_2:0 "Jagdfliegerausbildung bei Flugplatz Bozhurishte"
 AOEIW9_BUL_mil_air_2_desc:0 "„Flugplatz Bozhurishte“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_BUL_mil_air_3:0 "Bulgarien: Bodenunterstützung – Balkan-Luftkommando"
 AOEIW9_BUL_mil_air_3_desc:0 "Unter „Balkan-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Bulgarien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_BUL_mil_air_4:0 "Die Reichweite von Königlich-bulgarische Luftwaffe erhöhen"
 AOEIW9_BUL_mil_air_4_desc:0 "„Königlich-bulgarische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Bulgarien verlangen."
 AOEIW9_BUL_mil_air_5:0 "Radarnetze für Flugplatz Bozhurishte"
 AOEIW9_BUL_mil_air_5_desc:0 "„Flugplatz Bozhurishte“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_BUL_mil_sea_1:0 "Varna Flottille überprüfen"
 AOEIW9_BUL_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Varna Flottille“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_BUL_mil_sea_2:0 "Ausbau: Marinestützpunkt Burgas"
 AOEIW9_BUL_mil_sea_2_desc:0 "„Marinestützpunkt Burgas“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_BUL_mil_sea_3:0 "Flottenmanöver mit Black Sea Patrouille"
 AOEIW9_BUL_mil_sea_3_desc:0 "Flottenmanöver mit „Black Sea Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_BUL_mil_sea_4:0 "Sicherungsdoktrin für Varna Flottille"
 AOEIW9_BUL_mil_sea_4_desc:0 "„Varna Flottille“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_BUL_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Burgas"
 AOEIW9_BUL_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Burgas“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_BUL_mil_final:0 "Gebirgskriegführung"
 AOEIW9_BUL_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Zarentum Bulgarien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_BUL_dip_root:0 "Die Doktrin „Balkan Revision“ festlegen"
 AOEIW9_BUL_dip_root_desc:0 "Zarentum Bulgarien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_BUL_dip_a_2:0 "Italienische Vermittlung akzeptieren"
 AOEIW9_BUL_dip_a_2_desc:0 "Italienische Vermittlung ist nicht ideal, ermöglicht aber Zugeständnisse, ohne das Bündnis zu sprengen."
 AOEIW9_BUL_dip_a_3:0 "Garantien für bulgarische Gemeinden"
 AOEIW9_BUL_dip_a_3_desc:0 "Sofia setzt auf durchsetzbare kulturelle und politische Garantien für bulgarische Gemeinden statt auf sofortige Grenzrevision."
 AOEIW9_BUL_dip_a_4:0 "Eine ständige Grenzkommission"
 AOEIW9_BUL_dip_a_4_desc:0 "Eine ständige Kommission gibt lokalen Zwischenfällen einen diplomatischen Ausweg, bevor Armeen eingreifen."
 AOEIW9_BUL_dip_a_5:0 "Der mazedonische Kompromiss"
 AOEIW9_BUL_dip_a_5_desc:0 "Bulgarien akzeptiert einen vorläufigen territorialen Kompromiss gegen anerkannte Minderheitenrechte und Garantien der Liga."
 AOEIW9_BUL_dip_b_1:0 "Die Dobrudscha-Frage"
 AOEIW9_BUL_dip_b_1_desc:0 "Die Dobrudscha bleibt ein reales bulgarisches Anliegen, doch ein Krieg mit Rumänien würde die Liga von innen zerstören."
 AOEIW9_BUL_dip_b_2:0 "Die Kommission Bukarest–Sofia eröffnen"
 AOEIW9_BUL_dip_b_2_desc:0 "Eine gemeinsame Kommission legt Karten, Bevölkerungsansprüche und lokale Beschwerden auf den Tisch, statt die Frage den Generalstäben zu überlassen."
 AOEIW9_BUL_dip_b_3:0 "Donauhandel vor Grenzrevision"
 AOEIW9_BUL_dip_b_3_desc:0 "Ausgeweiteter Donauhandel schafft Interessen an Stabilität, die territorialen Revisionismus begrenzen können."
 AOEIW9_BUL_dip_b_4:0 "Minderheitengarantien in der Dobrudscha"
 AOEIW9_BUL_dip_b_4_desc:0 "Bulgarien drängt als Zwischenlösung auf Garantien für bulgarische Gemeinden."
 AOEIW9_BUL_dip_b_5:0 "Der Dobrudscha-Stillstand"
 AOEIW9_BUL_dip_b_5_desc:0 "Sofia friert seine Ansprüche ein, solange die Liga besteht, und hält die Frage für Verhandlungen statt Eroberung offen."
 AOEIW9_BUL_dip_final:0 "Sofia in der Mittelmeerliga"
 AOEIW9_BUL_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Bulgarien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_CAN_focus_tree:0 "Dominion of Canada Schwerpunktbaum"
 AOEIW9_CAN_politics_p1_2:0 "Kanada: Kronrat versöhnen"
 AOEIW9_CAN_politics_p1_2_desc:0 "Die Stellung von „Kronrat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Verantwortliche Regierung“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_CAN_politics_p1_3:0 "Provinzpremiers reformieren"
 AOEIW9_CAN_politics_p1_3_desc:0 "Die Verfahren von „Provinzpremiers“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Verantwortliche Regierung“ arbeitsfähig bleibt."
 AOEIW9_CAN_politics_p1_4:0 "Kanada: Imperialkonferenz einbinden"
 AOEIW9_CAN_politics_p1_4_desc:0 "„Imperialkonferenz“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Verantwortliche Regierung“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_CAN_politics_p1_5:0 "Quebec Delegation ausbalancieren"
 AOEIW9_CAN_politics_p1_5_desc:0 "Weder die Ausschaltung von „Quebec Delegation“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Verantwortliche Regierung“ austariert."
 AOEIW9_CAN_politics_p1_6:0 "Kanadisches Parlament und Nation"
 AOEIW9_CAN_politics_p1_6_desc:0 "„Kanadisches Parlament“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Verantwortliche Regierung“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_CAN_politics_p2_2:0 "Provinzpremiers öffnen"
 AOEIW9_CAN_politics_p2_2_desc:0 "Der Zugang zu „Provinzpremiers“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Kanada: Imperiale Partnerschaft“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_CAN_politics_p2_3:0 "Kanada: Imperialkonferenz garantieren"
 AOEIW9_CAN_politics_p2_3_desc:0 "Die Stellung von „Imperialkonferenz“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Kanada: Imperiale Partnerschaft“ einzubinden."
 AOEIW9_CAN_politics_p2_4:0 "Quebec Delegation erweitern"
 AOEIW9_CAN_politics_p2_4_desc:0 "„Quebec Delegation“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Kanada: Imperiale Partnerschaft“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_CAN_politics_p2_5:0 "Kabinett in Ottawa Verantwortung übertragen"
 AOEIW9_CAN_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Kabinett in Ottawa“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Kanada: Imperiale Partnerschaft“ durch delegierte Autorität regieren kann."
 AOEIW9_CAN_politics_p2_6:0 "Eine neue Charta für Dominion Kanada"
 AOEIW9_CAN_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Kanada: Imperiale Partnerschaft“ in einen dauerhaften Rahmen für Kanada. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_CAN_politics_p3_2:0 "Kanada: Imperialkonferenz mobilisieren"
 AOEIW9_CAN_politics_p3_2_desc:0 "„Imperialkonferenz“ wird zu einem organisatorischen Träger des Projekts „Kanadischer Nationalkurs“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_CAN_politics_p3_3:0 "Die Macht von Quebec Delegation brechen"
 AOEIW9_CAN_politics_p3_3_desc:0 "Die eigenständige Macht von „Quebec Delegation“ ist mit dem Projekt „Kanadischer Nationalkurs“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_CAN_politics_p3_4:0 "Kabinett in Ottawa ersetzen"
 AOEIW9_CAN_politics_p3_4_desc:0 "„Kabinett in Ottawa“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Kanadischer Nationalkurs“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_CAN_politics_p3_5:0 "Kanadisches Parlament unter direkte Führung stellen"
 AOEIW9_CAN_politics_p3_5_desc:0 "„Kanadisches Parlament“ wird den durch den Kurs „Kanadischer Nationalkurs“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_CAN_politics_p3_6:0 "Neuordnung: Kanadischer Nationalkurs"
 AOEIW9_CAN_politics_p3_6_desc:0 "Der politische Konflikt um „A Kanadischer Nationalkurs“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Kanadischer Nationalkurs“ untergeordnet werden."
 AOEIW9_CAN_politics_settlement:0 "Der Dominion-Ausgleich"
 AOEIW9_CAN_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Kanadisches Parlament, Kronrat und Provinzpremiers eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Dominion Kanada kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_CAN_eco_root:0 "Kanada: Bestandsaufnahme: Industrie der Großen Seen"
 AOEIW9_CAN_eco_root_desc:0 "Industrie der Großen Seen, Canadian Pacific Railway und Montreal Engineering arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Dominion Kanada am schnellsten ausbauen kann."
 AOEIW9_CAN_eco_civ_2:0 "Schienen nach Canadian Pacific Railway"
 AOEIW9_CAN_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Kanadisch Pacific Eisenbahn“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_CAN_eco_civ_5:0 "Ausbau von Prairie Entwicklungsrat"
 AOEIW9_CAN_eco_civ_5_desc:0 "Für „Prairie Entwicklungsrat“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_CAN_eco_civ_6:0 "Halifax Werften erneuern"
 AOEIW9_CAN_eco_civ_6_desc:0 "„Halifax Werften“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_CAN_eco_civ_7:0 "Kanada: Eine zweite Schicht bei Industrie der Großen Seen"
 AOEIW9_CAN_eco_civ_7_desc:0 "Bei „Industrie der Großen Seen“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus. In Kanada wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_CAN_eco_civ_8:0 "Öffentliche Bauprogramme bei Canadian Pacific Railway"
 AOEIW9_CAN_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Kanadisch Pacific Eisenbahn“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_CAN_eco_war_1:0 "Rüstungsaudit: Ontario Stahl Belt"
 AOEIW9_CAN_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Ontario Stahl Belt“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_CAN_eco_war_2:0 "Rüstungsaufträge für Prairie Entwicklungsrat"
 AOEIW9_CAN_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Prairie Entwicklungsrat“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_CAN_eco_war_3:0 "Präzisionswerkzeuge für Halifax Werften"
 AOEIW9_CAN_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Halifax Werften“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_CAN_eco_war_4:0 "Kanada: Industrie der Großen Seen für die Aufrüstung ausbauen"
 AOEIW9_CAN_eco_war_4_desc:0 "Rund um „Industrie der Großen Seen“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager. In Kanada wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_CAN_eco_war_5:0 "Canadian Pacific Railway standardisieren"
 AOEIW9_CAN_eco_war_5_desc:0 "Die mit „Kanadisch Pacific Eisenbahn“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_CAN_eco_war_6:0 "Nachtproduktion bei Montreal Engineering"
 AOEIW9_CAN_eco_war_6_desc:0 "Bei „Montreal Engineering“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_CAN_eco_war_7:0 "Langfristige Verträge für Ontario Stahl Belt"
 AOEIW9_CAN_eco_war_7_desc:0 "Langfristige Verträge sichern „Ontario Stahl Belt“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_CAN_eco_science_1:0 "Nationaler Forschungsrat ausstatten"
 AOEIW9_CAN_eco_science_1_desc:0 "„Nationaler Forschungsrat“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_CAN_eco_science_2:0 "Neue Labore an McGill Labore"
 AOEIW9_CAN_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „McGill Labore“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_CAN_eco_science_3:0 "Angewandte Forschung an Universität von Toronto Engineering"
 AOEIW9_CAN_eco_science_3_desc:0 "„Universität von Toronto Engineering“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_CAN_eco_science_4:0 "Industriephysik an Nationaler Forschungsrat"
 AOEIW9_CAN_eco_science_4_desc:0 "Die Industriephysik an „Nationaler Forschungsrat“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_CAN_eco_science_5:0 "Produktionsforschung an McGill Labore"
 AOEIW9_CAN_eco_science_5_desc:0 "Bei „McGill Labore“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_CAN_eco_science_6:0 "Forschungszuschüsse für Universität von Toronto Engineering"
 AOEIW9_CAN_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Universität von Toronto Engineering“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_CAN_eco_infra_2:0 "Frachtkapazität bei Ontario Stahl Belt"
 AOEIW9_CAN_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Ontario Stahl Belt“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_CAN_eco_infra_3:0 "Arbeiterwohnungen bei Prairie Entwicklungsrat"
 AOEIW9_CAN_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Prairie Entwicklungsrat“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_CAN_eco_infra_4:0 "Logistik über Halifax Werften"
 AOEIW9_CAN_eco_infra_4_desc:0 "„Halifax Werften“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_CAN_eco_final:0 "Das Industriesystem des Dominion"
 AOEIW9_CAN_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Kanada wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_CAN_mil_root:0 "kanadischer Generalstab überprüfen"
 AOEIW9_CAN_mil_root_desc:0 "„Kanadischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_CAN_mil_army_2:0 "Feldmanöver mit Permanent Active Militia"
 AOEIW9_CAN_mil_army_2_desc:0 "Großmanöver mit „Permanent Active Militia“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_CAN_mil_army_5:0 "Stabshochschule Kingston motorisieren"
 AOEIW9_CAN_mil_army_5_desc:0 "Der Motortransport von „Stabshochschule Kingston“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_CAN_mil_army_6:0 "Stabsverfahren bei kanadischer Generalstab"
 AOEIW9_CAN_mil_army_6_desc:0 "Bei „Kanadischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_CAN_mil_army_7:0 "Panzerstudien bei Permanent Active Militia"
 AOEIW9_CAN_mil_army_7_desc:0 "„Permanent Active Militia“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Kanada zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_CAN_mil_army_8:0 "Operationsplanung bei Königlich-Kanadische Artillerie"
 AOEIW9_CAN_mil_army_8_desc:0 "Operationsplanung mit „Königlich-Kanadische Artillerie“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_CAN_mil_army_9:0 "Doktrin bei Mechanized Brigade Rat"
 AOEIW9_CAN_mil_army_9_desc:0 "Die von „Mechanized Brigade Rat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen."
 AOEIW9_CAN_mil_air_1:0 "Königlich-kanadische Luftwaffe neu ordnen"
 AOEIW9_CAN_mil_air_1_desc:0 "„Königlich-kanadische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_CAN_mil_air_2:0 "Jagdfliegerausbildung bei Trenton Fliegerstation"
 AOEIW9_CAN_mil_air_2_desc:0 "„Trenton Fliegerstation“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_CAN_mil_air_3:0 "Bodenunterstützungsdoktrin unter Commonwealth-Fliegerschulen"
 AOEIW9_CAN_mil_air_3_desc:0 "Unter „Commonwealth-Fliegerschulen“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_CAN_mil_air_4:0 "Die Reichweite von Königlich-kanadische Luftwaffe erhöhen"
 AOEIW9_CAN_mil_air_4_desc:0 "„Königlich-kanadische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Kanada verlangen."
 AOEIW9_CAN_mil_air_5:0 "Radarnetze für Trenton Fliegerstation"
 AOEIW9_CAN_mil_air_5_desc:0 "„Trenton Fliegerstation“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_CAN_mil_air_6:0 "Das Luftkommando unter Commonwealth-Fliegerschulen vereinigen"
 AOEIW9_CAN_mil_air_6_desc:0 "„Commonwealth-Fliegerschulen“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_CAN_mil_sea_1:0 "Königlich-Kanadische Marine überprüfen"
 AOEIW9_CAN_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Kanadische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_CAN_mil_sea_2:0 "Ausbau: Halifax Werft"
 AOEIW9_CAN_mil_sea_2_desc:0 "„Halifax Werft“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_CAN_mil_sea_3:0 "Flottenmanöver mit Pacific Geschwader"
 AOEIW9_CAN_mil_sea_3_desc:0 "Flottenmanöver mit „Pacific Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_CAN_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Kanadische Marine"
 AOEIW9_CAN_mil_sea_4_desc:0 "„Königlich-Kanadische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_CAN_mil_sea_5:0 "Marineflieger bei Halifax Werft"
 AOEIW9_CAN_mil_sea_5_desc:0 "Marineflieger werden mit „Halifax Werft“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_CAN_mil_sea_6:0 "Neue Schiffskörper für Pacific Geschwader"
 AOEIW9_CAN_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Pacific Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_CAN_mil_final:0 "Kanada: Gefecht der verbundenen Waffen"
 AOEIW9_CAN_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Dominion Kanada verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_CAN_dip_root:0 "Die Doktrin „Northern Atlantic“ festlegen"
 AOEIW9_CAN_dip_root_desc:0 "Dominion Kanada muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_CAN_dip_a_2:0 "Eine Mission zu „Imperiale Verbindung“ entsenden"
 AOEIW9_CAN_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Imperiale Verbindung“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_CAN_dip_a_3:0 "Wirtschaftlicher Druck: „Imperiale Verbindung“"
 AOEIW9_CAN_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Imperiale Verbindung“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_CAN_dip_a_4:0 "Stabsgespräche: „Imperiale Verbindung“"
 AOEIW9_CAN_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Imperiale Verbindung“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_CAN_dip_a_5:0 "Formelle Warnung: „Imperiale Verbindung“"
 AOEIW9_CAN_dip_a_5_desc:0 "Eine formelle Warnung zu „Imperiale Verbindung“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_CAN_dip_a_6:0 "Bedingungen für „Imperiale Verbindung“"
 AOEIW9_CAN_dip_a_6_desc:0 "Für „Imperiale Verbindung“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_CAN_dip_b_1:0 "amerikanisch Neighbour"
 AOEIW9_CAN_dip_b_1_desc:0 "„Amerikanisch Neighbour“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Dominion Kanada tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_CAN_dip_b_2:0 "Eine Mission zu „amerikanisch Neighbour“ entsenden"
 AOEIW9_CAN_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Amerikanisch Neighbour“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_CAN_dip_b_3:0 "Wirtschaftlicher Druck: „amerikanisch Neighbour“"
 AOEIW9_CAN_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Amerikanisch Neighbour“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_CAN_dip_b_4:0 "Stabsgespräche: „amerikanisch Neighbour“"
 AOEIW9_CAN_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Amerikanisch Neighbour“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_CAN_dip_b_5:0 "Formelle Warnung: „amerikanisch Neighbour“"
 AOEIW9_CAN_dip_b_5_desc:0 "Eine formelle Warnung zu „Amerikanisch Neighbour“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_CAN_dip_b_6:0 "Bedingungen für „amerikanisch Neighbour“"
 AOEIW9_CAN_dip_b_6_desc:0 "Für „Amerikanisch Neighbour“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_CAN_dip_final:0 "Kanadas atlantische Verpflichtungen"
 AOEIW9_CAN_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Kanada sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_CHI_focus_tree:0 "Chinese Empire Schwerpunktbaum"
 AOEIW9_CHI_eco_root:0 "Bestandsaufnahme: Hanyang Arsenal"
 AOEIW9_CHI_eco_root_desc:0 "Hanyang Arsenal, Yangtze Werkstätten und Manchurian Industrie arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Chinesisches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_CHI_eco_civ_1:0 "Hanyang Arsenal vermessen"
 AOEIW9_CHI_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Hanyang Arsenal“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_CHI_eco_civ_2:0 "Schienen nach Yangtze Werkstätten"
 AOEIW9_CHI_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Yangtze Werkstätten“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_CHI_eco_civ_3:0 "Kapital für Manchurian Industrie"
 AOEIW9_CHI_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Manchurian Industrie“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_CHI_eco_civ_4:0 "Strom für Shanghai Commerce"
 AOEIW9_CHI_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Shanghai Commerce“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_CHI_eco_civ_5:0 "Ausbau von Kaiping Minen"
 AOEIW9_CHI_eco_civ_5_desc:0 "Für „Kaiping Minen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_CHI_eco_civ_6:0 "Nationaler Eisenbahnrat erneuern"
 AOEIW9_CHI_eco_civ_6_desc:0 "„Nationaler Eisenbahnrat“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_CHI_eco_civ_7:0 "Eine zweite Schicht bei Hanyang Arsenal"
 AOEIW9_CHI_eco_civ_7_desc:0 "Bei „Hanyang Arsenal“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_CHI_eco_war_1:0 "Rüstungsaudit: Shanghai Commerce"
 AOEIW9_CHI_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Shanghai Commerce“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_CHI_eco_war_2:0 "Rüstungsaufträge für Kaiping Minen"
 AOEIW9_CHI_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Kaiping Minen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_CHI_eco_war_3:0 "Präzisionswerkzeuge für Nationaler Eisenbahnrat"
 AOEIW9_CHI_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Nationaler Eisenbahnrat“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_CHI_eco_war_4:0 "Hanyang Arsenal für die Aufrüstung ausbauen"
 AOEIW9_CHI_eco_war_4_desc:0 "Rund um „Hanyang Arsenal“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_CHI_eco_war_5:0 "Yangtze Werkstätten standardisieren"
 AOEIW9_CHI_eco_war_5_desc:0 "Die mit „Yangtze Werkstätten“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_CHI_eco_war_6:0 "Nachtproduktion bei Manchurian Industrie"
 AOEIW9_CHI_eco_war_6_desc:0 "Bei „Manchurian Industrie“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_CHI_eco_war_7:0 "Langfristige Verträge für Shanghai Commerce"
 AOEIW9_CHI_eco_war_7_desc:0 "Langfristige Verträge sichern „Shanghai Commerce“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_CHI_eco_war_8:0 "Kaiping Minen für volle Produktion mobilisieren"
 AOEIW9_CHI_eco_war_8_desc:0 "„Kaiping Minen“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_CHI_eco_science_1:0 "Tsinghua Institut ausstatten"
 AOEIW9_CHI_eco_science_1_desc:0 "„Tsinghua Institut“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_CHI_eco_science_2:0 "Neue Labore an Kaiserlich Akademie"
 AOEIW9_CHI_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kaiserlich Akademie“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_CHI_eco_science_3:0 "Angewandte Forschung an Nanjing Engineering Bureau"
 AOEIW9_CHI_eco_science_3_desc:0 "„Nanjing Engineering Bureau“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_CHI_eco_science_4:0 "Industriephysik an Tsinghua Institut"
 AOEIW9_CHI_eco_science_4_desc:0 "Die Industriephysik an „Tsinghua Institut“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_CHI_eco_science_5:0 "Produktionsforschung an Kaiserlich Akademie"
 AOEIW9_CHI_eco_science_5_desc:0 "Bei „Kaiserlich Akademie“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_CHI_eco_science_6:0 "Forschungszuschüsse für Nanjing Engineering Bureau"
 AOEIW9_CHI_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Nanjing Engineering Bureau“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_CHI_eco_science_7:0 "Tsinghua Institut mit den Fabriken vernetzen"
 AOEIW9_CHI_eco_science_7_desc:0 "„Tsinghua Institut“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_CHI_eco_infra_1:0 "Energie für Manchurian Industrie"
 AOEIW9_CHI_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Manchurian Industrie“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_CHI_eco_infra_2:0 "Frachtkapazität bei Shanghai Commerce"
 AOEIW9_CHI_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Shanghai Commerce“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_CHI_eco_infra_3:0 "Arbeiterwohnungen bei Kaiping Minen"
 AOEIW9_CHI_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Kaiping Minen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_CHI_eco_infra_4:0 "Logistik über Nationaler Eisenbahnrat"
 AOEIW9_CHI_eco_infra_4_desc:0 "„Nationaler Eisenbahnrat“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_CHI_eco_final:0 "Industrie für ein wiedervereinigtes Kaiserreich"
 AOEIW9_CHI_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In China wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_CHI_mil_root:0 "Beiyang Generalstab überprüfen"
 AOEIW9_CHI_mil_root_desc:0 "„Beiyang Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_CHI_mil_army_1:0 "Die Heeresausbildungskommission"
 AOEIW9_CHI_mil_army_1_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_2:0 "Die nationale Schützenarmee"
 AOEIW9_CHI_mil_army_2_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_CHI_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_CHI_mil_army_3_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
