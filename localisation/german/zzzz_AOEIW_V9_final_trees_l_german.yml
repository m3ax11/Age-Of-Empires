 AOEIW9_CHI_mil_army_4_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_5:0 "Zentrale Panzerreserven"
 AOEIW9_CHI_mil_army_5_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_CHI_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_CHI_mil_army_6_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_CHI_mil_army_7_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_CHI_mil_army_8_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_CHI_mil_army_9_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_CHI_mil_army_10_desc:0 "China entscheidet zwischen der Ausstattung breiter Infanteriefronten und einer kleineren, schlagkräftigen Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_CHI_mil_air_1:0 "Kaiserlich-chinesische Luftwaffe neu ordnen"
 AOEIW9_CHI_mil_air_1_desc:0 "„Kaiserlich-chinesische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_CHI_mil_air_2:0 "Jagdfliegerausbildung bei Nanjing Luftfahrtakademie"
 AOEIW9_CHI_mil_air_2_desc:0 "„Nanjing Luftfahrtakademie“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_CHI_mil_air_3:0 "China: Bodenunterstützung – Östliches Luftkommando"
 AOEIW9_CHI_mil_air_3_desc:0 "Unter „Östliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In China gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_CHI_mil_air_4:0 "Die Reichweite von Kaiserlich-chinesische Luftwaffe erhöhen"
 AOEIW9_CHI_mil_air_4_desc:0 "„Kaiserlich-chinesische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in China verlangen."
 AOEIW9_CHI_mil_air_5:0 "Radarnetze für Nanjing Luftfahrtakademie"
 AOEIW9_CHI_mil_air_5_desc:0 "„Nanjing Luftfahrtakademie“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_CHI_mil_air_6:0 "China: Einheitliches Luftkommando – Östliches Luftkommando"
 AOEIW9_CHI_mil_air_6_desc:0 "„Östliches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In China gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_CHI_mil_air_7:0 "Kaiserlich-chinesische Luftwaffe wird einsatzreif"
 AOEIW9_CHI_mil_air_7_desc:0 "„Kaiserlich-chinesische Luftwaffe“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_CHI_mil_sea_1:0 "Yangtze Flotte überprüfen"
 AOEIW9_CHI_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Yangtze Flotte“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_CHI_mil_sea_2:0 "Ausbau: Marinearsenal Shanghai"
 AOEIW9_CHI_mil_sea_2_desc:0 "„Marinearsenal Shanghai“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_CHI_mil_sea_3:0 "China: Flottenmanöver – Kaiserliche Küstenflotte"
 AOEIW9_CHI_mil_sea_3_desc:0 "Flottenmanöver mit „Kaiserliche Küstenflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein. In China gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_CHI_mil_sea_4:0 "Sicherungsdoktrin für Yangtze Flotte"
 AOEIW9_CHI_mil_sea_4_desc:0 "„Yangtze Flotte“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_CHI_mil_sea_5:0 "Marineflieger bei Marinearsenal Shanghai"
 AOEIW9_CHI_mil_sea_5_desc:0 "Marineflieger werden mit „Marinearsenal Shanghai“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_CHI_mil_sea_6:0 "China: Neue Schiffskörper – Kaiserliche Küstenflotte"
 AOEIW9_CHI_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Kaiserliche Küstenflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden. In China gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_CHI_mil_sea_7:0 "Seeoberkommando unter Yangtze Flotte"
 AOEIW9_CHI_mil_sea_7_desc:0 "„Yangtze Flotte“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für China wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_CHI_mil_final:0 "Mass und Firepower"
 AOEIW9_CHI_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Chinesisches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_CHI_dip_root:0 "Die Doktrin „Middle Königreich“ festlegen"
 AOEIW9_CHI_dip_root_desc:0 "Chinesisches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_CHI_dip_a_1:0 "Die japanische Bedrohung"
 AOEIW9_CHI_dip_a_1_desc:0 "„Japanische Bedrohung“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Chinesisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_CHI_dip_a_2:0 "Eine Mission zu „Japanische Bedrohung“ entsenden"
 AOEIW9_CHI_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Japanische Bedrohung“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_CHI_dip_a_3:0 "Wirtschaftlicher Druck: „Japanische Bedrohung“"
 AOEIW9_CHI_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Japanische Bedrohung“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_CHI_dip_a_4:0 "Stabsgespräche: „Japanische Bedrohung“"
 AOEIW9_CHI_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Japanische Bedrohung“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_CHI_dip_a_5:0 "Formelle Warnung: „Japanische Bedrohung“"
 AOEIW9_CHI_dip_a_5_desc:0 "Eine formelle Warnung zu „Japanische Bedrohung“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_CHI_dip_a_6:0 "Bedingungen für „Japanische Bedrohung“"
 AOEIW9_CHI_dip_a_6_desc:0 "Für „Japanische Bedrohung“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_CHI_dip_a_7:0 "Die Entscheidung über „Japanische Bedrohung“"
 AOEIW9_CHI_dip_a_7_desc:0 "Bei „Japanische Bedrohung“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_CHI_dip_b_1:0 "Die Nordgrenze"
 AOEIW9_CHI_dip_b_1_desc:0 "„Nordgrenze“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Chinesisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_CHI_dip_b_2:0 "Eine Mission zu „Nordgrenze“ entsenden"
 AOEIW9_CHI_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Nordgrenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_CHI_dip_b_3:0 "Wirtschaftlicher Druck: „Nordgrenze“"
 AOEIW9_CHI_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Nordgrenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_CHI_dip_b_4:0 "Stabsgespräche: „Nordgrenze“"
 AOEIW9_CHI_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Nordgrenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_CHI_dip_b_5:0 "Formelle Warnung: „Nordgrenze“"
 AOEIW9_CHI_dip_b_5_desc:0 "Eine formelle Warnung zu „Nordgrenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_CHI_dip_b_6:0 "Bedingungen für „Nordgrenze“"
 AOEIW9_CHI_dip_b_6_desc:0 "Für „Nordgrenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_CHI_dip_b_7:0 "Die Entscheidung über „Nordgrenze“"
 AOEIW9_CHI_dip_b_7_desc:0 "Bei „Nordgrenze“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_CHI_dip_final:0 "Die Außenpolitik des Kaiserreichs"
 AOEIW9_CHI_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in China sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_DEN_focus_tree:0 "Kingdom of Denmark Schwerpunktbaum"
 AOEIW9_DEN_politics_p1_2:0 "Folketing versöhnen"
 AOEIW9_DEN_politics_p1_2_desc:0 "Die Stellung von „Folketing“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Dänemark: Die konstitutionelle Krone“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_DEN_politics_p1_3:0 "Landsting reformieren"
 AOEIW9_DEN_politics_p1_3_desc:0 "Die Verfahren von „Landsting“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Dänemark: Die konstitutionelle Krone“ arbeitsfähig bleibt."
 AOEIW9_DEN_politics_p1_4:0 "Kopenhagener Kabinett einbinden"
 AOEIW9_DEN_politics_p1_4_desc:0 "„Kopenhagener Kabinett“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Dänemark: Die konstitutionelle Krone“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_DEN_politics_p1_5:0 "Königshaus und Nation"
 AOEIW9_DEN_politics_p1_5_desc:0 "„Königshaus“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Dänemark: Die konstitutionelle Krone“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_DEN_politics_p2_2:0 "Landsting öffnen"
 AOEIW9_DEN_politics_p2_2_desc:0 "Der Zugang zu „Landsting“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Kabinett stärken“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_DEN_politics_p2_3:0 "Kopenhagener Kabinett garantieren"
 AOEIW9_DEN_politics_p2_3_desc:0 "Die Stellung von „Kopenhagener Kabinett“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Kabinett stärken“ einzubinden."
 AOEIW9_DEN_politics_p2_4:0 "Agrarräte erweitern"
 AOEIW9_DEN_politics_p2_4_desc:0 "„Agrarräte“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Kabinett stärken“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_DEN_politics_p2_5:0 "Eine neue Charta für Königreich Dänemark"
 AOEIW9_DEN_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Kabinett stärken“ in einen dauerhaften Rahmen für Dänemark. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_DEN_politics_p3_2:0 "Kopenhagener Kabinett mobilisieren"
 AOEIW9_DEN_politics_p3_2_desc:0 "„Kopenhagener Kabinett“ wird zu einem organisatorischen Träger des Projekts „Nationaler Konservatismus“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_DEN_politics_p3_3:0 "Die Macht von Agrarräte brechen"
 AOEIW9_DEN_politics_p3_3_desc:0 "Die eigenständige Macht von „Agrarräte“ ist mit dem Projekt „Nationaler Konservatismus“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_DEN_politics_p3_4:0 "Gewerkschaften ersetzen"
 AOEIW9_DEN_politics_p3_4_desc:0 "„Gewerkschaften“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationaler Konservatismus“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_DEN_politics_p3_5:0 "Neuordnung: Nationalkonservatismus"
 AOEIW9_DEN_politics_p3_5_desc:0 "Der politische Konflikt um „Nationalkonservatismus“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationaler Konservatismus“ untergeordnet werden."
 AOEIW9_DEN_politics_settlement:0 "Der Kopenhagener Ausgleich"
 AOEIW9_DEN_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königshaus, Folketing und Landsting eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Dänemark kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_DEN_eco_root:0 "Bestandsaufnahme: Kopenhagen Industrie"
 AOEIW9_DEN_eco_root_desc:0 "Kopenhagen Industrie, Jütländische Landwirtschaft und Great Belt Infrastructure arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Dänemark am schnellsten ausbauen kann."
 AOEIW9_DEN_eco_civ_2:0 "Schienen nach Jütländische Landwirtschaft"
 AOEIW9_DEN_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Jütländische Landwirtschaft“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_DEN_eco_civ_5:0 "Ausbau von Odense Werften"
 AOEIW9_DEN_eco_civ_5_desc:0 "Für „Odense Werften“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_DEN_eco_civ_6:0 "Dänemark: Staatsbahnen erneuern"
 AOEIW9_DEN_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Dänemark wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_DEN_eco_civ_7:0 "Eine zweite Schicht bei Kopenhagen Industrie"
 AOEIW9_DEN_eco_civ_7_desc:0 "Bei „Kopenhagen Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_DEN_eco_civ_8:0 "Öffentliche Bauprogramme bei der Jütländischen Landwirtschaft"
 AOEIW9_DEN_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Jütländische Landwirtschaft“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_DEN_eco_civ_9:0 "Entwicklungsrat für Great Belt Infrastructure"
 AOEIW9_DEN_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Great Belt Infrastructure“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_DEN_eco_war_1:0 "Rüstungsaudit: dänisch Merchant Houses"
 AOEIW9_DEN_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Dänisch Merchant Houses“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_DEN_eco_war_2:0 "Rüstungsaufträge für Odense Werften"
 AOEIW9_DEN_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Odense Werften“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_DEN_eco_war_3:0 "Dänemark: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_DEN_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Dänemark wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_DEN_eco_war_4:0 "Kopenhagen Industrie für die Aufrüstung ausbauen"
 AOEIW9_DEN_eco_war_4_desc:0 "Rund um „Kopenhagen Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_DEN_eco_war_5:0 "Jütländische Landwirtschaft standardisieren"
 AOEIW9_DEN_eco_war_5_desc:0 "Die mit „Jütländische Landwirtschaft“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_DEN_eco_war_6:0 "Nachtproduktion bei Great Belt Infrastructure"
 AOEIW9_DEN_eco_war_6_desc:0 "Bei „Great Belt Infrastructure“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_DEN_eco_science_1:0 "Technische Universität Dänemark ausstatten"
 AOEIW9_DEN_eco_science_1_desc:0 "„Technische Universität Dänemark“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_DEN_eco_science_2:0 "Neue Labore an Kopenhagen Institut"
 AOEIW9_DEN_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kopenhagen Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_DEN_eco_science_3:0 "Angewandte Forschung an Königliche Akademie"
 AOEIW9_DEN_eco_science_3_desc:0 "„Königliche Akademie“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_DEN_eco_science_4:0 "Industriephysik an Technische Universität Dänemark"
 AOEIW9_DEN_eco_science_4_desc:0 "Die Industriephysik an „Technische Universität Dänemark“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_DEN_eco_science_5:0 "Produktionsforschung an Kopenhagen Institut"
 AOEIW9_DEN_eco_science_5_desc:0 "Bei „Kopenhagen Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_DEN_eco_infra_2:0 "Frachtkapazität bei dänisch Merchant Houses"
 AOEIW9_DEN_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Dänisch Merchant Houses“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_DEN_eco_infra_3:0 "Arbeiterwohnungen bei Odense Werften"
 AOEIW9_DEN_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Odense Werften“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_DEN_eco_infra_4:0 "Dänemark: Logistik über Staatsbahnen"
 AOEIW9_DEN_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Dänemark wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_DEN_eco_final:0 "Der dänische Produktionsstaat"
 AOEIW9_DEN_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Dänemark wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_DEN_mil_root:0 "dänischer Generalstab überprüfen"
 AOEIW9_DEN_mil_root_desc:0 "„Dänischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_DEN_mil_army_2:0 "Feldmanöver mit Jutland Division"
 AOEIW9_DEN_mil_army_2_desc:0 "Großmanöver mit „Jutland Division“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_DEN_mil_army_5:0 "Offizier Akademie motorisieren"
 AOEIW9_DEN_mil_army_5_desc:0 "Der Motortransport von „Offizier Akademie“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_DEN_mil_army_6:0 "Stabsverfahren bei dänischer Generalstab"
 AOEIW9_DEN_mil_army_6_desc:0 "Bei „Dänischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_DEN_mil_army_7:0 "Panzerstudien bei Jutland Division"
 AOEIW9_DEN_mil_army_7_desc:0 "„Jutland Division“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Dänemark zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_DEN_mil_air_1:0 "Königlich-dänische Luftwaffe neu ordnen"
 AOEIW9_DEN_mil_air_1_desc:0 "„Königlich-dänische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_DEN_mil_air_2:0 "Jagdfliegerausbildung bei Værløse Fliegerstation"
 AOEIW9_DEN_mil_air_2_desc:0 "„Værløse Fliegerstation“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_DEN_mil_air_3:0 "Bodenunterstützungsdoktrin unter Meerengen-Luftkommando"
 AOEIW9_DEN_mil_air_3_desc:0 "Unter „Meerengen-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_DEN_mil_air_4:0 "Die Reichweite von Königlich-dänische Luftwaffe erhöhen"
 AOEIW9_DEN_mil_air_4_desc:0 "„Königlich-dänische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Dänemark verlangen."
 AOEIW9_DEN_mil_air_5:0 "Radarnetze für Værløse Fliegerstation"
 AOEIW9_DEN_mil_air_5_desc:0 "„Værløse Fliegerstation“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_DEN_mil_sea_1:0 "Königlich-Dänische Marine überprüfen"
 AOEIW9_DEN_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Dänische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_DEN_mil_sea_2:0 "Ausbau: Marinewerft Kopenhagen"
 AOEIW9_DEN_mil_sea_2_desc:0 "„Marinewerft Kopenhagen“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_DEN_mil_sea_3:0 "Flottenmanöver mit dänisch Straits Flotte"
 AOEIW9_DEN_mil_sea_3_desc:0 "Flottenmanöver mit „Dänisch Straits Flotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_DEN_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Dänische Marine"
 AOEIW9_DEN_mil_sea_4_desc:0 "„Königlich-Dänische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_DEN_mil_sea_5:0 "Marineflieger bei Marinewerft Kopenhagen"
 AOEIW9_DEN_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Kopenhagen“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_DEN_mil_final:0 "Küstenverteidigung"
 AOEIW9_DEN_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Dänemark verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_DEN_dip_root:0 "Die Doktrin „Straits“ festlegen"
 AOEIW9_DEN_dip_root_desc:0 "Königreich Dänemark muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_DEN_dip_a_2:0 "Eine Mission zu „Die Meerengen sichern“ entsenden"
 AOEIW9_DEN_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Die Meerengen sichern“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_DEN_dip_a_3:0 "Wirtschaftlicher Druck: „Die Meerengen sichern“"
 AOEIW9_DEN_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Die Meerengen sichern“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_DEN_dip_a_4:0 "Stabsgespräche: „Die Meerengen sichern“"
 AOEIW9_DEN_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Die Meerengen sichern“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_DEN_dip_a_5:0 "Formelle Warnung: „Die Meerengen sichern“"
 AOEIW9_DEN_dip_a_5_desc:0 "Eine formelle Warnung zu „Die Meerengen sichern“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_DEN_dip_b_1:0 "deutsch Market"
 AOEIW9_DEN_dip_b_1_desc:0 "„Deutsch Market“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Dänemark tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_DEN_dip_b_2:0 "Eine Mission zu „deutsch Market“ entsenden"
 AOEIW9_DEN_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Deutsch Market“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_DEN_dip_b_3:0 "Wirtschaftlicher Druck: „deutsch Market“"
 AOEIW9_DEN_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Deutsch Market“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_DEN_dip_b_4:0 "Stabsgespräche: „deutsch Market“"
 AOEIW9_DEN_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Deutsch Market“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_DEN_dip_b_5:0 "Formelle Warnung: „deutsch Market“"
 AOEIW9_DEN_dip_b_5_desc:0 "Eine formelle Warnung zu „Deutsch Market“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_DEN_dip_final:0 "Dänemark an den Toren der Ostsee"
 AOEIW9_DEN_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Dänemark sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_EGY_focus_tree:0 "Kingdom of Egypt Schwerpunktbaum"
 AOEIW9_EGY_politics_p1_2:0 "Wafd-Delegation versöhnen"
 AOEIW9_EGY_politics_p1_2_desc:0 "Die Stellung von „Wafd-Delegation“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Palastkompromiss“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_EGY_politics_p1_3:0 "Ägypten: Senat reformieren"
 AOEIW9_EGY_politics_p1_3_desc:0 "Die Verfahren von „Senat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Palastkompromiss“ arbeitsfähig bleibt."
 AOEIW9_EGY_politics_p1_4:0 "Ulema-Räte einbinden"
 AOEIW9_EGY_politics_p1_4_desc:0 "„Ulema-Räte“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Palastkompromiss“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_EGY_politics_p1_5:0 "Ägypten: Königspalast und Nation"
 AOEIW9_EGY_politics_p1_5_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Palastkompromiss“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_EGY_politics_p2_2:0 "Ägypten: Senat öffnen"
 AOEIW9_EGY_politics_p2_2_desc:0 "Der Zugang zu „Senat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Wafd stärken“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_EGY_politics_p2_3:0 "Ulema-Räte garantieren"
 AOEIW9_EGY_politics_p2_3_desc:0 "Die Stellung von „Ulema-Räte“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Wafd stärken“ einzubinden."
 AOEIW9_EGY_politics_p2_4:0 "Ägypten: Heeresoffiziere erweitern"
 AOEIW9_EGY_politics_p2_4_desc:0 "„Heeresoffiziere“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Wafd stärken“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_EGY_politics_p2_5:0 "Eine neue Charta für Königreich Ägypten"
 AOEIW9_EGY_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Wafd stärken“ in einen dauerhaften Rahmen für Ägypten. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_EGY_politics_p3_2:0 "Ulema-Räte mobilisieren"
 AOEIW9_EGY_politics_p3_2_desc:0 "„Ulema-Räte“ wird zu einem organisatorischen Träger des Projekts „Offiziersstaat“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_EGY_politics_p3_3:0 "Ägypten: Die Macht von Heeresoffiziere brechen"
 AOEIW9_EGY_politics_p3_3_desc:0 "Die eigenständige Macht von „Heeresoffiziere“ ist mit dem Projekt „Offiziersstaat“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_EGY_politics_p3_4:0 "Provinz Notables ersetzen"
 AOEIW9_EGY_politics_p3_4_desc:0 "„Provinz Notables“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Offiziersstaat“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_EGY_politics_p3_5:0 "Neuordnung: Offiziere' Staat"
 AOEIW9_EGY_politics_p3_5_desc:0 "Der politische Konflikt um „Offiziere' Staat“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Offiziersstaat“ untergeordnet werden."
 AOEIW9_EGY_politics_settlement:0 "Der Kairoer Ausgleich"
 AOEIW9_EGY_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Wafd-Delegation und Senat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Ägypten kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_EGY_eco_root:0 "Bestandsaufnahme: Nile Irrigation Rat"
 AOEIW9_EGY_eco_root_desc:0 "Nile Irrigation Rat, Hafenanlagen von Alexandria und Kairo Werkstätten arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Ägypten am schnellsten ausbauen kann."
 AOEIW9_EGY_eco_civ_2:0 "Schienen nach Hafenanlagen von Alexandria"
 AOEIW9_EGY_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Hafenanlagen von Alexandria“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_EGY_eco_civ_5:0 "Ausbau von Delta Textile Mills"
 AOEIW9_EGY_eco_civ_5_desc:0 "Für „Delta Textile Mills“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_EGY_eco_civ_6:0 "Entwicklung Oberägyptens erneuern"
 AOEIW9_EGY_eco_civ_6_desc:0 "„Entwicklung Oberägyptens“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_EGY_eco_civ_7:0 "Eine zweite Schicht bei Nile Irrigation Rat"
 AOEIW9_EGY_eco_civ_7_desc:0 "Bei „Nile Irrigation Rat“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_EGY_eco_civ_8:0 "Öffentliche Bauprogramme bei den Hafenanlagen von Alexandria"
 AOEIW9_EGY_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Hafenanlagen von Alexandria“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_EGY_eco_civ_9:0 "Entwicklungsrat für Kairo Werkstätten"
 AOEIW9_EGY_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Kairo Werkstätten“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_EGY_eco_war_1:0 "Rüstungsaudit: Suez Commerce"
 AOEIW9_EGY_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Suez Commerce“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_EGY_eco_war_2:0 "Rüstungsaufträge für Delta Textile Mills"
 AOEIW9_EGY_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Delta Textile Mills“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_EGY_eco_war_3:0 "Präzisionswerkzeuge für Entwicklung Oberägyptens"
 AOEIW9_EGY_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Entwicklung Oberägyptens“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_EGY_eco_war_4:0 "Nile Irrigation Rat für die Aufrüstung ausbauen"
 AOEIW9_EGY_eco_war_4_desc:0 "Rund um „Nile Irrigation Rat“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_EGY_eco_war_5:0 "Hafenanlagen von Alexandria standardisieren"
 AOEIW9_EGY_eco_war_5_desc:0 "Die mit „Hafenanlagen von Alexandria“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_EGY_eco_war_6:0 "Nachtproduktion bei Kairo Werkstätten"
 AOEIW9_EGY_eco_war_6_desc:0 "Bei „Kairo Werkstätten“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_EGY_eco_science_1:0 "Kairo Universität ausstatten"
 AOEIW9_EGY_eco_science_1_desc:0 "„Kairo Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_EGY_eco_science_2:0 "Neue Labore an Königlich Engineering Schule"
 AOEIW9_EGY_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Königlich Engineering Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_EGY_eco_science_3:0 "Angewandte Forschung an ägyptische Wissenschaftsgesellschaft"
 AOEIW9_EGY_eco_science_3_desc:0 "„Ägyptische Wissenschaftsgesellschaft“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_EGY_eco_science_4:0 "Industriephysik an Kairo Universität"
 AOEIW9_EGY_eco_science_4_desc:0 "Die Industriephysik an „Kairo Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_EGY_eco_science_5:0 "Produktionsforschung an Königlich Engineering Schule"
 AOEIW9_EGY_eco_science_5_desc:0 "Bei „Königlich Engineering Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_EGY_eco_infra_2:0 "Frachtkapazität bei Suez Commerce"
 AOEIW9_EGY_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Suez Commerce“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_EGY_eco_infra_3:0 "Arbeiterwohnungen bei Delta Textile Mills"
 AOEIW9_EGY_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Delta Textile Mills“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_EGY_eco_infra_4:0 "Logistik über Entwicklung Oberägyptens"
 AOEIW9_EGY_eco_infra_4_desc:0 "„Entwicklung Oberägyptens“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_EGY_eco_final:0 "Die Entwicklungswirtschaft am Nil"
 AOEIW9_EGY_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Ägypten wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_EGY_mil_root:0 "ägyptischer Generalstab überprüfen"
 AOEIW9_EGY_mil_root_desc:0 "„Ägyptischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_EGY_mil_army_2:0 "Feldmanöver mit Nile Armee"
 AOEIW9_EGY_mil_army_2_desc:0 "Großmanöver mit „Nile Armee“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_EGY_mil_army_5:0 "Stabshochschule Kairo motorisieren"
 AOEIW9_EGY_mil_army_5_desc:0 "Der Motortransport von „Stabshochschule Kairo“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_EGY_mil_army_6:0 "Stabsverfahren bei ägyptischer Generalstab"
 AOEIW9_EGY_mil_army_6_desc:0 "Bei „Ägyptischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_EGY_mil_army_7:0 "Panzerstudien bei Nile Armee"
 AOEIW9_EGY_mil_army_7_desc:0 "„Nile Armee“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Ägypten zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_EGY_mil_air_1:0 "Königlich-ägyptische Luftwaffe neu ordnen"
 AOEIW9_EGY_mil_air_1_desc:0 "„Königlich-ägyptische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_EGY_mil_air_2:0 "Jagdfliegerausbildung bei Almaza Fliegerhorst"
 AOEIW9_EGY_mil_air_2_desc:0 "„Almaza Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_EGY_mil_air_3:0 "Bodenunterstützungsdoktrin unter Wüsten-Luftkommando"
 AOEIW9_EGY_mil_air_3_desc:0 "Unter „Wüsten-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_EGY_mil_air_4:0 "Die Reichweite von Königlich-ägyptische Luftwaffe erhöhen"
 AOEIW9_EGY_mil_air_4_desc:0 "„Königlich-ägyptische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Ägypten verlangen."
 AOEIW9_EGY_mil_air_5:0 "Radarnetze für Almaza Fliegerhorst"
 AOEIW9_EGY_mil_air_5_desc:0 "„Almaza Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_EGY_mil_sea_1:0 "Alexandria Geschwader überprüfen"
 AOEIW9_EGY_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Alexandria Geschwader“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_EGY_mil_sea_2:0 "Ausbau: Marinestützpunkt Port Said"
 AOEIW9_EGY_mil_sea_2_desc:0 "„Marinestützpunkt Port Said“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_EGY_mil_sea_3:0 "Flottenmanöver mit Red Sea Patrouille"
 AOEIW9_EGY_mil_sea_3_desc:0 "Flottenmanöver mit „Red Sea Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_EGY_mil_sea_4:0 "Sicherungsdoktrin für Alexandria Geschwader"
 AOEIW9_EGY_mil_sea_4_desc:0 "„Alexandria Geschwader“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_EGY_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Port Said"
 AOEIW9_EGY_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Port Said“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_EGY_mil_final:0 "Wüstenbeweglichkeit"
 AOEIW9_EGY_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Ägypten verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_EGY_dip_root:0 "Die Doktrin „Nile“ festlegen"
 AOEIW9_EGY_dip_root_desc:0 "Königreich Ägypten muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_EGY_dip_a_2:0 "Eine Mission zu „britisch Frage“ entsenden"
 AOEIW9_EGY_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Britisch Frage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_EGY_dip_a_3:0 "Wirtschaftlicher Druck: „britisch Frage“"
 AOEIW9_EGY_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Britisch Frage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_EGY_dip_a_4:0 "Stabsgespräche: „britisch Frage“"
 AOEIW9_EGY_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Britisch Frage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_EGY_dip_a_5:0 "Formelle Warnung: „britisch Frage“"
 AOEIW9_EGY_dip_a_5_desc:0 "Eine formelle Warnung zu „Britisch Frage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_EGY_dip_b_1:0 "Osmanischer Schatten"
 AOEIW9_EGY_dip_b_1_desc:0 "„Osmanischer Schatten“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Ägypten tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_EGY_dip_b_2:0 "Eine Mission zu „Osmanischer Schatten“ entsenden"
 AOEIW9_EGY_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Osmanischer Schatten“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_EGY_dip_b_3:0 "Wirtschaftlicher Druck: „Osmanischer Schatten“"
 AOEIW9_EGY_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Osmanischer Schatten“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_EGY_dip_b_4:0 "Stabsgespräche: „Osmanischer Schatten“"
 AOEIW9_EGY_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Osmanischer Schatten“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_EGY_dip_b_5:0 "Formelle Warnung: „Osmanischer Schatten“"
 AOEIW9_EGY_dip_b_5_desc:0 "Eine formelle Warnung zu „Osmanischer Schatten“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_EGY_dip_final:0 "Kairo und das östliche Mittelmeer"
 AOEIW9_EGY_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Ägypten sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_ENG_focus_tree:0 "British Empire Schwerpunktbaum"
 AOEIW9_ENG_politics_root:0 "Das Empire am Wendepunkt"
 AOEIW9_ENG_politics_root_desc:0 "Die Macht in Großbritannien verteilt sich auf Unterhaus, Oberhaus und Kronrat. Die Frage ist längst nicht mehr zeremoniell: Der Sieger bestimmt Haushalt, Offizierskorps und die Fähigkeit des Staates zum Handeln."
 AOEIW9_ENG_politics_p1_1:0 "Parlament und Krone"
 AOEIW9_ENG_politics_p1_1_desc:0 "Die Krone akzeptiert eine dem Unterhaus verantwortliche Regierung, während das Parlament die Monarchie als sichtbares Band des Empire bewahrt. Kabinettsgewalt, Konsultationen mit den Dominions und Verfassungskonventionen ersetzen die Herrschaft per Notverordnung."
 AOEIW9_ENG_politics_p1_2:0 "Oberhaus versöhnen"
 AOEIW9_ENG_politics_p1_2_desc:0 "Die Stellung von „Oberhaus“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Parlament und Krone“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_ENG_politics_p1_3:0 "Großbritannien: Kronrat reformieren"
 AOEIW9_ENG_politics_p1_3_desc:0 "Die Verfahren von „Kronrat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Parlament und Krone“ arbeitsfähig bleibt."
 AOEIW9_ENG_politics_p1_4:0 "Großbritannien: Imperialkonferenz einbinden"
 AOEIW9_ENG_politics_p1_4_desc:0 "„Imperialkonferenz“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Parlament und Krone“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_ENG_politics_p1_5:0 "Der Dominionsminister in Downing Street 10"
 AOEIW9_ENG_politics_p1_5_desc:0 "Der Dominionsminister trägt die Einwände Ottawas, Canberras, Wellingtons und Pretorias direkt zum Premierminister. Reichspolitik muss ein Treffen mit den Regierungen überstehen, die sie ausführen sollen."
 AOEIW9_ENG_politics_p1_6:0 "Kabinett gesetzlich ordnen"
 AOEIW9_ENG_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Kabinett“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Parlament und Krone“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_ENG_politics_p1_7:0 "Unterhaus und Nation"
 AOEIW9_ENG_politics_p1_7_desc:0 "„Unterhaus“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Parlament und Krone“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_ENG_politics_p2_1:0 "Imperiale Föderation"
 AOEIW9_ENG_politics_p2_1_desc:0 "Die Dominions können nicht länger durch improvisierte Konferenzen und private Telegramme regiert werden. Ein Reichsparlament, ein gemeinsamer Verteidigungshaushalt und eine einheitliche Außenpolitik sollen aus dem Empire eine echte Föderation machen."
 AOEIW9_ENG_politics_p2_2:0 "Großbritannien: Kronrat öffnen"
 AOEIW9_ENG_politics_p2_2_desc:0 "Der Zugang zu „Kronrat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Imperiale Föderation“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_ENG_politics_p2_3:0 "Großbritannien: Imperialkonferenz garantieren"
 AOEIW9_ENG_politics_p2_3_desc:0 "Die Stellung von „Imperialkonferenz“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Imperiale Föderation“ einzubinden."
 AOEIW9_ENG_politics_p2_4:0 "Ladet die Dominion-Premiers ein"
 AOEIW9_ENG_politics_p2_4_desc:0 "Die Dominion-Premiers sitzen auf der Londoner Konferenz als Regierungschefs, nicht als Bittsteller der Provinzen. Verteidigungspflichten werden neben ihren Autonomieansprüchen festgeschrieben."
 AOEIW9_ENG_politics_p2_5:0 "Kabinett Verantwortung übertragen"
 AOEIW9_ENG_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Kabinett“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Imperiale Föderation“ durch delegierte Autorität regieren kann."
 AOEIW9_ENG_politics_p2_6:0 "Unterhaus ratifizieren"
 AOEIW9_ENG_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Unterhaus“ in der neuen Ordnung fest. Danach beruht der Kurs „Imperiale Föderation“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_ENG_politics_p2_7:0 "Westminster regiert durch Zustimmung"
 AOEIW9_ENG_politics_p2_7_desc:0 "Das Parlament erkennt an, dass die Krone selbstverwaltete Dominions nicht ohne deren Minister binden kann. Gemeinsame Verteidigung beruht auf in London festgehaltener Zustimmung."
 AOEIW9_ENG_politics_p3_1:0 "§RDas Volks-Commonwealth§!"
 AOEIW9_ENG_politics_p3_1_desc:0 "Gewerkschaften, Genossenschaften und koloniale Arbeiterparteien verlangen ein Commonwealth von unten. Die alte imperiale Rangordnung soll Arbeitervertretung, Gemeineigentum und gleicher Bürgerschaft in Großbritannien und den Dominions weichen."
 AOEIW9_ENG_politics_p3_2:0 "Großbritannien: Imperialkonferenz mobilisieren"
 AOEIW9_ENG_politics_p3_2_desc:0 "„Imperialkonferenz“ wird zu einem organisatorischen Träger des Projekts „Volks-Commonwealth“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_ENG_politics_p3_3:0 "Schließt das Dominions Office"
 AOEIW9_ENG_politics_p3_3_desc:0 "Die Volksregierung schließt das Amt, das imperialen Rang in tägliche Verwaltung übersetzte. Beziehungen zu früheren Dominions laufen künftig über gleichberechtigte Gesandtschaften."
 AOEIW9_ENG_politics_p3_4:0 "Kabinett ersetzen"
 AOEIW9_ENG_politics_p3_4_desc:0 "„Kabinett“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Volks-Commonwealth“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_ENG_politics_p3_5:0 "Unterhaus unter direkte Führung stellen"
 AOEIW9_ENG_politics_p3_5_desc:0 "„Unterhaus“ wird den durch den Kurs „Volks-Commonwealth“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_ENG_politics_p3_6:0 "Oberhaus neu gestalten"
 AOEIW9_ENG_politics_p3_6_desc:0 "„Oberhaus“ bleibt bestehen, aber unter neuen Bedingungen. Zusammensetzung und Befugnisse werden so verändert, dass die Institution den Ausgleich „Volks-Commonwealth“ stützt statt das alte Gleichgewicht zu konservieren."
 AOEIW9_ENG_politics_p3_7:0 "Britannien gehört seinem Volk"
 AOEIW9_ENG_politics_p3_7_desc:0 "Das neue Commonwealth leitet seine Gewalt aus Wählern, Gewerkschaften und Gemeinden statt überseeischem Besitz ab. London bietet Gemeinschaft ohne imperialen Befehl."
 AOEIW9_ENG_politics_settlement:0 "Die Maschinerie des Empire"
 AOEIW9_ENG_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Unterhaus, Oberhaus und Kronrat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Britisches Empire kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_ENG_eco_root:0 "Bestandsaufnahme: Fabriken der Midlands"
 AOEIW9_ENG_eco_root_desc:0 "Fabriken der Midlands, Clyde-Werften und Industrie von Manchester arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Britisches Empire am schnellsten ausbauen kann."
 AOEIW9_ENG_eco_civ_1:0 "Fabriken der Midlands vermessen"
 AOEIW9_ENG_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Fabriken der Midlands“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_ENG_eco_civ_2:0 "Schienen nach Clyde-Werften"
 AOEIW9_ENG_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Clyde-Werften“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_ENG_eco_civ_3:0 "Kapital für Industrie von Manchester"
 AOEIW9_ENG_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Industrie von Manchester“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_ENG_eco_civ_4:0 "Die Ottawa-Zölle in der Praxis"
 AOEIW9_ENG_eco_civ_4_desc:0 "Imperial Preference lenkt Aufträge für Maschinen, Nahrung und Rohstoffe in teilnehmende Märkte. Das Abkommen von Ottawa erscheint nun in Auftragsbüchern statt Konferenzprosa."
 AOEIW9_ENG_eco_civ_5:0 "Ausbau von walisische Kohlereviere"
 AOEIW9_ENG_eco_civ_5_desc:0 "Für „Walisische Kohlereviere“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_ENG_eco_civ_6:0 "Londoner Finanzwesen erneuern"
 AOEIW9_ENG_eco_civ_6_desc:0 "„Londoner Finanzwesen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_ENG_eco_civ_7:0 "Eine zweite Schicht bei Fabriken der Midlands"
 AOEIW9_ENG_eco_civ_7_desc:0 "Bei „Fabriken der Midlands“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_ENG_eco_war_1:0 "Sterling, Stahl und Granaten"
 AOEIW9_ENG_eco_war_1_desc:0 "Das Schatzamt verfolgt, wie Sterling-Einnahmen und bevorzugte Importe Stahl, Sprengstoff und Werkzeugmaschinen sichern. Die Aufrüstung muss über dasselbe System bezahlt werden, das sie versorgt."
 AOEIW9_ENG_eco_war_2:0 "Rüstungsaufträge für walisische Kohlereviere"
 AOEIW9_ENG_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Walisische Kohlereviere“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_ENG_eco_war_3:0 "Präzisionswerkzeuge für Londoner Finanzwesen"
 AOEIW9_ENG_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Londoner Finanzwesen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_ENG_eco_war_4:0 "Fabriken der Midlands für die Aufrüstung ausbauen"
 AOEIW9_ENG_eco_war_4_desc:0 "Rund um „Fabriken der Midlands“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_ENG_eco_war_5:0 "Clyde-Werften standardisieren"
 AOEIW9_ENG_eco_war_5_desc:0 "Die mit „Clyde-Werften“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_ENG_eco_war_6:0 "Nachtproduktion bei Industrie von Manchester"
 AOEIW9_ENG_eco_war_6_desc:0 "Bei „Industrie von Manchester“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_ENG_eco_war_7:0 "Verträge im ganzen Empire"
 AOEIW9_ENG_eco_war_7_desc:0 "Langfristige Verträge geben Dominion-Produzenten Zeit zum Ausbau von Minen, Werken und Ladeanlagen. Whitehall erhält verlässliche Lieferungen und übernimmt Pflichten gegenüber seinen Partnern."
 AOEIW9_ENG_eco_war_8:0 "walisische Kohlereviere für volle Produktion mobilisieren"
 AOEIW9_ENG_eco_war_8_desc:0 "„Walisische Kohlereviere“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_ENG_eco_science_1:0 "Royal Society ausstatten"
 AOEIW9_ENG_eco_science_1_desc:0 "„Royal Society“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_ENG_eco_science_2:0 "Neue Labore an Cambridge Labore"
 AOEIW9_ENG_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Cambridge Labore“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_ENG_eco_science_3:0 "Angewandte Forschung an Forschungsabteilung der Admiralität"
 AOEIW9_ENG_eco_science_3_desc:0 "„Forschungsabteilung der Admiralität“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_ENG_eco_science_4:0 "Industriephysik an Royal Society"
 AOEIW9_ENG_eco_science_4_desc:0 "Die Industriephysik an „Royal Society“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_ENG_eco_science_5:0 "Produktionsforschung an Cambridge Labore"
 AOEIW9_ENG_eco_science_5_desc:0 "Bei „Cambridge Labore“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_ENG_eco_science_6:0 "Forschungszuschüsse für Forschungsabteilung der Admiralität"
 AOEIW9_ENG_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Forschungsabteilung der Admiralität“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_ENG_eco_science_7:0 "Royal Society mit den Fabriken vernetzen"
 AOEIW9_ENG_eco_science_7_desc:0 "„Royal Society“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_ENG_eco_infra_1:0 "Energie für Industrie von Manchester"
 AOEIW9_ENG_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Industrie von Manchester“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_ENG_eco_infra_2:0 "Räumt die Waren durch Liverpool"
 AOEIW9_ENG_eco_infra_2_desc:0 "Liverpool erhält zusätzliche Gleise, Kräne und Lager für bevorzugte Fracht. Zollpolitik bedeutet wenig, solange Waren vor einem überfüllten Hafen warten."
 AOEIW9_ENG_eco_infra_3:0 "Arbeiterwohnungen bei walisische Kohlereviere"
 AOEIW9_ENG_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Walisische Kohlereviere“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_ENG_eco_infra_4:0 "Logistik über Londoner Finanzwesen"
 AOEIW9_ENG_eco_infra_4_desc:0 "„Londoner Finanzwesen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_ENG_eco_final:0 "Das imperiale Produktionssystem"
 AOEIW9_ENG_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Großbritannien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ENG_mil_root:0 "Großbritannien: Kaiserlicher Generalstab überprüfen"
 AOEIW9_ENG_mil_root_desc:0 "„Kaiserlicher Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind. In Großbritannien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ENG_mil_army_1:0 "Die Übungen in der Salisbury Plain"
 AOEIW9_ENG_mil_army_1_desc:0 "Linientruppen und Territorials testen Mobilmachung, Funkgeräte und Nachschubkolonnen in der Salisbury Plain. Das War Office schreibt Doktrin aus Fehlern im Feld."
 AOEIW9_ENG_mil_army_2:0 "Die professionelle Expeditionsarmee"
 AOEIW9_ENG_mil_army_2_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_ENG_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_ENG_mil_army_3_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_ENG_mil_army_4_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_5:0 "Selbständige Panzerdivisionen"
 AOEIW9_ENG_mil_army_5_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_ENG_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_ENG_mil_army_6_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_ENG_mil_army_7_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_ENG_mil_army_8_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_ENG_mil_army_9_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_ENG_mil_army_10_desc:0 "Großbritannien wägt eine einsatzbereite Infanterie gegen Transport- und Werkstattbedarf gepanzerter Expeditionen ab. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ENG_mil_air_1:0 "Britische Luftwaffe neu ordnen"
 AOEIW9_ENG_mil_air_1_desc:0 "„Britische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_ENG_mil_air_2:0 "Jagdfliegerausbildung bei Fighter Command"
 AOEIW9_ENG_mil_air_2_desc:0 "„Fighter Command“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_ENG_mil_air_3:0 "Bodenunterstützungsdoktrin unter Bomber Kommando"
 AOEIW9_ENG_mil_air_3_desc:0 "Unter „Bomber Kommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_ENG_mil_air_4:0 "Die Reichweite von Britische Luftwaffe erhöhen"
 AOEIW9_ENG_mil_air_4_desc:0 "„Britische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Großbritannien verlangen."
 AOEIW9_ENG_mil_air_5:0 "Radarnetze für Fighter Command"
 AOEIW9_ENG_mil_air_5_desc:0 "„Fighter Command“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_ENG_mil_air_6:0 "Das Luftkommando unter Bomber Kommando vereinigen"
 AOEIW9_ENG_mil_air_6_desc:0 "„Bomber Kommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_ENG_mil_air_7:0 "Britische Luftwaffe wird einsatzreif"
 AOEIW9_ENG_mil_air_7_desc:0 "„Britische Luftwaffe“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_ENG_mil_sea_1:0 "Königliche Marine überprüfen"
 AOEIW9_ENG_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königliche Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_ENG_mil_sea_2:0 "Ausbau: Portsmouth Werft"
 AOEIW9_ENG_mil_sea_2_desc:0 "„Portsmouth Werft“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_ENG_mil_sea_3:0 "Flottenmanöver mit Home Flotte"
 AOEIW9_ENG_mil_sea_3_desc:0 "Flottenmanöver mit „Home Flotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_ENG_mil_sea_4:0 "Sicherungsdoktrin für Königliche Marine"
 AOEIW9_ENG_mil_sea_4_desc:0 "„Königliche Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_ENG_mil_sea_5:0 "Marineflieger bei Portsmouth Werft"
 AOEIW9_ENG_mil_sea_5_desc:0 "Marineflieger werden mit „Portsmouth Werft“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_ENG_mil_sea_6:0 "Neue Schiffskörper für Home Flotte"
 AOEIW9_ENG_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Home Flotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_ENG_mil_sea_7:0 "Seeoberkommando unter Königliche Marine"
 AOEIW9_ENG_mil_sea_7_desc:0 "„Königliche Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Großbritannien wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_ENG_mil_final:0 "Großbritannien: Gefecht der verbundenen Waffen"
 AOEIW9_ENG_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Britisches Empire verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_ENG_dip_root:0 "Define Kaiserlich Grand Strategy"
 AOEIW9_ENG_dip_root_desc:0 "Britisches Empire muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_ENG_dip_a_1:0 "Die Atlantikrivalität"
 AOEIW9_ENG_dip_a_1_desc:0 "„Atlantikrivalität“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Britisches Empire tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ENG_dip_a_2:0 "Eine Mission zu „Atlantikrivalität“ entsenden"
 AOEIW9_ENG_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Atlantikrivalität“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ENG_dip_a_3:0 "Wirtschaftlicher Druck: „Atlantikrivalität“"
 AOEIW9_ENG_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Atlantikrivalität“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ENG_dip_a_4:0 "Stabsgespräche: „Atlantikrivalität“"
 AOEIW9_ENG_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Atlantikrivalität“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ENG_dip_a_5:0 "Formelle Warnung: „Atlantikrivalität“"
 AOEIW9_ENG_dip_a_5_desc:0 "Eine formelle Warnung zu „Atlantikrivalität“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ENG_dip_a_6:0 "Bedingungen für „Atlantikrivalität“"
 AOEIW9_ENG_dip_a_6_desc:0 "Für „Atlantikrivalität“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_ENG_dip_a_7:0 "Die Entscheidung über „Atlantikrivalität“"
 AOEIW9_ENG_dip_a_7_desc:0 "Bei „Atlantikrivalität“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_ENG_dip_b_1:0 "Kontinentale Verpflichtungen"
 AOEIW9_ENG_dip_b_1_desc:0 "„Kontinentale Verpflichtungen“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Britisches Empire tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ENG_dip_b_2:0 "Eine Mission zu „Kontinentale Verpflichtungen“ entsenden"
 AOEIW9_ENG_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Kontinentale Verpflichtungen“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ENG_dip_b_3:0 "Wirtschaftlicher Druck: „Kontinentale Verpflichtungen“"
 AOEIW9_ENG_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Kontinentale Verpflichtungen“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ENG_dip_b_4:0 "Stabsgespräche: „Kontinentale Verpflichtungen“"
 AOEIW9_ENG_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Kontinentale Verpflichtungen“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ENG_dip_b_5:0 "Formelle Warnung: „Kontinentale Verpflichtungen“"
 AOEIW9_ENG_dip_b_5_desc:0 "Eine formelle Warnung zu „Kontinentale Verpflichtungen“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ENG_dip_b_6:0 "Bedingungen für „Kontinentale Verpflichtungen“"
 AOEIW9_ENG_dip_b_6_desc:0 "Für „Kontinentale Verpflichtungen“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_ENG_dip_b_7:0 "Die Entscheidung über „Kontinentale Verpflichtungen“"
 AOEIW9_ENG_dip_b_7_desc:0 "Bei „Kontinentale Verpflichtungen“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_ENG_dip_final:0 "Die globalen Verpflichtungen des Empire"
 AOEIW9_ENG_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Großbritannien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_ETH_focus_tree:0 "Ethiopian Empire Schwerpunktbaum"
 AOEIW9_ETH_politics_p1_2:0 "Provinz-Ras versöhnen"
 AOEIW9_ETH_politics_p1_2_desc:0 "Die Stellung von „Provinz-Ras“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Kaiserliche Reform“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_ETH_politics_p1_3:0 "Äthiopien: Kronrat reformieren"
 AOEIW9_ETH_politics_p1_3_desc:0 "Die Verfahren von „Kronrat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Kaiserliche Reform“ arbeitsfähig bleibt."
 AOEIW9_ETH_politics_p1_4:0 "Kabinett von Addis Abeba einbinden"
 AOEIW9_ETH_politics_p1_4_desc:0 "„Kabinett von Addis Abeba“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Kaiserliche Reform“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_ETH_politics_p1_5:0 "Äthiopien: Kaiserhof und Nation"
 AOEIW9_ETH_politics_p1_5_desc:0 "„Kaiserhof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Kaiserliche Reform“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_ETH_politics_p2_2:0 "Äthiopien: Kronrat öffnen"
 AOEIW9_ETH_politics_p2_2_desc:0 "Der Zugang zu „Kronrat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Rat der Notabeln“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_ETH_politics_p2_3:0 "Kabinett von Addis Abeba garantieren"
 AOEIW9_ETH_politics_p2_3_desc:0 "Die Stellung von „Kabinett von Addis Abeba“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Rat der Notabeln“ einzubinden."
 AOEIW9_ETH_politics_p2_4:0 "Clergy erweitern"
 AOEIW9_ETH_politics_p2_4_desc:0 "„Clergy“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Rat der Notabeln“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_ETH_politics_p2_5:0 "Eine neue Charta für äthiopisch Empire"
 AOEIW9_ETH_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Rat der Notabeln“ in einen dauerhaften Rahmen für „Äthiopisch Empire“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_ETH_politics_p3_2:0 "Kabinett von Addis Abeba mobilisieren"
 AOEIW9_ETH_politics_p3_2_desc:0 "„Kabinett von Addis Abeba“ wird zu einem organisatorischen Träger des Projekts „Äthiopien: Die jungen Offiziere“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_ETH_politics_p3_3:0 "Die Macht von Clergy brechen"
 AOEIW9_ETH_politics_p3_3_desc:0 "Die eigenständige Macht von „Clergy“ ist mit dem Projekt „Äthiopien: Die jungen Offiziere“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_ETH_politics_p3_4:0 "Modernist Offiziere ersetzen"
 AOEIW9_ETH_politics_p3_4_desc:0 "„Modernist Offiziere“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Äthiopien: Die jungen Offiziere“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_ETH_politics_p3_5:0 "Äthiopien: Neuordnung: Young Offiziere"
 AOEIW9_ETH_politics_p3_5_desc:0 "Der politische Konflikt um „Young Offiziere“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Äthiopien: Die jungen Offiziere“ untergeordnet werden."
 AOEIW9_ETH_politics_settlement:0 "Der Ausgleich von Addis Abeba"
 AOEIW9_ETH_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Kaiserhof, Provinz-Ras und Kronrat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Äthiopisches Kaiserreich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_ETH_eco_root:0 "Bestandsaufnahme: Addis Werkstätten"
 AOEIW9_ETH_eco_root_desc:0 "Addis Werkstätten, Djibouti Eisenbahn und Highland Straßen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Äthiopisches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_ETH_eco_civ_2:0 "Schienen nach Djibouti Eisenbahn"
 AOEIW9_ETH_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Djibouti Eisenbahn“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_ETH_eco_civ_5:0 "Ausbau von Awash-Entwicklungsprogramm"
 AOEIW9_ETH_eco_civ_5_desc:0 "Für „Awash-Entwicklungsprogramm“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_ETH_eco_civ_6:0 "Kaiserliche Schatzkammer erneuern"
 AOEIW9_ETH_eco_civ_6_desc:0 "„Kaiserliche Schatzkammer“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_ETH_eco_civ_7:0 "Eine zweite Schicht bei Addis Werkstätten"
 AOEIW9_ETH_eco_civ_7_desc:0 "Bei „Addis Werkstätten“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_ETH_eco_civ_8:0 "Öffentliche Bauprogramme bei der Dschibuti-Bahn"
 AOEIW9_ETH_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Djibouti Eisenbahn“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_ETH_eco_civ_9:0 "Entwicklungsrat für Highland Straßen"
 AOEIW9_ETH_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Highland Straßen“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_ETH_eco_war_1:0 "Äthiopien: Rüstungsaudit: Kaffee-Exportrat"
 AOEIW9_ETH_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Kaffee-Exportrat“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen. In Äthiopien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ETH_eco_war_2:0 "Rüstungsaufträge für Awash-Entwicklungsprogramm"
 AOEIW9_ETH_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Awash-Entwicklungsprogramm“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_ETH_eco_war_3:0 "Präzisionswerkzeuge für Kaiserliche Schatzkammer"
 AOEIW9_ETH_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Kaiserliche Schatzkammer“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_ETH_eco_war_4:0 "Addis Werkstätten für die Aufrüstung ausbauen"
 AOEIW9_ETH_eco_war_4_desc:0 "Rund um „Addis Werkstätten“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_ETH_eco_war_5:0 "Djibouti Eisenbahn standardisieren"
 AOEIW9_ETH_eco_war_5_desc:0 "Die mit „Djibouti Eisenbahn“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_ETH_eco_war_6:0 "Nachtproduktion bei Highland Straßen"
 AOEIW9_ETH_eco_war_6_desc:0 "Bei „Highland Straßen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_ETH_eco_science_1:0 "Haile Selassie Universität ausstatten"
 AOEIW9_ETH_eco_science_1_desc:0 "„Haile Selassie Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_ETH_eco_science_2:0 "Äthiopien: Neue Labore an Kaiserliche Technische Schule"
 AOEIW9_ETH_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kaiserliche Technische Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt. In Äthiopien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ETH_eco_science_3:0 "Angewandte Forschung an Forschungsbüro Addis Abeba"
 AOEIW9_ETH_eco_science_3_desc:0 "„Forschungsbüro Addis Abeba“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_ETH_eco_science_4:0 "Industriephysik an Haile Selassie Universität"
 AOEIW9_ETH_eco_science_4_desc:0 "Die Industriephysik an „Haile Selassie Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_ETH_eco_science_5:0 "Äthiopien: Produktionsforschung an Kaiserliche Technische Schule"
 AOEIW9_ETH_eco_science_5_desc:0 "Bei „Kaiserliche Technische Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden. In Äthiopien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ETH_eco_infra_2:0 "Äthiopien: Frachtkapazität bei Kaffee-Exportrat"
 AOEIW9_ETH_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Kaffee-Exportrat“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen. In Äthiopien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ETH_eco_infra_3:0 "Arbeiterwohnungen bei Awash-Entwicklungsprogramm"
 AOEIW9_ETH_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Awash-Entwicklungsprogramm“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_ETH_eco_infra_4:0 "Logistik über Kaiserliche Schatzkammer"
 AOEIW9_ETH_eco_infra_4_desc:0 "„Kaiserliche Schatzkammer“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_ETH_eco_final:0 "Eine äthiopische Modernisierungswirtschaft"
 AOEIW9_ETH_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Äthiopien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ETH_mil_root:0 "Kaiserlich-äthiopisches Heer überprüfen"
 AOEIW9_ETH_mil_root_desc:0 "„Kaiserlich-äthiopisches Heer“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_ETH_mil_army_2:0 "Feldmanöver mit Kebur Zabagna"
 AOEIW9_ETH_mil_army_2_desc:0 "Großmanöver mit „Kebur Zabagna“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_ETH_mil_army_5:0 "Offizier Schule motorisieren"
 AOEIW9_ETH_mil_army_5_desc:0 "Der Motortransport von „Offizier Schule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_ETH_mil_army_6:0 "Stabsverfahren bei Kaiserlich-äthiopisches Heer"
 AOEIW9_ETH_mil_army_6_desc:0 "Bei „Kaiserlich-äthiopisches Heer“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_ETH_mil_army_7:0 "Panzerstudien bei Kebur Zabagna"
 AOEIW9_ETH_mil_army_7_desc:0 "„Kebur Zabagna“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Äthiopien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_ETH_mil_air_1:0 "Äthiopische Luftwaffe neu ordnen"
 AOEIW9_ETH_mil_air_1_desc:0 "„Äthiopische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_ETH_mil_air_2:0 "Jagdfliegerausbildung bei Fliegerschule Addis Abeba"
 AOEIW9_ETH_mil_air_2_desc:0 "„Fliegerschule Addis Abeba“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_ETH_mil_air_3:0 "Bodenunterstützungsdoktrin unter Hochland-Luftkommando"
 AOEIW9_ETH_mil_air_3_desc:0 "Unter „Hochland-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_ETH_mil_air_4:0 "Die Reichweite von Äthiopische Luftwaffe erhöhen"
 AOEIW9_ETH_mil_air_4_desc:0 "„Äthiopische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Äthiopien verlangen."
 AOEIW9_ETH_mil_air_5:0 "Radarnetze für Fliegerschule Addis Abeba"
 AOEIW9_ETH_mil_air_5_desc:0 "„Fliegerschule Addis Abeba“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_ETH_mil_special_1:0 "Red Sea Procurement ausbauen"
 AOEIW9_ETH_mil_special_1_desc:0 "„Red Sea Procurement“ erhält Transportmittel, Depots und Beschaffungsbefugnisse, die für eine echte militärische Fähigkeit nötig sind. Der Ausbau wird an Versorgung und Einsatzbereitschaft gebunden statt an neue Formationen auf dem Papier."
 AOEIW9_ETH_mil_special_2:0 "Massawa Ambition ausbilden"
 AOEIW9_ETH_mil_special_2_desc:0 "Die mit „Massawa Ambition“ verbundenen Verbände erhalten eine eigene Ausbildung für Gelände und Auftrag. Übungen konzentrieren sich auf praktische Einsatzbereitschaft statt auf zeremonielle Stärke."
 AOEIW9_ETH_mil_special_3:0 "Mit Kaiserlicher Transportdienst befestigen"
 AOEIW9_ETH_mil_special_3_desc:0 "„Kaiserlicher Transportdienst“ wird in einen geplanten Befestigungsrahmen mit Versorgungsstellen, vorbereiteten Stellungen und Pionierunterstützung eingebunden. Gelände wird erst dann zu einem Vorteil, wenn Truppen es halten und versorgen können."
 AOEIW9_ETH_mil_special_4:0 "Gebirgslogistik für Red Sea Procurement"
 AOEIW9_ETH_mil_special_4_desc:0 "Packtransport, Gebirgsstraßen, Depots und spezialisierte Versorgungseinheiten unterstützen „Red Sea Procurement“. Das Programm hält Verbände dort beweglich, wo normaler Motortransport nicht zuverlässig funktioniert."
 AOEIW9_ETH_mil_special_5:0 "Mobile Reserve von Massawa Ambition"
 AOEIW9_ETH_mil_special_5_desc:0 "Um „Massawa Ambition“ wird eine mobile Reserve organisiert, damit lokale Verteidigungskraft rasch in bedrohte Abschnitte verlegt werden kann. Beweglichkeit macht aus statischen Vorbereitungen ein operatives System."
 AOEIW9_ETH_mil_final:0 "Äthiopien: Gebirgsverteidigung"
 AOEIW9_ETH_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Äthiopisches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_ETH_dip_root:0 "Die Doktrin „Highland“ festlegen"
 AOEIW9_ETH_dip_root_desc:0 "Äthiopisches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_ETH_dip_a_2:0 "Eine Mission zu „italienisch Threat“ entsenden"
 AOEIW9_ETH_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Italienisch Threat“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ETH_dip_a_3:0 "Wirtschaftlicher Druck: „italienisch Threat“"
 AOEIW9_ETH_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Italienisch Threat“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ETH_dip_a_4:0 "Stabsgespräche: „italienisch Threat“"
 AOEIW9_ETH_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Italienisch Threat“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ETH_dip_a_5:0 "Formelle Warnung: „italienisch Threat“"
 AOEIW9_ETH_dip_a_5_desc:0 "Eine formelle Warnung zu „Italienisch Threat“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ETH_dip_b_1:0 "Nilfrage"
 AOEIW9_ETH_dip_b_1_desc:0 "„Nilfrage“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Äthiopisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ETH_dip_b_2:0 "Eine Mission zu „Nilfrage“ entsenden"
 AOEIW9_ETH_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Nilfrage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ETH_dip_b_3:0 "Wirtschaftlicher Druck: „Nilfrage“"
 AOEIW9_ETH_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Nilfrage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ETH_dip_b_4:0 "Stabsgespräche: „Nilfrage“"
 AOEIW9_ETH_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Nilfrage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ETH_dip_b_5:0 "Formelle Warnung: „Nilfrage“"
 AOEIW9_ETH_dip_b_5_desc:0 "Eine formelle Warnung zu „Nilfrage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ETH_dip_final:0 "Addis Abeba und das Rote Meer"
 AOEIW9_ETH_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Äthiopien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_FIN_focus_tree:0 "Finland Schwerpunktbaum"
 AOEIW9_FIN_politics_p1_2:0 "Der Präsident ruft die Parteien"
 AOEIW9_FIN_politics_p1_2_desc:0 "Der Präsident bestellt die Parlamentsführer ein, bevor Veteranen auf der Straße Bedingungen diktieren. Eine gesetzliche Koalition muss die putschbereite Rechte isolieren, ohne den Bürgerkrieg neu zu eröffnen."
 AOEIW9_FIN_politics_p1_3:0 "Weiße Garde reformieren"
 AOEIW9_FIN_politics_p1_3_desc:0 "Die Verfahren von „Weiße Garde“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Parlamentarische Republik“ arbeitsfähig bleibt."
 AOEIW9_FIN_politics_p1_4:0 "Agrarliga einbinden"
 AOEIW9_FIN_politics_p1_4_desc:0 "„Agrarliga“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Parlamentarische Republik“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_FIN_politics_p1_5:0 "Tamperes Fabrikherren am Tisch"
 AOEIW9_FIN_politics_p1_5_desc:0 "Die Fabrikbesitzer von Tampere tragen den Verfassungsblock mit, wenn Streiks, Verträge und Mobilmachung klare Regeln erhalten. Ihre Unterstützung bringt Maschinen und Geld, aber auch Forderungen."
 AOEIW9_FIN_politics_p1_6:0 "Eduskunta und Nation"
 AOEIW9_FIN_politics_p1_6_desc:0 "„Eduskunta“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Parlamentarische Republik“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_FIN_politics_p2_2:0 "Weiße Garde öffnen"
 AOEIW9_FIN_politics_p2_2_desc:0 "Der Zugang zu „Weiße Garde“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Starke Präsidentschaft“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_FIN_politics_p2_3:0 "Agrarliga garantieren"
 AOEIW9_FIN_politics_p2_3_desc:0 "Die Stellung von „Agrarliga“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Starke Präsidentschaft“ einzubinden."
 AOEIW9_FIN_politics_p2_4:0 "Die Arbeitgeber ins Parlament"
 AOEIW9_FIN_politics_p2_4_desc:0 "Industrieführer sagen öffentlich im Ausschuss aus und verhandeln mit dem Landbund, statt Forderungen über private Klubs zu stellen. Die Koalition macht ihren Einfluss sichtbar."
 AOEIW9_FIN_politics_p2_5:0 "Finnland: Provinzgouverneure Verantwortung übertragen"
 AOEIW9_FIN_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Provinzgouverneure“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Starke Präsidentschaft“ durch delegierte Autorität regieren kann."
 AOEIW9_FIN_politics_p2_6:0 "Die Eduskunta setzt die Regeln"
 AOEIW9_FIN_politics_p2_6_desc:0 "Notstandsrechte, Verteidigungsmittel und Provinzgewalt werden von der Eduskunta in Gesetz gefasst. Keine Bewegung darf sich über die gewählte Kammer stellen."
 AOEIW9_FIN_politics_p3_2:0 "Agrarliga mobilisieren"
 AOEIW9_FIN_politics_p3_2_desc:0 "„Agrarliga“ wird zu einem organisatorischen Träger des Projekts „Großfinnland“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_FIN_politics_p3_3:0 "Besetzt die Fabriken von Tampere"
 AOEIW9_FIN_politics_p3_3_desc:0 "Das neue Regime stellt Wachen an die Tore der größten Werke Tamperes. Eigentümer dürfen nur an ihren Schreibtischen bleiben, solange die Produktion dem nationalen Projekt dient."
 AOEIW9_FIN_politics_p3_4:0 "Finnland: Provinzgouverneure ersetzen"
 AOEIW9_FIN_politics_p3_4_desc:0 "„Provinzgouverneure“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Großfinnland“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_FIN_politics_p3_5:0 "Eduskunta unter direkte Führung stellen"
 AOEIW9_FIN_politics_p3_5_desc:0 "„Eduskunta“ wird den durch den Kurs „Großfinnland“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_FIN_politics_p3_6:0 "Vom Finnischen Meerbusen zum Weißen Meer"
 AOEIW9_FIN_politics_p3_6_desc:0 "Großfinnland wird als territoriale Mission ausgerufen. Schulen, Kasernen und Karten lehren künftig denselben östlichen Horizont."
 AOEIW9_FIN_politics_settlement:0 "Helsinki wählt seine Republik"
 AOEIW9_FIN_politics_settlement_desc:0 "Der Kampf zwischen Parlament, Veteranen und Expansionisten endet in einer Regierung mit eindeutiger Rechtsquelle. Finnland weiß nun, wer in der nächsten Grenzkrise befehlen darf."
 AOEIW9_FIN_eco_root:0 "Bestandsaufnahme: Tampere Werkstätten"
 AOEIW9_FIN_eco_root_desc:0 "Tampere Werkstätten, Finnischer Forstrat und Petsamo Minerals arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Finnland am schnellsten ausbauen kann."
 AOEIW9_FIN_eco_civ_2:0 "Holzzüge nach Kotka"
 AOEIW9_FIN_eco_civ_2_desc:0 "Neue Abstellgleise und Ladeplätze bringen Schnittholz aus dem Inneren zu Kotkas Mühlen und Hafen. Exporteinnahmen beginnen mit einem pünktlich eintreffenden Waggon."
 AOEIW9_FIN_eco_civ_5:0 "Finnland: Ausbau von Staatsbahnen"
 AOEIW9_FIN_eco_civ_5_desc:0 "Für „Staatsbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann. In Finnland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FIN_eco_civ_6:0 "Bändigt die Stromschnellen von Imatra"
 AOEIW9_FIN_eco_civ_6_desc:0 "Die Turbinen von Imatra werden für Werkstätten, Eisenbahnen und neue Siedlungen ausgebaut. Heimische Energie verringert Finnlands Abhängigkeit von gefährdeten Brennstoffimporten."
 AOEIW9_FIN_eco_civ_7:0 "Eine zweite Schicht bei Tampere Werkstätten"
 AOEIW9_FIN_eco_civ_7_desc:0 "Bei „Tampere Werkstätten“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_FIN_eco_civ_8:0 "Straßen in die Wälder"
 AOEIW9_FIN_eco_civ_8_desc:0 "Holzbezirke brauchen ganzjährig befahrbare Straßen, Depots und Reparaturschuppen. Öffentliche Arbeiten öffnen das Landesinnere für regelmäßigen Verkehr."
 AOEIW9_FIN_eco_war_1:0 "Rüstungsaudit: Helsinki Werften"
 AOEIW9_FIN_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Helsinki Werften“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_FIN_eco_war_2:0 "Finnland: Rüstungsaufträge für Staatsbahnen"
 AOEIW9_FIN_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Staatsbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen. In Finnland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FIN_eco_war_3:0 "Turbinen für die Kriegswirtschaft"
 AOEIW9_FIN_eco_war_3_desc:0 "Werkstätten vereinheitlichen Generatoren, Pumpen und Ersatzteile der Wasserkraftwerke. Die Stromversorgung muss die Mobilmachung so zuverlässig überstehen wie die Eisenbahn."
 AOEIW9_FIN_eco_war_4:0 "Tampere Werkstätten für die Aufrüstung ausbauen"
 AOEIW9_FIN_eco_war_4_desc:0 "Rund um „Tampere Werkstätten“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_FIN_eco_war_5:0 "Vermesst jeden Stamm"
 AOEIW9_FIN_eco_war_5_desc:0 "Forstleute und Sägewerke führen gemeinsame Maße für Holz ein, das für Kasernen, Brücken und Kisten bestimmt ist. Verschwendung im Wald bedeutet Verzögerung an der Front."
 AOEIW9_FIN_eco_war_6:0 "Nachtproduktion bei Petsamo Minerals"
 AOEIW9_FIN_eco_war_6_desc:0 "Bei „Petsamo Minerals“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_FIN_eco_war_7:0 "Langfristige Verträge für Helsinki Werften"
 AOEIW9_FIN_eco_war_7_desc:0 "Langfristige Verträge sichern „Helsinki Werften“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_FIN_eco_science_1:0 "Helsinki Universität ausstatten"
 AOEIW9_FIN_eco_science_1_desc:0 "„Helsinki Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_FIN_eco_science_2:0 "Neue Labore an Staatliches Technisches Institut"
 AOEIW9_FIN_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Staatliches Technisches Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_FIN_eco_science_3:0 "Forschung in der staatlichen Flugzeugfabrik"
 AOEIW9_FIN_eco_science_3_desc:0 "Konstrukteure und Hochschulingenieure prüfen Strukturen, Motoren und Wintergerät neben der Fertigung. Finnische Anforderungen prägen die Prototypen von Anfang an."
 AOEIW9_FIN_eco_science_4:0 "Industriephysik an Helsinki Universität"
 AOEIW9_FIN_eco_science_4_desc:0 "Die Industriephysik an „Helsinki Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_FIN_eco_science_5:0 "Produktionsforschung an Staatliches Technisches Institut"
 AOEIW9_FIN_eco_science_5_desc:0 "Bei „Staatliches Technisches Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_FIN_eco_science_6:0 "Mittel für Finnlands Erfinder"
 AOEIW9_FIN_eco_science_6_desc:0 "Der Staat fördert aussichtsreiche Arbeiten an Funk, Chemie und Winterausrüstung ohne sofortigen Fertigungsauftrag. Kleine Labore können eine Idee bis zur Erprobung bringen."
 AOEIW9_FIN_eco_infra_2:0 "Frachtkapazität bei Helsinki Werften"
 AOEIW9_FIN_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Helsinki Werften“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_FIN_eco_infra_3:0 "Finnland: Arbeiterwohnungen bei Staatsbahnen"
 AOEIW9_FIN_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Staatsbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen. In Finnland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FIN_eco_infra_4:0 "Stromleitungen aus Imatra"
 AOEIW9_FIN_eco_infra_4_desc:0 "Hochspannungsleitungen tragen Imatras Strom zu Fabriken und Bahnknoten. Das nationale Netz muss jene Orte erreichen, die einen Krieg tragen sollen."
 AOEIW9_FIN_eco_final:0 "Der finnische Industriestaat"
 AOEIW9_FIN_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Finnland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FIN_mil_root:0 "finnischer Generalstab überprüfen"
 AOEIW9_FIN_mil_root_desc:0 "„Finnischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_FIN_mil_army_2:0 "Feldmanöver mit Mannerheim Line Kommando"
 AOEIW9_FIN_mil_army_2_desc:0 "Großmanöver mit „Mannerheim Line Kommando“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_FIN_mil_army_5:0 "Winterkriegführung Centre motorisieren"
 AOEIW9_FIN_mil_army_5_desc:0 "Der Motortransport von „Winter Warfare Centre“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_FIN_mil_army_6:0 "Stabsverfahren bei finnischer Generalstab"
 AOEIW9_FIN_mil_army_6_desc:0 "Bei „Finnischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_FIN_mil_army_7:0 "Panzerstudien bei Mannerheim Line Kommando"
 AOEIW9_FIN_mil_army_7_desc:0 "„Mannerheim Line Kommando“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Finnland zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_FIN_mil_army_8:0 "Operationsplanung bei Jaeger Tradition"
 AOEIW9_FIN_mil_army_8_desc:0 "Operationsplanung mit „Jaeger Tradition“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_FIN_mil_army_9:0 "Finnland: Doktrin – Feldartillerieschule"
 AOEIW9_FIN_mil_army_9_desc:0 "Die von „Feldartillerieschule“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Finnland gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_FIN_mil_air_1:0 "Finnische Luftwaffe neu ordnen"
 AOEIW9_FIN_mil_air_1_desc:0 "„Finnische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_FIN_mil_air_2:0 "Jagdfliegerausbildung bei Kauhava Fliegerschule"
 AOEIW9_FIN_mil_air_2_desc:0 "„Kauhava Fliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_FIN_mil_air_3:0 "Finnland: Bodenunterstützung – Nördliches Luftkommando"
 AOEIW9_FIN_mil_air_3_desc:0 "Unter „Nördliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Finnland gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_FIN_mil_air_4:0 "Die Reichweite von Finnische Luftwaffe erhöhen"
 AOEIW9_FIN_mil_air_4_desc:0 "„Finnische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Finnland verlangen."
 AOEIW9_FIN_mil_air_5:0 "Radarnetze für Kauhava Fliegerschule"
 AOEIW9_FIN_mil_air_5_desc:0 "„Kauhava Fliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_FIN_mil_air_6:0 "Finnland: Einheitliches Luftkommando – Nördliches Luftkommando"
 AOEIW9_FIN_mil_air_6_desc:0 "„Nördliches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Finnland gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_FIN_mil_sea_1:0 "Küstenflotte überprüfen"
 AOEIW9_FIN_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Küstenflotte“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_FIN_mil_sea_2:0 "Ausbau: Turku Werft"
 AOEIW9_FIN_mil_sea_2_desc:0 "„Turku Werft“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_FIN_mil_sea_3:0 "Flottenmanöver mit Finnischer-Meerbusen-Patrouille"
 AOEIW9_FIN_mil_sea_3_desc:0 "Flottenmanöver mit „Finnischer-Meerbusen-Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_FIN_mil_sea_4:0 "Sicherungsdoktrin für Küstenflotte"
 AOEIW9_FIN_mil_sea_4_desc:0 "„Küstenflotte“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_FIN_mil_sea_5:0 "Marineflieger bei Turku Werft"
 AOEIW9_FIN_mil_sea_5_desc:0 "Marineflieger werden mit „Turku Werft“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_FIN_mil_sea_6:0 "Neue Schiffskörper für Finnischer-Meerbusen-Patrouille"
 AOEIW9_FIN_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Finnischer-Meerbusen-Patrouille“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_FIN_mil_final:0 "Winterkriegführung"
 AOEIW9_FIN_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Finnland verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_FIN_dip_root:0 "Die Doktrin „White North“ festlegen"
 AOEIW9_FIN_dip_root_desc:0 "Finnland muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_FIN_dip_a_2:0 "Eine Mission zu „Ostgrenze“ entsenden"
 AOEIW9_FIN_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Ostgrenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_FIN_dip_a_3:0 "Wirtschaftlicher Druck: „Ostgrenze“"
 AOEIW9_FIN_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Ostgrenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_FIN_dip_a_4:0 "Stabsgespräche: „Ostgrenze“"
 AOEIW9_FIN_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Ostgrenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_FIN_dip_a_5:0 "Formelle Warnung: „Ostgrenze“"
 AOEIW9_FIN_dip_a_5_desc:0 "Eine formelle Warnung zu „Ostgrenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_FIN_dip_a_6:0 "Bedingungen für „Ostgrenze“"
 AOEIW9_FIN_dip_a_6_desc:0 "Für „Ostgrenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_FIN_dip_b_1:0 "Nordic Zusammenarbeit"
 AOEIW9_FIN_dip_b_1_desc:0 "„Nordic Cooperation“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Finnland tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_FIN_dip_b_2:0 "Eine Mission zu „Nordic Cooperation“ entsenden"
 AOEIW9_FIN_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Nordic Cooperation“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_FIN_dip_b_3:0 "Wirtschaftlicher Druck: „Nordic Cooperation“"
 AOEIW9_FIN_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Nordic Cooperation“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_FIN_dip_b_4:0 "Stabsgespräche: „Nordic Cooperation“"
 AOEIW9_FIN_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Nordic Cooperation“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_FIN_dip_b_5:0 "Formelle Warnung: „Nordic Cooperation“"
 AOEIW9_FIN_dip_b_5_desc:0 "Eine formelle Warnung zu „Nordic Cooperation“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_FIN_dip_b_6:0 "Bedingungen für „Nordic Cooperation“"
 AOEIW9_FIN_dip_b_6_desc:0 "Für „Nordic Cooperation“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_FIN_dip_final:0 "Finnland zwischen den Großmächten"
 AOEIW9_FIN_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Finnland sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_FRA_focus_tree:0 "Second French Empire Schwerpunktbaum"
 AOEIW9_FRA_politics_root:0 "Die kaiserliche Frage"
 AOEIW9_FRA_politics_root_desc:0 "Die Verfassungsordnung in Frankreich ist zu einem Ringen zwischen Pariser Ministerien, Senat des Kaiserreichs und Korps législatif geworden. Bevor äußerer Druck die Fronten verhärtet, muss geklärt werden, welche Institutionen tatsächlich regieren und welche nur beraten."
 AOEIW9_FRA_politics_p1_1:0 "Das liberale Kaiserreich"
 AOEIW9_FRA_politics_p1_1_desc:0 "„Liberale Kaiserreich“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Frankreich."
 AOEIW9_FRA_politics_p1_2:0 "Senat des Kaiserreichs versöhnen"
 AOEIW9_FRA_politics_p1_2_desc:0 "Die Stellung von „Senat des Kaiserreichs“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Liberale Kaiserreich“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_FRA_politics_p1_3:0 "Korps législatif reformieren"
 AOEIW9_FRA_politics_p1_3_desc:0 "Die Verfahren von „Korps législatif“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Liberale Kaiserreich“ arbeitsfähig bleibt."
 AOEIW9_FRA_politics_p1_4:0 "Bonapartistischer Hof einbinden"
 AOEIW9_FRA_politics_p1_4_desc:0 "„Bonapartistischer Hof“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Liberale Kaiserreich“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_FRA_politics_p1_5:0 "Provinzpräfekten ausbalancieren"
 AOEIW9_FRA_politics_p1_5_desc:0 "Weder die Ausschaltung von „Provinzpräfekten“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Liberale Kaiserreich“ austariert."
 AOEIW9_FRA_politics_p1_6:0 "Arbeiterkammern gesetzlich ordnen"
 AOEIW9_FRA_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Arbeiterkammern“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Liberale Kaiserreich“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_FRA_politics_p1_7:0 "Pariser Ministerien und Nation"
 AOEIW9_FRA_politics_p1_7_desc:0 "„Pariser Ministerien“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Liberale Kaiserreich“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_FRA_politics_p2_1:0 "Bonapartistische Autorität"
 AOEIW9_FRA_politics_p2_1_desc:0 "„Bonapartistische Autorität“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Frankreich."
 AOEIW9_FRA_politics_p2_2:0 "Korps législatif öffnen"
 AOEIW9_FRA_politics_p2_2_desc:0 "Der Zugang zu „Korps législatif“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Bonapartistische Autorität“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_FRA_politics_p2_3:0 "Bonapartistischer Hof garantieren"
 AOEIW9_FRA_politics_p2_3_desc:0 "Die Stellung von „Bonapartistischer Hof“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Bonapartistische Autorität“ einzubinden."
 AOEIW9_FRA_politics_p2_4:0 "Provinzpräfekten erweitern"
 AOEIW9_FRA_politics_p2_4_desc:0 "„Provinzpräfekten“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Bonapartistische Autorität“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_FRA_politics_p2_5:0 "Arbeiterkammern Verantwortung übertragen"
 AOEIW9_FRA_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Arbeiterkammern“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Bonapartistische Autorität“ durch delegierte Autorität regieren kann."
 AOEIW9_FRA_politics_p2_6:0 "Pariser Ministerien ratifizieren"
 AOEIW9_FRA_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Pariser Ministerien“ in der neuen Ordnung fest. Danach beruht der Kurs „Bonapartistische Autorität“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_FRA_politics_p2_7_desc:0 "In Saint-Cloud verkündet der Kaiser die Teilung der Gewalt zwischen Krone, Ministern und Kammern. Die bonapartistische Herrschaft stützt sich auf einen öffentlichen Verfassungsakt statt auf dauernden Notstand."
 AOEIW9_FRA_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Pariser Ministerien, Senat des Kaiserreichs und Korps législatif eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Zweites Französisches Kaiserreich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_FRA_eco_root:0 "Bestandsaufnahme: Lothringische Stahlindustrie"
 AOEIW9_FRA_eco_root_desc:0 "Lothringische Stahlindustrie, Pariser Industrie und Renault-Werke arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Zweites Französisches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_FRA_eco_civ_1:0 "Lothringische Stahlindustrie vermessen"
 AOEIW9_FRA_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Lothringische Stahlindustrie“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_FRA_eco_civ_2:0 "Schienen nach Pariser Industrie"
 AOEIW9_FRA_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Pariser Industrie“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_FRA_eco_civ_3:0 "Kapital für Renault-Werke"
 AOEIW9_FRA_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Renault-Werke“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_FRA_eco_civ_4:0 "Strom für Schneider-Creusot"
 AOEIW9_FRA_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Schneider-Creusot“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_FRA_eco_civ_5:0 "Ausbau von Mediterranean Häfen"
 AOEIW9_FRA_eco_civ_5_desc:0 "Für „Mediterranean Häfen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_FRA_eco_civ_6:0 "Frankreich: Staatsbahnen erneuern"
 AOEIW9_FRA_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Frankreich wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FRA_eco_civ_7:0 "Eine zweite Schicht bei Lothringische Stahlindustrie"
 AOEIW9_FRA_eco_civ_7_desc:0 "Bei „Lothringische Stahlindustrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_FRA_eco_war_1:0 "Rüstungsaudit: Schneider-Creusot"
 AOEIW9_FRA_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Schneider-Creusot“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_FRA_eco_war_2:0 "Rüstungsaufträge für Mediterranean Häfen"
 AOEIW9_FRA_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Mediterranean Häfen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_FRA_eco_war_3:0 "Frankreich: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_FRA_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Frankreich wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FRA_eco_war_4:0 "Lothringische Stahlindustrie für die Aufrüstung ausbauen"
 AOEIW9_FRA_eco_war_4_desc:0 "Rund um „Lothringische Stahlindustrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_FRA_eco_war_5:0 "Pariser Industrie standardisieren"
 AOEIW9_FRA_eco_war_5_desc:0 "Die mit „Pariser Industrie“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_FRA_eco_war_6:0 "Nachtproduktion bei Renault-Werke"
 AOEIW9_FRA_eco_war_6_desc:0 "Bei „Renault-Werke“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_FRA_eco_war_7:0 "Langfristige Verträge für Schneider-Creusot"
 AOEIW9_FRA_eco_war_7_desc:0 "Langfristige Verträge sichern „Schneider-Creusot“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_FRA_eco_war_8:0 "Mediterranean Häfen für volle Produktion mobilisieren"
 AOEIW9_FRA_eco_war_8_desc:0 "„Mediterranean Häfen“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_FRA_eco_science_1:0 "Labore der Sorbonne ausstatten"
 AOEIW9_FRA_eco_science_1_desc:0 "„Labore der Sorbonne“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_FRA_eco_science_2:0 "Neue Labore an École Polytechnique"
 AOEIW9_FRA_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „École Polytechnique“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_FRA_eco_science_3:0 "Angewandte Forschung an Nationales Forschungszentrum"
 AOEIW9_FRA_eco_science_3_desc:0 "„Nationales Forschungszentrum“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_FRA_eco_science_4:0 "Industriephysik an Labore der Sorbonne"
 AOEIW9_FRA_eco_science_4_desc:0 "Die Industriephysik an „Labore der Sorbonne“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_FRA_eco_science_5:0 "Produktionsforschung an École Polytechnique"
 AOEIW9_FRA_eco_science_5_desc:0 "Bei „École Polytechnique“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_FRA_eco_science_6:0 "Forschungszuschüsse für Nationales Forschungszentrum"
 AOEIW9_FRA_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Nationales Forschungszentrum“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_FRA_eco_science_7:0 "Labore der Sorbonne mit den Fabriken vernetzen"
 AOEIW9_FRA_eco_science_7_desc:0 "„Labore der Sorbonne“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_FRA_eco_infra_1:0 "Energie für Renault-Werke"
 AOEIW9_FRA_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Renault-Werke“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_FRA_eco_infra_2:0 "Frachtkapazität bei Schneider-Creusot"
 AOEIW9_FRA_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Schneider-Creusot“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_FRA_eco_infra_3:0 "Arbeiterwohnungen bei Mediterranean Häfen"
 AOEIW9_FRA_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Mediterranean Häfen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_FRA_eco_infra_4:0 "Frankreich: Logistik über Staatsbahnen"
 AOEIW9_FRA_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Frankreich wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_FRA_eco_final:0 "Die Werkhallen des Zweiten Kaiserreichs"
 AOEIW9_FRA_eco_final_desc:0 "Schienen, Kredite, Labore und Rüstungsaufträge verbinden nun Frankreichs regionale Industrien. Die kaiserliche Wirtschaft kann Pariser Pläne in dauerhafte Werkstattproduktion verwandeln."
 AOEIW9_FRA_mil_root:0 "französischer Generalstab überprüfen"
 AOEIW9_FRA_mil_root_desc:0 "„Französischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_FRA_mil_army_1:0 "Die Herbstmanöver von Mailly"
 AOEIW9_FRA_mil_army_1_desc:0 "Reservisten, Panzer und Artillerie üben gemeinsam im Camp de Mailly. Gebrochene Zeitpläne und verwirrte Befehle werden behoben, bevor sie einen Feldzug bestimmen."
 AOEIW9_FRA_mil_army_2:0 "Die methodische Infanterieschlacht"
 AOEIW9_FRA_mil_army_2_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_FRA_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_FRA_mil_army_3_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_FRA_mil_army_4_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_5:0 "Divisions Cuirassées"
 AOEIW9_FRA_mil_army_5_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_FRA_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_FRA_mil_army_6_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_FRA_mil_army_9_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_FRA_mil_army_10_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_air_1:0 "Armée de l'Air neu ordnen"
 AOEIW9_FRA_mil_air_1_desc:0 "„Armée de l'Air“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_FRA_mil_air_2:0 "Jagdfliegerausbildung bei Jagdfliegerschule"
 AOEIW9_FRA_mil_air_2_desc:0 "„Jagdfliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_FRA_mil_air_3:0 "Frankreich: Bodenunterstützung – Strategisches Luftkommando"
 AOEIW9_FRA_mil_air_3_desc:0 "Unter „Strategisches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Frankreich gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_FRA_mil_air_4:0 "Die Reichweite von Armée de l'Air erhöhen"
 AOEIW9_FRA_mil_air_4_desc:0 "„Armée de l'Air“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Frankreich verlangen."
 AOEIW9_FRA_mil_air_5:0 "Radarnetze für Jagdfliegerschule"
 AOEIW9_FRA_mil_air_5_desc:0 "„Jagdfliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_FRA_mil_air_6:0 "Frankreich: Einheitliches Luftkommando – Strategisches Luftkommando"
 AOEIW9_FRA_mil_air_6_desc:0 "„Strategisches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Frankreich gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_FRA_mil_air_7:0 "Armée de l'Air wird einsatzreif"
 AOEIW9_FRA_mil_air_7_desc:0 "„Armée de l'Air“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_FRA_mil_sea_1:0 "Marine Nationale überprüfen"
 AOEIW9_FRA_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Marine Nationale“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_FRA_mil_sea_2:0 "Ausbau: Brest Arsenal"
 AOEIW9_FRA_mil_sea_2_desc:0 "„Brest Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_FRA_mil_sea_3:0 "Flottenmanöver mit Mittelmeerflotte"
 AOEIW9_FRA_mil_sea_3_desc:0 "Flottenmanöver mit „Mittelmeerflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_FRA_mil_sea_4:0 "Sicherungsdoktrin für Marine Nationale"
 AOEIW9_FRA_mil_sea_4_desc:0 "„Marine Nationale“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_FRA_mil_sea_5:0 "Marineflieger bei Brest Arsenal"
 AOEIW9_FRA_mil_sea_5_desc:0 "Marineflieger werden mit „Brest Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_FRA_mil_sea_6:0 "Neue Schiffskörper für Mittelmeerflotte"
 AOEIW9_FRA_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Mittelmeerflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_FRA_mil_sea_7:0 "Seeoberkommando unter Marine Nationale"
 AOEIW9_FRA_mil_sea_7_desc:0 "„Marine Nationale“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Frankreich wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_FRA_mil_final:0 "Methodische Schlacht"
 AOEIW9_FRA_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Zweites Französisches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_FRA_dip_root:0 "Die Doktrin „Kaiserlich Continental“ festlegen"
 AOEIW9_FRA_dip_root_desc:0 "Zweites Französisches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_FRA_dip_a_1:0 "Die Rheinrivalität"
 AOEIW9_FRA_dip_a_1_desc:0 "„Rheinrivalität“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Zweites Französisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_FRA_dip_a_2:0 "Eine Mission zu „Rheinrivalität“ entsenden"
 AOEIW9_FRA_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Rheinrivalität“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_FRA_dip_a_3:0 "Wirtschaftlicher Druck: „Rheinrivalität“"
 AOEIW9_FRA_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Rheinrivalität“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_FRA_dip_a_4:0 "Stabsgespräche: „Rheinrivalität“"
 AOEIW9_FRA_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Rheinrivalität“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_FRA_dip_a_5:0 "Formelle Warnung: „Rheinrivalität“"
 AOEIW9_FRA_dip_a_5_desc:0 "Eine formelle Warnung zu „Rheinrivalität“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_FRA_dip_a_6:0 "Bedingungen für „Rheinrivalität“"
 AOEIW9_FRA_dip_a_6_desc:0 "Für „Rheinrivalität“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_FRA_dip_a_7:0 "Die Entscheidung über „Rheinrivalität“"
 AOEIW9_FRA_dip_a_7_desc:0 "Bei „Rheinrivalität“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_FRA_dip_b_1:0 "Mittelmeerambitionen"
 AOEIW9_FRA_dip_b_1_desc:0 "„Mittelmeerambitionen“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Zweites Französisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_FRA_dip_b_2:0 "Eine Mission zu „Mittelmeerambitionen“ entsenden"
 AOEIW9_FRA_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Mittelmeerambitionen“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_FRA_dip_b_3:0 "Wirtschaftlicher Druck: „Mittelmeerambitionen“"
 AOEIW9_FRA_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Mittelmeerambitionen“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_FRA_dip_b_4:0 "Stabsgespräche: „Mittelmeerambitionen“"
 AOEIW9_FRA_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Mittelmeerambitionen“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_FRA_dip_b_5:0 "Formelle Warnung: „Mittelmeerambitionen“"
 AOEIW9_FRA_dip_b_5_desc:0 "Eine formelle Warnung zu „Mittelmeerambitionen“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_FRA_dip_b_6:0 "Bedingungen für „Mittelmeerambitionen“"
 AOEIW9_FRA_dip_b_6_desc:0 "Für „Mittelmeerambitionen“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_FRA_dip_b_7:0 "Die Entscheidung über „Mittelmeerambitionen“"
 AOEIW9_FRA_dip_b_7_desc:0 "Bei „Mittelmeerambitionen“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_FRA_dip_final:0 "Hüter der Alten Ordnung"
 AOEIW9_FRA_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Frankreich sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_GER_focus_tree:0 "German Empire Schwerpunktbaum"
 AOEIW9_GER_politics_p1_1:0 "Ein föderales Kaiserreich"
 AOEIW9_GER_politics_p1_1_desc:0 "„Föderales Kaiserreich“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Deutschland."
 AOEIW9_GER_politics_p1_2:0 "Bundesrat versöhnen"
 AOEIW9_GER_politics_p1_2_desc:0 "Die Stellung von „Bundesrat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Föderales Kaiserreich“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_GER_politics_p1_3:0 "Reichskanzlei reformieren"
 AOEIW9_GER_politics_p1_3_desc:0 "Die Verfahren von „Reichskanzlei“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Föderales Kaiserreich“ arbeitsfähig bleibt."
 AOEIW9_GER_politics_p1_4:0 "Prussian Ministerium einbinden"
 AOEIW9_GER_politics_p1_4_desc:0 "„Prussian Ministerium“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Föderales Kaiserreich“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_GER_politics_p1_5:0 "Federal Princes ausbalancieren"
 AOEIW9_GER_politics_p1_5_desc:0 "Weder die Ausschaltung von „Federal Princes“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Föderales Kaiserreich“ austariert."
 AOEIW9_GER_politics_p1_6:0 "Arbeiterräte gesetzlich ordnen"
 AOEIW9_GER_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Arbeiterräte“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Föderales Kaiserreich“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_GER_politics_p1_7:0 "Deutschland: Reichstag und Nation"
 AOEIW9_GER_politics_p1_7_desc:0 "„Reichstag“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Föderales Kaiserreich“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_GER_politics_p2_1:0 "Die bürgerlichen Netzwerke erneuern"
 AOEIW9_GER_politics_p2_1_desc:0 "Katholische Verbände, kommunale Reformer und Verfassungskonservative können das von höfischer Patronage verdrängte Bürgerleben neu verbinden. Ihre Zusammenarbeit begründet eine legale Opposition."
 AOEIW9_GER_politics_p2_2:0 "Die Verfassungsopposition organisieren"
 AOEIW9_GER_politics_p2_2_desc:0 "Die Opposition muss mehr werden als privater Widerspruch. Eine disziplinierte parlamentarische Koalition kann die Institutionen verteidigen, muss aber die Kosten der offenen Konfrontation mit dem Hof tragen."
 AOEIW9_GER_politics_p2_3:0 "Das Kölner Memorandum"
 AOEIW9_GER_politics_p2_3_desc:0 "Adenauers Kreis verbreitet ein föderales Memorandum, das Bürgerrechte, regionale Verantwortung und rechenschaftspflichtige Regierung in einem Programm verbindet."
 AOEIW9_GER_politics_p2_4:0 "Mit der deutschen Industrie verhandeln"
 AOEIW9_GER_politics_p2_4_desc:0 "Die Industrie akzeptiert die Verfassungsreform, wenn Verträge, Kredite und Tarifverhandlungen den Übergang überstehen. Der Ausgleich ist produktiv, aber nicht kostenlos."
 AOEIW9_GER_politics_p2_5:0 "Die Neutralität des Militärs sichern"
 AOEIW9_GER_politics_p2_5_desc:0 "Das Offizierskorps darf weder den Palast verteidigen noch den Staat an sich reißen. Berufliche Garantien können das Heer in der bevorstehenden Parlamentskrise neutral halten."
 AOEIW9_GER_politics_p2_6:0 "Das Ultimatum der Länder"
 AOEIW9_GER_politics_p2_6_desc:0 "Bayern, Sachsen und Württemberg tauschen keine Notregierung gegen die nächste. Ihre Minister erscheinen in Berlin mit schriftlichen Forderungen: föderales Veto, veröffentlichte Kabinettsrechte und eine Abstimmung im Reichstag."
 AOEIW9_GER_politics_p2_7:0 "Die Regierung Adenauer bilden"
 AOEIW9_GER_politics_p2_7_desc:0 "Nachdem Parlament, Industrie, Länder und Heer eingebunden sind, kann Konrad Adenauer eine verantwortliche Regierung bilden und die persönliche Kaiserherrschaft beenden."
 AOEIW9_GER_politics_settlement:0 "Ein handlungsfähiges Kaiserreich"
 AOEIW9_GER_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Reichstag, Bundesrat und Reichskanzlei eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Deutsches Kaiserreich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_GER_eco_root:0 "Bestandsaufnahme: Ruhrgießereien"
 AOEIW9_GER_eco_root_desc:0 "Ruhrgießereien, Krupp-Werke und Schlesische Kohlereviere arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Deutsches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_GER_eco_civ_1:0 "Ruhrgießereien vermessen"
 AOEIW9_GER_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Ruhrgießereien“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_GER_eco_civ_2:0 "Schienen nach Krupp-Werke"
 AOEIW9_GER_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Krupp-Werke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_GER_eco_civ_3:0 "Kapital für Schlesische Kohlereviere"
 AOEIW9_GER_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Schlesische Kohlereviere“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_GER_eco_civ_4:0 "Strom für Hamburg Werften"
 AOEIW9_GER_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Hamburg Werften“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_GER_eco_civ_5:0 "Ausbau von Rhineland Machine Tools"
 AOEIW9_GER_eco_civ_5_desc:0 "Für „Rhineland Machine Tools“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_GER_eco_civ_6:0 "Reichsbahn erneuern"
 AOEIW9_GER_eco_civ_6_desc:0 "„Reichsbahn“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_GER_eco_civ_7:0 "Eine zweite Schicht bei Ruhrgießereien"
 AOEIW9_GER_eco_civ_7_desc:0 "Bei „Ruhrgießereien“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_GER_eco_war_1:0 "Rüstungsaudit: Hamburg Werften"
 AOEIW9_GER_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Hamburg Werften“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_GER_eco_war_2:0 "Rüstungsaufträge für Rhineland Machine Tools"
 AOEIW9_GER_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Rhineland Machine Tools“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_GER_eco_war_3:0 "Präzisionswerkzeuge für Reichsbahn"
 AOEIW9_GER_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Reichsbahn“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_GER_eco_war_4:0 "Ruhrgießereien für die Aufrüstung ausbauen"
 AOEIW9_GER_eco_war_4_desc:0 "Rund um „Ruhrgießereien“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_GER_eco_war_5:0 "Krupp-Werke standardisieren"
 AOEIW9_GER_eco_war_5_desc:0 "Die mit „Krupp-Werke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_GER_eco_war_6:0 "Nachtproduktion bei Schlesische Kohlereviere"
 AOEIW9_GER_eco_war_6_desc:0 "Bei „Schlesische Kohlereviere“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_GER_eco_war_7:0 "Langfristige Verträge für Hamburg Werften"
 AOEIW9_GER_eco_war_7_desc:0 "Langfristige Verträge sichern „Hamburg Werften“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_GER_eco_war_8:0 "Rhineland Machine Tools für volle Produktion mobilisieren"
 AOEIW9_GER_eco_war_8_desc:0 "„Rhineland Machine Tools“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_GER_eco_science_1:0 "Kaiser-Wilhelm-Gesellschaft ausstatten"
 AOEIW9_GER_eco_science_1_desc:0 "„Kaiser-Wilhelm-Gesellschaft“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_GER_eco_science_2:0 "Neue Labore an Göttinger Forschungsinstitute"
 AOEIW9_GER_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Göttinger Forschungsinstitute“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_GER_eco_science_3:0 "Angewandte Forschung an Charlottenburg Technische Universität"
 AOEIW9_GER_eco_science_3_desc:0 "„Charlottenburg Technische Universität“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_GER_eco_science_4:0 "Industriephysik an Kaiser-Wilhelm-Gesellschaft"
 AOEIW9_GER_eco_science_4_desc:0 "Die Industriephysik an „Kaiser-Wilhelm-Gesellschaft“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_GER_eco_science_5:0 "Produktionsforschung an Göttinger Forschungsinstitute"
 AOEIW9_GER_eco_science_5_desc:0 "Bei „Göttinger Forschungsinstitute“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_GER_eco_science_6:0 "Forschungszuschüsse für Charlottenburg Technische Universität"
 AOEIW9_GER_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Charlottenburg Technische Universität“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_GER_eco_science_7:0 "Kaiser-Wilhelm-Gesellschaft mit den Fabriken vernetzen"
 AOEIW9_GER_eco_science_7_desc:0 "„Kaiser-Wilhelm-Gesellschaft“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_GER_eco_infra_1:0 "Energie für Schlesische Kohlereviere"
 AOEIW9_GER_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Schlesische Kohlereviere“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_GER_eco_infra_2:0 "Frachtkapazität bei Hamburg Werften"
 AOEIW9_GER_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Hamburg Werften“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_GER_eco_infra_3:0 "Arbeiterwohnungen bei Rhineland Machine Tools"
 AOEIW9_GER_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Rhineland Machine Tools“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_GER_eco_infra_4:0 "Logistik über Reichsbahn"
 AOEIW9_GER_eco_infra_4_desc:0 "„Reichsbahn“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_GER_eco_final:0 "Ein koordiniertes deutsches Industriesystem"
 AOEIW9_GER_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Deutschland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_GER_mil_root:0 "Preußischer Generalstab überprüfen"
 AOEIW9_GER_mil_root_desc:0 "„Preußischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_GER_mil_army_1:0 "Die Döberitzer Manöver"
 AOEIW9_GER_mil_army_1_desc:0 "In Döberitz entscheidet das Reichsheer einen Streit, den Denkschriften nicht lösen: disziplinierte Infanterieschlacht oder bewegliche Panzerführung. Die Übung bestimmt, wohin Ausbilder und Gerät gehen."
 AOEIW9_GER_mil_army_2:0 "Auftragstaktik der Infanterie"
 AOEIW9_GER_mil_army_2_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_GER_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_GER_mil_army_3_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_army_5:0 "Selbständige Panzergruppen"
 AOEIW9_GER_mil_army_5_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_GER_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_GER_mil_army_6_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_GER_mil_army_8_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_GER_mil_army_9_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_GER_mil_army_10_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_air_1:0 "Luftstreitkräfte neu ordnen"
 AOEIW9_GER_mil_air_1_desc:0 "„Luftstreitkräfte“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_GER_mil_air_2:0 "Jagdfliegerausbildung bei Döberitz Fliegerschule"
 AOEIW9_GER_mil_air_2_desc:0 "„Döberitz Fliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_GER_mil_air_3:0 "Bodenunterstützungsdoktrin unter Kaiserliches Luftkommando"
 AOEIW9_GER_mil_air_3_desc:0 "Unter „Kaiserliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_GER_mil_air_4:0 "Die Reichweite von Luftstreitkräfte erhöhen"
 AOEIW9_GER_mil_air_4_desc:0 "„Luftstreitkräfte“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Deutschland verlangen."
 AOEIW9_GER_mil_air_5:0 "Radarnetze für Döberitz Fliegerschule"
 AOEIW9_GER_mil_air_5_desc:0 "„Döberitz Fliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_GER_mil_air_6:0 "Das Luftkommando unter Kaiserliches Luftkommando vereinigen"
 AOEIW9_GER_mil_air_6_desc:0 "„Kaiserliches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_GER_mil_air_7:0 "Luftstreitkräfte wird einsatzreif"
 AOEIW9_GER_mil_air_7_desc:0 "„Luftstreitkräfte“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_GER_mil_sea_1:0 "Hochseeflotte überprüfen"
 AOEIW9_GER_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Hochseeflotte“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_GER_mil_sea_2:0 "Ausbau: Marinearsenal Kiel"
 AOEIW9_GER_mil_sea_2_desc:0 "„Marinearsenal Kiel“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_GER_mil_sea_3:0 "Flottenmanöver mit Nordseeflotte"
 AOEIW9_GER_mil_sea_3_desc:0 "Flottenmanöver mit „Nordseeflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_GER_mil_sea_4:0 "Sicherungsdoktrin für Hochseeflotte"
 AOEIW9_GER_mil_sea_4_desc:0 "„Hochseeflotte“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_GER_mil_sea_5:0 "Marineflieger bei Marinearsenal Kiel"
 AOEIW9_GER_mil_sea_5_desc:0 "Marineflieger werden mit „Marinearsenal Kiel“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_GER_mil_sea_6:0 "Neue Schiffskörper für Nordseeflotte"
 AOEIW9_GER_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Nordseeflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_GER_mil_sea_7:0 "Seeoberkommando unter Hochseeflotte"
 AOEIW9_GER_mil_sea_7_desc:0 "„Hochseeflotte“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Deutschland wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_GER_mil_final:0 "Auftragstaktik"
 AOEIW9_GER_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Deutsches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_GER_dip_root:0 "Die Doktrin „Mitteleuropa“ festlegen"
 AOEIW9_GER_dip_root_desc:0 "Deutsches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_GER_dip_a_1:0 "Das Verhältnis zu Wien"
 AOEIW9_GER_dip_a_1_desc:0 "Deutschland und Österreich-Ungarn stehen in verschiedenen Blöcken, doch Geografie und Geschichte machen dauerhafte Feindschaft strategisch fahrlässig."
 AOEIW9_GER_dip_a_2:0 "Die Verständigung Berlin–Wien"
 AOEIW9_GER_dip_a_2_desc:0 "Berlin sucht eine dauerhafte Verständigung mit Wien, die Meinungsverschiedenheiten anerkennt, ohne daraus automatisch Konfrontation zu machen."
 AOEIW9_GER_dip_a_3:0 "Donauhandel ohne Unterordnung"
 AOEIW9_GER_dip_a_3_desc:0 "Der Zugang zu den Donaumärkten wird erweitert, ohne von Österreich-Ungarn politische Unterordnung zu verlangen."
 AOEIW9_GER_dip_a_4:0 "Kanäle zwischen den Generalstäben"
 AOEIW9_GER_dip_a_4_desc:0 "Diskrete Stabskanäle verringern das Risiko, Übungen, Mobilmachungen oder Balkankrisen als Angriffsvorbereitung fehlzudeuten."
 AOEIW9_GER_dip_a_5:0 "Die habsburgische Sphäre respektieren"
 AOEIW9_GER_dip_a_5_desc:0 "Deutschland erkennt legitime Wiener Interessen an Donau und Balkan an, auch wenn der Reichspakt eine eigene Strategie verfolgt."
 AOEIW9_GER_dip_a_6:0 "Ein kontinentaler Nichtangriffspakt"
 AOEIW9_GER_dip_a_6_desc:0 "Ein formeller Nichtangriffspakt soll verhindern, dass die Rivalität der beiden deutschsprachigen Großmächte Europa versehentlich entzündet."
 AOEIW9_GER_dip_a_7:0 "Die deutsch-österreichisch-ungarische Verständigung"
 AOEIW9_GER_dip_a_7_desc:0 "Berlin und Wien institutionalisieren eine arbeitsfähige Beziehung über Blockgrenzen hinweg; eine spätere Annäherung bleibt einer bewussten politischen Entscheidung vorbehalten."
 AOEIW9_GER_dip_b_1:0 "Das Rheinultimatum"
 AOEIW9_GER_dip_b_1_desc:0 "„Rheinultimatum“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Deutsches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_GER_dip_b_2:0 "Eine Mission zu „Rheinultimatum“ entsenden"
 AOEIW9_GER_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Rheinultimatum“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_GER_dip_b_3:0 "Wirtschaftlicher Druck: „Rheinultimatum“"
 AOEIW9_GER_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Rheinultimatum“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_GER_dip_b_4:0 "Stabsgespräche: „Rheinultimatum“"
 AOEIW9_GER_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Rheinultimatum“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_GER_dip_b_5:0 "Formelle Warnung: „Rheinultimatum“"
 AOEIW9_GER_dip_b_5_desc:0 "Eine formelle Warnung zu „Rheinultimatum“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_GER_dip_b_6:0 "Bedingungen für „Rheinultimatum“"
 AOEIW9_GER_dip_b_6_desc:0 "Für „Rheinultimatum“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_GER_dip_b_7:0 "Die Entscheidung über „Rheinultimatum“"
 AOEIW9_GER_dip_b_7_desc:0 "Bei „Rheinultimatum“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_GER_dip_final:0 "Eine Reichspakt-Gesamtstrategie"
 AOEIW9_GER_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Deutschland sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_GER_special_1:0 "Kriegsindustrie des Reiches"
 AOEIW9_GER_special_1_desc:0 "„Kriegsindustrie des Reiches“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Deutschland ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_GER_special_2:0 "Die zweite Krupp-Erweiterung"
 AOEIW9_GER_special_2_desc:0 "Die Regierung macht „Die zweite Krupp-Erweiterung“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Deutschland und nicht aus einer universellen Vorlage."
 AOEIW9_GER_special_3:0 "Das Ruhrgebiet rationalisieren"
 AOEIW9_GER_special_3_desc:0 "„Das Ruhrgebiet rationalisieren“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in Deutschland bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_GER_special_4:0 "Werkzeugmaschinen für den totalen Krieg"
 AOEIW9_GER_special_4_desc:0 "Mit „Werkzeugmaschinen für den totalen Krieg“ verpflichtet sich Deutsches Kaiserreich auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_GER_special_5:0 "Das Rüstungsministerium"
 AOEIW9_GER_special_5_desc:0 "„Das Rüstungsministerium“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Deutschland ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_GER_special_6:0 "Eine kontinentale Kriegswirtschaft"
 AOEIW9_GER_special_6_desc:0 "Die Regierung macht „Eine kontinentale Kriegswirtschaft“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Deutschland und nicht aus einer universellen Vorlage."
 AOEIW9_GER_special_7:0 "Deutsche Industrievorherrschaft"
 AOEIW9_GER_special_7_desc:0 "„Deutsche Industrievorherrschaft“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in Deutschland bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_GER_special_8:0 "Das Arsenal Europas"
 AOEIW9_GER_special_8_desc:0 "Mit „Das Arsenal Europas“ verpflichtet sich Deutsches Kaiserreich auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_GRE_focus_tree:0 "Kingdom of Greece Schwerpunktbaum"
 AOEIW9_GRE_politics_p1_2:0 "Hellenisches Parlament versöhnen"
 AOEIW9_GRE_politics_p1_2_desc:0 "Die Stellung von „Hellenisches Parlament“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Griechenland: Die konstitutionelle Monarchie“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_GRE_politics_p1_3:0 "Griechenland: Offiziersbund reformieren"
 AOEIW9_GRE_politics_p1_3_desc:0 "Die Verfahren von „Offiziersbund“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Griechenland: Die konstitutionelle Monarchie“ arbeitsfähig bleibt."
 AOEIW9_GRE_politics_p1_4:0 "Venizelistischer Block einbinden"
 AOEIW9_GRE_politics_p1_4_desc:0 "„Venizelistischer Block“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Griechenland: Die konstitutionelle Monarchie“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_GRE_politics_p1_5:0 "Griechenland: Königspalast und Nation"
 AOEIW9_GRE_politics_p1_5_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Griechenland: Die konstitutionelle Monarchie“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_GRE_politics_p2_2:0 "Griechenland: Offiziersbund öffnen"
 AOEIW9_GRE_politics_p2_2_desc:0 "Der Zugang zu „Offiziersbund“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Königliche Regierung“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_GRE_politics_p2_3:0 "Venizelistischer Block garantieren"
 AOEIW9_GRE_politics_p2_3_desc:0 "Die Stellung von „Venizelistischer Block“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Königliche Regierung“ einzubinden."
 AOEIW9_GRE_politics_p2_4:0 "Orthodox Church erweitern"
 AOEIW9_GRE_politics_p2_4_desc:0 "„Orthodox Church“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Königliche Regierung“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_GRE_politics_p2_5:0 "Eine neue Charta für Königreich Griechenland"
 AOEIW9_GRE_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Königliche Regierung“ in einen dauerhaften Rahmen für Griechenland. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_GRE_politics_p3_2:0 "Venizelistischer Block mobilisieren"
 AOEIW9_GRE_politics_p3_2_desc:0 "„Venizelistischer Block“ wird zu einem organisatorischen Träger des Projekts „Nationale Idee“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_GRE_politics_p3_3:0 "Die Macht von Orthodox Church brechen"
 AOEIW9_GRE_politics_p3_3_desc:0 "Die eigenständige Macht von „Orthodox Church“ ist mit dem Projekt „Nationale Idee“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_GRE_politics_p3_4:0 "Griechenland: Provinzpräfekten ersetzen"
 AOEIW9_GRE_politics_p3_4_desc:0 "„Provinzpräfekten“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationale Idee“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_GRE_politics_p3_5:0 "Neuordnung: Nationale Idee"
 AOEIW9_GRE_politics_p3_5_desc:0 "Der politische Konflikt um „Nationale Idee“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationale Idee“ untergeordnet werden."
 AOEIW9_GRE_politics_settlement:0 "Der Athener Ausgleich"
 AOEIW9_GRE_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Hellenisches Parlament und Offiziersbund eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Griechenland kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_GRE_eco_root:0 "Bestandsaufnahme: Hafenanlagen von Piräus"
 AOEIW9_GRE_eco_root_desc:0 "Hafenanlagen von Piräus, Industrie von Thessaloniki und Macedonian Straßen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Griechenland am schnellsten ausbauen kann."
 AOEIW9_GRE_eco_civ_2:0 "Schienen nach Industrie von Thessaloniki"
 AOEIW9_GRE_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Industrie von Thessaloniki“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_GRE_eco_civ_5:0 "Ausbau von Lavrion Minen"
 AOEIW9_GRE_eco_civ_5_desc:0 "Für „Lavrion Minen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_GRE_eco_civ_6:0 "Griechenland: Staatsbahnen erneuern"
 AOEIW9_GRE_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Griechenland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_GRE_eco_civ_7:0 "Eine zweite Schicht bei Hafenanlagen von Piräus"
 AOEIW9_GRE_eco_civ_7_desc:0 "Bei „Hafenanlagen von Piräus“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_GRE_eco_civ_8:0 "Öffentliche Bauprogramme bei der Industrie von Thessaloniki"
 AOEIW9_GRE_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Industrie von Thessaloniki“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_GRE_eco_civ_9:0 "Entwicklungsrat für Macedonian Straßen"
 AOEIW9_GRE_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Macedonian Straßen“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_GRE_eco_war_1:0 "Rüstungsaudit: Aegean Commerce"
 AOEIW9_GRE_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Aegean Commerce“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_GRE_eco_war_2:0 "Rüstungsaufträge für Lavrion Minen"
 AOEIW9_GRE_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Lavrion Minen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_GRE_eco_war_3:0 "Griechenland: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_GRE_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Griechenland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_GRE_eco_war_4:0 "Hafenanlagen von Piräus für die Aufrüstung ausbauen"
 AOEIW9_GRE_eco_war_4_desc:0 "Rund um „Hafenanlagen von Piräus“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_GRE_eco_war_5:0 "Industrie von Thessaloniki standardisieren"
 AOEIW9_GRE_eco_war_5_desc:0 "Die mit „Industrie von Thessaloniki“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_GRE_eco_war_6:0 "Nachtproduktion bei Macedonian Straßen"
 AOEIW9_GRE_eco_war_6_desc:0 "Bei „Macedonian Straßen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_GRE_eco_science_1:0 "Athen Polytechnic ausstatten"
 AOEIW9_GRE_eco_science_1_desc:0 "„Athen Polytechnic“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_GRE_eco_science_2:0 "Neue Labore an Akademie von Athen"
 AOEIW9_GRE_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Akademie von Athen“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_GRE_eco_science_3:0 "Angewandte Forschung an Hellenic Forschungsrat"
 AOEIW9_GRE_eco_science_3_desc:0 "„Hellenic Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_GRE_eco_science_4:0 "Industriephysik an Athen Polytechnic"
 AOEIW9_GRE_eco_science_4_desc:0 "Die Industriephysik an „Athen Polytechnic“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_GRE_eco_science_5:0 "Produktionsforschung an Akademie von Athen"
 AOEIW9_GRE_eco_science_5_desc:0 "Bei „Akademie von Athen“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_GRE_eco_infra_2:0 "Frachtkapazität bei Aegean Commerce"
 AOEIW9_GRE_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Aegean Commerce“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_GRE_eco_infra_3:0 "Arbeiterwohnungen bei Lavrion Minen"
 AOEIW9_GRE_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Lavrion Minen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_GRE_eco_infra_4:0 "Griechenland: Logistik über Staatsbahnen"
 AOEIW9_GRE_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Griechenland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_GRE_eco_final:0 "Die griechische Entwicklungswirtschaft"
 AOEIW9_GRE_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Griechenland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_GRE_mil_root:0 "Hellenic Generalstab überprüfen"
 AOEIW9_GRE_mil_root_desc:0 "„Hellenic Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_GRE_mil_army_2:0 "Feldmanöver mit Evzone Regiments"
 AOEIW9_GRE_mil_army_2_desc:0 "Großmanöver mit „Evzone Regiments“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_GRE_mil_army_5:0 "Stabshochschule Athen motorisieren"
 AOEIW9_GRE_mil_army_5_desc:0 "Der Motortransport von „Stabshochschule Athen“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_GRE_mil_army_6:0 "Stabsverfahren bei Hellenic Generalstab"
 AOEIW9_GRE_mil_army_6_desc:0 "Bei „Hellenic Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_GRE_mil_army_7:0 "Panzerstudien bei Evzone Regiments"
 AOEIW9_GRE_mil_army_7_desc:0 "„Evzone Regiments“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Griechenland zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_GRE_mil_air_1:0 "Königlich-hellenische Luftwaffe neu ordnen"
 AOEIW9_GRE_mil_air_1_desc:0 "„Königlich-hellenische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_GRE_mil_air_2:0 "Jagdfliegerausbildung bei Tatoi Fliegerhorst"
 AOEIW9_GRE_mil_air_2_desc:0 "„Tatoi Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_GRE_mil_air_3:0 "Bodenunterstützungsdoktrin unter Ägäis-Luftkommando"
 AOEIW9_GRE_mil_air_3_desc:0 "Unter „Ägäis-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_GRE_mil_air_4:0 "Die Reichweite von Königlich-hellenische Luftwaffe erhöhen"
 AOEIW9_GRE_mil_air_4_desc:0 "„Königlich-hellenische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Griechenland verlangen."
 AOEIW9_GRE_mil_air_5:0 "Radarnetze für Tatoi Fliegerhorst"
 AOEIW9_GRE_mil_air_5_desc:0 "„Tatoi Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_GRE_mil_sea_1:0 "Königlich-Hellenische Marine überprüfen"
 AOEIW9_GRE_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Hellenische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_GRE_mil_sea_2:0 "Ausbau: Marinestützpunkt Salamis"
 AOEIW9_GRE_mil_sea_2_desc:0 "„Marinestützpunkt Salamis“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_GRE_mil_sea_3:0 "Flottenmanöver mit Aegean Flotte"
 AOEIW9_GRE_mil_sea_3_desc:0 "Flottenmanöver mit „Aegean Flotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_GRE_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Hellenische Marine"
 AOEIW9_GRE_mil_sea_4_desc:0 "„Königlich-Hellenische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_GRE_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Salamis"
 AOEIW9_GRE_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Salamis“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_GRE_mil_final:0 "Gebirgsoffensive"
 AOEIW9_GRE_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Griechenland verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_GRE_dip_root:0 "Die Doktrin „Megali“ festlegen"
 AOEIW9_GRE_dip_root_desc:0 "Königreich Griechenland muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_GRE_dip_a_2:0 "Eine Mission zu „Aegean Frage“ entsenden"
 AOEIW9_GRE_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Aegean Frage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_GRE_dip_a_3:0 "Wirtschaftlicher Druck: „Aegean Frage“"
 AOEIW9_GRE_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Aegean Frage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_GRE_dip_a_4:0 "Stabsgespräche: „Aegean Frage“"
 AOEIW9_GRE_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Aegean Frage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_GRE_dip_a_5:0 "Formelle Warnung: „Aegean Frage“"
 AOEIW9_GRE_dip_a_5_desc:0 "Eine formelle Warnung zu „Aegean Frage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_GRE_dip_b_1:0 "Neuordnung: Balkan"
 AOEIW9_GRE_dip_b_1_desc:0 "„Balkan Ausgleich“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Griechenland tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_GRE_dip_b_2:0 "Eine Mission zu „Balkan Ausgleich“ entsenden"
 AOEIW9_GRE_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Balkan Ausgleich“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_GRE_dip_b_3:0 "Wirtschaftlicher Druck: „Balkan Ausgleich“"
 AOEIW9_GRE_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Balkan Ausgleich“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_GRE_dip_b_4:0 "Stabsgespräche: „Balkan Ausgleich“"
 AOEIW9_GRE_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Balkan Ausgleich“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_GRE_dip_b_5:0 "Formelle Warnung: „Balkan Ausgleich“"
 AOEIW9_GRE_dip_b_5_desc:0 "Eine formelle Warnung zu „Balkan Ausgleich“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_GRE_dip_final:0 "Athen und das östliche Mittelmeer"
 AOEIW9_GRE_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Griechenland sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_HOL_focus_tree:0 "Kingdom of the Netherlands Schwerpunktbaum"
 AOEIW9_HOL_politics_p1_2:0 "Generalstaaten versöhnen"
 AOEIW9_HOL_politics_p1_2_desc:0 "Die Stellung von „Generalstaaten“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Oranische Kompromiss“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_HOL_politics_p1_3:0 "Ministerrat reformieren"
 AOEIW9_HOL_politics_p1_3_desc:0 "Die Verfahren von „Ministerrat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Oranische Kompromiss“ arbeitsfähig bleibt."
 AOEIW9_HOL_politics_p1_4:0 "Pillar Organisations einbinden"
 AOEIW9_HOL_politics_p1_4_desc:0 "„Pillar Organisations“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Oranische Kompromiss“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_HOL_politics_p1_5:0 "Niederlande: Gewerkschaften ausbalancieren"
 AOEIW9_HOL_politics_p1_5_desc:0 "Weder die Ausschaltung von „Gewerkschaften“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Oranische Kompromiss“ austariert."
 AOEIW9_HOL_politics_p1_6:0 "Haus Oranien und Nation"
 AOEIW9_HOL_politics_p1_6_desc:0 "„Haus Oranien“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Oranische Kompromiss“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_HOL_politics_p2_2:0 "Ministerrat öffnen"
 AOEIW9_HOL_politics_p2_2_desc:0 "Der Zugang zu „Ministerrat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Generalstaaten gewinnen die Oberhand“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_HOL_politics_p2_3:0 "Pillar Organisations garantieren"
 AOEIW9_HOL_politics_p2_3_desc:0 "Die Stellung von „Pillar Organisations“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Generalstaaten gewinnen die Oberhand“ einzubinden."
 AOEIW9_HOL_politics_p2_4:0 "Niederlande: Gewerkschaften erweitern"
 AOEIW9_HOL_politics_p2_4_desc:0 "„Gewerkschaften“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Generalstaaten gewinnen die Oberhand“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_HOL_politics_p2_5:0 "Kolonialamt Verantwortung übertragen"
 AOEIW9_HOL_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Kolonialamt“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Generalstaaten gewinnen die Oberhand“ durch delegierte Autorität regieren kann."
 AOEIW9_HOL_politics_p2_6:0 "Eine neue Charta für Königreich der Niederlande"
 AOEIW9_HOL_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Generalstaaten gewinnen die Oberhand“ in einen dauerhaften Rahmen für die Niederlande. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_HOL_politics_p3_2:0 "Pillar Organisations mobilisieren"
 AOEIW9_HOL_politics_p3_2_desc:0 "„Pillar Organisations“ wird zu einem organisatorischen Träger des Projekts „Nationale Erneuerung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_HOL_politics_p3_3:0 "Niederlande: Die Macht von Gewerkschaften brechen"
 AOEIW9_HOL_politics_p3_3_desc:0 "Die eigenständige Macht von „Gewerkschaften“ ist mit dem Projekt „Nationale Erneuerung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_HOL_politics_p3_4:0 "Kolonialamt ersetzen"
 AOEIW9_HOL_politics_p3_4_desc:0 "„Kolonialamt“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationale Erneuerung“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_HOL_politics_p3_5:0 "Haus Oranien unter direkte Führung stellen"
 AOEIW9_HOL_politics_p3_5_desc:0 "„Haus Oranien“ wird den durch den Kurs „Nationale Erneuerung“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_HOL_politics_p3_6:0 "Neuordnung: Nationale Erneuerung"
 AOEIW9_HOL_politics_p3_6_desc:0 "Der politische Konflikt um „Nationale Erneuerung“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationale Erneuerung“ untergeordnet werden."
 AOEIW9_HOL_politics_settlement:0 "Der Oranische Ausgleich"
 AOEIW9_HOL_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Haus Oranien, Generalstaaten und Ministerrat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich der Niederlande kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_HOL_eco_root:0 "Bestandsaufnahme: Rotterdam Hafen"
 AOEIW9_HOL_eco_root_desc:0 "Rotterdam Hafen, Philips-Werke und Limburg Minen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich der Niederlande am schnellsten ausbauen kann."
 AOEIW9_HOL_eco_civ_2:0 "Schienen nach Philips-Werke"
 AOEIW9_HOL_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Philips-Werke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_HOL_eco_civ_5:0 "Ausbau von Zuiderzee Werke"
 AOEIW9_HOL_eco_civ_5_desc:0 "Für „Zuiderzee Werke“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_HOL_eco_civ_6:0 "Königliche Niederländische Schifffahrt erneuern"
 AOEIW9_HOL_eco_civ_6_desc:0 "„Königliche Niederländische Schifffahrt“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_HOL_eco_civ_7:0 "Eine zweite Schicht bei Rotterdam Hafen"
 AOEIW9_HOL_eco_civ_7_desc:0 "Bei „Rotterdam Hafen“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_HOL_eco_civ_8:0 "Öffentliche Bauprogramme bei den Philips-Werken"
 AOEIW9_HOL_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Philips-Werke“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_HOL_eco_war_1:0 "Rüstungsaudit: Amsterdam Finanzwesen"
 AOEIW9_HOL_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Amsterdam Finanzwesen“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_HOL_eco_war_2:0 "Rüstungsaufträge für Zuiderzee Werke"
 AOEIW9_HOL_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Zuiderzee Werke“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_HOL_eco_war_3:0 "Präzisionswerkzeuge für Königliche Niederländische Schifffahrt"
 AOEIW9_HOL_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Königliche Niederländische Schifffahrt“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_HOL_eco_war_4:0 "Rotterdam Hafen für die Aufrüstung ausbauen"
 AOEIW9_HOL_eco_war_4_desc:0 "Rund um „Rotterdam Hafen“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_HOL_eco_war_5:0 "Philips-Werke standardisieren"
 AOEIW9_HOL_eco_war_5_desc:0 "Die mit „Philips-Werke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_HOL_eco_war_6:0 "Nachtproduktion bei Limburg Minen"
 AOEIW9_HOL_eco_war_6_desc:0 "Bei „Limburg Minen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_HOL_eco_war_7:0 "Langfristige Verträge für Amsterdam Finanzwesen"
 AOEIW9_HOL_eco_war_7_desc:0 "Langfristige Verträge sichern „Amsterdam Finanzwesen“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_HOL_eco_science_1:0 "Delft Technische Universität ausstatten"
 AOEIW9_HOL_eco_science_1_desc:0 "„Delft Technische Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_HOL_eco_science_2:0 "Neue Labore an Philips Labore"
 AOEIW9_HOL_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Philips Labore“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_HOL_eco_science_3:0 "Angewandte Forschung an Königliche Akademie der Wissenschaften"
 AOEIW9_HOL_eco_science_3_desc:0 "„Königliche Akademie der Wissenschaften“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_HOL_eco_science_4:0 "Industriephysik an Delft Technische Universität"
 AOEIW9_HOL_eco_science_4_desc:0 "Die Industriephysik an „Delft Technische Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_HOL_eco_science_5:0 "Produktionsforschung an Philips Labore"
 AOEIW9_HOL_eco_science_5_desc:0 "Bei „Philips Labore“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_HOL_eco_science_6:0 "Forschungszuschüsse für Königliche Akademie der Wissenschaften"
 AOEIW9_HOL_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Königliche Akademie der Wissenschaften“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_HOL_eco_infra_2:0 "Frachtkapazität bei Amsterdam Finanzwesen"
 AOEIW9_HOL_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Amsterdam Finanzwesen“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_HOL_eco_infra_3:0 "Arbeiterwohnungen bei Zuiderzee Werke"
 AOEIW9_HOL_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Zuiderzee Werke“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_HOL_eco_infra_4:0 "Logistik über Königliche Niederländische Schifffahrt"
 AOEIW9_HOL_eco_infra_4_desc:0 "„Königliche Niederländische Schifffahrt“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_HOL_eco_final:0 "Das niederländische Handels- und Industriesystem"
 AOEIW9_HOL_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Niederlande wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_HOL_mil_root:0 "niederländischer Generalstab überprüfen"
 AOEIW9_HOL_mil_root_desc:0 "„Niederländischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_HOL_mil_army_2:0 "Feldmanöver mit Waterline Kommando"
 AOEIW9_HOL_mil_army_2_desc:0 "Großmanöver mit „Waterline Kommando“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_HOL_mil_army_5:0 "Niederlande: Königliche Militärakademie motorisieren"
 AOEIW9_HOL_mil_army_5_desc:0 "Der Motortransport von „Königliche Militärakademie“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann. In Niederlande gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_HOL_mil_army_6:0 "Stabsverfahren bei niederländischer Generalstab"
 AOEIW9_HOL_mil_army_6_desc:0 "Bei „Niederländischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_HOL_mil_army_7:0 "Panzerstudien bei Waterline Kommando"
 AOEIW9_HOL_mil_army_7_desc:0 "„Waterline Kommando“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in den Niederlanden zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_HOL_mil_army_8:0 "Operationsplanung bei Mobile Field Armee"
 AOEIW9_HOL_mil_army_8_desc:0 "Operationsplanung mit „Mobile Field Armee“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_HOL_mil_army_9:0 "Niederlande: Doktrin – Artillerieinspektion"
 AOEIW9_HOL_mil_army_9_desc:0 "Die von „Artillerieinspektion“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Niederlande gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_HOL_mil_air_1:0 "Königlich-niederländische Luftwaffe neu ordnen"
 AOEIW9_HOL_mil_air_1_desc:0 "„Königlich-niederländische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_HOL_mil_air_2:0 "Jagdfliegerausbildung bei Soesterberg Fliegerhorst"
 AOEIW9_HOL_mil_air_2_desc:0 "„Soesterberg Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_HOL_mil_air_3:0 "Bodenunterstützungsdoktrin unter Luftkommando der Niederlande"
 AOEIW9_HOL_mil_air_3_desc:0 "Unter „Luftkommando der Niederlande“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_HOL_mil_air_4:0 "Die Reichweite von Königlich-niederländische Luftwaffe erhöhen"
 AOEIW9_HOL_mil_air_4_desc:0 "„Königlich-niederländische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in den Niederlanden verlangen."
 AOEIW9_HOL_mil_air_5:0 "Radarnetze für Soesterberg Fliegerhorst"
 AOEIW9_HOL_mil_air_5_desc:0 "„Soesterberg Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_HOL_mil_air_6:0 "Das Luftkommando unter Luftkommando der Niederlande vereinigen"
 AOEIW9_HOL_mil_air_6_desc:0 "„Luftkommando der Niederlande“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_HOL_mil_sea_1:0 "Königlich-Niederländische Marine überprüfen"
 AOEIW9_HOL_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Niederländische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_HOL_mil_sea_2:0 "Ausbau: Den Helder Werft"
 AOEIW9_HOL_mil_sea_2_desc:0 "„Den Helder Werft“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_HOL_mil_sea_3:0 "Flottenmanöver mit East Indies Flotte"
 AOEIW9_HOL_mil_sea_3_desc:0 "Flottenmanöver mit „East Indies Flotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_HOL_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Niederländische Marine"
 AOEIW9_HOL_mil_sea_4_desc:0 "„Königlich-Niederländische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_HOL_mil_sea_5:0 "Marineflieger bei Den Helder Werft"
 AOEIW9_HOL_mil_sea_5_desc:0 "Marineflieger werden mit „Den Helder Werft“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_HOL_mil_sea_6:0 "Neue Schiffskörper für East Indies Flotte"
 AOEIW9_HOL_mil_sea_6_desc:0 "Neue Entwurfsstandards für „East Indies Flotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_HOL_mil_final:0 "Flexible Verteidigung"
 AOEIW9_HOL_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich der Niederlande verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_HOL_dip_root:0 "Die Doktrin „Orange Maritime“ festlegen"
 AOEIW9_HOL_dip_root_desc:0 "Königreich der Niederlande muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_HOL_dip_a_2:0 "Eine Mission zu „belgische Grenze“ entsenden"
 AOEIW9_HOL_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Belgische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_HOL_dip_a_3:0 "Wirtschaftlicher Druck: „belgische Grenze“"
 AOEIW9_HOL_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Belgische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_HOL_dip_a_4:0 "Stabsgespräche: „belgische Grenze“"
 AOEIW9_HOL_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Belgische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_HOL_dip_a_5:0 "Formelle Warnung: „belgische Grenze“"
 AOEIW9_HOL_dip_a_5_desc:0 "Eine formelle Warnung zu „Belgische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_HOL_dip_a_6:0 "Bedingungen für „belgische Grenze“"
 AOEIW9_HOL_dip_a_6_desc:0 "Für „Belgische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_HOL_dip_b_1:0 "Rotterdam und der Reichspakt"
 AOEIW9_HOL_dip_b_1_desc:0 "Rotterdams Handelsverbindungen machen die Niederlande wirtschaftlich zentral für den Reichspakt, ohne dass Zusammenarbeit politische Unterordnung bedeuten darf."
 AOEIW9_HOL_dip_b_2:0 "Die Berliner Handelsmission"
 AOEIW9_HOL_dip_b_2_desc:0 "Eine niederländische Handelsmission verhandelt berechenbaren Zugang zum deutschen Markt und wahrt zugleich die eigene Handelspolitik."
 AOEIW9_HOL_dip_b_3:0 "Rheinische Handelsprotokolle"
 AOEIW9_HOL_dip_b_3_desc:0 "Rheinschifffahrt, Zollpläne und Industrielieferungen werden in einen stabilen bilateralen Rahmen gebracht."
 AOEIW9_HOL_dip_b_4:0 "Kontinentale Transitplanung"
 AOEIW9_HOL_dip_b_4_desc:0 "Bahn-, Fluss- und Hafenplanung macht die niederländische Transitkapazität zu einem strategischen Vorteil des Kontinentalblocks."
 AOEIW9_HOL_dip_b_5:0 "Niederländische Autonomie sichern"
 AOEIW9_HOL_dip_b_5_desc:0 "Die Teilnahme an deutsch geführter Planung wird durch klare Sicherungen für niederländische Institutionen und Kolonialinteressen ausgeglichen."
 AOEIW9_HOL_dip_b_6:0 "Eine niederländische Säule des Reichspakts"
 AOEIW9_HOL_dip_b_6_desc:0 "Die Niederlande werden zur maritim-kommerziellen Säule des Reichspakts, ohne ihre eigenständige Strategie aufzugeben."
 AOEIW9_HOL_dip_final:0 "Die Niederlande im Reichspakt"
 AOEIW9_HOL_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in den Niederlanden sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_IRE_focus_tree:0 "Ireland Schwerpunktbaum"
 AOEIW9_IRE_politics_p1_2:0 "Exekutivrat versöhnen"
 AOEIW9_IRE_politics_p1_2_desc:0 "Die Stellung von „Exekutivrat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Konsens des Dáil“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_IRE_politics_p1_3:0 "Grafschaftsräte reformieren"
 AOEIW9_IRE_politics_p1_3_desc:0 "Die Verfahren von „Grafschaftsräte“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Konsens des Dáil“ arbeitsfähig bleibt."
 AOEIW9_IRE_politics_p1_4:0 "Republican Veterans einbinden"
 AOEIW9_IRE_politics_p1_4_desc:0 "„Republican Veterans“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Konsens des Dáil“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_IRE_politics_p1_5:0 "Dáil Éireann und Nation"
 AOEIW9_IRE_politics_p1_5_desc:0 "„Dáil Éireann“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Konsens des Dáil“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_IRE_politics_p2_2:0 "Grafschaftsräte öffnen"
 AOEIW9_IRE_politics_p2_2_desc:0 "Der Zugang zu „Grafschaftsräte“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Präsidiale Autorität“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_IRE_politics_p2_3:0 "Republican Veterans garantieren"
 AOEIW9_IRE_politics_p2_3_desc:0 "Die Stellung von „Republican Veterans“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Präsidiale Autorität“ einzubinden."
 AOEIW9_IRE_politics_p2_4:0 "Irland: Gewerkschaften erweitern"
 AOEIW9_IRE_politics_p2_4_desc:0 "„Gewerkschaften“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Präsidiale Autorität“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_IRE_politics_p2_5:0 "Eine neue Charta für Ireland"
 AOEIW9_IRE_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Präsidiale Autorität“ in einen dauerhaften Rahmen für „Ireland“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_IRE_politics_p3_2:0 "Republican Veterans mobilisieren"
 AOEIW9_IRE_politics_p3_2_desc:0 "„Republican Veterans“ wird zu einem organisatorischen Träger des Projekts „Republikanische Avantgarde“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_IRE_politics_p3_3:0 "Irland: Die Macht von Gewerkschaften brechen"
 AOEIW9_IRE_politics_p3_3_desc:0 "Die eigenständige Macht von „Gewerkschaften“ ist mit dem Projekt „Republikanische Avantgarde“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_IRE_politics_p3_4:0 "Church Hierarchy ersetzen"
 AOEIW9_IRE_politics_p3_4_desc:0 "„Church Hierarchy“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Republikanische Avantgarde“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_IRE_politics_p3_5:0 "Neuordnung: Republican Vanguard"
 AOEIW9_IRE_politics_p3_5_desc:0 "Der politische Konflikt um „Republican Vanguard“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Republikanische Avantgarde“ untergeordnet werden."
 AOEIW9_IRE_politics_settlement:0 "Der Dubliner Ausgleich"
 AOEIW9_IRE_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Dáil Éireann, Exekutivrat und Grafschaftsräte eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Irland kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_IRE_eco_root:0 "Bestandsaufnahme: Dublin Industrie"
 AOEIW9_IRE_eco_root_desc:0 "Dublin Industrie, Shannon-Programm und Cork Harbour arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Irland am schnellsten ausbauen kann."
 AOEIW9_IRE_eco_civ_2:0 "Schienen nach Shannon-Programm"
 AOEIW9_IRE_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Shannon-Programm“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_IRE_eco_civ_5:0 "Ausbau von irisch Eisenbahnen"
 AOEIW9_IRE_eco_civ_5_desc:0 "Für „Irisch Eisenbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_IRE_eco_civ_6:0 "Limerick Werkstätten erneuern"
 AOEIW9_IRE_eco_civ_6_desc:0 "„Limerick Werkstätten“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_IRE_eco_civ_7:0 "Eine zweite Schicht bei Dublin Industrie"
 AOEIW9_IRE_eco_civ_7_desc:0 "Bei „Dublin Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_IRE_eco_civ_8:0 "Öffentliche Bauprogramme im Shannon-Programm"
 AOEIW9_IRE_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Shannon-Programm“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_IRE_eco_civ_9:0 "Entwicklungsrat für Cork Harbour"
 AOEIW9_IRE_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Cork Harbour“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_IRE_eco_war_1:0 "Rüstungsaudit: Agricultural Kredit Rat"
 AOEIW9_IRE_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Agricultural Kredit Rat“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_IRE_eco_war_2:0 "Rüstungsaufträge für irisch Eisenbahnen"
 AOEIW9_IRE_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Irisch Eisenbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_IRE_eco_war_3:0 "Präzisionswerkzeuge für Limerick Werkstätten"
 AOEIW9_IRE_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Limerick Werkstätten“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_IRE_eco_war_4:0 "Dublin Industrie für die Aufrüstung ausbauen"
 AOEIW9_IRE_eco_war_4_desc:0 "Rund um „Dublin Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_IRE_eco_war_5:0 "Shannon-Programm standardisieren"
 AOEIW9_IRE_eco_war_5_desc:0 "Die mit „Shannon-Programm“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_IRE_eco_war_6:0 "Nachtproduktion bei Cork Harbour"
 AOEIW9_IRE_eco_war_6_desc:0 "Bei „Cork Harbour“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_IRE_eco_science_1:0 "University College Dublin ausstatten"
 AOEIW9_IRE_eco_science_1_desc:0 "„University College Dublin“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_IRE_eco_science_2:0 "Neue Labore an Dublin Institute of Technology"
 AOEIW9_IRE_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Dublin Institute of Technology“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_IRE_eco_science_3:0 "Angewandte Forschung an irischer Forschungsrat"
 AOEIW9_IRE_eco_science_3_desc:0 "„Irischer Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_IRE_eco_science_4:0 "Industriephysik an University College Dublin"
 AOEIW9_IRE_eco_science_4_desc:0 "Die Industriephysik an „University College Dublin“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_IRE_eco_science_5:0 "Produktionsforschung an Dublin Institute of Technology"
 AOEIW9_IRE_eco_science_5_desc:0 "Bei „Dublin Institute of Technology“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_IRE_eco_infra_2:0 "Frachtkapazität bei Agricultural Kredit Rat"
 AOEIW9_IRE_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Agricultural Kredit Rat“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_IRE_eco_infra_3:0 "Arbeiterwohnungen bei irisch Eisenbahnen"
 AOEIW9_IRE_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Irisch Eisenbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_IRE_eco_infra_4:0 "Logistik über Limerick Werkstätten"
 AOEIW9_IRE_eco_infra_4_desc:0 "„Limerick Werkstätten“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_IRE_eco_final:0 "Ein irischer Produktionsstaat"
 AOEIW9_IRE_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Irland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_IRE_mil_root:0 "irischer Generalstab überprüfen"
 AOEIW9_IRE_mil_root_desc:0 "„Irischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_IRE_mil_army_2:0 "Feldmanöver mit Streitkräfte"
 AOEIW9_IRE_mil_army_2_desc:0 "Großmanöver mit „Streitkräfte“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_IRE_mil_army_5:0 "Curragh Kommando motorisieren"
 AOEIW9_IRE_mil_army_5_desc:0 "Der Motortransport von „Curragh Kommando“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_IRE_mil_army_6:0 "Stabsverfahren bei irischer Generalstab"
 AOEIW9_IRE_mil_army_6_desc:0 "Bei „Irischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_IRE_mil_army_7:0 "Panzerstudien bei Streitkräfte"
 AOEIW9_IRE_mil_army_7_desc:0 "„Streitkräfte“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Irland zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_IRE_mil_air_1:0 "Irisches Fliegerkorps neu ordnen"
 AOEIW9_IRE_mil_air_1_desc:0 "„Irisches Fliegerkorps“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_IRE_mil_air_2:0 "Jagdfliegerausbildung bei Baldonnel Aerodrome"
 AOEIW9_IRE_mil_air_2_desc:0 "„Baldonnel Aerodrome“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_IRE_mil_air_3:0 "Bodenunterstützungsdoktrin unter Küsten-Luftpatrouille"
 AOEIW9_IRE_mil_air_3_desc:0 "Unter „Küsten-Luftpatrouille“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_IRE_mil_air_4:0 "Die Reichweite von Irisches Fliegerkorps erhöhen"
 AOEIW9_IRE_mil_air_4_desc:0 "„Irisches Fliegerkorps“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Irland verlangen."
 AOEIW9_IRE_mil_air_5:0 "Radarnetze für Baldonnel Aerodrome"
 AOEIW9_IRE_mil_air_5_desc:0 "„Baldonnel Aerodrome“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_IRE_mil_sea_1:0 "Coastal Dienst überprüfen"
 AOEIW9_IRE_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Coastal Dienst“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_IRE_mil_sea_2:0 "Ausbau: Marinestützpunkt Cork"
 AOEIW9_IRE_mil_sea_2_desc:0 "„Marinestützpunkt Cork“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_IRE_mil_sea_3:0 "Flottenmanöver mit Atlantic Patrouille"
 AOEIW9_IRE_mil_sea_3_desc:0 "Flottenmanöver mit „Atlantic Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_IRE_mil_sea_4:0 "Sicherungsdoktrin für Coastal Dienst"
 AOEIW9_IRE_mil_sea_4_desc:0 "„Coastal Dienst“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_IRE_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Cork"
 AOEIW9_IRE_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Cork“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_IRE_mil_final:0 "Territorialverteidigung"
 AOEIW9_IRE_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Irland verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_IRE_dip_root:0 "Die Doktrin „Emerald“ festlegen"
 AOEIW9_IRE_dip_root_desc:0 "Irland muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_IRE_dip_a_2:0 "Eine Mission zu „britisch Relationship“ entsenden"
 AOEIW9_IRE_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Britisch Relationship“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_IRE_dip_a_3:0 "Wirtschaftlicher Druck: „britisch Relationship“"
 AOEIW9_IRE_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Britisch Relationship“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_IRE_dip_a_4:0 "Stabsgespräche: „britisch Relationship“"
 AOEIW9_IRE_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Britisch Relationship“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_IRE_dip_a_5:0 "Formelle Warnung: „britisch Relationship“"
 AOEIW9_IRE_dip_a_5_desc:0 "Eine formelle Warnung zu „Britisch Relationship“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_IRE_dip_b_1:0 "Atlantische Neutralität"
 AOEIW9_IRE_dip_b_1_desc:0 "„Atlantic Neutrality“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Irland tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_IRE_dip_b_2:0 "Eine Mission zu „Atlantische Neutralität“ entsenden"
 AOEIW9_IRE_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Atlantic Neutrality“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_IRE_dip_b_3:0 "Wirtschaftlicher Druck: „Atlantische Neutralität“"
 AOEIW9_IRE_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Atlantic Neutrality“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_IRE_dip_b_4:0 "Stabsgespräche: „Atlantische Neutralität“"
 AOEIW9_IRE_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Atlantic Neutrality“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_IRE_dip_b_5:0 "Formelle Warnung: „Atlantische Neutralität“"
 AOEIW9_IRE_dip_b_5_desc:0 "Eine formelle Warnung zu „Atlantic Neutrality“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_IRE_dip_final:0 "Irland und das atlantische Gleichgewicht"
 AOEIW9_IRE_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Irland sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_ITA_focus_tree:0 "Kingdom of Italy Schwerpunktbaum"
 AOEIW9_ITA_politics_root:0 "Die Savoyer Krone und der Massenstaat"
 AOEIW9_ITA_politics_root_desc:0 "Die Macht in Italien verteilt sich auf Haus Savoyen, Abgeordnetenkammer und Großer Rat. Die Frage ist längst nicht mehr zeremoniell: Der Sieger bestimmt Haushalt, Offizierskorps und die Fähigkeit des Staates zum Handeln."
 AOEIW9_ITA_politics_p1_1:0 "Die königliche Regierung"
 AOEIW9_ITA_politics_p1_1_desc:0 "„Königliche Regierung“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Italien."
 AOEIW9_ITA_politics_p1_2:0 "Italien: Abgeordnetenkammer versöhnen"
 AOEIW9_ITA_politics_p1_2_desc:0 "Die Stellung von „Abgeordnetenkammer“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Königliche Regierung“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_ITA_politics_p1_3:0 "Großer Rat reformieren"
 AOEIW9_ITA_politics_p1_3_desc:0 "Die Verfahren von „Großer Rat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Königliche Regierung“ arbeitsfähig bleibt."
 AOEIW9_ITA_politics_p1_4:0 "Industrieverband einbinden"
 AOEIW9_ITA_politics_p1_4_desc:0 "„Industrieverband“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Königliche Regierung“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_ITA_politics_p1_5:0 "Italien: Gewerkschaften ausbalancieren"
 AOEIW9_ITA_politics_p1_5_desc:0 "Weder die Ausschaltung von „Gewerkschaften“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Königliche Regierung“ austariert."
 AOEIW9_ITA_politics_p1_6:0 "Prefectures gesetzlich ordnen"
 AOEIW9_ITA_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Prefectures“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Königliche Regierung“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_ITA_politics_p1_7:0 "Haus Savoyen und Nation"
 AOEIW9_ITA_politics_p1_7_desc:0 "„Haus Savoyen“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Königliche Regierung“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_ITA_politics_p2_1:0 "Korporativer Autoritarismus"
 AOEIW9_ITA_politics_p2_1_desc:0 "„Korporativer Autoritarismus“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Italien."
 AOEIW9_ITA_politics_p2_2:0 "Großer Rat öffnen"
 AOEIW9_ITA_politics_p2_2_desc:0 "Der Zugang zu „Großer Rat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Korporativer Autoritarismus“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_ITA_politics_p2_3:0 "Industrieverband garantieren"
 AOEIW9_ITA_politics_p2_3_desc:0 "Die Stellung von „Industrieverband“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Korporativer Autoritarismus“ einzubinden."
 AOEIW9_ITA_politics_p2_4:0 "Italien: Gewerkschaften erweitern"
 AOEIW9_ITA_politics_p2_4_desc:0 "„Gewerkschaften“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Korporativer Autoritarismus“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_ITA_politics_p2_5:0 "Prefectures Verantwortung übertragen"
 AOEIW9_ITA_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Prefectures“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Korporativer Autoritarismus“ durch delegierte Autorität regieren kann."
 AOEIW9_ITA_politics_p2_6:0 "Haus Savoyen ratifizieren"
 AOEIW9_ITA_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Haus Savoyen“ in der neuen Ordnung fest. Danach beruht der Kurs „Korporativer Autoritarismus“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_ITA_politics_p2_7:0 "Schreibt die Carta del Lavoro neu"
 AOEIW9_ITA_politics_p2_7_desc:0 "Das Regime macht aus der Carta del Lavoro Regeln für Löhne, Schlichtung und industrielle Führung. Die Korporationen müssen außerhalb des Paradesaals funktionieren."
 AOEIW9_ITA_politics_settlement:0 "Der konsolidierte Savoyer Staat"
 AOEIW9_ITA_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Haus Savoyen, Abgeordnetenkammer und Großer Rat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Italien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_ITA_eco_root:0 "Bestandsaufnahme: Industrie der Poebene"
 AOEIW9_ITA_eco_root_desc:0 "Industrie der Poebene, FIAT-Werke und Ansaldo-Werften arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Italien am schnellsten ausbauen kann."
 AOEIW9_ITA_eco_civ_1:0 "Industrie der Poebene vermessen"
 AOEIW9_ITA_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Industrie der Poebene“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_ITA_eco_civ_2:0 "Schienen nach FIAT-Werke"
 AOEIW9_ITA_eco_civ_2_desc:0 "Die Bahnverbindungen zu „FIAT-Werke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_ITA_eco_civ_3:0 "Kapital für Ansaldo-Werften"
 AOEIW9_ITA_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Ansaldo-Werften“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_ITA_eco_civ_4:0 "Strom für ILVA-Stahlwerke"
 AOEIW9_ITA_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „ILVA-Stahlwerke“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_ITA_eco_civ_5:0 "Verlängert die Autostrada dei Laghi"
 AOEIW9_ITA_eco_civ_5_desc:0 "Die Pionierstraße von Mailand wird zu Industriestädten und Alpenzufahrten verlängert. Der Motorverkehr zeigt, ob Italiens berühmte Autostrade ein Netz oder nur eine Sammlung von Vorzeigeprojekten sind."
 AOEIW9_ITA_eco_civ_6:0 "IRI-Beteiligungen erneuern"
 AOEIW9_ITA_eco_civ_6_desc:0 "„IRI-Beteiligungen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_ITA_eco_civ_7:0 "Eine zweite Schicht bei Industrie der Poebene"
 AOEIW9_ITA_eco_civ_7_desc:0 "Bei „Industrie der Poebene“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_ITA_eco_war_1:0 "Rüstungsaudit: ILVA-Stahlwerke"
 AOEIW9_ITA_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „ILVA-Stahlwerke“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_ITA_eco_war_2:0 "Militärverkehr auf den Autostrade"
 AOEIW9_ITA_eco_war_2_desc:0 "Ingenieure prüfen Brücken, Steigungen und Tankstellen für Kolonnen aus der Poebene. Die Straßen müssen ein Heer und nicht nur Reisewagen tragen."
 AOEIW9_ITA_eco_war_3:0 "Präzisionswerkzeuge für IRI-Beteiligungen"
 AOEIW9_ITA_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „IRI-Beteiligungen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_ITA_eco_war_4:0 "Industrie der Poebene für die Aufrüstung ausbauen"
 AOEIW9_ITA_eco_war_4_desc:0 "Rund um „Industrie der Poebene“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_ITA_eco_war_5:0 "FIAT-Werke standardisieren"
 AOEIW9_ITA_eco_war_5_desc:0 "Die mit „FIAT-Werke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_ITA_eco_war_6:0 "Nachtproduktion bei Ansaldo-Werften"
 AOEIW9_ITA_eco_war_6_desc:0 "Bei „Ansaldo-Werften“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_ITA_eco_war_7:0 "Langfristige Verträge für ILVA-Stahlwerke"
 AOEIW9_ITA_eco_war_7_desc:0 "Langfristige Verträge sichern „ILVA-Stahlwerke“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_ITA_eco_war_8:0 "Das Heer marschiert über die Autostrade"
 AOEIW9_ITA_eco_war_8_desc:0 "Vorrangspuren, Bergungsposten und Militärpolizei halten Mobilisierungskolonnen auf dem Weg nach Süden und Osten in Bewegung. Das Straßennetz wird Teil des Einsatzplans."
 AOEIW9_ITA_eco_science_1:0 "Politecnico di Milano ausstatten"
 AOEIW9_ITA_eco_science_1_desc:0 "„Politecnico di Milano“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_ITA_eco_science_2:0 "Neue Labore an Königliche Akademie Italiens"
 AOEIW9_ITA_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Königliche Akademie Italiens“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_ITA_eco_science_3:0 "Marconi und der CNR"
 AOEIW9_ITA_eco_science_3_desc:0 "Guglielmo Marconi verbindet über den Nationalen Forschungsrat Funkversuche mit Anforderungen von Marine, Luftwaffe und Industrie. Prestige muss Geräte hervorbringen, die im Feld funktionieren."
 AOEIW9_ITA_eco_science_4:0 "Industriephysik an Politecnico di Milano"
 AOEIW9_ITA_eco_science_4_desc:0 "Die Industriephysik an „Politecnico di Milano“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_ITA_eco_science_5:0 "Produktionsforschung an Königliche Akademie Italiens"
 AOEIW9_ITA_eco_science_5_desc:0 "Bei „Königliche Akademie Italiens“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_ITA_eco_science_6:0 "Mittel für die Labore des CNR"
 AOEIW9_ITA_eco_science_6_desc:0 "Längere Förderung hält Physiker, Chemiker und Ingenieure auch nach Fehlschlägen an ihren Arbeitstischen. Der Rat beurteilt Arbeiten nach Ergebnissen, die Italiens Industrie nachbauen kann."
 AOEIW9_ITA_eco_science_7:0 "Politecnico di Milano mit den Fabriken vernetzen"
 AOEIW9_ITA_eco_science_7_desc:0 "„Politecnico di Milano“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_ITA_eco_infra_1:0 "Energie für Ansaldo-Werften"
 AOEIW9_ITA_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Ansaldo-Werften“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_ITA_eco_infra_2:0 "Frachtkapazität bei ILVA-Stahlwerke"
 AOEIW9_ITA_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „ILVA-Stahlwerke“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_ITA_eco_infra_3:0 "Case popolari neben den Autobahnen"
 AOEIW9_ITA_eco_infra_3_desc:0 "Arbeiter an Straßen und Industrievorstädten brauchen bezahlbare Wohnungen nahe den neuen Routen. Kommunaler Wohnungsbau wächst neben dem gefeierten Beton."
 AOEIW9_ITA_eco_infra_4:0 "Logistik über IRI-Beteiligungen"
 AOEIW9_ITA_eco_infra_4_desc:0 "„IRI-Beteiligungen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_ITA_eco_final:0 "Das Industriesystem des IRI"
 AOEIW9_ITA_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Italien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ITA_mil_root:0 "Comando Supremo überprüfen"
 AOEIW9_ITA_mil_root_desc:0 "„Comando Supremo“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_ITA_mil_army_1:0 "Die Grandi Manovre"
 AOEIW9_ITA_mil_army_1_desc:0 "Große Manöver entlarven Divisionen auf dem Papier, ausfallende Funkgeräte und verspätete Nachschubkolonnen. Das Comando Supremo lernt im Feld, bevor es das nächste Doktrinrundschreiben verfasst."
 AOEIW9_ITA_mil_army_2:0 "Fanteria und Gebirgsfeuerkraft"
 AOEIW9_ITA_mil_army_2_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_ITA_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_ITA_mil_army_3_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_ITA_mil_army_4_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_5:0 "Die Divisioni Celere"
 AOEIW9_ITA_mil_army_5_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_ITA_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_ITA_mil_army_6_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_ITA_mil_army_7_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_ITA_mil_army_8_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_ITA_mil_army_9_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_ITA_mil_army_10_desc:0 "Italien benötigt Infanterie für schwieriges Gelände oder bewegliche Verbände mit verlässlichen Mittelmeerdepots. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_ITA_mil_air_1:0 "Regia Aeronautica neu ordnen"
 AOEIW9_ITA_mil_air_1_desc:0 "„Regia Aeronautica“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_ITA_mil_air_2:0 "Jagdfliegerausbildung bei Jagdfliegerschulen"
 AOEIW9_ITA_mil_air_2_desc:0 "„Jagdfliegerschulen“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_ITA_mil_air_3:0 "Italien: Bodenunterstützung – Strategisches Luftkommando"
 AOEIW9_ITA_mil_air_3_desc:0 "Unter „Strategisches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Italien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ITA_mil_air_4:0 "Die Reichweite von Regia Aeronautica erhöhen"
 AOEIW9_ITA_mil_air_4_desc:0 "„Regia Aeronautica“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Italien verlangen."
 AOEIW9_ITA_mil_air_5:0 "Radarnetze für Jagdfliegerschulen"
 AOEIW9_ITA_mil_air_5_desc:0 "„Jagdfliegerschulen“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_ITA_mil_air_6:0 "Italien: Einheitliches Luftkommando – Strategisches Luftkommando"
 AOEIW9_ITA_mil_air_6_desc:0 "„Strategisches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Italien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ITA_mil_air_7:0 "Regia Aeronautica wird einsatzreif"
 AOEIW9_ITA_mil_air_7_desc:0 "„Regia Aeronautica“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_ITA_mil_sea_1:0 "Regia Marina überprüfen"
 AOEIW9_ITA_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Regia Marina“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_ITA_mil_sea_2:0 "Ausbau: La Spezia Arsenal"
 AOEIW9_ITA_mil_sea_2_desc:0 "„La Spezia Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_ITA_mil_sea_3:0 "Flottenmanöver mit Mediterranean Battlefleet"
 AOEIW9_ITA_mil_sea_3_desc:0 "Flottenmanöver mit „Mediterranean Battlefleet“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_ITA_mil_sea_4:0 "Sicherungsdoktrin für Regia Marina"
 AOEIW9_ITA_mil_sea_4_desc:0 "„Regia Marina“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_ITA_mil_sea_5:0 "Marineflieger bei La Spezia Arsenal"
 AOEIW9_ITA_mil_sea_5_desc:0 "Marineflieger werden mit „La Spezia Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_ITA_mil_sea_6:0 "Neue Schiffskörper für Mediterranean Battlefleet"
 AOEIW9_ITA_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Mediterranean Battlefleet“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_ITA_mil_sea_7:0 "Seeoberkommando unter Regia Marina"
 AOEIW9_ITA_mil_sea_7_desc:0 "„Regia Marina“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Italien wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_ITA_mil_final:0 "Bewegliche Kriegführung"
 AOEIW9_ITA_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Italien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_ITA_dip_root:0 "Die Doktrin „Roman Mediterranean“ festlegen"
 AOEIW9_ITA_dip_root_desc:0 "Königreich Italien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_ITA_dip_a_1:0 "Die Alpenrivalität"
 AOEIW9_ITA_dip_a_1_desc:0 "„Alpenrivalität“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Italien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ITA_dip_a_2:0 "Eine Mission zu „Alpenrivalität“ entsenden"
 AOEIW9_ITA_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Alpenrivalität“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ITA_dip_a_3:0 "Wirtschaftlicher Druck: „Alpenrivalität“"
 AOEIW9_ITA_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Alpenrivalität“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ITA_dip_a_4:0 "Stabsgespräche: „Alpenrivalität“"
 AOEIW9_ITA_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Alpenrivalität“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ITA_dip_a_5:0 "Formelle Warnung: „Alpenrivalität“"
 AOEIW9_ITA_dip_a_5_desc:0 "Eine formelle Warnung zu „Alpenrivalität“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ITA_dip_a_6:0 "Bedingungen für „Alpenrivalität“"
 AOEIW9_ITA_dip_a_6_desc:0 "Für „Alpenrivalität“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_ITA_dip_a_7:0 "Die Entscheidung über „Alpenrivalität“"
 AOEIW9_ITA_dip_a_7_desc:0 "Bei „Alpenrivalität“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_ITA_dip_b_1:0 "Mare Nostrum"
 AOEIW9_ITA_dip_b_1_desc:0 "„Mare Nostrum“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Italien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ITA_dip_b_2:0 "Eine Mission zu „Mare Nostrum“ entsenden"
 AOEIW9_ITA_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Mare Nostrum“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ITA_dip_b_3:0 "Wirtschaftlicher Druck: „Mare Nostrum“"
 AOEIW9_ITA_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Mare Nostrum“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ITA_dip_b_4:0 "Stabsgespräche: „Mare Nostrum“"
 AOEIW9_ITA_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Mare Nostrum“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ITA_dip_b_5:0 "Formelle Warnung: „Mare Nostrum“"
 AOEIW9_ITA_dip_b_5_desc:0 "Eine formelle Warnung zu „Mare Nostrum“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ITA_dip_b_6:0 "Bedingungen für „Mare Nostrum“"
 AOEIW9_ITA_dip_b_6_desc:0 "Für „Mare Nostrum“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_ITA_dip_b_7:0 "Die Entscheidung über „Mare Nostrum“"
 AOEIW9_ITA_dip_b_7_desc:0 "Bei „Mare Nostrum“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_ITA_dip_final:0 "Führung der Mittelmeerliga"
 AOEIW9_ITA_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Italien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_JAP_focus_tree:0 "Japanese Empire Schwerpunktbaum"
 AOEIW9_JAP_politics_root:0 "Ein Kaiserreich am Rand der Krise"
 AOEIW9_JAP_politics_root_desc:0 "Kaiserlicher Reichstag, Kronrat und Heeresministerium beanspruchen alle Einfluss auf die Zukunft in Japan. Eine dauerhafte Ordnung muss ihre Rechte jetzt festlegen, bevor ein Notstand dies mit Gewalt tut."
 AOEIW9_JAP_politics_p1_1:0 "Die Regierung setzt sich durch"
 AOEIW9_JAP_politics_p1_1_desc:0 "Das Kabinett isoliert die Putschisten, säubert das Offizierskorps von seinen rücksichtslosesten Elementen und hält den Kaiser über den Fraktionen. Japans Expansion folgt disziplinierter Staatspolitik statt einer Regierung durch Attentate."
 AOEIW9_JAP_politics_p1_2:0 "Die alten Staatsmänner beugen sich"
 AOEIW9_JAP_politics_p1_2_desc:0 "Die höchsten Berater akzeptieren das Kabinettsprogramm, statt hinter Palasttüren eine weitere Regierung zu stürzen. Ihr Zugang zum Thron bleibt, doch Obstruktion hat nun einen öffentlichen Preis."
 AOEIW9_JAP_politics_p1_3:0 "Heeresministerium reformieren"
 AOEIW9_JAP_politics_p1_3_desc:0 "Die Verfahren von „Heeresministerium“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Regierung setzt sich durch“ arbeitsfähig bleibt."
 AOEIW9_JAP_politics_p1_4:0 "Marineministerium einbinden"
 AOEIW9_JAP_politics_p1_4_desc:0 "„Marineministerium“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Regierung setzt sich durch“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_JAP_politics_p1_5:0 "Genrō Elders ausbalancieren"
 AOEIW9_JAP_politics_p1_5_desc:0 "Weder die Ausschaltung von „Genrō Elders“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Regierung setzt sich durch“ austariert."
 AOEIW9_JAP_politics_p1_6:0 "Civil Bureaucracy gesetzlich ordnen"
 AOEIW9_JAP_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Civil Bureaucracy“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Regierung setzt sich durch“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_JAP_politics_p1_7:0 "Kaiserlicher Reichstag und Nation"
 AOEIW9_JAP_politics_p1_7_desc:0 "„Kaiserlicher Reichstag“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Regierung setzt sich durch“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_JAP_politics_p2_1:0 "Der kaiserliche Weg"
 AOEIW9_JAP_politics_p2_1_desc:0 "Die Kōdōha verspricht eine geistige Restauration unter Führung junger Offiziere, agrarischer Patrioten und des Heeres. Parteikabinette und Industriekartelle müssen sich der unmittelbaren kaiserlichen Herrschaft beugen."
 AOEIW9_JAP_politics_p2_2:0 "Heeresministerium öffnen"
 AOEIW9_JAP_politics_p2_2_desc:0 "Der Zugang zu „Heeresministerium“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Kaiserliche Weg“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_JAP_politics_p2_3:0 "Marineministerium garantieren"
 AOEIW9_JAP_politics_p2_3_desc:0 "Die Stellung von „Marineministerium“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Kaiserliche Weg“ einzubinden."
 AOEIW9_JAP_politics_p2_4:0 "Genrō Elders erweitern"
 AOEIW9_JAP_politics_p2_4_desc:0 "„Genrō Elders“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Kaiserliche Weg“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_JAP_politics_p2_5:0 "Civil Bureaucracy Verantwortung übertragen"
 AOEIW9_JAP_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Civil Bureaucracy“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Kaiserliche Weg“ durch delegierte Autorität regieren kann."
 AOEIW9_JAP_politics_p2_6:0 "Kaiserlicher Reichstag ratifizieren"
 AOEIW9_JAP_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Kaiserlicher Reichstag“ in der neuen Ordnung fest. Danach beruht der Kurs „Kaiserliche Weg“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_JAP_politics_p2_7:0 "Regierung unter der Meiji-Verfassung"
 AOEIW9_JAP_politics_p2_7_desc:0 "Minister beanspruchen die Verfassungsrechte von Kabinett und Reichstag gegen informellen Hofdruck. Kaiserliche Zustimmung bestätigt eine Regierung, die ihre eigene Politik verantwortet."
 AOEIW9_JAP_politics_p3_1:0 "Vorrang der Zivilregierung"
 AOEIW9_JAP_politics_p3_1_desc:0 "Reichstag, zivile Ministerien und Verfassungsberater holen die Macht von den Teilstreitkräften zurück. Begrenzte Militärhaushalte und parlamentarische Kontrolle eröffnen Japan eine Zukunft jenseits des permanenten Ausnahmezustands."
 AOEIW9_JAP_politics_p3_2:0 "Marineministerium mobilisieren"
 AOEIW9_JAP_politics_p3_2_desc:0 "„Marineministerium“ wird zu einem organisatorischen Träger des Projekts „Vorrang der Zivilregierung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_JAP_politics_p3_3:0 "Die Macht von Genrō Elders brechen"
 AOEIW9_JAP_politics_p3_3_desc:0 "Die eigenständige Macht von „Genrō Elders“ ist mit dem Projekt „Vorrang der Zivilregierung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_JAP_politics_p3_4:0 "Civil Bureaucracy ersetzen"
 AOEIW9_JAP_politics_p3_4_desc:0 "„Civil Bureaucracy“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Vorrang der Zivilregierung“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_JAP_politics_p3_5:0 "Kaiserlicher Reichstag unter direkte Führung stellen"
 AOEIW9_JAP_politics_p3_5_desc:0 "„Kaiserlicher Reichstag“ wird den durch den Kurs „Vorrang der Zivilregierung“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_JAP_politics_p3_6:0 "Nehmt dem Geheimen Rat sein Veto"
 AOEIW9_JAP_politics_p3_6_desc:0 "Verträge und Notverordnungen werden nicht länger von lebenslang ernannten Räten ohne Rechenschaft aufgehalten. Beratung des Kaisers darf keine dritte Kammer bilden."
 AOEIW9_JAP_politics_p3_7:0 "Der Reichstag führt das Kabinett"
 AOEIW9_JAP_politics_p3_7_desc:0 "Ein Ministerium, das die gewählte Kammer verliert, muss zurücktreten oder sich ihr erneut stellen. Zivile Vorherrschaft wird zur geltenden Regierungsregel."
 AOEIW9_JAP_politics_settlement:0 "Der Kaiser ernennt seine Regierung"
 AOEIW9_JAP_politics_settlement_desc:0 "Der Streit zwischen Hof, Reichstag und Teilstreitkräften endet, als der Kaiser eine Regierung nach Regeln beauftragt, die alle Seiten kennen. Tokio besitzt nun eine Verantwortungskette."
 AOEIW9_JAP_eco_root:0 "Bestandsaufnahme: Tokio-Yokohama Belt"
 AOEIW9_JAP_eco_root_desc:0 "Tokio-Yokohama Belt, Osaka Arsenal und Kure Werften arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Kaiserreich Japan am schnellsten ausbauen kann."
 AOEIW9_JAP_eco_civ_1:0 "Tokio-Yokohama Belt vermessen"
 AOEIW9_JAP_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Tokio-Yokohama Belt“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_JAP_eco_civ_2:0 "Schienen nach Osaka Arsenal"
 AOEIW9_JAP_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Osaka Arsenal“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_JAP_eco_civ_3:0 "Kapital für Kure Werften"
 AOEIW9_JAP_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Kure Werften“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_JAP_eco_civ_4:0 "Strom für Manchurian Industrie"
 AOEIW9_JAP_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Manchurian Industrie“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_JAP_eco_civ_5:0 "Ausbau von Zaibatsu Kredit"
 AOEIW9_JAP_eco_civ_5_desc:0 "Für „Zaibatsu Kredit“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_JAP_eco_civ_6:0 "Entwicklung Koreas erneuern"
 AOEIW9_JAP_eco_civ_6_desc:0 "„Entwicklung Koreas“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_JAP_eco_civ_7:0 "Eine zweite Schicht bei Tokio-Yokohama Belt"
 AOEIW9_JAP_eco_civ_7_desc:0 "Bei „Tokio-Yokohama Belt“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_JAP_eco_war_1:0 "Rüstungsaudit: Manchurian Industrie"
 AOEIW9_JAP_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Manchurian Industrie“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_JAP_eco_war_2:0 "Rüstungsaufträge für Zaibatsu Kredit"
 AOEIW9_JAP_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Zaibatsu Kredit“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_JAP_eco_war_3:0 "Präzisionswerkzeuge für Entwicklung Koreas"
 AOEIW9_JAP_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Entwicklung Koreas“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_JAP_eco_war_4:0 "Tokio-Yokohama Belt für die Aufrüstung ausbauen"
 AOEIW9_JAP_eco_war_4_desc:0 "Rund um „Tokio-Yokohama Belt“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_JAP_eco_war_5:0 "Osaka Arsenal standardisieren"
 AOEIW9_JAP_eco_war_5_desc:0 "Die mit „Osaka Arsenal“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_JAP_eco_war_6:0 "Nachtproduktion bei Kure Werften"
 AOEIW9_JAP_eco_war_6_desc:0 "Bei „Kure Werften“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_JAP_eco_war_7:0 "Langfristige Verträge für Manchurian Industrie"
 AOEIW9_JAP_eco_war_7_desc:0 "Langfristige Verträge sichern „Manchurian Industrie“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_JAP_eco_war_8:0 "Zaibatsu Kredit für volle Produktion mobilisieren"
 AOEIW9_JAP_eco_war_8_desc:0 "„Zaibatsu Kredit“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_JAP_eco_science_1:0 "RIKEN Institut ausstatten"
 AOEIW9_JAP_eco_science_1_desc:0 "„RIKEN Institut“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_JAP_eco_science_2:0 "Neue Labore an Tokio Kaiserlich Universität"
 AOEIW9_JAP_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Tokio Kaiserlich Universität“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_JAP_eco_science_3:0 "Angewandte Forschung an Marinetechnische Abteilung"
 AOEIW9_JAP_eco_science_3_desc:0 "„Marinetechnische Abteilung“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_JAP_eco_science_4:0 "Industriephysik an RIKEN Institut"
 AOEIW9_JAP_eco_science_4_desc:0 "Die Industriephysik an „RIKEN Institut“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_JAP_eco_science_5:0 "Produktionsforschung an Tokio Kaiserlich Universität"
 AOEIW9_JAP_eco_science_5_desc:0 "Bei „Tokio Kaiserlich Universität“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_JAP_eco_science_6:0 "Forschungszuschüsse für Marinetechnische Abteilung"
 AOEIW9_JAP_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Marinetechnische Abteilung“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_JAP_eco_science_7:0 "RIKEN Institut mit den Fabriken vernetzen"
 AOEIW9_JAP_eco_science_7_desc:0 "„RIKEN Institut“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_JAP_eco_infra_1:0 "Energie für Kure Werften"
 AOEIW9_JAP_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Kure Werften“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_JAP_eco_infra_2:0 "Frachtkapazität bei Manchurian Industrie"
 AOEIW9_JAP_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Manchurian Industrie“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_JAP_eco_infra_3:0 "Arbeiterwohnungen bei Zaibatsu Kredit"
 AOEIW9_JAP_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Zaibatsu Kredit“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_JAP_eco_infra_4:0 "Logistik über Entwicklung Koreas"
 AOEIW9_JAP_eco_infra_4_desc:0 "„Entwicklung Koreas“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_JAP_eco_final:0 "Aufträge für Mitsubishi und Mitsui"
 AOEIW9_JAP_eco_final_desc:0 "Werften, Banken und Schwerbetriebe der großen Konzerne erhalten abgestimmte Staatsaufträge. Dafür gehorchen Stahl, Kredit und Schiffsraum dem Mobilmachungsplan."
 AOEIW9_JAP_mil_root:0 "Japan: Kaiserlicher Generalstab überprüfen"
 AOEIW9_JAP_mil_root_desc:0 "„Kaiserlicher Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind. In Japan gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_JAP_mil_army_1:0 "Die Manöver der Kwantung-Armee"
 AOEIW9_JAP_mil_army_1_desc:0 "Feldübungen zeigen, ob Kontinentalverbände Munition, Treibstoff und Funkgeräte so schnell bewegen wie Stäbe Pfeile auf Karten. Tokio erhält die Ergebnisse vor jeder Expansion."
 AOEIW9_JAP_mil_army_2:0 "Die Regimentsschlacht"
 AOEIW9_JAP_mil_army_2_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_JAP_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_JAP_mil_army_3_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_JAP_mil_army_4_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_5:0 "Selbständige Panzergruppen"
 AOEIW9_JAP_mil_army_5_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_JAP_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_JAP_mil_army_6_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_JAP_mil_army_7_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_JAP_mil_army_8_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_JAP_mil_army_9_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_JAP_mil_army_10_desc:0 "Japan kann leichte Regimentseinsätze verbessern oder knappe Ausbilder und Treibstoffe in moderne Panzerverbände investieren. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_JAP_mil_air_1:0 "Kaiserlich-Japanische Heeresluftwaffe neu ordnen"
 AOEIW9_JAP_mil_air_1_desc:0 "„Kaiserlich-Japanische Heeresluftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_JAP_mil_air_2:0 "Jagdfliegerausbildung bei Marinefliegerbüro"
 AOEIW9_JAP_mil_air_2_desc:0 "„Marinefliegerbüro“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_JAP_mil_air_3:0 "Bodenunterstützungsdoktrin unter Gemeinsames Luftkommando"
 AOEIW9_JAP_mil_air_3_desc:0 "Unter „Gemeinsames Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_JAP_mil_air_4:0 "Die Reichweite von Kaiserlich-Japanische Heeresluftwaffe erhöhen"
 AOEIW9_JAP_mil_air_4_desc:0 "„Kaiserlich-Japanische Heeresluftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Japan verlangen."
 AOEIW9_JAP_mil_air_5:0 "Radarnetze für Marinefliegerbüro"
 AOEIW9_JAP_mil_air_5_desc:0 "„Marinefliegerbüro“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_JAP_mil_air_6:0 "Das Luftkommando unter Gemeinsames Luftkommando vereinigen"
 AOEIW9_JAP_mil_air_6_desc:0 "„Gemeinsames Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_JAP_mil_air_7:0 "Kaiserlich-Japanische Heeresluftwaffe wird einsatzreif"
 AOEIW9_JAP_mil_air_7_desc:0 "„Kaiserlich-Japanische Heeresluftwaffe“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_JAP_mil_sea_1:0 "Kaiserlich-Japanische Marine überprüfen"
 AOEIW9_JAP_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Kaiserlich-Japanische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_JAP_mil_sea_2:0 "Ausbau: Marinearsenal Kure"
 AOEIW9_JAP_mil_sea_2_desc:0 "„Marinearsenal Kure“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_JAP_mil_sea_3:0 "Flottenmanöver mit Combined Flotte"
 AOEIW9_JAP_mil_sea_3_desc:0 "Flottenmanöver mit „Combined Flotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_JAP_mil_sea_4:0 "Sicherungsdoktrin für Kaiserlich-Japanische Marine"
 AOEIW9_JAP_mil_sea_4_desc:0 "„Kaiserlich-Japanische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_JAP_mil_sea_5:0 "Marineflieger bei Marinearsenal Kure"
 AOEIW9_JAP_mil_sea_5_desc:0 "Marineflieger werden mit „Marinearsenal Kure“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_JAP_mil_sea_6:0 "Neue Schiffskörper für Combined Flotte"
 AOEIW9_JAP_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Combined Flotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_JAP_mil_sea_7:0 "Seeoberkommando unter Kaiserlich-Japanische Marine"
 AOEIW9_JAP_mil_sea_7_desc:0 "„Kaiserlich-Japanische Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Japan wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_JAP_mil_final:0 "Entscheidungsschlacht"
 AOEIW9_JAP_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Kaiserreich Japan verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_JAP_dip_root:0 "Die Doktrin „Kaiserlich Expansion“ festlegen"
 AOEIW9_JAP_dip_root_desc:0 "Kaiserreich Japan muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_JAP_dip_a_1:0 "Der China-Zwischenfall"
 AOEIW9_JAP_dip_a_1_desc:0 "„China-Zwischenfall“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Kaiserreich Japan tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_JAP_dip_a_2:0 "Eine Mission zu „China-Zwischenfall“ entsenden"
 AOEIW9_JAP_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „China-Zwischenfall“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_JAP_dip_a_3:0 "Wirtschaftlicher Druck: „China-Zwischenfall“"
 AOEIW9_JAP_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „China-Zwischenfall“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_JAP_dip_a_4:0 "Stabsgespräche: „China-Zwischenfall“"
 AOEIW9_JAP_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „China-Zwischenfall“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_JAP_dip_a_5:0 "Formelle Warnung: „China-Zwischenfall“"
 AOEIW9_JAP_dip_a_5_desc:0 "Eine formelle Warnung zu „China-Zwischenfall“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_JAP_dip_a_6:0 "Bedingungen für „China-Zwischenfall“"
 AOEIW9_JAP_dip_a_6_desc:0 "Für „China-Zwischenfall“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_JAP_dip_a_7:0 "Die Entscheidung über „China-Zwischenfall“"
 AOEIW9_JAP_dip_a_7_desc:0 "Bei „China-Zwischenfall“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_JAP_dip_b_1:0 "Die Nordstrategie"
 AOEIW9_JAP_dip_b_1_desc:0 "„Nordstrategie“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Kaiserreich Japan tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_JAP_dip_b_2:0 "Eine Mission zu „Nordstrategie“ entsenden"
 AOEIW9_JAP_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Nordstrategie“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_JAP_dip_b_3:0 "Wirtschaftlicher Druck: „Nordstrategie“"
 AOEIW9_JAP_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Nordstrategie“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_JAP_dip_b_4:0 "Stabsgespräche: „Nordstrategie“"
 AOEIW9_JAP_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Nordstrategie“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_JAP_dip_b_5:0 "Formelle Warnung: „Nordstrategie“"
 AOEIW9_JAP_dip_b_5_desc:0 "Eine formelle Warnung zu „Nordstrategie“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_JAP_dip_b_6:0 "Bedingungen für „Nordstrategie“"
 AOEIW9_JAP_dip_b_6_desc:0 "Für „Nordstrategie“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_JAP_dip_b_7:0 "Die Entscheidung über „Nordstrategie“"
 AOEIW9_JAP_dip_b_7_desc:0 "Bei „Nordstrategie“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_JAP_dip_final:0 "Der imperiale Verteidigungsring"
 AOEIW9_JAP_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Japan sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_JAP_special_1:0 "Südliche Rohstoffzone"
 AOEIW9_JAP_special_1_desc:0 "„Südliche Rohstoffzone“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Japan ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_JAP_special_2:0 "Die Seewege sichern"
 AOEIW9_JAP_special_2_desc:0 "Die Regierung macht „Die Seewege sichern“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Japan und nicht aus einer universellen Vorlage."
 AOEIW9_JAP_special_3:0 "Die Philippinenfrage"
 AOEIW9_JAP_special_3_desc:0 "„Die Philippinenfrage“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in Japan bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_JAP_special_4:0 "Das Embargo brechen"
 AOEIW9_JAP_special_4_desc:0 "Mit „Das „Embargo“ brechen“ verpflichtet sich Kaiserreich Japan auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_JAP_special_5:0 "Vorrang der Flugzeugträger"
 AOEIW9_JAP_special_5_desc:0 "„Vorrang der Flugzeugträger“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Japan ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_JAP_special_6:0 "Langstreckenluftfahrt"
 AOEIW9_JAP_special_6_desc:0 "Die Regierung macht „Langstreckenluftfahrt“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Japan und nicht aus einer universellen Vorlage."
 AOEIW9_JAP_special_7:0 "Der Pazifikkriegsplan"
 AOEIW9_JAP_special_7_desc:0 "„Der Pazifikkriegsplan“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in Japan bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_JAP_special_8:0 "Reich der aufgehenden Sonne"
 AOEIW9_JAP_special_8_desc:0 "Mit „Reich der aufgehenden Sonne“ verpflichtet sich Kaiserreich Japan auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_MEX_focus_tree:0 "Mexico Schwerpunktbaum"
 AOEIW9_MEX_politics_p1_2:0 "Mexiko: Präsidialamt versöhnen"
 AOEIW9_MEX_politics_p1_2_desc:0 "Die Stellung von „Präsidialamt“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Institutionelle Regierung“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_MEX_politics_p1_3:0 "Heeresgeneräle reformieren"
 AOEIW9_MEX_politics_p1_3_desc:0 "Die Verfahren von „Heeresgeneräle“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Institutionelle Regierung“ arbeitsfähig bleibt."
 AOEIW9_MEX_politics_p1_4:0 "Gewerkschaftsbund einbinden"
 AOEIW9_MEX_politics_p1_4_desc:0 "„Gewerkschaftsbund“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Institutionelle Regierung“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_MEX_politics_p1_5:0 "Bauernbünde ausbalancieren"
 AOEIW9_MEX_politics_p1_5_desc:0 "Weder die Ausschaltung von „Bauernbünde“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Institutionelle Regierung“ austariert."
 AOEIW9_MEX_politics_p1_6:0 "Bundeskongress und Nation"
 AOEIW9_MEX_politics_p1_6_desc:0 "„Bundeskongress“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Institutionelle Regierung“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_MEX_politics_p2_2:0 "Heeresgeneräle öffnen"
 AOEIW9_MEX_politics_p2_2_desc:0 "Der Zugang zu „Heeresgeneräle“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Caudillo-Staat“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_MEX_politics_p2_3:0 "Gewerkschaftsbund garantieren"
 AOEIW9_MEX_politics_p2_3_desc:0 "Die Stellung von „Gewerkschaftsbund“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Caudillo-Staat“ einzubinden."
 AOEIW9_MEX_politics_p2_4:0 "Bauernbünde erweitern"
 AOEIW9_MEX_politics_p2_4_desc:0 "„Bauernbünde“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Caudillo-Staat“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_MEX_politics_p2_5:0 "Staatsgouverneure Verantwortung übertragen"
 AOEIW9_MEX_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Staatsgouverneure“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Caudillo-Staat“ durch delegierte Autorität regieren kann."
 AOEIW9_MEX_politics_p2_6:0 "Eine neue Charta für Mexico"
 AOEIW9_MEX_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Caudillo-Staat“ in einen dauerhaften Rahmen für „Mexico“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_MEX_politics_p3_2:0 "Gewerkschaftsbund mobilisieren"
 AOEIW9_MEX_politics_p3_2_desc:0 "„Gewerkschaftsbund“ wird zu einem organisatorischen Träger des Projekts „Soziale Revolution“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_MEX_politics_p3_3:0 "Die Macht von Bauernbünde brechen"
 AOEIW9_MEX_politics_p3_3_desc:0 "Die eigenständige Macht von „Bauernbünde“ ist mit dem Projekt „Soziale Revolution“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_MEX_politics_p3_4:0 "Staatsgouverneure ersetzen"
 AOEIW9_MEX_politics_p3_4_desc:0 "„Staatsgouverneure“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Soziale Revolution“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_MEX_politics_p3_5:0 "Bundeskongress unter direkte Führung stellen"
 AOEIW9_MEX_politics_p3_5_desc:0 "„Bundeskongress“ wird den durch den Kurs „Soziale Revolution“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_MEX_politics_p3_6:0 "Neuordnung: Social Revolution"
 AOEIW9_MEX_politics_p3_6_desc:0 "Der politische Konflikt um „Social Revolution“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Soziale Revolution“ untergeordnet werden."
 AOEIW9_MEX_politics_settlement:0 "Der nachrevolutionäre Ausgleich"
 AOEIW9_MEX_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Bundeskongress, Präsidialamt und Heeresgeneräle eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Mexiko kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_MEX_eco_root:0 "Bestandsaufnahme: Monterrey Industrie"
 AOEIW9_MEX_eco_root_desc:0 "Monterrey Industrie, PEMEX-Ölfelder und Staatsbahnen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Mexiko am schnellsten ausbauen kann."
 AOEIW9_MEX_eco_civ_2:0 "Schienen nach PEMEX-Ölfelder"
 AOEIW9_MEX_eco_civ_2_desc:0 "Die Bahnverbindungen zu „PEMEX-Ölfelder“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_MEX_eco_civ_5:0 "Ausbau von Veracruz Hafen"
 AOEIW9_MEX_eco_civ_5_desc:0 "Für „Veracruz Hafen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_MEX_eco_civ_6:0 "Agrarkreditbank erneuern"
 AOEIW9_MEX_eco_civ_6_desc:0 "„Agrarkreditbank“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_MEX_eco_civ_7:0 "Eine zweite Schicht bei Monterrey Industrie"
 AOEIW9_MEX_eco_civ_7_desc:0 "Bei „Monterrey Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_MEX_eco_civ_8:0 "Öffentliche Bauprogramme bei den PEMEX-Ölfeldern"
 AOEIW9_MEX_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „PEMEX-Ölfelder“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_MEX_eco_war_1:0 "Rüstungsaudit: Mexico City Werkstätten"
 AOEIW9_MEX_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Mexico City Werkstätten“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_MEX_eco_war_2:0 "Rüstungsaufträge für Veracruz Hafen"
 AOEIW9_MEX_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Veracruz Hafen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_MEX_eco_war_3:0 "Präzisionswerkzeuge für Agrarkreditbank"
 AOEIW9_MEX_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Agrarkreditbank“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_MEX_eco_war_4:0 "Monterrey Industrie für die Aufrüstung ausbauen"
 AOEIW9_MEX_eco_war_4_desc:0 "Rund um „Monterrey Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_MEX_eco_war_5:0 "PEMEX-Ölfelder standardisieren"
 AOEIW9_MEX_eco_war_5_desc:0 "Die mit „PEMEX-Ölfelder“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_MEX_eco_war_6:0 "Nachtproduktion bei Staatsbahnen"
 AOEIW9_MEX_eco_war_6_desc:0 "Bei „Staatsbahnen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_MEX_eco_war_7:0 "Langfristige Verträge für Mexico City Werkstätten"
 AOEIW9_MEX_eco_war_7_desc:0 "Langfristige Verträge sichern „Mexico City Werkstätten“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_MEX_eco_science_1:0 "Instituto Politécnico Nacional ausstatten"
 AOEIW9_MEX_eco_science_1_desc:0 "„Instituto Politécnico Nacional“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_MEX_eco_science_2:0 "Neue Labore an UNAM Labore"
 AOEIW9_MEX_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „UNAM Labore“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_MEX_eco_science_3:0 "Angewandte Forschung an mexikanischer Forschungsrat"
 AOEIW9_MEX_eco_science_3_desc:0 "„Mexikanischer Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_MEX_eco_science_4:0 "Industriephysik an Instituto Politécnico Nacional"
 AOEIW9_MEX_eco_science_4_desc:0 "Die Industriephysik an „Instituto Politécnico Nacional“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_MEX_eco_science_5:0 "Produktionsforschung an UNAM Labore"
 AOEIW9_MEX_eco_science_5_desc:0 "Bei „UNAM Labore“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_MEX_eco_science_6:0 "Forschungszuschüsse für mexikanischer Forschungsrat"
 AOEIW9_MEX_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Mexikanischer Forschungsrat“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_MEX_eco_infra_2:0 "Frachtkapazität bei Mexico City Werkstätten"
 AOEIW9_MEX_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Mexico City Werkstätten“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_MEX_eco_infra_3:0 "Arbeiterwohnungen bei Veracruz Hafen"
 AOEIW9_MEX_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Veracruz Hafen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_MEX_eco_infra_4:0 "Logistik über Agrarkreditbank"
 AOEIW9_MEX_eco_infra_4_desc:0 "„Agrarkreditbank“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_MEX_eco_final:0 "Der mexikanische Entwicklungsstaat"
 AOEIW9_MEX_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Mexiko wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_MEX_mil_root:0 "mexikanischer Generalstab überprüfen"
 AOEIW9_MEX_mil_root_desc:0 "„Mexikanischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_MEX_mil_army_2:0 "Feldmanöver mit Bundesheer"
 AOEIW9_MEX_mil_army_2_desc:0 "Großmanöver mit „Bundesheer“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_MEX_mil_army_5:0 "Militärakademie Chapultepec motorisieren"
 AOEIW9_MEX_mil_army_5_desc:0 "Der Motortransport von „Militärakademie Chapultepec“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_MEX_mil_army_6:0 "Stabsverfahren bei mexikanischer Generalstab"
 AOEIW9_MEX_mil_army_6_desc:0 "Bei „Mexikanischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_MEX_mil_army_7:0 "Panzerstudien bei Bundesheer"
 AOEIW9_MEX_mil_army_7_desc:0 "„Bundesheer“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Mexiko zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_MEX_mil_army_8:0 "Operationsplanung bei Cavalry Brigades"
 AOEIW9_MEX_mil_army_8_desc:0 "Operationsplanung mit „Cavalry Brigades“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_MEX_mil_army_9:0 "Mexiko: Doktrin – Artilleriedirektorat"
 AOEIW9_MEX_mil_army_9_desc:0 "Die von „Artilleriedirektorat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Mexiko gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_MEX_mil_air_1:0 "Mexikanische Luftwaffe neu ordnen"
 AOEIW9_MEX_mil_air_1_desc:0 "„Mexikanische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_MEX_mil_air_2:0 "Jagdfliegerausbildung bei Flugplatz Balbuena"
 AOEIW9_MEX_mil_air_2_desc:0 "„Flugplatz Balbuena“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_MEX_mil_air_3:0 "Mexiko: Bodenunterstützung – Golf-Luftkommando"
 AOEIW9_MEX_mil_air_3_desc:0 "Unter „Golf-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Mexiko gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_MEX_mil_air_4:0 "Die Reichweite von Mexikanische Luftwaffe erhöhen"
 AOEIW9_MEX_mil_air_4_desc:0 "„Mexikanische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Mexiko verlangen."
 AOEIW9_MEX_mil_air_5:0 "Radarnetze für Flugplatz Balbuena"
 AOEIW9_MEX_mil_air_5_desc:0 "„Flugplatz Balbuena“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_MEX_mil_air_6:0 "Das Luftkommando unter Golf-Luftkommando vereinigen"
 AOEIW9_MEX_mil_air_6_desc:0 "„Golf-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_MEX_mil_sea_1:0 "Gulf Geschwader überprüfen"
 AOEIW9_MEX_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Gulf Geschwader“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_MEX_mil_sea_2:0 "Ausbau: Marinewerft Veracruz"
 AOEIW9_MEX_mil_sea_2_desc:0 "„Marinewerft Veracruz“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_MEX_mil_sea_3:0 "Flottenmanöver mit Pacific Patrouille"
 AOEIW9_MEX_mil_sea_3_desc:0 "Flottenmanöver mit „Pacific Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_MEX_mil_sea_4:0 "Sicherungsdoktrin für Gulf Geschwader"
 AOEIW9_MEX_mil_sea_4_desc:0 "„Gulf Geschwader“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_MEX_mil_sea_5:0 "Marineflieger bei Marinewerft Veracruz"
 AOEIW9_MEX_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Veracruz“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_MEX_mil_sea_6:0 "Neue Schiffskörper für Pacific Patrouille"
 AOEIW9_MEX_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Pacific Patrouille“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_MEX_mil_final:0 "Mexiko: Mobile Verteidigung"
 AOEIW9_MEX_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Mexiko verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_MEX_dip_root:0 "Die Doktrin „mexikanisch Continental“ festlegen"
 AOEIW9_MEX_dip_root_desc:0 "Mexiko muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_MEX_dip_a_2:0 "Eine Mission zu „Koloss im Norden“ entsenden"
 AOEIW9_MEX_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Koloss im Norden“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_MEX_dip_a_3:0 "Wirtschaftlicher Druck: „Koloss im Norden“"
 AOEIW9_MEX_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Koloss im Norden“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_MEX_dip_a_4:0 "Stabsgespräche: „Koloss im Norden“"
 AOEIW9_MEX_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Koloss im Norden“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_MEX_dip_a_5:0 "Formelle Warnung: „Koloss im Norden“"
 AOEIW9_MEX_dip_a_5_desc:0 "Eine formelle Warnung zu „Koloss im Norden“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_MEX_dip_a_6:0 "Bedingungen für „Koloss im Norden“"
 AOEIW9_MEX_dip_a_6_desc:0 "Für „Koloss im Norden“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_MEX_dip_b_1:0 "Caribbean Sphere"
 AOEIW9_MEX_dip_b_1_desc:0 "„Caribbean Sphere“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Mexiko tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_MEX_dip_b_2:0 "Eine Mission zu „Caribbean Sphere“ entsenden"
 AOEIW9_MEX_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Caribbean Sphere“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_MEX_dip_b_3:0 "Wirtschaftlicher Druck: „Caribbean Sphere“"
 AOEIW9_MEX_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Caribbean Sphere“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_MEX_dip_b_4:0 "Stabsgespräche: „Caribbean Sphere“"
 AOEIW9_MEX_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Caribbean Sphere“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_MEX_dip_b_5:0 "Formelle Warnung: „Caribbean Sphere“"
 AOEIW9_MEX_dip_b_5_desc:0 "Eine formelle Warnung zu „Caribbean Sphere“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_MEX_dip_b_6:0 "Bedingungen für „Caribbean Sphere“"
 AOEIW9_MEX_dip_b_6_desc:0 "Für „Caribbean Sphere“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_MEX_dip_final:0 "Mexikos kontinentale Stellung"
 AOEIW9_MEX_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Mexiko sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_NOR_focus_tree:0 "Kingdom of Norway Schwerpunktbaum"
 AOEIW9_NOR_politics_p1_2:0 "Königspalast versöhnen"
 AOEIW9_NOR_politics_p1_2_desc:0 "Die Stellung von „Königspalast“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Konsens des Storting“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_NOR_politics_p1_3:0 "Arbeiterbewegung reformieren"
 AOEIW9_NOR_politics_p1_3_desc:0 "Die Verfahren von „Arbeiterbewegung“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Konsens des Storting“ arbeitsfähig bleibt."
 AOEIW9_NOR_politics_p1_4:0 "Reedereimagnaten einbinden"
 AOEIW9_NOR_politics_p1_4_desc:0 "„Reedereimagnaten“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Konsens des Storting“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_NOR_politics_p1_5:0 "Storting und Nation"
 AOEIW9_NOR_politics_p1_5_desc:0 "„Storting“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Konsens des Storting“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_NOR_politics_p2_2:0 "Arbeiterbewegung öffnen"
 AOEIW9_NOR_politics_p2_2_desc:0 "Der Zugang zu „Arbeiterbewegung“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Norwegen: Königliche Treuhandschaft“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_NOR_politics_p2_3:0 "Reedereimagnaten garantieren"
 AOEIW9_NOR_politics_p2_3_desc:0 "Die Stellung von „Reedereimagnaten“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Norwegen: Königliche Treuhandschaft“ einzubinden."
 AOEIW9_NOR_politics_p2_4:0 "Norwegen: Grafschaftsräte erweitern"
 AOEIW9_NOR_politics_p2_4_desc:0 "„Grafschaftsräte“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Norwegen: Königliche Treuhandschaft“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_NOR_politics_p2_5:0 "Eine neue Charta für Königreich Norwegen"
 AOEIW9_NOR_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Norwegen: Königliche Treuhandschaft“ in einen dauerhaften Rahmen für Norwegen. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_NOR_politics_p3_2:0 "Reedereimagnaten mobilisieren"
 AOEIW9_NOR_politics_p3_2_desc:0 "„Reedereimagnaten“ wird zu einem organisatorischen Träger des Projekts „Norwegen: Nationale Mobilmachung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_NOR_politics_p3_3:0 "Norwegen: Die Macht von Grafschaftsräte brechen"
 AOEIW9_NOR_politics_p3_3_desc:0 "Die eigenständige Macht von „Grafschaftsräte“ ist mit dem Projekt „Norwegen: Nationale Mobilmachung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_NOR_politics_p3_4:0 "Norwegen: Verteidigungskommission ersetzen"
 AOEIW9_NOR_politics_p3_4_desc:0 "„Verteidigungskommission“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Norwegen: Nationale Mobilmachung“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_NOR_politics_p3_5:0 "Norwegen: Neuordnung: nationale Mobilmachung"
 AOEIW9_NOR_politics_p3_5_desc:0 "Der politische Konflikt um „Nationale Mobilmachung“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Norwegen: Nationale Mobilmachung“ untergeordnet werden."
 AOEIW9_NOR_politics_settlement:0 "Der Osloer Ausgleich"
 AOEIW9_NOR_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Storting, Königspalast und Arbeiterbewegung eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Norwegen kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_NOR_eco_root:0 "Bestandsaufnahme: Oslo Industrie"
 AOEIW9_NOR_eco_root_desc:0 "Oslo Industrie, Hydroelectric Rat und Bergener Schifffahrt arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Norwegen am schnellsten ausbauen kann."
 AOEIW9_NOR_eco_civ_2:0 "Schienen nach Hydroelectric Rat"
 AOEIW9_NOR_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Hydroelectric Rat“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_NOR_eco_civ_5:0 "Ausbau von Trondheim Werkstätten"
 AOEIW9_NOR_eco_civ_5_desc:0 "Für „Trondheim Werkstätten“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_NOR_eco_civ_6:0 "Norwegen: Staatsbahnen erneuern"
 AOEIW9_NOR_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Norwegen wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_NOR_eco_civ_7:0 "Eine zweite Schicht bei Oslo Industrie"
 AOEIW9_NOR_eco_civ_7_desc:0 "Bei „Oslo Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_NOR_eco_civ_8:0 "Öffentliche Bauprogramme bei Hydroelectric Rat"
 AOEIW9_NOR_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Hydroelectric Rat“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_NOR_eco_civ_9:0 "Entwicklungsrat für Bergener Schifffahrt"
 AOEIW9_NOR_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Bergener Schifffahrt“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_NOR_eco_war_1:0 "Rüstungsaudit: Narvik Ore Route"
 AOEIW9_NOR_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Narvik Ore Route“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_NOR_eco_war_2:0 "Rüstungsaufträge für Trondheim Werkstätten"
 AOEIW9_NOR_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Trondheim Werkstätten“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_NOR_eco_war_3:0 "Norwegen: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_NOR_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Norwegen wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_NOR_eco_war_4:0 "Oslo Industrie für die Aufrüstung ausbauen"
 AOEIW9_NOR_eco_war_4_desc:0 "Rund um „Oslo Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_NOR_eco_war_5:0 "Hydroelectric Rat standardisieren"
 AOEIW9_NOR_eco_war_5_desc:0 "Die mit „Hydroelectric Rat“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_NOR_eco_war_6:0 "Nachtproduktion bei Bergener Schifffahrt"
 AOEIW9_NOR_eco_war_6_desc:0 "Bei „Bergener Schifffahrt“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_NOR_eco_science_1:0 "Universität Oslo ausstatten"
 AOEIW9_NOR_eco_science_1_desc:0 "„Universität Oslo“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_NOR_eco_science_2:0 "Neue Labore an norwegisch Technisches Institut"
 AOEIW9_NOR_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Norwegisch Technisches Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_NOR_eco_science_3:0 "Angewandte Forschung an Defence Forschungsrat"
 AOEIW9_NOR_eco_science_3_desc:0 "„Defence Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_NOR_eco_science_4:0 "Industriephysik an Universität Oslo"
 AOEIW9_NOR_eco_science_4_desc:0 "Die Industriephysik an „Universität Oslo“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_NOR_eco_science_5:0 "Produktionsforschung an norwegisch Technisches Institut"
 AOEIW9_NOR_eco_science_5_desc:0 "Bei „Norwegisch Technisches Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_NOR_eco_infra_2:0 "Frachtkapazität bei Narvik Ore Route"
 AOEIW9_NOR_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Narvik Ore Route“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_NOR_eco_infra_3:0 "Arbeiterwohnungen bei Trondheim Werkstätten"
 AOEIW9_NOR_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Trondheim Werkstätten“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_NOR_eco_infra_4:0 "Norwegen: Logistik über Staatsbahnen"
 AOEIW9_NOR_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Norwegen wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_NOR_eco_final:0 "Der norwegische Industriepakt"
 AOEIW9_NOR_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Norwegen wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_NOR_mil_root:0 "norwegischer Generalstab überprüfen"
 AOEIW9_NOR_mil_root_desc:0 "„Norwegischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_NOR_mil_army_2:0 "Feldmanöver mit Nordbrigaden"
 AOEIW9_NOR_mil_army_2_desc:0 "Großmanöver mit „Nordbrigaden“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_NOR_mil_army_5:0 "Stabshochschule motorisieren"
 AOEIW9_NOR_mil_army_5_desc:0 "Der Motortransport von „Stabshochschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_NOR_mil_army_6:0 "Stabsverfahren bei norwegischer Generalstab"
 AOEIW9_NOR_mil_army_6_desc:0 "Bei „Norwegischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_NOR_mil_army_7:0 "Panzerstudien bei Nordbrigaden"
 AOEIW9_NOR_mil_army_7_desc:0 "„Nordbrigaden“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Norwegen zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_NOR_mil_air_1:0 "Königlich-norwegische Luftwaffe neu ordnen"
 AOEIW9_NOR_mil_air_1_desc:0 "„Königlich-norwegische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_NOR_mil_air_2:0 "Jagdfliegerausbildung bei Kjeller Fliegerstation"
 AOEIW9_NOR_mil_air_2_desc:0 "„Kjeller Fliegerstation“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_NOR_mil_air_3:0 "Norwegen: Bodenunterstützung – Nördliches Luftkommando"
 AOEIW9_NOR_mil_air_3_desc:0 "Unter „Nördliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Norwegen gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_NOR_mil_air_4:0 "Die Reichweite von Königlich-norwegische Luftwaffe erhöhen"
 AOEIW9_NOR_mil_air_4_desc:0 "„Königlich-norwegische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Norwegen verlangen."
 AOEIW9_NOR_mil_air_5:0 "Radarnetze für Kjeller Fliegerstation"
 AOEIW9_NOR_mil_air_5_desc:0 "„Kjeller Fliegerstation“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_NOR_mil_sea_1:0 "Königlich-Norwegische Marine überprüfen"
 AOEIW9_NOR_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Norwegische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_NOR_mil_sea_2:0 "Ausbau: Marinewerft Horten"
 AOEIW9_NOR_mil_sea_2_desc:0 "„Marinewerft Horten“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_NOR_mil_sea_3:0 "Flottenmanöver mit North Sea Patrouille"
 AOEIW9_NOR_mil_sea_3_desc:0 "Flottenmanöver mit „North Sea Patrouille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_NOR_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Norwegische Marine"
 AOEIW9_NOR_mil_sea_4_desc:0 "„Königlich-Norwegische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_NOR_mil_sea_5:0 "Marineflieger bei Marinewerft Horten"
 AOEIW9_NOR_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Horten“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_NOR_mil_final:0 "Winterverteidigung"
 AOEIW9_NOR_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Norwegen verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_NOR_dip_root:0 "Die Doktrin „Northern Maritime“ festlegen"
 AOEIW9_NOR_dip_root_desc:0 "Königreich Norwegen muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_NOR_dip_a_2:0 "Eine Mission zu „schwedisch Neighbour“ entsenden"
 AOEIW9_NOR_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Schwedisch Neighbour“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_NOR_dip_a_3:0 "Wirtschaftlicher Druck: „schwedisch Neighbour“"
 AOEIW9_NOR_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Schwedisch Neighbour“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_NOR_dip_a_4:0 "Stabsgespräche: „schwedisch Neighbour“"
 AOEIW9_NOR_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Schwedisch Neighbour“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_NOR_dip_a_5:0 "Formelle Warnung: „schwedisch Neighbour“"
 AOEIW9_NOR_dip_a_5_desc:0 "Eine formelle Warnung zu „Schwedisch Neighbour“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_NOR_dip_b_1:0 "Atlantic Lifeline"
 AOEIW9_NOR_dip_b_1_desc:0 "„Atlantic Lifeline“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Norwegen tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_NOR_dip_b_2:0 "Eine Mission zu „Atlantic Lifeline“ entsenden"
 AOEIW9_NOR_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Atlantic Lifeline“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_NOR_dip_b_3:0 "Wirtschaftlicher Druck: „Atlantic Lifeline“"
 AOEIW9_NOR_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Atlantic Lifeline“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_NOR_dip_b_4:0 "Stabsgespräche: „Atlantic Lifeline“"
 AOEIW9_NOR_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Atlantic Lifeline“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_NOR_dip_b_5:0 "Formelle Warnung: „Atlantic Lifeline“"
 AOEIW9_NOR_dip_b_5_desc:0 "Eine formelle Warnung zu „Atlantic Lifeline“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_NOR_dip_final:0 "Norwegens Nordstrategie"
 AOEIW9_NOR_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Norwegen sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_PER_focus_tree:0 "Persian Empire Schwerpunktbaum"
 AOEIW9_PER_politics_p1_2:0 "Madschlis versöhnen"
 AOEIW9_PER_politics_p1_2_desc:0 "Die Stellung von „Madschlis“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Imperiale Modernisierung“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_PER_politics_p1_3:0 "Stammesnotabeln reformieren"
 AOEIW9_PER_politics_p1_3_desc:0 "Die Verfahren von „Stammesnotabeln“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Imperiale Modernisierung“ arbeitsfähig bleibt."
 AOEIW9_PER_politics_p1_4:0 "Clerical Establishment einbinden"
 AOEIW9_PER_politics_p1_4_desc:0 "„Clerical Establishment“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Imperiale Modernisierung“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_PER_politics_p1_5:0 "Heeresoffiziere ausbalancieren"
 AOEIW9_PER_politics_p1_5_desc:0 "Weder die Ausschaltung von „Heeresoffiziere“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Imperiale Modernisierung“ austariert."
 AOEIW9_PER_politics_p1_6:0 "Persien: Kaiserhof und Nation"
 AOEIW9_PER_politics_p1_6_desc:0 "„Kaiserhof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Imperiale Modernisierung“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_PER_politics_p2_2:0 "Stammesnotabeln öffnen"
 AOEIW9_PER_politics_p2_2_desc:0 "Der Zugang zu „Stammesnotabeln“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Madschlis-Pakt“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_PER_politics_p2_3:0 "Clerical Establishment garantieren"
 AOEIW9_PER_politics_p2_3_desc:0 "Die Stellung von „Clerical Establishment“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Madschlis-Pakt“ einzubinden."
 AOEIW9_PER_politics_p2_4:0 "Persien: Heeresoffiziere erweitern"
 AOEIW9_PER_politics_p2_4_desc:0 "„Heeresoffiziere“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Madschlis-Pakt“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_PER_politics_p2_5:0 "Persien: Provinzgouverneure Verantwortung übertragen"
 AOEIW9_PER_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Provinzgouverneure“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Madschlis-Pakt“ durch delegierte Autorität regieren kann."
 AOEIW9_PER_politics_p2_6:0 "Eine neue Charta für persisch Empire"
 AOEIW9_PER_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Madschlis-Pakt“ in einen dauerhaften Rahmen für „Persisch Empire“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_PER_politics_p3_2:0 "Clerical Establishment mobilisieren"
 AOEIW9_PER_politics_p3_2_desc:0 "„Clerical Establishment“ wird zu einem organisatorischen Träger des Projekts „Nationalen Offiziere“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_PER_politics_p3_3:0 "Persien: Die Macht von Heeresoffiziere brechen"
 AOEIW9_PER_politics_p3_3_desc:0 "Die eigenständige Macht von „Heeresoffiziere“ ist mit dem Projekt „Nationalen Offiziere“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_PER_politics_p3_4:0 "Persien: Provinzgouverneure ersetzen"
 AOEIW9_PER_politics_p3_4_desc:0 "„Provinzgouverneure“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationalen Offiziere“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_PER_politics_p3_5:0 "Persien: Kaiserhof unter direkte Führung stellen"
 AOEIW9_PER_politics_p3_5_desc:0 "„Kaiserhof“ wird den durch den Kurs „Nationalen Offiziere“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_PER_politics_p3_6:0 "Neuordnung: Nationale Offiziere"
 AOEIW9_PER_politics_p3_6_desc:0 "Der politische Konflikt um „Nationale Offiziere“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationalen Offiziere“ untergeordnet werden."
 AOEIW9_PER_politics_settlement:0 "Der Teheraner Ausgleich"
 AOEIW9_PER_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Kaiserhof, Madschlis und Stammesnotabeln eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Persien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_PER_eco_root:0 "Bestandsaufnahme: Abadan Ölfelder"
 AOEIW9_PER_eco_root_desc:0 "Abadan Ölfelder, Transiranische Eisenbahn und Teheran Werkstätten arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Persien am schnellsten ausbauen kann."
 AOEIW9_PER_eco_civ_2:0 "Schienen nach Transiranische Eisenbahn"
 AOEIW9_PER_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Transiranische Eisenbahn“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_PER_eco_civ_5:0 "Ausbau von Isfahan Industrie"
 AOEIW9_PER_eco_civ_5_desc:0 "Für „Isfahan Industrie“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_PER_eco_civ_6:0 "Persien: Nationalbank erneuern"
 AOEIW9_PER_eco_civ_6_desc:0 "„Nationalbank“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_eco_civ_7:0 "Eine zweite Schicht bei Abadan Ölfelder"
 AOEIW9_PER_eco_civ_7_desc:0 "Bei „Abadan Ölfelder“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_PER_eco_civ_8:0 "Öffentliche Bauprogramme bei der Transiranischen Eisenbahn"
 AOEIW9_PER_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Transiranische Eisenbahn“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_PER_eco_war_1:0 "Rüstungsaudit: Caspian Commerce"
 AOEIW9_PER_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Caspian Commerce“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_PER_eco_war_2:0 "Rüstungsaufträge für Isfahan Industrie"
 AOEIW9_PER_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Isfahan Industrie“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_PER_eco_war_3:0 "Persien: Präzisionswerkzeuge für Nationalbank"
 AOEIW9_PER_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Nationalbank“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_eco_war_4:0 "Abadan Ölfelder für die Aufrüstung ausbauen"
 AOEIW9_PER_eco_war_4_desc:0 "Rund um „Abadan Ölfelder“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_PER_eco_war_5:0 "Transiranische Eisenbahn standardisieren"
 AOEIW9_PER_eco_war_5_desc:0 "Die mit „Transiranische Eisenbahn“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_PER_eco_war_6:0 "Nachtproduktion bei Teheran Werkstätten"
 AOEIW9_PER_eco_war_6_desc:0 "Bei „Teheran Werkstätten“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_PER_eco_war_7:0 "Langfristige Verträge für Caspian Commerce"
 AOEIW9_PER_eco_war_7_desc:0 "Langfristige Verträge sichern „Caspian Commerce“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_PER_eco_science_1:0 "Universität Teheran ausstatten"
 AOEIW9_PER_eco_science_1_desc:0 "„Universität Teheran“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_PER_eco_science_2:0 "Persien: Neue Labore an Kaiserliche Technische Schule"
 AOEIW9_PER_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kaiserliche Technische Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_eco_science_3:0 "Angewandte Forschung an persisch Forschungsbüro"
 AOEIW9_PER_eco_science_3_desc:0 "„Persisch Forschungsbüro“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_PER_eco_science_4:0 "Industriephysik an Universität Teheran"
 AOEIW9_PER_eco_science_4_desc:0 "Die Industriephysik an „Universität Teheran“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_PER_eco_science_5:0 "Persien: Produktionsforschung an Kaiserliche Technische Schule"
 AOEIW9_PER_eco_science_5_desc:0 "Bei „Kaiserliche Technische Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_eco_science_6:0 "Forschungszuschüsse für persisch Forschungsbüro"
 AOEIW9_PER_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Persisch Forschungsbüro“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_PER_eco_infra_2:0 "Frachtkapazität bei Caspian Commerce"
 AOEIW9_PER_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Caspian Commerce“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_PER_eco_infra_3:0 "Arbeiterwohnungen bei Isfahan Industrie"
 AOEIW9_PER_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Isfahan Industrie“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_PER_eco_infra_4:0 "Persien: Logistik über Nationalbank"
 AOEIW9_PER_eco_infra_4_desc:0 "„Nationalbank“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_eco_final:0 "Das persische Entwicklungsprogramm"
 AOEIW9_PER_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Persien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_PER_mil_root:0 "persischer Generalstab überprüfen"
 AOEIW9_PER_mil_root_desc:0 "„Persischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_PER_mil_army_2:0 "Feldmanöver mit Cossack Brigade Legacy"
 AOEIW9_PER_mil_army_2_desc:0 "Großmanöver mit „Cossack Brigade Legacy“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_PER_mil_army_5:0 "Teheran Kriegsschule motorisieren"
 AOEIW9_PER_mil_army_5_desc:0 "Der Motortransport von „Teheran Kriegsschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_PER_mil_army_6:0 "Stabsverfahren bei persischer Generalstab"
 AOEIW9_PER_mil_army_6_desc:0 "Bei „Persischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_PER_mil_army_7:0 "Panzerstudien bei Cossack Brigade Legacy"
 AOEIW9_PER_mil_army_7_desc:0 "„Cossack Brigade Legacy“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Persien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_PER_mil_army_8:0 "Operationsplanung bei Mountain Korps"
 AOEIW9_PER_mil_army_8_desc:0 "Operationsplanung mit „Mountain Korps“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_PER_mil_army_9:0 "Persien: Doktrin – Artilleriedirektorat"
 AOEIW9_PER_mil_army_9_desc:0 "Die von „Artilleriedirektorat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Persien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_PER_mil_air_1:0 "Kaiserlich-iranische Luftwaffe neu ordnen"
 AOEIW9_PER_mil_air_1_desc:0 "„Kaiserlich-iranische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_PER_mil_air_2:0 "Jagdfliegerausbildung bei Doshan Tappeh Fliegerhorst"
 AOEIW9_PER_mil_air_2_desc:0 "„Doshan Tappeh Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_PER_mil_air_3:0 "Bodenunterstützungsdoktrin unter Plateau-Luftkommando"
 AOEIW9_PER_mil_air_3_desc:0 "Unter „Plateau-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_PER_mil_air_4:0 "Die Reichweite von Kaiserlich-iranische Luftwaffe erhöhen"
 AOEIW9_PER_mil_air_4_desc:0 "„Kaiserlich-iranische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Persien verlangen."
 AOEIW9_PER_mil_air_5:0 "Radarnetze für Doshan Tappeh Fliegerhorst"
 AOEIW9_PER_mil_air_5_desc:0 "„Doshan Tappeh Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_PER_mil_air_6:0 "Das Luftkommando unter Plateau-Luftkommando vereinigen"
 AOEIW9_PER_mil_air_6_desc:0 "„Plateau-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_PER_mil_sea_1:0 "persisch Gulf Geschwader überprüfen"
 AOEIW9_PER_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Persisch Gulf Geschwader“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_PER_mil_sea_2:0 "Ausbau: Marinestützpunkt Khorramshahr"
 AOEIW9_PER_mil_sea_2_desc:0 "„Marinestützpunkt Khorramshahr“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_PER_mil_sea_3:0 "Flottenmanöver mit Caspian Flottille"
 AOEIW9_PER_mil_sea_3_desc:0 "Flottenmanöver mit „Caspian Flottille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_PER_mil_sea_4:0 "Sicherungsdoktrin für persisch Gulf Geschwader"
 AOEIW9_PER_mil_sea_4_desc:0 "„Persisch Gulf Geschwader“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_PER_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Khorramshahr"
 AOEIW9_PER_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Khorramshahr“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_PER_mil_sea_6:0 "Neue Schiffskörper für Caspian Flottille"
 AOEIW9_PER_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Caspian Flottille“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_PER_mil_final:0 "Gebirgsbeweglichkeit"
 AOEIW9_PER_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Persien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_PER_dip_root:0 "Die Doktrin „persisch Plateau“ festlegen"
 AOEIW9_PER_dip_root_desc:0 "Persien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_PER_dip_a_2:0 "Eine Mission zu „osmanische Grenze“ entsenden"
 AOEIW9_PER_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Osmanische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_PER_dip_a_3:0 "Wirtschaftlicher Druck: „osmanische Grenze“"
 AOEIW9_PER_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Osmanische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_PER_dip_a_4:0 "Stabsgespräche: „osmanische Grenze“"
 AOEIW9_PER_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Osmanische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_PER_dip_a_5:0 "Formelle Warnung: „osmanische Grenze“"
 AOEIW9_PER_dip_a_5_desc:0 "Eine formelle Warnung zu „Osmanische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_PER_dip_a_6:0 "Bedingungen für „osmanische Grenze“"
 AOEIW9_PER_dip_a_6_desc:0 "Für „Osmanische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_PER_dip_b_1:0 "indisch Ocean"
 AOEIW9_PER_dip_b_1_desc:0 "„Indisch Ocean“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Persien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_PER_dip_b_2:0 "Eine Mission zu „indisch Ocean“ entsenden"
 AOEIW9_PER_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Indisch Ocean“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_PER_dip_b_3:0 "Wirtschaftlicher Druck: „indisch Ocean“"
 AOEIW9_PER_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Indisch Ocean“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_PER_dip_b_4:0 "Stabsgespräche: „indisch Ocean“"
 AOEIW9_PER_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Indisch Ocean“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_PER_dip_b_5:0 "Formelle Warnung: „indisch Ocean“"
 AOEIW9_PER_dip_b_5_desc:0 "Eine formelle Warnung zu „Indisch Ocean“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_PER_dip_b_6:0 "Bedingungen für „indisch Ocean“"
 AOEIW9_PER_dip_b_6_desc:0 "Für „Indisch Ocean“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_PER_dip_final:0 "Persien zwischen den Imperien"
 AOEIW9_PER_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Persien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_POL_focus_tree:0 "Kingdom of Poland Schwerpunktbaum"
 AOEIW9_POL_politics_p1_2:0 "Sejm versöhnen"
 AOEIW9_POL_politics_p1_2_desc:0 "Die Stellung von „Sejm“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Krone und Sejm“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_POL_politics_p1_3:0 "Polen: Senat reformieren"
 AOEIW9_POL_politics_p1_3_desc:0 "Die Verfahren von „Senat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Krone und Sejm“ arbeitsfähig bleibt."
 AOEIW9_POL_politics_p1_4:0 "Polen: Offizierskorps einbinden"
 AOEIW9_POL_politics_p1_4_desc:0 "„Offizierskorps“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Krone und Sejm“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_POL_politics_p1_5:0 "Bauernparteien ausbalancieren"
 AOEIW9_POL_politics_p1_5_desc:0 "Weder die Ausschaltung von „Bauernparteien“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Krone und Sejm“ austariert."
 AOEIW9_POL_politics_p1_6:0 "Königsschloss und Nation"
 AOEIW9_POL_politics_p1_6_desc:0 "„Königsschloss“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Krone und Sejm“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_POL_politics_p2_2:0 "Polnische Ministerien in polnischer Hand"
 AOEIW9_POL_politics_p2_2_desc:0 "Deutsche Verbindungsoffiziere behalten Zugang, doch Ernennungen und tägliche Verwaltung unterstehen polnischen Ministern und dem Sejm."
 AOEIW9_POL_politics_p2_3:0 "Aufträge für den Zentralen Industriebezirk"
 AOEIW9_POL_politics_p2_3_desc:0 "Warschau vergibt Rüstungsaufträge in den neuen Industriegebieten zwischen den Grenzen. Beschaffung wird im COP zu Öfen, Werkhallen und Löhnen."
 AOEIW9_POL_politics_p2_4:0 "Das Weichsel-Offiziersabkommen"
 AOEIW9_POL_politics_p2_4_desc:0 "Ein polnischer Generalstab und ein eigenes Beförderungssystem bestehen neben der gemeinsamen Reichspaktplanung an der Ostgrenze."
 AOEIW9_POL_politics_p2_5:0 "Den Zolltarif neu verhandeln"
 AOEIW9_POL_politics_p2_5_desc:0 "Warschau tauscht berechenbaren Marktzugang gegen das Recht, strategische Industrien zu schützen und Entwicklungskredite selbst zu lenken."
 AOEIW9_POL_politics_p2_6:0 "Erneuert die Erklärung von 1934"
 AOEIW9_POL_politics_p2_6_desc:0 "Warschau verlangt von Berlin die Bekräftigung der Nichtangriffserklärung und ihrer Streitverfahren. Die Unterschrift kauft Zeit; sie löscht die Grenze nicht aus."
 AOEIW9_POL_politics_p3_2:0 "Die Loyalität des Offizierskorps prüfen"
 AOEIW9_POL_politics_p3_2_desc:0 "Vertrauenswürdige Offiziere müssen entscheiden, ob ihr Eid letztlich dem deutschen Sicherheitssystem oder einem unabhängigen polnischen Staat gilt."
 AOEIW9_POL_politics_p3_3:0 "Kontakt zum bäuerlichen Untergrund"
 AOEIW9_POL_politics_p3_3_desc:0 "Ländliche Organisationen stellen Kuriere, Vorräte und Massenunterstützung bereit und machen aus dem Verfassungsstreit eine nationale Bewegung."
 AOEIW9_POL_politics_p3_4:0 "Bewacht die PKP-Knoten"
 AOEIW9_POL_politics_p3_4_desc:0 "Militärpolizei sichert die Bahnknoten von Warschau, Łódź und Schlesien, bevor Rivalen oder Saboteure die Mobilmachung unterbrechen. Kontrolle über Polen beginnt an den Weichen."
 AOEIW9_POL_politics_p3_5:0 "Der deutschen Mission trotzen"
 AOEIW9_POL_politics_p3_5_desc:0 "Der deutschen Militärmission wird jede Befugnis über polnische Ernennungen und Mobilmachung entzogen. Der Konflikt ist nun offen."
 AOEIW9_POL_politics_p3_6:0 "Das Warschauer Ultimatum"
 AOEIW9_POL_politics_p3_6_desc:0 "Polen fordert souveräne Kontrolle über Regierung und Streitkräfte. Mobilmachung und nationale Geschlossenheit sollen die Kosten einer Ablehnung verdeutlichen."
 AOEIW9_POL_politics_settlement:0 "Polen nach dem Marschall"
 AOEIW9_POL_politics_settlement_desc:0 "Präsidentschaft, Sejm und Heer arbeiten unter der nach Piłsudski gewählten Ordnung. Warschau kann entscheiden, ohne einen abwesenden Schiedsrichter anzurufen."
 AOEIW9_POL_eco_root:0 "Bestandsaufnahme: Central Industriell Region"
 AOEIW9_POL_eco_root_desc:0 "Central Industriell Region, Schlesische Bergwerke und Gdynia Hafen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Polen am schnellsten ausbauen kann."
 AOEIW9_POL_eco_civ_2:0 "Schienen nach Schlesische Bergwerke"
 AOEIW9_POL_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Schlesische Bergwerke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_POL_eco_civ_5:0 "Ausbau von polnisch Staatsbahnen"
 AOEIW9_POL_eco_civ_5_desc:0 "Für „Polnisch Staatsbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_POL_eco_civ_6:0 "Łódź Industrie erneuern"
 AOEIW9_POL_eco_civ_6_desc:0 "„Łódź Industrie“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_POL_eco_civ_7:0 "Eine zweite Schicht bei Central Industriell Region"
 AOEIW9_POL_eco_civ_7_desc:0 "Bei „Central Industriell Region“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_POL_eco_civ_8:0 "Öffentliche Bauprogramme bei den Schlesischen Bergwerken"
 AOEIW9_POL_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Schlesische Bergwerke“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_POL_eco_war_1:0 "Rüstungsaudit: Warschau Werkstätten"
 AOEIW9_POL_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Warschau Werkstätten“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_POL_eco_war_2:0 "Rüstungsaufträge für polnisch Staatsbahnen"
 AOEIW9_POL_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Polnisch Staatsbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_POL_eco_war_3:0 "Präzisionswerkzeuge für Łódź Industrie"
 AOEIW9_POL_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Łódź Industrie“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_POL_eco_war_4:0 "Central Industriell Region für die Aufrüstung ausbauen"
 AOEIW9_POL_eco_war_4_desc:0 "Rund um „Central Industriell Region“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_POL_eco_war_5:0 "Schlesische Bergwerke standardisieren"
 AOEIW9_POL_eco_war_5_desc:0 "Die mit „Schlesische Bergwerke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_POL_eco_war_6:0 "Nachtproduktion bei Gdynia Hafen"
 AOEIW9_POL_eco_war_6_desc:0 "Bei „Gdynia Hafen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_POL_eco_war_7:0 "Langfristige Verträge für Warschau Werkstätten"
 AOEIW9_POL_eco_war_7_desc:0 "Langfristige Verträge sichern „Warschau Werkstätten“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_POL_eco_science_1:0 "Technische Universität Warschau ausstatten"
 AOEIW9_POL_eco_science_1_desc:0 "„Technische Universität Warschau“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_POL_eco_science_2:0 "Neue Labore an polnisch Akademie"
 AOEIW9_POL_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Polnisch Akademie“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_POL_eco_science_3:0 "Angewandte Forschung an Militärtechnisches Institut"
 AOEIW9_POL_eco_science_3_desc:0 "„Militärtechnisches Institut“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_POL_eco_science_4:0 "Industriephysik an Technische Universität Warschau"
 AOEIW9_POL_eco_science_4_desc:0 "Die Industriephysik an „Technische Universität Warschau“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_POL_eco_science_5:0 "Produktionsforschung an polnisch Akademie"
 AOEIW9_POL_eco_science_5_desc:0 "Bei „Polnisch Akademie“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_POL_eco_science_6:0 "Forschungszuschüsse für Militärtechnisches Institut"
 AOEIW9_POL_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Militärtechnisches Institut“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_POL_eco_infra_2:0 "Frachtkapazität bei Warschau Werkstätten"
 AOEIW9_POL_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Warschau Werkstätten“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_POL_eco_infra_3:0 "Arbeiterwohnungen bei polnisch Staatsbahnen"
 AOEIW9_POL_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Polnisch Staatsbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_POL_eco_infra_4:0 "Logistik über Łódź Industrie"
 AOEIW9_POL_eco_infra_4_desc:0 "„Łódź Industrie“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_POL_eco_final:0 "Der polnische Industriestaat"
 AOEIW9_POL_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Polen wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_POL_mil_root:0 "polnisch Generalstab überprüfen"
 AOEIW9_POL_mil_root_desc:0 "„Polnisch Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_POL_mil_army_2:0 "Feldmanöver mit Grenzkorps"
 AOEIW9_POL_mil_army_2_desc:0 "Großmanöver mit „Grenzkorps“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_POL_mil_army_5:0 "Höhere Kriegsschule motorisieren"
 AOEIW9_POL_mil_army_5_desc:0 "Der Motortransport von „Höhere Kriegsschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_POL_mil_army_6:0 "Stabsverfahren bei polnisch Generalstab"
 AOEIW9_POL_mil_army_6_desc:0 "Bei „Polnisch Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_POL_mil_army_7:0 "Panzerstudien bei Grenzkorps"
 AOEIW9_POL_mil_army_7_desc:0 "„Grenzkorps“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Polen zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_POL_mil_army_8:0 "Operationsplanung bei Cavalry Tradition"
 AOEIW9_POL_mil_army_8_desc:0 "Operationsplanung mit „Cavalry Tradition“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_POL_mil_army_9:0 "Polen: Doktrin – Artillerieinspektion"
 AOEIW9_POL_mil_army_9_desc:0 "Die von „Artillerieinspektion“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Polen gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_POL_mil_air_1:0 "Polnische Luftwaffe neu ordnen"
 AOEIW9_POL_mil_air_1_desc:0 "„Polnische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_POL_mil_air_2:0 "Jagdfliegerausbildung bei Dęblin Fliegerschule"
 AOEIW9_POL_mil_air_2_desc:0 "„Dęblin Fliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_POL_mil_air_3:0 "Polen: Bodenunterstützung – Nationales Luftkommando"
 AOEIW9_POL_mil_air_3_desc:0 "Unter „Nationales Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Polen gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_POL_mil_air_4:0 "Die Reichweite von Polnische Luftwaffe erhöhen"
 AOEIW9_POL_mil_air_4_desc:0 "„Polnische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Polen verlangen."
 AOEIW9_POL_mil_air_5:0 "Radarnetze für Dęblin Fliegerschule"
 AOEIW9_POL_mil_air_5_desc:0 "„Dęblin Fliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_POL_mil_air_6:0 "Das Luftkommando unter Nationales Luftkommando vereinigen"
 AOEIW9_POL_mil_air_6_desc:0 "„Nationales Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_POL_mil_sea_1:0 "Polnische Marine überprüfen"
 AOEIW9_POL_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Polnische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_POL_mil_sea_2:0 "Ausbau: Marinestützpunkt Gdynia"
 AOEIW9_POL_mil_sea_2_desc:0 "„Marinestützpunkt Gdynia“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_POL_mil_sea_3:0 "Flottenmanöver mit Baltic Geschwader"
 AOEIW9_POL_mil_sea_3_desc:0 "Flottenmanöver mit „Baltic Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_POL_mil_sea_4:0 "Sicherungsdoktrin für Polnische Marine"
 AOEIW9_POL_mil_sea_4_desc:0 "„Polnische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_POL_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Gdynia"
 AOEIW9_POL_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Gdynia“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_POL_mil_sea_6:0 "Neue Schiffskörper für Baltic Geschwader"
 AOEIW9_POL_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Baltic Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_POL_mil_final:0 "Polen: Elastische Verteidigung"
 AOEIW9_POL_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Polen verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_POL_dip_root:0 "Die Doktrin „Intermarium“ festlegen"
 AOEIW9_POL_dip_root_desc:0 "Königreich Polen muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_POL_dip_a_2:0 "Die Berliner-Warschauer Verbindung"
 AOEIW9_POL_dip_a_2_desc:0 "Eine ständige Verbindung zwischen Warschau und Berlin gibt der polnischen Regierung einen Kanal, Pflichten auszuhandeln statt sie nur mitgeteilt zu bekommen."
 AOEIW9_POL_dip_a_3:0 "Deutsches Kapital, polnische Industrie"
 AOEIW9_POL_dip_a_3_desc:0 "Deutsches Kapital kann die polnische Industrie beschleunigen, wenn Warschau genügend Kontrolle über seine Verwendung behält."
 AOEIW9_POL_dip_a_4:0 "Gemeinsame Stabskonferenzen"
 AOEIW9_POL_dip_a_4_desc:0 "Gemeinsame Konferenzen klären Kommandostrukturen, Mobilmachungsräume und die Grenzen deutschen militärischen Einflusses."
 AOEIW9_POL_dip_a_5:0 "Haltet die Narew-Weichsel-San-Linie"
 AOEIW9_POL_dip_a_5_desc:0 "Pioniere und Feldkommandos bereiten Brücken, Depots und Stellungen entlang der drei Flüsse vor. Diplomatie hat nur die Zeit zum Graben gekauft."
 AOEIW9_POL_dip_a_6:0 "Ein Königreich im Reichspakt"
 AOEIW9_POL_dip_a_6_desc:0 "Polen sucht vorerst Einfluss und praktische Autonomie innerhalb des Reichspakts statt einen aussichtslosen Krieg gegen seinen Oberherrn zu beginnen."
 AOEIW9_POL_dip_b_1:0 "russische Grenze"
 AOEIW9_POL_dip_b_1_desc:0 "„Russische Grenze“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Polen tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_POL_dip_b_2:0 "Eine Mission zu „russische Grenze“ entsenden"
 AOEIW9_POL_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Russische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_POL_dip_b_3:0 "Wirtschaftlicher Druck: „russische Grenze“"
 AOEIW9_POL_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Russische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_POL_dip_b_4:0 "Stabsgespräche: „russische Grenze“"
 AOEIW9_POL_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Russische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_POL_dip_b_5:0 "Formelle Warnung: „russische Grenze“"
 AOEIW9_POL_dip_b_5_desc:0 "Eine formelle Warnung zu „Russische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_POL_dip_b_6:0 "Bedingungen für „russische Grenze“"
 AOEIW9_POL_dip_b_6_desc:0 "Für „Russische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_POL_dip_final:0 "Polen im Reichspakt"
 AOEIW9_POL_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Polen sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_POR_focus_tree:0 "Portuguese Empire Schwerpunktbaum"
 AOEIW9_POR_politics_p1_2:0 "Portugal: Cortes versöhnen"
 AOEIW9_POR_politics_p1_2_desc:0 "Die Stellung von „Cortes“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Portugal: Die konstitutionelle Krone“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_POR_politics_p1_3:0 "Kolonialministerium reformieren"
 AOEIW9_POR_politics_p1_3_desc:0 "Die Verfahren von „Kolonialministerium“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Portugal: Die konstitutionelle Krone“ arbeitsfähig bleibt."
 AOEIW9_POR_politics_p1_4:0 "Industriell Guilds einbinden"
 AOEIW9_POR_politics_p1_4_desc:0 "„Industriell Guilds“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Portugal: Die konstitutionelle Krone“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_POR_politics_p1_5:0 "Republican Clubs ausbalancieren"
 AOEIW9_POR_politics_p1_5_desc:0 "Weder die Ausschaltung von „Republican Clubs“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Portugal: Die konstitutionelle Krone“ austariert."
 AOEIW9_POR_politics_p1_6:0 "Portugal: Königshof und Nation"
 AOEIW9_POR_politics_p1_6_desc:0 "„Königshof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Portugal: Die konstitutionelle Krone“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_POR_politics_p2_2:0 "Kolonialministerium öffnen"
 AOEIW9_POR_politics_p2_2_desc:0 "Der Zugang zu „Kolonialministerium“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Imperialer Korporatismus“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_POR_politics_p2_3:0 "Industriell Guilds garantieren"
 AOEIW9_POR_politics_p2_3_desc:0 "Die Stellung von „Industriell Guilds“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Imperialer Korporatismus“ einzubinden."
 AOEIW9_POR_politics_p2_4:0 "Republican Clubs erweitern"
 AOEIW9_POR_politics_p2_4_desc:0 "„Republican Clubs“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Imperialer Korporatismus“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_POR_politics_p2_5:0 "Portugal: Provinzgouverneure Verantwortung übertragen"
 AOEIW9_POR_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Provinzgouverneure“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Imperialer Korporatismus“ durch delegierte Autorität regieren kann."
 AOEIW9_POR_politics_p2_6:0 "Eine neue Charta für Portugiesisches Empire"
 AOEIW9_POR_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Imperialer Korporatismus“ in einen dauerhaften Rahmen für Portugal. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_POR_politics_p3_2:0 "Industriell Guilds mobilisieren"
 AOEIW9_POR_politics_p3_2_desc:0 "„Industriell Guilds“ wird zu einem organisatorischen Träger des Projekts „Portugal: Die republikanische Opposition“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_POR_politics_p3_3:0 "Die Macht von Republican Clubs brechen"
 AOEIW9_POR_politics_p3_3_desc:0 "Die eigenständige Macht von „Republican Clubs“ ist mit dem Projekt „Portugal: Die republikanische Opposition“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_POR_politics_p3_4:0 "Portugal: Provinzgouverneure ersetzen"
 AOEIW9_POR_politics_p3_4_desc:0 "„Provinzgouverneure“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Portugal: Die republikanische Opposition“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_POR_politics_p3_5:0 "Portugal: Königshof unter direkte Führung stellen"
 AOEIW9_POR_politics_p3_5_desc:0 "„Königshof“ wird den durch den Kurs „Portugal: Die republikanische Opposition“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_POR_politics_p3_6:0 "Portugal: Neuordnung: republikanische Opposition"
 AOEIW9_POR_politics_p3_6_desc:0 "Der politische Konflikt um „Republikanische Opposition“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Portugal: Die republikanische Opposition“ untergeordnet werden."
 AOEIW9_POR_politics_settlement:0 "Ein regierbares portugiesisches Empire"
 AOEIW9_POR_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königshof, Cortes und Kolonialministerium eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Portugiesisches Empire kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_POR_eco_root:0 "Bestandsaufnahme: Industrie von Lissabon"
 AOEIW9_POR_eco_root_desc:0 "Industrie von Lissabon, Werkstätten von Porto und Tejo-Werften arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Portugiesisches Empire am schnellsten ausbauen kann."
 AOEIW9_POR_eco_civ_2:0 "Schienen nach Werkstätten von Porto"
 AOEIW9_POR_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Werkstätten von Porto“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_POR_eco_civ_5:0 "Ausbau von Angolan Resources"
 AOEIW9_POR_eco_civ_5_desc:0 "Für „Angolan Resources“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_POR_eco_civ_6:0 "portugiesisch Eisenbahnen erneuern"
 AOEIW9_POR_eco_civ_6_desc:0 "„Portugiesisch Eisenbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_POR_eco_civ_7:0 "Eine zweite Schicht bei Industrie von Lissabon"
 AOEIW9_POR_eco_civ_7_desc:0 "Bei „Industrie von Lissabon“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_POR_eco_civ_8:0 "Öffentliche Bauprogramme bei den Werkstätten von Porto"
 AOEIW9_POR_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Werkstätten von Porto“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_POR_eco_war_1:0 "Rüstungsaudit: Kolonialhandelsrat"
 AOEIW9_POR_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Kolonialhandelsrat“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_POR_eco_war_2:0 "Rüstungsaufträge für Angolan Resources"
 AOEIW9_POR_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Angolan Resources“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_POR_eco_war_3:0 "Präzisionswerkzeuge für portugiesisch Eisenbahnen"
 AOEIW9_POR_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Portugiesisch Eisenbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_POR_eco_war_4:0 "Industrie von Lissabon für die Aufrüstung ausbauen"
 AOEIW9_POR_eco_war_4_desc:0 "Rund um „Industrie von Lissabon“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_POR_eco_war_5:0 "Werkstätten von Porto standardisieren"
 AOEIW9_POR_eco_war_5_desc:0 "Die mit „Werkstätten von Porto“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_POR_eco_war_6:0 "Nachtproduktion bei Tejo-Werften"
 AOEIW9_POR_eco_war_6_desc:0 "Bei „Tejo-Werften“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_POR_eco_war_7:0 "Langfristige Verträge für Kolonialhandelsrat"
 AOEIW9_POR_eco_war_7_desc:0 "Langfristige Verträge sichern „Kolonialhandelsrat“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_POR_eco_science_1:0 "Instituto Superior Técnico ausstatten"
 AOEIW9_POR_eco_science_1_desc:0 "„Instituto Superior Técnico“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_POR_eco_science_2:0 "Neue Labore an Akademie der Wissenschaften Lissabon"
 AOEIW9_POR_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Akademie der Wissenschaften Lissabon“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_POR_eco_science_3:0 "Angewandte Forschung an Colonial Forschungsrat"
 AOEIW9_POR_eco_science_3_desc:0 "„Colonial Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_POR_eco_science_4:0 "Industriephysik an Instituto Superior Técnico"
 AOEIW9_POR_eco_science_4_desc:0 "Die Industriephysik an „Instituto Superior Técnico“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_POR_eco_science_5:0 "Produktionsforschung an Akademie der Wissenschaften Lissabon"
 AOEIW9_POR_eco_science_5_desc:0 "Bei „Akademie der Wissenschaften Lissabon“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_POR_eco_science_6:0 "Forschungszuschüsse für Colonial Forschungsrat"
 AOEIW9_POR_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Colonial Forschungsrat“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_POR_eco_infra_2:0 "Frachtkapazität bei Kolonialhandelsrat"
 AOEIW9_POR_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Kolonialhandelsrat“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_POR_eco_infra_3:0 "Arbeiterwohnungen bei Angolan Resources"
 AOEIW9_POR_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Angolan Resources“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_POR_eco_infra_4:0 "Logistik über portugiesisch Eisenbahnen"
 AOEIW9_POR_eco_infra_4_desc:0 "„Portugiesisch Eisenbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_POR_eco_final:0 "Der imperiale Entwicklungsrat"
 AOEIW9_POR_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Portugal wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_POR_mil_root:0 "portugiesischer Generalstab überprüfen"
 AOEIW9_POR_mil_root_desc:0 "„Portugiesischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_POR_mil_army_2:0 "Portugal: Feldmanöver – Metropolitanheer"
 AOEIW9_POR_mil_army_2_desc:0 "Großmanöver mit „Metropolitanheer“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein. In Portugal gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_POR_mil_army_5:0 "Militärakademie motorisieren"
 AOEIW9_POR_mil_army_5_desc:0 "Der Motortransport von „Militärakademie“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_POR_mil_army_6:0 "Stabsverfahren bei portugiesischer Generalstab"
 AOEIW9_POR_mil_army_6_desc:0 "Bei „Portugiesischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_POR_mil_army_7:0 "Portugal: Panzerstudien – Metropolitanheer"
 AOEIW9_POR_mil_army_7_desc:0 "„Metropolitanheer“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Portugal zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_POR_mil_army_8:0 "Operationsplanung bei Colonial Troops"
 AOEIW9_POR_mil_army_8_desc:0 "Operationsplanung mit „Colonial Troops“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_POR_mil_army_9:0 "Portugal: Doktrin – Artilleriedirektorat"
 AOEIW9_POR_mil_army_9_desc:0 "Die von „Artilleriedirektorat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Portugal gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_POR_mil_air_1:0 "Portugiesische Luftwaffe neu ordnen"
 AOEIW9_POR_mil_air_1_desc:0 "„Portugiesische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_POR_mil_air_2:0 "Jagdfliegerausbildung bei Sintra Fliegerhorst"
 AOEIW9_POR_mil_air_2_desc:0 "„Sintra Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_POR_mil_air_3:0 "Bodenunterstützungsdoktrin unter Atlantik-Luftkommando"
 AOEIW9_POR_mil_air_3_desc:0 "Unter „Atlantik-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_POR_mil_air_4:0 "Die Reichweite von Portugiesische Luftwaffe erhöhen"
 AOEIW9_POR_mil_air_4_desc:0 "„Portugiesische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Portugal verlangen."
 AOEIW9_POR_mil_air_5:0 "Radarnetze für Sintra Fliegerhorst"
 AOEIW9_POR_mil_air_5_desc:0 "„Sintra Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_POR_mil_air_6:0 "Das Luftkommando unter Atlantik-Luftkommando vereinigen"
 AOEIW9_POR_mil_air_6_desc:0 "„Atlantik-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_POR_mil_sea_1:0 "portugiesische Marine überprüfen"
 AOEIW9_POR_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Portugiesische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_POR_mil_sea_2:0 "Ausbau: Marinearsenal Lissabon"
 AOEIW9_POR_mil_sea_2_desc:0 "„Marinearsenal Lissabon“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_POR_mil_sea_3:0 "Flottenmanöver mit Atlantic Geschwader"
 AOEIW9_POR_mil_sea_3_desc:0 "Flottenmanöver mit „Atlantic Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_POR_mil_sea_4:0 "Sicherungsdoktrin für portugiesische Marine"
 AOEIW9_POR_mil_sea_4_desc:0 "„Portugiesische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_POR_mil_sea_5:0 "Marineflieger bei Marinearsenal Lissabon"
 AOEIW9_POR_mil_sea_5_desc:0 "Marineflieger werden mit „Marinearsenal Lissabon“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_POR_mil_sea_6:0 "Neue Schiffskörper für Atlantic Geschwader"
 AOEIW9_POR_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Atlantic Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_POR_mil_final:0 "Kaiserlich Defense"
 AOEIW9_POR_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Portugiesisches Empire verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_POR_dip_root:0 "Die Doktrin „Lusophone Maritime“ festlegen"
 AOEIW9_POR_dip_root_desc:0 "Portugiesisches Empire muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_POR_dip_a_2:0 "Eine Mission zu „spanische Grenze“ entsenden"
 AOEIW9_POR_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Spanische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_POR_dip_a_3:0 "Wirtschaftlicher Druck: „spanische Grenze“"
 AOEIW9_POR_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Spanische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_POR_dip_a_4:0 "Stabsgespräche: „spanische Grenze“"
 AOEIW9_POR_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Spanische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_POR_dip_a_5:0 "Formelle Warnung: „spanische Grenze“"
 AOEIW9_POR_dip_a_5_desc:0 "Eine formelle Warnung zu „Spanische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_POR_dip_a_6:0 "Bedingungen für „spanische Grenze“"
 AOEIW9_POR_dip_a_6_desc:0 "Für „Spanische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_POR_dip_b_1:0 "Die luso-brasilianische Verfassungsfrage"
 AOEIW9_POR_dip_b_1_desc:0 "Brasilien ist kein ausländischer Rivale, sondern der größte Bestandteil des portugiesischen Imperialsystems; seine verfassungsrechtliche Stellung muss entsprechend geregelt werden."
 AOEIW9_POR_dip_b_2:0 "Den Imperialrat einberufen"
 AOEIW9_POR_dip_b_2_desc:0 "Delegierte aus Lissabon und Rio bilden einen ständigen Imperialrat, um Pflichten auszuhandeln, die bisher auf informeller Autorität beruhten."
 AOEIW9_POR_dip_b_3:0 "Atlantische Zölle koordinieren"
 AOEIW9_POR_dip_b_3_desc:0 "Ein gemeinsamer Zollrahmen verbindet den Atlantikhandel und gibt brasilianischen Produzenten eine anerkannte Stimme."
 AOEIW9_POR_dip_b_4:0 "Der Investitionsrat Lissabon–Rio"
 AOEIW9_POR_dip_b_4_desc:0 "Ein bilateraler Investitionsrat lenkt portugiesisches und brasilianisches Kapital in Projekte der gemeinsamen Imperialwirtschaft."
 AOEIW9_POR_dip_b_5:0 "Brasilianische Vertretung in Lissabon"
 AOEIW9_POR_dip_b_5_desc:0 "Brasilianische Vertretung in Lissabon macht aus bloßer Untertanenverwaltung eine belastbarere Verfassungsbeziehung."
 AOEIW9_POR_dip_b_6:0 "Der luso-brasilianische Pakt"
 AOEIW9_POR_dip_b_6_desc:0 "Der neue Pakt bindet Portugal und Brasilien durch Institutionen, Investitionen und ausgehandelte Pflichten statt durch Drohungen einer Rückeroberung."
 AOEIW9_POR_dip_final:0 "Das atlantische Imperialsystem"
 AOEIW9_POR_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Portugal sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_RAJ_focus_tree:0 "Indian Empire Schwerpunktbaum"
 AOEIW9_RAJ_politics_root:0 "Der Raj und die Frage indischer Macht"
 AOEIW9_RAJ_politics_root_desc:0 "Die Verfassungsordnung in Indien ist zu einem Ringen zwischen Vizeköniglicher Rat, Legislativversammlung und Fürstenkammer geworden. Bevor äußerer Druck die Fronten verhärtet, muss geklärt werden, welche Institutionen tatsächlich regieren und welche nur beraten."
 AOEIW9_RAJ_politics_p1_1:0 "Indien: Imperiale Partnerschaft"
 AOEIW9_RAJ_politics_p1_1_desc:0 "„Indien: Imperiale Partnerschaft“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Indien."
 AOEIW9_RAJ_politics_p1_2:0 "Legislativversammlung versöhnen"
 AOEIW9_RAJ_politics_p1_2_desc:0 "Die Stellung von „Legislativversammlung“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Indien: Imperiale Partnerschaft“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_RAJ_politics_p1_3:0 "Fürstenkammer reformieren"
 AOEIW9_RAJ_politics_p1_3_desc:0 "Die Verfahren von „Fürstenkammer“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Indien: Imperiale Partnerschaft“ arbeitsfähig bleibt."
 AOEIW9_RAJ_politics_p1_4:0 "indisch Civil Dienst einbinden"
 AOEIW9_RAJ_politics_p1_4_desc:0 "„Indisch Civil Dienst“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Indien: Imperiale Partnerschaft“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_RAJ_politics_p1_5:0 "Kongress Committees ausbalancieren"
 AOEIW9_RAJ_politics_p1_5_desc:0 "Weder die Ausschaltung von „Kongress Committees“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Indien: Imperiale Partnerschaft“ austariert."
 AOEIW9_RAJ_politics_p1_6:0 "Provinzministerien gesetzlich ordnen"
 AOEIW9_RAJ_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Provinzministerien“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Indien: Imperiale Partnerschaft“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_RAJ_politics_p1_7:0 "Vizeköniglicher Rat und Nation"
 AOEIW9_RAJ_politics_p1_7_desc:0 "„Vizeköniglicher Rat“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Indien: Imperiale Partnerschaft“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_RAJ_politics_p2_1:0 "Eine Föderation der Fürsten"
 AOEIW9_RAJ_politics_p2_1_desc:0 "„Föderation der Fürsten“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Indien."
 AOEIW9_RAJ_politics_p2_2:0 "Fürstenkammer öffnen"
 AOEIW9_RAJ_politics_p2_2_desc:0 "Der Zugang zu „Fürstenkammer“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Föderation der Fürsten“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_RAJ_politics_p2_3:0 "indisch Civil Dienst garantieren"
 AOEIW9_RAJ_politics_p2_3_desc:0 "Die Stellung von „Indisch Civil Dienst“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Föderation der Fürsten“ einzubinden."
 AOEIW9_RAJ_politics_p2_4:0 "Kongress Committees erweitern"
 AOEIW9_RAJ_politics_p2_4_desc:0 "„Kongress Committees“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Föderation der Fürsten“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_RAJ_politics_p2_5:0 "Provinzministerien Verantwortung übertragen"
 AOEIW9_RAJ_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Provinzministerien“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Föderation der Fürsten“ durch delegierte Autorität regieren kann."
 AOEIW9_RAJ_politics_p2_6:0 "Vizeköniglicher Rat ratifizieren"
 AOEIW9_RAJ_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Vizeköniglicher Rat“ in der neuen Ordnung fest. Danach beruht der Kurs „Föderation der Fürsten“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_RAJ_politics_p2_7:0 "Eine neue Charta für indisch Empire"
 AOEIW9_RAJ_politics_p2_7_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Föderation der Fürsten“ in einen dauerhaften Rahmen für „Indisch Empire“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_RAJ_politics_p3_1:0 "Der Nationalkongress"
 AOEIW9_RAJ_politics_p3_1_desc:0 "„Nationalkongress“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Indien."
 AOEIW9_RAJ_politics_p3_2:0 "indisch Civil Dienst mobilisieren"
 AOEIW9_RAJ_politics_p3_2_desc:0 "„Indisch Civil Dienst“ wird zu einem organisatorischen Träger des Projekts „Nationalkongress“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_RAJ_politics_p3_3:0 "Die Macht von Kongress Committees brechen"
 AOEIW9_RAJ_politics_p3_3_desc:0 "Die eigenständige Macht von „Kongress Committees“ ist mit dem Projekt „Nationalkongress“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_RAJ_politics_p3_4:0 "Provinzministerien ersetzen"
 AOEIW9_RAJ_politics_p3_4_desc:0 "„Provinzministerien“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationalkongress“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_RAJ_politics_p3_5:0 "Vizeköniglicher Rat unter direkte Führung stellen"
 AOEIW9_RAJ_politics_p3_5_desc:0 "„Vizeköniglicher Rat“ wird den durch den Kurs „Nationalkongress“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_RAJ_politics_p3_6:0 "Legislativversammlung neu gestalten"
 AOEIW9_RAJ_politics_p3_6_desc:0 "„Legislativversammlung“ bleibt bestehen, aber unter neuen Bedingungen. Zusammensetzung und Befugnisse werden so verändert, dass die Institution den Ausgleich „Nationalkongress“ stützt statt das alte Gleichgewicht zu konservieren."
 AOEIW9_RAJ_politics_p3_7:0 "Neuordnung: Nationalkongress"
 AOEIW9_RAJ_politics_p3_7_desc:0 "Der politische Konflikt um „Nationalkongress“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Nationalkongress“ untergeordnet werden."
 AOEIW9_RAJ_politics_settlement:0 "Der Delhi-Ausgleich"
 AOEIW9_RAJ_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Vizeköniglicher Rat, Legislativversammlung und Fürstenkammer eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Britisch-Indien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_RAJ_eco_root:0 "Bestandsaufnahme: Bombay Industrie"
 AOEIW9_RAJ_eco_root_desc:0 "Bombay Industrie, Bengal Jute Mills und Tata Stahl arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Britisch-Indien am schnellsten ausbauen kann."
 AOEIW9_RAJ_eco_civ_1:0 "Bombay Industrie vermessen"
 AOEIW9_RAJ_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Bombay Industrie“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_RAJ_eco_civ_2:0 "Schienen nach Bengal Jute Mills"
 AOEIW9_RAJ_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Bengal Jute Mills“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_RAJ_eco_civ_3:0 "Kapital für Tata Stahl"
 AOEIW9_RAJ_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Tata Stahl“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_RAJ_eco_civ_4:0 "Strom für Grand Trunk Eisenbahn"
 AOEIW9_RAJ_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Grand Trunk Eisenbahn“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_RAJ_eco_civ_5:0 "Ausbau von Madras Werkstätten"
 AOEIW9_RAJ_eco_civ_5_desc:0 "Für „Madras Werkstätten“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_RAJ_eco_civ_6:0 "Imperial Bank of India erneuern"
 AOEIW9_RAJ_eco_civ_6_desc:0 "„Imperial Bank of India“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_RAJ_eco_civ_7:0 "Eine zweite Schicht bei Bombay Industrie"
 AOEIW9_RAJ_eco_civ_7_desc:0 "Bei „Bombay Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_RAJ_eco_war_1:0 "Rüstungsaudit: Grand Trunk Eisenbahn"
 AOEIW9_RAJ_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Grand Trunk Eisenbahn“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_RAJ_eco_war_2:0 "Rüstungsaufträge für Madras Werkstätten"
 AOEIW9_RAJ_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Madras Werkstätten“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_RAJ_eco_war_3:0 "Präzisionswerkzeuge für Imperial Bank of India"
 AOEIW9_RAJ_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Imperial Bank of India“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_RAJ_eco_war_4:0 "Bombay Industrie für die Aufrüstung ausbauen"
 AOEIW9_RAJ_eco_war_4_desc:0 "Rund um „Bombay Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_RAJ_eco_war_5:0 "Bengal Jute Mills standardisieren"
 AOEIW9_RAJ_eco_war_5_desc:0 "Die mit „Bengal Jute Mills“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_RAJ_eco_war_6:0 "Nachtproduktion bei Tata Stahl"
 AOEIW9_RAJ_eco_war_6_desc:0 "Bei „Tata Stahl“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_RAJ_eco_war_7:0 "Langfristige Verträge für Grand Trunk Eisenbahn"
 AOEIW9_RAJ_eco_war_7_desc:0 "Langfristige Verträge sichern „Grand Trunk Eisenbahn“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_RAJ_eco_war_8:0 "Madras Werkstätten für volle Produktion mobilisieren"
 AOEIW9_RAJ_eco_war_8_desc:0 "„Madras Werkstätten“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_RAJ_eco_science_1:0 "Indian Institute of Science ausstatten"
 AOEIW9_RAJ_eco_science_1_desc:0 "„Indian Institute of Science“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_RAJ_eco_science_2:0 "Neue Labore an Calcutta Universität"
 AOEIW9_RAJ_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Calcutta Universität“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_RAJ_eco_science_3:0 "Angewandte Forschung an Delhi Technisch Rat"
 AOEIW9_RAJ_eco_science_3_desc:0 "„Delhi Technisch Rat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_RAJ_eco_science_4:0 "Industriephysik an Indian Institute of Science"
 AOEIW9_RAJ_eco_science_4_desc:0 "Die Industriephysik an „Indian Institute of Science“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_RAJ_eco_science_5:0 "Produktionsforschung an Calcutta Universität"
 AOEIW9_RAJ_eco_science_5_desc:0 "Bei „Calcutta Universität“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_RAJ_eco_science_6:0 "Forschungszuschüsse für Delhi Technisch Rat"
 AOEIW9_RAJ_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Delhi Technisch Rat“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_RAJ_eco_science_7:0 "Indian Institute of Science mit den Fabriken vernetzen"
 AOEIW9_RAJ_eco_science_7_desc:0 "„Indian Institute of Science“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_RAJ_eco_infra_1:0 "Energie für Tata Stahl"
 AOEIW9_RAJ_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Tata Stahl“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_RAJ_eco_infra_2:0 "Frachtkapazität bei Grand Trunk Eisenbahn"
 AOEIW9_RAJ_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Grand Trunk Eisenbahn“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_RAJ_eco_infra_3:0 "Arbeiterwohnungen bei Madras Werkstätten"
 AOEIW9_RAJ_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Madras Werkstätten“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_RAJ_eco_infra_4:0 "Logistik über Imperial Bank of India"
 AOEIW9_RAJ_eco_infra_4_desc:0 "„Imperial Bank of India“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_RAJ_eco_final:0 "Eine indische Industriebasis"
 AOEIW9_RAJ_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Indien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_RAJ_mil_root:0 "indischer Generalstab überprüfen"
 AOEIW9_RAJ_mil_root_desc:0 "„Indischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_RAJ_mil_army_1:0 "Die Heeresausbildungskommission"
 AOEIW9_RAJ_mil_army_1_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_2:0 "Die Grenzinfanterieschule"
 AOEIW9_RAJ_mil_army_2_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_RAJ_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_RAJ_mil_army_3_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_RAJ_mil_army_4_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_5:0 "Das indische Panzerkorps"
 AOEIW9_RAJ_mil_army_5_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_RAJ_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_RAJ_mil_army_6_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_RAJ_mil_army_7_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_RAJ_mil_army_8_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_RAJ_mil_army_9_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_RAJ_mil_army_10_desc:0 "Der Subkontinent bietet Raum für Bewegungskrieg, doch seine schwierigen Grenzen verlangen belastbare Infanterieverbände. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_RAJ_mil_air_1:0 "Königlich-indische Luftwaffe neu ordnen"
 AOEIW9_RAJ_mil_air_1_desc:0 "„Königlich-indische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_RAJ_mil_air_2:0 "Jagdfliegerausbildung bei Ambala Fliegerstation"
 AOEIW9_RAJ_mil_air_2_desc:0 "„Ambala Fliegerstation“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_RAJ_mil_air_3:0 "Indien: Bodenunterstützung – Östliches Luftkommando"
 AOEIW9_RAJ_mil_air_3_desc:0 "Unter „Östliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Indien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_RAJ_mil_air_4:0 "Die Reichweite von Königlich-indische Luftwaffe erhöhen"
 AOEIW9_RAJ_mil_air_4_desc:0 "„Königlich-indische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Indien verlangen."
 AOEIW9_RAJ_mil_air_5:0 "Radarnetze für Ambala Fliegerstation"
 AOEIW9_RAJ_mil_air_5_desc:0 "„Ambala Fliegerstation“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_RAJ_mil_air_6:0 "Indien: Einheitliches Luftkommando – Östliches Luftkommando"
 AOEIW9_RAJ_mil_air_6_desc:0 "„Östliches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Indien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_RAJ_mil_air_7:0 "Königlich-indische Luftwaffe wird einsatzreif"
 AOEIW9_RAJ_mil_air_7_desc:0 "„Königlich-indische Luftwaffe“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_RAJ_mil_sea_1:0 "Königlich-Indische Marine überprüfen"
 AOEIW9_RAJ_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Indische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_RAJ_mil_sea_2:0 "Ausbau: Bombay Werft"
 AOEIW9_RAJ_mil_sea_2_desc:0 "„Bombay Werft“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_RAJ_mil_sea_3:0 "Flottenmanöver mit indisch Ocean Geschwader"
 AOEIW9_RAJ_mil_sea_3_desc:0 "Flottenmanöver mit „Indisch Ocean Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_RAJ_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Indische Marine"
 AOEIW9_RAJ_mil_sea_4_desc:0 "„Königlich-Indische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_RAJ_mil_sea_5:0 "Marineflieger bei Bombay Werft"
 AOEIW9_RAJ_mil_sea_5_desc:0 "Marineflieger werden mit „Bombay Werft“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_RAJ_mil_sea_6:0 "Neue Schiffskörper für indisch Ocean Geschwader"
 AOEIW9_RAJ_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Indisch Ocean Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_RAJ_mil_sea_7:0 "Seeoberkommando unter Königlich-Indische Marine"
 AOEIW9_RAJ_mil_sea_7_desc:0 "„Königlich-Indische Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Indien wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_RAJ_mil_final:0 "Grenzkriegführung"
 AOEIW9_RAJ_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Britisch-Indien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_RAJ_dip_root:0 "Die Doktrin „indisch Ocean“ festlegen"
 AOEIW9_RAJ_dip_root_desc:0 "Britisch-Indien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_RAJ_dip_a_1:0 "Die siamesische Grenze"
 AOEIW9_RAJ_dip_a_1_desc:0 "„Siamesische Grenze“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Britisch-Indien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_RAJ_dip_a_2:0 "Eine Mission zu „Siamesische Grenze“ entsenden"
 AOEIW9_RAJ_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Siamesische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_RAJ_dip_a_3:0 "Wirtschaftlicher Druck: „Siamesische Grenze“"
 AOEIW9_RAJ_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Siamesische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_RAJ_dip_a_4:0 "Stabsgespräche: „Siamesische Grenze“"
 AOEIW9_RAJ_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Siamesische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_RAJ_dip_a_5:0 "Formelle Warnung: „Siamesische Grenze“"
 AOEIW9_RAJ_dip_a_5_desc:0 "Eine formelle Warnung zu „Siamesische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_RAJ_dip_a_6:0 "Bedingungen für „Siamesische Grenze“"
 AOEIW9_RAJ_dip_a_6_desc:0 "Für „Siamesische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_RAJ_dip_a_7:0 "Die Entscheidung über „Siamesische Grenze“"
 AOEIW9_RAJ_dip_a_7_desc:0 "Bei „Siamesische Grenze“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_RAJ_dip_b_1:0 "Das imperiale Verhältnis"
 AOEIW9_RAJ_dip_b_1_desc:0 "„Imperiales Verhältnis“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Britisch-Indien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_RAJ_dip_b_2:0 "Eine Mission zu „Imperiales Verhältnis“ entsenden"
 AOEIW9_RAJ_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Imperiales Verhältnis“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_RAJ_dip_b_3:0 "Wirtschaftlicher Druck: „Imperiales Verhältnis“"
 AOEIW9_RAJ_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Imperiales Verhältnis“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_RAJ_dip_b_4:0 "Stabsgespräche: „Imperiales Verhältnis“"
 AOEIW9_RAJ_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Imperiales Verhältnis“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_RAJ_dip_b_5:0 "Formelle Warnung: „Imperiales Verhältnis“"
 AOEIW9_RAJ_dip_b_5_desc:0 "Eine formelle Warnung zu „Imperiales Verhältnis“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_RAJ_dip_b_6:0 "Bedingungen für „Imperiales Verhältnis“"
 AOEIW9_RAJ_dip_b_6_desc:0 "Für „Imperiales Verhältnis“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_RAJ_dip_b_7:0 "Die Entscheidung über „Imperiales Verhältnis“"
 AOEIW9_RAJ_dip_b_7_desc:0 "Bei „Imperiales Verhältnis“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_RAJ_dip_final:0 "Delhi und das asiatische Gleichgewicht"
 AOEIW9_RAJ_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Indien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_ROM_focus_tree:0 "Kingdom of Romania Schwerpunktbaum"
 AOEIW9_ROM_politics_p1_2:0 "Parlament versöhnen"
 AOEIW9_ROM_politics_p1_2_desc:0 "Die Stellung von „Parlament“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Königliche Verfassung“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_ROM_politics_p1_3:0 "Nationale Bauernpartei reformieren"
 AOEIW9_ROM_politics_p1_3_desc:0 "Die Verfahren von „Nationale Bauernpartei“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Königliche Verfassung“ arbeitsfähig bleibt."
 AOEIW9_ROM_politics_p1_4:0 "Rumänien: Offizierskorps einbinden"
 AOEIW9_ROM_politics_p1_4_desc:0 "„Offizierskorps“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Königliche Verfassung“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_ROM_politics_p1_5:0 "Legionary Movement ausbalancieren"
 AOEIW9_ROM_politics_p1_5_desc:0 "Weder die Ausschaltung von „Legionary Movement“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Königliche Verfassung“ austariert."
 AOEIW9_ROM_politics_p1_6:0 "Rumänien: Königspalast und Nation"
 AOEIW9_ROM_politics_p1_6_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Königliche Verfassung“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_ROM_politics_p2_2:0 "Nationale Bauernpartei öffnen"
 AOEIW9_ROM_politics_p2_2_desc:0 "Der Zugang zu „Nationale Bauernpartei“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Regierung des Königs“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_ROM_politics_p2_3:0 "Rumänien: Offizierskorps garantieren"
 AOEIW9_ROM_politics_p2_3_desc:0 "Die Stellung von „Offizierskorps“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Regierung des Königs“ einzubinden."
 AOEIW9_ROM_politics_p2_4:0 "Legionary Movement erweitern"
 AOEIW9_ROM_politics_p2_4_desc:0 "„Legionary Movement“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Regierung des Königs“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_ROM_politics_p2_5:0 "County Prefects Verantwortung übertragen"
 AOEIW9_ROM_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „County Prefects“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Regierung des Königs“ durch delegierte Autorität regieren kann."
 AOEIW9_ROM_politics_p2_6:0 "Eine neue Charta für Königreich Rumänien"
 AOEIW9_ROM_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Regierung des Königs“ in einen dauerhaften Rahmen für Rumänien. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_ROM_politics_p3_2:0 "Rumänien: Offizierskorps mobilisieren"
 AOEIW9_ROM_politics_p3_2_desc:0 "„Offizierskorps“ wird zu einem organisatorischen Träger des Projekts „Legionäre Versuchung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_ROM_politics_p3_3:0 "Die Macht von Legionary Movement brechen"
 AOEIW9_ROM_politics_p3_3_desc:0 "Die eigenständige Macht von „Legionary Movement“ ist mit dem Projekt „Legionäre Versuchung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_ROM_politics_p3_4:0 "County Prefects ersetzen"
 AOEIW9_ROM_politics_p3_4_desc:0 "„County Prefects“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Legionäre Versuchung“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_ROM_politics_p3_5:0 "Rumänien: Königspalast unter direkte Führung stellen"
 AOEIW9_ROM_politics_p3_5_desc:0 "„Königspalast“ wird den durch den Kurs „Legionäre Versuchung“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_ROM_politics_p3_6:0 "Neuordnung: Legionary Temptation"
 AOEIW9_ROM_politics_p3_6_desc:0 "Der politische Konflikt um „Legionary Temptation“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Legionäre Versuchung“ untergeordnet werden."
 AOEIW9_ROM_politics_settlement:0 "Der Bukarester Ausgleich"
 AOEIW9_ROM_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Parlament und Nationale Bauernpartei eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Rumänien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_ROM_eco_root:0 "Bestandsaufnahme: Ploiești Ölfelder"
 AOEIW9_ROM_eco_root_desc:0 "Ploiești Ölfelder, Bukarest Industrie und Danube Häfen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Rumänien am schnellsten ausbauen kann."
 AOEIW9_ROM_eco_civ_2:0 "Schienen nach Bukarest Industrie"
 AOEIW9_ROM_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Bukarest Industrie“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_ROM_eco_civ_5:0 "Ausbau von rumänisch Eisenbahnen"
 AOEIW9_ROM_eco_civ_5_desc:0 "Für „Rumänisch Eisenbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_ROM_eco_civ_6:0 "Agrarkreditrat erneuern"
 AOEIW9_ROM_eco_civ_6_desc:0 "„Agrarkreditrat“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_ROM_eco_civ_7:0 "Eine zweite Schicht bei Ploiești Ölfelder"
 AOEIW9_ROM_eco_civ_7_desc:0 "Bei „Ploiești Ölfelder“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_ROM_eco_civ_8:0 "Öffentliche Bauprogramme bei der Bukarester Industrie"
 AOEIW9_ROM_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Bukarest Industrie“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_ROM_eco_war_1:0 "Rüstungsaudit: Brașov Werke"
 AOEIW9_ROM_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Brașov Werke“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_ROM_eco_war_2:0 "Rüstungsaufträge für rumänisch Eisenbahnen"
 AOEIW9_ROM_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Rumänisch Eisenbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_ROM_eco_war_3:0 "Präzisionswerkzeuge für Agrarkreditrat"
 AOEIW9_ROM_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Agrarkreditrat“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_ROM_eco_war_4:0 "Ploiești Ölfelder für die Aufrüstung ausbauen"
 AOEIW9_ROM_eco_war_4_desc:0 "Rund um „Ploiești Ölfelder“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_ROM_eco_war_5:0 "Bukarest Industrie standardisieren"
 AOEIW9_ROM_eco_war_5_desc:0 "Die mit „Bukarest Industrie“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_ROM_eco_war_6:0 "Nachtproduktion bei Danube Häfen"
 AOEIW9_ROM_eco_war_6_desc:0 "Bei „Danube Häfen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_ROM_eco_war_7:0 "Langfristige Verträge für Brașov Werke"
 AOEIW9_ROM_eco_war_7_desc:0 "Langfristige Verträge sichern „Brașov Werke“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_ROM_eco_science_1:0 "Universität Bukarest ausstatten"
 AOEIW9_ROM_eco_science_1_desc:0 "„Universität Bukarest“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_ROM_eco_science_2:0 "Neue Labore an Polytechnic Schule"
 AOEIW9_ROM_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Polytechnic Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_ROM_eco_science_3:0 "Angewandte Forschung an rumänisches Forschungsinstitut"
 AOEIW9_ROM_eco_science_3_desc:0 "„Rumänisches Forschungsinstitut“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_ROM_eco_science_4:0 "Industriephysik an Universität Bukarest"
 AOEIW9_ROM_eco_science_4_desc:0 "Die Industriephysik an „Universität Bukarest“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_ROM_eco_science_5:0 "Produktionsforschung an Polytechnic Schule"
 AOEIW9_ROM_eco_science_5_desc:0 "Bei „Polytechnic Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_ROM_eco_science_6:0 "Forschungszuschüsse für rumänisches Forschungsinstitut"
 AOEIW9_ROM_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Rumänisches Forschungsinstitut“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_ROM_eco_infra_2:0 "Frachtkapazität bei Brașov Werke"
 AOEIW9_ROM_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Brașov Werke“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_ROM_eco_infra_3:0 "Arbeiterwohnungen bei rumänisch Eisenbahnen"
 AOEIW9_ROM_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Rumänisch Eisenbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_ROM_eco_infra_4:0 "Logistik über Agrarkreditrat"
 AOEIW9_ROM_eco_infra_4_desc:0 "„Agrarkreditrat“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_ROM_eco_final:0 "Der rumänische Entwicklungsstaat"
 AOEIW9_ROM_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Rumänien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_ROM_mil_root:0 "rumänischer Generalstab überprüfen"
 AOEIW9_ROM_mil_root_desc:0 "„Rumänischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_ROM_mil_army_2:0 "Feldmanöver mit Mountain Korps"
 AOEIW9_ROM_mil_army_2_desc:0 "Großmanöver mit „Mountain Korps“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_ROM_mil_army_5:0 "Rumänien: Kriegsschule motorisieren"
 AOEIW9_ROM_mil_army_5_desc:0 "Der Motortransport von „Kriegsschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann. In Rumänien wird die Ausbildung an den verfügbaren Verbänden, Verkehrswegen und Versorgungskapazitäten ausgerichtet."
 AOEIW9_ROM_mil_army_6:0 "Stabsverfahren bei rumänischer Generalstab"
 AOEIW9_ROM_mil_army_6_desc:0 "Bei „Rumänischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_ROM_mil_army_7:0 "Panzerstudien bei Mountain Korps"
 AOEIW9_ROM_mil_army_7_desc:0 "„Mountain Korps“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Rumänien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_ROM_mil_army_8:0 "Rumänien: Operationsplanung – Königliche Garde"
 AOEIW9_ROM_mil_army_8_desc:0 "Operationsplanung mit „Königliche Garde“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden. In Rumänien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ROM_mil_army_9:0 "Rumänien: Doktrin – Artilleriedirektorat"
 AOEIW9_ROM_mil_army_9_desc:0 "Die von „Artilleriedirektorat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Rumänien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ROM_mil_air_1:0 "Königlich-rumänische Luftwaffe neu ordnen"
 AOEIW9_ROM_mil_air_1_desc:0 "„Königlich-rumänische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_ROM_mil_air_2:0 "Jagdfliegerausbildung bei Brașov Aircraft Werke"
 AOEIW9_ROM_mil_air_2_desc:0 "„Brașov Aircraft Werke“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_ROM_mil_air_3:0 "Rumänien: Bodenunterstützungsdoktrin unter Donau-Luftkommando"
 AOEIW9_ROM_mil_air_3_desc:0 "Unter „Donau-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Rumänien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ROM_mil_air_4:0 "Die Reichweite von Königlich-rumänische Luftwaffe erhöhen"
 AOEIW9_ROM_mil_air_4_desc:0 "„Königlich-rumänische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Rumänien verlangen."
 AOEIW9_ROM_mil_air_5:0 "Radarnetze für Brașov Aircraft Werke"
 AOEIW9_ROM_mil_air_5_desc:0 "„Brașov Aircraft Werke“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_ROM_mil_air_6:0 "Rumänien: Das Luftkommando unter Donau-Luftkommando vereinigen"
 AOEIW9_ROM_mil_air_6_desc:0 "„Donau-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Rumänien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_ROM_mil_sea_1:0 "Königlich-Rumänische Marine überprüfen"
 AOEIW9_ROM_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Rumänische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_ROM_mil_sea_2:0 "Ausbau: Marinestützpunkt Constanța"
 AOEIW9_ROM_mil_sea_2_desc:0 "„Marinestützpunkt Constanța“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_ROM_mil_sea_3:0 "Flottenmanöver mit Danube Flottille"
 AOEIW9_ROM_mil_sea_3_desc:0 "Flottenmanöver mit „Danube Flottille“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_ROM_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Rumänische Marine"
 AOEIW9_ROM_mil_sea_4_desc:0 "„Königlich-Rumänische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_ROM_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Constanța"
 AOEIW9_ROM_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Constanța“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_ROM_mil_sea_6:0 "Neue Schiffskörper für Danube Flottille"
 AOEIW9_ROM_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Danube Flottille“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_ROM_mil_final:0 "Rumänien: Gebirgsverteidigung"
 AOEIW9_ROM_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Rumänien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_ROM_dip_root:0 "Die Doktrin „Carpathian“ festlegen"
 AOEIW9_ROM_dip_root_desc:0 "Königreich Rumänien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_ROM_dip_a_2:0 "Die bulgarische Delegation empfangen"
 AOEIW9_ROM_dip_a_2_desc:0 "Die bulgarische Delegation wird offiziell empfangen, damit Ansprüche verhandelt statt als Drohungen ausgetauscht werden."
 AOEIW9_ROM_dip_a_3:0 "Rumänische Gemeinden schützen"
 AOEIW9_ROM_dip_a_3_desc:0 "Rumänische Gemeinden und Eigentumsrechte müssen Teil jeder dauerhaften Regelung sein."
 AOEIW9_ROM_dip_a_4:0 "Koordination der Donauzölle"
 AOEIW9_ROM_dip_a_4_desc:0 "Eine Koordination der Donauzölle gibt beiden Staaten materielle Gründe, die Grenze ruhig zu halten."
 AOEIW9_ROM_dip_a_5:0 "Italiens Garantie des Ausgleichs"
 AOEIW9_ROM_dip_a_5_desc:0 "Italienische diplomatische Rückendeckung kann einen Kompromiss gegenüber beiden Regierungen und ihren Nationalisten glaubwürdig machen."
 AOEIW9_ROM_dip_a_6:0 "Das Abkommen von Bukarest und Sofia"
 AOEIW9_ROM_dip_a_6_desc:0 "Rumänien und Bulgarien formalisieren einen arbeitsfähigen Ausgleich, der die Liga erhält und spätere Revisionen der Diplomatie überlässt."
 AOEIW9_ROM_dip_b_1:0 "Russischer Schatten"
 AOEIW9_ROM_dip_b_1_desc:0 "„Russischer Schatten“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Rumänien tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_ROM_dip_b_2:0 "Eine Mission zu „Russischer Schatten“ entsenden"
 AOEIW9_ROM_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Russischer Schatten“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_ROM_dip_b_3:0 "Wirtschaftlicher Druck: „Russischer Schatten“"
 AOEIW9_ROM_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Russischer Schatten“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_ROM_dip_b_4:0 "Stabsgespräche: „Russischer Schatten“"
 AOEIW9_ROM_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Russischer Schatten“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_ROM_dip_b_5:0 "Formelle Warnung: „Russischer Schatten“"
 AOEIW9_ROM_dip_b_5_desc:0 "Eine formelle Warnung zu „Russischer Schatten“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_ROM_dip_b_6:0 "Bedingungen für „Russischer Schatten“"
 AOEIW9_ROM_dip_b_6_desc:0 "Für „Russischer Schatten“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_ROM_dip_final:0 "Bukarest in der Mittelmeerliga"
 AOEIW9_ROM_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Rumänien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SIA_focus_tree:0 "Kingdom of Siam Schwerpunktbaum"
 AOEIW9_SIA_politics_p1_2:0 "Siam: Nationalversammlung versöhnen"
 AOEIW9_SIA_politics_p1_2_desc:0 "Die Stellung von „Nationalversammlung“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Verfassungshof“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_SIA_politics_p1_3:0 "Volkspartei reformieren"
 AOEIW9_SIA_politics_p1_3_desc:0 "Die Verfahren von „Volkspartei“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Verfassungshof“ arbeitsfähig bleibt."
 AOEIW9_SIA_politics_p1_4:0 "Militärdirektorat einbinden"
 AOEIW9_SIA_politics_p1_4_desc:0 "„Militärdirektorat“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Verfassungshof“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_SIA_politics_p1_5:0 "Siam: Königspalast und Nation"
 AOEIW9_SIA_politics_p1_5_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Verfassungshof“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_SIA_politics_p2_2:0 "Volkspartei öffnen"
 AOEIW9_SIA_politics_p2_2_desc:0 "Der Zugang zu „Volkspartei“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Königliche Restauration“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_SIA_politics_p2_3:0 "Militärdirektorat garantieren"
 AOEIW9_SIA_politics_p2_3_desc:0 "Die Stellung von „Militärdirektorat“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Königliche Restauration“ einzubinden."
 AOEIW9_SIA_politics_p2_4:0 "Provinzgouverneure erweitern"
 AOEIW9_SIA_politics_p2_4_desc:0 "„Provinzgouverneure“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Königliche Restauration“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_SIA_politics_p2_5:0 "Eine neue Charta für Königreich Siam"
 AOEIW9_SIA_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Königliche Restauration“ in einen dauerhaften Rahmen für Siam. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_SIA_politics_p3_2:0 "Militärdirektorat mobilisieren"
 AOEIW9_SIA_politics_p3_2_desc:0 "„Militärdirektorat“ wird zu einem organisatorischen Träger des Projekts „Volkspartei“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_SIA_politics_p3_3:0 "Die Macht von Provinzgouverneure brechen"
 AOEIW9_SIA_politics_p3_3_desc:0 "Die eigenständige Macht von „Provinzgouverneure“ ist mit dem Projekt „Volkspartei“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_SIA_politics_p3_4:0 "Buddhist Sangha ersetzen"
 AOEIW9_SIA_politics_p3_4_desc:0 "„Buddhist Sangha“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Volkspartei“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_SIA_politics_p3_5:0 "Neuordnung: Volkspartei"
 AOEIW9_SIA_politics_p3_5_desc:0 "Der politische Konflikt um „Volkspartei“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Volkspartei“ untergeordnet werden."
 AOEIW9_SIA_politics_settlement:0 "Der Bangkoker Ausgleich"
 AOEIW9_SIA_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Nationalversammlung und Volkspartei eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Siam kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_SIA_eco_root:0 "Bestandsaufnahme: Bangkok Werkstätten"
 AOEIW9_SIA_eco_root_desc:0 "Bangkok Werkstätten, Chao-Phraya-Bewässerung und siamesisch Eisenbahnen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Siam am schnellsten ausbauen kann."
 AOEIW9_SIA_eco_civ_2:0 "Schienen nach Chao-Phraya-Bewässerung"
 AOEIW9_SIA_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Chao-Phraya-Bewässerung“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_SIA_eco_civ_5:0 "Ausbau von Gulf Häfen"
 AOEIW9_SIA_eco_civ_5_desc:0 "Für „Gulf Häfen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_SIA_eco_civ_6:0 "Entwicklung des Nordens erneuern"
 AOEIW9_SIA_eco_civ_6_desc:0 "„Entwicklung des Nordens“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_SIA_eco_civ_7:0 "Eine zweite Schicht bei Bangkok Werkstätten"
 AOEIW9_SIA_eco_civ_7_desc:0 "Bei „Bangkok Werkstätten“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_SIA_eco_civ_8:0 "Öffentliche Bauprogramme bei der Chao-Phraya-Bewässerung"
 AOEIW9_SIA_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Chao-Phraya-Bewässerung“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_SIA_eco_civ_9:0 "Entwicklungsrat für siamesisch Eisenbahnen"
 AOEIW9_SIA_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Siamesisch Eisenbahnen“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_SIA_eco_war_1:0 "Rüstungsaudit: Tin Export Rat"
 AOEIW9_SIA_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Tin Export Rat“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_SIA_eco_war_2:0 "Rüstungsaufträge für Gulf Häfen"
 AOEIW9_SIA_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Gulf Häfen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_SIA_eco_war_3:0 "Präzisionswerkzeuge für Entwicklung des Nordens"
 AOEIW9_SIA_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Entwicklung des Nordens“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_SIA_eco_war_4:0 "Bangkok Werkstätten für die Aufrüstung ausbauen"
 AOEIW9_SIA_eco_war_4_desc:0 "Rund um „Bangkok Werkstätten“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_SIA_eco_war_5:0 "Chao-Phraya-Bewässerung standardisieren"
 AOEIW9_SIA_eco_war_5_desc:0 "Die mit „Chao-Phraya-Bewässerung“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_SIA_eco_war_6:0 "Nachtproduktion bei siamesisch Eisenbahnen"
 AOEIW9_SIA_eco_war_6_desc:0 "Bei „Siamesisch Eisenbahnen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_SIA_eco_science_1:0 "Chulalongkorn Universität ausstatten"
 AOEIW9_SIA_eco_science_1_desc:0 "„Chulalongkorn Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_SIA_eco_science_2:0 "Neue Labore an Königlich Technisches Institut"
 AOEIW9_SIA_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Königlich Technisches Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_SIA_eco_science_3:0 "Angewandte Forschung an siamesisch Forschungsbüro"
 AOEIW9_SIA_eco_science_3_desc:0 "„Siamesisch Forschungsbüro“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_SIA_eco_science_4:0 "Industriephysik an Chulalongkorn Universität"
 AOEIW9_SIA_eco_science_4_desc:0 "Die Industriephysik an „Chulalongkorn Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_SIA_eco_science_5:0 "Produktionsforschung an Königlich Technisches Institut"
 AOEIW9_SIA_eco_science_5_desc:0 "Bei „Königlich Technisches Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_SIA_eco_infra_2:0 "Frachtkapazität bei Tin Export Rat"
 AOEIW9_SIA_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Tin Export Rat“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_SIA_eco_infra_3:0 "Arbeiterwohnungen bei Gulf Häfen"
 AOEIW9_SIA_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Gulf Häfen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_SIA_eco_infra_4:0 "Logistik über Entwicklung des Nordens"
 AOEIW9_SIA_eco_infra_4_desc:0 "„Entwicklung des Nordens“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_SIA_eco_final:0 "Die siamesische Modernisierungswirtschaft"
 AOEIW9_SIA_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Siam wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SIA_mil_root:0 "siamesischer Generalstab überprüfen"
 AOEIW9_SIA_mil_root_desc:0 "„Siamesischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_SIA_mil_army_2:0 "Feldmanöver mit Königliche Garde"
 AOEIW9_SIA_mil_army_2_desc:0 "Großmanöver mit „Königliche Garde“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_SIA_mil_army_5:0 "Stabshochschule Bangkok motorisieren"
 AOEIW9_SIA_mil_army_5_desc:0 "Der Motortransport von „Stabshochschule Bangkok“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_SIA_mil_army_6:0 "Stabsverfahren bei siamesischer Generalstab"
 AOEIW9_SIA_mil_army_6_desc:0 "Bei „Siamesischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_SIA_mil_army_7:0 "Panzerstudien bei Königliche Garde"
 AOEIW9_SIA_mil_army_7_desc:0 "„Königliche Garde“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Siam zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_SIA_mil_air_1:0 "Königlich-siamesische Luftwaffe neu ordnen"
 AOEIW9_SIA_mil_air_1_desc:0 "„Königlich-siamesische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_SIA_mil_air_2:0 "Jagdfliegerausbildung bei Don Muang Fliegerhorst"
 AOEIW9_SIA_mil_air_2_desc:0 "„Don Muang Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_SIA_mil_air_3:0 "Siam: Bodenunterstützung – Golf-Luftkommando"
 AOEIW9_SIA_mil_air_3_desc:0 "Unter „Golf-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Siam gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_SIA_mil_air_4:0 "Die Reichweite von Königlich-siamesische Luftwaffe erhöhen"
 AOEIW9_SIA_mil_air_4_desc:0 "„Königlich-siamesische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Siam verlangen."
 AOEIW9_SIA_mil_air_5:0 "Radarnetze für Don Muang Fliegerhorst"
 AOEIW9_SIA_mil_air_5_desc:0 "„Don Muang Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_SIA_mil_sea_1:0 "Königlich-Siamesische Marine überprüfen"
 AOEIW9_SIA_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Siamesische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_SIA_mil_sea_2:0 "Ausbau: Marinewerft Bangkok"
 AOEIW9_SIA_mil_sea_2_desc:0 "„Marinewerft Bangkok“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_SIA_mil_sea_3:0 "Flottenmanöver mit Gulf Geschwader"
 AOEIW9_SIA_mil_sea_3_desc:0 "Flottenmanöver mit „Gulf Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_SIA_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Siamesische Marine"
 AOEIW9_SIA_mil_sea_4_desc:0 "„Königlich-Siamesische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_SIA_mil_sea_5:0 "Marineflieger bei Marinewerft Bangkok"
 AOEIW9_SIA_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Bangkok“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_SIA_mil_final:0 "Dschungelbeweglichkeit"
 AOEIW9_SIA_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Siam verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_SIA_dip_root:0 "Die Doktrin „Southeast Asian“ festlegen"
 AOEIW9_SIA_dip_root_desc:0 "Königreich Siam muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_SIA_dip_a_2:0 "Eine Mission zu „indische Grenze“ entsenden"
 AOEIW9_SIA_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Indische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SIA_dip_a_3:0 "Wirtschaftlicher Druck: „indische Grenze“"
 AOEIW9_SIA_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Indische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SIA_dip_a_4:0 "Stabsgespräche: „indische Grenze“"
 AOEIW9_SIA_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Indische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SIA_dip_a_5:0 "Formelle Warnung: „indische Grenze“"
 AOEIW9_SIA_dip_a_5_desc:0 "Eine formelle Warnung zu „Indische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SIA_dip_b_1:0 "chinesisch Sphere"
 AOEIW9_SIA_dip_b_1_desc:0 "„Chinesisch Sphere“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Siam tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SIA_dip_b_2:0 "Eine Mission zu „chinesisch Sphere“ entsenden"
 AOEIW9_SIA_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Chinesisch Sphere“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SIA_dip_b_3:0 "Wirtschaftlicher Druck: „chinesisch Sphere“"
 AOEIW9_SIA_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Chinesisch Sphere“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SIA_dip_b_4:0 "Stabsgespräche: „chinesisch Sphere“"
 AOEIW9_SIA_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Chinesisch Sphere“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SIA_dip_b_5:0 "Formelle Warnung: „chinesisch Sphere“"
 AOEIW9_SIA_dip_b_5_desc:0 "Eine formelle Warnung zu „Chinesisch Sphere“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SIA_dip_final:0 "Siam zwischen den Imperien"
 AOEIW9_SIA_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Siam sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SOV_focus_tree:0 "Russian Empire Schwerpunktbaum"
 AOEIW9_SOV_politics_root:0 "Das Kaiserreich und das Gespenst der Revolution"
 AOEIW9_SOV_politics_root_desc:0 "Russisches Kaiserreich beginnt das Jahr 1936 mit konkurrierenden Machtzentren in Kaiserhof, Staatsduma und Ochrana. Der kommende Ausgleich entscheidet, wer Ernennungen, Gesetzgebung und Mobilmachung kontrolliert, wenn die nächste Krise eintritt."
 AOEIW9_SOV_politics_p1_1:0 "Der Zar steht fest"
 AOEIW9_SOV_politics_p1_1_desc:0 "„Zar steht fest“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Russland."
 AOEIW9_SOV_politics_p1_2:0 "Staatsduma versöhnen"
 AOEIW9_SOV_politics_p1_2_desc:0 "Die Stellung von „Staatsduma“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Zar steht fest“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_SOV_politics_p1_3:0 "Ochrana reformieren"
 AOEIW9_SOV_politics_p1_3_desc:0 "Die Verfahren von „Ochrana“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Zar steht fest“ arbeitsfähig bleibt."
 AOEIW9_SOV_politics_p1_4:0 "Semstwo-Räte einbinden"
 AOEIW9_SOV_politics_p1_4_desc:0 "„Semstwo-Räte“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Zar steht fest“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_SOV_politics_p1_5:0 "Arbeitersowjets ausbalancieren"
 AOEIW9_SOV_politics_p1_5_desc:0 "Weder die Ausschaltung von „Arbeitersowjets“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Zar steht fest“ austariert."
 AOEIW9_SOV_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Generalstab“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Zar steht fest“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_SOV_politics_p1_7:0 "Russland: Kaiserhof und Nation"
 AOEIW9_SOV_politics_p1_7_desc:0 "„Kaiserhof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Zar steht fest“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_SOV_politics_p2_1:0 "Eine liberale Monarchie"
 AOEIW9_SOV_politics_p2_1_desc:0 "„Liberale Monarchie“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in Russland."
 AOEIW9_SOV_politics_p2_2_desc:0 "Der Zugang zu „Ochrana“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Liberale Monarchie“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_SOV_politics_p2_3:0 "Semstwo-Räte garantieren"
 AOEIW9_SOV_politics_p2_3_desc:0 "Die Stellung von „Semstwo-Räte“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Liberale Monarchie“ einzubinden."
 AOEIW9_SOV_politics_p2_4:0 "Arbeitersowjets erweitern"
 AOEIW9_SOV_politics_p2_4_desc:0 "„Arbeitersowjets“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Liberale Monarchie“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_SOV_politics_p2_5:0 "Generalstab Verantwortung übertragen"
 AOEIW9_SOV_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Generalstab“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Liberale Monarchie“ durch delegierte Autorität regieren kann."
 AOEIW9_SOV_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Kaiserhof“ in der neuen Ordnung fest. Danach beruht der Kurs „Liberale Monarchie“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_SOV_politics_p2_7:0 "Die Grundgesetze werden revidiert"
 AOEIW9_SOV_politics_p2_7_desc:0 "Die Duma bestimmt Ministerverantwortung, Provinzrechte und Reservegewalt der Krone in einer Revision der Grundgesetze. Reform wird zu durchsetzbarem Text."
 AOEIW9_SOV_politics_settlement:0 "Der neu geordnete Kaiserstaat"
 AOEIW9_SOV_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Kaiserhof, Staatsduma und Ochrana eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Russisches Kaiserreich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_SOV_eco_root:0 "Bestandsaufnahme: Donez-Kohlebecken"
 AOEIW9_SOV_eco_root_desc:0 "Donez-Kohlebecken, Putilow-Werke und Sibirische Eisenbahnen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Russisches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_SOV_eco_civ_1:0 "Donez-Kohlebecken vermessen"
 AOEIW9_SOV_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Donez-Kohlebecken“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_SOV_eco_civ_2:0 "Schienen nach Putilow-Werke"
 AOEIW9_SOV_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Putilow-Werke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_SOV_eco_civ_3:0 "Kapital für Sibirische Eisenbahnen"
 AOEIW9_SOV_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Sibirische Eisenbahnen“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_SOV_eco_civ_4:0 "Strom für Moskauer Industrie"
 AOEIW9_SOV_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Moskauer Industrie“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_SOV_eco_civ_5:0 "Ausbau von Ölfelder von Baku"
 AOEIW9_SOV_eco_civ_5_desc:0 "Für „Ölfelder von Baku“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_SOV_eco_civ_6:0 "Ural-Gießereien erneuern"
 AOEIW9_SOV_eco_civ_6_desc:0 "„Ural-Gießereien“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_SOV_eco_civ_7:0 "Eine zweite Schicht bei Donez-Kohlebecken"
 AOEIW9_SOV_eco_civ_7_desc:0 "Bei „Donez-Kohlebecken“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_SOV_eco_war_1:0 "Rüstungsaudit: Moskauer Industrie"
 AOEIW9_SOV_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Moskauer Industrie“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_SOV_eco_war_2:0 "Rüstungsaufträge für Ölfelder von Baku"
 AOEIW9_SOV_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Ölfelder von Baku“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_SOV_eco_war_3:0 "Präzisionswerkzeuge für Ural-Gießereien"
 AOEIW9_SOV_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Ural-Gießereien“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_SOV_eco_war_4:0 "Donez-Kohlebecken für die Aufrüstung ausbauen"
 AOEIW9_SOV_eco_war_4_desc:0 "Rund um „Donez-Kohlebecken“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_SOV_eco_war_5:0 "Putilow-Werke standardisieren"
 AOEIW9_SOV_eco_war_5_desc:0 "Die mit „Putilow-Werke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_SOV_eco_war_6:0 "Nachtproduktion bei Sibirische Eisenbahnen"
 AOEIW9_SOV_eco_war_6_desc:0 "Bei „Sibirische Eisenbahnen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_SOV_eco_war_7:0 "Langfristige Verträge für Moskauer Industrie"
 AOEIW9_SOV_eco_war_7_desc:0 "Langfristige Verträge sichern „Moskauer Industrie“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_SOV_eco_war_8:0 "Ölfelder von Baku für volle Produktion mobilisieren"
 AOEIW9_SOV_eco_war_8_desc:0 "„Ölfelder von Baku“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_SOV_eco_science_1:0 "Kaiserliche Akademie der Wissenschaften ausstatten"
 AOEIW9_SOV_eco_science_1_desc:0 "„Kaiserliche Akademie der Wissenschaften“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_SOV_eco_science_2:0 "Neue Labore an Moskau Technisches Institut"
 AOEIW9_SOV_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Moskau Technisches Institut“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_SOV_eco_science_3:0 "Angewandte Forschung an St Petersburg Polytechnic"
 AOEIW9_SOV_eco_science_3_desc:0 "„St Petersburg Polytechnic“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_SOV_eco_science_4:0 "Industriephysik an Kaiserliche Akademie der Wissenschaften"
 AOEIW9_SOV_eco_science_4_desc:0 "Die Industriephysik an „Kaiserliche Akademie der Wissenschaften“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_SOV_eco_science_5:0 "Produktionsforschung an Moskau Technisches Institut"
 AOEIW9_SOV_eco_science_5_desc:0 "Bei „Moskau Technisches Institut“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_SOV_eco_science_6:0 "Forschungszuschüsse für St Petersburg Polytechnic"
 AOEIW9_SOV_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „St Petersburg Polytechnic“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_SOV_eco_science_7:0 "Kaiserliche Akademie der Wissenschaften mit den Fabriken vernetzen"
 AOEIW9_SOV_eco_science_7_desc:0 "„Kaiserliche Akademie der Wissenschaften“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_SOV_eco_infra_1:0 "Energie für Sibirische Eisenbahnen"
 AOEIW9_SOV_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Sibirische Eisenbahnen“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_SOV_eco_infra_2:0 "Frachtkapazität bei Moskauer Industrie"
 AOEIW9_SOV_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Moskauer Industrie“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_SOV_eco_infra_3:0 "Arbeiterwohnungen bei Ölfelder von Baku"
 AOEIW9_SOV_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Ölfelder von Baku“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_SOV_eco_infra_4:0 "Logistik über Ural-Gießereien"
 AOEIW9_SOV_eco_infra_4_desc:0 "„Ural-Gießereien“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_SOV_eco_final:0 "Das imperiale System der Industriemobilmachung"
 AOEIW9_SOV_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Russland wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SOV_mil_root:0 "russischer Generalstab überprüfen"
 AOEIW9_SOV_mil_root_desc:0 "„Russischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_SOV_mil_army_1:0 "Die Kiewer Manöver"
 AOEIW9_SOV_mil_army_1_desc:0 "Massenverbände, Panzer und Flugzeuge prüfen den Mobilmachungsplan um Kiew. Bahnverspätungen und Funkausfälle erreichen die Stawka ohne zeremonielle Ausreden."
 AOEIW9_SOV_mil_army_2:0 "Gestaffelte Schützenarmeen"
 AOEIW9_SOV_mil_army_2_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_SOV_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_SOV_mil_army_3_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_SOV_mil_army_4_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_5:0 "Tiefe Panzeroperationen"
 AOEIW9_SOV_mil_army_5_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_SOV_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_SOV_mil_army_6_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_SOV_mil_army_7_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_SOV_mil_army_8_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_SOV_mil_army_9_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_SOV_mil_army_10_desc:0 "Im russischen Kriegsschauplatz benötigen Schützenreserven und gepanzerte Ausnutzung unterschiedliche Ausbildung und Versorgung. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_SOV_mil_air_1:0 "Kaiserlich-russische Luftstreitkräfte neu ordnen"
 AOEIW9_SOV_mil_air_1_desc:0 "„Kaiserlich-russische Luftstreitkräfte“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_SOV_mil_air_2:0 "Jagdfliegerausbildung bei Fliegerschule Gattschina"
 AOEIW9_SOV_mil_air_2_desc:0 "„Fliegerschule Gattschina“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_SOV_mil_air_3:0 "Russland: Bodenunterstützung – Strategisches Luftkommando"
 AOEIW9_SOV_mil_air_3_desc:0 "Unter „Strategisches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Russland gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_SOV_mil_air_4:0 "Die Reichweite von Kaiserlich-russische Luftstreitkräfte erhöhen"
 AOEIW9_SOV_mil_air_4_desc:0 "„Kaiserlich-russische Luftstreitkräfte“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Russland verlangen."
 AOEIW9_SOV_mil_air_5:0 "Radarnetze für Fliegerschule Gattschina"
 AOEIW9_SOV_mil_air_5_desc:0 "„Fliegerschule Gattschina“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_SOV_mil_air_6:0 "Russland: Einheitliches Luftkommando – Strategisches Luftkommando"
 AOEIW9_SOV_mil_air_6_desc:0 "„Strategisches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Russland gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_SOV_mil_air_7:0 "Kaiserlich-russische Luftstreitkräfte wird einsatzreif"
 AOEIW9_SOV_mil_air_7_desc:0 "„Kaiserlich-russische Luftstreitkräfte“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_SOV_mil_sea_1:0 "Kaiserlich-Russische Marine überprüfen"
 AOEIW9_SOV_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Kaiserlich-Russische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_SOV_mil_sea_2:0 "Ausbau: Kronstadt Arsenal"
 AOEIW9_SOV_mil_sea_2_desc:0 "„Kronstadt Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_SOV_mil_sea_3:0 "Flottenmanöver mit Baltic und Black Sea Fleets"
 AOEIW9_SOV_mil_sea_3_desc:0 "Flottenmanöver mit „Baltic und Black Sea Fleets“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_SOV_mil_sea_4:0 "Sicherungsdoktrin für Kaiserlich-Russische Marine"
 AOEIW9_SOV_mil_sea_4_desc:0 "„Kaiserlich-Russische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_SOV_mil_sea_5:0 "Marineflieger bei Kronstadt Arsenal"
 AOEIW9_SOV_mil_sea_5_desc:0 "Marineflieger werden mit „Kronstadt Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_SOV_mil_sea_6:0 "Neue Schiffskörper für Baltic und Black Sea Fleets"
 AOEIW9_SOV_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Baltic und Black Sea Fleets“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_SOV_mil_sea_7:0 "Seeoberkommando unter Kaiserlich-Russische Marine"
 AOEIW9_SOV_mil_sea_7_desc:0 "„Kaiserlich-Russische Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für Russland wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_SOV_mil_final:0 "Tiefe Operation"
 AOEIW9_SOV_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Russisches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_SOV_dip_root:0 "Die Doktrin „Eurasian“ festlegen"
 AOEIW9_SOV_dip_root_desc:0 "Russisches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_SOV_dip_a_1:0 "Die deutsche Grenze"
 AOEIW9_SOV_dip_a_1_desc:0 "„Deutsche Grenze“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Russisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SOV_dip_a_2:0 "Eine Mission zu „Deutsche Grenze“ entsenden"
 AOEIW9_SOV_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Deutsche Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SOV_dip_a_3:0 "Wirtschaftlicher Druck: „Deutsche Grenze“"
 AOEIW9_SOV_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Deutsche Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SOV_dip_a_4:0 "Stabsgespräche: „Deutsche Grenze“"
 AOEIW9_SOV_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Deutsche Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SOV_dip_a_5:0 "Formelle Warnung: „Deutsche Grenze“"
 AOEIW9_SOV_dip_a_5_desc:0 "Eine formelle Warnung zu „Deutsche Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SOV_dip_a_6:0 "Bedingungen für „Deutsche Grenze“"
 AOEIW9_SOV_dip_a_6_desc:0 "Für „Deutsche Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SOV_dip_a_7:0 "Die Entscheidung über „Deutsche Grenze“"
 AOEIW9_SOV_dip_a_7_desc:0 "Bei „Deutsche Grenze“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_SOV_dip_b_1:0 "Die osmanische Frage"
 AOEIW9_SOV_dip_b_1_desc:0 "„Osmanische Frage“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Russisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SOV_dip_b_2:0 "Eine Mission zu „Osmanische Frage“ entsenden"
 AOEIW9_SOV_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Osmanische Frage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SOV_dip_b_3:0 "Wirtschaftlicher Druck: „Osmanische Frage“"
 AOEIW9_SOV_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Osmanische Frage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SOV_dip_b_4:0 "Stabsgespräche: „Osmanische Frage“"
 AOEIW9_SOV_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Osmanische Frage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SOV_dip_b_5:0 "Formelle Warnung: „Osmanische Frage“"
 AOEIW9_SOV_dip_b_5_desc:0 "Eine formelle Warnung zu „Osmanische Frage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SOV_dip_b_6:0 "Bedingungen für „Osmanische Frage“"
 AOEIW9_SOV_dip_b_6_desc:0 "Für „Osmanische Frage“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SOV_dip_b_7:0 "Die Entscheidung über „Osmanische Frage“"
 AOEIW9_SOV_dip_b_7_desc:0 "Bei „Osmanische Frage“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_SOV_dip_final:0 "Die Grenzen des Russischen Kaiserreichs"
 AOEIW9_SOV_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Russland sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SOV_special_1:0 "Der sibirische Industriebogen"
 AOEIW9_SOV_special_1_desc:0 "„Der sibirische Industriebogen“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Russland ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_SOV_special_2:0 "Schwerindustrie am Ural"
 AOEIW9_SOV_special_2_desc:0 "Die Regierung macht „Schwerindustrie am Ural“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Russland und nicht aus einer universellen Vorlage."
 AOEIW9_SOV_special_3:0 "Ölzüge aus Baku"
 AOEIW9_SOV_special_3_desc:0 "Kesselwagen und bewachte Fahrpläne bringen kaukasischen Treibstoff zu Heeresdepots und Industriezentren. Förderung am Bohrloch zählt erst, wenn Öl einen Motor erreicht."
 AOEIW9_SOV_special_4:0 "Zweigleisige Transsibirische Eisenbahn"
 AOEIW9_SOV_special_4_desc:0 "Mit „Zweigleisige Transsibirische Eisenbahn“ verpflichtet sich Russisches Kaiserreich auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_SOV_special_5:0 "Das Hinterland mobilisieren"
 AOEIW9_SOV_special_5_desc:0 "„Das Hinterland mobilisieren“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in Russland ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_SOV_special_6:0 "Strategische Tiefe"
 AOEIW9_SOV_special_6_desc:0 "Die Regierung macht „Strategische Tiefe“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in Russland und nicht aus einer universellen Vorlage."
 AOEIW9_SOV_special_7:0 "Das Arsenal jenseits des Urals"
 AOEIW9_SOV_special_7_desc:0 "„Das Arsenal jenseits des Urals“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in Russland bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_SOV_special_8:0 "Russland als Industriekoloss"
 AOEIW9_SOV_special_8_desc:0 "Mit „Russland als Industriekoloss“ verpflichtet sich Russisches Kaiserreich auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_SPR_focus_tree:0 "Spanish Empire Schwerpunktbaum"
 AOEIW9_SPR_politics_p1_2:0 "Spanien: Cortes versöhnen"
 AOEIW9_SPR_politics_p1_2_desc:0 "Die Stellung von „Cortes“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Spanien: Die konstitutionelle Monarchie“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_SPR_politics_p1_3:0 "Offiziere vor den Cortes"
 AOEIW9_SPR_politics_p1_3_desc:0 "Hohe Offiziere beantworten vor den Cortes Fragen zu Ernennungen, Haushalt und Loyalität. Das Heer darf die Krone verteidigen, ohne in ihrem Namen zu regieren."
 AOEIW9_SPR_politics_p1_4:0 "Catalan Deputation einbinden"
 AOEIW9_SPR_politics_p1_4_desc:0 "„Catalan Deputation“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Spanien: Die konstitutionelle Monarchie“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_SPR_politics_p1_5:0 "Baskische Räte ausbalancieren"
 AOEIW9_SPR_politics_p1_5_desc:0 "Weder die Ausschaltung von „Baskische Räte“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Spanien: Die konstitutionelle Monarchie“ austariert."
 AOEIW9_SPR_politics_p1_6:0 "Spanien: Königspalast und Nation"
 AOEIW9_SPR_politics_p1_6_desc:0 "„Königspalast“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Spanien: Die konstitutionelle Monarchie“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_SPR_politics_p2_2:0 "Öffnet die Beförderungslisten"
 AOEIW9_SPR_politics_p2_2_desc:0 "Beförderungslisten und Kommandos werden nach Regeln geprüft, die den Cortes vorliegen. Fraktionspatrone können keine Privatarmeen mehr in versiegelten Akten aufbauen."
 AOEIW9_SPR_politics_p2_3:0 "Catalan Deputation garantieren"
 AOEIW9_SPR_politics_p2_3_desc:0 "Die Stellung von „Catalan Deputation“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Königlicher Autoritarismus“ einzubinden."
 AOEIW9_SPR_politics_p2_4:0 "Baskische Räte erweitern"
 AOEIW9_SPR_politics_p2_4_desc:0 "„Baskische Räte“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Königlicher Autoritarismus“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_SPR_politics_p2_5:0 "Industriell Syndicates Verantwortung übertragen"
 AOEIW9_SPR_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Industriell Syndicates“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Königlicher Autoritarismus“ durch delegierte Autorität regieren kann."
 AOEIW9_SPR_politics_p2_6:0 "Eine Verfassung unter Alfonso XIII."
 AOEIW9_SPR_politics_p2_6_desc:0 "Die Krone schwört auf festgelegte Befugnisse, gewählte Cortes und regionale Garantien. Alfonso bleibt König, indem er Regeln akzeptiert, die ein Kabinett überdauern."
 AOEIW9_SPR_politics_p3_2:0 "Catalan Deputation mobilisieren"
 AOEIW9_SPR_politics_p3_2_desc:0 "„Catalan Deputation“ wird zu einem organisatorischen Träger des Projekts „Nationalsyndikalisten“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_SPR_politics_p3_3:0 "Die Macht von Baskische Räte brechen"
 AOEIW9_SPR_politics_p3_3_desc:0 "Die eigenständige Macht von „Baskische Räte“ ist mit dem Projekt „Nationalsyndikalisten“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_SPR_politics_p3_4:0 "Industriell Syndicates ersetzen"
 AOEIW9_SPR_politics_p3_4_desc:0 "„Industriell Syndicates“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Nationalsyndikalisten“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_SPR_politics_p3_5:0 "Spanien: Königspalast unter direkte Führung stellen"
 AOEIW9_SPR_politics_p3_5_desc:0 "„Königspalast“ wird den durch den Kurs „Nationalsyndikalisten“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_SPR_politics_p3_6:0 "Die Siebenundzwanzig Punkte"
 AOEIW9_SPR_politics_p3_6_desc:0 "Nationalsyndikalisten erklären das falangistische Programm zum Gesetz des neuen Staates. Gewerkschaften, Gemeinden und Offiziere werden nach ihrem Dienst an der nationalen Einheit beurteilt."
 AOEIW9_SPR_politics_settlement:0 "Krone und Cortes im Ausgleich"
 AOEIW9_SPR_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königspalast, Cortes und Heeresdirektorat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Spanisches Kaiserreich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_SPR_eco_root:0 "Bestandsaufnahme: katalanische Industrie"
 AOEIW9_SPR_eco_root_desc:0 "katalanische Industrie, baskische Stahlindustrie und asturische Kohle arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Spanisches Kaiserreich am schnellsten ausbauen kann."
 AOEIW9_SPR_eco_civ_2:0 "Schienen nach baskische Stahlindustrie"
 AOEIW9_SPR_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Baskische Stahlindustrie“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_SPR_eco_civ_5:0 "Ausbau von Hafenanlagen von Barcelona"
 AOEIW9_SPR_eco_civ_5_desc:0 "Für „Hafenanlagen von Barcelona“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_SPR_eco_civ_6:0 "Spanien: Staatsbahnen erneuern"
 AOEIW9_SPR_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Spanien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SPR_eco_civ_7:0 "Eine zweite Schicht bei katalanische Industrie"
 AOEIW9_SPR_eco_civ_7_desc:0 "Bei „Katalanische Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_SPR_eco_civ_8:0 "Öffentliche Bauprogramme bei der baskischen Stahlindustrie"
 AOEIW9_SPR_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Baskische Stahlindustrie“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_SPR_eco_war_1:0 "Rüstungsaudit: Madrider Werkstätten"
 AOEIW9_SPR_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Madrider Werkstätten“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_SPR_eco_war_2:0 "Rüstungsaufträge für Hafenanlagen von Barcelona"
 AOEIW9_SPR_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Hafenanlagen von Barcelona“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_SPR_eco_war_3:0 "Spanien: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_SPR_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Spanien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SPR_eco_war_4:0 "katalanische Industrie für die Aufrüstung ausbauen"
 AOEIW9_SPR_eco_war_4_desc:0 "Rund um „Katalanische Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_SPR_eco_war_5:0 "baskische Stahlindustrie standardisieren"
 AOEIW9_SPR_eco_war_5_desc:0 "Die mit „Baskische Stahlindustrie“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_SPR_eco_war_6:0 "Nachtproduktion bei asturische Kohle"
 AOEIW9_SPR_eco_war_6_desc:0 "Bei „Asturische Kohle“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_SPR_eco_war_7:0 "Langfristige Verträge für Madrider Werkstätten"
 AOEIW9_SPR_eco_war_7_desc:0 "Langfristige Verträge sichern „Madrider Werkstätten“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_SPR_eco_science_1:0 "Complutense Universität ausstatten"
 AOEIW9_SPR_eco_science_1_desc:0 "„Complutense Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_SPR_eco_science_2:0 "Neue Labore an Barcelona Technisch Schule"
 AOEIW9_SPR_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Barcelona Technisch Schule“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_SPR_eco_science_3:0 "Versuche am Instituto Nacional de Física"
 AOEIW9_SPR_eco_science_3_desc:0 "Physiker in Madrid verbinden Elektro- und Materialforschung mit industriellen Problemen. Mittel folgen prüfbarer Arbeit statt einem weiteren Verwaltungsplan."
 AOEIW9_SPR_eco_science_4:0 "Industriephysik an Complutense Universität"
 AOEIW9_SPR_eco_science_4_desc:0 "Die Industriephysik an „Complutense Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_SPR_eco_science_5:0 "Produktionsforschung an Barcelona Technisch Schule"
 AOEIW9_SPR_eco_science_5_desc:0 "Bei „Barcelona Technisch Schule“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_SPR_eco_science_6:0 "Haltet Madrids Labore offen"
 AOEIW9_SPR_eco_science_6_desc:0 "Stabile Mittel tragen aussichtsreiche Versuche durch Fehlschläge und Gerätemangel. Forscher können Arbeiten abschließen, bevor Ministerien Ergebnisse verlangen."
 AOEIW9_SPR_eco_infra_2:0 "Frachtkapazität bei Madrider Werkstätten"
 AOEIW9_SPR_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Madrider Werkstätten“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_SPR_eco_infra_3:0 "Arbeiterwohnungen bei Hafenanlagen von Barcelona"
 AOEIW9_SPR_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Hafenanlagen von Barcelona“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_SPR_eco_infra_4:0 "Spanien: Logistik über Staatsbahnen"
 AOEIW9_SPR_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Spanien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SPR_eco_final:0 "Die integrierte spanische Wirtschaft"
 AOEIW9_SPR_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Spanien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SPR_mil_root:0 "spanischer Generalstab überprüfen"
 AOEIW9_SPR_mil_root_desc:0 "„Spanischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_SPR_mil_army_2:0 "Feldmanöver mit Armee von Africa"
 AOEIW9_SPR_mil_army_2_desc:0 "Großmanöver mit „Armee von Africa“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_SPR_mil_army_5:0 "Toledo Militärakademie motorisieren"
 AOEIW9_SPR_mil_army_5_desc:0 "Der Motortransport von „Toledo Militärakademie“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_SPR_mil_army_6:0 "Stabsverfahren bei spanischer Generalstab"
 AOEIW9_SPR_mil_army_6_desc:0 "Bei „Spanischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_SPR_mil_army_7:0 "Panzerstudien bei Armee von Africa"
 AOEIW9_SPR_mil_army_7_desc:0 "„Armee von Africa“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Spanien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_SPR_mil_army_8:0 "Operationsplanung bei Peninsular Armee"
 AOEIW9_SPR_mil_army_8_desc:0 "Operationsplanung mit „Peninsular Armee“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_SPR_mil_army_9:0 "Artillerieausbildung in Segovia"
 AOEIW9_SPR_mil_army_9_desc:0 "Die Artillerieakademie in Segovia vereinheitlicht Schießtafeln, Beobachtung und Munitionspraxis. Die Doktrin wird von Batterien im Feld erprobt."
 AOEIW9_SPR_mil_air_1:0 "Spanische Luftwaffe neu ordnen"
 AOEIW9_SPR_mil_air_1_desc:0 "„Spanische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_SPR_mil_air_2:0 "Jagdfliegerausbildung bei Getafe Fliegerhorst"
 AOEIW9_SPR_mil_air_2_desc:0 "„Getafe Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_SPR_mil_air_3:0 "Bodenunterstützungsdoktrin unter Iberisches Luftkommando"
 AOEIW9_SPR_mil_air_3_desc:0 "Unter „Iberisches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_SPR_mil_air_4:0 "Die Reichweite von Spanische Luftwaffe erhöhen"
 AOEIW9_SPR_mil_air_4_desc:0 "„Spanische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Spanien verlangen."
 AOEIW9_SPR_mil_air_5:0 "Radarnetze für Getafe Fliegerhorst"
 AOEIW9_SPR_mil_air_5_desc:0 "„Getafe Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_SPR_mil_air_6:0 "Das Luftkommando unter Iberisches Luftkommando vereinigen"
 AOEIW9_SPR_mil_air_6_desc:0 "„Iberisches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_SPR_mil_sea_1:0 "spanische Marine überprüfen"
 AOEIW9_SPR_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Spanische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_SPR_mil_sea_2:0 "Ausbau: Ferrol Arsenal"
 AOEIW9_SPR_mil_sea_2_desc:0 "„Ferrol Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_SPR_mil_sea_3:0 "Flottenmanöver mit Mediterranean Geschwader"
 AOEIW9_SPR_mil_sea_3_desc:0 "Flottenmanöver mit „Mediterranean Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_SPR_mil_sea_4:0 "Sicherungsdoktrin für spanische Marine"
 AOEIW9_SPR_mil_sea_4_desc:0 "„Spanische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_SPR_mil_sea_5:0 "Marineflieger bei Ferrol Arsenal"
 AOEIW9_SPR_mil_sea_5_desc:0 "Marineflieger werden mit „Ferrol Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_SPR_mil_sea_6:0 "Neue Schiffskörper für Mediterranean Geschwader"
 AOEIW9_SPR_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Mediterranean Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_SPR_mil_final:0 "Spanien: Gefecht der verbundenen Waffen"
 AOEIW9_SPR_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Spanisches Kaiserreich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_SPR_dip_root:0 "Die Doktrin „Iberian“ festlegen"
 AOEIW9_SPR_dip_root_desc:0 "Spanisches Kaiserreich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_SPR_dip_a_2:0 "Eine Mission zu „französische Grenze“ entsenden"
 AOEIW9_SPR_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Französische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SPR_dip_a_3:0 "Wirtschaftlicher Druck: „französische Grenze“"
 AOEIW9_SPR_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Französische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SPR_dip_a_4:0 "Stabsgespräche: „französische Grenze“"
 AOEIW9_SPR_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Französische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SPR_dip_a_5:0 "Formelle Warnung: „französische Grenze“"
 AOEIW9_SPR_dip_a_5_desc:0 "Eine formelle Warnung zu „Französische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SPR_dip_a_6:0 "Bedingungen für „französische Grenze“"
 AOEIW9_SPR_dip_a_6_desc:0 "Für „Französische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SPR_dip_b_1:0 "portugiesisch Frage"
 AOEIW9_SPR_dip_b_1_desc:0 "„Portugiesisch Frage“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Spanisches Kaiserreich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SPR_dip_b_2:0 "Eine Mission zu „portugiesisch Frage“ entsenden"
 AOEIW9_SPR_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Portugiesisch Frage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SPR_dip_b_3:0 "Wirtschaftlicher Druck: „portugiesisch Frage“"
 AOEIW9_SPR_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Portugiesisch Frage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SPR_dip_b_4:0 "Stabsgespräche: „portugiesisch Frage“"
 AOEIW9_SPR_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Portugiesisch Frage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SPR_dip_b_5:0 "Formelle Warnung: „portugiesisch Frage“"
 AOEIW9_SPR_dip_b_5_desc:0 "Eine formelle Warnung zu „Portugiesisch Frage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SPR_dip_b_6:0 "Bedingungen für „portugiesisch Frage“"
 AOEIW9_SPR_dip_b_6_desc:0 "Für „Portugiesisch Frage“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SPR_dip_final:0 "Spanien zwischen den Blöcken"
 AOEIW9_SPR_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Spanien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SWE_focus_tree:0 "Kingdom of Sweden Schwerpunktbaum"
 AOEIW9_SWE_politics_p1_2:0 "Königshof versöhnen"
 AOEIW9_SWE_politics_p1_2_desc:0 "Die Stellung von „Königshof“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Parlamentarische Ausgleich“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_SWE_politics_p1_3:0 "Sozialdemokraten reformieren"
 AOEIW9_SWE_politics_p1_3_desc:0 "Die Verfahren von „Sozialdemokraten“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Parlamentarische Ausgleich“ arbeitsfähig bleibt."
 AOEIW9_SWE_politics_p1_4:0 "Industrielle einbinden"
 AOEIW9_SWE_politics_p1_4_desc:0 "„Industrielle“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Parlamentarische Ausgleich“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_SWE_politics_p1_5:0 "Grafschaftsräte ausbalancieren"
 AOEIW9_SWE_politics_p1_5_desc:0 "Weder die Ausschaltung von „Grafschaftsräte“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Parlamentarische Ausgleich“ austariert."
 AOEIW9_SWE_politics_p1_6:0 "Schweden: Reichstag und Nation"
 AOEIW9_SWE_politics_p1_6_desc:0 "„Reichstag“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Parlamentarische Ausgleich“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_SWE_politics_p2_2:0 "Sozialdemokraten öffnen"
 AOEIW9_SWE_politics_p2_2_desc:0 "Der Zugang zu „Sozialdemokraten“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Schweden: Königliche Treuhandschaft“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_SWE_politics_p2_3:0 "Industrielle garantieren"
 AOEIW9_SWE_politics_p2_3_desc:0 "Die Stellung von „Industrielle“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Schweden: Königliche Treuhandschaft“ einzubinden."
 AOEIW9_SWE_politics_p2_4:0 "Schweden: Grafschaftsräte erweitern"
 AOEIW9_SWE_politics_p2_4_desc:0 "„Grafschaftsräte“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Schweden: Königliche Treuhandschaft“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_SWE_politics_p2_5:0 "Der Bericht der Verteidigungskommission"
 AOEIW9_SWE_politics_p2_5_desc:0 "Die Kommission legt dem Reichstag ihre Zahlen vor: Flugzeuge, Küstenbatterien und ausgebildete Reserven kosten mehr, als die Parteien versprochen haben. Der Parlamentsblock muss seine Prioritäten veröffentlichen."
 AOEIW9_SWE_politics_p2_6:0 "Der Reichstag schreibt die Bedingungen"
 AOEIW9_SWE_politics_p2_6_desc:0 "Die Verteidigungsmittel werden mit Grenzen für Notstandsgewalt und einer parlamentarischen Prüfung bewilligt. Die Bereitschaft bleibt den gewählten Abgeordneten verantwortlich."
 AOEIW9_SWE_politics_p3_2:0 "Industrielle mobilisieren"
 AOEIW9_SWE_politics_p3_2_desc:0 "„Industrielle“ wird zu einem organisatorischen Träger des Projekts „Schweden: Nationale Mobilmachung“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_SWE_politics_p3_3:0 "Schweden: Die Macht von Grafschaftsräte brechen"
 AOEIW9_SWE_politics_p3_3_desc:0 "Die eigenständige Macht von „Grafschaftsräte“ ist mit dem Projekt „Schweden: Nationale Mobilmachung“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_SWE_politics_p3_4:0 "Entlasst die Verteidigungskommission"
 AOEIW9_SWE_politics_p3_4_desc:0 "Die Akten der Kommission werden eingezogen und abweichende Mitglieder nach Hause geschickt. Einsatzbefehle schreiben künftig Offiziere, die sie auch ausführen wollen."
 AOEIW9_SWE_politics_p3_5:0 "Schweden: Reichstag unter direkte Führung stellen"
 AOEIW9_SWE_politics_p3_5_desc:0 "„Reichstag“ wird den durch den Kurs „Schweden: Nationale Mobilmachung“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_SWE_politics_p3_6:0 "Schweden unter Befehl"
 AOEIW9_SWE_politics_p3_6_desc:0 "Mobilisierungslisten, Industrieprioritäten und Provinzkommandos gehorchen nun Stockholm. Das neue Regime misst Legitimität an Bereitschaft."
 AOEIW9_SWE_politics_settlement:0 "Eine Regierung zur Mobilmachung"
 AOEIW9_SWE_politics_settlement_desc:0 "Der Verfassungskampf hat eine Regierung hervorgebracht, die Reserven einberufen, Aufträge vergeben und ihre Entscheidungen vor dem Land vertreten kann. Schweden geht mit klarer Verantwortung in die Krise."
 AOEIW9_SWE_eco_root:0 "Bestandsaufnahme: Bofors Werke"
 AOEIW9_SWE_eco_root_desc:0 "Bofors Werke, LKAB-Eisenerzgruben und Volvo Industrie arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Schweden am schnellsten ausbauen kann."
 AOEIW9_SWE_eco_civ_2:0 "Schienen nach LKAB-Eisenerzgruben"
 AOEIW9_SWE_eco_civ_2_desc:0 "Die Bahnverbindungen zu „LKAB-Eisenerzgruben“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_SWE_eco_civ_5:0 "Bändigt die Flüsse des Nordens"
 AOEIW9_SWE_eco_civ_5_desc:0 "Vermesser und Bautrupps treiben Dämme und Leitungen weiter nach Norden. Wasserkraft verbindet abgelegene Rohstoffe mit dem industriellen Süden."
 AOEIW9_SWE_eco_civ_6:0 "Schweden: Staatsbahnen erneuern"
 AOEIW9_SWE_eco_civ_6_desc:0 "„Staatsbahnen“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Schweden wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWE_eco_civ_7:0 "Eine zweite Schicht bei Bofors Werke"
 AOEIW9_SWE_eco_civ_7_desc:0 "Bei „Bofors Werke“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_SWE_eco_civ_8:0 "Öffentliche Bauprogramme bei den LKAB-Eisenerzgruben"
 AOEIW9_SWE_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „LKAB-Eisenerzgruben“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_SWE_eco_war_1:0 "Rüstungsaudit: Gothenburg Werften"
 AOEIW9_SWE_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Gothenburg Werften“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_SWE_eco_war_2:0 "Strom für die Rüstungswerke"
 AOEIW9_SWE_eco_war_2_desc:0 "Neue Kraftwerksleistung wird bei der Mobilmachung für Stahl, Sprengstoff und Werkzeugmaschinen reserviert. Die Fabriken warten nicht auf Kohleimporte, die vielleicht nie eintreffen."
 AOEIW9_SWE_eco_war_3:0 "Schweden: Präzisionswerkzeuge für Staatsbahnen"
 AOEIW9_SWE_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Staatsbahnen“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Schweden wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWE_eco_war_4:0 "Bofors Werke für die Aufrüstung ausbauen"
 AOEIW9_SWE_eco_war_4_desc:0 "Rund um „Bofors Werke“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_SWE_eco_war_5:0 "LKAB-Eisenerzgruben standardisieren"
 AOEIW9_SWE_eco_war_5_desc:0 "Die mit „LKAB-Eisenerzgruben“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_SWE_eco_war_6:0 "Nachtproduktion bei Volvo Industrie"
 AOEIW9_SWE_eco_war_6_desc:0 "Bei „Volvo Industrie“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_SWE_eco_war_7:0 "Langfristige Verträge für Gothenburg Werften"
 AOEIW9_SWE_eco_war_7_desc:0 "Langfristige Verträge sichern „Gothenburg Werften“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_SWE_eco_science_1:0 "Königliches Technisches Institut ausstatten"
 AOEIW9_SWE_eco_science_1_desc:0 "„Königliches Technisches Institut“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_SWE_eco_science_2:0 "Neue Labore an Uppsala Universität"
 AOEIW9_SWE_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Uppsala Universität“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_SWE_eco_science_3:0 "Die KTH öffnet ihre Werkstätten"
 AOEIW9_SWE_eco_science_3_desc:0 "Die Königliche Technische Hochschule teilt Prüfräume und Instrumente mit Firmen, die unmittelbare Produktionsprobleme lösen. Ingenieure tragen Ergebnisse aus Stockholm direkt in die Werkhallen."
 AOEIW9_SWE_eco_science_4:0 "Industriephysik an Königliches Technisches Institut"
 AOEIW9_SWE_eco_science_4_desc:0 "Die Industriephysik an „Königliches Technisches Institut“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_SWE_eco_science_5:0 "Produktionsforschung an Uppsala Universität"
 AOEIW9_SWE_eco_science_5_desc:0 "Bei „Uppsala Universität“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_SWE_eco_science_6:0 "Stipendien für schwedische Ingenieure"
 AOEIW9_SWE_eco_science_6_desc:0 "Vielversprechende Arbeiten an Metallurgie, Funk und Turbinen erhalten mehrjährige Mittel. Forscher können Prototypen vollenden, statt dem nächsten Kurzvertrag nachzujagen."
 AOEIW9_SWE_eco_infra_2:0 "Frachtkapazität bei Gothenburg Werften"
 AOEIW9_SWE_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Gothenburg Werften“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_SWE_eco_infra_3:0 "Häuser neben den Dämmen"
 AOEIW9_SWE_eco_infra_3_desc:0 "Neue Kraftwerke brauchen ständige Besatzungen in Bezirken mit wenig Wohnraum. Der Staat baut Häuser, Kliniken und Straßen neben den Turbinen."
 AOEIW9_SWE_eco_infra_4:0 "Schweden: Logistik über Staatsbahnen"
 AOEIW9_SWE_eco_infra_4_desc:0 "„Staatsbahnen“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Schweden wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWE_eco_final:0 "Erz, Strom und Werkhallen"
 AOEIW9_SWE_eco_final_desc:0 "Erz aus dem Norden, Strom aus den Flüssen und Präzisionsarbeit bei Bofors greifen nun ineinander. Schweden kann Exporte und ernsthafte Verteidigung zugleich tragen."
 AOEIW9_SWE_mil_root:0 "schwedischer Generalstab überprüfen"
 AOEIW9_SWE_mil_root_desc:0 "„Schwedischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_SWE_mil_army_2:0 "Feldmanöver mit Norrland Regiments"
 AOEIW9_SWE_mil_army_2_desc:0 "Großmanöver mit „Norrland Regiments“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_SWE_mil_army_5:0 "Schweden: Kriegsschule motorisieren"
 AOEIW9_SWE_mil_army_5_desc:0 "Der Motortransport von „Kriegsschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann. In Schweden wird die Ausbildung an den verfügbaren Verbänden, Verkehrswegen und Versorgungskapazitäten ausgerichtet."
 AOEIW9_SWE_mil_army_6:0 "Stabsverfahren bei schwedischer Generalstab"
 AOEIW9_SWE_mil_army_6_desc:0 "Bei „Schwedischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_SWE_mil_army_7:0 "Panzerstudien bei Norrland Regiments"
 AOEIW9_SWE_mil_army_7_desc:0 "„Norrland Regiments“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Schweden zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_SWE_mil_army_8:0 "Operationsplanung bei Bofors Artillery Kommando"
 AOEIW9_SWE_mil_army_8_desc:0 "Operationsplanung mit „Bofors Artillery Kommando“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden."
 AOEIW9_SWE_mil_army_9:0 "Panzer in Skövde"
 AOEIW9_SWE_mil_army_9_desc:0 "Panzerbesatzungen in Skövde machen aus Versuchsverbänden feste Abläufe für Bewegung, Bergung und Unterstützung. Schwedische Panzer müssen in Wäldern und schwierigem Gelände bestehen, nicht auf der Parade."
 AOEIW9_SWE_mil_air_1:0 "Schwedische Luftwaffe neu ordnen"
 AOEIW9_SWE_mil_air_1_desc:0 "„Schwedische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_SWE_mil_air_2:0 "Jagdfliegerausbildung bei SAAB Werke"
 AOEIW9_SWE_mil_air_2_desc:0 "„SAAB Werke“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_SWE_mil_air_3:0 "Schweden: Bodenunterstützung – Nördliches Luftkommando"
 AOEIW9_SWE_mil_air_3_desc:0 "Unter „Nördliches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Schweden gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_SWE_mil_air_4:0 "Die Reichweite von Schwedische Luftwaffe erhöhen"
 AOEIW9_SWE_mil_air_4_desc:0 "„Schwedische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Schweden verlangen."
 AOEIW9_SWE_mil_air_5:0 "Radarnetze für SAAB Werke"
 AOEIW9_SWE_mil_air_5_desc:0 "„SAAB Werke“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_SWE_mil_air_6:0 "Schweden: Einheitliches Luftkommando – Nördliches Luftkommando"
 AOEIW9_SWE_mil_air_6_desc:0 "„Nördliches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege. In Schweden gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_SWE_mil_sea_1:0 "Königlich-Schwedische Marine überprüfen"
 AOEIW9_SWE_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-Schwedische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_SWE_mil_sea_2:0 "Ausbau: Marinewerft Karlskrona"
 AOEIW9_SWE_mil_sea_2_desc:0 "„Marinewerft Karlskrona“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_SWE_mil_sea_3:0 "Flottenmanöver mit Ostseeflotte"
 AOEIW9_SWE_mil_sea_3_desc:0 "Flottenmanöver mit „Ostseeflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_SWE_mil_sea_4:0 "Sicherungsdoktrin für Königlich-Schwedische Marine"
 AOEIW9_SWE_mil_sea_4_desc:0 "„Königlich-Schwedische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_SWE_mil_sea_5:0 "Marineflieger bei Marinewerft Karlskrona"
 AOEIW9_SWE_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Karlskrona“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_SWE_mil_sea_6:0 "Neue Schiffskörper für Ostseeflotte"
 AOEIW9_SWE_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Ostseeflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_SWE_mil_final:0 "Schweden: Mobile Verteidigung"
 AOEIW9_SWE_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Schweden verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_SWE_dip_root:0 "Die Doktrin „Nordic Defense“ festlegen"
 AOEIW9_SWE_dip_root_desc:0 "Königreich Schweden muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_SWE_dip_a_2:0 "Eine Mission zu „finnisch Frage“ entsenden"
 AOEIW9_SWE_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Finnische Frage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SWE_dip_a_3:0 "Wirtschaftlicher Druck: „finnisch Frage“"
 AOEIW9_SWE_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Finnische Frage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SWE_dip_a_4:0 "Stabsgespräche: „finnisch Frage“"
 AOEIW9_SWE_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Finnische Frage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SWE_dip_a_5:0 "Formelle Warnung: „finnisch Frage“"
 AOEIW9_SWE_dip_a_5_desc:0 "Eine formelle Warnung zu „Finnische Frage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SWE_dip_a_6:0 "Bedingungen für „finnisch Frage“"
 AOEIW9_SWE_dip_a_6_desc:0 "Für „Finnische Frage“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SWE_dip_b_1:0 "Baltic Sicherheit"
 AOEIW9_SWE_dip_b_1_desc:0 "„Baltic Security“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Königreich Schweden tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SWE_dip_b_2:0 "Eine Mission zu „Baltic Security“ entsenden"
 AOEIW9_SWE_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Baltic Security“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SWE_dip_b_3:0 "Wirtschaftlicher Druck: „Baltic Security“"
 AOEIW9_SWE_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Baltic Security“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SWE_dip_b_4:0 "Stabsgespräche: „Baltic Security“"
 AOEIW9_SWE_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Baltic Security“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SWE_dip_b_5:0 "Formelle Warnung: „Baltic Security“"
 AOEIW9_SWE_dip_b_5_desc:0 "Eine formelle Warnung zu „Baltic Security“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SWE_dip_b_6:0 "Bedingungen für „Baltic Security“"
 AOEIW9_SWE_dip_b_6_desc:0 "Für „Baltic Security“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_SWE_dip_final:0 "Schweden und das baltische Gleichgewicht"
 AOEIW9_SWE_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Schweden sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SWI_focus_tree:0 "Swiss Confederation Schwerpunktbaum"
 AOEIW9_SWI_politics_root:0 "Die Eidgenossenschaft unter Druck"
 AOEIW9_SWI_politics_root_desc:0 "Bundesrat, Nationalrat und Ständerat beanspruchen alle Einfluss auf die Zukunft in der Schweiz. Eine dauerhafte Ordnung muss ihre Rechte jetzt festlegen, bevor ein Notstand dies mit Gewalt tut."
 AOEIW9_SWI_politics_p1_1:0 "Der föderale Konsens"
 AOEIW9_SWI_politics_p1_1_desc:0 "„Föderale Konsens“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in der Schweiz."
 AOEIW9_SWI_politics_p1_2:0 "Nationalrat versöhnen"
 AOEIW9_SWI_politics_p1_2_desc:0 "Die Stellung von „Nationalrat“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Föderale Konsens“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_SWI_politics_p1_3:0 "Ständerat reformieren"
 AOEIW9_SWI_politics_p1_3_desc:0 "Die Verfahren von „Ständerat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Föderale Konsens“ arbeitsfähig bleibt."
 AOEIW9_SWI_politics_p1_4:0 "Cantonal Governments einbinden"
 AOEIW9_SWI_politics_p1_4_desc:0 "„Cantonal Governments“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Föderale Konsens“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_SWI_politics_p1_5:0 "Bundesrat und Nation"
 AOEIW9_SWI_politics_p1_5_desc:0 "„Bundesrat“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Föderale Konsens“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_SWI_politics_p2_1:0 "Föderale Notstandsvollmachten"
 AOEIW9_SWI_politics_p2_1_desc:0 "„Föderale Notstandsvollmachten“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in der Schweiz."
 AOEIW9_SWI_politics_p2_2:0 "Ständerat öffnen"
 AOEIW9_SWI_politics_p2_2_desc:0 "Der Zugang zu „Ständerat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Föderale Notstandsvollmachten“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_SWI_politics_p2_3:0 "Cantonal Governments garantieren"
 AOEIW9_SWI_politics_p2_3_desc:0 "Die Stellung von „Cantonal Governments“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Föderale Notstandsvollmachten“ einzubinden."
 AOEIW9_SWI_politics_p2_4:0 "Industriell Associations erweitern"
 AOEIW9_SWI_politics_p2_4_desc:0 "„Industriell Associations“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Föderale Notstandsvollmachten“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_SWI_politics_p2_5:0 "Eine neue Charta für schweizerisch Confederation"
 AOEIW9_SWI_politics_p2_5_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Föderale Notstandsvollmachten“ in einen dauerhaften Rahmen für „Schweizerisch Confederation“. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_SWI_politics_p3_1:0 "Der Block der bewaffneten Neutralität"
 AOEIW9_SWI_politics_p3_1_desc:0 "„Block der bewaffneten Neutralität“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft in der Schweiz."
 AOEIW9_SWI_politics_p3_2:0 "Cantonal Governments mobilisieren"
 AOEIW9_SWI_politics_p3_2_desc:0 "„Cantonal Governments“ wird zu einem organisatorischen Träger des Projekts „Block der bewaffneten Neutralität“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_SWI_politics_p3_3:0 "Die Macht von Industriell Associations brechen"
 AOEIW9_SWI_politics_p3_3_desc:0 "Die eigenständige Macht von „Industriell Associations“ ist mit dem Projekt „Block der bewaffneten Neutralität“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_SWI_politics_p3_4:0 "Militia Offiziere ersetzen"
 AOEIW9_SWI_politics_p3_4_desc:0 "„Militia Offiziere“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Block der bewaffneten Neutralität“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_SWI_politics_p3_5:0 "Neuordnung: Armed Neutrality Bloc"
 AOEIW9_SWI_politics_p3_5_desc:0 "Der politische Konflikt um „Armed Neutrality Bloc“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Block der bewaffneten Neutralität“ untergeordnet werden."
 AOEIW9_SWI_politics_settlement:0 "Der föderale Ausgleich"
 AOEIW9_SWI_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Bundesrat, Nationalrat und Ständerat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Schweizerische Eidgenossenschaft kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_SWI_eco_root:0 "Bestandsaufnahme: Zurich Machine Industrie"
 AOEIW9_SWI_eco_root_desc:0 "Zurich Machine Industrie, Schweizerische Bundesbahnen und Alpine Hydroelectricity arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Schweizerische Eidgenossenschaft am schnellsten ausbauen kann."
 AOEIW9_SWI_eco_civ_1:0 "Zurich Machine Industrie vermessen"
 AOEIW9_SWI_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Zurich Machine Industrie“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_SWI_eco_civ_2:0 "Schienen nach Schweizerische Bundesbahnen"
 AOEIW9_SWI_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Schweizerisch Federal Eisenbahnen“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_SWI_eco_civ_3:0 "Kapital für Alpine Hydroelectricity"
 AOEIW9_SWI_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Alpine Hydroelectricity“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_SWI_eco_civ_4:0 "Strom für Basel Chemicals"
 AOEIW9_SWI_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Basel Chemicals“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_SWI_eco_civ_5:0 "Ausbau von Precision Werkstätten"
 AOEIW9_SWI_eco_civ_5_desc:0 "Für „Precision Werkstätten“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_SWI_eco_civ_6:0 "Schweiz: Nationalbank erneuern"
 AOEIW9_SWI_eco_civ_6_desc:0 "„Nationalbank“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird. In Schweiz wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWI_eco_civ_7:0 "Eine zweite Schicht bei Zurich Machine Industrie"
 AOEIW9_SWI_eco_civ_7_desc:0 "Bei „Zurich Machine Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_SWI_eco_civ_8:0 "Öffentliche Bauprogramme bei den Schweizerischen Bundesbahnen"
 AOEIW9_SWI_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Schweizerisch Federal Eisenbahnen“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_SWI_eco_civ_9:0 "Entwicklungsrat für Alpine Hydroelectricity"
 AOEIW9_SWI_eco_civ_9_desc:0 "Ein ständiger Entwicklungsrat koordiniert Kredite, Versorgungsnetze, Verkehr und Baugenehmigungen rund um „Alpine Hydroelectricity“. Lokale Projekte werden so Teil einer nationalen Investitionsfolge."
 AOEIW9_SWI_eco_war_1:0 "Rüstungsaudit: Basel Chemicals"
 AOEIW9_SWI_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Basel Chemicals“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_SWI_eco_war_2:0 "Rüstungsaufträge für Precision Werkstätten"
 AOEIW9_SWI_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Precision Werkstätten“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_SWI_eco_war_3:0 "Schweiz: Präzisionswerkzeuge für Nationalbank"
 AOEIW9_SWI_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Nationalbank“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können. In Schweiz wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWI_eco_war_4:0 "Zurich Machine Industrie für die Aufrüstung ausbauen"
 AOEIW9_SWI_eco_war_4_desc:0 "Rund um „Zurich Machine Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_SWI_eco_war_5:0 "Schweizerische Bundesbahnen standardisieren"
 AOEIW9_SWI_eco_war_5_desc:0 "Die mit „Schweizerisch Federal Eisenbahnen“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_SWI_eco_war_6:0 "Nachtproduktion bei Alpine Hydroelectricity"
 AOEIW9_SWI_eco_war_6_desc:0 "Bei „Alpine Hydroelectricity“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_SWI_eco_science_1:0 "ETH Zürich ausstatten"
 AOEIW9_SWI_eco_science_1_desc:0 "„ETH Zürich“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_SWI_eco_science_2:0 "Neue Labore an Universität von Geneva"
 AOEIW9_SWI_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Universität von Geneva“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_SWI_eco_science_3:0 "Angewandte Forschung an Eidgenössische Forschungskommission"
 AOEIW9_SWI_eco_science_3_desc:0 "„Eidgenössische Forschungskommission“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_SWI_eco_science_4:0 "Industriephysik an ETH Zürich"
 AOEIW9_SWI_eco_science_4_desc:0 "Die Industriephysik an „ETH Zürich“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_SWI_eco_science_5:0 "Produktionsforschung an Universität von Geneva"
 AOEIW9_SWI_eco_science_5_desc:0 "Bei „Universität von Geneva“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_SWI_eco_infra_1:0 "Energie für Alpine Hydroelectricity"
 AOEIW9_SWI_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Alpine Hydroelectricity“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_SWI_eco_infra_2:0 "Frachtkapazität bei Basel Chemicals"
 AOEIW9_SWI_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Basel Chemicals“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_SWI_eco_infra_3:0 "Arbeiterwohnungen bei Precision Werkstätten"
 AOEIW9_SWI_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Precision Werkstätten“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_SWI_eco_infra_4:0 "Schweiz: Logistik über Nationalbank"
 AOEIW9_SWI_eco_infra_4_desc:0 "„Nationalbank“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen. In Schweiz wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWI_eco_final:0 "Die schweizerische Produktionswirtschaft"
 AOEIW9_SWI_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Schweiz wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_SWI_mil_root:0 "schweizerischer Generalstab überprüfen"
 AOEIW9_SWI_mil_root_desc:0 "„Schweizerischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_SWI_mil_army_1:0 "schweizerischer Generalstab neu ordnen"
 AOEIW9_SWI_mil_army_1_desc:0 "„Schweizerischer Generalstab“ wird mit klaren Befehlswegen, moderner Stabsarbeit und Formationen neu geordnet, die die Wirtschaft auch versorgen kann. Zuerst soll Einsatzbereitschaft entstehen, bevor bloß die Kopfzahl wächst."
 AOEIW9_SWI_mil_army_2:0 "Feldmanöver mit Militia Armee"
 AOEIW9_SWI_mil_army_2_desc:0 "Großmanöver mit „Militia Armee“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_SWI_mil_army_3:0 "Unterstützungstruppen für Mountain Brigades"
 AOEIW9_SWI_mil_army_3_desc:0 "Pioniere, Aufklärung, Fernmelder und weitere Unterstützungstruppen werden in „Mountain Brigades“ integriert. Bessere Unterstützungsdienste machen vorhandene Verbände flexibler, ohne jedes Problem mit mehr Infanterie lösen zu wollen."
 AOEIW9_SWI_mil_army_4:0 "Artillerielehren von Fortress Kommando"
 AOEIW9_SWI_mil_army_4_desc:0 "„Fortress Kommando“ überführt Artillerieerfahrung in feste Feuerpläne, Beobachtungsverfahren und Munitionspraxis. Geschütze sollen mit der Bewegung der Truppe zusammenwirken statt als getrennte Waffengattung zu kämpfen."
 AOEIW9_SWI_mil_army_5:0 "Thun Offizier Schule motorisieren"
 AOEIW9_SWI_mil_army_5_desc:0 "Der Motortransport von „Thun Offizier Schule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_SWI_mil_army_6:0 "Stabsverfahren bei schweizerischer Generalstab"
 AOEIW9_SWI_mil_army_6_desc:0 "Bei „Schweizerischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_SWI_mil_army_7:0 "Panzerstudien bei Militia Armee"
 AOEIW9_SWI_mil_army_7_desc:0 "„Militia Armee“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in der Schweiz zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_SWI_mil_air_1:0 "Schweizer Luftwaffe neu ordnen"
 AOEIW9_SWI_mil_air_1_desc:0 "„Schweizer Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_SWI_mil_air_2:0 "Jagdfliegerausbildung bei Flugplatz Dübendorf"
 AOEIW9_SWI_mil_air_2_desc:0 "„Flugplatz Dübendorf“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_SWI_mil_air_3:0 "Bodenunterstützungsdoktrin unter Alpen-Luftkommando"
 AOEIW9_SWI_mil_air_3_desc:0 "Unter „Alpen-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_SWI_mil_air_4:0 "Die Reichweite von Schweizer Luftwaffe erhöhen"
 AOEIW9_SWI_mil_air_4_desc:0 "„Schweizer Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in der Schweiz verlangen."
 AOEIW9_SWI_mil_air_5:0 "Radarnetze für Flugplatz Dübendorf"
 AOEIW9_SWI_mil_air_5_desc:0 "„Flugplatz Dübendorf“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_SWI_mil_special_1:0 "Alpine Supply Korps ausbauen"
 AOEIW9_SWI_mil_special_1_desc:0 "„Alpine Supply Korps“ erhält Transportmittel, Depots und Beschaffungsbefugnisse, die für eine echte militärische Fähigkeit nötig sind. Der Ausbau wird an Versorgung und Einsatzbereitschaft gebunden statt an neue Formationen auf dem Papier."
 AOEIW9_SWI_mil_special_2:0 "Fortress Engineers ausbilden"
 AOEIW9_SWI_mil_special_2_desc:0 "Die mit „Fortress Engineers“ verbundenen Verbände erhalten eine eigene Ausbildung für Gelände und Auftrag. Übungen konzentrieren sich auf praktische Einsatzbereitschaft statt auf zeremonielle Stärke."
 AOEIW9_SWI_mil_special_3:0 "Mit Kommando der Nationalen Redoute befestigen"
 AOEIW9_SWI_mil_special_3_desc:0 "„Kommando der Nationalen Redoute“ wird in einen geplanten Befestigungsrahmen mit Versorgungsstellen, vorbereiteten Stellungen und Pionierunterstützung eingebunden. Gelände wird erst dann zu einem Vorteil, wenn Truppen es halten und versorgen können."
 AOEIW9_SWI_mil_special_4:0 "Gebirgslogistik für Alpine Supply Korps"
 AOEIW9_SWI_mil_special_4_desc:0 "Packtransport, Gebirgsstraßen, Depots und spezialisierte Versorgungseinheiten unterstützen „Alpine Supply Korps“. Das Programm hält Verbände dort beweglich, wo normaler Motortransport nicht zuverlässig funktioniert."
 AOEIW9_SWI_mil_special_5:0 "Mobile Reserve von Fortress Engineers"
 AOEIW9_SWI_mil_special_5_desc:0 "Um „Fortress Engineers“ wird eine mobile Reserve organisiert, damit lokale Verteidigungskraft rasch in bedrohte Abschnitte verlegt werden kann. Beweglichkeit macht aus statischen Vorbereitungen ein operatives System."
 AOEIW9_SWI_mil_final:0 "Festungskriegführung"
 AOEIW9_SWI_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Schweizerische Eidgenossenschaft verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_SWI_dip_root:0 "Die Doktrin „Armed Neutrality“ festlegen"
 AOEIW9_SWI_dip_root_desc:0 "Schweizerische Eidgenossenschaft muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_SWI_dip_a_1:0 "Das Gleichgewicht der Großmächte"
 AOEIW9_SWI_dip_a_1_desc:0 "„Das Gleichgewicht der Großmächte“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Schweizerische Eidgenossenschaft tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SWI_dip_a_2:0 "Eine Mission zu „Das Gleichgewicht der Großmächte“ entsenden"
 AOEIW9_SWI_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Das Gleichgewicht der Großmächte“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SWI_dip_a_3:0 "Wirtschaftlicher Druck: „Das Gleichgewicht der Großmächte“"
 AOEIW9_SWI_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Das Gleichgewicht der Großmächte“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SWI_dip_a_4:0 "Stabsgespräche: „Das Gleichgewicht der Großmächte“"
 AOEIW9_SWI_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Das Gleichgewicht der Großmächte“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SWI_dip_a_5:0 "Formelle Warnung: „Das Gleichgewicht der Großmächte“"
 AOEIW9_SWI_dip_a_5_desc:0 "Eine formelle Warnung zu „Das Gleichgewicht der Großmächte“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SWI_dip_b_1:0 "Alpine Redoubt"
 AOEIW9_SWI_dip_b_1_desc:0 "„Alpine Redoubt“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Schweizerische Eidgenossenschaft tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_SWI_dip_b_2:0 "Eine Mission zu „Alpine Redoubt“ entsenden"
 AOEIW9_SWI_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Alpine Redoubt“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_SWI_dip_b_3:0 "Wirtschaftlicher Druck: „Alpine Redoubt“"
 AOEIW9_SWI_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Alpine Redoubt“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_SWI_dip_b_4:0 "Stabsgespräche: „Alpine Redoubt“"
 AOEIW9_SWI_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Alpine Redoubt“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_SWI_dip_b_5:0 "Formelle Warnung: „Alpine Redoubt“"
 AOEIW9_SWI_dip_b_5_desc:0 "Eine formelle Warnung zu „Alpine Redoubt“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_SWI_dip_final:0 "Neutralität mit Zähnen"
 AOEIW9_SWI_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in der Schweiz sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_SWI_special_1:0 "Notfallmobilmachung"
 AOEIW9_SWI_special_1_desc:0 "„Notfallmobilmachung“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in der Schweiz ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_SWI_special_2:0 "Die Alpenpässe sperren"
 AOEIW9_SWI_special_2_desc:0 "Die Regierung macht „Die Alpenpässe sperren“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in der Schweiz und nicht aus einer universellen Vorlage."
 AOEIW9_SWI_special_3:0 "Die Arsenale dezentralisieren"
 AOEIW9_SWI_special_3_desc:0 "„Die Arsenale dezentralisieren“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in der Schweiz bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_SWI_special_4:0 "Die Kantone mobilisieren"
 AOEIW9_SWI_special_4_desc:0 "Mit „Die Kantone mobilisieren“ verpflichtet sich Schweizerische Eidgenossenschaft auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_SWI_special_5:0 "Versorgungsdepots des Réduit"
 AOEIW9_SWI_special_5_desc:0 "„Versorgungsdepots des Réduit“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in der Schweiz ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_SWI_special_6:0 "Das Nationale Réduit"
 AOEIW9_SWI_special_6_desc:0 "Die Regierung macht „Das Nationale Réduit“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in der Schweiz und nicht aus einer universellen Vorlage."
 AOEIW9_SWI_special_7:0 "Keinen Schritt durch die Alpen"
 AOEIW9_SWI_special_7_desc:0 "„Keinen Schritt durch die Alpen“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in der Schweiz bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_SWI_special_8:0 "Sie kommen nicht durch!"
 AOEIW9_SWI_special_8_desc:0 "Mit „§RSie kommen nicht durch!§!“ verpflichtet sich Schweizerische Eidgenossenschaft auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_TUR_focus_tree:0 "Ottoman Empire Schwerpunktbaum"
 AOEIW9_TUR_politics_root:0 "Die Hohe Pforte und die Last des Reiches"
 AOEIW9_TUR_politics_root_desc:0 "Hohe Pforte, Kaiserliches Parlament und Palastsekretariat beanspruchen alle Einfluss auf die Zukunft im Osmanischen Reich. Eine dauerhafte Ordnung muss ihre Rechte jetzt festlegen, bevor ein Notstand dies mit Gewalt tut."
 AOEIW9_TUR_politics_p1_1:0 "Das Sultanat reformieren"
 AOEIW9_TUR_politics_p1_1_desc:0 "„Sultanat reformieren“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft im Osmanischen Reich."
 AOEIW9_TUR_politics_p1_2:0 "Kaiserliches Parlament versöhnen"
 AOEIW9_TUR_politics_p1_2_desc:0 "Die Stellung von „Kaiserliches Parlament“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Sultanat reformieren“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_TUR_politics_p1_3:0 "Palastsekretariat reformieren"
 AOEIW9_TUR_politics_p1_3_desc:0 "Die Verfahren von „Palastsekretariat“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Sultanat reformieren“ arbeitsfähig bleibt."
 AOEIW9_TUR_politics_p1_4:0 "Provinzgouverneure einbinden"
 AOEIW9_TUR_politics_p1_4_desc:0 "„Provinzgouverneure“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Sultanat reformieren“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_TUR_politics_p1_5:0 "Young Offiziere ausbalancieren"
 AOEIW9_TUR_politics_p1_5_desc:0 "Weder die Ausschaltung von „Young Offiziere“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Sultanat reformieren“ austariert."
 AOEIW9_TUR_politics_p1_6:0 "Ulema gesetzlich ordnen"
 AOEIW9_TUR_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Ulema“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Sultanat reformieren“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_TUR_politics_p1_7:0 "Hohe Pforte und Nation"
 AOEIW9_TUR_politics_p1_7_desc:0 "„Hohe Pforte“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Sultanat reformieren“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_TUR_politics_p2_1:0 "Der kaiserliche Hof"
 AOEIW9_TUR_politics_p2_1_desc:0 "„Kaiserliche Hof“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft im Osmanischen Reich."
 AOEIW9_TUR_politics_p2_2:0 "Palastsekretariat öffnen"
 AOEIW9_TUR_politics_p2_2_desc:0 "Der Zugang zu „Palastsekretariat“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Kaiserliche Hof“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_TUR_politics_p2_3:0 "Provinzgouverneure garantieren"
 AOEIW9_TUR_politics_p2_3_desc:0 "Die Stellung von „Provinzgouverneure“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Kaiserliche Hof“ einzubinden."
 AOEIW9_TUR_politics_p2_4:0 "Young Offiziere erweitern"
 AOEIW9_TUR_politics_p2_4_desc:0 "„Young Offiziere“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Kaiserliche Hof“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_TUR_politics_p2_5:0 "Ulema Verantwortung übertragen"
 AOEIW9_TUR_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Ulema“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Kaiserliche Hof“ durch delegierte Autorität regieren kann."
 AOEIW9_TUR_politics_p2_6:0 "Hohe Pforte ratifizieren"
 AOEIW9_TUR_politics_p2_6_desc:0 "Ein formeller Ratifizierungsakt legt die Stellung von „Hohe Pforte“ in der neuen Ordnung fest. Danach beruht der Kurs „Kaiserliche Hof“ auf Recht und Verfahren statt auf persönlichen Absprachen."
 AOEIW9_TUR_politics_p2_7:0 "Eine neue Charta für Osmanisches Reich"
 AOEIW9_TUR_politics_p2_7_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Kaiserliche Hof“ in einen dauerhaften Rahmen für das Osmanische Reich. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_TUR_politics_p3_1:0 "Osmanisches Reich: Die jungen Offiziere"
 AOEIW9_TUR_politics_p3_1_desc:0 "„Osmanisches Reich: Die jungen Offiziere“ soll mehr sein als ein Schlagwort: Seine Anhänger wollen die staatlichen Entscheidungswege kontrollieren und nicht nur die öffentliche Meinung verschieben. Mit diesem Kurs beginnt der institutionelle Kampf um die Zukunft im Osmanischen Reich."
 AOEIW9_TUR_politics_p3_2:0 "Provinzgouverneure mobilisieren"
 AOEIW9_TUR_politics_p3_2_desc:0 "„Provinzgouverneure“ wird zu einem organisatorischen Träger des Projekts „Osmanisches Reich: Die jungen Offiziere“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_TUR_politics_p3_3:0 "Die Macht von Young Offiziere brechen"
 AOEIW9_TUR_politics_p3_3_desc:0 "Die eigenständige Macht von „Young Offiziere“ ist mit dem Projekt „Osmanisches Reich: Die jungen Offiziere“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_TUR_politics_p3_4:0 "Ulema ersetzen"
 AOEIW9_TUR_politics_p3_4_desc:0 "„Ulema“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Osmanisches Reich: Die jungen Offiziere“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_TUR_politics_p3_5:0 "Hohe Pforte unter direkte Führung stellen"
 AOEIW9_TUR_politics_p3_5_desc:0 "„Hohe Pforte“ wird den durch den Kurs „Osmanisches Reich: Die jungen Offiziere“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_TUR_politics_p3_6:0 "Kaiserliches Parlament neu gestalten"
 AOEIW9_TUR_politics_p3_6_desc:0 "„Kaiserliches Parlament“ bleibt bestehen, aber unter neuen Bedingungen. Zusammensetzung und Befugnisse werden so verändert, dass die Institution den Ausgleich „Osmanisches Reich: Die jungen Offiziere“ stützt statt das alte Gleichgewicht zu konservieren."
 AOEIW9_TUR_politics_p3_7:0 "Osmanisches Reich: Neuordnung: Young Offiziere"
 AOEIW9_TUR_politics_p3_7_desc:0 "Der politische Konflikt um „Young Offiziere“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Osmanisches Reich: Die jungen Offiziere“ untergeordnet werden."
 AOEIW9_TUR_politics_settlement:0 "Der neu geordnete Hohe Staat"
 AOEIW9_TUR_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Hohe Pforte, Kaiserliches Parlament und Palastsekretariat eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Osmanisches Reich kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_TUR_eco_root:0 "Bestandsaufnahme: Istanbul Industrie"
 AOEIW9_TUR_eco_root_desc:0 "Istanbul Industrie, Anatolian Eisenbahnen und Zonguldak Kohle arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Osmanisches Reich am schnellsten ausbauen kann."
 AOEIW9_TUR_eco_civ_1:0 "Istanbul Industrie vermessen"
 AOEIW9_TUR_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Istanbul Industrie“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren."
 AOEIW9_TUR_eco_civ_2:0 "Schienen nach Anatolian Eisenbahnen"
 AOEIW9_TUR_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Anatolian Eisenbahnen“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_TUR_eco_civ_3:0 "Kapital für Zonguldak Kohle"
 AOEIW9_TUR_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Zonguldak Kohle“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_TUR_eco_civ_4:0 "Strom für Izmir Commerce"
 AOEIW9_TUR_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „Izmir Commerce“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_TUR_eco_civ_5:0 "Ausbau von Bosporus Werften"
 AOEIW9_TUR_eco_civ_5_desc:0 "Für „Bosporus Werften“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_TUR_eco_civ_6:0 "Kaiserliche Bauverwaltung erneuern"
 AOEIW9_TUR_eco_civ_6_desc:0 "„Kaiserliche Bauverwaltung“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_TUR_eco_civ_7:0 "Eine zweite Schicht bei Istanbul Industrie"
 AOEIW9_TUR_eco_civ_7_desc:0 "Bei „Istanbul Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_TUR_eco_war_1:0 "Rüstungsaudit: Izmir Commerce"
 AOEIW9_TUR_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Izmir Commerce“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_TUR_eco_war_2:0 "Rüstungsaufträge für Bosporus Werften"
 AOEIW9_TUR_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Bosporus Werften“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_TUR_eco_war_3:0 "Präzisionswerkzeuge für Kaiserliche Bauverwaltung"
 AOEIW9_TUR_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Kaiserliche Bauverwaltung“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_TUR_eco_war_4:0 "Istanbul Industrie für die Aufrüstung ausbauen"
 AOEIW9_TUR_eco_war_4_desc:0 "Rund um „Istanbul Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_TUR_eco_war_5:0 "Anatolian Eisenbahnen standardisieren"
 AOEIW9_TUR_eco_war_5_desc:0 "Die mit „Anatolian Eisenbahnen“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_TUR_eco_war_6:0 "Nachtproduktion bei Zonguldak Kohle"
 AOEIW9_TUR_eco_war_6_desc:0 "Bei „Zonguldak Kohle“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_TUR_eco_war_7:0 "Langfristige Verträge für Izmir Commerce"
 AOEIW9_TUR_eco_war_7_desc:0 "Langfristige Verträge sichern „Izmir Commerce“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_TUR_eco_war_8:0 "Bosporus Werften für volle Produktion mobilisieren"
 AOEIW9_TUR_eco_war_8_desc:0 "„Bosporus Werften“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_TUR_eco_science_1:0 "Istanbul Technische Universität ausstatten"
 AOEIW9_TUR_eco_science_1_desc:0 "„Istanbul Technische Universität“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_TUR_eco_science_2:0 "Neue Labore an Kaiserlich Medical Akademie"
 AOEIW9_TUR_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Kaiserlich Medical Akademie“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_TUR_eco_science_3:0 "Angewandte Forschung an osmanischer Forschungsrat"
 AOEIW9_TUR_eco_science_3_desc:0 "„Osmanischer Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_TUR_eco_science_4:0 "Industriephysik an Istanbul Technische Universität"
 AOEIW9_TUR_eco_science_4_desc:0 "Die Industriephysik an „Istanbul Technische Universität“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_TUR_eco_science_5:0 "Produktionsforschung an Kaiserlich Medical Akademie"
 AOEIW9_TUR_eco_science_5_desc:0 "Bei „Kaiserlich Medical Akademie“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_TUR_eco_science_6:0 "Forschungszuschüsse für osmanischer Forschungsrat"
 AOEIW9_TUR_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Osmanischer Forschungsrat“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_TUR_eco_science_7:0 "Istanbul Technische Universität mit den Fabriken vernetzen"
 AOEIW9_TUR_eco_science_7_desc:0 "„Istanbul Technische Universität“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_TUR_eco_infra_1:0 "Energie für Zonguldak Kohle"
 AOEIW9_TUR_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Zonguldak Kohle“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_TUR_eco_infra_2:0 "Frachtkapazität bei Izmir Commerce"
 AOEIW9_TUR_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Izmir Commerce“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_TUR_eco_infra_3:0 "Arbeiterwohnungen bei Bosporus Werften"
 AOEIW9_TUR_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Bosporus Werften“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_TUR_eco_infra_4:0 "Logistik über Kaiserliche Bauverwaltung"
 AOEIW9_TUR_eco_infra_4_desc:0 "„Kaiserliche Bauverwaltung“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_TUR_eco_final:0 "Der osmanische Entwicklungsstaat"
 AOEIW9_TUR_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Osmanisches Reich wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_TUR_mil_root:0 "osmanischer Generalstab überprüfen"
 AOEIW9_TUR_mil_root_desc:0 "„Osmanischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_TUR_mil_army_1:0 "Die Heeresausbildungskommission"
 AOEIW9_TUR_mil_army_1_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_2:0 "Die anatolische Infanterieschule"
 AOEIW9_TUR_mil_army_2_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_TUR_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_TUR_mil_army_3_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_TUR_mil_army_4_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_5:0 "Das osmanische mobile Korps"
 AOEIW9_TUR_mil_army_5_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_TUR_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_TUR_mil_army_6_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_TUR_mil_army_7_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_TUR_mil_army_8_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_TUR_mil_army_9_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_TUR_mil_army_10_desc:0 "Anatoliens Gelände begünstigt vorbereitete Infanterie, während weite Anmarschwege eine gut versorgte bewegliche Reserve belohnen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_TUR_mil_air_1:0 "Osmanische Luftwaffe neu ordnen"
 AOEIW9_TUR_mil_air_1_desc:0 "„Osmanische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_TUR_mil_air_2:0 "Jagdfliegerausbildung bei Yeşilköy Fliegerschule"
 AOEIW9_TUR_mil_air_2_desc:0 "„Yeşilköy Fliegerschule“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_TUR_mil_air_3:0 "Bodenunterstützungsdoktrin unter Anatolisches Luftkommando"
 AOEIW9_TUR_mil_air_3_desc:0 "Unter „Anatolisches Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_TUR_mil_air_4:0 "Die Reichweite von Osmanische Luftwaffe erhöhen"
 AOEIW9_TUR_mil_air_4_desc:0 "„Osmanische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen im Osmanischen Reich verlangen."
 AOEIW9_TUR_mil_air_5:0 "Radarnetze für Yeşilköy Fliegerschule"
 AOEIW9_TUR_mil_air_5_desc:0 "„Yeşilköy Fliegerschule“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_TUR_mil_air_6:0 "Das Luftkommando unter Anatolisches Luftkommando vereinigen"
 AOEIW9_TUR_mil_air_6_desc:0 "„Anatolisches Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_TUR_mil_air_7:0 "Osmanische Luftwaffe wird einsatzreif"
 AOEIW9_TUR_mil_air_7_desc:0 "„Osmanische Luftwaffe“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_TUR_mil_sea_1:0 "Osmanische Marine überprüfen"
 AOEIW9_TUR_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Osmanische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_TUR_mil_sea_2:0 "Ausbau: Golden Horn Arsenal"
 AOEIW9_TUR_mil_sea_2_desc:0 "„Golden Horn Arsenal“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_TUR_mil_sea_3:0 "Flottenmanöver mit Eastern Mittelmeerflotte"
 AOEIW9_TUR_mil_sea_3_desc:0 "Flottenmanöver mit „Eastern Mittelmeerflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_TUR_mil_sea_4:0 "Sicherungsdoktrin für Osmanische Marine"
 AOEIW9_TUR_mil_sea_4_desc:0 "„Osmanische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_TUR_mil_sea_5:0 "Marineflieger bei Golden Horn Arsenal"
 AOEIW9_TUR_mil_sea_5_desc:0 "Marineflieger werden mit „Golden Horn Arsenal“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_TUR_mil_sea_6:0 "Neue Schiffskörper für Eastern Mittelmeerflotte"
 AOEIW9_TUR_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Eastern Mittelmeerflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_TUR_mil_sea_7:0 "Seeoberkommando unter Osmanische Marine"
 AOEIW9_TUR_mil_sea_7_desc:0 "„Osmanische Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für das Osmanische Reich wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_TUR_mil_final:0 "Osmanisches Reich: Mobile Verteidigung"
 AOEIW9_TUR_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Osmanisches Reich verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_TUR_dip_root:0 "Define osmanisch Grand Strategy"
 AOEIW9_TUR_dip_root_desc:0 "Osmanisches Reich muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_TUR_dip_a_1:0 "Die persische Grenze"
 AOEIW9_TUR_dip_a_1_desc:0 "„Persische Grenze“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Osmanisches Reich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_TUR_dip_a_2:0 "Eine Mission zu „Persische Grenze“ entsenden"
 AOEIW9_TUR_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Persische Grenze“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_TUR_dip_a_3:0 "Wirtschaftlicher Druck: „Persische Grenze“"
 AOEIW9_TUR_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Persische Grenze“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_TUR_dip_a_4:0 "Stabsgespräche: „Persische Grenze“"
 AOEIW9_TUR_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Persische Grenze“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_TUR_dip_a_5:0 "Formelle Warnung: „Persische Grenze“"
 AOEIW9_TUR_dip_a_5_desc:0 "Eine formelle Warnung zu „Persische Grenze“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_TUR_dip_a_6:0 "Bedingungen für „Persische Grenze“"
 AOEIW9_TUR_dip_a_6_desc:0 "Für „Persische Grenze“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_TUR_dip_a_7:0 "Die Entscheidung über „Persische Grenze“"
 AOEIW9_TUR_dip_a_7_desc:0 "Bei „Persische Grenze“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_TUR_dip_b_1:0 "Die russischen Meerengen"
 AOEIW9_TUR_dip_b_1_desc:0 "„Russische Meerengen“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Osmanisches Reich tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_TUR_dip_b_2:0 "Eine Mission zu „Russische Meerengen“ entsenden"
 AOEIW9_TUR_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Russische Meerengen“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_TUR_dip_b_3:0 "Wirtschaftlicher Druck: „Russische Meerengen“"
 AOEIW9_TUR_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Russische Meerengen“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_TUR_dip_b_4:0 "Stabsgespräche: „Russische Meerengen“"
 AOEIW9_TUR_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Russische Meerengen“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_TUR_dip_b_5:0 "Formelle Warnung: „Russische Meerengen“"
 AOEIW9_TUR_dip_b_5_desc:0 "Eine formelle Warnung zu „Russische Meerengen“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_TUR_dip_b_6:0 "Bedingungen für „Russische Meerengen“"
 AOEIW9_TUR_dip_b_6_desc:0 "Für „Russische Meerengen“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_TUR_dip_b_7:0 "Die Entscheidung über „Russische Meerengen“"
 AOEIW9_TUR_dip_b_7_desc:0 "Bei „Russische Meerengen“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_TUR_dip_final:0 "Der osmanische Strategiering"
 AOEIW9_TUR_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers im Osmanischen Reich sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_USA_focus_tree:0 "United States of America Schwerpunktbaum"
 AOEIW9_USA_politics_root:0 "Die Republik am strategischen Scheideweg"
 AOEIW9_USA_politics_root_desc:0 "Die Verfassungsordnung in den Vereinigten Staaten ist zu einem Ringen zwischen Kongress, Weißes Haus und Oberster Gerichtshof geworden. Bevor äußerer Druck die Fronten verhärtet, muss geklärt werden, welche Institutionen tatsächlich regieren und welche nur beraten."
 AOEIW9_USA_politics_p1_1:0 "Die konstitutionelle Republik"
 AOEIW9_USA_politics_p1_1_desc:0 "Kongress, Gerichte und Weißes Haus müssen auf die Krise antworten, ohne die Verfassungsordnung zu zerbrechen. Hilfsprogramme, Reformen und Wahlen schützen die Republik vor jenen, die schrankenlose Macht versprechen."
 AOEIW9_USA_politics_p1_2:0 "Weißes Haus versöhnen"
 AOEIW9_USA_politics_p1_2_desc:0 "Die Stellung von „Weißes Haus“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Konstitutionelle Republik“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_USA_politics_p1_3:0 "Oberster Gerichtshof reformieren"
 AOEIW9_USA_politics_p1_3_desc:0 "Die Verfahren von „Oberster Gerichtshof“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Konstitutionelle Republik“ arbeitsfähig bleibt."
 AOEIW9_USA_politics_p1_4:0 "Staatsgouverneure einbinden"
 AOEIW9_USA_politics_p1_4_desc:0 "„Staatsgouverneure“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Konstitutionelle Republik“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_USA_politics_p1_5:0 "Industriell Lobby ausbalancieren"
 AOEIW9_USA_politics_p1_5_desc:0 "Weder die Ausschaltung von „Industriell Lobby“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Konstitutionelle Republik“ austariert."
 AOEIW9_USA_politics_p1_6:0 "Gewerkschaftsverbände gesetzlich ordnen"
 AOEIW9_USA_politics_p1_6_desc:0 "Gewohnheitsrecht und Notmaßnahmen rund um „Gewerkschaftsverbände“ werden durch schriftliche Regeln ersetzt. Damit erhält die Institution einen festen Platz in der Ordnung „Konstitutionelle Republik“ und künftige Verfassungsimprovisation wird begrenzt."
 AOEIW9_USA_politics_p1_7:0 "Kongress und Nation"
 AOEIW9_USA_politics_p1_7_desc:0 "„Kongress“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Konstitutionelle Republik“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_USA_politics_p2_1:0 "Der wirtschaftliche Notstand"
 AOEIW9_USA_politics_p2_1_desc:0 "Kreditausfälle, Arbeitslosigkeit und gebrochene Lieferverträge sind zu einem Bundesnotstand geworden. Hilfen kaufen Zeit, doch das Vertrauen in die zivile Regierung ist bereits beschädigt."
 AOEIW9_USA_politics_p2_2:0 "Lähmung der Regierung"
 AOEIW9_USA_politics_p2_2_desc:0 "Kongress, Gerichte und Exekutive blockieren einander, während sich die Lage verschärft. Die Verwaltungslähmung wird selbst zur Gefahr."
 AOEIW9_USA_politics_p2_3:0 "Die Gouverneurskonferenz"
 AOEIW9_USA_politics_p2_3_desc:0 "Die Staaten verlangen Macht über Hilfe und Sicherheit. Verhandlungen können den Föderalismus retten, Zwang vielleicht die Ordnung – schmerzlos ist keine Wahl."
 AOEIW9_USA_politics_p2_4:0 "Konfrontation zwischen Bund und Staaten"
 AOEIW9_USA_politics_p2_4_desc:0 "Widersprüchliche Befehle erreichen Eisenbahnen, Depots und Polizeien. Der Verfassungsstreit ist zu einem praktischen Kampf darum geworden, wer noch regieren kann."
 AOEIW9_USA_politics_p2_5:0 "Notfallpläne des Kriegsministeriums"
 AOEIW9_USA_politics_p2_5_desc:0 "Der Generalstab erarbeitet Kontinuitätspläne für Transport, Kommunikation und strategische Industrie. Wer den Zusammenbruch plant, macht allerdings auch ein Eingreifen des Militärs denkbar."
 AOEIW9_USA_politics_p2_6:0 "Das Verfassungsultimatum"
 AOEIW9_USA_politics_p2_6_desc:0 "Die zivilen Institutionen müssen sich auf eine zeitweilige Übertragung von Notstandsvollmachten einigen oder eine exekutiv-militärische Lösung hinnehmen. Die Republik erreicht ihre letzte Verfahrenssicherung."
 AOEIW9_USA_politics_p2_7:0 "Eine zeitweilige Militärverwaltung"
 AOEIW9_USA_politics_p2_7_desc:0 "Eine begrenzte Militärverwaltung stellt lebenswichtige Dienste wieder her und verspricht öffentlich eine Verfassungsprüfung. Ob dieses Versprechen gehalten wird, entscheidet die Zukunft des Landes."
 AOEIW9_USA_politics_p3_1:0 "Die Arbeiterrepublik"
 AOEIW9_USA_politics_p3_1_desc:0 "Industriegewerkschaften und Erwerbslosenräte erklären, die Depression habe die alte Republik bereits diskreditiert. Ihr Programm verbindet betriebliche Macht, Gemeineigentum und eine von der Arbeiterschaft geschriebene Verfassung."
 AOEIW9_USA_politics_p3_2:0 "Staatsgouverneure mobilisieren"
 AOEIW9_USA_politics_p3_2_desc:0 "„Staatsgouverneure“ wird zu einem organisatorischen Träger des Projekts „Arbeiterrepublik“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_USA_politics_p3_3:0 "Die Macht von Industriell Lobby brechen"
 AOEIW9_USA_politics_p3_3_desc:0 "Die eigenständige Macht von „Industriell Lobby“ ist mit dem Projekt „Arbeiterrepublik“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_USA_politics_p3_4:0 "Gewerkschaftsverbände ersetzen"
 AOEIW9_USA_politics_p3_4_desc:0 "„Gewerkschaftsverbände“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Arbeiterrepublik“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_USA_politics_p3_5:0 "Kongress unter direkte Führung stellen"
 AOEIW9_USA_politics_p3_5_desc:0 "„Kongress“ wird den durch den Kurs „Arbeiterrepublik“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_USA_politics_p3_6:0 "Weißes Haus neu gestalten"
 AOEIW9_USA_politics_p3_6_desc:0 "„Weißes Haus“ bleibt bestehen, aber unter neuen Bedingungen. Zusammensetzung und Befugnisse werden so verändert, dass die Institution den Ausgleich „Arbeiterrepublik“ stützt statt das alte Gleichgewicht zu konservieren."
 AOEIW9_USA_politics_p3_7:0 "Die Sterne werden rot"
 AOEIW9_USA_politics_p3_7_desc:0 "Die alte Bundesordnung hat Fabriken und Straßen verloren. Arbeiterdelegierte tragen ihr Mandat nach Washington und rufen eine Republik aus, die der Arbeiterschaft verantwortlich ist."
 AOEIW9_USA_politics_settlement:0 "Washington regiert wieder"
 AOEIW9_USA_politics_settlement_desc:0 "Befehle gelangen wieder von einer anerkannten Regierung zu Gerichten, Bundesstaaten und Ämtern. Die Verfassungskrise ist vorbei; ihre Sieger müssen nun das gerettete Land regieren."
 AOEIW9_USA_eco_root:0 "USA: Bestandsaufnahme: Industrie der Großen Seen"
 AOEIW9_USA_eco_root_desc:0 "Industrie der Großen Seen, Detroit Motor Werke und Tennessee Valley Authority arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Vereinigte Staaten von Amerika am schnellsten ausbauen kann."
 AOEIW9_USA_eco_civ_1:0 "USA: Industrie der Großen Seen vermessen"
 AOEIW9_USA_eco_civ_1_desc:0 "Eine genaue Bestandsaufnahme von „Industrie der Großen Seen“ erfasst Anlagen, Arbeitskräfte, Stromversorgung und Transportengpässe. Investitionen können sich danach an gemessenen Defiziten statt an politischen Vermutungen orientieren. In USA wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_USA_eco_civ_2:0 "Schienen nach Detroit Motor Werke"
 AOEIW9_USA_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Detroit Motor Werke“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_USA_eco_civ_3:0 "Kapital für Tennessee Valley Authority"
 AOEIW9_USA_eco_civ_3_desc:0 "Staatlich gestützte Kredite verschaffen „Tennessee Valley Authority“ langfristiges Kapital für Maschinen, Werkstätten und Infrastruktur. Das Programm erweitert reale Produktionskapazität statt kurzfristigen Konsum zu finanzieren."
 AOEIW9_USA_eco_civ_4:0 "Strom für New Yorker Finanzwesen"
 AOEIW9_USA_eco_civ_4_desc:0 "Neue Erzeugungs- und Leitungsanlagen werden auf „New Yorker Finanzwesen“ ausgerichtet. Eine zuverlässige Stromversorgung ermöglicht schwerere Maschinen, längere Schichten und dichteres industrielles Wachstum."
 AOEIW9_USA_eco_civ_5:0 "Ausbau von West Coast Werften"
 AOEIW9_USA_eco_civ_5_desc:0 "Für „West Coast Werften“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann."
 AOEIW9_USA_eco_civ_6:0 "Das Bureau of Public Roads an die Arbeit"
 AOEIW9_USA_eco_civ_6_desc:0 "Bundesingenieure und Bautrupps der Staaten machen aus der Arbeitsbeschaffung Straßen zwischen Farmen, Fabriken und Militärdepots."
 AOEIW9_USA_eco_civ_7:0 "USA: Eine zweite Schicht bei Industrie der Großen Seen"
 AOEIW9_USA_eco_civ_7_desc:0 "Bei „Industrie der Großen Seen“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus. In USA wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_USA_eco_war_1:0 "Rüstungsaudit: New Yorker Finanzwesen"
 AOEIW9_USA_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „New Yorker Finanzwesen“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_USA_eco_war_2:0 "Rüstungsaufträge für West Coast Werften"
 AOEIW9_USA_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „West Coast Werften“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen."
 AOEIW9_USA_eco_war_3:0 "Werkzeugmaschinen für die Bundesstraßen"
 AOEIW9_USA_eco_war_3_desc:0 "Brückenwerkstätten und Straßendepots brauchen dieselben Präzisionsbohrer, Lehren und Drehbänke wie die Rüstungswerke. Washington rüstet beide aus."
 AOEIW9_USA_eco_war_4:0 "USA: Industrie der Großen Seen für die Aufrüstung ausbauen"
 AOEIW9_USA_eco_war_4_desc:0 "Rund um „Industrie der Großen Seen“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager. In USA wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_USA_eco_war_5:0 "Detroit Motor Werke standardisieren"
 AOEIW9_USA_eco_war_5_desc:0 "Die mit „Detroit Motor Werke“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_USA_eco_war_6:0 "Nachtproduktion bei Tennessee Valley Authority"
 AOEIW9_USA_eco_war_6_desc:0 "Bei „Tennessee Valley Authority“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_USA_eco_war_7:0 "Langfristige Verträge für New Yorker Finanzwesen"
 AOEIW9_USA_eco_war_7_desc:0 "Langfristige Verträge sichern „New Yorker Finanzwesen“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_USA_eco_war_8:0 "West Coast Werften für volle Produktion mobilisieren"
 AOEIW9_USA_eco_war_8_desc:0 "„West Coast Werften“ wird durch priorisierte Rohstoffe, Arbeitskräfte und Produktionspläne vollständig in das Rüstungsprogramm eingebunden. Mobilisierung bedeutet koordinierte Lieferketten und nicht bloß längere Schichten."
 AOEIW9_USA_eco_science_1:0 "MIT-Labore ausstatten"
 AOEIW9_USA_eco_science_1_desc:0 "„MIT-Labore“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_USA_eco_science_2:0 "Neue Labore an National Bureau of Standards"
 AOEIW9_USA_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „National Bureau of Standards“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_USA_eco_science_3:0 "Die NACA übernimmt"
 AOEIW9_USA_eco_science_3_desc:0 "Langley bringt Hochschultheorie, militärische Anforderungen und Flugzeugbauer in denselben Windkanal."
 AOEIW9_USA_eco_science_4:0 "Industriephysik an MIT-Labore"
 AOEIW9_USA_eco_science_4_desc:0 "Die Industriephysik an „MIT-Labore“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_USA_eco_science_5:0 "Produktionsforschung an National Bureau of Standards"
 AOEIW9_USA_eco_science_5_desc:0 "Bei „National Bureau of Standards“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_USA_eco_science_6:0 "Mehr Windkanäle für Langley"
 AOEIW9_USA_eco_science_6_desc:0 "Die NACA prüft vollständige Tragflächen, Motoren und Hochgeschwindigkeitsformen, statt jeden Hersteller dieselben Fehler wiederholen zu lassen."
 AOEIW9_USA_eco_science_7:0 "MIT-Labore mit den Fabriken vernetzen"
 AOEIW9_USA_eco_science_7_desc:0 "„MIT-Labore“ wird direkt mit Konstruktionsbüros, Prüfabteilungen und Produktionsingenieuren der Fabriken verbunden. Forschungsergebnisse sollen daran gemessen werden, ob sie zuverlässig in die Serienfertigung gelangen."
 AOEIW9_USA_eco_infra_1:0 "Energie für Tennessee Valley Authority"
 AOEIW9_USA_eco_infra_1_desc:0 "Erzeugungsleistung und Netzausbau werden auf „Tennessee Valley Authority“ konzentriert, wo unsichere Stromversorgung die Nutzung vorhandener Anlagen begrenzt. Elektrizität wird als industrielle Infrastruktur und nicht als getrenntes Bauprogramm behandelt."
 AOEIW9_USA_eco_infra_2:0 "Frachtkapazität bei New Yorker Finanzwesen"
 AOEIW9_USA_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „New Yorker Finanzwesen“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_USA_eco_infra_3:0 "Arbeiterwohnungen bei West Coast Werften"
 AOEIW9_USA_eco_infra_3_desc:0 "Arbeiterwohnungen bei „West Coast Werften“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen."
 AOEIW9_USA_eco_infra_4:0 "Verteidigungsstraßen durch die Staaten"
 AOEIW9_USA_eco_infra_4_desc:0 "Das Bureau of Public Roads erfasst Brücken, Umgehungen und Depotzufahrten, die ein Heer über den Kontinent bewegen."
 AOEIW9_USA_eco_final:0 "Die kontinentale Produktionsmaschine"
 AOEIW9_USA_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In USA wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_USA_mil_root:0 "Generalstab der Vereinigten Staaten überprüfen"
 AOEIW9_USA_mil_root_desc:0 "„Generalstab der Vereinigten Staaten“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_USA_mil_army_1:0 "Die Louisiana-Manöver"
 AOEIW9_USA_mil_army_1_desc:0 "Zwei Feldarmeen testen die Massenmobilmachung in Louisiana und Texas. Staus, defekte Funkgeräte und erschöpfte Nachschubkolonnen entscheiden den Streit vor dem Feind."
 AOEIW9_USA_mil_army_2:0 "Das Infanterie-Artillerie-Team"
 AOEIW9_USA_mil_army_2_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Wählt die Infanteriespezialisierung. Die Panzerspezialisierung entfällt; Panzerforschung und -produktion bleiben möglich."
 AOEIW9_USA_mil_army_3:0 "Infanteriegeschütze und vorgeschobene Beobachter"
 AOEIW9_USA_mil_army_3_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_USA_mil_army_4_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_5:0 "Die Armored Force"
 AOEIW9_USA_mil_army_5_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Wählt die Panzerspezialisierung. Die Infanteriespezialisierung entfällt; Infanterieforschung und -produktion bleiben möglich."
 AOEIW9_USA_mil_army_6:0 "Panzerschulen und Bergekommandos"
 AOEIW9_USA_mil_army_6_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_USA_mil_army_7_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_USA_mil_army_8_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_9:0 "Stabsübungen aller Waffengattungen"
 AOEIW9_USA_mil_army_9_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_army_10:0 "Eine Armee für ihren Auftrag"
 AOEIW9_USA_mil_army_10_desc:0 "Die amerikanische Mobilmachung muss entscheiden, ob Feuerkraft oder mechanisierte Ausnutzung Vorrang bei der Ausbildung erhält. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_USA_mil_air_1:0 "Luftkorps der US-Armee neu ordnen"
 AOEIW9_USA_mil_air_1_desc:0 "„Luftkorps der US-Armee“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_USA_mil_air_2:0 "Lehren aus Maxwell Field"
 AOEIW9_USA_mil_air_2_desc:0 "Die Air Corps Tactical School macht aus ihren Debatten über Jagdflugzeuge, Bomber und Erdkampf einen Einsatzplan."
 AOEIW9_USA_mil_air_3:0 "Bodenunterstützungsdoktrin unter Strategisch Bomber Kommando"
 AOEIW9_USA_mil_air_3_desc:0 "Unter „Strategisch Bomber Kommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln."
 AOEIW9_USA_mil_air_4:0 "Die Reichweite von Luftkorps der US-Armee erhöhen"
 AOEIW9_USA_mil_air_4_desc:0 "„Luftkorps der US-Armee“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in den Vereinigten Staaten verlangen."
 AOEIW9_USA_mil_air_5:0 "Radar in Fort Monmouth"
 AOEIW9_USA_mil_air_5_desc:0 "Ingenieure des Signal Corps bringen die Funkortung vom Labortisch in ein brauchbares Warnnetz."
 AOEIW9_USA_mil_air_6:0 "Das Luftkommando unter Strategisch Bomber Kommando vereinigen"
 AOEIW9_USA_mil_air_6_desc:0 "„Strategisch Bomber Kommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_USA_mil_air_7:0 "Luftkorps der US-Armee wird einsatzreif"
 AOEIW9_USA_mil_air_7_desc:0 "„Luftkorps der US-Armee“ verfügt nun über Schulen, Führungsnetz und Einsatzdoktrin einer modernen Luftwaffe. Weiteres Wachstum kann auf einem funktionierenden System aufbauen statt auf Improvisation."
 AOEIW9_USA_mil_sea_1:0 "United States Marine überprüfen"
 AOEIW9_USA_mil_sea_1_desc:0 "Eine vollständige Prüfung von „United States Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_USA_mil_sea_2:0 "Ausbau: Marinewerft Norfolk"
 AOEIW9_USA_mil_sea_2_desc:0 "„Marinewerft Norfolk“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_USA_mil_sea_3:0 "Flottenmanöver mit Pazifikflotte"
 AOEIW9_USA_mil_sea_3_desc:0 "Flottenmanöver mit „Pazifikflotte“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_USA_mil_sea_4:0 "Sicherungsdoktrin für United States Marine"
 AOEIW9_USA_mil_sea_4_desc:0 "„United States Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_USA_mil_sea_5:0 "Marineflieger bei Marinewerft Norfolk"
 AOEIW9_USA_mil_sea_5_desc:0 "Marineflieger werden mit „Marinewerft Norfolk“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_USA_mil_sea_6:0 "Neue Schiffskörper für Pazifikflotte"
 AOEIW9_USA_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Pazifikflotte“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_USA_mil_sea_7:0 "Seeoberkommando unter United States Marine"
 AOEIW9_USA_mil_sea_7_desc:0 "„United States Marine“ erhält Doktrin, Landunterstützung und Führungsstrukturen, um die für die Vereinigten Staaten wichtigen Seewege zu bestreiten. Ziel ist wirksame Kontrolle an entscheidenden Punkten statt symbolischer Weltgeltung."
 AOEIW9_USA_mil_final:0 "Industriell Warfare"
 AOEIW9_USA_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Vereinigte Staaten von Amerika verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_USA_dip_root:0 "Die Doktrin „Two-Ocean“ festlegen"
 AOEIW9_USA_dip_root_desc:0 "Vereinigte Staaten von Amerika muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_USA_dip_a_1:0 "Die Atlantikfrage"
 AOEIW9_USA_dip_a_1_desc:0 "„Atlantikfrage“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Vereinigte Staaten von Amerika tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_USA_dip_a_2:0 "Eine Mission zu „Atlantikfrage“ entsenden"
 AOEIW9_USA_dip_a_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Atlantikfrage“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_USA_dip_a_3:0 "Wirtschaftlicher Druck: „Atlantikfrage“"
 AOEIW9_USA_dip_a_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Atlantikfrage“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_USA_dip_a_4:0 "Stabsgespräche: „Atlantikfrage“"
 AOEIW9_USA_dip_a_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Atlantikfrage“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_USA_dip_a_5:0 "Formelle Warnung: „Atlantikfrage“"
 AOEIW9_USA_dip_a_5_desc:0 "Eine formelle Warnung zu „Atlantikfrage“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_USA_dip_a_6:0 "Bedingungen für „Atlantikfrage“"
 AOEIW9_USA_dip_a_6_desc:0 "Für „Atlantikfrage“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_USA_dip_a_7:0 "Die Entscheidung über „Atlantikfrage“"
 AOEIW9_USA_dip_a_7_desc:0 "Bei „Atlantikfrage“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_USA_dip_b_1:0 "Die pazifische Herausforderung"
 AOEIW9_USA_dip_b_1_desc:0 "„Pazifische Herausforderung“ wird offiziell auf die Tagesordnung des Kabinetts gesetzt. Diplomatie, Wirtschaft und Militär müssen zuerst festlegen, was Vereinigte Staaten von Amerika tatsächlich erreichen will, bevor Druck ausgeübt wird."
 AOEIW9_USA_dip_b_2:0 "Eine Mission zu „Pazifische Herausforderung“ entsenden"
 AOEIW9_USA_dip_b_2_desc:0 "Eine Mission soll Zusagen sondieren, den Spielraum für Kompromisse prüfen und einen direkten Gesprächskanal zu „Pazifische Herausforderung“ schaffen. Die Delegation erhält klare Ziele statt eines zeremoniellen Reiseplans."
 AOEIW9_USA_dip_b_3:0 "Wirtschaftlicher Druck: „Pazifische Herausforderung“"
 AOEIW9_USA_dip_b_3_desc:0 "Zölle, Kredite, Transit- und Rohstoffzugang werden genutzt, um bei „Pazifische Herausforderung“ Verhandlungsmacht aufzubauen. Der wirtschaftliche Druck soll Gespräche erzwingen, ohne die Armee vorschnell festzulegen."
 AOEIW9_USA_dip_b_4:0 "Stabsgespräche: „Pazifische Herausforderung“"
 AOEIW9_USA_dip_b_4_desc:0 "Die Generalstäbe vergleichen Karten, Mobilmachungsannahmen und Grenzplanungen im Zusammenhang mit „Pazifische Herausforderung“. So erhalten Diplomaten ein realistisches Bild davon, was weitere Eskalation militärisch kosten würde."
 AOEIW9_USA_dip_b_5:0 "Formelle Warnung: „Pazifische Herausforderung“"
 AOEIW9_USA_dip_b_5_desc:0 "Eine formelle Warnung zu „Pazifische Herausforderung“ legt rote Linien und Folgen offen. Die Botschaft soll Mehrdeutigkeit beseitigen, bevor aus einer Krise durch Fehlkalkulation ein Krieg wird."
 AOEIW9_USA_dip_b_6:0 "Bedingungen für „Pazifische Herausforderung“"
 AOEIW9_USA_dip_b_6_desc:0 "Für „Pazifische Herausforderung“ werden Ultimatumsbedingungen gemeinsam mit Mobilmachungs- und Wirtschaftsplanungen vorbereitet. Die Regierung soll keine Forderungen stellen, die sie im Ernstfall nicht durchsetzen kann."
 AOEIW9_USA_dip_b_7:0 "Die Entscheidung über „Pazifische Herausforderung“"
 AOEIW9_USA_dip_b_7_desc:0 "Bei „Pazifische Herausforderung“ fällt die Grundsatzentscheidung. Falls ein Kompromiss gescheitert ist, liegen nun politische Begründung, militärische Vorbereitung und wirtschaftliche Maßnahmen für eine letzte Konfrontation vor."
 AOEIW9_USA_dip_final:0 "Eine Zwei-Ozean-Strategie"
 AOEIW9_USA_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in den Vereinigten Staaten sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
 AOEIW9_USA_special_1:0 "Das Arsenal der Demokratie"
 AOEIW9_USA_special_1_desc:0 "Die Fabriken der Republik liefern Waffen in einem Umfang, den kein Angreifer übertreffen kann. Jeder Auftrag dient nun diesem Versprechen."
 AOEIW9_USA_special_2:0 "Detroit wechselt die Pressformen"
 AOEIW9_USA_special_2_desc:0 "Automobilwerke stoppen bekannte Modelle, schneiden ihre Pressformen neu und liefern Motoren, Lastwagen und Panzerwannen zu Tausenden."
 AOEIW9_USA_special_3:0 "Bundesweite Kriegsaufträge"
 AOEIW9_USA_special_3_desc:0 "„Bundesweite Kriegsaufträge“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in den Vereinigten Staaten bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_USA_special_4:0 "Programm für synthetische Werkstoffe"
 AOEIW9_USA_special_4_desc:0 "Mit „Programm für synthetische Werkstoffe“ verpflichtet sich Vereinigte Staaten von Amerika auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_USA_special_5:0 "Standards der Massenproduktion"
 AOEIW9_USA_special_5_desc:0 "„Standards der Massenproduktion“ behandelt ein strategisches Problem, das sich aus der besonderen Lage in den Vereinigten Staaten ergibt. Institutionen und Ressourcen werden gezielt dafür eingesetzt, statt einen austauschbaren Bonus hinter einem national klingenden Namen zu verstecken."
 AOEIW9_USA_special_6:0 "Das Netz der Siegeswerke"
 AOEIW9_USA_special_6_desc:0 "Die Regierung macht „Das Netz der Siegeswerke“ zu einem klaren Programm mit Haushalt, Zuständigkeiten und messbaren strategischen Zielen. Sein Wert entsteht aus der Lage in den Vereinigten Staaten und nicht aus einer universellen Vorlage."
 AOEIW9_USA_special_7:0 "Kontinentale Logistik"
 AOEIW9_USA_special_7_desc:0 "„Kontinentale Logistik“ verbindet wirtschaftliche Kapazität, Planung und militärische Anforderungen, die in den Vereinigten Staaten bereits vorhanden sind. Das Programm verändert ihre Organisation, statt lediglich politische Macht zu vergeben."
 AOEIW9_USA_special_8:0 "Arsenal der Republik"
 AOEIW9_USA_special_8_desc:0 "Mit „Arsenal der Republik“ verpflichtet sich Vereinigte Staaten von Amerika auf eine Fähigkeit, von der die eigene Gesamtstrategie tatsächlich abhängt. Sie wird als nationale Besonderheit aufgebaut und nicht als Kopie des Pfades eines anderen Landes."
 AOEIW9_YUG_focus_tree:0 "Kingdom of Yugoslavia Schwerpunktbaum"
 AOEIW9_YUG_politics_p1_2:0 "Jugoslawien: Nationalversammlung versöhnen"
 AOEIW9_YUG_politics_p1_2_desc:0 "Die Stellung von „Nationalversammlung“ blockiert zunehmend die Regierungsarbeit. Ein politischer Ausgleich soll die Institution in das Projekt „Königliche Kompromiss“ einbinden, ohne sie zu einer bloßen Abstimmungsmaschine zu machen."
 AOEIW9_YUG_politics_p1_3:0 "serbisches Offizierskorps reformieren"
 AOEIW9_YUG_politics_p1_3_desc:0 "Die Verfahren von „Serbisches Offizierskorps“ stammen aus einem älteren politischen Gleichgewicht. Regeln, Ernennungen und Zuständigkeiten werden so geändert, dass die Institution im Rahmen von „Königliche Kompromiss“ arbeitsfähig bleibt."
 AOEIW9_YUG_politics_p1_4:0 "Kroatische Abgeordnete einbinden"
 AOEIW9_YUG_politics_p1_4_desc:0 "„Kroatische Abgeordnete“ wird durch Ernennungen, Haushalte und formelle Pflichten an das Projekt „Königliche Kompromiss“ gebunden. Loyalität soll institutionell abgesichert werden und nicht auf einem vorübergehenden Kabinettskompromiss beruhen."
 AOEIW9_YUG_politics_p1_5:0 "Slowenische Räte ausbalancieren"
 AOEIW9_YUG_politics_p1_5_desc:0 "Weder die Ausschaltung von „Slowenische Räte“ noch eine vollständige Unterordnung des Staates unter diese Institution würde Stabilität schaffen. Ihr Einfluss wird gegen die übrigen Träger des Kurses „Königliche Kompromiss“ austariert."
 AOEIW9_YUG_politics_p1_6:0 "Jugoslawien: Königshof und Nation"
 AOEIW9_YUG_politics_p1_6_desc:0 "„Königshof“ wird als Teil der nationalen Ordnung und nicht als Instrument einer einzelnen Fraktion dargestellt. Der Kurs „Königliche Kompromiss“ verbindet damit Legitimität und Verwaltung."
 AOEIW9_YUG_politics_p2_2:0 "serbisches Offizierskorps öffnen"
 AOEIW9_YUG_politics_p2_2_desc:0 "Der Zugang zu „Serbisches Offizierskorps“ wird verbreitert und weniger von geschlossenen Patronagen abhängig gemacht. So kann der Kurs „Belgrad zentralisieren“ seine Unterstützung auf legalem Weg ausweiten."
 AOEIW9_YUG_politics_p2_3:0 "Kroatische Abgeordnete garantieren"
 AOEIW9_YUG_politics_p2_3_desc:0 "Die Stellung von „Kroatische Abgeordnete“ wird durch Gesetze und politische Garantien geschützt. Diese Sicherheit ist der Preis dafür, die Institution fest in den Ausgleich „Belgrad zentralisieren“ einzubinden."
 AOEIW9_YUG_politics_p2_4:0 "Slowenische Räte erweitern"
 AOEIW9_YUG_politics_p2_4_desc:0 "„Slowenische Räte“ erhält mehr Einfluss auf Beratung, Verwaltung und Mobilmachung. Das Projekt „Belgrad zentralisieren“ gewinnt damit eine breitere gesellschaftliche Basis, ohne die Institution außerhalb eines klaren Verfassungsrahmens handeln zu lassen."
 AOEIW9_YUG_politics_p2_5:0 "Banovina Administrations Verantwortung übertragen"
 AOEIW9_YUG_politics_p2_5_desc:0 "Konkrete Verantwortung wird an „Banovina Administrations“ übertragen. Die Institution erhält echte Befugnisse bei der Umsetzung und soll beweisen, dass die Ordnung „Belgrad zentralisieren“ durch delegierte Autorität regieren kann."
 AOEIW9_YUG_politics_p2_6:0 "Eine neue Charta für Königreich Jugoslawien"
 AOEIW9_YUG_politics_p2_6_desc:0 "Eine neue Verfassungscharta überführt das Projekt „Belgrad zentralisieren“ in einen dauerhaften Rahmen für Jugoslawien. Sie legt Autorität, Repräsentation und die Grenzen von Notstandsbefugnissen fest."
 AOEIW9_YUG_politics_p3_2:0 "Kroatische Abgeordnete mobilisieren"
 AOEIW9_YUG_politics_p3_2_desc:0 "„Kroatische Abgeordnete“ wird zu einem organisatorischen Träger des Projekts „Föderaler Jugoslawismus“. Der politische Kampf wird damit aus den Kabinettszimmern in Verwaltung und Öffentlichkeit getragen."
 AOEIW9_YUG_politics_p3_3:0 "Die Macht von Slowenische Räte brechen"
 AOEIW9_YUG_politics_p3_3_desc:0 "Die eigenständige Macht von „Slowenische Räte“ ist mit dem Projekt „Föderaler Jugoslawismus“ unvereinbar. Patronage, Vetorechte und organisatorische Autonomie werden beseitigt, bevor sie die neue Ordnung blockieren können."
 AOEIW9_YUG_politics_p3_4:0 "Banovina Administrations ersetzen"
 AOEIW9_YUG_politics_p3_4_desc:0 "„Banovina Administrations“ verliert seine bisherige Schlüsselstellung und wird durch Funktionsträger ersetzt, die dem Ausgleich „Föderaler Jugoslawismus“ verpflichtet sind. Institutionelle Kontinuität weicht politischer Kontrolle."
 AOEIW9_YUG_politics_p3_5:0 "Jugoslawien: Königshof unter direkte Führung stellen"
 AOEIW9_YUG_politics_p3_5_desc:0 "„Königshof“ wird den durch den Kurs „Föderaler Jugoslawismus“ geschaffenen Behörden direkt unterstellt. Entscheidend sind Kontrolle über Ernennungen, Informationen und Umsetzung, nicht bloße Symbolik."
 AOEIW9_YUG_politics_p3_6:0 "Neuordnung: Federal Yugoslavism"
 AOEIW9_YUG_politics_p3_6_desc:0 "Der politische Konflikt um „Federal Yugoslavism“ wird in einem formellen Ausgleich beendet. Seine Bedingungen bestimmen, welche Institutionen ihre Eigenständigkeit behalten und welche dem Kurs „Föderaler Jugoslawismus“ untergeordnet werden."
 AOEIW9_YUG_politics_settlement:0 "Der Belgrader Ausgleich"
 AOEIW9_YUG_politics_settlement_desc:0 "Der gewählte Ausgleich gibt Königshof, Nationalversammlung und serbisches Offizierskorps eine klare Zuständigkeitsordnung statt überlappender Vetorechte. Königreich Jugoslawien kann nun mit Institutionen regiert werden, die zur eingeschlagenen politischen Ordnung passen."
 AOEIW9_YUG_eco_root:0 "Bestandsaufnahme: Belgrad Industrie"
 AOEIW9_YUG_eco_root_desc:0 "Belgrad Industrie, Zagreber Werkstätten und Bosnian Minen arbeiten noch nicht als Teile einer gemeinsamen Wirtschaftsstrategie. Die Regierung erfasst Kapazitäten, Transport und Investitionsbedarf, bevor sie entscheidet, wo Königreich Jugoslawien am schnellsten ausbauen kann."
 AOEIW9_YUG_eco_civ_2:0 "Schienen nach Zagreber Werkstätten"
 AOEIW9_YUG_eco_civ_2_desc:0 "Die Bahnverbindungen zu „Zagreber Werkstätten“ werden ausgebaut und in den nationalen Güterfahrplan eingebunden. Kürzere Transportzeiten schaffen zugleich Raum für weitere Industrieansiedlungen in der Umgebung."
 AOEIW9_YUG_eco_civ_5:0 "Jugoslawien: Ausbau von Staatsbahnen"
 AOEIW9_YUG_eco_civ_5_desc:0 "Für „Staatsbahnen“ werden zusätzliche Standorte, Versorgungsanlagen und Baukapazitäten bereitgestellt. Der Ausbau stärkt die zivile industrielle Basis, auf die eine spätere Aufrüstung zurückgreifen kann. In Jugoslawien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_YUG_eco_civ_6:0 "Donauhandel erneuern"
 AOEIW9_YUG_eco_civ_6_desc:0 "„Donauhandel“ erhält modernere Ausrüstung, bessere Betriebsführung und engere Verbindungen zu Zulieferern. Zuerst soll aus vorhandenen Anlagen mehr Leistung gewonnen werden, bevor erneut teuer erweitert wird."
 AOEIW9_YUG_eco_civ_7:0 "Eine zweite Schicht bei Belgrad Industrie"
 AOEIW9_YUG_eco_civ_7_desc:0 "Bei „Belgrad Industrie“ reicht die installierte Kapazität für längere Betriebszeiten. Eine zweite Schicht erhöht die Auslastung und bildet zugleich zusätzliche Fachkräfte für weiteres Wachstum aus."
 AOEIW9_YUG_eco_civ_8:0 "Öffentliche Bauprogramme bei den Zagreber Werkstätten"
 AOEIW9_YUG_eco_civ_8_desc:0 "Wohnungen, Straßen, Versorgungsnetze und lokale Bauarbeiten rund um „Zagreber Werkstätten“ werden als Teil der produktiven Wirtschaft behandelt. Der Abbau dieser Engpässe senkt die Kosten späterer Fabrikerweiterungen."
 AOEIW9_YUG_eco_war_1:0 "Rüstungsaudit: Adriatic Häfen"
 AOEIW9_YUG_eco_war_1_desc:0 "Ein Rüstungsaudit ermittelt, welche Teile von „Adriatic Häfen“ auf militärische Aufträge umgestellt werden können, ohne die zivile Versorgung zusammenbrechen zu lassen. Maschinenbestand und Engpässe werden erfasst, bevor neue Aufträge folgen."
 AOEIW9_YUG_eco_war_2:0 "Jugoslawien: Rüstungsaufträge für Staatsbahnen"
 AOEIW9_YUG_eco_war_2_desc:0 "Langfristige Rüstungsaufträge für „Staatsbahnen“ geben Betrieben die Sicherheit, in Werkzeugmaschinen und Fachkräfte zu investieren. Aufrüstung wird damit zu einem Produktionsprogramm statt zu einer Folge von Notkäufen. In Jugoslawien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_YUG_eco_war_3:0 "Präzisionswerkzeuge für Donauhandel"
 AOEIW9_YUG_eco_war_3_desc:0 "Präzisionswerkzeugmaschinen werden für „Donauhandel“ priorisiert. Schnellere und gleichmäßigere Fertigung erhöht die Leistung, die bestehende Werke bei wachsendem Auftragsvolumen halten können."
 AOEIW9_YUG_eco_war_4:0 "Belgrad Industrie für die Aufrüstung ausbauen"
 AOEIW9_YUG_eco_war_4_desc:0 "Rund um „Belgrad Industrie“ entsteht zusätzliche militärische Produktionskapazität, wo Zulieferer und Verkehr bereits vorhanden sind. Ziel ist dauerhafte Kriegsproduktion und nicht nur ein kurzfristig gefülltes Lager."
 AOEIW9_YUG_eco_war_5:0 "Zagreber Werkstätten standardisieren"
 AOEIW9_YUG_eco_war_5_desc:0 "Die mit „Zagreber Werkstätten“ verbundenen Betriebe übernehmen gemeinsame Maße, Spezifikationen und Prüfregeln. Standardisierung verringert Umrüstverluste und macht längere Produktionsserien effizienter."
 AOEIW9_YUG_eco_war_6:0 "Nachtproduktion bei Bosnian Minen"
 AOEIW9_YUG_eco_war_6_desc:0 "Bei „Bosnian Minen“ wird Nachtproduktion mit geregelter Wartung und Schichtrotation eingeführt. Längere Laufzeiten sind nur sinnvoll, wenn Maschinen und Fachkräfte nicht durch Überlastung verschlissen werden."
 AOEIW9_YUG_eco_war_7:0 "Langfristige Verträge für Adriatic Häfen"
 AOEIW9_YUG_eco_war_7_desc:0 "Langfristige Verträge sichern „Adriatic Häfen“ einen berechenbaren Strom militärischer Aufträge und ermöglichen Investitionen in Werkzeugmaschinen, Qualitätskontrolle und Fachkräfte. Beschaffung wird zu einer dauerhaften Industriebeziehung statt zu einer Folge kurzfristiger Ausschreibungen."
 AOEIW9_YUG_eco_science_1:0 "Universität Belgrad ausstatten"
 AOEIW9_YUG_eco_science_1_desc:0 "„Universität Belgrad“ erhält verlässliche staatliche Mittel für Labore, Personal und einen planbaren Forschungshaushalt. Erwartet werden Lösungen für Industrie und Militär statt rein akademischer Prestigeprojekte."
 AOEIW9_YUG_eco_science_2:0 "Neue Labore an Zagreb Technisch Faculty"
 AOEIW9_YUG_eco_science_2_desc:0 "Neue Labore und zusätzliches technisches Personal erweitern „Zagreb Technisch Faculty“. Die Institution arbeitet enger mit der Industrie zusammen, damit Forschung schneller in die Produktion gelangt."
 AOEIW9_YUG_eco_science_3:0 "Angewandte Forschung an jugoslawischer Forschungsrat"
 AOEIW9_YUG_eco_science_3_desc:0 "„Jugoslawischer Forschungsrat“ richtet seine Arbeit stärker auf angewandte Forschung mit klaren Industriepartnern und messbaren technischen Zielen aus. Projekte mit realem Produktionsweg erhalten Vorrang."
 AOEIW9_YUG_eco_science_4:0 "Industriephysik an Universität Belgrad"
 AOEIW9_YUG_eco_science_4_desc:0 "Die Industriephysik an „Universität Belgrad“ konzentriert sich auf Werkstoffe, Messtechnik, Elektronik und Verfahren, die Fabriken unmittelbar nutzen können. Forschung hebt damit die technische Obergrenze der Wirtschaft."
 AOEIW9_YUG_eco_science_5:0 "Produktionsforschung an Zagreb Technisch Faculty"
 AOEIW9_YUG_eco_science_5_desc:0 "Bei „Zagreb Technisch Faculty“ werden Arbeitsabläufe, Werkzeugnutzung und Qualitätskontrolle systematisch untersucht. Neue Konstruktionen sollen dadurch leichter in großen Stückzahlen herstellbar werden."
 AOEIW9_YUG_eco_science_6:0 "Forschungszuschüsse für jugoslawischer Forschungsrat"
 AOEIW9_YUG_eco_science_6_desc:0 "Ein nationales Zuschussprogramm verbindet „Jugoslawischer Forschungsrat“ mit Ministerien und großen Unternehmen. Vielversprechende Forschung kann weiterlaufen, auch wenn einzelne Institutionen die Finanzierung nicht allein tragen können."
 AOEIW9_YUG_eco_infra_2:0 "Frachtkapazität bei Adriatic Häfen"
 AOEIW9_YUG_eco_infra_2_desc:0 "Güterbahnhöfe, Wagenpark und Fahrpläne für „Adriatic Häfen“ werden erweitert. Verlässlicher Transport von Kohle, Stahl und Maschinen verhindert, dass Fabriken wegen fehlender Zulieferungen stillstehen."
 AOEIW9_YUG_eco_infra_3:0 "Jugoslawien: Arbeiterwohnungen bei Staatsbahnen"
 AOEIW9_YUG_eco_infra_3_desc:0 "Arbeiterwohnungen bei „Staatsbahnen“ wachsen gemeinsam mit der Industrie. Stabile Unterkünfte und lokale Dienste ermöglichen eine größere Facharbeiterschaft, ohne neue städtische Engpässe zu schaffen. In Jugoslawien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_YUG_eco_infra_4:0 "Logistik über Donauhandel"
 AOEIW9_YUG_eco_infra_4_desc:0 "„Donauhandel“ wird in die nationale Fracht- und Versorgungsplanung eingebunden. Schiene, Straße und Depots werden so koordiniert, dass Industrieprodukte sowohl zivile Märkte als auch die Streitkräfte erreichen."
 AOEIW9_YUG_eco_final:0 "Der jugoslawische Entwicklungsstaat"
 AOEIW9_YUG_eco_final_desc:0 "Zivile Investitionen, Forschung, Verkehr und Rüstungsproduktion werden nun in einem gemeinsamen Wirtschaftsprogramm koordiniert. Regionale Stärken lassen sich dadurch in dauerhaft höhere nationale Leistung umsetzen. In Jugoslawien wird das Vorhaben an Verkehrswegen, Arbeitskräften und vorhandener Industriekapazität ausgerichtet."
 AOEIW9_YUG_mil_root:0 "jugoslawischer Generalstab überprüfen"
 AOEIW9_YUG_mil_root_desc:0 "„Jugoslawischer Generalstab“ muss aus Prestige eine Streitkraft machen, die einen industriellen Krieg mit moderner Führung, Kommunikation und Logistik führen kann. Die Bestandsaufnahme legt fest, welche Reformen tatsächlich nötig sind."
 AOEIW9_YUG_mil_army_2:0 "Feldmanöver mit Mountain Divisions"
 AOEIW9_YUG_mil_army_2_desc:0 "Großmanöver mit „Mountain Divisions“ prüfen Mobilmachungspläne, Funkverbindungen und das Zusammenspiel der Waffen unter realistischen Bedingungen. Die Ergebnisse fließen verbindlich in die Ausbildung ein."
 AOEIW9_YUG_mil_army_5:0 "Belgrader Stabshochschule motorisieren"
 AOEIW9_YUG_mil_army_5_desc:0 "Der Motortransport von „Belgrader Stabshochschule“ wird auf Versorgung, Wartung und operative Bewegung ausgerichtet. Motorisierung soll das Tempo erhöhen, ohne einen Lastwagen- und Treibstoffbedarf zu erzeugen, den die Armee nicht tragen kann."
 AOEIW9_YUG_mil_army_6:0 "Stabsverfahren bei jugoslawischer Generalstab"
 AOEIW9_YUG_mil_army_6_desc:0 "Bei „Jugoslawischer Generalstab“ werden Befehle, Karten, Funkverfahren und Planungszyklen vereinheitlicht. Bessere Stabsarbeit verringert die Lücke zwischen einem Plan im Hauptquartier und seiner Ausführung im Feld."
 AOEIW9_YUG_mil_army_7:0 "Panzerstudien bei Mountain Divisions"
 AOEIW9_YUG_mil_army_7_desc:0 "„Mountain Divisions“ untersucht, wie Panzer mit Infanterie, Artillerie und Logistik unter den Bedingungen in Jugoslawien zusammenwirken können. Ziel ist eine nutzbare Panzerlehre und keine Handvoll Prestige-Fahrzeuge."
 AOEIW9_YUG_mil_army_8:0 "Jugoslawien: Operationsplanung – Königliche Garde"
 AOEIW9_YUG_mil_army_8_desc:0 "Operationsplanung mit „Königliche Garde“ verbindet Mobilmachung, Versorgung und strategische Ziele noch vor Kriegsbeginn. Feldzüge sollen an Transportnetz und Reserven ausgerichtet werden. In Jugoslawien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_YUG_mil_army_9:0 "Jugoslawien: Doktrin – Artilleriedirektorat"
 AOEIW9_YUG_mil_army_9_desc:0 "Die von „Artilleriedirektorat“ gelehrte Doktrin wird aus Manövern und Stabsstudien verbindlich festgeschrieben. Offiziere erhalten eine gemeinsame Sprache für Bewegung, Verstärkung und das Gefecht der verbundenen Waffen. In Jugoslawien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_YUG_mil_air_1:0 "Königlich-jugoslawische Luftwaffe neu ordnen"
 AOEIW9_YUG_mil_air_1_desc:0 "„Königlich-jugoslawische Luftwaffe“ wird um Staffeln, Wartung, Pilotenausbildung und eine belastbare Kommandostruktur neu organisiert. Flugzeugzahlen zählen nur, wenn die Maschinen auch dauerhaft einsatzbereit gehalten werden können."
 AOEIW9_YUG_mil_air_2:0 "Jagdfliegerausbildung bei Zemun Fliegerhorst"
 AOEIW9_YUG_mil_air_2_desc:0 "„Zemun Fliegerhorst“ erweitert Jagdfliegerausbildung, Formationsflug und Gefechtsschulung. Einheitliche Schulen sollen Flugzeuglieferungen in einsatzfähige Staffeln statt in unerfahrene Reserven verwandeln."
 AOEIW9_YUG_mil_air_3:0 "Jugoslawien: Bodenunterstützung – Balkan-Luftkommando"
 AOEIW9_YUG_mil_air_3_desc:0 "Unter „Balkan-Luftkommando“ entstehen Verfahren für Luft-Boden-Verbindung, Vorneinsatzleitung und direkte Unterstützung der Feldtruppen. Die Luftwaffe soll Schlachten beeinflussen und nicht als getrennte Prestigewaffe handeln. In Jugoslawien gilt die Reform erst dann als gelungen, wenn vorhandene Verbände sie unter realistischen Mobilmachungs- und Versorgungsbedingungen anwenden können."
 AOEIW9_YUG_mil_air_4:0 "Die Reichweite von Königlich-jugoslawische Luftwaffe erhöhen"
 AOEIW9_YUG_mil_air_4_desc:0 "„Königlich-jugoslawische Luftwaffe“ verbessert Navigation, Treibstoffplanung und Reichweite, damit Einsätze die Entfernungen abdecken können, die Geografie und Verpflichtungen in Jugoslawien verlangen."
 AOEIW9_YUG_mil_air_5:0 "Radarnetze für Zemun Fliegerhorst"
 AOEIW9_YUG_mil_air_5_desc:0 "„Zemun Fliegerhorst“ erhält bessere Radar-, Funk- und Meldenetze. Schnellere Erfassung und Führung erlaubt es, begrenzte Flugzeugbestände dort zu konzentrieren, wo sie tatsächlich gebraucht werden."
 AOEIW9_YUG_mil_air_6:0 "Das Luftkommando unter Balkan-Luftkommando vereinigen"
 AOEIW9_YUG_mil_air_6_desc:0 "„Balkan-Luftkommando“ wird zum Zentrum eines gemeinsamen Kommandos für Jagd-, Bomber- und Unterstützungsflieger. Gemeinsame Einsatzplanung und Logistik ersetzen konkurrierende Dienstwege."
 AOEIW9_YUG_mil_sea_1:0 "Königlich-jugoslawische Marine überprüfen"
 AOEIW9_YUG_mil_sea_1_desc:0 "Eine vollständige Prüfung von „Königlich-jugoslawische Marine“ vergleicht Schiffslisten mit Besatzungen, Wartung, Munition und echter Einsatzbereitschaft. Die Marine muss wissen, was sie dauerhaft auf See halten kann, bevor sie eine größere Flotte plant."
 AOEIW9_YUG_mil_sea_2:0 "Ausbau: Marinestützpunkt Split"
 AOEIW9_YUG_mil_sea_2_desc:0 "„Marinestützpunkt Split“ erhält zusätzliche Werft-, Reparatur- und Versorgungskapazität. Ohne eine stärkere Landorganisation würden neue Schiffe nur auf Wartung warten statt einsatzfähige Flotten zu bilden."
 AOEIW9_YUG_mil_sea_3:0 "Flottenmanöver mit Adriatic Geschwader"
 AOEIW9_YUG_mil_sea_3_desc:0 "Flottenmanöver mit „Adriatic Geschwader“ testen Signalwesen, Sicherung, Artillerie und Schadensabwehr unter Einsatzbedingungen. Die Ergebnisse fließen direkt in Doktrin und Ausbildung ein."
 AOEIW9_YUG_mil_sea_4:0 "Sicherungsdoktrin für Königlich-jugoslawische Marine"
 AOEIW9_YUG_mil_sea_4_desc:0 "„Königlich-jugoslawische Marine“ entwickelt feste Sicherungstaktiken für Zerstörer und Kreuzer zum Schutz größerer Einheiten und Konvois. Die Flotte soll als System handeln und nicht als Sammlung prestigeträchtiger Schiffe."
 AOEIW9_YUG_mil_sea_5:0 "Marineflieger bei Marinestützpunkt Split"
 AOEIW9_YUG_mil_sea_5_desc:0 "Marineflieger werden mit „Marinestützpunkt Split“ für Aufklärung, Schlagkoordination und Flottenluftschutz verbunden. Flugzeuge werden Teil der maritimen Planung statt nur von der Luftwaffe ausgeliehen."
 AOEIW9_YUG_mil_sea_6:0 "Neue Schiffskörper für Adriatic Geschwader"
 AOEIW9_YUG_mil_sea_6_desc:0 "Neue Entwurfsstandards für „Adriatic Geschwader“ konzentrieren sich auf Maschinenanlage, Reichweite, Schutz und wiederholbar baubare Konstruktionen. Modernisierung wird an ein tragfähiges Bauprogramm gebunden."
 AOEIW9_YUG_mil_final:0 "Jugoslawien: Gebirgsverteidigung"
 AOEIW9_YUG_mil_final_desc:0 "Aus Ausbildung, Logistik und Spezialtruppen entsteht ein gemeinsames Operationssystem. Königreich Jugoslawien verfügt nun über eine Militärdoktrin, die auf den tatsächlich aufgebauten Institutionen beruht und nicht auf bloßem Prestige."
 AOEIW9_YUG_dip_root:0 "Die Doktrin „South Slav“ festlegen"
 AOEIW9_YUG_dip_root_desc:0 "Königreich Jugoslawien muss festlegen, welche Grenzen, Märkte und strategischen Zugänge dauerhaftes diplomatisches Gewicht rechtfertigen. Außenpolitik wird damit an konkrete Interessen statt an austauschbare Rivalitäten gebunden."
 AOEIW9_YUG_dip_a_2:0 "Die Konferenz von Rom und Belgrad"
 AOEIW9_YUG_dip_a_2_desc:0 "Eine formelle Konferenz zwischen Rom und Belgrad trennt Bündnispflichten von bilateralen Streitfragen und schafft einen ständigen diplomatischen Kanal."
 AOEIW9_YUG_dip_a_3:0 "Adriatische Handelsgarantien"
 AOEIW9_YUG_dip_a_3_desc:0 "Adriatische Schifffahrt und Handelszugang werden durch gegenseitige Garantien von politischen Streitigkeiten abgeschirmt."
 AOEIW9_YUG_dip_a_4:0 "Stabskonsultationen der Liga"
 AOEIW9_YUG_dip_a_4_desc:0 "Stabskonsultationen koordinieren die Verteidigung und bewahren zugleich eine eigenständige jugoslawische Kommandostruktur."
 AOEIW9_YUG_dip_a_5:0 "Eine Charta für balkanische Autonomie"
 AOEIW9_YUG_dip_a_5_desc:0 "Belgrad verlangt, dass die gemeinsame Strategie die politische Autonomie der Balkanmitglieder respektiert."
 AOEIW9_YUG_dip_a_6:0 "Jugoslawiens Platz in der Liga"
 AOEIW9_YUG_dip_a_6_desc:0 "Jugoslawien akzeptiert die Liga als strategischen Rahmen, solange italienische Führung nicht in Beherrschung umschlägt."
 AOEIW9_YUG_dip_b_1:0 "Der mazedonische Streit"
 AOEIW9_YUG_dip_b_1_desc:0 "Die mazedonische Frage verschwindet nicht, nur weil Sofia und Belgrad nun demselben Bündnis angehören."
 AOEIW9_YUG_dip_b_2:0 "Italienische Vermittlung anfordern"
 AOEIW9_YUG_dip_b_2_desc:0 "Italien soll vermitteln, bevor nationalistischer Druck ein Bündnisproblem in eine bewaffnete Konfrontation verwandelt."
 AOEIW9_YUG_dip_b_3:0 "Minderheitengarantien in Mazedonien"
 AOEIW9_YUG_dip_b_3_desc:0 "Gegenseitige Garantien für die lokale Bevölkerung sind stabiler und billiger als eine Grenzrevision mit Gewalt."
 AOEIW9_YUG_dip_b_4:0 "Die Grenzkommission Sofia–Belgrad"
 AOEIW9_YUG_dip_b_4_desc:0 "Eine ständige Kommission untersucht Grenzzwischenfälle und trennt militärische Gerüchte von tatsächlichen Verletzungen."
 AOEIW9_YUG_dip_b_5:0 "Territorialansprüche einfrieren"
 AOEIW9_YUG_dip_b_5_desc:0 "Beide Regierungen setzen revisionistische Forderungen aus, solange das Sicherheitssystem der Liga besteht."
 AOEIW9_YUG_dip_b_6:0 "Der Ausgleich von Sofia und Belgrad"
 AOEIW9_YUG_dip_b_6_desc:0 "Der Streit ist nicht vergessen, wird aber durch einen Ausgleich eingehegt, der weitere militärische Zusammenarbeit ermöglicht."
 AOEIW9_YUG_dip_final:0 "Belgrad in der Mittelmeerliga"
 AOEIW9_YUG_dip_final_desc:0 "Die wichtigsten diplomatischen Dossiers in Jugoslawien sind nun mit wirtschaftlichem Druck, Stabsplanung und klaren politischen Zielen verbunden. Außenpolitik besteht nicht länger aus voneinander getrennten Reaktionen auf jede neue Krise."
