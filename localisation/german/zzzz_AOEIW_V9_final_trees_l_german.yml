 AOEIW_reichspakt_cooperation:0 "Zusammenarbeit im Reichspakt"
 AOEIW_mediterranean_league_cooperation:0 "Zusammenarbeit in der Mittelmeerliga"
 AOEIW_mediterranean_arbitration:0 "Vermittlung der Liga"
 AOEIW_german_austrian_understanding:0 "Verständigung Berlin–Wien"
 AOEIW_luso_brazilian_union_opinion:0 "Luso-brasilianischer Verfassungspakt"
 AOEIW_luso_brazilian_compact_por:0 "Der luso-brasilianische Pakt"
 AOEIW_luso_brazilian_compact_por_desc:0 "Lissabon und Rio werden durch einen ständigen Imperialrat, gemeinsame Investitionsinstitutionen und ausgehandelte verfassungsrechtliche Pflichten verbunden."
 AOEIW_luso_brazilian_compact_bra:0 "Rechte im Imperialpakt"
 AOEIW_luso_brazilian_compact_bra_desc:0 "Brasilianische Vertretungs- und Investitionsrechte machen die portugiesische Verbindung tragfähiger, während das bestehende Untertanenverhältnis erhalten bleibt."
 AOEIW11_strategic_foreign_office:0 "Strategisches Außenamt"
 AOEIW11_strategic_foreign_office_desc:0 "Diplomatische Missionen, Handelspolitik und Militärplanung werden auf klar definierte nationale Ziele ausgerichtet."
 AOEIW11_trade_protocols:0 "Bilaterale Handelsprotokolle"
 AOEIW11_trade_protocols_desc:0 "Stabiler Zugang zu Kapital, Transitwegen und strategischen Gütern unterstützt zivile Investitionen."
 AOEIW11_economic_pressure:0 "Apparat für wirtschaftlichen Druck"
 AOEIW11_economic_pressure_desc:0 "Kredite, Zölle, Nachrichtendienste und strategische Güter werden als Instrumente staatlicher Macht organisiert."
 AOEIW11_cooperative_security:0 "Kooperative Sicherheitsplanung"
 AOEIW11_cooperative_security_desc:0 "Regelmäßige Stabskontakte und politische Abkommen machen die gemeinsame Verteidigungsplanung verlässlicher."
 AOEIW11_strategic_pressure:0 "Anhaltender strategischer Druck"
 AOEIW11_strategic_pressure_desc:0 "Wirtschaftlicher Hebel, Nachrichtendienste und militärische Vorbereitungen werden dauerhaft miteinander verbunden."
 AOEIW11_arbitration_framework:0 "Ständiger Schlichtungsrahmen"
 AOEIW11_arbitration_framework_desc:0 "Grenzkommissionen, Minderheitengarantien und diplomatische Kanäle halten Streitfragen in einem verhandelbaren Rahmen."
 AOEIW11_grand_strategy:0 "Integrierte Gesamtstrategie"
 AOEIW11_grand_strategy_desc:0 "Außenpolitik, Militärplanung und wirtschaftlicher Einfluss dienen nun denselben strategischen Prioritäten."
 AOEIW11_faction_leadership:0 "Institutionalisierte Bündnisführung"
 AOEIW11_faction_leadership_desc:0 "Ständige Konferenzen, abgestimmte Beschaffung und klare militärische Verantwortlichkeiten geben dem Bündnis Substanz."
 AOEIW11_faction_coordination:0 "Bündniskoordinationsprotokolle"
 AOEIW11_faction_coordination_desc:0 "Stabsplanung und Verstärkungsverfahren verbinden nationale Streitkräfte mit dem Bündnis, ohne die nationale Führung aufzuheben."
 AOEIW11_POL_reichspakt_integration:0 "Loyale Reichspaktintegration"
 AOEIW11_POL_reichspakt_integration_desc:0 "Deutsche Investitionen und gemeinsame Verteidigungsplanung stärken Polen im Reichspakt, erhöhen aber die Abhängigkeit von Berlin."
 AOEIW11_POL_negotiated_autonomy:0 "Der Berlin–Warschau-Pakt"
 AOEIW11_POL_negotiated_autonomy_desc:0 "Polen kontrolliert mehr Verwaltung und Beschaffung und behält ausgehandelte militärische und wirtschaftliche Bindungen an Deutschland."
 AOEIW11_POL_sovereign_reconstruction:0 "Souveräner Wiederaufbau"
 AOEIW11_POL_sovereign_reconstruction_desc:0 "Die für die Unabhängigkeitskrise geschaffenen Institutionen geben Warschau Handlungsfreiheit, belasten aber die innere Stabilität."
 AOEIW11_POL_loyal_integration_autonomy:0 "Loyale Reichspaktintegration"
