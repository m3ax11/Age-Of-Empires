l_german:
 aoeiw_phase21_safe_super.a:0 "Die Welt wird sich daran erinnern."
 aoeiw_phase21_safe_super.1.t:0 "DER KRIEG AUS EISEN UND EIS"
 aoeiw_phase21_safe_super.1.d:0 "Deutschland und Russland führen nun einen Krieg, der über Europas Schicksal entscheiden wird. Millionen marschieren an eine Front von der Ostsee bis zum Schwarzen Meer."
 aoeiw_phase21_safe_super.2.t:0 "DER RHEIN STEHT IN FLAMMEN"
 aoeiw_phase21_safe_super.2.d:0 "Deutschland und Frankreich befinden sich im Krieg. Die alte Grenze wird zum Mittelpunkt der Welt, während sich die Armeen an beiden Ufern des Rheins sammeln."
 aoeiw_phase21_safe_super.3.t:0 "DIE EINHEITSFRONT ERHEBT SICH"
 aoeiw_phase21_safe_super.3.d:0 "China ist in einen offenen Bürgerkrieg zerbrochen. Nationalisten, Kommunisten und regionale Armeen kämpfen nun um die Wiedervereinigung des Landes."
 aoeiw_phase21_safe_super.4.t:0 "DIE NRA EINIGT CHINA"
 aoeiw_phase21_safe_super.4.d:0 "Die Nationale Revolutionsarmee hat gesiegt. Chiang Kai-shek beansprucht nun die Autorität, eine geeinte chinesische Republik wiederaufzubauen."
 aoeiw_phase21_safe_super.5.t:0 "DIE REVOLUTION TRIUMPHIERT"
 aoeiw_phase21_safe_super.5.d:0 "Die kommunistische Revolution hat triumphiert. Mao Zedong beansprucht nun das Mandat, China umzugestalten und in ein neues Zeitalter zu führen."
