l_german:
 AOEIW20_UF_convene_front_desc: "Nationalisten, Kommunisten und Regionalkommandeure bilden einen gemeinsamen Kriegsrat. Der Kompromiss ist zerbrechlich, schafft aber eine Autorität für Befehle und Versorgung."
 AOEIW20_UF_enemy_beijing_desc: "Alle Teile der Front einigen sich auf ein unmittelbares Ziel: Das imperiale Qing-Zentrum muss fallen, bevor die Koalition zerbricht."
 AOEIW20_UF_coordination_desc: "Verbindungsoffiziere, gemeinsame Funkverfahren und regionale Zeitpläne ermöglichen rivalisierenden Armeen die Zusammenarbeit."
 AOEIW20_UF_joint_staff_desc: "Ein einheitlicher Stab übersetzt die politische Einigung in Operationspläne und verringert das Chaos paralleler Kommandos."
 AOEIW20_UF_integrate_militias_desc: "Örtliche Verteidigungsgruppen werden registriert, neu organisiert und einheitlich bewaffnet. 300.000 Mann und 12.000 Gewehre verstärken die Mobilisierung."
 AOEIW20_UF_arms_workshops_desc: "Maschinenwerkstätten und Bahndepots um Chongqing werden in zwei Militärfabriken für die sofortige Kriegsproduktion umgewandelt."
 AOEIW20_UF_secure_railways_desc: "Bewachte Knotenpunkte und Notfallreparaturen verbessern die wichtigsten Versorgungswege zwischen den Stützpunkten der Front."
 AOEIW20_UF_wartime_government_desc: "Provisorische Ministerien erhalten die Befugnis, Verkehr zu beschlagnahmen, Provinzen zu koordinieren und den Krieg zu finanzieren."
 AOEIW20_UF_salvation_propaganda_desc: "Der Krieg wird als nationaler Überlebenskampf und nicht als Privatfeldzug einer einzelnen Partei dargestellt."
 AOEIW20_UF_land_bread_desc: "Nahrungsgarantien und vorläufige Pachtreformen sichern die Unterstützung auf dem Land und stellen 250.000 weitere Rekruten bereit."
 AOEIW20_UF_discipline_officers_desc: "Gemeinsame Vorschriften und eine einheitliche Befehlskette begrenzen Privatarmeen und stellen die Autorität an der Front wieder her."
 AOEIW20_UF_mobilise_interior_desc: "Eine zweite Mobilisierungswelle ruft 350.000 Mann ein und gibt 18.000 Gewehre aus Provinzbeständen frei."
 AOEIW20_UF_foreign_arms_desc: "Einkaufsmissionen und ausländische Unterstützer beschaffen 20.000 Gewehre und 1.500 Artilleriegeschütze für den entscheidenden Feldzug."
 AOEIW20_UF_national_salvation_economy_focus_desc: "Industrie, Verkehr und Finanzen werden einem raschen Kriegsprogramm unterstellt, das die Produktion steigert, aber die Zivilwirtschaft belastet."
 AOEIW20_UF_final_offensive_focus_desc: "Der einheitliche Stab, neue Arsenale und die Massenmobilisierung werden für den letzten Angriff auf das Qing-Regime konzentriert."
 AOEIW20_UF_question_leadership_desc: "Mit dem Sieg verschwindet der gemeinsame Feind. China muss zwischen Chiangs zentralisiertem Nationalismus, Maos Massenrevolution und der Ratsregierung wählen."
 AOEIW20_UF_chiang_leads_desc: "Chiang Kai-shek verwandelt die Kriegskoalition in einen zentralisierten Staat der Nationalrevolutionären Armee. Dies ist eine dauerhafte Führungs-, Regierungs- und Identitätswahl."
 AOEIW20_UF_mao_leads_desc: "Mao Zedong verwandelt die Kriegskoalition in einen kommunistischen Massenstaat mit ländlicher Mobilisierung und rascher Industrialisierung. Dies ist eine dauerhafte Führungs-, Regierungs- und Identitätswahl."
 AOEIW20_UF_council_endures_desc: "Keine Fraktion darf den Sieg monopolisieren. Der Rat der Einheitsfront bleibt Regierung und gleicht die rivalisierenden Revolutionsarmeen aus."
 AOEIW20_UF_chiang_army_desc: "Chiangs Stab vereinheitlicht Ausbildung und Doktrin und gewährt Armee-Erfahrung sowie zwei Rabatte für Landdoktrinen."
 AOEIW20_UF_mao_industry_desc: "Maos Regierung baut zwei Zivilfabriken und beschleunigt zwei Industrietechnologien als ersten Schritt der raschen revolutionären Industrialisierung."
 AOEIW20_UF_council_compromise_desc: "Ein Verfassungskompromiss stabilisiert die Ratsregierung und verwandelt die Kriegskooperation in eine dauerhafte politische Ordnung."
