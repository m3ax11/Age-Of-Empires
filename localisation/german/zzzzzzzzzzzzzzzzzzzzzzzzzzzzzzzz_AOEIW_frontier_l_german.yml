l_german:
 AOEIW_frontier_research:0 "Technische Grenzmission"
 AOEIW_FRONTIER_MON_khural:0 "Der Khural in Ulaanbaatar"
 AOEIW_FRONTIER_MON_khural_desc:0 "Der Grenzkrieg zeigt die Grenzen einer zentralen Verwaltung verstreuter Weidebezirke. Vor der nächsten Mobilmachung werden Provinzdelegierte einberufen."
 AOEIW_FRONTIER_MON_herders_spirit:0 "Bezirks-Versorgungspakte"
 AOEIW_FRONTIER_MON_herders_spirit_desc:0 "Lokale Beschaffung erhält das Vertrauen auf dem Land."
 AOEIW_FRONTIER_MON_herders:0 "Ein Pakt mit den Weidebezirken"
 AOEIW_FRONTIER_MON_herders_desc:0 "Wanderherden können keine starren Abgabepläne erfüllen. Ortsräte organisieren Lieferungen und eine langsamere, verlässlichere Mobilmachung."
 AOEIW_FRONTIER_MON_directorate_spirit:0 "Zentrale Beschaffungsdirektion"
 AOEIW_FRONTIER_MON_directorate_spirit_desc:0 "Ein Zentralregister beschleunigt Mobilmachung mit sozialen Kosten."
 AOEIW_FRONTIER_MON_directorate:0 "Eine zentrale Mobilmachungsdirektion"
 AOEIW_FRONTIER_MON_directorate_desc:0 "Das Heer verlangt ein einheitliches Register für Pferde, Reservisten und Vorräte. Zentralisierung beschleunigt die Mobilmachung, belastet jedoch die Provinzen."
 AOEIW_FRONTIER_MON_veterinary:0 "Tierstationen in den Provinzen"
 AOEIW_FRONTIER_MON_veterinary_desc:0 "Ein Reiterheer braucht gesunde Ersatzpferde. Tierärztliche Dienste begleiten Herden statt in der Hauptstadt zu warten."
 AOEIW_FRONTIER_MON_registers:0 "Die Reservepferde erfassen"
 AOEIW_FRONTIER_MON_registers_desc:0 "Provinzoffiziere erfassen Pferde und Futter gemeinsam, damit keine marschunfähigen Papierverbände entstehen."
 AOEIW_FRONTIER_MON_districts:0 "Die provinzielle Dienstordnung"
 AOEIW_FRONTIER_MON_districts_desc:0 "Beide Wege brauchen nun eine dauerhafte Verbindung zwischen Ortsverwaltung und Heeresversorgung."
 AOEIW_FRONTIER_MON_caravans:0 "Die Karawanenbrunnen kartieren"
 AOEIW_FRONTIER_MON_caravans_desc:0 "Verlässliche Brunnen bestimmen die nutzbaren Steppenwege. Vermesser markieren die Routen vor dem Baubeginn."
 AOEIW_FRONTIER_MON_workshops:0 "Reparaturwerkstätten in Ulaanbaatar"
 AOEIW_FRONTIER_MON_workshops_desc:0 "Importierte Maschinen brauchen örtliche Reparaturen. Kleine Werkstätten helfen mehr als Fabriken ohne Ersatzteile."
 AOEIW_FRONTIER_MON_winter_spirit:0 "Winterdepotnetz"
 AOEIW_FRONTIER_MON_winter_spirit_desc:0 "Verteilte Vorräte verringern Winterverluste."
 AOEIW_FRONTIER_MON_depots:0 "Winterliche Futterdepots"
 AOEIW_FRONTIER_MON_depots_desc:0 "Futterreserven in Bezirksdepots halten Reiterverbände im Feld, wenn Weiden ausfallen."
 AOEIW_FRONTIER_MON_arsenal:0 "Kleinwaffen für die Hauptstadt"
 AOEIW_FRONTIER_MON_arsenal_desc:0 "Reparatur und Montage von Gewehren schaffen eine verlässliche heimische Rüstungsversorgung."
 AOEIW_FRONTIER_MON_roads:0 "Ein Steppentransportdienst"
 AOEIW_FRONTIER_MON_roads_desc:0 "Brunnen, Depots und Werkstätten erhalten einen gemeinsamen Transportfahrplan."
 AOEIW_FRONTIER_MON_riders:0 "Die berittene Grenzpatrouille"
 AOEIW_FRONTIER_MON_riders_desc:0 "Lange Grenzen verlangen Aufklärung vor Kräftekonzentration. Patrouillenführer sollen melden und ausweichen, statt leeres Land um jeden Preis zu halten."
 AOEIW_FRONTIER_MON_signals:0 "Funkgeräte für Patrouillenführer"
 AOEIW_FRONTIER_MON_signals_desc:0 "Funkgeräte verkürzen die Zeit zwischen Grenzzwischenfall und Entscheidung in Ulaanbaatar."
 AOEIW_FRONTIER_MON_mobile_spirit:0 "Steppen-Manöverkommandos"
 AOEIW_FRONTIER_MON_mobile_spirit_desc:0 "Berittene Aufklärung unterstützt operative Bewegungen."
 AOEIW_FRONTIER_MON_mobile:0 "Bewegliche Steppenkolonnen"
 AOEIW_FRONTIER_MON_mobile_desc:0 "Kleine bewegliche Kolonnen konzentrieren sich entlang vermessener Wege, ohne alle Bezirke zu entblößen."
 AOEIW_FRONTIER_MON_airfield:0 "Die Flugpiste von Ulaanbaatar"
 AOEIW_FRONTIER_MON_airfield_desc:0 "Auch eine kleine Luftwaffe braucht Wartungsschuppen und einen vorbereiteten Landeplatz."
 AOEIW_FRONTIER_MON_pilots:0 "Steppenbeobachter ausbilden"
 AOEIW_FRONTIER_MON_pilots_desc:0 "Beobachter kartieren Wege und melden Truppenbewegungen, statt einer Prestige-Bomberflotte nachzujagen."
 AOEIW_FRONTIER_MON_frontier:0 "Die chinesische Grenzkommission"
 AOEIW_FRONTIER_MON_frontier_desc:0 "Im Krieg der Einheitsfront gerät jede Karawane unter Verdacht. Grenzkommissare müssen zwischen Unterstützung und neutralem Handel wählen."
 AOEIW_FRONTIER_MON_solidarity:0 "Die Einheitsfront beliefern"
 AOEIW_FRONTIER_MON_solidarity_desc:0 "Eine begrenzte Gewehrlieferung wird angeboten. Der chinesische Rat kann zustimmen; dies ist Hilfe, kein automatischer Kriegseintritt."
 AOEIW_FRONTIER_MON_neutral_spirit:0 "Neutrale Karawanentore"
 AOEIW_FRONTIER_MON_neutral_spirit_desc:0 "Kontrollierter Handel stützt den Zivilstaat."
 AOEIW_FRONTIER_MON_neutral:0 "Die Karawanentore neutral halten"
 AOEIW_FRONTIER_MON_neutral_desc:0 "Zollposten trennen Handel von Militärkonvois. Neutralität schützt die Grenzwirtschaft, schließt aber die Gewehrmission aus."
 AOEIW_FRONTIER_MON_liaison:0 "Ständige Grenzverbindung"
 AOEIW_FRONTIER_MON_liaison_desc:0 "Ein ständiges Verbindungsbüro bearbeitet Zwischenfälle, ohne örtlichen Kommandeuren einen eigenen Krieg zu gestatten."
 AOEIW_FRONTIER_MON_academy:0 "Die Bezirksoffiziersschule"
 AOEIW_FRONTIER_MON_academy_desc:0 "Patrouillenberichte und Luftbeobachtungen bilden den Lehrstoff eines professionellen Offizierskaders."
 AOEIW_FRONTIER_MON_recovery:0 "Bewegliche Bergungstrupps"
 AOEIW_FRONTIER_MON_recovery_desc:0 "Ein defekter Lastwagen gehört in die Werkstatt statt verlassen an einen Karawanenweg."
 AOEIW_FRONTIER_MON_borderpeace:0 "Eine funktionierende Grenzordnung"
 AOEIW_FRONTIER_MON_borderpeace_desc:0 "Die Kommission kann Handel, Zwischenfälle und Winterversorgung nun auf derselben Karte koordinieren."
 AOEIW_FRONTIER_MON_state:0 "Ein Staat über die Steppe hinweg"
 AOEIW_FRONTIER_MON_state_desc:0 "Provinzabkommen, Verkehr und ausgebildete Offiziere geben zentralen Entscheidungen endlich Reichweite über die Hauptstadt hinaus."
 AOEIW20_QIN_strive_survival:0 "Der nördliche Hof in der Krise"
 AOEIW20_QIN_strive_survival_desc:0 "Der Qing-Hof muss seine nördliche Verwaltung erhalten, während die Einheitsfront seine Autorität herausfordert."
 AOEIW20_QIN_hold_beijing:0 "Verteidigungsvorräte für Peking"
 AOEIW20_QIN_hold_beijing_desc:0 "Peking wird nur befestigt, solange es unter eigener Kontrolle steht. Der Befehl darf keine feindlich besetzte Hauptstadt stärken."
 AOEIW20_QIN_banner_armies:0 "Die Bannerlisten prüfen"
 AOEIW20_QIN_banner_armies_desc:0 "Die Soldlisten enthalten Männer, die längst nicht mehr dienen. Bestehende Verbände werden reorganisiert, statt Papierarmeen aufzurufen."
 AOEIW20_QIN_northern_arsenals:0 "Der nördliche Arsenalrat"
 AOEIW20_QIN_northern_arsenals_desc:0 "Das Heer braucht ein kontrolliertes Arsenal, keinen Erlass zum Fabrikbau in einer verlorenen Provinz."
 AOEIW_FRONTIER_MAN_rail:0 "Das Mukdener Eisenbahnregister"
 AOEIW_FRONTIER_MAN_rail_desc:0 "Militärzüge, Zivilfracht und Konzessionsverkehr werden getrennt, bevor das Bahnnetz zusammenbricht."
 AOEIW_FRONTIER_MAN_coal:0 "Kohleverträge von Fushun"
 AOEIW_FRONTIER_MAN_coal_desc:0 "Bergbauverträge finanzieren Reparaturen und Vorräte, ohne eine weitere Provinz zu verpfänden."
 AOEIW_FRONTIER_MAN_repair:0 "Eisenbahn-Reparaturbrigaden"
 AOEIW_FRONTIER_MAN_repair_desc:0 "Beschädigte Fahrzeuge müssen schnell wieder fahren, damit die Nordarmee eine zusammenhängende Front halten kann."
 AOEIW_FRONTIER_MAN_cadets:0 "Eine nördliche Kadettenschule"
 AOEIW_FRONTIER_MAN_cadets_desc:0 "Eine gemeinsame Schule kann die Kluft zwischen Hofoffizieren und Bahnschutzkommandos überbrücken."
 AOEIW_FRONTIER_MAN_garrison_spirit:0 "Garnisonen der Eisenbahnstädte"
 AOEIW_FRONTIER_MAN_garrison_spirit_desc:0 "Vorbereitete Stadtkommandos verankern die Verteidigung."
 AOEIW_FRONTIER_MAN_garrison:0 "Die Eisenbahnstädte halten"
 AOEIW_FRONTIER_MAN_garrison_desc:0 "Die Konzentration auf Bahnknoten tauscht Bewegungsfreiheit gegen ein verlässliches Verteidigungssystem."
 AOEIW_FRONTIER_MAN_mobile_spirit:0 "Bewegliche Bannerreserve"
 AOEIW_FRONTIER_MAN_mobile_spirit_desc:0 "Eine bewegliche Reserve stellt nach Durchbrüchen den Zusammenhalt wieder her."
 AOEIW_FRONTIER_MAN_mobile:0 "Eine bewegliche Bannerreserve"
 AOEIW_FRONTIER_MAN_mobile_desc:0 "Reserveverbände schließen Einbrüche entlang der Bahn, statt jedes Bataillon auf feste Posten zu verteilen."
 AOEIW_FRONTIER_MAN_staff:0 "Ein nördlicher Generalstab"
 AOEIW_FRONTIER_MAN_staff_desc:0 "Unabhängig von der Doktrin brauchen Bahnschutz und Feldheer eine gemeinsame Operationszentrale."
 AOEIW_FRONTIER_MAN_court:0 "Der Hof und die Stadtverwaltungen"
 AOEIW_FRONTIER_MAN_court_desc:0 "Stadtbeamte sichern Steuern und Lebensmittel wirksamer als eine weitere Notverordnung aus dem Palast."
 AOEIW_FRONTIER_MAN_municipal_spirit:0 "Kommunale Liefergarantien"
 AOEIW_FRONTIER_MAN_municipal_spirit_desc:0 "Berechenbare örtliche Einnahmen stützen die Zivilproduktion."
 AOEIW_FRONTIER_MAN_municipal:0 "Kommunale Einnahmengarantien"
 AOEIW_FRONTIER_MAN_municipal_desc:0 "Ein festgelegter Einnahmenanteil bleibt bei den Städten, die dafür regelmäßige Heereslieferungen zusagen."
 AOEIW_FRONTIER_MAN_emergency_spirit:0 "Notverträge der Arsenale"
 AOEIW_FRONTIER_MAN_emergency_spirit_desc:0 "Notverträge lenken zivile Kapazität um."
 AOEIW_FRONTIER_MAN_emergency:0 "Das Notbeschaffungsamt"
 AOEIW_FRONTIER_MAN_emergency_desc:0 "Militärverträge erhalten Vorrang vor Zivilarbeit. Mehr Arsenalproduktion kostet örtliches Vertrauen."
 AOEIW_FRONTIER_MAN_granaries:0 "Die Wintergetreidespeicher schützen"
 AOEIW_FRONTIER_MAN_granaries_desc:0 "Wintervorräte bleiben der Einnahmenordnung unterworfen, unabhängig von der Beschaffungsfraktion."
 AOEIW_FRONTIER_MAN_signals:0 "Funk entlang der Hauptlinie"
 AOEIW_FRONTIER_MAN_signals_desc:0 "Ein gemeinsamer Funkdienst verbindet Garnisonen, Reserven und Fahrdienstleiter."
 AOEIW_FRONTIER_MAN_air:0 "Aufklärungsflüge von Mukden"
 AOEIW_FRONTIER_MAN_air_desc:0 "Luftaufklärung meldet unterbrochene Linien und vorrückende Kolonnen, bevor das Hauptquartier Reserven einsetzt."
 AOEIW_FRONTIER_MAN_medical_spirit:0 "Nördliche Lazarettzüge"
 AOEIW_FRONTIER_MAN_medical_spirit_desc:0 "Planmäßige Evakuierung erhält ausgebildete Mannschaften."
 AOEIW_FRONTIER_MAN_medical:0 "Lazarettzüge"
 AOEIW_FRONTIER_MAN_medical_desc:0 "Verwundete und beschädigtes Gerät brauchen feste Zugtrassen statt improvisierter Waggons nach jeder Schlacht."
 AOEIW_FRONTIER_MAN_settlement:0 "Die mandschurische Neuordnung"
 AOEIW_FRONTIER_MAN_settlement_desc:0 "Die Niederlage hat den Hof auf ein mandschurisches Restgebiet unter japanischer Aufsicht beschränkt. Diese Realität bestimmt die nächste Politik, nicht eine geschenkte Rückeroberung."
 AOEIW_FRONTIER_MAN_credit:0 "Überwachte Wiederaufbaukredite annehmen"
 AOEIW_FRONTIER_MAN_credit_desc:0 "Japanische Kredite bauen rasch ein Arsenal auf, binden die Beschaffung aber an den Protektor. Es wechselt kein Gebiet den Besitzer."
 AOEIW_FRONTIER_MAN_autonomy:0 "Der kommunale Wiederaufbaufonds"
 AOEIW_FRONTIER_MAN_autonomy_desc:0 "Einbehaltene kommunale Einnahmen bauen Zivilwerkstätten auf, ohne einen weiteren überwachten Militärkredit."
 AOEIW_FRONTIER_MAN_commission:0 "Eine ständige Waffenstillstandskommission"
 AOEIW_FRONTIER_MAN_commission_desc:0 "Ein Kanal zur Einheitsfront klärt Vermisste und Grenzfälle. Zustimmung bleibt eine diplomatische Entscheidung, kein erzwungener Frieden oder Bündnis."
 AOEIW_FRONTIER_MAN_standards:0 "Mandschurische Werkstattnormen"
 AOEIW_FRONTIER_MAN_standards_desc:0 "Ein verkleinerter Staat kann nicht jedes Importmuster bevorraten. Gemeinsame Normen lassen weniger Werkstätten mehr Verbände versorgen."
 AOEIW_FRONTIER_MAN_recovery_spirit:0 "Mandschurischer Wiederaufbaudienst"
 AOEIW_FRONTIER_MAN_recovery_spirit_desc:0 "Eine verkleinerte Verwaltung konzentriert sich auf den Wiederaufbau."
 AOEIW_FRONTIER_MAN_recovery:0 "Ein lebensfähiger Nordstaat"
 AOEIW_FRONTIER_MAN_recovery_desc:0 "Der Hof ersetzt Träume sofortiger Restauration durch Einnahmen, Verkehr und eine Verwaltung, die der nächsten Krise standhält."
 AOEIW_FRONTIER_QIN_council:0 "Den Qing-Oppositionsrat einberufen"
 AOEIW_FRONTIER_QIN_council_desc:0 "Eine Gegenregierung muss mehr vertreten als eine alternative Hoffraktion. Ihre Autorität beginnt im tatsächlich regierten Gebiet."
 AOEIW_FRONTIER_QIN_assembly_spirit:0 "Pakt der Provinzversammlung"
 AOEIW_FRONTIER_QIN_assembly_spirit_desc:0 "Kontrollierte Besteuerung stärkt Zustimmung."
 AOEIW_FRONTIER_QIN_assembly:0 "Eine Provinzversammlung verlangen"
 AOEIW_FRONTIER_QIN_assembly_desc:0 "Provinzhonoratioren akzeptieren Steuern, wenn sie die Bücher prüfen und die Exekutive begrenzen können."
 AOEIW_FRONTIER_QIN_command_spirit:0 "Banner-Kommandodirektion"
 AOEIW_FRONTIER_QIN_command_spirit_desc:0 "Zentralisierte Führung beschleunigt militärische Vorbereitung."
 AOEIW_FRONTIER_QIN_command:0 "Eine Banner-Kommandodirektion"
 AOEIW_FRONTIER_QIN_command_desc:0 "Die Offiziersfraktion fordert zunächst einheitliche Führung. Rasche Mobilmachung bedeutet einen engeren politischen Ausgleich."
 AOEIW_FRONTIER_QIN_accounts:0 "Die Provinzrechnungen veröffentlichen"
 AOEIW_FRONTIER_QIN_accounts_desc:0 "Prüfer trennen reguläre Steuern von privaten Sammlungen im Namen der Dynastie."
 AOEIW_FRONTIER_QIN_charter:0 "Eine Charta für die Stadtverwaltungen"
 AOEIW_FRONTIER_QIN_charter_desc:0 "Stadträte behalten Mittel, um Märkte trotz militärischer Beschaffung offenzuhalten."
 AOEIW_FRONTIER_QIN_rolls:0 "Die Banner-Musterrollen prüfen"
 AOEIW_FRONTIER_QIN_rolls_desc:0 "Die Direktion zählt ausgebildete Männer und brauchbare Gewehre, bevor sie eine weitere Offensive verspricht."
 AOEIW_FRONTIER_QIN_school:0 "Eine Stabsschule der Direktion"
 AOEIW_FRONTIER_QIN_school_desc:0 "Ein kleiner professioneller Stab ersetzt konkurrierende persönliche Befehle einzelner Kommandeure."
 AOEIW_FRONTIER_QIN_compact:0 "Den Regierungspakt ratifizieren"
 AOEIW_FRONTIER_QIN_compact_desc:0 "Ein Versammlungsmandat oder eine Militärdirektion muss nun eine durchsetzbare Provinzordnung liefern."
 AOEIW_FRONTIER_QIN_granary:0 "Die Getreidespeicherregister erneuern"
 AOEIW_FRONTIER_QIN_granary_desc:0 "Kenntnis der Getreidelager verhindert, dass konkurrierende Garnisonen dieselbe Ernte zweimal beschlagnahmen."
 AOEIW_FRONTIER_QIN_workshop:0 "Maschinenwerkstätten der Provinzen"
 AOEIW_FRONTIER_QIN_workshop_desc:0 "Örtliche Werkstätten warten Mühlen und Fahrzeuge, bevor das Heer alle Facharbeiter beansprucht."
 AOEIW_FRONTIER_QIN_rifles:0 "Die Provinzgewehre überholen"
 AOEIW_FRONTIER_QIN_rifles_desc:0 "Waffen verschiedener Arsenale brauchen Prüfung und Reparatur, bevor sie geschlossene Verbände ausrüsten."
 AOEIW_FRONTIER_QIN_signals:0 "Zivile und militärische Telegraphen"
 AOEIW_FRONTIER_QIN_signals_desc:0 "Ein gemeinsames Telegraphenregister verschafft der Regierung ein Bild über die Hauptstadt hinaus."
 AOEIW_FRONTIER_QIN_foreign:0 "Die Stellung im Bürgerkrieg bestimmen"
 AOEIW_FRONTIER_QIN_foreign_desc:0 "Die Einheitsfront kann Gegner des Hofes sein, ohne Gegner jeder Provinzverwaltung zu sein. Der Rat muss seine Bedingungen bestimmen."
 AOEIW_FRONTIER_QIN_rail:0 "Getreide- und Garnisonsdepots verbinden"
 AOEIW_FRONTIER_QIN_rail_desc:0 "Ein gemeinsamer Transportplan verbindet Getreidelager mit den Verbänden, die sie wirklich benötigen."
 AOEIW_FRONTIER_QIN_arsenal:0 "Ein einheitliches Provinzarsenal"
 AOEIW_FRONTIER_QIN_arsenal_desc:0 "Reparatur und Munitionsproduktion werden einem kontrollierbaren Arsenalrat unterstellt."
 AOEIW_FRONTIER_QIN_defence_spirit:0 "Provinz-Verteidigungsbezirke"
 AOEIW_FRONTIER_QIN_defence_spirit_desc:0 "Vorbereitete Verteidigung schützt die Provinzverwaltung."
 AOEIW_FRONTIER_QIN_defence:0 "Die Provinzzentren verteidigen"
 AOEIW_FRONTIER_QIN_defence_desc:0 "Das Heer schützt Verwaltungszentren durch vorbereitete Stellungen und örtliche Reserven."
 AOEIW_FRONTIER_QIN_field_spirit:0 "Provinz-Feldreserve"
 AOEIW_FRONTIER_QIN_field_spirit_desc:0 "Eine ausgebildete Reserve wechselt zwischen bedrohten Bezirken."
 AOEIW_FRONTIER_QIN_field:0 "Eine einheitliche Feldreserve"
 AOEIW_FRONTIER_QIN_field_desc:0 "Eine zentrale Reserve reagiert über Provinzgrenzen hinweg, wenn ihre Offiziere derselben Befehlskette folgen."
 AOEIW_FRONTIER_QIN_liaison:0 "Der Einheitsfront Gespräche anbieten"
 AOEIW_FRONTIER_QIN_liaison_desc:0 "Delegierte verhandeln Zivilzugang und Gefangene. Der Empfänger kann ablehnen; Gebiete und Bündnisse werden nicht automatisch vergeben."
 AOEIW_FRONTIER_QIN_isolation:0 "Die Provinztore geschlossen halten"
 AOEIW_FRONTIER_QIN_isolation_desc:0 "Der Rat schützt seine Lebensmittelversorgung und lehnt formelle Zusammenarbeit mit der konkurrierenden Koalition ab."
 AOEIW_FRONTIER_QIN_observers:0 "Telegraphisten und Luftbeobachter ausbilden"
 AOEIW_FRONTIER_QIN_observers_desc:0 "Beobachtungsberichte müssen rechtzeitig beim Stab eintreffen, per Leitung oder Flugzeug."
 AOEIW_FRONTIER_QIN_service:0 "Der Provinz-Versorgungsdienst"
 AOEIW_FRONTIER_QIN_service_desc:0 "Transportnormen ermöglichen Zivilwerkstätten die Wartung von Heeresfahrzeugen ohne vollständig getrennte Ersatzteillager."
 AOEIW_FRONTIER_QIN_relief:0 "Eine zivile Hilfsverwaltung"
 AOEIW_FRONTIER_QIN_relief_desc:0 "Die außenpolitische Entscheidung entbindet nicht von der Versorgung von Flüchtlingen und beschädigten Städten. Märkte öffnen unter dokumentierten Regeln."
 AOEIW_FRONTIER_QIN_institute:0 "Das technische Provinzinstitut"
 AOEIW_FRONTIER_QIN_institute_desc:0 "Telegraphenausbildung und Werkstattlehre werden verbunden, damit Forschung wartbare Maschinen hervorbringt."
 AOEIW_FRONTIER_QIN_government:0 "Eine Verwaltung jenseits des Hofes"
 AOEIW_FRONTIER_QIN_government_desc:0 "Die Opposition kann nun mit Steuern, Werkstätten und öffentlichem Dienst eine institutionelle Alternative beweisen statt nur dynastische Erklärungen abzugeben."
 AOEIW_FRONTIER_XIC_conference:0 "Die Militärkonferenz von Xi’an"
 AOEIW_FRONTIER_XIC_conference_desc:0 "Offiziere, Kaufleute und Provinzverwalter beraten über einer Karte der Pässe. Die Stadt kann den nach Osten wachsenden Krieg nicht ignorieren."
 AOEIW_FRONTIER_XIC_officers_spirit:0 "Verteidigungsrat von Xi’an"
 AOEIW_FRONTIER_XIC_officers_spirit_desc:0 "Ein Provinzrat koordiniert militärische Vorbereitung."
 AOEIW_FRONTIER_XIC_officers:0 "Der Provinz-Verteidigungsrat"
 AOEIW_FRONTIER_XIC_officers_desc:0 "Das Offizierskorps übernimmt unmittelbare Vorbereitungen, die Zivilverwaltung bleibt den Provinzämtern vorbehalten."
 AOEIW_FRONTIER_XIC_civic_spirit:0 "Zivile Koalition von Xi’an"
 AOEIW_FRONTIER_XIC_civic_spirit_desc:0 "Öffentliche Rechnungen erhalten die Zusammenarbeit mit Kaufleuten."
 AOEIW_FRONTIER_XIC_civic:0 "Eine zivile Einnahmenkoalition"
 AOEIW_FRONTIER_XIC_civic_desc:0 "Kaufleute und Bezirksbeamte finanzieren Notvorbereitungen nur mit öffentlichen Rechnungen und geregelten Beschaffungsgrenzen."
 AOEIW_FRONTIER_XIC_drill:0 "Die Passgarnisonen schulen"
 AOEIW_FRONTIER_XIC_drill_desc:0 "Garnisonen üben Rückzug und Verstärkung ebenso wie die Verteidigung fester Stellungen."
 AOEIW_FRONTIER_XIC_staff:0 "Die Gebirgszugänge kartieren"
 AOEIW_FRONTIER_XIC_staff_desc:0 "Eine gemeinsame Operationskarte ersetzt widersprüchliche Routenbücher einzelner Kommandeure."
 AOEIW_FRONTIER_XIC_markets:0 "Die Getreidemärkte wieder öffnen"
 AOEIW_FRONTIER_XIC_markets_desc:0 "Regelmäßige Getreideverträge verringern unberechenbare militärische Einziehungen."
 AOEIW_FRONTIER_XIC_credit:0 "Die Wiederaufbaubank von Xi’an"
 AOEIW_FRONTIER_XIC_credit_desc:0 "Kaufmannskredite werden für Werkstätten und Verkehr gebündelt; die Koalition kontrolliert die Rechnungen."
 AOEIW_FRONTIER_XIC_settlement:0 "Die provinzielle Dienstvereinbarung"
 AOEIW_FRONTIER_XIC_settlement_desc:0 "Die gewählte Koalition muss Militärbewegungen und Zivilversorgung nun über ein gemeinsames Amt koordinieren."
 AOEIW_FRONTIER_XIC_roads:0 "Die Straßen durch das Lössland"
 AOEIW_FRONTIER_XIC_roads_desc:0 "Straßenreparaturen verbinden Bezirksdepots, bevor jahreszeitliche Schäden sie abschneiden."
 AOEIW_FRONTIER_XIC_workshop:0 "Die Maschinenkooperative von Xi’an"
 AOEIW_FRONTIER_XIC_workshop_desc:0 "Kleine Reparaturbetriebe bündeln Werkzeuge, ohne auf einen großen Industriekomplex zu warten."
 AOEIW_FRONTIER_XIC_passes_spirit:0 "Passkommandos von Xi’an"
 AOEIW_FRONTIER_XIC_passes_spirit_desc:0 "Vorbereitete Zugänge verbessern das Durchhaltevermögen."
 AOEIW_FRONTIER_XIC_passes:0 "Das Pass-Verteidigungssystem"
 AOEIW_FRONTIER_XIC_passes_desc:0 "Vorbereitete Stellungen und örtliche Führer begünstigen die Verteidigung der Zugänge statt Vorstöße in die Ebene."
 AOEIW_FRONTIER_XIC_reserve_spirit:0 "Manöverreserve von Xi’an"
 AOEIW_FRONTIER_XIC_reserve_spirit_desc:0 "Ausgebildete Reserven erholen sich und verlegen rasch."
 AOEIW_FRONTIER_XIC_reserve:0 "Eine provinzielle Manöverreserve"
 AOEIW_FRONTIER_XIC_reserve_desc:0 "Eine bewegliche Reserve unterstützt Nachbarfronten, ohne die eigene Kommandostruktur aufzugeben."
 AOEIW_FRONTIER_XIC_envoys:0 "Gesandte zum chinesischen Rat"
 AOEIW_FRONTIER_XIC_envoys_desc:0 "Die Einheitsfront braucht Zusammenarbeit im Nordwesten. Xi’an kann Vorräte anbieten, ohne seine Provinzverwaltung aufzugeben."
 AOEIW_FRONTIER_XIC_depots:0 "Munitionslager der Bezirke"
 AOEIW_FRONTIER_XIC_depots_desc:0 "Munition nahe den Pässen verringert die Transportlast bei beschädigten Straßen."
 AOEIW_FRONTIER_XIC_arsenal:0 "Die provinzielle Kleinwaffenfertigung"
 AOEIW_FRONTIER_XIC_arsenal_desc:0 "Die Kooperative kann nun eine kontrollierte Gewehr- und Munitionsfertigung tragen."
 AOEIW_FRONTIER_XIC_commission:0 "Die gemeinsame Verteidigungskommission"
 AOEIW_FRONTIER_XIC_commission_desc:0 "Versorgungsdepots und gewählte Doktrin brauchen nun gemeinsame Meldestandards."
 AOEIW_FRONTIER_XIC_aid:0 "Eine Gewehrmission anbieten"
 AOEIW_FRONTIER_XIC_aid_desc:0 "Der Einheitsfront wird eine kontrollierte Gewehrlieferung angeboten. Ihr Rat kann ablehnen; die Lieferung kostet tatsächlich Waffen."
 AOEIW_FRONTIER_XIC_mediation:0 "Verhandlungen über Zivilpassagen"
 AOEIW_FRONTIER_XIC_mediation_desc:0 "Statt Waffenhilfe werden Gespräche über Flüchtlingspassagen und Gefangene angeboten. Sie erzwingen keinen Waffenstillstand."
 AOEIW_FRONTIER_XIC_relief:0 "Das Flüchtlingshilfsamt"
 AOEIW_FRONTIER_XIC_relief_desc:0 "Der Krieg auf den östlichen Straßen vertreibt Familien und stört Getreidemärkte. Ein ständiges Amt erfasst Unterkunft und Lieferungen."
 AOEIW_FRONTIER_XIC_airfield:0 "Ein Flugfeld hinter den Pässen"
 AOEIW_FRONTIER_XIC_airfield_desc:0 "Eine Beobachterabteilung braucht einen verlässlichen, durch die Provinzzugänge geschützten Landeplatz."
 AOEIW_FRONTIER_XIC_signals:0 "Die nordwestliche Funkschule"
 AOEIW_FRONTIER_XIC_signals_desc:0 "Funker verbinden Bezirkskommandos, Beobachter und Hilfsamt in einem gemeinsamen Netz."
 AOEIW_FRONTIER_XIC_repair:0 "Gebirgstransport-Reparaturtrupps"
 AOEIW_FRONTIER_XIC_repair_desc:0 "Ein gemeinsamer Reparaturdienst der Depots und Arsenale hält knappe Fahrzeuge einsatzfähig."
 AOEIW_FRONTIER_XIC_institute:0 "Die nordwestliche Technikhochschule"
 AOEIW_FRONTIER_XIC_institute_desc:0 "Reparaturtrupps und Funkausbilder bilden den Kern einer dauerhaften Technikhochschule."
 AOEIW_FRONTIER_XIC_province:0 "Xi’an behauptet sich"
 AOEIW_FRONTIER_XIC_province_desc:0 "Ein funktionierender Provinzstaat kooperiert mit Nachbarn und behält seine Verwaltung, Werkstätten und Verteidigungsführung."
 AOEIW_frontier_contacts:0 "Chinesische Grenzmissionen"
 AOEIW_frontier_MON_aid:0 "Der Einheitsfront 500 Gewehre anbieten"
 AOEIW_frontier_MON_aid_desc:0 "Kostet 35 politische Macht. Bei Annahme werden 500 verfügbare Gewehre übertragen; wir erhalten 10 Armeeerfahrung. Bei Ablehnung wird nichts geliefert. Das Angebot ist einmalig."
 aoeiw_frontier.1.t:0 "Eine Mission aus der Mongolei"
 aoeiw_frontier.1.d:0 "Delegierte aus Ulaanbaatar bieten 500 Gewehre an. Praktische Unterstützung muss die Unabhängigkeit der Einheitsfront nicht beeinträchtigen."
