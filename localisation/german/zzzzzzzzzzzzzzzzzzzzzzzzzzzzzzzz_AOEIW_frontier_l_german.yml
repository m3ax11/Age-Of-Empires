 aoeiw_frontier.2.t:0 "Eine Mission aus Xi’an"
 aoeiw_frontier.2.d:0 "Delegierte aus Xi’an bieten 500 Gewehre an. Praktische Unterstützung muss die Unabhängigkeit der Einheitsfront nicht beeinträchtigen."
 AOEIW_frontier_QIN_liaison:0 "Eine zivile Verbindungsmission anbieten"
 AOEIW_frontier_QIN_liaison_desc:0 "Kostet 35 politische Macht. Bei Zustimmung erhalten beide Verwaltungen 3% Stabilität. Kein Krieg endet, kein Gebiet wechselt den Besitzer. Das Angebot ist einmalig."
 aoeiw_frontier.3.t:0 "Eine Mission aus der Qing-Opposition"
 aoeiw_frontier.3.d:0 "Delegierte aus dem Qing-Oppositionsrat bieten ein ständiges Büro für Zivilpassagen und Grenzfälle an. Das mindert administrative Spannungen ohne Änderung der militärischen Lage."
