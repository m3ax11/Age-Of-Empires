 AOEIW9_POL_eco_civ_1:0 "Warschau unter deutscher Oberhoheit: Industrierechnungen"
 AOEIW9_POL_eco_civ_1_desc:0 "Polen muss sein Industriedreieck mit offenen Grenzen und den Grenzen deutscher Oberhoheit vereinbaren. Mobilmachung braucht Bahnkapazität vor Erklärungen strategischer Eigenständigkeit. Die Staatskasse muss Zivile Industriekredite und Der zentrale Rüstungsbezirk prüfen, bevor ein Investitionsstandard finanziert wird."
 AOEIW9_POL_mil_army_1:0 "Warschau unter deutscher Oberhoheit: Stabsprüfung"
 AOEIW9_POL_mil_army_1_desc:0 "Das Weichsel-Verteidigungssystem und Bewegliche Operationsgruppen verlangen verschiedene Ausbildungs- und Reserveordnungen. Der Stab bereitet die Alternativen vor der Doktrinentscheidung vor."
