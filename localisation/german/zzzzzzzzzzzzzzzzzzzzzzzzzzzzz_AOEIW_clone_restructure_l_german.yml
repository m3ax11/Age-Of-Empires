 AOEIW9_YUG_eco_civ_1:0 "Die südslawische Ordnung: Industrierechnungen"
 AOEIW9_YUG_eco_civ_1_desc:0 "Belgrad muss mit den Teilregionen verhandeln, bevor es das Heer vereinheitlicht. Adriawerften, Binnenbahnen und gespaltene Offiziersnetzwerke machen Zentralisierung zu einer praktischen Streitfrage. Die Staatskasse muss Regionale Wiederaufbaukredite und Föderale Arsenalnormen prüfen, bevor ein Investitionsstandard finanziert wird."
 AOEIW9_YUG_mil_army_1:0 "Die südslawische Ordnung: Stabsprüfung"
 AOEIW9_YUG_mil_army_1_desc:0 "Territoriale Gebirgskommandos und Vereinheitlichte Manöververbände verlangen verschiedene Ausbildungs- und Reserveordnungen. Der Stab bereitet die Alternativen vor der Doktrinentscheidung vor."
