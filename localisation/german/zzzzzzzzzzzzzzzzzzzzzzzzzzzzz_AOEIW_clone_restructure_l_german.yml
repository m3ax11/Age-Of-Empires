 AOEIW9_ROM_eco_civ_1:0 "Der Kampf um Bukarest: Industrierechnungen"
 AOEIW9_ROM_eco_civ_1_desc:0 "Öl und Getreide verschaffen Bukarest Einfluss, doch Hofpatronage und Heer streiten über dessen Nutzung. Karpatenverteidigung und mechanisierter Einsatz verlangen unterschiedliche Reservesysteme. Die Staatskasse muss Zivile Investitionen aus Öleinnahmen und Die Ploieștier Verteidigungsindustrie prüfen, bevor ein Investitionsstandard finanziert wird."
 AOEIW9_ROM_mil_army_1:0 "Der Kampf um Bukarest: Stabsprüfung"
 AOEIW9_ROM_mil_army_1_desc:0 "Karpaten-Verteidigungskommandos und Der mechanisierte Reserveplan verlangen verschiedene Ausbildungs- und Reserveordnungen. Der Stab bereitet die Alternativen vor der Doktrinentscheidung vor."
 AOEIW9_ROM_dip_a_1:0 "Der Kampf um Bukarest: Äußere Verpflichtungen"
