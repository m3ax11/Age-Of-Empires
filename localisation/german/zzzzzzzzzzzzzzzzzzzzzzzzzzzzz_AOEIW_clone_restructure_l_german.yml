 AOEIW9_SPR_politics_root:0 "Die Regierung des spanischen Reichs"
 AOEIW9_SPR_politics_root_desc:0 "Madrid regiert einen imperialen Staat mit starken regionalen Ansprüchen. Zentralarsenale und autonome Entwicklungsfonds bieten konkurrierende Wege, das Reich zu versorgen, ohne jede lokale Initiative zu ersticken."
 AOEIW9_SPR_politics_p1_1:0 "Krone und Vizekönigreiche"
 AOEIW9_SPR_politics_p1_1_desc:0 "Die Krone regiert durch erneuerte Vizekönigreiche, historische Fueros und loyale Provinzeliten. Madrid behält das letzte Wort, erkennt aber an, dass ein Reich über mehrere Ozeane nicht wie eine einzige Kaserne geführt werden kann."
 AOEIW9_SPR_politics_p2_1:0 "Die Cortes beanspruchen das Reich"
 AOEIW9_SPR_politics_p2_1_desc:0 "Abgeordnete verlangen, dass Reichssteuern und Truppenverlegungen in Madrid beraten werden. Vertretung wird zur Machtquelle statt zum Palastschmuck."
 AOEIW9_SPR_politics_p3_1:0 "Befehle aus dem Königspalast"
 AOEIW9_SPR_politics_p3_1_desc:0 "Die autoritäre Fraktion schickt aus Madrid ein Programm an Gouverneure, Wehrbezirke und Presse. Debatte weicht Gehorsam, gemessen in Berichten."
 AOEIW9_SPR_eco_civ_1:0 "Die Regierung des spanischen Reichs: Industrierechnungen"
 AOEIW9_SPR_eco_civ_1_desc:0 "Madrid regiert einen imperialen Staat mit starken regionalen Ansprüchen. Zentralarsenale und autonome Entwicklungsfonds bieten konkurrierende Wege, das Reich zu versorgen, ohne jede lokale Initiative zu ersticken. Die Staatskasse muss Vizekönigliche Entwicklungsfonds und Vorrang der Zentralarsenale prüfen, bevor ein Investitionsstandard finanziert wird."
 AOEIW9_SPR_mil_army_1:0 "Die Regierung des spanischen Reichs: Stabsprüfung"
 AOEIW9_SPR_mil_army_1_desc:0 "Regionale Verteidigungsbezirke und Die imperiale Expeditionsreserve verlangen verschiedene Ausbildungs- und Reserveordnungen. Der Stab bereitet die Alternativen vor der Doktrinentscheidung vor."
 AOEIW9_SPR_dip_a_1:0 "Die Regierung des spanischen Reichs: Äußere Verpflichtungen"
 AOEIW9_SPR_dip_a_1_desc:0 "Madrid regiert einen imperialen Staat mit starken regionalen Ansprüchen. Zentralarsenale und autonome Entwicklungsfonds bieten konkurrierende Wege, das Reich zu versorgen, ohne jede lokale Initiative zu ersticken. Äußere Verpflichtungen müssen genug Versorgung und Einnahmen für die innere Ordnung belassen."
 AOEIW9_SWE_politics_root:0 "Das Verteidigungsgesetz von 1936"
 AOEIW9_SWE_politics_root_desc:0 "Der Reichstag muss entscheiden, ob sich die Neutralität mit den Streitkräften der Abrüstungsjahre noch verteidigen lässt. Die Abstimmung bindet Wohlfahrt, Industrie und Wehrdienst an einen nationalen Plan."
 AOEIW9_SWE_politics_p1_1:0 "Der König in Drottningholm"
 AOEIW9_SWE_politics_p1_1_desc:0 "Der Hof ruft Offiziere und konservative Abgeordnete nach Drottningholm. Die Krone macht sich zum Schirmherrn der Bereitschaft, ehe das Kabinett das Thema für sich beansprucht."
 AOEIW9_SWE_politics_p2_1:0 "Der Sozialpakt des Reichstags"
 AOEIW9_SWE_politics_p2_1_desc:0 "Schwedisches Erz und Maschinenbau können Wohlfahrt und glaubwürdige Verteidigung tragen, doch Exportpflichten begrenzen schnelle Aufrüstung. Baltische Sicherheit hängt vom Zusammenspiel von Industrie, Küstentruppen und Feldheer ab. Der Sozialpakt des Reichstags verankert Autorität in Vertretungsinstitutionen und verfassungsmäßiger Kontrolle."
 AOEIW9_SWE_politics_p3_1:0 "Befehle aus Stockholm"
 AOEIW9_SWE_politics_p3_1_desc:0 "Die Mobilisierungsfraktion hat genug von Kommissionsberichten und Parteienhandel. Ministerien, Eisenbahnen und Provinzbehörden erhalten einen einzigen Befehlssatz aus der Hauptstadt."
 AOEIW9_SWE_eco_civ_1:0 "Kanonen oder Folkhemmet?"
 AOEIW9_SWE_eco_civ_1_desc:0 "Jede Krone für eine Batterie fehlt zunächst bei Wohnungen, Renten und öffentlichen Arbeiten. Das Kabinett muss zeigen, dass Landesverteidigung und Volksheim gemeinsam bezahlt werden können."
 AOEIW9_SWE_mil_army_1:0 "Der Generalstab vor dem Reichstag"
 AOEIW9_SWE_mil_army_1_desc:0 "Offiziere müssen ihre Pläne vor Abgeordneten verteidigen, die sich an die Kosten der letzten Mobilmachung erinnern. Die Doktrin beginnt mit dem Streit über das Heer, das Schweden wirklich unterhalten kann."
 AOEIW9_SWE_dip_a_1:0 "Stockholm blickt nach Finnland"
 AOEIW9_SWE_dip_a_1_desc:0 "Die Ereignisse jenseits des Bottnischen Meerbusens sind kein fremdes Grenzproblem mehr. Das Kabinett entscheidet, was die schwedische Neutralität erlaubt, bevor Helsinki unter Beschuss fragt."
 AOEIW9_YUG_politics_root:0 "Die südslawische Ordnung"
 AOEIW9_YUG_politics_root_desc:0 "Belgrad muss mit den Teilregionen verhandeln, bevor es das Heer vereinheitlicht. Adriawerften, Binnenbahnen und gespaltene Offiziersnetzwerke machen Zentralisierung zu einer praktischen Streitfrage."
 AOEIW9_YUG_politics_p1_1:0 "Der Regionalpakt der Krone"
 AOEIW9_YUG_politics_p1_1_desc:0 "Belgrad muss mit den Teilregionen verhandeln, bevor es das Heer vereinheitlicht. Adriawerften, Binnenbahnen und gespaltene Offiziersnetzwerke machen Zentralisierung zu einer praktischen Streitfrage. Der Regionalpakt der Krone verankert Autorität im bestehenden Staat und seinen ernannten Beamten."
 AOEIW9_YUG_politics_p2_1:0 "Das föderale Parlamentsabkommen"
 AOEIW9_YUG_politics_p2_1_desc:0 "Belgrad muss mit den Teilregionen verhandeln, bevor es das Heer vereinheitlicht. Adriawerften, Binnenbahnen und gespaltene Offiziersnetzwerke machen Zentralisierung zu einer praktischen Streitfrage. Das föderale Parlamentsabkommen verankert Autorität in Vertretungsinstitutionen und verfassungsmäßiger Kontrolle."
