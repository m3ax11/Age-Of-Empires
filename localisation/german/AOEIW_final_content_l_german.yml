 AOEIW_final_faction_coordination:0 "Bündniskoordination"
 AOEIW_final_rivalry_pressure:0 "Strategische Rivalität"


 AOEIW_final_postwar_category:0 "Der Frieden nach dem Sieg"
 AOEIW_final_postwar_category_desc:0 "Nach dem Sieg bleiben zerstörte Infrastruktur, erschöpfte Bevölkerungen, Besatzungsfragen und Bündnisse ohne Friedenszweck."
 AOEIW_final_establish_reconstruction_commission:0 "Eine Wiederaufbaukommission schaffen"
 AOEIW_final_establish_reconstruction_commission_desc:0 "Demobilisierung, Reparaturen und die Umstellung der Kriegsproduktion zentral koordinieren."
 AOEIW_final_GER_continental_settlement:0 "Die kontinentale Neuordnung"
 AOEIW_final_GER_continental_settlement_desc:0 "Berlin bindet den Reichspakt an eine Nachkriegswirtschaftsordnung, statt das Bündnis zerfallen zu lassen."
 AOEIW_final_FRA_european_security_charter:0 "Eine europäische Sicherheitscharta"
 AOEIW_final_FRA_european_security_charter_desc:0 "Frankreich überführt die Kriegskooperation in ein dauerhaftes System gemeinsamer Verteidigungsplanung."
 AOEIW_final_SOV_rebuild_the_eastern_railways:0 "Die Ostbahnen wiederaufbauen"
 AOEIW_final_SOV_rebuild_the_eastern_railways_desc:0 "Der Wiederaufbau der langen Ostkorridore ist für Armee und Industrie des Landesinneren unverzichtbar."
 AOEIW_final_JAP_rationalise_imperial_administration:0 "Die imperiale Verwaltung ordnen"
 AOEIW_final_JAP_rationalise_imperial_administration_desc:0 "Das Reich trägt die politischen und wirtschaftlichen Kosten, improvisierte Militärherrschaft durch feste Verwaltung zu ersetzen."
 AOEIW_final_USA_convert_the_arsenal:0 "Das Arsenal der Demokratie umstellen"
 AOEIW_final_USA_convert_the_arsenal_desc:0 "Für den Krieg gebaute Fabriken, Labore und Logistiknetze werden auf ziviles Wachstum umgestellt."
