l_german:
 AOEIW_final_JAP_continental_preparations:0 "Vorbereitungen der Kontinentalexpedition"
 AOEIW_final_JAP_continental_preparations_desc:0 "Fahrpläne, Vorräte und Landungspläne werden für einen möglichen Kontinentalkrieg zusammengeführt."
 AOEIW_final_JAP_naval_priority:0 "Vorrang für die Marine"
 AOEIW_final_JAP_naval_priority_desc:0 "Ressourcen fließen in Flotte, Trägerluftfahrt und die Kontrolle der pazifischen Zugänge."
 AOEIW_final_JAP_overextension:0 "Kontinentale Überdehnung"
 AOEIW_final_JAP_overextension_desc:0 "Der gewaltige Landkrieg belastet Schifffahrt, Vertrauen und das imperiale Versorgungssystem."
 AOEIW_final_reichspakt_staff:0 "Reichspakt-Stabskoordination"
 AOEIW_final_reichspakt_staff_desc:0 "Gemeinsame Mobilmachungspläne und Operationsplanung verbinden die Armeen des Reichspakts."
 AOEIW_final_old_order_defence:0 "Defensivplanung der Alten Ordnung"
 AOEIW_final_old_order_defence_desc:0 "Das Bündnis hat gemeinsame Verteidigungsräume, Reserven und Bahnprioritäten festgelegt."
 AOEIW_final_mediterranean_coordination:0 "Mittelmeer-Luft-See-Koordination"
 AOEIW_final_mediterranean_coordination_desc:0 "Die Stäbe der Liga koordinieren Aufklärung, Geleitschutz und Luftunterstützung."
 AOEIW_final_faction_economic_protocol:0 "Bündnis-Wirtschaftsprotokoll"
 AOEIW_final_faction_economic_protocol_desc:0 "Prioritätsverträge und gemeinsame Standards verringern Reibung zwischen verbündeten Industrien."
 AOEIW20_UF_national_reconstruction:0 "Nationales Wiederaufbauprogramm"
 AOEIW20_UF_national_reconstruction_desc:0 "Verkehr, Energie und industrielle Reparaturen werden als nationales Gesamtprojekt koordiniert."
 AOEIW20_UF_nra_integration:0 "Integrierte Nationalrevolutionäre Armee"
 AOEIW20_UF_nra_integration_desc:0 "Provinztruppen unterstehen einem Generalstab, einheitlichen Gliederungen und nationalen Depots."
 AOEIW20_UF_council_charter:0 "Charta der Nationalkoalition"
 AOEIW20_UF_council_charter_desc:0 "Die Koalition akzeptiert eine schriftliche Machtteilung, um einen neuen Bürgerkrieg zu verhindern."
 AOEIW20_UF_coastal_defence:0 "Verteidigung der Küste"
 AOEIW20_UF_coastal_defence_desc:0 "Küstenkommandos, Reserven und befestigte Häfen bereiten China auf eine weitere Invasion vor."
 AOEIW_final_postwar_reconstruction:0 "Nachkriegs-Wiederaufbaukommission"
 AOEIW_final_postwar_reconstruction_desc:0 "Eine Zentralkommission lenkt Reparaturen, Demobilisierung und Rückkehr zur Friedenswirtschaft."
 AOEIW_final_occupation_burden:0 "Last der Besatzung"
 AOEIW_final_occupation_burden_desc:0 "Garnisonen und Verwaltungen verbrauchen Ressourcen, während der Widerstand im Inland wächst."

 AOEIW20_UF_chiang_constitutional_tutelage:0 "Verfassungspolitische Vormundschaft"
 AOEIW20_UF_chiang_constitutional_tutelage_desc:0 "Die NRA verspricht eine spätere Verfassungsordnung, behält aber die zur Einigung nötige Autorität."
 AOEIW20_UF_chiang_integrate_provincial_armies:0 "Die Provinzarmeen integrieren"
 AOEIW20_UF_chiang_integrate_provincial_armies_desc:0 "Regionale Kommandos unterstellen Versorgung und Führung dem nationalen Generalstab."
 AOEIW20_UF_chiang_national_reconstruction:0 "Nationale Wiederaufbaukommission"
 AOEIW20_UF_chiang_national_reconstruction_desc:0 "Das Nanjing-Programm verbindet militärische Einigung mit Bahn-, Industrie- und Verwaltungsaufbau."
 AOEIW20_UF_mao_land_to_the_tiller:0 "Land den Bauern"
 AOEIW20_UF_mao_land_to_the_tiller_desc:0 "Landreform bindet das Dorf an die Revolution und mobilisiert Millionen für den Nationaldienst."
 AOEIW20_UF_mao_reconstruction_committees:0 "Wiederaufbaukomitees"
 AOEIW20_UF_mao_reconstruction_committees_desc:0 "Lokale Komitees organisieren Arbeit, reparieren Verkehr und lenken knappe Rohstoffe."
 AOEIW20_UF_mao_rapid_industrialisation:0 "Industrialisierung im Revolutionstempo"
 AOEIW20_UF_mao_rapid_industrialisation_desc:0 "China presst Jahrzehnte industriellen Wachstums in eine einzige Mobilisierung und tauscht Entbehrung gegen Stahl und Maschinen."
 AOEIW20_UF_council_coalition_charter:0 "Die Koalitionscharta"
 AOEIW20_UF_council_coalition_charter_desc:0 "NRA, KPCh und Regionaldelegierte bestimmen die Grenzen einer kollektiven Nationalregierung."
 AOEIW20_UF_council_regional_compromise:0 "Ein regionaler Kompromiss"
 AOEIW20_UF_council_regional_compromise_desc:0 "Provinzautonomie wird gegen Steuern, Rekruten und Gehorsam gegenüber der gemeinsamen Verteidigung anerkannt."
 AOEIW20_UF_council_reconstruction_compact:0 "Der Wiederaufbaupakt"
 AOEIW20_UF_council_reconstruction_compact_desc:0 "Die Parteien bauen Bahnen, Arsenale und Zivilindustrie wieder auf, bevor der Verfassungsstreit weitergeht."
 AOEIW20_UF_prepare_the_coast:0 "Die Küste vorbereiten"
 AOEIW20_UF_prepare_the_coast_desc:0 "Japanischer Druck macht befestigte Häfen und ein gemeinsames Küstenkommando unvermeidbar."
 AOEIW20_UF_china_stands_united:0 "China steht geeint"
 AOEIW20_UF_china_stands_united_desc:0 "Die Notkoalition hat Krieg und Neuordnung überstanden. Unabhängig von ihrer Politik wird China nicht erneut geteilt."

 AOEIW_final_JAP_expansion_category:0 "Die imperiale Strategiedebatte"
 AOEIW_final_JAP_expansion_category_desc:0 "Armee, Marine, zivile Ministerien und Zaibatsu ringen darum, wann – und ob – Japan expandiert."
 AOEIW_final_JAP_imperial_conference:0 "Die Imperiale Konferenz einberufen"
 AOEIW_final_JAP_imperial_conference_desc:0 "Der Thron hört die rivalisierenden Strategien, bevor ein nationaler Kurs genehmigt wird."
 AOEIW_final_JAP_prepare_continental_war:0 "Einen Kontinentalkrieg vorbereiten"
 AOEIW_final_JAP_prepare_continental_war_desc:0 "Bahnkapazität, Landungsboote, Munition und Reserven sammeln, ohne den Krieg bereits zu beginnen."
 AOEIW_final_JAP_authorise_china_expedition:0 "Die China-Expedition genehmigen"
 AOEIW_final_JAP_authorise_china_expedition_desc:0 "Die Vorbereitung ist beendet. Die Genehmigung erzeugt einen Kriegsgrund, die Kriegserklärung bleibt beim Spieler."
 AOEIW_final_JAP_authorise_china_expedition_tt:0 "Erhält einen §YAnnexions§!-Kriegsgrund gegen §YChina§!. Diese Entscheidung erklärt §Rnicht§! automatisch den Krieg."
 AOEIW_final_JAP_navy_first:0 "Der Marine Vorrang geben"
 AOEIW_final_JAP_navy_first_desc:0 "Das Kontinentalvorhaben wird ein Jahr zugunsten von Werften, Trägern und Marinefliegern vertagt."
 AOEIW_final_JAP_offer_nanjing_protocol:0 "Das Nanjing-Protokoll anbieten"
 AOEIW_final_JAP_offer_nanjing_protocol_desc:0 "Von China politische und wirtschaftliche Zugeständnisse verlangen, bevor Gewalt eingesetzt wird."
 AOEIW_final_JAP_arm_the_manchurian_restoration:0 "Die mandschurische Restauration bewaffnen"
 AOEIW_final_JAP_arm_the_manchurian_restoration_desc:0 "Puyis japanisch gestützte Regierung erhält Männer und Waffen für ihren Anspruch auf ganz China."
 AOEIW_final_JAP_focus_unlocks_expedition_tt:0 "Schaltet die Entscheidung §YChina-Expedition§! frei und beginnt Kontinentalvorbereitungen. Kein automatischer Kriegsgrund mehr."

 aoeiw_final_japan.1.t:0 "Die Imperiale Strategiekonferenz"
 aoeiw_final_japan.1.a:0 "Die Kontinentalexpedition vorbereiten."
 aoeiw_final_japan.1.b:0 "Die Flotte kommt zuerst."
 aoeiw_final_japan.1.c:0 "Chinas Verhandlungsbereitschaft prüfen."
 aoeiw_final_japan.1.d:0 "Japan muss warten."
 aoeiw_final_japan.2.t:0 "Das Nanjing-Protokoll"
 aoeiw_final_japan.2.d:0 "Tokio bietet eine vorläufige Einigung gegen Wirtschaftsrechte und Anerkennung seiner Stellung in der Mandschurei. Annahme kauft Zeit, schwächt aber Chinas Souveränitätsanspruch."
 aoeiw_final_japan.2.a:0 "Das Protokoll annehmen und Zeit gewinnen."
 aoeiw_final_japan.2.b:0 "China macht keine Zugeständnisse."
 aoeiw_final_japan.3.t:0 "China akzeptiert das Protokoll"
 aoeiw_final_japan.3.d:0 "Nanjing hat einem begrenzten Ausgleich zugestimmt. Die Krise lässt nach, doch keine Seite hält die Regelung für dauerhaft."
 aoeiw_final_japan.3.a:0 "Die Atempause nutzen."
 aoeiw_final_japan.4.t:0 "China lehnt das Protokoll ab"
 aoeiw_final_japan.4.d:0 "Die chinesische Regierung weist alle Forderungen zurück. Die Armee erklärt nun Gewalt zum einzigen Ausweg."
 aoeiw_final_japan.4.a:0 "Die Vorbereitungen abschließen."
 aoeiw_final_japan.10.t:0 "Der Krieg kehrt nach China zurück"
 aoeiw_final_japan.10.d:0 "Japans Kontinentalkrieg bedroht amerikanischen Handel und das Gleichgewicht im Pazifik."
 aoeiw_final_japan.10.a:0 "Strategische Vorbereitungen beginnen."
 aoeiw_final_japan.10.b:0 "Eine neue Verpflichtung vermeiden."
 aoeiw_final_japan.11.t:0 "Japan greift auf dem Kontinent an"
 aoeiw_final_japan.11.d:0 "Ein japanischer Krieg in China bedroht den russischen Fernen Osten."
 aoeiw_final_japan.11.a:0 "Die Ostkommandos verstärken."
 aoeiw_final_japan.11.b:0 "Nicht in Asien hineinziehen lassen."

 AOEIW_final_faction_politics:0 "Bündnisräte"
 AOEIW_final_faction_politics_desc:0 "Die großen Bündnisse erfordern politische Kompromisse, Militärplanung und gemeinsame Wirtschaftsziele."
 AOEIW_final_reichspakt_command_conference:0 "Reichspakt-Kommandokonferenz"
 AOEIW_final_reichspakt_command_conference_desc:0 "Berlin entscheidet zwischen straffer Zentralplanung und einer beratenden Kommandostruktur."
 AOEIW_final_reichspakt_economic_protocol:0 "Reichspakt-Wirtschaftsprotokoll"
 AOEIW_final_reichspakt_economic_protocol_desc:0 "Verträge und strategischen Handel im deutschen Block vereinheitlichen."
 AOEIW_final_old_order_security_council:0 "Sicherheitsrat der Alten Ordnung"
 AOEIW_final_old_order_security_council_desc:0 "Frankreich und seine Partner wählen zwischen Befestigung und härterem Druck auf Deutschland."
 AOEIW_final_old_order_economic_compact:0 "Wirtschaftspakt der Alten Ordnung"
 AOEIW_final_old_order_economic_compact_desc:0 "Strategische Aufträge und Kredite unter französischer Führung bündeln."
 AOEIW_final_mediterranean_strategy_conference:0 "Mittelmeer-Strategiekonferenz"
 AOEIW_final_mediterranean_strategy_conference_desc:0 "Italien, Rumänien, Jugoslawien und Bulgarien müssen Flottenambition und Balkansicherheit ausgleichen."
 AOEIW_final_mediterranean_economic_board:0 "Mittelmeer-Wirtschaftsrat"
 AOEIW_final_mediterranean_economic_board_desc:0 "Öl, Schifffahrt und Rüstungsaufträge innerhalb der Liga koordinieren."
 AOEIW_final_POL_petition_for_autonomy:0 "Berlin um Autonomie ersuchen"
 AOEIW_final_POL_petition_for_autonomy_desc:0 "Polen prüft, ob Partnerschaft im Reichspakt mehr als Gehorsam bedeutet."
 AOEIW_final_POL_autonomy_concession:0 "Reichspakt-Autonomiezugeständnis"

 aoeiw_final_factions.1.t:0 "Die Reichspakt-Kommandokonferenz"
 aoeiw_final_factions.1.d:0 "Deutsche, niederländische und polnische Stäbe streiten über Berlins Befehlsgewalt."
 aoeiw_final_factions.1.a:0 "Einen gemeinsamen Operationsstab schaffen."
 aoeiw_final_factions.1.b:0 "Nationale Kommandos respektieren."
 aoeiw_final_factions.2.t:0 "Der Sicherheitsrat der Alten Ordnung"
 aoeiw_final_factions.2.d:0 "Frankreich, Österreich und Belgien debattieren defensive Räume oder entschlossenen Druck auf Deutschland."
 aoeiw_final_factions.2.a:0 "Die gemeinsame Front befestigen."
 aoeiw_final_factions.2.b:0 "Berlin unter Druck setzen."
 aoeiw_final_factions.3.t:0 "Mittelmeerstrategie"
 aoeiw_final_factions.3.d:0 "Italien fordert eine Gesamtstrategie, doch die Verbündeten streiten über Flotte oder Balkanfront."
 aoeiw_final_factions.3.a:0 "Meer und Luftraum beherrschen."
 aoeiw_final_factions.3.b:0 "Die Balkanpässe sichern."
 aoeiw_final_factions.10.t:0 "Das polnische Autonomiegesuch"
 aoeiw_final_factions.10.d:0 "Warschau verlangt mehr Kontrolle über Verwaltung und Streitkräfte. Ein Zugeständnis stabilisiert den Reichspakt; Ablehnung stärkt den Widerstand."
 aoeiw_final_factions.10.a:0 "Begrenzte Autonomie gewähren."
 aoeiw_final_factions.10.b:0 "Das Reich lockert seinen Griff nicht."
 aoeiw_final_factions.11.t:0 "Berlin gibt nach"
 aoeiw_final_factions.11.d:0 "Deutschland akzeptiert eine maßvolle Erweiterung polnischer Autonomie im Reichspakt."
 aoeiw_final_factions.11.a:0 "Ein Schritt zur Partnerschaft."
 aoeiw_final_factions.12.t:0 "Berlin lehnt ab"
 aoeiw_final_factions.12.d:0 "Deutschland weist das Gesuch zurück. Die Zusammenarbeit bleibt, doch der Nationalismus erhält neuen Zulauf."
 aoeiw_final_factions.12.a:0 "Polen wird sich erinnern."

