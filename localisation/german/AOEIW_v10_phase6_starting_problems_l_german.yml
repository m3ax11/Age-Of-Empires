l_german:
 AOEIW6_FRA_procurement_0:0 "Konkurrierende Beschaffungsbehörden"
 AOEIW6_FRA_procurement_0_desc:0 "Die französische Aufrüstung ist auf Ministerien, Arsenale und bevorzugte Auftragnehmer verteilt, die sich überschneidende Anforderungen stellen. Das führt zu teuren Werkzeugwechseln und langsamer Umsetzung politischer Vorgaben."
 AOEIW6_FRA_procurement_1:0 "Gemeinsame Rüstungsausschreibungen"
 AOEIW6_FRA_procurement_1_desc:0 "Erste gemeinsame Ausschreibungen zwingen Ministerien und Firmen, Spezifikationen vor Vertragsabschluss abzustimmen. Doppelarbeit bleibt, doch weniger Fabriken werden für widersprüchliche Aufträge umgerüstet."
 AOEIW6_FRA_procurement_2:0 "Zentraler Beschaffungsrat"
 AOEIW6_FRA_procurement_2_desc:0 "Ein zentraler Rat koordiniert nun Aufträge, Werkzeugbau und Fabrikausbau der wichtigsten Rüstungsunternehmen. Das System ist nicht elegant, aber zunehmend berechenbar."
 AOEIW6_FRA_procurement_3:0 "Integrierte Rüstungsdirektion"
 AOEIW6_FRA_procurement_3_desc:0 "Frankreich hat seine Beschaffung in ein koordiniertes nationales System verwandelt. Zivile und militärische Industrie können nun mit deutlich weniger Verwaltungsreibung wachsen."
 AOEIW6_SPR_regional_economy_0:0 "Ein industrieller Flickenteppich"
 AOEIW6_SPR_regional_economy_0_desc:0 "Katalanische Fabriken, baskischer Stahl, asturische Minen und Madrider Werkstätten sind produktive Inseln, die durch ungleiche Infrastruktur, Finanzierung und Verwaltungsregeln verbunden sind."
 AOEIW6_SPR_regional_economy_1:0 "Regionale Investitionsabkommen"
 AOEIW6_SPR_regional_economy_1_desc:0 "Madrid bindet katalanische und baskische Investitionen zunehmend an nationale Fracht- und Kreditpläne. Die Wirtschaft bleibt ungleich, doch Kapital folgt nun einem gemeinsamen Programm."
 AOEIW6_SPR_regional_economy_2:0 "Interregionaler Entwicklungsrat"
 AOEIW6_SPR_regional_economy_2_desc:0 "Die Industriepolitik verbindet nun Asturien, Madrid und die nördlichen Fertigungsregionen durch gemeinsame Verträge und Infrastrukturprioritäten."
 AOEIW6_SPR_regional_economy_3:0 "Integrierte Wirtschaft der Halbinsel"
 AOEIW6_SPR_regional_economy_3_desc:0 "Spanien hat seine regionalen industriellen Stärken zu einem nationalen Produktionsnetz verbunden, ohne Katalonien, das Baskenland, Asturien und Madrid gleichzusetzen."
 AOEIW6_POR_mainland_industry_0:0 "Eine schmale Festlandbasis"
 AOEIW6_POR_mainland_industry_0_desc:0 "Lissabon und Porto allein können die industrielle Last eines atlantischen Imperiums nicht tragen. Ein kleiner Binnenmarkt, schwache Inlandinfrastruktur und knappes Kapital verteuern jede Expansion."
 AOEIW6_POR_mainland_industry_1:0 "Investitionsplan Lissabon–Porto"
 AOEIW6_POR_mainland_industry_1_desc:0 "Die Regierung konzentriert knappes Kapital auf jene Festlandkorridore, die größere Werkstätten und verlässlicheren Binnenhandel tragen können."
 AOEIW6_POR_mainland_industry_2:0 "Nationaler Industriekredit"
 AOEIW6_POR_mainland_industry_2_desc:0 "Ein disziplinierteres Kredit- und Infrastrukturprogramm verbreitert die Festlandsindustrie über wenige etablierte Unternehmen hinaus."
 AOEIW6_POR_mainland_industry_3:0 "Eine tragfähige Metropolwirtschaft"
 AOEIW6_POR_mainland_industry_3_desc:0 "Portugal bleibt eine kleinere Industriemacht, doch das Festland kann Staat und Imperium nun tragen, ohne jedes Ausbauprojekt zur Haushaltskrise werden zu lassen."
 AOEIW6_GER_rearmament_coordination_0:0 "Die Kosten der Aufrüstung"
 AOEIW6_GER_rearmament_coordination_0_desc:0 "Die deutsche Industrie ist gewaltig, doch gleichzeitige Forderungen von Heer, Luftwaffe und Marine konkurrieren um Werkzeugmaschinen, Stahlkontingente und Investitionen. Die Aufrüstung ist mächtig – und teuer."
 AOEIW6_GER_rearmament_coordination_1:0 "Zentrale Rüstungsplanung"
 AOEIW6_GER_rearmament_coordination_1_desc:0 "Berlin beginnt, Großaufträge zeitlich zu ordnen, damit Unternehmen nicht mehr gegen widersprüchliche Zeitpläne der Teilstreitkräfte expandieren."
 AOEIW6_GER_rearmament_coordination_2:0 "Standardisierte Reichsverträge"
 AOEIW6_GER_rearmament_coordination_2_desc:0 "Gemeinsame Spezifikationen und längere Aufträge verringern die Verschwendung durch ständig wechselnde militärische Kleinserien."
 AOEIW6_GER_rearmament_coordination_3:0 "Koordinierte Kriegsindustrie"
 AOEIW6_GER_rearmament_coordination_3_desc:0 "Deutschland hat die wichtigsten Rüstungsunternehmen und Teilstreitkräfte auf ein kohärenteres Produktionsprogramm ausgerichtet. Das industrielle Potenzial lässt sich nun mit weniger Reibung in militärische Macht umsetzen."
 AOEIW6_AUS_joint_procurement_0:0 "Geteilte kaiserliche Beschaffung"
 AOEIW6_AUS_joint_procurement_0_desc:0 "Österreichische, ungarische und tschechische Industriezentren unterstehen sich überschneidenden militärischen und politischen Zuständigkeiten. Die gemeinsame Armee bezahlt dies mit Doppelaufträgen und unvereinbaren Prioritäten."
 AOEIW6_AUS_joint_procurement_1:0 "Gemeinsame Rüstungsspezifikationen"
 AOEIW6_AUS_joint_procurement_1_desc:0 "Erste reichsweite Spezifikationen verringern doppelte Aufträge und erleichtern es böhmischen, österreichischen und ungarischen Fabriken, dieselben Verbände zu versorgen."
 AOEIW6_AUS_joint_procurement_2:0 "Gemeinsames Beschaffungsamt"
 AOEIW6_AUS_joint_procurement_2_desc:0 "Ein ständiges Amt vermittelt nun Verträge zwischen den Kronländern und koordiniert die Produktion mit dem k.u.k. Generalstab."
 AOEIW6_AUS_joint_procurement_3:0 "Donauländisches Rüstungssystem"
 AOEIW6_AUS_joint_procurement_3_desc:0 "Österreich-Ungarn hat seine verstreuten Industrieregionen zu einem funktionierenden gemeinsamen Beschaffungsnetz verbunden, ohne ihre politischen Unterschiede aufzuheben."
 AOEIW6_ITA_military_modernisation_0:0 "Eine Armee zwischen zwei Zeitaltern"
 AOEIW6_ITA_military_modernisation_0_desc:0 "Das italienische Heer verbindet moderne Verbände mit uneinheitlicher Stabsarbeit, Mobilmachung und Unterstützung. Die Ambitionen sind schneller gewachsen als die Institutionen."
 AOEIW6_ITA_military_modernisation_1:0 "Reform des Comando Supremo"
 AOEIW6_ITA_military_modernisation_1_desc:0 "Das Oberkommando beginnt, Operationsplanung und Unterstützungsverfahren in den Feldverbänden zu vereinheitlichen."
 AOEIW6_ITA_military_modernisation_2:0 "Einheitliche Mobilmachungstabellen"
 AOEIW6_ITA_military_modernisation_2_desc:0 "Reserveeinberufung, Verstärkungswege und Stabsverfahren beruhen zunehmend auf denselben nationalen Annahmen."
 AOEIW6_ITA_military_modernisation_3:0 "Ein modernes königliches Heer"
 AOEIW6_ITA_military_modernisation_3_desc:0 "Italien verfügt nun über eine geschlossenere Armee, die Personal und Industrie in dauerhafte Operationen statt einzelne Schaustücke umsetzen kann."
 AOEIW6_POL_reichspakt_dependency_0:0 "Souveränität unter Berlin"
 AOEIW6_POL_reichspakt_dependency_0_desc:0 "Polen ist ein deutsches Subjekt im Reichspakt. Warschau regiert im Inneren, doch Strategie, Mobilmachung und große außenpolitische Entscheidungen bleiben durch das Verhältnis zu Berlin eingeschränkt."
 AOEIW6_POL_reichspakt_dependency_1:0 "Die Berlin–Warschau-Verbindung"
 AOEIW6_POL_reichspakt_dependency_1_desc:0 "Eine ständige Verbindung gibt Warschau einen Ort, deutsche Forderungen auszuhandeln, bevor sie zu Befehlen werden, und senkt damit die Kosten abhängiger Entscheidungsfindung."
 AOEIW6_POL_reichspakt_dependency_2:0 "Ausgehandelte Reichspaktpflichten"
 AOEIW6_POL_reichspakt_dependency_2_desc:0 "Gemeinsame Stabsarbeit und formale Konsultation haben geklärt, was Polen dem Bündnis schuldet und was unter polnischer Kontrolle bleibt."
 AOEIW6_POL_reichspakt_dependency_3:0 "Praktische Autonomie im Reichspakt"
 AOEIW6_POL_reichspakt_dependency_3_desc:0 "Polen bleibt deutsches Subjekt, doch Warschau hat sich innerhalb des Bündnisses spürbaren Spielraum für Heer und innenpolitische Prioritäten erarbeitet."
 AOEIW8_SOV_divided_politics_1:0 "Kabinettschlichtung"
 AOEIW8_SOV_divided_politics_1_desc:0 "Hof und Duma haben regelmäßige Schlichtungsverfahren akzeptiert; weniger Streitigkeiten legen nun ganze Ministerien lahm."
 AOEIW8_SOV_divided_politics_2:0 "Ein stabiles kaiserliches Kabinett"
 AOEIW8_SOV_divided_politics_2_desc:0 "Der Staat verfügt nun über ein Kabinett, das trotz politischer Gegensätze regieren kann, ohne jeden Streit zur Verfassungskrise werden zu lassen."
 AOEIW8_SOV_divided_politics_3:0 "Wiederhergestellte Verwaltungslegitimität"
 AOEIW8_SOV_divided_politics_3_desc:0 "Russland hat die Opposition nicht beseitigt, doch die Regierung besitzt wieder genug Legitimität und Routine, damit Entscheidungen Bestand haben."
 AOEIW8_SOV_backward_industry_1:0 "Koordinierung von Bahn und Fabrik"
 AOEIW8_SOV_backward_industry_1_desc:0 "Erste landesweite Erhebungen verbinden Industrieausbau mit Eisenbahnkapazität und Rohstoffförderung, statt jedes Vorhaben isoliert zu behandeln."
 AOEIW8_SOV_backward_industry_2:0 "Ausgewogene kaiserliche Entwicklung"
 AOEIW8_SOV_backward_industry_2_desc:0 "Neue Investitionen verteilen Maschinenkapazität und Infrastruktur über die alten Industriezentren hinaus und verbessern zugleich den Zugang zu den Ressourcen des Reiches."
 AOEIW8_SOV_backward_industry_3:0 "Eine modernisierende Kontinentalwirtschaft"
 AOEIW8_SOV_backward_industry_3_desc:0 "Russland bleibt geografisch schwer zu verwalten, doch sein Industriesystem kann nun groß angelegte Modernisierung tragen, statt nur einzelne Fabriken anzuhäufen."
 AOEIW8_SOV_weak_officer_corps_1:0 "Ausgebaute Stabsschulen"
 AOEIW8_SOV_weak_officer_corps_1_desc:0 "Berufsausbildung und Feldübungen schaffen einen größeren Kreis von Offizieren, die mit modernen Stabsverfahren vertraut sind."
 AOEIW8_SOV_weak_officer_corps_2:0 "Reformierter russischer Generalstab"
 AOEIW8_SOV_weak_officer_corps_2_desc:0 "Einheitliche Planungsverfahren und stärkere Stabsschulen haben die Koordination zwischen Armeen und Militärbezirken deutlich verbessert."
 AOEIW8_SOV_weak_officer_corps_3:0 "Ein professionelles kaiserliches Offizierskorps"
 AOEIW8_SOV_weak_officer_corps_3_desc:0 "Russland hat eine professionelle Führungskultur wiederaufgebaut, die dem Maßstab kontinentaler Kriegsführung gewachsen ist."
