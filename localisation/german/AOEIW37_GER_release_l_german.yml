l_german:
 AOEIW37_GER_occupation_directorate:0 "Ein Befehl aus Berlin"
 AOEIW37_GER_occupation_directorate_desc:0 "Heereskommandos, Polizeistellen und Parteikommissare erteilen in den besetzten Gebieten widersprüchliche Befehle. Berlin zwingt sie unter eine einzige brutale Befehlskette."
 AOEIW37_GER_continental_resource_board:0 "Öl aus Ploiești, Erz aus Kiruna"
 AOEIW37_GER_continental_resource_board_desc:0 "Deutschlands Industrie hängt von Wegen ab, die Berlin nicht vollständig kontrolliert. Ministerien müssen Quellen, Minen und Bahnlinien sichern, bevor sich die nächste Blockade schließt."
 AOEIW37_GER_operational_lessons_board:0 "Mit Blut geschriebene Lehren"
 AOEIW37_GER_operational_lessons_board_desc:0 "Berichte der Feldzüge werden Offizieren aller drei Teilstreitkräfte geöffnet. Gescheiterte Übergänge, leere Tanksäulen und fehlende Luftunterstützung werden ohne Rücksicht auf Uniform oder Rang untersucht."
 AOEIW37_GER_joint_arms_directorate:0 "Stukas über den Panzern"
 AOEIW37_GER_joint_arms_directorate_desc:0 "Luftverbindungstrupps, Panzer, Artillerie und Nachschubkolonnen üben nach derselben Karte. Zusammenarbeit muss am Kartentisch beginnen und den Kontakt mit der Front überstehen."
 AOEIW37_GER_compact_beyond_the_crisis:0 "Nach den Gründern"
 AOEIW37_GER_compact_beyond_the_crisis_desc:0 "Die erste Generation errichtete das Kontinentalsystem durch Krise und Krieg. Ihre Nachfolger müssen Krone, Kammern und abhängige Regierungen an Regeln binden, die ohne persönliche Treue funktionieren."
