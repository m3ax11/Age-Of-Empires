l_german:
 AOEIW14_GER_constitutional_settlement:0 "Der Verfassungsausgleich"
 AOEIW14_GER_constitutional_settlement_desc:0 "Ein schriftlicher Ausgleich bindet Minister, Parlament und Länder an eine gemeinsame föderale Ordnung. Er ist langsamer als ein Dekret, aber viel schwerer rückgängig zu machen."
 AOEIW14_GER_federal_economic_council:0 "Föderaler Wirtschaftsrat"
 AOEIW14_GER_federal_economic_council_desc:0 "Länder, Industrie und Arbeiterschaft koordinieren Investitionen in einem ständigen Rat statt in einem Befehlsministerium."
 AOEIW14_GER_professional_reichswehr:0 "Eine professionelle Reichswehr"
 AOEIW14_GER_professional_reichswehr_desc:0 "Deutschland bevorzugt ein kleineres, unpolitisches und technisch geschultes Heer gegenüber einer politisch mobilisierten Massenarmee."
 AOEIW14_GER_rhineland_air_defence:0 "Luftverteidigung des Rheinlands"
 AOEIW14_GER_rhineland_air_defence_desc:0 "Radar, geschützte Flugplätze und ein einheitlicher Meldedienst sichern den industriellen Westen ohne offensive Doktrin."
 AOEIW14_GER_advanced_equipment_commission:0 "Kommission für moderne Ausrüstung"
 AOEIW14_GER_advanced_equipment_commission_desc:0 "Eine parlamentarische Kommission finanziert moderne Artillerie und Elektronik unter ziviler Aufsicht."
 AOEIW14_GER_reichspakt_conference:0 "Die Reichspaktkonferenz"
 AOEIW14_GER_reichspakt_conference_desc:0 "Das Bündnis muss zwischen strafferer deutscher Führung und einem lockeren föderalen Bund mit ausgehandelten Pflichten wählen."
 AOEIW14_GER_european_settlement:0 "Ein europäischer Ausgleich"
 AOEIW14_GER_european_settlement_desc:0 "Verfassungsstaat im Inneren und ausgehandelte Sicherheit nach außen machen Deutschland wohlhabend und stabil, aber weniger geeignet für leichtfertige Expansion."

 AOEIW14_USA_general_staff_planning:0 "Regierung des Generalstabs"
 AOEIW14_USA_general_staff_planning_desc:0 "Nur ein dauerhaftes Direktorium kann Notfallpläne in ein Regierungssystem verwandeln. Zuerst muss es die nationale Planung ordnen."
 AOEIW14_USA_continental_logistics_board:0 "Kontinentaler Logistikrat"
 AOEIW14_USA_continental_logistics_board_desc:0 "Militäringenieure und Verkehrsplaner erfassen den Kontinent als ein strategisches Versorgungssystem."
 AOEIW14_USA_military_industrial_coordination:0 "Militärisch-industrielle Koordinierung"
 AOEIW14_USA_military_industrial_coordination_desc:0 "Strategische Fabriken erhalten feste Aufträge und Produktionsziele, bezahlt durch höhere zivile Lasten."
 AOEIW14_USA_air_defence_grid:0 "Das Luftverteidigungsnetz"
 AOEIW14_USA_air_defence_grid_desc:0 "Ein kontinentales Netz aus Radar, Beobachtern und Flugplätzen macht Vorwarnzeit zur nationalen Ressource."
 AOEIW14_USA_strategic_air_command:0 "Strategisches Luftkommando"
 AOEIW14_USA_strategic_air_command_desc:0 "Langstreckenluftfahrt wird zu einem eigenständigen Mittel der Abschreckung und des Industriekriegs."
 AOEIW14_USA_national_laboratories:0 "Die Nationallabore"
 AOEIW14_USA_national_laboratories_desc:0 "Zentrale Labore verbinden Universitäten, Ingenieure und militärische Anforderungen, ohne Entdeckungen kostenlos zu gewähren."
 AOEIW14_USA_rocketry_program:0 "Nationales Raketenprogramm"
 AOEIW14_USA_rocketry_program_desc:0 "Gelenkte Forschung beschleunigt die Raketentechnik, doch Wissenschaft und Industrie müssen die Arbeit weiterhin leisten."
 AOEIW14_USA_atomic_energy_commission:0 "Atomenergiekommission"
 AOEIW14_USA_atomic_energy_commission_desc:0 "Eine militärisch-wissenschaftliche Kommission beschleunigt die Kerntheorie; Reaktoren und Waffen müssen dennoch normal erforscht und gebaut werden."
 AOEIW14_USA_national_reactor_program:0 "Nationales Reaktorprogramm"
 AOEIW14_USA_national_reactor_program_desc:0 "Standardentwürfe und bevorzugte Verträge erleichtern künftig Bau und Betrieb von Reaktoren."
 AOEIW14_USA_integrated_war_planning:0 "Integrierte Kriegsplanung"
 AOEIW14_USA_integrated_war_planning_desc:0 "Logistik, Luftmacht, Raketen und Atomforschung werden in einem strategischen System koordiniert."

 AOEIW14_GER_constitutional_opposition:0 "Verfassungsopposition"
 AOEIW14_GER_constitutional_opposition_desc:0 "Offener Widerstand verursacht politische und institutionelle Kosten, bis ein legaler Machtwechsel gelingt."
 AOEIW14_GER_regional_concessions:0 "Zugeständnisse an die Länder"
 AOEIW14_GER_regional_concessions_desc:0 "Die Länder stützen die Reform gegen Kompetenzen, die zentrale Mobilisierung begrenzen und dauernde Verhandlungen verlangen."
 AOEIW14_GER_adenauer_government:0 "Die Regierung Adenauer"
 AOEIW14_GER_adenauer_government_desc:0 "Ein stabiles föderales Kabinett fördert Forschung, Handel und zivile Investitionen, lehnt aber Massenmobilisierung und leichte Aggression ab."
 AOEIW14_GER_air_defence_board:0 "Bundesrat für Luftverteidigung"
 AOEIW14_GER_air_defence_board_desc:0 "Zivilbehörden, Industrie und Luftstreitkräfte koordinieren Radar und Abfangschutz."
 AOEIW14_GER_directed_reichspakt:0 "Geführter Reichspakt"
 AOEIW14_GER_directed_reichspakt_desc:0 "Berlin behält feste strategische Führung und gewinnt Autorität, erzeugt aber Unruhe unter den Partnern."
 AOEIW14_GER_federal_reichspakt:0 "Föderale Europäische Liga"
 AOEIW14_GER_federal_reichspakt_desc:0 "Die Partner erhalten mehr Mitsprache und Handel, während Berlin politische Kraft für Konsens aufwenden muss."
 AOEIW14_POL_autonomy_settlement:0 "Polnischer Autonomieausgleich"
 AOEIW14_POL_autonomy_settlement_desc:0 "Erweiterte Selbstverwaltung macht aus Abhängigkeit eine legitimere Partnerschaft."
 AOEIW14_HOL_constitutional_guarantee:0 "Niederländische Verfassungsgarantie"
 AOEIW14_HOL_constitutional_guarantee_desc:0 "Deutschland garantiert öffentlich die niederländischen Institutionen und die territoriale Sicherheit."
 AOEIW14_FRA_rhine_dialogue:0 "Rheindialog"
 AOEIW14_FRA_rhine_dialogue_desc:0 "Ein ständiger Kanal nach Berlin senkt das Risiko, dass ein Grenzzwischenfall zum Kontinentalkrieg wird."
 AOEIW14_AUS_vienna_consultation:0 "Wiener Konsultation"
 AOEIW14_AUS_vienna_consultation_desc:0 "Regelmäßige Gespräche mit Berlin geben Wien Einfluss auf das sich wandelnde Bündnissystem."
 AOEIW14_USA_economic_emergency:0 "Wirtschaftlicher Notstand"
 AOEIW14_USA_economic_emergency_desc:0 "Kreditausfälle und gebrochene Verträge schädigen Produktion und Vertrauen."
 AOEIW14_USA_political_paralysis:0 "Lähmung der Regierung"
 AOEIW14_USA_political_paralysis_desc:0 "Die Bundesorgane blockieren einander, während sich die Krise verschärft."
 AOEIW14_USA_federal_confrontation:0 "Konfrontation zwischen Bund und Staaten"
 AOEIW14_USA_federal_confrontation_desc:0 "Widersprüchliche Behörden stören Fabriken, Verwaltung und öffentliche Ordnung."
 AOEIW14_USA_temporary_military_administration:0 "Zeitweilige Militärverwaltung"
 AOEIW14_USA_temporary_military_administration_desc:0 "Die Streitkräfte sichern wichtige Dienste mit teuren Notstandsvollmachten und umstrittenem Verfassungsmandat."
 AOEIW14_USA_civilian_restoration:0 "Wiederherstellung der Zivilregierung"
 AOEIW14_USA_civilian_restoration_desc:0 "Die Notstandsvollmachten kehren zu gewählten Institutionen zurück und erneuern Legitimität und normale Verwaltung."
 AOEIW14_USA_permanent_directorate:0 "Dauerhaftes Direktorium"
 AOEIW14_USA_permanent_directorate_desc:0 "Die Notverwaltung wird zum technokratischen Militärstaat: koordiniert und strategisch, aber teuer und verfassungswidrig."
 AOEIW14_USA_continental_logistics:0 "Kontinentales Logistiksystem"
 AOEIW14_USA_continental_logistics_desc:0 "Transport und Versorgung werden als ein nationales Militärnetz geplant."
 AOEIW14_USA_nuclear_coordination:0 "Behörde für Atomkoordinierung"
 AOEIW14_USA_nuclear_coordination_desc:0 "Der Staat beschleunigt Reaktorbau und Spaltstoffproduktion, gewährt aber weder Reaktoren noch Bomben kostenlos."
 AOEIW14_USA_central_planning_board:0 "Zentraler Planungsrat"
 AOEIW14_USA_central_planning_board_desc:0 "Ein einziger Rat plant kohärente Feldzüge auf Kosten politischer Flexibilität."
 AOEIW14_USA_staff_collegium:0 "Kollegium der Vereinigten Stäbe"
 AOEIW14_USA_staff_collegium_desc:0 "Ein kollegiales Stabssystem belohnt Doktrin, Forschung und professionelles Urteil."

 AOEIW14_GER_reichspakt_category:0 "Reform des Reichspakts"
 AOEIW14_GER_offer_polish_autonomy:0 "Polen einen Autonomievertrag anbieten"
 AOEIW14_GER_offer_polish_autonomy_desc:0 "Warschau erhält weitgehende Autonomie und einen legitimeren Platz in der Kontinentalordnung."
 AOEIW14_GER_guarantee_dutch_charter:0 "Die niederländische Charta garantieren"
 AOEIW14_GER_guarantee_dutch_charter_desc:0 "Die Niederlande sollen eine öffentliche deutsche Garantie ihrer Institutionen und Sicherheit annehmen."
 AOEIW14_GER_open_paris_channel:0 "Einen Kanal nach Paris öffnen"
 AOEIW14_GER_open_paris_channel_desc:0 "Direkte Nichtangriffsgespräche mit Frankreich sollen die Gefahr einer Rheinkrise mindern."
 AOEIW14_GER_invite_vienna_consultation:0 "Wien zu Konsultationen einladen"
 AOEIW14_GER_invite_vienna_consultation_desc:0 "Österreich-Ungarn wird zu regelmäßigen Beratungen über Mitteleuropas Zukunft eingeladen."
 AOEIW14_USA_emergency_category:0 "Notstandsmaßnahmen des Bundes"
 AOEIW14_USA_federal_relief_logistics:0 "Bundeshilfen logistisch koordinieren"
 AOEIW14_USA_federal_relief_logistics_desc:0 "Bundesverkehrsämter halten Hilfsgüter gegen unmittelbare Verwaltungskosten in Bewegung."
 AOEIW14_USA_governors_liaison:0 "Verbindung zu den Gouverneuren schaffen"
 AOEIW14_USA_governors_liaison_desc:0 "Ein ständiger Kanal verbindet die Notstandsämter der Staaten mit Washington."
 AOEIW14_USA_congressional_continuity:0 "Kontinuität des Kongresses finanzieren"
 AOEIW14_USA_congressional_continuity_desc:0 "Der Kongress soll auch in der Krise tagen und Notmittel beschließen können."
 AOEIW14_USA_secure_continuity_sites:0 "Kontinuitätsstandorte sichern"
 AOEIW14_USA_secure_continuity_sites_desc:0 "Geschützte Führungs- und Kommunikationsorte werden vorbereitet, ohne dem Heer dauerhaft Macht zu geben."

 aoeiw_phase14_ger.1.t:0 "Das bürgerliche Memorandum"
 aoeiw_phase14_ger.1.d:0 "Kommunalpolitiker, katholische Verbände und Verfassungsjuristen bieten eine gemeinsame Plattform an. Der Hof wird jede öffentliche Unterstützung bemerken."
 aoeiw_phase14_ger.1.a:0 "Die Netzwerke offen unterstützen."
 aoeiw_phase14_ger.1.b:0 "Die Gemeinden sollen leise vorgehen."
 aoeiw_phase14_ger.2.t:0 "Die Reichspaktkonferenz"
 aoeiw_phase14_ger.2.d:0 "Deutschlands Partner verlangen Klarheit: feste Berliner Führung oder eine lockere Liga mit ausgehandelten Pflichten."
 aoeiw_phase14_ger.2.a:0 "Einen geführten Reichspakt bewahren."
 aoeiw_phase14_ger.2.b:0 "Eine Föderale Europäische Liga bilden."
 aoeiw_phase14_ger.3.t:0 "Der polnische Autonomievertrag"
 aoeiw_phase14_ger.3.d:0 "Berlin bietet weitgehende polnische Selbstverwaltung gegen fortgesetzte strategische Partnerschaft."
 aoeiw_phase14_ger.3.a:0 "Den Autonomieausgleich annehmen."
 aoeiw_phase14_ger.3.b:0 "Jede deutsche Aufsicht ablehnen."
 aoeiw_phase14_ger.4.t:0 "Die niederländische Verfassungscharta"
 aoeiw_phase14_ger.4.d:0 "Deutschland bietet als Grundlage eines legitimeren Bündnisses eine öffentliche Garantie unserer Institutionen und Grenzen."
 aoeiw_phase14_ger.4.a:0 "Die Verfassungsgarantie annehmen."
 aoeiw_phase14_ger.4.b:0 "Wir benötigen keine deutsche Garantie."
 aoeiw_phase14_ger.5.t:0 "Ein Kanal über den Rhein"
 aoeiw_phase14_ger.5.d:0 "Adenauers Regierung schlägt direkte Gespräche und einen Nichtangriffspakt vor, damit eine Grenzkrise nicht eskaliert."
 aoeiw_phase14_ger.5.a:0 "Den Kanal öffnen."
 aoeiw_phase14_ger.5.b:0 "Berlin hat unser Vertrauen nicht verdient."
 aoeiw_phase14_ger.6.t:0 "Konsultationen mit Berlin"
 aoeiw_phase14_ger.6.d:0 "Deutschland lädt Wien zu regelmäßigen Beratungen über Reichspakt und mitteleuropäisches Gleichgewicht ein."
 aoeiw_phase14_ger.6.a:0 "Wien nimmt seinen Platz ein."
 aoeiw_phase14_ger.6.b:0 "Unsere Handlungsfreiheit bewahren."

 aoeiw_phase14_usa.1.t:0 "Die Frage der Nothilfe"
 aoeiw_phase14_usa.1.d:0 "Die ersten Notmittel reichen nicht für jede Bank, Bahn und Gemeinde. Die Regierung muss ein Zeichen setzen."
 aoeiw_phase14_usa.1.a:0 "Die Hilfe hat Vorrang."
 aoeiw_phase14_usa.1.b:0 "Bundeskredit durch Sparpolitik schützen."
 aoeiw_phase14_usa.2.t:0 "Die Gouverneure stellen Washington zur Rede"
 aoeiw_phase14_usa.2.d:0 "Mehrere Gouverneure verweigern verfassungswidrige und unpraktische Bundesbefehle. Verhandlungen kaufen Zusammenarbeit; Zwang zeigt, wer noch befiehlt."
 aoeiw_phase14_usa.2.a:0 "Einen Staatenpakt aushandeln."
 aoeiw_phase14_usa.2.b:0 "Bundesbefehle müssen gelten."
 aoeiw_phase14_usa.3.t:0 "Das Verfassungsultimatum"
 aoeiw_phase14_usa.3.d:0 "Die zivilen Organe haben eine letzte Gelegenheit, Notstandsmacht zu ordnen, bevor die Kontinuitätspläne an das Militär fallen."
 aoeiw_phase14_usa.3.a:0 "Der Kongress soll die Übertragung genehmigen."
 aoeiw_phase14_usa.3.b:0 "Exekutive und Heer handeln."
 aoeiw_phase14_usa.4.t:0 "Das Mandat der Verwaltung"
 aoeiw_phase14_usa.4.d:0 "Lebenswichtige Dienste arbeiten wieder. Nun muss die Notverwaltung ihr Versprechen halten oder die Notstandsordnung verewigen."
 aoeiw_phase14_usa.4.a:0 "Die Verfassungsrepublik wiederherstellen."
 aoeiw_phase14_usa.4.b:0 "Eisenhowers Direktorium verewigen."
 aoeiw_phase14_usa.5.t:0 "Wie das Direktorium planen wird"
 aoeiw_phase14_usa.5.d:0 "Die neue Ordnung benötigt dauerhafte Planungsgrundsätze: zentrale Geschlossenheit oder unabhängiges militärisches Fachurteil."
 aoeiw_phase14_usa.5.a:0 "Einen zentralen Planungsrat schaffen."
 aoeiw_phase14_usa.5.b:0 "Ein Kollegium der Vereinigten Stäbe bilden."

