l_german:
 aoeiw10_story.1.t:0 "Die Delegationen versammeln sich in Wien"
 aoeiw10_story.1.d:0 "Der politische Ausgleich hat die Frage beendet, wer regiert, nicht aber, wie die Kronländer gehört werden. Tschechische, kroatische, ungarische und österreichische Delegationen treffen mit widersprüchlichen Eingaben in Wien ein. Der Hof kann sie als Partner eines Donaubundes anerkennen oder den Ministerien ein einheitliches Reichsprogramm befehlen."
 aoeiw10_story.1.a:0 "Den Kronländern eine föderale Stimme geben."
 aoeiw10_story.1.b:0 "Wien muss eine einheitliche Weisung erteilen."
 aoeiw10_story.2.t:0 "Der Preis des Donaubundes"
 aoeiw10_story.2.d:0 "Die Delegierten stimmen gemeinsamer Verteidigung und Finanzierung zu, verlangen jedoch schriftliche Garantien für Provinzverwaltung und Sprachrechte. Die Ratifizierung verbraucht politisches Kapital; eine Verzögerung wahrt Handlungsfreiheit, öffnet aber jeden Streit erneut."
 aoeiw10_story.2.a:0 "Die Garantien ratifizieren."
 aoeiw10_story.2.b:0 "Die Klauseln an die Ministerien zurückgeben."
 aoeiw10_story.3.t:0 "Die Ministerien widersetzen sich der Weisung"
 aoeiw10_story.3.d:0 "Wiens Weisung erreicht die Provinzhauptstädte, wo Beamte warnen, dass Erlasse ohne örtliche Mitarbeit Papierbefehle bleiben. Der Hof kann einen durchsetzungsfähigen Reichsdienst aufbauen oder begrenzte Vetorechte einräumen."
 aoeiw10_story.3.a:0 "Einen kaiserlichen Verwaltungsdienst aufbauen."
 aoeiw10_story.3.b:0 "Eng begrenzte Vetorechte zugestehen."

 AOEIW10_AUS_federal_compact:0 "Der föderale Donaubund"
 AOEIW10_AUS_federal_compact_desc:0 "Provinzgarantien stabilisieren die Monarchie und erleichtern öffentliche Vorhaben, doch jede große Initiative erfordert nun Verhandlungen zwischen den Kronländern."
 AOEIW10_AUS_central_service:0 "Der Wiener Zentraldienst"
 AOEIW10_AUS_central_service_desc:0 "Eine professionelle Reichsverwaltung gibt Wien mehr Kontrolle über Einnahmen und Politik; Unmut in den Provinzen bleibt der Preis der Geschwindigkeit."

 aoeiw10_story.10.t:0 "Die Hochöfen von Seraing verstummen"
 aoeiw10_story.10.d:0 "Ein Lohnstreit in Seraing greift auf die Eisenbahnen und das Kohlerevier über. Gewerkschaftsausschüsse halten wichtige Züge in Betrieb, wenn die Regierung Arbeitgeber und Arbeiter zusammenruft; Industrielle verlangen dagegen Notstandsvollmachten."
 aoeiw10_story.10.a:0 "Eine nationale Arbeitskonferenz einberufen."
 aoeiw10_story.10.b:0 "Die Eisenbahnen einem Industriedirektorium unterstellen."
 aoeiw10_story.11.t:0 "Die Achtstundencharta"
 aoeiw10_story.11.d:0 "Die Konferenz legt eine Charta vor, die kürzere Schichten und Schiedsstellen mit einem Verzicht auf politische Streiks verbindet. Arbeitgeber nennen die Kosten übermäßig; gemäßigte Gewerkschaften warnen vor einer Radikalisierung bei Ablehnung."
 aoeiw10_story.11.a:0 "Den Sozialpakt unterzeichnen."
 aoeiw10_story.11.b:0 "Die Vereinbarung auf Lohnschlichtung begrenzen."
 aoeiw10_story.12.t:0 "Ordnung auf den Eisenbahnen"
 aoeiw10_story.12.d:0 "Truppen und Werkschutz öffnen die Hauptstrecken wieder, doch das Direktorium verlangt dauerhafte Macht über Einstellungen, Frachtvorrang und Fabrikdisziplin. Kommunalpolitiker bieten örtliche Verhandlungen als zivile Alternative an."
 aoeiw10_story.12.a:0 "Die Vollmachten des Direktoriums bestätigen."
 aoeiw10_story.12.b:0 "Die Verhandlungen an die Gemeinden zurückgeben."

 AOEIW10_BEL_social_compact:0 "Der belgische Sozialpakt"
 AOEIW10_BEL_social_compact_desc:0 "Verbindliche Schlichtung und Arbeitsgarantien stabilisieren das Land und fördern langfristige Investitionen, begrenzen aber die unmittelbare Produktion."
 AOEIW10_BEL_industrial_discipline:0 "Das Industriedirektorium"
 AOEIW10_BEL_industrial_discipline_desc:0 "Zentrale Kontrolle über Eisenbahnen und Schwerindustrie erhöht die Produktion, während die erzwungene Disziplin politische Verbitterung vertieft."

 aoeiw10_story.20.t:0 "Das Wiederaufbaubuch"
 aoeiw10_story.20.d:0 "Der erste zusammengefasste Wiederaufbauhaushalt weist Mittel aus, die das Königsschloss jenseits der vom Sejm bewilligten Summen zurückhält. Abgeordnete verlangen öffentliche Prüfung und ministerielle Unterschriften; der Hof verteidigt eine geschützte Reserve."
 aoeiw10_story.20.a:0 "Das Buch dem Sejm vorlegen."
 aoeiw10_story.20.b:0 "Die Reserve der Krone schützen."
 aoeiw10_story.21.t:0 "Kredit für die Provinzen"
 aoeiw10_story.21.d:0 "Die Prüfung findet keinen Diebstahl, zeigt aber, wie Warschauer Banken Wiederaufbaumittel an Provinzgenossenschaften vorbeilenken. Der Sejm schlägt ein nationales Kreditgesetz mit öffentlichen Konten und regionalen Quoten vor."
 aoeiw10_story.21.a:0 "Das nationale Kreditgesetz verabschieden."
 aoeiw10_story.21.b:0 "Die Ergebnisse veröffentlichen und die Prüfung beenden."
 aoeiw10_story.22.t:0 "Die Generäle fordern die Reserve"
 aoeiw10_story.22.d:0 "Der Generalstab legt ein geheimes Programm aus Depots, Anschlussgleisen und Munitionsverträgen vor. Der Sejm akzeptiert einen gemeinsamen Haushaltsrat; der Hof kann auch die Geheimhaltung bewahren."
 aoeiw10_story.22.a:0 "Die königliche Schatzkammer bestätigen."
 aoeiw10_story.22.b:0 "Den Sejm in einen gemeinsamen Rat aufnehmen."

 AOEIW10_POL_parliamentary_credit:0 "Das nationale Kreditgesetz"
 AOEIW10_POL_parliamentary_credit_desc:0 "Öffentliche Konten und regionaler Kredit stabilisieren den politischen Ausgleich und beschleunigen die zivile Entwicklung, erhöhen aber den Verwaltungsaufwand."
 AOEIW10_POL_royal_treasury:0 "Die königliche Wiederaufbaukasse"
 AOEIW10_POL_royal_treasury_desc:0 "Eine geschützte Reserve erlaubt der Krone schnelle Rüstungsfinanzierung, während die Geheimhaltung den Streit um die Verfassungskontrolle fortsetzt."
