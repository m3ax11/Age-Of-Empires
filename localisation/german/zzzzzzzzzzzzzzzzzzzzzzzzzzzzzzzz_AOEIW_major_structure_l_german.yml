l_german:
 AOEIW_STRUCT_GER_federal_laboratories:0 "Föderale Forschungsstiftungen"
 AOEIW_STRUCT_GER_federal_laboratories_desc:0 "Die föderale Einigung finanziert Hochschullabore. Gewährt einen Industrieforschungsbonus von 50%."
 AOEIW_STRUCT_GER_federal_workshops:0 "Werkstätten der Bundesstaaten"
 AOEIW_STRUCT_GER_federal_workshops_desc:0 "Baut eine Zivilfabrik in einem eigenen kontrollierten Kernstaat. Eine optionale föderale Investition."
 AOEIW_STRUCT_GER_continental_rail_contracts:0 "Kontinentale Versorgungsverträge"
 AOEIW_STRUCT_GER_continental_rail_contracts_desc:0 "Die Kontinentalstrategie benötigt eine Transportreserve. Gewährt 100 Züge; keine Annexion von Verbündeten."
 AOEIW_STRUCT_GER_continental_readiness:0 "Die roten Mappen des Generalstabs"
 AOEIW_STRUCT_GER_continental_readiness_desc:0 "Bahnreserven, Mobilmachungsbezirke und Grenzpläne kommen auf denselben Tisch. Die roten Mappen müssen einen Krieg beschreiben, den Deutschland versorgen kann."
 AOEIW_STRUCT_GER_oceanic_escorts:0 "Geleitschutz für die Reichsverbindungen"
 AOEIW_STRUCT_GER_oceanic_escorts_desc:0 "Finanziert die Transportreserve des Überseehandels. Gewährt 40 Konvois."
 AOEIW_STRUCT_GER_overseas_stations:0 "Koordination der Überseestationen"
 AOEIW_STRUCT_GER_overseas_stations_desc:0 "Bereitet die Marine auf Dauereinsätze vor. Gewährt 25 Marineerfahrung und 50% Bonus auf Marineausrüstung."
 AOEIW_STRUCT_GER_civilian_procurement:0 "Fabriken vor Festungen"
 AOEIW_STRUCT_GER_civilian_procurement_desc:0 "Kommunale Aufträge und zivile Maschinenwerke erhalten die nächste Bewilligung. Die Opposition nennt es Zaghaftigkeit; das Kabinett nennt es eine Wirtschaft, die es zu verteidigen lohnt."
 AOEIW_STRUCT_GER_emergency_procurement:0 "Notbeschaffung für die Landesverteidigung"
 AOEIW_STRUCT_GER_emergency_procurement_desc:0 "Finanziert eine Militärfabrik. Schließt das zivile Beschaffungsprogramm aus."
 AOEIW_STRUCT_GER_DEPTH_lands_treasury:0 "Bayern präsentiert die Rechnung"
 AOEIW_STRUCT_GER_DEPTH_lands_treasury_desc:0 "München verweigert ein weiteres Berliner Programm auf Kosten der Landeskassen. Sachsen und Württemberg fordern ebenfalls feste Anteile an Einnahmen und Investitionen."
 AOEIW_STRUCT_GER_DEPTH_provincial_credit:0 "Kreditämter der Provinzen"
 AOEIW_STRUCT_GER_DEPTH_provincial_credit_desc:0 "Ein dauerhaftes Register macht aus dem Finanzkompromiss verbindliche Verträge. Zuerst muss das Kabinett den Anleihenstreit entscheiden.\n\nEntwickelt Bundesinvestitionsamt auf Stufe 2/3. Gesamt: +5% Zivilfabrikbau; +0.03 politische Macht pro Tag. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_crown_audit:0 "Die Kronrechnung veröffentlichen"
 AOEIW_STRUCT_GER_DEPTH_crown_audit_desc:0 "Trennt Hofausgaben von Bahn- und Schulbewilligungen; der Reichstag erhält einen prüfbaren Haushalt.\n\nEntwickelt Bundesinvestitionsamt auf Stufe 3/3. Gesamt: +7% Zivilfabrikbau; +0.06 politische Macht pro Tag. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_social_bargain:0 "Der Berliner Sozialkompromiss"
 AOEIW_STRUCT_GER_DEPTH_social_bargain_desc:0 "Industrieller Frieden verlangt eine Wahl zwischen gesetzlicher Vertretung und beitragsfinanzierter Absicherung."
 AOEIW_STRUCT_GER_DEPTH_works_councils:0 "Betriebsräte gesetzlich verankern"
 AOEIW_STRUCT_GER_DEPTH_works_councils_desc:0 "Gebt gewählten Betriebsausschüssen eine feste Stimme. Schließt den vorrangigen Rentenkompromiss aus."
 AOEIW_STRUCT_GER_DEPTH_pension_funds:0 "Die Rentenkassen absichern"
 AOEIW_STRUCT_GER_DEPTH_pension_funds_desc:0 "Schützt Veteranen und Arbeiterfamilien durch finanzierte Garantien statt gesetzlicher Betriebsräte."
 AOEIW_STRUCT_GER_DEPTH_industrial_peace:0 "Stinnes–Legien erneuern"
 AOEIW_STRUCT_GER_DEPTH_industrial_peace_desc:0 "Die Arbeitgeber erkennen die Gewerkschaften an, die Gewerkschaften halten die Hochöfen in Betrieb. Achtstundentag und Tarifvertrag sind der Preis verlässlicher Rüstungsaufträge."
 AOEIW_STRUCT_GER_DEPTH_colonial_census:0 "Wer verwaltet Mittelafrika?"
 AOEIW_STRUCT_GER_DEPTH_colonial_census_desc:0 "Flaggen reparieren keine Lokomotive und entladen keinen Tropenhafen. Der Kolonialdienst wirbt Dolmetscher, Mechaniker, Ärzte und Hafenarbeiter für die Überseegebiete an."
 AOEIW_STRUCT_GER_DEPTH_colonial_schools:0 "Schulen für Überseeingenieure"
 AOEIW_STRUCT_GER_DEPTH_colonial_schools_desc:0 "Bildet Ingenieure aus, die Küstenanlagen fern deutscher Werkstätten betreiben können.\n\nEntwickelt Überseedienststationen auf Stufe 1/3. Gesamt: +3% Schiffsreparaturtempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_marine_post:0 "Die kaiserliche Seepost"
 AOEIW_STRUCT_GER_DEPTH_marine_post_desc:0 "Regelmäßige Post- und Frachtdienste ersetzen improvisierten Kolonialtransport. Gewährt 25 Konvois.\n\nEntwickelt Überseedienststationen auf Stufe 2/3. Gesamt: +5% Schiffsreparaturtempo; -3% Marine-Treibstoffverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_colonial_rescue:0 "Übersee-Reparaturstationen"
 AOEIW_STRUCT_GER_DEPTH_colonial_rescue_desc:0 "Verteilt Reparaturtrupps und Ersatzteile entlang der Seewege, ohne ein anderes Land zu annektieren.\n\nEntwickelt Überseedienststationen auf Stufe 3/3. Gesamt: +8% Schiffsreparaturtempo; -5% Marine-Treibstoffverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_constitutional_court:0 "Ein Bundesverfassungsgericht"
 AOEIW_STRUCT_GER_DEPTH_constitutional_court_desc:0 "Adenauer braucht einen rechtlichen Schiedsrichter zwischen Ländern und Reichskabinett, keinen weiteren Noterlass.\n\nEntwickelt Kontinuität der Zivilverwaltung auf Stufe 1/3. Gesamt: +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_press_statute:0 "Das Presseverantwortungsgesetz"
 AOEIW_STRUCT_GER_DEPTH_press_statute_desc:0 "Unabhängige Zeitungen erhalten Rechtsschutz; das Kabinett gibt einen Teil seiner Kontrolle über die politische Debatte ab.\n\nEntwickelt Kontinuität der Zivilverwaltung auf Stufe 2/3. Gesamt: +3% Stabilität; +0.04 politische Macht pro Tag. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_budget_committee:0 "Parlamentarische Beschaffungsanhörungen"
 AOEIW_STRUCT_GER_DEPTH_budget_committee_desc:0 "Offiziere müssen Ausschreibungen vor dem Haushaltsausschuss erklären. Standardverträge erleichtern technische Versuche."
 AOEIW_STRUCT_GER_DEPTH_regional_housing:0 "Wohnungen neben den Krupp-Werken"
 AOEIW_STRUCT_GER_DEPTH_regional_housing_desc:0 "Facharbeiterfamilien verlassen die überfüllten Industrieviertel. Neue Siedlungen bei den Ruhrwerken halten Schlosser und Maschinisten nahe an ihren Schichten."
 AOEIW_STRUCT_GER_DEPTH_civic_reserves:0 "Zivile Schutzverbände"
 AOEIW_STRUCT_GER_DEPTH_civic_reserves_desc:0 "Gemeinden bilden Rettungs- und Versorgungskräfte unter ziviler Aufsicht aus."
 AOEIW_STRUCT_GER_DEPTH_legal_continuity:0 "Kontinuität der Zivilregierung"
 AOEIW_STRUCT_GER_DEPTH_legal_continuity_desc:0 "Bereitet rechtmäßige Nachfolge und regionale Notverwaltungen vor einer nationalen Krise vor.\n\nEntwickelt Kontinuität der Zivilverwaltung auf Stufe 3/3. Gesamt: +4% Stabilität; +0.08 politische Macht pro Tag; +3% Kapitulationsgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_rent_commission:0 "Mietenstopp im Ruhrgebiet!"
 AOEIW_STRUCT_GER_DEPTH_rent_commission_desc:0 "Hinter den Werkstoren häufen sich Rückstände, während Vermieter vom Arbeiterzuzug profitieren. Die Arbeiterparteien verlangen einen sofortigen Mietenstopp in den Industriestädten."
 AOEIW_STRUCT_GER_DEPTH_shopfloor_delegates:0 "Betriebsdelegierte wählen"
 AOEIW_STRUCT_GER_DEPTH_shopfloor_delegates_desc:0 "Gewählte Delegierte sammeln betriebliche Beschwerden, bevor daraus konkurrierende Revolutionsprogramme entstehen.\n\nEntwickelt Betriebliche Mitbestimmung auf Stufe 2/3. Gesamt: +5% Produktionseffizienzzuwachs; +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_technical_cadres:0 "Lehrlinge für Borsig und Krupp"
 AOEIW_STRUCT_GER_DEPTH_technical_cadres_desc:0 "Die Streiks brachten Organisatoren hervor, aber nicht genug Werkzeugmacher. Technische Schulen vermitteln Lehrlinge an Lokomotiv-, Stahl- und Rüstungswerke."
 AOEIW_STRUCT_GER_DEPTH_council_autonomy:0 "Jede Fabrik ihr eigener Rat"
 AOEIW_STRUCT_GER_DEPTH_council_autonomy_desc:0 "Werkstattdelegierte bestimmen Schichten und Produktionsänderungen dort, wo gearbeitet wird. Berlin darf Leistung verlangen, aber keine neue Industriebürokratie einsetzen."
 AOEIW_STRUCT_GER_DEPTH_quota_directorate:0 "Berlin setzt die Quoten"
 AOEIW_STRUCT_GER_DEPTH_quota_directorate_desc:0 "Örtliche Experimente enden am Werkstor. Der Nationalplan verteilt Stahl, Arbeitskräfte und Lieferziele aus Berlin; jeder Rat haftet für das Ergebnis."
 AOEIW_STRUCT_GER_DEPTH_workers_accounts:0 "Die Produktionsbücher öffnen"
 AOEIW_STRUCT_GER_DEPTH_workers_accounts_desc:0 "Macht das gewählte Industriesystem für den Revolutionskongress überprüfbar.\n\nEntwickelt Betriebliche Mitbestimmung auf Stufe 3/3. Gesamt: +8% Produktionseffizienzzuwachs; +3% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_rearmament_ledger:0 "Wer bezahlt die Aufrüstung?"
 AOEIW_STRUCT_GER_DEPTH_rearmament_ledger_desc:0 "Die Generäle haben ihre Bestellungen vorgelegt, das Schatzamt seine Warnung. Das Kabinett muss Steuern, Kredite und Rüstungsverträge auf dieselbe Seite bringen."
 AOEIW_STRUCT_GER_DEPTH_machine_contracts:0 "Werkzeugmaschinenverträge"
 AOEIW_STRUCT_GER_DEPTH_machine_contracts_desc:0 "Einheitliche Werkzeugmaschinen zählen mehr als konkurrierende Prestigeaufträge.\n\nEntwickelt Rüstungsvertragsamt auf Stufe 2/3. Gesamt: +4% Militärfabrikausstoß; +3% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_freight_priority:0 "Freie Fahrt für die Mobilmachung"
 AOEIW_STRUCT_GER_DEPTH_freight_priority_desc:0 "Personenzüge weichen Munition, Werkstattvorräten und Heeresdepots. Die Reichsbahn erhält die Wagen, um diese Strecken offenzuhalten."
 AOEIW_STRUCT_GER_DEPTH_exchange_board:0 "Reichsmark gegen Öl"
 AOEIW_STRUCT_GER_DEPTH_exchange_board_desc:0 "Eingeführtes Öl und Erz zehren die Devisenreserven auf. Auslandskäufe werden rationiert, während Chemiker und Industrie heimische Ersatzstoffe entwickeln."
 AOEIW_STRUCT_GER_DEPTH_synthetic_trials:0 "Versuche mit synthetischem Treibstoff"
 AOEIW_STRUCT_GER_DEPTH_synthetic_trials_desc:0 "Versuchsverfahren schaffen eine Übungsreserve, lösen aber nicht dauerhaft die Ölabhängigkeit."
 AOEIW_STRUCT_GER_DEPTH_staff_signals:0 "Eine Frequenz für jedes Korps"
 AOEIW_STRUCT_GER_DEPTH_staff_signals_desc:0 "Kein Heer kann manövrieren, wenn Nachbarverbände nicht miteinander sprechen können. Gemeinsame Übungen decken unvereinbare Geräte auf und schaffen einen einheitlichen Funkplan."
 AOEIW_STRUCT_GER_DEPTH_fuel_reserve:0 "Treibstoff für sechzig Tage"
 AOEIW_STRUCT_GER_DEPTH_fuel_reserve_desc:0 "Mobilmachungspläne werden an gefüllten Tanks statt optimistischen Prognosen gemessen. Verteilte Depots müssen genug Treibstoff für die ersten Kriegswochen lagern."
 AOEIW_STRUCT_GER_DEPTH_maintenance_columns:0 "Motorisierte Instandsetzungskolonnen"
 AOEIW_STRUCT_GER_DEPTH_maintenance_columns_desc:0 "Rüstet mobile Werkstätten vor längeren Operationen aus. Gewährt 120 Lastwagen und 100 Unterstützungsausrüstung.\n\nEntwickelt Bewegliche Heeresdienste auf Stufe 3/3. Gesamt: +15% Planungstempo; -6% Heeres-Treibstoffverbrauch; -5% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Einen Bewegungskrieg vorbereiten frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_GER_DEPTH_ruhr_water:0 "Wasser für Kohle und Stahl"
 AOEIW_STRUCT_GER_DEPTH_ruhr_water_desc:0 "Kohlenwäschen, Kokereien und Hochöfen beanspruchen dasselbe überlastete Netz. Die Ruhrstädte finanzieren Leitungen und Pumpwerke für die Produktion."
 AOEIW_STRUCT_GER_DEPTH_ruhr_contract:0 "Der rheinische Werksvertrag"
 AOEIW_STRUCT_GER_DEPTH_ruhr_contract_desc:0 "Schaltet in den Entscheidungen ein bezahltes 90-Tage-Industrieprojekt im Rheinland frei."
 AOEIW_STRUCT_GER_DEPTH_apprentice_exchanges:0 "Der Ingenieur-Lehrlingsaustausch"
 AOEIW_STRUCT_GER_DEPTH_apprentice_exchanges_desc:0 "Tauscht Lehrlinge zwischen regionalen Werkstätten und Forschungsinstituten aus.\n\nEntwickelt Normen der Präzisionsindustrie auf Stufe 1/3. Gesamt: +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_metrology:0 "Eine gemeinsame Messnorm"
 AOEIW_STRUCT_GER_DEPTH_metrology_desc:0 "Granaten und Motorteile müssen auch nach einem Lieferantenwechsel passen.\n\nEntwickelt Normen der Präzisionsindustrie auf Stufe 2/3. Gesamt: +5% Produktionseffizienzzuwachs; +3% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_diesel_lab:0 "Das Dresdner Diesellabor"
 AOEIW_STRUCT_GER_DEPTH_diesel_lab_desc:0 "Prüfstände machen aus Beschaffungszeichnungen dauerbelastbare Motoren.\n\nEntwickelt Normen der Präzisionsindustrie auf Stufe 3/3. Gesamt: +7% Produktionseffizienzzuwachs; +5% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_steel_reserve:0 "Die schlesische Stahlreserve"
 AOEIW_STRUCT_GER_DEPTH_steel_reserve_desc:0 "Schaltet ein 120-Tage-Arsenalprojekt in Schlesien frei, das die Sicherung des Industriebezirks erfordert."
 AOEIW_STRUCT_GER_DEPTH_arsenal_inspection:0 "Die Arsenalinspektion"
 AOEIW_STRUCT_GER_DEPTH_arsenal_inspection_desc:0 "Unabhängige Prüfer vergleichen Serienwaffen mit den vom Heer akzeptierten Prototypen.\n\nSchaltet das finanzierte Programm Vorrangschichten der Arsenale frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_GER_DEPTH_ruhr_deliveries:0 "Die ersten Rheinland-Lieferungen"
 AOEIW_STRUCT_GER_DEPTH_ruhr_deliveries_desc:0 "Die fertigen Werke gehen in den Regelbetrieb. Erfordert den Abschluss des Rheinland-Projekts, nicht nur des Fokus.\n\nSchaltet das finanzierte Programm Regionale Bauaufträge frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_GER_DEPTH_field_repair:0 "Instandsetzungsparks der Divisionen"
 AOEIW_STRUCT_GER_DEPTH_field_repair_desc:0 "Bündelt Werkzeug und Bergungstrupps hinter den Divisionen. Gewährt 150 Unterstützungsausrüstung.\n\nEntwickelt Feldersatzdienst auf Stufe 1/2. Gesamt: +4% Heeres-Organisationserholung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_GER_DEPTH_replacement_school:0 "Die Ersatzoffiziersschule"
 AOEIW_STRUCT_GER_DEPTH_replacement_school_desc:0 "Die Ausbildung von Ersatzoffizieren verhindert das Ausdünnen der Führung in einem langen Krieg.\n\nEntwickelt Feldersatzdienst auf Stufe 2/2. Gesamt: +7% Heeres-Organisationserholung; -5% Erfahrungsverlust. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Die Front ablösen und instand setzen frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_GER_DEPTH_convoy_school:0 "Die Geleitschutzschule"
 AOEIW_STRUCT_GER_DEPTH_convoy_school_desc:0 "Vermittelt Handelsschiffkapitänen und Geleitkommandanten gemeinsame Verfahren.\n\nEntwickelt Handelsgeleitdienst auf Stufe 1/2. Gesamt: +4% Marinekoordination. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Rotation der Handelsgeleite frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_GER_DEPTH_naval_fuel:0 "Der Wilhelmshavener Treibstoffdienst"
 AOEIW_STRUCT_GER_DEPTH_naval_fuel_desc:0 "Schafft eine begrenzte Treibstoffreserve für die Flotte statt ein weiteres Schlachtgeschwader anzukündigen.\n\nEntwickelt Handelsgeleitdienst auf Stufe 2/2. Gesamt: +7% Marinekoordination; -4% Marine-Treibstoffverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Werftüberholung der Flotte frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_crown_arsenals:0 "Die Kronarsenalverträge"
 AOEIW_STRUCT_SOV_crown_arsenals_desc:0 "Die reformierte Autokratie vergibt Daueraufträge. Baut eine Militärfabrik in einem kontrollierten Kernstaat."
 AOEIW_STRUCT_SOV_imperial_reserve:0 "Eine kaiserliche Transportreserve"
 AOEIW_STRUCT_SOV_imperial_reserve_desc:0 "Die Mobilisierung muss die Entfernungen des Reiches überwinden. Gewährt 120 Züge."
 AOEIW_STRUCT_SOV_zemstvo_credit:0 "Wiederaufbaukredite der Semstwos"
 AOEIW_STRUCT_SOV_zemstvo_credit_desc:0 "Lokale Kredite finanzieren eine Zivilfabrik. Alternative zu zentralen Industriebewilligungen."
 AOEIW_STRUCT_SOV_duma_appropriations:0 "Industriebewilligungen der Duma"
 AOEIW_STRUCT_SOV_duma_appropriations_desc:0 "Das Parlament finanziert eine Militärfabrik. Schließt lokal verwaltete Wiederaufbaukredite aus."
 AOEIW_STRUCT_SOV_provincial_universities:0 "Universitäten der Provinzen"
 AOEIW_STRUCT_SOV_provincial_universities_desc:0 "Technische Bildung erreicht die Provinzen. Gewährt einen Industrieforschungsbonus von 50%."
 AOEIW_STRUCT_SOV_federal_compact:0 "Den Provinzialpakt ratifizieren"
 AOEIW_STRUCT_SOV_federal_compact_desc:0 "Die Charta verbindet lokale Investitionen mit Landesverteidigung. Gewährt 3% Stabilität und 20 Kommandopunkte."
 AOEIW_STRUCT_SOV_stavka_records:0 "Die Mobilisierungsregister"
 AOEIW_STRUCT_SOV_stavka_records_desc:0 "Gleicht Provinz- und Armeeregister ab. Gewährt 20 Armeeerfahrung und 50% Bonus auf Unterstützungstechnologie."
 AOEIW_STRUCT_SOV_stavka_mobilisation:0 "Mobilisierungsübungen der Stawka"
 AOEIW_STRUCT_SOV_stavka_mobilisation_desc:0 "Erprobt die Mobilisierung vor dem Krieg. Gewährt 20 Kommandopunkte und 3% Kriegsunterstützung."
 AOEIW_STRUCT_SOV_DEPTH_governors_harvest:0 "Die Provinzgouverneure einbestellen"
 AOEIW_STRUCT_SOV_DEPTH_governors_harvest_desc:0 "Die Krone braucht belastbare Ernte- und Rekrutierungszahlen, bevor sie nationale Erneuerung verspricht."
 AOEIW_STRUCT_SOV_DEPTH_land_register:0 "Das kaiserliche Landregister"
 AOEIW_STRUCT_SOV_DEPTH_land_register_desc:0 "Gebt der gewählten ländlichen Ordnung eine Verwaltungsgrundlage. Erfordert die Entscheidung im Erntestreit.\n\nEntwickelt Provinziale Landwirtschaftsverträge auf Stufe 1/3. Gesamt: +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_rural_contracts:0 "Verträge mit den Landgenossenschaften"
 AOEIW_STRUCT_SOV_DEPTH_rural_contracts_desc:0 "Vereinbart Lieferpläne statt in jedem verspäteten Waggon eine politische Verschwörung zu sehen.\n\nEntwickelt Provinziale Landwirtschaftsverträge auf Stufe 2/3. Gesamt: +3% Stabilität; +3% Faktor der rekrutierbaren Bevölkerung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_provincial_inspectors:0 "Die Provinzämter prüfen"
 AOEIW_STRUCT_SOV_DEPTH_provincial_inspectors_desc:0 "Unabhängige Inspektoren vergleichen Provinzberichte mit tatsächlichen Depotbeständen."
 AOEIW_STRUCT_SOV_DEPTH_recruitment_levies:0 "Die Rekrutierungsumlagen überarbeiten"
 AOEIW_STRUCT_SOV_DEPTH_recruitment_levies_desc:0 "Nicht immer dieselben Dörfer können jede Umlage tragen. Verbreitert das Register vor der nächsten Einberufung."
 AOEIW_STRUCT_SOV_DEPTH_cadastre_school:0 "Die Katasterlehrgänge der Provinzen"
 AOEIW_STRUCT_SOV_DEPTH_cadastre_school_desc:0 "Bildet Vermesser und Schreiber aus, die falsche Berichte prüfen, ohne die Gouvernementsverwaltung lahmzulegen."
 AOEIW_STRUCT_SOV_DEPTH_rural_depots:0 "Ländliche Mobilisierungsdepots"
 AOEIW_STRUCT_SOV_DEPTH_rural_depots_desc:0 "Lagert begrenzte Ausrüstungsreserven nahe den Rekrutierungsbezirken. Gewährt 500 Infanteriewaffen.\n\nEntwickelt Provinziale Landwirtschaftsverträge auf Stufe 3/3. Gesamt: +4% Stabilität; +5% Faktor der rekrutierbaren Bevölkerung; -3% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_zemstvo_petitions:0 "Die Eingaben der Semstwos"
 AOEIW_STRUCT_SOV_DEPTH_zemstvo_petitions_desc:0 "Provinzvertreter verlangen Schulen, Straßen und Grenzen willkürlicher Verwaltung.\n\nEntwickelt Öffentliche Dienste der Semstwa auf Stufe 1/3. Gesamt: +0.03 politische Macht pro Tag. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_provincial_juries:0 "Die Provinzgeschworenen einsetzen"
 AOEIW_STRUCT_SOV_DEPTH_provincial_juries_desc:0 "Lokale Rechtsprechung gibt der geplanten Charta Institutionen, die Bürger tatsächlich nutzen können.\n\nEntwickelt Öffentliche Dienste der Semstwa auf Stufe 2/3. Gesamt: +0.06 politische Macht pro Tag; +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_village_census:0 "Die dörfliche Haushaltserhebung"
 AOEIW_STRUCT_SOV_DEPTH_village_census_desc:0 "Erfasst Haushalte und medizinischen Bedarf vor der Verteilung von Wiederaufbaumitteln.\n\nEntwickelt Öffentliche Dienste der Semstwa auf Stufe 3/3. Gesamt: +0.09 politische Macht pro Tag; +3% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_rail_petitions:0 "Die Eisenbahneingaben anhören"
 AOEIW_STRUCT_SOV_DEPTH_rail_petitions_desc:0 "Provinzdelegierte benennen die unterbrochenen Verbindungen zwischen Dörfern und Märkten."
 AOEIW_STRUCT_SOV_DEPTH_local_credit:0 "Die Kreditgenossenschaften der Provinzen"
 AOEIW_STRUCT_SOV_DEPTH_local_credit_desc:0 "Bündelt lokale Einlagen für Wiederaufbauausrüstung statt Hofpatronage."
 AOEIW_STRUCT_SOV_DEPTH_teacher_exchange:0 "Der Lehreraustausch der Provinzen"
 AOEIW_STRUCT_SOV_DEPTH_teacher_exchange_desc:0 "Technische Lehrer und praktische Handbücher folgen dem wachsenden Eisenbahndienst.\n\nEntwickelt Bezirksstraßen und Schulen auf Stufe 1/3. Gesamt: +4% Infrastrukturbau. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_regional_contracts:0 "Öffentliche Regionalverträge"
 AOEIW_STRUCT_SOV_DEPTH_regional_contracts_desc:0 "Veröffentlicht die Empfänger öffentlicher Aufträge, damit die Duma Reformkosten prüfen kann."
 AOEIW_STRUCT_SOV_DEPTH_postal_roads:0 "Die Poststraßen der Provinzen"
 AOEIW_STRUCT_SOV_DEPTH_postal_roads_desc:0 "Motorisierte Postlinien bringen Fachkräfte und medizinische Notvorräte über die Bahnhöfe hinaus.\n\nEntwickelt Bezirksstraßen und Schulen auf Stufe 2/3. Gesamt: +7% Infrastrukturbau; +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_district_medicine:0 "Der medizinische Kreisdienst"
 AOEIW_STRUCT_SOV_DEPTH_district_medicine_desc:0 "Macht medizinische Ausbildung zur dauerhaften Provinzaufgabe statt zur Mobilisierungsimprovisation.\n\nEntwickelt Bezirksstraßen und Schulen auf Stufe 3/3. Gesamt: +10% Infrastrukturbau; +5% Produktionseffizienzzuwachs; +3% Faktor der rekrutierbaren Bevölkerung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Bezirksreserven mustern frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_crown_orders:0 "Die Kronarsenalaufträge prüfen"
 AOEIW_STRUCT_SOV_DEPTH_crown_orders_desc:0 "Prüft die von der erneuerten Autokratie vergebenen Rüstungsaufträge.\n\nEntwickelt Kaiserlicher Quartiermeisterdienst auf Stufe 1/3. Gesamt: +2% Heeresorganisation. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_imperial_quartermasters:0 "Die kaiserlichen Quartiermeister"
 AOEIW_STRUCT_SOV_DEPTH_imperial_quartermasters_desc:0 "Ein mobiler Quartiermeisterdienst verbindet Provinzarsenale mit dem Feldheer.\n\nEntwickelt Kaiserlicher Quartiermeisterdienst auf Stufe 2/3. Gesamt: +3% Heeresorganisation; -3% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_royal_inventories:0 "Ein einheitliches Reichsinventar"
 AOEIW_STRUCT_SOV_DEPTH_royal_inventories_desc:0 "Verbindet Transportreserve und geprüfte Arsenale in einem gemeinsamen Mobilisierungsinventar.\n\nEntwickelt Kaiserlicher Quartiermeisterdienst auf Stufe 3/3. Gesamt: +5% Heeresorganisation; -5% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_staff_maps:0 "Der Kartendienst der Stawka"
 AOEIW_STRUCT_SOV_DEPTH_staff_maps_desc:0 "Gebt berichtigte Bahn- und Straßenkarten an die Stäbe aus, die das Heer darüber führen müssen."
 AOEIW_STRUCT_SOV_DEPTH_winter_workshops:0 "Die Winter-Werkstattanweisungen"
 AOEIW_STRUCT_SOV_DEPTH_winter_workshops_desc:0 "Dokumentiert Winterwartung, bevor Fahrzeuge den ersten gefrorenen Umschlagplatz erreichen.\n\nEntwickelt Winterwerkstattdienst auf Stufe 1/3. Gesamt: -10% Winterverschleiß. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_winter_stock:0 "Die Winterausrüstungsreserve"
 AOEIW_STRUCT_SOV_DEPTH_winter_stock_desc:0 "Schafft einen begrenzten Ersatzbestand für Verbände an der langen Grenze.\n\nEntwickelt Winterwerkstattdienst auf Stufe 2/3. Gesamt: -15% Winterverschleiß; +3% Heeres-Organisationserholung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_recovery_columns:0 "Die Bergungskolonnen des Heeres"
 AOEIW_STRUCT_SOV_DEPTH_recovery_columns_desc:0 "Bergungstrupps verhindern, dass beschädigte Fahrzeuge endgültig ausfallen. Gewährt 100 Lastwagen.\n\nEntwickelt Winterwerkstattdienst auf Stufe 3/3. Gesamt: -20% Winterverschleiß; +5% Heeres-Organisationserholung; -4% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Winterreserven ausgeben frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_provincial_exercise:0 "Die reichsweite Mobilisierungsübung"
 AOEIW_STRUCT_SOV_DEPTH_provincial_exercise_desc:0 "Erprobt das erneuerte Reichssystem über Provinzgrenzen hinweg, bevor der Krieg es ernsthaft prüft."
 AOEIW_STRUCT_SOV_DEPTH_grain_conference:0 "Die Getreide- und Eisenbahnkonferenz"
 AOEIW_STRUCT_SOV_DEPTH_grain_conference_desc:0 "Klärt die Versorgung von Städten und Heer, bevor die Revolution weitere Mobilisierung verspricht."
 AOEIW_STRUCT_SOV_DEPTH_grain_dispatch:0 "Die Getreide-Dispositionsämter"
 AOEIW_STRUCT_SOV_DEPTH_grain_dispatch_desc:0 "Setzt den Versorgungskompromiss des Kongresses durch reale Fahrpläne und Depots um.\n\nSchaltet das finanzierte Programm Getreidezügen Vorrang geben frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_cadre_literacy:0 "Die technische Bildungskampagne"
 AOEIW_STRUCT_SOV_DEPTH_cadre_literacy_desc:0 "Bildet Arbeiter im Lesen von Zeichnungen, Wartungskarten und Produktionsbüchern aus.\n\nEntwickelt Mehrsprachige technische Bildung auf Stufe 1/3. Gesamt: +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_translation_bureau:0 "Das Übersetzungsbüro der Union"
 AOEIW_STRUCT_SOV_DEPTH_translation_bureau_desc:0 "Die Union braucht technische Handbücher für Fabriken jenseits der großen russischen Städte.\n\nEntwickelt Mehrsprachige technische Bildung auf Stufe 2/3. Gesamt: +5% Produktionseffizienzzuwachs; +1% Forschungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_worker_inspection:0 "Arbeiterinspektoren in den Depots"
 AOEIW_STRUCT_SOV_DEPTH_worker_inspection_desc:0 "Prüft Frachtbücher anhand ankommender Waggons statt optimistische Statistiken zu belohnen."
 AOEIW_STRUCT_SOV_DEPTH_republic_schools:0 "Die Schulen der Republiken"
 AOEIW_STRUCT_SOV_DEPTH_republic_schools_desc:0 "Schafft einen gemeinsamen technischen Lehrplan unter Erhalt des Unterrichts in lokalen Sprachen.\n\nEntwickelt Mehrsprachige technische Bildung auf Stufe 3/3. Gesamt: +7% Produktionseffizienzzuwachs; +2% Forschungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_statistical_inspection:0 "Die Planstatistiken prüfen"
 AOEIW_STRUCT_SOV_DEPTH_statistical_inspection_desc:0 "Die zentralisierte Partei muss gelieferte Maschinen von bloß zur Quotenerfüllung gemeldeten Zahlen unterscheiden.\n\nEntwickelt Reserven des Industrieplans auf Stufe 1/3. Gesamt: +2% Militärfabrikausstoß. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_reserve_machine_tools:0 "Der Reserve-Werkzeugmaschinenpark"
 AOEIW_STRUCT_SOV_DEPTH_reserve_machine_tools_desc:0 "Haltet Reparaturausrüstung außerhalb der Produktionsvorgaben vor, damit Störungen nicht ganze Kombinate stoppen.\n\nEntwickelt Reserven des Industrieplans auf Stufe 2/3. Gesamt: +4% Militärfabrikausstoß; +3% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_plan_contingencies:0 "Das Büro für Planreserven"
 AOEIW_STRUCT_SOV_DEPTH_plan_contingencies_desc:0 "Eine zentrale Reserve federt Störungen ab; Landesverteidigung muss eine verfehlte Quote überstehen können.\n\nEntwickelt Reserven des Industrieplans auf Stufe 3/3. Gesamt: +6% Militärfabrikausstoß; +5% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_international_manuals:0 "Die internationalen Militärausgaben"
 AOEIW_STRUCT_SOV_DEPTH_international_manuals_desc:0 "Veröffentlicht Doktrin- und Wartungshandbücher für internationale Verbände statt eine gemeinsame Sprache vorauszusetzen.\n\nEntwickelt Internationaler Verbindungsstab auf Stufe 1/3. Gesamt: +3% Heeres-Organisationserholung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_delegate_missions:0 "Die Industriedelegierten-Missionen"
 AOEIW_STRUCT_SOV_DEPTH_delegate_missions_desc:0 "Ingenieure tauschen über die internationale Bewegung Werkstatterfahrung aus. Der Nutzen ist technisch, keine kostenlose Auslandsannexion.\n\nEntwickelt Internationaler Verbindungsstab auf Stufe 2/3. Gesamt: +5% Heeres-Organisationserholung; +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_international_signals:0 "Die internationale Nachrichtenschule"
 AOEIW_STRUCT_SOV_DEPTH_international_signals_desc:0 "Gemeinsame Funkverfahren geben multinationalen Verbänden eine praktische Führungssprache.\n\nEntwickelt Internationaler Verbindungsstab auf Stufe 3/3. Gesamt: +7% Heeres-Organisationserholung; +5% Produktionseffizienzzuwachs; +10% Planungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_operational_college:0 "Die Hochschule für operative Kriegführung"
 AOEIW_STRUCT_SOV_DEPTH_operational_college_desc:0 "Prüft das armeegeführte Programm anhand realer Transport- und Reservegrenzen.\n\nEntwickelt Operativer Staffeldienst auf Stufe 1/3. Gesamt: +5% Planungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_motorised_staff:0 "Die motorisierten Stabskolonnen"
 AOEIW_STRUCT_SOV_DEPTH_motorised_staff_desc:0 "Ein bewegliches Heer braucht Stäbe, die ihm folgen können. Gewährt 160 Lastwagen.\n\nEntwickelt Operativer Staffeldienst auf Stufe 2/3. Gesamt: +10% Planungstempo; +3% Heeresgeschwindigkeit. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_second_echelon:0 "Der Versorgungsplan der zweiten Staffel"
 AOEIW_STRUCT_SOV_DEPTH_second_echelon_desc:0 "Bereitet eine zweite Versorgungsstaffel vor statt den gesamten Transport im ersten Angriff zu verbrauchen.\n\nEntwickelt Operativer Staffeldienst auf Stufe 3/3. Gesamt: +15% Planungstempo; +5% Heeresgeschwindigkeit; -5% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Die zweite Staffel einsetzen frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_volga_survey:0 "Die industrielle Wolga-Erhebung"
 AOEIW_STRUCT_SOV_DEPTH_volga_survey_desc:0 "Erfasst Flusstransport und Werkstattkapazitäten für eine Industrieinvestition abseits der Westgrenze."
 AOEIW_STRUCT_SOV_DEPTH_volga_contract:0 "Der Wolga-Werksvertrag"
 AOEIW_STRUCT_SOV_DEPTH_volga_contract_desc:0 "Schaltet ein bezahltes 120-Tage-Zivilindustrieprojekt im unteren Wolgagebiet frei."
 AOEIW_STRUCT_SOV_DEPTH_technical_correspondence:0 "Die technischen Fernlehrinstitute"
 AOEIW_STRUCT_SOV_DEPTH_technical_correspondence_desc:0 "Die Entfernungen des Reiches verlangen technische Bildung jenseits der Universitätsstädte.\n\nEntwickelt Einheitlicher Ersatzteildienst auf Stufe 1/3. Gesamt: +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_diesel_workshops:0 "Die Eisenbahn-Dieselwerkstätten"
 AOEIW_STRUCT_SOV_DEPTH_diesel_workshops_desc:0 "Bildet Mechaniker für die gemischten Bahn- und Straßenmotoren aus.\n\nEntwickelt Einheitlicher Ersatzteildienst auf Stufe 2/3. Gesamt: +5% Produktionseffizienzzuwachs; +3% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_spare_catalogue:0 "Der nationale Ersatzteilkatalog"
 AOEIW_STRUCT_SOV_DEPTH_spare_catalogue_desc:0 "Ein gemeinsamer Katalog verhindert inkompatible Einzelbestellungen der Depots.\n\nEntwickelt Einheitlicher Ersatzteildienst auf Stufe 3/3. Gesamt: +7% Produktionseffizienzzuwachs; +5% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_volga_acceptance:0 "Die Wolga-Lieferungen abnehmen"
 AOEIW_STRUCT_SOV_DEPTH_volga_acceptance_desc:0 "Nehmt die fertigen Werke in das nationale Versorgungsnetz auf. Erfordert den tatsächlichen Projektabschluss.\n\nSchaltet das finanzierte Programm Die Wolga-Bausaison frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_capital_arsenal:0 "Die Moskauer Arsenalerweiterung"
 AOEIW_STRUCT_SOV_DEPTH_capital_arsenal_desc:0 "Schaltet ein 90-Tage-Arsenalprojekt im Hauptstadtgebiet mit realem Budget und Gebietsrisiko frei."
 AOEIW_STRUCT_SOV_DEPTH_arsenal_gauges:0 "Die Arsenal-Prüflehrennorm"
 AOEIW_STRUCT_SOV_DEPTH_arsenal_gauges_desc:0 "Gebt Waffen aus verschiedenen Bezirken eine gemeinsame Toleranznorm.\n\nSchaltet das finanzierte Programm Normierungskampagne der Arsenale frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_SOV_DEPTH_fleet_workshops:0 "Der Flottenwerkstattdienst"
 AOEIW_STRUCT_SOV_DEPTH_fleet_workshops_desc:0 "Unterstützt eine verstreute Flotte mit Technikern und mobiler Reparaturausrüstung.\n\nEntwickelt Dienst der Nordflotte auf Stufe 1/2. Gesamt: +5% Schiffsreparaturtempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_SOV_DEPTH_ice_navigation:0 "Die nördliche Navigationsschule"
 AOEIW_STRUCT_SOV_DEPTH_ice_navigation_desc:0 "Lehrt Navigation und Geleitverfahren für die nördlichen Zufahrten.\n\nEntwickelt Dienst der Nordflotte auf Stufe 2/2. Gesamt: +10% Schiffsreparaturtempo; -5% Marine-Treibstoffverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_military_prefects:0 "Militärpräfekten"
 AOEIW_STRUCT_FRA_military_prefects_desc:0 "Das Marschallregime ersetzt die zivile Notverwaltung. Gewährt 35 politische Macht und 2% Stabilität."
 AOEIW_STRUCT_FRA_metropolitan_arsenals:0 "Bourges bewaffnet die Metropole"
 AOEIW_STRUCT_FRA_metropolitan_arsenals_desc:0 "Das Arsenal von Bourges baut Geschütz- und Munitionsfertigung fern der bedrohten Nordostgrenze aus. Die Aufrüstung erhält Kapazität, die den ersten Kampf überstehen kann."
 AOEIW_STRUCT_FRA_methodical_reserve:0 "Die methodische Reserve"
 AOEIW_STRUCT_FRA_methodical_reserve_desc:0 "Priorisiert Artillerie und vorbereitete Verteidigung. Gewährt 50% Artillerieforschungsbonus; schließt die mobile Reserve aus."
 AOEIW_STRUCT_FRA_mobile_reserve:0 "Eine mobile strategische Reserve"
 AOEIW_STRUCT_FRA_mobile_reserve_desc:0 "Priorisiert gepanzerte Gegenangriffe. Gewährt 50% Panzerforschungsbonus; schließt die methodische Reserve aus."
 AOEIW_STRUCT_FRA_military_logistics:0 "Jeder Zug an die Front"
 AOEIW_STRUCT_FRA_military_logistics_desc:0 "Militärfahrpläne reservieren Lokomotiven, Nebengleise und Entladetrupps für den Mobilmachungsplan. Ein Reserveheer nützt nur, wenn es mit Essen und Granaten seinen Abschnitt erreicht."
 AOEIW_STRUCT_FRA_military_settlement:0 "Das gefestigte Marschallregime"
 AOEIW_STRUCT_FRA_military_settlement_desc:0 "Vollendet die Militärordnung. Gewährt 4% Stabilität und 25 Armeeerfahrung; kein erneuter Führerwechsel."
 AOEIW_STRUCT_FRA_imperial_dockyards:0 "Das Mittelmeer-Werftbudget"
 AOEIW_STRUCT_FRA_imperial_dockyards_desc:0 "Das imperiale Programm baut eine Werft in einem eigenen kontrollierten Küsten-Kernstaat."
 AOEIW_STRUCT_FRA_colonial_transport:0 "Der imperiale Transportdienst"
 AOEIW_STRUCT_FRA_colonial_transport_desc:0 "Unterstützt Überseeverstärkungen ohne Annexion. Gewährt 40 Konvois."
 AOEIW_STRUCT_FRA_imperial_logistics:0 "Ein imperiales Versorgungssystem"
 AOEIW_STRUCT_FRA_imperial_logistics_desc:0 "Verbindet Werften und Transportdienst. Gewährt 20 Marineerfahrung und 15 Kommandopunkte."
 AOEIW_STRUCT_FRA_communal_credit:0 "Kommunale Wiederaufbaukredite"
 AOEIW_STRUCT_FRA_communal_credit_desc:0 "Die liberale Ordnung finanziert eine Zivilfabrik durch kommunalen Wiederaufbau."
 AOEIW_STRUCT_FRA_citizen_officers:0 "Bürgerliche Offiziersschulen"
 AOEIW_STRUCT_FRA_citizen_officers_desc:0 "Öffnet die Offiziersausbildung für zivile Institutionen. Gewährt 25 Armeeerfahrung und 10 Kommandopunkte."
 AOEIW_STRUCT_FRA_civic_defence:0 "Schutzräume unter Paris"
 AOEIW_STRUCT_FRA_civic_defence_desc:0 "Städtische Ingenieure kennzeichnen Keller, verstärken Schutzräume und organisieren Feuerwehr- und Sanitätsposten in der Hauptstadt. Zivilschutz wird in jedem Arrondissement sichtbar."
 AOEIW_STRUCT_FRA_DEPTH_mayors_petition:0 "Die Bürgermeister anhören"
 AOEIW_STRUCT_FRA_DEPTH_mayors_petition_desc:0 "Verhandelt die Wiederaufbauverwaltung, bevor die liberale Koalition weitere Zusagen macht."
 AOEIW_STRUCT_FRA_DEPTH_mayoral_congress:0 "Der Gemeindekongress"
 AOEIW_STRUCT_FRA_DEPTH_mayoral_congress_desc:0 "Macht aus dem gewählten Aufbaumodell ein funktionierendes Netz lokaler Ämter.\n\nEntwickelt Der Gemeindepakt auf Stufe 1/3. Gesamt: +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_civic_register:0 "Zählt die Betten, markiert die Schutzräume"
 AOEIW_STRUCT_FRA_DEPTH_civic_register_desc:0 "Die Mairies erfassen Krankenhausbetten, Schutzplätze und Fahrzeuge, bevor die Mobilmachung ihre Besitzer verstreut. Beim Sirenenalarm braucht Paris eine einzige brauchbare Zählung."
 AOEIW_STRUCT_FRA_DEPTH_prefect_limits:0 "Die Notstandsvollmachten begrenzen"
 AOEIW_STRUCT_FRA_DEPTH_prefect_limits_desc:0 "Veröffentlicht die Grenzen von Notbeschlagnahmen. Zurückhaltung kostet politische Macht, schützt aber das Vertrauen in die Regierung."
 AOEIW_STRUCT_FRA_DEPTH_civil_appeals:0 "Ein ziviles Beschwerdegericht"
 AOEIW_STRUCT_FRA_DEPTH_civil_appeals_desc:0 "Bürger können gegen kriegsbedingte Verwaltungsanordnungen vor einem arbeitsfähigen Gericht vorgehen.\n\nEntwickelt Der Gemeindepakt auf Stufe 3/3. Gesamt: +4% Stabilität; +0.06 politische Macht pro Tag; +4% Zivilfabrikbau. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_collective_contracts:0 "Nationale Arbeitsverträge"
 AOEIW_STRUCT_FRA_DEPTH_collective_contracts_desc:0 "Verhandelt gemeinsame Schichtvereinbarungen statt jeden Arsenalstreit einzeln zu schlichten.\n\nEntwickelt Institutionen des Arbeitsvertrags auf Stufe 1/3. Gesamt: +3% Produktionseffizienzzuwachs. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_union_representatives:0 "Gewerkschaftliche Verbindungsstellen"
 AOEIW_STRUCT_FRA_DEPTH_union_representatives_desc:0 "Gewerkschaftsvertreter erkennen Fehlzeiten, Wohnungsnot und gebrochene Lieferzusagen frühzeitig.\n\nEntwickelt Institutionen des Arbeitsvertrags auf Stufe 2/3. Gesamt: +5% Produktionseffizienzzuwachs; +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_municipal_clinics:0 "Die kommunale Sanitätsreserve"
 AOEIW_STRUCT_FRA_DEPTH_municipal_clinics_desc:0 "Verbindet zivile Kliniken mit der militärischen Sanitätsplanung, ohne die Gemeinden dem Heer zu unterstellen.\n\nEntwickelt Institutionen des Arbeitsvertrags auf Stufe 3/3. Gesamt: +7% Produktionseffizienzzuwachs; +3% Stabilität; +3% Faktor der rekrutierbaren Bevölkerung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_corps_archives:0 "Die Archive der Korps"
 AOEIW_STRUCT_FRA_DEPTH_corps_archives_desc:0 "Imperialer Ruhm muss sich an realen Mobilisierungsakten und Depotkapazitäten messen lassen.\n\nEntwickelt Kaiserliches Dienstkorps auf Stufe 1/3. Gesamt: +5% Mobilisierungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_imperial_inspectors:0 "Die kaiserliche Inspektion"
 AOEIW_STRUCT_FRA_DEPTH_imperial_inspectors_desc:0 "Inspektoren melden leere Depots ebenso zuverlässig wie zeremonielle Erfolge.\n\nEntwickelt Kaiserliches Dienstkorps auf Stufe 2/3. Gesamt: +10% Mobilisierungstempo; +2% Heeresorganisation. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_service_obligation:0 "Die Debatte über die Dienstpflicht"
 AOEIW_STRUCT_FRA_DEPTH_service_obligation_desc:0 "Das Reichskabinett muss seine Reservisten ausrüsten, bevor es die Dienstpflicht ausweitet.\n\nEntwickelt Kaiserliches Dienstkorps auf Stufe 3/3. Gesamt: +15% Mobilisierungstempo; +4% Heeresorganisation. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_reserve_depots:0 "Die kolonialen Reservedepots"
 AOEIW_STRUCT_FRA_DEPTH_reserve_depots_desc:0 "Eine Überseereserve hilft nur, wenn ihre Ausrüstung einen Hafen erreicht. Gewährt 30 Transportkonvois."
 AOEIW_STRUCT_FRA_DEPTH_interpreter_corps:0 "Das imperiale Dolmetscherkorps"
 AOEIW_STRUCT_FRA_DEPTH_interpreter_corps_desc:0 "Vereinheitlicht Befehle und technische Handbücher im Überseedienst."
 AOEIW_STRUCT_FRA_DEPTH_algerian_contract:0 "Der algerische Arsenalvertrag"
 AOEIW_STRUCT_FRA_DEPTH_algerian_contract_desc:0 "Schaltet einen bezahlten 120-Tage-Arsenalausbau in Westalgerien frei. Gewährt keine neuen Kerne und verhindert keine Niederlage im Mutterland."
 AOEIW_STRUCT_FRA_DEPTH_overseas_maintenance:0 "Übersee-Wartungshandbücher"
 AOEIW_STRUCT_FRA_DEPTH_overseas_maintenance_desc:0 "Übersetzt Depotnormen in Verfahren, die Feldwerkstätten tatsächlich anwenden können."
 AOEIW_STRUCT_FRA_DEPTH_algerian_handover:0 "Die algerischen Lieferungen abnehmen"
 AOEIW_STRUCT_FRA_DEPTH_algerian_handover_desc:0 "Bindet das fertige Arsenal in die imperiale Versorgung ein. Erfordert das abgeschlossene Bauprojekt."
 AOEIW_STRUCT_FRA_DEPTH_directorate_charter:0 "Weygands Notstandsstatut"
 AOEIW_STRUCT_FRA_DEPTH_directorate_charter_desc:0 "Weygand legt schriftlich fest, welche Befehle dem Kabinett und welche dem Militärkommando zustehen. Notstandsherrschaft funktioniert nicht, solange jedes Ministerium das nächste aufhalten kann."
 AOEIW_STRUCT_FRA_DEPTH_judicial_review:0 "Den Belagerungszustand überprüfen"
 AOEIW_STRUCT_FRA_DEPTH_judicial_review_desc:0 "Überführt Notbefehle in ein festgelegtes Verwaltungssystem, nachdem die Kabinettszusammensetzung geklärt ist."
 AOEIW_STRUCT_FRA_DEPTH_military_inspection:0 "Die Generalinspektionsreisen"
 AOEIW_STRUCT_FRA_DEPTH_military_inspection_desc:0 "Inspektoren melden Munitions-, Transport- und Reservemängel direkt dem Direktorium."
 AOEIW_STRUCT_FRA_DEPTH_reserve_contracts:0 "Verträge für die strategische Reserve"
 AOEIW_STRUCT_FRA_DEPTH_reserve_contracts_desc:0 "Lagert gemeinsame Bauteile ein, bevor das Heer seine Reservedoktrin festlegt.\n\nEntwickelt Transportkolonnen der Reserve auf Stufe 1/3. Gesamt: -2% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_reserve_lorries:0 "Der Lastwagenpool der Reserve"
 AOEIW_STRUCT_FRA_DEPTH_reserve_lorries_desc:0 "Stellt Transportmittel für Reserveverbände bereit. Gewährt 150 Lastwagen.\n\nEntwickelt Transportkolonnen der Reserve auf Stufe 2/3. Gesamt: -4% Nachschubverbrauch; +5% Planungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_fire_plan:0 "Der vorbereitete Feuerplan"
 AOEIW_STRUCT_FRA_DEPTH_fire_plan_desc:0 "Die methodische Reserve erhält Artilleriebestände und vorbereitete Feuerzonen.\n\nSchaltet das finanzierte Programm Die methodische Schlacht vorbereiten frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_FRA_DEPTH_counterstroke:0 "Die Gegenschlagübung"
 AOEIW_STRUCT_FRA_DEPTH_counterstroke_desc:0 "Die mobile Reserve erprobt Konzentration und Bergung statt den Artillerieplan zu kopieren.\n\nSchaltet das finanzierte Programm Die bewegliche Reserve freigeben frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_FRA_DEPTH_evacuation_tables:0 "Die Evakuierungsfahrpläne"
 AOEIW_STRUCT_FRA_DEPTH_evacuation_tables_desc:0 "Bereitet geordnete Verlegungen von Depots und Lazaretten bei einem Grenzdurchbruch vor. Gewährt 45 Züge.\n\nEntwickelt Ziviler und militärischer Sanitätsdienst auf Stufe 1/3. Gesamt: -3% Erfahrungsverlust. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_medical_columns:0 "Die Sanitätskolonnen des Heeres"
 AOEIW_STRUCT_FRA_DEPTH_medical_columns_desc:0 "Mobile Sanitätstrupps begleiten die Reserve statt in festen Lazaretten zu warten.\n\nEntwickelt Ziviler und militärischer Sanitätsdienst auf Stufe 2/3. Gesamt: -5% Erfahrungsverlust; +4% Heeres-Organisationserholung. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_reserve_staff:0 "Die Generalstabsschule der Reserve"
 AOEIW_STRUCT_FRA_DEPTH_reserve_staff_desc:0 "Bildet eine zweite Reihe von Stabsoffizieren für einen langen Feldzug aus.\n\nEntwickelt Transportkolonnen der Reserve auf Stufe 3/3. Gesamt: -6% Nachschubverbrauch; +10% Planungstempo. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_directorate_service:0 "Autorität muss liefern"
 AOEIW_STRUCT_FRA_DEPTH_directorate_service_desc:0 "Die Notstandsregierung verbindet Sanitätsevakuierung, Verkehr und Stabsarbeit durch durchsetzbare Befehle. Ihr Führungsanspruch wird an Bahnhöfen und in Krankenhäusern geprüft."
 AOEIW_STRUCT_FRA_DEPTH_bakery_councils:0 "Die Bäckereiräte"
 AOEIW_STRUCT_FRA_DEPTH_bakery_councils_desc:0 "Brotschlangen können das Schicksal einer Revolution vor einem Feldzug entscheiden.\n\nEntwickelt Kommunales Verteilungsnetz auf Stufe 1/3. Gesamt: +2% Stabilität. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_grain_register:0 "Brotlisten in jeder Mairie"
 AOEIW_STRUCT_FRA_DEPTH_grain_register_desc:0 "Jede Mairie meldet Getreidevorräte, Bäckereien und Lieferwagen nach demselben Plan. Keine zwei Kommunen dürfen denselben Zug beschlagnahmen, während einer anderen das Mehl fehlt."
 AOEIW_STRUCT_FRA_DEPTH_delegate_schools:0 "Die Delegiertenschulen"
 AOEIW_STRUCT_FRA_DEPTH_delegate_schools_desc:0 "Lehrt neue Delegierte Rechnungsführung und technische Verwaltung, nicht nur Parlamentsreden."
 AOEIW_STRUCT_FRA_DEPTH_food_congress:0 "Der Versorgungskongress"
 AOEIW_STRUCT_FRA_DEPTH_food_congress_desc:0 "Wählt zwischen ausgehandelter Zivilversorgung und militärischer Notbeschaffung."
 AOEIW_STRUCT_FRA_DEPTH_ration_cards:0 "Eine gemeinsame Lebensmittelkarte"
 AOEIW_STRUCT_FRA_DEPTH_ration_cards_desc:0 "Die beschlossene Versorgungspolitik braucht ein gemeinsames Register, unabhängig von der zuständigen Institution."
 AOEIW_STRUCT_FRA_DEPTH_communal_transport:0 "Der kommunale Transportdienst"
 AOEIW_STRUCT_FRA_DEPTH_communal_transport_desc:0 "Bündelt Lieferfahrzeuge über Kommunalgrenzen hinweg statt konkurrierende Ortsflotten aufzubauen.\n\nEntwickelt Kommunales Verteilungsnetz auf Stufe 3/3. Gesamt: +4% Stabilität; +5% Produktionseffizienzzuwachs; -3% Nachschubverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_paris_workshops:0 "Die Pariser Werkstatterhebung"
 AOEIW_STRUCT_FRA_DEPTH_paris_workshops_desc:0 "Erfasst kleine Zulieferer, die an einem nationalen Wiederaufbauvertrag teilnehmen können.\n\nEntwickelt Französische Zuliefernormen auf Stufe 1/3. Gesamt: +2% Militärfabrikausstoß. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_paris_contract:0 "Der Pariser Wiederaufbauvertrag"
 AOEIW_STRUCT_FRA_DEPTH_paris_contract_desc:0 "Schaltet ein finanziertes 90-Tage-Zivilfabrikprojekt in der Île-de-France frei."
 AOEIW_STRUCT_FRA_DEPTH_technical_lycees:0 "Die technischen Lyzeen"
 AOEIW_STRUCT_FRA_DEPTH_technical_lycees_desc:0 "Verbindet technische Schulen mit den Fabriken, die ihre Absolventen beschäftigen sollen.\n\nEntwickelt Französische Zuliefernormen auf Stufe 2/3. Gesamt: +4% Militärfabrikausstoß; +3% Produktionseffizienzgrenze. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_aviation_tools:0 "Ein Maß von Toulouse bis Bordeaux"
 AOEIW_STRUCT_FRA_DEPTH_aviation_tools_desc:0 "Die Flugzeugwerke von Toulouse und Bordeaux teilen Lehren, Vorrichtungen und Prüfnormen. Ersatzteile müssen passen, bevor Staffeln Verluste ersetzen können."
 AOEIW_STRUCT_FRA_DEPTH_alpine_radio:0 "Die alpinen Funkversuche"
 AOEIW_STRUCT_FRA_DEPTH_alpine_radio_desc:0 "Erprobt Funkgeräte zwischen Tälern und Höhenstellungen vor ihrer Ausgabe an das Feldheer.\n\nEntwickelt Luft-Boden-Verbindung auf Stufe 2/2. Gesamt: +5% Lufteinsatzeffizienz; -5% Flugunfälle. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Luft-Boden-Verbindungsprogramm frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_FRA_DEPTH_standard_chassis:0 "Weniger Fahrgestelle, mehr Ersatzteile"
 AOEIW_STRUCT_FRA_DEPTH_standard_chassis_desc:0 "Das Heer streicht unverträgliche Fahrzeugtypen und verlangt gemeinsame Motoren, Anschlüsse und Bergeteile. Werkstätten reparieren dann Flotten statt ein Museum von Modellen zu pflegen."
 AOEIW_STRUCT_FRA_DEPTH_supplier_acceptance:0 "Die Wiederaufbauaufträge abnehmen"
 AOEIW_STRUCT_FRA_DEPTH_supplier_acceptance_desc:0 "Prüft das fertige Pariser Projekt, bevor seine Lieferanten in die Heeresbeschaffung eintreten.\n\nSchaltet das finanzierte Programm Bauprogramm des Mutterlands frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_STRUCT_FRA_DEPTH_naval_rescue:0 "Der Seenotrettungsdienst"
 AOEIW_STRUCT_FRA_DEPTH_naval_rescue_desc:0 "Koordiniert Rettungsboote, Küstenfunkstellen und Handelsschiffkapitäne.\n\nEntwickelt Seerettung und Seeaufklärung auf Stufe 1/2. Gesamt: +3% Marinekoordination. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe."
 AOEIW_STRUCT_FRA_DEPTH_maritime_patrols:0 "Der Lehrplan der Atlantikpatrouillen"
 AOEIW_STRUCT_FRA_DEPTH_maritime_patrols_desc:0 "Übt Langzeitpatrouillen und Erkennung entlang der tatsächlich genutzten Seewege.\n\nEntwickelt Seerettung und Seeaufklärung auf Stufe 2/2. Gesamt: +6% Marinekoordination; -5% Marine-Treibstoffverbrauch. Ersetzt frühere Stufen; stapelt sich nicht und senkt keine bereits höhere Stufe.\n\nSchaltet das finanzierte Programm Mittelmeer-Geleitwache frei; aktiviert es bei Bedarf über Entscheidungen."
 AOEIW_IMM_FRA_union_3:0 "Die Nation in Waffen"
 AOEIW9_GER_mil_army_4:0 "Die Infanterieschlacht beherrschen"
 AOEIW9_GER_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_FRA_mil_army_7:0 "Den Panzerdurchbruch ausnutzen"
 AOEIW9_FRA_mil_army_8:0 "Ein gemeinsamer Nachschubdienst"
 AOEIW9_SOV_politics_p2_2:0 "Rechenschaftspflicht der Ochrana"
 AOEIW9_SOV_politics_p1_6:0 "Die Krone und das Offizierskorps"
 AOEIW9_SOV_politics_p2_6:0 "Ein Parlament für ganz Russland"
 AOEIW9_FRA_politics_p2_7:0 "Der Sénatus-consulte von Saint-Cloud"
 AOEIW9_FRA_politics_settlement:0 "Ein geeinter französischer Staat"
 AOEIW9_GER_mil_army_4_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_GER_mil_army_7_desc:0 "Das Reichsheer entscheidet, ob selbständige Infanterieführer oder bewegliche Panzerstäbe die Entscheidung tragen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_7_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW9_FRA_mil_army_8_desc:0 "Frankreich kann auf vorbereitete Feuerpläne setzen oder Panzer für den operativen Gegenstoß zusammenfassen. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
 AOEIW_IMM_FRA_union_3_desc:0 "Die liberale Reichsordnung stützt sich auf zivile Institutionen und Landesverteidigung. Öffnet kommunalen Wiederaufbau und bürgerliche Offiziersbildung; dieser Fokus ruft keine Republik aus."
