l_german:
 AOEIW_consolidation_crisis_category:0 "Nationale Mobilisierung"
 AOEIW_consolidation_crisis_category_desc:0 "Der Krieg verlangt einen steigenden Einsatz von Menschen, Industrie und politischem Kapital. Mobilisierung schafft echte Stärke, doch eine überforderte Gesellschaft trägt bleibende Kosten."
 AOEIW_consolidation_partial_mobilization_decision:0 "Teilmobilmachung anordnen"
 AOEIW_consolidation_partial_mobilization_decision_desc:0 "Reservisten einberufen und Fabrikschichten verlängern. §YKosten: 25 PP.§! Begrenzte Mannstärke- und Ausbildungsvorteile bei kleinen zivilen Kosten."
 AOEIW_consolidation_total_mobilization_decision:0 "Totalmobilmachung erklären"
 AOEIW_consolidation_total_mobilization_decision_desc:0 "Wirtschaft und Bevölkerung vollständig auf Krieg ausrichten. §YKosten: 50 PP.§! Ersetzt die Teilmobilmachung durch stärkere Boni und höhere Stabilitäts- und Konsumkosten."
 AOEIW_consolidation_emergency_mobilization_decision:0 "Notaufgebot"
 AOEIW_consolidation_emergency_mobilization_decision_desc:0 "Die letzten Reserven einsetzen. §RKosten: 75 PP.§! Außergewöhnliche Mannstärke und Produktion gegen schwere gesellschaftliche und logistische Kosten."
 AOEIW_consolidation_war_rationing_decision:0 "Kriegsrationierung einführen"
 AOEIW_consolidation_war_rationing_decision_desc:0 "Zivilen Treibstoff, Nahrung und Material an die Front umleiten. §YKosten: 35 PP.§! Verbessert Versorgung und Treibstofffluss, senkt aber die Stabilität."
 AOEIW_consolidation_demobilize_decision:0 "Kriegswirtschaft demobilisieren"
 AOEIW_consolidation_demobilize_decision_desc:0 "Soldaten und Fabriken in den Frieden zurückführen. Entfernt Mobilisierung und Rationierung, verursacht aber §Y240 Tage§! Nachkriegserschöpfung."
 AOEIW_consolidation_partial_mobilization:0 "Teilmobilmachung"
 AOEIW_consolidation_partial_mobilization_desc:0 "Reservisten und Schlüsselindustrien dienen dem Krieg, ohne die gesamte zivile Wirtschaft zu verschlingen."
 AOEIW_consolidation_total_mobilization:0 "Totalmobilmachung"
 AOEIW_consolidation_total_mobilization_desc:0 "Der Staat richtet Arbeit, Industrie und Transport vollständig auf den Sieg aus."
 AOEIW_consolidation_emergency_mobilization:0 "Notaufgebot"
 AOEIW_consolidation_emergency_mobilization_desc:0 "Die letzten Reserven werden verbraucht. Die Armee wächst, doch Gesellschaft und Logistik geraten unter schweren Druck."
 AOEIW_consolidation_war_rationing:0 "Kriegsrationierung"
 AOEIW_consolidation_war_rationing_desc:0 "Der zivile Verbrauch wird beschränkt, damit Treibstoff und Versorgung die Streitkräfte erreichen."
 AOEIW_consolidation_postwar_exhaustion:0 "Nachkriegserschöpfung"
 AOEIW_consolidation_postwar_exhaustion_desc:0 "Frieden repariert die menschlichen und industriellen Schäden des totalen Krieges nicht über Nacht."
 AOEIW_consolidation_political_settlement:0 "Dauerhafte politische Ordnung"
 AOEIW_consolidation_political_settlement_desc:0 "Das politische Programm ruht nun auf krisenfesten Institutionen."
 AOEIW_consolidation_industrial_programme:0 "Integriertes Industrieprogramm"
 AOEIW_consolidation_industrial_programme_desc:0 "Infrastruktur, Forschung und Produktionsplanung bilden ein praktisches Entwicklungsprogramm."
 AOEIW_consolidation_military_reform:0 "Vereinheitlichtes Generalstabssystem"
 AOEIW_consolidation_military_reform_desc:0 "Ausbildung, Doktrin, Beschaffung und Operationsplanung folgen gemeinsamen Standards."
 AOEIW_consolidation_diplomatic_charter:0 "Strategische Diplomatiecharta"
 AOEIW_consolidation_diplomatic_charter_desc:0 "Die Außenpolitik wird von dauerhaften Institutionen statt improvisierten Erklärungen getragen."
 AOEIW_consolidation_chinese_logistics:0 "Getreide- und Eisenbahnverwaltung"
 AOEIW_consolidation_chinese_logistics_desc:0 "Regionale Depots, Getreideabgaben und Bahnprioritäten versorgen die Armeen der nationalen Rettung."
 AOEIW_consolidation_chinese_coalition:0 "Integrierte Regionalkommandos"
 AOEIW_consolidation_chinese_coalition_desc:0 "Regionale Befehlshaber behalten eine Stimme, doch Menschen und Operationen werden durch die Einheitsfront koordiniert."
 AOEIW_consolidation_integrate_regional_commands:0 "Regionalkommandos integrieren"
 AOEIW_consolidation_integrate_regional_commands_desc:0 "Provinzarmeen in eine gemeinsame Kommandostruktur binden. §YKosten: 35 PP.§! Gewährt Kommandopunkte, Armee-Erfahrung und einen dauerhaften Koalitionsgeist."
 AOEIW_consolidation_secure_grain_and_rail:0 "Getreide und Eisenbahnen sichern"
 AOEIW_consolidation_secure_grain_and_rail_desc:0 "Kriegsdepots errichten und die Binnenbahnen schützen. §YKosten: 40 PP.§! Gewährt einen Logistikgeist und 12.000 Infanteriewaffen."
 AOEIW_consolidation_wartime_political_council:0 "Politischen Kriegsrat einberufen"
 AOEIW_consolidation_wartime_political_council_desc:0 "Nationalisten, Kommunisten und Regionalvertretern ein kontrolliertes Forum geben. §YKosten: 45 PP.§! Verbessert Stabilität, Kriegsunterstützung und politische Macht."
