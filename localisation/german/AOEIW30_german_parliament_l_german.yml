 AOEIW30_GER_confirm_coalition:0 "Mehrheitsregierung vereidigen"
 AOEIW30_GER_confirm_coalition_desc:0 "Bestätigt die vorgeschlagene Koalition, sobald sie die dynamisch berechnete absolute Mehrheit von [?AOEIW30_GER_majority_seats|0] Sitzen hält. Ihre Parteiprogramme erscheinen im Fokusbaum; die Opposition verschwindet."
 AOEIW30_GER_reset_coalition_talks:0 "Koalitionsgespräche zurücksetzen"
 AOEIW30_GER_reset_coalition_talks_desc:0 "Verwirft die aktuelle Kombination, ohne die Wahl zu wiederholen."
 AOEIW30_GER_cdu:0 "CDU in der Regierung"
 AOEIW30_GER_cdu_desc:0 "Eine überkonfessionelle christlich-demokratische Union verbindet soziale Marktwirtschaft mit föderaler Verfassungstreue."
 AOEIW30_GER_cdu_social_market:0 "Die soziale Marktwirtschaft"
 AOEIW30_GER_cdu_social_market_desc:0 "Wettbewerb, Tarifautonomie und soziale Absicherung sollen Wiederaufbau und gesellschaftliche Ruhe verbinden."
 AOEIW30_GER_cdu_lander_compact:0 "Keine Republik ohne die Länder"
 AOEIW30_GER_cdu_lander_compact_desc:0 "Christdemokraten lehnen sowohl preußische Vorherrschaft als auch Regierung per Notverordnung ab. Die Länder behalten Zuständigkeit für Schulen, Polizei und Wiederaufbau."
 AOEIW30_GER_cdu_cross_confessional_union:0 "Eine überkonfessionelle Union"
 AOEIW30_GER_cdu_cross_confessional_union_desc:0 "Katholische und protestantische Demokraten verpflichten sich auf ein gemeinsames Verfassungsprogramm."
 AOEIW30_GER_cdu_federal_compromise:0 "Der föderale Kompromiss"
 AOEIW30_GER_cdu_federal_compromise_desc:0 "Bund, Länder und Gemeinden erhalten klar getrennte Zuständigkeiten und verlässliche Einnahmen."
 AOEIW30_GER_cdu_mandate_delivered:0 "Stabilität durch Verantwortung"
 AOEIW30_GER_cdu_mandate_delivered_desc:0 "Die Union liefert eine belastbare demokratische Mitte statt einer bloßen Sammlung konfessioneller Wahlvereine."
 AOEIW30_GER_dstp:0 "DStP in der Regierung"
 AOEIW30_GER_dstp_desc:0 "Die Deutsche Staatspartei verteidigt den liberalen Rechtsstaat, eine professionelle Verwaltung und parlamentarische Haushaltskontrolle."
 AOEIW30_GER_dstp_civil_service:0 "Ein unpolitischer Staatsdienst"
 AOEIW30_GER_dstp_civil_service_desc:0 "Beförderungen folgen Leistung und Gesetz statt Hofnähe, Parteibuch oder Verbandsdruck."
 AOEIW30_GER_dstp_budget_right:0 "Das Haushaltsrecht des Parlaments"
 AOEIW30_GER_dstp_budget_right_desc:0 "Kein Ministerium und kein Generalstab darf dauerhafte Ausgaben am gewählten Haus vorbei festschreiben."
 AOEIW30_GER_dstp_republican_compromise:0 "Der republikanische Verfassungskompromiss"
 AOEIW30_GER_dstp_republican_compromise_desc:0 "Liberale, Föderalisten und gemäßigte Konservative einigen sich auf eine belastbare Gewaltenteilung."
 AOEIW30_GER_dstp_scientific_state:0 "Wissenschaft im Staatsdienst"
 AOEIW30_GER_dstp_scientific_state_desc:0 "Unabhängige Institute beraten das Kabinett, ohne selbst zu einer ungewählten Technokratie zu werden."
 AOEIW30_GER_dstp_mandate_delivered:0 "Die Republik verwalten"
 AOEIW30_GER_dstp_mandate_delivered_desc:0 "Gute Verwaltung macht den Verfassungsstaat im Alltag sichtbar."
 AOEIW30_GER_kpd:0 "KPD in der Regierung"
 AOEIW30_GER_kpd_desc:0 "Die KPD akzeptiert vorläufig den parlamentarischen Weg und verlangt dafür Arbeiterkontrolle, kommunale Macht und umfassende Sozialpolitik."
 AOEIW30_GER_kpd_workers_control:0 "Arbeiterkontrolle in den Großbetrieben"
 AOEIW30_GER_kpd_workers_control_desc:0 "Gewählte Betriebsräte erhalten Einsicht in Produktion, Löhne und Investitionspläne."
 AOEIW30_GER_kpd_municipal_soviets:0 "Kommunale Arbeiterräte"
 AOEIW30_GER_kpd_municipal_soviets_desc:0 "Städtische Räte lenken Wohnungsbau und Versorgung, bleiben aber an die Verfassung gebunden."
 AOEIW30_GER_kpd_parliamentary_front:0 "Eine parlamentarische Arbeiterfront"
 AOEIW30_GER_kpd_parliamentary_front_desc:0 "Die revolutionäre Linke bindet ihr unmittelbares Programm an Mehrheiten im gewählten Haus."
 AOEIW30_GER_kpd_red_welfare:0 "Brot, Miete, Arbeit"
 AOEIW30_GER_kpd_red_welfare_desc:0 "Die KPD misst die Republik an der Bäckerschlange und am Mietschalter. Öffentliche Versorgung kommt jetzt, bevor der nächste ausgeglichene Haushalt auf leeren Magen geschrieben wird."
 AOEIW30_GER_kpd_mandate_delivered:0 "Macht durch das Mandat"
 AOEIW30_GER_kpd_mandate_delivered_desc:0 "Die Partei beweist, dass organisierte Arbeit parlamentarische Macht in konkrete Rechte umsetzen kann."
