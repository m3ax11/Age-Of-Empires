 AOEIW34_GER_projected_results:0 "Der Weg zur Wahl"
 AOEIW34_GER_projected_results_desc:0 "Die Parteien kämpfen fortlaufend um Stimmen. Wahlkampf-Decisions verändern die §Yprojizierten Sitze§!; erst am Wahltag werden diese Werte in die tatsächliche Sitzverteilung des Parlaments kopiert.\n\n§YAktuelle Sitzprojektion:§!\n§RSPD§!: [?AOEIW34_GER_spd_projected|0]\n§BCDU§!: [?AOEIW34_GER_cdu_projected|0]\n§2Zentrum§!: [?AOEIW34_GER_zentrum_projected|0]\n§YLVP§!: [?AOEIW34_GER_lvp_projected|0]\n§gDNVP§!: [?AOEIW34_GER_dnvp_projected|0]\n§7DStP§!: [?AOEIW34_GER_dstp_projected|0]\n§tKPD§!: [?AOEIW34_GER_kpd_projected|0]\n\nDies ist §RNICHT§! die aktuelle Sitzverteilung. Bei jeder Wahl ersetzt die Projektion die Mandate im Bundes- oder Reichstag."
 AOEIW34_GER_divert_military_funding:0 "Militärausgaben in die Industrie umleiten"
 AOEIW34_GER_divert_military_funding_desc:0 "Ein ziviles Investitionsprogramm schafft sofort Kapazität, kostet die Regierung aber Rückhalt bei Armee und Öffentlichkeit."
