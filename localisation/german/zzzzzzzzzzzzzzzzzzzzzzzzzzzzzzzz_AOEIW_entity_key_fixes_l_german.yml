l_german:
 AOEIW14_GER_federal_economic_council_spirit:0 "Föderaler Wirtschaftsrat"
 AOEIW14_GER_federal_economic_council_spirit_desc:0 "Länder, Industrie und Arbeiterschaft koordinieren Investitionen in einem ständigen Rat statt in einem Befehlsministerium."
 AOEIW14_GER_professional_reichswehr_spirit:0 "Eine professionelle Reichswehr"
 AOEIW14_GER_professional_reichswehr_spirit_desc:0 "Deutschland bevorzugt ein kleineres, unpolitisches und technisch geschultes Heer gegenüber einer politisch mobilisierten Massenarmee."
 AOEIW14_GER_european_settlement_spirit:0 "Ein europäischer Ausgleich"
 AOEIW14_GER_european_settlement_spirit_desc:0 "Verfassungsstaat im Inneren und ausgehandelte Sicherheit nach außen machen Deutschland wohlhabend und stabil, aber weniger geeignet für leichtfertige Expansion."
 AOEIW14_USA_military_industrial_coordination_spirit:0 "Militärisch-industrielle Koordinierung"
 AOEIW14_USA_military_industrial_coordination_spirit_desc:0 "Strategische Fabriken erhalten feste Aufträge und Produktionsziele, bezahlt durch höhere zivile Lasten."
 AOEIW14_USA_air_defence_grid_spirit:0 "Das Luftverteidigungsnetz"
 AOEIW14_USA_air_defence_grid_spirit_desc:0 "Ein kontinentales Netz aus Radar, Beobachtern und Flugplätzen macht Vorwarnzeit zur nationalen Ressource."
 AOEIW14_USA_integrated_war_planning_spirit:0 "Integrierte Kriegsplanung"
 AOEIW14_USA_integrated_war_planning_spirit_desc:0 "Logistik, Luftmacht, Raketen und Atomforschung werden in einem strategischen System koordiniert."
 AOEIW20_UF_mao_rapid_industrialisation_spirit:0 "Revolutionäre Schnellindustrialisierung"
 AOEIW20_UF_mao_rapid_industrialisation_spirit_desc:0 "Massenmobilisierung und gelenkte Investitionen erzwingen Schwerindustrie im Landesinneren – zu hohen sozialen Kosten."
 AOEIW_HIST_GER_four_year_plan_spirit:0 "The Four Year Plan"
 AOEIW_HIST_GER_four_year_plan_spirit_desc:0 "German industry is reorganised to prepare the economy for war within four years."
 AOEIW_HIST_GER_blitzkrieg_machine_spirit:0 "A Machine for Blitzkrieg"
 AOEIW_HIST_GER_blitzkrieg_machine_spirit_desc:0 "Armour, motorised forces, radios and tactical aviation are integrated into a single operational system."
 AOEIW_world_USA_federal_mobilisation_spirit:0 "AOEIW world USA federal mobilisation"
 AOEIW_world_USA_federal_mobilisation_spirit_desc:0 "AOEIW world USA federal mobilisation"
