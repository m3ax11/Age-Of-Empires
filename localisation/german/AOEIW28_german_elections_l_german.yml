l_german:
 AOEIW28_GER_parliament:0 "Öffnet die Tore des Reichstags"
 AOEIW28_GER_parliament_desc:0 "Abgeordnete kehren in eine Kammer zurück, die Erlasse, Einschüchterung und Schweigen erlebt hat. Die erste Abstimmung entscheidet, wer unter der wiederhergestellten Verfassung regieren kann."
 AOEIW28_GER_spd_cabinet:0 "SPD-geführte Koalition"
 AOEIW28_GER_spd_cabinet_desc:0 "Dieses Kabinettsprogramm gilt nur, solange seine Koalition regiert."
 AOEIW28_GER_spd:0 "SPD in der Regierung"
 AOEIW28_GER_spd_desc:0 "Dieses Programm ist sichtbar, solange die Partei zur bestätigten Parlamentskoalition gehört. Zwei Regierungsparteien öffnen zwei Programme."
 AOEIW28_GER_spd_policy_1:0 "Tarifvertragsgesetz"
 AOEIW28_GER_spd_policy_1_desc:0 "Betriebsräte und Arbeitgeber handeln verbindliche Tarifverträge aus. Sozialer Frieden hat einen fiskalischen Preis."
 AOEIW28_GER_spd_policy_2:0 "Baut die Siedlungen"
 AOEIW28_GER_spd_policy_2_desc:0 "Sozialdemokratische Städte beschäftigen Maurer mit Licht, Wasser und bezahlbaren Wohnungen. Berlin stellt den Kredit; die Gemeinden wählen den Baugrund."
 AOEIW28_GER_spd_settlement:0 "Parlamentarische Sozialpolitik"
 AOEIW28_GER_spd_settlement_desc:0 "Sozialreformen werden durch die gewählte Kammer gesichert, unabhängig davon, ob Präsident oder konstitutioneller Kaiser an der Staatsspitze steht."
 AOEIW28_GER_spd_mandate:0 "SPD-geführte Koalition"
 AOEIW28_GER_zentrum_cabinet:0 "Zentrum-geführte Koalition"
 AOEIW28_GER_zentrum_cabinet_desc:0 "Dieses Kabinettsprogramm gilt nur, solange seine Koalition regiert."
 AOEIW28_GER_zentrum:0 "Zentrum in der Regierung"
 AOEIW28_GER_zentrum_desc:0 "Dieses Programm ist sichtbar, solange die Partei zur bestätigten Parlamentskoalition gehört. Zwei Regierungsparteien öffnen zwei Programme."
 AOEIW28_GER_zentrum_policy_1:0 "Verständigung mit den Ländern"
 AOEIW28_GER_zentrum_policy_1_desc:0 "Die Koalition tauscht zentrale Verwaltungsfreiheit gegen die Zusammenarbeit der Landesregierungen."
 AOEIW28_GER_zentrum_policy_2:0 "Der soziale Marktkompromiss"
 AOEIW28_GER_zentrum_policy_2_desc:0 "Kredite für kleinere Unternehmen und ausgehandelter Sozialschutz verbinden ländliche Wahlkreise mit Industriestädten."
 AOEIW28_GER_zentrum_settlement:0 "Die verfassungstreue Mitte"
 AOEIW28_GER_zentrum_settlement_desc:0 "Eine stabile Mitte muss das Parlament sowohl gegen exekutive Alleingänge als auch gegen Verfassungsgegner verteidigen."
 AOEIW28_GER_zentrum_mandate:0 "Zentrum-geführte Koalition"
 AOEIW28_GER_liberal_cabinet:0 "Liberale Koalition"
 AOEIW28_GER_liberal_cabinet_desc:0 "Dieses Kabinettsprogramm gilt nur, solange seine Koalition regiert."
 AOEIW28_GER_liberal:0 "LVP in der Regierung"
 AOEIW28_GER_liberal_desc:0 "Das Programm der Liberalen Volkspartei bleibt nur sichtbar, solange die LVP der Regierungskoalition angehört."
 AOEIW28_GER_liberal_policy_1:0 "Unabhängige Gerichte"
 AOEIW28_GER_liberal_policy_1_desc:0 "Eine ministerielle Anordnung darf kein Gerichtsurteil mehr aushebeln. Rechtssicherheit bindet das Kabinett ebenso wie seine Gegner."
 AOEIW28_GER_liberal_policy_2:0 "Universitäten ohne Protektion"
 AOEIW28_GER_liberal_policy_2_desc:0 "Forschungsstellen werden nach Qualifikation statt nach Hofeinfluss oder Parteitreue vergeben."
 AOEIW28_GER_liberal_settlement:0 "Regieren mit öffentlicher Zustimmung"
 AOEIW28_GER_liberal_settlement_desc:0 "Die Regierung bindet ihr Programm an parlamentarische Debatten und einen veröffentlichten Haushalt statt an einen dauerhaften Ausnahmezustand."
 AOEIW28_GER_liberal_mandate:0 "Liberale Koalition"
 AOEIW28_GER_conservative_cabinet:0 "Konservative Koalition"
 AOEIW28_GER_conservative_cabinet_desc:0 "Dieses Kabinettsprogramm gilt nur, solange seine Koalition regiert."
 AOEIW28_GER_conservative:0 "DNVP in der Regierung"
 AOEIW28_GER_conservative_desc:0 "Das nationalkonservative Programm bleibt nur sichtbar, solange die DNVP der Reichstagskoalition angehört."
 AOEIW28_GER_conservative_policy_1:0 "Der Agrarkreditpakt"
 AOEIW28_GER_conservative_policy_1_desc:0 "Agrarkredite und ländliche Infrastruktur sichern konservative Wahlkreise, ohne die Gesetzgebung an die Stände abzutreten."
 AOEIW28_GER_conservative_policy_2:0 "Parlamentarischer Wehretat"
 AOEIW28_GER_conservative_policy_2_desc:0 "Das Heer erhält einen verlässlichen Beschaffungsetat, doch das Parlament behält die Kontrolle über die Abrechnung."
 AOEIW28_GER_conservative_settlement:0 "Ordnung unter der Verfassung"
 AOEIW28_GER_conservative_settlement_desc:0 "Konservative Politik kann Kontinuität schützen, ohne Wahlen abzuschaffen. Für das Kabinett gelten dieselben Verfassungsregeln wie für seine Gegner."
 AOEIW28_GER_conservative_mandate:0 "Konservative Koalition"
 AOEIW28_GER_confidence:0 "Eine Regierung mit Vertrauen"
 AOEIW28_GER_confidence_desc:0 "Ein abgeschlossenes Koalitionsprogramm verankert eine verlässliche parlamentarische Regierung. Verfassungsordnung und imperiale Verwaltung ruhen auf parlamentarischer Zustimmung statt auf einem leeren Wahlversprechen."
 AOEIW28_elections.1.t:0 "Eine neue parlamentarische Mehrheit"
 AOEIW28_elections.1.d:0 "Die Stimmen sind ausgezählt. Erteile einer führungsfähigen Fraktion den Regierungsauftrag, lade bis zu zwei kleinere kompatible Partner ein und vereidige ein Kabinett mit mindestens 51 Sitzen."
 AOEIW28_GER_parliament_category:0 "Parlament und Koalitionsbildung"
 AOEIW28_GER_parliament_category_desc:0 "Monate seit dem Mandat: [?AOEIW28_GER_months|0]/48.\nNominierte Parteien: [?AOEIW29_GER_candidate_count|0]/3.\nKoalitionssitze: [?AOEIW30_GER_coalition_seats|0]/[?AOEIW30_GER_majority_seats|0] benötigt.\n\n§YEndgültiges Wahlergebnis:§!\n§RSPD§!: [?AOEIW30_GER_spd_seats|0] | §BCDU§!: [?AOEIW30_GER_cdu_seats|0] | §2Zentrum§!: [?AOEIW30_GER_zentrum_seats|0]\n§YLVP§!: [?AOEIW30_GER_lvp_seats|0] | §gDNVP§!: [?AOEIW30_GER_dnvp_seats|0] | §7DStP§!: [?AOEIW30_GER_dstp_seats|0] | §tKPD§!: [?AOEIW30_GER_kpd_seats|0]\n\nErteile zuerst einer Fraktion den Regierungsauftrag und lade anschließend bis zu zwei kompatible Partner ein. Nur die Programme der vereidigten Regierungsparteien erscheinen im Fokusbaum."
 AOEIW28_GER_early_election:0 "Das Parlament auflösen"
 AOEIW28_GER_early_election_desc:0 "Eine vorgezogene Wahl erzeugt eine neue Sitzverteilung und ermöglicht eine andere Koalition, kostet aber Stabilität und politische Macht."
 AOEIW28_civic_research:0 "Ziviles Forschungsprogramm"
