 AOEIW26_ENG_cabinet_government_act:0 "Das Kabinettsregierungsgesetz"
 AOEIW26_ENG_cabinet_government_act_desc:0 "Eine schriftliche Ordnung legt Ministerverantwortung, Rechte des Unterhauses und die verfassungsmäßigen Grenzen königlicher Eingriffe fest."
 AOEIW26_ENG_crown_in_parliament:0 "Die Krone im Parlament"
 AOEIW26_ENG_crown_in_parliament_desc:0 "Die Monarchie bleibt Teil der parlamentarischen Verfassung und stiftet Kontinuität, ohne eine eigene politische Befehlsgewalt zu behalten."
 AOEIW26_ENG_imperial_parliament:0 "Ein imperiales Parlament"
 AOEIW26_ENG_imperial_parliament_desc:0 "Vertreter Großbritanniens und der Dominions tagen in einer ständigen Bundeskammer mit Zuständigkeit für Verteidigung, Handel und Außenpolitik."
 AOEIW26_ENG_common_defence_treasury:0 "Der gemeinsame Verteidigungshaushalt"
 AOEIW26_ENG_common_defence_treasury_desc:0 "Ein gemeinsamer Haushalt und ein Beschaffungsrat verwandeln imperiale Konsultation in Divisionen, Schiffe und Flugzeuge für die gesamte Föderation."
 AOEIW26_ENG_trades_union_congress:0 "Den Gewerkschaftskongress stärken"
 AOEIW26_ENG_trades_union_congress_desc:0 "Die organisierte Arbeiterschaft erhält eine feste Rolle in der Wirtschaftsplanung und beim Neuaufbau der Beziehungen zu den Arbeitern des Empire."
 AOEIW26_ENG_socialise_commanding_heights:0 "Die Schlüsselindustrien vergesellschaften"
 AOEIW26_ENG_socialise_commanding_heights_desc:0 "Kohle, Eisenbahn, Stahl und Rüstung gehen in öffentliches Eigentum über und geben dem Volks-Commonwealth eine verteidigungsfähige Industriebasis."
 AOEIW26_JAP_imperial_conference:0 "Die kaiserliche Konferenz einberufen"
 AOEIW26_JAP_imperial_conference_desc:0 "Kabinett, Hof und Teilstreitkräfte akzeptieren ein gemeinsames Verfahren zur politischen Entscheidung, bevor Fraktionskämpfe erneut in Gewalt münden."
 AOEIW26_JAP_cabinet_above_factions:0 "Ein Kabinett über den Fraktionen"
 AOEIW26_JAP_cabinet_above_factions_desc:0 "Ernennungen und Haushalte werden vom Kabinett kontrolliert, sodass weder Heerescliquen noch Parteiapparate ein eigenes Vetorecht behalten."
 AOEIW26_JAP_showa_restoration_councils:0 "Die Räte der Shōwa-Restauration"
 AOEIW26_JAP_showa_restoration_councils_desc:0 "Junge Offiziere und patriotische Verbände tragen den Kaiserlichen Weg in Provinzen, Schulen und Reservevereine."
 AOEIW26_JAP_army_of_national_essence:0 "Armee des nationalen Wesens"
 AOEIW26_JAP_army_of_national_essence_desc:0 "Geistige Mobilisierung, Angriffswille und Gehorsam gegenüber dem Kaiser werden zum Kern jeder Formation."
 AOEIW26_JAP_diet_budget_supremacy:0 "Haushaltshoheit des Reichstags"
 AOEIW26_JAP_diet_budget_supremacy_desc:0 "Keine Erweiterung der Streitkräfte erfolgt ohne offene Bewilligung des Reichstags und Rechtfertigung vor zivilen Ministern."
 AOEIW26_JAP_end_the_military_veto:0 "Das militärische Veto beenden"
 AOEIW26_JAP_end_the_military_veto_desc:0 "Die Teilstreitkräfte verlieren die Möglichkeit, Kabinette durch das Zurückhalten ihrer Minister zu stürzen; zivile Regierung wird wieder Wirklichkeit."
 AOEIW26_SPR_council_of_the_spains:0 "Der Rat der Spanien"
 AOEIW26_SPR_council_of_the_spains_desc:0 "Kastilien, Katalonien, das Baskenland und die überseeischen Vizekönigreiche verhandeln mit der Krone in einem ständigen Rat der Reiche."
 AOEIW26_SPR_cortes_of_the_realms:0 "Die Cortes der Reiche"
 AOEIW26_SPR_cortes_of_the_realms_desc:0 "Eine repräsentative Cortes formt Provinzrechte und imperiale Pflichten zu einem dauerhaften Verfassungspakt."
 AOEIW26_SPR_unify_the_national_movement:0 "Die Nationalbewegung einen"
 AOEIW26_SPR_unify_the_national_movement_desc:0 "Falangisten, Offiziere und Zentralverwalter werden unter Madrid zu einer einzigen Befehlskette verschmolzen."
 AOEIW27_SPR_foral_compromise:0 "Der Foral-Kompromiss"
 AOEIW27_SPR_foral_compromise_desc:0 "Die historischen Fueros werden in einer loyalen Union anerkannt; im Gegenzug liefern die Regionen Steuern, Rekruten und Gehorsam gegenüber der Krone."
 AOEIW27_SPR_imperial_social_charter:0 "Die imperiale Sozialcharta"
 AOEIW27_SPR_imperial_social_charter_desc:0 "Arbeitsrechte, öffentliche Bauprogramme und provinzielle Vertretung machen die Reichsverfassung in Fabrik und Dorf greifbar."
 AOEIW27_SPR_caudillo_of_empire:0 "Caudillo des Reiches"
 AOEIW27_SPR_caudillo_of_empire_desc:0 "Die Nationalbewegung erkennt eine höchste politische und militärische Führung an und unterstellt jede Provinzorganisation dem Reichsstaat."
 AOEIW27_USA_domestic_settlement:0 "Die amerikanische Frage entscheiden"
 AOEIW27_USA_domestic_settlement_desc:0 "Der Kampf um die Herrschaft über die Republik hat eine neue Verfassungsordnung geschaffen. Erst jetzt kann sie Amerikas Stellung auf dem Kontinent bestimmen."
