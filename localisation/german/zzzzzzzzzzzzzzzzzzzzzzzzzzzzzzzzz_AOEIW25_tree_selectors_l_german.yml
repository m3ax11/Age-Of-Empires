l_german:
 AOEIW25_FRA_workers_alternative:0 "§RDie Alternative der Arbeiter§!"
 AOEIW25_FRA_workers_alternative_desc:0 "Die Republik hat weder auf die Brotschlangen noch auf die Veteranen und Fabrikräte eine Antwort gefunden. Frankreich muss entscheiden, ob Reformen die alte Ordnung noch retten können oder ob die organisierte Arbeiterschaft offen die Macht übernehmen soll."
 AOEIW25_GER_workers_front:0 "§RDie deutsche Arbeiterfront§!"
 AOEIW25_GER_workers_front_desc:0 "Die Krise des Reiches muss weder in nationalistischer Diktatur noch in dynastischer Restauration enden. Gewerkschaften, Fabrikkomitees und republikanische Milizen können eine dritte, revolutionäre Antwort vorbereiten."
 AOEIW_FRA_national_path_shortcut:0 "Nationale und imperiale Pfade"
 AOEIW_FRA_communist_path_shortcut:0 "Französische Kommune"
 AOEIW_FRA_armed_forces_shortcut:0 "Streitkräfte"
 AOEIW_GER_workers_path_shortcut:0 "Arbeiterdeutschland"
 AOEIW25_SOV_path_of_the_soviets:0 "§RDer Weg der Sowjets§!"
 AOEIW25_SOV_path_of_the_soviets_desc:0 "Betriebskomitees, Soldatenräte und illegale Parteizellen können den Protest in einen Gegenstaat verwandeln. Der sowjetische Weg verpflichtet Russland zur revolutionären Mobilisierung und zu jenem Bürgerkrieg, der über die Herrschaft im Land entscheiden muss."
