 AOEIW17_GER_workers_council_congress_long:0 "Kongress der deutschen Arbeiter- und Soldatenräte"
 AOEIW17_industrial_republics_league:0 "Bund der Industrierepubliken"

 AOEIW9_GER_politics_p3_1:0 "Die Ruhrarbeiter organisieren sich"
 AOEIW9_GER_politics_p3_1_desc:0 "Bergleute, Eisenbahner und Metallarbeiter an der Ruhr verwandeln Lohnkomitees in dauerhafte politische Organisationen. Ihre Macht liegt nicht in Reichstagsreden, sondern in der Fähigkeit, Hochöfen und Rangierbahnhöfe stillzulegen."
 AOEIW9_GER_politics_p3_2:0 "Der Reichsrätekongress"
 AOEIW9_GER_politics_p3_2_desc:0 "Delegierte drängen sich im alten preußischen Abgeordnetenhaus. Die Industriegewerkschaften fordern verbindliche Führung; die Betriebsräte antworten, dass die Revolution in den Werkhallen entschieden wird."
 AOEIW9_GER_politics_p3_3:0 "Der Generalstreik am Rhein"
 AOEIW9_GER_politics_p3_3_desc:0 "Kohlezüge stehen, Hochöfen erkalten und Lastkähne bleiben vertäut. Der Streik kann die Reichsgewalt brechen, doch jede ausgefallene Schicht kostet Maschinen und Waffen für die Zeit danach."
 AOEIW9_GER_politics_p3_4:0 "Die Rote Front bewaffnen"
 AOEIW9_GER_politics_p3_4_desc:0 "Roter Frontkämpferbund und Betriebswehren sichern Depots, Brücken und Ratshäuser. Ihr Eifer ist erheblich; ihre Eignung für einen modernen Krieg ist es noch nicht."
 AOEIW9_GER_politics_p3_5:0 "Die preußische Offiziersherrschaft brechen"
 AOEIW9_GER_politics_p3_5_desc:0 "Die politische Macht der preußischen Offizierskaste muss enden. Die Räte müssen dennoch entscheiden, ob Ingenieure und Fachoffiziere unter Aufsicht weiterdienen dürfen."
 AOEIW9_GER_politics_p3_6:0 "Die Ministerien besetzen"
 AOEIW9_GER_politics_p3_6_desc:0 "Fahrpläne, Fernmeldezentralen und Rüstungsbücher sind wichtiger als leere Paläste. Rätegarden besetzen die Ministerien und unterstellen den Verwaltungsapparat dem Revolutionskongress."
 AOEIW9_GER_politics_p3_7:0 "Den Arbeiterbund ausrufen"
 AOEIW9_GER_politics_p3_7_desc:0 "Die Reichsverfassung findet keinen Gehorsam mehr. Ein Bund der Arbeiter- und Soldatenräte ersetzt das Kaiserreich, beendet sein ungleiches Bündnissystem und übernimmt ein von Streiks und Führungskrise erschüttertes Land."

 AOEIW17_GER_revolutionary_council:0 "Alle Macht den Räten!"
 AOEIW17_GER_revolutionary_council_desc:0 "Die Palastministerien stehen leer, doch Deutschland braucht weiterhin Brotzüge, Haushalte und Befehle, die auch außerhalb Berlins gelten. Die Räte werden im eigenen Namen regieren."
 AOEIW17_GER_ruhr_works_directorate:0 "Essen muss produzieren"
 AOEIW17_GER_ruhr_works_directorate_desc:0 "Hochöfen lassen sich nicht vom Rednerpult aus führen. Ingenieure, Bergleute und Gewerkschaftsdelegierte öffnen die Ruhrwerke unter einem gemeinsamen Produktionspakt."
 AOEIW17_GER_national_production_ledger:0 "Jede Drehbank zählt"
 AOEIW17_GER_national_production_ledger_desc:0 "Kartellbücher werden beschlagnahmt; Fabrikdelegierte melden jede Maschine, Fachschicht und Materialreserve. Aufträge richten sich danach, was Deutschland tatsächlich bauen kann."
 AOEIW17_GER_quota_tank_standardisation:0 "Ein Fahrgestell, zehntausend Panzer"
 AOEIW17_GER_quota_tank_standardisation_desc:0 "Das Panzerprogramm gibt Prestigemodelle zugunsten weniger wiederholbarer Fahrgestelle und Motoren auf. Die Quote ist unerbittlich; die Werkhallen müssen den Entwurf zum Laufen bringen."
 AOEIW17_GER_mechanised_shift:0 "Die Betriebsbataillone mechanisieren"
 AOEIW17_GER_mechanised_shift_desc:0 "Die Verteidiger der Werkstore müssen zur mobilen Infanterie werden, die mit Panzerverbänden Schritt hält. Fahrzeugwerke verwandeln Rätebataillone in eine mechanisierte Feldtruppe."
 AOEIW17_GER_red_general_staff:0 "Der Rote Generalstab"
 AOEIW17_GER_red_general_staff_desc:0 "Die alte Kaste ist verschwunden, doch Stabsarbeit bleibt nötig. Politisch zuverlässige Kommandeure, Bahnplaner und beaufsichtigte Fachleute entwickeln eine Lehre aus Bewegung, Feuerkraft und industrieller Tiefe."
 AOEIW17_GER_artillery_syndicates:0 "Artilleriesyndikate der Ruhr"
 AOEIW17_GER_artillery_syndicates_desc:0 "Geschützwerke, Chemiebetriebe und Munitionsfüllstellen teilen Normen und Produktionspläne. Statt kostbarer Einzelstücke entsteht ein stetiger Strom von Geschützen und Granaten."
 AOEIW17_GER_rail_war_directorate:0 "Die Revolution fährt auf Schienen"
 AOEIW17_GER_rail_war_directorate_desc:0 "Kohle aus Essen, Geschütze aus dem Ruhrgebiet und Truppen aus Berlin müssen nach demselben Fahrplan eintreffen. Eisenbahner und Frontstäbe planen den Krieg gemeinsam."
 AOEIW17_GER_workers_armoured_corps:0 "Arbeiterpanzerkorps"
 AOEIW17_GER_workers_armoured_corps_desc:0 "Panzertruppen sind keine Privatschule einer adligen Offizierselite mehr. Besatzungen, motorisierte Infanterie und Artilleriebeobachter üben als gemeinsame revolutionäre Stoßkraft."
 AOEIW17_GER_dessau_aviation_combine:0 "Das Dessauer Flugzeugkombinat"
 AOEIW17_GER_dessau_aviation_combine_desc:0 "Die Dessauer Flugzeugwerke und ihre Zulieferer werden zu einem von Arbeitern geführten Kombinat. Einheitliche Teile und beständige Fließbänder machen Ersatzmaschinen zur Hauptaufgabe der Industrie."
 AOEIW17_GER_battlefield_air_brigades:0 "Schlachtfeldfliegerbrigaden"
 AOEIW17_GER_battlefield_air_brigades_desc:0 "Piloten und Bodenleitstellen üben mit den Panzerkorps. Luftnahunterstützung wird zur fliegenden Artillerie desselben Operationsplans wie Panzer und Geschütze."
 AOEIW17_GER_mass_airframes:0 "Flugzeugzellen im Schichtbetrieb"
 AOEIW17_GER_mass_airframes_desc:0 "Jäger und Schlachtflugzeuge werden nach vollständigen Schichten statt nach einzelnen Meisterstücken bemessen. Ersatzbestände, verteilte Teilefertigung und schnelle Reparaturen halten den Himmel umkämpft."
 AOEIW17_GER_equality_for_warsaw:0 "Gleichheit für Warschau"
 AOEIW17_GER_equality_for_warsaw_desc:0 "Polen ist kein deutsches Subjekt mehr. Berlin bietet Sicherheit und industrielle Zusammenarbeit nur auf Grundlage souveräner Gleichheit an. Warschau entscheidet, ob noch eine Partnerschaft möglich ist."
 AOEIW17_GER_rotterdam_protocol:0 "Das Rotterdamer Protokoll"
 AOEIW17_GER_rotterdam_protocol_desc:0 "Ruhrkohle und niederländische Häfen bleiben trotz des Reichspaktzerfalls wirtschaftlich verbunden. Ein sachliches Protokoll kann den Handel erhalten, ohne deutsche Vorherrschaft wiederherzustellen."
 AOEIW17_GER_kiel_sailors_councils:0 "Die Kieler Matrosenräte anerkennen"
 AOEIW17_GER_kiel_sailors_councils_desc:0 "Die Matrosen, die Kiel sicherten, verlangen Mitsprache über die erhaltene Flotte. Deutschland muss gewählte Ausschüsse mit dem Fachwissen einer modernen Marine versöhnen."
 AOEIW17_GER_industrial_republics_league:0 "Bund der Industrierepubliken"
 AOEIW17_GER_industrial_republics_league_desc:0 "Die alte Rangordnung aus Kaiser, Klienten und Abhängigen kehrt nicht zurück. Gleichbereite Staaten können einem Verteidigungsbund aus Bahnen, Häfen und gegenseitiger industrieller Sicherheit beitreten."
 AOEIW17_GER_fortress_of_labour:0 "Festung der Arbeit"
 AOEIW17_GER_fortress_of_labour_desc:0 "Wenn Deutschland seinen Nachbarn nicht trauen kann, verteidigt es die Revolution mit disziplinierten Fabriken, vorbereiteten Grenzen und einer für den langen Kontinentalkrieg organisierten Bevölkerung."
 AOEIW17_GER_red_high_seas_fleet:0 "Die Rote Hochseeflotte"
 AOEIW17_GER_red_high_seas_fleet_desc:0 "Kiels politische Einigung wird in eine verlässliche Befehlskette überführt. Die Flotte bleibt erhalten, ausgebildet und zum Schutz von Küste und Seewegen fähig."
 AOEIW17_GER_machine_war_state:0 "Der Maschinenkriegsstaat"
 AOEIW17_GER_machine_war_state_desc:0 "Betriebsräte, Panzerkorps, Artilleriesyndikate, Flugzeugkombinate und Bahnplaner arbeiten nun als ein System. Das revolutionäre Deutschland ist zur arbeiterselbstverwalteten Maschine des verbundenen Krieges geworden."

 AOEIW17_GER_factory_unrest:0 "Fabrikunruhen an der Ruhr"
 AOEIW17_GER_factory_unrest_desc:0 "Betriebskomitees fordern Vorarbeiter, Verträge und Staatsgewalt heraus. Die Produktion läuft weiter, doch jede Entscheidung ist umkämpft."
 AOEIW17_GER_general_strike:0 "Der Generalstreik am Rhein"
 AOEIW17_GER_general_strike_desc:0 "Der revolutionäre Streik lähmt Deutschlands Industrie- und Verkehrskern. Er kann das Kaiserreich stürzen, aber keine moderne Armee versorgen."
 AOEIW17_GER_red_front_militias:0 "Milizen der Roten Front"
 AOEIW17_GER_red_front_militias_desc:0 "Betriebswehren und politische Veteranen stellen Menschen und örtliche Sicherheit, stören aber Befehl und Planung."
 AOEIW17_GER_supervised_technical_officers:0 "Beaufsichtigte Fachoffiziere"
 AOEIW17_GER_supervised_technical_officers_desc:0 "Ingenieure und Stabsspezialisten bleiben unter politischer Aufsicht. Misstrauen verlangsamt Entscheidungen, doch unersetzliches Wissen bleibt erhalten."
 AOEIW17_GER_prussian_command_purged:0 "Preußische Führung gesäubert"
 AOEIW17_GER_prussian_command_purged_desc:0 "Die alte Führungskaste wurde vollständig entfernt. Politische Kontrolle ist gesichert, operative Fähigkeit muss von unten neu entstehen."
 AOEIW17_GER_postrevolution_industry_disruption:0 "Zersplitterte Industrieräte"
 AOEIW17_GER_postrevolution_industry_disruption_desc:0 "Die Eigentümer sind geflohen und der Streik ist beendet, doch örtlichen Räten fehlen gemeinsame Verträge, Normen und Materialzuteilungen."
 AOEIW17_GER_postrevolution_command_disruption:0 "Gebrochene Befehlskette"
 AOEIW17_GER_postrevolution_command_disruption_desc:0 "Die Reichsgewalt brach schneller zusammen, als ein neues Führungssystem aufgebaut werden konnte."
 AOEIW17_GER_council_pluralism:0 "Pluralistische Betriebsräte"
 AOEIW17_GER_council_pluralism_desc:0 "Örtliche Räte behalten große Selbständigkeit. Das fördert Versuche und Legitimität, verlangsamt aber die politische Führung."
 AOEIW17_GER_union_discipline:0 "Disziplin der Industriegewerkschaften"
 AOEIW17_GER_union_discipline_desc:0 "Reichsweite Gewerkschaften erzwingen geordnete Produktion, verlangen dafür jedoch ausgehandelte materielle Zugeständnisse."
 AOEIW17_GER_ruhr_works_directorate_spirit:0 "Ruhrwerksdirektorium"
 AOEIW17_GER_ruhr_works_directorate_spirit_desc:0 "Ingenieure, Gewerkschaftsvertreter und Kommissare koordinieren das Ruhrgebiet als ein Rüstungsrevier."
 AOEIW17_GER_national_production_ledger_spirit:0 "Nationales Produktionsbuch"
 AOEIW17_GER_national_production_ledger_spirit_desc:0 "Gemeinsame Buchführung ermöglicht höhere Dauerleistung und weniger störanfällige neue Fertigungslinien."
 AOEIW17_GER_quota_tank_standardisation_spirit:0 "Panzerstandardisierung nach Quote"
 AOEIW17_GER_quota_tank_standardisation_spirit_desc:0 "Panzer-IK-Kosten: §G-15 %§!\nPanzerzuverlässigkeit: §R-10 %§!\n\nRadikale Normung senkt die Kosten, während enge Fristen und unnachgiebige Quoten die mechanische Zuverlässigkeit mindern."
 AOEIW17_GER_mechanised_shift_spirit:0 "Die mechanisierte Schicht"
 AOEIW17_GER_mechanised_shift_spirit_desc:0 "Fahrzeugwerke und Betriebsbataillone sind auf günstigen Schützentransport und schnelle Bewegung ausgerichtet."
 AOEIW17_GER_red_general_staff_spirit:0 "Roter Generalstab"
 AOEIW17_GER_red_general_staff_spirit_desc:0 "Politische Kommandeure und technische Planer haben eine geschlossene revolutionäre Befehlskette geschaffen."
 AOEIW17_GER_artillery_syndicates_spirit:0 "Artilleriesyndikate"
 AOEIW17_GER_artillery_syndicates_spirit_desc:0 "Gemeinsame Geschütz- und Munitionsnormen senken Artilleriekosten, ohne Panzer, Flugzeuge oder Schiffe zu verbilligen."
 AOEIW17_GER_rail_war_directorate_spirit:0 "Eisenbahnkriegsdirektorium"
 AOEIW17_GER_rail_war_directorate_spirit_desc:0 "Bahnbau, Versorgungsknoten und Operationsfahrpläne sind für schnellen Kontinentalkrieg verzahnt."
 AOEIW17_GER_workers_armoured_corps_spirit:0 "Arbeiterpanzerkorps"
 AOEIW17_GER_workers_armoured_corps_spirit_desc:0 "Panzer, motorisierte Infanterie und Artillerie üben als einheitliche revolutionäre Kampfgruppe."
 AOEIW17_GER_workers_aviation_combine_spirit:0 "Arbeiter-Flugzeugkombinat"
 AOEIW17_GER_workers_aviation_combine_spirit_desc:0 "Genormte Jäger- und Schlachtflugzeugfertigung macht Flugzeugersatz zum industriellen Massenprozess."
 AOEIW17_GER_battlefield_air_brigades_spirit:0 "Schlachtfeldfliegerbrigaden"
 AOEIW17_GER_battlefield_air_brigades_spirit_desc:0 "Luft-Boden-Verbindungsstäbe machen Nahunterstützung zur genauen Fortsetzung von Artillerie- und Panzeroperationen."
 AOEIW17_GER_fleet_technical_compromise:0 "Technischer Flottenkompromiss"
 AOEIW17_GER_fleet_technical_compromise_desc:0 "Marineingenieure und Offiziere bleiben unter gewählter Aufsicht, während sich die Flotte an ihre neue politische Führung anpasst."
 AOEIW17_GER_sailors_command:0 "Matrosenkommando"
 AOEIW17_GER_sailors_command_desc:0 "Kiels Ausschüsse kontrollieren Ernennungen und Einsätze. Der revolutionäre Wille ist stark, doch Flottenkoordination und Werftleistung leiden."
 AOEIW17_GER_red_high_seas_fleet_spirit:0 "Rote Hochseeflotte"
 AOEIW17_GER_red_high_seas_fleet_spirit_desc:0 "Die erhaltene Flotte verbindet politische Loyalität mit stabiler technischer Führung und erneuerter Werftunterstützung."
 AOEIW17_GER_revolutionary_diplomacy_spirit:0 "Diplomatie gleicher Republiken"
 AOEIW17_GER_revolutionary_diplomacy_spirit_desc:0 "Berlin sucht industrielle Sicherheit durch Verträge unter Gleichen statt durch kaiserliche Klienten."
 AOEIW17_GER_fortress_of_labour_spirit:0 "Festung der Arbeit"
 AOEIW17_GER_fortress_of_labour_spirit_desc:0 "Der Arbeiterstaat nimmt diplomatische Isolation hin und organisiert Fabriken, Grenzen und Bevölkerung zur Verteidigung."
 AOEIW17_GER_machine_war_state_spirit:0 "Maschinenkriegsstaat"
 AOEIW17_GER_machine_war_state_spirit_desc:0 "Alle Teile des revolutionären Deutschlands bilden ein hocheffizientes Industriesystem für anhaltenden verbundenen Krieg."

 aoeiw_phase17_ger.1.t:0 "Der Berliner Rätekongress"
 aoeiw_phase17_ger.1.d:0 "Abgesandte füllen die ehemaligen Parlamentsränge. Ruhrgewerkschaften verlangen bindende Reichsquoten, örtliche Betriebsräte verteidigen ihre Selbständigkeit. Beide wollen die Revolution, doch sie streiten über die Führung der Produktion danach."
 aoeiw_phase17_ger.1.a:0 "Die Industriegewerkschaften müssen Disziplin schaffen."
 aoeiw_phase17_ger.1.b:0 "Die Macht gehört den örtlichen Räten."
 aoeiw_phase17_ger.2.t:0 "Die Offiziersfrage"
 aoeiw_phase17_ger.2.d:0 "Die preußische Befehlshierarchie hat ihre politische Macht verloren. Deutschland braucht dennoch Ingenieure, Eisenbahnoffiziere und ausgebildete Stabsplaner. Die Räte müssen Fachwissen vom Standesprivileg trennen oder beides beseitigen."
 aoeiw_phase17_ger.2.a:0 "Fachleute unter Räteaufsicht behalten."
 aoeiw_phase17_ger.2.b:0 "Die preußische Führung hinwegfegen."
 aoeiw_phase17_ger.3.t:0 "Der Deutsche Arbeiterbund"
 aoeiw_phase17_ger.3.d:0 "Die Reichsministerien sind verstummt. In Berlin rufen Abgesandte einen Bund der Arbeiter- und Soldatenräte aus, beenden die Monarchie und lösen die Rangordnung des Reichspakts auf. Die Revolution erbt gewaltige Fabriken, eine unversehrte Flotte und einen gefährlich zerrissenen Staat."
 aoeiw_phase17_ger.3.a:0 "Die Hochöfen gehören denen, die an ihnen arbeiten."
 aoeiw_phase17_ger.4.t:0 "Kiel fordert eine Einigung"
 aoeiw_phase17_ger.4.d:0 "Die Matrosen, die Kiel sicherten, verweigern die Rückkehr zu unbeschränkter Admiralsherrschaft. Marineingenieure warnen, dass Ausschüsse keine Schusstafeln, Turbinenwartung oder Flottenlogistik improvisieren können."
 aoeiw_phase17_ger.4.a:0 "Technische Führung unter gewählter Aufsicht."
 aoeiw_phase17_ger.4.b:0 "Die Matrosen führen ihre eigene Flotte."
 aoeiw_phase17_ger.5.t:0 "Der Reichspakt zerfällt"
 aoeiw_phase17_ger.5.d:0 "Berlins Revolution hat die deutsche Reichsherrschaft und damit Polens Untertanenstatus beendet. Warschau ist endlich souverän. Nun muss Polen zwischen bewaffneter Distanz und einem gleichberechtigten Vertrag wählen."
 aoeiw_phase17_ger.5.a:0 "Polen schützt seine Unabhängigkeit allein."
 aoeiw_phase17_ger.5.b:0 "Mit einem gleichen Nachbarn kann man verhandeln."
 aoeiw_phase17_ger.6.t:0 "Die Ruhr jenseits der Grenze"
 aoeiw_phase17_ger.6.d:0 "Der Reichspakt ist verschwunden, doch niederländische Häfen und Ruhrindustrie bleiben durch Fluss, Schiene und Vertrag verbunden. Den Haag wählt zwischen atlantischer Neutralität und einem streng gleichberechtigten Industrieabkommen."
 aoeiw_phase17_ger.6.a:0 "Die politische Tür schließen und zum Atlantik blicken."
 aoeiw_phase17_ger.6.b:0 "Ein Ruhr-Rotterdam-Abkommen aushandeln."

 AOEIW17_revolutionary_betrayal:0 "Revolutionärer Bruch"
 AOEIW17_equal_republics:0 "Beziehungen gleicher Republiken"
 AOEIW17_pragmatic_industrial_relations:0 "Pragmatische Industriebeziehungen"
