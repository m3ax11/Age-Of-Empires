l_german:
 AOEIW29_GER_spd_works_councils:0 "Betriebsräte am Verhandlungstisch"
 AOEIW29_GER_spd_works_councils_desc:0 "Arbeitnehmervertretung muss die Werkstätten erreichen, in denen Produktionsziele entstehen. Verbindliche Schlichtung verhindert, dass jeder Streit ganze Schichten lahmlegt."
 AOEIW29_GER_spd_housing_cooperatives:0 "Wohnungsgenossenschaften an der Ruhr"
 AOEIW29_GER_spd_housing_cooperatives_desc:0 "Kommunale Wohnungsvereine erhalten Baupläne und Kredite. Besserer Wohnraum macht Industriearbeiter unabhängiger von Werkswohnungen."
 AOEIW29_GER_spd_labour_congress:0 "Der Arbeiter- und Gemeindekongress"
 AOEIW29_GER_spd_labour_congress_desc:0 "Gewerkschaften und Stadtverwaltungen müssen sich vor der Haushaltsdebatte darauf einigen, welche Versprechen finanzierbar sind."
 AOEIW29_GER_spd_social_insurance:0 "Ein nationaler Sozialversicherungspakt"
 AOEIW29_GER_spd_social_insurance_desc:0 "Krankheits- und Arbeitslosigkeitsrisiken werden gemeinsam getragen. Die Regierung gewinnt soziale Sicherheit, muss den Ausgleich aber politisch absichern."
 AOEIW29_GER_spd_social_insurance_idea:0 "Ein nationaler Sozialversicherungspakt"
 AOEIW29_GER_spd_social_insurance_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_spd_industrial_bargain:0 "Die Republik des industriellen Ausgleichs"
 AOEIW29_GER_spd_industrial_bargain_desc:0 "Produktivitätsvereinbarungen werden mit organisierter Arbeit ausgehandelt, statt jeden Betrieb ministeriell zu dirigieren."
 AOEIW29_GER_spd_industrial_bargain_idea:0 "Die Republik des industriellen Ausgleichs"
 AOEIW29_GER_spd_industrial_bargain_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_spd_mandate_delivered:0 "Brot, Arbeit und parlamentarische Macht"
 AOEIW29_GER_spd_mandate_delivered_desc:0 "Unser Mandat bemisst sich an durchsetzbaren Rechten und funktionierenden Arbeitsplätzen, nicht an Erlassen bis zum nächsten Kabinettswechsel."
 AOEIW29_GER_zentrum_regional_compacts:0 "Garantien für die Länder"
 AOEIW29_GER_zentrum_regional_compacts_desc:0 "Landesregierungen akzeptieren gemeinsame Standards gegen ein echtes Mitspracherecht bei deren Umsetzung."
 AOEIW29_GER_zentrum_cooperative_credit:0 "Genossenschaftliche Kreditbanken"
 AOEIW29_GER_zentrum_cooperative_credit_desc:0 "Genossenschaftsbanken verbinden ländliche Ersparnisse mit kleinen Werkstätten und mindern die Abhängigkeit von wenigen Industriekonzernen."
 AOEIW29_GER_zentrum_social_conference:0 "Die föderale Sozialkonferenz"
 AOEIW29_GER_zentrum_social_conference_desc:0 "Arbeitgeber, konfessionelle Verbände und organisierte Arbeit handeln einen Ausgleich aus, den die Länder tatsächlich verwalten können."
 AOEIW29_GER_zentrum_subsidiarity:0 "Subsidiarität vor zentralen Weisungen"
 AOEIW29_GER_zentrum_subsidiarity_desc:0 "Die Verwaltung wird regionalen Einrichtungen anvertraut. Ihre Zusammenarbeit trägt weiter als ein ständiger Streit um zentrale Erlasse."
 AOEIW29_GER_zentrum_subsidiarity_idea:0 "Subsidiarität vor zentralen Weisungen"
 AOEIW29_GER_zentrum_subsidiarity_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_zentrum_national_standards:0 "Gemeinsame soziale Standards"
 AOEIW29_GER_zentrum_national_standards_desc:0 "Nationale Mindeststandards bleiben mit lokaler Umsetzung verbunden. Einheitlichkeit stärkt den Ausgleich, verlangt aber mehr Koordination."
 AOEIW29_GER_zentrum_national_standards_idea:0 "Gemeinsame soziale Standards"
 AOEIW29_GER_zentrum_national_standards_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_zentrum_mandate_delivered:0 "Ein Bund aus Zustimmung"
 AOEIW29_GER_zentrum_mandate_delivered_desc:0 "Die Mitte besteht, weil sich Landesregierungen und gesellschaftliche Organisationen im Verfassungskompromiss wiederfinden."
 AOEIW29_GER_liberal_civil_liberties:0 "Eine Charta der Freiheitsrechte"
 AOEIW29_GER_liberal_civil_liberties_desc:0 "Polizei und Ministerien erhalten einklagbare Grenzen. Ein freies Parlament braucht Bürger, die es ohne Existenzverlust kritisieren können."
 AOEIW29_GER_liberal_research_endowments:0 "Unabhängige Forschungsstiftungen"
 AOEIW29_GER_liberal_research_endowments_desc:0 "Langfristige Stipendien schützen Labore vor jedem Wechsel im Ministerialhaushalt und fördern offenen technischen Austausch."
 AOEIW29_GER_liberal_free_democrats:0 "Die Freien Demokraten vereinen"
 AOEIW29_GER_liberal_free_democrats_desc:0 "Die liberalen Fraktionen bündeln sich in einem freidemokratischen Programm: Verfassungsrechte, freie Wissenschaft und verantwortliche Regierung."
 AOEIW29_GER_liberal_competition:0 "Geschlossene Industriekartelle aufbrechen"
 AOEIW29_GER_liberal_competition_desc:0 "Wettbewerb öffnet Beschaffung für leistungsfähige Firmen außerhalb der etablierten Konzerne. Höhere Effizienz verlangt schwierige Verhandlungen."
 AOEIW29_GER_liberal_competition_idea:0 "Geschlossene Industriekartelle aufbrechen"
 AOEIW29_GER_liberal_competition_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_liberal_innovation:0 "Eine Republik der Forschung"
 AOEIW29_GER_liberal_innovation_desc:0 "Das liberale Mandat konzentriert sich auf Forschungseinrichtungen und technische Ausbildung statt auf eine breite Konfrontation mit der Industrie."
 AOEIW29_GER_liberal_innovation_idea:0 "Eine Republik der Forschung"
 AOEIW29_GER_liberal_innovation_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_liberal_mandate_delivered:0 "Freiheit als Verwaltungspraxis"
 AOEIW29_GER_liberal_mandate_delivered_desc:0 "Öffentliche Rechnungslegung, unabhängige Gerichte und freie Forschung müssen auch dann funktionieren, wenn die nächste Wahl unsere Gegner ins Amt bringt."
 AOEIW29_GER_conservative_rural_infrastructure:0 "Wege zu den Agrarmärkten"
 AOEIW29_GER_conservative_rural_infrastructure_desc:0 "Verkehrsinvestitionen verbinden Höfe mit verlässlichen Abnehmern, statt Agrarpolitik auf Schutzparolen zu beschränken."
 AOEIW29_GER_conservative_procurement_audit:0 "Rüstungsverträge prüfen"
 AOEIW29_GER_conservative_procurement_audit_desc:0 "Parlamentarische Beschaffungskontrolle macht einen starken Wehretat tragfähiger und erschwert seine Umleitung in Patronage."
 AOEIW29_GER_conservative_constitutional_right:0 "Die verfassungstreue Rechte"
 AOEIW29_GER_conservative_constitutional_right_desc:0 "Konservative Abgeordnete verpflichten sich auf Mehrheiten, statt das Parlament durch Offizierskorps oder Stände zu ersetzen."
 AOEIW29_GER_conservative_rural_settlement:0 "Ein dauerhafter ländlicher Ausgleich"
 AOEIW29_GER_conservative_rural_settlement_desc:0 "Berechenbare Kredite und Vertretung sichern ländliche Zusammenarbeit. Stabilität erhält Vorrang vor einem schnellen Rüstungsschub."
 AOEIW29_GER_conservative_rural_settlement_idea:0 "Ein dauerhafter ländlicher Ausgleich"
 AOEIW29_GER_conservative_rural_settlement_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_conservative_defence_industry:0 "Die verfassungstreue Wehrwirtschaft"
 AOEIW29_GER_conservative_defence_industry_desc:0 "Ein ausgehandeltes Wehrprogramm gibt Fabriken verlässliche Aufträge, ohne den gewählten Haushaltsausschuss auszuschalten."
 AOEIW29_GER_conservative_defence_industry_idea:0 "Die verfassungstreue Wehrwirtschaft"
 AOEIW29_GER_conservative_defence_industry_idea_desc:0 "Gilt nur, solange diese Partei der Regierung angehört."
 AOEIW29_GER_conservative_mandate_delivered:0 "Kontinuität ohne Notstandsregierung"
 AOEIW29_GER_conservative_mandate_delivered_desc:0 "Eine konservative Regierung beweist Stärke, indem sie die Verfassung auch dann akzeptiert, wenn diese ihre eigenen Minister bindet."
 AOEIW29_GER_coalition_coordination:0 "Koalitionsabstimmung"
 AOEIW29_GER_coalition_coordination_desc:0 "Zwei Parteien teilen die Regierung und öffnen beide Programme. Die gemeinsame Linie kostet politische Macht."
 AOEIW29_GER_nominate_spd:0 "SPD nominieren"
 AOEIW29_GER_nominate_spd_desc:0 "Wähle bis zu zwei Koalitionspartner und bestätige anschließend die Regierung. Eine Nominierung allein wechselt das amtierende Kabinett nicht."
 AOEIW29_GER_withdraw_spd:0 "SPD zurückziehen"
 AOEIW29_GER_withdraw_spd_desc:0 "Wähle bis zu zwei Koalitionspartner und bestätige anschließend die Regierung. Eine Nominierung allein wechselt das amtierende Kabinett nicht."
