 AOEIW29_GER_withdraw_liberal_desc:0 "Wähle bis zu zwei Koalitionspartner und bestätige anschließend die Regierung. Eine Nominierung allein wechselt das amtierende Kabinett nicht."
 AOEIW29_GER_nominate_conservative:0 "Konservative nominieren"
 AOEIW29_GER_nominate_conservative_desc:0 "Wähle bis zu zwei Koalitionspartner und bestätige anschließend die Regierung. Eine Nominierung allein wechselt das amtierende Kabinett nicht."
