 AOEIW29_GER_withdraw_conservative_desc:0 "Wähle bis zu zwei Koalitionspartner und bestätige anschließend die Regierung. Eine Nominierung allein wechselt das amtierende Kabinett nicht."
 AOEIW29_GER_confirm_coalition:0 "Parlamentskoalition bestätigen"
 AOEIW29_GER_confirm_coalition_desc:0 "Eine oder zwei nominierte Parteien übernehmen die Regierung. Ihre Fokusprogramme erscheinen; Oppositionsprogramme verschwinden. Fertige Projekte bleiben erhalten. Zweierkoalitionen zahlen einen Abstimmungsaufwand."
 AOEIW29_GER_open_parliament:0 "Die Koalition in den Decisions aushandeln"
 AOEIW29_civic_bonus:0 "Parlamentarisches Entwicklungsprogramm"
