l_german:
 AOEIW_IMM_GER_root:0 "Die Reichskonferenz"
 AOEIW_IMM_GER_root_desc:0 "Das Reich kann dem kommenden Ringen nicht mit Routineerlassen begegnen. Krone, Heer, Industrie und Parlament müssen entscheiden, welches Deutschland sie verteidigen wollen."
 AOEIW_IMM_GER_federal_1:0 "Der Bundesrat tritt vor den Kaiser"
 AOEIW_IMM_GER_federal_1_desc:0 "Die Königreiche unterstützen die Krone, aber keinen Blankoscheck aus Berlin. Ihre Gesandten verlangen Mitsprache bei Steuern, Mobilmachung und den Pflichten des Reichspakts."
 AOEIW_IMM_GER_federal_2:0 "Der Handel mit dem Reichstag"
 AOEIW_IMM_GER_federal_2_desc:0 "Ein dauerhaftes Reich soll auf ausgehandelter Loyalität, sozialem Frieden und einem Parlament beruhen, das Verantwortung für den Sieg trägt."
