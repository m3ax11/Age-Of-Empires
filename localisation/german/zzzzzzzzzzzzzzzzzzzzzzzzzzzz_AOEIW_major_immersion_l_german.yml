 AOEIW_IMM_GER_federal_spirit_desc:0 "Ein dauerhaftes Reich soll auf ausgehandelter Loyalität, sozialem Frieden und einem Parlament beruhen, das Verantwortung für den Sieg trägt."
 AOEIW_IMM_GER_continental_spirit:0 "Das Berliner System"
 AOEIW_IMM_GER_continental_spirit_desc:0 "Berlin wird den Kontinent durch Mobilmachungspläne, Militärmissionen und eine integrierte strategische Wirtschaft binden."
 AOEIW_IMM_GER_weltpolitik_spirit:0 "Ein Reich jenseits Europas"
 AOEIW_IMM_GER_weltpolitik_spirit_desc:0 "Deutschland wird seine Macht wieder an Ozeanen, Überseestützpunkten und der Reichweite der Kaiserlichen Marine messen."
 AOEIW_IMM_FRA_marshalate_spirit:0 "Das Marschallat Frankreichs"
 AOEIW_IMM_FRA_marshalate_spirit_desc:0 "Das Heer erklärt, nur ein nationales Direktorium unter Marschall Weygand könne die Kabinettslähmung beenden und Frankreich auf den totalen Krieg vorbereiten."
 AOEIW_IMM_FRA_grandeur_spirit:0 "Die zweite imperiale Grandeur"
 AOEIW_IMM_FRA_grandeur_spirit_desc:0 "Der imperiale Staat wird die Kräfte des Mutterlandes und der Kolonien unter einer einzigen Vision französischer Größe vereinen."
 AOEIW_IMM_FRA_union_spirit:0 "Die Republik der nationalen Verteidigung"
 AOEIW_IMM_FRA_union_spirit_desc:0 "Eine breite bürgerliche Koalition kann Frankreich verteidigen, ohne die Nation dem Palast oder der Kaserne auszuliefern."
 AOEIW_IMM_ENG_crown_spirit:0 "Der Frieden des Königs"
 AOEIW_IMM_ENG_crown_spirit_desc:0 "Der Souverän wird zum sichtbaren Mittelpunkt der Regierung und Schiedsrichter einer disziplinierten nationalen Koalition."
 AOEIW_IMM_ENG_federation_spirit:0 "Die Föderation des Empire"
 AOEIW_IMM_ENG_federation_spirit_desc:0 "Das Empire wird von einer Hierarchie der Besitzungen in eine ausgehandelte Föderation gemeinsamer Verteidigung verwandelt."
 AOEIW_IMM_ENG_commons_spirit:0 "Das demokratische Arsenal"
 AOEIW_IMM_ENG_commons_spirit_desc:0 "Das Parlament wird soziale Sicherheit mit Aufrüstung verbinden und beweisen, dass eine Demokratie mobilisieren kann, ohne sich selbst aufzugeben."
 AOEIW_IMM_SOV_autocracy_spirit:0 "Eine erneuerte Autokratie"
 AOEIW_IMM_SOV_autocracy_spirit_desc:0 "Der Thron wird durch eine professionelle Kanzlei, disziplinierte Gouverneure und eine eindeutige Befehlskette regieren."
 AOEIW_IMM_SOV_stavka_spirit:0 "Die eiserne Grenze"
 AOEIW_IMM_SOV_stavka_spirit_desc:0 "Das Heer fordert strategische Tiefe, moderne Logistik und die Vollmacht, die Westgrenze ohne politische Einmischung vorzubereiten."
 AOEIW_IMM_SOV_zemstvo_spirit:0 "Russland erneuert"
 AOEIW_IMM_SOV_zemstvo_spirit_desc:0 "Provinziale Institutionen und eine bindende Charta könnten die Völker des Reiches versöhnen, bevor Zwang es zerstört."
 AOEIW_IMM_USA_executive_spirit:0 "Die unteilbare Union"
 AOEIW_IMM_USA_executive_spirit_desc:0 "Eine zentralisierte Exekutive wird den Wiederaufbau koordinieren und die Wiedervereinigung zum unumstrittenen Staatszweck machen."
 AOEIW_IMM_USA_arsenal_spirit:0 "Der Koloss erwacht"
 AOEIW_IMM_USA_arsenal_spirit_desc:0 "Massenproduktion, standardisierte Beschaffung und kontinentale Infrastruktur werden die verbliebene Industrie in entscheidende Macht verwandeln."
 AOEIW_IMM_USA_convention_spirit:0 "Eine versöhnte Republik"
 AOEIW_IMM_USA_convention_spirit_desc:0 "Ein erneuerter Verfassungskompromiss wird entfremdeten Amerikanern eine Union bieten, zu der sie zurückkehren wollen, statt nur eine, die sie fürchten."
 AOEIW_IMM_ITA_corporate_spirit:0 "Das römische Direktorium"
 AOEIW_IMM_ITA_corporate_spirit_desc:0 "Das Regime wird Partei, Syndikate und Provinzverwaltung zu einem einzigen Instrument nationaler Führung verschmelzen."
 AOEIW_IMM_ITA_mediterranean_spirit:0 "Das Mare-Nostrum-Kommando"
 AOEIW_IMM_ITA_mediterranean_spirit_desc:0 "Italien wird das zentrale Meer als seinen strategischen Innenraum behandeln und Flotte, Stützpunkte und Doktrin zu seiner Beherrschung schaffen."
 AOEIW_IMM_ITA_monarchy_spirit:0 "Die nationale Monarchie"
 AOEIW_IMM_ITA_monarchy_spirit_desc:0 "Die Monarchie wird die permanente Mobilisierung begrenzen und Stärke durch einen breiteren, legitimeren italienischen Staat suchen."
 AOEIW_IMM_JAP_army_spirit:0 "Der nördliche Schutzwall"
 AOEIW_IMM_JAP_army_spirit_desc:0 "Das Heer wird das Reich um kontinentale Sicherheit, Massenmobilisierung und entscheidende Landfeldzüge ordnen."
 AOEIW_IMM_JAP_navy_spirit:0 "Das pazifische Mandat"
 AOEIW_IMM_JAP_navy_spirit_desc:0 "Die Marine wird Ressourcen und strategische Freiheit durch Träger, Inselstützpunkte und die Beherrschung des westlichen Pazifiks sichern."
 AOEIW_IMM_JAP_court_spirit:0 "Das technokratische Kaiserreich"
 AOEIW_IMM_JAP_court_spirit_desc:0 "Zivile Planer werden die Rivalität der Teilstreitkräfte zügeln und industrielle Kapazität über Fraktionsprestige stellen."
 AOEIW_IMM_CHI_court_spirit:0 "Das erneuerte Mandat"
 AOEIW_IMM_CHI_court_spirit_desc:0 "Die Dynastie wird die Zentralgewalt durch einen disziplinierten Rat und dem Thron unmittelbar verantwortliche Gouverneure erneuern."
 AOEIW_IMM_CHI_salvation_spirit:0 "Der Krieg der nationalen Rettung"
 AOEIW_IMM_CHI_salvation_spirit_desc:0 "Das Überleben verlangt, die Fraktionen zu überwinden und Chinas Bevölkerung, Werkstätten und Tiefe zu einer einzigen Kriegsanstrengung zu formen."
 AOEIW_IMM_CHI_charter_spirit:0 "Eine konstitutionelle Dynastie"
 AOEIW_IMM_CHI_charter_spirit_desc:0 "Eine Verfassungsordnung könnte Provinzen und politische Bewegungen an die Dynastie binden, ohne einen weiteren Bürgerkrieg auszulösen."
