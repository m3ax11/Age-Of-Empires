 ITA_COMMUNES:0 "Föderation Italienischer Kommunen"
 ITA_COMMUNES_DEF:0 "die Föderation Italienischer Kommunen"
 ITA_COMMUNES_ADJ:0 "Italienisch"
 AOEIW18_ITA_council_congress:0 "Rätekongress"
 AOEIW18_ITA_council_congress_long:0 "Kongress der Arbeiter-, Bauern- und Matrosenräte"
 AOEIW18_balkan_defence_compact:0 "Balkan-Verteidigungspakt"
 AOEIW18_mediterranean_workers_compact:0 "Mittelmeer-Arbeiterpakt"

 AOEIW9_ITA_politics_p3_1:0 "Die Turiner Fabrikräte"
 AOEIW9_ITA_politics_p3_1_desc:0 "Bei FIAT, in den Eisenbahnwerkstätten und Turiner Maschinenfabriken wählen die Werkbänke wieder ihre Delegierten. Zuerst fordern sie Kontrolle über die Produktion, dann ein von Räten regiertes Italien."
 AOEIW9_ITA_politics_p3_2:0 "Die Mailänder Arbeitskammer einberufen"
 AOEIW9_ITA_politics_p3_2_desc:0 "Mailänder Gewerkschaften, sozialistische Vereine und Werkstattdelegierte können den Protest in eine revolutionäre Führung verwandeln. Sie müssen zwischen straffer Verbandskoordination und autonomen Stadtkommunen wählen."
 AOEIW9_ITA_politics_p3_3:0 "Die Aussperrung am Po"
 AOEIW9_ITA_politics_p3_3_desc:0 "Die Unternehmer antworten auf Fabrikbesetzungen mit einer Aussperrung von Piemont bis zur Lombardei. Die Räte rufen den Generalstreik aus und nehmen Produktionsverluste in Kauf."
 AOEIW9_ITA_politics_p3_4:0 "Landkomitees des Mezzogiorno"
 AOEIW9_ITA_politics_p3_4_desc:0 "Ein norditalienischer Fabrikaufstand kann das Land nicht regieren, solange der Süden unter den Latifundien bleibt. Organisatoren müssen zwischen Genossenschaften und sofortigen Zwangsabgaben wählen."
 AOEIW9_ITA_politics_p3_5:0 "Die Arditi del Popolo bewaffnen"
 AOEIW9_ITA_politics_p3_5_desc:0 "Veteranen, Eisenbahner und Nachbarschaftswehren werden zu Roten Garden organisiert. Sie schützen Räte und Arsenale, doch Begeisterung ersetzt keinen einheitlichen Stab."
 AOEIW9_ITA_politics_p3_6:0 "Matrosen in La Spezia"
 AOEIW9_ITA_politics_p3_6_desc:0 "Die Flotte darf kein nachträglicher Gedanke sein. In La Spezia und Tarent entstehen Matrosenkomitees, während Ingenieure und Offiziere Garantien für Disziplin und Wartung verlangen."
 AOEIW9_ITA_politics_p3_7:0 "Die Föderation der Kommunen ausrufen"
 AOEIW9_ITA_politics_p3_7_desc:0 "Delegierte aus Fabriken, Dörfern, Kasernen und Schiffen beseitigen das Haus Savoyen und rufen eine Föderation italienischer Kommunen aus. Monarchie und Mittelmeerliga können dies nicht überstehen."

 AOEIW18_ITA_council_of_communes:0 "Den Rat der Kommunen einsetzen"
 AOEIW18_ITA_council_of_communes_desc:0 "Der Notkongress muss zu einem funktionsfähigen Staat werden. Produktionsverbände, Städte, Landkomitees und Matrosen erhalten feste Stimmen, Haushalte und Aufgaben."
 AOEIW18_ITA_turin_national_workshops:0 "Die Turiner Nationalwerkstätten"
 AOEIW18_ITA_turin_national_workshops_desc:0 "Turins Maschinenwerke öffnen unter gewählten Produktionsräten wieder. Knappes Werkzeug wird auf Waffen konzentriert, die der neue Staat tatsächlich in Serie fertigen kann."
 AOEIW18_ITA_lombard_production_exchange:0 "Die Lombardische Produktionsbörse"
 AOEIW18_ITA_lombard_production_exchange_desc:0 "Mailand koordiniert Aufträge, Bauteile und Bahnlieferungen der lombardischen Betriebe. Offene Bücher verbinden ungenutzte Kapazität mit akutem Bedarf."
 AOEIW18_ITA_reclaim_the_latifundia:0 "Die Latifundien zurückfordern"
 AOEIW18_ITA_reclaim_the_latifundia_desc:0 "Die südliche Notpolitik weicht einer dauerhaften Ordnung. Großgrundbesitz wird gegen Getreidequoten, Landstraßen und Dienst im Kommunenheer aufgeteilt."
 AOEIW18_ITA_arsenal_of_the_po:0 "Arsenal des Po"
 AOEIW18_ITA_arsenal_of_the_po_desc:0 "Turiner Metallurgie, lombardische Präzisionsbetriebe und die Eisenbahnen des Po werden zu einem Arsenal für Geschütze, Munition und Feldreparaturen verbunden."
 AOEIW18_ITA_peoples_army_commission:0 "Die Volksarmeekommission"
 AOEIW18_ITA_peoples_army_commission_desc:0 "Milizdelegierte und technische Offiziere schaffen eine gemeinsame Befehlskette. Politische Verantwortung bleibt, doch Gefechtsbefehle können nicht von jedem Straßenrat beraten werden."
 AOEIW18_ITA_cooperative_artillery_foundries:0 "Genossenschaftliche Geschützgießereien"
 AOEIW18_ITA_cooperative_artillery_foundries_desc:0 "Brescia, Terni und nördliche Metallgenossenschaften vereinheitlichen Geschütze und Granaten. Weniger konkurrierende Modelle bringen mehr Waffen an die Front."
 AOEIW18_ITA_militias_into_divisions:0 "Milizen zu Divisionen formen"
 AOEIW18_ITA_militias_into_divisions_desc:0 "Rote Garden werden mit Versorgungstabellen, Ausbildungskadern und Ersatzdepots zu Territorialdivisionen. Die Revolution braucht erholungsfähige Formationen statt bewaffneter Menschenmengen."
 AOEIW18_ITA_alpine_adriatic_staff:0 "Der Alpen-Adria-Stab"
 AOEIW18_ITA_alpine_adriatic_staff_desc:0 "Alpenverteidigung, Adriahäfen und ihre Bahnlinien werden gemeinsam geplant. Stabsschulen lehren Versorgungssparsamkeit, vorbereitete Bewegung und Küstenoperationen."
 AOEIW18_ITA_caproni_under_council_control:0 "Caproni unter Rätekontrolle"
 AOEIW18_ITA_caproni_under_council_control_desc:0 "Capronis Werke werden als Luftfahrtkombinat geführt. Genormte Jäger, Schlacht- und Marineflugzeuge ersetzen prestigeträchtige, aber unvereinbare Kleinserien."
 AOEIW18_ITA_littoral_strike_groups:0 "Küstenkampfgruppen"
 AOEIW18_ITA_littoral_strike_groups_desc:0 "Piloten trainieren mit Küstenbeobachtern, Flottenaufklärern und Heeresverbindern. Die Luftfahrt muss Bodentruppen unterstützen und gegnerische Schiffe angreifen."
 AOEIW18_ITA_aerodromes_of_the_peninsula:0 "Flugplätze der Halbinsel"
 AOEIW18_ITA_aerodromes_of_the_peninsula_desc:0 "Eine Kette mittlerer und südlicher Flugplätze verlegt Ersatzstaffeln schnell zwischen Tyrrhenischem Meer, Adria und Sizilien."
 AOEIW18_ITA_la_spezia_sailors_congress:0 "Der Matrosenkongress von La Spezia"
 AOEIW18_ITA_la_spezia_sailors_congress_desc:0 "Die Flotte ist intakt, ihre Führung nicht. Matrosen, Werftarbeiter, Ingenieure und verbliebene Admirale müssen die revolutionäre Befehlsgewalt an Bord regeln."
 AOEIW18_ITA_fleet_of_the_communes:0 "Flotte der Kommunen"
 AOEIW18_ITA_fleet_of_the_communes_desc:0 "Aus dem Übergang entsteht eine professionelle Kommunenmarine. Politische Legitimität und technisches Können müssen zusammenleben, damit die Großkampfschiffe auslaufen."
 AOEIW18_ITA_control_the_central_sea:0 "Das zentrale Mittelmeer beherrschen"
 AOEIW18_ITA_control_the_central_sea_desc:0 "Flotte und Küstenflieger übernehmen eine gemeinsame Doktrin für die Gewässer zwischen Sizilien, Sardinien, Libyen und dem Festland."
 AOEIW18_ITA_adriatic_congress:0 "Einen Adriakongress einberufen"
 AOEIW18_ITA_adriatic_congress_desc:0 "Rom stellt den ehemaligen Ligamitgliedern eine offene Wahl: Beziehungen gleichberechtigter Völker oder ein gegen die italienische Revolution gerichtetes Bündnis."
 AOEIW18_ITA_mediterranean_workers_compact:0 "Mittelmeer-Arbeiterpakt"
 AOEIW18_ITA_mediterranean_workers_compact_desc:0 "Regierungen, die die Föderation als gleichberechtigt anerkennen, können einem Pakt für Verteidigung und industrielle Zusammenarbeit beitreten."
 AOEIW18_ITA_fortress_peninsula:0 "Festung Halbinsel"
 AOEIW18_ITA_fortress_peninsula_desc:0 "Schließt sich der Balkan gegen uns zusammen, stützen sich die Kommunen auf Berge, Küsten und Mobilisierung. Isolation wird zum Verteidigungssystem."
 AOEIW18_ITA_two_italies_in_arms:0 "Die zwei Italien unter Waffen"
 AOEIW18_ITA_two_italies_in_arms_desc:0 "Nördliche Werkstätten und südliche Genossenschaften bilden keine rivalisierenden Landeshälften mehr. Industrie und Bevölkerung tragen eine gemeinsame Kriegsanstrengung."

 AOEIW18_ITA_factory_council_agitation:0 "Agitation der Fabrikräte"
 AOEIW18_ITA_factory_council_agitation_desc:0 "Turins Räte organisieren die Arbeiter gegen die Krone und stören die Produktion, während die Bewegung wächst."
 AOEIW18_ITA_po_valley_general_strike:0 "Generalstreik in der Poebene"
 AOEIW18_ITA_po_valley_general_strike_desc:0 "Fabriken und Bahnhöfe des Nordens stehen im Kampf zwischen Unternehmern, Staat und Arbeiterschaft still."
 AOEIW18_ITA_red_guard_militias:0 "Milizen der Roten Garden"
 AOEIW18_ITA_red_guard_militias_desc:0 "Bewaffnete Arbeiter schützen die Räte, doch dezentrale Befehlsgewalt schwächt Planung und Zusammenhalt."
 AOEIW18_ITA_syndical_coordination:0 "Syndikale Koordination"
 AOEIW18_ITA_syndical_coordination_desc:0 "Nationale Industrieverbände koordinieren die Räte wirksam, verbrauchen jedoch zivile Verwaltungsressourcen."
 AOEIW18_ITA_municipal_communes:0 "Städtische Kommunen"
 AOEIW18_ITA_municipal_communes_desc:0 "Lokale Autonomie stärkt Zustimmung und Erfindungsgeist, verlangsamt jedoch die nationale politische Führung."
 AOEIW18_ITA_southern_cooperatives:0 "Südliche Genossenschaften"
 AOEIW18_ITA_southern_cooperatives_desc:0 "Freiwillige Landkomitees gewinnen Unterstützung, binden anfangs aber Arbeit und Werkzeug außerhalb der Stadtindustrie."
 AOEIW18_ITA_forced_grain_levies:0 "Erzwungene Getreideabgaben"
 AOEIW18_ITA_forced_grain_levies_desc:0 "Sofortige Beschlagnahmen versorgen Städte und Heer, erzeugen jedoch Widerstand und Verwaltungschaos."
 AOEIW18_ITA_postrevolution_industry_disruption:0 "Gestörte Industrieräte"
 AOEIW18_ITA_postrevolution_industry_disruption_desc:0 "Eigentum wechselte schneller als Buchhaltung, Aufträge und Betriebsführung. Die Räte brauchen ein nationales Produktionssystem."
 AOEIW18_ITA_postrevolution_command_disruption:0 "Zusammenbruch der königlichen Führung"
 AOEIW18_ITA_postrevolution_command_disruption_desc:0 "Die königliche Befehlskette ist zerfallen. Milizen, loyale Einheiten und technische Offiziere besitzen keinen gemeinsamen Stab."
 AOEIW18_ITA_fleet_technical_commission:0 "Technische Flottenkommission"
 AOEIW18_ITA_fleet_technical_commission_desc:0 "Ingenieure und Offiziere halten unter strenger Rätekontrolle die Flotte betriebsbereit, verursachen aber Misstrauen und Kosten."
 AOEIW18_ITA_sailors_committees:0 "Matrosenkomitees"
 AOEIW18_ITA_sailors_committees_desc:0 "Gewählte Autorität begeistert die Besatzungen, schädigt vorübergehend aber Wartungsdisziplin und Flottenorganisation."
 AOEIW18_ITA_turin_national_workshops_spirit:0 "Turiner Nationalwerkstätten"
 AOEIW18_ITA_turin_national_workshops_spirit_desc:0 "Wiedereröffnete Maschinenwerke verbinden Rätedisziplin mit konzentrierter Rüstungsfertigung."
 AOEIW18_ITA_lombard_production_exchange_spirit:0 "Lombardische Produktionsbörse"
 AOEIW18_ITA_lombard_production_exchange_spirit_desc:0 "Gemeinsame Bücher und Bauteilbörsen ermöglichen längere und effizientere Produktionsserien."
 AOEIW18_ITA_agrarian_settlement_spirit:0 "Land den Genossenschaften"
 AOEIW18_ITA_agrarian_settlement_spirit_desc:0 "Die Südordnung verbindet Landverteilung mit Straßenbau, Mobilisierung und garantierten Lieferungen."
 AOEIW18_ITA_arsenal_of_the_po_spirit:0 "Arsenal des Po"
 AOEIW18_ITA_arsenal_of_the_po_spirit_desc:0 "Der Industriekorridor am Po spezialisiert sich auf günstige Artillerie und militärische Massenproduktion."
 AOEIW18_ITA_peoples_army_commission_spirit:0 "Volksarmeekommission"
 AOEIW18_ITA_peoples_army_commission_spirit_desc:0 "Ein gemeinsamer Stab verwandelt revolutionäre Legitimität in Planung, Verstärkung und Organisation."
 AOEIW18_ITA_cooperative_artillery_foundries_spirit:0 "Genossenschaftliche Geschützgießereien"
 AOEIW18_ITA_cooperative_artillery_foundries_spirit_desc:0 "Genormte Genossenschaftsproduktion senkt die industriellen Kosten italienischer Artillerie."
 AOEIW18_ITA_militias_into_divisions_spirit:0 "Milizen zu Divisionen"
 AOEIW18_ITA_militias_into_divisions_spirit_desc:0 "Territoriale Rekrutierung und Ersatzdepots machen aus den Roten Garden ein erholungsfähiges Feldheer."
 AOEIW18_ITA_alpine_adriatic_staff_spirit:0 "Alpen-Adria-Stab"
 AOEIW18_ITA_alpine_adriatic_staff_spirit_desc:0 "Gemeinsame Gebirgs-, Bahn- und Küstenplanung mindert Verschwendung in Italiens schwieriger Geografie."
 AOEIW18_ITA_caproni_council_spirit:0 "Räte-Luftfahrtkombinat"
 AOEIW18_ITA_caproni_council_spirit_desc:0 "Genormte Jäger, Schlacht- und Marineflugzeuge machen Flugzeugersatz zu einem Industrieprogramm."
 AOEIW18_ITA_littoral_strike_groups_spirit:0 "Küstenkampfgruppen"
 AOEIW18_ITA_littoral_strike_groups_spirit_desc:0 "Luft-Boden-Verbindung und Seeaufklärung stärken italienische Flugzeuge über Küsten und Meerengen."
 AOEIW18_ITA_fleet_of_the_communes_spirit:0 "Flotte der Kommunen"
 AOEIW18_ITA_fleet_of_the_communes_spirit_desc:0 "Eine geklärte revolutionäre Führung stellt Werftleistung, Organisation und Vertrauen der Besatzungen wieder her."
 AOEIW18_ITA_control_central_sea_spirit:0 "Doktrin des zentralen Mittelmeers"
 AOEIW18_ITA_control_central_sea_spirit_desc:0 "Flottenmanöver und Marineluftfahrt werden für die engen Gewässer der Halbinsel koordiniert."
 AOEIW18_ITA_revolutionary_diplomacy_spirit:0 "Diplomatie gleicher Küsten"
 AOEIW18_ITA_revolutionary_diplomacy_spirit_desc:0 "Die Föderation bietet Zusammenarbeit der Mittelmeervölker statt Unterordnung unter Rom."
 AOEIW18_ITA_fortress_peninsula_spirit:0 "Festung Halbinsel"
 AOEIW18_ITA_fortress_peninsula_spirit_desc:0 "Politische Isolation wird mit Mobilisierung, Geländeausbau und Verteidigung des italienischen Kerns beantwortet."
 AOEIW18_ITA_two_italies_in_arms_spirit:0 "Die zwei Italien unter Waffen"
 AOEIW18_ITA_two_italies_in_arms_spirit_desc:0 "Nördliche Industrie und südliche Bevölkerung tragen nun ein einheitliches kommunales Militärsystem."

 aoeiw_phase18_ita.1.t:0 "Wer führt die Räte?"
 aoeiw_phase18_ita.1.d:0 "Die Mailänder Arbeitskammer ist voller Turiner Delegierter, städtischer Sozialisten und Eisenbahner. Industrieverbände verlangen feste Quoten; die Kommunen warnen vor neuen Präfekten in Gewerkschaftsfarben."
 aoeiw_phase18_ita.1.a:0 "Die Industrieverbände koordinieren den Kampf."
 aoeiw_phase18_ita.1.b:0 "Die Autorität steigt aus den Stadtkommunen auf."
 aoeiw_phase18_ita.2.t:0 "Brot und Land im Süden"
 aoeiw_phase18_ita.2.d:0 "Landarbeiter unterstützen die Räte, misstrauen aber einer neuen Nordregierung. Die Städte benötigen sofort Getreide; die Revolution braucht dauerhafte Legitimität."
 aoeiw_phase18_ita.2.a:0 "Erst Genossenschaften, dann Quoten."
 aoeiw_phase18_ita.2.b:0 "Städte und Rote Garden brauchen jetzt Getreide."
 aoeiw_phase18_ita.3.t:0 "Die Monarchie fällt"
 aoeiw_phase18_ita.3.d:0 "Die Ministerien sind besetzt, die Kammer zerstreut und Rätestandarten wehen über Turin, Mailand, Neapel und den Marinestützpunkten. Der Kongress beseitigt Savoyen und erklärt die Föderation Italienischer Kommunen."
 aoeiw_phase18_ita.3.a:0 "Von den Alpen bis Sizilien sind die Kommunen frei."
 aoeiw_phase18_ita.4.t:0 "Die Flotte vor Anker"
 aoeiw_phase18_ita.4.d:0 "Die Marine ist weitgehend intakt, doch Komitees kontrollieren Werften, Funkräume und Magazine. Ingenieure warnen, dass Turbinen und Feuerleitung nicht durch Zuruf geführt werden können."
 aoeiw_phase18_ita.4.a:0 "Techniker unter einer Rätekommission behalten."
 aoeiw_phase18_ita.4.b:0 "Die Führung gehört den Matrosenkomitees."
 aoeiw_phase18_ita.5.t:0 "Bukarest nach Rom"
 aoeiw_phase18_ita.5.d:0 "Mit der italienischen Monarchie verschwand auch die Mittelmeerliga. Rumänien muss zwischen einem Abwehrpakt gegen die Revolution und praktischen Beziehungen zur Föderation wählen."
 aoeiw_phase18_ita.5.a:0 "Einen Balkanschild gegen die Revolution errichten."
 aoeiw_phase18_ita.5.b:0 "Vorsichtigen Dialog mit den italienischen Räten eröffnen."
 aoeiw_phase18_ita.6.t:0 "Belgrad und die zerbrochene Liga"
 aoeiw_phase18_ita.6.d:0 "Italien beansprucht keine königliche Führung der Adria mehr, doch die Revolution beunruhigt Offiziere und inspiriert Arbeiter. Rumänien bietet Sicherheit, Rom Beziehungen der Völker."
 aoeiw_phase18_ita.6.a:0 "Mit dem Balkanschild stehen."
 aoeiw_phase18_ita.6.b:0 "Mit den Räten jenseits der Adria sprechen."
 aoeiw_phase18_ita.7.t:0 "Sofia entscheidet"
 aoeiw_phase18_ita.7.d:0 "Der Zusammenbruch der Mittelmeerliga nimmt Bulgarien seinen außenpolitischen Anker. Sofia kann einem Abwehrbund beitreten oder Handel und Nichtangriff mit der revolutionären Föderation versuchen."
 aoeiw_phase18_ita.7.a:0 "Die Balkanordnung gemeinsam verteidigen."
 aoeiw_phase18_ita.7.b:0 "Dialog mit den italienischen Kommunen halten."

 AOEIW18_revolutionary_betrayal:0 "Revolutionärer Verrat"
 AOEIW18_mediterranean_revolution:0 "Mittelmeer-Arbeiterdialog"
