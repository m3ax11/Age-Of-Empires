 AOEIW_world_TRK_logistics_desc:0 "Establish Regional Supply Commands weist den Regionaldepots klare Aufgaben zu und prüft die Versorgung von Verbänden außerhalb der Hauptstadtregion. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_mobilisation:0 "Register the National Reserve"
 AOEIW_world_TRK_mobilisation_desc:0 "Register the National Reserve erfasst Reservisten, Transportmittel und Waffen ehrlich und beendet die Fiktion von Divisionen, die nur auf Papier bestehen. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_military_final:0 "A Unified Defence System"
 AOEIW_world_TRK_military_final_desc:0 "A Unified Defence System verbindet Stabsarbeit, Reserve und Logistik zu einem Verteidigungssystem für den ersten Schock des modernen Krieges. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_diplomatic_root:0 "Eurasian neutrality"
 AOEIW_world_TRK_diplomatic_root_desc:0 "Eurasian neutrality zwingt das Außenministerium, die eigenen Bedürfnisse zu bestimmen, bevor eine Großmacht dies übernimmt. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_TRK_patron_desc:0 "Mit Renegotiate the Great-Power Relationship wird Abhängigkeit von einem Schutzherrn in konkrete Garantien, Preise und Grenzen verwandelt. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_regional:0 "Convene the Regional Mission"
 AOEIW_world_TRK_regional_desc:0 "Convene the Regional Mission eröffnet direkte Gespräche mit den Nachbarn über Eisenbahnen, Grenzen, Minderheiten und gemeinsame Sicherheit. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_ambition:0 "Assert the National Interest"
 AOEIW_world_TRK_ambition_desc:0 "Assert the National Interest geht über bloßes Überleben hinaus und formuliert eigene nationale Interessen. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_TRK_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_TRK_diplomatic_final_desc:0 "Publish the Strategic Charter veröffentlicht eine gemeinsame Strategie aus Verträgen, Handelswegen und Mobilmachungsverpflichtungen. Dieses Programm ist auf die besonderen Verhältnisse von Turkestan zugeschnitten."
 AOEIW_world_SIK_leader:0 "Sheng Shicai"
 AOEIW_world_SIK_general:0 "Ma Shaowu"
 AOEIW_world_SIK_political_root:0 "Define the Xinjiang Clique"
 AOEIW_world_SIK_political_root_desc:0 "Define the Xinjiang Clique eröffnet die grundlegende Verfassungsfrage des Landes und bestimmt, wer den Staat rechtmäßig führen darf."
 AOEIW_world_SIK_government:0 "Ürümqi Political Bureau"
 AOEIW_world_SIK_government_desc:0 "Mit Ürümqi Political Bureau wird provisorische Autorität in Ministerien verwandelt, die Steuern einziehen und Gesetze tatsächlich durchsetzen können. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_representation:0 "Balance the Political Estates"
 AOEIW_world_SIK_representation_desc:0 "Balance the Political Estates bindet vernachlässigte Regionen und gesellschaftliche Gruppen ein, doch jedes Zugeständnis begrenzt die Zentralmacht. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_security:0 "Secure Xinjiang Clique"
 AOEIW_world_SIK_security_desc:0 "Unter Secure Xinjiang Clique werden Polizei, Grenzschutz und Gerichte neu geordnet, bevor politische Gewalt dauerhaft Wurzeln schlägt. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_settlement:0 "Ratify the National Settlement"
 AOEIW_world_SIK_settlement_desc:0 "Ratify the National Settlement macht aus den bisherigen Kompromissen eine dauerhafte nationale Ordnung, die ihre Unterstützer nun verteidigen können. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_economic_root:0 "Oasis development plan"
 AOEIW_world_SIK_economic_root_desc:0 "Oasis development plan ermittelt die Engpässe, die Rohstoffe und Arbeitskräfte bislang von einer gemeinsamen Volkswirtschaft trennen. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_railways:0 "Connect the Strategic Railways"
 AOEIW_world_SIK_railways_desc:0 "Connect the Strategic Railways verbindet politische Zentren, Depots und Exportwege; das Eisenbahnnetz prägt künftig Mobilmachung und Entwicklung. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_industry:0 "Found the National Workshops"
 AOEIW_world_SIK_industry_desc:0 "Found the National Workshops schafft Werkstätten, die importierte Maschinen reparieren und schrittweise den eigenen Bedarf decken können. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_resources:0 "Survey the National Resources"
 AOEIW_world_SIK_resources_desc:0 "Mit Survey the National Resources prüfen Ingenieure, welche Vorkommen erschlossen werden können, ohne sie ausländischen Konzessionen auszuliefern. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_SIK_economic_final_desc:0 "An Integrated Development Plan koordiniert Kredit, Verkehr und Beschaffung, damit einzelne Vorhaben einander verstärken. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
 AOEIW_world_SIK_military_root:0 "Frontier Army"
 AOEIW_world_SIK_military_root_desc:0 "Frontier Army errichtet einen ständigen Generalstab für Planung, Mobilmachung und die politische Zuverlässigkeit des Offizierskorps. Dieses Programm ist auf die besonderen Verhältnisse von Xinjiang zugeschnitten."
