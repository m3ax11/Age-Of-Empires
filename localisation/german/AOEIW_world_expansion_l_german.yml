 AOEIW_world_HEJ_security_desc:0 "Unter Secure Kingdom of Hejaz werden Polizei, Grenzschutz und Gerichte neu geordnet, bevor politische Gewalt dauerhaft Wurzeln schlägt. Dieses Programm ist auf die besonderen Verhältnisse von dem Hedschas zugeschnitten."
