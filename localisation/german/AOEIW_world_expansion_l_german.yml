 AOEIW_world_HEJ_representation_desc:0 "Balance the Political Estates bindet vernachlässigte Regionen und gesellschaftliche Gruppen ein, doch jedes Zugeständnis begrenzt die Zentralmacht. Dieses Programm ist auf die besonderen Verhältnisse von dem Hedschas zugeschnitten."
