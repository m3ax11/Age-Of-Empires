 AOEIW_world_HEJ_government_desc:0 "Mit Meccan Consultative Council wird provisorische Autorität in Ministerien verwandelt, die Steuern einziehen und Gesetze tatsächlich durchsetzen können. Dieses Programm ist auf die besonderen Verhältnisse von dem Hedschas zugeschnitten."
