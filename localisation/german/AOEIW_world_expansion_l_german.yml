 AOEIW_world_YEM_economic_root_desc:0 "Highland road programme ermittelt die Engpässe, die Rohstoffe und Arbeitskräfte bislang von einer gemeinsamen Volkswirtschaft trennen. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_railways:0 "Connect the Strategic Railways"
 AOEIW_world_YEM_railways_desc:0 "Connect the Strategic Railways verbindet politische Zentren, Depots und Exportwege; das Eisenbahnnetz prägt künftig Mobilmachung und Entwicklung. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_industry:0 "Found the National Workshops"
 AOEIW_world_YEM_industry_desc:0 "Found the National Workshops schafft Werkstätten, die importierte Maschinen reparieren und schrittweise den eigenen Bedarf decken können. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_resources:0 "Survey the National Resources"
 AOEIW_world_YEM_resources_desc:0 "Mit Survey the National Resources prüfen Ingenieure, welche Vorkommen erschlossen werden können, ohne sie ausländischen Konzessionen auszuliefern. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_YEM_economic_final_desc:0 "An Integrated Development Plan koordiniert Kredit, Verkehr und Beschaffung, damit einzelne Vorhaben einander verstärken. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_military_root:0 "Royal Yemeni Army"
 AOEIW_world_YEM_military_root_desc:0 "Royal Yemeni Army errichtet einen ständigen Generalstab für Planung, Mobilmachung und die politische Zuverlässigkeit des Offizierskorps. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_army:0 "Codify Field Doctrine"
 AOEIW_world_YEM_army_desc:0 "Codify Field Doctrine ersetzt persönliche Drilltraditionen durch eine schriftliche, an Gelände, Bevölkerung und Gegner angepasste Doktrin. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_YEM_logistics_desc:0 "Establish Regional Supply Commands weist den Regionaldepots klare Aufgaben zu und prüft die Versorgung von Verbänden außerhalb der Hauptstadtregion. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_mobilisation:0 "Register the National Reserve"
 AOEIW_world_YEM_mobilisation_desc:0 "Register the National Reserve erfasst Reservisten, Transportmittel und Waffen ehrlich und beendet die Fiktion von Divisionen, die nur auf Papier bestehen. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_military_final:0 "A Unified Defence System"
 AOEIW_world_YEM_military_final_desc:0 "A Unified Defence System verbindet Stabsarbeit, Reserve und Logistik zu einem Verteidigungssystem für den ersten Schock des modernen Krieges. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_diplomatic_root:0 "Red Sea diplomacy"
 AOEIW_world_YEM_diplomatic_root_desc:0 "Red Sea diplomacy zwingt das Außenministerium, die eigenen Bedürfnisse zu bestimmen, bevor eine Großmacht dies übernimmt. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_YEM_patron_desc:0 "Mit Renegotiate the Great-Power Relationship wird Abhängigkeit von einem Schutzherrn in konkrete Garantien, Preise und Grenzen verwandelt. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_regional:0 "Convene the Regional Mission"
 AOEIW_world_YEM_regional_desc:0 "Convene the Regional Mission eröffnet direkte Gespräche mit den Nachbarn über Eisenbahnen, Grenzen, Minderheiten und gemeinsame Sicherheit. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_ambition:0 "Assert the National Interest"
 AOEIW_world_YEM_ambition_desc:0 "Assert the National Interest geht über bloßes Überleben hinaus und formuliert eigene nationale Interessen. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
 AOEIW_world_YEM_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_YEM_diplomatic_final_desc:0 "Publish the Strategic Charter veröffentlicht eine gemeinsame Strategie aus Verträgen, Handelswegen und Mobilmachungsverpflichtungen. Dieses Programm ist auf die besonderen Verhältnisse von Jemen zugeschnitten."
