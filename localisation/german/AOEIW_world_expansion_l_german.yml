 AOEIW_world_FWA_ambition_desc:0 "Assert the National Interest geht über bloßes Überleben hinaus und formuliert eigene nationale Interessen. Dieses Programm ist auf die besonderen Verhältnisse von Westafrika zugeschnitten."
 AOEIW_world_FWA_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_FWA_diplomatic_final_desc:0 "Publish the Strategic Charter veröffentlicht eine gemeinsame Strategie aus Verträgen, Handelswegen und Mobilmachungsverpflichtungen. Dieses Programm ist auf die besonderen Verhältnisse von Westafrika zugeschnitten."
 AOEIW_world_GEA_leader:0 "Hellmuth von Mücke"
 AOEIW_world_GEA_general:0 "Alexander von Falkenhausen"
 AOEIW_world_GEA_political_root:0 "Define the German East Asian Colony"
 AOEIW_world_GEA_political_root_desc:0 "Define the German East Asian Colony eröffnet die grundlegende Verfassungsfrage des Landes und bestimmt, wer den Staat rechtmäßig führen darf."
 AOEIW_world_GEA_government:0 "Qingdao Colonial Directorate"
 AOEIW_world_GEA_government_desc:0 "Mit Qingdao Colonial Directorate wird provisorische Autorität in Ministerien verwandelt, die Steuern einziehen und Gesetze tatsächlich durchsetzen können. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_representation:0 "Balance the Political Estates"
 AOEIW_world_GEA_representation_desc:0 "Balance the Political Estates bindet vernachlässigte Regionen und gesellschaftliche Gruppen ein, doch jedes Zugeständnis begrenzt die Zentralmacht. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_security:0 "Secure German East Asian Colony"
 AOEIW_world_GEA_security_desc:0 "Unter Secure German East Asian Colony werden Polizei, Grenzschutz und Gerichte neu geordnet, bevor politische Gewalt dauerhaft Wurzeln schlägt. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_settlement:0 "Ratify the National Settlement"
 AOEIW_world_GEA_settlement_desc:0 "Ratify the National Settlement macht aus den bisherigen Kompromissen eine dauerhafte nationale Ordnung, die ihre Unterstützer nun verteidigen können. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_economic_root:0 "Shandong harbour programme"
 AOEIW_world_GEA_economic_root_desc:0 "Shandong harbour programme ermittelt die Engpässe, die Rohstoffe und Arbeitskräfte bislang von einer gemeinsamen Volkswirtschaft trennen. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_railways:0 "Connect the Strategic Railways"
 AOEIW_world_GEA_railways_desc:0 "Connect the Strategic Railways verbindet politische Zentren, Depots und Exportwege; das Eisenbahnnetz prägt künftig Mobilmachung und Entwicklung. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_industry:0 "Found the National Workshops"
 AOEIW_world_GEA_industry_desc:0 "Found the National Workshops schafft Werkstätten, die importierte Maschinen reparieren und schrittweise den eigenen Bedarf decken können. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_resources:0 "Survey the National Resources"
 AOEIW_world_GEA_resources_desc:0 "Mit Survey the National Resources prüfen Ingenieure, welche Vorkommen erschlossen werden können, ohne sie ausländischen Konzessionen auszuliefern. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_GEA_economic_final_desc:0 "An Integrated Development Plan koordiniert Kredit, Verkehr und Beschaffung, damit einzelne Vorhaben einander verstärken. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_military_root:0 "East Asian Schutztruppe"
 AOEIW_world_GEA_military_root_desc:0 "East Asian Schutztruppe errichtet einen ständigen Generalstab für Planung, Mobilmachung und die politische Zuverlässigkeit des Offizierskorps. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_army:0 "Codify Field Doctrine"
 AOEIW_world_GEA_army_desc:0 "Codify Field Doctrine ersetzt persönliche Drilltraditionen durch eine schriftliche, an Gelände, Bevölkerung und Gegner angepasste Doktrin. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_GEA_logistics_desc:0 "Establish Regional Supply Commands weist den Regionaldepots klare Aufgaben zu und prüft die Versorgung von Verbänden außerhalb der Hauptstadtregion. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_mobilisation:0 "Register the National Reserve"
 AOEIW_world_GEA_mobilisation_desc:0 "Register the National Reserve erfasst Reservisten, Transportmittel und Waffen ehrlich und beendet die Fiktion von Divisionen, die nur auf Papier bestehen. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_military_final:0 "A Unified Defence System"
 AOEIW_world_GEA_military_final_desc:0 "A Unified Defence System verbindet Stabsarbeit, Reserve und Logistik zu einem Verteidigungssystem für den ersten Schock des modernen Krieges. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_diplomatic_root:0 "German Pacific mission"
 AOEIW_world_GEA_diplomatic_root_desc:0 "German Pacific mission zwingt das Außenministerium, die eigenen Bedürfnisse zu bestimmen, bevor eine Großmacht dies übernimmt. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
 AOEIW_world_GEA_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_GEA_patron_desc:0 "Mit Renegotiate the Great-Power Relationship wird Abhängigkeit von einem Schutzherrn in konkrete Garantien, Preise und Grenzen verwandelt. Dieses Programm ist auf die besonderen Verhältnisse von Ostafrika zugeschnitten."
