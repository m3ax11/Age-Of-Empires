 AOEIW_world_TCO_military_root_desc:0 "Continental Army errichtet einen ständigen Generalstab für Planung, Mobilmachung und die politische Zuverlässigkeit des Offizierskorps. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
