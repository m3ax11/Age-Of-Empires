 AOEIW_world_NEE_army_desc:0 "Codify Field Doctrine ersetzt persönliche Drilltraditionen durch eine schriftliche, an Gelände, Bevölkerung und Gegner angepasste Doktrin. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_NEE_logistics_desc:0 "Establish Regional Supply Commands weist den Regionaldepots klare Aufgaben zu und prüft die Versorgung von Verbänden außerhalb der Hauptstadtregion. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_mobilisation:0 "Register the National Reserve"
 AOEIW_world_NEE_mobilisation_desc:0 "Register the National Reserve erfasst Reservisten, Transportmittel und Waffen ehrlich und beendet die Fiktion von Divisionen, die nur auf Papier bestehen. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_military_final:0 "A Unified Defence System"
 AOEIW_world_NEE_military_final_desc:0 "A Unified Defence System verbindet Stabsarbeit, Reserve und Logistik zu einem Verteidigungssystem für den ersten Schock des modernen Krieges. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_diplomatic_root:0 "North Atlantic policy"
 AOEIW_world_NEE_diplomatic_root_desc:0 "North Atlantic policy zwingt das Außenministerium, die eigenen Bedürfnisse zu bestimmen, bevor eine Großmacht dies übernimmt. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_NEE_patron_desc:0 "Mit Renegotiate the Great-Power Relationship wird Abhängigkeit von einem Schutzherrn in konkrete Garantien, Preise und Grenzen verwandelt. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_regional:0 "Convene the Regional Mission"
 AOEIW_world_NEE_regional_desc:0 "Convene the Regional Mission eröffnet direkte Gespräche mit den Nachbarn über Eisenbahnen, Grenzen, Minderheiten und gemeinsame Sicherheit. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_ambition:0 "Assert the National Interest"
 AOEIW_world_NEE_ambition_desc:0 "Assert the National Interest geht über bloßes Überleben hinaus und formuliert eigene nationale Interessen. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_NEE_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_NEE_diplomatic_final_desc:0 "Publish the Strategic Charter veröffentlicht eine gemeinsame Strategie aus Verträgen, Handelswegen und Mobilmachungsverpflichtungen. Dieses Programm ist auf die besonderen Verhältnisse von Neuengland zugeschnitten."
 AOEIW_world_TCO_leader:0 "Harry F. Byrd"
 AOEIW_world_TCO_general:0 "Hugh A. Drum"
 AOEIW_world_TCO_political_root:0 "Define the Thirteen Colonies"
 AOEIW_world_TCO_political_root_desc:0 "Define the Thirteen Colonies eröffnet die grundlegende Verfassungsfrage des Landes und bestimmt, wer den Staat rechtmäßig führen darf."
 AOEIW_world_TCO_government:0 "Philadelphia Continental Congress"
 AOEIW_world_TCO_government_desc:0 "Mit Philadelphia Continental Congress wird provisorische Autorität in Ministerien verwandelt, die Steuern einziehen und Gesetze tatsächlich durchsetzen können. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_representation:0 "Balance the Political Estates"
 AOEIW_world_TCO_representation_desc:0 "Balance the Political Estates bindet vernachlässigte Regionen und gesellschaftliche Gruppen ein, doch jedes Zugeständnis begrenzt die Zentralmacht. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_security:0 "Secure Thirteen Colonies"
 AOEIW_world_TCO_security_desc:0 "Unter Secure Thirteen Colonies werden Polizei, Grenzschutz und Gerichte neu geordnet, bevor politische Gewalt dauerhaft Wurzeln schlägt. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_settlement:0 "Ratify the National Settlement"
 AOEIW_world_TCO_settlement_desc:0 "Ratify the National Settlement macht aus den bisherigen Kompromissen eine dauerhafte nationale Ordnung, die ihre Unterstützer nun verteidigen können. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_economic_root:0 "Atlantic arsenal programme"
 AOEIW_world_TCO_economic_root_desc:0 "Atlantic arsenal programme ermittelt die Engpässe, die Rohstoffe und Arbeitskräfte bislang von einer gemeinsamen Volkswirtschaft trennen. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_railways:0 "Connect the Strategic Railways"
 AOEIW_world_TCO_railways_desc:0 "Connect the Strategic Railways verbindet politische Zentren, Depots und Exportwege; das Eisenbahnnetz prägt künftig Mobilmachung und Entwicklung. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_industry:0 "Found the National Workshops"
 AOEIW_world_TCO_industry_desc:0 "Found the National Workshops schafft Werkstätten, die importierte Maschinen reparieren und schrittweise den eigenen Bedarf decken können. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_resources:0 "Survey the National Resources"
 AOEIW_world_TCO_resources_desc:0 "Mit Survey the National Resources prüfen Ingenieure, welche Vorkommen erschlossen werden können, ohne sie ausländischen Konzessionen auszuliefern. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
 AOEIW_world_TCO_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_TCO_economic_final_desc:0 "An Integrated Development Plan koordiniert Kredit, Verkehr und Beschaffung, damit einzelne Vorhaben einander verstärken. Dieses Programm ist auf die besonderen Verhältnisse von Transkaukasien zugeschnitten."
