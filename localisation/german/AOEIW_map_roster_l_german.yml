l_german:
 AOEIW_dominion_relations_category:0 "Die Dominion-Kabinette"
 AOEIW_dominion_relations_category_desc:0 "Canberra und Wellington regieren ihre eigenen Laender, doch Verteidigungsplanung, imperialer Handel und Verfassungsfragen binden sie weiterhin an London. Konsultation staerkt Zustimmung und Autonomie; direkte Koordination bringt schnellere militaerische Kontrolle zu politischen Kosten."
 AOEIW_consult_australian_cabinet:0 "Das australische Kabinett konsultieren"
 AOEIW_consult_australian_cabinet_desc:0 "Die naechste Runde der Pazifikplanung wird den Ministern in Canberra vorgelegt, bevor London Verpflichtungen bekannt gibt."
 AOEIW_coordinate_australian_defence:0 "Australiens Verteidigung koordinieren"
 AOEIW_coordinate_australian_defence_desc:0 "Beschaffung und Operationsplanung werden fuer die kommende Krise enger unter imperialem Kommando zusammengefuehrt."
 AOEIW_consult_new_zealand_cabinet:0 "Das neuseelaendische Kabinett konsultieren"
 AOEIW_consult_new_zealand_cabinet_desc:0 "Wellington erhaelt eine formelle Stimme bei Pazifikeinsaetzen, Schifffahrtsprioritaeten und der Verteidigung der Inseln."
 AOEIW_coordinate_new_zealand_defence:0 "Neuseelands Verteidigung koordinieren"
 AOEIW_coordinate_new_zealand_defence_desc:0 "Neuseelands Expeditionsplanung und Marineversorgung werden direkt imperial koordiniert."
 AOEIW_dominion_consultation_autonomy:0 "Konsultation des Kabinetts"
 AOEIW_dominion_coordination_autonomy:0 "Imperiale Verteidigungskoordination"
 AOEIW_dominion_consulted:0 "Kabinett konsultiert"
 AOEIW_dominion_directed:0 "Verteidigung aus London gelenkt"
 AOEIW_belgrade_settlement:0 "Der Belgrader Ausgleich"
 AOEIW_map_roster.1.t:0 "Der Ausgleich mit Belgrad"
 AOEIW_map_roster.1.d:0 "Die suedslawische Krise endete, bevor sie die Habsburgermonarchie zerstoeren konnte. Wien erkannte das unabhaengige Koenigreich in Belgrad an und gab den Anspruch auf, die Suedslawen als ein einziges Kronland zu regieren. Der Ausgleich rettete den verbleibenden Verband aus Oesterreich, Ungarn, Boehmen, der Slowakei und Galizien; Minderheitenfragen, Eisenbahnzugang und Garantien verbinden beide Staaten weiterhin."
 AOEIW_map_roster.1.a:0 "Der Ausgleich bewahrte die Monarchie."
 AOEIW_map_roster.2.t:0 "Der Ausgleich mit Wien"
 AOEIW_map_roster.2.d:0 "Belgrads Unabhaengigkeit ging aus der suedslawischen Krise und dem anschliessenden Ausgleich hervor. Wien gab die direkte Herrschaft auf, waehrend Jugoslawien offene Regelungen fuer Handel, Minderheiten und die Donaubahnen akzeptierte. Der Frieden haelt, weil beide Kronen die Kosten einer erneuten Krise kennen."
 AOEIW_map_roster.2.a:0 "Die Unabhaengigkeit muss dauerhaft werden."
