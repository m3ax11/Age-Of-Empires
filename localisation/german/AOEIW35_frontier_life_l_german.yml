l_german:
 AOEIW35_MON_frontier_category:0 "Die lebende Steppe"
 AOEIW35_MON_frontier_category_desc:0 "Politische Verhandlungen und wiederholbare Grenzprogramme geben dem kleinen Fokusbaum eine fortlaufende zweite Ebene."
 AOEIW35_MON_frontier_council:0 "Den saisonalen Chural einberufen"
 AOEIW35_MON_frontier_council_desc:0 "Versammelt die konkurrierenden lokalen Institutionen und handelt eine begrenzte gemeinsame Maßnahme aus."
 AOEIW35_MON_frontier_programme:0 "Grenzkarawanen entsenden"
 AOEIW35_MON_frontier_programme_desc:0 "Ein zeitlich begrenztes Programm verbessert Versorgung und Organisation, bindet aber politische Mittel."
 AOEIW35_MON_frontier_compact:0 "Der Steppenpakt"
 AOEIW35_MON_frontier_compact_desc:0 "Lokale Verwaltung, Versorgung und militärische Führung arbeiten erstmals nach einem gemeinsamen Plan."
 AOEIW35_mon.1.t:0 "Der Chural tritt zusammen"
 AOEIW35_mon.1.d:0 "Hirtenkooperativen, Armeereiter und Provinzdelegierte erscheinen mit unterschiedlichen Karten derselben Grenze. Die Mongolei muss entscheiden, ob Überleben mit Zustimmung oder Befehl beginnt."
 AOEIW35_mon.1.a:0 "Mit den zivilen Delegierten verhandeln."
 AOEIW35_mon.1.b:0 "Die Grenzkommandos erhalten Vorrang."
 AOEIW35_mon.2.t:0 "Ein Staat über der Steppe"
 AOEIW35_mon.2.d:0 "Neue Straßen, Depots und Register haben die Regierung jenseits der Hauptstadt greifbar gemacht. Der Pakt muss nun einen Winter und einen Krieg überstehen."
 AOEIW35_mon.2.a:0 "Die Ordnung muss Bestand haben."
 AOEIW35_MAN_frontier_category:0 "Hof, Banner und Wiederaufbau"
 AOEIW35_MAN_frontier_category_desc:0 "Politische Verhandlungen und wiederholbare Grenzprogramme geben dem kleinen Fokusbaum eine fortlaufende zweite Ebene."
 AOEIW35_MAN_frontier_council:0 "Die Bannerkommandos überprüfen"
 AOEIW35_MAN_frontier_council_desc:0 "Versammelt die konkurrierenden lokalen Institutionen und handelt eine begrenzte gemeinsame Maßnahme aus."
 AOEIW35_MAN_frontier_programme:0 "Nördliche Wiederaufbauanleihen ausgeben"
 AOEIW35_MAN_frontier_programme_desc:0 "Ein zeitlich begrenztes Programm verbessert Versorgung und Organisation, bindet aber politische Mittel."
 AOEIW35_MAN_frontier_compact:0 "Der nördliche Wiederaufbaurat"
 AOEIW35_MAN_frontier_compact_desc:0 "Lokale Verwaltung, Versorgung und militärische Führung arbeiten erstmals nach einem gemeinsamen Plan."
 AOEIW35_man.1.t:0 "Der Hof wählt das Überleben"
 AOEIW35_man.1.d:0 "Der Hof kontrolliert Titel, die Bannerkommandeure bewaffnete Männer und städtische Ausschüsse die Vorräte. Keiner kann Manchukuo allein erhalten."
 AOEIW35_man.1.a:0 "Mit den zivilen Delegierten verhandeln."
 AOEIW35_man.1.b:0 "Die Grenzkommandos erhalten Vorrang."
 AOEIW35_man.2.t:0 "Eine nördliche Ordnung"
 AOEIW35_man.2.d:0 "Arsenalmaße, Eisenbahnpläne und Getreideregister beschreiben endlich denselben Staat. Der Wiederaufbau bleibt zerbrechlich, ist aber nicht länger bloße Vorstellung."
 AOEIW35_man.2.a:0 "Die Ordnung muss Bestand haben."
 AOEIW35_XIC_frontier_category:0 "Die Xi’an-Koalition"
 AOEIW35_XIC_frontier_category_desc:0 "Politische Verhandlungen und wiederholbare Grenzprogramme geben dem kleinen Fokusbaum eine fortlaufende zweite Ebene."
 AOEIW35_XIC_frontier_council:0 "Den Provinzrat vermitteln"
 AOEIW35_XIC_frontier_council_desc:0 "Versammelt die konkurrierenden lokalen Institutionen und handelt eine begrenzte gemeinsame Maßnahme aus."
 AOEIW35_XIC_frontier_programme:0 "Hilfe entlang der Seidenstraße organisieren"
 AOEIW35_XIC_frontier_programme_desc:0 "Ein zeitlich begrenztes Programm verbessert Versorgung und Organisation, bindet aber politische Mittel."
 AOEIW35_XIC_frontier_compact:0 "Der Shaanxi-Pakt"
 AOEIW35_XIC_frontier_compact_desc:0 "Lokale Verwaltung, Versorgung und militärische Führung arbeiten erstmals nach einem gemeinsamen Plan."
 AOEIW35_xic.1.t:0 "Die Xi’an-Konferenz"
 AOEIW35_xic.1.d:0 "Offiziere, Provinzbeamte und Hilfsausschüsse tagen unter Bewachung. Ihre Koalition kann nur dann Regierung werden, wenn sie Straßen ebenso beherrscht wie Proklamationen."
 AOEIW35_xic.1.a:0 "Mit den zivilen Delegierten verhandeln."
 AOEIW35_xic.1.b:0 "Die Grenzkommandos erhalten Vorrang."
 AOEIW35_xic.2.t:0 "Eine Provinz, die bestehen kann"
 AOEIW35_xic.2.d:0 "Hilfskolonnen teilen nun Signale mit der Armee, und Steuereinnahmen erreichen den Provinzrat. Xi’an besitzt Institutionen, die es zu verteidigen gilt."
 AOEIW35_xic.2.a:0 "Die Ordnung muss Bestand haben."
