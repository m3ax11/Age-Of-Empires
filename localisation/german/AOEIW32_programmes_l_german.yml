 AOEIW32_GER_kpd_bill:0 "Gewählte Betriebsräte"
 AOEIW32_GER_kpd_bill_spirit:0 "Gewählte Betriebsräte"
 AOEIW32_GER_kpd_bill_desc:0 "Betriebsdelegierte setzen Produktionsabkommen durch. Höherer Ausstoß führt zu Konflikten um die Unternehmensführung.\n\nErfordert diese Partei in der Regierung. Kostet 75 politische Macht. Gilt 180 Tage; alle Umsetzungsgesetze teilen ein 240-Tage-Gesetzgebungsbudget."
