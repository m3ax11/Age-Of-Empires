 AOEIW32_GER_spd_bill:0 "Wohnungsanleihen des Ruhrgebiets"
 AOEIW32_GER_spd_bill_spirit:0 "Wohnungsanleihen des Ruhrgebiets"
 AOEIW32_GER_spd_bill_desc:0 "Kommunen beschleunigen den Wohnungsbau und ziehen Arbeitskräfte und Material aus der Rüstung ab.\n\nErfordert diese Partei in der Regierung. Kostet 75 politische Macht. Gilt 180 Tage; alle Umsetzungsgesetze teilen ein 240-Tage-Gesetzgebungsbudget."
 AOEIW32_GER_spd_bill_spirit_desc:0 "Kommunen beschleunigen den Wohnungsbau und ziehen Arbeitskräfte und Material aus der Rüstung ab. Die finanzierte Maßnahme endet nach 180 Tagen, auch bei einem Kabinettswechsel."
 AOEIW32_GER_zentrum_bill:0 "Der Finanzausgleich der Länder"
 AOEIW32_GER_zentrum_bill_spirit:0 "Der Finanzausgleich der Länder"
 AOEIW32_GER_zentrum_bill_desc:0 "Berlin finanziert die Provinzverwaltung gegen parlamentarische Unterstützung. Stabile Mehrheiten kosten Verwaltungskapazität.\n\nErfordert diese Partei in der Regierung. Kostet 75 politische Macht. Gilt 180 Tage; alle Umsetzungsgesetze teilen ein 240-Tage-Gesetzgebungsbudget."
 AOEIW32_GER_zentrum_bill_spirit_desc:0 "Berlin finanziert die Provinzverwaltung gegen parlamentarische Unterstützung. Stabile Mehrheiten kosten Verwaltungskapazität. Die finanzierte Maßnahme endet nach 180 Tagen, auch bei einem Kabinettswechsel."
