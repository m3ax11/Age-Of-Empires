 AOEIW_UNIQUE_HAI_pre_2:0 "Mobilise the State Delegations"
 AOEIW_UNIQUE_HAI_pre_2_desc:0 "Haitis Unabhängigkeit ist mit seinem revolutionären Erbe verbunden, doch die schützenden Institutionen bleiben umstritten. Haitis Unabhängigkeit ist mit seinem revolutionären Erbe verbunden, doch die schützenden Institutionen bleiben umstritten. Unmittelbare Maßnahmen: Infrastrukturarbeiten."
 AOEIW_UNIQUE_HAI_left_1:0 "Defend the Black Republic"
 AOEIW_UNIQUE_HAI_left_1_desc:0 "Die Verteidigung der Schwarzen Republik verankert Autorität in Vertretungsinstitutionen und behandelt Unabhängigkeit als Gemeingut statt dynastischen Besitz. Unmittelbare Maßnahmen: +6% Stabilität, Unterstützung für das gewählte politische Lager."
 AOEIW_UNIQUE_HAI_right_1:0 "Restore the Imperial Court"
 AOEIW_UNIQUE_HAI_right_1_desc:0 "Ein Kaiserhof sucht Kontinuität durch eine restaurierte Krone und Verwaltungselite und ersetzt republikanische Legitimität durch dynastische Autorität. Unmittelbare Maßnahmen: +41 politische Macht, Unterstützung für das gewählte politische Lager."
 AOEIW_UNIQUE_HAI_right_2:0 "Deepen Restore the Imperial Court"
 AOEIW_UNIQUE_HAI_right_2_desc:0 "Haitis Unabhängigkeit ist mit seinem revolutionären Erbe verbunden, doch die schützenden Institutionen bleiben umstritten. Ein Kaiserhof sucht Kontinuität durch eine restaurierte Krone und Verwaltungselite und ersetzt republikanische Legitimität durch dynastische Autorität. Unmittelbare Maßnahmen: Infrastrukturarbeiten."
 AOEIW_UNIQUE_HAI_settlement:0 "Implement The Haitian State"
 AOEIW_UNIQUE_HAI_settlement_desc:0 "Haitis Unabhängigkeit ist mit seinem revolutionären Erbe verbunden, doch die schützenden Institutionen bleiben umstritten. Die beschlossene Ordnung muss nun eine regelmäßige Verwaltung finanzieren und ihre Dienstpflichten erfüllen. Unmittelbare Maßnahmen: +83 politische Macht, +3.5% Stabilität."
 AOEIW_UNIQUE_HAI_post_1:0 "Secure the New Order"
 AOEIW_UNIQUE_HAI_post_1_desc:0 "Haitis Unabhängigkeit ist mit seinem revolutionären Erbe verbunden, doch die schützenden Institutionen bleiben umstritten. Die beschlossene Ordnung muss nun eine regelmäßige Verwaltung finanzieren und ihre Dienstpflichten erfüllen. Unmittelbare Maßnahmen: +2% Kriegsunterstützung."
