 AOEIW37_SPR_viceroyal_directorate:0 "Die Vizekönige antworten Madrid"
 AOEIW37_SPR_viceroyal_directorate_desc:0 "Vizekönige melden Haushalt, Truppenaushebungen und Notverordnungen an die Reichsregierung. Rang in Übersee entschuldigt keine Privatpolitik mehr."
 AOEIW37_SPR_imperial_defence_board:0 "Jedes Reich entsendet einen Stab"
 AOEIW37_SPR_imperial_defence_board_desc:0 "Jedes Reich schickt Offiziere mit Vollmacht für Häfen, Mobilmachung und gemeinsame Kommandos. Gemeinsame Verteidigung beginnt mit Karten, die alle unterzeichnet haben."
 AOEIW37_SPR_test_the_imperial_compact:0 "Werden die Reiche antworten?"
 AOEIW37_SPR_test_the_imperial_compact_desc:0 "Madrid ruft eine vollständige Mobilmachungsübung aus und erfasst, welche Reiche Männer, Schiffe und Vorräte pünktlich senden. Gleichrangigkeit besteht ihre erste praktische Prüfung."
