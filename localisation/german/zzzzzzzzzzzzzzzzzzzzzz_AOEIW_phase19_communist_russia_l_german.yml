l_german:
 SOV_SOVIET_UNION:0 "Union der Sowjetrepubliken"
 SOV_SOVIET_UNION_DEF:0 "die Union der Sowjetrepubliken"
 SOV_SOVIET_UNION_ADJ:0 "sowjetisch"
 AOEIW19_SOV_all_russian_congress:0 "Allrussischer Kongress"
 AOEIW19_SOV_all_russian_congress_long:0 "Allrussischer Kongress der Arbeiter-, Soldaten- und Bauernsowjets"
 AOEIW19_union_of_revolutionary_republics:0 "Union Revolutionärer Republiken"

 AOEIW19_SOV_stalin_forced_industrialiser:0 "Architekt der Zwangsindustrialisierung"
 AOEIW19_SOV_stalin_forced_industrialiser_desc:0 "Stalin konzentriert Macht und Investitionen auf ein historisch hartes Programm des Schwerindustrieaufbaus. Die Produktion steigt schnell, doch Zwang und soziale Belastung wachsen mit."
 AOEIW19_SOV_trotsky_revolutionary_tribune:0 "Tribun der permanenten Revolution"
 AOEIW19_SOV_trotsky_revolutionary_tribune_desc:0 "Trotzki betrachtet Russland als Basis einer internationalen Revolution und verlangt politische Debatte, militärische Bereitschaft und dauernde ideologische Initiative."
 AOEIW19_SOV_tukhachevsky_red_militarist:0 "Der rote Militarist"
 AOEIW19_SOV_tukhachevsky_red_militarist_desc:0 "Tuchatschewski unterstellt die Zivilpolitik der militärischen Modernisierung, der tiefen Operation, der Mechanisierung und der Vorbereitung auf einen Kontinentalkrieg."

 AOEIW9_SOV_politics_p3_1:0 "Die Betriebskomitees der Putilow-Werke"
 AOEIW9_SOV_politics_p3_1_desc:0 "Metallarbeiter der Putilow-Werke beleben gewählte Betriebskomitees neu. Aus Forderungen nach Lohn und Brot werden Forderungen nach Eigentum, Macht und dem Ende der Zarenherrschaft."
 AOEIW9_SOV_politics_p3_2:0 "Brotschlangen in Petrograd"
 AOEIW9_SOV_politics_p3_2_desc:0 "Die Lebensmittelknappheit macht Petrograds Warteschlangen zu politischen Versammlungen. Die revolutionären Komitees müssen Disziplin erzwingen oder die spontane Konfrontation zulassen."
 AOEIW9_SOV_politics_p3_3:0 "Soldaten wählen ihre Sowjets"
 AOEIW9_SOV_politics_p3_3_desc:0 "Garnisonskompanien wählen Delegierte und verweigern Befehle ohne deren Gegenzeichnung. Die kaiserliche Befehlsgewalt zerbricht von unten."
 AOEIW9_SOV_politics_p3_4:0 "Land an die Woloste"
 AOEIW9_SOV_politics_p3_4_desc:0 "Bäuerliche Woloste besetzen Güter und verlangen Umverteilung. Die Bewegung kann durch Landkomitees geordnet oder durch sofortige Requisition vorangetrieben werden."
 AOEIW9_SOV_politics_p3_5:0 "Die Komitees der Eisenbahner"
 AOEIW9_SOV_politics_p3_5_desc:0 "Eisenbahner kontrollieren die Lebensadern des Reiches. Ihre Komitees isolieren loyale Garnisonen, doch widersprüchliche Ortsbefehle stören Lebensmittel- und Militärtransporte."
 AOEIW9_SOV_politics_p3_6:0 "Den Kongress der Roten Garden einberufen"
 AOEIW9_SOV_politics_p3_6_desc:0 "Stadtgarden, Soldatendelegierte und Eisenbahnabteilungen einigen sich auf gemeinsame Kommandos. Die Revolution erhält bewaffnete Macht, bevor sie einen Staat besitzt."
 AOEIW9_SOV_politics_p3_7:0 "Alle Macht den Sowjets"
 AOEIW9_SOV_politics_p3_7_desc:0 "Der Allrussische Kongress wird das Reich abschaffen und das politische Programm der neuen Union wählen. Stalin, Trotzki und Tuchatschewski bieten grundverschiedene Zukünfte."

 AOEIW19_SOV_congress_of_soviets:0 "Den Sowjetkongress einsetzen"
 AOEIW19_SOV_congress_of_soviets_desc:0 "Der revolutionäre Kongress muss zu einer Regierung werden, die Haushalte beschließt, Kommissare ernennt und deren Befehle jede Provinz erreichen."
 AOEIW19_SOV_land_and_factory_decrees:0 "Die Land- und Fabrikdekrete"
 AOEIW19_SOV_land_and_factory_decrees_desc:0 "Die ersten Dekrete erkennen bäuerliche Umverteilung und Arbeiterkontrolle an, verbinden sie aber mit nationalen Pflichten für Getreide, Arbeit und Rüstung."
 AOEIW19_SOV_gosplan_under_the_soviets:0 "Gosplan unter den Sowjets"
 AOEIW19_SOV_gosplan_under_the_soviets_desc:0 "Eine Staatliche Plankommission ersetzt improvisierte Fabrikbesetzungen durch Materialbilanzen, Investitionspläne und verbindliche Produktionsziele."
 AOEIW19_SOV_ural_industrial_combines:0 "Die Industriekombinate des Urals"
 AOEIW19_SOV_ural_industrial_combines_desc:0 "Perm und Ischewsk werden im Landesinneren Zentren für Stahl, Werkzeugmaschinen, Geschütze und Schwermaschinenbau außerhalb der Reichweite eines frühen Westangriffs."
 AOEIW19_SOV_railways_of_the_first_plan:0 "Eisenbahnen des Ersten Plans"
 AOEIW19_SOV_railways_of_the_first_plan_desc:0 "Industriewachstum ohne Bahnkapazität erzeugt nur gestrandete Kohle und stillstehende Hochöfen. Moskau und der Ural werden in ein militärisches Frachtnetz eingebunden."
 AOEIW19_SOV_red_army_commission:0 "Die Kommission der Roten Armee"
 AOEIW19_SOV_red_army_commission_desc:0 "Revolutionäre Legitimität ersetzt keine Stabsarbeit. Soldatendelegierte, übernommene Fachoffiziere und neue Kommissare schaffen eine gemeinsame Befehlskette."
 AOEIW19_SOV_universal_military_records:0 "Allgemeine Militärregister"
 AOEIW19_SOV_universal_military_records_desc:0 "Lokale Sowjets registrieren ausgebildete Männer, Fachkräfte, Pferde, Fahrzeuge und Ersatzjahrgänge, statt Armeen aus einer unbekannten Bevölkerung zu beschwören."
 AOEIW19_SOV_standardise_the_76mm:0 "Die 76-Millimeter-Kanone vereinheitlichen"
 AOEIW19_SOV_standardise_the_76mm_desc:0 "Eine begrenzte Familie von 76-mm-Geschützen, gemeinsame Munition und reparierbare Lafetten geben dem Massenheer tragfähige Artillerie."
 AOEIW19_SOV_supply_echelons:0 "Versorgungsstaffeln der Roten Armee"
 AOEIW19_SOV_supply_echelons_desc:0 "Fronten, Armeen und Divisionen erhalten festgelegte Vorräte und Transportaufgaben. Strategische Tiefe zählt nur, wenn Nachschub sie durchquert."
 AOEIW19_SOV_workers_air_fleet:0 "Eine Luftflotte der Arbeiter"
 AOEIW19_SOV_workers_air_fleet_desc:0 "Flugzeugwerke konzentrieren sich auf Jäger, Schlachtflugzeuge und taktische Bomber, die in großer Zahl gebaut und ersetzt werden können."
 AOEIW19_SOV_rugged_frontline_airframes:0 "Robuste Frontflugzeuge"
 AOEIW19_SOV_rugged_frontline_airframes_desc:0 "Vereinfachte Strukturen und gutmütige Motoren verbessern Zuverlässigkeit und Ersatzfähigkeit zum bewussten Preis geringerer Reichweite."
 AOEIW19_SOV_aviation_cities_beyond_the_volga:0 "Luftfahrtstädte jenseits der Wolga"
 AOEIW19_SOV_aviation_cities_beyond_the_volga_desc:0 "Neue Flugplätze und verteilte Werkstätten um Moskau, Stalingrad und im Ural machen die Frontfliegerkräfte über kontinentale Entfernungen widerstandsfähig."
 AOEIW19_SOV_union_of_revolutionary_republics:0 "Union Revolutionärer Republiken"
 AOEIW19_SOV_union_of_revolutionary_republics_desc:0 "Das ehemalige Reich wird eine föderale revolutionäre Union. Die Republiken erhalten formale Rechte, während Verteidigung, Planung und Außenpolitik gemeinsam bleiben."
 AOEIW19_SOV_stalin_centralise_the_party:0 "Das Parteisekretariat zentralisieren"
 AOEIW19_SOV_stalin_centralise_the_party_desc:0 "Stalin macht Ernennungen, Register und regionale Sekretariate zu einer disziplinierten Maschine, die Politik in einem riesigen, widerständigen Land durchsetzen kann."
 AOEIW19_SOV_stalin_first_five_year_plan:0 "Den Ersten Fünfjahresplan beginnen"
 AOEIW19_SOV_stalin_first_five_year_plan_desc:0 "Schwerindustrie, Elektrizität, Maschinen und Rüstung erhalten verbindliche Ziele. Das Tempo ist außerordentlich; ebenso die Opfer, die Arbeitern und Dörfern abverlangt werden."
 AOEIW19_SOV_stalin_magnitogorsk_model:0 "Das Magnitogorsk-Modell"
 AOEIW19_SOV_stalin_magnitogorsk_model_desc:0 "Neue Industriestädte im Landesinneren entstehen um integrierte Stahl- und Rüstungswerke und wiederholen die schnelle Konzentration der realen sowjetischen Industrialisierung."
 AOEIW19_SOV_stalin_socialism_in_one_country:0 "Sozialismus in einem Land"
 AOEIW19_SOV_stalin_socialism_in_one_country_desc:0 "Die Union wird zunächst zur allein überlebensfähigen Industriefestung. Internationale Ziele weichen Konsolidierung, Verteidigung und Produktionskraft."
 AOEIW19_SOV_trotsky_restore_party_democracy:0 "Die Parteidemokratie wiederherstellen"
 AOEIW19_SOV_trotsky_restore_party_democracy_desc:0 "Trotzki stellt organisierte Debatten in der revolutionären Bewegung wieder her und nimmt langsamere Einigkeit für Initiative und Verantwortlichkeit in Kauf."
 AOEIW19_SOV_trotsky_programme_of_the_left_opposition:0 "Programm der Linken Opposition"
 AOEIW19_SOV_trotsky_programme_of_the_left_opposition_desc:0 "Planmäßiges Industriewachstum wird mit technischer Bildung, Arbeiteraufsicht und dem Kampf gegen eine selbstschützende Bürokratie verbunden."
 AOEIW19_SOV_trotsky_permanent_revolution:0 "Permanente Revolution"
 AOEIW19_SOV_trotsky_permanent_revolution_desc:0 "Die russische Revolution kann isoliert nicht sicher sein. Diplomatie, Propaganda und Militärplanung müssen auf einen internationalen Kampf vorbereiten."
 AOEIW19_SOV_trotsky_international_red_army:0 "Die Internationale Rote Armee"
 AOEIW19_SOV_trotsky_international_red_army_desc:0 "Erfahrene Revolutionäre, ausländische Freiwillige und politisch geschulte Offiziere bilden eine Armee, die Russland verteidigen und jenseits seiner Grenzen kämpfen soll."
 AOEIW19_SOV_tukhachevsky_army_above_faction:0 "Die Armee über den Fraktionen"
 AOEIW19_SOV_tukhachevsky_army_above_faction_desc:0 "Tuchatschewski erklärt militärische Kompetenz für wichtiger als Parteiflügel. Die Rote Armee wird zum organisatorischen Rückgrat des revolutionären Staates."
 AOEIW19_SOV_tukhachevsky_militarisation_directorate:0 "Das Militarisierungsdirektorat"
 AOEIW19_SOV_tukhachevsky_militarisation_directorate_desc:0 "Industrieverteilung, Transport und Arbeitspolitik unterstehen einem dauerhaften militärökonomischen Direktorat. Zivile Entwicklung wird bewusst nachgeordnet."
 AOEIW19_SOV_tukhachevsky_mechanise_deep_battle:0 "Die tiefe Schlacht mechanisieren"
 AOEIW19_SOV_tukhachevsky_mechanise_deep_battle_desc:0 "Gestaffelte Kräfte, motorisierte Ausnutzung, Massenartillerie und operative Luftfahrt machen Tuchatschewskis Theorie tiefer Operationen zu einem Armeesystem."
 AOEIW19_SOV_tukhachevsky_continental_war_plan:0 "Der Kontinentalkriegsplan"
 AOEIW19_SOV_tukhachevsky_continental_war_plan_desc:0 "Die Union bereitet Industrie und Armeen auf einen schnell beginnenden, aber langen Kontinentalkrieg vor und akzeptiert politische Militarisierung als Preis."
 AOEIW19_SOV_the_army_that_endures:0 "Die Armee, die durchhält"
 AOEIW19_SOV_the_army_that_endures_desc:0 "Schnelle Industrialisierung, registrierte Reserven, vereinheitlichte Geschütze, gestaffelter Nachschub und ersetzbare Flugzeuge schaffen eine Kriegsmaschine, die mit der Dauer wächst."

 AOEIW19_SOV_factory_soviet_agitation:0 "Agitation der Fabriksowjets"
 AOEIW19_SOV_factory_soviet_agitation_desc:0 "Betriebskomitees verbreiten revolutionäre Organisation, während Streiks und geteilte Autorität die Produktion senken."
 AOEIW19_SOV_disciplined_rationing:0 "Disziplinierte revolutionäre Rationierung"
 AOEIW19_SOV_disciplined_rationing_desc:0 "Rationierungskarten und bewachte Depots erhalten Ordnung, binden aber Verwaltung und Zivilgüter."
 AOEIW19_SOV_bread_riots:0 "Die Brotaufstände"
 AOEIW19_SOV_bread_riots_desc:0 "Spontane Beschlagnahmungen radikalisieren die Städte und vertiefen die Instabilität."
 AOEIW19_SOV_soldiers_councils:0 "Soldatensowjets"
 AOEIW19_SOV_soldiers_councils_desc:0 "Gewählte Delegierte erweitern die revolutionäre Mobilisierung und schwächen die kaiserliche Befehlskette."
 AOEIW19_SOV_peasant_land_committees:0 "Bäuerliche Landkomitees"
 AOEIW19_SOV_peasant_land_committees_desc:0 "Geordnete Umverteilung gewinnt ländliche Unterstützung, entzieht dem Bau aber vorübergehend Arbeit und Werkzeug."
 AOEIW19_SOV_forced_requisition:0 "Erzwungene Requisition"
 AOEIW19_SOV_forced_requisition_desc:0 "Zwangsbeschlagnahmungen ernähren Städte und Armee, erzeugen jedoch Unordnung und Verschwendung."
 AOEIW19_SOV_railway_committee_disruption:0 "Störungen durch Eisenbahnkomitees"
 AOEIW19_SOV_railway_committee_disruption_desc:0 "Eisenbahner stoppen Loyalisten, doch örtliche Kontrolle zersplittert den nationalen Fahrplan."
 AOEIW19_SOV_red_guard_columns:0 "Kolonnen der Roten Garden"
 AOEIW19_SOV_red_guard_columns_desc:0 "Bewaffnete Arbeiter bringen Masse und Geschwindigkeit, bevor sie Divisionsdisziplin besitzen."
 AOEIW19_SOV_postrevolution_officer_collapse:0 "Zusammenbruch des kaiserlichen Offizierskorps"
 AOEIW19_SOV_postrevolution_officer_collapse_desc:0 "Desertion, Verhaftung und geteilte Loyalität lassen die Rote Armee ohne funktionierende Führung."
 AOEIW19_SOV_postrevolution_industrial_seizures:0 "Unkoordinierte Industriebesetzungen"
 AOEIW19_SOV_postrevolution_industrial_seizures_desc:0 "Eigentum wechselte schneller als Bücher, Aufträge und technische Betriebsführung."
 AOEIW19_SOV_postrevolution_supply_breakdown:0 "Zusammenbruch des kaiserlichen Nachschubs"
 AOEIW19_SOV_postrevolution_supply_breakdown_desc:0 "Depots und Bahndirektionen gehorchen konkurrierenden Stellen, während die Armee verbraucht, was sie erreicht."
 AOEIW19_SOV_land_and_factory_decrees_spirit:0 "Land- und Fabrikdekrete"
 AOEIW19_SOV_land_and_factory_decrees_spirit_desc:0 "Revolutionäre Rechte werden an Getreidelieferung, Arbeitsregister und Landesverteidigung gebunden."
 AOEIW19_SOV_gosplan_spirit:0 "Gosplan"
 AOEIW19_SOV_gosplan_spirit_desc:0 "Materialbilanzen und Zwangsziele beschleunigen den Aufbau und verringern zivile Wahlfreiheit."
 AOEIW19_SOV_ural_combines_spirit:0 "Industriekombinate des Urals"
 AOEIW19_SOV_ural_combines_spirit_desc:0 "Stahl- und Maschinenzentren im Landesinneren tragen hohe Rüstungsproduktion fern der Westgrenze."
 AOEIW19_SOV_first_plan_railways_spirit:0 "Eisenbahnen des Ersten Plans"
 AOEIW19_SOV_first_plan_railways_spirit_desc:0 "Industrie- und Militärfracht erhalten im kontinentalen Netz abgestimmte Priorität."
 AOEIW19_SOV_red_army_commission_spirit:0 "Kommission der Roten Armee"
 AOEIW19_SOV_red_army_commission_spirit_desc:0 "Delegierte, Fachoffiziere und Kommissare teilen eine einheitliche Befehlsordnung."
 AOEIW19_SOV_universal_military_records_spirit:0 "Allgemeine Militärregister"
 AOEIW19_SOV_universal_military_records_spirit_desc:0 "Jeder Bezirk erfasst Ersatzjahrgänge und Fachkräfte für dauerhafte Mobilisierung."
 AOEIW19_SOV_standard_76mm_spirit:0 "Die genormte 76-mm-Kanone"
 AOEIW19_SOV_standard_76mm_spirit_desc:0 "Gemeinsame Geschütze, Granaten und Lafetten machen Massenartillerie günstig und wirksam."
 AOEIW19_SOV_supply_echelons_spirit:0 "Nachschubstaffeln der Roten Armee"
 AOEIW19_SOV_supply_echelons_spirit_desc:0 "Gestaffelte Vorräte und Transportaufgaben verringern Verluste über große Entfernungen."
 AOEIW19_SOV_workers_air_fleet_spirit:0 "Luftflotte der Arbeiter"
 AOEIW19_SOV_workers_air_fleet_spirit_desc:0 "Fabriken bauen Jäger, Schlachtflugzeuge und taktische Bomber in Masse."
 AOEIW19_SOV_rugged_airframes_spirit:0 "Robuste Frontflugzeuge"
 AOEIW19_SOV_rugged_airframes_spirit_desc:0 "Einfache, zuverlässige Flugzeuge kehren schnell in den Dienst zurück, besitzen aber weniger Reichweite."
 AOEIW19_SOV_front_aviation_spirit:0 "Frontfliegerkräfte"
 AOEIW19_SOV_front_aviation_spirit_desc:0 "Luftkommandos werden für Bewegung und unmittelbare Unterstützung der Bodenfronten organisiert."
 AOEIW19_SOV_union_of_republics_spirit:0 "Union der Sowjetrepubliken"
 AOEIW19_SOV_union_of_republics_spirit_desc:0 "Föderale Formen verbinden revolutionäre Selbstverwaltung mit gemeinsamer Planung und Verteidigung."
 AOEIW19_SOV_stalin_central_committee_spirit:0 "Die Maschine des Zentralkomitees"
 AOEIW19_SOV_stalin_central_committee_spirit_desc:0 "Ein diszipliniertes Ernennungsnetz setzt Beschlüsse im neuen Staat durch."
 AOEIW19_SOV_stalin_first_five_year_plan_spirit:0 "Der Erste Fünfjahresplan"
 AOEIW19_SOV_stalin_first_five_year_plan_spirit_desc:0 "Verbindliche Schwerindustrieziele erzeugen schnelles Wachstum durch harte gesellschaftliche Abschöpfung."
 AOEIW19_SOV_stalin_magnitogorsk_spirit:0 "Das Magnitogorsk-Modell"
 AOEIW19_SOV_stalin_magnitogorsk_spirit_desc:0 "Integrierte Industriestädte im Landesinneren konzentrieren Stahl, Maschinen und Rüstung."
 AOEIW19_SOV_stalin_socialism_one_country_spirit:0 "Sozialismus in einem Land"
 AOEIW19_SOV_stalin_socialism_one_country_spirit_desc:0 "Eine Industriefestung verbindet Konsolidierung, Massenproduktion und territoriale Verteidigung."
 AOEIW19_SOV_trotsky_workers_democracy_spirit:0 "Arbeiterdemokratie"
 AOEIW19_SOV_trotsky_workers_democracy_spirit_desc:0 "Offene Sowjetdebatten verbessern Legitimität und erschweren anfangs die Industrieführung."
 AOEIW19_SOV_trotsky_left_opposition_spirit:0 "Programm der Linken Opposition"
 AOEIW19_SOV_trotsky_left_opposition_spirit_desc:0 "Planung, technische Bildung und Arbeiteraufsicht bekämpfen bürokratische Erstarrung."
 AOEIW19_SOV_trotsky_permanent_revolution_spirit:0 "Permanente Revolution"
 AOEIW19_SOV_trotsky_permanent_revolution_spirit_desc:0 "Der Staat nimmt innere Belastung hin, um für einen internationalen Revolutionskampf bereit zu bleiben."
 AOEIW19_SOV_trotsky_international_red_army_spirit:0 "Internationale Rote Armee"
 AOEIW19_SOV_trotsky_international_red_army_spirit_desc:0 "Politische Überzeugung, Auslandserfahrung und bewegliche Führung verbessern die dauerhafte Angriffskraft."
 AOEIW19_SOV_tukhachevsky_war_council_spirit:0 "Revolutionärer Kriegsrat"
 AOEIW19_SOV_tukhachevsky_war_council_spirit_desc:0 "Die Armee wird zur koordinierenden Institution des revolutionären Staates."
 AOEIW19_SOV_tukhachevsky_militarised_economy_spirit:0 "Militarisierte Wirtschaft"
 AOEIW19_SOV_tukhachevsky_militarised_economy_spirit_desc:0 "Rüstungsproduktion und Militärbau erhalten Vorrang vor Zivilentwicklung und Politik."
 AOEIW19_SOV_tukhachevsky_deep_battle_spirit:0 "Mechanisierte tiefe Schlacht"
 AOEIW19_SOV_tukhachevsky_deep_battle_spirit_desc:0 "Gestaffelte Kräfte und mechanisierte Ausnutzung tauschen Nachschubökonomie gegen operativen Durchbruch."
 AOEIW19_SOV_tukhachevsky_continental_war_plan_spirit:0 "Kontinentalkriegsplan"
 AOEIW19_SOV_tukhachevsky_continental_war_plan_spirit_desc:0 "Der gesamte Staat wird für Beginn und Fortführung eines riesigen Landkrieges geordnet."
 AOEIW19_SOV_army_that_endures_spirit:0 "Die Armee, die durchhält"
 AOEIW19_SOV_army_that_endures_spirit_desc:0 "Industrie, Reserven, Artillerie, Nachschub und Luftfahrt ersetzen Verluste schneller, als ein Kontinentalgegner sie nutzen kann."

 aoeiw_phase19_sov.1.t:0 "Brotschlangen in Petrograd"
 aoeiw_phase19_sov.1.d:0 "Bäckereien sind leer, während bewaffnete Arbeiter Bahndepots bewachen. Die Sowjets müssen Rationierungsdisziplin erzwingen oder der Menge die Beschlagnahmung überlassen."
 aoeiw_phase19_sov.1.a:0 "Rationierungskarten vor Parolen."
 aoeiw_phase19_sov.1.b:0 "Die Warteschlangen sollen zur Revolution werden."
 aoeiw_phase19_sov.2.t:0 "Die Landfrage"
 aoeiw_phase19_sov.2.d:0 "Dorfversammlungen teilen Güter auf, bevor Petrograd ein Dekret verfassen kann. Verhandelte Landkomitees retten die Aussaat; sofortige Requisition ernährt die Städte schneller."
 aoeiw_phase19_sov.2.a:0 "Die bäuerlichen Landkomitees anerkennen."
 aoeiw_phase19_sov.2.b:0 "Städte und Armee brauchen das Getreide jetzt."
 aoeiw_phase19_sov.3.t:0 "Der Allrussische Kongress"
 aoeiw_phase19_sov.3.d:0 "Die kaiserlichen Ministerien sind gefallen und Nikolaus II. beherrscht den Staat nicht mehr. Die Delegierten wählen nun zwischen Stalins zentralem Industrieprogramm, Trotzkis permanenter Revolution und Tuchatschewskis militarisiertem Staat der tiefen Schlacht."
 aoeiw_phase19_sov.3.a:0 "Stalin baut den Sozialismus zur Industriefestung."
 aoeiw_phase19_sov.3.b:0 "Trotzki trägt die Revolution über Russland hinaus."
 aoeiw_phase19_sov.3.c:0 "Tuchatschewski schmiedet den Staat zur Armee."
