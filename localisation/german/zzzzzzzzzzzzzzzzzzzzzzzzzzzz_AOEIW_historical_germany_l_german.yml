l_german:
 AOEIW_HIST_GER_nationalist_opposition:0 "§ODie nationalsozialistische Opposition§!"
 AOEIW_HIST_GER_nationalist_opposition_desc:0 "The economic crisis and parliamentary deadlock have widened the audience for Hitler's movement. Bringing it into the struggle for power will close Germany's imperial alternatives."
 AOEIW_HIST_GER_industrialist_contacts:0 "Court the Industrialists"
 AOEIW_HIST_GER_industrialist_contacts_desc:0 "Conservative businessmen can provide money and access, but their support carries expectations for rearmament and labour discipline."
 AOEIW_HIST_GER_january_crisis:0 "The January Crisis"
 AOEIW_HIST_GER_january_crisis_desc:0 "Back-room negotiations now determine whether the nationalist movement can enter government through the chancellery."
 AOEIW_HIST_GER_appoint_hitler:0 "Appoint Hitler Chancellor"
 AOEIW_HIST_GER_appoint_hitler_desc:0 "The old imperial cabinet gives way to a National Socialist government under Adolf Hitler. This decision dismantles the Reichspakt and permanently locks Germany onto the historical dictatorship path."
 AOEIW_HIST_GER_fire_decree:0 "The Reichstag Fire Decree"
 AOEIW_HIST_GER_fire_decree_desc:0 "Emergency powers will be used to suppress political opposition and restrict civil liberties."
 AOEIW_HIST_GER_enabling_act:0 "Secure the Enabling Act"
 AOEIW_HIST_GER_enabling_act_desc:0 "The cabinet demands authority to legislate without parliament, completing the legal destruction of constitutional government."
 AOEIW_HIST_GER_gleichschaltung:0 "Enforce Gleichschaltung"
 AOEIW_HIST_GER_gleichschaltung_desc:0 "Regional institutions, unions and civic organisations are brought under central party control."
 AOEIW_HIST_GER_night_long_knives:0 "The Night of the Long Knives"
 AOEIW_HIST_GER_night_long_knives_desc:0 "The regime moves violently against internal rivals while seeking the army leadership's cooperation."
 AOEIW_HIST_GER_fuhrer_state:0 "The Führer State"
 AOEIW_HIST_GER_fuhrer_state_desc:0 "The dictatorship is formally consolidated around Hitler, a centralised party state and a new Axis alliance."
 AOEIW_HIST_GER_reich_labour_service:0 "Expand the Reich Labour Service"
 AOEIW_HIST_GER_reich_labour_service_desc:0 "State-directed labour projects reduce unemployment and expand infrastructure for the coming mobilisation."
 AOEIW_HIST_GER_four_year_plan_desc:0 "German industry is reorganised to prepare the economy for war within four years."
 AOEIW_HIST_GER_autarky:0 "Drive for Autarky"
 AOEIW_HIST_GER_autarky_desc:0 "Synthetic fuel and substitute materials are prioritised to reduce dependence on vulnerable imports."
 AOEIW_HIST_GER_reichswerke:0 "Build the Reichswerke"
 AOEIW_HIST_GER_reichswerke_desc:0 "A state industrial combine will force the expansion of steel and armaments output."
 AOEIW_HIST_GER_war_economy:0 "Prepare the War Economy"
 AOEIW_HIST_GER_war_economy_desc:0 "Civilian expansion now yields to sustained military production."
 AOEIW_HIST_GER_secret_rearmament:0 "Accelerate Rearmament"
 AOEIW_HIST_GER_secret_rearmament_desc:0 "Treaty restrictions are discarded as Germany rebuilds a mass army."
 AOEIW_HIST_GER_general_staff_pact:0 "A Pact with the General Staff"
 AOEIW_HIST_GER_general_staff_pact_desc:0 "The professional officer corps retains operational authority in exchange for political loyalty."
 AOEIW_HIST_GER_panzerwaffe:0 "Forge the Panzerwaffe"
 AOEIW_HIST_GER_panzerwaffe_desc:0 "Independent armoured formations and mobile command methods become central to German planning."
 AOEIW_HIST_GER_rebuild_luftwaffe:0 "Rebuild the Luftwaffe"
 AOEIW_HIST_GER_rebuild_luftwaffe_desc:0 "A modern air force is openly organised around fighters, bombers and rapid ground support."
 AOEIW_HIST_GER_close_air_support:0 "Close Air Support Doctrine"
 AOEIW_HIST_GER_close_air_support_desc:0 "Air and land commands develop common procedures for fast operational breakthroughs."
 AOEIW_HIST_GER_plan_z:0 "Plan Z"
 AOEIW_HIST_GER_plan_z_desc:0 "A balanced surface fleet offers prestige and long-term power, but competes with immediate continental needs."
 AOEIW_HIST_GER_uboat_arm:0 "The U-boat Arm"
 AOEIW_HIST_GER_uboat_arm_desc:0 "Submarines promise a cheaper means of strangling enemy trade and avoiding a surface battle."
 AOEIW_HIST_GER_blitzkrieg_machine:0 "A Machine for Blitzkrieg"
 AOEIW_HIST_GER_blitzkrieg_machine_desc:0 "Armour, motorised forces, radios and tactical aviation are integrated into a single operational system."
 AOEIW_HIST_GER_rhineland:0 "Remilitarise the Rhineland"
 AOEIW_HIST_GER_rhineland_desc:0 "German troops return to the demilitarised western frontier, openly challenging the post-war settlement."
 AOEIW_HIST_GER_anschluss:0 "Anschluss with Austria"
 AOEIW_HIST_GER_anschluss_desc:0 "Germany asserts a national claim to the six Austrian heartland states. This grants German cores on Austria, but transfers no territory and does not annex the wider Habsburg realm."
 AOEIW_HIST_GER_sudeten_crisis:0 "The Sudeten Crisis"
 AOEIW_HIST_GER_sudeten_crisis_desc:0 "Claims on the German-speaking borderlands of Czechoslovakia are used to provoke an international confrontation."
 AOEIW_HIST_GER_fate_czechoslovakia:0 "The Fate of Czechoslovakia"
 AOEIW_HIST_GER_fate_czechoslovakia_desc:0 "The remaining Czechoslovak state is marked for occupation or forced submission."
 AOEIW_HIST_GER_pact_with_moscow:0 "The Pact with Moscow"
 AOEIW_HIST_GER_pact_with_moscow_desc:0 "A temporary non-aggression pact with Russia clears the way for war in the west."
 AOEIW_HIST_GER_danzig_or_war:0 "Danzig or War"
 AOEIW_HIST_GER_danzig_or_war_desc:0 "If Poland remains our subject, its autonomy will be reduced; otherwise Germany receives a war goal. The eastern settlement can no longer remain unresolved."
 AOEIW_HIST_GER_around_maginot:0 "Around the Maginot Line"
 AOEIW_HIST_GER_around_maginot_desc:0 "Operational planning turns west toward a rapid defeat of France through the Low Countries."
 AOEIW_HIST_GER_operation_barbarossa:0 "Operation Barbarossa"
 AOEIW_HIST_GER_operation_barbarossa_desc:0 "The temporary eastern pact is abandoned and preparations begin for a vast war against Russia."
 AOEIW_HIST_GER_industrialist_backing:0 "Industrialist Backing"
 AOEIW_HIST_GER_industrialist_backing_desc:0 "Conservative industrial interests are financing the movement in expectation of rearmament contracts."
 AOEIW_HIST_GER_dictatorship_in_formation:0 "Dictatorship in Formation"
 AOEIW_HIST_GER_dictatorship_in_formation_desc:0 "The new government is rapidly dismantling constitutional checks."
 AOEIW_HIST_GER_centralised_state:0 "Centralised State"
 AOEIW_HIST_GER_totalitarian_state:0 "Totalitarian Party State"
 AOEIW_HIST_GER_four_year_plan:0 "The Four Year Plan"
 AOEIW_HIST_GER_autarky_programme:0 "Autarky Programme"
 AOEIW_HIST_GER_mobilised_economy:0 "Mobilised War Economy"
 AOEIW_HIST_GER_general_staff_compromise:0 "General Staff Compromise"
 AOEIW_HIST_GER_mobile_warfare_command:0 "Mobile Warfare Command"
 AOEIW_HIST_GER_combined_arms_command:0 "Combined Arms Command"
 AOEIW_HIST_GER_plan_z_spirit:0 "Plan Z Construction"
 AOEIW_HIST_GER_uboat_spirit:0 "Wolfpack Programme"
 AOEIW_HIST_GER_eastern_campaign:0 "Eastern Campaign Preparations"
 aoeiw_hist_ger.1.t:0 "The National Socialist Opposition"
 aoeiw_hist_ger.1.d:0 "Hitler's party exploits economic fear, nationalist resentment and the paralysis of the imperial cabinet. Its entry into elite politics makes a constitutional solution less likely."
 aoeiw_hist_ger.1.a:0 "Open negotiations with the movement."
 aoeiw_hist_ger.2.t:0 "The January Back Rooms"
 aoeiw_hist_ger.2.d:0 "Conservative politicians believe they can contain Hitler inside a cabinet of their own design. The alternative is another fragile emergency government."
 aoeiw_hist_ger.2.a:0 "The chancellery is within reach."
 aoeiw_hist_ger.2.b:0 "Avoid one final provocation."
 aoeiw_hist_ger.3.t:0 "Hitler Becomes Chancellor"
 aoeiw_hist_ger.3.d:0 "Adolf Hitler has been appointed chancellor. The imperial order and the Reichspakt are dissolved as the new regime begins concentrating power."
 aoeiw_hist_ger.3.a:0 "Germany enters a dangerous new era."
 aoeiw_hist_ger.4.t:0 "Emergency Rule after the Reichstag Fire"
 aoeiw_hist_ger.4.d:0 "The government uses the fire to demand sweeping emergency powers, arrests political opponents and curtails civil liberties."
 aoeiw_hist_ger.4.a:0 "Apply the decree without restraint."
 aoeiw_hist_ger.4.b:0 "Preserve limited legal procedure."
 aoeiw_hist_ger.5.t:0 "The Night of the Long Knives"
 aoeiw_hist_ger.5.d:0 "The regime violently eliminates internal rivals and political opponents. The army leadership now expects its institutional position to be protected."
 aoeiw_hist_ger.5.a:0 "Secure the army leadership's cooperation."
 aoeiw_hist_ger.5.b:0 "Empower the party radicals."
 aoeiw_hist_ger.6.t:0 "Priorities of the Four Year Plan"
 aoeiw_hist_ger.6.d:0 "Resources are limited. The plan can privilege immediate armaments output or the civilian base needed to sustain a longer mobilisation."
 aoeiw_hist_ger.6.a:0 "Armaments first."
 aoeiw_hist_ger.6.b:0 "Expand the industrial base."
