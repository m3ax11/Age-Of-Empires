l_german:
 AOEIW23_GER_army_doctrine:0 "Waffengattungen des Reichsheeres"
 AOEIW23_GER_army_doctrine_desc:0 "Infanterie, Artillerie und Stabsarbeit werden auf eine gemeinsame operative Sprache vereinheitlicht."
 AOEIW23_GER_army_doctrine_mastered:0 "Auftragstaktik"
 AOEIW23_GER_army_doctrine_mastered_desc:0 "Unterführer erhalten Befugnisse, Verbindungen und Feuerunterstützung, um die Absicht des Befehlshabers selbständig umzusetzen."
 AOEIW23_FRA_army_doctrine:0 "Manöverreserve"
 AOEIW23_FRA_army_doctrine_desc:0 "Gepanzerte Reserven und methodische Planung verwandeln örtliche Krisen in Gelegenheiten zum vorbereiteten Gegenstoß."
 AOEIW23_FRA_army_doctrine_mastered:0 "Methodische Schlacht"
 AOEIW23_FRA_army_doctrine_mastered_desc:0 "Frankreich verbindet befestigte Verteidigung, bewegliche Reserven und sorgfältig vorbereitete Feuerpläne zu einer nationalen Doktrin."
 AOEIW23_SOV_army_doctrine:0 "Operative Tiefe"
 AOEIW23_SOV_army_doctrine_desc:0 "Gestaffelte Kräfte, Bahnnachschub und tiefe Reserven erlauben es der Armee, einen Schlag aufzunehmen, ohne den Feldzug aufzugeben."
 AOEIW23_SOV_army_doctrine_mastered:0 "Die Schule der Tiefen Operation"
 AOEIW23_SOV_army_doctrine_mastered_desc:0 "Operative Reserven und ein diszipliniertes Nachschubsystem tragen Offensiven über den gewaltigen russischen Kriegsschauplatz."
 AOEIW23_ENG_army_doctrine:0 "Expeditionsstab"
 AOEIW23_ENG_army_doctrine_desc:0 "Eine kompakte Berufsarmee lernt, Verbände weit von den Heimatinseln entfernt einzusetzen, zu versorgen und zu führen."
 AOEIW23_ENG_army_doctrine_mastered:0 "Imperialer Generalstab"
 AOEIW23_ENG_army_doctrine_mastered_desc:0 "Gemeinsame Stabsverfahren verbinden entfernte Garnisonen und Eliteverbände zu einem Expeditionsinstrument."
 AOEIW23_USA_army_doctrine:0 "Motorisierte Mobilmachung"
 AOEIW23_USA_army_doctrine_desc:0 "Einheitliche Fahrzeuge, Depots und Wartungspläne verwandeln die amerikanische Industrie in Beweglichkeit auf dem Schlachtfeld."
 AOEIW23_USA_army_doctrine_mastered:0 "Industrielle Kriegführung"
 AOEIW23_USA_army_doctrine_mastered_desc:0 "Mechanisierte Verbände kämpfen am Ende eines konkurrenzlosen kontinentalen Produktions- und Logistiksystems."
 AOEIW23_ITA_army_doctrine:0 "Mobiles Armeekorps"
 AOEIW23_ITA_army_doctrine_desc:0 "Infanterie, Panzer und Artillerie werden für die kurzen Linien und plötzlichen Wendungen des Mittelmeerkrieges organisiert."
 AOEIW23_ITA_army_doctrine_mastered:0 "Bewegungskrieg"
 AOEIW23_ITA_army_doctrine_mastered_desc:0 "Italienische Kampfgruppen lernen, die Entscheidung zu erzwingen, bevor schwieriges Gelände und dünne Nachschublinien den Vormarsch stoppen."
 AOEIW23_JAP_army_doctrine:0 "Regimentsgeist"
 AOEIW23_JAP_army_doctrine_desc:0 "Strenge Führung der unteren Ebenen und leichte Nachschubkolonnen bereiten die Infanterie auf Einsätze jenseits sicherer Häfen und Bahnköpfe vor."
 AOEIW23_JAP_army_doctrine_mastered:0 "Entscheidende Infanterieschlacht"
 AOEIW23_JAP_army_doctrine_mastered_desc:0 "Eliteinfanterie und genügsame Logistik suchen die Entscheidung in Gelände, das schwerere Armeen ausbremst."
 AOEIW23_CHI_army_doctrine:0 "Verteidigung in der Tiefe"
 AOEIW23_CHI_army_doctrine_desc:0 "Feldbefestigungen, verteilte Munition und regionale Reserven machen jede Provinz teuer zu erobern."
 AOEIW23_CHI_army_doctrine_mastered:0 "Der nationale Widerstandskrieg"
 AOEIW23_CHI_army_doctrine_mastered_desc:0 "Infanteriearmeen tauschen Raum gegen Zeit, während Artillerie und Reserven jeden erschöpften Durchbruch bestrafen."
 AOEIW23_RAJ_army_doctrine:0 "Grenzkolonnen"
 AOEIW23_RAJ_army_doctrine_desc:0 "Leichte Kolonnen, Gebirgstruppen und lokale Nachschubdienste bereiten die Armee auf weite und schwierige Grenzen vor."
 AOEIW23_RAJ_army_doctrine_mastered:0 "Armee des Subkontinents"
 AOEIW23_RAJ_army_doctrine_mastered_desc:0 "Eine kontinentale Armee verbindet tiefe Personalreserven mit Spezialverbänden für den Kampf von der Wüste bis ins Gebirge."
 AOEIW23_FRA_liberal_imperial_army:0 "Armee der Nation"
 AOEIW23_FRA_liberal_imperial_army_desc:0 "Das Liberale Empire bindet Beförderung und Mobilmachung an das Gesetz und schafft eine belastbare Bürgerarmee statt einer Hofgarde."
 AOEIW23_FRA_napoleonic_army:0 "Die napoleonische Panzerarmee"
 AOEIW23_FRA_napoleonic_army_desc:0 "Eine moderne Grande Armée konzentriert Panzer, motorisierte Infanterie und operative Reserven für den entscheidenden Durchbruch. Ihr Nachschubbedarf ist der Preis dieser Schlagkraft."
 AOEIW23_GER_imperial_field_army:0 "Das kaiserliche Feldheer"
 AOEIW23_GER_imperial_field_army_desc:0 "Die wiederhergestellte Reichsordnung verbindet Regimentstradition mit einem modernen Infanterie-Artillerie-System."
 AOEIW23_GER_republican_reichswehr:0 "Parlamentarisches Verteidigungskommando"
 AOEIW23_GER_republican_reichswehr_desc:0 "Zivile Kontrolle, Berufsoffiziere und verlässliche Logistik schaffen eine Armee zur Verteidigung der Verfassungsordnung."
 AOEIW23_ITA_royal_army:0 "Das erneuerte königliche Heer"
 AOEIW23_ITA_royal_army_desc:0 "Das Haus Savoyen versöhnt das Offizierskorps mit einer professionellen, verteidigungsfähigen nationalen Führung."
 AOEIW23_ITA_national_army:0 "Die Armee der nationalen Wiedergeburt"
 AOEIW23_ITA_national_army_desc:0 "Ein zentralisierter Staat baut schnelle Kampfgruppen aus Artillerie, Panzern und politischer Mobilisierung auf."
 AOEIW23_ITA_duce_command:0 "Oberkommando des Duce"
 AOEIW23_ITA_duce_command_desc:0 "Politische Zentralisierung treibt eine rücksichtslose Offensivdoktrin an, die im Angriff stark, aber vom Schwung abhängig ist."
 AOEIW23_ITA_legions_of_empire:0 "Legionen des neuen Imperiums"
 AOEIW23_ITA_legions_of_empire_desc:0 "Elitelegionen der verbundenen Waffen werden für den letzten Mittelmeerfeldzug ausgerüstet – zu erheblichen logistischen Kosten."
