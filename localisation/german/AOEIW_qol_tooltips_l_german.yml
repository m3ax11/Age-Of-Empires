l_german:
 AOEIW_QOL_TT_POLITICAL_EVENT: "§YWichtige Folge:§! Sofort beginnt ein Ereignis mit einer politischen Entscheidung. Die Folgen werden vor der Auswahl angezeigt."
 AOEIW_QOL_TT_REVOLUTION_EVENT: "§RWichtige Folge:§! Treibt eine revolutionäre Ereigniskette voran, die Regierung, Staatsführer und verfügbaren Politikzweig verändern kann."
 AOEIW_QOL_TT_DIPLOMATIC_CONFERENCE: "§YWichtige Folge:§! Beruft eine internationale Konferenz ein; beteiligte Regierungen antworten über Ereignisse."
 AOEIW_QOL_TT_ADENAUER_GOVERNMENT: "§YRegierungs- und Führungswechsel:§! Die Monarchie tritt ab, Konrad Adenauer wird Staatsführer und die Verfassungsregierung wird eingesetzt."
 AOEIW_QOL_TT_GER_INDUSTRIAL_LEAGUE: "§YFraktionswechsel:§! Gründet die Liga der Industrierepubliken, sofern Deutschland keiner anderen Fraktion angehört. Geeignete polnische und niederländische Partner treten bei."
 AOEIW_QOL_TT_FRA_WORKERS_INTERNATIONAL: "§YFraktionswechsel:§! Frankreich beendet seine strategische Isolation und gründet die Arbeiterinternationale."
 AOEIW_QOL_TT_ITA_WORKERS_COMPACT: "§YFraktionswechsel:§! Gründet den Mittelmeer-Arbeiterpakt. Geeignete rumänische, jugoslawische und bulgarische Partner treten bei."
 AOEIW_QOL_TT_SOV_REVOLUTIONARY_UNION: "§YFraktionswechsel:§! Gründet die Union der Revolutionären Republiken, sofern Russland keiner anderen Fraktion angehört."

 AOEIW_QOL_TT_CHINA_DYNASTIC_CRISIS: "§RWichtige Folge:§! Eröffnet die Chinesische Dynastiekrise und ihre imperialen, nationalistischen und revolutionären Lösungswege."
 AOEIW_QOL_TT_CHINA_DYNASTY_VICTORY: "§YRegierungs- und Führungswechsel:§! Puyi wird als Kaiser bestätigt; die Dynastiekrise endet mit dauerhaften politischen und wirtschaftlichen Kosten."
 AOEIW_QOL_TT_CHINA_NRA_PATH: "§RWichtige Folge:§! Beginnt den Weg der Nationalrevolutionären Armee und ihre Bürgerkriegs-Mobilisierungsereignisse."
 AOEIW_QOL_TT_CHINA_MAO_PATH: "§RWichtige Folge:§! Beginnt Maos revolutionären Weg und seine Bürgerkriegs-Mobilisierungsereignisse."
 AOEIW_QOL_TT_CHINA_SETTLEMENT: "§YNachkriegsordnung:§! Beendet die Krise entsprechend dem siegreichen Weg und schaltet das passende Wiederaufbauprogramm frei."
 AOEIW_QOL_TT_CHIANG_LEADERSHIP: "§YFührungswechsel:§! Chiang Kai-shek übernimmt die Macht; China erhält die NRA-Identität und einen zentralisierten nationalistischen Staat. Löst außerdem NRA-Sieg-Superevent und Audio aus."
 AOEIW_QOL_TT_MAO_LEADERSHIP: "§YFührungs- und Regierungswechsel:§! Mao Zedong übernimmt die Macht; China wird kommunistisch und erhält die revolutionäre Identität. Löst außerdem KPCh-Sieg-Superevent und Audio aus."
 AOEIW_QOL_TT_COUNCIL_LEADERSHIP: "§YRegierungsausgang:§! Der Koalitionsrat bleibt an der Macht und bewahrt den Staat der Einheitsfront, statt Chiang oder Mao einzusetzen."

 AOEIW_QOL_TT_RAISE_REGIONAL_ARMIES: "§YEinmalige Mobilisierung:§! Fügt §G300.000§! Mannstärke, §G15.000§! Infanterieausrüstung und §G10§! Armee-Erfahrung hinzu."
 AOEIW_QOL_TT_EMERGENCY_ARSENALS: "§YSofortbau:§! Fügt §G2 Militärfabriken§! und einen gemeinsamen Bauplatz in Chongqing hinzu."
 AOEIW_QOL_TT_REVOLUTIONARY_OFFENSIVE_DECISION: "§YZeitwirkung — 120 Tage:§! Aktiviert den Nationalgeist „Letzte Offensive“ ."
 AOEIW_QOL_TT_INFLUENCE_INCREASE: "Erhöht den Einfluss dieses Machtblocks §Yum eine Stufe§!. Nur ein Block kann gleichzeitig die beherrschende Stellung erreichen."
 AOEIW_QOL_TT_INFLUENCE_DECREASE: "Senkt den Einfluss dieses Machtblocks §Yum eine Stufe§!."
