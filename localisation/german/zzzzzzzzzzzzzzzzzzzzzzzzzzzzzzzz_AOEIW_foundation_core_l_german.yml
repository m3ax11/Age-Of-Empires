 AOEIW9_BRA_eco_infra_1:0 "Die Kaffeestaaten verbinden"
 AOEIW9_BRA_eco_infra_1_desc:0 "Die Eliten der Kaffeestaaten, Vargas und das Heer streiten um den Bundesetat. Binnenmärkte zu verbinden und eine Rüstungsindustrie aufzubauen verlangt unterschiedliche Bündnisse in Rio. Die Depotanbindung finanziert eine Infrastrukturstufe in einem kontrollierten Kerngebiet und einen Logistik-Forschungsbonus."
