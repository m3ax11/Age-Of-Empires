 AOEIW9_AUS_mil_army_3_desc:0 "Die Donauarmee benötigt gemeinsame Ausbildung ihrer Nationalitäten, ob für Infanterie oder eine zentrale Panzerreserve. Dieses Programm verbessert Ausbildung, Ausrüstung oder Unterstützung des gewählten Heeres. Gemeinsame Dienste bleiben für beide Spezialisierungen verfügbar."
