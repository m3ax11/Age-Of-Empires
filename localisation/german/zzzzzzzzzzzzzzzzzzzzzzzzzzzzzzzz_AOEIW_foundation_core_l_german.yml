 AOEIW9_AUS_eco_infra_1:0 "Der gemeinsame Donaubahnetat"
 AOEIW9_AUS_eco_infra_1_desc:0 "Wien regiert eine Donaumonarchie, kein australisches Dominion. Kronlandtage, ungarische Ministerien und das gemeinsame Heer müssen klären, wer Bahnen und Arsenale finanziert. Die Depotanbindung finanziert eine Infrastrukturstufe in einem kontrollierten Kerngebiet und einen Logistik-Forschungsbonus."
