 AOEIW9_YUG_eco_infra_1:0 "Die Teilregionen verbinden"
 AOEIW9_YUG_eco_infra_1_desc:0 "Belgrad muss mit den Teilregionen verhandeln, bevor es das Heer vereinheitlicht. Adriawerften, Binnenbahnen und gespaltene Offiziersnetzwerke machen Zentralisierung zu einer praktischen Streitfrage. Die Depotanbindung finanziert eine Infrastrukturstufe in einem kontrollierten Kerngebiet und einen Logistik-Forschungsbonus."
