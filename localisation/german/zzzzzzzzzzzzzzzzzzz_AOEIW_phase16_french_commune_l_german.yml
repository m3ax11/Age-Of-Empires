 AOEIW16_FRA_communal_congress:0 "Kommunalkongress"
 AOEIW16_FRA_communal_congress_long:0 "Kongress der Arbeiter- und Soldatenkommunen"
 AOEIW16_workers_international:0 "Arbeiterinternationale"
 AOEIW16_constitutional_entente:0 "Konstitutionelle Entente"

 AOEIW9_FRA_politics_p3_1:0 "Pariser Fabrikkomitees organisieren"
 AOEIW9_FRA_politics_p3_1_desc:0 "Gewerkschaftsdelegierte und sozialistische Organisatoren verwandeln die Pariser Werkstätten in eine politische Gegenmacht. Ihre offene Unterstützung beginnt eine Konfrontation, die der bonapartistische Staat nicht ignorieren kann."
 AOEIW9_FRA_politics_p3_2:0 "Den Generalstreik ausrufen"
 AOEIW9_FRA_politics_p3_2_desc:0 "Bahndepots, Bergwerke, Arsenale und Fabriken werden gemeinsam stillstehen. Der Streik kann die kaiserliche Verwaltung brechen, doch jede ruhende Maschine vertieft die wirtschaftlichen Kosten der Revolution."
 AOEIW9_FRA_politics_p3_3:0 "Die Arbeiter bewaffnen"
 AOEIW9_FRA_politics_p3_3_desc:0 "Fabrikwachen und Veteranenverbände verteilen Gewehre an zuverlässige Komitees. Die Revolution erhält einen Schild, während der Staat sein Gewaltmonopol verliert."
 AOEIW9_FRA_politics_p3_4:0 "Die bonapartistische Befehlskette brechen"
 AOEIW9_FRA_politics_p3_4_desc:0 "Befehle aus den kaiserlichen Ministerien konkurrieren nun mit Aufrufen der Soldatenräte. Die alte Befehlskette muss fallen, doch das Heer wird dadurch gefährlich desorganisiert."
 AOEIW9_FRA_politics_p3_5:0 "Militärische Überläufer aufnehmen"
 AOEIW9_FRA_politics_p3_5_desc:0 "Regimenter im Pariser Becken und im industriellen Norden erklären sich für die Komitees. Ihre Offiziere müssen der zivilen Revolutionsgewalt dienen oder ihre Kommandos niederlegen."
 AOEIW9_FRA_politics_p3_6:0 "Die kaiserlichen Ministerien zerschlagen"
 AOEIW9_FRA_politics_p3_6_desc:0 "Präfekturen, Senat und bonapartistische Ministerien können nicht mehr regieren. Ihre verbliebene Gewalt wird aufgelöst und gewählten Kommunaldelegierten übertragen."
 AOEIW9_FRA_politics_p3_7:0 "Kongress der Französischen Kommune"
 AOEIW9_FRA_politics_p3_7_desc:0 "Delegierte der Gewerkschaften, Fabrikkomitees, Soldaten und Provinzen versammeln sich in Paris, um ein neues Frankreich auf Grundlage der Arbeitermacht auszurufen."

 AOEIW16_FRA_stabilise_factory_committees:0 "Fabrikkomitees stabilisieren"
 AOEIW16_FRA_stabilise_factory_committees_desc:0 "Aus Notbeschlagnahmungen muss verantwortliche Verwaltung werden. Gewählte Produktionsräte stellen Pläne wieder her, regeln Löhne und bringen stillstehende Bänder in Gang."
 AOEIW16_FRA_council_production_quotas:0 "Billancourt setzt die Quote"
 AOEIW16_FRA_council_production_quotas_desc:0 "Delegierte bei Renault-Billancourt gleichen Gewehr- und Fahrzeugaufträge mit Maschinen, Schichten und Stahl ab. Paris darf Zahlen verlangen; die besetzten Werke müssen ihre Lieferfähigkeit beweisen."
 AOEIW16_FRA_mass_rifle_programme:0 "Gewehre für die Bürgerarmee"
 AOEIW16_FRA_mass_rifle_programme_desc:0 "Saint-Étienne vereinfacht Gewehrteile und Abnahme, damit die kommunale Armee rasch bewaffnet wird. Qualität zeigt sich auf dem Schießstand, nicht im Streit rivalisierender Ausschüsse."
 AOEIW16_FRA_communal_arsenals:0 "Kommunale Arsenale"
 AOEIW16_FRA_communal_arsenals_desc:0 "Werkstätten für Unterstützungsausrüstung und Artillerie werden um gemeinsame Zeichnungen und gebündelte Werkzeugmaschinen neu organisiert."
 AOEIW16_FRA_national_factory_congress:0 "Nationaler Fabrikkongress"
 AOEIW16_FRA_national_factory_congress_desc:0 "Delegierte aller großen Industriebezirke koordinieren die Produktion als nationales System, ohne die Kontrolle in den Werkhallen abzuschaffen."
 AOEIW16_FRA_maximum_efficiency_directive:0 "Direktive für maximale Effizienz"
 AOEIW16_FRA_maximum_efficiency_directive_desc:0 "Lange Produktionsserien, geschützte Werkzeuge und gemeinsame technische Normen geben der Kommune eine der weltweit höchsten nachhaltigen Produktionseffizienzgrenzen."
 AOEIW16_FRA_citizen_army:0 "Das Bürgerheer"
 AOEIW16_FRA_citizen_army_desc:0 "Die revolutionären Milizen bilden den Kern eines Massenheeres, dessen Autorität von der Kommune statt von einem verschwundenen Hof ausgeht."
 AOEIW16_FRA_militias_into_line_divisions:0 "Milizen zu Liniendivisionen"
 AOEIW16_FRA_militias_into_line_divisions_desc:0 "Ausbildungskader formen aus begeisterten Bataillonen verlässliche Infanterieverbände mit Pionieren, Fernmeldern und Sanitätsdiensten."
 AOEIW16_FRA_mass_war_staff:0 "Der Massenkriegsstab"
 AOEIW16_FRA_mass_war_staff_desc:0 "Ein neuer Generalstab plant Verstärkung, Erholung und den dauerhaften Einsatz eines gewaltigen Bürgerheeres statt einer kleinen Berufstruppe."
 AOEIW16_FRA_workers_aviation:0 "Arbeiterluftfahrt"
 AOEIW16_FRA_workers_aviation_desc:0 "Flugzeugmechaniker, Piloten und Fabrikdelegierte bauen die französische Luftfahrt um schnellen Ersatz und Luftnahunterstützung des Bürgerheeres neu auf."
 AOEIW16_FRA_replacement_airframes:0 "Ersatzflugzeugzellen"
 AOEIW16_FRA_replacement_airframes_desc:0 "Vereinfachte Jäger und Nahunterstützungsflugzeuge werden für schnelle Fertigung, Feldreparatur und Ersatz nach Verlusten entworfen."
 AOEIW16_FRA_naval_loyalty_convention:0 "Konvent über die Flottenloyalität"
 AOEIW16_FRA_naval_loyalty_convention_desc:0 "Vertreter der Atlantik- und Mittelmeerflotten bestimmen die Stellung von Admiralen, Matrosenkomitees und Marinestützpunkten unter der Kommune."
 AOEIW16_FRA_red_fleets:0 "Die Roten Flotten"
 AOEIW16_FRA_red_fleets_desc:0 "Die Marine bleibt als professionelle Streitmacht erhalten, doch Besatzungen und Stützpunkte dienen der Kommune unter einem neuen Pakt."
 AOEIW16_FRA_revolutionary_diplomacy:0 "Revolutionäre Diplomatie"
 AOEIW16_FRA_revolutionary_diplomacy_desc:0 "Der Zusammenbruch der Alten Ordnung erlaubt Frankreich, Arbeiterregierungen im Ausland zu fördern und feindlichen Koalitionen entgegenzutreten."
 AOEIW16_FRA_workers_international:0 "Die Arbeiterinternationale gründen"
 AOEIW16_FRA_workers_international_desc:0 "Frankreich errichtet ein unabhängiges revolutionäres Bündnis für Regierungen, die bereit sind, die Arbeitermacht zu verteidigen."
 AOEIW16_FRA_fortress_commune:0 "Festung Kommune"
 AOEIW16_FRA_fortress_commune_desc:0 "Kein ausländisches Kapital wird die Revolution lenken. Frankreich setzt auf bewaffnete Neutralität, inneren Zusammenhalt und sein eigenes Bürgerheer."
 AOEIW16_FRA_arsenal_of_the_commune:0 "Arsenal der Kommune"
 AOEIW16_FRA_arsenal_of_the_commune_desc:0 "Fabrikräte, kommunale Arsenale, Arbeiterluftfahrt und eine loyale Flotte versorgen nun ein gewaltiges Bürgerheer. Der revolutionäre Übergang ist vollendet."

 AOEIW16_FRA_strike_wave:0 "Landesweite Streikwelle"
 AOEIW16_FRA_strike_wave_desc:0 "Der Generalstreik lähmt Produktion und Verwaltung, während Fabrikkomitees den kaiserlichen Staat herausfordern."
 AOEIW16_FRA_revolutionary_command_crisis:0 "Revolutionäre Führungskrise"
 AOEIW16_FRA_revolutionary_command_crisis_desc:0 "Widersprüchliche Befehle, politische Überläufer und fehlende Offiziere haben Organisation und Planung des Heeres schwer gestört."
 AOEIW16_FRA_postrevolution_industry_disruption:0 "Gestörte kommunale Industrie"
 AOEIW16_FRA_postrevolution_industry_disruption_desc:0 "Die alten Eigentümer sind geflohen oder abgesetzt, doch die neuen Produktionsräte haben noch keine verlässliche Leistung hergestellt."
 AOEIW16_FRA_postrevolution_command_disruption:0 "Gestörte revolutionäre Führung"
 AOEIW16_FRA_postrevolution_command_disruption_desc:0 "Die kaiserliche Befehlskette ist verschwunden; eine glaubwürdige kommunale Kommandostruktur muss sie erst ersetzen."
 AOEIW16_FRA_admirals_compromise:0 "Kompromiss der Admirale"
 AOEIW16_FRA_admirals_compromise_desc:0 "Berufsoffiziere behalten die operative Führung, akzeptieren jedoch zivile Aufsicht und gewählte Flottendelegierte."
 AOEIW16_FRA_sailors_committees:0 "Vorherrschaft der Matrosenkomitees"
 AOEIW16_FRA_sailors_committees_desc:0 "Der revolutionäre Eifer ist groß, doch die Komiteekontrolle verlangsamt vorübergehend Werften und Flottenorganisation."
 AOEIW16_FRA_factory_councils:0 "Nationales Netz der Fabrikräte"
 AOEIW16_FRA_factory_councils_desc:0 "Arbeitergeführte Fabriken teilen Pläne, Maschinen und technisches Wissen durch ein nationales Rätesystem."
 AOEIW16_FRA_maximum_efficiency_directive_spirit:0 "Direktive für maximale Effizienz"
 AOEIW16_FRA_maximum_efficiency_directive_spirit_desc:0 "Geschützte Werkzeuge und lange Serien erlauben ungewöhnlich hohe Spitzeneffizienz, ohne pauschal alle Waffen zu verbilligen."
 AOEIW16_FRA_mass_rifle_production:0 "Massenproduktion von Gewehren"
 AOEIW16_FRA_mass_rifle_production_desc:0 "Infanteriewaffen verwenden standardisierte Teile und vereinfachte Verfahren. Ihre IK-Kosten sinken um 15 Prozent, ohne Panzer, Flugzeuge oder Schiffe zu beeinflussen."
 AOEIW16_FRA_communal_arsenals_spirit:0 "Kommunale Arsenale"
 AOEIW16_FRA_communal_arsenals_spirit_desc:0 "Gebündelte Zeichnungen und Werkzeugmaschinen senken die Kosten von Unterstützungsausrüstung und Artillerie."
 AOEIW16_FRA_citizen_army_spirit:0 "Bürgerheer"
 AOEIW16_FRA_citizen_army_spirit_desc:0 "Die Massenbeteiligung beschleunigt die Mobilmachung und vergrößert den verfügbaren Personalbestand."
 AOEIW16_FRA_mass_war_staff_spirit:0 "Massenkriegsstab"
 AOEIW16_FRA_mass_war_staff_spirit_desc:0 "Der neue Stab ist auf Infanterieoperationen, Verstärkung und Erholung eines sehr großen Heeres spezialisiert."
 AOEIW16_FRA_workers_air_production:0 "Arbeitergeführte Flugzeugproduktion"
 AOEIW16_FRA_workers_air_production_desc:0 "Vereinfachte kleine Flugzeugzellen machen Jäger und Nahunterstützer günstig ersetzbar, während Arbeiterkontrollen Unfälle verringern."
 AOEIW16_FRA_red_fleets_spirit:0 "Rote Atlantik- und Mittelmeerflotten"
 AOEIW16_FRA_red_fleets_spirit_desc:0 "Eine dauerhafte Einigung zwischen Besatzungen, Admiralen und Stützpunkten bewahrt die Flotte als wirksames revolutionäres Instrument."
 AOEIW16_FRA_revolutionary_diplomacy_spirit:0 "Revolutionärer diplomatischer Dienst"
 AOEIW16_FRA_revolutionary_diplomacy_spirit_desc:0 "Disziplinierte Auslandsvertretungen gewinnen Partner und erkennen feindliche Vorbereitungen."
 AOEIW16_FRA_fortress_commune_spirit:0 "Festung Kommune"
 AOEIW16_FRA_fortress_commune_spirit_desc:0 "Bewaffnete Neutralität stärkt Verteidigung und Zusammenhalt, verlangt jedoch zusätzliche Mittel aus dem zivilen Verbrauch."
 AOEIW16_FRA_arsenal_of_the_commune_spirit:0 "Arsenal der Kommune"
 AOEIW16_FRA_arsenal_of_the_commune_spirit_desc:0 "Das ausgereifte kommunale System verbindet hohe Fabrikleistung, schnelle Verstärkung und die Widerstandskraft für den Massenkrieg."

 aoeiw_phase16_fra.1.t:0 "Der Generalstreik"
 aoeiw_phase16_fra.1.d:0 "Von den Pariser Bahndepots bis zu den Bergwerken des Nordens verstummen die Sirenen. Einige Delegierte fordern einen disziplinierten Gewerkschaftsstreik; andere besetzen bereits Werkstätten und setzen Direktoren ab."
 aoeiw_phase16_fra.1.a:0 "Den Streik unter Komiteedisziplin halten."
 aoeiw_phase16_fra.1.b:0 "Die Fabriken beschlagnahmen lassen."
 aoeiw_phase16_fra.2.t:0 "Überläufer im Heer"
 aoeiw_phase16_fra.2.d:0 "Ganze Regimenter verweigern Befehle gegen die Arbeiter. Technische Offiziere bieten an, Versorgung und Kommunikation aufrechtzuerhalten, wenn sie vor Repressalien geschützt werden; militante Delegierte verlangen eine vollständige Säuberung."
 aoeiw_phase16_fra.2.a:0 "Offiziere behalten, die sich der Kommune unterstellen."
 aoeiw_phase16_fra.2.b:0 "Die bonapartistische Führung säubern."
 aoeiw_phase16_fra.3.t:0 "Die Französische Kommune wird ausgerufen"
 aoeiw_phase16_fra.3.d:0 "Unter roten Bannern haben Delegierte von Arbeitern, Soldaten und Provinzkommunen das Zweite Französische Kaiserreich abgeschafft. Maurice Thorez wird mit der Führung des Kongresses betraut, während der neue Staat Produktion und Befehl wiederherstellen muss."
 aoeiw_phase16_fra.3.a:0 "Es lebe die Französische Kommune!"
 aoeiw_phase16_fra.4.t:0 "Die Loyalität der Flotte"
 aoeiw_phase16_fra.4.d:0 "Atlantik- und Mittelmeerflotte liegen unversehrt, aber unsicher in den Häfen. Admirale bestehen auf professioneller Führung; Matrosenkomitees sehen nur in direkter revolutionärer Kontrolle eine Loyalitätsgarantie."
 aoeiw_phase16_fra.4.a:0 "Einen Pakt mit den Admiralen aushandeln."
 aoeiw_phase16_fra.4.b:0 "Die Schiffe den Matrosenkomitees anvertrauen."
 aoeiw_phase16_fra.5.t:0 "Die Alte Ordnung bricht zusammen"
 aoeiw_phase16_fra.5.d:0 "Frankreich hat die bonapartistische Monarchie gestürzt und sein Bündnis aufgelöst. Wien muss die verbliebenen konstitutionellen Staaten sammeln oder der neuen Kommune allein gegenübertreten."
 aoeiw_phase16_fra.5.a:0 "Eine Konstitutionelle Entente bilden."
 aoeiw_phase16_fra.5.b:0 "Bewaffnete Neutralität annehmen."
 aoeiw_phase16_fra.6.t:0 "Belgien nach der französischen Revolution"
 aoeiw_phase16_fra.6.d:0 "Das Bündnis, das Belgien sicherte, ist verschwunden, und jenseits der Grenze steht eine revolutionäre Macht. Brüssel muss zwischen österreichischer Partnerschaft und eigenständiger Verteidigung wählen."
 aoeiw_phase16_fra.6.a:0 "Wiens Konstitutioneller Entente beitreten."
 aoeiw_phase16_fra.6.b:0 "Belgien verteidigt sich selbst."

 AOEIW16_old_order_betrayed:0 "Revolutionärer Bruch"
 AOEIW16_revolutionary_sympathy:0 "Revolutionäre Solidarität"
