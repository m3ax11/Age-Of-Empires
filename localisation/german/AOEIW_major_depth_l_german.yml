 AOEIW_DEPTH_GER_programmes:0 "Reichsaufträge und Länderprogramme"
 AOEIW_DEPTH_GER_programmes_desc:0 "Vom Fokusbaum freigeschaltete Projekte benötigen Finanzierung, Zeit und gesichertes Gebiet."
 AOEIW_DEPTH_GER_staff_programmes:0 "Kabinetts- und Stabsprogramme"
 AOEIW_DEPTH_GER_staff_programmes_desc:0 "Fokusse schalten finanzierte Programme frei. Wählt selbst den Einsatzzeitpunkt. Alternativen teilen sich Budget und Sperrfrist; ihre zeitweiligen Nationalgeister laufen automatisch aus. Dauerhafte Fokusgeister werden aufgewertet statt gestapelt."
 AOEIW_DEPTH_SOV_estate_compromise:0 "Der Kompromiss mit den Landständen"
 AOEIW_DEPTH_SOV_estate_compromise_desc:0 "Landbesitzer garantieren ländliche Lieferungen im Austausch gegen zurückhaltendere Industriesteuern."
 AOEIW_DEPTH_SOV_land_ministry:0 "Das kaiserliche Landministerium"
 AOEIW_DEPTH_SOV_land_ministry_desc:0 "Ein zentrales Landregister stützt die Mobilisierung, provoziert aber lokale Machthaber."
 aoeiw_depth.21.t:0 "Die Gouverneure und die Ernte"
 aoeiw_depth.21.d:0 "Die Gouverneure melden widersprüchliche Zahlen über Getreide, Pferde und Rekruten. Der Hof kann Garantien der Landstände aushandeln oder ein Landministerium schaffen, das selbst nachprüft. Nikolaus muss zwischen ausgehandelter lokaler Loyalität und einem teuren, eigenständig prüfenden Staatsapparat wählen."
 aoeiw_depth.21.a:0 "Garantien der Landstände aushandeln"
 aoeiw_depth.21.b:0 "Ein zentrales Landministerium aufbauen"
 AOEIW_DEPTH_SOV_grain_cooperatives:0 "Verträge mit Getreidegenossenschaften"
 AOEIW_DEPTH_SOV_grain_cooperatives_desc:0 "Ausgehandelte Lieferungen stützen die Stabilität, reservieren aber zivile Ressourcen zulasten der Rüstung."
 AOEIW_DEPTH_SOV_central_grain:0 "Die zentrale Getreidedirektion"
 AOEIW_DEPTH_SOV_central_grain_desc:0 "Zentrale Zuteilungen verbessern die Heeresversorgung zulasten des Vertrauens in die lokalen Sowjets."
 aoeiw_depth.22.t:0 "Die Getreide- und Eisenbahnkonferenz"
 aoeiw_depth.22.d:0 "Die Revolutionsregierung kann die Städte nicht mit Proklamationen ernähren. Genossenschaftsdelegierte bieten feste Verträge, Heeresvertreter verlangen eine zentrale Getreidedirektion. Die Eisenbahner bestehen bei beiden Wegen auf realistischen Fahrzeugzuteilungen. Die Entscheidung prägt dauerhaft das Versorgungssystem."
 aoeiw_depth.22.a:0 "Genossenschaftsverträge aushandeln"
 aoeiw_depth.22.b:0 "Getreidezuteilungen zentralisieren"
 AOEIW_DEPTH_SOV_volga_works:0 "Die Wolga-Werke bauen"
 AOEIW_DEPTH_SOV_volga_works_desc:0 "Baut eine Zivilfabrik im unteren Wolgagebiet und ergänzt 50 Güterzuglokomotiven.\n\nKostet 70 politische Macht, bindet eine Zivilfabrik und dauert 120 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.120.t:0 "Die Wolga-Werke bauen — Abgeschlossen"
 aoeiw_depth.120.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
 aoeiw_depth.120.a:0 "Die Werke in Dienst stellen."
 AOEIW_DEPTH_SOV_moscow_arsenal:0 "Das Moskauer Arsenal erweitern"
 AOEIW_DEPTH_SOV_moscow_arsenal_desc:0 "Baut eine Militärfabrik im Moskauer Gebiet und stellt 500 Infanteriewaffen bereit.\n\nKostet 75 politische Macht, bindet eine Zivilfabrik und dauert 90 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.121.t:0 "Das Moskauer Arsenal erweitern — Abgeschlossen"
 aoeiw_depth.121.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
