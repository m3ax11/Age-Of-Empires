l_german:
 AOEIW_DEPTH_GER_federal_credit:0 "Wiederaufbauanleihen der Länder"
 AOEIW_DEPTH_GER_federal_credit_desc:0 "Provinzkredite finanzieren Investitionen; ihr Schuldendienst bindet zivile Produktion."
 AOEIW_DEPTH_GER_treasury_control:0 "Aufsicht der Reichskasse"
 AOEIW_DEPTH_GER_treasury_control_desc:0 "Zentrale Rechnungsprüfung spart politischen Aufwand, verzögert aber Provinzaufträge."
 aoeiw_depth.1.t:0 "Die Länder verlangen Garantien"
 aoeiw_depth.1.d:0 "Bayerns und Sachsens Minister wollen Berlins neue Kredite nur mit Mitspracherecht garantieren. Der Reichstag kann Wiederaufbauanleihen der Länder absichern oder jeden Auftrag der Reichskasse unterstellen. Es geht um die Kontrolle des Aufbaus, nicht um einen weiteren Treueeid auf den Kaiser."
 aoeiw_depth.1.a:0 "Länderanleihen garantieren"
 aoeiw_depth.1.b:0 "Reichskassenprüfung für jeden Auftrag"
 AOEIW_DEPTH_GER_works_councils:0 "Gesetzliche Betriebsräte"
 AOEIW_DEPTH_GER_works_councils_desc:0 "Arbeiter verhandeln Produktionsänderungen; weniger Störungen gehen mit längeren Verhandlungen einher."
 AOEIW_DEPTH_GER_pension_compact:0 "Der Rentenkompromiss"
 AOEIW_DEPTH_GER_pension_compact_desc:0 "Rentengarantien stützen die Rekrutierung; Beiträge belasten den zivilen Verbrauch."
 AOEIW_DEPTH_GER_council_autonomy:0 "Autonome Betriebsräte"
 AOEIW_DEPTH_GER_council_autonomy_desc:0 "Lokale Initiative verbessert Produktionsumstellungen, verlangsamt aber zentrale Direktiven."
 AOEIW_DEPTH_GER_quota_directorate:0 "Das Quotendirektorium"
 AOEIW_DEPTH_GER_quota_directorate_desc:0 "Zentrale Quoten steigern den Ausstoß zulasten der Zustimmung in den Betrieben."
 AOEIW_DEPTH_GER_rearmament_credit:0 "Aufgeschobene Rüstungskredite"
 AOEIW_DEPTH_GER_rearmament_credit_desc:0 "Schnelle Rüstungsaufträge binden zivile Ressourcen und den künftigen Haushalt."
 AOEIW_DEPTH_GER_balanced_orders:0 "Geprüfte Rüstungsaufträge"
 AOEIW_DEPTH_GER_balanced_orders_desc:0 "Geprüfte Aufträge verbessern die Effizienz, bleiben aber hinter ungebremster Rüstungsbautätigkeit zurück."
 aoeiw_depth.2.t:0 "Die Rüstungsbilanz"
 aoeiw_depth.2.d:0 "Das Rüstungsministerium verspricht Fabriken schneller, als die Reichskasse sie bezahlen kann. Industrielle bieten aufgeschobene Wechsel an; Prüfer warnen vor Belastungen der Zivilversorgung. Strenge Beschaffung verlangsamt den Bau, bindet aber nicht die gesamte Wirtschaft an den nächsten Auftrag."
 aoeiw_depth.2.a:0 "Das beschleunigte Programm finanzieren"
 aoeiw_depth.2.b:0 "Geprüfte Beschaffung verlangen"
 AOEIW_DEPTH_GER_rhineland_works:0 "Die rheinischen Werke finanzieren"
 AOEIW_DEPTH_GER_rhineland_works_desc:0 "Baut eine Zivilfabrik im Rheinland und beschafft 30 Güterzuglokomotiven.\n\nKostet 60 politische Macht, bindet eine Zivilfabrik und dauert 90 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.100.t:0 "Die rheinischen Werke finanzieren — Abgeschlossen"
 aoeiw_depth.100.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
 aoeiw_depth.100.a:0 "Die Werke in Dienst stellen."
 AOEIW_DEPTH_GER_silesian_arsenal:0 "Das schlesische Arsenal ausbauen"
 AOEIW_DEPTH_GER_silesian_arsenal_desc:0 "Baut eine Militärfabrik in Niederschlesien und montiert 400 Infanteriewaffen.\n\nKostet 75 politische Macht, bindet eine Zivilfabrik und dauert 120 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.101.t:0 "Das schlesische Arsenal ausbauen — Abgeschlossen"
 aoeiw_depth.101.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
 aoeiw_depth.101.a:0 "Die Werke in Dienst stellen."
