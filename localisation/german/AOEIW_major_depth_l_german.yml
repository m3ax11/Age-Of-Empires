 AOEIW_DEPTH_SOV_programmes:0 "Die russischen Provinzprogramme"
 AOEIW_DEPTH_SOV_programmes_desc:0 "Vom Fokusbaum freigeschaltete Projekte benötigen Finanzierung, Zeit und gesichertes Gebiet."
 AOEIW_DEPTH_SOV_staff_programmes:0 "Kabinetts- und Stabsprogramme"
 AOEIW_DEPTH_SOV_staff_programmes_desc:0 "Fokusse schalten finanzierte Programme frei. Wählt selbst den Einsatzzeitpunkt. Alternativen teilen sich Budget und Sperrfrist; ihre zeitweiligen Nationalgeister laufen automatisch aus. Dauerhafte Fokusgeister werden aufgewertet statt gestapelt."
 AOEIW_DEPTH_FRA_municipal_compact:0 "Der Gemeindepakt"
 AOEIW_DEPTH_FRA_municipal_compact_desc:0 "Bürgermeister organisieren den Aufbau mit lokaler Zustimmung; nationale Direktiven müssen ausgehandelt werden."
 AOEIW_DEPTH_FRA_prefectural_budget:0 "Der Präfekturhaushalt"
 AOEIW_DEPTH_FRA_prefectural_budget_desc:0 "Präfekten beschleunigen die Beschaffung, entfremden dabei aber Teile der Kommunalpolitik."
 aoeiw_depth.11.t:0 "Die Bürgermeister wenden sich an Paris"
 aoeiw_depth.11.d:0 "Die Gemeinderäte wollen Frankreich verteidigen, wehren sich aber gegen ohne sie beschlossene Beschlagnahmen. Die Regierung kann Bürgermeistern verbindliche Aufbaurechte geben oder den Wiederaufbauhaushalt den Präfekten unterstellen. Beide Wege liefern Aufträge; nur einer hält die Zusagen des liberalen Kompromisses."
 aoeiw_depth.11.a:0 "Den Bürgermeistern Mitspracherecht geben"
 aoeiw_depth.11.b:0 "Die Präfekten koordinieren den Aufbau"
 AOEIW_DEPTH_FRA_algerian_arsenal:0 "Das westalgerische Arsenal ausrüsten"
 AOEIW_DEPTH_FRA_algerian_arsenal_desc:0 "Baut eine Militärfabrik in Westalgerien und stellt 150 Unterstützungsausrüstung bereit.\n\nKostet 75 politische Macht, bindet eine Zivilfabrik und dauert 120 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.110.t:0 "Das westalgerische Arsenal ausrüsten — Abgeschlossen"
 aoeiw_depth.110.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
 aoeiw_depth.110.a:0 "Die Werke in Dienst stellen."
 AOEIW_DEPTH_FRA_civilian_ministers:0 "Zivilminister im Direktorium"
 AOEIW_DEPTH_FRA_civilian_ministers_desc:0 "Zivilminister legitimieren die Notregierung, zwingen den Stab aber zu Ressourcenverhandlungen."
 AOEIW_DEPTH_FRA_staff_direct_rule:0 "Direkte Stabsregierung"
 AOEIW_DEPTH_FRA_staff_direct_rule_desc:0 "Der Stab kann schneller planen; die Zusammenarbeit mit zivilen Institutionen leidet."
 aoeiw_depth.12.t:0 "Wer sitzt im Direktorium?"
 aoeiw_depth.12.d:0 "Weygand hat die Ministerien gesichert, doch Frankreich zu regieren erfordert mehr als Generalstabsunterschriften. Zivilminister verlangen Sitze mit echten Befugnissen. Ihre Beteiligung stabilisiert das Land; ihre Ablehnung gibt dem Stab Planungsfreiheit und die Verantwortung für jede zivile Beschwerde."
 aoeiw_depth.12.a:0 "Zivilminister beteiligen"
 aoeiw_depth.12.b:0 "Der Stab übernimmt die volle Verantwortung"
 AOEIW_DEPTH_FRA_communal_supply:0 "Kommunale Versorgungsverbände"
 AOEIW_DEPTH_FRA_communal_supply_desc:0 "Ausgehandelte Lieferungen mindern Unruhe, entziehen der Rüstung aber Ressourcen."
 AOEIW_DEPTH_FRA_emergency_requisition:0 "Notstands-Beschaffungsämter"
 AOEIW_DEPTH_FRA_emergency_requisition_desc:0 "Zentrale Beschaffung stützt das Heer, verursacht aber dauerhafte politische Kosten in den Kommunen."
 aoeiw_depth.13.t:0 "Brot für die Kommune"
 aoeiw_depth.13.d:0 "Die Kommune übernimmt Werkstätten und erschöpfte Brotschlangen zugleich. Lokale Versorgungsverbände bieten Zusammenarbeit gegen garantierte zivile Zuteilungen. Notstandsämter versprechen schnellere Heereslieferungen durch Beschlagnahmen. Die Entscheidung prägt das Verhältnis zwischen Räten und Heer."
 aoeiw_depth.13.a:0 "Zivile Zuteilungen garantieren"
 aoeiw_depth.13.b:0 "Militärische Beschaffung priorisieren"
 AOEIW_DEPTH_FRA_paris_reconstruction:0 "Das Pariser Zuliefernetz aufbauen"
 AOEIW_DEPTH_FRA_paris_reconstruction_desc:0 "Baut eine Zivilfabrik in der Île-de-France und erhaltet 100 Unterstützungsausrüstung.\n\nKostet 60 politische Macht, bindet eine Zivilfabrik und dauert 90 Tage. Erfordert Besitz und Kontrolle des Projektstaats. Geht eines davon verloren, wird das Projekt abgebrochen und die Hälfte der politischen Macht erstattet. Nach Rückgewinnung ist ein neuer Versuch möglich. Ein fertiges Projekt ist nicht wiederholbar."
 aoeiw_depth.111.t:0 "Das Pariser Zuliefernetz aufbauen — Abgeschlossen"
 aoeiw_depth.111.d:0 "Die Abnahmekommission hat die Unterlagen unterzeichnet. Die Werkstätten haben ihre ersten Aufträge geliefert, die Konten sind abgeschlossen und die für den Bau gebundenen Zivilkräfte werden freigegeben. Nun muss die Regierung aus einem erfüllten Vertrag einen verlässlichen Teil der nationalen Versorgung machen."
 aoeiw_depth.111.a:0 "Die Werke in Dienst stellen."
