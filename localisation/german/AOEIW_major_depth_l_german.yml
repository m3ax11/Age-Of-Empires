 AOEIW_DEPTH_GER_refit_front_desc:0 "+20% Heeres-Organisationserholung und -10% Nachschubverbrauch, aber -5% Heeresangriff. Erfordert Krieg.\n\nKostet 60 politische Macht und 20 Befehlsmacht. Wirkt 90 Tage. Das gemeinsame Programmbudget bleibt ab Aktivierung 180 Tage gesperrt. Alternativen dieses Budgets können nicht gleichzeitig laufen; der Nationalgeist endet automatisch."
