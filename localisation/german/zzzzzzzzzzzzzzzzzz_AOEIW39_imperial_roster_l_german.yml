 AOEIW39_NGA_indirect_rule:0 "Indirekte Herrschaft"
 AOEIW39_NGA_indirect_rule_desc:0 "Emire, Raete und Kolonialbeamte teilen sich die Macht, ohne sich ueber die Grenzen imperialer Verantwortung einig zu sein."
 AOEIW39_intro_NGA:0 "Emire, Raete und Kolonialbeamte teilen sich die Macht, ohne sich ueber die Grenzen imperialer Verantwortung einig zu sein."
 AOEIW39_KEN_settler_federation:0 "Die Siedlerfoederation"
