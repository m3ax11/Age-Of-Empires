 AOEIW39_SRL_plantation_harbour:0 "Plantage und Hafen"
 AOEIW39_SRL_plantation_harbour_desc:0 "Tee finanziert die Insel und Trincomalee sichert die Ozeanroute, wodurch Colombo im Empire Verhandlungsmacht gewinnt."
