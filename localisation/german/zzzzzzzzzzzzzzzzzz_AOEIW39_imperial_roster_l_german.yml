 GPA:0 "Deutsche Pazifikverwaltung"
 GPA_DEF:0 "die Deutsche Pazifikverwaltung"
 GPA_ADJ:0 "deutsch-pazifisch"
 AOEIW39_IAF_red_sea_viceroyalty:0 "Das Vizekoenigreich am Roten Meer"
 AOEIW39_IAF_red_sea_viceroyalty_desc:0 "Massaua und Mogadischu werden als ein italienischer Militaerkorridor regiert, der von Schiffahrt und Kolonialtruppen abhaengt."
 AOEIW39_MAF_chartered_colonies:0 "Die Schutzgebiete"
 AOEIW39_MAF_chartered_colonies_desc:0 "Eisenbahnen, Konzessionen und Bezirksverwaltungen binden ein riesiges zentralafrikanisches Gebiet an Berlin."
 AOEIW39_GPA_island_station:0 "Die Inselstation"
 AOEIW39_GPA_island_station_desc:0 "Verstreute Ankerplaetze bilden ein Marinenetz, dessen Ueberleben von Konvois und befestigten Haefen abhaengt."
 AOEIW39_intro_IAF:0 "Rom hat Eritrea und Somalia unter einem Vizekoenigreich am Roten Meer vereint. Kolonialtruppen und Seewege muessen Gebiete zusammenhalten, die durch Entfernung und lokale Loyalitaeten getrennt sind."
 AOEIW39_imperial_formations_category:0 "Neue imperiale Schutzbriefe"
 AOEIW39_imperial_formations_category_desc:0 "Eroberte Kolonialgebiete koennen Verwaltungen erhalten, die sich selbst versorgen und Berlin verantwortlich sind."
 AOEIW39_charter_mittelafrika:0 "Mittelafrika gruenden"
 AOEIW39_charter_mittelafrika_desc:0 "Die zentralafrikanischen Eroberungen benoetigen eine gemeinsame Kasse, Eisenbahnbehoerde und Kolonialfuehrung."
 AOEIW39_create_german_pacific_administration:0 "Die Deutsche Pazifikverwaltung schaffen"
 AOEIW39_create_german_pacific_administration_desc:0 "Unsere Pazifikinseln und Stationen in Neuguinea sollen einer gemeinsamen Marineverwaltung unterstellt werden."
 AOEIW39_intro_MAL:0 "Qingdao und Guangzhouwan sind Deutschlands ungeschuetzte Fenster nach Ostasien. Der Kolonialrat muss zwischen Berliner Befehlen, chinesischer Souveraenitaet und japanischer Macht vermitteln."
 AOEIW39_intro_EST:0 "Die Baltische Foederation beruht auf einem Ausgleich zwischen deutschem Schutz und den politischen Rechten ihrer estnischen, lettischen, litauischen und deutschen Gemeinschaften."
 AOEIW39_intro_VIN:0 "Die indochinesische Foederation verbindet vietnamesische, laotische und kambodschanische Verwaltungen unter der franzoesischen Krone, waehrend Japan an ihre Grenzen rueckt."
 AOEIW39_intro_MLI:0 "Dakar regiert eine Foederation von den Atlantikhaefen bis zum Nigerbogen. Der Kriegsdienst hat lokale Vertretung zu einer Forderung gemacht, die Paris nicht mehr ignorieren kann."
 AOEIW39_intro_KAZ:0 "Die Turkestanische Foederation kontrolliert Eisenbahnen, Baumwollgebiete und Steppenzugaenge des suedlichen russischen Reiches. Ihre Versammlung verlangt nun Mitsprache entsprechend ihrer strategischen Bedeutung."
 AOEIW39_intro_GEO:0 "Die Kaukasusverwaltung verbindet Georgien, Armenien, Baku und Nachitschewan unter russischem Schutz. Oel, Nationalitaeten und drei Reichsgrenzen stellen diesen Verband auf die Probe."
