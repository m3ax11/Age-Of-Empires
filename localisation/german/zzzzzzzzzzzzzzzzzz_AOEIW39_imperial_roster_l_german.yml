l_german:
 AOEIW39_imperial_administration_category:0 "Imperiale Verwaltung"
 AOEIW39_imperial_administration_category_desc:0 "Das lokale Kabinett kann mit der Reichsregierung ueber Finanzen, Wehrdienst und Verfassungsrechte verhandeln."
 AOEIW39_petition_for_local_budget:0 "Einen lokalen Haushalt fordern"
 AOEIW39_petition_for_local_budget_desc:0 "Lokale Einnahmen sollen zuerst der Regierung dienen, die sie erhebt."
 AOEIW39_accept_imperial_defence_quota:0 "Die imperiale Verteidigungsquote annehmen"
 AOEIW39_accept_imperial_defence_quota_desc:0 "Die Quote des Reichsstabs bringt Waffen und Erfahrung zum Preis engerer Kontrolle."
 AOEIW39_convene_constitutional_conference:0 "Eine Verfassungskonferenz einberufen"
 AOEIW39_convene_constitutional_conference_desc:0 "Jahre des Dienstes und der Verhandlungen rechtfertigen eine formelle Pruefung unserer Stellung im Reich."
 AOEIW39_local_budget_autonomy:0 "Lokaler Haushaltsausgleich"
 AOEIW39_defence_quota_autonomy:0 "Imperiale Verteidigungsquote"
 AOEIW39_constitutional_conference_autonomy:0 "Verfassungskonferenz"
 AOEIW39_imperial_roster.1.t:0 "Unser Platz in der imperialen Ordnung"
 AOEIW39_imperial_roster.1.a:0 "Wir werden diese Ordnung zu unserer eigenen machen."
 AOEIW39_imperial_roster.2.t:0 "Die Verfassungskonferenz"
 AOEIW39_imperial_roster.2.d:0 "Die Delegierten haben Jahre der Petitionen, des Dienstes und lokaler Regierung in eine ausgehandelte Erweiterung der Verfassungsrechte verwandelt."
 AOEIW39_imperial_roster.2.a:0 "Die neuen Artikel ratifizieren."
 AOEIW39_INS_insulindian_compact:0 "Der insulindische Ausgleich"
 AOEIW39_INS_insulindian_compact_desc:0 "Batavia haelt Inseln, Fuerstenhoefe und Konzessionsgebiete unter japanischer Oberhoheit zusammen. Oel und Seewege schaffen Einfluss, doch dem Ausgleich fehlt gefestigte Legitimitaet."
 AOEIW39_intro_INS:0 "Batavia haelt Inseln, Fuerstenhoefe und Konzessionsgebiete unter japanischer Oberhoheit zusammen. Oel und Seewege schaffen Einfluss, doch dem Ausgleich fehlt gefestigte Legitimitaet."
 AOEIW39_PHI_archipelago_defence:0 "Verteidigung des Archipels"
 AOEIW39_PHI_archipelago_defence_desc:0 "Manila muss verstreute Inseln verteidigen, waehrend japanische Offiziere Zugang zu jedem Hafen und Flugplatz verlangen."
 AOEIW39_intro_PHI:0 "Manila muss verstreute Inseln verteidigen, waehrend japanische Offiziere Zugang zu jedem Hafen und Flugplatz verlangen."
 AOEIW39_KOR_industrial_protectorate:0 "Das Industrieprotektorat"
 AOEIW39_KOR_industrial_protectorate_desc:0 "Koreanische Fabriken versorgen die japanische Kriegswirtschaft, waehrend der Generalgouverneur Forderungen nach einer nationalen Regierung unterdrueckt."
 AOEIW39_intro_KOR:0 "Koreanische Fabriken versorgen die japanische Kriegswirtschaft, waehrend der Generalgouverneur Forderungen nach einer nationalen Regierung unterdrueckt."
 AOEIW39_BRM_frontier_administration:0 "Die Grenzverwaltung"
 AOEIW39_BRM_frontier_administration_desc:0 "Rangun regiert Flusstaeler und Grenzvoelker durch eine unsichere Ordnung, die von Britisch-Indien geerbt wurde."
 AOEIW39_intro_BRM:0 "Rangun regiert Flusstaeler und Grenzvoelker durch eine unsichere Ordnung, die von Britisch-Indien geerbt wurde."
 AOEIW39_ALG_divided_colony:0 "Eine geteilte Kolonie"
 AOEIW39_ALG_divided_colony_desc:0 "Siedler, kaiserliche Beamte und algerische Vertreter streiten darueber, wer zur franzoesischen politischen Nation gehoert."
 AOEIW39_intro_ALG:0 "Siedler, kaiserliche Beamte und algerische Vertreter streiten darueber, wer zur franzoesischen politischen Nation gehoert."
 AOEIW39_MOR_treaty_sultanate:0 "Das Vertragssultanat"
 AOEIW39_MOR_treaty_sultanate_desc:0 "Der Sultan bewahrt Hof und religioese Autoritaet, waehrend franzoesische Residenten Finanzen, Sicherheit und Aussenpolitik kontrollieren."
 AOEIW39_intro_MOR:0 "Der Sultan bewahrt Hof und religioese Autoritaet, waehrend franzoesische Residenten Finanzen, Sicherheit und Aussenpolitik kontrollieren."
 AOEIW39_TUN_beylical_compact:0 "Der beylikale Ausgleich"
 AOEIW39_TUN_beylical_compact_desc:0 "Der Bey, Reformkraefte und die franzoesische Residenz bewahren einen Ausgleich, dessen Bedingungen jede Seite anders auslegt."
 AOEIW39_intro_TUN:0 "Der Bey, Reformkraefte und die franzoesische Residenz bewahren einen Ausgleich, dessen Bedingungen jede Seite anders auslegt."
 AOEIW39_NFL_commission_government:0 "Regierungskommission"
 AOEIW39_NFL_commission_government_desc:0 "Schulden stellten Neufundland unter eine ernannte Kommission, doch ein Atlantikkrieg kann der Insel wieder politisches Gewicht geben."
 AOEIW39_intro_NFL:0 "Schulden stellten Neufundland unter eine ernannte Kommission, doch ein Atlantikkrieg kann der Insel wieder politisches Gewicht geben."
 AOEIW39_NGA_indirect_rule:0 "Indirekte Herrschaft"
 AOEIW39_NGA_indirect_rule_desc:0 "Emire, Raete und Kolonialbeamte teilen sich die Macht, ohne sich ueber die Grenzen imperialer Verantwortung einig zu sein."
 AOEIW39_intro_NGA:0 "Emire, Raete und Kolonialbeamte teilen sich die Macht, ohne sich ueber die Grenzen imperialer Verantwortung einig zu sein."
 AOEIW39_KEN_settler_federation:0 "Die Siedlerfoederation"
 AOEIW39_KEN_settler_federation_desc:0 "Eisenbahnen und Siedlerfarmen verbinden Ostafrika, waehrend afrikanische Organisationen Mitsprache in der Foederation verlangen."
 AOEIW39_intro_KEN:0 "Eisenbahnen und Siedlerfarmen verbinden Ostafrika, waehrend afrikanische Organisationen Mitsprache in der Foederation verlangen."
 AOEIW39_SRL_plantation_harbour:0 "Plantage und Hafen"
 AOEIW39_SRL_plantation_harbour_desc:0 "Tee finanziert die Insel und Trincomalee sichert die Ozeanroute, wodurch Colombo im Empire Verhandlungsmacht gewinnt."
 AOEIW39_intro_SRL:0 "Tee finanziert die Insel und Trincomalee sichert die Ozeanroute, wodurch Colombo im Empire Verhandlungsmacht gewinnt."
 AOEIW39_COG_concession_regime:0 "Das Konzessionsregime"
 AOEIW39_COG_concession_regime_desc:0 "Bergbaugesellschaften und die Force Publique stuetzen die belgische Herrschaft zu wachsenden politischen und menschlichen Kosten."
 AOEIW39_intro_COG:0 "Bergbaugesellschaften und die Force Publique stuetzen die belgische Herrschaft zu wachsenden politischen und menschlichen Kosten."
 AOEIW39_LBA_fourth_shore:0 "Das vierte Ufer"
 AOEIW39_LBA_fourth_shore_desc:0 "Rom behandelt Libyen als Erweiterung Italiens, waehrend Militaersiedlungen und Senussi-Widerstand um die Wueste ringen."
 AOEIW39_intro_LBA:0 "Rom behandelt Libyen als Erweiterung Italiens, waehrend Militaersiedlungen und Senussi-Widerstand um die Wueste ringen."
 AOEIW39_CUB_captaincy_compact:0 "Der Ausgleich der Generalkapitanie"
 AOEIW39_CUB_captaincy_compact_desc:0 "Havanna besitzt weitgehende Selbstverwaltung, doch Madrid kontrolliert Verteidigung, Handelsprivilegien und die letzte Verfassungsentscheidung."
 AOEIW39_intro_CUB:0 "Havanna besitzt weitgehende Selbstverwaltung, doch Madrid kontrolliert Verteidigung, Handelsprivilegien und die letzte Verfassungsentscheidung."
 AOEIW39_AFG_royal_buffer:0 "Der koenigliche Pufferstaat"
 AOEIW39_AFG_royal_buffer_desc:0 "Der afghanische Hof behauptet sich zwischen persischer Schutzmacht, russischem Druck und den Zugaengen nach Britisch-Indien."
 AOEIW39_intro_AFG:0 "Der afghanische Hof behauptet sich zwischen persischer Schutzmacht, russischem Druck und den Zugaengen nach Britisch-Indien."
 AOEIW39_AZR_southern_oil_compact:0 "Der suederserbaidschanische Oelausgleich"
 AOEIW39_AZR_southern_oil_compact_desc:0 "Täbris und die suedlichen kaspischen Felder sind durch Oelvertraege, Garnisonen und einen umstrittenen Verfassungsausgleich an Teheran gebunden."
 AOEIW39_intro_AZR:0 "Täbris und die suedlichen kaspischen Felder sind durch Oelvertraege, Garnisonen und einen umstrittenen Verfassungsausgleich an Teheran gebunden."
 AOEIW39_ANG_atlantic_concessions:0 "Die Atlantikkonzessionen"
 AOEIW39_ANG_atlantic_concessions_desc:0 "Luanda vermittelt zwischen Lissabon, Konzessionsgesellschaften und afrikanischer Arbeit in einer Kolonie groesser als das Mutterland."
 AOEIW39_intro_ANG:0 "Luanda vermittelt zwischen Lissabon, Konzessionsgesellschaften und afrikanischer Arbeit in einer Kolonie groesser als das Mutterland."
 AOEIW39_MZB_indian_ocean_corridor:0 "Der Korridor zum Indischen Ozean"
 AOEIW39_MZB_indian_ocean_corridor_desc:0 "Haefen und Eisenbahnen tragen den Reichtum des Hinterlandes zum Indischen Ozean und machen Mosambik fuer mehrere Reiche wertvoll."
 AOEIW39_intro_MZB:0 "Haefen und Eisenbahnen tragen den Reichtum des Hinterlandes zum Indischen Ozean und machen Mosambik fuer mehrere Reiche wertvoll."
 AOEIW39_ICE_north_atlantic_outpost:0 "Der nordatlantische Aussenposten"
 AOEIW39_ICE_north_atlantic_outpost_desc:0 "Deutsche Kontrolle sichert die nordatlantischen Zugaenge, macht Islands Haefen jedoch in jedem europaeischen Krieg zu Zielen."
 AOEIW39_intro_ICE:0 "Deutsche Kontrolle sichert die nordatlantischen Zugaenge, macht Islands Haefen jedoch in jedem europaeischen Krieg zu Zielen."
 AOEIW39_chinese_regional_category:0 "Der Provinzausgleich"
 AOEIW39_chinese_regional_category_desc:0 "Die Regionalregierungen muessen den Qing-Aufstand ueberstehen, ohne ihre eigenen Rechte aufzugeben oder China fremder Eroberung zu ueberlassen."
 AOEIW39_secure_the_provincial_charter:0 "Die Provinzcharta sichern"
 AOEIW39_secure_the_provincial_charter_desc:0 "Einnahmen, Ernennungen und Kommando muessen rechtlich geordnet werden, bevor die nationale Krise uns erreicht."
 AOEIW39_prepare_for_the_chinese_settlement:0 "Den chinesischen Ausgleich vorbereiten"
 AOEIW39_prepare_for_the_chinese_settlement_desc:0 "Welche Regierung auch aus dem Krieg hervorgeht, sie wird mit einer organisierten und bewaffneten Provinz verhandeln muessen."
 AOEIW39_SIK_oasis_coalition:0 "Die Oasenkoalition"
 AOEIW39_SIK_oasis_coalition_desc:0 "Dihua vermittelt im Tarimbecken zwischen Oasenhaendlern, Provinzsoldaten und konkurrierenden auslaendischen Verbindungen."
 AOEIW39_TIB_monastic_state:0 "Der Klosterstaat"
 AOEIW39_TIB_monastic_state_desc:0 "Die Kloester tragen Regierung und Gesellschaftsordnung, doch ihre Autoritaet begrenzt technische Reformen."
 AOEIW39_YUN_kunming_arsenals:0 "Die Arsenale von Kunming"
 AOEIW39_YUN_kunming_arsenals_desc:0 "Yunnan stuetzt sich auf Provinzwerkstaetten und eine Armee, die einen grossen Teil ihrer Produktion verbraucht."
 AOEIW39_XSM_ma_clique_compact:0 "Der Ausgleich der Ma-Clique"
 AOEIW39_XSM_ma_clique_compact_desc:0 "Familienarmeen und Hui-Kavallerie halten den Nordwesten durch wirksame, aber selten stabile Absprachen zusammen."
 AOEIW39_XIC_xian_truce:0 "Der Waffenstillstand von Xi'an"
 AOEIW39_XIC_xian_truce_desc:0 "Offiziere, Studenten und rivalisierende Nationalbewegungen sind sich einig, dass die auslaendische Invasion die unmittelbare Gefahr ist."
 AOEIW39_intro_SIK:0 "Dihua wird sein Ueberleben nicht gegen die Versprechen eines fernen Thronbewerbers eintauschen. Die Oasenkoalition muss zu eigenen Bedingungen in die chinesische Krise eintreten."
 AOEIW39_intro_TIB:0 "Lhasa steht abseits der rivalisierenden chinesischen Regierungen, doch Armeen in Kham machen Isolation zunehmend unmoeglich."
 AOEIW39_intro_YUN:0 "Kunming befehligt eine eigene Armee, Strassen und Arsenale. Die chinesische Krise zwingt die Provinzregierung zu entscheiden, wie viel Unabhaengigkeit diese Mittel schuetzen sollen."
 AOEIW39_intro_XSM:0 "Die Ma-Familien kontrollieren die nordwestlichen Marken durch Kavallerie, religioese Netzwerke und Familienabsprachen. Qing-Restauration und fremder Druck bedrohen diesen Ausgleich."
 AOEIW39_intro_XIC:0 "Xi'an liegt zwischen Zentralregierung, Kommunisten und nordwestlichen Armeen. Seine Offiziere wollen die Provinz zum Vermittler statt zur Beute machen."
 IAF:0 "Italienisch-Ostafrika"
 IAF_DEF:0 "Italienisch-Ostafrika"
 IAF_ADJ:0 "italienisch-ostafrikanisch"
 MAF:0 "Mittelafrika"
 MAF_DEF:0 "Mittelafrika"
 MAF_ADJ:0 "mittelafrikanisch"
 GPA:0 "Deutsche Pazifikverwaltung"
 GPA_DEF:0 "die Deutsche Pazifikverwaltung"
 GPA_ADJ:0 "deutsch-pazifisch"
 AOEIW39_IAF_red_sea_viceroyalty:0 "Das Vizekoenigreich am Roten Meer"
 AOEIW39_IAF_red_sea_viceroyalty_desc:0 "Massaua und Mogadischu werden als ein italienischer Militaerkorridor regiert, der von Schiffahrt und Kolonialtruppen abhaengt."
 AOEIW39_MAF_chartered_colonies:0 "Die Schutzgebiete"
 AOEIW39_MAF_chartered_colonies_desc:0 "Eisenbahnen, Konzessionen und Bezirksverwaltungen binden ein riesiges zentralafrikanisches Gebiet an Berlin."
 AOEIW39_GPA_island_station:0 "Die Inselstation"
 AOEIW39_GPA_island_station_desc:0 "Verstreute Ankerplaetze bilden ein Marinenetz, dessen Ueberleben von Konvois und befestigten Haefen abhaengt."
 AOEIW39_intro_IAF:0 "Rom hat Eritrea und Somalia unter einem Vizekoenigreich am Roten Meer vereint. Kolonialtruppen und Seewege muessen Gebiete zusammenhalten, die durch Entfernung und lokale Loyalitaeten getrennt sind."
 AOEIW39_imperial_formations_category:0 "Neue imperiale Schutzbriefe"
 AOEIW39_imperial_formations_category_desc:0 "Eroberte Kolonialgebiete koennen Verwaltungen erhalten, die sich selbst versorgen und Berlin verantwortlich sind."
 AOEIW39_charter_mittelafrika:0 "Mittelafrika gruenden"
 AOEIW39_charter_mittelafrika_desc:0 "Die zentralafrikanischen Eroberungen benoetigen eine gemeinsame Kasse, Eisenbahnbehoerde und Kolonialfuehrung."
 AOEIW39_create_german_pacific_administration:0 "Die Deutsche Pazifikverwaltung schaffen"
 AOEIW39_create_german_pacific_administration_desc:0 "Unsere Pazifikinseln und Stationen in Neuguinea sollen einer gemeinsamen Marineverwaltung unterstellt werden."
 AOEIW39_intro_MAL:0 "Qingdao und Guangzhouwan sind Deutschlands ungeschuetzte Fenster nach Ostasien. Der Kolonialrat muss zwischen Berliner Befehlen, chinesischer Souveraenitaet und japanischer Macht vermitteln."
 AOEIW39_intro_EST:0 "Die Baltische Foederation beruht auf einem Ausgleich zwischen deutschem Schutz und den politischen Rechten ihrer estnischen, lettischen, litauischen und deutschen Gemeinschaften."
 AOEIW39_intro_VIN:0 "Die indochinesische Foederation verbindet vietnamesische, laotische und kambodschanische Verwaltungen unter der franzoesischen Krone, waehrend Japan an ihre Grenzen rueckt."
 AOEIW39_intro_MLI:0 "Dakar regiert eine Foederation von den Atlantikhaefen bis zum Nigerbogen. Der Kriegsdienst hat lokale Vertretung zu einer Forderung gemacht, die Paris nicht mehr ignorieren kann."
 AOEIW39_intro_KAZ:0 "Die Turkestanische Foederation kontrolliert Eisenbahnen, Baumwollgebiete und Steppenzugaenge des suedlichen russischen Reiches. Ihre Versammlung verlangt nun Mitsprache entsprechend ihrer strategischen Bedeutung."
 AOEIW39_intro_GEO:0 "Die Kaukasusverwaltung verbindet Georgien, Armenien, Baku und Nachitschewan unter russischem Schutz. Oel, Nationalitaeten und drei Reichsgrenzen stellen diesen Verband auf die Probe."
 AOEIW39_IAF_root:0 "Die Achse Massaua-Mogadischu"
 AOEIW39_IAF_root_desc:0 "Massaua und Mogadischu liegen weit auseinander. Ein fester Kuestendienst, gemeinsame Buecher und eine Befehlslinie muessen aus beiden Gebieten mehr als nur auf dem Papier eine Kolonie machen."
 AOEIW39_IAF_left:0 "Der Rat des Vizekoenigs"
 AOEIW39_IAF_left_desc:0 "Der Vizekoenig wird mit ernannten Beamten und Offizieren regieren, die Rom verantwortlich sind. Befehle gelangen schneller ans Ziel, waehrend vor Ort nur wenig Entscheidungsraum bleibt."
 AOEIW39_IAF_right:0 "Einberufung der kolonialen Ratsversammlung"
 AOEIW39_IAF_right_desc:0 "Haendler, Aelteste und staedtische Abgesandte verlangen Mitsprache. Ihre Versammlung verlangsamt Erlasse, verankert die Verwaltung aber jenseits ihrer Garnisonen."
 AOEIW39_IAF_charter:0 "Ein Statuto fuer das Rote Meer"
 AOEIW39_IAF_charter_desc:0 "Ein Kolonialstatut regelt die Befugnisse Asmaras, Mogadischus und Roms, bevor der naechste Notstand die Frage erzwingt."
 AOEIW39_IAF_econ:0 "Die Kolonialkasse"
 AOEIW39_IAF_econ_desc:0 "Getrennte eritreische und somalische Konten verdecken Verschwendung und widerstreitende Plaene. Eine Kasse kann Zoelle gezielt fuer Strassen, Haefen und Verteidigung einsetzen."
 AOEIW39_IAF_econ_l:0 "Vollendung der Strada Imperiale"
 AOEIW39_IAF_econ_l_desc:0 "Pioniere schliessen die Luecken der Reichsstrasse und legen bewachte Depots an. Truppen und Lastwagen sollen die Kolonie ohne den Umweg ueber See durchqueren koennen."
 AOEIW39_IAF_econ_r:0 "Oeffnung des Hafens von Assab"
 AOEIW39_IAF_econ_r_desc:0 "Assab kann zum suedlichen Ausfuhrhafen des eritreischen Hochlands werden. Neue Kais und Lagerhaeuser machen aus dem vernachlaessigten Hafen einen brauchbaren Stuetzpunkt."
 AOEIW39_IAF_econ_cap:0 "Eine Staatskasse in Asmara"
 AOEIW39_IAF_econ_cap_desc:0 "Die Zolleinnahmen bleiben lange genug in Asmara, um lokale Pflichten zu bezahlen. Rom bestimmt weiter die Politik, doch der Vizekoenig muss nicht mehr um jede Lira bitten."
 AOEIW39_IAF_mil:0 "Comando Africa Orientale"
 AOEIW39_IAF_mil_desc:0 "Die verstreuten Kolonialkommandos brauchen ein gemeinsames Hauptquartier. Stabsoffiziere in Asmara bereiten Plaene fuer beide Seiten des Horns vor."
 AOEIW39_IAF_mil_l:0 "Die Askari-Bataillone erweitern"
 AOEIW39_IAF_mil_l_desc:0 "Die Askari kennen Klima, Sprachen und Wege. Vergroesserte Bataillone unter erfahrenen einheimischen Unteroffizieren bilden das Rueckgrat des Feldheeres."
 AOEIW39_IAF_mil_r:0 "Motorkolonnen fuer den Ogaden"
 AOEIW39_IAF_mil_r_desc:0 "Der Ogaden bestraft Truppen, die an Bahnen gebunden sind. Leichte Motorkolonnen mit eigenem Treibstoff und Wasser koennen den Raum sichern und sich rasch sammeln."
 AOEIW39_IAF_mil_cap:0 "Der Verteidigungsplan fuer das Rote Meer"
 AOEIW39_IAF_mil_cap_desc:0 "Massaua, Assab und Mogadischu teilen Warnposten, Reserven und Kuestenplaene. Ein Angriff auf einen Hafen setzt das gesamte Kommando in Bewegung."
 AOEIW39_IAF_dip:0 "Die Luftlinie Kairo-Rom"
 AOEIW39_IAF_dip_desc:0 "Regelmaessige Fluege zwischen Kairo, Asmara und Rom transportieren Befehle, Fachleute und dringende Fracht unabhaengig von den britisch beherrschten Seewegen."
 AOEIW39_IAF_final:0 "Ein Vizekoenigtum von Bestand"
 AOEIW39_IAF_final_desc:0 "Strassen, Kasse und Kolonialheer gehorchen nun derselben Regierung. Italienisch-Ostafrika kann eine Schifffahrtskrise ueberstehen und Rom seinen Nutzen beweisen."
 AOEIW39_MAF_root:0 "Die Duala-Charta"
 AOEIW39_MAF_root_desc:0 "Die Beamten in Duala muessen aus eroberten Gebieten eine Regierung formen. Die Charta bestimmt, wer Steuern erhebt, die Polizei fuehrt und Berlin Rechenschaft schuldet."
 AOEIW39_MAF_left:0 "Erneuerung der Konzessionsgesellschaften"
 AOEIW39_MAF_left_desc:0 "Handelsgesellschaften bieten Schiffe, Buchhalter und Kapital gegen weitreichende Konzessionen. Ihre Vorrechte versprechen schnelle Ertraege, entziehen das Binnenland aber oeffentlicher Kontrolle."
 AOEIW39_MAF_right:0 "Sitze fuer die Bezirksraete"
 AOEIW39_MAF_right_desc:0 "Bezirkschefs und staedtische Abgesandte tragen Politik dorthin, wo deutsche Beamte fehlen. Anerkannte Raete tauschen einen Teil der Kontrolle gegen Zustimmung und bestaendigere Verwaltung."
 AOEIW39_MAF_charter:0 "Die Verordnung des Generalgouverneurs"
 AOEIW39_MAF_charter_desc:0 "Der Generalgouverneur erlaesst ein Recht fuer Zoll, Arbeit und Bezirke. Die alten Kolonialaemter duerfen keine widerspruechlichen Anweisungen mehr geben."
 AOEIW39_MAF_econ:0 "Das Binnenland erschliessen"
 AOEIW39_MAF_econ_desc:0 "Die Kueste kann die Verwaltung nicht allein tragen. Vermessungstrupps und Flussposten verbinden die Farmen und Minen des Binnenlands mit dem Zollsystem."
 AOEIW39_MAF_econ_l:0 "Schienen zum Copperbelt"
 AOEIW39_MAF_econ_l_desc:0 "Eine verlaessliche Bahn zum Copperbelt verspricht Erzverkehr und schnelle Truppenbewegungen, beansprucht jedoch den groessten Teil des Bauetats."
 AOEIW39_MAF_econ_r:0 "Dampfer auf dem Kongo"
 AOEIW39_MAF_econ_r_desc:0 "Der Kongo ist bereits eine Strasse ins Innere. Ausgebaggerte Fahrrinnen und gefoerderte Dampfer bewegen Fracht frueher als eine weitere Kontinentalbahn."
 AOEIW39_MAF_econ_cap:0 "Die zentralafrikanische Zollunion"
 AOEIW39_MAF_econ_cap_desc:0 "Binnenzoelle binden jede ehemalige Kolonie an ihre alte Hauptstadt. Ein gemeinsamer Zollraum gibt Mittelafrika einen Markt und eine Einnahmequelle."
 AOEIW39_MAF_mil:0 "Die Schutztruppe wiederaufbauen"
 AOEIW39_MAF_mil_desc:0 "Die alte Tradition der Schutztruppe liefert den Kader fuer das neue Gebiet. Ihre Kompanien brauchen moderne Fernmelder, Sanitaetsdienste und verlaessliche Versorgungskolonnen."
 AOEIW39_MAF_mil_l:0 "Das Kolonialoffizierskorps"
 AOEIW39_MAF_mil_l_desc:0 "Deutsche Offiziere behalten den unmittelbaren Befehl von der Kompanie bis zum Hauptquartier. Disziplin und Lehre bleiben einheitlich, doch lokale Eigeninitiative bleibt knapp."
 AOEIW39_MAF_mil_r:0 "Afrikanische Offiziere ernennen"
 AOEIW39_MAF_mil_r_desc:0 "Afrikanische Unteroffiziere tragen bereits den Alltag der Truppe. Offizierspatente und Stabsschulen erweitern die Rekrutierung und geben dem Heer Kenner seiner Bezirke."
 AOEIW39_MAF_mil_cap:0 "Der aequatoriale Verteidigungsstab"
 AOEIW39_MAF_mil_cap_desc:0 "Duala koordiniert Garnisonen, Flusspatrouillen und Bahnreserven durch einen aequatorialen Verteidigungsstab. Kein Bezirk soll Aufstand oder Invasion allein begegnen."
 AOEIW39_MAF_dip:0 "Das Kap-Kairo-Problem"
 AOEIW39_MAF_dip_desc:0 "Britische Wege vom Kap nach Kairo durchkreuzen jeden deutschen Plan fuer das Binnenland. Diplomaten und Vermesser muessen bestimmen, wo Handel endet und Einkreisung beginnt."
 AOEIW39_MAF_final:0 "Von der Charta zur Foederation"
 AOEIW39_MAF_final_desc:0 "Mittelafrika besitzt gemeinsame Konten, Verkehrswege und ein Territorialheer. Aus der Charta kann eine Foederation werden, die auch zwischen Weisungen aus Berlin regiert."
 AOEIW39_GPA_root:0 "Die Reichsflagge hissen"
 AOEIW39_GPA_root_desc:0 "Rabaul hisst wieder die Reichsflagge ueber Deutschlands verstreuten Pazifikstationen. Die Marineverwaltung muss zuerst klaeren, welche Inseln sie versorgen und verteidigen kann."
 AOEIW39_GPA_left:0 "Der Marinegouverneur"
 AOEIW39_GPA_left_desc:0 "Ein Marinegouverneur richtet Haefen, Funkposten und Plantagen an den Beduerfnissen der Flotte aus. Zivile Anliegen weichen, sobald das Seekommando es verlangt."
 AOEIW39_GPA_right:0 "Einberufung des Inselrats"
 AOEIW39_GPA_right_desc:0 "Pflanzer, Missionare und Inselvertreter kennen die Stationen besser als anreisende Offiziere. Ein Inselrat gibt ihnen Einfluss auf Steuern und Arbeitspolitik."
 AOEIW39_GPA_charter:0 "Die Rabauler Verordnungen"
 AOEIW39_GPA_charter_desc:0 "Die Rabauler Verordnungen gleichen Marinegewalt, Zivilgerichte und lokale Raete ab. Kapitaene und Bezirksbeamte arbeiten endlich nach demselben Regelwerk."
 AOEIW39_GPA_econ:0 "Die Stationen muessen sich tragen"
 AOEIW39_GPA_econ_desc:0 "Prestige bezahlt weder Kohle noch Kabel oder Werftarbeiter. Kopra und Phosphate muessen einen bedeutenden Teil der eigenen Rechnungen decken."
 AOEIW39_GPA_econ_l:0 "Das Kopra-Syndikat"
 AOEIW39_GPA_econ_l_desc:0 "Ein Syndikat vereinheitlicht Vertraege, Verschiffung und Verarbeitung auf den Inseln. Seine Gewinne finanzieren die Verwaltung, konzentrieren aber wirtschaftliche Macht."
 AOEIW39_GPA_econ_r:0 "Werften fuer die Inseln"
 AOEIW39_GPA_econ_r_desc:0 "Rabaul und die wichtigsten Ankerplaetze brauchen Hellingen, Werkstaetten und Treibstofflager. Schon kleine Werften ersparen fuer jede Reparatur die lange Fahrt nach Asien."
 AOEIW39_GPA_econ_cap:0 "Ein pazifischer Versorgungsetat"
 AOEIW39_GPA_econ_cap_desc:0 "Einnahmen aus Plantagen und Hafengebuehren werden fuer Treibstoff, Vorraete und Notschiffe reserviert. Die Flotte soll vor Kriegsbeginn wissen, was die Inseln leisten koennen."
 AOEIW39_GPA_mil:0 "Die Seewege sichern"
 AOEIW39_GPA_mil_desc:0 "Keine Garnison kann jeden Strand bewachen. Die Verteidigung muss feindliche Schiffe frueh sehen und Versorgungsschiffe zwischen fernen Ankerplaetzen in Fahrt halten."
 AOEIW39_GPA_mil_l:0 "Kuestenbeobachter anwerben"
 AOEIW39_GPA_mil_l_desc:0 "Kuestenbeobachter mit Funkgeraeten melden Schiffe und Flugzeuge von Inseln, die keine feste Garnison tragen koennen. Ihre Warnung erreicht die Flotte, bevor der Gegner wieder im Ozean verschwindet."
 AOEIW39_GPA_mil_r:0 "Das Kreuzergeschwader stationieren"
 AOEIW39_GPA_mil_r_desc:0 "Ein Kreuzergeschwader in Rabaul gibt der Verwaltung eine bewegliche Reserve und einen sichtbaren Anspruch auf die Seewege. Die Werften halten es einsatzbereit."
 AOEIW39_GPA_mil_cap:0 "Das ozeanische Verteidigungsnetz"
 AOEIW39_GPA_mil_cap_desc:0 "Funkposten, Kuestenbeobachter und Marinestuetzpunkte arbeiten als ein Netz. Jede Insel wird zum Beobachtungsposten und jeder Hafen zur Ausweichstellung."
 AOEIW39_GPA_dip:0 "Fuer die Inseln sprechen"
 AOEIW39_GPA_dip_desc:0 "Der Inselrat entsendet eine staendige Abordnung nach Berlin. Pazifikpolitik muss Entfernungen und Gefahren beruecksichtigen, die auf Karten in der Wilhelmstrasse unsichtbar bleiben."
 AOEIW39_GPA_final:0 "Deutschlands Tor zum Ozean"
 AOEIW39_GPA_final_desc:0 "Die Verwaltung bietet Deutschland Haefen, Aufklaerung und eine Flottenbasis im westlichen Pazifik. Ihr Bestand ruht auf dem Netz zwischen den Inseln und nicht auf einer einzelnen Festung."
 AOEIW39_regional_industry_bonus:0 "Regionales Bauprogramm"
 IAF_neutrality:0 "Italienisch-Ostafrika"
 IAF_neutrality_DEF:0 "Italienisch-Ostafrika"
 IAF_neutrality_ADJ:0 "italienisch-ostafrikanisch"
 MAF_neutrality:0 "Mittelafrika"
 MAF_neutrality_DEF:0 "Mittelafrika"
 MAF_neutrality_ADJ:0 "mittelafrikanisch"
 GPA_neutrality:0 "Deutsche Pazifikverwaltung"
 GPA_neutrality_DEF:0 "die Deutsche Pazifikverwaltung"
 GPA_neutrality_ADJ:0 "deutsch-pazifisch"
 AOEIW39_IAF_viceroys_council:0 "Der Rat des Vizekoenigs"
 AOEIW39_IAF_viceroys_council_desc:0 "Ernannte Beamte setzen Roms Befehle rasch um, staerken Autoritaet und Kriegsbereitschaft und begrenzen dabei die lokale Selbstverwaltung."
 AOEIW39_IAF_consultative_assembly:0 "Die koloniale Ratsversammlung"
 AOEIW39_IAF_consultative_assembly_desc:0 "Staedtische Abgesandte und lokale Notabeln geben der Verwaltung Rueckhalt und verlangen groesseren Anteil an ihren Entscheidungen."
 AOEIW39_IAF_ascari_command:0 "Das Askari-Kommando"
 AOEIW39_IAF_ascari_command_desc:0 "Vergroesserte einheimische Bataillone geben dem Vizekoenigtum Arbeitskraft und Zusammenhalt fuer ostafrikanische Feldzuege."
 AOEIW39_IAF_motor_columns:0 "Motorkolonnen im Ogaden"
 AOEIW39_IAF_motor_columns_desc:0 "Selbststaendige mobile Kolonnen durchqueren trockenes Land schnell und entlasten das duenne Versorgungsnetz."
 AOEIW39_MAF_company_rule:0 "Erneuerte Konzessionsherrschaft"
 AOEIW39_MAF_company_rule_desc:0 "Konzessionsgesellschaften steigern Rohstoffgewinnung und Produktion, waehrend ihre Zwangsmethoden die politische Stabilitaet untergraben."
 AOEIW39_MAF_district_councils:0 "Die Bezirksraete"
 AOEIW39_MAF_district_councils_desc:0 "Anerkannte lokale Raete verbessern Zustimmung und Verwaltung und verlagern einen Teil der Macht aus Duala."
 AOEIW39_MAF_schutztruppe:0 "Die neue Schutztruppe"
 AOEIW39_MAF_schutztruppe_desc:0 "Eine zentral gefuehrte Kolonialtruppe setzt auf Disziplin, Verteidigung und Zusammenhalt."
 AOEIW39_MAF_african_officers:0 "Afrikanische Offizierspatente"
 AOEIW39_MAF_african_officers_desc:0 "Offizierspatente fuer erfahrene afrikanische Soldaten verbreitern die Rekrutierung und staerken die Erholung im Feld."
 AOEIW39_GPA_naval_governor:0 "Der Marinegouverneur"
 AOEIW39_GPA_naval_governor_desc:0 "Die Marinegewalt richtet die Inseln auf Werftarbeit und weitreichende Einsaetze aus und haelt ihre Selbstverwaltung klein."
 AOEIW39_GPA_island_council:0 "Der Inselrat"
 AOEIW39_GPA_island_council_desc:0 "Zivile und insulare Vertreter sorgen fuer bestaendigere Regierung, bessere Handelsbeziehungen und Druck auf mehr Selbstverwaltung."
 AOEIW39_GPA_coastwatchers:0 "Der Kuestenbeobachtungsdienst"
 AOEIW39_GPA_coastwatchers_desc:0 "Verborgene Funkposten auf den Inseln erweitern die Seeaufklaerung und geben gefaehrdeten Garnisonen Zeit zur Vorbereitung."
 AOEIW39_GPA_cruiser_station:0 "Der Kreuzerstandort Rabaul"
 AOEIW39_GPA_cruiser_station_desc:0 "Werkstaetten, Treibstofflager und ein staendiges Geschwader machen Rabaul zur Basis schneller Ozeanpatrouillen."
 AOEIW39_imperial_roster.3.t:0 "Die Verwaltung nimmt Gestalt an"
 AOEIW39_imperial_roster.3.a:0 "Die Ordnung in Kraft setzen."
 AOEIW39_final_IAF:0 "Strassen, Haefen und Kolonialkommando arbeiten nun als ein System. Italienisch-Ostafrika kann einen unterbrochenen Seeweg ueberstehen und den Feldzug aus eigenen Mitteln fortsetzen."
 AOEIW39_final_MAF:0 "Duala verfuegt nun ueber gemeinsame Konten, Verkehrswege und Verteidigung. Mittelafrika ist zu einer Territorialfoederation statt einer Ansammlung eroberter Bezirke geworden."
 AOEIW39_final_GPA:0 "Rabauls Funknetz, Werften und Inselraete verbinden die Pazifikstationen. Deutschland besitzt nun eine ozeanische Verwaltung, die sich selbst warnen, versorgen und verteidigen kann."
