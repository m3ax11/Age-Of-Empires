 AOEIW39_COG_concession_regime:0 "Das Konzessionsregime"
 AOEIW39_COG_concession_regime_desc:0 "Bergbaugesellschaften und die Force Publique stuetzen die belgische Herrschaft zu wachsenden politischen und menschlichen Kosten."
 AOEIW39_intro_COG:0 "Bergbaugesellschaften und die Force Publique stuetzen die belgische Herrschaft zu wachsenden politischen und menschlichen Kosten."
 AOEIW39_LBA_fourth_shore:0 "Das vierte Ufer"
 AOEIW39_LBA_fourth_shore_desc:0 "Rom behandelt Libyen als Erweiterung Italiens, waehrend Militaersiedlungen und Senussi-Widerstand um die Wueste ringen."
 AOEIW39_intro_LBA:0 "Rom behandelt Libyen als Erweiterung Italiens, waehrend Militaersiedlungen und Senussi-Widerstand um die Wueste ringen."
 AOEIW39_CUB_captaincy_compact:0 "Der Ausgleich der Generalkapitanie"
 AOEIW39_CUB_captaincy_compact_desc:0 "Havanna besitzt weitgehende Selbstverwaltung, doch Madrid kontrolliert Verteidigung, Handelsprivilegien und die letzte Verfassungsentscheidung."
 AOEIW39_intro_CUB:0 "Havanna besitzt weitgehende Selbstverwaltung, doch Madrid kontrolliert Verteidigung, Handelsprivilegien und die letzte Verfassungsentscheidung."
 AOEIW39_AFG_royal_buffer:0 "Der koenigliche Pufferstaat"
 AOEIW39_AFG_royal_buffer_desc:0 "Der afghanische Hof behauptet sich zwischen persischer Schutzmacht, russischem Druck und den Zugaengen nach Britisch-Indien."
 AOEIW39_intro_AFG:0 "Der afghanische Hof behauptet sich zwischen persischer Schutzmacht, russischem Druck und den Zugaengen nach Britisch-Indien."
 AOEIW39_AZR_southern_oil_compact:0 "Der suederserbaidschanische Oelausgleich"
 AOEIW39_AZR_southern_oil_compact_desc:0 "Täbris und die suedlichen kaspischen Felder sind durch Oelvertraege, Garnisonen und einen umstrittenen Verfassungsausgleich an Teheran gebunden."
 AOEIW39_intro_AZR:0 "Täbris und die suedlichen kaspischen Felder sind durch Oelvertraege, Garnisonen und einen umstrittenen Verfassungsausgleich an Teheran gebunden."
 AOEIW39_ANG_atlantic_concessions:0 "Die Atlantikkonzessionen"
 AOEIW39_ANG_atlantic_concessions_desc:0 "Luanda vermittelt zwischen Lissabon, Konzessionsgesellschaften und afrikanischer Arbeit in einer Kolonie groesser als das Mutterland."
 AOEIW39_intro_ANG:0 "Luanda vermittelt zwischen Lissabon, Konzessionsgesellschaften und afrikanischer Arbeit in einer Kolonie groesser als das Mutterland."
 AOEIW39_MZB_indian_ocean_corridor:0 "Der Korridor zum Indischen Ozean"
 AOEIW39_MZB_indian_ocean_corridor_desc:0 "Haefen und Eisenbahnen tragen den Reichtum des Hinterlandes zum Indischen Ozean und machen Mosambik fuer mehrere Reiche wertvoll."
 AOEIW39_intro_MZB:0 "Haefen und Eisenbahnen tragen den Reichtum des Hinterlandes zum Indischen Ozean und machen Mosambik fuer mehrere Reiche wertvoll."
 AOEIW39_ICE_north_atlantic_outpost:0 "Der nordatlantische Aussenposten"
 AOEIW39_ICE_north_atlantic_outpost_desc:0 "Deutsche Kontrolle sichert die nordatlantischen Zugaenge, macht Islands Haefen jedoch in jedem europaeischen Krieg zu Zielen."
 AOEIW39_intro_ICE:0 "Deutsche Kontrolle sichert die nordatlantischen Zugaenge, macht Islands Haefen jedoch in jedem europaeischen Krieg zu Zielen."
 AOEIW39_chinese_regional_category:0 "Der Provinzausgleich"
 AOEIW39_chinese_regional_category_desc:0 "Die Regionalregierungen muessen den Qing-Aufstand ueberstehen, ohne ihre eigenen Rechte aufzugeben oder China fremder Eroberung zu ueberlassen."
 AOEIW39_secure_the_provincial_charter:0 "Die Provinzcharta sichern"
 AOEIW39_secure_the_provincial_charter_desc:0 "Einnahmen, Ernennungen und Kommando muessen rechtlich geordnet werden, bevor die nationale Krise uns erreicht."
 AOEIW39_prepare_for_the_chinese_settlement:0 "Den chinesischen Ausgleich vorbereiten"
 AOEIW39_prepare_for_the_chinese_settlement_desc:0 "Welche Regierung auch aus dem Krieg hervorgeht, sie wird mit einer organisierten und bewaffneten Provinz verhandeln muessen."
 AOEIW39_SIK_oasis_coalition:0 "Die Oasenkoalition"
 AOEIW39_SIK_oasis_coalition_desc:0 "Dihua vermittelt im Tarimbecken zwischen Oasenhaendlern, Provinzsoldaten und konkurrierenden auslaendischen Verbindungen."
 AOEIW39_TIB_monastic_state:0 "Der Klosterstaat"
 AOEIW39_TIB_monastic_state_desc:0 "Die Kloester tragen Regierung und Gesellschaftsordnung, doch ihre Autoritaet begrenzt technische Reformen."
 AOEIW39_YUN_kunming_arsenals:0 "Die Arsenale von Kunming"
 AOEIW39_YUN_kunming_arsenals_desc:0 "Yunnan stuetzt sich auf Provinzwerkstaetten und eine Armee, die einen grossen Teil ihrer Produktion verbraucht."
 AOEIW39_XSM_ma_clique_compact:0 "Der Ausgleich der Ma-Clique"
 AOEIW39_XSM_ma_clique_compact_desc:0 "Familienarmeen und Hui-Kavallerie halten den Nordwesten durch wirksame, aber selten stabile Absprachen zusammen."
 AOEIW39_XIC_xian_truce:0 "Der Waffenstillstand von Xi'an"
 AOEIW39_XIC_xian_truce_desc:0 "Offiziere, Studenten und rivalisierende Nationalbewegungen sind sich einig, dass die auslaendische Invasion die unmittelbare Gefahr ist."
 AOEIW39_intro_SIK:0 "Dihua wird sein Ueberleben nicht gegen die Versprechen eines fernen Thronbewerbers eintauschen. Die Oasenkoalition muss zu eigenen Bedingungen in die chinesische Krise eintreten."
 AOEIW39_intro_TIB:0 "Lhasa steht abseits der rivalisierenden chinesischen Regierungen, doch Armeen in Kham machen Isolation zunehmend unmoeglich."
 AOEIW39_intro_YUN:0 "Kunming befehligt eine eigene Armee, Strassen und Arsenale. Die chinesische Krise zwingt die Provinzregierung zu entscheiden, wie viel Unabhaengigkeit diese Mittel schuetzen sollen."
 AOEIW39_intro_XSM:0 "Die Ma-Familien kontrollieren die nordwestlichen Marken durch Kavallerie, religioese Netzwerke und Familienabsprachen. Qing-Restauration und fremder Druck bedrohen diesen Ausgleich."
 AOEIW39_intro_XIC:0 "Xi'an liegt zwischen Zentralregierung, Kommunisten und nordwestlichen Armeen. Seine Offiziere wollen die Provinz zum Vermittler statt zur Beute machen."
 IAF:0 "Italienisch-Ostafrika"
 IAF_DEF:0 "Italienisch-Ostafrika"
 IAF_ADJ:0 "italienisch-ostafrikanisch"
 MAF:0 "Mittelafrika"
