 AOEIW35_sov.1.t:0 "Wer regiert den Staat?"
 AOEIW35_sov.1.d:0 "Der riesige Staat kann nur durch Verhandlungen mit Republiken und Provinzen oder durch die Konzentration von Transport, Ernennungen und Zwangsgewalt im Zentrum regiert werden."
