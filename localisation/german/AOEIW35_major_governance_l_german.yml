 AOEIW35_ger.1.t:0 "Wer regiert den Staat?"
 AOEIW35_ger.1.d:0 "Die Verfassungsordnung hat den Streit darüber, wer Deutschland tatsächlich regiert, nicht beendet. Krone, Kammer, Parteiorganisationen und Offizierskorps beanspruchen ein Mandat."
 AOEIW35_ger.1.a:0 "Repräsentative Institutionen erhalten Garantien."
 AOEIW35_ger.1.b:0 "Exekutive Autorität muss entscheiden können."
 AOEIW35_ger.2.t:0 "Die erste Regierungskrise"
 AOEIW35_ger.2.d:0 "Die neue Ordnung steht vor ihrer ersten praktischen Prüfung: Haushalt, Ernennungen und Mobilmachung müssen mit den Versprechen aus dem Machtkampf vereinbart werden."
 AOEIW35_ger.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_ger.2.b:0 "Die Befehlskette darf nicht warten."
 AOEIW35_ger.3.t:0 "Das nationale Sofortprogramm"
 AOEIW35_ger.3.d:0 "Die Industrie fordert feste Verträge, die organisierte Arbeiterschaft Sicherheiten und der Generalstab Vorrang. Das Kabinett kann nicht alle drei ohne Kosten zufriedenstellen."
 AOEIW35_ger.3.a:0 "Das Programm wie geplant durchführen."
 AOEIW35_ger.3.b:0 "Die schärfsten Maßnahmen zurücknehmen."
