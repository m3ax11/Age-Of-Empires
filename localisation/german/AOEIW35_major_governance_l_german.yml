 AOEIW35_ita.1.t:0 "Wer regiert den Staat?"
 AOEIW35_ita.1.d:0 "Das Regime ist ein Bündnis aus Parteisekretären, Soldaten, Industriellen und königlichen Institutionen. Hinter der öffentlichen Einheit steht ein Kampf um jede Ernennung."
 AOEIW35_ita.1.a:0 "Der Große Rat erhalten Garantien."
 AOEIW35_ita.1.b:0 "Persönliche Führung muss entscheiden können."
 AOEIW35_ita.2.t:0 "Die erste Regierungskrise"
 AOEIW35_ita.2.d:0 "Fehler bei der Beschaffung geben dem Großen Rat einen Vorwand für mehr Aufsicht, während die Exekutive gerade die geteilte Führung verantwortlich macht."
 AOEIW35_ita.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_ita.2.b:0 "Die Befehlskette darf nicht warten."
 AOEIW35_ita.3.t:0 "Das nationale Sofortprogramm"
 AOEIW35_ita.3.d:0 "Eine konzentrierte Industriekampagne kann die Streitkräfte modernisieren, doch Eisenbahnen und ziviler Markt können nicht jedes imperiale Versprechen zugleich tragen."
 AOEIW35_ita.3.a:0 "Das Programm wie geplant durchführen."
 AOEIW35_ita.3.b:0 "Die schärfsten Maßnahmen zurücknehmen."
