 AOEIW35_fra.1.t:0 "Wer regiert den Staat?"
 AOEIW35_fra.1.d:0 "Abgeordnete, Präfekten, Veteranen und Industriesyndikate deuten die nationale Ordnung unterschiedlich. Frankreich muss entscheiden, wie viel Autorität bei der Kammer verbleibt."
 AOEIW35_fra.1.a:0 "Die Kammer erhalten Garantien."
 AOEIW35_fra.1.b:0 "Exekutive Führung muss entscheiden können."
 AOEIW35_fra.2.t:0 "Die erste Regierungskrise"
 AOEIW35_fra.2.d:0 "Die Wiederbewaffnung hat den alten Streit zwischen parlamentarischer Aufsicht und einer handlungsfähigen Regierung neu entfacht."
 AOEIW35_fra.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_fra.2.b:0 "Die Befehlskette darf nicht warten."
 AOEIW35_fra.3.t:0 "Das nationale Sofortprogramm"
 AOEIW35_fra.3.d:0 "Ein nationales Mobilmachungsprogramm verspricht ausgebildete Reserven und moderne Fabriken, belastet jedoch entweder die Verbraucher oder schwächt die zivile Aufsicht."
 AOEIW35_fra.3.a:0 "Das Programm wie geplant durchführen."
 AOEIW35_fra.3.b:0 "Die schärfsten Maßnahmen zurücknehmen."
