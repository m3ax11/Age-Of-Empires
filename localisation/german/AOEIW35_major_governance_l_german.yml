 AOEIW35_usa.1.t:0 "Wer regiert den Staat?"
 AOEIW35_usa.1.d:0 "Die Verfassungsordnung muss nun die Mobilmachung zwischen achtundvierzig eifersüchtigen Bundesstaaten, mächtigen Ausschüssen und einer Exekutive mit Notstandsanspruch finanzieren."
