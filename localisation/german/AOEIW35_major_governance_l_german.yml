 AOEIW35_eng.1.t:0 "Wer regiert den Staat?"
 AOEIW35_eng.1.d:0 "Westminster kann nicht länger annehmen, dass eine imperiale Verpflichtung automatisch jedes Dominionparlament bindet. Beratung und Führung müssen versöhnt werden."
 AOEIW35_eng.1.a:0 "Parlament und Dominions erhalten Garantien."
 AOEIW35_eng.1.b:0 "Das Reichskabinett muss entscheiden können."
 AOEIW35_eng.2.t:0 "Die erste Regierungskrise"
 AOEIW35_eng.2.d:0 "Die Stabschefs verlangen einheitliche Führung, während die Dominionminister Mitsprache bei Verlegungen, Schifffahrt und Kriegsfinanzen fordern."
 AOEIW35_eng.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_eng.2.b:0 "Die Befehlskette darf nicht warten."
 AOEIW35_eng.3.t:0 "Das nationale Sofortprogramm"
 AOEIW35_eng.3.d:0 "Das Notprogramm kann Seewege schützen und den Schiffbau beschleunigen, wird jedoch für seine Dauer zivile Importe verdrängen."
 AOEIW35_eng.3.a:0 "Das Programm wie geplant durchführen."
 AOEIW35_eng.3.b:0 "Die schärfsten Maßnahmen zurücknehmen."
