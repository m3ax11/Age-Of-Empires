 AOEIW35_sov.2.d:0 "Eisenbahnzuteilungen sind zu einem Verfassungsstreit geworden. Regionale Delegierte fordern Garantien, während die Zentralministerien vor verzögerter Mobilmachung warnen."
 AOEIW35_sov.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_sov.2.b:0 "Die Befehlskette darf nicht warten."
