 AOEIW35_jap.1.t:0 "Wer regiert den Staat?"
 AOEIW35_jap.1.d:0 "Jede imperiale Strategie wird zum Kampf um Stahl, Treibstoff, Schiffe und Zugang zum Thron. Die Teilstreitkräfte verlangen eine bindende Zuteilung."
 AOEIW35_jap.1.a:0 "Die Marinekonferenz erhalten Garantien."
 AOEIW35_jap.1.b:0 "Das Heeresdirektorat muss entscheiden können."
 AOEIW35_jap.2.t:0 "Die erste Regierungskrise"
 AOEIW35_jap.2.d:0 "Die Verbindungskonferenz hat offene Sabotage verhindert, doch keine Teilstreitkraft akzeptiert eine Ordnung, in der die andere den nächsten Krieg bestimmt."
 AOEIW35_jap.2.a:0 "Einen ausgehandelten Kompromiss finden."
 AOEIW35_jap.2.b:0 "Die Befehlskette darf nicht warten."
 AOEIW35_jap.3.t:0 "Das nationale Sofortprogramm"
 AOEIW35_jap.3.d:0 "Ein gemeinsamer Mobilmachungsplan verspricht Effizienz auf Kosten des zivilen Verbrauchs und zwingt beide Teilstreitkräfte, eigene Prestigeprojekte aufzugeben."
 AOEIW35_jap.3.a:0 "Das Programm wie geplant durchführen."
 AOEIW35_jap.3.b:0 "Die schärfsten Maßnahmen zurücknehmen."
