l_english:
 AOEIW35_MON_frontier_category:0 "The Living Steppe"
 AOEIW35_MON_frontier_category_desc:0 "Political bargaining and repeatable frontier programmes give the compact focus tree a continuing second layer."
 AOEIW35_MON_frontier_council:0 "Convene the Seasonal Khural"
 AOEIW35_MON_frontier_council_desc:0 "Gather the competing local institutions and negotiate one limited common measure."
 AOEIW35_MON_frontier_programme:0 "Dispatch the Border Caravans"
 AOEIW35_MON_frontier_programme_desc:0 "A temporary programme improves supply and organisation while tying up political resources."
 AOEIW35_MON_frontier_compact:0 "The Steppe Compact"
 AOEIW35_MON_frontier_compact_desc:0 "Local administration, supply services and military command are working from one plan for the first time."
 AOEIW35_mon.1.t:0 "The Khural Assembles"
 AOEIW35_mon.1.d:0 "Herding cooperatives, army riders and provincial delegates arrive with different maps of the same frontier. Mongolia must decide whether survival begins with consent or command."
 AOEIW35_mon.1.a:0 "Negotiate with the civilian delegates."
 AOEIW35_mon.1.b:0 "Give priority to the frontier commands."
 AOEIW35_mon.2.t:0 "A State Across the Steppe"
 AOEIW35_mon.2.d:0 "The new roads, depots and registers have made government tangible beyond the capital. The bargain now has to endure a winter and a war."
 AOEIW35_mon.2.a:0 "The settlement must endure."
 AOEIW35_MAN_frontier_category:0 "Court, Banners and Recovery"
 AOEIW35_MAN_frontier_category_desc:0 "Political bargaining and repeatable frontier programmes give the compact focus tree a continuing second layer."
 AOEIW35_MAN_frontier_council:0 "Review the Banner Commands"
 AOEIW35_MAN_frontier_council_desc:0 "Gather the competing local institutions and negotiate one limited common measure."
 AOEIW35_MAN_frontier_programme:0 "Issue Northern Recovery Bonds"
 AOEIW35_MAN_frontier_programme_desc:0 "A temporary programme improves supply and organisation while tying up political resources."
 AOEIW35_MAN_frontier_compact:0 "The Northern Recovery Board"
 AOEIW35_MAN_frontier_compact_desc:0 "Local administration, supply services and military command are working from one plan for the first time."
 AOEIW35_man.1.t:0 "The Court Chooses Survival"
 AOEIW35_man.1.d:0 "The court controls titles, the banner commanders control armed men, and municipal committees control the stores. None can preserve Manchukuo alone."
 AOEIW35_man.1.a:0 "Negotiate with the civilian delegates."
 AOEIW35_man.1.b:0 "Give priority to the frontier commands."
 AOEIW35_man.2.t:0 "A Northern Settlement"
 AOEIW35_man.2.d:0 "Arsenal gauges, railway schedules and grain registers finally describe the same state. Recovery remains fragile, but it is no longer imaginary."
 AOEIW35_man.2.a:0 "The settlement must endure."
 AOEIW35_XIC_frontier_category:0 "The Xi'an Coalition"
 AOEIW35_XIC_frontier_category_desc:0 "Political bargaining and repeatable frontier programmes give the compact focus tree a continuing second layer."
 AOEIW35_XIC_frontier_council:0 "Broker the Provincial Council"
 AOEIW35_XIC_frontier_council_desc:0 "Gather the competing local institutions and negotiate one limited common measure."
 AOEIW35_XIC_frontier_programme:0 "Organise Silk Road Relief"
 AOEIW35_XIC_frontier_programme_desc:0 "A temporary programme improves supply and organisation while tying up political resources."
 AOEIW35_XIC_frontier_compact:0 "The Shaanxi Compact"
 AOEIW35_XIC_frontier_compact_desc:0 "Local administration, supply services and military command are working from one plan for the first time."
 AOEIW35_xic.1.t:0 "The Xi'an Conference"
 AOEIW35_xic.1.d:0 "Officers, provincial officials and relief committees meet under guard. Their coalition can become a government only if it controls roads as well as proclamations."
 AOEIW35_xic.1.a:0 "Negotiate with the civilian delegates."
 AOEIW35_xic.1.b:0 "Give priority to the frontier commands."
 AOEIW35_xic.2.t:0 "A Province That Can Endure"
 AOEIW35_xic.2.d:0 "Relief columns now share signals with the army and tax receipts reach the provincial council. Xi'an has gained institutions worth defending."
 AOEIW35_xic.2.a:0 "The settlement must endure."
