l_english:
 AOEIW14_GER_constitutional_settlement:0 "Crown, Reichstag, Länder"
 AOEIW14_GER_constitutional_settlement_desc:0 "The new articles name who appoints ministers, who votes the budget and when the Länder may stop Berlin. Every faction will have to sign what it previously left ambiguous."
 AOEIW14_GER_federal_economic_council:0 "Revive the Reichswirtschaftsrat"
 AOEIW14_GER_federal_economic_council_desc:0 "Employers, free unions and state governments will again face one another across the same chamber. Investment policy will be argued in public instead of dictated by a command ministry."
 AOEIW14_GER_professional_reichswehr:0 "A Professional Reichswehr"
 AOEIW14_GER_professional_reichswehr_desc:0 "Germany will favour a smaller, apolitical and technically trained army over a mass force built for political mobilisation."
 AOEIW14_GER_rhineland_air_defence:0 "Rhineland Air Defence"
 AOEIW14_GER_rhineland_air_defence_desc:0 "Radar stations, protected airfields and a unified reporting service will shield the industrial west without announcing an offensive doctrine."
 AOEIW14_GER_advanced_equipment_commission:0 "Trials at Kummersdorf"
 AOEIW14_GER_advanced_equipment_commission_desc:0 "Artillery, radios and experimental engines will be tested at Kummersdorf before parliament releases production money. Failed prototypes will no longer survive on a general's patronage."
 AOEIW14_GER_reichspakt_conference:0 "The Reichspakt Conference"
 AOEIW14_GER_reichspakt_conference_desc:0 "The alliance must choose between firmer German direction and a looser federal compact based on negotiated obligations."
 AOEIW14_GER_european_settlement:0 "A Second Locarno"
 AOEIW14_GER_european_settlement_desc:0 "Germany will offer arbitration on the Rhine and negotiated security in the east. Stresemann's method returns: signatures, guarantees and trade before another march to the frontier."

 AOEIW14_USA_general_staff_planning:0 "General Staff Government"
 AOEIW14_USA_general_staff_planning_desc:0 "Only a permanent directorate can turn temporary contingency plans into a governing system. Its first question is how national planning will be organised."
 AOEIW14_USA_continental_logistics_board:0 "Continental Logistics Board"
 AOEIW14_USA_continental_logistics_board_desc:0 "Military engineers and transport administrators will map the continent as one strategic supply system."
 AOEIW14_USA_military_industrial_coordination:0 "Military-Industrial Coordination"
 AOEIW14_USA_military_industrial_coordination_desc:0 "Strategic factories will receive stable orders and coordinated production targets, paid for through heavier civilian burdens."
 AOEIW14_USA_air_defence_grid:0 "The Air Defence Grid"
 AOEIW14_USA_air_defence_grid_desc:0 "A continental network of radar, observers and airfields will make warning time a national resource."
 AOEIW14_USA_strategic_air_command:0 "Strategic Air Command"
 AOEIW14_USA_strategic_air_command_desc:0 "Long-range aviation will become an independent instrument of deterrence and industrial war."
 AOEIW14_USA_national_laboratories:0 "The National Laboratories"
 AOEIW14_USA_national_laboratories_desc:0 "Central laboratories will unite university science, engineering and military requirements without granting discoveries for free."
 AOEIW14_USA_rocketry_program:0 "National Rocketry Program"
 AOEIW14_USA_rocketry_program_desc:0 "Directed research can accelerate rocketry, but scientists must still solve the problems and industry must still build the weapons."
 AOEIW14_USA_atomic_energy_commission:0 "Atomic Energy Commission"
 AOEIW14_USA_atomic_energy_commission_desc:0 "A military-scientific commission will accelerate nuclear theory while leaving reactors and weapons to be researched and constructed normally."
 AOEIW14_USA_national_reactor_program:0 "National Reactor Program"
 AOEIW14_USA_national_reactor_program_desc:0 "Standard designs and priority contracting will make future reactors easier to construct and operate."
 AOEIW14_USA_integrated_war_planning:0 "Integrated War Planning"
 AOEIW14_USA_integrated_war_planning_desc:0 "Logistics, air power, rockets and atomic research will be coordinated in one strategic system."

 AOEIW14_GER_constitutional_opposition:0 "Constitutional Opposition"
 AOEIW14_GER_constitutional_opposition_desc:0 "Open opposition carries political and institutional costs until a lawful transfer of power is secured."
 AOEIW14_GER_regional_concessions:0 "Regional Concessions"
 AOEIW14_GER_regional_concessions_desc:0 "The Länder support reform in return for powers that limit central mobilisation and demand continual negotiation."
 AOEIW14_GER_adenauer_government:0 "The Adenauer Government"
 AOEIW14_GER_adenauer_government_desc:0 "A stable federal cabinet encourages research, trade and civilian investment, but rejects mass mobilisation and easy aggression."
 AOEIW14_GER_air_defence_board:0 "Federal Air Defence Board"
 AOEIW14_GER_air_defence_board_desc:0 "Civil authorities, industry and the air service coordinate radar and defensive aviation."
 AOEIW14_GER_directed_reichspakt:0 "Directed Reichspakt"
 AOEIW14_GER_directed_reichspakt_desc:0 "Berlin retains firm strategic leadership, gaining authority at the price of unease among its partners."
 AOEIW14_GER_federal_reichspakt:0 "Federal European League"
 AOEIW14_GER_federal_reichspakt_desc:0 "Partners receive a greater voice and better commercial access, while Berlin must spend political capital on consensus."
 AOEIW14_POL_autonomy_settlement:0 "Polish Autonomy Settlement"
 AOEIW14_POL_autonomy_settlement_desc:0 "Expanded self-government has converted a dependent relationship into a more legitimate partnership."
 AOEIW14_HOL_constitutional_guarantee:0 "Dutch Constitutional Guarantee"
 AOEIW14_HOL_constitutional_guarantee_desc:0 "Germany has publicly guaranteed Dutch institutions and territorial security."
 AOEIW14_FRA_rhine_dialogue:0 "Rhine Dialogue"
 AOEIW14_FRA_rhine_dialogue_desc:0 "A permanent channel with Berlin lowers the risk that a border incident becomes a continental war."
 AOEIW14_AUS_vienna_consultation:0 "Vienna Consultation"
 AOEIW14_AUS_vienna_consultation_desc:0 "Regular political consultation with Berlin gives Vienna influence over the changing alliance system."
 AOEIW14_USA_economic_emergency:0 "Economic Emergency"
 AOEIW14_USA_economic_emergency_desc:0 "Credit failure and broken contracts are damaging production and confidence."
 AOEIW14_USA_political_paralysis:0 "Government Paralysis"
 AOEIW14_USA_political_paralysis_desc:0 "The federal branches obstruct one another while the crisis deepens."
 AOEIW14_USA_federal_confrontation:0 "Federal-State Confrontation"
 AOEIW14_USA_federal_confrontation_desc:0 "Conflicting authorities disrupt factories, administration and public order."
 AOEIW14_USA_temporary_military_administration:0 "Temporary Military Administration"
 AOEIW14_USA_temporary_military_administration_desc:0 "The armed forces maintain essential services under costly emergency powers and a disputed constitutional mandate."
 AOEIW14_USA_civilian_restoration:0 "Civilian Restoration"
 AOEIW14_USA_civilian_restoration_desc:0 "Emergency powers have been returned to elected institutions, restoring legitimacy and normal administration."
 AOEIW14_USA_permanent_directorate:0 "Permanent Directorate"
 AOEIW14_USA_permanent_directorate_desc:0 "The emergency administration has become a technocratic military state: coordinated and strategically focused, but expensive and constitutionally illegitimate."
 AOEIW14_USA_continental_logistics:0 "Continental Logistics System"
 AOEIW14_USA_continental_logistics_desc:0 "Transport and supply are planned as one national military network."
 AOEIW14_USA_nuclear_coordination:0 "Nuclear Coordination Authority"
 AOEIW14_USA_nuclear_coordination_desc:0 "The state accelerates reactor construction and fissile production, but still grants neither reactors nor bombs for free."
 AOEIW14_USA_central_planning_board:0 "Central Planning Board"
 AOEIW14_USA_central_planning_board_desc:0 "A single planning board produces coherent campaigns at the cost of political flexibility."
 AOEIW14_USA_staff_collegium:0 "Joint Staff Collegium"
 AOEIW14_USA_staff_collegium_desc:0 "A collegial staff system rewards doctrine, research and professional military judgement."

 AOEIW14_GER_reichspakt_category:0 "Reforming the Reichspakt"
 AOEIW14_GER_offer_polish_autonomy:0 "Offer Poland an Autonomy Treaty"
 AOEIW14_GER_offer_polish_autonomy_desc:0 "Offer Warsaw dominion-level autonomy and a more legitimate place in the continental order."
 AOEIW14_GER_guarantee_dutch_charter:0 "Guarantee the Dutch Charter"
 AOEIW14_GER_guarantee_dutch_charter_desc:0 "Ask the Netherlands to accept a public German guarantee of its institutions and security."
 AOEIW14_GER_open_paris_channel:0 "Open a Paris Channel"
 AOEIW14_GER_open_paris_channel_desc:0 "Propose direct non-aggression talks with France to reduce the danger of a Rhine crisis."
 AOEIW14_GER_invite_vienna_consultation:0 "Invite Vienna to Consultation"
 AOEIW14_GER_invite_vienna_consultation_desc:0 "Invite Austria-Hungary to regular consultations on the future of Central Europe."
 AOEIW14_USA_emergency_category:0 "Federal Emergency Measures"
 AOEIW14_USA_federal_relief_logistics:0 "Coordinate Federal Relief Logistics"
 AOEIW14_USA_federal_relief_logistics_desc:0 "Use federal transport offices to keep relief moving, at an immediate administrative cost."
 AOEIW14_USA_governors_liaison:0 "Establish a Governors' Liaison"
 AOEIW14_USA_governors_liaison_desc:0 "Create a permanent channel between state emergency offices and Washington."
 AOEIW14_USA_congressional_continuity:0 "Fund Congressional Continuity"
 AOEIW14_USA_congressional_continuity_desc:0 "Protect the legislature's ability to meet and pass emergency appropriations."
 AOEIW14_USA_secure_continuity_sites:0 "Secure Continuity Sites"
 AOEIW14_USA_secure_continuity_sites_desc:0 "Prepare protected command and communication sites without granting the army permanent power."

 aoeiw_phase14_ger.1.t:0 "The Civic Memorandum"
 aoeiw_phase14_ger.1.d:0 "Municipal leaders, Catholic associations and constitutional jurists have offered a common platform. The court will notice any public endorsement."
 aoeiw_phase14_ger.1.a:0 "Endorse the networks openly."
 aoeiw_phase14_ger.1.b:0 "Let the municipalities proceed quietly."
 aoeiw_phase14_ger.2.t:0 "The Reichspakt Conference"
 aoeiw_phase14_ger.2.d:0 "Germany's partners demand clarity. The alliance can retain strong direction from Berlin or become a looser league with negotiated obligations."
 aoeiw_phase14_ger.2.a:0 "Retain a directed Reichspakt."
 aoeiw_phase14_ger.2.b:0 "Form a Federal European League."
 aoeiw_phase14_ger.3.t:0 "The Polish Autonomy Treaty"
 aoeiw_phase14_ger.3.d:0 "Berlin offers a substantial expansion of Polish self-government in exchange for continued strategic partnership."
 aoeiw_phase14_ger.3.a:0 "Accept the autonomy settlement."
 aoeiw_phase14_ger.3.b:0 "Reject German supervision in any form."
 aoeiw_phase14_ger.4.t:0 "The Dutch Constitutional Charter"
 aoeiw_phase14_ger.4.d:0 "Germany offers a public guarantee of our institutions and territory as the basis for a more legitimate alliance."
 aoeiw_phase14_ger.4.a:0 "Accept the constitutional guarantee."
 aoeiw_phase14_ger.4.b:0 "We require no German guarantee."
 aoeiw_phase14_ger.5.t:0 "A Channel Across the Rhine"
 aoeiw_phase14_ger.5.d:0 "Adenauer's government proposes direct talks and a non-aggression pact intended to prevent a border crisis from escalating."
 aoeiw_phase14_ger.5.a:0 "Open the channel."
 aoeiw_phase14_ger.5.b:0 "Berlin has not earned our trust."
 aoeiw_phase14_ger.6.t:0 "Consultations with Berlin"
 aoeiw_phase14_ger.6.d:0 "Germany invites Vienna to a regular consultative mechanism on the Reichspakt and the balance of Central Europe."
 aoeiw_phase14_ger.6.a:0 "Vienna will take its seat."
 aoeiw_phase14_ger.6.b:0 "Preserve our freedom of action."

 aoeiw_phase14_usa.1.t:0 "The Relief Question"
 aoeiw_phase14_usa.1.d:0 "The first emergency appropriation cannot cover every failing bank, railway and municipality. The administration must choose its signal."
 aoeiw_phase14_usa.1.a:0 "Relief must come first."
 aoeiw_phase14_usa.1.b:0 "Preserve federal credit through austerity."
 aoeiw_phase14_usa.2.t:0 "The Governors Confront Washington"
 aoeiw_phase14_usa.2.d:0 "Several governors refuse federal directives they consider unconstitutional and unworkable. Negotiation may buy cooperation; enforcement may reveal who still commands."
 aoeiw_phase14_usa.2.a:0 "Negotiate a state compact."
 aoeiw_phase14_usa.2.b:0 "Federal orders must prevail."
 aoeiw_phase14_usa.3.t:0 "The Constitutional Ultimatum"
 aoeiw_phase14_usa.3.d:0 "The civilian branches have one final opportunity to agree on emergency authority before the continuity plans pass to military hands."
 aoeiw_phase14_usa.3.a:0 "Let Congress authorise the transfer."
 aoeiw_phase14_usa.3.b:0 "The executive and Army will act."
 aoeiw_phase14_usa.4.t:0 "The Administration's Mandate"
 aoeiw_phase14_usa.4.d:0 "Essential services function again. The temporary administration must now fulfil its promise to restore civilian government or declare the emergency order permanent."
 aoeiw_phase14_usa.4.a:0 "Restore the constitutional republic."
 aoeiw_phase14_usa.4.b:0 "Make Eisenhower's Directorate permanent."
 aoeiw_phase14_usa.5.t:0 "How the Directorate Will Plan"
 aoeiw_phase14_usa.5.d:0 "The new order requires a durable planning doctrine. Centralised control promises coherence; a professional collegium preserves independent military judgement."
 aoeiw_phase14_usa.5.a:0 "Create a Central Planning Board."
 aoeiw_phase14_usa.5.b:0 "Establish a Joint Staff Collegium."

