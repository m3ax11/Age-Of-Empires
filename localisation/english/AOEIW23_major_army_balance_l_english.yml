l_english:
 AOEIW23_GER_army_doctrine:0 "Truppengattungen des Reichsheeres"
 AOEIW23_GER_army_doctrine_desc:0 "The army standardises infantry, artillery and staff work around a single operational language."
 AOEIW23_GER_army_doctrine_mastered:0 "Auftragstaktik"
 AOEIW23_GER_army_doctrine_mastered_desc:0 "Junior leaders receive the authority, communications and fire support required to exploit a commander's intent."
 AOEIW23_FRA_army_doctrine:0 "Réserve de Manœuvre"
 AOEIW23_FRA_army_doctrine_desc:0 "Armoured reserves and methodical planning turn local crises into opportunities for a deliberate counterstroke."
 AOEIW23_FRA_army_doctrine_mastered:0 "Bataille Méthodique"
 AOEIW23_FRA_army_doctrine_mastered_desc:0 "France unites fortified defence, mobile reserves and carefully prepared fire plans in one national doctrine."
 AOEIW23_SOV_army_doctrine:0 "Operational Depth"
 AOEIW23_SOV_army_doctrine_desc:0 "Successive echelons, rail supply and deep reserves allow the army to absorb a blow without surrendering the campaign."
 AOEIW23_SOV_army_doctrine_mastered:0 "The Deep Battle School"
 AOEIW23_SOV_army_doctrine_mastered_desc:0 "Operational reserves and a disciplined supply system sustain offensives across the immense Russian theatre."
 AOEIW23_ENG_army_doctrine:0 "Expeditionary Staff"
 AOEIW23_ENG_army_doctrine_desc:0 "A compact professional force learns to deploy, supply and command formations far from the home islands."
 AOEIW23_ENG_army_doctrine_mastered:0 "Imperial General Staff"
 AOEIW23_ENG_army_doctrine_mastered_desc:0 "Common staff procedures make distant garrisons and elite formations parts of one expeditionary instrument."
 AOEIW23_USA_army_doctrine:0 "Motorized Mobilization"
 AOEIW23_USA_army_doctrine_desc:0 "Standard vehicles, depots and maintenance tables translate American industry into battlefield mobility."
 AOEIW23_USA_army_doctrine_mastered:0 "Industrial Warfare"
 AOEIW23_USA_army_doctrine_mastered_desc:0 "Mechanised formations fight at the end of a continental production and logistics system without equal."
 AOEIW23_ITA_army_doctrine:0 "Corpo d'Armata Mobile"
 AOEIW23_ITA_army_doctrine_desc:0 "Infantry, armour and artillery are organised for the short lines and sudden reversals of Mediterranean warfare."
 AOEIW23_ITA_army_doctrine_mastered:0 "Guerra di Manovra"
 AOEIW23_ITA_army_doctrine_mastered_desc:0 "Italian combined-arms groups learn to force a decision before difficult terrain and thin supply lines halt the advance."
 AOEIW23_JAP_army_doctrine:0 "Regimental Spirit"
 AOEIW23_JAP_army_doctrine_desc:0 "Rigorous junior leadership and light supply columns prepare infantry to operate beyond secure ports and railheads."
 AOEIW23_JAP_army_doctrine_mastered:0 "Decisive Infantry Battle"
 AOEIW23_JAP_army_doctrine_mastered_desc:0 "Elite infantry and austere logistics seek the decisive engagement in terrain that frustrates heavier armies."
 AOEIW23_CHI_army_doctrine:0 "Defence in Depth"
 AOEIW23_CHI_army_doctrine_desc:0 "Field fortifications, dispersed ammunition and regional reserves make every province expensive to take."
 AOEIW23_CHI_army_doctrine_mastered:0 "The National War of Resistance"
 AOEIW23_CHI_army_doctrine_mastered_desc:0 "Infantry armies trade space for time while artillery and reserves punish every exhausted breakthrough."
 AOEIW23_RAJ_army_doctrine:0 "Frontier Columns"
 AOEIW23_RAJ_army_doctrine_desc:0 "Light columns, mountain troops and local supply services prepare the army for vast and difficult frontiers."
 AOEIW23_RAJ_army_doctrine_mastered:0 "Army of the Subcontinent"
 AOEIW23_RAJ_army_doctrine_mastered_desc:0 "A continental army combines deep manpower reserves with specialist formations able to fight from desert to mountain."
 AOEIW23_FRA_liberal_imperial_army:0 "Armée de la Nation"
 AOEIW23_FRA_liberal_imperial_army_desc:0 "The Liberal Empire ties promotion and mobilisation to law, producing a resilient citizen army rather than a court guard."
 AOEIW23_FRA_napoleonic_army:0 "The Napoleonic Armoured Army"
 AOEIW23_FRA_napoleonic_army_desc:0 "A modern Grande Armée concentrates tanks, motorised infantry and operational reserves for a decisive breakthrough. Its appetite for supply is the price of that striking power."
 AOEIW23_GER_imperial_field_army:0 "The Imperial Field Army"
 AOEIW23_GER_imperial_field_army_desc:0 "The restored imperial settlement turns regimental tradition into a modern infantry-artillery system."
 AOEIW23_GER_republican_reichswehr:0 "Parliamentary Defence Command"
 AOEIW23_GER_republican_reichswehr_desc:0 "Civilian control, professional officers and reliable logistics create an army built to defend the constitutional order."
 AOEIW23_ITA_royal_army:0 "The Royal Army Renewed"
 AOEIW23_ITA_royal_army_desc:0 "The House of Savoy reconciles the officer corps with a professional, defensible national command."
 AOEIW23_ITA_national_army:0 "The Army of National Rebirth"
 AOEIW23_ITA_national_army_desc:0 "A centralised state builds fast combined-arms formations around artillery, armour and political mobilisation."
 AOEIW23_ITA_duce_command:0 "Supreme Command of the Duce"
 AOEIW23_ITA_duce_command_desc:0 "Political centralisation drives a ruthless offensive doctrine, powerful in the attack but dependent on momentum."
 AOEIW23_ITA_legions_of_empire:0 "Legions of the New Empire"
 AOEIW23_ITA_legions_of_empire_desc:0 "Elite combined-arms legions are equipped for a final Mediterranean campaign, at considerable logistical cost."
