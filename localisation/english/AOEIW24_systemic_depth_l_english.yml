 AOEIW24_secondary.1.a:0 "Govern the empire as a cabinet."
 AOEIW24_secondary.1.b:0 "London retains freedom of action."
 AOEIW24_secondary.1.d:0 "Dominion ministers demand consultation before British commitments bind their parliaments. London must choose between partnership and direct imperial coordination."
 AOEIW24_secondary.1.t:0 "The Imperial Cabinet Convenes"
 AOEIW24_secondary.2.a:0 "Create a joint planning council."
 AOEIW24_secondary.2.b:0 "Competition sharpens both services."
 AOEIW24_secondary.2.d:0 "Army and navy planners compete for steel, aircraft and political access. A liaison agreement sacrifices factional freedom for a coherent national strategy."
 AOEIW24_secondary.2.t:0 "The Services Demand a Settlement"
 AOEIW24_secondary.3.a:0 "Sign a binding provincial compact."
 AOEIW24_secondary.3.b:0 "The centre will impose unity."
 AOEIW24_secondary.3.d:0 "Provincial armies will support the centre only if taxation, appointments and supply are made predictable. Refusal promises faster central action and another cycle of resistance."
 AOEIW24_secondary.3.t:0 "The Provincial Governors Assemble"
 AOEIW24_secondary.4.a:0 "Build a federal princely settlement."
 AOEIW24_secondary.4.b:0 "The national state comes first."
 AOEIW24_secondary.4.d:0 "Princes offer troops and revenue in exchange for guarantees. Reformers warn that preserving every privilege will make national government impossible."
 AOEIW24_secondary.4.t:0 "The Chamber of Princes"
 AOEIW24_secondary.5.a:0 "Govern through the assembly."
 AOEIW24_secondary.5.b:0 "The state requires decisive command."
 AOEIW24_secondary.5.d:0 "Deputies demand a public accounting of mobilisation, taxation and foreign commitments. The executive may accept parliamentary responsibility or treat the chamber as an advisory body."
 AOEIW24_secondary.5.t:0 "A Mandate from the Assembly"
 AOEIW24_secondary.6.a:0 "Bind the states into a development pact."
 AOEIW24_secondary.6.b:0 "The federal executive allocates the funds."
 AOEIW24_secondary.6.d:0 "State oligarchies offer investment and political calm in exchange for control over development funds. Federal planners demand a national programme able to reach beyond the export coast."
 AOEIW24_secondary.6.t:0 "The Governors Arrive in Rio"
 AOEIW24_secondary.7.a:0 "Guarantee land and labour rights."
 AOEIW24_secondary.7.b:0 "Restore discipline before reform."
 AOEIW24_secondary.7.d:0 "Peasant leagues, organised labour, landowners and regional commanders all claim the revolution's inheritance. A lasting settlement must distribute both land and authority."
 AOEIW24_secondary.7.t:0 "Mexico's Unfinished Social Settlement"
 AOEIW24_secondary.8.a:0 "Balance them through a crown council."
 AOEIW24_secondary.8.b:0 "The government will command directly."
 AOEIW24_secondary.8.d:0 "The palace, officer corps and Macedonian organisations pursue overlapping claims but answer to different chains of loyalty."
 AOEIW24_secondary.8.t:0 "The Crown and the Committees"
 AOEIW24_secondary.9.a:0 "Build a government of national reconciliation."
 AOEIW24_secondary.9.b:0 "Victory will settle the argument."
 AOEIW24_secondary.9.d:0 "Royalists and Venizelists disagree over the constitution, the army and Greece's place in Europe. Mobilisation without reconciliation risks dividing every institution."
 AOEIW24_secondary.9.t:0 "The National Schism Reopened"
 AOEIW24_seek_vote_of_confidence:0 "Seek a Vote of Confidence"
 AOEIW24_social_synthesis:0 "Social National Synthesis"
 AOEIW24_social_synthesis_desc:0 "A continuing national programme whose benefits depend on maintaining the institutions that created it."
 AOEIW24_sov.1.a:0 "Organise every soviet for the struggle."
 AOEIW24_sov.1.d:0 "Workers' committees claim the stations and depots while officers of the old order prepare their own response. The revolution will be decided by preparation as much as conviction."
 AOEIW24_sov.1.t:0 "Russia Enters the Revolutionary Crisis"
 AOEIW24_sov.2.a:0 "All power to the Soviets!"
 AOEIW24_sov.2.d:0 "The revolutionary committees have issued their proclamation. Loyalists, conservatives and military governors refuse it. Russia now divides between the Soviet revolution and the old order."
 AOEIW24_sov.2.t:0 "The Russian Civil War"
 AOEIW24_sov.3.a:0 "Rebuild a union worthy of the sacrifice."
 AOEIW24_sov.3.d:0 "The organised armies of the old order have been defeated. The new Soviet state inherits ruined railways, displaced millions and the political debts accumulated during the struggle."
 AOEIW24_sov.3.t:0 "Victory of the Revolution"
 AOEIW24_sov.4.a:0 "Make the compact a genuine union."
 AOEIW24_sov.4.b:0 "The centre must retain the final word."
 AOEIW24_sov.4.d:0 "Delegates from the steppe and Caucasus demand binding representation. Imperial officials prefer a disciplined hierarchy directed from the Russian centre."
 AOEIW24_sov.4.t:0 "The Eurasian Congress Divides"
 AOEIW24_usa.1.a:0 "Back the industrial directors."
 AOEIW24_usa.1.b:0 "Guarantee organised labour."
 AOEIW24_usa.1.d:0 "Industrialists insist that only concentrated authority can sustain rearmament. Union delegates answer that a republic governed by contracts will eventually be governed by corporations."
 AOEIW24_usa.1.t:0 "The Boardrooms Before Congress"
 AOEIW24_usa.2.a:0 "The republic can govern itself."
 AOEIW24_usa.2.b:0 "The guard must remain at its post."
 AOEIW24_usa.2.d:0 "The immediate emergency has passed. MacArthur must now decide whether the uniform returns authority to elected institutions or becomes the permanent symbol of the state."
 AOEIW24_usa.2.t:0 "The Protector's Mandate"
 AOEIW24_usa.3.a:0 "Ratify the compact of states."
 AOEIW24_usa.3.b:0 "Preserve a coordinating federal centre."
 AOEIW24_usa.3.d:0 "Governors arrive determined to preserve local sovereignty. Federal officials warn that foreign powers will exploit a continent that cannot act together."
 AOEIW24_usa.3.t:0 "Convention of the States"
 AOEIW_FRONTIER_MAN_banner_armies:0 "Audit the Banner Rolls"
 AOEIW_FRONTIER_MAN_banner_armies_desc:0 "The surviving formations must be counted and reorganised instead of relying on paper armies."
 AOEIW_FRONTIER_MAN_hold_capital:0 "Defensive Stores for the Capital"
 AOEIW_FRONTIER_MAN_hold_capital_desc:0 "Fortifications and supply dumps will anchor the capital only while it remains under our control."
 AOEIW_FRONTIER_MAN_northern_arsenals:0 "The Northern Arsenal Board"
 AOEIW_FRONTIER_MAN_northern_arsenals_desc:0 "A controlled arsenal network will sustain the army without pretending that lost industrial districts still obey the court."
 AOEIW_FRONTIER_MAN_survival:0 "The Northern Court in Crisis"
 AOEIW_FRONTIER_MAN_survival_desc:0 "The Manchurian court must preserve a functioning administration while rival Chinese governments challenge its authority."
