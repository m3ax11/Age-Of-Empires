 AOEIW24_ita.1.b:0 "Preserve a governing coalition."
 AOEIW24_ita.1.d:0 "The council expects consultation over appointments and war. Mussolini can turn it into a partner of the dictatorship or demonstrate that no institution may restrain the Duce."
 AOEIW24_ita.1.t:0 "A Vote in the Grand Council"
 AOEIW24_ita.2.a:0 "Unite them in a workers' constitution."
 AOEIW24_ita.2.b:0 "Protect the autonomy of each union."
 AOEIW24_ita.2.d:0 "Metalworkers, railway unions, rural leagues and revolutionary syndicates disagree over whether the councils should govern factories or the entire state."
 AOEIW24_ita.2.t:0 "The National Labour Congress"
 AOEIW24_ita.3.a:0 "The legions receive priority."
 AOEIW24_ita.3.b:0 "Build provinces, not occupations."
 AOEIW24_ita.3.d:0 "Generals request fresh formations while provincial officials demand schools, roads and reliable courts. Conquest without integration is becoming an expensive map colour."
 AOEIW24_ita.3.t:0 "The Cost of Mare Nostrum"
