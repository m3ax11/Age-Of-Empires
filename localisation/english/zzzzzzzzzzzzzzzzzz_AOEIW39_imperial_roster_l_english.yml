l_english:
 AOEIW39_imperial_administration_category:0 "Imperial Administration"
 AOEIW39_imperial_administration_category_desc:0 "The local cabinet can bargain over money, military service and constitutional authority with the imperial government."
 AOEIW39_petition_for_local_budget:0 "Petition for a Local Budget"
 AOEIW39_petition_for_local_budget_desc:0 "Local revenue should answer first to the government that raises it."
 AOEIW39_accept_imperial_defence_quota:0 "Accept the Imperial Defence Quota"
 AOEIW39_accept_imperial_defence_quota_desc:0 "Meeting the imperial staff quota brings weapons and experience at the price of tighter control."
 AOEIW39_convene_constitutional_conference:0 "Convene a Constitutional Conference"
 AOEIW39_convene_constitutional_conference_desc:0 "Years of service and negotiation justify a formal review of our place within the empire."
 AOEIW39_local_budget_autonomy:0 "Local budget settlement"
 AOEIW39_defence_quota_autonomy:0 "Imperial defence quota"
 AOEIW39_constitutional_conference_autonomy:0 "Constitutional conference"
 AOEIW39_imperial_roster.1.t:0 "Our Place in the Imperial Order"
 AOEIW39_imperial_roster.1.a:0 "We will make this settlement our own."
 AOEIW39_imperial_roster.2.t:0 "The Constitutional Conference"
 AOEIW39_imperial_roster.2.d:0 "Delegates have converted years of petitions, service and local government into a negotiated expansion of constitutional authority."
 AOEIW39_imperial_roster.2.a:0 "Ratify the new articles."
 AOEIW39_INS_insulindian_compact:0 "The Insulindian Compact"
 AOEIW39_INS_insulindian_compact_desc:0 "Batavia holds together islands, courts and concession zones under Japanese supremacy. Oil and sea lanes provide leverage, but the compact lacks settled legitimacy."
 AOEIW39_intro_INS:0 "Batavia holds together islands, courts and concession zones under Japanese supremacy. Oil and sea lanes provide leverage, but the compact lacks settled legitimacy."
 AOEIW39_PHI_archipelago_defence:0 "Defence of the Archipelago"
 AOEIW39_PHI_archipelago_defence_desc:0 "Manila must defend scattered islands while Japanese officers demand access to every harbour and airfield."
 AOEIW39_intro_PHI:0 "Manila must defend scattered islands while Japanese officers demand access to every harbour and airfield."
 AOEIW39_KOR_industrial_protectorate:0 "The Industrial Protectorate"
 AOEIW39_KOR_industrial_protectorate_desc:0 "Korean factories feed the Japanese war economy while the governor-general tries to contain demands for national government."
 AOEIW39_intro_KOR:0 "Korean factories feed the Japanese war economy while the governor-general tries to contain demands for national government."
 AOEIW39_BRM_frontier_administration:0 "The Frontier Administration"
 AOEIW39_BRM_frontier_administration_desc:0 "Rangoon governs river valleys and frontier peoples through an uneasy arrangement inherited from British India."
 AOEIW39_intro_BRM:0 "Rangoon governs river valleys and frontier peoples through an uneasy arrangement inherited from British India."
 AOEIW39_ALG_divided_colony:0 "A Colony Divided"
 AOEIW39_ALG_divided_colony_desc:0 "Settlers, imperial officials and Algerian representatives disagree over who belongs to the French political nation."
 AOEIW39_intro_ALG:0 "Settlers, imperial officials and Algerian representatives disagree over who belongs to the French political nation."
 AOEIW39_MOR_treaty_sultanate:0 "The Treaty Sultanate"
 AOEIW39_MOR_treaty_sultanate_desc:0 "The Sultan retains court and religious authority, while French residents control finance, security and foreign affairs."
 AOEIW39_intro_MOR:0 "The Sultan retains court and religious authority, while French residents control finance, security and foreign affairs."
 AOEIW39_TUN_beylical_compact:0 "The Beylical Compact"
 AOEIW39_TUN_beylical_compact_desc:0 "The Bey, reformers and the French residency preserve a compact whose terms every faction reads differently."
 AOEIW39_intro_TUN:0 "The Bey, reformers and the French residency preserve a compact whose terms every faction reads differently."
 AOEIW39_NFL_commission_government:0 "Commission Government"
 AOEIW39_NFL_commission_government_desc:0 "Debt placed Newfoundland under an appointed commission, but the Atlantic war may restore the island to political consequence."
 AOEIW39_intro_NFL:0 "Debt placed Newfoundland under an appointed commission, but the Atlantic war may restore the island to political consequence."
 AOEIW39_NGA_indirect_rule:0 "Indirect Rule"
 AOEIW39_NGA_indirect_rule_desc:0 "Emirs, councils and colonial officers share authority without agreeing where imperial responsibility ends."
 AOEIW39_intro_NGA:0 "Emirs, councils and colonial officers share authority without agreeing where imperial responsibility ends."
 AOEIW39_KEN_settler_federation:0 "The Settler Federation"
 AOEIW39_KEN_settler_federation_desc:0 "Railways and settler farms bind East Africa together while African political organisations demand a voice in the federation."
 AOEIW39_intro_KEN:0 "Railways and settler farms bind East Africa together while African political organisations demand a voice in the federation."
 AOEIW39_SRL_plantation_harbour:0 "Plantation and Harbour"
 AOEIW39_SRL_plantation_harbour_desc:0 "Tea finances the island and Trincomalee guards the ocean route, giving Colombo bargaining power inside the empire."
 AOEIW39_intro_SRL:0 "Tea finances the island and Trincomalee guards the ocean route, giving Colombo bargaining power inside the empire."
 AOEIW39_COG_concession_regime:0 "The Concession Regime"
 AOEIW39_COG_concession_regime_desc:0 "Mining companies and the Force Publique sustain Belgian rule at a mounting political and human cost."
 AOEIW39_intro_COG:0 "Mining companies and the Force Publique sustain Belgian rule at a mounting political and human cost."
 AOEIW39_LBA_fourth_shore:0 "The Fourth Shore"
 AOEIW39_LBA_fourth_shore_desc:0 "Rome treats Libya as an extension of Italy, while military settlement and Senussi resistance contest the desert."
 AOEIW39_intro_LBA:0 "Rome treats Libya as an extension of Italy, while military settlement and Senussi resistance contest the desert."
 AOEIW39_CUB_captaincy_compact:0 "The Captaincy Compact"
 AOEIW39_CUB_captaincy_compact_desc:0 "Havana enjoys wide local government, but Madrid still controls defence, trade privileges and the final constitutional word."
 AOEIW39_intro_CUB:0 "Havana enjoys wide local government, but Madrid still controls defence, trade privileges and the final constitutional word."
 AOEIW39_AFG_royal_buffer:0 "The Royal Buffer"
 AOEIW39_AFG_royal_buffer_desc:0 "The Afghan court survives between Persian patronage, Russian pressure and the approaches to British India."
 AOEIW39_intro_AFG:0 "The Afghan court survives between Persian patronage, Russian pressure and the approaches to British India."
 AOEIW39_AZR_southern_oil_compact:0 "The Southern Oil Compact"
 AOEIW39_AZR_southern_oil_compact_desc:0 "Tabriz and the southern Caspian fields are tied to Tehran by oil contracts, garrisons and a disputed constitutional settlement."
 AOEIW39_intro_AZR:0 "Tabriz and the southern Caspian fields are tied to Tehran by oil contracts, garrisons and a disputed constitutional settlement."
 AOEIW39_ANG_atlantic_concessions:0 "The Atlantic Concessions"
 AOEIW39_ANG_atlantic_concessions_desc:0 "Luanda balances Lisbon, concession companies and African labour across a colony larger than the metropole."
 AOEIW39_intro_ANG:0 "Luanda balances Lisbon, concession companies and African labour across a colony larger than the metropole."
 AOEIW39_MZB_indian_ocean_corridor:0 "The Indian Ocean Corridor"
 AOEIW39_MZB_indian_ocean_corridor_desc:0 "Ports and railways carry the wealth of the interior to the Indian Ocean and make Mozambique valuable to several empires."
 AOEIW39_intro_MZB:0 "Ports and railways carry the wealth of the interior to the Indian Ocean and make Mozambique valuable to several empires."
 AOEIW39_ICE_north_atlantic_outpost:0 "The North Atlantic Outpost"
 AOEIW39_ICE_north_atlantic_outpost_desc:0 "German control protects the North Atlantic approaches but turns Icelandic ports into targets in every European war."
 AOEIW39_intro_ICE:0 "German control protects the North Atlantic approaches but turns Icelandic ports into targets in every European war."
 AOEIW39_chinese_regional_category:0 "The Provincial Settlement"
 AOEIW39_chinese_regional_category_desc:0 "The regional governments must survive the Qing rising without surrendering their own charters or abandoning China to foreign conquest."
 AOEIW39_secure_the_provincial_charter:0 "Secure the Provincial Charter"
 AOEIW39_secure_the_provincial_charter_desc:0 "Revenue, appointments and command must be placed on a legal footing before the national crisis reaches us."
 AOEIW39_prepare_for_the_chinese_settlement:0 "Prepare for the Chinese Settlement"
 AOEIW39_prepare_for_the_chinese_settlement_desc:0 "Whatever government emerges from the war will have to negotiate with an organised and armed province."
 AOEIW39_SIK_oasis_coalition:0 "The Oasis Coalition"
 AOEIW39_SIK_oasis_coalition_desc:0 "Dihua balances oasis merchants, provincial soldiers and competing foreign connections across the Tarim Basin."
 AOEIW39_TIB_monastic_state:0 "The Monastic State"
 AOEIW39_TIB_monastic_state_desc:0 "The monasteries sustain government and social order, but their authority limits technical reform."
 AOEIW39_YUN_kunming_arsenals:0 "The Kunming Arsenals"
 AOEIW39_YUN_kunming_arsenals_desc:0 "Yunnan relies on provincial workshops and an army that consumes much of what they produce."
 AOEIW39_XSM_ma_clique_compact:0 "The Ma Clique Compact"
 AOEIW39_XSM_ma_clique_compact_desc:0 "Family armies and Hui cavalry hold the northwest together through bargains that are effective but rarely stable."
 AOEIW39_XIC_xian_truce:0 "The Xi'an Truce"
 AOEIW39_XIC_xian_truce_desc:0 "Officers, students and rival national movements have agreed that foreign invasion is the immediate danger."
 AOEIW39_intro_SIK:0 "Dihua will not exchange provincial survival for a distant claimant's promises. The oasis coalition must enter the Chinese crisis on its own terms."
 AOEIW39_intro_TIB:0 "Lhasa stands apart from the rival Chinese governments, but armies moving across Kham make isolation increasingly difficult."
 AOEIW39_intro_YUN:0 "Kunming commands its own army, roads and arsenals. The Chinese crisis now forces the provincial government to decide how much independence those instruments should protect."
 AOEIW39_intro_XSM:0 "The Ma families control the northwestern marches through cavalry, religious networks and family agreements. Qing restoration and foreign pressure threaten that compact."
 AOEIW39_intro_XIC:0 "Xi'an sits between the central government, the communists and the northwestern armies. Its officers intend to make the province a broker rather than a prize."
 IAF:0 "Italian East Africa"
 IAF_DEF:0 "Italian East Africa"
 IAF_ADJ:0 "Italo-East African"
 MAF:0 "Mittelafrika"
 MAF_DEF:0 "Mittelafrika"
 MAF_ADJ:0 "Mittelafrikan"
 GPA:0 "German Pacific Administration"
 GPA_DEF:0 "the German Pacific Administration"
 GPA_ADJ:0 "German Pacific"
 AOEIW39_IAF_red_sea_viceroyalty:0 "The Red Sea Viceroyalty"
 AOEIW39_IAF_red_sea_viceroyalty_desc:0 "Massawa and Mogadishu are governed as one Italian military corridor, dependent on shipping and colonial troops."
 AOEIW39_MAF_chartered_colonies:0 "The Chartered Colonies"
 AOEIW39_MAF_chartered_colonies_desc:0 "Railways, concessions and district administrations bind a vast central African territory to Berlin."
 AOEIW39_GPA_island_station:0 "The Island Station"
 AOEIW39_GPA_island_station_desc:0 "Scattered anchorages form a naval network whose survival depends on convoys and fortified harbours."
 AOEIW39_intro_IAF:0 "Rome has united Eritrea and Somalia under a Red Sea viceroyalty. Colonial troops and shipping lanes must hold together territories divided by distance and local loyalties."
 AOEIW39_imperial_formations_category:0 "New Imperial Charters"
 AOEIW39_imperial_formations_category_desc:0 "Conquered colonial regions can be given administrations able to supply themselves and answer to Berlin."
 AOEIW39_charter_mittelafrika:0 "Charter Mittelafrika"
 AOEIW39_charter_mittelafrika_desc:0 "The central African conquests require one treasury, railway authority and colonial command."
 AOEIW39_create_german_pacific_administration:0 "Create the German Pacific Administration"
 AOEIW39_create_german_pacific_administration_desc:0 "Our Pacific islands and New Guinea stations should be placed under a single naval administration."
 AOEIW39_intro_MAL:0 "Qingdao and Guangzhouwan are Germany's exposed windows on East Asia. The colonial council must balance Berlin's orders, Chinese sovereignty and Japanese power."
 AOEIW39_intro_EST:0 "The Baltic Federation rests on a bargain between German protection and the political rights of its Estonian, Latvian, Lithuanian and German communities."
 AOEIW39_intro_VIN:0 "The Indochinese federation joins Vietnamese, Lao and Cambodian administrations beneath the French crown while Japan presses toward its frontier."
 AOEIW39_intro_MLI:0 "Dakar governs a federation stretching from Atlantic ports to the Niger bend. War service has made local representation impossible for Paris to ignore."
 AOEIW39_intro_KAZ:0 "The Turkestan Federation holds the railways, cotton lands and steppe approaches of Russia's southern empire. Its assembly now demands a voice equal to its strategic value."
 AOEIW39_intro_GEO:0 "The Caucasian administration binds Georgia, Armenia, Baku and Nakhchivan beneath Russian protection. Oil, ethnicity and three imperial frontiers test that union."
