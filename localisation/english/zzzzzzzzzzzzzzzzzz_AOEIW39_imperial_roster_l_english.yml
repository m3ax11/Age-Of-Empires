l_english:
 AOEIW39_imperial_administration_category:0 "Imperial Administration"
 AOEIW39_imperial_administration_category_desc:0 "The local cabinet can bargain over money, military service and constitutional authority with the imperial government."
 AOEIW39_petition_for_local_budget:0 "Petition for a Local Budget"
 AOEIW39_petition_for_local_budget_desc:0 "Local revenue should answer first to the government that raises it."
 AOEIW39_accept_imperial_defence_quota:0 "Accept the Imperial Defence Quota"
 AOEIW39_accept_imperial_defence_quota_desc:0 "Meeting the imperial staff quota brings weapons and experience at the price of tighter control."
 AOEIW39_convene_constitutional_conference:0 "Convene a Constitutional Conference"
 AOEIW39_convene_constitutional_conference_desc:0 "Years of service and negotiation justify a formal review of our place within the empire."
 AOEIW39_local_budget_autonomy:0 "Local budget settlement"
 AOEIW39_defence_quota_autonomy:0 "Imperial defence quota"
 AOEIW39_constitutional_conference_autonomy:0 "Constitutional conference"
 AOEIW39_imperial_roster.1.t:0 "Our Place in the Imperial Order"
 AOEIW39_imperial_roster.1.a:0 "We will make this settlement our own."
 AOEIW39_imperial_roster.2.t:0 "The Constitutional Conference"
 AOEIW39_imperial_roster.2.d:0 "Delegates have converted years of petitions, service and local government into a negotiated expansion of constitutional authority."
 AOEIW39_imperial_roster.2.a:0 "Ratify the new articles."
 AOEIW39_INS_insulindian_compact:0 "The Insulindian Compact"
 AOEIW39_INS_insulindian_compact_desc:0 "Batavia holds together islands, courts and concession zones under Japanese supremacy. Oil and sea lanes provide leverage, but the compact lacks settled legitimacy."
 AOEIW39_intro_INS:0 "Batavia holds together islands, courts and concession zones under Japanese supremacy. Oil and sea lanes provide leverage, but the compact lacks settled legitimacy."
 AOEIW39_PHI_archipelago_defence:0 "Defence of the Archipelago"
 AOEIW39_PHI_archipelago_defence_desc:0 "Manila must defend scattered islands while Japanese officers demand access to every harbour and airfield."
 AOEIW39_intro_PHI:0 "Manila must defend scattered islands while Japanese officers demand access to every harbour and airfield."
 AOEIW39_KOR_industrial_protectorate:0 "The Industrial Protectorate"
 AOEIW39_KOR_industrial_protectorate_desc:0 "Korean factories feed the Japanese war economy while the governor-general tries to contain demands for national government."
 AOEIW39_intro_KOR:0 "Korean factories feed the Japanese war economy while the governor-general tries to contain demands for national government."
 AOEIW39_BRM_frontier_administration:0 "The Frontier Administration"
 AOEIW39_BRM_frontier_administration_desc:0 "Rangoon governs river valleys and frontier peoples through an uneasy arrangement inherited from British India."
 AOEIW39_intro_BRM:0 "Rangoon governs river valleys and frontier peoples through an uneasy arrangement inherited from British India."
 AOEIW39_ALG_divided_colony:0 "A Colony Divided"
 AOEIW39_ALG_divided_colony_desc:0 "Settlers, imperial officials and Algerian representatives disagree over who belongs to the French political nation."
 AOEIW39_intro_ALG:0 "Settlers, imperial officials and Algerian representatives disagree over who belongs to the French political nation."
 AOEIW39_MOR_treaty_sultanate:0 "The Treaty Sultanate"
 AOEIW39_MOR_treaty_sultanate_desc:0 "The Sultan retains court and religious authority, while French residents control finance, security and foreign affairs."
 AOEIW39_intro_MOR:0 "The Sultan retains court and religious authority, while French residents control finance, security and foreign affairs."
 AOEIW39_TUN_beylical_compact:0 "The Beylical Compact"
 AOEIW39_TUN_beylical_compact_desc:0 "The Bey, reformers and the French residency preserve a compact whose terms every faction reads differently."
 AOEIW39_intro_TUN:0 "The Bey, reformers and the French residency preserve a compact whose terms every faction reads differently."
 AOEIW39_NFL_commission_government:0 "Commission Government"
 AOEIW39_NFL_commission_government_desc:0 "Debt placed Newfoundland under an appointed commission, but the Atlantic war may restore the island to political consequence."
 AOEIW39_intro_NFL:0 "Debt placed Newfoundland under an appointed commission, but the Atlantic war may restore the island to political consequence."
 AOEIW39_NGA_indirect_rule:0 "Indirect Rule"
 AOEIW39_NGA_indirect_rule_desc:0 "Emirs, councils and colonial officers share authority without agreeing where imperial responsibility ends."
 AOEIW39_intro_NGA:0 "Emirs, councils and colonial officers share authority without agreeing where imperial responsibility ends."
 AOEIW39_KEN_settler_federation:0 "The Settler Federation"
 AOEIW39_KEN_settler_federation_desc:0 "Railways and settler farms bind East Africa together while African political organisations demand a voice in the federation."
 AOEIW39_intro_KEN:0 "Railways and settler farms bind East Africa together while African political organisations demand a voice in the federation."
 AOEIW39_SRL_plantation_harbour:0 "Plantation and Harbour"
 AOEIW39_SRL_plantation_harbour_desc:0 "Tea finances the island and Trincomalee guards the ocean route, giving Colombo bargaining power inside the empire."
 AOEIW39_intro_SRL:0 "Tea finances the island and Trincomalee guards the ocean route, giving Colombo bargaining power inside the empire."
 AOEIW39_COG_concession_regime:0 "The Concession Regime"
 AOEIW39_COG_concession_regime_desc:0 "Mining companies and the Force Publique sustain Belgian rule at a mounting political and human cost."
 AOEIW39_intro_COG:0 "Mining companies and the Force Publique sustain Belgian rule at a mounting political and human cost."
 AOEIW39_LBA_fourth_shore:0 "The Fourth Shore"
 AOEIW39_LBA_fourth_shore_desc:0 "Rome treats Libya as an extension of Italy, while military settlement and Senussi resistance contest the desert."
 AOEIW39_intro_LBA:0 "Rome treats Libya as an extension of Italy, while military settlement and Senussi resistance contest the desert."
 AOEIW39_CUB_captaincy_compact:0 "The Captaincy Compact"
 AOEIW39_CUB_captaincy_compact_desc:0 "Havana enjoys wide local government, but Madrid still controls defence, trade privileges and the final constitutional word."
 AOEIW39_intro_CUB:0 "Havana enjoys wide local government, but Madrid still controls defence, trade privileges and the final constitutional word."
 AOEIW39_AFG_royal_buffer:0 "The Royal Buffer"
 AOEIW39_AFG_royal_buffer_desc:0 "The Afghan court survives between Persian patronage, Russian pressure and the approaches to British India."
 AOEIW39_intro_AFG:0 "The Afghan court survives between Persian patronage, Russian pressure and the approaches to British India."
 AOEIW39_AZR_southern_oil_compact:0 "The Southern Oil Compact"
 AOEIW39_AZR_southern_oil_compact_desc:0 "Tabriz and the southern Caspian fields are tied to Tehran by oil contracts, garrisons and a disputed constitutional settlement."
 AOEIW39_intro_AZR:0 "Tabriz and the southern Caspian fields are tied to Tehran by oil contracts, garrisons and a disputed constitutional settlement."
 AOEIW39_ANG_atlantic_concessions:0 "The Atlantic Concessions"
 AOEIW39_ANG_atlantic_concessions_desc:0 "Luanda balances Lisbon, concession companies and African labour across a colony larger than the metropole."
 AOEIW39_intro_ANG:0 "Luanda balances Lisbon, concession companies and African labour across a colony larger than the metropole."
 AOEIW39_MZB_indian_ocean_corridor:0 "The Indian Ocean Corridor"
 AOEIW39_MZB_indian_ocean_corridor_desc:0 "Ports and railways carry the wealth of the interior to the Indian Ocean and make Mozambique valuable to several empires."
 AOEIW39_intro_MZB:0 "Ports and railways carry the wealth of the interior to the Indian Ocean and make Mozambique valuable to several empires."
 AOEIW39_ICE_north_atlantic_outpost:0 "The North Atlantic Outpost"
 AOEIW39_ICE_north_atlantic_outpost_desc:0 "German control protects the North Atlantic approaches but turns Icelandic ports into targets in every European war."
 AOEIW39_intro_ICE:0 "German control protects the North Atlantic approaches but turns Icelandic ports into targets in every European war."
 AOEIW39_chinese_regional_category:0 "The Provincial Settlement"
 AOEIW39_chinese_regional_category_desc:0 "The regional governments must survive the Qing rising without surrendering their own charters or abandoning China to foreign conquest."
 AOEIW39_secure_the_provincial_charter:0 "Secure the Provincial Charter"
 AOEIW39_secure_the_provincial_charter_desc:0 "Revenue, appointments and command must be placed on a legal footing before the national crisis reaches us."
 AOEIW39_prepare_for_the_chinese_settlement:0 "Prepare for the Chinese Settlement"
 AOEIW39_prepare_for_the_chinese_settlement_desc:0 "Whatever government emerges from the war will have to negotiate with an organised and armed province."
 AOEIW39_SIK_oasis_coalition:0 "The Oasis Coalition"
 AOEIW39_SIK_oasis_coalition_desc:0 "Dihua balances oasis merchants, provincial soldiers and competing foreign connections across the Tarim Basin."
 AOEIW39_TIB_monastic_state:0 "The Monastic State"
 AOEIW39_TIB_monastic_state_desc:0 "The monasteries sustain government and social order, but their authority limits technical reform."
 AOEIW39_YUN_kunming_arsenals:0 "The Kunming Arsenals"
 AOEIW39_YUN_kunming_arsenals_desc:0 "Yunnan relies on provincial workshops and an army that consumes much of what they produce."
 AOEIW39_XSM_ma_clique_compact:0 "The Ma Clique Compact"
 AOEIW39_XSM_ma_clique_compact_desc:0 "Family armies and Hui cavalry hold the northwest together through bargains that are effective but rarely stable."
 AOEIW39_XIC_xian_truce:0 "The Xi'an Truce"
 AOEIW39_XIC_xian_truce_desc:0 "Officers, students and rival national movements have agreed that foreign invasion is the immediate danger."
 AOEIW39_intro_SIK:0 "Dihua will not exchange provincial survival for a distant claimant's promises. The oasis coalition must enter the Chinese crisis on its own terms."
 AOEIW39_intro_TIB:0 "Lhasa stands apart from the rival Chinese governments, but armies moving across Kham make isolation increasingly difficult."
 AOEIW39_intro_YUN:0 "Kunming commands its own army, roads and arsenals. The Chinese crisis now forces the provincial government to decide how much independence those instruments should protect."
 AOEIW39_intro_XSM:0 "The Ma families control the northwestern marches through cavalry, religious networks and family agreements. Qing restoration and foreign pressure threaten that compact."
 AOEIW39_intro_XIC:0 "Xi'an sits between the central government, the communists and the northwestern armies. Its officers intend to make the province a broker rather than a prize."
 IAF:0 "Italian East Africa"
 IAF_DEF:0 "Italian East Africa"
 IAF_ADJ:0 "Italo-East African"
 MAF:0 "Mittelafrika"
 MAF_DEF:0 "Mittelafrika"
 MAF_ADJ:0 "Mittelafrikan"
 GPA:0 "German Pacific Administration"
 GPA_DEF:0 "the German Pacific Administration"
 GPA_ADJ:0 "German Pacific"
 AOEIW39_IAF_red_sea_viceroyalty:0 "The Red Sea Viceroyalty"
 AOEIW39_IAF_red_sea_viceroyalty_desc:0 "Massawa and Mogadishu are governed as one Italian military corridor, dependent on shipping and colonial troops."
 AOEIW39_MAF_chartered_colonies:0 "The Chartered Colonies"
 AOEIW39_MAF_chartered_colonies_desc:0 "Railways, concessions and district administrations bind a vast central African territory to Berlin."
 AOEIW39_GPA_island_station:0 "The Island Station"
 AOEIW39_GPA_island_station_desc:0 "Scattered anchorages form a naval network whose survival depends on convoys and fortified harbours."
 AOEIW39_intro_IAF:0 "Rome has united Eritrea and Somalia under a Red Sea viceroyalty. Colonial troops and shipping lanes must hold together territories divided by distance and local loyalties."
 AOEIW39_imperial_formations_category:0 "New Imperial Charters"
 AOEIW39_imperial_formations_category_desc:0 "Conquered colonial regions can be given administrations able to supply themselves and answer to Berlin."
 AOEIW39_charter_mittelafrika:0 "Charter Mittelafrika"
 AOEIW39_charter_mittelafrika_desc:0 "The central African conquests require one treasury, railway authority and colonial command."
 AOEIW39_create_german_pacific_administration:0 "Create the German Pacific Administration"
 AOEIW39_create_german_pacific_administration_desc:0 "Our Pacific islands and New Guinea stations should be placed under a single naval administration."
 AOEIW39_intro_MAL:0 "Qingdao and Guangzhouwan are Germany's exposed windows on East Asia. The colonial council must balance Berlin's orders, Chinese sovereignty and Japanese power."
 AOEIW39_intro_EST:0 "The Baltic Federation rests on a bargain between German protection and the political rights of its Estonian, Latvian, Lithuanian and German communities."
 AOEIW39_intro_VIN:0 "The Indochinese federation joins Vietnamese, Lao and Cambodian administrations beneath the French crown while Japan presses toward its frontier."
 AOEIW39_intro_MLI:0 "Dakar governs a federation stretching from Atlantic ports to the Niger bend. War service has made local representation impossible for Paris to ignore."
 AOEIW39_intro_KAZ:0 "The Turkestan Federation holds the railways, cotton lands and steppe approaches of Russia's southern empire. Its assembly now demands a voice equal to its strategic value."
 AOEIW39_intro_GEO:0 "The Caucasian administration binds Georgia, Armenia, Baku and Nakhchivan beneath Russian protection. Oil, ethnicity and three imperial frontiers test that union."
 AOEIW39_IAF_root:0 "The Massawa-Mogadishu Axis"
 AOEIW39_IAF_root_desc:0 "Massawa and Mogadishu lie a thousand miles apart. A regular coastal service, common accounts and a single chain of command must make them one colony in more than name."
 AOEIW39_IAF_left:0 "The Viceroy's Council"
 AOEIW39_IAF_left_desc:0 "The viceroy will govern through appointed officials and officers answerable to Rome. Orders will travel quickly, although little authority will remain in local hands."
 AOEIW39_IAF_right:0 "Call the Colonial Consultative Assembly"
 AOEIW39_IAF_right_desc:0 "Merchants, elders and municipal delegates demand a place at the table. Their assembly will slow decrees but give the administration roots beyond its garrisons."
 AOEIW39_IAF_charter:0 "A Statuto for the Red Sea"
 AOEIW39_IAF_charter_desc:0 "A colonial statute will settle the powers of Asmara, Mogadishu and Rome before the next emergency forces the question."
 AOEIW39_IAF_econ:0 "The Colonial Treasury"
 AOEIW39_IAF_econ_desc:0 "Separate Eritrean and Somali accounts conceal waste and competing priorities. One treasury can direct customs revenue toward roads, ports and defence."
 AOEIW39_IAF_econ_l:0 "Finish the Strada Imperiale"
 AOEIW39_IAF_econ_l_desc:0 "Engineers will close the gaps in the imperial road and establish guarded depots along its length. Troops and lorries must be able to cross the colony without waiting on coastal shipping."
 AOEIW39_IAF_econ_r:0 "Open the Port of Assab"
 AOEIW39_IAF_econ_r_desc:0 "Assab can become the southern outlet of the Eritrean plateau. New quays and warehouses will turn the neglected harbour into a useful Red Sea station."
 AOEIW39_IAF_econ_cap:0 "A Treasury in Asmara"
 AOEIW39_IAF_econ_cap_desc:0 "Customs receipts will remain in Asmara long enough to finance local obligations. Rome will still set policy, but the viceroyalty will no longer plead for every lira."
 AOEIW39_IAF_mil:0 "Comando Africa Orientale"
 AOEIW39_IAF_mil_desc:0 "The scattered colonial commands need one operational headquarters. Staff officers in Asmara will prepare joint plans for both shores of the Horn."
 AOEIW39_IAF_mil_l:0 "Expand the Ascari Battalions"
 AOEIW39_IAF_mil_l_desc:0 "The Ascari know the climate, languages and tracks on which any campaign will depend. Enlarged battalions under experienced local NCOs will form the backbone of the field army."
 AOEIW39_IAF_mil_r:0 "Motor Columns for the Ogaden"
 AOEIW39_IAF_mil_r_desc:0 "The Ogaden punishes forces tied to railheads. Light motor columns carrying their own fuel and water can patrol the interior and concentrate before an enemy can respond."
 AOEIW39_IAF_mil_cap:0 "The Red Sea Defence Plan"
 AOEIW39_IAF_mil_cap_desc:0 "Massawa, Assab and Mogadishu will share warning stations, reserves and coastal plans. An attack on one port must bring the whole command into action."
 AOEIW39_IAF_dip:0 "The Cairo-Rome Air Route"
 AOEIW39_IAF_dip_desc:0 "Regular aircraft between Cairo, Asmara and Rome will carry orders, specialists and urgent cargo around the British-held sea lanes."
 AOEIW39_IAF_final:0 "A Viceroyalty That Can Endure"
 AOEIW39_IAF_final_desc:0 "The roads, treasury and colonial army now answer to the same government. Italian East Africa can survive a shipping crisis and bargain with Rome from a position of proven usefulness."
 AOEIW39_MAF_root:0 "The Duala Charter"
 AOEIW39_MAF_root_desc:0 "Duala's administrators must turn a chain of conquered territories into a government. The charter defines who collects revenue, commands the police and answers to Berlin."
 AOEIW39_MAF_left:0 "Renew the Company Concessions"
 AOEIW39_MAF_left_desc:0 "Trading companies offer ships, accountants and capital in return for broad concessions. Restoring their privileges will extract resources quickly and place much of the interior beyond public scrutiny."
 AOEIW39_MAF_right:0 "Seat the District Councils"
 AOEIW39_MAF_right_desc:0 "District chiefs and municipal delegates can carry policy where German officials are few. Recognising their councils trades some control for consent and steadier administration."
 AOEIW39_MAF_charter:0 "The Governor-General's Ordinance"
 AOEIW39_MAF_charter_desc:0 "The governor-general will publish one code for customs, labour and district government. Rival colonial offices can no longer issue contradictory orders."
 AOEIW39_MAF_econ:0 "Open the Interior"
 AOEIW39_MAF_econ_desc:0 "The coast cannot support the administration by itself. Survey parties and river posts will connect inland farms and mines to the customs system."
 AOEIW39_MAF_econ_l:0 "Rails to the Copperbelt"
 AOEIW39_MAF_econ_l_desc:0 "A dependable railway toward the Copperbelt promises heavy mineral traffic and rapid troop movement, but it will consume the administration's construction budget."
 AOEIW39_MAF_econ_r:0 "Steamers on the Congo"
 AOEIW39_MAF_econ_r_desc:0 "The Congo already provides a road into the interior. Dredging channels and subsidising river steamers can move cargo sooner than another transcontinental railway."
 AOEIW39_MAF_econ_cap:0 "The Central African Customs Union"
 AOEIW39_MAF_econ_cap_desc:0 "Internal tariffs keep each former colony looking toward its old capital. A shared customs area will give Mittelafrika one market and one source of revenue."
 AOEIW39_MAF_mil:0 "Rebuild the Schutztruppe"
 AOEIW39_MAF_mil_desc:0 "The old Schutztruppe tradition offers a cadre for the new territory. Its companies must be rebuilt around modern signals, medical services and dependable supply columns."
 AOEIW39_MAF_mil_l:0 "The Colonial Officer Corps"
 AOEIW39_MAF_mil_l_desc:0 "German officers will retain direct command from company to headquarters. Discipline and doctrine will be consistent, even where the force lacks local initiative."
 AOEIW39_MAF_mil_r:0 "Commission African Officers"
 AOEIW39_MAF_mil_r_desc:0 "African NCOs already carry much of the daily burden. Commissions and staff schooling will widen recruitment and give the army officers who understand its districts."
 AOEIW39_MAF_mil_cap:0 "The Equatorial Defence Staff"
 AOEIW39_MAF_mil_cap_desc:0 "Duala will coordinate garrisons, river patrols and railway reserves through an equatorial defence staff. No district should face a revolt or invasion alone."
 AOEIW39_MAF_dip:0 "The Cape-to-Cairo Problem"
 AOEIW39_MAF_dip_desc:0 "British routes from the Cape toward Cairo cut across every German plan for the interior. Diplomats and surveyors must decide where commerce ends and strategic encirclement begins."
 AOEIW39_MAF_final:0 "From Charter to Federation"
 AOEIW39_MAF_final_desc:0 "Mittelafrika now possesses common accounts, transport and a territorial army. The charter can mature into a federation capable of governing between instructions from Berlin."
 AOEIW39_GPA_root:0 "Raise the Imperial Ensign"
 AOEIW39_GPA_root_desc:0 "Rabaul will again fly the imperial colours over Germany's scattered Pacific stations. A naval administration must first establish which islands it can actually supply and defend."
 AOEIW39_GPA_left:0 "The Naval Governor"
 AOEIW39_GPA_left_desc:0 "A naval governor can align every harbour, wireless post and plantation with fleet requirements. Civilian concerns will yield whenever the sea command demands it."
 AOEIW39_GPA_right:0 "Convene the Island Council"
 AOEIW39_GPA_right_desc:0 "Planters, missionaries and island representatives know the stations better than visiting officers. An island council will give them influence over taxation and labour policy."
 AOEIW39_GPA_charter:0 "The Rabaul Ordinances"
 AOEIW39_GPA_charter_desc:0 "The Rabaul ordinances will reconcile naval authority with civilian courts and local councils. Captains and district officers will finally work from the same rulebook."
 AOEIW39_GPA_econ:0 "Make the Stations Pay"
 AOEIW39_GPA_econ_desc:0 "Prestige cannot pay for coal, cables or repair crews. The stations must export enough copra and phosphates to meet a meaningful share of their own bills."
 AOEIW39_GPA_econ_l:0 "The Copra Syndicate"
 AOEIW39_GPA_econ_l_desc:0 "A single syndicate can standardise contracts, shipping and processing across the islands. Its profits will finance administration, at the cost of concentrating economic power."
 AOEIW39_GPA_econ_r:0 "Build the Island Dockyards"
 AOEIW39_GPA_econ_r_desc:0 "Rabaul and the principal anchorages need slips, workshops and fuel storage. Even modest dockyards will reduce the long voyage to Asian yards for every repair."
 AOEIW39_GPA_econ_cap:0 "A Pacific Supply Account"
 AOEIW39_GPA_econ_cap_desc:0 "Revenue from plantations and harbour dues will be reserved for fuel, stores and emergency shipping. The fleet should know what the islands can provide before war begins."
 AOEIW39_GPA_mil:0 "Guard the Sea Lanes"
 AOEIW39_GPA_mil_desc:0 "No garrison can protect every beach. Defence depends on seeing hostile ships early and keeping supply vessels moving between distant anchorages."
 AOEIW39_GPA_mil_l:0 "Recruit the Coastwatchers"
 AOEIW39_GPA_mil_l_desc:0 "Radio-equipped coastwatchers will report ships and aircraft from islands too small for permanent garrisons. Their value lies in warning the fleet before the enemy disappears into the ocean."
 AOEIW39_GPA_mil_r:0 "Base the Cruiser Squadron"
 AOEIW39_GPA_mil_r_desc:0 "A cruiser squadron at Rabaul gives the administration a mobile reserve and a visible claim to the sea lanes. Dockyard capacity will be organised around keeping it at sea."
 AOEIW39_GPA_mil_cap:0 "The Oceanic Defence Network"
 AOEIW39_GPA_mil_cap_desc:0 "Wireless posts, coastwatchers and naval bases will operate as one network. Each island becomes an observation point and each harbour a fallback position."
 AOEIW39_GPA_dip:0 "Speak for the Islands"
 AOEIW39_GPA_dip_desc:0 "The island council will send a permanent delegation to Berlin. Pacific policy must reflect distances and risks that are invisible on maps in the Wilhelmstrasse."
 AOEIW39_GPA_final:0 "Germany's Oceanic Gate"
 AOEIW39_GPA_final_desc:0 "The administration now offers Germany ports, intelligence and a fleet base across the western Pacific. Its survival rests on the network built between the islands, rather than any single fortress."
 AOEIW39_regional_industry_bonus:0 "Regional construction programme"
 IAF_neutrality:0 "Italian East Africa"
 IAF_neutrality_DEF:0 "Italian East Africa"
 IAF_neutrality_ADJ:0 "Italo-East African"
 MAF_neutrality:0 "Mittelafrika"
 MAF_neutrality_DEF:0 "Mittelafrika"
 MAF_neutrality_ADJ:0 "Mittelafrikan"
 GPA_neutrality:0 "German Pacific Administration"
 GPA_neutrality_DEF:0 "the German Pacific Administration"
 GPA_neutrality_ADJ:0 "German Pacific"
 AOEIW39_IAF_viceroys_council:0 "The Viceroy's Council"
 AOEIW39_IAF_viceroys_council_desc:0 "Appointed officials execute Rome's orders quickly, reinforcing authority and military readiness while restraining local autonomy."
 AOEIW39_IAF_consultative_assembly:0 "The Colonial Consultative Assembly"
 AOEIW39_IAF_consultative_assembly_desc:0 "Municipal delegates and local notables lend the administration legitimacy and press for a greater share of its decisions."
 AOEIW39_IAF_ascari_command:0 "The Ascari Command"
 AOEIW39_IAF_ascari_command_desc:0 "Expanded locally recruited battalions give the viceroyalty manpower and cohesion suited to East African operations."
 AOEIW39_IAF_motor_columns:0 "Ogaden Motor Columns"
 AOEIW39_IAF_motor_columns_desc:0 "Self-contained mobile columns cross arid country quickly and place less strain on the thin supply network."
 AOEIW39_MAF_company_rule:0 "Renewed Company Rule"
 AOEIW39_MAF_company_rule_desc:0 "Concession companies maximise extraction and factory output, while coercive management erodes political stability."
 AOEIW39_MAF_district_councils:0 "The District Councils"
 AOEIW39_MAF_district_councils_desc:0 "Recognised local councils improve consent and administration while shifting a measure of authority away from Duala."
 AOEIW39_MAF_schutztruppe:0 "The New Schutztruppe"
 AOEIW39_MAF_schutztruppe_desc:0 "A centrally commanded colonial force emphasises discipline, defence and unit cohesion."
 AOEIW39_MAF_african_officers:0 "African Officer Commissions"
 AOEIW39_MAF_african_officers_desc:0 "Opening commissions to experienced African soldiers broadens recruitment and strengthens recovery in the field."
 AOEIW39_GPA_naval_governor:0 "The Naval Governor"
 AOEIW39_GPA_naval_governor_desc:0 "Naval authority directs the islands toward dockyard work and longer-range operations while holding autonomy in check."
 AOEIW39_GPA_island_council:0 "The Island Council"
 AOEIW39_GPA_island_council_desc:0 "Civilian and island representatives bring steadier government, improved trade relations and pressure for self-rule."
 AOEIW39_GPA_coastwatchers:0 "The Coastwatcher Service"
 AOEIW39_GPA_coastwatchers_desc:0 "Radio posts hidden across the islands extend naval detection and give exposed garrisons time to prepare."
 AOEIW39_GPA_cruiser_station:0 "The Rabaul Cruiser Station"
 AOEIW39_GPA_cruiser_station_desc:0 "Workshops, fuel depots and a permanent squadron make Rabaul a base for fast ocean patrols."
 AOEIW39_imperial_roster.3.t:0 "The Administration Takes Shape"
 AOEIW39_imperial_roster.3.a:0 "Put the settlement into force."
 AOEIW39_final_IAF:0 "The roads, ports and colonial command now work as one system. Italian East Africa can endure a broken sea route and continue the campaign from its own resources."
 AOEIW39_final_MAF:0 "Duala now presides over common accounts, transport and defence. Mittelafrika has become a territorial federation rather than a collection of conquered districts."
 AOEIW39_final_GPA:0 "Rabaul's wireless network, dockyards and island councils bind the Pacific stations together. Germany now possesses an oceanic administration able to warn, supply and defend itself."
