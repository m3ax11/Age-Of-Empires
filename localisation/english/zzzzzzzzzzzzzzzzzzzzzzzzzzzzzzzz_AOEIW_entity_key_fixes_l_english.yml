l_english:
 AOEIW14_GER_federal_economic_council_spirit:0 "Federal Economic Council"
 AOEIW14_GER_federal_economic_council_spirit_desc:0 "Regional governments, industry and labour will coordinate investment through a permanent council instead of a command ministry."
 AOEIW14_GER_professional_reichswehr_spirit:0 "A Professional Reichswehr"
 AOEIW14_GER_professional_reichswehr_spirit_desc:0 "Germany will favour a smaller, apolitical and technically trained army over a mass force built for political mobilisation."
 AOEIW14_GER_european_settlement_spirit:0 "A European Settlement"
 AOEIW14_GER_european_settlement_spirit_desc:0 "Constitutional government at home and negotiated security abroad can make Germany prosperous and stable, though less suited to reckless expansion."
 AOEIW14_USA_military_industrial_coordination_spirit:0 "Military-Industrial Coordination"
 AOEIW14_USA_military_industrial_coordination_spirit_desc:0 "Strategic factories will receive stable orders and coordinated production targets, paid for through heavier civilian burdens."
 AOEIW14_USA_air_defence_grid_spirit:0 "The Air Defence Grid"
 AOEIW14_USA_air_defence_grid_spirit_desc:0 "A continental network of radar, observers and airfields will make warning time a national resource."
 AOEIW14_USA_integrated_war_planning_spirit:0 "Integrated War Planning"
 AOEIW14_USA_integrated_war_planning_spirit_desc:0 "Logistics, air power, rockets and atomic research will be coordinated in one strategic system."
 AOEIW20_UF_mao_rapid_industrialisation_spirit:0 "Revolutionary Rapid Industrialisation"
 AOEIW20_UF_mao_rapid_industrialisation_spirit_desc:0 "Mass mobilisation and tightly directed investment force heavy industry into the interior at enormous social cost."
 AOEIW_HIST_GER_four_year_plan_spirit:0 "The Four Year Plan"
 AOEIW_HIST_GER_four_year_plan_spirit_desc:0 "German industry is reorganised to prepare the economy for war within four years."
 AOEIW_HIST_GER_blitzkrieg_machine_spirit:0 "A Machine for Blitzkrieg"
 AOEIW_HIST_GER_blitzkrieg_machine_spirit_desc:0 "Armour, motorised forces, radios and tactical aviation are integrated into a single operational system."
 AOEIW_world_USA_federal_mobilisation_spirit:0 "AOEIW world USA federal mobilisation"
 AOEIW_world_USA_federal_mobilisation_spirit_desc:0 "AOEIW world USA federal mobilisation"
