l_english:
 AOEIW_dominion_relations_category:0 "The Dominion Cabinets"
 AOEIW_dominion_relations_category_desc:0 "Canberra and Wellington govern their own countries, but defence planning, imperial trade and constitutional authority still bind them to London. Consultation strengthens consent and autonomy; direct coordination yields faster military control at a political cost."
 AOEIW_consult_australian_cabinet:0 "Consult the Australian Cabinet"
 AOEIW_consult_australian_cabinet_desc:0 "Submit the next round of Pacific planning to ministers in Canberra before commitments are announced in London."
 AOEIW_coordinate_australian_defence:0 "Coordinate Australian Defence"
 AOEIW_coordinate_australian_defence_desc:0 "Place procurement schedules and operational planning under a tighter imperial command for the coming emergency."
 AOEIW_consult_new_zealand_cabinet:0 "Consult the New Zealand Cabinet"
 AOEIW_consult_new_zealand_cabinet_desc:0 "Give Wellington a formal voice in Pacific deployments, shipping priorities and the defence of the islands."
 AOEIW_coordinate_new_zealand_defence:0 "Coordinate New Zealand Defence"
 AOEIW_coordinate_new_zealand_defence_desc:0 "Bring New Zealand's expeditionary planning and naval supply under direct imperial coordination."
 AOEIW_dominion_consultation_autonomy:0 "Cabinet consultation"
 AOEIW_dominion_coordination_autonomy:0 "Imperial defence coordination"
 AOEIW_dominion_consulted:0 "Cabinet consulted"
 AOEIW_dominion_directed:0 "Defence directed from London"
 AOEIW_belgrade_settlement:0 "The Belgrade Settlement"
 AOEIW_map_roster.1.t:0 "The Settlement with Belgrade"
 AOEIW_map_roster.1.d:0 "The South Slav crisis ended before it destroyed the Habsburg monarchy. Vienna recognised the independent kingdom in Belgrade and withdrew its claim to govern the South Slavs as a single crownland. The settlement saved the remaining union of Austria, Hungary, Bohemia, Slovakia and Galicia, but minority questions, railway access and military guarantees still tie both states together."
 AOEIW_map_roster.1.a:0 "The settlement preserved the monarchy."
 AOEIW_map_roster.2.t:0 "The Settlement with Vienna"
 AOEIW_map_roster.2.d:0 "Belgrade's independence emerged from the South Slav crisis and the settlement that followed. Vienna abandoned direct rule, while Yugoslavia accepted unresolved arrangements for trade, minorities and the Danube railways. Peace holds because both crowns remember the cost of reopening the question."
 AOEIW_map_roster.2.a:0 "Independence must be made durable."
