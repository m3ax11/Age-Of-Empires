l_english:
 AOEIW_final_JAP_continental_preparations:0 "Continental Expedition Preparations"
 AOEIW_final_JAP_continental_preparations_desc:0 "Rail timetables, stockpiles and landing plans are being assembled for a possible continental war."
 AOEIW_final_JAP_naval_priority:0 "The Navy Takes Priority"
 AOEIW_final_JAP_naval_priority_desc:0 "Resources are concentrated on the fleet, carrier aviation and control of the Pacific approaches."
 AOEIW_final_JAP_overextension:0 "Continental Overextension"
 AOEIW_final_JAP_overextension_desc:0 "A vast land war strains shipping, public confidence and the imperial supply system."
 AOEIW_final_reichspakt_staff:0 "Reichspakt Staff Coordination"
 AOEIW_final_reichspakt_staff_desc:0 "Shared mobilisation tables and operational planning bind the Reichspakt armies together."
 AOEIW_final_old_order_defence:0 "Old Order Defensive Planning"
 AOEIW_final_old_order_defence_desc:0 "The alliance has agreed upon common defensive sectors, reserves and rail priorities."
 AOEIW_final_mediterranean_coordination:0 "Mediterranean Air-Sea Coordination"
 AOEIW_final_mediterranean_coordination_desc:0 "League staffs coordinate reconnaissance, convoy protection and air support across the inland sea."
 AOEIW_final_faction_economic_protocol:0 "Alliance Economic Protocol"
 AOEIW_final_faction_economic_protocol_desc:0 "Priority contracts and shared standards reduce friction between allied industries."
 AOEIW20_UF_national_reconstruction:0 "National Reconstruction Programme"
 AOEIW20_UF_national_reconstruction_desc:0 "Transport, power and industrial repair are coordinated as a single national project."
 AOEIW20_UF_nra_integration:0 "Integrated National Revolutionary Army"
 AOEIW20_UF_nra_integration_desc:0 "Provincial forces answer to a unified staff, standard tables of organisation and national depots."
 AOEIW20_UF_council_charter:0 "Charter of the National Coalition"
 AOEIW20_UF_council_charter_desc:0 "The coalition accepts a written division of powers to prevent renewed civil conflict."
 AOEIW20_UF_coastal_defence:0 "Defence of the Coast"
 AOEIW20_UF_coastal_defence_desc:0 "Coastal commands, reserves and fortified ports prepare China for another invasion."
 AOEIW_final_postwar_reconstruction:0 "Post-War Reconstruction Commission"
 AOEIW_final_postwar_reconstruction_desc:0 "A central commission directs repairs, demobilisation and the return to a peacetime economy."
 AOEIW_final_occupation_burden:0 "Burden of Occupation"
 AOEIW_final_occupation_burden_desc:0 "Garrisons and administrators consume resources while political opposition grows at home."

 AOEIW20_UF_chiang_constitutional_tutelage:0 "Constitutional Tutelage"
 AOEIW20_UF_chiang_constitutional_tutelage_desc:0 "The NRA promises eventual constitutional government while preserving the authority needed to reunify the state."
 AOEIW20_UF_chiang_integrate_provincial_armies:0 "Integrate the Provincial Armies"
 AOEIW20_UF_chiang_integrate_provincial_armies_desc:0 "Regional commands will surrender their private chains of supply to the national general staff."
 AOEIW20_UF_chiang_national_reconstruction:0 "The National Reconstruction Commission"
 AOEIW20_UF_chiang_national_reconstruction_desc:0 "The Nanjing programme links military consolidation to rail, industrial and administrative reconstruction."
 AOEIW20_UF_mao_land_to_the_tiller:0 "Land to the Tiller"
 AOEIW20_UF_mao_land_to_the_tiller_desc:0 "Land redistribution will bind the countryside to the revolution and release millions for national service."
 AOEIW20_UF_mao_reconstruction_committees:0 "Reconstruction Committees"
 AOEIW20_UF_mao_reconstruction_committees_desc:0 "Local committees organise labour, repair transport and direct scarce materials toward strategic projects."
 AOEIW20_UF_mao_rapid_industrialisation:0 "Industrialise at Revolutionary Speed"
 AOEIW20_UF_mao_rapid_industrialisation_desc:0 "China will compress decades of industrial growth into a single mobilisation, accepting hardship in exchange for steel and machinery."
 AOEIW20_UF_council_coalition_charter:0 "The Coalition Charter"
 AOEIW20_UF_council_coalition_charter_desc:0 "NRA, CCP and regional delegates define the limits of a collective national government."
 AOEIW20_UF_council_regional_compromise:0 "A Regional Compromise"
 AOEIW20_UF_council_regional_compromise_desc:0 "Provincial autonomy is recognised in return for taxes, recruits and obedience to the common defence."
 AOEIW20_UF_council_reconstruction_compact:0 "The Reconstruction Compact"
 AOEIW20_UF_council_reconstruction_compact_desc:0 "Competing parties agree that railways, arsenals and civil industry must be rebuilt before their constitutional dispute resumes."
 AOEIW20_UF_prepare_the_coast:0 "Prepare the Coast"
 AOEIW20_UF_prepare_the_coast_desc:0 "Japanese pressure makes fortified ports and a unified coastal command unavoidable."
 AOEIW20_UF_china_stands_united:0 "China Stands United"
 AOEIW20_UF_china_stands_united_desc:0 "The emergency coalition has survived war and settlement. Whatever its politics, China will not be partitioned again."

 AOEIW_final_JAP_expansion_category:0 "The Imperial Strategy Debate"
 AOEIW_final_JAP_expansion_category_desc:0 "The Army, Navy, civilian ministries and zaibatsu compete to determine when—and whether—Japan expands."
 AOEIW_final_JAP_imperial_conference:0 "Convene the Imperial Conference"
 AOEIW_final_JAP_imperial_conference_desc:0 "The throne will hear the rival strategic programmes before authorising a national course."
 AOEIW_final_JAP_prepare_continental_war:0 "Prepare a Continental War"
 AOEIW_final_JAP_prepare_continental_war_desc:0 "Assemble rail capacity, landing craft, ammunition and reserves without yet committing the empire to war."
 AOEIW_final_JAP_authorise_china_expedition:0 "Authorise the China Expedition"
 AOEIW_final_JAP_authorise_china_expedition_desc:0 "The preparations are complete. Authorisation creates a war goal but leaves the final declaration under player control."
 AOEIW_final_JAP_authorise_china_expedition_tt:0 "Gain an §YAnnex§! war goal against §YChina§!. This decision does §Rnot§! declare war automatically."
 AOEIW_final_JAP_navy_first:0 "Give the Navy Priority"
 AOEIW_final_JAP_navy_first_desc:0 "Delay the continental commitment and concentrate for one year on shipyards, carriers and naval aviation."
 AOEIW_final_JAP_offer_nanjing_protocol:0 "Offer the Nanjing Protocol"
 AOEIW_final_JAP_offer_nanjing_protocol_desc:0 "Demand political and economic concessions from China before resorting to force."
 AOEIW_final_JAP_arm_the_manchurian_restoration:0 "Arm the Manchurian Restoration"
 AOEIW_final_JAP_arm_the_manchurian_restoration_desc:0 "Puyi's Japanese-backed Manchurian government will receive men and weapons for its claim to all China."
 AOEIW_final_JAP_focus_unlocks_expedition_tt:0 "Unlocks the §YChina Expedition§! decision and begins continental preparations. It no longer creates an automatic war goal."

 aoeiw_final_japan.1.t:0 "The Imperial Strategy Conference"
 aoeiw_final_japan.1.a:0 "Prepare the continental expedition."
 aoeiw_final_japan.1.b:0 "The fleet comes first."
 aoeiw_final_japan.1.c:0 "Test China's willingness to negotiate."
 aoeiw_final_japan.1.d:0 "Japan must wait."
 aoeiw_final_japan.2.t:0 "The Nanjing Protocol"
 aoeiw_final_japan.2.d:0 "Tokyo offers a temporary settlement in return for economic access and recognition of its position in Manchuria. Acceptance may buy time, but it would weaken the government's claim to full sovereignty."
 aoeiw_final_japan.2.a:0 "Accept the protocol and buy time."
 aoeiw_final_japan.2.b:0 "China will concede nothing."
 aoeiw_final_japan.3.t:0 "China Accepts the Protocol"
 aoeiw_final_japan.3.d:0 "Nanjing has accepted a limited accommodation. The immediate crisis recedes, although neither side believes the settlement permanent."
 aoeiw_final_japan.3.a:0 "Exploit the breathing room."
 aoeiw_final_japan.4.t:0 "China Rejects the Protocol"
 aoeiw_final_japan.4.d:0 "The Chinese government has rejected every demand. Army planners now insist that only force can settle the continental question."
 aoeiw_final_japan.4.a:0 "Complete the preparations."
 aoeiw_final_japan.10.t:0 "War Returns to China"
 aoeiw_final_japan.10.d:0 "Japan's continental war threatens American trade and the balance of power in the Pacific. Congress must decide whether to prepare for a wider confrontation."
 aoeiw_final_japan.10.a:0 "Begin strategic preparations."
 aoeiw_final_japan.10.b:0 "Avoid another foreign commitment."
 aoeiw_final_japan.11.t:0 "Japan Moves on the Continent"
 aoeiw_final_japan.11.d:0 "A Japanese war in China threatens the Russian Far East and may create a powerful hostile bloc along our Asian frontier."
 aoeiw_final_japan.11.a:0 "Reinforce the eastern commands."
 aoeiw_final_japan.11.b:0 "Do not be drawn into Asia."

 AOEIW_final_faction_politics:0 "Alliance Councils"
 AOEIW_final_faction_politics_desc:0 "The great alliances require political compromise, military planning and shared economic priorities."
 AOEIW_final_reichspakt_command_conference:0 "Reichspakt Command Conference"
 AOEIW_final_reichspakt_command_conference_desc:0 "Berlin will decide whether the alliance needs strict central planning or a more consultative command structure."
 AOEIW_final_reichspakt_economic_protocol:0 "Reichspakt Economic Protocol"
 AOEIW_final_reichspakt_economic_protocol_desc:0 "Standardise contracts and direct strategic trade across the German-led bloc."
 AOEIW_final_old_order_security_council:0 "Old Order Security Council"
 AOEIW_final_old_order_security_council_desc:0 "France and its partners must choose between continental fortification and a more confrontational policy toward Germany."
 AOEIW_final_old_order_economic_compact:0 "Old Order Economic Compact"
 AOEIW_final_old_order_economic_compact_desc:0 "Pool strategic orders and reconstruction credits under French leadership."
 AOEIW_final_mediterranean_strategy_conference:0 "Mediterranean Strategy Conference"
 AOEIW_final_mediterranean_strategy_conference_desc:0 "Italy, Romania, Yugoslavia and Bulgaria must reconcile naval ambition with Balkan security."
 AOEIW_final_mediterranean_economic_board:0 "Mediterranean Economic Board"
 AOEIW_final_mediterranean_economic_board_desc:0 "Coordinate oil, shipping and armaments orders throughout the League."
 AOEIW_final_POL_petition_for_autonomy:0 "Petition Berlin for Autonomy"
 AOEIW_final_POL_petition_for_autonomy_desc:0 "The Polish administration will test whether Reichspakt partnership means anything beyond obedience."
 AOEIW_final_POL_autonomy_concession:0 "Reichspakt Autonomy Concession"

 aoeiw_final_factions.1.t:0 "The Reichspakt Command Conference"
 aoeiw_final_factions.1.d:0 "German, Dutch and Polish staffs disagree over how much authority Berlin should exercise over allied armies."
 aoeiw_final_factions.1.a:0 "Adopt a single operational staff."
 aoeiw_final_factions.1.b:0 "Respect national commands."
 aoeiw_final_factions.2.t:0 "The Old Order Security Council"
 aoeiw_final_factions.2.d:0 "French, Austrian and Belgian delegates debate whether security lies in prepared defensive sectors or firmer pressure against Germany."
 aoeiw_final_factions.2.a:0 "Fortify the common frontier."
 aoeiw_final_factions.2.b:0 "Pressure Berlin before it grows stronger."
 aoeiw_final_factions.3.t:0 "Mediterranean Strategy"
 aoeiw_final_factions.3.d:0 "Italy proposes a common strategy, but its allies disagree whether the fleet or the Balkan land frontier deserves priority."
 aoeiw_final_factions.3.a:0 "Control the sea and the air above it."
 aoeiw_final_factions.3.b:0 "Secure the Balkan approaches."
 aoeiw_final_factions.10.t:0 "The Polish Autonomy Petition"
 aoeiw_final_factions.10.d:0 "Warsaw asks for greater control over its administration and armed forces. A concession may stabilise the Reichspakt; refusal will strengthen Polish resistance."
 aoeiw_final_factions.10.a:0 "Grant measured autonomy."
 aoeiw_final_factions.10.b:0 "The Reich cannot loosen its grip."
 aoeiw_final_factions.11.t:0 "Berlin Concedes"
 aoeiw_final_factions.11.d:0 "Germany has accepted a measured expansion of Polish autonomy within the Reichspakt."
 aoeiw_final_factions.11.a:0 "A step toward partnership."
 aoeiw_final_factions.12.t:0 "Berlin Refuses"
 aoeiw_final_factions.12.d:0 "Germany has rejected the petition. Cooperation continues, but nationalist opposition has gained a powerful grievance."
 aoeiw_final_factions.12.a:0 "Poland will remember this."

 AOEIW_final_asian_diplomatic_protocol:0 "Asian Diplomatic Protocol"
 AOEIW_final_faction_coordination:0 "Alliance Coordination"
 AOEIW_final_rivalry_pressure:0 "Strategic Rivalry"


 AOEIW_final_postwar_category:0 "The Peace After Victory"
 AOEIW_final_postwar_category_desc:0 "Victory leaves damaged infrastructure, exhausted populations, disputed occupations and alliances that must define their purpose in peace."
 AOEIW_final_establish_reconstruction_commission:0 "Establish a Reconstruction Commission"
 AOEIW_final_establish_reconstruction_commission_desc:0 "Coordinate demobilisation, repairs and the conversion of wartime production through a central commission."
 AOEIW_final_GER_continental_settlement:0 "The Continental Settlement"
 AOEIW_final_GER_continental_settlement_desc:0 "Berlin will bind the Reichspakt to a post-war economic order instead of allowing the alliance to drift apart."
 AOEIW_final_FRA_european_security_charter:0 "A European Security Charter"
 AOEIW_final_FRA_european_security_charter_desc:0 "France will turn wartime cooperation into a permanent system of defensive planning."
 AOEIW_final_SOV_rebuild_the_eastern_railways:0 "Rebuild the Eastern Railways"
 AOEIW_final_SOV_rebuild_the_eastern_railways_desc:0 "Reconstruction of the long eastern rail corridors is essential to the army and the industrial interior."
 AOEIW_final_JAP_rationalise_imperial_administration:0 "Rationalise Imperial Administration"
 AOEIW_final_JAP_rationalise_imperial_administration_desc:0 "The empire must pay the immediate political and economic cost of replacing improvised military rule with durable administration."
 AOEIW_final_USA_convert_the_arsenal:0 "Convert the Arsenal of Democracy"
 AOEIW_final_USA_convert_the_arsenal_desc:0 "Factories, laboratories and logistics networks built for war will be redirected toward civilian growth."
