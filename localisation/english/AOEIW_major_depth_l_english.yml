 AOEIW_DEPTH_GER_staff_programmes_desc:0 "Focuses unlock funded programmes. Choose when to activate them. Alternatives share a budget and cooldown; their temporary spirits expire automatically. Permanent focus spirits upgrade instead of stacking."
 AOEIW_DEPTH_SOV_estate_compromise:0 "The Estate Compromise"
 AOEIW_DEPTH_SOV_estate_compromise_desc:0 "Landowners guarantee rural supplies in exchange for slower industrial taxation."
 AOEIW_DEPTH_SOV_land_ministry:0 "The Imperial Land Ministry"
 AOEIW_DEPTH_SOV_land_ministry_desc:0 "A central land register supports mobilisation but provokes resistance from local patrons."
 aoeiw_depth.21.t:0 "The Governors and the Harvest"
 aoeiw_depth.21.d:0 "The governors send contradictory estimates of grain, horses and recruits. The court can secure guarantees from provincial estates, or build a land ministry able to check the figures itself. Nicholas must choose between negotiated local loyalty and an expensive state apparatus capable of challenging it."
 aoeiw_depth.21.a:0 "Obtain guarantees from the estates"
 aoeiw_depth.21.b:0 "Build a central land ministry"
 AOEIW_DEPTH_SOV_grain_cooperatives:0 "Contracts with Grain Cooperatives"
 AOEIW_DEPTH_SOV_grain_cooperatives_desc:0 "Negotiated deliveries support stability but reserve civilian resources that cannot be mobilised for arms."
 AOEIW_DEPTH_SOV_central_grain:0 "The Central Grain Directorate"
 AOEIW_DEPTH_SOV_central_grain_desc:0 "Central allocations improve military supply at a cost to trust in the local soviets."
 aoeiw_depth.22.t:0 "The Grain and Railway Conference"
 aoeiw_depth.22.d:0 "The revolutionary government cannot feed the cities with proclamations. Cooperative delegates offer fixed contracts; army representatives demand a central grain directorate. The railway workers insist that either policy must come with realistic rolling-stock allocations. This decision will remain visible in the government's supply system."
 aoeiw_depth.22.a:0 "Negotiate cooperative contracts"
 aoeiw_depth.22.b:0 "Centralise grain allocations"
 AOEIW_DEPTH_SOV_volga_works:0 "Build the Volga Works"
