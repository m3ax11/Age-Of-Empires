 AOEIW_DEPTH_SOV_programmes:0 "The Russian Provincial Programmes"
 AOEIW_DEPTH_SOV_programmes_desc:0 "Projects opened by the national focus tree require funding, time and secure territory."
 AOEIW_DEPTH_SOV_staff_programmes:0 "Cabinet and Staff Programmes"
 AOEIW_DEPTH_SOV_staff_programmes_desc:0 "Focuses unlock funded programmes. Choose when to activate them. Alternatives share a budget and cooldown; their temporary spirits expire automatically. Permanent focus spirits upgrade instead of stacking."
 AOEIW_DEPTH_FRA_municipal_compact:0 "The Municipal Compact"
 AOEIW_DEPTH_FRA_municipal_compact_desc:0 "Mayors organise recovery with local consent, but national directives require negotiation."
 AOEIW_DEPTH_FRA_prefectural_budget:0 "The Prefectural Budget"
 AOEIW_DEPTH_FRA_prefectural_budget_desc:0 "Prefects streamline procurement while alienating some municipal coalitions."
 aoeiw_depth.11.t:0 "The Mayors Petition Paris"
 aoeiw_depth.11.d:0 "Municipal councils agree to help defend France, but object to emergency requisitions written without them. The government can give mayors a binding role in reconstruction or put the recovery budget under the prefects. Both can deliver orders; only one keeps the promises made during the liberal settlement."
 aoeiw_depth.11.a:0 "Give the mayors a binding voice"
 aoeiw_depth.11.b:0 "Let the prefects coordinate recovery"
 AOEIW_DEPTH_FRA_algerian_arsenal:0 "Equip the Western Algerian Arsenal"
 AOEIW_DEPTH_FRA_algerian_arsenal_desc:0 "Build one military factory in Western Algeria and issue 150 support equipment.\n\nCosts 75 political power, occupies one civilian factory and takes 120 days. Requires ownership and control of the project state. Losing either cancels the project, refunds half the political power and allows another attempt after recovery. A finished project cannot be repeated."
 aoeiw_depth.110.t:0 "Equip the Western Algerian Arsenal — Commissioned"
 aoeiw_depth.110.d:0 "The inspection commission has signed the acceptance papers. The workshops have delivered their first orders, the accounts are closed, and the civilian workforce assigned to construction is released. The government now has to turn a completed contract into a reliable part of the national supply system."
 aoeiw_depth.110.a:0 "Enter the works into service."
 AOEIW_DEPTH_FRA_civilian_ministers:0 "Civilian Ministers in the Directorate"
 AOEIW_DEPTH_FRA_civilian_ministers_desc:0 "Civilian ministers legitimise emergency rule but force the staff to negotiate resources."
 AOEIW_DEPTH_FRA_staff_direct_rule:0 "Direct Rule by the Staff"
 AOEIW_DEPTH_FRA_staff_direct_rule_desc:0 "The staff can prepare plans quickly; political cooperation with civilian institutions deteriorates."
 aoeiw_depth.12.t:0 "Who Sits in the Directorate?"
 aoeiw_depth.12.d:0 "Weygand has secured the ministries, but running France requires more than signatures from the general staff. Civilian ministers demand seats with real authority. Retaining them steadies the country; refusing them gives the staff freedom to plan and responsibility for every civilian grievance."
 aoeiw_depth.12.a:0 "Retain civilian ministers"
 aoeiw_depth.12.b:0 "The staff takes full responsibility"
 AOEIW_DEPTH_FRA_communal_supply:0 "Communal Supply Associations"
 AOEIW_DEPTH_FRA_communal_supply_desc:0 "Negotiated supplies reduce unrest but take resources away from military production."
 AOEIW_DEPTH_FRA_emergency_requisition:0 "Emergency Requisition Offices"
 AOEIW_DEPTH_FRA_emergency_requisition_desc:0 "Central requisition supports the army, at a continuing political cost in the communes."
 aoeiw_depth.13.t:0 "Bread for the Commune"
 aoeiw_depth.13.d:0 "The commune inherits workshops and exhausted bread queues together. Local supply associations offer cooperation in exchange for guaranteed civilian allocations. The emergency offices offer faster military deliveries through requisition. The choice will shape relations between the councils and the army."
 aoeiw_depth.13.a:0 "Guarantee civilian allocations"
 aoeiw_depth.13.b:0 "Prioritise military requisition"
 AOEIW_DEPTH_FRA_paris_reconstruction:0 "Rebuild the Paris Supplier Network"
 AOEIW_DEPTH_FRA_paris_reconstruction_desc:0 "Build one civilian factory in Île-de-France and receive 100 support equipment.\n\nCosts 60 political power, occupies one civilian factory and takes 90 days. Requires ownership and control of the project state. Losing either cancels the project, refunds half the political power and allows another attempt after recovery. A finished project cannot be repeated."
 aoeiw_depth.111.t:0 "Rebuild the Paris Supplier Network — Commissioned"
 aoeiw_depth.111.d:0 "The inspection commission has signed the acceptance papers. The workshops have delivered their first orders, the accounts are closed, and the civilian workforce assigned to construction is released. The government now has to turn a completed contract into a reliable part of the national supply system."
 aoeiw_depth.111.a:0 "Enter the works into service."
