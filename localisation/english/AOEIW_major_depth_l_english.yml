l_english:
 AOEIW_DEPTH_GER_federal_credit:0 "Länder Reconstruction Bonds"
 AOEIW_DEPTH_GER_federal_credit_desc:0 "Provincial credit funds investment, but servicing it ties up civilian output."
 AOEIW_DEPTH_GER_treasury_control:0 "Treasury Supervision"
 AOEIW_DEPTH_GER_treasury_control_desc:0 "Central accounting saves political effort at the cost of slower provincial contracts."
 aoeiw_depth.1.t:0 "The Länder Want Guarantees"
 aoeiw_depth.1.d:0 "Bavarian and Saxon ministers refuse to guarantee Berlin's new loans without a say in their use. The Reichstag can guarantee provincial reconstruction bonds, or let the treasury scrutinise every contract. The dispute is about who controls recovery, not another ceremonial oath to the Kaiser."
 aoeiw_depth.1.a:0 "Guarantee provincial bonds"
 aoeiw_depth.1.b:0 "Treasury approval for every contract"
 AOEIW_DEPTH_GER_works_councils:0 "Statutory Works Councils"
 AOEIW_DEPTH_GER_works_councils_desc:0 "Workers negotiate production changes; fewer disruptions come with longer negotiations."
 AOEIW_DEPTH_GER_pension_compact:0 "The Pension Compact"
 AOEIW_DEPTH_GER_pension_compact_desc:0 "Pension guarantees support recruitment, while contributions burden civilian consumption."
 AOEIW_DEPTH_GER_council_autonomy:0 "Autonomous Factory Councils"
 AOEIW_DEPTH_GER_council_autonomy_desc:0 "Local initiative improves recovery of production lines but slows national directives."
 AOEIW_DEPTH_GER_quota_directorate:0 "The Quota Directorate"
 AOEIW_DEPTH_GER_quota_directorate_desc:0 "Central quotas increase output at the expense of consent inside the factories."
 AOEIW_DEPTH_GER_rearmament_credit:0 "Deferred Rearmament Credit"
 AOEIW_DEPTH_GER_rearmament_credit_desc:0 "Rapid military contracts consume civilian resources and leave the treasury committed."
 AOEIW_DEPTH_GER_balanced_orders:0 "Audited Armament Orders"
 AOEIW_DEPTH_GER_balanced_orders_desc:0 "Audited orders improve efficiency but cannot match an unrestricted construction drive."
 aoeiw_depth.2.t:0 "The Rearmament Ledger"
 aoeiw_depth.2.d:0 "The armaments ministry can promise factories faster than the treasury can pay for them. Industrialists offer deferred bills; auditors warn that civilian supply will bear the burden. Choosing strict procurement slows construction, but avoids committing the whole economy to the next order."
 aoeiw_depth.2.a:0 "Finance the accelerated programme"
 aoeiw_depth.2.b:0 "Require audited procurement"
 AOEIW_DEPTH_GER_rhineland_works:0 "Fund the Rhineland Works"
 AOEIW_DEPTH_GER_rhineland_works_desc:0 "Build one civilian factory in the Rhineland and commission 30 freight locomotives.\n\nCosts 60 political power, occupies one civilian factory and takes 90 days. Requires ownership and control of the project state. Losing either cancels the project, refunds half the political power and allows another attempt after recovery. A finished project cannot be repeated."
 aoeiw_depth.100.t:0 "Fund the Rhineland Works — Commissioned"
 aoeiw_depth.100.d:0 "The inspection commission has signed the acceptance papers. The workshops have delivered their first orders, the accounts are closed, and the civilian workforce assigned to construction is released. The government now has to turn a completed contract into a reliable part of the national supply system."
 aoeiw_depth.100.a:0 "Enter the works into service."
 AOEIW_DEPTH_GER_silesian_arsenal:0 "Expand the Silesian Arsenal"
 AOEIW_DEPTH_GER_silesian_arsenal_desc:0 "Build one military factory in Lower Silesia and assemble 400 infantry weapons.\n\nCosts 75 political power, occupies one civilian factory and takes 120 days. Requires ownership and control of the project state. Losing either cancels the project, refunds half the political power and allows another attempt after recovery. A finished project cannot be repeated."
 aoeiw_depth.101.t:0 "Expand the Silesian Arsenal — Commissioned"
 aoeiw_depth.101.d:0 "The inspection commission has signed the acceptance papers. The workshops have delivered their first orders, the accounts are closed, and the civilian workforce assigned to construction is released. The government now has to turn a completed contract into a reliable part of the national supply system."
 aoeiw_depth.101.a:0 "Enter the works into service."
