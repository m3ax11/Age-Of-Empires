l_english:
 AOEIW28_GER_parliament:0 "The Parliamentary Settlement"
 AOEIW28_GER_parliament_desc:0 "The constitution determines the chamber: a republic convenes the Bundestag, while a constitutional Kaiser governs with an elected Reichstag. Elections open coalition negotiations."
 AOEIW28_GER_spd_cabinet:0 "SPD-led Coalition"
 AOEIW28_GER_spd_cabinet_desc:0 "This cabinet programme is active only while its coalition governs."
 AOEIW28_GER_spd:0 "SPD in Government"
 AOEIW28_GER_spd_desc:0 "This programme is visible while the party belongs to the confirmed parliamentary coalition. Two governing parties make two programmes available."
 AOEIW28_GER_spd_policy_1:0 "Collective Bargaining Act"
 AOEIW28_GER_spd_policy_1_desc:0 "Works councils and employers negotiate binding wage agreements. Social peace has a fiscal price."
 AOEIW28_GER_spd_policy_2:0 "Municipal Housing Programme"
 AOEIW28_GER_spd_policy_2_desc:0 "Municipalities receive a construction programme instead of another emergency decree. The investment remains after this government leaves office."
 AOEIW28_GER_spd_settlement:0 "A Parliamentary Social Republic"
 AOEIW28_GER_spd_settlement_desc:0 "Social reform is secured through the elected chamber, whether the head of state is a president or a constitutional Kaiser."
 AOEIW28_GER_spd_mandate:0 "SPD-led Coalition"
 AOEIW28_GER_zentrum_cabinet:0 "Zentrum-led Coalition"
 AOEIW28_GER_zentrum_cabinet_desc:0 "This cabinet programme is active only while its coalition governs."
 AOEIW28_GER_zentrum:0 "Zentrum in Government"
 AOEIW28_GER_zentrum_desc:0 "This programme is visible while the party belongs to the confirmed parliamentary coalition. Two governing parties make two programmes available."
 AOEIW28_GER_zentrum_policy_1:0 "An Agreement with the Länder"
 AOEIW28_GER_zentrum_policy_1_desc:0 "The coalition trades central administrative convenience for the cooperation of regional governments."
 AOEIW28_GER_zentrum_policy_2:0 "The Social Market Compromise"
 AOEIW28_GER_zentrum_policy_2_desc:0 "Credit for small enterprises and negotiated social protection connect rural constituencies with industrial towns."
 AOEIW28_GER_zentrum_settlement:0 "The Constitutional Centre"
 AOEIW28_GER_zentrum_settlement_desc:0 "A stable centre must defend parliament against both executive shortcuts and movements that reject the constitution."
 AOEIW28_GER_zentrum_mandate:0 "Zentrum-led Coalition"
 AOEIW28_GER_liberal_cabinet:0 "Liberal Coalition"
 AOEIW28_GER_liberal_cabinet_desc:0 "This cabinet programme is active only while its coalition governs."
 AOEIW28_GER_liberal:0 "LVP in Government"
 AOEIW28_GER_liberal_desc:0 "The Liberal People's Party programme remains visible only while the LVP belongs to the governing coalition."
 AOEIW28_GER_liberal_policy_1:0 "Independent Courts"
 AOEIW28_GER_liberal_policy_1_desc:0 "A ministerial order must no longer be enough to overturn a judicial decision. Legal certainty constrains the cabinet as well as its enemies."
 AOEIW28_GER_liberal_policy_2:0 "Universities Without Patronage"
 AOEIW28_GER_liberal_policy_2_desc:0 "Research appointments will be judged on qualifications rather than court influence or party loyalty."
 AOEIW28_GER_liberal_settlement:0 "Government by Public Consent"
 AOEIW28_GER_liberal_settlement_desc:0 "The government binds its programme to parliamentary debate and a published budget rather than a permanent emergency."
 AOEIW28_GER_liberal_mandate:0 "Liberal Coalition"
 AOEIW28_GER_conservative_cabinet:0 "Conservative Coalition"
 AOEIW28_GER_conservative_cabinet_desc:0 "This cabinet programme is active only while its coalition governs."
 AOEIW28_GER_conservative:0 "DNVP in Government"
 AOEIW28_GER_conservative_desc:0 "The nationalist programme remains visible only while the DNVP belongs to the governing Reichstag coalition."
 AOEIW28_GER_conservative_policy_1:0 "The Agricultural Credit Pact"
 AOEIW28_GER_conservative_policy_1_desc:0 "Farm credit and rural infrastructure secure conservative constituencies without transferring legislative power to the estates."
 AOEIW28_GER_conservative_policy_2:0 "Parliamentary Defence Estimates"
 AOEIW28_GER_conservative_policy_2_desc:0 "The army receives a reliable procurement budget, but parliament retains the right to examine the accounts."
 AOEIW28_GER_conservative_settlement:0 "Order Under the Constitution"
 AOEIW28_GER_conservative_settlement_desc:0 "Conservative government can protect continuity without abolishing elections. The cabinet serves under the same constitutional rules as its opponents."
 AOEIW28_GER_conservative_mandate:0 "Conservative Coalition"
 AOEIW28_GER_confidence:0 "A Government with Confidence"
 AOEIW28_GER_confidence_desc:0 "A completed coalition programme establishes reliable parliamentary government. The constitutional settlement and imperial administration now rest on a legislative majority rather than an empty promise of elections."
 AOEIW28_elections.1.t:0 "A New Parliamentary Majority"
 AOEIW28_elections.1.d:0 "The ballots have been counted. Give an eligible leading party the mandate, invite up to two smaller compatible partners and swear in a cabinet with at least 51 seats."
 AOEIW28_GER_parliament_category:0 "Parliament and Coalition Formation"
 AOEIW28_GER_parliament_category_desc:0 "Months since the mandate: [?AOEIW28_GER_months|0]/48.\nNominated parties: [?AOEIW29_GER_candidate_count|0]/3.\nCoalition seats: [?AOEIW30_GER_coalition_seats|0]/[?AOEIW30_GER_majority_seats|0] required.\n\n§YFinal election result:§!\n§RSPD§!: [?AOEIW30_GER_spd_seats|0] | §BCDU§!: [?AOEIW30_GER_cdu_seats|0] | §2Zentrum§!: [?AOEIW30_GER_zentrum_seats|0]\n§YLVP§!: [?AOEIW30_GER_lvp_seats|0] | §gDNVP§!: [?AOEIW30_GER_dnvp_seats|0] | §7DStP§!: [?AOEIW30_GER_dstp_seats|0] | §tKPD§!: [?AOEIW30_GER_kpd_seats|0]\n\nFirst give a party the mandate, then invite up to two compatible partners. Only the sworn-in governing parties reveal their programmes in the focus tree."
 AOEIW28_GER_early_election:0 "Dissolve Parliament"
 AOEIW28_GER_early_election_desc:0 "An early election generates a new seat distribution and permits a different coalition at a cost in stability and political power."
 AOEIW28_civic_research:0 "Civil Research Programme"
