l_english:
 AOEIW37_WORLD_imperial_aftermath_category:0 "The Imperial Settlement"
 AOEIW37_WORLD_imperial_aftermath_category_desc:0 "War has turned constitutional theory into an urgent question. Service, sacrifice and reconstruction will determine whether the imperial relationship becomes a partnership or a source of permanent unrest."
 AOEIW37_WORLD_convene_reconstruction_conference:0 "Convene the Reconstruction Conference"
 AOEIW37_WORLD_convene_reconstruction_conference_desc:0 "The emergency commissions have served their purpose. Representatives from the imperial governments must now decide who pays for reconstruction and who has a voice in the peace."
 AOEIW37_WORLD_present_postwar_memorandum:0 "Present the Postwar Memorandum"
 AOEIW37_WORLD_present_postwar_memorandum_desc:0 "Our wartime service has given us both a claim and a constituency. We will submit a practical charter for local authority, reconstruction and mutual defence."
 AOEIW37_WORLD_establish_joint_supply_board:0 "Establish a Joint Supply Board"
 AOEIW37_WORLD_establish_joint_supply_board_desc:0 "Turn the constitutional settlement into something visible: a shared board for rail repair, depots and emergency stocks, funded on both sides of the imperial relationship."

 AOEIW37_WORLD_wartime_imperial_commission:0 "Wartime Imperial Commission"
 AOEIW37_WORLD_wartime_imperial_commission_desc:0 "Mobilising a far-flung imperial system demands bargaining, paperwork and political capital, but it also gives the war effort a broader base."
 AOEIW37_WORLD_expeditionary_commitment:0 "Expeditionary Commitment"
 AOEIW37_WORLD_expeditionary_commitment_desc:0 "Local officers and troops have accepted service beyond the frontier in exchange for a stronger voice after the war."
 AOEIW37_WORLD_home_defence_mandate:0 "Home Defence Mandate"
 AOEIW37_WORLD_home_defence_mandate_desc:0 "The government has kept its forces close to home, building legitimacy through the defence of local cities, roads and institutions."
 AOEIW37_WORLD_metropolitan_collapse:0 "The Metropole Has Fallen"
 AOEIW37_WORLD_metropolitan_collapse_desc:0 "Orders have stopped, credit is uncertain and rival authorities claim to speak for the empire. Local institutions must carry a burden they were never designed to bear."
 AOEIW37_WORLD_emergency_command:0 "Emergency National Command"
 AOEIW37_WORLD_emergency_command_desc:0 "Military and civil authorities have been brought under a single emergency command until contact with the metropolitan government is restored."
 AOEIW37_WORLD_provisional_civil_council:0 "Provisional Civil Council"
 AOEIW37_WORLD_provisional_civil_council_desc:0 "Local assemblies, unions and administrators have formed a council to keep government functioning through the imperial crisis."
 AOEIW37_WORLD_reconstruction_secretariat:0 "Imperial Reconstruction Secretariat"
 AOEIW37_WORLD_reconstruction_secretariat_desc:0 "A permanent secretariat now coordinates budgets, shipping and repairs across the surviving imperial network."
 AOEIW37_WORLD_federal_charter:0 "Federal Charter"
 AOEIW37_WORLD_federal_charter_desc:0 "The new compact recognises local government, defines mutual obligations and gives wartime promises the force of law."
 AOEIW37_WORLD_directed_compact:0 "Directed Postwar Compact"
 AOEIW37_WORLD_directed_compact_desc:0 "Reconstruction funds and military planning remain tied to metropolitan direction. The system is efficient, but its legitimacy is contested."
 AOEIW37_WORLD_reformed_imperial_union:0 "Reformed Imperial Union"
 AOEIW37_WORLD_reformed_imperial_union_desc:0 "The empire now rests on negotiated charters and shared reconstruction rather than unquestioned command from the capital."
 AOEIW37_WORLD_central_administration_burden:0 "Central Administration Burden"
 AOEIW37_WORLD_central_administration_burden_desc:0 "Directing reconstruction from the centre preserves strategic control, but the bureaucracy and political resistance consume resources."
 AOEIW37_WORLD_joint_supply_board:0 "Joint Supply Board"
 AOEIW37_WORLD_joint_supply_board_desc:0 "Shared depots, rail schedules and procurement offices make the postwar compact useful in daily administration."
 AOEIW37_WORLD_relief_mission:0 "Imperial Relief Mission"
 AOEIW37_WORLD_relief_mission_desc:0 "Food, credit and technical missions are stabilising territories shaken by the collapse of a distant imperial centre."
 AOEIW37_WORLD_strategic_watch:0 "Strategic Watch"
 AOEIW37_WORLD_strategic_watch_desc:0 "Diplomats and intelligence services are mapping the risks and opportunities created by an imperial collapse."

 AOEIW37_world.1.t:0 "The Price of Imperial Service"
 AOEIW37_world.1.d:0 "The metropolitan government has entered a major war and expects men, matériel and shipping from us. Ministers agree that participation is unavoidable, but they disagree on whether our forces should serve abroad or defend the institutions that will have to govern if the war reaches home."
 AOEIW37_world.1.a:0 "Serve abroad, and earn a voice in the peace."
 AOEIW37_world.1.b:0 "Our first duty is the defence of our own territory."
 AOEIW37_world.2.t:0 "Orders from the Capital Cease"
 AOEIW37_world.2.d:0 "The metropole has capitulated. Cables bring contradictory orders, merchants refuse old guarantees and officers ask who now holds lawful authority. Waiting for clarity would leave the country defenceless."
 AOEIW37_world.2.a:0 "Unify the administration under emergency command."
 AOEIW37_world.2.b:0 "Let a provisional civil council govern."
 AOEIW37_world.3.t:0 "Delegates to the Reconstruction Conference"
 AOEIW37_world.3.d:0 "The metropolitan government has called its surviving territories to discuss reconstruction. We can treat the conference as an administrative meeting, or arrive with a constitutional memorandum backed by our wartime service."
 AOEIW37_world.3.a:0 "No reconstruction without a new charter."
 AOEIW37_world.3.b:0 "Recover first within the existing order."
 AOEIW37_world.10.t:0 "[FROM.GetNameDefCap] Presents a Postwar Charter"
 AOEIW37_world.10.d:0 "The delegation from [FROM.GetNameDef] has tied its wartime record to a precise demand: recognised local government, authority over domestic budgets and a permanent place in imperial defence planning. Accepting would change the empire. Refusing would reveal how much the old order now depends on consent."
 AOEIW37_world.10.a:0 "Ratify the charter and rebuild the union."
 AOEIW37_world.10.b:0 "Reconstruction requires a single directing hand."
 AOEIW37_world.11.t:0 "The Charter Is Ratified"
 AOEIW37_world.11.d:0 "The metropolitan government has accepted our memorandum. The settlement is more than ceremony: local ministers now control reconstruction priorities and sit in the councils that determine common defence."
 AOEIW37_world.11.a:0 "Make the partnership work."
 AOEIW37_world.12.t:0 "The Memorandum Is Refused"
 AOEIW37_world.12.d:0 "The metropolitan cabinet has answered wartime sacrifice with a programme of central direction. It has conceded enough practical authority to keep the machinery running, but the constitutional argument is merely postponed."
 AOEIW37_world.12.a:0 "We will remember what was promised."
 AOEIW37_world.13.t:0 "[FROM.GetNameDefCap] Accepts Directed Reconstruction"
 AOEIW37_world.13.d:0 "The delegation from [FROM.GetNameDef] has accepted recovery within the existing constitutional order. Cooperation is secure for now, though the balance of obligations will be tested by every budget and deployment."
 AOEIW37_world.13.a:0 "Put the machinery of recovery to work."
 AOEIW37_world.20.t:0 "An Imperial Centre Falls"
 AOEIW37_world.20.d:0 "The capitulation of a great imperial centre has sent uncertainty through ports, ministries and subject governments far beyond the battlefield. Our response will shape whether the vacuum is filled by relief and negotiation or by strategic rivalry."
 AOEIW37_world.20.a:0 "Support relief and an orderly transition."
 AOEIW37_world.20.b:0 "Guard our interests while the map is unsettled."

