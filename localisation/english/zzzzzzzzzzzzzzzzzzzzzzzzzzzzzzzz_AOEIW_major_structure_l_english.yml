l_english:
 AOEIW_STRUCT_GER_federal_laboratories:0 "Federal Research Endowments"
 AOEIW_STRUCT_GER_federal_laboratories_desc:0 "The federal settlement funds university laboratories. Grants one 50% industrial research bonus."
 AOEIW_STRUCT_GER_federal_workshops:0 "Provincial Machine Workshops"
 AOEIW_STRUCT_GER_federal_workshops_desc:0 "Build one civilian factory in an owned and controlled core state. This is an optional federal investment."
 AOEIW_STRUCT_GER_continental_rail_contracts:0 "Continental Supply Contracts"
 AOEIW_STRUCT_GER_continental_rail_contracts_desc:0 "The continental strategy requires a domestic transport reserve. Adds 100 trains, without annexing allies."
 AOEIW_STRUCT_GER_continental_readiness:0 "The General Staff's Red Folders"
 AOEIW_STRUCT_GER_continental_readiness_desc:0 "Rail reserves, mobilisation districts and frontier plans are brought into the same room. The red folders must describe a war Germany can supply, not merely one its generals can draw."
 AOEIW_STRUCT_GER_oceanic_escorts:0 "Escorts for the Imperial Lifelines"
 AOEIW_STRUCT_GER_oceanic_escorts_desc:0 "Fund an escort reserve for overseas trade. Adds 40 convoys."
 AOEIW_STRUCT_GER_overseas_stations:0 "Coordinate the Overseas Stations"
 AOEIW_STRUCT_GER_overseas_stations_desc:0 "Prepare the navy for sustained deployments. Grants 25 naval experience and a 50% naval-equipment research bonus."
 AOEIW_STRUCT_GER_civilian_procurement:0 "Factories Before Fortresses"
 AOEIW_STRUCT_GER_civilian_procurement_desc:0 "Municipal contracts and civilian machine works receive the next appropriation. The opposition may call it timidity; the cabinet calls it an economy worth defending."
 AOEIW_STRUCT_GER_emergency_procurement:0 "Emergency Armaments Procurement"
 AOEIW_STRUCT_GER_emergency_procurement_desc:0 "Fund one military factory. This excludes the civilian procurement programme."
 AOEIW_STRUCT_GER_DEPTH_lands_treasury:0 "Bavaria Presents the Bill"
 AOEIW_STRUCT_GER_DEPTH_lands_treasury_desc:0 "Munich refuses another Berlin programme financed through the state treasuries. Saxony and Württemberg join the demand for a fixed share of revenue and investment."
 AOEIW_STRUCT_GER_DEPTH_provincial_credit:0 "Provincial Credit Offices"
 AOEIW_STRUCT_GER_DEPTH_provincial_credit_desc:0 "A permanent registry turns the financial settlement into enforceable contracts. The cabinet must first settle the bond dispute.\n\nAdvance Federal Investment Office to stage 2/3. Total: +5% civilian factory construction; +0.03 daily political power. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_crown_audit:0 "Publish the Crown Accounts"
 AOEIW_STRUCT_GER_DEPTH_crown_audit_desc:0 "Separate court expenditure from railway and school appropriations; the Reichstag receives an auditable budget.\n\nAdvance Federal Investment Office to stage 3/3. Total: +7% civilian factory construction; +0.06 daily political power. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_social_bargain:0 "The Berlin Social Bargain"
 AOEIW_STRUCT_GER_DEPTH_social_bargain_desc:0 "Industrial peace requires a choice between statutory representation and a contribution-funded safety net."
 AOEIW_STRUCT_GER_DEPTH_works_councils:0 "Legislate Works Councils"
 AOEIW_STRUCT_GER_DEPTH_works_councils_desc:0 "Give elected shop-floor committees a permanent voice. This excludes the pension-first compromise."
 AOEIW_STRUCT_GER_DEPTH_pension_funds:0 "Underwrite the Pension Funds"
 AOEIW_STRUCT_GER_DEPTH_pension_funds_desc:0 "Protect veterans and industrial families through funded guarantees instead of statutory works councils."
 AOEIW_STRUCT_GER_DEPTH_industrial_peace:0 "Renew Stinnes–Legien"
 AOEIW_STRUCT_GER_DEPTH_industrial_peace_desc:0 "Employers recognise the unions and the unions keep the furnaces running. The eight-hour day and collective bargaining become the price of predictable armaments contracts."
 AOEIW_STRUCT_GER_DEPTH_colonial_census:0 "Who Will Staff Mittelafrika?"
 AOEIW_STRUCT_GER_DEPTH_colonial_census_desc:0 "Flags do not repair a locomotive or unload a tropical port. The colonial service will recruit interpreters, mechanics, doctors and dockworkers for the administrations overseas."
 AOEIW_STRUCT_GER_DEPTH_colonial_schools:0 "Schools for Overseas Engineers"
 AOEIW_STRUCT_GER_DEPTH_colonial_schools_desc:0 "Train engineers to keep coastal facilities operating far from German workshops.\n\nAdvance Overseas Service Stations to stage 1/3. Total: +3% ship repair speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_marine_post:0 "The Imperial Maritime Post"
 AOEIW_STRUCT_GER_DEPTH_marine_post_desc:0 "Regular mail and cargo sailings replace improvised colonial transport. Receive 25 convoys.\n\nAdvance Overseas Service Stations to stage 2/3. Total: +5% ship repair speed; -3% navy fuel consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_colonial_rescue:0 "Overseas Repair Stations"
 AOEIW_STRUCT_GER_DEPTH_colonial_rescue_desc:0 "Distribute technical crews and spares along the sea routes without annexing another country.\n\nAdvance Overseas Service Stations to stage 3/3. Total: +8% ship repair speed; -5% navy fuel consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_constitutional_court:0 "A Federal Constitutional Court"
 AOEIW_STRUCT_GER_DEPTH_constitutional_court_desc:0 "Adenauer needs a legal arbiter between the Länder and the national cabinet, not another emergency decree.\n\nAdvance Civil Government Continuity to stage 1/3. Total: +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_press_statute:0 "The Press Responsibility Statute"
 AOEIW_STRUCT_GER_DEPTH_press_statute_desc:0 "Independent newspapers gain legal protection; the cabinet gives up some discretion over political debate.\n\nAdvance Civil Government Continuity to stage 2/3. Total: +3% stability; +0.04 daily political power. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_budget_committee:0 "Parliamentary Procurement Hearings"
 AOEIW_STRUCT_GER_DEPTH_budget_committee_desc:0 "Officers must explain tenders to the budget committee. Standard contracts reduce the cost of technical experimentation."
 AOEIW_STRUCT_GER_DEPTH_regional_housing:0 "Homes Beside the Krupp Works"
 AOEIW_STRUCT_GER_DEPTH_regional_housing_desc:0 "Skilled families are leaving overcrowded industrial wards. New Siedlungen near the Ruhr works will keep fitters and machinists close to their shifts."
 AOEIW_STRUCT_GER_DEPTH_civic_reserves:0 "Civil Defence Associations"
 AOEIW_STRUCT_GER_DEPTH_civic_reserves_desc:0 "Municipalities train rescue and supply volunteers under civilian authority."
 AOEIW_STRUCT_GER_DEPTH_legal_continuity:0 "Continuity of Civil Government"
 AOEIW_STRUCT_GER_DEPTH_legal_continuity_desc:0 "Prepare lawful succession and regional emergency offices before a national crisis.\n\nAdvance Civil Government Continuity to stage 3/3. Total: +4% stability; +0.08 daily political power; +3% surrender limit. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_rent_commission:0 "Freeze Ruhr Rents!"
 AOEIW_STRUCT_GER_DEPTH_rent_commission_desc:0 "Arrears are piling up behind the factory gates while landlords profit from the labour influx. The workers' parties demand an immediate rent freeze in the industrial cities."
 AOEIW_STRUCT_GER_DEPTH_shopfloor_delegates:0 "Elect Shop-Floor Delegates"
 AOEIW_STRUCT_GER_DEPTH_shopfloor_delegates_desc:0 "Elected delegates collect workshop grievances before they become competing revolutionary programmes.\n\nAdvance Workshop Representation to stage 2/3. Total: +5% production efficiency growth; +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_technical_cadres:0 "Apprentices for Borsig and Krupp"
 AOEIW_STRUCT_GER_DEPTH_technical_cadres_desc:0 "The strikes produced organisers, not enough toolmakers. Technical schools will pair apprentices with the locomotive, steel and armaments works that need them."
 AOEIW_STRUCT_GER_DEPTH_council_autonomy:0 "Every Factory Its Own Council"
 AOEIW_STRUCT_GER_DEPTH_council_autonomy_desc:0 "Workshop delegates will set shifts and production changes where the work is done. Berlin may request output, but it will not appoint another industrial bureaucracy."
 AOEIW_STRUCT_GER_DEPTH_quota_directorate:0 "Berlin Sets the Quotas"
 AOEIW_STRUCT_GER_DEPTH_quota_directorate_desc:0 "Local experiments end at the factory gate. The national plan assigns steel, labour and delivery targets from Berlin, and every council must answer for the result."
 AOEIW_STRUCT_GER_DEPTH_workers_accounts:0 "Open the Production Accounts"
 AOEIW_STRUCT_GER_DEPTH_workers_accounts_desc:0 "Make the selected industrial system legible to the revolutionary congress.\n\nAdvance Workshop Representation to stage 3/3. Total: +8% production efficiency growth; +3% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_rearmament_ledger:0 "Who Pays for Rearmament?"
 AOEIW_STRUCT_GER_DEPTH_rearmament_ledger_desc:0 "The generals have submitted their orders; the treasury has submitted its warning. The cabinet must now put taxes, credit and military contracts on the same page."
 AOEIW_STRUCT_GER_DEPTH_machine_contracts:0 "Machine-Tool Contracts"
 AOEIW_STRUCT_GER_DEPTH_machine_contracts_desc:0 "Common machine tools matter more than competing prestige orders.\n\nAdvance Rearmament Contract Office to stage 2/3. Total: +4% military factory output; +3% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_freight_priority:0 "Clear the Lines for Mobilisation"
 AOEIW_STRUCT_GER_DEPTH_freight_priority_desc:0 "Passenger services will yield to ammunition trains, repair stock and army depots. The Reichsbahn receives the rolling stock to keep those routes open."
 AOEIW_STRUCT_GER_DEPTH_exchange_board:0 "Reichsmarks for Oil"
 AOEIW_STRUCT_GER_DEPTH_exchange_board_desc:0 "Imported oil and ore drain the currency reserves. Purchasing abroad will be rationed while chemists and industry pursue substitutes at home."
 AOEIW_STRUCT_GER_DEPTH_synthetic_trials:0 "Synthetic Fuel Trials"
 AOEIW_STRUCT_GER_DEPTH_synthetic_trials_desc:0 "Pilot fuel processes provide a reserve for exercises, not an unlimited solution to oil dependence."
 AOEIW_STRUCT_GER_DEPTH_staff_signals:0 "One Frequency for Every Corps"
 AOEIW_STRUCT_GER_DEPTH_staff_signals_desc:0 "An army cannot manoeuvre when neighbouring formations cannot speak to one another. Joint exercises will expose incompatible sets and issue a common signals plan."
 AOEIW_STRUCT_GER_DEPTH_fuel_reserve:0 "Sixty Days of Fuel"
 AOEIW_STRUCT_GER_DEPTH_fuel_reserve_desc:0 "Mobilisation plans will be measured against filled tanks rather than optimistic forecasts. Dispersed depots must hold enough fuel for the opening weeks of war."
 AOEIW_STRUCT_GER_DEPTH_maintenance_columns:0 "Motorised Maintenance Columns"
 AOEIW_STRUCT_GER_DEPTH_maintenance_columns_desc:0 "Equip mobile workshops before demanding longer operations. Receive 120 trucks and 100 support equipment.\n\nAdvance Mobile Army Services to stage 3/3. Total: +15% planning speed; -6% army fuel consumption; -5% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Prepare a Mobile Campaign; activate it from Decisions when needed."
 AOEIW_STRUCT_GER_DEPTH_ruhr_water:0 "Water for Coal and Steel"
 AOEIW_STRUCT_GER_DEPTH_ruhr_water_desc:0 "Coal washers, coke plants and furnaces compete for the same strained network. Ruhr municipalities will finance the pipes and pumping stations that production requires."
 AOEIW_STRUCT_GER_DEPTH_ruhr_contract:0 "The Rhineland Works Contract"
 AOEIW_STRUCT_GER_DEPTH_ruhr_contract_desc:0 "Unlock a paid 90-day Rhineland industrial project in the decisions tab."
 AOEIW_STRUCT_GER_DEPTH_apprentice_exchanges:0 "The Engineering Apprenticeship Exchange"
 AOEIW_STRUCT_GER_DEPTH_apprentice_exchanges_desc:0 "Exchange apprentices between regional workshops and research institutes.\n\nAdvance Precision Industry Standards to stage 1/3. Total: +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_metrology:0 "A Common Metrology Standard"
 AOEIW_STRUCT_GER_DEPTH_metrology_desc:0 "A shell or engine component must fit even when its supplier changes.\n\nAdvance Precision Industry Standards to stage 2/3. Total: +5% production efficiency growth; +3% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_diesel_lab:0 "The Dresden Diesel Laboratory"
 AOEIW_STRUCT_GER_DEPTH_diesel_lab_desc:0 "Bench tests turn procurement drawings into engines that survive sustained use.\n\nAdvance Precision Industry Standards to stage 3/3. Total: +7% production efficiency growth; +5% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_steel_reserve:0 "The Silesian Steel Reserve"
 AOEIW_STRUCT_GER_DEPTH_steel_reserve_desc:0 "Unlock a 120-day Silesian arsenal project, dependent on keeping the industrial district secure."
 AOEIW_STRUCT_GER_DEPTH_arsenal_inspection:0 "The Arsenal Inspection Service"
 AOEIW_STRUCT_GER_DEPTH_arsenal_inspection_desc:0 "Independent inspectors compare serial weapons with the prototypes accepted by the army.\n\nUnlocks the funded programme Arsenal Priority Shifts; activate it from Decisions when needed."
 AOEIW_STRUCT_GER_DEPTH_ruhr_deliveries:0 "The First Rhineland Deliveries"
 AOEIW_STRUCT_GER_DEPTH_ruhr_deliveries_desc:0 "The finished works enter regular service. Requires completion of the Rhineland project, not merely its focus.\n\nUnlocks the funded programme Regional Construction Orders; activate it from Decisions when needed."
 AOEIW_STRUCT_GER_DEPTH_field_repair:0 "Divisional Repair Parks"
 AOEIW_STRUCT_GER_DEPTH_field_repair_desc:0 "Pool repair tools and recovery crews behind the divisions. Receive 150 support equipment.\n\nAdvance Field Replacement Service to stage 1/2. Total: +4% army organisation recovery. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_GER_DEPTH_replacement_school:0 "The Replacement Officer School"
 AOEIW_STRUCT_GER_DEPTH_replacement_school_desc:0 "Training replacement officers keeps a prolonged war from hollowing out the command structure.\n\nAdvance Field Replacement Service to stage 2/2. Total: +7% army organisation recovery; -5% experience loss. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Rotate and Refit the Front; activate it from Decisions when needed."
 AOEIW_STRUCT_GER_DEPTH_convoy_school:0 "The Convoy Escort School"
 AOEIW_STRUCT_GER_DEPTH_convoy_school_desc:0 "Teach merchant captains and escort commanders a common convoy procedure.\n\nAdvance Merchant Escort Service to stage 1/2. Total: +4% naval coordination. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Merchant Escort Rotation; activate it from Decisions when needed."
 AOEIW_STRUCT_GER_DEPTH_naval_fuel:0 "The Wilhelmshaven Fuel Service"
 AOEIW_STRUCT_GER_DEPTH_naval_fuel_desc:0 "Build a modest operational fuel reserve for the fleet instead of announcing another battle squadron.\n\nAdvance Merchant Escort Service to stage 2/2. Total: +7% naval coordination; -4% navy fuel consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Fleet Dockyard Refit; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_crown_arsenals:0 "The Crown Arsenal Contracts"
 AOEIW_STRUCT_SOV_crown_arsenals_desc:0 "The reformed autocracy places long-term orders. Builds one military factory in a controlled core state."
 AOEIW_STRUCT_SOV_imperial_reserve:0 "An Imperial Transport Reserve"
 AOEIW_STRUCT_SOV_imperial_reserve_desc:0 "Mobilisation must survive the distances of the empire. Adds 120 trains."
 AOEIW_STRUCT_SOV_zemstvo_credit:0 "Zemstvo Reconstruction Credit"
 AOEIW_STRUCT_SOV_zemstvo_credit_desc:0 "Local credit finances one civilian factory. Choose this or central industrial appropriations."
 AOEIW_STRUCT_SOV_duma_appropriations:0 "Industrial Appropriations of the Duma"
 AOEIW_STRUCT_SOV_duma_appropriations_desc:0 "Parliament funds one military factory. This excludes locally directed reconstruction credit."
 AOEIW_STRUCT_SOV_provincial_universities:0 "Universities of the Provinces"
 AOEIW_STRUCT_SOV_provincial_universities_desc:0 "Extend technical education beyond the capital. Grants one 50% industrial research bonus."
 AOEIW_STRUCT_SOV_federal_compact:0 "Ratify the Provincial Compact"
 AOEIW_STRUCT_SOV_federal_compact_desc:0 "The charter joins local investment to national defence. Grants 3% stability and 20 command power."
 AOEIW_STRUCT_SOV_stavka_records:0 "The Mobilisation Registers"
 AOEIW_STRUCT_SOV_stavka_records_desc:0 "Reconcile provincial and army records. Grants 20 army experience and a 50% support-equipment research bonus."
 AOEIW_STRUCT_SOV_stavka_mobilisation:0 "Stavka Mobilisation Exercises"
 AOEIW_STRUCT_SOV_stavka_mobilisation_desc:0 "Test the mobilisation system before war. Grants 20 command power and 3% war support."
 AOEIW_STRUCT_SOV_DEPTH_governors_harvest:0 "Summon the Provincial Governors"
 AOEIW_STRUCT_SOV_DEPTH_governors_harvest_desc:0 "The crown needs reliable harvest and recruitment figures before it can promise national renewal."
 AOEIW_STRUCT_SOV_DEPTH_land_register:0 "The Imperial Land Register"
 AOEIW_STRUCT_SOV_DEPTH_land_register_desc:0 "Give the chosen rural settlement an administrative foundation. Requires a decision in the harvest dispute.\n\nAdvance Provincial Agricultural Contracts to stage 1/3. Total: +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_rural_contracts:0 "Contracts with the Rural Cooperatives"
 AOEIW_STRUCT_SOV_DEPTH_rural_contracts_desc:0 "Agree delivery schedules instead of calling every overdue wagon a political conspiracy.\n\nAdvance Provincial Agricultural Contracts to stage 2/3. Total: +3% stability; +3% recruitable population factor. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_provincial_inspectors:0 "Inspect the Provincial Offices"
 AOEIW_STRUCT_SOV_DEPTH_provincial_inspectors_desc:0 "Independent inspectors compare provincial reports with actual depot inventories."
 AOEIW_STRUCT_SOV_DEPTH_recruitment_levies:0 "Revise the Recruitment Levies"
 AOEIW_STRUCT_SOV_DEPTH_recruitment_levies_desc:0 "The same villages cannot carry every levy. Broaden the register before calling up another class."
 AOEIW_STRUCT_SOV_DEPTH_cadastre_school:0 "The Provincial Cadastre Schools"
 AOEIW_STRUCT_SOV_DEPTH_cadastre_school_desc:0 "Train surveyors and clerks who can challenge inaccurate reports without paralysing the governor's office."
 AOEIW_STRUCT_SOV_DEPTH_rural_depots:0 "Rural Mobilisation Depots"
 AOEIW_STRUCT_SOV_DEPTH_rural_depots_desc:0 "Store modest equipment reserves close to the recruiting districts. Receive 500 infantry weapons.\n\nAdvance Provincial Agricultural Contracts to stage 3/3. Total: +4% stability; +5% recruitable population factor; -3% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_zemstvo_petitions:0 "The Zemstvo Petitions"
 AOEIW_STRUCT_SOV_DEPTH_zemstvo_petitions_desc:0 "Provincial representatives demand schools, roads and limits on arbitrary administration.\n\nAdvance Zemstvo Public Services to stage 1/3. Total: +0.03 daily political power. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_provincial_juries:0 "Restore the Provincial Juries"
 AOEIW_STRUCT_SOV_DEPTH_provincial_juries_desc:0 "Local justice gives the proposed charter institutions that citizens can actually use.\n\nAdvance Zemstvo Public Services to stage 2/3. Total: +0.06 daily political power; +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_village_census:0 "The Village Household Census"
 AOEIW_STRUCT_SOV_DEPTH_village_census_desc:0 "Count households and medical needs before distributing reconstruction appropriations.\n\nAdvance Zemstvo Public Services to stage 3/3. Total: +0.09 daily political power; +3% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_rail_petitions:0 "Hear the Railway Petitions"
 AOEIW_STRUCT_SOV_DEPTH_rail_petitions_desc:0 "Provincial delegates identify the broken connections that isolate villages from markets."
 AOEIW_STRUCT_SOV_DEPTH_local_credit:0 "The Provincial Credit Unions"
 AOEIW_STRUCT_SOV_DEPTH_local_credit_desc:0 "Pool local deposits for reconstruction equipment rather than court patronage."
 AOEIW_STRUCT_SOV_DEPTH_teacher_exchange:0 "The Provincial Teacher Exchange"
 AOEIW_STRUCT_SOV_DEPTH_teacher_exchange_desc:0 "Technical teachers and practical manuals travel with the expanding railway service.\n\nAdvance District Roads and Schools to stage 1/3. Total: +4% infrastructure construction. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_regional_contracts:0 "Public Regional Contracts"
 AOEIW_STRUCT_SOV_DEPTH_regional_contracts_desc:0 "Publish the recipients of public orders so that the Duma can examine the cost of reform."
 AOEIW_STRUCT_SOV_DEPTH_postal_roads:0 "The Provincial Postal Roads"
 AOEIW_STRUCT_SOV_DEPTH_postal_roads_desc:0 "Motor mail links carry technical staff and emergency medical supplies beyond the railheads.\n\nAdvance District Roads and Schools to stage 2/3. Total: +7% infrastructure construction; +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_district_medicine:0 "The District Medical Service"
 AOEIW_STRUCT_SOV_DEPTH_district_medicine_desc:0 "Make medical training a permanent provincial function instead of a mobilisation improvisation.\n\nAdvance District Roads and Schools to stage 3/3. Total: +10% infrastructure construction; +5% production efficiency growth; +3% recruitable population factor. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Run District Reserve Muster; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_crown_orders:0 "Audit the Crown Arsenal Orders"
 AOEIW_STRUCT_SOV_DEPTH_crown_orders_desc:0 "Inspect the armaments contracts issued by the restored autocracy.\n\nAdvance Imperial Quartermaster Service to stage 1/3. Total: +2% army organisation. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_imperial_quartermasters:0 "The Imperial Quartermasters"
 AOEIW_STRUCT_SOV_DEPTH_imperial_quartermasters_desc:0 "A mobile quartermaster service connects provincial arsenals to the active army.\n\nAdvance Imperial Quartermaster Service to stage 2/3. Total: +3% army organisation; -3% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_royal_inventories:0 "One Imperial Inventory"
 AOEIW_STRUCT_SOV_DEPTH_royal_inventories_desc:0 "Join the transport reserve and inspected arsenals in a single mobilisation inventory.\n\nAdvance Imperial Quartermaster Service to stage 3/3. Total: +5% army organisation; -5% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_staff_maps:0 "The Stavka Map Service"
 AOEIW_STRUCT_SOV_DEPTH_staff_maps_desc:0 "Issue corrected rail and road maps to the staffs that must move the army across them."
 AOEIW_STRUCT_SOV_DEPTH_winter_workshops:0 "The Winter Workshop Instructions"
 AOEIW_STRUCT_SOV_DEPTH_winter_workshops_desc:0 "Document cold-weather maintenance before vehicles reach the first frozen railhead.\n\nAdvance Winter Workshop Service to stage 1/3. Total: -10% winter attrition. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_winter_stock:0 "The Winter Equipment Reserve"
 AOEIW_STRUCT_SOV_DEPTH_winter_stock_desc:0 "Build a limited replacement stock for units covering the long frontier.\n\nAdvance Winter Workshop Service to stage 2/3. Total: -15% winter attrition; +3% army organisation recovery. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_recovery_columns:0 "The Army Recovery Columns"
 AOEIW_STRUCT_SOV_DEPTH_recovery_columns_desc:0 "Recovery crews keep damaged vehicles from becoming permanent losses. Receive 100 trucks.\n\nAdvance Winter Workshop Service to stage 3/3. Total: -20% winter attrition; +5% army organisation recovery; -4% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Distribute Winter Reserves; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_provincial_exercise:0 "The All-Provincial Mobilisation Exercise"
 AOEIW_STRUCT_SOV_DEPTH_provincial_exercise_desc:0 "Test the reconstructed imperial system across provincial boundaries before war tests it for real."
 AOEIW_STRUCT_SOV_DEPTH_grain_conference:0 "The Grain and Railway Conference"
 AOEIW_STRUCT_SOV_DEPTH_grain_conference_desc:0 "Settle how the revolution will feed the cities and army before it promises another mobilisation."
 AOEIW_STRUCT_SOV_DEPTH_grain_dispatch:0 "The Grain Dispatch Offices"
 AOEIW_STRUCT_SOV_DEPTH_grain_dispatch_desc:0 "Implement the congress's supply settlement through real timetables and depots.\n\nUnlocks the funded programme Give Grain Trains Priority; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_cadre_literacy:0 "The Technical Literacy Campaign"
 AOEIW_STRUCT_SOV_DEPTH_cadre_literacy_desc:0 "Train workers to read drawings, maintenance cards and production ledgers.\n\nAdvance Multilingual Technical Education to stage 1/3. Total: +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_translation_bureau:0 "The Union Translation Bureau"
 AOEIW_STRUCT_SOV_DEPTH_translation_bureau_desc:0 "The union needs technical manuals that reach the factories beyond the largest Russian cities.\n\nAdvance Multilingual Technical Education to stage 2/3. Total: +5% production efficiency growth; +1% research speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_worker_inspection:0 "Worker Inspectors at the Depots"
 AOEIW_STRUCT_SOV_DEPTH_worker_inspection_desc:0 "Check dispatch records against arriving wagons rather than rewarding optimistic statistics."
 AOEIW_STRUCT_SOV_DEPTH_republic_schools:0 "The Schools of the Republics"
 AOEIW_STRUCT_SOV_DEPTH_republic_schools_desc:0 "Build a shared technical curriculum while preserving local-language instruction.\n\nAdvance Multilingual Technical Education to stage 3/3. Total: +7% production efficiency growth; +2% research speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_statistical_inspection:0 "Inspect the Plan Statistics"
 AOEIW_STRUCT_SOV_DEPTH_statistical_inspection_desc:0 "The centralised party must distinguish delivered machinery from figures written to meet a quota.\n\nAdvance Industrial Plan Reserves to stage 1/3. Total: +2% military factory output. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_reserve_machine_tools:0 "The Reserve Machine-Tool Park"
 AOEIW_STRUCT_SOV_DEPTH_reserve_machine_tools_desc:0 "Hold repair equipment outside the production targets so breakdowns do not halt an entire combine.\n\nAdvance Industrial Plan Reserves to stage 2/3. Total: +4% military factory output; +3% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_plan_contingencies:0 "The Plan Contingency Bureau"
 AOEIW_STRUCT_SOV_DEPTH_plan_contingencies_desc:0 "A central reserve cushions disruptions; national defence must be able to survive a missed quota.\n\nAdvance Industrial Plan Reserves to stage 3/3. Total: +6% military factory output; +5% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_international_manuals:0 "The International Military Editions"
 AOEIW_STRUCT_SOV_DEPTH_international_manuals_desc:0 "Publish doctrine and maintenance manuals for the international formations rather than assuming one language fits all.\n\nAdvance International Liaison Staff to stage 1/3. Total: +3% army organisation recovery. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_delegate_missions:0 "The Industrial Delegate Missions"
 AOEIW_STRUCT_SOV_DEPTH_delegate_missions_desc:0 "Engineers exchange workshop experience through the international movement. The benefit is technical, not a free foreign annexation.\n\nAdvance International Liaison Staff to stage 2/3. Total: +5% army organisation recovery; +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_international_signals:0 "The International Signals School"
 AOEIW_STRUCT_SOV_DEPTH_international_signals_desc:0 "Common radio procedures give multinational formations a practical command language.\n\nAdvance International Liaison Staff to stage 3/3. Total: +7% army organisation recovery; +5% production efficiency growth; +10% planning speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_operational_college:0 "The Operational Warfare College"
 AOEIW_STRUCT_SOV_DEPTH_operational_college_desc:0 "Test the army-first programme against actual transport and reserve limitations.\n\nAdvance Operational Echelon Service to stage 1/3. Total: +5% planning speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_motorised_staff:0 "The Motorised Staff Columns"
 AOEIW_STRUCT_SOV_DEPTH_motorised_staff_desc:0 "A moving army needs headquarters that can follow it. Receive 160 trucks.\n\nAdvance Operational Echelon Service to stage 2/3. Total: +10% planning speed; +3% army speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_second_echelon:0 "The Second-Echelon Supply Plan"
 AOEIW_STRUCT_SOV_DEPTH_second_echelon_desc:0 "Prepare a second supply echelon rather than consuming all transport in the opening attack.\n\nAdvance Operational Echelon Service to stage 3/3. Total: +15% planning speed; +5% army speed; -5% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Commit the Second Echelon; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_volga_survey:0 "The Volga Industrial Survey"
 AOEIW_STRUCT_SOV_DEPTH_volga_survey_desc:0 "Survey river transport and workshop capacity for an industrial investment away from the western frontier."
 AOEIW_STRUCT_SOV_DEPTH_volga_contract:0 "The Volga Works Contract"
 AOEIW_STRUCT_SOV_DEPTH_volga_contract_desc:0 "Unlock a paid 120-day civilian industrial project in the lower Volga district."
 AOEIW_STRUCT_SOV_DEPTH_technical_correspondence:0 "The Technical Correspondence Colleges"
 AOEIW_STRUCT_SOV_DEPTH_technical_correspondence_desc:0 "The empire's distances require technical education beyond the university cities.\n\nAdvance Unified Spare-Parts Service to stage 1/3. Total: +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_diesel_workshops:0 "The Railway Diesel Workshops"
 AOEIW_STRUCT_SOV_DEPTH_diesel_workshops_desc:0 "Train mechanics for the mixed fleet of railway and road engines.\n\nAdvance Unified Spare-Parts Service to stage 2/3. Total: +5% production efficiency growth; +3% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_spare_catalogue:0 "The National Spare-Parts Catalogue"
 AOEIW_STRUCT_SOV_DEPTH_spare_catalogue_desc:0 "A common catalogue prevents every depot from ordering its own incompatible replacement parts.\n\nAdvance Unified Spare-Parts Service to stage 3/3. Total: +7% production efficiency growth; +5% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_volga_acceptance:0 "Commission the Volga Deliveries"
 AOEIW_STRUCT_SOV_DEPTH_volga_acceptance_desc:0 "Accept the completed works into the national supply network. Requires the actual project to finish.\n\nUnlocks the funded programme The Volga Construction Season; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_capital_arsenal:0 "The Moscow Arsenal Extension"
 AOEIW_STRUCT_SOV_DEPTH_capital_arsenal_desc:0 "Unlock a 90-day arsenal construction project around the capital, with a real budget and territorial risk."
 AOEIW_STRUCT_SOV_DEPTH_arsenal_gauges:0 "The Arsenal Gauge Standard"
 AOEIW_STRUCT_SOV_DEPTH_arsenal_gauges_desc:0 "Make weapons produced in different districts share a common tolerance standard.\n\nUnlocks the funded programme The Arsenal Standardisation Drive; activate it from Decisions when needed."
 AOEIW_STRUCT_SOV_DEPTH_fleet_workshops:0 "The Fleet Workshop Service"
 AOEIW_STRUCT_SOV_DEPTH_fleet_workshops_desc:0 "Support a dispersed fleet with technicians and portable repair equipment.\n\nAdvance Northern Fleet Service to stage 1/2. Total: +5% ship repair speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_SOV_DEPTH_ice_navigation:0 "The Northern Navigation School"
 AOEIW_STRUCT_SOV_DEPTH_ice_navigation_desc:0 "Teach navigation and convoy procedures suited to the northern approaches.\n\nAdvance Northern Fleet Service to stage 2/2. Total: +10% ship repair speed; -5% navy fuel consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_military_prefects:0 "Military Prefects"
 AOEIW_STRUCT_FRA_military_prefects_desc:0 "The marshalate replaces civilian emergency administration. Grants 35 political power and 2% stability."
 AOEIW_STRUCT_FRA_metropolitan_arsenals:0 "Bourges Arms the Metropole"
 AOEIW_STRUCT_FRA_metropolitan_arsenals_desc:0 "The Bourges arsenal will expand gun and ammunition work beyond the exposed northeastern frontier. Metropolitan rearmament gains capacity where it can survive the opening battle."
 AOEIW_STRUCT_FRA_methodical_reserve:0 "The Methodical Reserve"
 AOEIW_STRUCT_FRA_methodical_reserve_desc:0 "Prioritise artillery and prepared defence. Grants a 50% artillery research bonus. Excludes the mobile reserve."
 AOEIW_STRUCT_FRA_mobile_reserve:0 "A Mobile Strategic Reserve"
 AOEIW_STRUCT_FRA_mobile_reserve_desc:0 "Prioritise armoured counterattacks. Grants a 50% armour research bonus. Excludes the methodical reserve."
 AOEIW_STRUCT_FRA_military_logistics:0 "Every Train to the Front"
 AOEIW_STRUCT_FRA_military_logistics_desc:0 "Military timetables will reserve locomotives, sidings and unloading crews for the mobilisation plan. A reserve army is useful only if it reaches its sector with food and shells."
 AOEIW_STRUCT_FRA_military_settlement:0 "The Marshalate Consolidated"
 AOEIW_STRUCT_FRA_military_settlement_desc:0 "Complete the military settlement. Grants 4% stability and 25 army experience; it does not change the leader again."
 AOEIW_STRUCT_FRA_imperial_dockyards:0 "The Mediterranean Dockyard Vote"
 AOEIW_STRUCT_FRA_imperial_dockyards_desc:0 "The imperial programme builds one dockyard in an owned, controlled coastal core state."
 AOEIW_STRUCT_FRA_colonial_transport:0 "The Imperial Transport Service"
 AOEIW_STRUCT_FRA_colonial_transport_desc:0 "Support overseas reinforcement without an annexation. Adds 40 convoys."
 AOEIW_STRUCT_FRA_imperial_logistics:0 "One Imperial Supply System"
 AOEIW_STRUCT_FRA_imperial_logistics_desc:0 "Connect the dockyards and transport service. Grants 20 naval experience and 15 command power."
 AOEIW_STRUCT_FRA_communal_credit:0 "Municipal Reconstruction Credit"
 AOEIW_STRUCT_FRA_communal_credit_desc:0 "The liberal settlement funds one civilian factory through municipal reconstruction."
 AOEIW_STRUCT_FRA_citizen_officers:0 "The Citizen Officer Schools"
 AOEIW_STRUCT_FRA_citizen_officers_desc:0 "Open officer training to the civic institutions. Grants 25 army experience and 10 command power."
 AOEIW_STRUCT_FRA_civic_defence:0 "Shelters Beneath Paris"
 AOEIW_STRUCT_FRA_civic_defence_desc:0 "Municipal engineers will mark cellars, reinforce shelters and organise fire and medical posts across the capital. Civil defence becomes visible in every arrondissement."
 AOEIW_STRUCT_FRA_DEPTH_mayors_petition:0 "Hear the Mayors Petitions"
 AOEIW_STRUCT_FRA_DEPTH_mayors_petition_desc:0 "Negotiate who administers reconstruction before the liberal coalition makes another promise."
 AOEIW_STRUCT_FRA_DEPTH_mayoral_congress:0 "The Congress of Municipalities"
 AOEIW_STRUCT_FRA_DEPTH_mayoral_congress_desc:0 "Turn the chosen reconstruction model into a working network of local offices.\n\nAdvance The Municipal Compact to stage 1/3. Total: +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_civic_register:0 "Count the Beds, Mark the Shelters"
 AOEIW_STRUCT_FRA_DEPTH_civic_register_desc:0 "Mairies will record hospital beds, shelter spaces and local vehicles before mobilisation scatters their owners. Paris needs one usable count when the sirens sound."
 AOEIW_STRUCT_FRA_DEPTH_prefect_limits:0 "Define the Emergency Powers"
 AOEIW_STRUCT_FRA_DEPTH_prefect_limits_desc:0 "Publish the limits of emergency requisition. Restraint costs political capital but protects confidence in government."
 AOEIW_STRUCT_FRA_DEPTH_civil_appeals:0 "A Civil Court of Appeals"
 AOEIW_STRUCT_FRA_DEPTH_civil_appeals_desc:0 "Citizens can appeal wartime administrative orders through a functioning court system.\n\nAdvance The Municipal Compact to stage 3/3. Total: +4% stability; +0.06 daily political power; +4% civilian factory construction. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_collective_contracts:0 "National Labour Contracts"
 AOEIW_STRUCT_FRA_DEPTH_collective_contracts_desc:0 "Negotiate common shift agreements instead of settling every arsenal dispute separately.\n\nAdvance Labour Contract Institutions to stage 1/3. Total: +3% production efficiency growth. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_union_representatives:0 "Union Liaison Officers"
 AOEIW_STRUCT_FRA_DEPTH_union_representatives_desc:0 "Union representatives identify absenteeism, housing shortages and broken supply promises early.\n\nAdvance Labour Contract Institutions to stage 2/3. Total: +5% production efficiency growth; +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_municipal_clinics:0 "The Municipal Medical Reserve"
 AOEIW_STRUCT_FRA_DEPTH_municipal_clinics_desc:0 "Connect civilian clinics to military medical planning without subordinating the municipalities to the army.\n\nAdvance Labour Contract Institutions to stage 3/3. Total: +7% production efficiency growth; +3% stability; +3% recruitable population factor. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_corps_archives:0 "The Archives of the Corps"
 AOEIW_STRUCT_FRA_DEPTH_corps_archives_desc:0 "Imperial glory must be measured against actual mobilisation records and depot capacity.\n\nAdvance Imperial Service Corps to stage 1/3. Total: +5% mobilisation speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_imperial_inspectors:0 "The Imperial Inspectorate"
 AOEIW_STRUCT_FRA_DEPTH_imperial_inspectors_desc:0 "Inspectors report empty depots as readily as ceremonial successes.\n\nAdvance Imperial Service Corps to stage 2/3. Total: +10% mobilisation speed; +2% army organisation. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_service_obligation:0 "The Service Obligation Debate"
 AOEIW_STRUCT_FRA_DEPTH_service_obligation_desc:0 "The imperial cabinet must equip its reservists before extending the service obligation.\n\nAdvance Imperial Service Corps to stage 3/3. Total: +15% mobilisation speed; +4% army organisation. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_reserve_depots:0 "The Colonial Reserve Depots"
 AOEIW_STRUCT_FRA_DEPTH_reserve_depots_desc:0 "A reserve overseas is useful only if its equipment can reach a port. Receive 30 transport convoys."
 AOEIW_STRUCT_FRA_DEPTH_interpreter_corps:0 "The Imperial Interpreter Corps"
 AOEIW_STRUCT_FRA_DEPTH_interpreter_corps_desc:0 "Standardise commands and technical manuals across the overseas service."
 AOEIW_STRUCT_FRA_DEPTH_algerian_contract:0 "The Algerian Arsenal Contract"
 AOEIW_STRUCT_FRA_DEPTH_algerian_contract_desc:0 "Unlock a paid 120-day arsenal expansion in Western Algeria. This does not grant new cores or prevent metropolitan defeat."
 AOEIW_STRUCT_FRA_DEPTH_overseas_maintenance:0 "Overseas Maintenance Manuals"
 AOEIW_STRUCT_FRA_DEPTH_overseas_maintenance_desc:0 "Translate the depot standards into procedures that field workshops can actually follow."
 AOEIW_STRUCT_FRA_DEPTH_algerian_handover:0 "Accept the Algerian Deliveries"
 AOEIW_STRUCT_FRA_DEPTH_algerian_handover_desc:0 "Integrate the completed arsenal into the imperial supply system. Requires the finished construction project."
 AOEIW_STRUCT_FRA_DEPTH_directorate_charter:0 "Weygand's Emergency Statute"
 AOEIW_STRUCT_FRA_DEPTH_directorate_charter_desc:0 "Weygand will set in writing which orders belong to the cabinet and which to military command. Emergency rule cannot function while every ministry can delay the next one."
 AOEIW_STRUCT_FRA_DEPTH_judicial_review:0 "Review the State of Siege"
 AOEIW_STRUCT_FRA_DEPTH_judicial_review_desc:0 "Turn emergency orders into a defined administrative system after the cabinet chooses its composition."
 AOEIW_STRUCT_FRA_DEPTH_military_inspection:0 "The General Inspection Tours"
 AOEIW_STRUCT_FRA_DEPTH_military_inspection_desc:0 "Inspectors report ammunition, transport and reserve shortages directly to the directorate."
 AOEIW_STRUCT_FRA_DEPTH_reserve_contracts:0 "Contracts for the Strategic Reserve"
 AOEIW_STRUCT_FRA_DEPTH_reserve_contracts_desc:0 "Stockpile common components before the army commits to its reserve doctrine.\n\nAdvance Reserve Transport Columns to stage 1/3. Total: -2% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_reserve_lorries:0 "The Reserve Lorry Pool"
 AOEIW_STRUCT_FRA_DEPTH_reserve_lorries_desc:0 "Provide transport for the reserve formations. Receive 150 trucks.\n\nAdvance Reserve Transport Columns to stage 2/3. Total: -4% supply consumption; +5% planning speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_fire_plan:0 "The Prepared Fire Plan"
 AOEIW_STRUCT_FRA_DEPTH_fire_plan_desc:0 "The methodical reserve receives artillery stocks and mapped fire zones.\n\nUnlocks the funded programme Prepare the Methodical Battle; activate it from Decisions when needed."
 AOEIW_STRUCT_FRA_DEPTH_counterstroke:0 "The Counterstroke Exercise"
 AOEIW_STRUCT_FRA_DEPTH_counterstroke_desc:0 "The mobile reserve tests concentration and recovery instead of copying the artillery plan.\n\nUnlocks the funded programme Release the Mobile Reserve; activate it from Decisions when needed."
 AOEIW_STRUCT_FRA_DEPTH_evacuation_tables:0 "The Evacuation Timetables"
 AOEIW_STRUCT_FRA_DEPTH_evacuation_tables_desc:0 "Prepare orderly movement of depots and hospitals if the frontier gives way. Receive 45 trains.\n\nAdvance Civil and Military Medical Service to stage 1/3. Total: -3% experience loss. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_medical_columns:0 "The Army Medical Columns"
 AOEIW_STRUCT_FRA_DEPTH_medical_columns_desc:0 "Mobile medical teams accompany the reserve, rather than waiting in fixed hospitals.\n\nAdvance Civil and Military Medical Service to stage 2/3. Total: -5% experience loss; +4% army organisation recovery. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_reserve_staff:0 "The Reserve Staff College"
 AOEIW_STRUCT_FRA_DEPTH_reserve_staff_desc:0 "Train a second line of staff officers for a prolonged campaign.\n\nAdvance Reserve Transport Columns to stage 3/3. Total: -6% supply consumption; +10% planning speed. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_directorate_service:0 "Authority Must Deliver"
 AOEIW_STRUCT_FRA_DEPTH_directorate_service_desc:0 "The emergency government will join medical evacuation, transport and staff work under enforceable orders. Its claim to command will be judged in stations and hospitals."
 AOEIW_STRUCT_FRA_DEPTH_bakery_councils:0 "The Bakery Councils"
 AOEIW_STRUCT_FRA_DEPTH_bakery_councils_desc:0 "Bread queues can decide the fate of a revolution before a military campaign does.\n\nAdvance Communal Distribution Network to stage 1/3. Total: +2% stability. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_grain_register:0 "Bread Lists in Every Mairie"
 AOEIW_STRUCT_FRA_DEPTH_grain_register_desc:0 "Each mairie will report grain stocks, bakeries and delivery carts through a common schedule. No two communes may requisition the same train while another goes without flour."
 AOEIW_STRUCT_FRA_DEPTH_delegate_schools:0 "The Delegate Schools"
 AOEIW_STRUCT_FRA_DEPTH_delegate_schools_desc:0 "Teach the new delegates accounting and technical administration, not just parliamentary speeches."
 AOEIW_STRUCT_FRA_DEPTH_food_congress:0 "The Congress on Food Supply"
 AOEIW_STRUCT_FRA_DEPTH_food_congress_desc:0 "Choose between negotiated civilian supply and emergency military requisition."
 AOEIW_STRUCT_FRA_DEPTH_ration_cards:0 "A Common Ration Card"
 AOEIW_STRUCT_FRA_DEPTH_ration_cards_desc:0 "The adopted supply policy needs a common register, whichever institution administers it."
 AOEIW_STRUCT_FRA_DEPTH_communal_transport:0 "The Communal Transport Service"
 AOEIW_STRUCT_FRA_DEPTH_communal_transport_desc:0 "Pool delivery vehicles across communes rather than creating competing local fleets.\n\nAdvance Communal Distribution Network to stage 3/3. Total: +4% stability; +5% production efficiency growth; -3% supply consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_paris_workshops:0 "The Paris Workshop Survey"
 AOEIW_STRUCT_FRA_DEPTH_paris_workshops_desc:0 "Locate small suppliers capable of joining a national reconstruction contract.\n\nAdvance French Supplier Standards to stage 1/3. Total: +2% military factory output. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_paris_contract:0 "The Paris Reconstruction Contract"
 AOEIW_STRUCT_FRA_DEPTH_paris_contract_desc:0 "Unlock a funded 90-day civilian factory project in Île-de-France."
 AOEIW_STRUCT_FRA_DEPTH_technical_lycees:0 "The Technical Lycées"
 AOEIW_STRUCT_FRA_DEPTH_technical_lycees_desc:0 "Connect technical schools to the factories that will employ their graduates.\n\nAdvance French Supplier Standards to stage 2/3. Total: +4% military factory output; +3% production efficiency cap. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_aviation_tools:0 "One Gauge from Toulouse to Bordeaux"
 AOEIW_STRUCT_FRA_DEPTH_aviation_tools_desc:0 "Aircraft works in Toulouse and Bordeaux will share gauges, jigs and inspection standards. Parts must fit before squadrons can replace losses."
 AOEIW_STRUCT_FRA_DEPTH_alpine_radio:0 "The Alpine Radio Trials"
 AOEIW_STRUCT_FRA_DEPTH_alpine_radio_desc:0 "Test radio sets across valleys and mountain positions before issuing them to the field army.\n\nAdvance Air and Ground Liaison to stage 2/2. Total: +5% air mission efficiency; -5% air accidents. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Air-Ground Liaison Programme; activate it from Decisions when needed."
 AOEIW_STRUCT_FRA_DEPTH_standard_chassis:0 "Fewer Chassis, More Spares"
 AOEIW_STRUCT_FRA_DEPTH_standard_chassis_desc:0 "The army will cut incompatible vehicle types and require common engines, fittings and recovery parts. Workshops can then repair fleets instead of maintaining a museum of models."
 AOEIW_STRUCT_FRA_DEPTH_supplier_acceptance:0 "Accept the Reconstruction Orders"
 AOEIW_STRUCT_FRA_DEPTH_supplier_acceptance_desc:0 "Inspect the completed Paris project before its suppliers enter the military procurement system.\n\nUnlocks the funded programme Metropolitan Works Programme; activate it from Decisions when needed."
 AOEIW_STRUCT_FRA_DEPTH_naval_rescue:0 "The Naval Rescue Service"
 AOEIW_STRUCT_FRA_DEPTH_naval_rescue_desc:0 "Coordinate rescue craft, coastal wireless stations and merchant captains.\n\nAdvance Maritime Rescue and Reconnaissance to stage 1/2. Total: +3% naval coordination. Replaces earlier stages; never stacks or downgrades an existing higher stage."
 AOEIW_STRUCT_FRA_DEPTH_maritime_patrols:0 "The Atlantic Patrol Syllabus"
 AOEIW_STRUCT_FRA_DEPTH_maritime_patrols_desc:0 "Train long patrols and recognition drills around the fleet's actual sea routes.\n\nAdvance Maritime Rescue and Reconnaissance to stage 2/2. Total: +6% naval coordination; -5% navy fuel consumption. Replaces earlier stages; never stacks or downgrades an existing higher stage.\n\nUnlocks the funded programme Mediterranean Escort Watch; activate it from Decisions when needed."
 AOEIW_IMM_FRA_union_3:0 "The Nation in Arms"
 AOEIW9_GER_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_GER_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_FRA_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_FRA_mil_army_8:0 "One Supply Service"
 AOEIW9_SOV_politics_p2_2:0 "Accountability for the Okhrana"
 AOEIW9_SOV_politics_p1_6:0 "The Crown and the Officer Corps"
 AOEIW9_SOV_politics_p2_6:0 "A Parliament for All Russia"
 AOEIW9_FRA_politics_p2_7:0 "The Senatus-Consulte of Saint-Cloud"
 AOEIW9_FRA_politics_settlement:0 "A French State Reconciled"
 AOEIW9_GER_mil_army_4_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_army_7_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_7_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_8_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW_IMM_FRA_union_3_desc:0 "The liberal imperial settlement now rests on civic institutions and national defence. Unlocks municipal reconstruction and citizen officer education; this focus does not proclaim a republic."
