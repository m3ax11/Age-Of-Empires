l_english:
 AOEIW29_GER_spd_works_councils:0 "Works Councils at the Negotiating Table"
 AOEIW29_GER_spd_works_councils_desc:0 "Labour representation must reach the workshops where production targets are set. Binding arbitration keeps disputes from stopping every shift."
 AOEIW29_GER_spd_housing_cooperatives:0 "Housing Cooperatives of the Ruhr"
 AOEIW29_GER_spd_housing_cooperatives_desc:0 "Municipal housing associations receive engineering plans and credit. Better housing makes an industrial workforce less dependent on factory-owned accommodation."
 AOEIW29_GER_spd_labour_congress:0 "The Labour and Municipal Congress"
 AOEIW29_GER_spd_labour_congress_desc:0 "Trade unions and city administrations must agree on which promises can be funded before the budget reaches parliament."
 AOEIW29_GER_spd_social_insurance:0 "The Republic Insures Its Workers"
 AOEIW29_GER_spd_social_insurance_desc:0 "Illness and unemployment must no longer throw an entire household into destitution. Contributions will be pooled nationally and benefits paid as a right."
 AOEIW29_GER_spd_social_insurance_idea:0 "A National Social Insurance Compact"
 AOEIW29_GER_spd_social_insurance_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_spd_industrial_bargain:0 "The Industrial Bargaining Republic"
 AOEIW29_GER_spd_industrial_bargain_desc:0 "Tie productivity agreements to organised labour rather than placing every enterprise under ministerial instructions."
 AOEIW29_GER_spd_industrial_bargain_idea:0 "The Industrial Bargaining Republic"
 AOEIW29_GER_spd_industrial_bargain_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_spd_mandate_delivered:0 "Bread, Work and Parliamentary Power"
 AOEIW29_GER_spd_mandate_delivered_desc:0 "Our mandate is measured in enforceable rights and functioning workplaces, not in decrees that expire with the next cabinet."
 AOEIW29_GER_zentrum_regional_compacts:0 "Guarantees for the Länder"
 AOEIW29_GER_zentrum_regional_compacts_desc:0 "Regional governments accept common standards in exchange for a real voice in their implementation."
 AOEIW29_GER_zentrum_cooperative_credit:0 "Cooperative Credit Banks"
 AOEIW29_GER_zentrum_cooperative_credit_desc:0 "Cooperative banks connect rural savings with small workshops, bypassing dependence on a handful of industrial combines."
 AOEIW29_GER_zentrum_social_conference:0 "The Federal Social Conference"
 AOEIW29_GER_zentrum_social_conference_desc:0 "Employers, confessional associations and organised labour negotiate a settlement that the Länder can actually administer."
 AOEIW29_GER_zentrum_subsidiarity:0 "Subsidiarity Before Central Orders"
 AOEIW29_GER_zentrum_subsidiarity_desc:0 "Entrust administration to regional institutions. Their cooperation is more dependable than a constant contest of central decrees."
 AOEIW29_GER_zentrum_subsidiarity_idea:0 "Subsidiarity Before Central Orders"
 AOEIW29_GER_zentrum_subsidiarity_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_zentrum_national_standards:0 "Common Social Standards"
 AOEIW29_GER_zentrum_national_standards_desc:0 "Set national minimum standards while retaining local execution. Uniformity strengthens the settlement but requires more coordination."
 AOEIW29_GER_zentrum_national_standards_idea:0 "Common Social Standards"
 AOEIW29_GER_zentrum_national_standards_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_zentrum_mandate_delivered:0 "A Federation Held Together by Consent"
 AOEIW29_GER_zentrum_mandate_delivered_desc:0 "The centre survives because regional governments and social organisations recognise themselves in the constitutional bargain."
 AOEIW29_GER_liberal_civil_liberties:0 "No More Rule by Article 48"
 AOEIW29_GER_liberal_civil_liberties_desc:0 "Police searches, press bans and emergency decrees will face enforceable limits. A republic that fears criticism has already surrendered its strongest defence."
 AOEIW29_GER_liberal_research_endowments:0 "Independent Research Endowments"
 AOEIW29_GER_liberal_research_endowments_desc:0 "Long-term grants protect laboratories from every change in the ministerial budget and favour open technical exchange."
 AOEIW29_GER_liberal_free_democrats:0 "Unite the Free Democrats"
 AOEIW29_GER_liberal_free_democrats_desc:0 "The liberal parliamentary groups organise a common Free Democratic programme: constitutional rights, scientific independence and accountable government."
 AOEIW29_GER_liberal_competition:0 "Break the Closed Industrial Cartels"
 AOEIW29_GER_liberal_competition_desc:0 "Competition opens procurement to capable firms outside the established combines. Higher efficiency comes with difficult negotiations."
 AOEIW29_GER_liberal_competition_idea:0 "Break the Closed Industrial Cartels"
 AOEIW29_GER_liberal_competition_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_liberal_innovation:0 "A Republic of Laboratories"
 AOEIW29_GER_liberal_innovation_desc:0 "Concentrate the liberal mandate on research institutions and technical education rather than a broad confrontation with industry."
 AOEIW29_GER_liberal_innovation_idea:0 "A Republic of Laboratories"
 AOEIW29_GER_liberal_innovation_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_liberal_mandate_delivered:0 "Liberty Made Administrative Practice"
 AOEIW29_GER_liberal_mandate_delivered_desc:0 "Public accounts, independent courts and open research must function even when the next election brings our opponents into office."
 AOEIW29_GER_conservative_rural_infrastructure:0 "Roads to the Agricultural Markets"
 AOEIW29_GER_conservative_rural_infrastructure_desc:0 "Transport investment connects farms with reliable buyers instead of leaving rural policy at protective slogans."
 AOEIW29_GER_conservative_procurement_audit:0 "Audit the Defence Contracts"
 AOEIW29_GER_conservative_procurement_audit_desc:0 "Parliamentary scrutiny of procurement makes a strong defence budget easier to sustain and harder to divert into patronage."
 AOEIW29_GER_conservative_constitutional_right:0 "The Constitutional Right"
 AOEIW29_GER_conservative_constitutional_right_desc:0 "Conservative representatives commit to winning majorities, not replacing parliament with the officer corps or the estates."
 AOEIW29_GER_conservative_rural_settlement:0 "The Reichs-Landbund's Price"
 AOEIW29_GER_conservative_rural_settlement_desc:0 "The agrarian bloc offers votes in return for protected prices, farm credit and a brake on Berlin's industrial priorities. The coalition must decide how much the eastern estates are worth."
 AOEIW29_GER_conservative_rural_settlement_idea:0 "A Lasting Rural Settlement"
 AOEIW29_GER_conservative_rural_settlement_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_conservative_defence_industry:0 "The Constitutional Defence Economy"
 AOEIW29_GER_conservative_defence_industry_desc:0 "A negotiated defence programme gives factories dependable orders without removing the elected budget committee."
 AOEIW29_GER_conservative_defence_industry_idea:0 "The Constitutional Defence Economy"
 AOEIW29_GER_conservative_defence_industry_idea_desc:0 "Active only while this party belongs to the government."
 AOEIW29_GER_conservative_mandate_delivered:0 "Continuity Without Emergency Rule"
 AOEIW29_GER_conservative_mandate_delivered_desc:0 "A conservative government proves its strength by accepting the constitution when it constrains its own ministers."
 AOEIW29_GER_coalition_coordination:0 "Coalition Coordination"
 AOEIW29_GER_coalition_coordination_desc:0 "Two parties share government and unlock both programmes. Negotiating a common line costs political power."
 AOEIW29_GER_nominate_spd:0 "Nominate SPD"
 AOEIW29_GER_nominate_spd_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_withdraw_spd:0 "Withdraw SPD"
 AOEIW29_GER_withdraw_spd_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_nominate_zentrum:0 "Nominate Zentrum"
 AOEIW29_GER_nominate_zentrum_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_withdraw_zentrum:0 "Withdraw Zentrum"
 AOEIW29_GER_withdraw_zentrum_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_nominate_liberal:0 "Nominate Free Democrats"
 AOEIW29_GER_nominate_liberal_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_withdraw_liberal:0 "Withdraw Free Democrats"
 AOEIW29_GER_withdraw_liberal_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_nominate_conservative:0 "Nominate Conservatives"
 AOEIW29_GER_nominate_conservative_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_withdraw_conservative:0 "Withdraw Conservatives"
 AOEIW29_GER_withdraw_conservative_desc:0 "Select up to two coalition partners, then confirm the government. Nomination alone does not change the serving cabinet."
 AOEIW29_GER_confirm_coalition:0 "Confirm the Parliamentary Coalition"
 AOEIW29_GER_confirm_coalition_desc:0 "One or two nominated parties take office. Their focus programmes appear; opposition programmes disappear. Completed projects are retained. Two-party governments pay a coordination cost."
 AOEIW29_GER_open_parliament:0 "Negotiate the coalition in Decisions"
 AOEIW29_civic_bonus:0 "Parliamentary Development Programme"
