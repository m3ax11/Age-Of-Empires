l_english:
 AOEIW6_FRA_procurement_0:0 "Competing Procurement Bureaux"
 AOEIW6_FRA_procurement_0_desc:0 "French rearmament is split among ministries, arsenals and preferred contractors that issue overlapping requirements. The result is expensive tooling changes and slow conversion from policy to production."
 AOEIW6_FRA_procurement_1:0 "Joint Armament Tendering"
 AOEIW6_FRA_procurement_1_desc:0 "The first common tenders force ministries and firms to agree on specifications before contracts are signed. Duplication remains, but fewer factories are retooled for contradictory orders."
 AOEIW6_FRA_procurement_2:0 "Central Procurement Board"
 AOEIW6_FRA_procurement_2_desc:0 "A central board now sequences orders, tooling and factory expansion across the major armament houses. The system is not elegant, but it is increasingly predictable."
 AOEIW6_FRA_procurement_3:0 "Integrated Armaments Directorate"
 AOEIW6_FRA_procurement_3_desc:0 "France has turned procurement into a coordinated national system. Civilian and military industry can now expand with far less administrative friction."
 AOEIW6_SPR_regional_economy_0:0 "A Patchwork Industrial Kingdom"
 AOEIW6_SPR_regional_economy_0_desc:0 "Catalan factories, Basque steel, Asturian mines and Madrid workshops are productive islands linked by uneven infrastructure, finance and administrative rules."
 AOEIW6_SPR_regional_economy_1:0 "Regional Investment Agreements"
 AOEIW6_SPR_regional_economy_1_desc:0 "Madrid has begun tying Catalan and Basque investment to national freight and credit plans. The regional economy remains uneven, but capital now follows a common programme."
 AOEIW6_SPR_regional_economy_2:0 "Interregional Development Board"
 AOEIW6_SPR_regional_economy_2_desc:0 "Industrial policy now links Asturias, Madrid and the northern manufacturing regions through shared contracts and infrastructure priorities."
 AOEIW6_SPR_regional_economy_3:0 "Integrated Peninsular Economy"
 AOEIW6_SPR_regional_economy_3_desc:0 "Spain has connected its regional industrial strengths into a national production network without pretending that Catalonia, the Basque Country, Asturias and Madrid are interchangeable."
 AOEIW6_POR_mainland_industry_0:0 "A Narrow Mainland Base"
 AOEIW6_POR_mainland_industry_0_desc:0 "Lisbon and Porto cannot alone carry the industrial burden of an Atlantic empire. Small domestic markets, weak inland infrastructure and scarce capital make expansion expensive."
 AOEIW6_POR_mainland_industry_1:0 "Lisbon–Porto Investment Plan"
 AOEIW6_POR_mainland_industry_1_desc:0 "The government is concentrating scarce capital on the mainland corridors that can support larger workshops and more reliable internal trade."
 AOEIW6_POR_mainland_industry_2:0 "National Industrial Credit"
 AOEIW6_POR_mainland_industry_2_desc:0 "A more disciplined credit and infrastructure programme is widening the mainland production base beyond a handful of established firms."
 AOEIW6_POR_mainland_industry_3:0 "A Viable Metropolitan Economy"
 AOEIW6_POR_mainland_industry_3_desc:0 "Portugal remains a smaller industrial power, but the mainland can now support the state and empire without every expansion project becoming a fiscal emergency."
 AOEIW6_GER_rearmament_coordination_0:0 "The Cost of Rearmament"
 AOEIW6_GER_rearmament_coordination_0_desc:0 "German industry is enormous, but simultaneous army, air and naval demands compete for machine tools, steel allocations and investment. Rearmament is powerful and expensive."
 AOEIW6_GER_rearmament_coordination_1:0 "Central Armament Scheduling"
 AOEIW6_GER_rearmament_coordination_1_desc:0 "Berlin has begun sequencing major contracts so firms no longer expand against contradictory service timetables."
 AOEIW6_GER_rearmament_coordination_2:0 "Standardised Reich Contracts"
 AOEIW6_GER_rearmament_coordination_2_desc:0 "Common specifications and longer orders reduce the waste created by repeated short-run military procurement."
 AOEIW6_GER_rearmament_coordination_3:0 "Coordinated War Industry"
 AOEIW6_GER_rearmament_coordination_3_desc:0 "Germany has aligned the major armament firms and services around a more coherent production programme. Its industrial potential can now be converted into military power with less friction."
 AOEIW6_AUS_joint_procurement_0:0 "Divided Imperial Procurement"
 AOEIW6_AUS_joint_procurement_0_desc:0 "Austrian, Hungarian and Czech industrial centres answer to overlapping military and political authorities. The common army pays the price in duplicate contracts and incompatible priorities."
 AOEIW6_AUS_joint_procurement_1:0 "Common Armament Specifications"
 AOEIW6_AUS_joint_procurement_1_desc:0 "The first empire-wide specifications reduce duplicated orders and make it easier for Bohemian, Austrian and Hungarian factories to supply the same formations."
 AOEIW6_AUS_joint_procurement_2:0 "Joint Procurement Office"
 AOEIW6_AUS_joint_procurement_2_desc:0 "A permanent office now arbitrates contracts across the crown lands and coordinates production with the k.u.k. General Staff."
 AOEIW6_AUS_joint_procurement_3:0 "Danubian Armaments System"
 AOEIW6_AUS_joint_procurement_3_desc:0 "Austria-Hungary has turned its dispersed industrial regions into a workable common procurement network while preserving their political distinctions."
 AOEIW6_ITA_military_modernisation_0:0 "An Army Between Eras"
 AOEIW6_ITA_military_modernisation_0_desc:0 "The Italian army mixes modern formations with uneven staff work, mobilisation procedures and support systems. Ambition has moved faster than institutional modernisation."
 AOEIW6_ITA_military_modernisation_1:0 "Comando Supremo Reform"
 AOEIW6_ITA_military_modernisation_1_desc:0 "The high command has begun standardising operational planning and support procedures across field formations."
 AOEIW6_ITA_military_modernisation_2:0 "Unified Mobilisation Tables"
 AOEIW6_ITA_military_modernisation_2_desc:0 "Reserve calls, reinforcement routes and staff procedures are increasingly built around the same national assumptions."
 AOEIW6_ITA_military_modernisation_3:0 "A Modern Royal Army"
 AOEIW6_ITA_military_modernisation_3_desc:0 "Italy now possesses a more coherent army able to turn its manpower and industry into sustained operations rather than isolated showcases."
 AOEIW6_POL_reichspakt_dependency_0:0 "Sovereignty under Berlin"
 AOEIW6_POL_reichspakt_dependency_0_desc:0 "Poland is a German subject inside the Reichspakt. Warsaw governs at home, but strategic policy, mobilisation and major diplomatic choices remain constrained by the relationship with Berlin."
 AOEIW6_POL_reichspakt_dependency_1:0 "The Berlin–Warsaw Liaison"
 AOEIW6_POL_reichspakt_dependency_1_desc:0 "A permanent liaison gives Warsaw a place to negotiate German demands before they become orders, reducing the cost of dependent decision-making."
 AOEIW6_POL_reichspakt_dependency_2:0 "Negotiated Reichspakt Obligations"
 AOEIW6_POL_reichspakt_dependency_2_desc:0 "Joint staff work and formal consultation have clarified what Poland owes the alliance and what remains under Polish control."
 AOEIW6_POL_reichspakt_dependency_3:0 "Practical Autonomy within the Reichspakt"
 AOEIW6_POL_reichspakt_dependency_3_desc:0 "Poland remains a German subject, but Warsaw has carved out meaningful room to manage its army and domestic priorities from inside the alliance."
 AOEIW8_SOV_divided_politics_1:0 "Cabinet Arbitration"
 AOEIW8_SOV_divided_politics_1_desc:0 "The court and Duma have accepted regular arbitration procedures, reducing the number of disputes that paralyse whole ministries."
 AOEIW8_SOV_divided_politics_2:0 "A Stable Imperial Cabinet"
 AOEIW8_SOV_divided_politics_2_desc:0 "The state now possesses a cabinet able to govern through political disagreement without treating every dispute as a constitutional emergency."
 AOEIW8_SOV_divided_politics_3:0 "Restored Administrative Legitimacy"
 AOEIW8_SOV_divided_politics_3_desc:0 "Russia has not eliminated political opposition, but the government again possesses enough legitimacy and routine procedure to make decisions stick."
 AOEIW8_SOV_backward_industry_1:0 "Rail and Factory Coordination"
 AOEIW8_SOV_backward_industry_1_desc:0 "The first national surveys are linking industrial expansion to rail capacity and resource extraction instead of treating each project in isolation."
 AOEIW8_SOV_backward_industry_2:0 "Balanced Imperial Development"
 AOEIW8_SOV_backward_industry_2_desc:0 "New investment is spreading machine capacity and infrastructure beyond the oldest industrial centres while improving access to the empire's resources."
 AOEIW8_SOV_backward_industry_3:0 "A Modernising Continental Economy"
 AOEIW8_SOV_backward_industry_3_desc:0 "Russia remains geographically difficult to administer, but its industrial system can now sustain large-scale modernisation rather than merely accumulate isolated factories."
 AOEIW8_SOV_weak_officer_corps_1:0 "Staff Schools Expanded"
 AOEIW8_SOV_weak_officer_corps_1_desc:0 "Professional education and field exercises are producing a wider pool of officers familiar with modern staff methods."
 AOEIW8_SOV_weak_officer_corps_2:0 "Reformed Russian General Staff"
 AOEIW8_SOV_weak_officer_corps_2_desc:0 "Standard planning procedures and stronger staff schools have sharply improved coordination between armies and military districts."
 AOEIW8_SOV_weak_officer_corps_3:0 "A Professional Imperial Officer Corps"
 AOEIW8_SOV_weak_officer_corps_3_desc:0 "Russia has rebuilt a professional command culture capable of handling the scale of continental warfare."
