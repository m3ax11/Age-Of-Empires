 AOEIW9_CHI_mil_air_7:0 "Chinese Imperial Air Force Comes of Age"
 AOEIW9_CHI_mil_air_7_desc:0 "Chinese Imperial Air Force now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
