 AOEIW9_EGY_eco_war_3_desc:0 "Precision machine tools will be prioritised for Upper Egypt Development, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_EGY_eco_war_4:0 "Expand Nile Irrigation Board for Rearmament"
 AOEIW9_EGY_eco_war_4_desc:0 "New military production capacity will be built around Nile Irrigation Board, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_EGY_eco_war_5:0 "Standardise Alexandria Docks"
 AOEIW9_EGY_eco_war_5_desc:0 "Factories tied to Alexandria Docks will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_EGY_eco_war_6:0 "Night Production at Cairo Workshops"
 AOEIW9_EGY_eco_war_6_desc:0 "Night production will be organised at Cairo Workshops with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_EGY_eco_science_1:0 "Endow Cairo University"
 AOEIW9_EGY_eco_science_1_desc:0 "Stable public funding will give Cairo University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_EGY_eco_science_2:0 "New Laboratories at Royal Engineering School"
 AOEIW9_EGY_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Royal Engineering School. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_EGY_eco_science_3:0 "Applied Research at Egyptian Scientific Society"
 AOEIW9_EGY_eco_science_3_desc:0 "Egyptian Scientific Society will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_EGY_eco_science_4:0 "Industrial Physics at Cairo University"
 AOEIW9_EGY_eco_science_4_desc:0 "Industrial physics at Cairo University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_EGY_eco_science_5:0 "Production Science at Royal Engineering School"
 AOEIW9_EGY_eco_science_5_desc:0 "Researchers at Royal Engineering School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_EGY_eco_infra_2:0 "Freight Capacity at Suez Commerce"
 AOEIW9_EGY_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Suez Commerce will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_EGY_eco_infra_3:0 "Workers' Housing at Delta Textile Mills"
 AOEIW9_EGY_eco_infra_3_desc:0 "Worker housing near Delta Textile Mills will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_EGY_eco_infra_4:0 "Logistics through Upper Egypt Development"
 AOEIW9_EGY_eco_infra_4_desc:0 "Upper Egypt Development will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_EGY_eco_final:0 "The Nile Development Economy"
 AOEIW9_EGY_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a egyptian economy able to convert regional strengths into sustained national output."
 AOEIW9_EGY_mil_root:0 "Review the Egyptian General Staff"
 AOEIW9_EGY_mil_root_desc:0 "The Egyptian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_EGY_mil_army_2:0 "Nile Army Field Manoeuvres"
 AOEIW9_EGY_mil_army_2_desc:0 "Large field exercises with the Nile Army will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_EGY_mil_army_5:0 "Motorise the Cairo Staff College"
 AOEIW9_EGY_mil_army_5_desc:0 "Motor transport assigned to the Cairo Staff College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_EGY_mil_army_6:0 "Staff Procedures at the Egyptian General Staff"
 AOEIW9_EGY_mil_army_6_desc:0 "Staff officers at the Egyptian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_EGY_mil_army_7:0 "Armour Studies at the Nile Army"
 AOEIW9_EGY_mil_army_7_desc:0 "The Nile Army will study how armour can be integrated with infantry, artillery and logistics under egyptian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_EGY_mil_air_1:0 "Reorganise Royal Egyptian Air Force"
 AOEIW9_EGY_mil_air_1_desc:0 "Royal Egyptian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_EGY_mil_air_2:0 "Fighter Instruction at Almaza Air Base"
 AOEIW9_EGY_mil_air_2_desc:0 "Almaza Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_EGY_mil_air_3:0 "Ground Support Doctrine under Desert Air Command"
 AOEIW9_EGY_mil_air_3_desc:0 "Desert Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_EGY_mil_air_4:0 "Extend the Range of Royal Egyptian Air Force"
 AOEIW9_EGY_mil_air_4_desc:0 "Royal Egyptian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Egypt's geography and strategic commitments."
 AOEIW9_EGY_mil_air_5:0 "Radar Networks for Almaza Air Base"
 AOEIW9_EGY_mil_air_5_desc:0 "Almaza Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_EGY_mil_sea_1:0 "Review Alexandria Squadron"
 AOEIW9_EGY_mil_sea_1_desc:0 "A full review of Alexandria Squadron will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_EGY_mil_sea_2:0 "Expand Port Said Naval Station"
 AOEIW9_EGY_mil_sea_2_desc:0 "Port Said Naval Station will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_EGY_mil_sea_3:0 "Fleet Manoeuvres with Red Sea Patrol"
 AOEIW9_EGY_mil_sea_3_desc:0 "Fleet exercises with Red Sea Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_EGY_mil_sea_4:0 "Screening Doctrine for Alexandria Squadron"
 AOEIW9_EGY_mil_sea_4_desc:0 "Alexandria Squadron will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_EGY_mil_sea_5:0 "Naval Aviation at Port Said Naval Station"
 AOEIW9_EGY_mil_sea_5_desc:0 "Naval aviation will be integrated with Port Said Naval Station for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_EGY_mil_final:0 "Desert Mobility"
 AOEIW9_EGY_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Egypt now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_EGY_dip_root:0 "Define the Nile Doctrine"
 AOEIW9_EGY_dip_root_desc:0 "The Kingdom of Egypt must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_EGY_dip_a_2:0 "Send a Mission on the British Question"
 AOEIW9_EGY_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the British Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_EGY_dip_a_3:0 "Economic Leverage over the British Question"
 AOEIW9_EGY_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the British Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_EGY_dip_a_4:0 "Staff Talks on the British Question"
 AOEIW9_EGY_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the British Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_EGY_dip_a_5:0 "A Formal Warning over the British Question"
 AOEIW9_EGY_dip_a_5_desc:0 "A formal warning over the British Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_EGY_dip_b_1:0 "The Ottoman Shadow"
 AOEIW9_EGY_dip_b_1_desc:0 "The Ottoman Shadow will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Egypt actually wants before pressure is applied."
 AOEIW9_EGY_dip_b_2:0 "Send a Mission on the Ottoman Shadow"
 AOEIW9_EGY_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Ottoman Shadow. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_EGY_dip_b_3:0 "Economic Leverage over the Ottoman Shadow"
 AOEIW9_EGY_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Ottoman Shadow. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_EGY_dip_b_4:0 "Staff Talks on the Ottoman Shadow"
 AOEIW9_EGY_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Ottoman Shadow. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_EGY_dip_b_5:0 "A Formal Warning over the Ottoman Shadow"
 AOEIW9_EGY_dip_b_5_desc:0 "A formal warning over the Ottoman Shadow will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_EGY_dip_final:0 "Cairo and the Eastern Mediterranean"
 AOEIW9_EGY_dip_final_desc:0 "The Kingdom of Egypt's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_ENG_focus_tree:0 "British Empire Focus Tree"
 AOEIW9_ENG_politics_root:0 "The Empire at a Turning Point"
 AOEIW9_ENG_politics_root_desc:0 "Power in the British Empire is divided among House of Commons, House of Lords and Privy Council. The question is no longer ceremonial: whichever side prevails will shape the budget, the officer corps and the state's ability to act."
 AOEIW9_ENG_politics_p1_1:0 "Parliament and Crown"
 AOEIW9_ENG_politics_p1_1_desc:0 "The Crown will accept a government answerable to the Commons, while Parliament preserves the monarchy as the visible bond of the Empire. Cabinet authority, dominion consultation and constitutional convention will replace rule by emergency decree."
 AOEIW9_ENG_politics_p1_2:0 "Reconcile the House of Lords"
 AOEIW9_ENG_politics_p1_2_desc:0 "House of Lords has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Parliament and Crown programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_ENG_politics_p1_3:0 "Reform the Privy Council"
 AOEIW9_ENG_politics_p1_3_desc:0 "Privy Council still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Parliament and Crown settlement."
 AOEIW9_ENG_politics_p1_4:0 "Bind the British Imperial Conference"
 AOEIW9_ENG_politics_p1_4_desc:0 "Imperial Conference will be tied to the Parliament and Crown programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_ENG_politics_p1_5:0 "The Dominions Secretary at No. 10"
 AOEIW9_ENG_politics_p1_5_desc:0 "The Dominions Secretary will bring Ottawa, Canberra, Wellington and Pretoria's objections directly to the Prime Minister. Imperial policy must survive a meeting with the governments expected to carry it out."
 AOEIW9_ENG_politics_p1_6:0 "Codify the Cabinet"
 AOEIW9_ENG_politics_p1_6_desc:0 "Custom and emergency practice around Cabinet will be replaced with written rules. Codification fixes its place in the Parliament and Crown order and limits future constitutional improvisation."
 AOEIW9_ENG_politics_p1_7:0 "House of Commons and Nation"
 AOEIW9_ENG_politics_p1_7_desc:0 "House of Commons will be presented as part of the national political order rather than a factional institution. The Parliament and Crown camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_ENG_politics_p2_1:0 "Imperial Federation"
 AOEIW9_ENG_politics_p2_1_desc:0 "The dominions can no longer be managed through improvised conferences and private cables. An Imperial Parliament, common defence budget and shared foreign policy would turn the Empire into a genuine federation."
 AOEIW9_ENG_politics_p2_2:0 "Open the Privy Council"
 AOEIW9_ENG_politics_p2_2_desc:0 "Access to Privy Council will be widened and its procedures made less dependent on closed patronage. The reform gives the Imperial Federation camp a legal route to broaden its support without bypassing the state."
 AOEIW9_ENG_politics_p2_3:0 "Guarantee the British Imperial Conference"
 AOEIW9_ENG_politics_p2_3_desc:0 "The position of Imperial Conference will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Imperial Federation settlement."
 AOEIW9_ENG_politics_p2_4:0 "Invite the Dominion Premiers"
 AOEIW9_ENG_politics_p2_4_desc:0 "The Dominion premiers will take seats at the London conference as heads of governments, not provincial petitioners. Defence commitments will be written beside their claims to autonomy."
 AOEIW9_ENG_politics_p2_5:0 "Entrust the Cabinet"
 AOEIW9_ENG_politics_p2_5_desc:0 "Responsibility now shifts toward Cabinet, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Imperial Federation system can govern through delegated institutions."
 AOEIW9_ENG_politics_p2_6:0 "Ratify the House of Commons"
 AOEIW9_ENG_politics_p2_6_desc:0 "A formal act of ratification will settle the place of House of Commons inside the new political order. Once accepted, the Imperial Federation arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_ENG_politics_p2_7:0 "Westminster Governs by Consent"
 AOEIW9_ENG_politics_p2_7_desc:0 "Parliament will recognise that the Crown cannot bind self-governing Dominions without their ministers. Common defence will rest on consent recorded in London."
 AOEIW9_ENG_politics_p3_1:0 "§RThe People's Commonwealth§!"
 AOEIW9_ENG_politics_p3_1_desc:0 "Trade unions, cooperative societies and colonial labour parties demand a commonwealth built from below. The old imperial hierarchy will give way to workers' representation, social ownership and equal citizenship across Britain and the dominions."
 AOEIW9_ENG_politics_p3_2:0 "Mobilise the British Imperial Conference"
 AOEIW9_ENG_politics_p3_2_desc:0 "Imperial Conference will become an organising arm of the People's Commonwealth programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_ENG_politics_p3_3:0 "Shut the Dominions Office"
 AOEIW9_ENG_politics_p3_3_desc:0 "The people's government will close the office that translated imperial rank into daily administration. Relations with former Dominions will pass through equal diplomatic missions."
 AOEIW9_ENG_politics_p3_4:0 "Replace the Cabinet"
 AOEIW9_ENG_politics_p3_4_desc:0 "Cabinet will be removed from its gatekeeping role and replaced with officials loyal to the People's Commonwealth settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_ENG_politics_p3_5:0 "Command the House of Commons"
 AOEIW9_ENG_politics_p3_5_desc:0 "House of Commons will answer directly to the authorities created by the People's Commonwealth path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_ENG_politics_p3_6:0 "Reshape the House of Lords"
 AOEIW9_ENG_politics_p3_6_desc:0 "House of Lords survives, but on new terms. Its composition and powers will be altered so that it reinforces the People's Commonwealth settlement instead of preserving the old balance."
 AOEIW9_ENG_politics_p3_7:0 "Britain Belongs to Its People"
 AOEIW9_ENG_politics_p3_7_desc:0 "The new commonwealth claims its authority from voters, unions and municipalities rather than possession overseas. London will offer association without imperial command."
 AOEIW9_ENG_politics_settlement:0 "The Machinery of Empire"
 AOEIW9_ENG_politics_settlement_desc:0 "The chosen settlement gives House of Commons, House of Lords and Privy Council a defined chain of authority instead of overlapping vetoes. the British Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_ENG_eco_root:0 "The Midlands Factories Review"
 AOEIW9_ENG_eco_root_desc:0 "Midlands Factories, Clyde Shipyards and Manchester Industry do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the British Empire can expand fastest."
 AOEIW9_ENG_eco_civ_1:0 "Survey the Midlands Factories"
 AOEIW9_ENG_eco_civ_1_desc:0 "A detailed survey of Midlands Factories will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_ENG_eco_civ_2:0 "Rails to Clyde Shipyards"
 AOEIW9_ENG_eco_civ_2_desc:0 "Rail connections serving Clyde Shipyards will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_ENG_eco_civ_3:0 "Capital for Manchester Industry"
 AOEIW9_ENG_eco_civ_3_desc:0 "State-backed credit will give Manchester Industry access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_ENG_eco_civ_4:0 "Ottawa Tariffs at Work"
 AOEIW9_ENG_eco_civ_4_desc:0 "Imperial preference will steer machinery, food and raw-material contracts toward participating markets. The Ottawa bargain now appears in order books rather than conference prose."
 AOEIW9_ENG_eco_civ_5:0 "The Welsh Coalfields Expansion"
 AOEIW9_ENG_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Welsh Coalfields. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_ENG_eco_civ_6:0 "Renew London Finance"
 AOEIW9_ENG_eco_civ_6_desc:0 "London Finance will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_ENG_eco_civ_7:0 "A Second Shift at Midlands Factories"
 AOEIW9_ENG_eco_civ_7_desc:0 "Midlands Factories has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_ENG_eco_war_1:0 "Sterling, Steel and Shells"
 AOEIW9_ENG_eco_war_1_desc:0 "The Treasury will trace how sterling receipts and preferential imports can secure steel, explosives and machine tools. Rearmament must be paid for across the same system that supplies it."
 AOEIW9_ENG_eco_war_2:0 "War Orders for Welsh Coalfields"
 AOEIW9_ENG_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Welsh Coalfields, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_ENG_eco_war_3:0 "Precision Tools for London Finance"
 AOEIW9_ENG_eco_war_3_desc:0 "Precision machine tools will be prioritised for London Finance, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_ENG_eco_war_4:0 "Expand Midlands Factories for Rearmament"
 AOEIW9_ENG_eco_war_4_desc:0 "New military production capacity will be built around Midlands Factories, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_ENG_eco_war_5:0 "Standardise Clyde Shipyards"
 AOEIW9_ENG_eco_war_5_desc:0 "Factories tied to Clyde Shipyards will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_ENG_eco_war_6:0 "Night Production at Manchester Industry"
 AOEIW9_ENG_eco_war_6_desc:0 "Night production will be organised at Manchester Industry with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_ENG_eco_war_7:0 "Contracts across the Empire"
 AOEIW9_ENG_eco_war_7_desc:0 "Long contracts will give Dominion producers time to expand mines, mills and loading facilities. Whitehall receives dependable supply and accepts obligations to its partners."
 AOEIW9_ENG_eco_war_8:0 "Mobilise Welsh Coalfields for Full Production"
 AOEIW9_ENG_eco_war_8_desc:0 "Welsh Coalfields will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_ENG_eco_science_1:0 "Endow Royal Society"
 AOEIW9_ENG_eco_science_1_desc:0 "Stable public funding will give Royal Society laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_ENG_eco_science_2:0 "New Laboratories at Cambridge Laboratories"
 AOEIW9_ENG_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Cambridge Laboratories. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_ENG_eco_science_3:0 "Applied Research at Admiralty Research Department"
 AOEIW9_ENG_eco_science_3_desc:0 "Admiralty Research Department will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_ENG_eco_science_4:0 "Industrial Physics at Royal Society"
 AOEIW9_ENG_eco_science_4_desc:0 "Industrial physics at Royal Society will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_ENG_eco_science_5:0 "Production Science at Cambridge Laboratories"
 AOEIW9_ENG_eco_science_5_desc:0 "Researchers at Cambridge Laboratories will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_ENG_eco_science_6:0 "Research Grants for Admiralty Research Department"
 AOEIW9_ENG_eco_science_6_desc:0 "A national grant programme will connect Admiralty Research Department to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_ENG_eco_science_7:0 "Link Royal Society to the Factories"
 AOEIW9_ENG_eco_science_7_desc:0 "Royal Society will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_ENG_eco_infra_1:0 "Energy for Manchester Industry"
 AOEIW9_ENG_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Manchester Industry, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_ENG_eco_infra_2:0 "Clear the Goods through Liverpool"
 AOEIW9_ENG_eco_infra_2_desc:0 "Liverpool will receive extra sidings, cranes and warehouses for preferential cargo. Tariff policy means little while goods wait outside a crowded port."
 AOEIW9_ENG_eco_infra_3:0 "Workers' Housing at Welsh Coalfields"
 AOEIW9_ENG_eco_infra_3_desc:0 "Worker housing near Welsh Coalfields will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_ENG_eco_infra_4:0 "Logistics through London Finance"
 AOEIW9_ENG_eco_infra_4_desc:0 "London Finance will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_ENG_eco_final:0 "The Imperial Production System"
 AOEIW9_ENG_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a british economy able to convert regional strengths into sustained national output."
 AOEIW9_ENG_mil_root:0 "Review the Imperial General Staff in British Empire"
 AOEIW9_ENG_mil_root_desc:0 "The Imperial General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms. For Britain, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_ENG_mil_army_1:0 "The Salisbury Plain Exercises"
 AOEIW9_ENG_mil_army_1_desc:0 "Regulars and Territorials will test mobilisation, wireless sets and supply columns on Salisbury Plain. The War Office will write doctrine from failures observed in the field."
 AOEIW9_ENG_mil_army_2:0 "The Professional Expeditionary Army"
 AOEIW9_ENG_mil_army_2_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_ENG_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_ENG_mil_army_3_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_ENG_mil_army_4_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_5:0 "Independent Armoured Divisions"
 AOEIW9_ENG_mil_army_5_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_ENG_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_ENG_mil_army_6_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_ENG_mil_army_7_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_8:0 "One Supply Service"
 AOEIW9_ENG_mil_army_8_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_ENG_mil_army_9_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_ENG_mil_army_10_desc:0 "Britain must balance a deployable infantry force against the shipping and workshop demands of an armoured expedition. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ENG_mil_air_1:0 "Reorganise Royal Air Force"
 AOEIW9_ENG_mil_air_1_desc:0 "Royal Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_ENG_mil_air_2:0 "Fighter Instruction at Fighter Command"
 AOEIW9_ENG_mil_air_2_desc:0 "Fighter Command will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_ENG_mil_air_3:0 "Ground Support Doctrine under Bomber Command"
 AOEIW9_ENG_mil_air_3_desc:0 "Bomber Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_ENG_mil_air_4:0 "Extend the Range of Royal Air Force"
 AOEIW9_ENG_mil_air_4_desc:0 "Royal Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the British Empire's geography and strategic commitments."
 AOEIW9_ENG_mil_air_5:0 "Radar Networks for Fighter Command"
 AOEIW9_ENG_mil_air_5_desc:0 "Fighter Command will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_ENG_mil_air_6:0 "Unify Command under Bomber Command"
 AOEIW9_ENG_mil_air_6_desc:0 "Bomber Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_ENG_mil_air_7:0 "Royal Air Force Comes of Age"
 AOEIW9_ENG_mil_air_7_desc:0 "Royal Air Force now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_ENG_mil_sea_1:0 "Review Royal Navy"
 AOEIW9_ENG_mil_sea_1_desc:0 "A full review of Royal Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_ENG_mil_sea_2:0 "Expand Portsmouth Dockyard"
 AOEIW9_ENG_mil_sea_2_desc:0 "Portsmouth Dockyard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_ENG_mil_sea_3:0 "Fleet Manoeuvres with Home Fleet"
 AOEIW9_ENG_mil_sea_3_desc:0 "Fleet exercises with Home Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_ENG_mil_sea_4:0 "Screening Doctrine for Royal Navy"
 AOEIW9_ENG_mil_sea_4_desc:0 "Royal Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_ENG_mil_sea_5:0 "Naval Aviation at Portsmouth Dockyard"
 AOEIW9_ENG_mil_sea_5_desc:0 "Naval aviation will be integrated with Portsmouth Dockyard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_ENG_mil_sea_6:0 "New Hulls for Home Fleet"
 AOEIW9_ENG_mil_sea_6_desc:0 "New hull standards for Home Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_ENG_mil_sea_7:0 "Sea Command under Royal Navy"
 AOEIW9_ENG_mil_sea_7_desc:0 "Royal Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the British Empire. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_ENG_mil_final:0 "British Combined-Arms Doctrine"
 AOEIW9_ENG_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the British Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_ENG_dip_root:0 "Define the Imperial Grand Strategy"
 AOEIW9_ENG_dip_root_desc:0 "The British Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_ENG_dip_a_1:0 "The Atlantic Rivalry"
 AOEIW9_ENG_dip_a_1_desc:0 "The Atlantic Rivalry will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the British Empire actually wants before pressure is applied."
 AOEIW9_ENG_dip_a_2:0 "Send a Mission on the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Atlantic Rivalry. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ENG_dip_a_3:0 "Economic Leverage over the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Atlantic Rivalry. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_ENG_dip_a_4:0 "Staff Talks on the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Atlantic Rivalry. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ENG_dip_a_5:0 "A Formal Warning over the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_5_desc:0 "A formal warning over the Atlantic Rivalry will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ENG_dip_a_6:0 "Terms for the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_6_desc:0 "Terms for an ultimatum on the Atlantic Rivalry will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_ENG_dip_a_7:0 "The Decision on the Atlantic Rivalry"
 AOEIW9_ENG_dip_a_7_desc:0 "The government reaches the decision point on the Atlantic Rivalry. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_ENG_dip_b_1:0 "Continental Commitments"
 AOEIW9_ENG_dip_b_1_desc:0 "Continental Commitments will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the British Empire actually wants before pressure is applied."
 AOEIW9_ENG_dip_b_2:0 "Send a Mission on Continental Commitments"
 AOEIW9_ENG_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Continental Commitments. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ENG_dip_b_3:0 "Economic Leverage over Continental Commitments"
 AOEIW9_ENG_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Continental Commitments. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_ENG_dip_b_4:0 "Staff Talks on Continental Commitments"
 AOEIW9_ENG_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Continental Commitments. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ENG_dip_b_5:0 "A Formal Warning over Continental Commitments"
 AOEIW9_ENG_dip_b_5_desc:0 "A formal warning over Continental Commitments will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ENG_dip_b_6:0 "Terms for Continental Commitments"
 AOEIW9_ENG_dip_b_6_desc:0 "Terms for an ultimatum on Continental Commitments will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_ENG_dip_b_7:0 "The Decision on Continental Commitments"
 AOEIW9_ENG_dip_b_7_desc:0 "The government reaches the decision point on Continental Commitments. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_ENG_dip_final:0 "The Empire's Global Commitments"
 AOEIW9_ENG_dip_final_desc:0 "The British Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_ETH_focus_tree:0 "Ethiopian Empire Focus Tree"
 AOEIW9_ETH_politics_p1_2:0 "Reconcile the Provincial Rases"
 AOEIW9_ETH_politics_p1_2_desc:0 "Provincial Rases has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Imperial Reform programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_ETH_politics_p1_3:0 "Reform the Crown Council"
 AOEIW9_ETH_politics_p1_3_desc:0 "Crown Council still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Imperial Reform settlement."
 AOEIW9_ETH_politics_p1_4:0 "Bind the Addis Ababa Cabinet"
 AOEIW9_ETH_politics_p1_4_desc:0 "Addis Ababa Cabinet will be tied to the Imperial Reform programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_ETH_politics_p1_5:0 "The Ethiopian Imperial Court and Nation"
 AOEIW9_ETH_politics_p1_5_desc:0 "Imperial Court will be presented as part of the national political order rather than a factional institution. The Imperial Reform camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_ETH_politics_p2_2:0 "Open the Crown Council"
 AOEIW9_ETH_politics_p2_2_desc:0 "Access to Crown Council will be widened and its procedures made less dependent on closed patronage. The reform gives the Council of Notables camp a legal route to broaden its support without bypassing the state."
 AOEIW9_ETH_politics_p2_3:0 "Guarantee the Addis Ababa Cabinet"
 AOEIW9_ETH_politics_p2_3_desc:0 "The position of Addis Ababa Cabinet will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Council of Notables settlement."
 AOEIW9_ETH_politics_p2_4:0 "Broaden the Clergy"
 AOEIW9_ETH_politics_p2_4_desc:0 "Clergy will receive a wider role in consultation, administration and mobilisation. The Council of Notables project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_ETH_politics_p2_5:0 "A New Charter for Ethiopian Empire"
 AOEIW9_ETH_politics_p2_5_desc:0 "A new constitutional charter will turn the Council of Notables programme into a durable framework for the Ethiopian Empire. The document defines authority, representation and the limits of emergency power."
 AOEIW9_ETH_politics_p3_2:0 "Mobilise the Addis Ababa Cabinet"
 AOEIW9_ETH_politics_p3_2_desc:0 "Addis Ababa Cabinet will become an organising arm of the Ethiopian Young Officers programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_ETH_politics_p3_3:0 "Break the Clergy"
 AOEIW9_ETH_politics_p3_3_desc:0 "The independent power of Clergy is incompatible with the Ethiopian Young Officers project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_ETH_politics_p3_4:0 "Replace the Modernist Officers"
 AOEIW9_ETH_politics_p3_4_desc:0 "Modernist Officers will be removed from its gatekeeping role and replaced with officials loyal to the Ethiopian Young Officers settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_ETH_politics_p3_5:0 "The Ethiopian Young Officers Settlement"
 AOEIW9_ETH_politics_p3_5_desc:0 "The political struggle around The Young Officers reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Ethiopian Young Officers order."
 AOEIW9_ETH_politics_settlement:0 "The Addis Ababa Settlement"
 AOEIW9_ETH_politics_settlement_desc:0 "The chosen settlement gives Imperial Court, Provincial Rases and Crown Council a defined chain of authority instead of overlapping vetoes. the Ethiopian Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_ETH_eco_root:0 "The Addis Workshops Review"
 AOEIW9_ETH_eco_root_desc:0 "Addis Workshops, Djibouti Railway and Highland Roads do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Ethiopian Empire can expand fastest."
 AOEIW9_ETH_eco_civ_2:0 "Rails to Djibouti Railway"
 AOEIW9_ETH_eco_civ_2_desc:0 "Rail connections serving Djibouti Railway will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_ETH_eco_civ_5:0 "The Awash Development Expansion"
 AOEIW9_ETH_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Awash Development. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_ETH_eco_civ_6:0 "Renew Imperial Treasury"
 AOEIW9_ETH_eco_civ_6_desc:0 "Imperial Treasury will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_ETH_eco_civ_7:0 "A Second Shift at Addis Workshops"
 AOEIW9_ETH_eco_civ_7_desc:0 "Addis Workshops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_ETH_eco_civ_8:0 "Public Works at Djibouti Railway"
 AOEIW9_ETH_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Djibouti Railway will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_ETH_eco_civ_9:0 "The Highland Roads Development Board"
 AOEIW9_ETH_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Highland Roads. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_ETH_eco_war_1:0 "The Ethiopian Coffee Export Board Armaments Audit"
 AOEIW9_ETH_eco_war_1_desc:0 "An armaments audit will determine which parts of Coffee Export Board can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed. In Ethiopia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_ETH_eco_war_2:0 "War Orders for Awash Development"
 AOEIW9_ETH_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Awash Development, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_ETH_eco_war_3:0 "Precision Tools for Imperial Treasury"
 AOEIW9_ETH_eco_war_3_desc:0 "Precision machine tools will be prioritised for Imperial Treasury, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_ETH_eco_war_4:0 "Expand Addis Workshops for Rearmament"
 AOEIW9_ETH_eco_war_4_desc:0 "New military production capacity will be built around Addis Workshops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_ETH_eco_war_5:0 "Standardise Djibouti Railway"
 AOEIW9_ETH_eco_war_5_desc:0 "Factories tied to Djibouti Railway will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_ETH_eco_war_6:0 "Night Production at Highland Roads"
 AOEIW9_ETH_eco_war_6_desc:0 "Night production will be organised at Highland Roads with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_ETH_eco_science_1:0 "Endow Haile Selassie University"
 AOEIW9_ETH_eco_science_1_desc:0 "Stable public funding will give Haile Selassie University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_ETH_eco_science_2:0 "New Ethiopian Laboratories at Imperial Technical School"
 AOEIW9_ETH_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Imperial Technical School. The enlarged institution will work directly with industry so that research can move from paper to production. In Ethiopia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_ETH_eco_science_3:0 "Applied Research at Addis Research Bureau"
 AOEIW9_ETH_eco_science_3_desc:0 "Addis Research Bureau will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_ETH_eco_science_4:0 "Industrial Physics at Haile Selassie University"
 AOEIW9_ETH_eco_science_4_desc:0 "Industrial physics at Haile Selassie University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_ETH_eco_science_5:0 "Ethiopian Production Science at Imperial Technical School"
 AOEIW9_ETH_eco_science_5_desc:0 "Researchers at Imperial Technical School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers. In Ethiopia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_ETH_eco_infra_2:0 "Ethiopian Freight Capacity at Coffee Export Board"
 AOEIW9_ETH_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Coffee Export Board will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories. In Ethiopia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_ETH_eco_infra_3:0 "Workers' Housing at Awash Development"
 AOEIW9_ETH_eco_infra_3_desc:0 "Worker housing near Awash Development will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_ETH_eco_infra_4:0 "Logistics through Imperial Treasury"
 AOEIW9_ETH_eco_infra_4_desc:0 "Imperial Treasury will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_ETH_eco_final:0 "An Ethiopian Modernisation Economy"
 AOEIW9_ETH_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a ethiopian economy able to convert regional strengths into sustained national output."
 AOEIW9_ETH_mil_root:0 "Review the Imperial Ethiopian Army"
 AOEIW9_ETH_mil_root_desc:0 "The Imperial Ethiopian Army must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_ETH_mil_army_2:0 "Kebur Zabagna Field Manoeuvres"
 AOEIW9_ETH_mil_army_2_desc:0 "Large field exercises with the Kebur Zabagna will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_ETH_mil_army_5:0 "Motorise the Officer School"
 AOEIW9_ETH_mil_army_5_desc:0 "Motor transport assigned to the Officer School will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_ETH_mil_army_6:0 "Staff Procedures at the Imperial Ethiopian Army"
 AOEIW9_ETH_mil_army_6_desc:0 "Staff officers at the Imperial Ethiopian Army will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_ETH_mil_army_7:0 "Armour Studies at the Kebur Zabagna"
 AOEIW9_ETH_mil_army_7_desc:0 "The Kebur Zabagna will study how armour can be integrated with infantry, artillery and logistics under ethiopian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_ETH_mil_air_1:0 "Reorganise Ethiopian Air Arm"
 AOEIW9_ETH_mil_air_1_desc:0 "Ethiopian Air Arm will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_ETH_mil_air_2:0 "Fighter Instruction at Addis Flying School"
 AOEIW9_ETH_mil_air_2_desc:0 "Addis Flying School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_ETH_mil_air_3:0 "Ground Support Doctrine under Highland Air Command"
 AOEIW9_ETH_mil_air_3_desc:0 "Highland Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_ETH_mil_air_4:0 "Extend the Range of Ethiopian Air Arm"
 AOEIW9_ETH_mil_air_4_desc:0 "Ethiopian Air Arm will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Ethiopian Empire's geography and strategic commitments."
 AOEIW9_ETH_mil_air_5:0 "Radar Networks for Addis Flying School"
 AOEIW9_ETH_mil_air_5_desc:0 "Addis Flying School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_ETH_mil_special_1:0 "Expand the Red Sea Procurement"
 AOEIW9_ETH_mil_special_1_desc:0 "Red Sea Procurement will receive the transport, depots and procurement authority needed to function as a real military capability. Expansion is tied to supply and readiness rather than another paper formation."
 AOEIW9_ETH_mil_special_2:0 "Train the Massawa Ambition"
 AOEIW9_ETH_mil_special_2_desc:0 "The formations associated with Massawa Ambition will receive dedicated training for the terrain and mission they are expected to face. Exercises focus on practical readiness instead of ceremonial strength."
 AOEIW9_ETH_mil_special_3:0 "Fortify with the Imperial Transport Service"
 AOEIW9_ETH_mil_special_3_desc:0 "Imperial Transport Service will be integrated into a deliberate fortification plan with supply points, prepared positions and engineering support. Defensive terrain becomes useful only when troops can occupy and sustain it."
 AOEIW9_ETH_mil_special_4:0 "Mountain Logistics for the Red Sea Procurement"
 AOEIW9_ETH_mil_special_4_desc:0 "Pack transport, mountain roads, depots and specialist supply units will support Red Sea Procurement. The programme is designed to keep formations moving where ordinary motor transport cannot be relied upon."
 AOEIW9_ETH_mil_special_5:0 "Mobile Reserve of the Massawa Ambition"
 AOEIW9_ETH_mil_special_5_desc:0 "A mobile reserve will be organised around Massawa Ambition so that local defensive strength can be shifted toward a threatened sector. Mobility turns static preparations into an operational system."
 AOEIW9_ETH_mil_final:0 "Ethiopian Mountain Defence Doctrine"
 AOEIW9_ETH_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Ethiopian Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_ETH_dip_root:0 "Define the Highland Doctrine"
 AOEIW9_ETH_dip_root_desc:0 "The Ethiopian Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_ETH_dip_a_2:0 "Send a Mission on the Italian Threat"
 AOEIW9_ETH_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Italian Threat. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ETH_dip_a_3:0 "Economic Leverage over the Italian Threat"
