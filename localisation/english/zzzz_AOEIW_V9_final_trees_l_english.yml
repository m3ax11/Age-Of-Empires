 AOEIW9_SOV_dip_b_7_desc:0 "The government reaches the decision point on the Ottoman Question. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_SOV_dip_final:0 "The Frontiers of the Russian Empire"
 AOEIW9_SOV_dip_final_desc:0 "The Russian Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SOV_special_1:0 "The Siberian Industrial Arc"
 AOEIW9_SOV_special_1_desc:0 "The Siberian Industrial Arc addresses a strategic problem that is specific to the Russian Empire. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_SOV_special_2:0 "Ural Heavy Industry"
 AOEIW9_SOV_special_2_desc:0 "The government will turn Ural Heavy Industry into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Russian Empire's situation rather than from a universal template."
 AOEIW9_SOV_special_3:0 "Oil Trains from Baku"
 AOEIW9_SOV_special_3_desc:0 "Tank cars and guarded schedules will carry Caucasian fuel to army depots and industrial centres. Production at the wells matters only when oil reaches an engine."
 AOEIW9_SOV_special_4:0 "Trans-Siberian Double Track"
 AOEIW9_SOV_special_4_desc:0 "By pursuing Trans-Siberian Double Track, the Russian Empire commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_SOV_special_5:0 "Mobilise the Interior"
 AOEIW9_SOV_special_5_desc:0 "Mobilise the Interior addresses a strategic problem that is specific to the Russian Empire. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_SOV_special_6:0 "Strategic Depth"
 AOEIW9_SOV_special_6_desc:0 "The government will turn Strategic Depth into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Russian Empire's situation rather than from a universal template."
 AOEIW9_SOV_special_7:0 "The Arsenal Beyond the Urals"
 AOEIW9_SOV_special_7_desc:0 "The Arsenal Beyond the Urals links economic capacity, planning and military requirements that already exist in the Russian Empire. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_SOV_special_8:0 "Russia as an Industrial Colossus"
 AOEIW9_SOV_special_8_desc:0 "By pursuing Russia as an Industrial Colossus, the Russian Empire commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_SPR_focus_tree:0 "Spanish Empire Focus Tree"
 AOEIW9_SPR_politics_p1_2:0 "Reconcile the Spanish Cortes"
 AOEIW9_SPR_politics_p1_2_desc:0 "Cortes has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Spanish Constitutional Monarchy programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_SPR_politics_p1_3:0 "Officers before the Cortes"
 AOEIW9_SPR_politics_p1_3_desc:0 "Senior officers will answer questions on appointments, budgets and loyalty before the Cortes. The army may defend the Crown without governing in its name."
 AOEIW9_SPR_politics_p1_4:0 "Bind the Catalan Deputation"
 AOEIW9_SPR_politics_p1_4_desc:0 "Catalan Deputation will be tied to the Spanish Constitutional Monarchy programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_SPR_politics_p1_5:0 "Balance the Basque Councils"
 AOEIW9_SPR_politics_p1_5_desc:0 "Neither abolishing Basque Councils nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Spanish Constitutional Monarchy coalition."
 AOEIW9_SPR_politics_p1_6:0 "The Spanish Crown and Nation"
 AOEIW9_SPR_politics_p1_6_desc:0 "Royal Palace will be presented as part of the national political order rather than a factional institution. The Spanish Constitutional Monarchy camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_SPR_politics_p2_2:0 "Open the Officers’ Promotions"
 AOEIW9_SPR_politics_p2_2_desc:0 "Promotion lists and commands will be examined under rules published to the Cortes. Factional patrons can no longer build private armies through sealed files."
 AOEIW9_SPR_politics_p2_3:0 "Guarantee the Catalan Deputation"
 AOEIW9_SPR_politics_p2_3_desc:0 "The position of Catalan Deputation will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Royal Authoritarianism settlement."
 AOEIW9_SPR_politics_p2_4:0 "Broaden the Basque Councils"
 AOEIW9_SPR_politics_p2_4_desc:0 "Basque Councils will receive a wider role in consultation, administration and mobilisation. The Royal Authoritarianism project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_SPR_politics_p2_5:0 "Entrust the Industrial Syndicates"
 AOEIW9_SPR_politics_p2_5_desc:0 "Responsibility now shifts toward Industrial Syndicates, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Royal Authoritarianism system can govern through delegated institutions."
 AOEIW9_SPR_politics_p2_6:0 "A Constitution under Alfonso XIII"
 AOEIW9_SPR_politics_p2_6_desc:0 "The Crown will swear to defined powers, elected Cortes and regional guarantees. Alfonso remains king by accepting rules that outlast a cabinet."
 AOEIW9_SPR_politics_p3_2:0 "Mobilise the Catalan Deputation"
 AOEIW9_SPR_politics_p3_2_desc:0 "Catalan Deputation will become an organising arm of the National Syndicalists programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_SPR_politics_p3_3:0 "Break the Basque Councils"
 AOEIW9_SPR_politics_p3_3_desc:0 "The independent power of Basque Councils is incompatible with the National Syndicalists project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_SPR_politics_p3_4:0 "Replace the Industrial Syndicates"
 AOEIW9_SPR_politics_p3_4_desc:0 "Industrial Syndicates will be removed from its gatekeeping role and replaced with officials loyal to the National Syndicalists settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_SPR_politics_p3_5:0 "Command the Spanish Royal Palace"
 AOEIW9_SPR_politics_p3_5_desc:0 "Royal Palace will answer directly to the authorities created by the National Syndicalists path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_SPR_politics_p3_6:0 "The Twenty-Seven Points"
 AOEIW9_SPR_politics_p3_6_desc:0 "National Syndicalists proclaim the Falangist programme as the law of the new state. Unions, municipalities and officers will be judged by service to national unity."
 AOEIW9_SPR_politics_settlement:0 "The Crown and the Cortes Settled"
 AOEIW9_SPR_politics_settlement_desc:0 "The chosen settlement gives Royal Palace, Cortes and Army Directorate a defined chain of authority instead of overlapping vetoes. the Spanish Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_SPR_eco_root:0 "The Catalan Industry Review"
 AOEIW9_SPR_eco_root_desc:0 "Catalan Industry, Basque Steel and Asturian Coal do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Spanish Empire can expand fastest."
 AOEIW9_SPR_eco_civ_2:0 "Rails to Basque Steel"
 AOEIW9_SPR_eco_civ_2_desc:0 "Rail connections serving Basque Steel will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_SPR_eco_civ_5:0 "The Barcelona Docks Expansion"
 AOEIW9_SPR_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Barcelona Docks. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_SPR_eco_civ_6:0 "Renew the Spanish National Railways"
 AOEIW9_SPR_eco_civ_6_desc:0 "National Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Spain, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SPR_eco_civ_7:0 "A Second Shift at Catalan Industry"
 AOEIW9_SPR_eco_civ_7_desc:0 "Catalan Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_SPR_eco_civ_8:0 "Public Works at Basque Steel"
 AOEIW9_SPR_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Basque Steel will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_SPR_eco_war_1:0 "The Madrid Workshops Armaments Audit"
 AOEIW9_SPR_eco_war_1_desc:0 "An armaments audit will determine which parts of Madrid Workshops can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_SPR_eco_war_2:0 "War Orders for Barcelona Docks"
 AOEIW9_SPR_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Barcelona Docks, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_SPR_eco_war_3:0 "Precision Tools for the Spanish National Railways"
 AOEIW9_SPR_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Spain, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SPR_eco_war_4:0 "Expand Catalan Industry for Rearmament"
 AOEIW9_SPR_eco_war_4_desc:0 "New military production capacity will be built around Catalan Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_SPR_eco_war_5:0 "Standardise Basque Steel"
 AOEIW9_SPR_eco_war_5_desc:0 "Factories tied to Basque Steel will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_SPR_eco_war_6:0 "Night Production at Asturian Coal"
 AOEIW9_SPR_eco_war_6_desc:0 "Night production will be organised at Asturian Coal with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_SPR_eco_war_7:0 "Long-Term Contracts for Madrid Workshops"
 AOEIW9_SPR_eco_war_7_desc:0 "Long-term contracts will give Madrid Workshops a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_SPR_eco_science_1:0 "Endow Complutense University"
 AOEIW9_SPR_eco_science_1_desc:0 "Stable public funding will give Complutense University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_SPR_eco_science_2:0 "New Laboratories at Barcelona Technical School"
 AOEIW9_SPR_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Barcelona Technical School. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_SPR_eco_science_3:0 "Experiments at the Instituto Nacional de Física"
 AOEIW9_SPR_eco_science_3_desc:0 "Physicists in Madrid will connect electrical and materials research with industrial problems. Grants follow testable work rather than another administrative plan."
 AOEIW9_SPR_eco_science_4:0 "Industrial Physics at Complutense University"
 AOEIW9_SPR_eco_science_4_desc:0 "Industrial physics at Complutense University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_SPR_eco_science_5:0 "Production Science at Barcelona Technical School"
 AOEIW9_SPR_eco_science_5_desc:0 "Researchers at Barcelona Technical School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_SPR_eco_science_6:0 "Keep Madrid’s Laboratories Open"
 AOEIW9_SPR_eco_science_6_desc:0 "Stable funding will carry promising experiments through failed trials and equipment shortages. Researchers can finish work before ministries demand results."
 AOEIW9_SPR_eco_infra_2:0 "Freight Capacity at Madrid Workshops"
 AOEIW9_SPR_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Madrid Workshops will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_SPR_eco_infra_3:0 "Workers' Housing at Barcelona Docks"
 AOEIW9_SPR_eco_infra_3_desc:0 "Worker housing near Barcelona Docks will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_SPR_eco_infra_4:0 "Spanish Logistics through the National Railways"
 AOEIW9_SPR_eco_infra_4_desc:0 "National Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Spain, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SPR_eco_final:0 "The Integrated Spanish Economy"
 AOEIW9_SPR_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a spanish economy able to convert regional strengths into sustained national output."
 AOEIW9_SPR_mil_root:0 "Review the Spanish General Staff"
 AOEIW9_SPR_mil_root_desc:0 "The Spanish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_SPR_mil_army_2:0 "Army of Africa Field Manoeuvres"
 AOEIW9_SPR_mil_army_2_desc:0 "Large field exercises with the Army of Africa will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_SPR_mil_army_5:0 "Motorise the Toledo Military Academy"
 AOEIW9_SPR_mil_army_5_desc:0 "Motor transport assigned to the Toledo Military Academy will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_SPR_mil_army_6:0 "Staff Procedures at the Spanish General Staff"
 AOEIW9_SPR_mil_army_6_desc:0 "Staff officers at the Spanish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_SPR_mil_army_7:0 "Armour Studies at the Army of Africa"
 AOEIW9_SPR_mil_army_7_desc:0 "The Army of Africa will study how armour can be integrated with infantry, artillery and logistics under spanish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_SPR_mil_army_8:0 "Operational Planning at the Peninsular Army"
 AOEIW9_SPR_mil_army_8_desc:0 "Operational planning with the Peninsular Army will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_SPR_mil_army_9:0 "Gunnery at Segovia"
 AOEIW9_SPR_mil_army_9_desc:0 "The Artillery Academy at Segovia will standardise firing tables, observation and ammunition practice. Doctrine will be tested by batteries in the field."
 AOEIW9_SPR_mil_air_1:0 "Reorganise Spanish Air Force"
 AOEIW9_SPR_mil_air_1_desc:0 "Spanish Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_SPR_mil_air_2:0 "Fighter Instruction at Getafe Air Base"
 AOEIW9_SPR_mil_air_2_desc:0 "Getafe Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_SPR_mil_air_3:0 "Ground Support Doctrine under Iberian Air Command"
 AOEIW9_SPR_mil_air_3_desc:0 "Iberian Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_SPR_mil_air_4:0 "Extend the Range of Spanish Air Force"
 AOEIW9_SPR_mil_air_4_desc:0 "Spanish Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Spanish Empire's geography and strategic commitments."
 AOEIW9_SPR_mil_air_5:0 "Radar Networks for Getafe Air Base"
 AOEIW9_SPR_mil_air_5_desc:0 "Getafe Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_SPR_mil_air_6:0 "Unify Command under Iberian Air Command"
 AOEIW9_SPR_mil_air_6_desc:0 "Iberian Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_SPR_mil_sea_1:0 "Review Spanish Navy"
 AOEIW9_SPR_mil_sea_1_desc:0 "A full review of Spanish Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_SPR_mil_sea_2:0 "Expand Ferrol Arsenal"
 AOEIW9_SPR_mil_sea_2_desc:0 "Ferrol Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_SPR_mil_sea_3:0 "Fleet Manoeuvres with Mediterranean Squadron"
 AOEIW9_SPR_mil_sea_3_desc:0 "Fleet exercises with Mediterranean Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_SPR_mil_sea_4:0 "Screening Doctrine for Spanish Navy"
 AOEIW9_SPR_mil_sea_4_desc:0 "Spanish Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_SPR_mil_sea_5:0 "Naval Aviation at Ferrol Arsenal"
 AOEIW9_SPR_mil_sea_5_desc:0 "Naval aviation will be integrated with Ferrol Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_SPR_mil_sea_6:0 "New Hulls for Mediterranean Squadron"
 AOEIW9_SPR_mil_sea_6_desc:0 "New hull standards for Mediterranean Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_SPR_mil_final:0 "Spanish Combined-Arms Doctrine"
 AOEIW9_SPR_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Spanish Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_SPR_dip_root:0 "Define the Iberian Doctrine"
 AOEIW9_SPR_dip_root_desc:0 "The Spanish Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_SPR_dip_a_2:0 "Send a Mission on the French Frontier"
 AOEIW9_SPR_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the French Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SPR_dip_a_3:0 "Economic Leverage over the French Frontier"
 AOEIW9_SPR_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the French Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SPR_dip_a_4:0 "Staff Talks on the French Frontier"
 AOEIW9_SPR_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the French Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SPR_dip_a_5:0 "A Formal Warning over the French Frontier"
 AOEIW9_SPR_dip_a_5_desc:0 "A formal warning over the French Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SPR_dip_a_6:0 "Terms for the French Frontier"
 AOEIW9_SPR_dip_a_6_desc:0 "Terms for an ultimatum on the French Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_SPR_dip_b_1:0 "The Portuguese Question"
 AOEIW9_SPR_dip_b_1_desc:0 "The Portuguese Question will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Spanish Empire actually wants before pressure is applied."
 AOEIW9_SPR_dip_b_2:0 "Send a Mission on the Portuguese Question"
 AOEIW9_SPR_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Portuguese Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SPR_dip_b_3:0 "Economic Leverage over the Portuguese Question"
 AOEIW9_SPR_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Portuguese Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SPR_dip_b_4:0 "Staff Talks on the Portuguese Question"
 AOEIW9_SPR_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Portuguese Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SPR_dip_b_5:0 "A Formal Warning over the Portuguese Question"
 AOEIW9_SPR_dip_b_5_desc:0 "A formal warning over the Portuguese Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SPR_dip_b_6:0 "Terms for the Portuguese Question"
 AOEIW9_SPR_dip_b_6_desc:0 "Terms for an ultimatum on the Portuguese Question will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_SPR_dip_final:0 "Spain Between the Blocs"
 AOEIW9_SPR_dip_final_desc:0 "The Spanish Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SWE_focus_tree:0 "Kingdom of Sweden Focus Tree"
 AOEIW9_SWE_politics_p1_2:0 "Reconcile the Royal Court"
 AOEIW9_SWE_politics_p1_2_desc:0 "Royal Court has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Parliamentary Settlement programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_SWE_politics_p1_3:0 "Reform the Social Democrats"
 AOEIW9_SWE_politics_p1_3_desc:0 "Social Democrats still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Parliamentary Settlement settlement."
 AOEIW9_SWE_politics_p1_4:0 "Bind the Industrialists"
 AOEIW9_SWE_politics_p1_4_desc:0 "Industrialists will be tied to the Parliamentary Settlement programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_SWE_politics_p1_5:0 "Balance the County Councils"
 AOEIW9_SWE_politics_p1_5_desc:0 "Neither abolishing County Councils nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Parliamentary Settlement coalition."
 AOEIW9_SWE_politics_p1_6:0 "Riksdag and Nation"
 AOEIW9_SWE_politics_p1_6_desc:0 "Riksdag will be presented as part of the national political order rather than a factional institution. The Parliamentary Settlement camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_SWE_politics_p2_2:0 "Open the Social Democrats"
 AOEIW9_SWE_politics_p2_2_desc:0 "Access to Social Democrats will be widened and its procedures made less dependent on closed patronage. The reform gives the Swedish Royal Stewardship camp a legal route to broaden its support without bypassing the state."
 AOEIW9_SWE_politics_p2_3:0 "Guarantee the Industrialists"
 AOEIW9_SWE_politics_p2_3_desc:0 "The position of Industrialists will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Swedish Royal Stewardship settlement."
 AOEIW9_SWE_politics_p2_4:0 "Broaden the Swedish County Councils"
 AOEIW9_SWE_politics_p2_4_desc:0 "County Councils will receive a wider role in consultation, administration and mobilisation. The Swedish Royal Stewardship project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_SWE_politics_p2_5:0 "The Defence Commission Reports"
 AOEIW9_SWE_politics_p2_5_desc:0 "The commission places its figures before the Riksdag: aircraft, coastal batteries and trained reserves all cost more than the parties promised. The parliamentary bloc must now publish its priorities."
 AOEIW9_SWE_politics_p2_6:0 "The Riksdag Writes the Terms"
 AOEIW9_SWE_politics_p2_6_desc:0 "Defence appropriations will pass with limits on emergency power and a schedule of parliamentary review. Preparedness remains answerable to elected deputies."
 AOEIW9_SWE_politics_p3_2:0 "Mobilise the Industrialists"
 AOEIW9_SWE_politics_p3_2_desc:0 "Industrialists will become an organising arm of the Swedish National Mobilisation programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_SWE_politics_p3_3:0 "Break the Swedish County Councils"
 AOEIW9_SWE_politics_p3_3_desc:0 "The independent power of County Councils is incompatible with the Swedish National Mobilisation project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_SWE_politics_p3_4:0 "Dismiss the Defence Commission"
 AOEIW9_SWE_politics_p3_4_desc:0 "The commission's papers are collected and its dissenting members sent home. Operational orders will be written by officers who expect to execute them."
 AOEIW9_SWE_politics_p3_5:0 "Command the Riksdag"
 AOEIW9_SWE_politics_p3_5_desc:0 "Riksdag will answer directly to the authorities created by the Swedish National Mobilisation path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_SWE_politics_p3_6:0 "Sweden Under Orders"
 AOEIW9_SWE_politics_p3_6_desc:0 "Mobilisation registers, industrial priorities and provincial commands now answer to Stockholm. The new regime measures legitimacy by readiness."
 AOEIW9_SWE_politics_settlement:0 "A Government Ready to Mobilise"
 AOEIW9_SWE_politics_settlement_desc:0 "The constitutional struggle has produced a government able to call reserves, place contracts and defend its decisions before the country. Sweden enters the crisis with a settled chain of responsibility."
 AOEIW9_SWE_eco_root:0 "The Bofors Works Review"
 AOEIW9_SWE_eco_root_desc:0 "Bofors Works, LKAB Iron Mines and Volvo Industry do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Sweden can expand fastest."
 AOEIW9_SWE_eco_civ_2:0 "Rails to LKAB Iron Mines"
 AOEIW9_SWE_eco_civ_2_desc:0 "Rail connections serving LKAB Iron Mines will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_SWE_eco_civ_5:0 "Harness the Northern Rivers"
 AOEIW9_SWE_eco_civ_5_desc:0 "Surveyors and construction gangs will push dams and transmission lines farther north. Hydroelectric power will connect remote resources to the industrial south."
 AOEIW9_SWE_eco_civ_6:0 "Renew the Swedish State Railways"
 AOEIW9_SWE_eco_civ_6_desc:0 "State Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Sweden, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWE_eco_civ_7:0 "A Second Shift at Bofors Works"
 AOEIW9_SWE_eco_civ_7_desc:0 "Bofors Works has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_SWE_eco_civ_8:0 "Public Works at LKAB Iron Mines"
 AOEIW9_SWE_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around LKAB Iron Mines will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_SWE_eco_war_1:0 "The Gothenburg Shipyards Armaments Audit"
 AOEIW9_SWE_eco_war_1_desc:0 "An armaments audit will determine which parts of Gothenburg Shipyards can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_SWE_eco_war_2:0 "Power for the Armament Plants"
 AOEIW9_SWE_eco_war_2_desc:0 "New generating capacity will be reserved for steel, explosives and machine tools when mobilisation begins. The factories will not wait for coal imports that may never arrive."
 AOEIW9_SWE_eco_war_3:0 "Precision Tools for the Swedish State Railways"
 AOEIW9_SWE_eco_war_3_desc:0 "Precision machine tools will be prioritised for State Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Sweden, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWE_eco_war_4:0 "Expand Bofors Works for Rearmament"
 AOEIW9_SWE_eco_war_4_desc:0 "New military production capacity will be built around Bofors Works, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_SWE_eco_war_5:0 "Standardise LKAB Iron Mines"
 AOEIW9_SWE_eco_war_5_desc:0 "Factories tied to LKAB Iron Mines will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_SWE_eco_war_6:0 "Night Production at Volvo Industry"
 AOEIW9_SWE_eco_war_6_desc:0 "Night production will be organised at Volvo Industry with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_SWE_eco_war_7:0 "Long-Term Contracts for Gothenburg Shipyards"
 AOEIW9_SWE_eco_war_7_desc:0 "Long-term contracts will give Gothenburg Shipyards a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_SWE_eco_science_1:0 "Endow Royal Institute of Technology"
 AOEIW9_SWE_eco_science_1_desc:0 "Stable public funding will give Royal Institute of Technology laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_SWE_eco_science_2:0 "New Laboratories at Uppsala University"
 AOEIW9_SWE_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Uppsala University. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_SWE_eco_science_3:0 "KTH Opens Its Workshops"
 AOEIW9_SWE_eco_science_3_desc:0 "The Royal Institute of Technology will share test rooms and instruments with firms solving immediate production problems. Engineers will carry results from Stockholm directly to the shop floor."
 AOEIW9_SWE_eco_science_4:0 "Industrial Physics at Royal Institute of Technology"
 AOEIW9_SWE_eco_science_4_desc:0 "Industrial physics at Royal Institute of Technology will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_SWE_eco_science_5:0 "Production Science at Uppsala University"
 AOEIW9_SWE_eco_science_5_desc:0 "Researchers at Uppsala University will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_SWE_eco_science_6:0 "Grants for Swedish Engineers"
 AOEIW9_SWE_eco_science_6_desc:0 "Promising work in metallurgy, radio and turbines will receive multi-year grants. Researchers can now finish prototypes instead of chasing the next short contract."
 AOEIW9_SWE_eco_infra_2:0 "Freight Capacity at Gothenburg Shipyards"
 AOEIW9_SWE_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Gothenburg Shipyards will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_SWE_eco_infra_3:0 "Homes Beside the Dams"
 AOEIW9_SWE_eco_infra_3_desc:0 "New power stations need permanent crews in districts with little housing. The state will build homes, clinics and roads alongside the turbines."
 AOEIW9_SWE_eco_infra_4:0 "Swedish Logistics through the State Railways"
 AOEIW9_SWE_eco_infra_4_desc:0 "State Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Sweden, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWE_eco_final:0 "Iron, Power and Workshops"
 AOEIW9_SWE_eco_final_desc:0 "Ore from the north, electricity from the rivers and precision work at Bofors now feed one another. Sweden can sustain both exports and a serious defence effort."
 AOEIW9_SWE_mil_root:0 "Review the Swedish General Staff"
 AOEIW9_SWE_mil_root_desc:0 "The Swedish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_SWE_mil_army_2:0 "Norrland Regiments Field Manoeuvres"
 AOEIW9_SWE_mil_army_2_desc:0 "Large field exercises with the Norrland Regiments will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
