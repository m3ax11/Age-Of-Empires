 AOEIW9_CHI_dip_a_7:0 "The Decision on the Japanese Menace"
 AOEIW9_CHI_dip_a_7_desc:0 "The government reaches the decision point on the Japanese Menace. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_CHI_dip_b_1:0 "The Northern Frontier"
 AOEIW9_CHI_dip_b_1_desc:0 "The Northern Frontier will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Chinese Empire actually wants before pressure is applied."
 AOEIW9_CHI_dip_b_2:0 "Send a Mission on the Northern Frontier"
 AOEIW9_CHI_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Northern Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_CHI_dip_b_3:0 "Economic Leverage over the Northern Frontier"
 AOEIW9_CHI_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Northern Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_CHI_dip_b_4:0 "Staff Talks on the Northern Frontier"
 AOEIW9_CHI_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Northern Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_CHI_dip_b_5:0 "A Formal Warning over the Northern Frontier"
 AOEIW9_CHI_dip_b_5_desc:0 "A formal warning over the Northern Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_CHI_dip_b_6:0 "Terms for the Northern Frontier"
 AOEIW9_CHI_dip_b_6_desc:0 "Terms for an ultimatum on the Northern Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_CHI_dip_b_7:0 "The Decision on the Northern Frontier"
 AOEIW9_CHI_dip_b_7_desc:0 "The government reaches the decision point on the Northern Frontier. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_CHI_dip_final:0 "The Empire's Foreign Policy"
 AOEIW9_CHI_dip_final_desc:0 "The Chinese Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_DEN_focus_tree:0 "Kingdom of Denmark Focus Tree"
 AOEIW9_DEN_politics_p1_2:0 "Reconcile the Folketing"
 AOEIW9_DEN_politics_p1_2_desc:0 "Folketing has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Danish Constitutional Crown programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_DEN_politics_p1_3:0 "Reform the Landsting"
 AOEIW9_DEN_politics_p1_3_desc:0 "Landsting still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Danish Constitutional Crown settlement."
 AOEIW9_DEN_politics_p1_4:0 "Bind the Copenhagen Cabinet"
 AOEIW9_DEN_politics_p1_4_desc:0 "Copenhagen Cabinet will be tied to the Danish Constitutional Crown programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_DEN_politics_p1_5:0 "Royal House and Nation"
 AOEIW9_DEN_politics_p1_5_desc:0 "Royal House will be presented as part of the national political order rather than a factional institution. The Danish Constitutional Crown camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_DEN_politics_p2_2:0 "Open the Landsting"
 AOEIW9_DEN_politics_p2_2_desc:0 "Access to Landsting will be widened and its procedures made less dependent on closed patronage. The reform gives the Strengthen the Cabinet camp a legal route to broaden its support without bypassing the state."
 AOEIW9_DEN_politics_p2_3:0 "Guarantee the Copenhagen Cabinet"
 AOEIW9_DEN_politics_p2_3_desc:0 "The position of Copenhagen Cabinet will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Strengthen the Cabinet settlement."
 AOEIW9_DEN_politics_p2_4:0 "Broaden the Agrarian Councils"
 AOEIW9_DEN_politics_p2_4_desc:0 "Agrarian Councils will receive a wider role in consultation, administration and mobilisation. The Strengthen the Cabinet project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_DEN_politics_p2_5:0 "A New Charter for Kingdom of Denmark"
 AOEIW9_DEN_politics_p2_5_desc:0 "A new constitutional charter will turn the Strengthen the Cabinet programme into a durable framework for the Kingdom of Denmark. The document defines authority, representation and the limits of emergency power."
 AOEIW9_DEN_politics_p3_2:0 "Mobilise the Copenhagen Cabinet"
 AOEIW9_DEN_politics_p3_2_desc:0 "Copenhagen Cabinet will become an organising arm of the National Conservatism programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_DEN_politics_p3_3:0 "Break the Agrarian Councils"
 AOEIW9_DEN_politics_p3_3_desc:0 "The independent power of Agrarian Councils is incompatible with the National Conservatism project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_DEN_politics_p3_4:0 "Replace the Trade Unions"
 AOEIW9_DEN_politics_p3_4_desc:0 "Trade Unions will be removed from its gatekeeping role and replaced with officials loyal to the National Conservatism settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_DEN_politics_p3_5:0 "The National Conservatism Settlement"
 AOEIW9_DEN_politics_p3_5_desc:0 "The political struggle around National Conservatism reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the National Conservatism order."
 AOEIW9_DEN_politics_settlement:0 "The Copenhagen Settlement"
 AOEIW9_DEN_politics_settlement_desc:0 "The chosen settlement gives Royal House, Folketing and Landsting a defined chain of authority instead of overlapping vetoes. the Kingdom of Denmark can now govern through institutions that match the political order selected by the player."
 AOEIW9_DEN_eco_root:0 "The Copenhagen Industry Review"
 AOEIW9_DEN_eco_root_desc:0 "Copenhagen Industry, Jutland Agriculture and Great Belt Infrastructure do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Denmark can expand fastest."
 AOEIW9_DEN_eco_civ_2:0 "Rails to Jutland Agriculture"
 AOEIW9_DEN_eco_civ_2_desc:0 "Rail connections serving Jutland Agriculture will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_DEN_eco_civ_5:0 "The Odense Shipyards Expansion"
 AOEIW9_DEN_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Odense Shipyards. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_DEN_eco_civ_6:0 "Renew the Danish National Railways"
 AOEIW9_DEN_eco_civ_6_desc:0 "National Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Denmark, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_DEN_eco_civ_7:0 "A Second Shift at Copenhagen Industry"
 AOEIW9_DEN_eco_civ_7_desc:0 "Copenhagen Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_DEN_eco_civ_8:0 "Public Works at Jutland Agriculture"
 AOEIW9_DEN_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Jutland Agriculture will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_DEN_eco_civ_9:0 "The Great Belt Infrastructure Development Board"
 AOEIW9_DEN_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Great Belt Infrastructure. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_DEN_eco_war_1:0 "The Danish Merchant Houses Armaments Audit"
 AOEIW9_DEN_eco_war_1_desc:0 "An armaments audit will determine which parts of Danish Merchant Houses can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_DEN_eco_war_2:0 "War Orders for Odense Shipyards"
 AOEIW9_DEN_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Odense Shipyards, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_DEN_eco_war_3:0 "Precision Tools for the Danish National Railways"
 AOEIW9_DEN_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Denmark, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_DEN_eco_war_4:0 "Expand Copenhagen Industry for Rearmament"
 AOEIW9_DEN_eco_war_4_desc:0 "New military production capacity will be built around Copenhagen Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_DEN_eco_war_5:0 "Standardise Jutland Agriculture"
 AOEIW9_DEN_eco_war_5_desc:0 "Factories tied to Jutland Agriculture will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_DEN_eco_war_6:0 "Night Production at Great Belt Infrastructure"
 AOEIW9_DEN_eco_war_6_desc:0 "Night production will be organised at Great Belt Infrastructure with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_DEN_eco_science_1:0 "Endow Technical University of Denmark"
 AOEIW9_DEN_eco_science_1_desc:0 "Stable public funding will give Technical University of Denmark laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_DEN_eco_science_2:0 "New Laboratories at Copenhagen Institute"
 AOEIW9_DEN_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Copenhagen Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_DEN_eco_science_3:0 "Applied Research at Royal Academy"
 AOEIW9_DEN_eco_science_3_desc:0 "Royal Academy will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_DEN_eco_science_4:0 "Industrial Physics at Technical University of Denmark"
 AOEIW9_DEN_eco_science_4_desc:0 "Industrial physics at Technical University of Denmark will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_DEN_eco_science_5:0 "Production Science at Copenhagen Institute"
 AOEIW9_DEN_eco_science_5_desc:0 "Researchers at Copenhagen Institute will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_DEN_eco_infra_2:0 "Freight Capacity at Danish Merchant Houses"
 AOEIW9_DEN_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Danish Merchant Houses will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_DEN_eco_infra_3:0 "Workers' Housing at Odense Shipyards"
 AOEIW9_DEN_eco_infra_3_desc:0 "Worker housing near Odense Shipyards will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_DEN_eco_infra_4:0 "Danish Logistics through the National Railways"
 AOEIW9_DEN_eco_infra_4_desc:0 "National Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Denmark, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_DEN_eco_final:0 "The Danish Productive State"
 AOEIW9_DEN_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a danish economy able to convert regional strengths into sustained national output."
 AOEIW9_DEN_mil_root:0 "Review the Danish General Staff"
 AOEIW9_DEN_mil_root_desc:0 "The Danish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_DEN_mil_army_2:0 "Jutland Division Field Manoeuvres"
 AOEIW9_DEN_mil_army_2_desc:0 "Large field exercises with the Jutland Division will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_DEN_mil_army_5:0 "Motorise the Officer Academy"
 AOEIW9_DEN_mil_army_5_desc:0 "Motor transport assigned to the Officer Academy will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_DEN_mil_army_6:0 "Staff Procedures at the Danish General Staff"
 AOEIW9_DEN_mil_army_6_desc:0 "Staff officers at the Danish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_DEN_mil_army_7:0 "Armour Studies at the Jutland Division"
 AOEIW9_DEN_mil_army_7_desc:0 "The Jutland Division will study how armour can be integrated with infantry, artillery and logistics under danish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_DEN_mil_air_1:0 "Reorganise Royal Danish Air Force"
 AOEIW9_DEN_mil_air_1_desc:0 "Royal Danish Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_DEN_mil_air_2:0 "Fighter Instruction at Værløse Air Station"
 AOEIW9_DEN_mil_air_2_desc:0 "Værløse Air Station will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_DEN_mil_air_3:0 "Ground Support Doctrine under Straits Air Command"
 AOEIW9_DEN_mil_air_3_desc:0 "Straits Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_DEN_mil_air_4:0 "Extend the Range of Royal Danish Air Force"
 AOEIW9_DEN_mil_air_4_desc:0 "Royal Danish Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Denmark's geography and strategic commitments."
 AOEIW9_DEN_mil_air_5:0 "Radar Networks for Værløse Air Station"
 AOEIW9_DEN_mil_air_5_desc:0 "Værløse Air Station will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_DEN_mil_sea_1:0 "Review Royal Danish Navy"
 AOEIW9_DEN_mil_sea_1_desc:0 "A full review of Royal Danish Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_DEN_mil_sea_2:0 "Expand Copenhagen Naval Yard"
 AOEIW9_DEN_mil_sea_2_desc:0 "Copenhagen Naval Yard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_DEN_mil_sea_3:0 "Fleet Manoeuvres with Danish Straits Fleet"
 AOEIW9_DEN_mil_sea_3_desc:0 "Fleet exercises with Danish Straits Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_DEN_mil_sea_4:0 "Screening Doctrine for Royal Danish Navy"
 AOEIW9_DEN_mil_sea_4_desc:0 "Royal Danish Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_DEN_mil_sea_5:0 "Naval Aviation at Copenhagen Naval Yard"
 AOEIW9_DEN_mil_sea_5_desc:0 "Naval aviation will be integrated with Copenhagen Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_DEN_mil_final:0 "Coastal Defense"
 AOEIW9_DEN_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Denmark now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_DEN_dip_root:0 "Define the Straits Doctrine"
 AOEIW9_DEN_dip_root_desc:0 "The Kingdom of Denmark must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_DEN_dip_a_2:0 "Send a Mission on Guard the Straits"
 AOEIW9_DEN_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Guard the Straits. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_DEN_dip_a_3:0 "Economic Leverage over Guard the Straits"
 AOEIW9_DEN_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Guard the Straits. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_DEN_dip_a_4:0 "Staff Talks on Guard the Straits"
 AOEIW9_DEN_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Guard the Straits. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_DEN_dip_a_5:0 "A Formal Warning over Guard the Straits"
 AOEIW9_DEN_dip_a_5_desc:0 "A formal warning over Guard the Straits will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_DEN_dip_b_1:0 "The German Market"
 AOEIW9_DEN_dip_b_1_desc:0 "The German Market will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Denmark actually wants before pressure is applied."
 AOEIW9_DEN_dip_b_2:0 "Send a Mission on the German Market"
 AOEIW9_DEN_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the German Market. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_DEN_dip_b_3:0 "Economic Leverage over the German Market"
 AOEIW9_DEN_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the German Market. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_DEN_dip_b_4:0 "Staff Talks on the German Market"
 AOEIW9_DEN_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the German Market. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_DEN_dip_b_5:0 "A Formal Warning over the German Market"
 AOEIW9_DEN_dip_b_5_desc:0 "A formal warning over the German Market will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_DEN_dip_final:0 "Denmark at the Baltic Gates"
 AOEIW9_DEN_dip_final_desc:0 "The Kingdom of Denmark's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
