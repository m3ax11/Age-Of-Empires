 AOEIW9_POR_eco_war_7:0 "Contracts from Luanda to Lisbon"
 AOEIW9_POR_eco_war_7_desc:0 "Long contracts will connect colonial producers with metropolitan arsenals and shipping firms."
 AOEIW9_POR_eco_science_1:0 "Endow Instituto Superior Técnico"
 AOEIW9_POR_eco_science_1_desc:0 "Stable public funding will give Instituto Superior Técnico laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_POR_eco_science_2:0 "New Laboratories at Lisbon Academy of Sciences"
 AOEIW9_POR_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Lisbon Academy of Sciences. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_POR_eco_science_3:0 "Tropical Medicine in Lisbon"
 AOEIW9_POR_eco_science_3_desc:0 "Institutes will study disease, sanitation and agriculture for the people serving across the empire."
 AOEIW9_POR_eco_science_4:0 "Industrial Physics at Instituto Superior Técnico"
 AOEIW9_POR_eco_science_4_desc:0 "Industrial physics at Instituto Superior Técnico will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_POR_eco_science_5:0 "Production Science at Lisbon Academy of Sciences"
 AOEIW9_POR_eco_science_5_desc:0 "Researchers at Lisbon Academy of Sciences will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_POR_eco_science_6:0 "Survey Missions Overseas"
 AOEIW9_POR_eco_science_6_desc:0 "Geologists, doctors and engineers will receive funds for field work tied to ports and public works."
 AOEIW9_POR_eco_infra_2:0 "Clear Colonial Cargo through Lisbon"
 AOEIW9_POR_eco_infra_2_desc:0 "Extra sidings and dock crews will shorten the queue between overseas holds and Portuguese railways."
 AOEIW9_POR_eco_infra_3:0 "Workers' Housing at Angolan Resources"
 AOEIW9_POR_eco_infra_3_desc:0 "Worker housing near Angolan Resources will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_POR_eco_infra_4:0 "Logistics through Portuguese Railways"
 AOEIW9_POR_eco_infra_4_desc:0 "Portuguese Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_POR_eco_final:0 "Ports of the Portuguese World"
 AOEIW9_POR_eco_final_desc:0 "The empire’s ports, shipping and investment now operate as one network with visible obligations."
 AOEIW9_POR_mil_root:0 "Review the Portuguese General Staff"
 AOEIW9_POR_mil_root_desc:0 "The Portuguese General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_POR_mil_army_2:0 "Portuguese Metropolitan Army Field Manoeuvres"
 AOEIW9_POR_mil_army_2_desc:0 "Large field exercises with the Metropolitan Army will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience. For Portugal, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_POR_mil_army_5:0 "Motorise the Military Academy"
 AOEIW9_POR_mil_army_5_desc:0 "Motor transport assigned to the Military Academy will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_POR_mil_army_6:0 "Staff Procedures at the Portuguese General Staff"
 AOEIW9_POR_mil_army_6_desc:0 "Staff officers at the Portuguese General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_POR_mil_army_7:0 "Portuguese Armour Studies at the Metropolitan Army"
 AOEIW9_POR_mil_army_7_desc:0 "The Metropolitan Army will study how armour can be integrated with infantry, artillery and logistics under portuguese conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_POR_mil_army_8:0 "Operational Planning at the Colonial Troops"
 AOEIW9_POR_mil_army_8_desc:0 "Operational planning with the Colonial Troops will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_POR_mil_army_9:0 "Gunnery at Vendas Novas"
 AOEIW9_POR_mil_army_9_desc:0 "The artillery school at Vendas Novas will standardise firing, observation and ammunition practice."
 AOEIW9_POR_mil_air_1:0 "Reorganise Portuguese Air Arm"
 AOEIW9_POR_mil_air_1_desc:0 "Portuguese Air Arm will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_POR_mil_air_2:0 "Fighter Instruction at Sintra Air Base"
 AOEIW9_POR_mil_air_2_desc:0 "Sintra Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_POR_mil_air_3:0 "Ground Support Doctrine under Atlantic Air Command"
 AOEIW9_POR_mil_air_3_desc:0 "Atlantic Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_POR_mil_air_4:0 "Extend the Range of Portuguese Air Arm"
 AOEIW9_POR_mil_air_4_desc:0 "Portuguese Air Arm will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Portuguese Empire's geography and strategic commitments."
 AOEIW9_POR_mil_air_5:0 "Radar Networks for Sintra Air Base"
 AOEIW9_POR_mil_air_5_desc:0 "Sintra Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_POR_mil_air_6:0 "Unify Command under Atlantic Air Command"
 AOEIW9_POR_mil_air_6_desc:0 "Atlantic Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_POR_mil_sea_1:0 "Review Portuguese Navy"
 AOEIW9_POR_mil_sea_1_desc:0 "A full review of Portuguese Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_POR_mil_sea_2:0 "Expand Lisbon Naval Arsenal"
 AOEIW9_POR_mil_sea_2_desc:0 "Lisbon Naval Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_POR_mil_sea_3:0 "Fleet Manoeuvres with Atlantic Squadron"
 AOEIW9_POR_mil_sea_3_desc:0 "Fleet exercises with Atlantic Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_POR_mil_sea_4:0 "Screening Doctrine for Portuguese Navy"
 AOEIW9_POR_mil_sea_4_desc:0 "Portuguese Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_POR_mil_sea_5:0 "Naval Aviation at Lisbon Naval Arsenal"
 AOEIW9_POR_mil_sea_5_desc:0 "Naval aviation will be integrated with Lisbon Naval Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_POR_mil_sea_6:0 "New Hulls for Atlantic Squadron"
 AOEIW9_POR_mil_sea_6_desc:0 "New hull standards for Atlantic Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_POR_mil_final:0 "Imperial Defense"
 AOEIW9_POR_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Portuguese Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_POR_dip_root:0 "Define the Lusophone Maritime Doctrine"
 AOEIW9_POR_dip_root_desc:0 "The Portuguese Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_POR_dip_a_2:0 "Send a Mission on the Spanish Border"
 AOEIW9_POR_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Spanish Border. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_POR_dip_a_3:0 "Economic Leverage over the Spanish Border"
 AOEIW9_POR_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Spanish Border. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_POR_dip_a_4:0 "Staff Talks on the Spanish Border"
 AOEIW9_POR_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Spanish Border. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_POR_dip_a_5:0 "A Formal Warning over the Spanish Border"
 AOEIW9_POR_dip_a_5_desc:0 "A formal warning over the Spanish Border will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_POR_dip_a_6:0 "Terms for the Spanish Border"
 AOEIW9_POR_dip_a_6_desc:0 "Terms for an ultimatum on the Spanish Border will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_POR_dip_b_1:0 "The Luso-Brazilian Constitutional Question"
 AOEIW9_POR_dip_b_1_desc:0 "Brazil is not a foreign rival but the largest component of the Portuguese imperial system; its constitutional place must be defined accordingly."
 AOEIW9_POR_dip_b_2:0 "Brazilian Delegates at São Bento"
 AOEIW9_POR_dip_b_2_desc:0 "Brazil’s delegation will present its demands on trade, representation and defence directly in Lisbon."
 AOEIW9_POR_dip_b_3:0 "Coordinate Atlantic Tariffs"
 AOEIW9_POR_dip_b_3_desc:0 "A shared tariff framework will tie Atlantic commerce together while giving Brazilian producers a recognised voice."
 AOEIW9_POR_dip_b_4:0 "Mil-réis and Escudos across the Atlantic"
 AOEIW9_POR_dip_b_4_desc:0 "Banks in Lisbon and Rio will clear investment and shipping contracts between the two economies."
 AOEIW9_POR_dip_b_5:0 "Brazilian Representation in Lisbon"
 AOEIW9_POR_dip_b_5_desc:0 "Brazilian representation in Lisbon will turn subject administration into a more durable constitutional relationship."
 AOEIW9_POR_dip_b_6:0 "One Language, Negotiated Power"
 AOEIW9_POR_dip_b_6_desc:0 "Portugal and Brazil will ratify reciprocal rules for trade, defence and consultation without hiding their unequal interests."
 AOEIW9_POR_dip_final:0 "The Atlantic Imperial System"
 AOEIW9_POR_dip_final_desc:0 "The Portuguese Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_RAJ_focus_tree:0 "Indian Empire Focus Tree"
 AOEIW9_RAJ_politics_root:0 "The Raj and the Question of Indian Power"
 AOEIW9_RAJ_politics_root_desc:0 "The constitutional machinery of the British Raj has become a contest between Viceroy's Council, Legislative Assembly and Chamber of Princes. Before foreign pressure hardens, the state must decide which institutions will actually govern and which will merely advise."
 AOEIW9_RAJ_politics_p1_1:0 "Indian Imperial Partnership"
 AOEIW9_RAJ_politics_p1_1_desc:0 "Indian Imperial Partnership is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the British Raj."
 AOEIW9_RAJ_politics_p1_2:0 "Reconcile the Legislative Assembly"
 AOEIW9_RAJ_politics_p1_2_desc:0 "Legislative Assembly has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Indian Imperial Partnership programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_RAJ_politics_p1_3:0 "Reform the Chamber of Princes"
 AOEIW9_RAJ_politics_p1_3_desc:0 "Chamber of Princes still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Indian Imperial Partnership settlement."
 AOEIW9_RAJ_politics_p1_4:0 "Bind the Indian Civil Service"
 AOEIW9_RAJ_politics_p1_4_desc:0 "Indian Civil Service will be tied to the Indian Imperial Partnership programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_RAJ_politics_p1_5:0 "Balance the Congress Committees"
 AOEIW9_RAJ_politics_p1_5_desc:0 "Neither abolishing Congress Committees nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Indian Imperial Partnership coalition."
 AOEIW9_RAJ_politics_p1_6:0 "Codify the Provincial Ministries"
 AOEIW9_RAJ_politics_p1_6_desc:0 "Custom and emergency practice around Provincial Ministries will be replaced with written rules. Codification fixes its place in the Indian Imperial Partnership order and limits future constitutional improvisation."
 AOEIW9_RAJ_politics_p1_7:0 "Viceroy's Council and Nation"
 AOEIW9_RAJ_politics_p1_7_desc:0 "Viceroy's Council will be presented as part of the national political order rather than a factional institution. The Indian Imperial Partnership camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_RAJ_politics_p2_1:0 "A Federation of Princes"
 AOEIW9_RAJ_politics_p2_1_desc:0 "Federation of Princes is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the British Raj."
 AOEIW9_RAJ_politics_p2_2:0 "Open the Chamber of Princes"
 AOEIW9_RAJ_politics_p2_2_desc:0 "Access to Chamber of Princes will be widened and its procedures made less dependent on closed patronage. The reform gives the Federation of Princes camp a legal route to broaden its support without bypassing the state."
 AOEIW9_RAJ_politics_p2_3:0 "Guarantee the Indian Civil Service"
 AOEIW9_RAJ_politics_p2_3_desc:0 "The position of Indian Civil Service will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Federation of Princes settlement."
 AOEIW9_RAJ_politics_p2_4:0 "Broaden the Congress Committees"
 AOEIW9_RAJ_politics_p2_4_desc:0 "Congress Committees will receive a wider role in consultation, administration and mobilisation. The Federation of Princes project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_RAJ_politics_p2_5:0 "Entrust the Provincial Ministries"
 AOEIW9_RAJ_politics_p2_5_desc:0 "Responsibility now shifts toward Provincial Ministries, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Federation of Princes system can govern through delegated institutions."
 AOEIW9_RAJ_politics_p2_6:0 "Ratify the Viceroy's Council"
 AOEIW9_RAJ_politics_p2_6_desc:0 "A formal act of ratification will settle the place of Viceroy's Council inside the new political order. Once accepted, the Federation of Princes arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_RAJ_politics_p2_7:0 "A New Charter for Indian Empire"
 AOEIW9_RAJ_politics_p2_7_desc:0 "A new constitutional charter will turn the Federation of Princes programme into a durable framework for Indian Empire. The document defines authority, representation and the limits of emergency power."
 AOEIW9_RAJ_politics_p3_1:0 "The National Congress"
 AOEIW9_RAJ_politics_p3_1_desc:0 "National Congress is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the British Raj."
 AOEIW9_RAJ_politics_p3_2:0 "Mobilise the Indian Civil Service"
 AOEIW9_RAJ_politics_p3_2_desc:0 "Indian Civil Service will become an organising arm of the National Congress programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_RAJ_politics_p3_3:0 "Break the Congress Committees"
 AOEIW9_RAJ_politics_p3_3_desc:0 "The independent power of Congress Committees is incompatible with the National Congress project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_RAJ_politics_p3_4:0 "Replace the Provincial Ministries"
 AOEIW9_RAJ_politics_p3_4_desc:0 "Provincial Ministries will be removed from its gatekeeping role and replaced with officials loyal to the National Congress settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_RAJ_politics_p3_5:0 "Command the Viceroy's Council"
 AOEIW9_RAJ_politics_p3_5_desc:0 "Viceroy's Council will answer directly to the authorities created by the National Congress path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_RAJ_politics_p3_6:0 "Reshape the Legislative Assembly"
 AOEIW9_RAJ_politics_p3_6_desc:0 "Legislative Assembly survives, but on new terms. Its composition and powers will be altered so that it reinforces the National Congress settlement instead of preserving the old balance."
 AOEIW9_RAJ_politics_p3_7:0 "The National Congress Settlement"
 AOEIW9_RAJ_politics_p3_7_desc:0 "The political struggle around The National Congress reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the National Congress order."
 AOEIW9_RAJ_politics_settlement:0 "The Delhi Settlement"
 AOEIW9_RAJ_politics_settlement_desc:0 "The chosen settlement gives Viceroy's Council, Legislative Assembly and Chamber of Princes a defined chain of authority instead of overlapping vetoes. the British Raj can now govern through institutions that match the political order selected by the player."
 AOEIW9_RAJ_eco_root:0 "The Bombay Industry Review"
 AOEIW9_RAJ_eco_root_desc:0 "Bombay Industry, Bengal Jute Mills and Tata Steel do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the British Raj can expand fastest."
 AOEIW9_RAJ_eco_civ_1:0 "Survey the Bombay Industry"
 AOEIW9_RAJ_eco_civ_1_desc:0 "A detailed survey of Bombay Industry will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_RAJ_eco_civ_2:0 "Rails to Bengal Jute Mills"
 AOEIW9_RAJ_eco_civ_2_desc:0 "Rail connections serving Bengal Jute Mills will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_RAJ_eco_civ_3:0 "Capital for Tata Steel"
 AOEIW9_RAJ_eco_civ_3_desc:0 "State-backed credit will give Tata Steel access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_RAJ_eco_civ_4:0 "Power for Grand Trunk Railway"
 AOEIW9_RAJ_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Grand Trunk Railway. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_RAJ_eco_civ_5:0 "The Madras Workshops Expansion"
 AOEIW9_RAJ_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Madras Workshops. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_RAJ_eco_civ_6:0 "Renew Imperial Bank of India"
 AOEIW9_RAJ_eco_civ_6_desc:0 "Imperial Bank of India will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_RAJ_eco_civ_7:0 "A Second Shift at Bombay Industry"
 AOEIW9_RAJ_eco_civ_7_desc:0 "Bombay Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_RAJ_eco_war_1:0 "The Grand Trunk Railway Armaments Audit"
 AOEIW9_RAJ_eco_war_1_desc:0 "An armaments audit will determine which parts of Grand Trunk Railway can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_RAJ_eco_war_2:0 "War Orders for Madras Workshops"
 AOEIW9_RAJ_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Madras Workshops, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_RAJ_eco_war_3:0 "Precision Tools for Imperial Bank of India"
 AOEIW9_RAJ_eco_war_3_desc:0 "Precision machine tools will be prioritised for Imperial Bank of India, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_RAJ_eco_war_4:0 "Expand Bombay Industry for Rearmament"
 AOEIW9_RAJ_eco_war_4_desc:0 "New military production capacity will be built around Bombay Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_RAJ_eco_war_5:0 "Standardise Bengal Jute Mills"
 AOEIW9_RAJ_eco_war_5_desc:0 "Factories tied to Bengal Jute Mills will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_RAJ_eco_war_6:0 "Night Production at Tata Steel"
 AOEIW9_RAJ_eco_war_6_desc:0 "Night production will be organised at Tata Steel with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_RAJ_eco_war_7:0 "Long-Term Contracts for Grand Trunk Railway"
 AOEIW9_RAJ_eco_war_7_desc:0 "Long-term contracts will give Grand Trunk Railway a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_RAJ_eco_war_8:0 "Mobilise Madras Workshops for Full Production"
 AOEIW9_RAJ_eco_war_8_desc:0 "Madras Workshops will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_RAJ_eco_science_1:0 "Endow Indian Institute of Science"
 AOEIW9_RAJ_eco_science_1_desc:0 "Stable public funding will give Indian Institute of Science laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_RAJ_eco_science_2:0 "New Laboratories at Calcutta University"
 AOEIW9_RAJ_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Calcutta University. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_RAJ_eco_science_3:0 "Applied Research at Delhi Technical Board"
 AOEIW9_RAJ_eco_science_3_desc:0 "Delhi Technical Board will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_RAJ_eco_science_4:0 "Industrial Physics at Indian Institute of Science"
 AOEIW9_RAJ_eco_science_4_desc:0 "Industrial physics at Indian Institute of Science will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_RAJ_eco_science_5:0 "Production Science at Calcutta University"
 AOEIW9_RAJ_eco_science_5_desc:0 "Researchers at Calcutta University will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_RAJ_eco_science_6:0 "Research Grants for Delhi Technical Board"
 AOEIW9_RAJ_eco_science_6_desc:0 "A national grant programme will connect Delhi Technical Board to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_RAJ_eco_science_7:0 "Link Indian Institute of Science to the Factories"
 AOEIW9_RAJ_eco_science_7_desc:0 "Indian Institute of Science will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_RAJ_eco_infra_1:0 "Energy for Tata Steel"
 AOEIW9_RAJ_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Tata Steel, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_RAJ_eco_infra_2:0 "Freight Capacity at Grand Trunk Railway"
 AOEIW9_RAJ_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Grand Trunk Railway will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_RAJ_eco_infra_3:0 "Workers' Housing at Madras Workshops"
 AOEIW9_RAJ_eco_infra_3_desc:0 "Worker housing near Madras Workshops will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_RAJ_eco_infra_4:0 "Logistics through Imperial Bank of India"
 AOEIW9_RAJ_eco_infra_4_desc:0 "Imperial Bank of India will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_RAJ_eco_final:0 "An Indian Industrial Base"
 AOEIW9_RAJ_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a indian economy able to convert regional strengths into sustained national output."
 AOEIW9_RAJ_mil_root:0 "Review the Indian General Staff"
 AOEIW9_RAJ_mil_root_desc:0 "The Indian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_RAJ_mil_army_1:0 "The Army Training Commission"
 AOEIW9_RAJ_mil_army_1_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_2:0 "The Frontier Infantry School"
 AOEIW9_RAJ_mil_army_2_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_RAJ_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_RAJ_mil_army_3_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_RAJ_mil_army_4_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_5:0 "The Indian Armoured Corps"
 AOEIW9_RAJ_mil_army_5_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_RAJ_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_RAJ_mil_army_6_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_RAJ_mil_army_7_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_8:0 "One Supply Service"
 AOEIW9_RAJ_mil_army_8_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_RAJ_mil_army_9_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_RAJ_mil_army_10_desc:0 "The subcontinent offers room for mobile warfare, but its difficult frontiers still demand resilient infantry formations. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_RAJ_mil_air_1:0 "Reorganise Royal Indian Air Force"
 AOEIW9_RAJ_mil_air_1_desc:0 "Royal Indian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_RAJ_mil_air_2:0 "Fighter Instruction at Ambala Air Station"
 AOEIW9_RAJ_mil_air_2_desc:0 "Ambala Air Station will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_RAJ_mil_air_3:0 "Indian Ground Support Doctrine under Eastern Air Command"
 AOEIW9_RAJ_mil_air_3_desc:0 "Eastern Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For India, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_RAJ_mil_air_4:0 "Extend the Range of Royal Indian Air Force"
 AOEIW9_RAJ_mil_air_4_desc:0 "Royal Indian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the British Raj's geography and strategic commitments."
 AOEIW9_RAJ_mil_air_5:0 "Radar Networks for Ambala Air Station"
 AOEIW9_RAJ_mil_air_5_desc:0 "Ambala Air Station will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_RAJ_mil_air_6:0 "Unify Indian Air Command under Eastern Air Command"
 AOEIW9_RAJ_mil_air_6_desc:0 "Eastern Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For India, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_RAJ_mil_air_7:0 "Royal Indian Air Force Comes of Age"
 AOEIW9_RAJ_mil_air_7_desc:0 "Royal Indian Air Force now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_RAJ_mil_sea_1:0 "Review Royal Indian Navy"
 AOEIW9_RAJ_mil_sea_1_desc:0 "A full review of Royal Indian Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_RAJ_mil_sea_2:0 "Expand Bombay Dockyard"
 AOEIW9_RAJ_mil_sea_2_desc:0 "Bombay Dockyard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_RAJ_mil_sea_3:0 "Fleet Manoeuvres with Indian Ocean Squadron"
 AOEIW9_RAJ_mil_sea_3_desc:0 "Fleet exercises with Indian Ocean Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_RAJ_mil_sea_4:0 "Screening Doctrine for Royal Indian Navy"
 AOEIW9_RAJ_mil_sea_4_desc:0 "Royal Indian Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_RAJ_mil_sea_5:0 "Naval Aviation at Bombay Dockyard"
 AOEIW9_RAJ_mil_sea_5_desc:0 "Naval aviation will be integrated with Bombay Dockyard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_RAJ_mil_sea_6:0 "New Hulls for Indian Ocean Squadron"
 AOEIW9_RAJ_mil_sea_6_desc:0 "New hull standards for Indian Ocean Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_RAJ_mil_sea_7:0 "Sea Command under Royal Indian Navy"
 AOEIW9_RAJ_mil_sea_7_desc:0 "Royal Indian Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the British Raj. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_RAJ_mil_final:0 "Frontier Warfare"
 AOEIW9_RAJ_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the British Raj now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_RAJ_dip_root:0 "Define the Indian Ocean Doctrine"
 AOEIW9_RAJ_dip_root_desc:0 "Indian Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_RAJ_dip_a_1:0 "The Siamese Frontier"
 AOEIW9_RAJ_dip_a_1_desc:0 "The Siamese Frontier will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the British Raj actually wants before pressure is applied."
 AOEIW9_RAJ_dip_a_2:0 "Send a Mission on the Siamese Frontier"
 AOEIW9_RAJ_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Siamese Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_RAJ_dip_a_3:0 "Economic Leverage over the Siamese Frontier"
 AOEIW9_RAJ_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Siamese Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_RAJ_dip_a_4:0 "Staff Talks on the Siamese Frontier"
 AOEIW9_RAJ_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Siamese Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_RAJ_dip_a_5:0 "A Formal Warning over the Siamese Frontier"
 AOEIW9_RAJ_dip_a_5_desc:0 "A formal warning over the Siamese Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_RAJ_dip_a_6:0 "Terms for the Siamese Frontier"
 AOEIW9_RAJ_dip_a_6_desc:0 "Terms for an ultimatum on the Siamese Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_RAJ_dip_a_7:0 "The Decision on the Siamese Frontier"
 AOEIW9_RAJ_dip_a_7_desc:0 "The government reaches the decision point on the Siamese Frontier. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_RAJ_dip_b_1:0 "The Imperial Relationship"
 AOEIW9_RAJ_dip_b_1_desc:0 "The Imperial Relationship will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the British Raj actually wants before pressure is applied."
 AOEIW9_RAJ_dip_b_2:0 "Send a Mission on the Imperial Relationship"
 AOEIW9_RAJ_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Imperial Relationship. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_RAJ_dip_b_3:0 "Economic Leverage over the Imperial Relationship"
 AOEIW9_RAJ_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Imperial Relationship. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_RAJ_dip_b_4:0 "Staff Talks on the Imperial Relationship"
 AOEIW9_RAJ_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Imperial Relationship. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_RAJ_dip_b_5:0 "A Formal Warning over the Imperial Relationship"
 AOEIW9_RAJ_dip_b_5_desc:0 "A formal warning over the Imperial Relationship will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_RAJ_dip_b_6:0 "Terms for the Imperial Relationship"
 AOEIW9_RAJ_dip_b_6_desc:0 "Terms for an ultimatum on the Imperial Relationship will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_RAJ_dip_b_7:0 "The Decision on the Imperial Relationship"
 AOEIW9_RAJ_dip_b_7_desc:0 "The government reaches the decision point on the Imperial Relationship. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_RAJ_dip_final:0 "Delhi and the Asian Balance"
 AOEIW9_RAJ_dip_final_desc:0 "The British Raj's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_ROM_focus_tree:0 "Kingdom of Romania Focus Tree"
 AOEIW9_ROM_politics_p1_2:0 "Reconcile the Parliament"
 AOEIW9_ROM_politics_p1_2_desc:0 "Parliament has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Royal Constitution programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_ROM_politics_p1_3:0 "Reform the National Peasant Party"
 AOEIW9_ROM_politics_p1_3_desc:0 "National Peasant Party still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Royal Constitution settlement."
 AOEIW9_ROM_politics_p1_4:0 "Bind the Romanian Officer Corps"
 AOEIW9_ROM_politics_p1_4_desc:0 "Officer Corps will be tied to the Royal Constitution programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_ROM_politics_p1_5:0 "Balance the Legionary Movement"
 AOEIW9_ROM_politics_p1_5_desc:0 "Neither abolishing Legionary Movement nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Royal Constitution coalition."
 AOEIW9_ROM_politics_p1_6:0 "The Romanian Crown and Nation"
 AOEIW9_ROM_politics_p1_6_desc:0 "Royal Palace will be presented as part of the national political order rather than a factional institution. The Royal Constitution camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_ROM_politics_p2_2:0 "Open the National Peasant Party"
 AOEIW9_ROM_politics_p2_2_desc:0 "Access to National Peasant Party will be widened and its procedures made less dependent on closed patronage. The reform gives the King's Government camp a legal route to broaden its support without bypassing the state."
 AOEIW9_ROM_politics_p2_3:0 "Guarantee the Romanian Officer Corps"
 AOEIW9_ROM_politics_p2_3_desc:0 "The position of Officer Corps will be protected by statute and political guarantees. That security is the price of bringing it firmly into the King's Government settlement."
 AOEIW9_ROM_politics_p2_4:0 "Broaden the Legionary Movement"
 AOEIW9_ROM_politics_p2_4_desc:0 "Legionary Movement will receive a wider role in consultation, administration and mobilisation. The King's Government project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_ROM_politics_p2_5:0 "Entrust the County Prefects"
 AOEIW9_ROM_politics_p2_5_desc:0 "Responsibility now shifts toward County Prefects, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the King's Government system can govern through delegated institutions."
 AOEIW9_ROM_politics_p2_6:0 "Defend the Constitution of 1923"
 AOEIW9_ROM_politics_p2_6_desc:0 "The parties will defend ministerial responsibility, elected chambers and civil rights against rule by royal decree. The constitution must work when the palace dislikes its answer."
 AOEIW9_ROM_politics_p3_2:0 "Mobilise the Romanian Officer Corps"
 AOEIW9_ROM_politics_p3_2_desc:0 "Officer Corps will become an organising arm of the Legionary Temptation programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_ROM_politics_p3_3:0 "Break the Legionary Movement"
 AOEIW9_ROM_politics_p3_3_desc:0 "The independent power of Legionary Movement is incompatible with the Legionary Temptation project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_ROM_politics_p3_4:0 "Replace the County Prefects"
 AOEIW9_ROM_politics_p3_4_desc:0 "County Prefects will be removed from its gatekeeping role and replaced with officials loyal to the Legionary Temptation settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_ROM_politics_p3_5:0 "Command the Romanian Royal Palace"
 AOEIW9_ROM_politics_p3_5_desc:0 "Royal Palace will answer directly to the authorities created by the Legionary Temptation path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_ROM_politics_p3_6:0 "Everything for the Legion"
 AOEIW9_ROM_politics_p3_6_desc:0 "The Guard subordinates parties, unions and local government to its cells and commanders. Mystical brotherhood becomes the operating rule of the state."
 AOEIW9_ROM_politics_settlement:0 "Who Rules on Calea Victoriei?"
 AOEIW9_ROM_politics_settlement_desc:0 "Palace, parliament or Legion has won the authority to appoint ministers and command the police. Bucharest can now answer the question that paralysed every cabinet."
 AOEIW9_ROM_eco_root:0 "The Ploiești Oilfields Review"
 AOEIW9_ROM_eco_root_desc:0 "Ploiești Oilfields, Bucharest Industry and Danube Ports do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Romania can expand fastest."
 AOEIW9_ROM_eco_civ_2:0 "Rails to Bucharest Industry"
 AOEIW9_ROM_eco_civ_2_desc:0 "Rail connections serving Bucharest Industry will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_ROM_eco_civ_5:0 "The Romanian Railways Expansion"
 AOEIW9_ROM_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Romanian Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_ROM_eco_civ_6:0 "Credit for the Village Cooperatives"
 AOEIW9_ROM_eco_civ_6_desc:0 "The National Bank will extend supervised loans for seed, tools and storage through village cooperatives. Cheap credit must reach farms rather than another circle of intermediaries."
 AOEIW9_ROM_eco_civ_7:0 "A Second Shift at Ploiești Oilfields"
 AOEIW9_ROM_eco_civ_7_desc:0 "Ploiești Oilfields has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_ROM_eco_civ_8:0 "Public Works at Bucharest Industry"
 AOEIW9_ROM_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Bucharest Industry will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_ROM_eco_war_1:0 "The Brașov Works Armaments Audit"
 AOEIW9_ROM_eco_war_1_desc:0 "An armaments audit will determine which parts of Brașov Works can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_ROM_eco_war_2:0 "War Orders for Romanian Railways"
 AOEIW9_ROM_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Romanian Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_ROM_eco_war_3:0 "Pump Works for Ploiești"
 AOEIW9_ROM_eco_war_3_desc:0 "Romanian workshops will receive lathes and gauges for pumps, valves and drilling equipment. The oilfields must repair critical machinery without waiting for foreign deliveries."
 AOEIW9_ROM_eco_war_4:0 "Expand Ploiești Oilfields for Rearmament"
 AOEIW9_ROM_eco_war_4_desc:0 "New military production capacity will be built around Ploiești Oilfields, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_ROM_eco_war_5:0 "Standardise Bucharest Industry"
 AOEIW9_ROM_eco_war_5_desc:0 "Factories tied to Bucharest Industry will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_ROM_eco_war_6:0 "Night Production at Danube Ports"
 AOEIW9_ROM_eco_war_6_desc:0 "Night production will be organised at Danube Ports with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_ROM_eco_war_7:0 "Long-Term Contracts for Brașov Works"
 AOEIW9_ROM_eco_war_7_desc:0 "Long-term contracts will give Brașov Works a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_ROM_eco_science_1:0 "Endow University of Bucharest"
 AOEIW9_ROM_eco_science_1_desc:0 "Stable public funding will give University of Bucharest laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_ROM_eco_science_2:0 "New Laboratories at Polytechnic School"
 AOEIW9_ROM_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Polytechnic School. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_ROM_eco_science_3:0 "Applied Research at Romanian Research Institute"
 AOEIW9_ROM_eco_science_3_desc:0 "Romanian Research Institute will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_ROM_eco_science_4:0 "Industrial Physics at University of Bucharest"
 AOEIW9_ROM_eco_science_4_desc:0 "Industrial physics at University of Bucharest will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_ROM_eco_science_5:0 "Production Science at Polytechnic School"
 AOEIW9_ROM_eco_science_5_desc:0 "Researchers at Polytechnic School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_ROM_eco_science_6:0 "Research Grants for Romanian Research Institute"
 AOEIW9_ROM_eco_science_6_desc:0 "A national grant programme will connect Romanian Research Institute to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_ROM_eco_infra_2:0 "Freight Capacity at Brașov Works"
 AOEIW9_ROM_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Brașov Works will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_ROM_eco_infra_3:0 "Workers' Housing at Romanian Railways"
 AOEIW9_ROM_eco_infra_3_desc:0 "Worker housing near Romanian Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_ROM_eco_infra_4:0 "CFR Depots for Grain and Fuel"
 AOEIW9_ROM_eco_infra_4_desc:0 "The state railways will prepare sidings, tanks and guarded depots linking the plains and Ploiești to army routes. Harvest and oil must move on the same strained network."
 AOEIW9_ROM_eco_final:0 "The Romanian Development State"
 AOEIW9_ROM_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a romanian economy able to convert regional strengths into sustained national output."
 AOEIW9_ROM_mil_root:0 "Review the Romanian General Staff"
 AOEIW9_ROM_mil_root_desc:0 "The Romanian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_ROM_mil_army_2:0 "Mountain Corps Field Manoeuvres"
 AOEIW9_ROM_mil_army_2_desc:0 "Large field exercises with the Mountain Corps will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_ROM_mil_army_5:0 "Motorise the War School"
 AOEIW9_ROM_mil_army_5_desc:0 "Motor transport assigned to the War School will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_ROM_mil_army_6:0 "Staff Procedures at the Romanian General Staff"
 AOEIW9_ROM_mil_army_6_desc:0 "Staff officers at the Romanian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_ROM_mil_army_7:0 "Armour Studies at the Mountain Corps"
 AOEIW9_ROM_mil_army_7_desc:0 "The Mountain Corps will study how armour can be integrated with infantry, artillery and logistics under romanian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_ROM_mil_army_8:0 "Romanian Operational Planning at the Royal Guard"
 AOEIW9_ROM_mil_army_8_desc:0 "Operational planning with the Royal Guard will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain. For Romania, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_ROM_mil_army_9:0 "Guns from the Malaxa Works"
 AOEIW9_ROM_mil_army_9_desc:0 "Malaxa’s factories will standardise artillery parts, ammunition handling and repair drawings. Romanian batteries need weapons the domestic industry can keep firing."
 AOEIW9_ROM_mil_air_1:0 "Reorganise Royal Romanian Air Force"
 AOEIW9_ROM_mil_air_1_desc:0 "Royal Romanian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_ROM_mil_air_2:0 "Fighter Instruction at Brașov Aircraft Works"
 AOEIW9_ROM_mil_air_2_desc:0 "Brașov Aircraft Works will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_ROM_mil_air_3:0 "Ground Support Doctrine under Danube Air Command"
 AOEIW9_ROM_mil_air_3_desc:0 "Danube Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_ROM_mil_air_4:0 "Extend the Range of Royal Romanian Air Force"
 AOEIW9_ROM_mil_air_4_desc:0 "Royal Romanian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Romania's geography and strategic commitments."
 AOEIW9_ROM_mil_air_5:0 "Radar Networks for Brașov Aircraft Works"
 AOEIW9_ROM_mil_air_5_desc:0 "Brașov Aircraft Works will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_ROM_mil_air_6:0 "Unify Command under Danube Air Command"
 AOEIW9_ROM_mil_air_6_desc:0 "Danube Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_ROM_mil_sea_1:0 "Review Royal Romanian Navy"
 AOEIW9_ROM_mil_sea_1_desc:0 "A full review of Royal Romanian Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_ROM_mil_sea_2:0 "Expand Constanța Naval Base"
 AOEIW9_ROM_mil_sea_2_desc:0 "Constanța Naval Base will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_ROM_mil_sea_3:0 "Fleet Manoeuvres with Danube Flotilla"
 AOEIW9_ROM_mil_sea_3_desc:0 "Fleet exercises with Danube Flotilla will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_ROM_mil_sea_4:0 "Screening Doctrine for Royal Romanian Navy"
 AOEIW9_ROM_mil_sea_4_desc:0 "Royal Romanian Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_ROM_mil_sea_5:0 "Naval Aviation at Constanța Naval Base"
 AOEIW9_ROM_mil_sea_5_desc:0 "Naval aviation will be integrated with Constanța Naval Base for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_ROM_mil_sea_6:0 "New Hulls for Danube Flotilla"
 AOEIW9_ROM_mil_sea_6_desc:0 "New hull standards for Danube Flotilla will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_ROM_mil_final:0 "Romanian Mountain Defence Doctrine"
 AOEIW9_ROM_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Romania now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_ROM_dip_root:0 "Define the Carpathian Doctrine"
 AOEIW9_ROM_dip_root_desc:0 "The Kingdom of Romania must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_ROM_dip_a_2:0 "Receive the Bulgarian Delegation"
 AOEIW9_ROM_dip_a_2_desc:0 "The Bulgarian delegation will be received formally so that claims can be negotiated instead of exchanged as threats."
 AOEIW9_ROM_dip_a_3:0 "Protect Romanian Communities"
 AOEIW9_ROM_dip_a_3_desc:0 "Romanian communities and property rights must form part of any durable settlement."
 AOEIW9_ROM_dip_a_4:0 "Danube Customs Coordination"
 AOEIW9_ROM_dip_a_4_desc:0 "Customs coordination on the Danube will give both states material reasons to keep the frontier quiet."
 AOEIW9_ROM_dip_a_5:0 "Rome Guarantees Bucharest"
 AOEIW9_ROM_dip_a_5_desc:0 "Italy will place its signature behind Romania’s frontier and consult if that frontier is threatened. Bucharest will test whether the guarantee changes enemy calculations or only diplomatic stationery."
 AOEIW9_ROM_dip_a_6:0 "The Bucharest–Sofia Accord"
 AOEIW9_ROM_dip_a_6_desc:0 "Romania and Bulgaria will formalise a working settlement that preserves the League while leaving future revision to diplomacy."
 AOEIW9_ROM_dip_b_1:0 "The Russian Shadow"
 AOEIW9_ROM_dip_b_1_desc:0 "The Russian Shadow will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Romania actually wants before pressure is applied."
 AOEIW9_ROM_dip_b_2:0 "Send a Mission on the Russian Shadow"
 AOEIW9_ROM_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Russian Shadow. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ROM_dip_b_3:0 "Economic Leverage over the Russian Shadow"
 AOEIW9_ROM_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Russian Shadow. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_ROM_dip_b_4:0 "Staff Talks on the Russian Shadow"
 AOEIW9_ROM_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Russian Shadow. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ROM_dip_b_5:0 "A Formal Warning over the Russian Shadow"
 AOEIW9_ROM_dip_b_5_desc:0 "A formal warning over the Russian Shadow will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ROM_dip_b_6:0 "Terms for the Russian Shadow"
 AOEIW9_ROM_dip_b_6_desc:0 "Terms for an ultimatum on the Russian Shadow will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_ROM_dip_final:0 "Bucharest within the Mediterranean League"
 AOEIW9_ROM_dip_final_desc:0 "The Kingdom of Romania's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SIA_focus_tree:0 "Kingdom of Siam Focus Tree"
 AOEIW9_SIA_politics_p1_2:0 "Reconcile the Siamese National Assembly"
 AOEIW9_SIA_politics_p1_2_desc:0 "National Assembly has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Constitutional Court programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_SIA_politics_p1_3:0 "Reform the People's Party"
 AOEIW9_SIA_politics_p1_3_desc:0 "People's Party still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Constitutional Court settlement."
 AOEIW9_SIA_politics_p1_4:0 "Bind the Military Directorate"
 AOEIW9_SIA_politics_p1_4_desc:0 "Military Directorate will be tied to the Constitutional Court programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_SIA_politics_p1_5:0 "The Siamese Crown and Nation"
 AOEIW9_SIA_politics_p1_5_desc:0 "Royal Palace will be presented as part of the national political order rather than a factional institution. The Constitutional Court camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_SIA_politics_p2_2:0 "Open the People's Party"
 AOEIW9_SIA_politics_p2_2_desc:0 "Access to People's Party will be widened and its procedures made less dependent on closed patronage. The reform gives the Royal Restoration camp a legal route to broaden its support without bypassing the state."
 AOEIW9_SIA_politics_p2_3:0 "Guarantee the Military Directorate"
 AOEIW9_SIA_politics_p2_3_desc:0 "The position of Military Directorate will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Royal Restoration settlement."
 AOEIW9_SIA_politics_p2_4:0 "Broaden the Provincial Governors"
 AOEIW9_SIA_politics_p2_4_desc:0 "Provincial Governors will receive a wider role in consultation, administration and mobilisation. The Royal Restoration project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_SIA_politics_p2_5:0 "A New Charter for Kingdom of Siam"
 AOEIW9_SIA_politics_p2_5_desc:0 "A new constitutional charter will turn the Royal Restoration programme into a durable framework for the Kingdom of Siam. The document defines authority, representation and the limits of emergency power."
 AOEIW9_SIA_politics_p3_2:0 "Mobilise the Military Directorate"
 AOEIW9_SIA_politics_p3_2_desc:0 "Military Directorate will become an organising arm of the People's Party programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_SIA_politics_p3_3:0 "Break the Provincial Governors"
 AOEIW9_SIA_politics_p3_3_desc:0 "The independent power of Provincial Governors is incompatible with the People's Party project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_SIA_politics_p3_4:0 "Replace the Buddhist Sangha"
 AOEIW9_SIA_politics_p3_4_desc:0 "Buddhist Sangha will be removed from its gatekeeping role and replaced with officials loyal to the People's Party settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_SIA_politics_p3_5:0 "The People's Party Settlement"
 AOEIW9_SIA_politics_p3_5_desc:0 "The political struggle around The People's Party reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the People's Party order."
 AOEIW9_SIA_politics_settlement:0 "The Bangkok Settlement"
 AOEIW9_SIA_politics_settlement_desc:0 "The chosen settlement gives Royal Palace, National Assembly and People's Party a defined chain of authority instead of overlapping vetoes. the Kingdom of Siam can now govern through institutions that match the political order selected by the player."
 AOEIW9_SIA_eco_root:0 "The Bangkok Workshops Review"
 AOEIW9_SIA_eco_root_desc:0 "Bangkok Workshops, Chao Phraya Irrigation and Siamese Railways do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Siam can expand fastest."
 AOEIW9_SIA_eco_civ_2:0 "Rails to Chao Phraya Irrigation"
 AOEIW9_SIA_eco_civ_2_desc:0 "Rail connections serving Chao Phraya Irrigation will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_SIA_eco_civ_5:0 "The Gulf Ports Expansion"
 AOEIW9_SIA_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Gulf Ports. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_SIA_eco_civ_6:0 "Renew Northern Development"
 AOEIW9_SIA_eco_civ_6_desc:0 "Northern Development will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_SIA_eco_civ_7:0 "A Second Shift at Bangkok Workshops"
 AOEIW9_SIA_eco_civ_7_desc:0 "Bangkok Workshops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_SIA_eco_civ_8:0 "Public Works at Chao Phraya Irrigation"
 AOEIW9_SIA_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Chao Phraya Irrigation will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_SIA_eco_civ_9:0 "The Siamese Railways Development Board"
 AOEIW9_SIA_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Siamese Railways. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_SIA_eco_war_1:0 "The Tin Export Board Armaments Audit"
 AOEIW9_SIA_eco_war_1_desc:0 "An armaments audit will determine which parts of Tin Export Board can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_SIA_eco_war_2:0 "War Orders for Gulf Ports"
 AOEIW9_SIA_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Gulf Ports, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_SIA_eco_war_3:0 "Precision Tools for Northern Development"
 AOEIW9_SIA_eco_war_3_desc:0 "Precision machine tools will be prioritised for Northern Development, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_SIA_eco_war_4:0 "Expand Bangkok Workshops for Rearmament"
 AOEIW9_SIA_eco_war_4_desc:0 "New military production capacity will be built around Bangkok Workshops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_SIA_eco_war_5:0 "Standardise Chao Phraya Irrigation"
 AOEIW9_SIA_eco_war_5_desc:0 "Factories tied to Chao Phraya Irrigation will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_SIA_eco_war_6:0 "Night Production at Siamese Railways"
 AOEIW9_SIA_eco_war_6_desc:0 "Night production will be organised at Siamese Railways with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_SIA_eco_science_1:0 "Endow Chulalongkorn University"
 AOEIW9_SIA_eco_science_1_desc:0 "Stable public funding will give Chulalongkorn University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_SIA_eco_science_2:0 "New Laboratories at Royal Technical Institute"
 AOEIW9_SIA_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Royal Technical Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_SIA_eco_science_3:0 "Applied Research at Siamese Research Bureau"
 AOEIW9_SIA_eco_science_3_desc:0 "Siamese Research Bureau will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_SIA_eco_science_4:0 "Industrial Physics at Chulalongkorn University"
 AOEIW9_SIA_eco_science_4_desc:0 "Industrial physics at Chulalongkorn University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_SIA_eco_science_5:0 "Production Science at Royal Technical Institute"
 AOEIW9_SIA_eco_science_5_desc:0 "Researchers at Royal Technical Institute will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_SIA_eco_infra_2:0 "Freight Capacity at Tin Export Board"
 AOEIW9_SIA_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Tin Export Board will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_SIA_eco_infra_3:0 "Workers' Housing at Gulf Ports"
 AOEIW9_SIA_eco_infra_3_desc:0 "Worker housing near Gulf Ports will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_SIA_eco_infra_4:0 "Logistics through Northern Development"
 AOEIW9_SIA_eco_infra_4_desc:0 "Northern Development will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_SIA_eco_final:0 "The Siamese Modernisation Economy"
 AOEIW9_SIA_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a siamese economy able to convert regional strengths into sustained national output."
 AOEIW9_SIA_mil_root:0 "Review the Siamese General Staff"
 AOEIW9_SIA_mil_root_desc:0 "The Siamese General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_SIA_mil_army_2:0 "Royal Guard Field Manoeuvres"
 AOEIW9_SIA_mil_army_2_desc:0 "Large field exercises with the Royal Guard will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_SIA_mil_army_5:0 "Motorise the Bangkok Staff College"
 AOEIW9_SIA_mil_army_5_desc:0 "Motor transport assigned to the Bangkok Staff College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_SIA_mil_army_6:0 "Staff Procedures at the Siamese General Staff"
 AOEIW9_SIA_mil_army_6_desc:0 "Staff officers at the Siamese General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_SIA_mil_army_7:0 "Armour Studies at the Royal Guard"
 AOEIW9_SIA_mil_army_7_desc:0 "The Royal Guard will study how armour can be integrated with infantry, artillery and logistics under siamese conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_SIA_mil_air_1:0 "Reorganise Royal Siamese Air Force"
 AOEIW9_SIA_mil_air_1_desc:0 "Royal Siamese Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_SIA_mil_air_2:0 "Fighter Instruction at Don Muang Air Base"
 AOEIW9_SIA_mil_air_2_desc:0 "Don Muang Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_SIA_mil_air_3:0 "Siamese Ground Support Doctrine under Gulf Air Command"
 AOEIW9_SIA_mil_air_3_desc:0 "Gulf Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Siam, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_SIA_mil_air_4:0 "Extend the Range of Royal Siamese Air Force"
 AOEIW9_SIA_mil_air_4_desc:0 "Royal Siamese Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Siam's geography and strategic commitments."
 AOEIW9_SIA_mil_air_5:0 "Radar Networks for Don Muang Air Base"
 AOEIW9_SIA_mil_air_5_desc:0 "Don Muang Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_SIA_mil_sea_1:0 "Review Royal Siamese Navy"
 AOEIW9_SIA_mil_sea_1_desc:0 "A full review of Royal Siamese Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_SIA_mil_sea_2:0 "Expand Bangkok Naval Yard"
 AOEIW9_SIA_mil_sea_2_desc:0 "Bangkok Naval Yard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_SIA_mil_sea_3:0 "Fleet Manoeuvres with Gulf Squadron"
 AOEIW9_SIA_mil_sea_3_desc:0 "Fleet exercises with Gulf Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_SIA_mil_sea_4:0 "Screening Doctrine for Royal Siamese Navy"
 AOEIW9_SIA_mil_sea_4_desc:0 "Royal Siamese Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_SIA_mil_sea_5:0 "Naval Aviation at Bangkok Naval Yard"
 AOEIW9_SIA_mil_sea_5_desc:0 "Naval aviation will be integrated with Bangkok Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_SIA_mil_final:0 "Jungle Mobility"
 AOEIW9_SIA_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Siam now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_SIA_dip_root:0 "Define the Southeast Asian Doctrine"
 AOEIW9_SIA_dip_root_desc:0 "The Kingdom of Siam must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_SIA_dip_a_2:0 "Send a Mission on the Indian Frontier"
 AOEIW9_SIA_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Indian Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SIA_dip_a_3:0 "Economic Leverage over the Indian Frontier"
 AOEIW9_SIA_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Indian Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SIA_dip_a_4:0 "Staff Talks on the Indian Frontier"
 AOEIW9_SIA_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Indian Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SIA_dip_a_5:0 "A Formal Warning over the Indian Frontier"
 AOEIW9_SIA_dip_a_5_desc:0 "A formal warning over the Indian Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SIA_dip_b_1:0 "The Chinese Sphere"
 AOEIW9_SIA_dip_b_1_desc:0 "The Chinese Sphere will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Siam actually wants before pressure is applied."
 AOEIW9_SIA_dip_b_2:0 "Send a Mission on the Chinese Sphere"
 AOEIW9_SIA_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Chinese Sphere. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SIA_dip_b_3:0 "Economic Leverage over the Chinese Sphere"
 AOEIW9_SIA_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Chinese Sphere. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SIA_dip_b_4:0 "Staff Talks on the Chinese Sphere"
 AOEIW9_SIA_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Chinese Sphere. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SIA_dip_b_5:0 "A Formal Warning over the Chinese Sphere"
 AOEIW9_SIA_dip_b_5_desc:0 "A formal warning over the Chinese Sphere will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SIA_dip_final:0 "Siam Between Empires"
 AOEIW9_SIA_dip_final_desc:0 "The Kingdom of Siam's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SOV_focus_tree:0 "Russian Empire Focus Tree"
 AOEIW9_SOV_politics_root:0 "The Empire and the Spectre of Revolution"
 AOEIW9_SOV_politics_root_desc:0 "The Russian Empire enters 1936 with Imperial Court, State Duma and Okhrana pulling policy in different directions. The coming settlement will decide who controls appointments, legislation and mobilisation when the next crisis arrives."
 AOEIW9_SOV_politics_p1_1:0 "The Tsar Stands Strong"
 AOEIW9_SOV_politics_p1_1_desc:0 "Tsar Stands Strong is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Russian Empire."
 AOEIW9_SOV_politics_p1_2:0 "Reconcile the State Duma"
 AOEIW9_SOV_politics_p1_2_desc:0 "State Duma has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Tsar Stands Strong programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_SOV_politics_p1_3:0 "Reform the Okhrana"
 AOEIW9_SOV_politics_p1_3_desc:0 "Okhrana still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Tsar Stands Strong settlement."
 AOEIW9_SOV_politics_p1_4:0 "Bind the Zemstvo Councils"
 AOEIW9_SOV_politics_p1_4_desc:0 "Zemstvo Councils will be tied to the Tsar Stands Strong programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_SOV_politics_p1_5:0 "Balance the Workers' Soviets"
 AOEIW9_SOV_politics_p1_5_desc:0 "Neither abolishing Workers' Soviets nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Tsar Stands Strong coalition."
 AOEIW9_SOV_politics_p1_6_desc:0 "Custom and emergency practice around General Staff will be replaced with written rules. Codification fixes its place in the Tsar Stands Strong order and limits future constitutional improvisation."
 AOEIW9_SOV_politics_p1_7:0 "The Russian Imperial Court and Nation"
 AOEIW9_SOV_politics_p1_7_desc:0 "Imperial Court will be presented as part of the national political order rather than a factional institution. The Tsar Stands Strong camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_SOV_politics_p2_1:0 "A Liberal Monarchy"
 AOEIW9_SOV_politics_p2_1_desc:0 "Liberal Monarchy is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Russian Empire."
 AOEIW9_SOV_politics_p2_2_desc:0 "Access to Okhrana will be widened and its procedures made less dependent on closed patronage. The reform gives the Liberal Monarchy camp a legal route to broaden its support without bypassing the state."
 AOEIW9_SOV_politics_p2_3:0 "Guarantee the Zemstvo Councils"
 AOEIW9_SOV_politics_p2_3_desc:0 "The position of Zemstvo Councils will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Liberal Monarchy settlement."
 AOEIW9_SOV_politics_p2_4:0 "Broaden the Workers' Soviets"
 AOEIW9_SOV_politics_p2_4_desc:0 "Workers' Soviets will receive a wider role in consultation, administration and mobilisation. The Liberal Monarchy project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_SOV_politics_p2_5:0 "Entrust the General Staff"
 AOEIW9_SOV_politics_p2_5_desc:0 "Responsibility now shifts toward General Staff, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Liberal Monarchy system can govern through delegated institutions."
 AOEIW9_SOV_politics_p2_6_desc:0 "A formal act of ratification will settle the place of Imperial Court inside the new political order. Once accepted, the Liberal Monarchy arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_SOV_politics_p2_7:0 "The Fundamental Laws Revised"
 AOEIW9_SOV_politics_p2_7_desc:0 "The Duma will define ministerial responsibility, provincial powers and the Crown’s reserve authority in a revision of the Fundamental Laws. Reform becomes enforceable text."
 AOEIW9_SOV_politics_settlement:0 "The Imperial State Reconstituted"
 AOEIW9_SOV_politics_settlement_desc:0 "The chosen settlement gives Imperial Court, State Duma and Okhrana a defined chain of authority instead of overlapping vetoes. the Russian Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_SOV_eco_root:0 "The Donbass Coal Basin Review"
 AOEIW9_SOV_eco_root_desc:0 "Donbass Coal Basin, Putilov Works and Siberian Railways do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Russian Empire can expand fastest."
 AOEIW9_SOV_eco_civ_1:0 "Survey the Donbass Coal Basin"
 AOEIW9_SOV_eco_civ_1_desc:0 "A detailed survey of Donbass Coal Basin will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_SOV_eco_civ_2:0 "Rails to Putilov Works"
 AOEIW9_SOV_eco_civ_2_desc:0 "Rail connections serving Putilov Works will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_SOV_eco_civ_3:0 "Capital for Siberian Railways"
 AOEIW9_SOV_eco_civ_3_desc:0 "State-backed credit will give Siberian Railways access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_SOV_eco_civ_4:0 "Power for Moscow Industry"
 AOEIW9_SOV_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Moscow Industry. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_SOV_eco_civ_5:0 "The Baku Oilfields Expansion"
 AOEIW9_SOV_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Baku Oilfields. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_SOV_eco_civ_6:0 "Renew Ural Foundries"
 AOEIW9_SOV_eco_civ_6_desc:0 "Ural Foundries will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_SOV_eco_civ_7:0 "A Second Shift at Donbass Coal Basin"
 AOEIW9_SOV_eco_civ_7_desc:0 "Donbass Coal Basin has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_SOV_eco_war_1:0 "The Moscow Industry Armaments Audit"
 AOEIW9_SOV_eco_war_1_desc:0 "An armaments audit will determine which parts of Moscow Industry can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_SOV_eco_war_2:0 "War Orders for Baku Oilfields"
 AOEIW9_SOV_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Baku Oilfields, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_SOV_eco_war_3:0 "Precision Tools for Ural Foundries"
 AOEIW9_SOV_eco_war_3_desc:0 "Precision machine tools will be prioritised for Ural Foundries, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_SOV_eco_war_4:0 "Expand Donbass Coal Basin for Rearmament"
 AOEIW9_SOV_eco_war_4_desc:0 "New military production capacity will be built around Donbass Coal Basin, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_SOV_eco_war_5:0 "Standardise Putilov Works"
 AOEIW9_SOV_eco_war_5_desc:0 "Factories tied to Putilov Works will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_SOV_eco_war_6:0 "Night Production at Siberian Railways"
 AOEIW9_SOV_eco_war_6_desc:0 "Night production will be organised at Siberian Railways with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_SOV_eco_war_7:0 "Long-Term Contracts for Moscow Industry"
 AOEIW9_SOV_eco_war_7_desc:0 "Long-term contracts will give Moscow Industry a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_SOV_eco_war_8:0 "Mobilise Baku Oilfields for Full Production"
 AOEIW9_SOV_eco_war_8_desc:0 "Baku Oilfields will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_SOV_eco_science_1:0 "Endow Imperial Academy of Sciences"
 AOEIW9_SOV_eco_science_1_desc:0 "Stable public funding will give Imperial Academy of Sciences laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_SOV_eco_science_2:0 "New Laboratories at Moscow Technical Institute"
 AOEIW9_SOV_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Moscow Technical Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_SOV_eco_science_3:0 "Applied Research at St Petersburg Polytechnic"
 AOEIW9_SOV_eco_science_3_desc:0 "St Petersburg Polytechnic will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_SOV_eco_science_4:0 "Industrial Physics at Imperial Academy of Sciences"
 AOEIW9_SOV_eco_science_4_desc:0 "Industrial physics at Imperial Academy of Sciences will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_SOV_eco_science_5:0 "Production Science at Moscow Technical Institute"
 AOEIW9_SOV_eco_science_5_desc:0 "Researchers at Moscow Technical Institute will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_SOV_eco_science_6:0 "Research Grants for St Petersburg Polytechnic"
 AOEIW9_SOV_eco_science_6_desc:0 "A national grant programme will connect St Petersburg Polytechnic to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_SOV_eco_science_7:0 "Link Imperial Academy of Sciences to the Factories"
 AOEIW9_SOV_eco_science_7_desc:0 "Imperial Academy of Sciences will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_SOV_eco_infra_1:0 "Energy for Siberian Railways"
 AOEIW9_SOV_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Siberian Railways, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_SOV_eco_infra_2:0 "Freight Capacity at Moscow Industry"
 AOEIW9_SOV_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Moscow Industry will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_SOV_eco_infra_3:0 "Workers' Housing at Baku Oilfields"
 AOEIW9_SOV_eco_infra_3_desc:0 "Worker housing near Baku Oilfields will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_SOV_eco_infra_4:0 "Logistics through Ural Foundries"
 AOEIW9_SOV_eco_infra_4_desc:0 "Ural Foundries will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_SOV_eco_final:0 "The Imperial Industrial Mobilisation System"
 AOEIW9_SOV_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a russian economy able to convert regional strengths into sustained national output."
 AOEIW9_SOV_mil_root:0 "Review the Russian General Staff"
 AOEIW9_SOV_mil_root_desc:0 "The Russian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_SOV_mil_army_1:0 "The Kiev Manoeuvres"
 AOEIW9_SOV_mil_army_1_desc:0 "Mass formations, armour and aircraft will test the mobilisation plan around Kiev. Rail delays and failed signals will reach the Stavka without ceremonial excuses."
 AOEIW9_SOV_mil_army_2:0 "Rifle Echelons"
 AOEIW9_SOV_mil_army_2_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_SOV_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_SOV_mil_army_3_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_SOV_mil_army_4_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_5:0 "Deep Armoured Operations"
 AOEIW9_SOV_mil_army_5_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_SOV_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_SOV_mil_army_6_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_SOV_mil_army_7_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_8:0 "One Supply Service"
 AOEIW9_SOV_mil_army_8_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_SOV_mil_army_9_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_SOV_mil_army_10_desc:0 "Across the Russian theatre, rifle reserves and armoured exploitation require different training and supply priorities. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_SOV_mil_air_1:0 "Reorganise Imperial Russian Air Service"
 AOEIW9_SOV_mil_air_1_desc:0 "Imperial Russian Air Service will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_SOV_mil_air_2:0 "Fighter Instruction at Gatchina Aviation School"
 AOEIW9_SOV_mil_air_2_desc:0 "Gatchina Aviation School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_SOV_mil_air_3:0 "Russian Ground Support Doctrine under Strategic Air Command"
 AOEIW9_SOV_mil_air_3_desc:0 "Strategic Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Russia, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_SOV_mil_air_4:0 "Extend the Range of Imperial Russian Air Service"
 AOEIW9_SOV_mil_air_4_desc:0 "Imperial Russian Air Service will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Russian Empire's geography and strategic commitments."
 AOEIW9_SOV_mil_air_5:0 "Radar Networks for Gatchina Aviation School"
 AOEIW9_SOV_mil_air_5_desc:0 "Gatchina Aviation School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_SOV_mil_air_6:0 "Unify Russian Air Command under Strategic Air Command"
 AOEIW9_SOV_mil_air_6_desc:0 "Strategic Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For Russia, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_SOV_mil_air_7:0 "Imperial Russian Air Service Comes of Age"
 AOEIW9_SOV_mil_air_7_desc:0 "Imperial Russian Air Service now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_SOV_mil_sea_1:0 "Review Imperial Russian Navy"
 AOEIW9_SOV_mil_sea_1_desc:0 "A full review of Imperial Russian Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_SOV_mil_sea_2:0 "Expand Kronstadt Arsenal"
 AOEIW9_SOV_mil_sea_2_desc:0 "Kronstadt Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_SOV_mil_sea_3:0 "Fleet Manoeuvres with Baltic and Black Sea Fleets"
 AOEIW9_SOV_mil_sea_3_desc:0 "Fleet exercises with Baltic and Black Sea Fleets will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_SOV_mil_sea_4:0 "Screening Doctrine for Imperial Russian Navy"
 AOEIW9_SOV_mil_sea_4_desc:0 "Imperial Russian Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_SOV_mil_sea_5:0 "Naval Aviation at Kronstadt Arsenal"
 AOEIW9_SOV_mil_sea_5_desc:0 "Naval aviation will be integrated with Kronstadt Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_SOV_mil_sea_6:0 "New Hulls for Baltic and Black Sea Fleets"
 AOEIW9_SOV_mil_sea_6_desc:0 "New hull standards for Baltic and Black Sea Fleets will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_SOV_mil_sea_7:0 "Sea Command under Imperial Russian Navy"
 AOEIW9_SOV_mil_sea_7_desc:0 "Imperial Russian Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Russian Empire. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_SOV_mil_final:0 "Deep Battle"
 AOEIW9_SOV_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Russian Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_SOV_dip_root:0 "Define the Eurasian Doctrine"
 AOEIW9_SOV_dip_root_desc:0 "The Russian Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_SOV_dip_a_1:0 "The German Frontier"
 AOEIW9_SOV_dip_a_1_desc:0 "The German Frontier will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Russian Empire actually wants before pressure is applied."
 AOEIW9_SOV_dip_a_2:0 "Send a Mission on the German Frontier"
 AOEIW9_SOV_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the German Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SOV_dip_a_3:0 "Economic Leverage over the German Frontier"
 AOEIW9_SOV_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the German Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SOV_dip_a_4:0 "Staff Talks on the German Frontier"
 AOEIW9_SOV_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the German Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SOV_dip_a_5:0 "A Formal Warning over the German Frontier"
 AOEIW9_SOV_dip_a_5_desc:0 "A formal warning over the German Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SOV_dip_a_6:0 "Terms for the German Frontier"
 AOEIW9_SOV_dip_a_6_desc:0 "Terms for an ultimatum on the German Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_SOV_dip_a_7:0 "The Decision on the German Frontier"
 AOEIW9_SOV_dip_a_7_desc:0 "The government reaches the decision point on the German Frontier. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_SOV_dip_b_1:0 "The Ottoman Question"
 AOEIW9_SOV_dip_b_1_desc:0 "The Ottoman Question will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Russian Empire actually wants before pressure is applied."
 AOEIW9_SOV_dip_b_2:0 "Send a Mission on the Ottoman Question"
 AOEIW9_SOV_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Ottoman Question. Negotiators are given objectives rather than a ceremonial itinerary."
