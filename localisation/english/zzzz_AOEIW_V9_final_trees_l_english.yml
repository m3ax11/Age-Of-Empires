 AOEIW9_CHI_mil_sea_6_desc:0 "New hull standards for Imperial Coastal Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships. For China, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_CHI_mil_sea_7:0 "Sea Command under Yangtze Fleet"
 AOEIW9_CHI_mil_sea_7_desc:0 "Yangtze Fleet will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Chinese Empire. The objective is effective control where it counts, not symbolic global reach."
