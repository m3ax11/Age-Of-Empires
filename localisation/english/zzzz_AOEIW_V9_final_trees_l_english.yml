 AOEIW9_SWE_mil_army_6:0 "Staff Procedures at the Swedish General Staff"
 AOEIW9_SWE_mil_army_6_desc:0 "Staff officers at the Swedish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_SWE_mil_army_7:0 "Armour Studies at the Norrland Regiments"
 AOEIW9_SWE_mil_army_7_desc:0 "The Norrland Regiments will study how armour can be integrated with infantry, artillery and logistics under swedish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_SWE_mil_army_8:0 "Operational Planning at the Bofors Artillery Command"
 AOEIW9_SWE_mil_army_8_desc:0 "Operational planning with the Bofors Artillery Command will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_SWE_mil_army_9:0 "Tanks at Skövde"
 AOEIW9_SWE_mil_army_9_desc:0 "Armoured crews at Skövde will turn experimental formations into repeatable drills for movement, recovery and support. Sweden's tanks must work in forests and broken ground rather than on parade."
 AOEIW9_SWE_mil_air_1:0 "Reorganise Swedish Air Force"
 AOEIW9_SWE_mil_air_1_desc:0 "Swedish Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_SWE_mil_air_2:0 "Fighter Instruction at SAAB Works"
 AOEIW9_SWE_mil_air_2_desc:0 "SAAB Works will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_SWE_mil_air_3:0 "Swedish Ground Support Doctrine under Northern Air Command"
 AOEIW9_SWE_mil_air_3_desc:0 "Northern Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Sweden, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_SWE_mil_air_4:0 "Extend the Range of Swedish Air Force"
 AOEIW9_SWE_mil_air_4_desc:0 "Swedish Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Sweden's geography and strategic commitments."
 AOEIW9_SWE_mil_air_5:0 "Radar Networks for SAAB Works"
 AOEIW9_SWE_mil_air_5_desc:0 "SAAB Works will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_SWE_mil_air_6:0 "Unify Swedish Air Command under Northern Air Command"
 AOEIW9_SWE_mil_air_6_desc:0 "Northern Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For Sweden, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_SWE_mil_sea_1:0 "Review Royal Swedish Navy"
 AOEIW9_SWE_mil_sea_1_desc:0 "A full review of Royal Swedish Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_SWE_mil_sea_2:0 "Expand Karlskrona Naval Yard"
 AOEIW9_SWE_mil_sea_2_desc:0 "Karlskrona Naval Yard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_SWE_mil_sea_3:0 "Fleet Manoeuvres with Baltic Fleet"
 AOEIW9_SWE_mil_sea_3_desc:0 "Fleet exercises with Baltic Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_SWE_mil_sea_4:0 "Screening Doctrine for Royal Swedish Navy"
 AOEIW9_SWE_mil_sea_4_desc:0 "Royal Swedish Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_SWE_mil_sea_5:0 "Naval Aviation at Karlskrona Naval Yard"
 AOEIW9_SWE_mil_sea_5_desc:0 "Naval aviation will be integrated with Karlskrona Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_SWE_mil_sea_6:0 "New Hulls for Baltic Fleet"
 AOEIW9_SWE_mil_sea_6_desc:0 "New hull standards for Baltic Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_SWE_mil_final:0 "Swedish Mobile Defence Doctrine"
 AOEIW9_SWE_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Sweden now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_SWE_dip_root:0 "Define the Nordic Defense Doctrine"
 AOEIW9_SWE_dip_root_desc:0 "The Kingdom of Sweden must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_SWE_dip_a_2:0 "Send a Mission on the Finnish Question"
 AOEIW9_SWE_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Finnish Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SWE_dip_a_3:0 "Economic Leverage over the Finnish Question"
 AOEIW9_SWE_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Finnish Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SWE_dip_a_4:0 "Staff Talks on the Finnish Question"
 AOEIW9_SWE_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Finnish Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SWE_dip_a_5:0 "A Formal Warning over the Finnish Question"
 AOEIW9_SWE_dip_a_5_desc:0 "A formal warning over the Finnish Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SWE_dip_a_6:0 "Terms for the Finnish Question"
 AOEIW9_SWE_dip_a_6_desc:0 "Terms for an ultimatum on the Finnish Question will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_SWE_dip_b_1:0 "Baltic Security"
 AOEIW9_SWE_dip_b_1_desc:0 "Baltic Security will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Sweden actually wants before pressure is applied."
 AOEIW9_SWE_dip_b_2:0 "Send a Mission on Baltic Security"
 AOEIW9_SWE_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Baltic Security. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SWE_dip_b_3:0 "Economic Leverage over Baltic Security"
 AOEIW9_SWE_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Baltic Security. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SWE_dip_b_4:0 "Staff Talks on Baltic Security"
 AOEIW9_SWE_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Baltic Security. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SWE_dip_b_5:0 "A Formal Warning over Baltic Security"
 AOEIW9_SWE_dip_b_5_desc:0 "A formal warning over Baltic Security will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SWE_dip_b_6:0 "Terms for Baltic Security"
 AOEIW9_SWE_dip_b_6_desc:0 "Terms for an ultimatum on Baltic Security will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_SWE_dip_final:0 "Sweden and the Baltic Balance"
 AOEIW9_SWE_dip_final_desc:0 "The Kingdom of Sweden's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SWI_focus_tree:0 "Swiss Confederation Focus Tree"
 AOEIW9_SWI_politics_root:0 "The Confederation Under Pressure"
 AOEIW9_SWI_politics_root_desc:0 "Federal Council, National Council and Council of States all claim a voice in the future of the Swiss Confederation. A durable political order must define their rights now, before an emergency defines them by force."
 AOEIW9_SWI_politics_p1_1:0 "The Federal Consensus"
 AOEIW9_SWI_politics_p1_1_desc:0 "Federal Consensus is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Swiss Confederation."
 AOEIW9_SWI_politics_p1_2:0 "Reconcile the National Council"
 AOEIW9_SWI_politics_p1_2_desc:0 "National Council has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Federal Consensus programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_SWI_politics_p1_3:0 "Reform the Council of States"
 AOEIW9_SWI_politics_p1_3_desc:0 "Council of States still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Federal Consensus settlement."
 AOEIW9_SWI_politics_p1_4:0 "Bind the Cantonal Governments"
 AOEIW9_SWI_politics_p1_4_desc:0 "Cantonal Governments will be tied to the Federal Consensus programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_SWI_politics_p1_5:0 "Federal Council and Nation"
 AOEIW9_SWI_politics_p1_5_desc:0 "Federal Council will be presented as part of the national political order rather than a factional institution. The Federal Consensus camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_SWI_politics_p2_1:0 "Emergency Federal Powers"
 AOEIW9_SWI_politics_p2_1_desc:0 "Emergency Federal Powers is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Swiss Confederation."
 AOEIW9_SWI_politics_p2_2:0 "Open the Council of States"
 AOEIW9_SWI_politics_p2_2_desc:0 "Access to Council of States will be widened and its procedures made less dependent on closed patronage. The reform gives the Emergency Federal Powers camp a legal route to broaden its support without bypassing the state."
 AOEIW9_SWI_politics_p2_3:0 "Guarantee the Cantonal Governments"
 AOEIW9_SWI_politics_p2_3_desc:0 "The position of Cantonal Governments will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Emergency Federal Powers settlement."
 AOEIW9_SWI_politics_p2_4:0 "Broaden the Industrial Associations"
 AOEIW9_SWI_politics_p2_4_desc:0 "Industrial Associations will receive a wider role in consultation, administration and mobilisation. The Emergency Federal Powers project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_SWI_politics_p2_5:0 "A New Charter for Swiss Confederation"
 AOEIW9_SWI_politics_p2_5_desc:0 "A new constitutional charter will turn the Emergency Federal Powers programme into a durable framework for the Swiss Confederation. The document defines authority, representation and the limits of emergency power."
 AOEIW9_SWI_politics_p3_1:0 "The Armed Neutrality Bloc"
 AOEIW9_SWI_politics_p3_1_desc:0 "Armed Neutrality Bloc is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Swiss Confederation."
 AOEIW9_SWI_politics_p3_2:0 "Mobilise the Cantonal Governments"
 AOEIW9_SWI_politics_p3_2_desc:0 "Cantonal Governments will become an organising arm of the Armed Neutrality Bloc programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_SWI_politics_p3_3:0 "Break the Industrial Associations"
 AOEIW9_SWI_politics_p3_3_desc:0 "The independent power of Industrial Associations is incompatible with the Armed Neutrality Bloc project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_SWI_politics_p3_4:0 "Replace the Militia Officers"
 AOEIW9_SWI_politics_p3_4_desc:0 "Militia Officers will be removed from its gatekeeping role and replaced with officials loyal to the Armed Neutrality Bloc settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_SWI_politics_p3_5:0 "The Armed Neutrality Bloc Settlement"
 AOEIW9_SWI_politics_p3_5_desc:0 "The political struggle around The Armed Neutrality Bloc reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Armed Neutrality Bloc order."
 AOEIW9_SWI_politics_settlement:0 "The Federal Settlement"
 AOEIW9_SWI_politics_settlement_desc:0 "The chosen settlement gives Federal Council, National Council and Council of States a defined chain of authority instead of overlapping vetoes. the Swiss Confederation can now govern through institutions that match the political order selected by the player."
 AOEIW9_SWI_eco_root:0 "The Zurich Machine Industry Review"
 AOEIW9_SWI_eco_root_desc:0 "Zurich Machine Industry, Swiss Federal Railways and Alpine Hydroelectricity do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Swiss Confederation can expand fastest."
 AOEIW9_SWI_eco_civ_1:0 "Survey the Zurich Machine Industry"
 AOEIW9_SWI_eco_civ_1_desc:0 "A detailed survey of Zurich Machine Industry will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_SWI_eco_civ_2:0 "Rails to Swiss Federal Railways"
 AOEIW9_SWI_eco_civ_2_desc:0 "Rail connections serving Swiss Federal Railways will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_SWI_eco_civ_3:0 "Capital for Alpine Hydroelectricity"
 AOEIW9_SWI_eco_civ_3_desc:0 "State-backed credit will give Alpine Hydroelectricity access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_SWI_eco_civ_4:0 "Power for Basel Chemicals"
 AOEIW9_SWI_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Basel Chemicals. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_SWI_eco_civ_5:0 "The Precision Workshops Expansion"
 AOEIW9_SWI_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Precision Workshops. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_SWI_eco_civ_6:0 "Renew National Bank in Swiss Confederation"
 AOEIW9_SWI_eco_civ_6_desc:0 "National Bank will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Switzerland, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWI_eco_civ_7:0 "A Second Shift at Zurich Machine Industry"
 AOEIW9_SWI_eco_civ_7_desc:0 "Zurich Machine Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_SWI_eco_civ_8:0 "Public Works at Swiss Federal Railways"
 AOEIW9_SWI_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Swiss Federal Railways will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_SWI_eco_civ_9:0 "The Alpine Hydroelectricity Development Board"
 AOEIW9_SWI_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Alpine Hydroelectricity. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_SWI_eco_war_1:0 "The Basel Chemicals Armaments Audit"
 AOEIW9_SWI_eco_war_1_desc:0 "An armaments audit will determine which parts of Basel Chemicals can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_SWI_eco_war_2:0 "War Orders for Precision Workshops"
 AOEIW9_SWI_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Precision Workshops, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_SWI_eco_war_3:0 "Precision Tools for National Bank in Swiss Confederation"
 AOEIW9_SWI_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Bank, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Switzerland, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWI_eco_war_4:0 "Expand Zurich Machine Industry for Rearmament"
 AOEIW9_SWI_eco_war_4_desc:0 "New military production capacity will be built around Zurich Machine Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_SWI_eco_war_5:0 "Standardise Swiss Federal Railways"
 AOEIW9_SWI_eco_war_5_desc:0 "Factories tied to Swiss Federal Railways will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_SWI_eco_war_6:0 "Night Production at Alpine Hydroelectricity"
 AOEIW9_SWI_eco_war_6_desc:0 "Night production will be organised at Alpine Hydroelectricity with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_SWI_eco_science_1:0 "Endow ETH Zürich"
 AOEIW9_SWI_eco_science_1_desc:0 "Stable public funding will give ETH Zürich laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_SWI_eco_science_2:0 "New Laboratories at University of Geneva"
 AOEIW9_SWI_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of University of Geneva. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_SWI_eco_science_3:0 "Applied Research at Federal Research Commission"
 AOEIW9_SWI_eco_science_3_desc:0 "Federal Research Commission will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_SWI_eco_science_4:0 "Industrial Physics at ETH Zürich"
 AOEIW9_SWI_eco_science_4_desc:0 "Industrial physics at ETH Zürich will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_SWI_eco_science_5:0 "Production Science at University of Geneva"
 AOEIW9_SWI_eco_science_5_desc:0 "Researchers at University of Geneva will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_SWI_eco_infra_1:0 "Energy for Alpine Hydroelectricity"
 AOEIW9_SWI_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Alpine Hydroelectricity, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_SWI_eco_infra_2:0 "Freight Capacity at Basel Chemicals"
 AOEIW9_SWI_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Basel Chemicals will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_SWI_eco_infra_3:0 "Workers' Housing at Precision Workshops"
 AOEIW9_SWI_eco_infra_3_desc:0 "Worker housing near Precision Workshops will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_SWI_eco_infra_4:0 "Logistics through National Bank in Swiss Confederation"
 AOEIW9_SWI_eco_infra_4_desc:0 "National Bank will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Switzerland, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_SWI_eco_final:0 "The Swiss Productive Economy"
 AOEIW9_SWI_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a swiss economy able to convert regional strengths into sustained national output."
 AOEIW9_SWI_mil_root:0 "Review the Swiss General Staff"
 AOEIW9_SWI_mil_root_desc:0 "The Swiss General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_SWI_mil_army_1:0 "Reorganise the Swiss General Staff"
 AOEIW9_SWI_mil_army_1_desc:0 "The Swiss General Staff will be reorganised around clear chains of command, modern staff procedure and formations the economy can actually support. The reform is meant to improve readiness before simply increasing headcount."
 AOEIW9_SWI_mil_army_2:0 "Militia Army Field Manoeuvres"
 AOEIW9_SWI_mil_army_2_desc:0 "Large field exercises with the Militia Army will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_SWI_mil_army_3:0 "Support Arms for the Mountain Brigades"
 AOEIW9_SWI_mil_army_3_desc:0 "Engineers, reconnaissance, signals and other support arms will be integrated with the Mountain Brigades. Better supporting services turn existing manpower into more flexible formations without pretending every problem requires another infantry battalion."
 AOEIW9_SWI_mil_army_4:0 "Artillery Lessons from the Fortress Command"
 AOEIW9_SWI_mil_army_4_desc:0 "The Fortress Command will turn artillery experience into standard fire plans, observation procedures and ammunition practice. The aim is a force that can coordinate guns with manoeuvre rather than treat artillery as a separate arm."
 AOEIW9_SWI_mil_army_5:0 "Motorise the Thun Officer School"
 AOEIW9_SWI_mil_army_5_desc:0 "Motor transport assigned to the Thun Officer School will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_SWI_mil_army_6:0 "Staff Procedures at the Swiss General Staff"
 AOEIW9_SWI_mil_army_6_desc:0 "Staff officers at the Swiss General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_SWI_mil_army_7:0 "Armour Studies at the Militia Army"
 AOEIW9_SWI_mil_army_7_desc:0 "The Militia Army will study how armour can be integrated with infantry, artillery and logistics under swiss conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_SWI_mil_air_1:0 "Reorganise Swiss Air Force"
 AOEIW9_SWI_mil_air_1_desc:0 "Swiss Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_SWI_mil_air_2:0 "Fighter Instruction at Dübendorf Airfield"
 AOEIW9_SWI_mil_air_2_desc:0 "Dübendorf Airfield will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_SWI_mil_air_3:0 "Ground Support Doctrine under Alpine Air Command"
 AOEIW9_SWI_mil_air_3_desc:0 "Alpine Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_SWI_mil_air_4:0 "Extend the Range of Swiss Air Force"
 AOEIW9_SWI_mil_air_4_desc:0 "Swiss Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Swiss Confederation's geography and strategic commitments."
 AOEIW9_SWI_mil_air_5:0 "Radar Networks for Dübendorf Airfield"
 AOEIW9_SWI_mil_air_5_desc:0 "Dübendorf Airfield will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_SWI_mil_special_1:0 "Expand the Alpine Supply Corps"
 AOEIW9_SWI_mil_special_1_desc:0 "Alpine Supply Corps will receive the transport, depots and procurement authority needed to function as a real military capability. Expansion is tied to supply and readiness rather than another paper formation."
 AOEIW9_SWI_mil_special_2:0 "Train the Fortress Engineers"
 AOEIW9_SWI_mil_special_2_desc:0 "The formations associated with Fortress Engineers will receive dedicated training for the terrain and mission they are expected to face. Exercises focus on practical readiness instead of ceremonial strength."
 AOEIW9_SWI_mil_special_3:0 "Fortify with the National Redoubt Command"
 AOEIW9_SWI_mil_special_3_desc:0 "National Redoubt Command will be integrated into a deliberate fortification plan with supply points, prepared positions and engineering support. Defensive terrain becomes useful only when troops can occupy and sustain it."
 AOEIW9_SWI_mil_special_4:0 "Mountain Logistics for the Alpine Supply Corps"
 AOEIW9_SWI_mil_special_4_desc:0 "Pack transport, mountain roads, depots and specialist supply units will support Alpine Supply Corps. The programme is designed to keep formations moving where ordinary motor transport cannot be relied upon."
 AOEIW9_SWI_mil_special_5:0 "Mobile Reserve of the Fortress Engineers"
 AOEIW9_SWI_mil_special_5_desc:0 "A mobile reserve will be organised around Fortress Engineers so that local defensive strength can be shifted toward a threatened sector. Mobility turns static preparations into an operational system."
 AOEIW9_SWI_mil_final:0 "Fortress Warfare"
 AOEIW9_SWI_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Swiss Confederation now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_SWI_dip_root:0 "Define the Armed Neutrality Doctrine"
 AOEIW9_SWI_dip_root_desc:0 "The Swiss Confederation must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_SWI_dip_a_1:0 "Balance the Great Powers"
 AOEIW9_SWI_dip_a_1_desc:0 "Balance the Great Powers will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Swiss Confederation actually wants before pressure is applied."
 AOEIW9_SWI_dip_a_2:0 "Send a Mission on Balance the Great Powers"
 AOEIW9_SWI_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Balance the Great Powers. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SWI_dip_a_3:0 "Economic Leverage over Balance the Great Powers"
 AOEIW9_SWI_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Balance the Great Powers. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SWI_dip_a_4:0 "Staff Talks on Balance the Great Powers"
 AOEIW9_SWI_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Balance the Great Powers. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SWI_dip_a_5:0 "A Formal Warning over Balance the Great Powers"
 AOEIW9_SWI_dip_a_5_desc:0 "A formal warning over Balance the Great Powers will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SWI_dip_b_1:0 "The Alpine Redoubt"
 AOEIW9_SWI_dip_b_1_desc:0 "The Alpine Redoubt will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Swiss Confederation actually wants before pressure is applied."
 AOEIW9_SWI_dip_b_2:0 "Send a Mission on the Alpine Redoubt"
 AOEIW9_SWI_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Alpine Redoubt. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_SWI_dip_b_3:0 "Economic Leverage over the Alpine Redoubt"
 AOEIW9_SWI_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Alpine Redoubt. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_SWI_dip_b_4:0 "Staff Talks on the Alpine Redoubt"
 AOEIW9_SWI_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Alpine Redoubt. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_SWI_dip_b_5:0 "A Formal Warning over the Alpine Redoubt"
 AOEIW9_SWI_dip_b_5_desc:0 "A formal warning over the Alpine Redoubt will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_SWI_dip_final:0 "Neutrality with Teeth"
 AOEIW9_SWI_dip_final_desc:0 "The Swiss Confederation's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_SWI_special_1:0 "Emergency Mobilisation"
 AOEIW9_SWI_special_1_desc:0 "Emergency Mobilisation addresses a strategic problem that is specific to the Swiss Confederation. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_SWI_special_2:0 "Seal the Alpine Passes"
 AOEIW9_SWI_special_2_desc:0 "The government will turn Seal the Alpine Passes into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Swiss Confederation's situation rather than from a universal template."
 AOEIW9_SWI_special_3:0 "Disperse the Arsenals"
 AOEIW9_SWI_special_3_desc:0 "Disperse the Arsenals links economic capacity, planning and military requirements that already exist in the Swiss Confederation. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_SWI_special_4:0 "Mobilise the Cantons"
 AOEIW9_SWI_special_4_desc:0 "By pursuing Mobilise the Cantons, the Swiss Confederation commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_SWI_special_5:0 "Redoubt Supply Depots"
 AOEIW9_SWI_special_5_desc:0 "Redoubt Supply Depots addresses a strategic problem that is specific to the Swiss Confederation. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_SWI_special_6:0 "The National Redoubt"
 AOEIW9_SWI_special_6_desc:0 "The government will turn The National Redoubt into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Swiss Confederation's situation rather than from a universal template."
 AOEIW9_SWI_special_7:0 "No Step Through the Alps"
 AOEIW9_SWI_special_7_desc:0 "No Step Through the Alps links economic capacity, planning and military requirements that already exist in the Swiss Confederation. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_SWI_special_8:0 "They Shall Not Pass!"
 AOEIW9_SWI_special_8_desc:0 "By pursuing §RThey Shall Not Pass!§!, the Swiss Confederation commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_TUR_focus_tree:0 "Ottoman Empire Focus Tree"
 AOEIW9_TUR_politics_root:0 "The Sublime Porte and the Burden of Empire"
 AOEIW9_TUR_politics_root_desc:0 "Sublime Porte, Imperial Parliament and Palace Secretariat all claim a voice in the future of the Ottoman Empire. A durable political order must define their rights now, before an emergency defines them by force."
 AOEIW9_TUR_politics_p1_1:0 "Reform the Sultanate"
 AOEIW9_TUR_politics_p1_1_desc:0 "Reform the Sultanate is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Ottoman Empire."
 AOEIW9_TUR_politics_p1_2:0 "Reconcile the Imperial Parliament"
 AOEIW9_TUR_politics_p1_2_desc:0 "Imperial Parliament has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Reform the Sultanate programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_TUR_politics_p1_3:0 "Reform the Palace Secretariat"
 AOEIW9_TUR_politics_p1_3_desc:0 "Palace Secretariat still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Reform the Sultanate settlement."
 AOEIW9_TUR_politics_p1_4:0 "Bind the Provincial Governors"
 AOEIW9_TUR_politics_p1_4_desc:0 "Provincial Governors will be tied to the Reform the Sultanate programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_TUR_politics_p1_5:0 "Balance the Young Officers"
 AOEIW9_TUR_politics_p1_5_desc:0 "Neither abolishing Young Officers nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Reform the Sultanate coalition."
 AOEIW9_TUR_politics_p1_6:0 "Codify the Ulema"
 AOEIW9_TUR_politics_p1_6_desc:0 "Custom and emergency practice around Ulema will be replaced with written rules. Codification fixes its place in the Reform the Sultanate order and limits future constitutional improvisation."
 AOEIW9_TUR_politics_p1_7:0 "Sublime Porte and Nation"
 AOEIW9_TUR_politics_p1_7_desc:0 "Sublime Porte will be presented as part of the national political order rather than a factional institution. The Reform the Sultanate camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_TUR_politics_p2_1:0 "The Imperial Court"
 AOEIW9_TUR_politics_p2_1_desc:0 "Imperial Court is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Ottoman Empire."
 AOEIW9_TUR_politics_p2_2:0 "Open the Palace Secretariat"
 AOEIW9_TUR_politics_p2_2_desc:0 "Access to Palace Secretariat will be widened and its procedures made less dependent on closed patronage. The reform gives the Imperial Court camp a legal route to broaden its support without bypassing the state."
 AOEIW9_TUR_politics_p2_3:0 "Guarantee the Provincial Governors"
 AOEIW9_TUR_politics_p2_3_desc:0 "The position of Provincial Governors will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Imperial Court settlement."
 AOEIW9_TUR_politics_p2_4:0 "Broaden the Young Officers"
 AOEIW9_TUR_politics_p2_4_desc:0 "Young Officers will receive a wider role in consultation, administration and mobilisation. The Imperial Court project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_TUR_politics_p2_5:0 "Entrust the Ulema"
 AOEIW9_TUR_politics_p2_5_desc:0 "Responsibility now shifts toward Ulema, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Imperial Court system can govern through delegated institutions."
 AOEIW9_TUR_politics_p2_6:0 "Ratify the Sublime Porte"
 AOEIW9_TUR_politics_p2_6_desc:0 "A formal act of ratification will settle the place of Sublime Porte inside the new political order. Once accepted, the Imperial Court arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_TUR_politics_p2_7:0 "A New Charter for Ottoman Empire"
 AOEIW9_TUR_politics_p2_7_desc:0 "A new constitutional charter will turn the Imperial Court programme into a durable framework for the Ottoman Empire. The document defines authority, representation and the limits of emergency power."
 AOEIW9_TUR_politics_p3_1:0 "The Ottoman Young Officers"
 AOEIW9_TUR_politics_p3_1_desc:0 "Ottoman Young Officers is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Ottoman Empire."
 AOEIW9_TUR_politics_p3_2:0 "Mobilise the Provincial Governors"
 AOEIW9_TUR_politics_p3_2_desc:0 "Provincial Governors will become an organising arm of the Ottoman Young Officers programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_TUR_politics_p3_3:0 "Break the Young Officers"
 AOEIW9_TUR_politics_p3_3_desc:0 "The independent power of Young Officers is incompatible with the Ottoman Young Officers project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_TUR_politics_p3_4:0 "Replace the Ulema"
 AOEIW9_TUR_politics_p3_4_desc:0 "Ulema will be removed from its gatekeeping role and replaced with officials loyal to the Ottoman Young Officers settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_TUR_politics_p3_5:0 "Command the Sublime Porte"
 AOEIW9_TUR_politics_p3_5_desc:0 "Sublime Porte will answer directly to the authorities created by the Ottoman Young Officers path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_TUR_politics_p3_6:0 "Reshape the Imperial Parliament"
 AOEIW9_TUR_politics_p3_6_desc:0 "Imperial Parliament survives, but on new terms. Its composition and powers will be altered so that it reinforces the Ottoman Young Officers settlement instead of preserving the old balance."
 AOEIW9_TUR_politics_p3_7:0 "The Ottoman Young Officers Settlement"
 AOEIW9_TUR_politics_p3_7_desc:0 "The political struggle around The Young Officers reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Ottoman Young Officers order."
 AOEIW9_TUR_politics_settlement:0 "The Sublime State Reorganised"
 AOEIW9_TUR_politics_settlement_desc:0 "The chosen settlement gives Sublime Porte, Imperial Parliament and Palace Secretariat a defined chain of authority instead of overlapping vetoes. the Ottoman Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_TUR_eco_root:0 "The Istanbul Industry Review"
 AOEIW9_TUR_eco_root_desc:0 "Istanbul Industry, Anatolian Railways and Zonguldak Coal do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Ottoman Empire can expand fastest."
 AOEIW9_TUR_eco_civ_1:0 "Survey the Istanbul Industry"
 AOEIW9_TUR_eco_civ_1_desc:0 "A detailed survey of Istanbul Industry will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_TUR_eco_civ_2:0 "Rails to Anatolian Railways"
 AOEIW9_TUR_eco_civ_2_desc:0 "Rail connections serving Anatolian Railways will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_TUR_eco_civ_3:0 "Capital for Zonguldak Coal"
 AOEIW9_TUR_eco_civ_3_desc:0 "State-backed credit will give Zonguldak Coal access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_TUR_eco_civ_4:0 "Power for Izmir Commerce"
 AOEIW9_TUR_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Izmir Commerce. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_TUR_eco_civ_5:0 "The Bosporus Shipyards Expansion"
 AOEIW9_TUR_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Bosporus Shipyards. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_TUR_eco_civ_6:0 "Renew Imperial Public Works"
 AOEIW9_TUR_eco_civ_6_desc:0 "Imperial Public Works will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_TUR_eco_civ_7:0 "A Second Shift at Istanbul Industry"
 AOEIW9_TUR_eco_civ_7_desc:0 "Istanbul Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_TUR_eco_war_1:0 "The Izmir Commerce Armaments Audit"
 AOEIW9_TUR_eco_war_1_desc:0 "An armaments audit will determine which parts of Izmir Commerce can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_TUR_eco_war_2:0 "War Orders for Bosporus Shipyards"
 AOEIW9_TUR_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Bosporus Shipyards, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_TUR_eco_war_3:0 "Precision Tools for Imperial Public Works"
 AOEIW9_TUR_eco_war_3_desc:0 "Precision machine tools will be prioritised for Imperial Public Works, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_TUR_eco_war_4:0 "Expand Istanbul Industry for Rearmament"
 AOEIW9_TUR_eco_war_4_desc:0 "New military production capacity will be built around Istanbul Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_TUR_eco_war_5:0 "Standardise Anatolian Railways"
 AOEIW9_TUR_eco_war_5_desc:0 "Factories tied to Anatolian Railways will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_TUR_eco_war_6:0 "Night Production at Zonguldak Coal"
 AOEIW9_TUR_eco_war_6_desc:0 "Night production will be organised at Zonguldak Coal with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_TUR_eco_war_7:0 "Long-Term Contracts for Izmir Commerce"
 AOEIW9_TUR_eco_war_7_desc:0 "Long-term contracts will give Izmir Commerce a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_TUR_eco_war_8:0 "Mobilise Bosporus Shipyards for Full Production"
 AOEIW9_TUR_eco_war_8_desc:0 "Bosporus Shipyards will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_TUR_eco_science_1:0 "Endow Istanbul Technical University"
 AOEIW9_TUR_eco_science_1_desc:0 "Stable public funding will give Istanbul Technical University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_TUR_eco_science_2:0 "New Laboratories at Imperial Medical Academy"
 AOEIW9_TUR_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Imperial Medical Academy. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_TUR_eco_science_3:0 "Applied Research at Ottoman Research Council"
 AOEIW9_TUR_eco_science_3_desc:0 "Ottoman Research Council will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_TUR_eco_science_4:0 "Industrial Physics at Istanbul Technical University"
 AOEIW9_TUR_eco_science_4_desc:0 "Industrial physics at Istanbul Technical University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_TUR_eco_science_5:0 "Production Science at Imperial Medical Academy"
 AOEIW9_TUR_eco_science_5_desc:0 "Researchers at Imperial Medical Academy will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_TUR_eco_science_6:0 "Research Grants for Ottoman Research Council"
 AOEIW9_TUR_eco_science_6_desc:0 "A national grant programme will connect Ottoman Research Council to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_TUR_eco_science_7:0 "Link Istanbul Technical University to the Factories"
 AOEIW9_TUR_eco_science_7_desc:0 "Istanbul Technical University will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_TUR_eco_infra_1:0 "Energy for Zonguldak Coal"
 AOEIW9_TUR_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Zonguldak Coal, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_TUR_eco_infra_2:0 "Freight Capacity at Izmir Commerce"
 AOEIW9_TUR_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Izmir Commerce will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_TUR_eco_infra_3:0 "Workers' Housing at Bosporus Shipyards"
 AOEIW9_TUR_eco_infra_3_desc:0 "Worker housing near Bosporus Shipyards will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_TUR_eco_infra_4:0 "Logistics through Imperial Public Works"
 AOEIW9_TUR_eco_infra_4_desc:0 "Imperial Public Works will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_TUR_eco_final:0 "The Ottoman Development State"
 AOEIW9_TUR_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a ottoman economy able to convert regional strengths into sustained national output."
 AOEIW9_TUR_mil_root:0 "Review the Ottoman General Staff"
 AOEIW9_TUR_mil_root_desc:0 "The Ottoman General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_TUR_mil_army_1:0 "The Army Training Commission"
 AOEIW9_TUR_mil_army_1_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_2:0 "The Anatolian Infantry School"
 AOEIW9_TUR_mil_army_2_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_TUR_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_TUR_mil_army_3_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_TUR_mil_army_4_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_5:0 "The Ottoman Mobile Corps"
 AOEIW9_TUR_mil_army_5_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_TUR_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_TUR_mil_army_6_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_TUR_mil_army_7_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_8:0 "One Supply Service"
 AOEIW9_TUR_mil_army_8_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_TUR_mil_army_9_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_TUR_mil_army_10_desc:0 "Anatolian terrain favours prepared infantry, while the empire's long approaches reward a carefully supplied mobile reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_TUR_mil_air_1:0 "Reorganise Ottoman Air Force"
 AOEIW9_TUR_mil_air_1_desc:0 "Ottoman Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_TUR_mil_air_2:0 "Fighter Instruction at Yeşilköy Air School"
 AOEIW9_TUR_mil_air_2_desc:0 "Yeşilköy Air School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_TUR_mil_air_3:0 "Ground Support Doctrine under Anatolian Air Command"
 AOEIW9_TUR_mil_air_3_desc:0 "Anatolian Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_TUR_mil_air_4:0 "Extend the Range of Ottoman Air Force"
 AOEIW9_TUR_mil_air_4_desc:0 "Ottoman Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Ottoman Empire's geography and strategic commitments."
 AOEIW9_TUR_mil_air_5:0 "Radar Networks for Yeşilköy Air School"
 AOEIW9_TUR_mil_air_5_desc:0 "Yeşilköy Air School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_TUR_mil_air_6:0 "Unify Command under Anatolian Air Command"
 AOEIW9_TUR_mil_air_6_desc:0 "Anatolian Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_TUR_mil_air_7:0 "Ottoman Air Force Comes of Age"
 AOEIW9_TUR_mil_air_7_desc:0 "Ottoman Air Force now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_TUR_mil_sea_1:0 "Review Ottoman Navy"
 AOEIW9_TUR_mil_sea_1_desc:0 "A full review of Ottoman Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_TUR_mil_sea_2:0 "Expand Golden Horn Arsenal"
 AOEIW9_TUR_mil_sea_2_desc:0 "Golden Horn Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_TUR_mil_sea_3:0 "Fleet Manoeuvres with Eastern Mediterranean Fleet"
 AOEIW9_TUR_mil_sea_3_desc:0 "Fleet exercises with Eastern Mediterranean Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_TUR_mil_sea_4:0 "Screening Doctrine for Ottoman Navy"
 AOEIW9_TUR_mil_sea_4_desc:0 "Ottoman Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_TUR_mil_sea_5:0 "Naval Aviation at Golden Horn Arsenal"
 AOEIW9_TUR_mil_sea_5_desc:0 "Naval aviation will be integrated with Golden Horn Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_TUR_mil_sea_6:0 "New Hulls for Eastern Mediterranean Fleet"
 AOEIW9_TUR_mil_sea_6_desc:0 "New hull standards for Eastern Mediterranean Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_TUR_mil_sea_7:0 "Sea Command under Ottoman Navy"
 AOEIW9_TUR_mil_sea_7_desc:0 "Ottoman Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Ottoman Empire. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_TUR_mil_final:0 "Ottoman Mobile Defence Doctrine"
 AOEIW9_TUR_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Ottoman Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_TUR_dip_root:0 "Define the Ottoman Grand Strategy"
 AOEIW9_TUR_dip_root_desc:0 "The Ottoman Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_TUR_dip_a_1:0 "The Persian Frontier"
 AOEIW9_TUR_dip_a_1_desc:0 "The Persian Frontier will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Ottoman Empire actually wants before pressure is applied."
 AOEIW9_TUR_dip_a_2:0 "Send a Mission on the Persian Frontier"
 AOEIW9_TUR_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Persian Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_TUR_dip_a_3:0 "Economic Leverage over the Persian Frontier"
 AOEIW9_TUR_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Persian Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_TUR_dip_a_4:0 "Staff Talks on the Persian Frontier"
 AOEIW9_TUR_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Persian Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_TUR_dip_a_5:0 "A Formal Warning over the Persian Frontier"
 AOEIW9_TUR_dip_a_5_desc:0 "A formal warning over the Persian Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_TUR_dip_a_6:0 "Terms for the Persian Frontier"
 AOEIW9_TUR_dip_a_6_desc:0 "Terms for an ultimatum on the Persian Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_TUR_dip_a_7:0 "The Decision on the Persian Frontier"
 AOEIW9_TUR_dip_a_7_desc:0 "The government reaches the decision point on the Persian Frontier. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_TUR_dip_b_1:0 "The Russian Straits"
 AOEIW9_TUR_dip_b_1_desc:0 "The Russian Straits will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Ottoman Empire actually wants before pressure is applied."
 AOEIW9_TUR_dip_b_2:0 "Send a Mission on the Russian Straits"
 AOEIW9_TUR_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Russian Straits. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_TUR_dip_b_3:0 "Economic Leverage over the Russian Straits"
 AOEIW9_TUR_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Russian Straits. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_TUR_dip_b_4:0 "Staff Talks on the Russian Straits"
 AOEIW9_TUR_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Russian Straits. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_TUR_dip_b_5:0 "A Formal Warning over the Russian Straits"
 AOEIW9_TUR_dip_b_5_desc:0 "A formal warning over the Russian Straits will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_TUR_dip_b_6:0 "Terms for the Russian Straits"
 AOEIW9_TUR_dip_b_6_desc:0 "Terms for an ultimatum on the Russian Straits will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_TUR_dip_b_7:0 "The Decision on the Russian Straits"
 AOEIW9_TUR_dip_b_7_desc:0 "The government reaches the decision point on the Russian Straits. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_TUR_dip_final:0 "The Ottoman Strategic Ring"
 AOEIW9_TUR_dip_final_desc:0 "The Ottoman Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_USA_focus_tree:0 "United States of America Focus Tree"
 AOEIW9_USA_politics_root:0 "The Republic at a Strategic Crossroads"
 AOEIW9_USA_politics_root_desc:0 "The constitutional machinery of United States of America has become a contest between Congress, White House and Supreme Court. Before foreign pressure hardens, the state must decide which institutions will actually govern and which will merely advise."
 AOEIW9_USA_politics_p1_1:0 "The Constitutional Republic"
 AOEIW9_USA_politics_p1_1_desc:0 "Congress, the courts and the White House must answer the emergency without breaking the constitutional order. Relief, reform and elections will preserve the republic against those who promise power without restraint."
 AOEIW9_USA_politics_p1_2:0 "Reconcile the White House"
 AOEIW9_USA_politics_p1_2_desc:0 "White House has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Constitutional Republic programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_USA_politics_p1_3:0 "Reform the Supreme Court"
 AOEIW9_USA_politics_p1_3_desc:0 "Supreme Court still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Constitutional Republic settlement."
 AOEIW9_USA_politics_p1_4:0 "Bind the State Governors"
 AOEIW9_USA_politics_p1_4_desc:0 "State Governors will be tied to the Constitutional Republic programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_USA_politics_p1_5:0 "Balance the Industrial Lobby"
 AOEIW9_USA_politics_p1_5_desc:0 "Neither abolishing Industrial Lobby nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Constitutional Republic coalition."
 AOEIW9_USA_politics_p1_6:0 "Codify the Labour Federations"
 AOEIW9_USA_politics_p1_6_desc:0 "Custom and emergency practice around Labour Federations will be replaced with written rules. Codification fixes its place in the Constitutional Republic order and limits future constitutional improvisation."
 AOEIW9_USA_politics_p1_7:0 "Congress and Nation"
 AOEIW9_USA_politics_p1_7_desc:0 "Congress will be presented as part of the national political order rather than a factional institution. The Constitutional Republic camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_USA_politics_p2_1:0 "The Economic Emergency"
 AOEIW9_USA_politics_p2_1_desc:0 "Credit failures, unemployment and broken supply contracts have become a federal emergency. Relief can buy time, but the crisis has already weakened confidence in civilian government."
 AOEIW9_USA_politics_p2_2:0 "Government Paralysis"
 AOEIW9_USA_politics_p2_2_desc:0 "Congress, the courts and the executive now block one another while conditions worsen. Administrative paralysis is becoming a danger in its own right."
 AOEIW9_USA_politics_p2_3:0 "The Governors' Conference"
 AOEIW9_USA_politics_p2_3_desc:0 "State governments demand authority over relief and security. Negotiation may preserve federalism; coercion may preserve order, but neither choice is painless."
 AOEIW9_USA_politics_p2_4:0 "Federal-State Confrontation"
 AOEIW9_USA_politics_p2_4_desc:0 "Competing orders now reach railways, depots and police forces. The constitutional dispute has become a practical struggle over who can still govern."
 AOEIW9_USA_politics_p2_5:0 "War Department Contingency Plans"
 AOEIW9_USA_politics_p2_5_desc:0 "The General Staff will prepare continuity plans for transport, communications and strategic industry. Planning for collapse carries the risk of making military intervention conceivable."
 AOEIW9_USA_politics_p2_6:0 "The Constitutional Ultimatum"
 AOEIW9_USA_politics_p2_6_desc:0 "Civil institutions must either agree on a temporary transfer of emergency powers or accept an executive-military solution. The republic has reached its last procedural safeguard."
 AOEIW9_USA_politics_p2_7:0 "A Temporary Military Administration"
 AOEIW9_USA_politics_p2_7_desc:0 "A limited military administration will restore essential services under a public promise of constitutional review. Whether that promise is kept will decide the country's future."
 AOEIW9_USA_politics_p3_1:0 "The Workers' Republic"
 AOEIW9_USA_politics_p3_1_desc:0 "Industrial unions and unemployed councils argue that the Depression has already discredited the old republic. Their programme combines workplace power, public ownership and a new constitution written by labour."
 AOEIW9_USA_politics_p3_2:0 "Mobilise the State Governors"
 AOEIW9_USA_politics_p3_2_desc:0 "State Governors will become an organising arm of the Workers' Republic programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_USA_politics_p3_3:0 "Break the Industrial Lobby"
 AOEIW9_USA_politics_p3_3_desc:0 "The independent power of Industrial Lobby is incompatible with the Workers' Republic project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_USA_politics_p3_4:0 "Replace the Labour Federations"
 AOEIW9_USA_politics_p3_4_desc:0 "Labour Federations will be removed from its gatekeeping role and replaced with officials loyal to the Workers' Republic settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_USA_politics_p3_5:0 "Command the Congress"
 AOEIW9_USA_politics_p3_5_desc:0 "Congress will answer directly to the authorities created by the Workers' Republic path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_USA_politics_p3_6:0 "Reshape the White House"
 AOEIW9_USA_politics_p3_6_desc:0 "White House survives, but on new terms. Its composition and powers will be altered so that it reinforces the Workers' Republic settlement instead of preserving the old balance."
 AOEIW9_USA_politics_p3_7:0 "The Stars Turn Red"
 AOEIW9_USA_politics_p3_7_desc:0 "The old federal order has lost the factories and the streets. Workers’ delegates will carry their mandate into Washington and proclaim a republic answerable to labour."
 AOEIW9_USA_politics_settlement:0 "Washington Governs Again"
 AOEIW9_USA_politics_settlement_desc:0 "Orders once again pass from a recognised government to courts, states and federal offices. The constitutional crisis is over; its victors now have to govern the country they claimed to save."
 AOEIW9_USA_eco_root:0 "The American Great Lakes Industry Review"
 AOEIW9_USA_eco_root_desc:0 "Great Lakes Industry, Detroit Motor Works and Tennessee Valley Authority do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where United States of America can expand fastest."
 AOEIW9_USA_eco_civ_1:0 "Survey the American Great Lakes Industry"
 AOEIW9_USA_eco_civ_1_desc:0 "A detailed survey of Great Lakes Industry will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork. In the United States, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_USA_eco_civ_2:0 "Rails to Detroit Motor Works"
 AOEIW9_USA_eco_civ_2_desc:0 "Rail connections serving Detroit Motor Works will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_USA_eco_civ_3:0 "Capital for Tennessee Valley Authority"
 AOEIW9_USA_eco_civ_3_desc:0 "State-backed credit will give Tennessee Valley Authority access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_USA_eco_civ_4:0 "Power for New York Finance"
 AOEIW9_USA_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward New York Finance. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_USA_eco_civ_5:0 "The West Coast Shipyards Expansion"
 AOEIW9_USA_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to West Coast Shipyards. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_USA_eco_civ_6:0 "Put the Bureau of Public Roads to Work"
 AOEIW9_USA_eco_civ_6_desc:0 "Federal engineers and state crews will turn Depression relief into roads that connect farms, factories and military depots."
 AOEIW9_USA_eco_civ_7:0 "A Second Shift in American Great Lakes Industry"
 AOEIW9_USA_eco_civ_7_desc:0 "Great Lakes Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth. In the United States, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_USA_eco_war_1:0 "The New York Finance Armaments Audit"
 AOEIW9_USA_eco_war_1_desc:0 "An armaments audit will determine which parts of New York Finance can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_USA_eco_war_2:0 "War Orders for West Coast Shipyards"
 AOEIW9_USA_eco_war_2_desc:0 "Long-term armament contracts will be assigned to West Coast Shipyards, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_USA_eco_war_3:0 "Machine Tools for the Federal Roads"
 AOEIW9_USA_eco_war_3_desc:0 "Bridge shops and road depots need the same precision drills, gauges and lathes demanded by the armament plants. Washington will equip both."
 AOEIW9_USA_eco_war_4:0 "Expand American Great Lakes Industry for Rearmament"
 AOEIW9_USA_eco_war_4_desc:0 "New military production capacity will be built around Great Lakes Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile. In the United States, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_USA_eco_war_5:0 "Standardise Detroit Motor Works"
 AOEIW9_USA_eco_war_5_desc:0 "Factories tied to Detroit Motor Works will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_USA_eco_war_6:0 "Night Production at Tennessee Valley Authority"
 AOEIW9_USA_eco_war_6_desc:0 "Night production will be organised at Tennessee Valley Authority with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_USA_eco_war_7:0 "Long-Term Contracts for New York Finance"
 AOEIW9_USA_eco_war_7_desc:0 "Long-term contracts will give New York Finance a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_USA_eco_war_8:0 "Mobilise West Coast Shipyards for Full Production"
 AOEIW9_USA_eco_war_8_desc:0 "West Coast Shipyards will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_USA_eco_science_1:0 "Endow MIT Laboratories"
 AOEIW9_USA_eco_science_1_desc:0 "Stable public funding will give MIT Laboratories laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_USA_eco_science_2:0 "New Laboratories at National Bureau of Standards"
 AOEIW9_USA_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of National Bureau of Standards. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_USA_eco_science_3:0 "NACA Takes the Lead"
 AOEIW9_USA_eco_science_3_desc:0 "Langley’s wind tunnels will bring university theory, military requirements and aircraft builders into the same experiments."
 AOEIW9_USA_eco_science_4:0 "Industrial Physics at MIT Laboratories"
 AOEIW9_USA_eco_science_4_desc:0 "Industrial physics at MIT Laboratories will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_USA_eco_science_5:0 "Production Science at National Bureau of Standards"
 AOEIW9_USA_eco_science_5_desc:0 "Researchers at National Bureau of Standards will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_USA_eco_science_6:0 "More Wind Tunnels at Langley"
 AOEIW9_USA_eco_science_6_desc:0 "NACA will test full-scale wings, engines and high-speed forms instead of leaving manufacturers to repeat one another’s mistakes."
 AOEIW9_USA_eco_science_7:0 "Link MIT Laboratories to the Factories"
 AOEIW9_USA_eco_science_7_desc:0 "MIT Laboratories will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_USA_eco_infra_1:0 "Energy for Tennessee Valley Authority"
 AOEIW9_USA_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Tennessee Valley Authority, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_USA_eco_infra_2:0 "Freight Capacity at New York Finance"
 AOEIW9_USA_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving New York Finance will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_USA_eco_infra_3:0 "Workers' Housing at West Coast Shipyards"
 AOEIW9_USA_eco_infra_3_desc:0 "Worker housing near West Coast Shipyards will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_USA_eco_infra_4:0 "Defense Roads Across the States"
 AOEIW9_USA_eco_infra_4_desc:0 "The Bureau of Public Roads will mark the bridges, bypasses and depot approaches needed to move an army across the continent."
 AOEIW9_USA_eco_final:0 "The Continental Production Machine"
 AOEIW9_USA_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a american economy able to convert regional strengths into sustained national output."
 AOEIW9_USA_mil_root:0 "Review the United States Army Staff"
 AOEIW9_USA_mil_root_desc:0 "The United States Army Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_USA_mil_army_1:0 "The Louisiana Maneuvers"
 AOEIW9_USA_mil_army_1_desc:0 "Two field armies will test mass mobilisation across Louisiana and Texas. Traffic jams, broken radios and exhausted supply columns will settle the argument before an enemy does."
 AOEIW9_USA_mil_army_2:0 "The Infantry-ArtilIery Team"
 AOEIW9_USA_mil_army_2_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_USA_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_USA_mil_army_3_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_USA_mil_army_4_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_5:0 "The Armored Force"
 AOEIW9_USA_mil_army_5_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_USA_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_USA_mil_army_6_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_USA_mil_army_7_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_8:0 "One Supply Service"
 AOEIW9_USA_mil_army_8_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_USA_mil_army_9_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_USA_mil_army_10_desc:0 "American mobilisation must decide whether mass firepower or mechanised exploitation receives the first claim on its instructors. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_USA_mil_air_1:0 "Reorganise United States Army Air Corps"
 AOEIW9_USA_mil_air_1_desc:0 "United States Army Air Corps will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_USA_mil_air_2:0 "Lessons from Maxwell Field"
 AOEIW9_USA_mil_air_2_desc:0 "The Air Corps Tactical School will turn its arguments over pursuit, bombardment and ground support into an operational syllabus."
 AOEIW9_USA_mil_air_3:0 "Ground Support Doctrine under Strategic Bomber Command"
 AOEIW9_USA_mil_air_3_desc:0 "Strategic Bomber Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_USA_mil_air_4:0 "Extend the Range of United States Army Air Corps"
 AOEIW9_USA_mil_air_4_desc:0 "United States Army Air Corps will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by United States of America's geography and strategic commitments."
 AOEIW9_USA_mil_air_5:0 "Radar at Fort Monmouth"
 AOEIW9_USA_mil_air_5_desc:0 "Signal Corps engineers at Fort Monmouth will move radio detection from laboratory benches to a usable warning network."
 AOEIW9_USA_mil_air_6:0 "Unify Command under Strategic Bomber Command"
 AOEIW9_USA_mil_air_6_desc:0 "Strategic Bomber Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_USA_mil_air_7:0 "United States Army Air Corps Comes of Age"
 AOEIW9_USA_mil_air_7_desc:0 "United States Army Air Corps now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_USA_mil_sea_1:0 "Review United States Navy"
 AOEIW9_USA_mil_sea_1_desc:0 "A full review of United States Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_USA_mil_sea_2:0 "Expand Norfolk Naval Yard"
 AOEIW9_USA_mil_sea_2_desc:0 "Norfolk Naval Yard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_USA_mil_sea_3:0 "Fleet Manoeuvres with Pacific Fleet"
 AOEIW9_USA_mil_sea_3_desc:0 "Fleet exercises with Pacific Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_USA_mil_sea_4:0 "Screening Doctrine for United States Navy"
 AOEIW9_USA_mil_sea_4_desc:0 "United States Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_USA_mil_sea_5:0 "Naval Aviation at Norfolk Naval Yard"
 AOEIW9_USA_mil_sea_5_desc:0 "Naval aviation will be integrated with Norfolk Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_USA_mil_sea_6:0 "New Hulls for Pacific Fleet"
 AOEIW9_USA_mil_sea_6_desc:0 "New hull standards for Pacific Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_USA_mil_sea_7:0 "Sea Command under United States Navy"
 AOEIW9_USA_mil_sea_7_desc:0 "United States Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to United States of America. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_USA_mil_final:0 "Industrial Warfare"
 AOEIW9_USA_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. United States of America now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_USA_dip_root:0 "Define the Two-Ocean Doctrine"
 AOEIW9_USA_dip_root_desc:0 "United States of America must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_USA_dip_a_1:0 "The Atlantic Question"
 AOEIW9_USA_dip_a_1_desc:0 "The Atlantic Question will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what United States of America actually wants before pressure is applied."
 AOEIW9_USA_dip_a_2:0 "Send a Mission on the Atlantic Question"
 AOEIW9_USA_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Atlantic Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_USA_dip_a_3:0 "Economic Leverage over the Atlantic Question"
 AOEIW9_USA_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Atlantic Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_USA_dip_a_4:0 "Staff Talks on the Atlantic Question"
 AOEIW9_USA_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Atlantic Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_USA_dip_a_5:0 "A Formal Warning over the Atlantic Question"
 AOEIW9_USA_dip_a_5_desc:0 "A formal warning over the Atlantic Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_USA_dip_a_6:0 "Terms for the Atlantic Question"
 AOEIW9_USA_dip_a_6_desc:0 "Terms for an ultimatum on the Atlantic Question will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_USA_dip_a_7:0 "The Decision on the Atlantic Question"
 AOEIW9_USA_dip_a_7_desc:0 "The government reaches the decision point on the Atlantic Question. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_USA_dip_b_1:0 "The Pacific Challenge"
 AOEIW9_USA_dip_b_1_desc:0 "The Pacific Challenge will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what United States of America actually wants before pressure is applied."
 AOEIW9_USA_dip_b_2:0 "Send a Mission on the Pacific Challenge"
 AOEIW9_USA_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Pacific Challenge. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_USA_dip_b_3:0 "Economic Leverage over the Pacific Challenge"
 AOEIW9_USA_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Pacific Challenge. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_USA_dip_b_4:0 "Staff Talks on the Pacific Challenge"
 AOEIW9_USA_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Pacific Challenge. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_USA_dip_b_5:0 "A Formal Warning over the Pacific Challenge"
 AOEIW9_USA_dip_b_5_desc:0 "A formal warning over the Pacific Challenge will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_USA_dip_b_6:0 "Terms for the Pacific Challenge"
 AOEIW9_USA_dip_b_6_desc:0 "Terms for an ultimatum on the Pacific Challenge will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_USA_dip_b_7:0 "The Decision on the Pacific Challenge"
 AOEIW9_USA_dip_b_7_desc:0 "The government reaches the decision point on the Pacific Challenge. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_USA_dip_final:0 "A Two-Ocean Strategy"
 AOEIW9_USA_dip_final_desc:0 "United States of America's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_USA_special_1:0 "The Arsenal of Democracy"
 AOEIW9_USA_special_1_desc:0 "The factories of the republic will supply arms on a scale no aggressor can match. Every contract now serves that promise."
 AOEIW9_USA_special_2:0 "Detroit Changes Its Dies"
 AOEIW9_USA_special_2_desc:0 "Automobile plants will halt familiar models, re-cut their dies and learn to deliver engines, trucks and armoured hulls by the thousand."
 AOEIW9_USA_special_3:0 "Federal War Contracts"
 AOEIW9_USA_special_3_desc:0 "Federal War Contracts links economic capacity, planning and military requirements that already exist in United States of America. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_USA_special_4:0 "Synthetic Materials Drive"
 AOEIW9_USA_special_4_desc:0 "By pursuing Synthetic Materials Drive, United States of America commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_USA_special_5:0 "Mass Production Standards"
 AOEIW9_USA_special_5_desc:0 "Mass Production Standards addresses a strategic problem that is specific to United States of America. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_USA_special_6:0 "The Victory Plant Network"
 AOEIW9_USA_special_6_desc:0 "The government will turn The Victory Plant Network into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting United States of America's situation rather than from a universal template."
 AOEIW9_USA_special_7:0 "Continental Logistics"
 AOEIW9_USA_special_7_desc:0 "Continental Logistics links economic capacity, planning and military requirements that already exist in United States of America. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_USA_special_8:0 "Arsenal of the Republic"
 AOEIW9_USA_special_8_desc:0 "By pursuing Arsenal of the Republic, United States of America commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_YUG_focus_tree:0 "Kingdom of Yugoslavia Focus Tree"
 AOEIW9_YUG_politics_p1_2:0 "Reconcile the Yugoslav National Assembly"
 AOEIW9_YUG_politics_p1_2_desc:0 "National Assembly has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Royal Compromise programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_YUG_politics_p1_3:0 "Reform the Serbian Officers"
 AOEIW9_YUG_politics_p1_3_desc:0 "Serbian Officers still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Royal Compromise settlement."
 AOEIW9_YUG_politics_p1_4:0 "Bind the Croatian Deputies"
 AOEIW9_YUG_politics_p1_4_desc:0 "Croatian Deputies will be tied to the Royal Compromise programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_YUG_politics_p1_5:0 "Balance the Slovene Councils"
 AOEIW9_YUG_politics_p1_5_desc:0 "Neither abolishing Slovene Councils nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Royal Compromise coalition."
 AOEIW9_YUG_politics_p1_6:0 "Royal Court and Nation in Kingdom of Yugoslavia"
 AOEIW9_YUG_politics_p1_6_desc:0 "Royal Court will be presented as part of the national political order rather than a factional institution. The Royal Compromise camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_YUG_politics_p2_2:0 "Open the Serbian Officers"
 AOEIW9_YUG_politics_p2_2_desc:0 "Access to Serbian Officers will be widened and its procedures made less dependent on closed patronage. The reform gives the Centralise Belgrade camp a legal route to broaden its support without bypassing the state."
 AOEIW9_YUG_politics_p2_3:0 "Guarantee the Croatian Deputies"
 AOEIW9_YUG_politics_p2_3_desc:0 "The position of Croatian Deputies will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Centralise Belgrade settlement."
 AOEIW9_YUG_politics_p2_4:0 "Broaden the Slovene Councils"
 AOEIW9_YUG_politics_p2_4_desc:0 "Slovene Councils will receive a wider role in consultation, administration and mobilisation. The Centralise Belgrade project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_YUG_politics_p2_5:0 "Entrust the Banovina Administrations"
 AOEIW9_YUG_politics_p2_5_desc:0 "Responsibility now shifts toward Banovina Administrations, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Centralise Belgrade system can govern through delegated institutions."
 AOEIW9_YUG_politics_p2_6:0 "Rewrite the Vidovdan Constitution"
 AOEIW9_YUG_politics_p2_6_desc:0 "Federal deputies will revise the central powers created at Vidovdan and protect regional government. A common state must make room for more than one national majority."
 AOEIW9_YUG_politics_p3_2:0 "Mobilise the Croatian Deputies"
 AOEIW9_YUG_politics_p3_2_desc:0 "Croatian Deputies will become an organising arm of the Federal Yugoslavism programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_YUG_politics_p3_3:0 "Break the Slovene Councils"
 AOEIW9_YUG_politics_p3_3_desc:0 "The independent power of Slovene Councils is incompatible with the Federal Yugoslavism project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_YUG_politics_p3_4:0 "Replace the Banovina Administrations"
 AOEIW9_YUG_politics_p3_4_desc:0 "Banovina Administrations will be removed from its gatekeeping role and replaced with officials loyal to the Federal Yugoslavism settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_YUG_politics_p3_5:0 "Command the Yugoslav Royal Court"
 AOEIW9_YUG_politics_p3_5_desc:0 "Royal Court will answer directly to the authorities created by the Federal Yugoslavism path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_YUG_politics_p3_6:0 "A Banovina for Every People"
 AOEIW9_YUG_politics_p3_6_desc:0 "Federal Yugoslavism will give the principal peoples territorial administrations with defined powers. Unity becomes a bargain written on the map."
 AOEIW9_YUG_politics_settlement:0 "The Kingdom Finds Its Balance"
 AOEIW9_YUG_politics_settlement_desc:0 "Court, assembly and banovinas now know who appoints, taxes and mobilises. Yugoslavia can govern without reopening the national question at every decree."
 AOEIW9_YUG_eco_root:0 "The Belgrade Industry Review"
 AOEIW9_YUG_eco_root_desc:0 "Belgrade Industry, Zagreb Workshops and Bosnian Mines do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Yugoslavia can expand fastest."
 AOEIW9_YUG_eco_civ_2:0 "Rails to Zagreb Workshops"
 AOEIW9_YUG_eco_civ_2_desc:0 "Rail connections serving Zagreb Workshops will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_YUG_eco_civ_5:0 "The National Railways Expansion"
 AOEIW9_YUG_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to National Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_YUG_eco_civ_6:0 "Renew Danube Commerce"
 AOEIW9_YUG_eco_civ_6_desc:0 "Danube Commerce will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_YUG_eco_civ_7:0 "A Second Shift at Belgrade Industry"
 AOEIW9_YUG_eco_civ_7_desc:0 "Belgrade Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_YUG_eco_civ_8:0 "Public Works at Zagreb Workshops"
 AOEIW9_YUG_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Zagreb Workshops will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_YUG_eco_war_1:0 "The Adriatic Ports Armaments Audit"
 AOEIW9_YUG_eco_war_1_desc:0 "An armaments audit will determine which parts of Adriatic Ports can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_YUG_eco_war_2:0 "War Orders for National Railways"
 AOEIW9_YUG_eco_war_2_desc:0 "Long-term armament contracts will be assigned to National Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_YUG_eco_war_3:0 "Precision Tools for Danube Commerce"
 AOEIW9_YUG_eco_war_3_desc:0 "Precision machine tools will be prioritised for Danube Commerce, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_YUG_eco_war_4:0 "Expand Belgrade Industry for Rearmament"
 AOEIW9_YUG_eco_war_4_desc:0 "New military production capacity will be built around Belgrade Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_YUG_eco_war_5:0 "Standardise Zagreb Workshops"
 AOEIW9_YUG_eco_war_5_desc:0 "Factories tied to Zagreb Workshops will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_YUG_eco_war_6:0 "Night Production at Bosnian Mines"
 AOEIW9_YUG_eco_war_6_desc:0 "Night production will be organised at Bosnian Mines with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_YUG_eco_war_7:0 "Long-Term Contracts for Adriatic Ports"
 AOEIW9_YUG_eco_war_7_desc:0 "Long-term contracts will give Adriatic Ports a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_YUG_eco_science_1:0 "Endow University of Belgrade"
 AOEIW9_YUG_eco_science_1_desc:0 "Stable public funding will give University of Belgrade laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_YUG_eco_science_2:0 "New Laboratories at Zagreb Technical Faculty"
 AOEIW9_YUG_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Zagreb Technical Faculty. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_YUG_eco_science_3:0 "Belgrade University Opens Its Laboratories"
 AOEIW9_YUG_eco_science_3_desc:0 "University laboratories will work with railway, mining and armament engineers. Research must travel beyond the capital through shared instruments and results."
 AOEIW9_YUG_eco_science_4:0 "Industrial Physics at University of Belgrade"
 AOEIW9_YUG_eco_science_4_desc:0 "Industrial physics at University of Belgrade will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_YUG_eco_science_5:0 "Production Science at Zagreb Technical Faculty"
 AOEIW9_YUG_eco_science_5_desc:0 "Researchers at Zagreb Technical Faculty will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_YUG_eco_science_6:0 "Scholarships across the Kingdom"
 AOEIW9_YUG_eco_science_6_desc:0 "Students from every banovina will receive technical scholarships tied to public works and industry. Training becomes a benefit the regions can see."
 AOEIW9_YUG_eco_infra_2:0 "Freight Capacity at Adriatic Ports"
 AOEIW9_YUG_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Adriatic Ports will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_YUG_eco_infra_3:0 "Workers' Housing at National Railways"
 AOEIW9_YUG_eco_infra_3_desc:0 "Worker housing near National Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_YUG_eco_infra_4:0 "Logistics through Danube Commerce"
 AOEIW9_YUG_eco_infra_4_desc:0 "Danube Commerce will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_YUG_eco_final:0 "The Yugoslav Development State"
 AOEIW9_YUG_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a yugoslav economy able to convert regional strengths into sustained national output."
 AOEIW9_YUG_mil_root:0 "Review the Yugoslav General Staff"
 AOEIW9_YUG_mil_root_desc:0 "The Yugoslav General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_YUG_mil_army_2:0 "Mountain Divisions Field Manoeuvres"
 AOEIW9_YUG_mil_army_2_desc:0 "Large field exercises with the Mountain Divisions will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_YUG_mil_army_5:0 "Motorise the Belgrade Staff College"
 AOEIW9_YUG_mil_army_5_desc:0 "Motor transport assigned to the Belgrade Staff College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_YUG_mil_army_6:0 "Staff Procedures at the Yugoslav General Staff"
 AOEIW9_YUG_mil_army_6_desc:0 "Staff officers at the Yugoslav General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_YUG_mil_army_7:0 "Armour Studies at the Mountain Divisions"
 AOEIW9_YUG_mil_army_7_desc:0 "The Mountain Divisions will study how armour can be integrated with infantry, artillery and logistics under yugoslav conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_YUG_mil_army_8:0 "Yugoslav Operational Planning at the Royal Guard"
 AOEIW9_YUG_mil_army_8_desc:0 "Operational planning with the Royal Guard will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain. For Yugoslavia, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_YUG_mil_army_9:0 "Gunnery at Sarajevo"
 AOEIW9_YUG_mil_army_9_desc:0 "Artillery units will standardise observation, firing tables and ammunition practice around Sarajevo. Doctrine will be learned by batteries rather than issued by a fictional directorate."
 AOEIW9_YUG_mil_air_1:0 "Reorganise Royal Yugoslav Air Force"
 AOEIW9_YUG_mil_air_1_desc:0 "Royal Yugoslav Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_YUG_mil_air_2:0 "Fighter Instruction at Zemun Air Base"
 AOEIW9_YUG_mil_air_2_desc:0 "Zemun Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_YUG_mil_air_3:0 "Yugoslav Ground Support Doctrine under Balkan Air Command"
 AOEIW9_YUG_mil_air_3_desc:0 "Balkan Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Yugoslavia, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_YUG_mil_air_4:0 "Extend the Range of Royal Yugoslav Air Force"
 AOEIW9_YUG_mil_air_4_desc:0 "Royal Yugoslav Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Yugoslavia's geography and strategic commitments."
 AOEIW9_YUG_mil_air_5:0 "Radar Networks for Zemun Air Base"
 AOEIW9_YUG_mil_air_5_desc:0 "Zemun Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_YUG_mil_air_6:0 "Unify Command under Balkan Air Command"
 AOEIW9_YUG_mil_air_6_desc:0 "Balkan Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_YUG_mil_sea_1:0 "Review Royal Yugoslav Navy"
 AOEIW9_YUG_mil_sea_1_desc:0 "A full review of Royal Yugoslav Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_YUG_mil_sea_2:0 "Expand Split Naval Base"
 AOEIW9_YUG_mil_sea_2_desc:0 "Split Naval Base will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_YUG_mil_sea_3:0 "Fleet Manoeuvres with Adriatic Squadron"
 AOEIW9_YUG_mil_sea_3_desc:0 "Fleet exercises with Adriatic Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_YUG_mil_sea_4:0 "Screening Doctrine for Royal Yugoslav Navy"
 AOEIW9_YUG_mil_sea_4_desc:0 "Royal Yugoslav Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_YUG_mil_sea_5:0 "Naval Aviation at Split Naval Base"
 AOEIW9_YUG_mil_sea_5_desc:0 "Naval aviation will be integrated with Split Naval Base for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_YUG_mil_sea_6:0 "New Hulls for Adriatic Squadron"
 AOEIW9_YUG_mil_sea_6_desc:0 "New hull standards for Adriatic Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_YUG_mil_final:0 "Yugoslav Mountain Defence Doctrine"
 AOEIW9_YUG_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Yugoslavia now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_YUG_dip_root:0 "Define the South Slav Doctrine"
 AOEIW9_YUG_dip_root_desc:0 "The Kingdom of Yugoslavia must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_YUG_dip_a_2:0 "The Rome–Belgrade Conference"
 AOEIW9_YUG_dip_a_2_desc:0 "A formal Rome-Belgrade conference will separate alliance obligations from bilateral disputes and establish a permanent diplomatic channel."
 AOEIW9_YUG_dip_a_3:0 "Adriatic Trade Guarantees"
 AOEIW9_YUG_dip_a_3_desc:0 "Adriatic shipping and commercial access will be protected from political quarrels through reciprocal guarantees."
 AOEIW9_YUG_dip_a_4:0 "League Staff Consultations"
 AOEIW9_YUG_dip_a_4_desc:0 "League staff consultations will coordinate defence while preserving a distinct Yugoslav command structure."
 AOEIW9_YUG_dip_a_5:0 "The Balkan Pact Respects the Banovinas"
 AOEIW9_YUG_dip_a_5_desc:0 "Any Balkan agreement must preserve the regional guarantees made at home. Belgrade cannot promise abroad the powers it surrendered to the banovinas."
 AOEIW9_YUG_dip_a_6:0 "Yugoslavia's Place in the League"
 AOEIW9_YUG_dip_a_6_desc:0 "Yugoslavia accepts the League as its strategic framework, provided Italian leadership remains leadership rather than domination."
 AOEIW9_YUG_dip_b_1:0 "The Macedonian Dispute"
 AOEIW9_YUG_dip_b_1_desc:0 "The Macedonian question cannot be wished away merely because Sofia and Belgrade now share a faction."
 AOEIW9_YUG_dip_b_2:0 "Request Italian Arbitration"
 AOEIW9_YUG_dip_b_2_desc:0 "Italy will be asked to arbitrate the dispute before nationalist pressure turns an alliance problem into an armed confrontation."
 AOEIW9_YUG_dip_b_3:0 "Minority Guarantees in Macedonia"
 AOEIW9_YUG_dip_b_3_desc:0 "Mutual guarantees for local communities offer a cheaper and more stable alternative to redrawing borders by force."
 AOEIW9_YUG_dip_b_4:0 "Survey the Macedonian Border"
 AOEIW9_YUG_dip_b_4_desc:0 "Mixed teams will mark roads, posts and disputed villages before Sofia and Belgrade negotiate. A line on a conference map must correspond to the ground."
 AOEIW9_YUG_dip_b_5:0 "Freeze the Territorial Claims"
 AOEIW9_YUG_dip_b_5_desc:0 "Both governments will suspend revisionist claims while the League security system remains in force."
 AOEIW9_YUG_dip_b_6:0 "The Claims Freeze at Sofia"
 AOEIW9_YUG_dip_b_6_desc:0 "Both governments suspend new territorial claims and accept monitored procedures for incidents. The compromise buys a border that soldiers need not test."
 AOEIW9_YUG_dip_final:0 "Belgrade within the Mediterranean League"
 AOEIW9_YUG_dip_final_desc:0 "The Kingdom of Yugoslavia's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW_old_order_cooperation:0 "Old Order Defence Cooperation"
 AOEIW_reichspakt_cooperation:0 "Reichspakt Cooperation"
 AOEIW_mediterranean_league_cooperation:0 "Mediterranean League Cooperation"
 AOEIW_mediterranean_arbitration:0 "League Arbitration"
 AOEIW_german_austrian_understanding:0 "Berlin–Vienna Understanding"
 AOEIW_luso_brazilian_union_opinion:0 "Luso-Brazilian Constitutional Compact"
 AOEIW_luso_brazilian_compact_por:0 "The Luso-Brazilian Compact"
 AOEIW_luso_brazilian_compact_por_desc:0 "Lisbon and Rio are tied together by a permanent imperial council, common investment institutions and negotiated constitutional obligations."
 AOEIW_luso_brazilian_compact_bra:0 "Rights within the Imperial Compact"
 AOEIW_luso_brazilian_compact_bra_desc:0 "Brazilian representation and investment rights make the Portuguese connection more durable while preserving the existing subject relationship."
 AOEIW11_strategic_foreign_office:0 "Strategic Foreign Office"
 AOEIW11_strategic_foreign_office_desc:0 "Diplomatic missions, trade policy and military planning are coordinated against clearly defined national objectives."
 AOEIW11_trade_protocols:0 "Bilateral Trade Protocols"
 AOEIW11_trade_protocols_desc:0 "Stable access to capital, transit and strategic goods supports civilian investment and reduces friction in the national economy."
 AOEIW11_economic_pressure:0 "Economic Pressure Apparatus"
 AOEIW11_economic_pressure_desc:0 "Credit, tariffs, intelligence and access to strategic goods are organized as instruments of state power."
 AOEIW11_cooperative_security:0 "Cooperative Security Planning"
 AOEIW11_cooperative_security_desc:0 "Regular staff contacts and political agreements reduce mobilisation risk and make defensive planning more coherent."
 AOEIW11_strategic_pressure:0 "Sustained Strategic Pressure"
 AOEIW11_strategic_pressure_desc:0 "Economic leverage, intelligence and military preparations are maintained together instead of as disconnected reactions."
 AOEIW11_arbitration_framework:0 "Permanent Arbitration Framework"
 AOEIW11_arbitration_framework_desc:0 "Border commissions, minority guarantees and continuing diplomatic channels keep disputes inside a negotiated framework."
 AOEIW11_grand_strategy:0 "Integrated Grand Strategy"
 AOEIW11_grand_strategy_desc:0 "Foreign policy, military planning and economic leverage now serve the same set of strategic priorities."
 AOEIW11_faction_leadership:0 "Institutional Faction Leadership"
 AOEIW11_faction_leadership_desc:0 "The alliance is led through standing conferences, coordinated procurement and defined military responsibilities."
 AOEIW11_faction_coordination:0 "Faction Coordination Protocols"
 AOEIW11_faction_coordination_desc:0 "Staff planning and reinforcement procedures connect national forces to the wider alliance without erasing national command."
 AOEIW11_POL_reichspakt_integration:0 "Loyal Reichspakt Integration"
 AOEIW11_POL_reichspakt_integration_desc:0 "German investment and joint defence planning strengthen Poland inside the Reichspakt, at the price of greater dependence on Berlin."
 AOEIW11_POL_negotiated_autonomy:0 "The Berlin–Warsaw Compact"
 AOEIW11_POL_negotiated_autonomy_desc:0 "Poland controls more of its administration and procurement while retaining negotiated military and economic ties to Germany."
 AOEIW11_POL_sovereign_reconstruction:0 "Sovereign Reconstruction"
 AOEIW11_POL_sovereign_reconstruction_desc:0 "The institutions built for the independence crisis give Warsaw freedom of action, but confrontation and emergency mobilisation strain domestic stability."
 AOEIW11_POL_loyal_integration_autonomy:0 "Loyal Reichspakt integration"
 AOEIW11_POL_negotiated_autonomy_gain:0 "The Berlin–Warsaw autonomy compact"
 AOEIW11_POL_independence_mobilisation:0 "Mobilisation for Polish sovereignty"
 AOEIW11_diplomatic_mission:0 "Diplomatic Mission"
 AOEIW11_strategic_pressure_opinion:0 "Strategic Pressure"
 AOEIW11_arbitration_channel:0 "Permanent Arbitration Channel"
 AOEIW11_independence_crisis_opinion:0 "The Polish Independence Crisis"
 AOEIW11_formal_warning_opinion:0 "Formal Diplomatic Warning"
 AOEIW11_ultimatum_opinion:0 "Strategic Ultimatum"
 aoeiw10_story.1.t:0 "The Delegations Assemble in Vienna"
 aoeiw10_story.1.d:0 "The political settlement has ended the argument over who governs, but not how the Crown Lands are heard. Czech, Croatian, Hungarian and Austrian delegations have arrived in Vienna with incompatible petitions. The court can recognize them as partners in a Danubian compact, or order the ministries to administer a single imperial programme."
 aoeiw10_story.1.a:0 "Give the Crown Lands a federal voice."
 aoeiw10_story.1.b:0 "Vienna must issue one directive."
 aoeiw10_story.2.t:0 "The Price of the Danubian Compact"
 aoeiw10_story.2.d:0 "The delegates accept common defence and finance, but demand written guarantees for provincial administration and language rights. Ratification will consume the government's political capital; delay may preserve freedom of action while reopening every grievance the conference was meant to settle."
 aoeiw10_story.2.a:0 "Ratify the guarantees."
 aoeiw10_story.2.b:0 "Return the clauses to the ministries."
 aoeiw10_story.3.t:0 "The Ministries Resist the Directive"
 aoeiw10_story.3.d:0 "Vienna's directive has reached the provincial capitals, where officials warn that decrees without local cooperation will remain paper commands. The court can build a central civil service capable of enforcing its settlement, or concede provincial vetoes before obstruction becomes open defiance."
 aoeiw10_story.3.a:0 "Build an imperial civil service."
 aoeiw10_story.3.b:0 "Concede narrowly defined vetoes."
 AOEIW10_AUS_federal_compact:0 "The Danubian Federal Compact"
 AOEIW10_AUS_federal_compact_desc:0 "Provincial guarantees make the monarchy steadier and public works easier to coordinate, but every major initiative now requires bargaining among the Crown Lands."
 AOEIW10_AUS_central_service:0 "The Vienna Central Service"
 AOEIW10_AUS_central_service_desc:0 "A professional imperial administration gives Vienna greater control over revenue and policy, while resentment in the provinces remains the price of speed."

 aoeiw10_story.10.t:0 "The Seraing Furnaces Fall Silent"
 aoeiw10_story.10.d:0 "A wage dispute in Seraing has spread along the railways and into the coal basin. Union committees promise to keep essential trains moving if the government convenes employers and labour; industrial leaders instead demand emergency authority to restore production before the stoppage reaches Antwerp."
 aoeiw10_story.10.a:0 "Convene a national labour conference."
 aoeiw10_story.10.b:0 "Place the railways under an industrial directorate."
 aoeiw10_story.11.t:0 "The Eight-Hour Charter"
 aoeiw10_story.11.d:0 "The conference has produced a charter linking shorter shifts and arbitration boards to a pledge against political strikes. Employers call the cost excessive, while moderate unions warn that rejecting it will hand the movement to its most radical organisers."
 aoeiw10_story.11.a:0 "Sign the social compact."
 aoeiw10_story.11.b:0 "Limit the agreement to wage arbitration."
 aoeiw10_story.12.t:0 "Order Returns to the Railways"
 aoeiw10_story.12.d:0 "Troops and company guards have reopened the main lines, but the directorate now asks for permanent power over hiring, freight priority and factory discipline. Municipal leaders offer a quieter alternative: local bargaining that would restore civilian control at the cost of uneven settlements."
 aoeiw10_story.12.a:0 "Confirm the directorate's authority."
 aoeiw10_story.12.b:0 "Return bargaining to the municipalities."
 AOEIW10_BEL_social_compact:0 "The Belgian Social Compact"
 AOEIW10_BEL_social_compact_desc:0 "Binding arbitration and labour guarantees steady the country and encourage long-term investment, although negotiated work rules restrain immediate output."
 AOEIW10_BEL_industrial_discipline:0 "The Industrial Directorate"
 AOEIW10_BEL_industrial_discipline_desc:0 "Central control of railways and heavy industry drives production upward, while the methods used to impose discipline deepen political bitterness."

 aoeiw10_story.20.t:0 "The Reconstruction Ledger"
 aoeiw10_story.20.d:0 "The first consolidated reconstruction budget has exposed funds reserved by the Royal Castle beyond the appropriations voted by the Sejm. Deputies demand a public audit and ministerial signatures; the court argues that a protected reserve is essential for frontier works and emergency mobilisation."
 aoeiw10_story.20.a:0 "Submit the ledger to the Sejm."
 aoeiw10_story.20.b:0 "Protect the Crown's reserve."
 aoeiw10_story.21.t:0 "Credit for the Provinces"
 aoeiw10_story.21.d:0 "The audit has found no theft, but it has revealed how Warsaw banks steer reconstruction money away from provincial cooperatives. The Sejm proposes a national credit act with public accounts and regional lending quotas. Its opponents prefer to close the inquiry before oversight becomes permanent."
 aoeiw10_story.21.a:0 "Pass the national credit act."
 aoeiw10_story.21.b:0 "Publish the findings and end the audit."
 aoeiw10_story.22.t:0 "The Generals Request the Reserve"
 aoeiw10_story.22.d:0 "With the royal reserve protected, the general staff has presented a confidential programme of depots, rail spurs and munitions contracts. The Sejm will accept a joint budget board, but the court can also preserve secrecy and turn the fund into a permanent instrument of royal policy."
 aoeiw10_story.22.a:0 "Confirm the royal treasury."
 aoeiw10_story.22.b:0 "Admit the Sejm to a joint board."
 AOEIW10_POL_parliamentary_credit:0 "The National Credit Act"
 AOEIW10_POL_parliamentary_credit_desc:0 "Public accounts and regional credit stabilize the political settlement and accelerate civilian development, at the cost of a larger administrative burden."
 AOEIW10_POL_royal_treasury:0 "The Royal Reconstruction Treasury"
 AOEIW10_POL_royal_treasury_desc:0 "A protected reserve gives the Crown the means to finance armaments and act quickly, while secrecy sustains the dispute over constitutional control."
