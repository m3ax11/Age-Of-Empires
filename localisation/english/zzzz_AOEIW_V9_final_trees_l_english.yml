 AOEIW9_JAP_dip_b_5_desc:0 "A formal warning over the Northern Strategy will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_JAP_dip_b_6:0 "Terms for the Northern Strategy"
 AOEIW9_JAP_dip_b_6_desc:0 "Terms for an ultimatum on the Northern Strategy will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_JAP_dip_b_7:0 "The Decision on the Northern Strategy"
 AOEIW9_JAP_dip_b_7_desc:0 "The government reaches the decision point on the Northern Strategy. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_JAP_dip_final:0 "The Imperial Perimeter"
 AOEIW9_JAP_dip_final_desc:0 "The Empire of Japan's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_JAP_special_1:0 "Southern Resource Area"
 AOEIW9_JAP_special_1_desc:0 "Southern Resource Area addresses a strategic problem that is specific to the Empire of Japan. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_JAP_special_2:0 "Secure the Sea Lanes"
 AOEIW9_JAP_special_2_desc:0 "The government will turn Secure the Sea Lanes into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Empire of Japan's situation rather than from a universal template."
 AOEIW9_JAP_special_3:0 "The Philippine Question"
 AOEIW9_JAP_special_3_desc:0 "The Philippine Question links economic capacity, planning and military requirements that already exist in the Empire of Japan. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_JAP_special_4:0 "Break the Embargo"
 AOEIW9_JAP_special_4_desc:0 "By pursuing Break the Embargo, the Empire of Japan commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_JAP_special_5:0 "Carrier Primacy"
 AOEIW9_JAP_special_5_desc:0 "Carrier Primacy addresses a strategic problem that is specific to the Empire of Japan. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_JAP_special_6:0 "Long-Range Aviation"
 AOEIW9_JAP_special_6_desc:0 "The government will turn Long-Range Aviation into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the Empire of Japan's situation rather than from a universal template."
 AOEIW9_JAP_special_7:0 "The Pacific War Plan"
 AOEIW9_JAP_special_7_desc:0 "The Pacific War Plan links economic capacity, planning and military requirements that already exist in the Empire of Japan. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_JAP_special_8:0 "Empire of the Rising Sun"
 AOEIW9_JAP_special_8_desc:0 "By pursuing Empire of the Rising Sun, the Empire of Japan commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_MEX_focus_tree:0 "Mexico Focus Tree"
 AOEIW9_MEX_politics_p1_2:0 "Reconcile the Presidency"
 AOEIW9_MEX_politics_p1_2_desc:0 "Presidency has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Institutional Government programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_MEX_politics_p1_3:0 "Reform the Army Generals"
 AOEIW9_MEX_politics_p1_3_desc:0 "Army Generals still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Institutional Government settlement."
 AOEIW9_MEX_politics_p1_4:0 "Bind the Labour Confederation"
 AOEIW9_MEX_politics_p1_4_desc:0 "Labour Confederation will be tied to the Institutional Government programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_MEX_politics_p1_5:0 "Balance the Peasant Leagues"
 AOEIW9_MEX_politics_p1_5_desc:0 "Neither abolishing Peasant Leagues nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Institutional Government coalition."
 AOEIW9_MEX_politics_p1_6:0 "Federal Congress and Nation"
 AOEIW9_MEX_politics_p1_6_desc:0 "Federal Congress will be presented as part of the national political order rather than a factional institution. The Institutional Government camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_MEX_politics_p2_2:0 "Open the Army Generals"
 AOEIW9_MEX_politics_p2_2_desc:0 "Access to Army Generals will be widened and its procedures made less dependent on closed patronage. The reform gives the Caudillo State camp a legal route to broaden its support without bypassing the state."
 AOEIW9_MEX_politics_p2_3:0 "Guarantee the Labour Confederation"
 AOEIW9_MEX_politics_p2_3_desc:0 "The position of Labour Confederation will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Caudillo State settlement."
 AOEIW9_MEX_politics_p2_4:0 "Broaden the Peasant Leagues"
 AOEIW9_MEX_politics_p2_4_desc:0 "Peasant Leagues will receive a wider role in consultation, administration and mobilisation. The Caudillo State project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_MEX_politics_p2_5:0 "Entrust the State Governors"
 AOEIW9_MEX_politics_p2_5_desc:0 "Responsibility now shifts toward State Governors, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Caudillo State system can govern through delegated institutions."
 AOEIW9_MEX_politics_p2_6:0 "A New Charter for Mexico"
 AOEIW9_MEX_politics_p2_6_desc:0 "A new constitutional charter will turn the Caudillo State programme into a durable framework for Mexico. The document defines authority, representation and the limits of emergency power."
 AOEIW9_MEX_politics_p3_2:0 "Mobilise the Labour Confederation"
 AOEIW9_MEX_politics_p3_2_desc:0 "Labour Confederation will become an organising arm of the Social Revolution programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_MEX_politics_p3_3:0 "Break the Peasant Leagues"
 AOEIW9_MEX_politics_p3_3_desc:0 "The independent power of Peasant Leagues is incompatible with the Social Revolution project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_MEX_politics_p3_4:0 "Replace the State Governors"
 AOEIW9_MEX_politics_p3_4_desc:0 "State Governors will be removed from its gatekeeping role and replaced with officials loyal to the Social Revolution settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_MEX_politics_p3_5:0 "Command the Federal Congress"
 AOEIW9_MEX_politics_p3_5_desc:0 "Federal Congress will answer directly to the authorities created by the Social Revolution path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_MEX_politics_p3_6:0 "The Social Revolution Settlement"
 AOEIW9_MEX_politics_p3_6_desc:0 "The political struggle around The Social Revolution reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Social Revolution order."
 AOEIW9_MEX_politics_settlement:0 "The Post-Revolutionary Settlement"
 AOEIW9_MEX_politics_settlement_desc:0 "The chosen settlement gives Federal Congress, Presidency and Army Generals a defined chain of authority instead of overlapping vetoes. Mexico can now govern through institutions that match the political order selected by the player."
 AOEIW9_MEX_eco_root:0 "The Monterrey Industry Review"
 AOEIW9_MEX_eco_root_desc:0 "Monterrey Industry, PEMEX Oilfields and National Railways do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Mexico can expand fastest."
 AOEIW9_MEX_eco_civ_2:0 "Rails to PEMEX Oilfields"
 AOEIW9_MEX_eco_civ_2_desc:0 "Rail connections serving PEMEX Oilfields will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_MEX_eco_civ_5:0 "The Veracruz Port Expansion"
 AOEIW9_MEX_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Veracruz Port. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_MEX_eco_civ_6:0 "Renew Agrarian Credit Bank"
 AOEIW9_MEX_eco_civ_6_desc:0 "Agrarian Credit Bank will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_MEX_eco_civ_7:0 "A Second Shift at Monterrey Industry"
 AOEIW9_MEX_eco_civ_7_desc:0 "Monterrey Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_MEX_eco_civ_8:0 "Public Works at PEMEX Oilfields"
 AOEIW9_MEX_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around PEMEX Oilfields will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_MEX_eco_war_1:0 "The Mexico City Workshops Armaments Audit"
 AOEIW9_MEX_eco_war_1_desc:0 "An armaments audit will determine which parts of Mexico City Workshops can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_MEX_eco_war_2:0 "War Orders for Veracruz Port"
 AOEIW9_MEX_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Veracruz Port, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_MEX_eco_war_3:0 "Precision Tools for Agrarian Credit Bank"
 AOEIW9_MEX_eco_war_3_desc:0 "Precision machine tools will be prioritised for Agrarian Credit Bank, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_MEX_eco_war_4:0 "Expand Monterrey Industry for Rearmament"
 AOEIW9_MEX_eco_war_4_desc:0 "New military production capacity will be built around Monterrey Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_MEX_eco_war_5:0 "Standardise PEMEX Oilfields"
 AOEIW9_MEX_eco_war_5_desc:0 "Factories tied to PEMEX Oilfields will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_MEX_eco_war_6:0 "Night Production at National Railways"
 AOEIW9_MEX_eco_war_6_desc:0 "Night production will be organised at National Railways with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_MEX_eco_war_7:0 "Long-Term Contracts for Mexico City Workshops"
 AOEIW9_MEX_eco_war_7_desc:0 "Long-term contracts will give Mexico City Workshops a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_MEX_eco_science_1:0 "Endow National Polytechnic Institute"
 AOEIW9_MEX_eco_science_1_desc:0 "Stable public funding will give National Polytechnic Institute laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_MEX_eco_science_2:0 "New Laboratories at UNAM Laboratories"
 AOEIW9_MEX_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of UNAM Laboratories. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_MEX_eco_science_3:0 "Applied Research at Mexican Research Council"
 AOEIW9_MEX_eco_science_3_desc:0 "Mexican Research Council will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_MEX_eco_science_4:0 "Industrial Physics at National Polytechnic Institute"
 AOEIW9_MEX_eco_science_4_desc:0 "Industrial physics at National Polytechnic Institute will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_MEX_eco_science_5:0 "Production Science at UNAM Laboratories"
 AOEIW9_MEX_eco_science_5_desc:0 "Researchers at UNAM Laboratories will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_MEX_eco_science_6:0 "Research Grants for Mexican Research Council"
 AOEIW9_MEX_eco_science_6_desc:0 "A national grant programme will connect Mexican Research Council to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_MEX_eco_infra_2:0 "Freight Capacity at Mexico City Workshops"
 AOEIW9_MEX_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Mexico City Workshops will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_MEX_eco_infra_3:0 "Workers' Housing at Veracruz Port"
 AOEIW9_MEX_eco_infra_3_desc:0 "Worker housing near Veracruz Port will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_MEX_eco_infra_4:0 "Logistics through Agrarian Credit Bank"
 AOEIW9_MEX_eco_infra_4_desc:0 "Agrarian Credit Bank will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_MEX_eco_final:0 "The Mexican Development State"
 AOEIW9_MEX_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a mexican economy able to convert regional strengths into sustained national output."
 AOEIW9_MEX_mil_root:0 "Review the Mexican General Staff"
 AOEIW9_MEX_mil_root_desc:0 "The Mexican General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_MEX_mil_army_2:0 "Federal Army Field Manoeuvres"
 AOEIW9_MEX_mil_army_2_desc:0 "Large field exercises with the Federal Army will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_MEX_mil_army_5:0 "Motorise the Chapultepec Military College"
 AOEIW9_MEX_mil_army_5_desc:0 "Motor transport assigned to the Chapultepec Military College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_MEX_mil_army_6:0 "Staff Procedures at the Mexican General Staff"
 AOEIW9_MEX_mil_army_6_desc:0 "Staff officers at the Mexican General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_MEX_mil_army_7:0 "Armour Studies at the Federal Army"
 AOEIW9_MEX_mil_army_7_desc:0 "The Federal Army will study how armour can be integrated with infantry, artillery and logistics under mexican conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_MEX_mil_army_8:0 "Operational Planning at the Cavalry Brigades"
 AOEIW9_MEX_mil_army_8_desc:0 "Operational planning with the Cavalry Brigades will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_MEX_mil_army_9:0 "Mexican Doctrine at the Artillery Directorate"
 AOEIW9_MEX_mil_army_9_desc:0 "The doctrine taught by Artillery Directorate will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations. For Mexico, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_MEX_mil_air_1:0 "Reorganise Mexican Air Force"
 AOEIW9_MEX_mil_air_1_desc:0 "Mexican Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_MEX_mil_air_2:0 "Fighter Instruction at Balbuena Airfield"
 AOEIW9_MEX_mil_air_2_desc:0 "Balbuena Airfield will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_MEX_mil_air_3:0 "Mexican Ground Support Doctrine under Gulf Air Command"
 AOEIW9_MEX_mil_air_3_desc:0 "Gulf Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Mexico, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_MEX_mil_air_4:0 "Extend the Range of Mexican Air Force"
 AOEIW9_MEX_mil_air_4_desc:0 "Mexican Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Mexico's geography and strategic commitments."
 AOEIW9_MEX_mil_air_5:0 "Radar Networks for Balbuena Airfield"
 AOEIW9_MEX_mil_air_5_desc:0 "Balbuena Airfield will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_MEX_mil_air_6:0 "Unify Command under Gulf Air Command"
 AOEIW9_MEX_mil_air_6_desc:0 "Gulf Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_MEX_mil_sea_1:0 "Review Gulf Squadron"
 AOEIW9_MEX_mil_sea_1_desc:0 "A full review of Gulf Squadron will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_MEX_mil_sea_2:0 "Expand Veracruz Naval Yard"
 AOEIW9_MEX_mil_sea_2_desc:0 "Veracruz Naval Yard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_MEX_mil_sea_3:0 "Fleet Manoeuvres with Pacific Patrol"
 AOEIW9_MEX_mil_sea_3_desc:0 "Fleet exercises with Pacific Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_MEX_mil_sea_4:0 "Screening Doctrine for Gulf Squadron"
 AOEIW9_MEX_mil_sea_4_desc:0 "Gulf Squadron will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_MEX_mil_sea_5:0 "Naval Aviation at Veracruz Naval Yard"
 AOEIW9_MEX_mil_sea_5_desc:0 "Naval aviation will be integrated with Veracruz Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_MEX_mil_sea_6:0 "New Hulls for Pacific Patrol"
 AOEIW9_MEX_mil_sea_6_desc:0 "New hull standards for Pacific Patrol will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_MEX_mil_final:0 "Mexican Mobile Defence Doctrine"
 AOEIW9_MEX_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Mexico now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_MEX_dip_root:0 "Define the Mexican Continental Doctrine"
 AOEIW9_MEX_dip_root_desc:0 "Mexico must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_MEX_dip_a_2:0 "Send a Mission on the Northern Colossus"
 AOEIW9_MEX_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Northern Colossus. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_MEX_dip_a_3:0 "Economic Leverage over the Northern Colossus"
 AOEIW9_MEX_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Northern Colossus. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_MEX_dip_a_4:0 "Staff Talks on the Northern Colossus"
 AOEIW9_MEX_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Northern Colossus. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_MEX_dip_a_5:0 "A Formal Warning over the Northern Colossus"
 AOEIW9_MEX_dip_a_5_desc:0 "A formal warning over the Northern Colossus will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_MEX_dip_a_6:0 "Terms for the Northern Colossus"
 AOEIW9_MEX_dip_a_6_desc:0 "Terms for an ultimatum on the Northern Colossus will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_MEX_dip_b_1:0 "The Caribbean Sphere"
 AOEIW9_MEX_dip_b_1_desc:0 "The Caribbean Sphere will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Mexico actually wants before pressure is applied."
 AOEIW9_MEX_dip_b_2:0 "Send a Mission on the Caribbean Sphere"
 AOEIW9_MEX_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Caribbean Sphere. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_MEX_dip_b_3:0 "Economic Leverage over the Caribbean Sphere"
 AOEIW9_MEX_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Caribbean Sphere. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_MEX_dip_b_4:0 "Staff Talks on the Caribbean Sphere"
 AOEIW9_MEX_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Caribbean Sphere. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_MEX_dip_b_5:0 "A Formal Warning over the Caribbean Sphere"
 AOEIW9_MEX_dip_b_5_desc:0 "A formal warning over the Caribbean Sphere will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_MEX_dip_b_6:0 "Terms for the Caribbean Sphere"
 AOEIW9_MEX_dip_b_6_desc:0 "Terms for an ultimatum on the Caribbean Sphere will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_MEX_dip_final:0 "Mexico's Continental Position"
 AOEIW9_MEX_dip_final_desc:0 "Mexico's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_NOR_focus_tree:0 "Kingdom of Norway Focus Tree"
 AOEIW9_NOR_politics_p1_2:0 "Reconcile the Royal Palace"
 AOEIW9_NOR_politics_p1_2_desc:0 "Royal Palace has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Storting Consensus programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_NOR_politics_p1_3:0 "Reform the Labour Movement"
 AOEIW9_NOR_politics_p1_3_desc:0 "Labour Movement still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Storting Consensus settlement."
 AOEIW9_NOR_politics_p1_4:0 "Bind the Shipping Magnates"
 AOEIW9_NOR_politics_p1_4_desc:0 "Shipping Magnates will be tied to the Storting Consensus programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_NOR_politics_p1_5:0 "Storting and Nation"
 AOEIW9_NOR_politics_p1_5_desc:0 "Storting will be presented as part of the national political order rather than a factional institution. The Storting Consensus camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_NOR_politics_p2_2:0 "Open the Labour Movement"
 AOEIW9_NOR_politics_p2_2_desc:0 "Access to Labour Movement will be widened and its procedures made less dependent on closed patronage. The reform gives the Norwegian Royal Stewardship camp a legal route to broaden its support without bypassing the state."
 AOEIW9_NOR_politics_p2_3:0 "Guarantee the Shipping Magnates"
 AOEIW9_NOR_politics_p2_3_desc:0 "The position of Shipping Magnates will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Norwegian Royal Stewardship settlement."
 AOEIW9_NOR_politics_p2_4:0 "Broaden the Norwegian County Councils"
 AOEIW9_NOR_politics_p2_4_desc:0 "County Councils will receive a wider role in consultation, administration and mobilisation. The Norwegian Royal Stewardship project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_NOR_politics_p2_5:0 "A New Charter for Kingdom of Norway"
 AOEIW9_NOR_politics_p2_5_desc:0 "A new constitutional charter will turn the Norwegian Royal Stewardship programme into a durable framework for the Kingdom of Norway. The document defines authority, representation and the limits of emergency power."
 AOEIW9_NOR_politics_p3_2:0 "Mobilise the Shipping Magnates"
 AOEIW9_NOR_politics_p3_2_desc:0 "Shipping Magnates will become an organising arm of the Norwegian National Mobilisation programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_NOR_politics_p3_3:0 "Break the Norwegian County Councils"
 AOEIW9_NOR_politics_p3_3_desc:0 "The independent power of County Councils is incompatible with the Norwegian National Mobilisation project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_NOR_politics_p3_4:0 "Replace the Norwegian Defence Commission"
 AOEIW9_NOR_politics_p3_4_desc:0 "Defence Commission will be removed from its gatekeeping role and replaced with officials loyal to the Norwegian National Mobilisation settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_NOR_politics_p3_5:0 "The National Mobilisation Settlement in Kingdom of Norway"
 AOEIW9_NOR_politics_p3_5_desc:0 "The political struggle around National Mobilisation reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Norwegian National Mobilisation order."
 AOEIW9_NOR_politics_settlement:0 "The Oslo Settlement"
 AOEIW9_NOR_politics_settlement_desc:0 "The chosen settlement gives Storting, Royal Palace and Labour Movement a defined chain of authority instead of overlapping vetoes. the Kingdom of Norway can now govern through institutions that match the political order selected by the player."
 AOEIW9_NOR_eco_root:0 "The Oslo Industry Review"
 AOEIW9_NOR_eco_root_desc:0 "Oslo Industry, Hydroelectric Board and Bergen Shipping do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Norway can expand fastest."
 AOEIW9_NOR_eco_civ_2:0 "Rails to Hydroelectric Board"
 AOEIW9_NOR_eco_civ_2_desc:0 "Rail connections serving Hydroelectric Board will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_NOR_eco_civ_5:0 "The Trondheim Workshops Expansion"
 AOEIW9_NOR_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Trondheim Workshops. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_NOR_eco_civ_6:0 "Renew the Norwegian State Railways"
 AOEIW9_NOR_eco_civ_6_desc:0 "State Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Norway, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_NOR_eco_civ_7:0 "A Second Shift at Oslo Industry"
 AOEIW9_NOR_eco_civ_7_desc:0 "Oslo Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_NOR_eco_civ_8:0 "Public Works at Hydroelectric Board"
 AOEIW9_NOR_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Hydroelectric Board will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_NOR_eco_civ_9:0 "The Bergen Shipping Development Board"
 AOEIW9_NOR_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Bergen Shipping. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_NOR_eco_war_1:0 "The Narvik Ore Route Armaments Audit"
 AOEIW9_NOR_eco_war_1_desc:0 "An armaments audit will determine which parts of Narvik Ore Route can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_NOR_eco_war_2:0 "War Orders for Trondheim Workshops"
 AOEIW9_NOR_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Trondheim Workshops, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_NOR_eco_war_3:0 "Precision Tools for the Norwegian State Railways"
 AOEIW9_NOR_eco_war_3_desc:0 "Precision machine tools will be prioritised for State Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Norway, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_NOR_eco_war_4:0 "Expand Oslo Industry for Rearmament"
 AOEIW9_NOR_eco_war_4_desc:0 "New military production capacity will be built around Oslo Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_NOR_eco_war_5:0 "Standardise Hydroelectric Board"
 AOEIW9_NOR_eco_war_5_desc:0 "Factories tied to Hydroelectric Board will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_NOR_eco_war_6:0 "Night Production at Bergen Shipping"
 AOEIW9_NOR_eco_war_6_desc:0 "Night production will be organised at Bergen Shipping with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_NOR_eco_science_1:0 "Endow University of Oslo"
 AOEIW9_NOR_eco_science_1_desc:0 "Stable public funding will give University of Oslo laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_NOR_eco_science_2:0 "New Laboratories at Norwegian Technical Institute"
 AOEIW9_NOR_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Norwegian Technical Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_NOR_eco_science_3:0 "Applied Research at Defence Research Board"
 AOEIW9_NOR_eco_science_3_desc:0 "Defence Research Board will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
