 AOEIW9_NOR_mil_sea_5_desc:0 "Naval aviation will be integrated with Horten Naval Yard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_NOR_mil_final:0 "Winter Defense"
 AOEIW9_NOR_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Norway now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_NOR_dip_root:0 "Define the Northern Maritime Doctrine"
 AOEIW9_NOR_dip_root_desc:0 "The Kingdom of Norway must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_NOR_dip_a_2:0 "Send a Mission on the Swedish Neighbour"
 AOEIW9_NOR_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Swedish Neighbour. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_NOR_dip_a_3:0 "Economic Leverage over the Swedish Neighbour"
 AOEIW9_NOR_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Swedish Neighbour. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_NOR_dip_a_4:0 "Staff Talks on the Swedish Neighbour"
 AOEIW9_NOR_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Swedish Neighbour. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_NOR_dip_a_5:0 "A Formal Warning over the Swedish Neighbour"
 AOEIW9_NOR_dip_a_5_desc:0 "A formal warning over the Swedish Neighbour will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_NOR_dip_b_1:0 "The Atlantic Lifeline"
 AOEIW9_NOR_dip_b_1_desc:0 "The Atlantic Lifeline will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Norway actually wants before pressure is applied."
 AOEIW9_NOR_dip_b_2:0 "Send a Mission on the Atlantic Lifeline"
 AOEIW9_NOR_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Atlantic Lifeline. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_NOR_dip_b_3:0 "Economic Leverage over the Atlantic Lifeline"
 AOEIW9_NOR_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Atlantic Lifeline. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_NOR_dip_b_4:0 "Staff Talks on the Atlantic Lifeline"
 AOEIW9_NOR_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Atlantic Lifeline. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_NOR_dip_b_5:0 "A Formal Warning over the Atlantic Lifeline"
 AOEIW9_NOR_dip_b_5_desc:0 "A formal warning over the Atlantic Lifeline will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_NOR_dip_final:0 "Norway's Northern Strategy"
 AOEIW9_NOR_dip_final_desc:0 "The Kingdom of Norway's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_PER_focus_tree:0 "Persian Empire Focus Tree"
 AOEIW9_PER_politics_p1_2:0 "Reconcile the Majlis"
 AOEIW9_PER_politics_p1_2_desc:0 "Majlis has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Imperial Modernisation programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_PER_politics_p1_3:0 "Reform the Tribal Notables"
 AOEIW9_PER_politics_p1_3_desc:0 "Tribal Notables still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Imperial Modernisation settlement."
 AOEIW9_PER_politics_p1_4:0 "Bind the Clerical Establishment"
 AOEIW9_PER_politics_p1_4_desc:0 "Clerical Establishment will be tied to the Imperial Modernisation programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_PER_politics_p1_5:0 "Balance the Army Officers"
 AOEIW9_PER_politics_p1_5_desc:0 "Neither abolishing Army Officers nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Imperial Modernisation coalition."
 AOEIW9_PER_politics_p1_6:0 "The Persian Imperial Court and Nation"
 AOEIW9_PER_politics_p1_6_desc:0 "Imperial Court will be presented as part of the national political order rather than a factional institution. The Imperial Modernisation camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_PER_politics_p2_2:0 "Open the Tribal Notables"
 AOEIW9_PER_politics_p2_2_desc:0 "Access to Tribal Notables will be widened and its procedures made less dependent on closed patronage. The reform gives the Majlis Compact camp a legal route to broaden its support without bypassing the state."
 AOEIW9_PER_politics_p2_3:0 "Guarantee the Clerical Establishment"
 AOEIW9_PER_politics_p2_3_desc:0 "The position of Clerical Establishment will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Majlis Compact settlement."
 AOEIW9_PER_politics_p2_4:0 "Broaden the Persian Army Officers"
 AOEIW9_PER_politics_p2_4_desc:0 "Army Officers will receive a wider role in consultation, administration and mobilisation. The Majlis Compact project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_PER_politics_p2_5:0 "Entrust the Persian Provincial Governors"
 AOEIW9_PER_politics_p2_5_desc:0 "Responsibility now shifts toward Provincial Governors, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Majlis Compact system can govern through delegated institutions."
 AOEIW9_PER_politics_p2_6:0 "A New Charter for Persian Empire"
 AOEIW9_PER_politics_p2_6_desc:0 "A new constitutional charter will turn the Majlis Compact programme into a durable framework for Persian Empire. The document defines authority, representation and the limits of emergency power."
 AOEIW9_PER_politics_p3_2:0 "Mobilise the Clerical Establishment"
 AOEIW9_PER_politics_p3_2_desc:0 "Clerical Establishment will become an organising arm of the National Officers programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_PER_politics_p3_3:0 "Break the Persian Army Officers"
 AOEIW9_PER_politics_p3_3_desc:0 "The independent power of Army Officers is incompatible with the National Officers project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_PER_politics_p3_4:0 "Replace the Persian Provincial Governors"
 AOEIW9_PER_politics_p3_4_desc:0 "Provincial Governors will be removed from its gatekeeping role and replaced with officials loyal to the National Officers settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_PER_politics_p3_5:0 "Command the Persian Imperial Court"
 AOEIW9_PER_politics_p3_5_desc:0 "Imperial Court will answer directly to the authorities created by the National Officers path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_PER_politics_p3_6:0 "The National Officers Settlement"
 AOEIW9_PER_politics_p3_6_desc:0 "The political struggle around The National Officers reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the National Officers order."
 AOEIW9_PER_politics_settlement:0 "The Tehran Settlement"
 AOEIW9_PER_politics_settlement_desc:0 "The chosen settlement gives Imperial Court, Majlis and Tribal Notables a defined chain of authority instead of overlapping vetoes. Persia can now govern through institutions that match the political order selected by the player."
 AOEIW9_PER_eco_root:0 "The Abadan Oilfields Review"
 AOEIW9_PER_eco_root_desc:0 "Abadan Oilfields, Trans-Iranian Railway and Tehran Workshops do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Persia can expand fastest."
 AOEIW9_PER_eco_civ_2:0 "Rails to Trans-Iranian Railway"
 AOEIW9_PER_eco_civ_2_desc:0 "Rail connections serving Trans-Iranian Railway will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_PER_eco_civ_5:0 "The Isfahan Industry Expansion"
 AOEIW9_PER_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Isfahan Industry. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_PER_eco_civ_6:0 "Renew National Bank in Persia"
 AOEIW9_PER_eco_civ_6_desc:0 "National Bank will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Persia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_PER_eco_civ_7:0 "A Second Shift at Abadan Oilfields"
 AOEIW9_PER_eco_civ_7_desc:0 "Abadan Oilfields has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_PER_eco_civ_8:0 "Public Works at Trans-Iranian Railway"
 AOEIW9_PER_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Trans-Iranian Railway will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_PER_eco_war_1:0 "The Caspian Commerce Armaments Audit"
 AOEIW9_PER_eco_war_1_desc:0 "An armaments audit will determine which parts of Caspian Commerce can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_PER_eco_war_2:0 "War Orders for Isfahan Industry"
 AOEIW9_PER_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Isfahan Industry, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_PER_eco_war_3:0 "Precision Tools for National Bank in Persia"
 AOEIW9_PER_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Bank, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Persia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_PER_eco_war_4:0 "Expand Abadan Oilfields for Rearmament"
 AOEIW9_PER_eco_war_4_desc:0 "New military production capacity will be built around Abadan Oilfields, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_PER_eco_war_5:0 "Standardise Trans-Iranian Railway"
 AOEIW9_PER_eco_war_5_desc:0 "Factories tied to Trans-Iranian Railway will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_PER_eco_war_6:0 "Night Production at Tehran Workshops"
 AOEIW9_PER_eco_war_6_desc:0 "Night production will be organised at Tehran Workshops with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_PER_eco_war_7:0 "Long-Term Contracts for Caspian Commerce"
 AOEIW9_PER_eco_war_7_desc:0 "Long-term contracts will give Caspian Commerce a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_PER_eco_science_1:0 "Endow University of Tehran"
 AOEIW9_PER_eco_science_1_desc:0 "Stable public funding will give University of Tehran laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_PER_eco_science_2:0 "New Persian Laboratories at Imperial Technical School"
 AOEIW9_PER_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Imperial Technical School. The enlarged institution will work directly with industry so that research can move from paper to production. In Persia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_PER_eco_science_3:0 "Applied Research at Persian Research Bureau"
 AOEIW9_PER_eco_science_3_desc:0 "Persian Research Bureau will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_PER_eco_science_4:0 "Industrial Physics at University of Tehran"
 AOEIW9_PER_eco_science_4_desc:0 "Industrial physics at University of Tehran will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_PER_eco_science_5:0 "Persian Production Science at Imperial Technical School"
 AOEIW9_PER_eco_science_5_desc:0 "Researchers at Imperial Technical School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers. In Persia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_PER_eco_science_6:0 "Research Grants for Persian Research Bureau"
 AOEIW9_PER_eco_science_6_desc:0 "A national grant programme will connect Persian Research Bureau to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_PER_eco_infra_2:0 "Freight Capacity at Caspian Commerce"
 AOEIW9_PER_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Caspian Commerce will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_PER_eco_infra_3:0 "Workers' Housing at Isfahan Industry"
 AOEIW9_PER_eco_infra_3_desc:0 "Worker housing near Isfahan Industry will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_PER_eco_infra_4:0 "Logistics through National Bank in Persia"
 AOEIW9_PER_eco_infra_4_desc:0 "National Bank will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Persia, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_PER_eco_final:0 "The Persian Development Programme"
 AOEIW9_PER_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a persian economy able to convert regional strengths into sustained national output."
 AOEIW9_PER_mil_root:0 "Review the Persian General Staff"
 AOEIW9_PER_mil_root_desc:0 "The Persian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_PER_mil_army_2:0 "Cossack Brigade Legacy Field Manoeuvres"
 AOEIW9_PER_mil_army_2_desc:0 "Large field exercises with the Cossack Brigade Legacy will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_PER_mil_army_5:0 "Motorise the Tehran War College"
 AOEIW9_PER_mil_army_5_desc:0 "Motor transport assigned to the Tehran War College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_PER_mil_army_6:0 "Staff Procedures at the Persian General Staff"
 AOEIW9_PER_mil_army_6_desc:0 "Staff officers at the Persian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_PER_mil_army_7:0 "Armour Studies at the Cossack Brigade Legacy"
 AOEIW9_PER_mil_army_7_desc:0 "The Cossack Brigade Legacy will study how armour can be integrated with infantry, artillery and logistics under persian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_PER_mil_army_8:0 "Operational Planning at the Mountain Corps"
 AOEIW9_PER_mil_army_8_desc:0 "Operational planning with the Mountain Corps will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_PER_mil_army_9:0 "Persian Doctrine at the Artillery Directorate"
 AOEIW9_PER_mil_army_9_desc:0 "The doctrine taught by Artillery Directorate will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations. For Persia, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_PER_mil_air_1:0 "Reorganise Imperial Iranian Air Force"
 AOEIW9_PER_mil_air_1_desc:0 "Imperial Iranian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_PER_mil_air_2:0 "Fighter Instruction at Doshan Tappeh Air Base"
 AOEIW9_PER_mil_air_2_desc:0 "Doshan Tappeh Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_PER_mil_air_3:0 "Ground Support Doctrine under Plateau Air Command"
 AOEIW9_PER_mil_air_3_desc:0 "Plateau Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_PER_mil_air_4:0 "Extend the Range of Imperial Iranian Air Force"
 AOEIW9_PER_mil_air_4_desc:0 "Imperial Iranian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Persia's geography and strategic commitments."
 AOEIW9_PER_mil_air_5:0 "Radar Networks for Doshan Tappeh Air Base"
 AOEIW9_PER_mil_air_5_desc:0 "Doshan Tappeh Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_PER_mil_air_6:0 "Unify Command under Plateau Air Command"
 AOEIW9_PER_mil_air_6_desc:0 "Plateau Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_PER_mil_sea_1:0 "Review Persian Gulf Squadron"
 AOEIW9_PER_mil_sea_1_desc:0 "A full review of Persian Gulf Squadron will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_PER_mil_sea_2:0 "Expand Khorramshahr Naval Station"
 AOEIW9_PER_mil_sea_2_desc:0 "Khorramshahr Naval Station will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_PER_mil_sea_3:0 "Fleet Manoeuvres with Caspian Flotilla"
 AOEIW9_PER_mil_sea_3_desc:0 "Fleet exercises with Caspian Flotilla will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_PER_mil_sea_4:0 "Screening Doctrine for Persian Gulf Squadron"
 AOEIW9_PER_mil_sea_4_desc:0 "Persian Gulf Squadron will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_PER_mil_sea_5:0 "Naval Aviation at Khorramshahr Naval Station"
 AOEIW9_PER_mil_sea_5_desc:0 "Naval aviation will be integrated with Khorramshahr Naval Station for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_PER_mil_sea_6:0 "New Hulls for Caspian Flotilla"
 AOEIW9_PER_mil_sea_6_desc:0 "New hull standards for Caspian Flotilla will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_PER_mil_final:0 "Mountain Mobility"
 AOEIW9_PER_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Persia now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_PER_dip_root:0 "Define the Persian Plateau Doctrine"
 AOEIW9_PER_dip_root_desc:0 "Persian Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_PER_dip_a_2:0 "Send a Mission on the Ottoman Frontier"
 AOEIW9_PER_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Ottoman Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_PER_dip_a_3:0 "Economic Leverage over the Ottoman Frontier"
 AOEIW9_PER_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Ottoman Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_PER_dip_a_4:0 "Staff Talks on the Ottoman Frontier"
 AOEIW9_PER_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Ottoman Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_PER_dip_a_5:0 "A Formal Warning over the Ottoman Frontier"
 AOEIW9_PER_dip_a_5_desc:0 "A formal warning over the Ottoman Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_PER_dip_a_6:0 "Terms for the Ottoman Frontier"
 AOEIW9_PER_dip_a_6_desc:0 "Terms for an ultimatum on the Ottoman Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_PER_dip_b_1:0 "The Indian Ocean"
 AOEIW9_PER_dip_b_1_desc:0 "The Indian Ocean will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Persia actually wants before pressure is applied."
 AOEIW9_PER_dip_b_2:0 "Send a Mission on the Indian Ocean"
 AOEIW9_PER_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Indian Ocean. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_PER_dip_b_3:0 "Economic Leverage over the Indian Ocean"
 AOEIW9_PER_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Indian Ocean. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_PER_dip_b_4:0 "Staff Talks on the Indian Ocean"
 AOEIW9_PER_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Indian Ocean. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_PER_dip_b_5:0 "A Formal Warning over the Indian Ocean"
 AOEIW9_PER_dip_b_5_desc:0 "A formal warning over the Indian Ocean will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_PER_dip_b_6:0 "Terms for the Indian Ocean"
 AOEIW9_PER_dip_b_6_desc:0 "Terms for an ultimatum on the Indian Ocean will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_PER_dip_final:0 "Persia Between Empires"
 AOEIW9_PER_dip_final_desc:0 "Persia's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_POL_focus_tree:0 "Kingdom of Poland Focus Tree"
 AOEIW9_POL_politics_p1_2:0 "Reconcile the Sejm"
 AOEIW9_POL_politics_p1_2_desc:0 "Sejm has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Crown and the Sejm programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_POL_politics_p1_3:0 "Reform the Polish Senate"
 AOEIW9_POL_politics_p1_3_desc:0 "Senate still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Crown and the Sejm settlement."
 AOEIW9_POL_politics_p1_4:0 "Bind the Polish Officer Corps"
 AOEIW9_POL_politics_p1_4_desc:0 "Officer Corps will be tied to the Crown and the Sejm programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_POL_politics_p1_5:0 "Balance the Peasant Parties"
 AOEIW9_POL_politics_p1_5_desc:0 "Neither abolishing Peasant Parties nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Crown and the Sejm coalition."
 AOEIW9_POL_politics_p1_6:0 "Royal Castle and Nation"
 AOEIW9_POL_politics_p1_6_desc:0 "Royal Castle will be presented as part of the national political order rather than a factional institution. The Crown and the Sejm camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_POL_politics_p2_2:0 "Polish Ministries in Polish Hands"
 AOEIW9_POL_politics_p2_2_desc:0 "German liaison officers will retain access, but appointments and daily administration must answer to Polish ministers and the Sejm."
 AOEIW9_POL_politics_p2_3:0 "Orders for the Central Industrial Region"
 AOEIW9_POL_politics_p2_3_desc:0 "Warsaw will place armament contracts in the new industrial districts between the frontiers. Procurement becomes furnaces, workshops and wages in the COP."
 AOEIW9_POL_politics_p2_4:0 "The Vistula Officer Agreement"
 AOEIW9_POL_politics_p2_4_desc:0 "A Polish general staff and locally controlled promotion system will coexist with joint Reichspakt planning along the eastern frontier."
 AOEIW9_POL_politics_p2_5:0 "Negotiate the Tariff Schedule"
 AOEIW9_POL_politics_p2_5_desc:0 "Warsaw will exchange predictable access to Polish markets for the right to protect strategic industries and direct its own development credit."
 AOEIW9_POL_politics_p2_6:0 "Renew the 1934 Declaration"
 AOEIW9_POL_politics_p2_6_desc:0 "Warsaw will demand that Berlin reaffirm the non-aggression declaration and its procedures for disputes. The signature buys time; it does not erase the frontier."
 AOEIW9_POL_politics_p3_2:0 "Test the Officer Corps"
 AOEIW9_POL_politics_p3_2_desc:0 "Trusted officers must decide whether their oath is ultimately owed to the German security system or to an independent Polish state."
 AOEIW9_POL_politics_p3_3:0 "Contact the Peasant Underground"
 AOEIW9_POL_politics_p3_3_desc:0 "Rural organizations can provide couriers, stores and mass support, turning an elite constitutional dispute into a national independence movement."
 AOEIW9_POL_politics_p3_4:0 "Guard the PKP Junctions"
 AOEIW9_POL_politics_p3_4_desc:0 "Military police will secure Warsaw, Łódź and Silesian rail junctions before political rivals or saboteurs can interrupt mobilisation. Control of Poland begins at the points."
 AOEIW9_POL_politics_p3_5:0 "Defy the German Mission"
 AOEIW9_POL_politics_p3_5_desc:0 "The German military mission will be denied authority over Polish appointments and mobilisation. The dispute can no longer be hidden inside administrative procedure."
 AOEIW9_POL_politics_p3_6:0 "The Warsaw Ultimatum"
 AOEIW9_POL_politics_p3_6_desc:0 "Poland will demand sovereign control of its government and armed forces. Mobilisation and national unity must make the cost of refusal unmistakable."
 AOEIW9_POL_politics_settlement:0 "Poland after the Marshal"
 AOEIW9_POL_politics_settlement_desc:0 "The presidency, Sejm and army now operate under the order chosen after Piłsudski. Warsaw can make decisions without invoking an absent referee."
 AOEIW9_POL_eco_root:0 "The Central Industrial Region Review"
 AOEIW9_POL_eco_root_desc:0 "Central Industrial Region, Silesian Mines and Gdynia Port do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Poland can expand fastest."
 AOEIW9_POL_eco_civ_2:0 "Rails to Silesian Mines"
 AOEIW9_POL_eco_civ_2_desc:0 "Rail connections serving Silesian Mines will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_POL_eco_civ_5:0 "The Polish State Railways Expansion"
 AOEIW9_POL_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Polish State Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_POL_eco_civ_6:0 "Renew Łódź Industry"
 AOEIW9_POL_eco_civ_6_desc:0 "Łódź Industry will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_POL_eco_civ_7:0 "A Second Shift at Central Industrial Region"
 AOEIW9_POL_eco_civ_7_desc:0 "Central Industrial Region has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_POL_eco_civ_8:0 "Public Works at Silesian Mines"
 AOEIW9_POL_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Silesian Mines will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_POL_eco_war_1:0 "The Warsaw Workshops Armaments Audit"
 AOEIW9_POL_eco_war_1_desc:0 "An armaments audit will determine which parts of Warsaw Workshops can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_POL_eco_war_2:0 "War Orders for Polish State Railways"
 AOEIW9_POL_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Polish State Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_POL_eco_war_3:0 "Precision Tools for Łódź Industry"
 AOEIW9_POL_eco_war_3_desc:0 "Precision machine tools will be prioritised for Łódź Industry, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_POL_eco_war_4:0 "Expand Central Industrial Region for Rearmament"
 AOEIW9_POL_eco_war_4_desc:0 "New military production capacity will be built around Central Industrial Region, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_POL_eco_war_5:0 "Standardise Silesian Mines"
 AOEIW9_POL_eco_war_5_desc:0 "Factories tied to Silesian Mines will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_POL_eco_war_6:0 "Night Production at Gdynia Port"
 AOEIW9_POL_eco_war_6_desc:0 "Night production will be organised at Gdynia Port with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_POL_eco_war_7:0 "Long-Term Contracts for Warsaw Workshops"
 AOEIW9_POL_eco_war_7_desc:0 "Long-term contracts will give Warsaw Workshops a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_POL_eco_science_1:0 "Endow Warsaw University of Technology"
 AOEIW9_POL_eco_science_1_desc:0 "Stable public funding will give Warsaw University of Technology laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_POL_eco_science_2:0 "New Laboratories at Polish Academy"
 AOEIW9_POL_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Polish Academy. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_POL_eco_science_3:0 "Applied Research at Military Technical Institute"
 AOEIW9_POL_eco_science_3_desc:0 "Military Technical Institute will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_POL_eco_science_4:0 "Industrial Physics at Warsaw University of Technology"
 AOEIW9_POL_eco_science_4_desc:0 "Industrial physics at Warsaw University of Technology will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_POL_eco_science_5:0 "Production Science at Polish Academy"
 AOEIW9_POL_eco_science_5_desc:0 "Researchers at Polish Academy will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_POL_eco_science_6:0 "Research Grants for Military Technical Institute"
 AOEIW9_POL_eco_science_6_desc:0 "A national grant programme will connect Military Technical Institute to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_POL_eco_infra_2:0 "Freight Capacity at Warsaw Workshops"
 AOEIW9_POL_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Warsaw Workshops will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_POL_eco_infra_3:0 "Workers' Housing at Polish State Railways"
 AOEIW9_POL_eco_infra_3_desc:0 "Worker housing near Polish State Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_POL_eco_infra_4:0 "Logistics through Łódź Industry"
 AOEIW9_POL_eco_infra_4_desc:0 "Łódź Industry will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_POL_eco_final:0 "The Polish Industrial State"
 AOEIW9_POL_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a polish economy able to convert regional strengths into sustained national output."
 AOEIW9_POL_mil_root:0 "Review the Polish General Staff"
 AOEIW9_POL_mil_root_desc:0 "The Polish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_POL_mil_army_2:0 "Border Corps Field Manoeuvres"
 AOEIW9_POL_mil_army_2_desc:0 "Large field exercises with the Border Corps will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_POL_mil_army_5:0 "Motorise the Higher War School"
 AOEIW9_POL_mil_army_5_desc:0 "Motor transport assigned to the Higher War School will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_POL_mil_army_6:0 "Staff Procedures at the Polish General Staff"
 AOEIW9_POL_mil_army_6_desc:0 "Staff officers at the Polish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_POL_mil_army_7:0 "Armour Studies at the Border Corps"
 AOEIW9_POL_mil_army_7_desc:0 "The Border Corps will study how armour can be integrated with infantry, artillery and logistics under polish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_POL_mil_army_8:0 "Operational Planning at the Cavalry Tradition"
 AOEIW9_POL_mil_army_8_desc:0 "Operational planning with the Cavalry Tradition will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_POL_mil_army_9:0 "Polish Doctrine at the Artillery Inspectorate"
 AOEIW9_POL_mil_army_9_desc:0 "The doctrine taught by Artillery Inspectorate will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations. For Poland, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_POL_mil_air_1:0 "Reorganise Polish Air Force"
 AOEIW9_POL_mil_air_1_desc:0 "Polish Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_POL_mil_air_2:0 "Fighter Instruction at Dęblin Air School"
 AOEIW9_POL_mil_air_2_desc:0 "Dęblin Air School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_POL_mil_air_3:0 "Polish Ground Support Doctrine under National Air Command"
 AOEIW9_POL_mil_air_3_desc:0 "National Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Poland, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_POL_mil_air_4:0 "Extend the Range of Polish Air Force"
 AOEIW9_POL_mil_air_4_desc:0 "Polish Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Poland's geography and strategic commitments."
 AOEIW9_POL_mil_air_5:0 "Radar Networks for Dęblin Air School"
 AOEIW9_POL_mil_air_5_desc:0 "Dęblin Air School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_POL_mil_air_6:0 "Unify Command under National Air Command"
 AOEIW9_POL_mil_air_6_desc:0 "National Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_POL_mil_sea_1:0 "Review Polish Navy"
 AOEIW9_POL_mil_sea_1_desc:0 "A full review of Polish Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_POL_mil_sea_2:0 "Expand Gdynia Naval Base"
 AOEIW9_POL_mil_sea_2_desc:0 "Gdynia Naval Base will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_POL_mil_sea_3:0 "Fleet Manoeuvres with Baltic Squadron"
 AOEIW9_POL_mil_sea_3_desc:0 "Fleet exercises with Baltic Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_POL_mil_sea_4:0 "Screening Doctrine for Polish Navy"
 AOEIW9_POL_mil_sea_4_desc:0 "Polish Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_POL_mil_sea_5:0 "Naval Aviation at Gdynia Naval Base"
 AOEIW9_POL_mil_sea_5_desc:0 "Naval aviation will be integrated with Gdynia Naval Base for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_POL_mil_sea_6:0 "New Hulls for Baltic Squadron"
 AOEIW9_POL_mil_sea_6_desc:0 "New hull standards for Baltic Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_POL_mil_final:0 "Elastic Defense in Kingdom of Poland"
 AOEIW9_POL_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Poland now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_POL_dip_root:0 "Define the Intermarium Doctrine"
 AOEIW9_POL_dip_root_desc:0 "The Kingdom of Poland must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_POL_dip_a_2:0 "The Berlin–Warsaw Liaison"
 AOEIW9_POL_dip_a_2_desc:0 "A permanent Warsaw-Berlin liaison will give the Polish government a channel to negotiate obligations instead of receiving them after the fact."
 AOEIW9_POL_dip_a_3:0 "German Capital, Polish Industry"
 AOEIW9_POL_dip_a_3_desc:0 "German investment can accelerate Polish industry if Warsaw retains enough authority to direct where that capital is used."
 AOEIW9_POL_dip_a_4:0 "Joint Staff Conferences"
 AOEIW9_POL_dip_a_4_desc:0 "Joint conferences will clarify command responsibilities, mobilisation zones and the limits of German military influence."
 AOEIW9_POL_dip_a_5:0 "Hold the Narew–Vistula–San Line"
 AOEIW9_POL_dip_a_5_desc:0 "Engineers and field commands will prepare bridges, depots and defensive positions along the three rivers. Diplomacy has bought only the time used to dig."
 AOEIW9_POL_dip_a_6:0 "A Kingdom within the Reichspakt"
 AOEIW9_POL_dip_a_6_desc:0 "For now Poland will seek influence and practical autonomy from inside the Reichspakt rather than attempt a suicidal war against its overlord."
 AOEIW9_POL_dip_b_1:0 "The Russian Frontier"
 AOEIW9_POL_dip_b_1_desc:0 "The Russian Frontier will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Poland actually wants before pressure is applied."
 AOEIW9_POL_dip_b_2:0 "Send a Mission on the Russian Frontier"
 AOEIW9_POL_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Russian Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_POL_dip_b_3:0 "Economic Leverage over the Russian Frontier"
 AOEIW9_POL_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Russian Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_POL_dip_b_4:0 "Staff Talks on the Russian Frontier"
 AOEIW9_POL_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Russian Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_POL_dip_b_5:0 "A Formal Warning over the Russian Frontier"
 AOEIW9_POL_dip_b_5_desc:0 "A formal warning over the Russian Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_POL_dip_b_6:0 "Terms for the Russian Frontier"
 AOEIW9_POL_dip_b_6_desc:0 "Terms for an ultimatum on the Russian Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_POL_dip_final:0 "Poland inside the Reichspakt"
 AOEIW9_POL_dip_final_desc:0 "The Kingdom of Poland's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_POR_focus_tree:0 "Portuguese Empire Focus Tree"
 AOEIW9_POR_politics_p1_2:0 "Reconcile the Portuguese Cortes"
 AOEIW9_POR_politics_p1_2_desc:0 "Cortes has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Portuguese Constitutional Crown programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_POR_politics_p1_3:0 "Reform the Colonial Ministry"
 AOEIW9_POR_politics_p1_3_desc:0 "Colonial Ministry still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Portuguese Constitutional Crown settlement."
 AOEIW9_POR_politics_p1_4:0 "Bind the Industrial Guilds"
 AOEIW9_POR_politics_p1_4_desc:0 "Industrial Guilds will be tied to the Portuguese Constitutional Crown programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_POR_politics_p1_5:0 "Balance the Republican Clubs"
 AOEIW9_POR_politics_p1_5_desc:0 "Neither abolishing Republican Clubs nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Portuguese Constitutional Crown coalition."
 AOEIW9_POR_politics_p1_6:0 "Royal Court and Nation in Portuguese Empire"
 AOEIW9_POR_politics_p1_6_desc:0 "Royal Court will be presented as part of the national political order rather than a factional institution. The Portuguese Constitutional Crown camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_POR_politics_p2_2:0 "Open the Colonial Ministry"
 AOEIW9_POR_politics_p2_2_desc:0 "Access to Colonial Ministry will be widened and its procedures made less dependent on closed patronage. The reform gives the Imperial Corporatism camp a legal route to broaden its support without bypassing the state."
 AOEIW9_POR_politics_p2_3:0 "Guarantee the Industrial Guilds"
 AOEIW9_POR_politics_p2_3_desc:0 "The position of Industrial Guilds will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Imperial Corporatism settlement."
 AOEIW9_POR_politics_p2_4:0 "Broaden the Republican Clubs"
 AOEIW9_POR_politics_p2_4_desc:0 "Republican Clubs will receive a wider role in consultation, administration and mobilisation. The Imperial Corporatism project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_POR_politics_p2_5:0 "Entrust the Portuguese Provincial Governors"
 AOEIW9_POR_politics_p2_5_desc:0 "Responsibility now shifts toward Provincial Governors, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Imperial Corporatism system can govern through delegated institutions."
 AOEIW9_POR_politics_p2_6:0 "Revise the Constitution of 1933"
 AOEIW9_POR_politics_p2_6_desc:0 "The parliamentary path will remove executive controls and make ministers answerable for imperial policy."
 AOEIW9_POR_politics_p3_2:0 "Mobilise the Industrial Guilds"
 AOEIW9_POR_politics_p3_2_desc:0 "Industrial Guilds will become an organising arm of the Portuguese Republican Opposition programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_POR_politics_p3_3:0 "Break the Republican Clubs"
 AOEIW9_POR_politics_p3_3_desc:0 "The independent power of Republican Clubs is incompatible with the Portuguese Republican Opposition project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_POR_politics_p3_4:0 "Replace the Portuguese Provincial Governors"
 AOEIW9_POR_politics_p3_4_desc:0 "Provincial Governors will be removed from its gatekeeping role and replaced with officials loyal to the Portuguese Republican Opposition settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_POR_politics_p3_5:0 "Command the Portuguese Royal Court"
 AOEIW9_POR_politics_p3_5_desc:0 "Royal Court will answer directly to the authorities created by the Portuguese Republican Opposition path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_POR_politics_p3_6:0 "The Republic Returns to the Streets"
 AOEIW9_POR_politics_p3_6_desc:0 "Republican clubs, unions and municipal leaders reclaim public politics from the Estado Novo."
 AOEIW9_POR_politics_settlement:0 "A Governable Portuguese Empire"
 AOEIW9_POR_politics_settlement_desc:0 "The chosen settlement gives Royal Court, Cortes and Colonial Ministry a defined chain of authority instead of overlapping vetoes. the Portuguese Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_POR_eco_root:0 "The Lisbon Industry Review"
 AOEIW9_POR_eco_root_desc:0 "Lisbon Industry, Porto Workshops and Tagus Shipyards do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Portuguese Empire can expand fastest."
