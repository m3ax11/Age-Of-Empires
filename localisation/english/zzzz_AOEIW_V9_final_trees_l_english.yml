 AOEIW9_ETH_dip_a_4:0 "Staff Talks on the Italian Threat"
 AOEIW9_ETH_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Italian Threat. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ETH_dip_a_5:0 "A Formal Warning over the Italian Threat"
 AOEIW9_ETH_dip_a_5_desc:0 "A formal warning over the Italian Threat will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ETH_dip_b_1:0 "The Nile Question"
 AOEIW9_ETH_dip_b_1_desc:0 "The Nile Question will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Ethiopian Empire actually wants before pressure is applied."
 AOEIW9_ETH_dip_b_2:0 "Send a Mission on the Nile Question"
 AOEIW9_ETH_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Nile Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ETH_dip_b_3:0 "Economic Leverage over the Nile Question"
 AOEIW9_ETH_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Nile Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_ETH_dip_b_4:0 "Staff Talks on the Nile Question"
 AOEIW9_ETH_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Nile Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ETH_dip_b_5:0 "A Formal Warning over the Nile Question"
 AOEIW9_ETH_dip_b_5_desc:0 "A formal warning over the Nile Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ETH_dip_final:0 "Addis Ababa and the Red Sea"
 AOEIW9_ETH_dip_final_desc:0 "The Ethiopian Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_FIN_focus_tree:0 "Finland Focus Tree"
 AOEIW9_FIN_politics_p1_2:0 "The President Calls the Parties"
 AOEIW9_FIN_politics_p1_2_desc:0 "The president summons parliamentary leaders before the veterans can dictate terms in the street. A lawful coalition must isolate the coup-minded right without reopening the civil war."
 AOEIW9_FIN_politics_p1_3:0 "Reform the White Guard"
 AOEIW9_FIN_politics_p1_3_desc:0 "White Guard still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Parliamentary Republic settlement."
 AOEIW9_FIN_politics_p1_4:0 "Bind the Agrarian League"
 AOEIW9_FIN_politics_p1_4_desc:0 "Agrarian League will be tied to the Parliamentary Republic programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_FIN_politics_p1_5:0 "Tampere's Owners at the Table"
 AOEIW9_FIN_politics_p1_5_desc:0 "Mill owners from Tampere will accept the constitutional bloc if strikes, contracts and mobilisation receive clear rules. Their support brings machines and money, along with demands."
 AOEIW9_FIN_politics_p1_6:0 "Eduskunta and Nation"
 AOEIW9_FIN_politics_p1_6_desc:0 "Eduskunta will be presented as part of the national political order rather than a factional institution. The Parliamentary Republic camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_FIN_politics_p2_2:0 "Open the White Guard"
 AOEIW9_FIN_politics_p2_2_desc:0 "Access to White Guard will be widened and its procedures made less dependent on closed patronage. The reform gives the Strong Presidency camp a legal route to broaden its support without bypassing the state."
 AOEIW9_FIN_politics_p2_3:0 "Guarantee the Agrarian League"
 AOEIW9_FIN_politics_p2_3_desc:0 "The position of Agrarian League will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Strong Presidency settlement."
 AOEIW9_FIN_politics_p2_4:0 "Bring the Employers into Parliament"
 AOEIW9_FIN_politics_p2_4_desc:0 "Industrial leaders will testify in open committee and bargain with the Agrarian League rather than issue demands through private clubs. The coalition will make their influence visible."
 AOEIW9_FIN_politics_p2_5:0 "Entrust the Finnish Provincial Governors"
 AOEIW9_FIN_politics_p2_5_desc:0 "Responsibility now shifts toward Provincial Governors, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Strong Presidency system can govern through delegated institutions."
 AOEIW9_FIN_politics_p2_6:0 "The Eduskunta Sets the Rules"
 AOEIW9_FIN_politics_p2_6_desc:0 "Emergency powers, defence estimates and provincial authority will be written into law by the Eduskunta. No movement may claim the nation above its elected chamber."
 AOEIW9_FIN_politics_p3_2:0 "Mobilise the Agrarian League"
 AOEIW9_FIN_politics_p3_2_desc:0 "Agrarian League will become an organising arm of the Greater Finland programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_FIN_politics_p3_3:0 "Seize the Tampere Mills"
 AOEIW9_FIN_politics_p3_3_desc:0 "The new regime places guards at the gates of Tampere's largest works. Owners may keep their desks only while their production serves the national project."
 AOEIW9_FIN_politics_p3_4:0 "Replace the Finnish Provincial Governors"
 AOEIW9_FIN_politics_p3_4_desc:0 "Provincial Governors will be removed from its gatekeeping role and replaced with officials loyal to the Greater Finland settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_FIN_politics_p3_5:0 "Command the Eduskunta"
 AOEIW9_FIN_politics_p3_5_desc:0 "Eduskunta will answer directly to the authorities created by the Greater Finland path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_FIN_politics_p3_6:0 "From the Gulf to the White Sea"
 AOEIW9_FIN_politics_p3_6_desc:0 "Greater Finland is proclaimed as a territorial mission rather than a debating society. Schools, barracks and maps will teach the same eastern horizon."
 AOEIW9_FIN_politics_settlement:0 "Helsinki Chooses Its Republic"
 AOEIW9_FIN_politics_settlement_desc:0 "The struggle among parliament, veterans and expansionists has ended in a government with a clear source of authority. Finland now knows who may command in the next border emergency."
 AOEIW9_FIN_eco_root:0 "The Tampere Workshops Review"
 AOEIW9_FIN_eco_root_desc:0 "Tampere Workshops, Finnish Forestry Board and Petsamo Minerals do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Finland can expand fastest."
 AOEIW9_FIN_eco_civ_2:0 "Timber Trains to Kotka"
 AOEIW9_FIN_eco_civ_2_desc:0 "New sidings and loading yards will carry sawn timber from the interior to Kotka's mills and harbour. Export income begins with a wagon that arrives on time."
 AOEIW9_FIN_eco_civ_5:0 "The State Railways Expansion"
 AOEIW9_FIN_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to State Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_FIN_eco_civ_6:0 "Harness the Imatra Rapids"
 AOEIW9_FIN_eco_civ_6_desc:0 "Imatra's turbines will be expanded to feed workshops, railways and new settlements. Domestic power reduces the country's exposure to interrupted fuel imports."
 AOEIW9_FIN_eco_civ_7:0 "A Second Shift at Tampere Workshops"
 AOEIW9_FIN_eco_civ_7_desc:0 "Tampere Workshops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_FIN_eco_civ_8:0 "Roads into the Forests"
 AOEIW9_FIN_eco_civ_8_desc:0 "Logging districts need all-season roads, depots and repair sheds before they can support more than seasonal extraction. Public works will open the interior to regular traffic."
 AOEIW9_FIN_eco_war_1:0 "The Helsinki Shipyards Armaments Audit"
 AOEIW9_FIN_eco_war_1_desc:0 "An armaments audit will determine which parts of Helsinki Shipyards can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_FIN_eco_war_2:0 "War Orders for State Railways"
 AOEIW9_FIN_eco_war_2_desc:0 "Long-term armament contracts will be assigned to State Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_FIN_eco_war_3:0 "Turbines for the War Economy"
 AOEIW9_FIN_eco_war_3_desc:0 "Machine shops will standardise generators, pumps and spare parts around Finland's hydroelectric stations. Power must survive mobilisation as reliably as the railways."
 AOEIW9_FIN_eco_war_4:0 "Expand Tampere Workshops for Rearmament"
 AOEIW9_FIN_eco_war_4_desc:0 "New military production capacity will be built around Tampere Workshops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_FIN_eco_war_5:0 "Measure Every Log"
 AOEIW9_FIN_eco_war_5_desc:0 "Foresters and mills will adopt common grades and dimensions for timber destined for barracks, bridges and packing cases. Waste in the forest becomes delay at the front."
 AOEIW9_FIN_eco_war_6:0 "Night Production at Petsamo Minerals"
 AOEIW9_FIN_eco_war_6_desc:0 "Night production will be organised at Petsamo Minerals with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_FIN_eco_war_7:0 "Long-Term Contracts for Helsinki Shipyards"
 AOEIW9_FIN_eco_war_7_desc:0 "Long-term contracts will give Helsinki Shipyards a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_FIN_eco_science_1:0 "Endow Helsinki University"
 AOEIW9_FIN_eco_science_1_desc:0 "Stable public funding will give Helsinki University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_FIN_eco_science_2:0 "New Laboratories at State Technical Institute"
 AOEIW9_FIN_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of State Technical Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_FIN_eco_science_3:0 "Research at the State Aircraft Factory"
 AOEIW9_FIN_eco_science_3_desc:0 "Designers and university engineers will test structures, engines and cold-weather equipment beside the production line. Finnish requirements will shape the prototypes from the start."
 AOEIW9_FIN_eco_science_4:0 "Industrial Physics at Helsinki University"
 AOEIW9_FIN_eco_science_4_desc:0 "Industrial physics at Helsinki University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_FIN_eco_science_5:0 "Production Science at State Technical Institute"
 AOEIW9_FIN_eco_science_5_desc:0 "Researchers at State Technical Institute will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_FIN_eco_science_6:0 "Fund Finland's Inventors"
 AOEIW9_FIN_eco_science_6_desc:0 "The state will fund promising work in radio, chemistry and winter equipment without demanding an immediate production order. Small laboratories can now carry an idea through testing."
 AOEIW9_FIN_eco_infra_2:0 "Freight Capacity at Helsinki Shipyards"
 AOEIW9_FIN_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Helsinki Shipyards will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_FIN_eco_infra_3:0 "Workers' Housing at State Railways"
 AOEIW9_FIN_eco_infra_3_desc:0 "Worker housing near State Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_FIN_eco_infra_4:0 "Power Lines from Imatra"
 AOEIW9_FIN_eco_infra_4_desc:0 "High-voltage lines will carry Imatra's electricity toward factories and railway junctions. The national grid must reach the places expected to sustain a war."
 AOEIW9_FIN_eco_final:0 "The Finnish Industrial State"
 AOEIW9_FIN_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a finnish economy able to convert regional strengths into sustained national output."
 AOEIW9_FIN_mil_root:0 "Review the Finnish General Staff"
 AOEIW9_FIN_mil_root_desc:0 "The Finnish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_FIN_mil_army_2:0 "Mannerheim Line Command Field Manoeuvres"
 AOEIW9_FIN_mil_army_2_desc:0 "Large field exercises with the Mannerheim Line Command will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_FIN_mil_army_5:0 "Motorise the Winter Warfare Centre"
 AOEIW9_FIN_mil_army_5_desc:0 "Motor transport assigned to the Winter Warfare Centre will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_FIN_mil_army_6:0 "Staff Procedures at the Finnish General Staff"
 AOEIW9_FIN_mil_army_6_desc:0 "Staff officers at the Finnish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_FIN_mil_army_7:0 "Armour Studies at the Mannerheim Line Command"
 AOEIW9_FIN_mil_army_7_desc:0 "The Mannerheim Line Command will study how armour can be integrated with infantry, artillery and logistics under finnish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_FIN_mil_army_8:0 "Operational Planning at the Jaeger Tradition"
 AOEIW9_FIN_mil_army_8_desc:0 "Operational planning with the Jaeger Tradition will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_FIN_mil_army_9:0 "Finnish Doctrine at the Field Artillery School"
 AOEIW9_FIN_mil_army_9_desc:0 "The doctrine taught by Field Artillery School will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations. For Finland, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_FIN_mil_air_1:0 "Reorganise Finnish Air Force"
 AOEIW9_FIN_mil_air_1_desc:0 "Finnish Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_FIN_mil_air_2:0 "Fighter Instruction at Kauhava Air School"
 AOEIW9_FIN_mil_air_2_desc:0 "Kauhava Air School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_FIN_mil_air_3:0 "Finnish Ground Support Doctrine under Northern Air Command"
 AOEIW9_FIN_mil_air_3_desc:0 "Northern Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Finland, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_FIN_mil_air_4:0 "Extend the Range of Finnish Air Force"
 AOEIW9_FIN_mil_air_4_desc:0 "Finnish Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Finland's geography and strategic commitments."
 AOEIW9_FIN_mil_air_5:0 "Radar Networks for Kauhava Air School"
 AOEIW9_FIN_mil_air_5_desc:0 "Kauhava Air School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_FIN_mil_air_6:0 "Unify Finnish Air Command under Northern Air Command"
 AOEIW9_FIN_mil_air_6_desc:0 "Northern Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For Finland, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_FIN_mil_sea_1:0 "Review Coastal Fleet"
 AOEIW9_FIN_mil_sea_1_desc:0 "A full review of Coastal Fleet will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_FIN_mil_sea_2:0 "Expand Turku Shipyard"
 AOEIW9_FIN_mil_sea_2_desc:0 "Turku Shipyard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_FIN_mil_sea_3:0 "Fleet Manoeuvres with Gulf of Finland Patrol"
 AOEIW9_FIN_mil_sea_3_desc:0 "Fleet exercises with Gulf of Finland Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_FIN_mil_sea_4:0 "Screening Doctrine for Coastal Fleet"
 AOEIW9_FIN_mil_sea_4_desc:0 "Coastal Fleet will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_FIN_mil_sea_5:0 "Naval Aviation at Turku Shipyard"
 AOEIW9_FIN_mil_sea_5_desc:0 "Naval aviation will be integrated with Turku Shipyard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_FIN_mil_sea_6:0 "New Hulls for Gulf of Finland Patrol"
 AOEIW9_FIN_mil_sea_6_desc:0 "New hull standards for Gulf of Finland Patrol will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_FIN_mil_final:0 "Winter Warfare"
 AOEIW9_FIN_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Finland now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_FIN_dip_root:0 "Define the White North Doctrine"
 AOEIW9_FIN_dip_root_desc:0 "Finland must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_FIN_dip_a_2:0 "Send a Mission on the Eastern Border"
 AOEIW9_FIN_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Eastern Border. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_FIN_dip_a_3:0 "Economic Leverage over the Eastern Border"
 AOEIW9_FIN_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Eastern Border. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_FIN_dip_a_4:0 "Staff Talks on the Eastern Border"
 AOEIW9_FIN_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Eastern Border. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_FIN_dip_a_5:0 "A Formal Warning over the Eastern Border"
 AOEIW9_FIN_dip_a_5_desc:0 "A formal warning over the Eastern Border will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_FIN_dip_a_6:0 "Terms for the Eastern Border"
 AOEIW9_FIN_dip_a_6_desc:0 "Terms for an ultimatum on the Eastern Border will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_FIN_dip_b_1:0 "Nordic Cooperation"
 AOEIW9_FIN_dip_b_1_desc:0 "Nordic Cooperation will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Finland actually wants before pressure is applied."
 AOEIW9_FIN_dip_b_2:0 "Send a Mission on Nordic Cooperation"
 AOEIW9_FIN_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Nordic Cooperation. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_FIN_dip_b_3:0 "Economic Leverage over Nordic Cooperation"
 AOEIW9_FIN_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Nordic Cooperation. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_FIN_dip_b_4:0 "Staff Talks on Nordic Cooperation"
 AOEIW9_FIN_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Nordic Cooperation. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_FIN_dip_b_5:0 "A Formal Warning over Nordic Cooperation"
 AOEIW9_FIN_dip_b_5_desc:0 "A formal warning over Nordic Cooperation will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_FIN_dip_b_6:0 "Terms for Nordic Cooperation"
 AOEIW9_FIN_dip_b_6_desc:0 "Terms for an ultimatum on Nordic Cooperation will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_FIN_dip_final:0 "Finland Between the Great Powers"
 AOEIW9_FIN_dip_final_desc:0 "Finland's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_FRA_focus_tree:0 "Second French Empire Focus Tree"
 AOEIW9_FRA_politics_root:0 "The Imperial Question"
 AOEIW9_FRA_politics_root_desc:0 "The constitutional machinery of the Second French Empire has become a contest between Paris Ministries, Senate of the Empire and Corps Législatif. Before foreign pressure hardens, the state must decide which institutions will actually govern and which will merely advise."
 AOEIW9_FRA_politics_p1_1:0 "The Liberal Empire"
 AOEIW9_FRA_politics_p1_1_desc:0 "Liberal Empire is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Second French Empire."
 AOEIW9_FRA_politics_p1_2:0 "Reconcile the Senate of the Empire"
 AOEIW9_FRA_politics_p1_2_desc:0 "Senate of the Empire has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Liberal Empire programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_FRA_politics_p1_3:0 "Reform the Corps Législatif"
 AOEIW9_FRA_politics_p1_3_desc:0 "Corps Législatif still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Liberal Empire settlement."
 AOEIW9_FRA_politics_p1_4:0 "Bind the Bonapartist Court"
 AOEIW9_FRA_politics_p1_4_desc:0 "Bonapartist Court will be tied to the Liberal Empire programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_FRA_politics_p1_5:0 "Balance the Provincial Prefects"
 AOEIW9_FRA_politics_p1_5_desc:0 "Neither abolishing Provincial Prefects nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Liberal Empire coalition."
 AOEIW9_FRA_politics_p1_6:0 "Codify the Workers' Chambers"
 AOEIW9_FRA_politics_p1_6_desc:0 "Custom and emergency practice around Workers' Chambers will be replaced with written rules. Codification fixes its place in the Liberal Empire order and limits future constitutional improvisation."
 AOEIW9_FRA_politics_p1_7:0 "Paris Ministries and Nation"
 AOEIW9_FRA_politics_p1_7_desc:0 "Paris Ministries will be presented as part of the national political order rather than a factional institution. The Liberal Empire camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_FRA_politics_p2_1:0 "Bonapartist Authority"
 AOEIW9_FRA_politics_p2_1_desc:0 "Bonapartist Authority is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Second French Empire."
 AOEIW9_FRA_politics_p2_2:0 "Open the Corps Législatif"
 AOEIW9_FRA_politics_p2_2_desc:0 "Access to Corps Législatif will be widened and its procedures made less dependent on closed patronage. The reform gives the Bonapartist Authority camp a legal route to broaden its support without bypassing the state."
 AOEIW9_FRA_politics_p2_3:0 "Guarantee the Bonapartist Court"
 AOEIW9_FRA_politics_p2_3_desc:0 "The position of Bonapartist Court will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Bonapartist Authority settlement."
 AOEIW9_FRA_politics_p2_4:0 "Broaden the Provincial Prefects"
 AOEIW9_FRA_politics_p2_4_desc:0 "Provincial Prefects will receive a wider role in consultation, administration and mobilisation. The Bonapartist Authority project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_FRA_politics_p2_5:0 "Entrust the Workers' Chambers"
 AOEIW9_FRA_politics_p2_5_desc:0 "Responsibility now shifts toward Workers' Chambers, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Bonapartist Authority system can govern through delegated institutions."
 AOEIW9_FRA_politics_p2_6:0 "Ratify the Paris Ministries"
 AOEIW9_FRA_politics_p2_6_desc:0 "A formal act of ratification will settle the place of Paris Ministries inside the new political order. Once accepted, the Bonapartist Authority arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_FRA_politics_p2_7_desc:0 "At Saint-Cloud, the Emperor will promulgate the division of authority among Crown, ministers and chambers. Bonapartist rule will rest on a public constitutional act rather than a permanent emergency."
 AOEIW9_FRA_politics_settlement_desc:0 "The chosen settlement gives Paris Ministries, Senate of the Empire and Corps Législatif a defined chain of authority instead of overlapping vetoes. the Second French Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_FRA_eco_root:0 "The Lorraine Steel Review"
 AOEIW9_FRA_eco_root_desc:0 "Lorraine Steel, Paris Industry and Renault Works do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Second French Empire can expand fastest."
 AOEIW9_FRA_eco_civ_1:0 "Survey the Lorraine Steel"
 AOEIW9_FRA_eco_civ_1_desc:0 "A detailed survey of Lorraine Steel will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_FRA_eco_civ_2:0 "Rails to Paris Industry"
 AOEIW9_FRA_eco_civ_2_desc:0 "Rail connections serving Paris Industry will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_FRA_eco_civ_3:0 "Capital for Renault Works"
 AOEIW9_FRA_eco_civ_3_desc:0 "State-backed credit will give Renault Works access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_FRA_eco_civ_4:0 "Power for Schneider-Creusot"
 AOEIW9_FRA_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Schneider-Creusot. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_FRA_eco_civ_5:0 "The Mediterranean Ports Expansion"
 AOEIW9_FRA_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Mediterranean Ports. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_FRA_eco_civ_6:0 "Renew the French National Railways"
 AOEIW9_FRA_eco_civ_6_desc:0 "National Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In France, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_FRA_eco_civ_7:0 "A Second Shift at Lorraine Steel"
 AOEIW9_FRA_eco_civ_7_desc:0 "Lorraine Steel has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_FRA_eco_war_1:0 "The Schneider-Creusot Armaments Audit"
 AOEIW9_FRA_eco_war_1_desc:0 "An armaments audit will determine which parts of Schneider-Creusot can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_FRA_eco_war_2:0 "War Orders for Mediterranean Ports"
 AOEIW9_FRA_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Mediterranean Ports, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_FRA_eco_war_3:0 "Precision Tools for the French National Railways"
 AOEIW9_FRA_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In France, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_FRA_eco_war_4:0 "Expand Lorraine Steel for Rearmament"
 AOEIW9_FRA_eco_war_4_desc:0 "New military production capacity will be built around Lorraine Steel, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_FRA_eco_war_5:0 "Standardise Paris Industry"
 AOEIW9_FRA_eco_war_5_desc:0 "Factories tied to Paris Industry will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_FRA_eco_war_6:0 "Night Production at Renault Works"
 AOEIW9_FRA_eco_war_6_desc:0 "Night production will be organised at Renault Works with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_FRA_eco_war_7:0 "Long-Term Contracts for Schneider-Creusot"
 AOEIW9_FRA_eco_war_7_desc:0 "Long-term contracts will give Schneider-Creusot a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_FRA_eco_war_8:0 "Mobilise Mediterranean Ports for Full Production"
 AOEIW9_FRA_eco_war_8_desc:0 "Mediterranean Ports will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_FRA_eco_science_1:0 "Endow Sorbonne Laboratories"
 AOEIW9_FRA_eco_science_1_desc:0 "Stable public funding will give Sorbonne Laboratories laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_FRA_eco_science_2:0 "New Laboratories at École Polytechnique"
 AOEIW9_FRA_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of École Polytechnique. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_FRA_eco_science_3:0 "Applied Research at National Centre for Research"
 AOEIW9_FRA_eco_science_3_desc:0 "National Centre for Research will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_FRA_eco_science_4:0 "Industrial Physics at Sorbonne Laboratories"
 AOEIW9_FRA_eco_science_4_desc:0 "Industrial physics at Sorbonne Laboratories will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_FRA_eco_science_5:0 "Production Science at École Polytechnique"
 AOEIW9_FRA_eco_science_5_desc:0 "Researchers at École Polytechnique will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_FRA_eco_science_6:0 "Research Grants for National Centre for Research"
 AOEIW9_FRA_eco_science_6_desc:0 "A national grant programme will connect National Centre for Research to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_FRA_eco_science_7:0 "Link Sorbonne Laboratories to the Factories"
 AOEIW9_FRA_eco_science_7_desc:0 "Sorbonne Laboratories will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_FRA_eco_infra_1:0 "Energy for Renault Works"
 AOEIW9_FRA_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Renault Works, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_FRA_eco_infra_2:0 "Freight Capacity at Schneider-Creusot"
 AOEIW9_FRA_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Schneider-Creusot will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_FRA_eco_infra_3:0 "Workers' Housing at Mediterranean Ports"
 AOEIW9_FRA_eco_infra_3_desc:0 "Worker housing near Mediterranean Ports will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_FRA_eco_infra_4:0 "French Logistics through the National Railways"
 AOEIW9_FRA_eco_infra_4_desc:0 "National Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In France, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_FRA_eco_final:0 "The Workshops of the Second Empire"
 AOEIW9_FRA_eco_final_desc:0 "Rails, credit, laboratories and arms orders now connect France’s regional industries. The imperial economy can turn plans issued in Paris into sustained output from its workshops."
 AOEIW9_FRA_mil_root:0 "Review the French General Staff"
 AOEIW9_FRA_mil_root_desc:0 "The French General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_FRA_mil_army_1:0 "The Autumn Manoeuvres at Mailly"
 AOEIW9_FRA_mil_army_1_desc:0 "Reservists, armour and artillery will manoeuvre together at Camp de Mailly. Broken schedules and confused orders will be corrected before they become a campaign."
 AOEIW9_FRA_mil_army_2:0 "The Methodical Infantry Battle"
 AOEIW9_FRA_mil_army_2_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_FRA_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_FRA_mil_army_3_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_FRA_mil_army_4_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_5:0 "Divisions Cuirassées"
 AOEIW9_FRA_mil_army_5_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_FRA_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_FRA_mil_army_6_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_FRA_mil_army_9_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_FRA_mil_army_10_desc:0 "France can build its army around prepared fire plans or concentrate armour for an operational counterstroke. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_FRA_mil_air_1:0 "Reorganise Armée de l'Air"
 AOEIW9_FRA_mil_air_1_desc:0 "Armée de l'Air will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_FRA_mil_air_2:0 "Fighter Instruction at Fighter Aviation School"
 AOEIW9_FRA_mil_air_2_desc:0 "Fighter Aviation School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_FRA_mil_air_3:0 "French Ground Support Doctrine under Strategic Air Command"
 AOEIW9_FRA_mil_air_3_desc:0 "Strategic Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For France, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_FRA_mil_air_4:0 "Extend the Range of Armée de l'Air"
 AOEIW9_FRA_mil_air_4_desc:0 "Armée de l'Air will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Second French Empire's geography and strategic commitments."
 AOEIW9_FRA_mil_air_5:0 "Radar Networks for Fighter Aviation School"
 AOEIW9_FRA_mil_air_5_desc:0 "Fighter Aviation School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_FRA_mil_air_6:0 "Unify French Air Command under Strategic Air Command"
 AOEIW9_FRA_mil_air_6_desc:0 "Strategic Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For France, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_FRA_mil_air_7:0 "Armée de l'Air Comes of Age"
 AOEIW9_FRA_mil_air_7_desc:0 "Armée de l'Air now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_FRA_mil_sea_1:0 "Review Marine Nationale"
 AOEIW9_FRA_mil_sea_1_desc:0 "A full review of Marine Nationale will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_FRA_mil_sea_2:0 "Expand Brest Arsenal"
 AOEIW9_FRA_mil_sea_2_desc:0 "Brest Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_FRA_mil_sea_3:0 "Fleet Manoeuvres with Mediterranean Fleet"
 AOEIW9_FRA_mil_sea_3_desc:0 "Fleet exercises with Mediterranean Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_FRA_mil_sea_4:0 "Screening Doctrine for Marine Nationale"
 AOEIW9_FRA_mil_sea_4_desc:0 "Marine Nationale will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_FRA_mil_sea_5:0 "Naval Aviation at Brest Arsenal"
 AOEIW9_FRA_mil_sea_5_desc:0 "Naval aviation will be integrated with Brest Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_FRA_mil_sea_6:0 "New Hulls for Mediterranean Fleet"
 AOEIW9_FRA_mil_sea_6_desc:0 "New hull standards for Mediterranean Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_FRA_mil_sea_7:0 "Sea Command under Marine Nationale"
 AOEIW9_FRA_mil_sea_7_desc:0 "Marine Nationale will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Second French Empire. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_FRA_mil_final:0 "Methodical Battle"
 AOEIW9_FRA_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Second French Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_FRA_dip_root:0 "Define the Imperial Continental Doctrine"
 AOEIW9_FRA_dip_root_desc:0 "The Second French Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_FRA_dip_a_1:0 "The Rhine Rivalry"
 AOEIW9_FRA_dip_a_1_desc:0 "The Rhine Rivalry will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Second French Empire actually wants before pressure is applied."
 AOEIW9_FRA_dip_a_2:0 "Send a Mission on the Rhine Rivalry"
 AOEIW9_FRA_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Rhine Rivalry. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_FRA_dip_a_3:0 "Economic Leverage over the Rhine Rivalry"
 AOEIW9_FRA_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Rhine Rivalry. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_FRA_dip_a_4:0 "Staff Talks on the Rhine Rivalry"
 AOEIW9_FRA_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Rhine Rivalry. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_FRA_dip_a_5:0 "A Formal Warning over the Rhine Rivalry"
 AOEIW9_FRA_dip_a_5_desc:0 "A formal warning over the Rhine Rivalry will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_FRA_dip_a_6:0 "Terms for the Rhine Rivalry"
 AOEIW9_FRA_dip_a_6_desc:0 "Terms for an ultimatum on the Rhine Rivalry will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_FRA_dip_a_7:0 "The Decision on the Rhine Rivalry"
 AOEIW9_FRA_dip_a_7_desc:0 "The government reaches the decision point on the Rhine Rivalry. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_FRA_dip_b_1:0 "Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_1_desc:0 "Mediterranean Ambitions will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Second French Empire actually wants before pressure is applied."
 AOEIW9_FRA_dip_b_2:0 "Send a Mission on Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Mediterranean Ambitions. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_FRA_dip_b_3:0 "Economic Leverage over Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Mediterranean Ambitions. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_FRA_dip_b_4:0 "Staff Talks on Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Mediterranean Ambitions. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_FRA_dip_b_5:0 "A Formal Warning over Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_5_desc:0 "A formal warning over Mediterranean Ambitions will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_FRA_dip_b_6:0 "Terms for Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_6_desc:0 "Terms for an ultimatum on Mediterranean Ambitions will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_FRA_dip_b_7:0 "The Decision on Mediterranean Ambitions"
 AOEIW9_FRA_dip_b_7_desc:0 "The government reaches the decision point on Mediterranean Ambitions. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_FRA_dip_final:0 "Guardians of the Old Order"
 AOEIW9_FRA_dip_final_desc:0 "The Second French Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_GER_focus_tree:0 "German Empire Focus Tree"
 AOEIW9_GER_politics_p1_1:0 "A Federal Kaiserreich"
 AOEIW9_GER_politics_p1_1_desc:0 "Federal Kaiserreich is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the German Empire."
 AOEIW9_GER_politics_p1_2:0 "Reconcile the Bundesrat"
 AOEIW9_GER_politics_p1_2_desc:0 "Bundesrat has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Federal Kaiserreich programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_GER_politics_p1_3:0 "Reform the Imperial Chancellery"
 AOEIW9_GER_politics_p1_3_desc:0 "Imperial Chancellery still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Federal Kaiserreich settlement."
 AOEIW9_GER_politics_p1_4:0 "Bind the Prussian Ministry"
 AOEIW9_GER_politics_p1_4_desc:0 "Prussian Ministry will be tied to the Federal Kaiserreich programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_GER_politics_p1_5:0 "Balance the Federal Princes"
 AOEIW9_GER_politics_p1_5_desc:0 "Neither abolishing Federal Princes nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Federal Kaiserreich coalition."
 AOEIW9_GER_politics_p1_6:0 "Codify the Workers' Councils"
 AOEIW9_GER_politics_p1_6_desc:0 "Custom and emergency practice around Workers' Councils will be replaced with written rules. Codification fixes its place in the Federal Kaiserreich order and limits future constitutional improvisation."
 AOEIW9_GER_politics_p1_7:0 "Reichstag and Nation"
 AOEIW9_GER_politics_p1_7_desc:0 "Reichstag will be presented as part of the national political order rather than a factional institution. The Federal Kaiserreich camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_GER_politics_p2_1:0 "Rebuild the Civic Networks"
 AOEIW9_GER_politics_p2_1_desc:0 "Catholic associations, municipal reformers and constitutional conservatives can reconnect the civic life suppressed by imperial patronage. Their cooperation begins a lawful opposition."
 AOEIW9_GER_politics_p2_2:0 "Organise the Constitutional Opposition"
 AOEIW9_GER_politics_p2_2_desc:0 "The opposition must become more than private dissent. A disciplined parliamentary coalition can defend institutions while accepting the costs of open confrontation with the court."
 AOEIW9_GER_politics_p2_3:0 "The Cologne Memorandum"
 AOEIW9_GER_politics_p2_3_desc:0 "Adenauer's circle will circulate a federal memorandum binding civil liberties, regional responsibility and accountable government into a single programme."
 AOEIW9_GER_politics_p2_4:0 "Negotiate with German Industry"
 AOEIW9_GER_politics_p2_4_desc:0 "Industrial leaders will accept constitutional reform if contracts, credit and collective bargaining survive the transition. The settlement is productive, but not free."
 AOEIW9_GER_politics_p2_5:0 "Secure Military Neutrality"
 AOEIW9_GER_politics_p2_5_desc:0 "The officer corps must neither defend the palace nor seize the state. Professional guarantees can keep the army neutral during the approaching parliamentary crisis."
 AOEIW9_GER_politics_p2_6:0 "The Länder Ultimatum"
 AOEIW9_GER_politics_p2_6_desc:0 "Bavaria, Saxony and Württemberg will not exchange one emergency government for another. Their ministers arrive in Berlin with written demands: restore the federal veto, publish the cabinet's powers and submit the settlement to the Reichstag."
 AOEIW9_GER_politics_p2_7:0 "Form the Adenauer Government"
 AOEIW9_GER_politics_p2_7_desc:0 "With parliament, industry, the regions and the army accounted for, Konrad Adenauer can form a responsible government and end personal imperial rule."
 AOEIW9_GER_politics_settlement:0 "The Kaiserreich in Working Order"
 AOEIW9_GER_politics_settlement_desc:0 "The chosen settlement gives Reichstag, Bundesrat and Imperial Chancellery a defined chain of authority instead of overlapping vetoes. the German Empire can now govern through institutions that match the political order selected by the player."
 AOEIW9_GER_eco_root:0 "The Ruhr Foundries Review"
 AOEIW9_GER_eco_root_desc:0 "Ruhr Foundries, Krupp Works and Silesian Coalfields do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the German Empire can expand fastest."
 AOEIW9_GER_eco_civ_1:0 "Survey the Ruhr Foundries"
 AOEIW9_GER_eco_civ_1_desc:0 "A detailed survey of Ruhr Foundries will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_GER_eco_civ_2:0 "Rails to Krupp Works"
 AOEIW9_GER_eco_civ_2_desc:0 "Rail connections serving Krupp Works will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_GER_eco_civ_3:0 "Capital for Silesian Coalfields"
 AOEIW9_GER_eco_civ_3_desc:0 "State-backed credit will give Silesian Coalfields access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_GER_eco_civ_4:0 "Power for Hamburg Shipyards"
 AOEIW9_GER_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Hamburg Shipyards. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_GER_eco_civ_5:0 "The Rhineland Machine Tools Expansion"
 AOEIW9_GER_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Rhineland Machine Tools. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_GER_eco_civ_6:0 "Renew Reichsbahn"
 AOEIW9_GER_eco_civ_6_desc:0 "Reichsbahn will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_GER_eco_civ_7:0 "A Second Shift at Ruhr Foundries"
 AOEIW9_GER_eco_civ_7_desc:0 "Ruhr Foundries has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_GER_eco_war_1:0 "The Hamburg Shipyards Armaments Audit"
 AOEIW9_GER_eco_war_1_desc:0 "An armaments audit will determine which parts of Hamburg Shipyards can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_GER_eco_war_2:0 "War Orders for Rhineland Machine Tools"
 AOEIW9_GER_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Rhineland Machine Tools, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_GER_eco_war_3:0 "Precision Tools for Reichsbahn"
 AOEIW9_GER_eco_war_3_desc:0 "Precision machine tools will be prioritised for Reichsbahn, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_GER_eco_war_4:0 "Expand Ruhr Foundries for Rearmament"
 AOEIW9_GER_eco_war_4_desc:0 "New military production capacity will be built around Ruhr Foundries, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_GER_eco_war_5:0 "Standardise Krupp Works"
 AOEIW9_GER_eco_war_5_desc:0 "Factories tied to Krupp Works will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_GER_eco_war_6:0 "Night Production at Silesian Coalfields"
 AOEIW9_GER_eco_war_6_desc:0 "Night production will be organised at Silesian Coalfields with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_GER_eco_war_7:0 "Long-Term Contracts for Hamburg Shipyards"
 AOEIW9_GER_eco_war_7_desc:0 "Long-term contracts will give Hamburg Shipyards a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_GER_eco_war_8:0 "Mobilise Rhineland Machine Tools for Full Production"
 AOEIW9_GER_eco_war_8_desc:0 "Rhineland Machine Tools will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_GER_eco_science_1:0 "Endow Kaiser Wilhelm Society"
 AOEIW9_GER_eco_science_1_desc:0 "Stable public funding will give Kaiser Wilhelm Society laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_GER_eco_science_2:0 "New Laboratories at Göttingen Institutes"
 AOEIW9_GER_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Göttingen Institutes. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_GER_eco_science_3:0 "Applied Research at Charlottenburg Technical University"
 AOEIW9_GER_eco_science_3_desc:0 "Charlottenburg Technical University will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_GER_eco_science_4:0 "Industrial Physics at Kaiser Wilhelm Society"
 AOEIW9_GER_eco_science_4_desc:0 "Industrial physics at Kaiser Wilhelm Society will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_GER_eco_science_5:0 "Production Science at Göttingen Institutes"
 AOEIW9_GER_eco_science_5_desc:0 "Researchers at Göttingen Institutes will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_GER_eco_science_6:0 "Research Grants for Charlottenburg Technical University"
 AOEIW9_GER_eco_science_6_desc:0 "A national grant programme will connect Charlottenburg Technical University to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_GER_eco_science_7:0 "Link Kaiser Wilhelm Society to the Factories"
 AOEIW9_GER_eco_science_7_desc:0 "Kaiser Wilhelm Society will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_GER_eco_infra_1:0 "Energy for Silesian Coalfields"
 AOEIW9_GER_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Silesian Coalfields, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_GER_eco_infra_2:0 "Freight Capacity at Hamburg Shipyards"
 AOEIW9_GER_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Hamburg Shipyards will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_GER_eco_infra_3:0 "Workers' Housing at Rhineland Machine Tools"
 AOEIW9_GER_eco_infra_3_desc:0 "Worker housing near Rhineland Machine Tools will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_GER_eco_infra_4:0 "Logistics through Reichsbahn"
 AOEIW9_GER_eco_infra_4_desc:0 "Reichsbahn will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_GER_eco_final:0 "A Coordinated German Industrial System"
 AOEIW9_GER_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a German economy able to convert regional strengths into sustained national output."
 AOEIW9_GER_mil_root:0 "Review the Prussian General Staff"
 AOEIW9_GER_mil_root_desc:0 "The Prussian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_GER_mil_army_1:0 "The Döberitz Manoeuvres"
 AOEIW9_GER_mil_army_1_desc:0 "At Döberitz the Reichsheer will settle an argument that memoranda cannot: disciplined infantry battle or mobile armoured command. The exercises will decide where the next instructors and equipment go."
 AOEIW9_GER_mil_army_2:0 "Auftragstaktik on Foot"
 AOEIW9_GER_mil_army_2_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_GER_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_GER_mil_army_3_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_army_5:0 "Independent Panzer Groups"
 AOEIW9_GER_mil_army_5_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_GER_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_GER_mil_army_6_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_army_8:0 "One Supply Service"
 AOEIW9_GER_mil_army_8_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_GER_mil_army_9_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_GER_mil_army_10_desc:0 "The Reichsheer must choose whether junior infantry leaders or mobile armoured headquarters carry the decisive effort. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_GER_mil_air_1:0 "Reorganise Luftstreitkräfte"
 AOEIW9_GER_mil_air_1_desc:0 "Luftstreitkräfte will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_GER_mil_air_2:0 "Fighter Instruction at Döberitz Air School"
 AOEIW9_GER_mil_air_2_desc:0 "Döberitz Air School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_GER_mil_air_3:0 "Ground Support Doctrine under Imperial Air Command"
 AOEIW9_GER_mil_air_3_desc:0 "Imperial Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_GER_mil_air_4:0 "Extend the Range of Luftstreitkräfte"
 AOEIW9_GER_mil_air_4_desc:0 "Luftstreitkräfte will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the German Empire's geography and strategic commitments."
 AOEIW9_GER_mil_air_5:0 "Radar Networks for Döberitz Air School"
 AOEIW9_GER_mil_air_5_desc:0 "Döberitz Air School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_GER_mil_air_6:0 "Unify Command under Imperial Air Command"
 AOEIW9_GER_mil_air_6_desc:0 "Imperial Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_GER_mil_air_7:0 "Luftstreitkräfte Comes of Age"
 AOEIW9_GER_mil_air_7_desc:0 "Luftstreitkräfte now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_GER_mil_sea_1:0 "Review Hochseeflotte"
 AOEIW9_GER_mil_sea_1_desc:0 "A full review of Hochseeflotte will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_GER_mil_sea_2:0 "Expand Kiel Naval Arsenal"
 AOEIW9_GER_mil_sea_2_desc:0 "Kiel Naval Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_GER_mil_sea_3:0 "Fleet Manoeuvres with North Sea Fleet"
 AOEIW9_GER_mil_sea_3_desc:0 "Fleet exercises with North Sea Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_GER_mil_sea_4:0 "Screening Doctrine for Hochseeflotte"
 AOEIW9_GER_mil_sea_4_desc:0 "Hochseeflotte will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_GER_mil_sea_5:0 "Naval Aviation at Kiel Naval Arsenal"
 AOEIW9_GER_mil_sea_5_desc:0 "Naval aviation will be integrated with Kiel Naval Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_GER_mil_sea_6:0 "New Hulls for North Sea Fleet"
 AOEIW9_GER_mil_sea_6_desc:0 "New hull standards for North Sea Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_GER_mil_sea_7:0 "Sea Command under Hochseeflotte"
 AOEIW9_GER_mil_sea_7_desc:0 "Hochseeflotte will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the German Empire. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_GER_mil_final:0 "Auftragstaktik"
 AOEIW9_GER_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the German Empire now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_GER_dip_root:0 "Define the Mitteleuropa Doctrine"
 AOEIW9_GER_dip_root_desc:0 "The German Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_GER_dip_a_1:0 "The Vienna Relationship"
 AOEIW9_GER_dip_a_1_desc:0 "Germany and Austria-Hungary stand in different blocs, yet geography and history make permanent hostility strategically reckless."
 AOEIW9_GER_dip_a_2:0 "The Berlin–Vienna Understanding"
 AOEIW9_GER_dip_a_2_desc:0 "Berlin will seek a durable understanding with Vienna that recognises disagreement without turning it into an automatic confrontation."
 AOEIW9_GER_dip_a_3:0 "Danubian Trade without Subordination"
 AOEIW9_GER_dip_a_3_desc:0 "German access to Danubian markets will be expanded without demanding Austro-Hungarian political subordination."
 AOEIW9_GER_dip_a_4:0 "General Staff Channels"
 AOEIW9_GER_dip_a_4_desc:0 "Quiet staff channels will reduce the risk that exercises, mobilisation or Balkan crises are misread as preparations for attack."
 AOEIW9_GER_dip_a_5:0 "Respect the Habsburg Sphere"
 AOEIW9_GER_dip_a_5_desc:0 "Germany will recognise that Vienna has legitimate interests in the Danube and Balkans even while the Reichspakt pursues its own strategy."
 AOEIW9_GER_dip_a_6:0 "A Continental Non-Aggression Accord"
 AOEIW9_GER_dip_a_6_desc:0 "A formal non-aggression accord can prevent rivalry between the two German-speaking great powers from detonating Europe by accident."
 AOEIW9_GER_dip_a_7:0 "The German–Austro-Hungarian Understanding"
 AOEIW9_GER_dip_a_7_desc:0 "Berlin and Vienna will institutionalise a working relationship across bloc lines while leaving future alignment to explicit political choices."
 AOEIW9_GER_dip_b_1:0 "The Rhine Ultimatum"
 AOEIW9_GER_dip_b_1_desc:0 "The Rhine Ultimatum will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the German Empire actually wants before pressure is applied."
 AOEIW9_GER_dip_b_2:0 "Send a Mission on the Rhine Ultimatum"
 AOEIW9_GER_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Rhine Ultimatum. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_GER_dip_b_3:0 "Economic Leverage over the Rhine Ultimatum"
 AOEIW9_GER_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Rhine Ultimatum. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_GER_dip_b_4:0 "Staff Talks on the Rhine Ultimatum"
 AOEIW9_GER_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Rhine Ultimatum. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_GER_dip_b_5:0 "A Formal Warning over the Rhine Ultimatum"
 AOEIW9_GER_dip_b_5_desc:0 "A formal warning over the Rhine Ultimatum will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_GER_dip_b_6:0 "Terms for the Rhine Ultimatum"
 AOEIW9_GER_dip_b_6_desc:0 "Terms for an ultimatum on the Rhine Ultimatum will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_GER_dip_b_7:0 "The Decision on the Rhine Ultimatum"
 AOEIW9_GER_dip_b_7_desc:0 "The government reaches the decision point on the Rhine Ultimatum. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_GER_dip_final:0 "A Reichspakt Grand Strategy"
 AOEIW9_GER_dip_final_desc:0 "The German Empire's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_GER_special_1:0 "War Industry of the Reich"
 AOEIW9_GER_special_1_desc:0 "War Industry of the Reich addresses a strategic problem that is specific to the German Empire. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_GER_special_2:0 "The Second Krupp Expansion"
 AOEIW9_GER_special_2_desc:0 "The government will turn The Second Krupp Expansion into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the German Empire's situation rather than from a universal template."
 AOEIW9_GER_special_3:0 "Rationalise the Ruhr"
 AOEIW9_GER_special_3_desc:0 "Rationalise the Ruhr links economic capacity, planning and military requirements that already exist in the German Empire. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_GER_special_4:0 "Machine Tools for Total War"
 AOEIW9_GER_special_4_desc:0 "By pursuing Machine Tools for Total War, the German Empire commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_GER_special_5:0 "The Armaments Ministry"
 AOEIW9_GER_special_5_desc:0 "The Armaments Ministry addresses a strategic problem that is specific to the German Empire. The programme commits institutions and resources to that problem instead of hiding another generic bonus behind a national-sounding name."
 AOEIW9_GER_special_6:0 "A Continental War Economy"
 AOEIW9_GER_special_6_desc:0 "The government will turn A Continental War Economy into a defined programme with budgets, responsible institutions and measurable strategic aims. Its value comes from fitting the German Empire's situation rather than from a universal template."
 AOEIW9_GER_special_7:0 "German Industrial Supremacy"
 AOEIW9_GER_special_7_desc:0 "German Industrial Supremacy links economic capacity, planning and military requirements that already exist in the German Empire. The focus is meant to change how those assets are organised, not simply add political power."
 AOEIW9_GER_special_8:0 "The Arsenal of Europe"
 AOEIW9_GER_special_8_desc:0 "By pursuing The Arsenal of Europe, the German Empire commits to a capability its wider strategy actually depends upon. The programme is designed as a national speciality rather than a copy of another country's branch."
 AOEIW9_GRE_focus_tree:0 "Kingdom of Greece Focus Tree"
 AOEIW9_GRE_politics_p1_2:0 "Reconcile the Hellenic Parliament"
 AOEIW9_GRE_politics_p1_2_desc:0 "Hellenic Parliament has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Greek Constitutional Monarchy programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_GRE_politics_p1_3:0 "Reform the Greek Officer League"
 AOEIW9_GRE_politics_p1_3_desc:0 "Officer League still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Greek Constitutional Monarchy settlement."
 AOEIW9_GRE_politics_p1_4:0 "Bind the Venizelist Bloc"
 AOEIW9_GRE_politics_p1_4_desc:0 "Venizelist Bloc will be tied to the Greek Constitutional Monarchy programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_GRE_politics_p1_5:0 "The Greek Crown and Nation"
 AOEIW9_GRE_politics_p1_5_desc:0 "Royal Palace will be presented as part of the national political order rather than a factional institution. The Greek Constitutional Monarchy camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_GRE_politics_p2_2:0 "Open the Greek Officer League"
 AOEIW9_GRE_politics_p2_2_desc:0 "Access to Officer League will be widened and its procedures made less dependent on closed patronage. The reform gives the Royal Government camp a legal route to broaden its support without bypassing the state."
 AOEIW9_GRE_politics_p2_3:0 "Guarantee the Venizelist Bloc"
 AOEIW9_GRE_politics_p2_3_desc:0 "The position of Venizelist Bloc will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Royal Government settlement."
 AOEIW9_GRE_politics_p2_4:0 "Broaden the Orthodox Church"
 AOEIW9_GRE_politics_p2_4_desc:0 "Orthodox Church will receive a wider role in consultation, administration and mobilisation. The Royal Government project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_GRE_politics_p2_5:0 "Restore Constitutional Government"
 AOEIW9_GRE_politics_p2_5_desc:0 "Parliament will bind appointments and emergency powers to a ministry holding its confidence. The Crown returns to rules the Venizelists can contest lawfully."
 AOEIW9_GRE_politics_p3_2:0 "Mobilise the Venizelist Bloc"
 AOEIW9_GRE_politics_p3_2_desc:0 "Venizelist Bloc will become an organising arm of the National Idea programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_GRE_politics_p3_3:0 "Break the Orthodox Church"
 AOEIW9_GRE_politics_p3_3_desc:0 "The independent power of Orthodox Church is incompatible with the National Idea project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_GRE_politics_p3_4:0 "Replace the Greek Provincial Prefects"
 AOEIW9_GRE_politics_p3_4_desc:0 "Provincial Prefects will be removed from its gatekeeping role and replaced with officials loyal to the National Idea settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_GRE_politics_p3_5:0 "The Fourth of August"
 AOEIW9_GRE_politics_p3_5_desc:0 "Parliament is suspended and the regime proclaims national discipline above party conflict. Metaxas now owns the divisions he promised to end."
 AOEIW9_GRE_politics_settlement:0 "Athens Chooses Crown or Parliament"
 AOEIW9_GRE_politics_settlement_desc:0 "The constitutional struggle has fixed who appoints ministers and commands the prefects. Greece can govern while the National Schism remains a memory rather than a daily procedure."
 AOEIW9_GRE_eco_root:0 "The Piraeus Docks Review"
 AOEIW9_GRE_eco_root_desc:0 "Piraeus Docks, Thessaloniki Industry and Macedonian Roads do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Greece can expand fastest."
 AOEIW9_GRE_eco_civ_2:0 "Rails to Thessaloniki Industry"
 AOEIW9_GRE_eco_civ_2_desc:0 "Rail connections serving Thessaloniki Industry will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_GRE_eco_civ_5:0 "The Lavrion Mines Expansion"
 AOEIW9_GRE_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Lavrion Mines. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_GRE_eco_civ_6:0 "Renew the Greek National Railways"
 AOEIW9_GRE_eco_civ_6_desc:0 "National Railways will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion. In Greece, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_GRE_eco_civ_7:0 "A Second Shift at Piraeus Docks"
 AOEIW9_GRE_eco_civ_7_desc:0 "Piraeus Docks has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_GRE_eco_civ_8:0 "Public Works at Thessaloniki Industry"
 AOEIW9_GRE_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Thessaloniki Industry will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_GRE_eco_civ_9:0 "The Road from Salonika to Florina"
 AOEIW9_GRE_eco_civ_9_desc:0 "Road crews will improve the western Macedonian route for trade, reserves and frontier supply. Development follows a road the army may need."
 AOEIW9_GRE_eco_war_1:0 "The Aegean Commerce Armaments Audit"
 AOEIW9_GRE_eco_war_1_desc:0 "An armaments audit will determine which parts of Aegean Commerce can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_GRE_eco_war_2:0 "War Orders for Lavrion Mines"
 AOEIW9_GRE_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Lavrion Mines, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_GRE_eco_war_3:0 "Precision Tools for the Greek National Railways"
 AOEIW9_GRE_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Railways, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand. In Greece, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_GRE_eco_war_4:0 "Expand Piraeus Docks for Rearmament"
 AOEIW9_GRE_eco_war_4_desc:0 "New military production capacity will be built around Piraeus Docks, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_GRE_eco_war_5:0 "Standardise Thessaloniki Industry"
 AOEIW9_GRE_eco_war_5_desc:0 "Factories tied to Thessaloniki Industry will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_GRE_eco_war_6:0 "Night Production at Macedonian Roads"
 AOEIW9_GRE_eco_war_6_desc:0 "Night production will be organised at Macedonian Roads with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_GRE_eco_science_1:0 "Endow Athens Polytechnic"
 AOEIW9_GRE_eco_science_1_desc:0 "Stable public funding will give Athens Polytechnic laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_GRE_eco_science_2:0 "New Laboratories at Academy of Athens"
 AOEIW9_GRE_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Academy of Athens. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_GRE_eco_science_3:0 "Laboratories at Athens Polytechnic"
 AOEIW9_GRE_eco_science_3_desc:0 "The Polytechnic will connect engineers with Pyrkal, ports and power works. Research will answer Greek production problems at home."
 AOEIW9_GRE_eco_science_4:0 "Industrial Physics at Athens Polytechnic"
 AOEIW9_GRE_eco_science_4_desc:0 "Industrial physics at Athens Polytechnic will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_GRE_eco_science_5:0 "Production Science at Academy of Athens"
 AOEIW9_GRE_eco_science_5_desc:0 "Researchers at Academy of Athens will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_GRE_eco_infra_2:0 "Freight Capacity at Aegean Commerce"
 AOEIW9_GRE_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Aegean Commerce will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_GRE_eco_infra_3:0 "Workers' Housing at Lavrion Mines"
 AOEIW9_GRE_eco_infra_3_desc:0 "Worker housing near Lavrion Mines will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_GRE_eco_infra_4:0 "Greek Logistics through the National Railways"
 AOEIW9_GRE_eco_infra_4_desc:0 "National Railways will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces. In Greece, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_GRE_eco_final:0 "The Greek Development Economy"
 AOEIW9_GRE_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a greek economy able to convert regional strengths into sustained national output."
 AOEIW9_GRE_mil_root:0 "Review the Hellenic General Staff"
 AOEIW9_GRE_mil_root_desc:0 "The Hellenic General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_GRE_mil_army_2:0 "Evzone Regiments Field Manoeuvres"
 AOEIW9_GRE_mil_army_2_desc:0 "Large field exercises with the Evzone Regiments will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_GRE_mil_army_5:0 "Motorise the Athens Staff College"
 AOEIW9_GRE_mil_army_5_desc:0 "Motor transport assigned to the Athens Staff College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_GRE_mil_army_6:0 "Staff Procedures at the Hellenic General Staff"
 AOEIW9_GRE_mil_army_6_desc:0 "Staff officers at the Hellenic General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_GRE_mil_army_7:0 "Armour Studies at the Evzone Regiments"
 AOEIW9_GRE_mil_army_7_desc:0 "The Evzone Regiments will study how armour can be integrated with infantry, artillery and logistics under greek conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_GRE_mil_air_1:0 "Reorganise Royal Hellenic Air Force"
 AOEIW9_GRE_mil_air_1_desc:0 "Royal Hellenic Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_GRE_mil_air_2:0 "Fighter Instruction at Tatoi Air Base"
 AOEIW9_GRE_mil_air_2_desc:0 "Tatoi Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_GRE_mil_air_3:0 "Ground Support Doctrine under Aegean Air Command"
 AOEIW9_GRE_mil_air_3_desc:0 "Aegean Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_GRE_mil_air_4:0 "Extend the Range of Royal Hellenic Air Force"
 AOEIW9_GRE_mil_air_4_desc:0 "Royal Hellenic Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Greece's geography and strategic commitments."
 AOEIW9_GRE_mil_air_5:0 "Radar Networks for Tatoi Air Base"
 AOEIW9_GRE_mil_air_5_desc:0 "Tatoi Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_GRE_mil_sea_1:0 "Review Royal Hellenic Navy"
 AOEIW9_GRE_mil_sea_1_desc:0 "A full review of Royal Hellenic Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_GRE_mil_sea_2:0 "Expand Salamis Naval Base"
 AOEIW9_GRE_mil_sea_2_desc:0 "Salamis Naval Base will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_GRE_mil_sea_3:0 "Fleet Manoeuvres with Aegean Fleet"
 AOEIW9_GRE_mil_sea_3_desc:0 "Fleet exercises with Aegean Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_GRE_mil_sea_4:0 "Screening Doctrine for Royal Hellenic Navy"
 AOEIW9_GRE_mil_sea_4_desc:0 "Royal Hellenic Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_GRE_mil_sea_5:0 "Naval Aviation at Salamis Naval Base"
 AOEIW9_GRE_mil_sea_5_desc:0 "Naval aviation will be integrated with Salamis Naval Base for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_GRE_mil_final:0 "Mountain Offensive"
 AOEIW9_GRE_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Greece now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_GRE_dip_root:0 "Define the Megali Doctrine"
 AOEIW9_GRE_dip_root_desc:0 "The Kingdom of Greece must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_GRE_dip_a_2:0 "Send a Mission on the Aegean Question"
 AOEIW9_GRE_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Aegean Question. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_GRE_dip_a_3:0 "Economic Leverage over the Aegean Question"
 AOEIW9_GRE_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Aegean Question. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_GRE_dip_a_4:0 "Staff Talks on the Aegean Question"
 AOEIW9_GRE_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Aegean Question. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_GRE_dip_a_5:0 "A Formal Warning over the Aegean Question"
 AOEIW9_GRE_dip_a_5_desc:0 "A formal warning over the Aegean Question will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_GRE_dip_b_1:0 "Four Capitals Sign the Balkan Pact"
 AOEIW9_GRE_dip_b_1_desc:0 "Athens, Ankara, Belgrade and Bucharest affirm the territorial order and consultation against revision. The pact gives Greece partners, not automatic armies."
 AOEIW9_GRE_dip_b_2:0 "Envoys to Ankara and Belgrade"
 AOEIW9_GRE_dip_b_2_desc:0 "Greek envoys will ask what aid, transit and intelligence the pact can actually provide. Friendly communiqués must become named commitments."
 AOEIW9_GRE_dip_b_3:0 "Trade before Territory"
 AOEIW9_GRE_dip_b_3_desc:0 "Greece will offer port access and commercial concessions to strengthen the existing borders. Prosperity gives neighbours a reason to preserve the pact."
 AOEIW9_GRE_dip_b_4:0 "Staff Maps at Thessaloniki"
 AOEIW9_GRE_dip_b_4_desc:0 "Allied officers will compare railheads, mountain passes and mobilisation times at Thessaloniki. Cooperation begins with maps that use the same assumptions."
 AOEIW9_GRE_dip_b_5:0 "Athens Draws the Red Line"
 AOEIW9_GRE_dip_b_5_desc:0 "The government will name the frontier changes that trigger consultation and mobilisation. Ambiguity will no longer invite a test of the pact."
 AOEIW9_GRE_dip_final:0 "Athens and the Eastern Mediterranean"
 AOEIW9_GRE_dip_final_desc:0 "The Kingdom of Greece's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_HOL_focus_tree:0 "Kingdom of the Netherlands Focus Tree"
 AOEIW9_HOL_politics_p1_2:0 "Reconcile the States General"
 AOEIW9_HOL_politics_p1_2_desc:0 "States General has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Orange Compromise programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_HOL_politics_p1_3:0 "The Cabinet Faces the States General"
 AOEIW9_HOL_politics_p1_3_desc:0 "Ministers will defend colonial instructions and defence spending before both chambers."
 AOEIW9_HOL_politics_p1_4:0 "Bind the Pillar Organisations"
 AOEIW9_HOL_politics_p1_4_desc:0 "Pillar Organisations will be tied to the Orange Compromise programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_HOL_politics_p1_5:0 "Balance the Trade Unions in Kingdom of the Netherlands"
 AOEIW9_HOL_politics_p1_5_desc:0 "Neither abolishing Trade Unions nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Orange Compromise coalition."
 AOEIW9_HOL_politics_p1_6:0 "House of Orange and Nation"
 AOEIW9_HOL_politics_p1_6_desc:0 "House of Orange will be presented as part of the national political order rather than a factional institution. The Orange Compromise camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_HOL_politics_p2_2:0 "Publish the Cabinet Minutes"
 AOEIW9_HOL_politics_p2_2_desc:0 "The coalition will expose disputed colonial and defence decisions to parliamentary scrutiny."
 AOEIW9_HOL_politics_p2_3:0 "Guarantee the Pillar Organisations"
 AOEIW9_HOL_politics_p2_3_desc:0 "The position of Pillar Organisations will be protected by statute and political guarantees. That security is the price of bringing it firmly into the States-General Ascendant settlement."
 AOEIW9_HOL_politics_p2_4:0 "Broaden the Dutch Trade Unions"
 AOEIW9_HOL_politics_p2_4_desc:0 "Trade Unions will receive a wider role in consultation, administration and mobilisation. The States-General Ascendant project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_HOL_politics_p2_5:0 "Governors Report at the Binnenhof"
 AOEIW9_HOL_politics_p2_5_desc:0 "Overseas governors must explain budgets, policing and representation to ministers and deputies in The Hague."
 AOEIW9_HOL_politics_p2_6:0 "The Regulations of 1937"
 AOEIW9_HOL_politics_p2_6_desc:0 "New rules will widen local representation while defining the Crown’s reserved powers overseas."
 AOEIW9_HOL_politics_p3_2:0 "Mobilise the Pillar Organisations"
 AOEIW9_HOL_politics_p3_2_desc:0 "Pillar Organisations will become an organising arm of the National Renewal programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_HOL_politics_p3_3:0 "Break the Dutch Trade Unions"
 AOEIW9_HOL_politics_p3_3_desc:0 "The independent power of Trade Unions is incompatible with the National Renewal project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_HOL_politics_p3_4:0 "Recall the Colonial Governors"
 AOEIW9_HOL_politics_p3_4_desc:0 "Governors who resist The Hague will be recalled and replaced by men committed to central rule."
 AOEIW9_HOL_politics_p3_5:0 "Command the House of Orange"
 AOEIW9_HOL_politics_p3_5_desc:0 "House of Orange will answer directly to the authorities created by the National Renewal path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_HOL_politics_p3_6:0 "Order and Authority"
 AOEIW9_HOL_politics_p3_6_desc:0 "The new regime measures national renewal through obedience in parliament, colonies and streets."
 AOEIW9_HOL_politics_settlement:0 "Who Speaks for the Kingdom?"
 AOEIW9_HOL_politics_settlement_desc:0 "Crown, cabinet and overseas governments now know who may issue a binding decision."
 AOEIW9_HOL_eco_root:0 "The Rotterdam Port Review"
 AOEIW9_HOL_eco_root_desc:0 "Rotterdam Port, Philips Works and Limburg Mines do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of the Netherlands can expand fastest."
 AOEIW9_HOL_eco_civ_2:0 "Rails to Philips Works"
 AOEIW9_HOL_eco_civ_2_desc:0 "Rail connections serving Philips Works will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_HOL_eco_civ_5:0 "The Zuiderzee Works Expansion"
 AOEIW9_HOL_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Zuiderzee Works. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_HOL_eco_civ_6:0 "Renew Royal Dutch Shipping"
 AOEIW9_HOL_eco_civ_6_desc:0 "Royal Dutch Shipping will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_HOL_eco_civ_7:0 "A Second Shift at Rotterdam Port"
 AOEIW9_HOL_eco_civ_7_desc:0 "Rotterdam Port has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_HOL_eco_civ_8:0 "Public Works at Philips Works"
 AOEIW9_HOL_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Philips Works will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_HOL_eco_war_1:0 "The Amsterdam Finance Armaments Audit"
 AOEIW9_HOL_eco_war_1_desc:0 "An armaments audit will determine which parts of Amsterdam Finance can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_HOL_eco_war_2:0 "War Orders for Zuiderzee Works"
 AOEIW9_HOL_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Zuiderzee Works, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_HOL_eco_war_3:0 "Precision Tools for Royal Dutch Shipping"
 AOEIW9_HOL_eco_war_3_desc:0 "Precision machine tools will be prioritised for Royal Dutch Shipping, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_HOL_eco_war_4:0 "Expand Rotterdam Port for Rearmament"
 AOEIW9_HOL_eco_war_4_desc:0 "New military production capacity will be built around Rotterdam Port, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_HOL_eco_war_5:0 "Standardise Philips Works"
 AOEIW9_HOL_eco_war_5_desc:0 "Factories tied to Philips Works will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_HOL_eco_war_6:0 "Night Production at Limburg Mines"
 AOEIW9_HOL_eco_war_6_desc:0 "Night production will be organised at Limburg Mines with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_HOL_eco_war_7:0 "Long-Term Contracts for Amsterdam Finance"
 AOEIW9_HOL_eco_war_7_desc:0 "Long-term contracts will give Amsterdam Finance a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_HOL_eco_science_1:0 "Endow Delft Technical University"
 AOEIW9_HOL_eco_science_1_desc:0 "Stable public funding will give Delft Technical University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_HOL_eco_science_2:0 "New Laboratories at Philips Laboratories"
 AOEIW9_HOL_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Philips Laboratories. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_HOL_eco_science_3:0 "Applied Research at Royal Academy of Sciences"
 AOEIW9_HOL_eco_science_3_desc:0 "Royal Academy of Sciences will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_HOL_eco_science_4:0 "Industrial Physics at Delft Technical University"
 AOEIW9_HOL_eco_science_4_desc:0 "Industrial physics at Delft Technical University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_HOL_eco_science_5:0 "Production Science at Philips Laboratories"
 AOEIW9_HOL_eco_science_5_desc:0 "Researchers at Philips Laboratories will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_HOL_eco_science_6:0 "Research Grants for Royal Academy of Sciences"
 AOEIW9_HOL_eco_science_6_desc:0 "A national grant programme will connect Royal Academy of Sciences to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_HOL_eco_infra_2:0 "Freight Capacity at Amsterdam Finance"
 AOEIW9_HOL_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Amsterdam Finance will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_HOL_eco_infra_3:0 "Workers' Housing at Zuiderzee Works"
 AOEIW9_HOL_eco_infra_3_desc:0 "Worker housing near Zuiderzee Works will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_HOL_eco_infra_4:0 "Logistics through Royal Dutch Shipping"
 AOEIW9_HOL_eco_infra_4_desc:0 "Royal Dutch Shipping will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_HOL_eco_final:0 "The Dutch Commercial-Industrial System"
 AOEIW9_HOL_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a dutch economy able to convert regional strengths into sustained national output."
 AOEIW9_HOL_mil_root:0 "Review the Dutch General Staff"
 AOEIW9_HOL_mil_root_desc:0 "The Dutch General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_HOL_mil_army_2:0 "Waterline Command Field Manoeuvres"
 AOEIW9_HOL_mil_army_2_desc:0 "Large field exercises with the Waterline Command will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_HOL_mil_army_5:0 "Motorise the Royal Military Academy in Kingdom of the Netherlands"
 AOEIW9_HOL_mil_army_5_desc:0 "Motor transport assigned to the Royal Military Academy will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain. For the Netherlands, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_HOL_mil_army_6:0 "Staff Procedures at the Dutch General Staff"
 AOEIW9_HOL_mil_army_6_desc:0 "Staff officers at the Dutch General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_HOL_mil_army_7:0 "Armour Studies at the Waterline Command"
 AOEIW9_HOL_mil_army_7_desc:0 "The Waterline Command will study how armour can be integrated with infantry, artillery and logistics under dutch conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_HOL_mil_army_8:0 "Operational Planning at the Mobile Field Army"
 AOEIW9_HOL_mil_army_8_desc:0 "Operational planning with the Mobile Field Army will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_HOL_mil_army_9:0 "Dutch Doctrine at the Artillery Inspectorate"
 AOEIW9_HOL_mil_army_9_desc:0 "The doctrine taught by Artillery Inspectorate will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations. For the Netherlands, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_HOL_mil_air_1:0 "Reorganise Royal Netherlands Air Force"
 AOEIW9_HOL_mil_air_1_desc:0 "Royal Netherlands Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_HOL_mil_air_2:0 "Fighter Instruction at Soesterberg Air Base"
 AOEIW9_HOL_mil_air_2_desc:0 "Soesterberg Air Base will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_HOL_mil_air_3:0 "Ground Support Doctrine under Low Countries Air Command"
 AOEIW9_HOL_mil_air_3_desc:0 "Low Countries Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_HOL_mil_air_4:0 "Extend the Range of Royal Netherlands Air Force"
 AOEIW9_HOL_mil_air_4_desc:0 "Royal Netherlands Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of the Netherlands's geography and strategic commitments."
 AOEIW9_HOL_mil_air_5:0 "Radar Networks for Soesterberg Air Base"
 AOEIW9_HOL_mil_air_5_desc:0 "Soesterberg Air Base will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_HOL_mil_air_6:0 "Unify Command under Low Countries Air Command"
 AOEIW9_HOL_mil_air_6_desc:0 "Low Countries Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_HOL_mil_sea_1:0 "Review Royal Netherlands Navy"
 AOEIW9_HOL_mil_sea_1_desc:0 "A full review of Royal Netherlands Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_HOL_mil_sea_2:0 "Expand Den Helder Dockyard"
 AOEIW9_HOL_mil_sea_2_desc:0 "Den Helder Dockyard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_HOL_mil_sea_3:0 "Fleet Manoeuvres with East Indies Fleet"
 AOEIW9_HOL_mil_sea_3_desc:0 "Fleet exercises with East Indies Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_HOL_mil_sea_4:0 "Screening Doctrine for Royal Netherlands Navy"
 AOEIW9_HOL_mil_sea_4_desc:0 "Royal Netherlands Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_HOL_mil_sea_5:0 "Naval Aviation at Den Helder Dockyard"
 AOEIW9_HOL_mil_sea_5_desc:0 "Naval aviation will be integrated with Den Helder Dockyard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_HOL_mil_sea_6:0 "New Hulls for East Indies Fleet"
 AOEIW9_HOL_mil_sea_6_desc:0 "New hull standards for East Indies Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_HOL_mil_final:0 "Flexible Defense"
 AOEIW9_HOL_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of the Netherlands now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_HOL_dip_root:0 "Define the Orange Maritime Doctrine"
 AOEIW9_HOL_dip_root_desc:0 "The Kingdom of the Netherlands must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_HOL_dip_a_2:0 "Send a Mission on the Belgian Frontier"
 AOEIW9_HOL_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Belgian Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_HOL_dip_a_3:0 "Economic Leverage over the Belgian Frontier"
 AOEIW9_HOL_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Belgian Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_HOL_dip_a_4:0 "Staff Talks on the Belgian Frontier"
 AOEIW9_HOL_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Belgian Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_HOL_dip_a_5:0 "A Formal Warning over the Belgian Frontier"
 AOEIW9_HOL_dip_a_5_desc:0 "A formal warning over the Belgian Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_HOL_dip_a_6:0 "Terms for the Belgian Frontier"
 AOEIW9_HOL_dip_a_6_desc:0 "Terms for an ultimatum on the Belgian Frontier will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_HOL_dip_b_1:0 "Rotterdam and the Reichspakt"
 AOEIW9_HOL_dip_b_1_desc:0 "Rotterdam's trade links make the Netherlands economically central to the Reichspakt, but cooperation must not become political absorption."
 AOEIW9_HOL_dip_b_2:0 "The Berlin Trade Mission"
 AOEIW9_HOL_dip_b_2_desc:0 "A Dutch commercial delegation will negotiate predictable access to the German market while defending national control over trade policy."
 AOEIW9_HOL_dip_b_3:0 "Rhine Commercial Protocols"
 AOEIW9_HOL_dip_b_3_desc:0 "Rhine shipping, customs schedules and industrial deliveries will be placed under a stable bilateral framework."
 AOEIW9_HOL_dip_b_4:0 "Continental Transit Planning"
 AOEIW9_HOL_dip_b_4_desc:0 "Rail, river and port planning will turn Dutch transit capacity into a strategic asset for the continental bloc."
 AOEIW9_HOL_dip_b_5:0 "Safeguard Dutch Autonomy"
 AOEIW9_HOL_dip_b_5_desc:0 "Participation in German-led planning will be balanced by explicit safeguards for Dutch institutions and colonial interests."
 AOEIW9_HOL_dip_b_6:0 "A Dutch Pillar of the Reichspakt"
 AOEIW9_HOL_dip_b_6_desc:0 "The Netherlands will act as the Reichspakt's maritime-commercial pillar without surrendering its separate national strategy."
 AOEIW9_HOL_dip_final:0 "The Netherlands in the Reichspakt"
 AOEIW9_HOL_dip_final_desc:0 "The Kingdom of the Netherlands's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_IRE_focus_tree:0 "Ireland Focus Tree"
 AOEIW9_IRE_politics_p1_2:0 "Reconcile the Executive Council"
 AOEIW9_IRE_politics_p1_2_desc:0 "Executive Council has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Dáil Consensus programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_IRE_politics_p1_3:0 "Reform the County Councils"
 AOEIW9_IRE_politics_p1_3_desc:0 "County Councils still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Dáil Consensus settlement."
 AOEIW9_IRE_politics_p1_4:0 "Bind the Republican Veterans"
 AOEIW9_IRE_politics_p1_4_desc:0 "Republican Veterans will be tied to the Dáil Consensus programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_IRE_politics_p1_5:0 "Dáil Éireann and Nation"
 AOEIW9_IRE_politics_p1_5_desc:0 "Dáil Éireann will be presented as part of the national political order rather than a factional institution. The Dáil Consensus camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_IRE_politics_p2_2:0 "Open the County Councils"
 AOEIW9_IRE_politics_p2_2_desc:0 "Access to County Councils will be widened and its procedures made less dependent on closed patronage. The reform gives the Presidential Authority camp a legal route to broaden its support without bypassing the state."
 AOEIW9_IRE_politics_p2_3:0 "Guarantee the Republican Veterans"
 AOEIW9_IRE_politics_p2_3_desc:0 "The position of Republican Veterans will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Presidential Authority settlement."
 AOEIW9_IRE_politics_p2_4:0 "Broaden the Irish Trade Unions"
 AOEIW9_IRE_politics_p2_4_desc:0 "Trade Unions will receive a wider role in consultation, administration and mobilisation. The Presidential Authority project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_IRE_politics_p2_5:0 "A New Charter for Ireland"
 AOEIW9_IRE_politics_p2_5_desc:0 "A new constitutional charter will turn the Presidential Authority programme into a durable framework for Ireland. The document defines authority, representation and the limits of emergency power."
 AOEIW9_IRE_politics_p3_2:0 "Mobilise the Republican Veterans"
 AOEIW9_IRE_politics_p3_2_desc:0 "Republican Veterans will become an organising arm of the Republican Vanguard programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_IRE_politics_p3_3:0 "Break the Irish Trade Unions"
 AOEIW9_IRE_politics_p3_3_desc:0 "The independent power of Trade Unions is incompatible with the Republican Vanguard project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_IRE_politics_p3_4:0 "Replace the Church Hierarchy"
 AOEIW9_IRE_politics_p3_4_desc:0 "Church Hierarchy will be removed from its gatekeeping role and replaced with officials loyal to the Republican Vanguard settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_IRE_politics_p3_5:0 "The Republican Vanguard Settlement"
 AOEIW9_IRE_politics_p3_5_desc:0 "The political struggle around The Republican Vanguard reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Republican Vanguard order."
 AOEIW9_IRE_politics_settlement:0 "The Dublin Settlement"
 AOEIW9_IRE_politics_settlement_desc:0 "The chosen settlement gives Dáil Éireann, Executive Council and County Councils a defined chain of authority instead of overlapping vetoes. Ireland can now govern through institutions that match the political order selected by the player."
 AOEIW9_IRE_eco_root:0 "The Dublin Industry Review"
 AOEIW9_IRE_eco_root_desc:0 "Dublin Industry, Shannon Scheme and Cork Harbour do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Ireland can expand fastest."
 AOEIW9_IRE_eco_civ_2:0 "Rails to Shannon Scheme"
 AOEIW9_IRE_eco_civ_2_desc:0 "Rail connections serving Shannon Scheme will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_IRE_eco_civ_5:0 "The Irish Railways Expansion"
 AOEIW9_IRE_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Irish Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_IRE_eco_civ_6:0 "Renew Limerick Workshops"
 AOEIW9_IRE_eco_civ_6_desc:0 "Limerick Workshops will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_IRE_eco_civ_7:0 "A Second Shift at Dublin Industry"
 AOEIW9_IRE_eco_civ_7_desc:0 "Dublin Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_IRE_eco_civ_8:0 "Public Works at Shannon Scheme"
 AOEIW9_IRE_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Shannon Scheme will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_IRE_eco_civ_9:0 "The Cork Harbour Development Board"
 AOEIW9_IRE_eco_civ_9_desc:0 "A permanent development board will coordinate credit, utilities, transport and building permits around Cork Harbour. Local projects become part of a national investment sequence rather than isolated initiatives."
 AOEIW9_IRE_eco_war_1:0 "The Agricultural Credit Board Armaments Audit"
 AOEIW9_IRE_eco_war_1_desc:0 "An armaments audit will determine which parts of Agricultural Credit Board can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_IRE_eco_war_2:0 "War Orders for Irish Railways"
 AOEIW9_IRE_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Irish Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_IRE_eco_war_3:0 "Precision Tools for Limerick Workshops"
 AOEIW9_IRE_eco_war_3_desc:0 "Precision machine tools will be prioritised for Limerick Workshops, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_IRE_eco_war_4:0 "Expand Dublin Industry for Rearmament"
 AOEIW9_IRE_eco_war_4_desc:0 "New military production capacity will be built around Dublin Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_IRE_eco_war_5:0 "Standardise Shannon Scheme"
 AOEIW9_IRE_eco_war_5_desc:0 "Factories tied to Shannon Scheme will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_IRE_eco_war_6:0 "Night Production at Cork Harbour"
 AOEIW9_IRE_eco_war_6_desc:0 "Night production will be organised at Cork Harbour with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_IRE_eco_science_1:0 "Endow University College Dublin"
 AOEIW9_IRE_eco_science_1_desc:0 "Stable public funding will give University College Dublin laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_IRE_eco_science_2:0 "New Laboratories at Dublin Institute of Technology"
 AOEIW9_IRE_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Dublin Institute of Technology. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_IRE_eco_science_3:0 "Applied Research at Irish Research Council"
 AOEIW9_IRE_eco_science_3_desc:0 "Irish Research Council will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_IRE_eco_science_4:0 "Industrial Physics at University College Dublin"
 AOEIW9_IRE_eco_science_4_desc:0 "Industrial physics at University College Dublin will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_IRE_eco_science_5:0 "Production Science at Dublin Institute of Technology"
 AOEIW9_IRE_eco_science_5_desc:0 "Researchers at Dublin Institute of Technology will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_IRE_eco_infra_2:0 "Freight Capacity at Agricultural Credit Board"
 AOEIW9_IRE_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Agricultural Credit Board will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_IRE_eco_infra_3:0 "Workers' Housing at Irish Railways"
 AOEIW9_IRE_eco_infra_3_desc:0 "Worker housing near Irish Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_IRE_eco_infra_4:0 "Logistics through Limerick Workshops"
 AOEIW9_IRE_eco_infra_4_desc:0 "Limerick Workshops will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_IRE_eco_final:0 "An Irish Productive State"
 AOEIW9_IRE_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a irish economy able to convert regional strengths into sustained national output."
 AOEIW9_IRE_mil_root:0 "Review the Irish General Staff"
 AOEIW9_IRE_mil_root_desc:0 "The Irish General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_IRE_mil_army_2:0 "Defence Forces Field Manoeuvres"
 AOEIW9_IRE_mil_army_2_desc:0 "Large field exercises with the Defence Forces will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_IRE_mil_army_5:0 "Motorise the Curragh Command"
 AOEIW9_IRE_mil_army_5_desc:0 "Motor transport assigned to the Curragh Command will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_IRE_mil_army_6:0 "Staff Procedures at the Irish General Staff"
 AOEIW9_IRE_mil_army_6_desc:0 "Staff officers at the Irish General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_IRE_mil_army_7:0 "Armour Studies at the Defence Forces"
 AOEIW9_IRE_mil_army_7_desc:0 "The Defence Forces will study how armour can be integrated with infantry, artillery and logistics under irish conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_IRE_mil_air_1:0 "Reorganise Irish Air Corps"
 AOEIW9_IRE_mil_air_1_desc:0 "Irish Air Corps will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_IRE_mil_air_2:0 "Fighter Instruction at Baldonnel Aerodrome"
 AOEIW9_IRE_mil_air_2_desc:0 "Baldonnel Aerodrome will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_IRE_mil_air_3:0 "Ground Support Doctrine under Coastal Air Patrol"
 AOEIW9_IRE_mil_air_3_desc:0 "Coastal Air Patrol will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_IRE_mil_air_4:0 "Extend the Range of Irish Air Corps"
 AOEIW9_IRE_mil_air_4_desc:0 "Irish Air Corps will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Ireland's geography and strategic commitments."
 AOEIW9_IRE_mil_air_5:0 "Radar Networks for Baldonnel Aerodrome"
 AOEIW9_IRE_mil_air_5_desc:0 "Baldonnel Aerodrome will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_IRE_mil_sea_1:0 "Review Coastal Service"
 AOEIW9_IRE_mil_sea_1_desc:0 "A full review of Coastal Service will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_IRE_mil_sea_2:0 "Expand Cork Naval Station"
 AOEIW9_IRE_mil_sea_2_desc:0 "Cork Naval Station will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_IRE_mil_sea_3:0 "Fleet Manoeuvres with Atlantic Patrol"
 AOEIW9_IRE_mil_sea_3_desc:0 "Fleet exercises with Atlantic Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_IRE_mil_sea_4:0 "Screening Doctrine for Coastal Service"
 AOEIW9_IRE_mil_sea_4_desc:0 "Coastal Service will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_IRE_mil_sea_5:0 "Naval Aviation at Cork Naval Station"
 AOEIW9_IRE_mil_sea_5_desc:0 "Naval aviation will be integrated with Cork Naval Station for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_IRE_mil_final:0 "Territorial Defense"
 AOEIW9_IRE_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Ireland now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_IRE_dip_root:0 "Define the Emerald Doctrine"
 AOEIW9_IRE_dip_root_desc:0 "Ireland must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_IRE_dip_a_2:0 "Send a Mission on the British Relationship"
 AOEIW9_IRE_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the British Relationship. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_IRE_dip_a_3:0 "Economic Leverage over the British Relationship"
 AOEIW9_IRE_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the British Relationship. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_IRE_dip_a_4:0 "Staff Talks on the British Relationship"
 AOEIW9_IRE_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the British Relationship. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_IRE_dip_a_5:0 "A Formal Warning over the British Relationship"
 AOEIW9_IRE_dip_a_5_desc:0 "A formal warning over the British Relationship will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_IRE_dip_b_1:0 "Atlantic Neutrality"
 AOEIW9_IRE_dip_b_1_desc:0 "Atlantic Neutrality will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Ireland actually wants before pressure is applied."
 AOEIW9_IRE_dip_b_2:0 "Send a Mission on Atlantic Neutrality"
 AOEIW9_IRE_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Atlantic Neutrality. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_IRE_dip_b_3:0 "Economic Leverage over Atlantic Neutrality"
 AOEIW9_IRE_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Atlantic Neutrality. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_IRE_dip_b_4:0 "Staff Talks on Atlantic Neutrality"
 AOEIW9_IRE_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Atlantic Neutrality. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_IRE_dip_b_5:0 "A Formal Warning over Atlantic Neutrality"
 AOEIW9_IRE_dip_b_5_desc:0 "A formal warning over Atlantic Neutrality will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_IRE_dip_final:0 "Ireland and the Atlantic Balance"
 AOEIW9_IRE_dip_final_desc:0 "Ireland's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_ITA_focus_tree:0 "Kingdom of Italy Focus Tree"
 AOEIW9_ITA_politics_root:0 "The Savoy Crown and the Mass State"
 AOEIW9_ITA_politics_root_desc:0 "Power in the Kingdom of Italy is divided among House of Savoy, Chamber of Deputies and Grand Council. The question is no longer ceremonial: whichever side prevails will shape the budget, the officer corps and the state's ability to act."
 AOEIW9_ITA_politics_p1_1:0 "The Royal Government"
 AOEIW9_ITA_politics_p1_1_desc:0 "Royal Government is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Kingdom of Italy."
 AOEIW9_ITA_politics_p1_2:0 "Reconcile the Chamber of Deputies"
 AOEIW9_ITA_politics_p1_2_desc:0 "Chamber of Deputies has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Royal Government programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_ITA_politics_p1_3:0 "Reform the Grand Council"
 AOEIW9_ITA_politics_p1_3_desc:0 "Grand Council still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Royal Government settlement."
 AOEIW9_ITA_politics_p1_4:0 "Bind the Industrial Confederation"
 AOEIW9_ITA_politics_p1_4_desc:0 "Industrial Confederation will be tied to the Royal Government programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_ITA_politics_p1_5:0 "Balance the Trade Unions in Kingdom of Italy"
 AOEIW9_ITA_politics_p1_5_desc:0 "Neither abolishing Trade Unions nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Royal Government coalition."
 AOEIW9_ITA_politics_p1_6:0 "Codify the Prefectures"
 AOEIW9_ITA_politics_p1_6_desc:0 "Custom and emergency practice around Prefectures will be replaced with written rules. Codification fixes its place in the Royal Government order and limits future constitutional improvisation."
 AOEIW9_ITA_politics_p1_7:0 "House of Savoy and Nation"
 AOEIW9_ITA_politics_p1_7_desc:0 "House of Savoy will be presented as part of the national political order rather than a factional institution. The Royal Government camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_ITA_politics_p2_1:0 "Corporate Authoritarianism"
 AOEIW9_ITA_politics_p2_1_desc:0 "Corporate Authoritarianism is more than a slogan: its supporters intend to control the machinery of government, not merely shift public opinion. Committing to this course begins the institutional struggle over the future of the Kingdom of Italy."
 AOEIW9_ITA_politics_p2_2:0 "Open the Grand Council"
 AOEIW9_ITA_politics_p2_2_desc:0 "Access to Grand Council will be widened and its procedures made less dependent on closed patronage. The reform gives the Corporate Authoritarianism camp a legal route to broaden its support without bypassing the state."
 AOEIW9_ITA_politics_p2_3:0 "Guarantee the Industrial Confederation"
 AOEIW9_ITA_politics_p2_3_desc:0 "The position of Industrial Confederation will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Corporate Authoritarianism settlement."
 AOEIW9_ITA_politics_p2_4:0 "Broaden the Italian Trade Unions"
 AOEIW9_ITA_politics_p2_4_desc:0 "Trade Unions will receive a wider role in consultation, administration and mobilisation. The Corporate Authoritarianism project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_ITA_politics_p2_5:0 "Entrust the Prefectures"
 AOEIW9_ITA_politics_p2_5_desc:0 "Responsibility now shifts toward Prefectures, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Corporate Authoritarianism system can govern through delegated institutions."
 AOEIW9_ITA_politics_p2_6:0 "Ratify the House of Savoy"
 AOEIW9_ITA_politics_p2_6_desc:0 "A formal act of ratification will settle the place of House of Savoy inside the new political order. Once accepted, the Corporate Authoritarianism arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_ITA_politics_p2_7:0 "Rewrite the Carta del Lavoro"
 AOEIW9_ITA_politics_p2_7_desc:0 "The regime will turn the Carta del Lavoro from proclamation into rules for wages, arbitration and industrial command. Corporations must now function outside the parade hall."
 AOEIW9_ITA_politics_settlement:0 "The Savoy State Consolidated"
 AOEIW9_ITA_politics_settlement_desc:0 "The chosen settlement gives House of Savoy, Chamber of Deputies and Grand Council a defined chain of authority instead of overlapping vetoes. the Kingdom of Italy can now govern through institutions that match the political order selected by the player."
 AOEIW9_ITA_eco_root:0 "The Po Valley Industry Review"
 AOEIW9_ITA_eco_root_desc:0 "Po Valley Industry, FIAT Works and Ansaldo Shipyards do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Italy can expand fastest."
 AOEIW9_ITA_eco_civ_1:0 "Survey the Po Valley Industry"
 AOEIW9_ITA_eco_civ_1_desc:0 "A detailed survey of Po Valley Industry will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_ITA_eco_civ_2:0 "Rails to FIAT Works"
 AOEIW9_ITA_eco_civ_2_desc:0 "Rail connections serving FIAT Works will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_ITA_eco_civ_3:0 "Capital for Ansaldo Shipyards"
 AOEIW9_ITA_eco_civ_3_desc:0 "State-backed credit will give Ansaldo Shipyards access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_ITA_eco_civ_4:0 "Power for ILVA Steel"
 AOEIW9_ITA_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward ILVA Steel. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_ITA_eco_civ_5:0 "Extend the Autostrada dei Laghi"
 AOEIW9_ITA_eco_civ_5_desc:0 "The pioneering road from Milan will be extended toward industrial towns and Alpine approaches. Motor traffic will test whether Italy's celebrated autostrade form a network or a collection of showpieces."
 AOEIW9_ITA_eco_civ_6:0 "Renew IRI Holdings"
 AOEIW9_ITA_eco_civ_6_desc:0 "IRI Holdings will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_ITA_eco_civ_7:0 "A Second Shift at Po Valley Industry"
 AOEIW9_ITA_eco_civ_7_desc:0 "Po Valley Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_ITA_eco_war_1:0 "The ILVA Steel Armaments Audit"
 AOEIW9_ITA_eco_war_1_desc:0 "An armaments audit will determine which parts of ILVA Steel can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_ITA_eco_war_2:0 "Military Traffic on the Autostrade"
 AOEIW9_ITA_eco_war_2_desc:0 "Engineers will survey bridges, gradients and fuel stops for columns moving from the Po Valley. The roads must carry an army as well as touring cars."
 AOEIW9_ITA_eco_war_3:0 "Precision Tools for IRI Holdings"
 AOEIW9_ITA_eco_war_3_desc:0 "Precision machine tools will be prioritised for IRI Holdings, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_ITA_eco_war_4:0 "Expand Po Valley Industry for Rearmament"
 AOEIW9_ITA_eco_war_4_desc:0 "New military production capacity will be built around Po Valley Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_ITA_eco_war_5:0 "Standardise FIAT Works"
 AOEIW9_ITA_eco_war_5_desc:0 "Factories tied to FIAT Works will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_ITA_eco_war_6:0 "Night Production at Ansaldo Shipyards"
 AOEIW9_ITA_eco_war_6_desc:0 "Night production will be organised at Ansaldo Shipyards with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_ITA_eco_war_7:0 "Long-Term Contracts for ILVA Steel"
 AOEIW9_ITA_eco_war_7_desc:0 "Long-term contracts will give ILVA Steel a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_ITA_eco_war_8:0 "March the Army down the Autostrade"
 AOEIW9_ITA_eco_war_8_desc:0 "Priority lanes, recovery posts and military police will keep mobilisation columns moving south and east. The road system becomes part of the operational plan."
 AOEIW9_ITA_eco_science_1:0 "Endow Politecnico di Milano"
 AOEIW9_ITA_eco_science_1_desc:0 "Stable public funding will give Politecnico di Milano laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_ITA_eco_science_2:0 "New Laboratories at Royal Academy of Italy"
 AOEIW9_ITA_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Royal Academy of Italy. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_ITA_eco_science_3:0 "Marconi and the CNR"
 AOEIW9_ITA_eco_science_3_desc:0 "Guglielmo Marconi will use the National Research Council to connect radio experiments with naval, air and industrial requirements. Prestige must produce instruments that work in the field."
 AOEIW9_ITA_eco_science_4:0 "Industrial Physics at Politecnico di Milano"
 AOEIW9_ITA_eco_science_4_desc:0 "Industrial physics at Politecnico di Milano will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_ITA_eco_science_5:0 "Production Science at Royal Academy of Italy"
 AOEIW9_ITA_eco_science_5_desc:0 "Researchers at Royal Academy of Italy will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_ITA_eco_science_6:0 "Fund the CNR Laboratories"
 AOEIW9_ITA_eco_science_6_desc:0 "Longer grants will keep physicists, chemists and engineers at their benches through failed trials. The council will judge work by results that Italian industry can reproduce."
 AOEIW9_ITA_eco_science_7:0 "Link Politecnico di Milano to the Factories"
 AOEIW9_ITA_eco_science_7_desc:0 "Politecnico di Milano will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_ITA_eco_infra_1:0 "Energy for Ansaldo Shipyards"
 AOEIW9_ITA_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Ansaldo Shipyards, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_ITA_eco_infra_2:0 "Freight Capacity at ILVA Steel"
 AOEIW9_ITA_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving ILVA Steel will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_ITA_eco_infra_3:0 "Case Popolari beside the Motorways"
 AOEIW9_ITA_eco_infra_3_desc:0 "Workers building roads and industrial suburbs need affordable homes near the new routes. Municipal housing will grow beside the celebrated concrete."
 AOEIW9_ITA_eco_infra_4:0 "Logistics through IRI Holdings"
 AOEIW9_ITA_eco_infra_4_desc:0 "IRI Holdings will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_ITA_eco_final:0 "The IRI Industrial System"
 AOEIW9_ITA_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a italian economy able to convert regional strengths into sustained national output."
 AOEIW9_ITA_mil_root:0 "Review the Comando Supremo"
 AOEIW9_ITA_mil_root_desc:0 "The Comando Supremo must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_ITA_mil_army_1:0 "The Grandi Manovre"
 AOEIW9_ITA_mil_army_1_desc:0 "Large manoeuvres will expose divisions that exist on paper, radios that fail and supply columns that arrive late. Comando Supremo will learn from the field before writing another doctrine circular."
 AOEIW9_ITA_mil_army_2:0 "Fanteria and Mountain Firepower"
 AOEIW9_ITA_mil_army_2_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_ITA_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_ITA_mil_army_3_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_ITA_mil_army_4_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_5:0 "The Divisions Celere"
 AOEIW9_ITA_mil_army_5_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_ITA_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_ITA_mil_army_6_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_ITA_mil_army_7_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_8:0 "One Supply Service"
 AOEIW9_ITA_mil_army_8_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_ITA_mil_army_9_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_ITA_mil_army_10_desc:0 "Italy needs either infantry trained for broken terrain or mobile formations supported by dependable Mediterranean depots. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_ITA_mil_air_1:0 "Reorganise Regia Aeronautica"
 AOEIW9_ITA_mil_air_1_desc:0 "Regia Aeronautica will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_ITA_mil_air_2:0 "Fighter Instruction at Fighter Schools"
 AOEIW9_ITA_mil_air_2_desc:0 "Fighter Schools will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_ITA_mil_air_3:0 "Italian Ground Support Doctrine under Strategic Air Command"
 AOEIW9_ITA_mil_air_3_desc:0 "Strategic Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Italy, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_ITA_mil_air_4:0 "Extend the Range of Regia Aeronautica"
 AOEIW9_ITA_mil_air_4_desc:0 "Regia Aeronautica will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Italy's geography and strategic commitments."
 AOEIW9_ITA_mil_air_5:0 "Radar Networks for Fighter Schools"
 AOEIW9_ITA_mil_air_5_desc:0 "Fighter Schools will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_ITA_mil_air_6:0 "Unify Italian Air Command under Strategic Air Command"
 AOEIW9_ITA_mil_air_6_desc:0 "Strategic Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels. For Italy, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_ITA_mil_air_7:0 "Regia Aeronautica Comes of Age"
 AOEIW9_ITA_mil_air_7_desc:0 "Regia Aeronautica now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_ITA_mil_sea_1:0 "Review Regia Marina"
 AOEIW9_ITA_mil_sea_1_desc:0 "A full review of Regia Marina will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_ITA_mil_sea_2:0 "Expand La Spezia Arsenal"
 AOEIW9_ITA_mil_sea_2_desc:0 "La Spezia Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_ITA_mil_sea_3:0 "Fleet Manoeuvres with Mediterranean Battlefleet"
 AOEIW9_ITA_mil_sea_3_desc:0 "Fleet exercises with Mediterranean Battlefleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_ITA_mil_sea_4:0 "Screening Doctrine for Regia Marina"
 AOEIW9_ITA_mil_sea_4_desc:0 "Regia Marina will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_ITA_mil_sea_5:0 "Naval Aviation at La Spezia Arsenal"
 AOEIW9_ITA_mil_sea_5_desc:0 "Naval aviation will be integrated with La Spezia Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_ITA_mil_sea_6:0 "New Hulls for Mediterranean Battlefleet"
 AOEIW9_ITA_mil_sea_6_desc:0 "New hull standards for Mediterranean Battlefleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_ITA_mil_sea_7:0 "Sea Command under Regia Marina"
 AOEIW9_ITA_mil_sea_7_desc:0 "Regia Marina will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Kingdom of Italy. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_ITA_mil_final:0 "Mobile Warfare"
 AOEIW9_ITA_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Italy now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_ITA_dip_root:0 "Define the Roman Mediterranean Doctrine"
 AOEIW9_ITA_dip_root_desc:0 "The Kingdom of Italy must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_ITA_dip_a_1:0 "The Alpine Rivalry"
 AOEIW9_ITA_dip_a_1_desc:0 "The Alpine Rivalry will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Italy actually wants before pressure is applied."
 AOEIW9_ITA_dip_a_2:0 "Send a Mission on the Alpine Rivalry"
 AOEIW9_ITA_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Alpine Rivalry. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ITA_dip_a_3:0 "Economic Leverage over the Alpine Rivalry"
 AOEIW9_ITA_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Alpine Rivalry. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_ITA_dip_a_4:0 "Staff Talks on the Alpine Rivalry"
 AOEIW9_ITA_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Alpine Rivalry. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_ITA_dip_a_5:0 "A Formal Warning over the Alpine Rivalry"
 AOEIW9_ITA_dip_a_5_desc:0 "A formal warning over the Alpine Rivalry will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ITA_dip_a_6:0 "Terms for the Alpine Rivalry"
 AOEIW9_ITA_dip_a_6_desc:0 "Terms for an ultimatum on the Alpine Rivalry will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_ITA_dip_a_7:0 "The Decision on the Alpine Rivalry"
 AOEIW9_ITA_dip_a_7_desc:0 "The government reaches the decision point on the Alpine Rivalry. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_ITA_dip_b_1:0 "Mare Nostrum"
 AOEIW9_ITA_dip_b_1_desc:0 "Mare Nostrum will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Kingdom of Italy actually wants before pressure is applied."
 AOEIW9_ITA_dip_b_2:0 "Send a Mission on Mare Nostrum"
 AOEIW9_ITA_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Mare Nostrum. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_ITA_dip_b_3:0 "Economic Leverage over Mare Nostrum"
 AOEIW9_ITA_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Mare Nostrum. Economic pressure is calibrated to force negotiation without committing the army prematurely."
