 AOEIW9_AUS_focus_tree:0 "Austria-Hungary Focus Tree"
 AOEIW9_AUS_politics_p1_2:0 "Reconcile the Reichsrat"
 AOEIW9_AUS_politics_p1_2_desc:0 "Reichsrat has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Federation of Crowns programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_AUS_politics_p1_3:0 "Reform the Crown Lands"
 AOEIW9_AUS_politics_p1_3_desc:0 "Crown Lands still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Federation of Crowns settlement."
 AOEIW9_AUS_politics_p1_4:0 "Bind the Vienna Court"
 AOEIW9_AUS_politics_p1_4_desc:0 "Vienna Court will be tied to the Federation of Crowns programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_AUS_politics_p1_5:0 "Balance the Danubian Ministries"
 AOEIW9_AUS_politics_p1_5_desc:0 "Neither abolishing Danubian Ministries nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Federation of Crowns coalition."
 AOEIW9_AUS_politics_p1_6:0 "The Reichsrat Faces the Crownlands"
 AOEIW9_AUS_politics_p1_6_desc:0 "Imperial deputies will hear crownland petitions on language, taxation and military service in public session. Unity must survive the record of debate."
 AOEIW9_AUS_politics_p2_2:0 "Open the Crown Lands"
 AOEIW9_AUS_politics_p2_2_desc:0 "Access to Crown Lands will be widened and its procedures made less dependent on closed patronage. The reform gives the Authority from Vienna camp a legal route to broaden its support without bypassing the state."
 AOEIW9_AUS_politics_p2_3:0 "Guarantee the Vienna Court"
 AOEIW9_AUS_politics_p2_3_desc:0 "The position of Vienna Court will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Authority from Vienna settlement."
 AOEIW9_AUS_politics_p2_4:0 "Broaden the Danubian Ministries"
 AOEIW9_AUS_politics_p2_4_desc:0 "Danubian Ministries will receive a wider role in consultation, administration and mobilisation. The Authority from Vienna project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_AUS_politics_p2_5:0 "Entrust the Provincial Diets"
 AOEIW9_AUS_politics_p2_5_desc:0 "Responsibility now shifts toward Provincial Diets, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Authority from Vienna system can govern through delegated institutions."
 AOEIW9_AUS_politics_p2_6:0 "A Basic Law for the Danube"
 AOEIW9_AUS_politics_p2_6_desc:0 "The Reichsrat will define common powers and crownland guarantees in a new Staatsgrundgesetz. Neither Budapest nor Vienna may alter the bargain alone."
 AOEIW9_AUS_politics_p3_2:0 "Mobilise the Vienna Court"
 AOEIW9_AUS_politics_p3_2_desc:0 "Vienna Court will become an organising arm of the German National Question programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_AUS_politics_p3_3:0 "Break the Danubian Ministries"
 AOEIW9_AUS_politics_p3_3_desc:0 "The independent power of Danubian Ministries is incompatible with the German National Question project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_AUS_politics_p3_4:0 "Replace the Provincial Diets"
 AOEIW9_AUS_politics_p3_4_desc:0 "Provincial Diets will be removed from its gatekeeping role and replaced with officials loyal to the German National Question settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_AUS_politics_p3_5:0 "Close the Reichsrat"
 AOEIW9_AUS_politics_p3_5_desc:0 "Guards will seal the chamber and ministries will govern by decree from the Hofburg. The regime now owns every grievance parliament once absorbed."
 AOEIW9_AUS_politics_p3_6:0 "Vienna Rejects Anschluss"
 AOEIW9_AUS_politics_p3_6_desc:0 "German nationalists are told that the Danubian Crown will not dissolve itself into Berlin’s Reich. Police, schools and garrisons will enforce an Austrian answer."
 AOEIW9_AUS_politics_settlement:0 "An Empire of Crownlands"
 AOEIW9_AUS_politics_settlement_desc:0 "The Crown, Reichsrat and provincial governments now know which taxes, appointments and military duties belong to each. The Danubian state can govern through its diversity."
 AOEIW9_AUS_eco_root:0 "The Vienna Workshops Review"
 AOEIW9_AUS_eco_root_desc:0 "Vienna Workshops, Danube Corridor and Alpine Hydro Works do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Austria-Hungary can expand fastest."
 AOEIW9_AUS_eco_civ_2:0 "Rails to Danube Corridor"
 AOEIW9_AUS_eco_civ_2_desc:0 "Rail connections serving Danube Corridor will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_AUS_eco_civ_5:0 "The Trieste Commerce Expansion"
 AOEIW9_AUS_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Trieste Commerce. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_AUS_eco_civ_6:0 "Timetables from Vienna to Lemberg"
 AOEIW9_AUS_eco_civ_6_desc:0 "The imperial railways will coordinate passenger and freight paths across crownland boundaries. Coal and machinery must reach Lemberg without being stranded by rival administrations."
 AOEIW9_AUS_eco_civ_7:0 "A Second Shift at Vienna Workshops"
 AOEIW9_AUS_eco_civ_7_desc:0 "Vienna Workshops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_AUS_eco_civ_8:0 "Public Works at Danube Corridor"
 AOEIW9_AUS_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Danube Corridor will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_AUS_eco_war_1:0 "The Bohemian Foundries Armaments Audit"
 AOEIW9_AUS_eco_war_1_desc:0 "An armaments audit will determine which parts of Bohemian Foundries can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_AUS_eco_war_2:0 "War Orders for Trieste Commerce"
 AOEIW9_AUS_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Trieste Commerce, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_AUS_eco_war_3:0 "Machine Tools along the Südbahn"
 AOEIW9_AUS_eco_war_3_desc:0 "Rail workshops from Vienna toward Trieste will receive common lathes, gauges and spare parts. The southern line must repair its own rolling stock during mobilisation."
 AOEIW9_AUS_eco_war_4:0 "Expand Vienna Workshops for Rearmament"
 AOEIW9_AUS_eco_war_4_desc:0 "New military production capacity will be built around Vienna Workshops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_AUS_eco_war_5:0 "Standardise Danube Corridor"
 AOEIW9_AUS_eco_war_5_desc:0 "Factories tied to Danube Corridor will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_AUS_eco_war_6:0 "Night Production at Alpine Hydro Works"
 AOEIW9_AUS_eco_war_6_desc:0 "Night production will be organised at Alpine Hydro Works with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_AUS_eco_war_7:0 "Long-Term Contracts for Bohemian Foundries"
 AOEIW9_AUS_eco_war_7_desc:0 "Long-term contracts will give Bohemian Foundries a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_AUS_eco_science_1:0 "Endow Vienna Technical College"
 AOEIW9_AUS_eco_science_1_desc:0 "Stable public funding will give Vienna Technical College laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_AUS_eco_science_2:0 "New Laboratories at Imperial Academy of Sciences"
 AOEIW9_AUS_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Imperial Academy of Sciences. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_AUS_eco_science_3:0 "The Vienna Academy Opens Its Laboratories"
 AOEIW9_AUS_eco_science_3_desc:0 "The Academy will share instruments and researchers with railway, electrical and armament works. Imperial science must solve problems that cross crownland borders."
 AOEIW9_AUS_eco_science_4:0 "Industrial Physics at Vienna Technical College"
 AOEIW9_AUS_eco_science_4_desc:0 "Industrial physics at Vienna Technical College will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_AUS_eco_science_5:0 "Production Science at Imperial Academy of Sciences"
 AOEIW9_AUS_eco_science_5_desc:0 "Researchers at Imperial Academy of Sciences will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_AUS_eco_science_6:0 "Grants from the Ringstraße"
 AOEIW9_AUS_eco_science_6_desc:0 "Vienna will fund promising work in metallurgy, radio and engines through multi-year grants. Provincial laboratories may compete without moving every bench to the capital."
 AOEIW9_AUS_eco_infra_2:0 "Freight Capacity at Bohemian Foundries"
 AOEIW9_AUS_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Bohemian Foundries will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_AUS_eco_infra_3:0 "Workers' Housing at Trieste Commerce"
 AOEIW9_AUS_eco_infra_3_desc:0 "Worker housing near Trieste Commerce will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_AUS_eco_infra_4:0 "One Freight Plan for the Monarchy"
 AOEIW9_AUS_eco_infra_4_desc:0 "Dispatchers will reserve wagons, bridges and depots under a common imperial schedule. Internal frontiers may no longer halt military freight."
 AOEIW9_AUS_eco_final:0 "A Danubian Industrial System"
 AOEIW9_AUS_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a austro-hungarian economy able to convert regional strengths into sustained national output."
 AOEIW9_AUS_mil_root:0 "Review the k.u.k. General Staff"
 AOEIW9_AUS_mil_root_desc:0 "The k.u.k. General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_AUS_mil_army_2:0 "The Danubian Infantry Army"
 AOEIW9_AUS_mil_army_2_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_AUS_mil_army_5:0 "The Imperial Mobile Reserve"
 AOEIW9_AUS_mil_army_5_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_AUS_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_AUS_mil_army_6_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_AUS_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_AUS_mil_army_7_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_AUS_mil_army_8:0 "One Supply Service"
 AOEIW9_AUS_mil_army_8_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_AUS_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_AUS_mil_army_9_desc:0 "The Danubian army needs common training across its nationalities, whether it specialises in infantry or a central armoured reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_AUS_mil_air_1:0 "Reorganise Imperial Aviation Corps"
 AOEIW9_AUS_mil_air_1_desc:0 "Imperial Aviation Corps will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_AUS_mil_air_2:0 "Fighter Instruction at Wiener Neustadt Air School"
 AOEIW9_AUS_mil_air_2_desc:0 "Wiener Neustadt Air School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_AUS_mil_air_3:0 "Ground Support Doctrine under Danubian Air Command"
 AOEIW9_AUS_mil_air_3_desc:0 "Danubian Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_AUS_mil_air_4:0 "Extend the Range of Imperial Aviation Corps"
 AOEIW9_AUS_mil_air_4_desc:0 "Imperial Aviation Corps will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Austria-Hungary's geography and strategic commitments."
 AOEIW9_AUS_mil_air_5:0 "Radar Networks for Wiener Neustadt Air School"
 AOEIW9_AUS_mil_air_5_desc:0 "Wiener Neustadt Air School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_AUS_mil_air_6:0 "Unify Command under Danubian Air Command"
 AOEIW9_AUS_mil_air_6_desc:0 "Danubian Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_AUS_mil_sea_1:0 "Review Adriatic Squadron"
 AOEIW9_AUS_mil_sea_1_desc:0 "A full review of Adriatic Squadron will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_AUS_mil_sea_2:0 "Expand Trieste Naval Arsenal"
 AOEIW9_AUS_mil_sea_2_desc:0 "Trieste Naval Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_AUS_mil_sea_3:0 "Austro-Hungarian Fleet Manoeuvres with Imperial Coastal Fleet"
 AOEIW9_AUS_mil_sea_3_desc:0 "Fleet exercises with Imperial Coastal Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training. For Austria-Hungary, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_AUS_mil_sea_4:0 "Screening Doctrine for Adriatic Squadron"
 AOEIW9_AUS_mil_sea_4_desc:0 "Adriatic Squadron will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_AUS_mil_sea_5:0 "Naval Aviation at Trieste Naval Arsenal"
 AOEIW9_AUS_mil_sea_5_desc:0 "Naval aviation will be integrated with Trieste Naval Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_AUS_mil_sea_6:0 "Austro-Hungarian New Hulls for Imperial Coastal Fleet"
 AOEIW9_AUS_mil_sea_6_desc:0 "New hull standards for Imperial Coastal Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships. For Austria-Hungary, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_AUS_mil_final:0 "Elastic Defense in Austria-Hungary"
 AOEIW9_AUS_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Austria-Hungary now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_AUS_dip_root:0 "Define the Danubian Doctrine"
 AOEIW9_AUS_dip_root_desc:0 "Austria-Hungary must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_AUS_dip_a_2:0 "The Vienna–Berlin Mission"
 AOEIW9_AUS_dip_a_2_desc:0 "A Vienna-Berlin mission will establish direct channels for disputes that would otherwise be filtered through rival alliance systems."
 AOEIW9_AUS_dip_a_3:0 "Danubian Commerce with Germany"
 AOEIW9_AUS_dip_a_3_desc:0 "Commercial ties with Germany can strengthen the Danubian economy while remaining separate from political incorporation."
 AOEIW9_AUS_dip_a_4:0 "Military Liaison across Bohemia"
 AOEIW9_AUS_dip_a_4_desc:0 "Limited military liaison will prevent accidents along Bohemia and improve transparency without creating a joint command."
 AOEIW9_AUS_dip_a_5:0 "Preserve Habsburg Independence"
 AOEIW9_AUS_dip_a_5_desc:0 "Vienna will cooperate where interests overlap while explicitly preserving the constitutional and diplomatic independence of the Dual Monarchy."
 AOEIW9_AUS_dip_a_6:0 "The Vienna–Berlin Accord"
 AOEIW9_AUS_dip_a_6_desc:0 "The accord establishes non-aggression and practical cooperation without moving Austria-Hungary out of The Old Order."
 AOEIW9_AUS_dip_b_1:0 "The Balkan Balance"
 AOEIW9_AUS_dip_b_1_desc:0 "The Balkan Balance will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Austria-Hungary actually wants before pressure is applied."
 AOEIW9_AUS_dip_b_2:0 "Send a Mission on the Balkan Balance"
 AOEIW9_AUS_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Balkan Balance. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_AUS_dip_b_3:0 "Economic Leverage over the Balkan Balance"
 AOEIW9_AUS_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Balkan Balance. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_AUS_dip_b_4:0 "Staff Talks on the Balkan Balance"
 AOEIW9_AUS_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Balkan Balance. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_AUS_dip_b_5:0 "A Formal Warning over the Balkan Balance"
 AOEIW9_AUS_dip_b_5_desc:0 "A formal warning over the Balkan Balance will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_AUS_dip_b_6:0 "Terms for the Balkan Balance"
 AOEIW9_AUS_dip_b_6_desc:0 "Terms for an ultimatum on the Balkan Balance will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_AUS_dip_final:0 "Vienna Between the Blocs"
 AOEIW9_AUS_dip_final_desc:0 "Austria-Hungary's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_BEL_focus_tree:0 "Kingdom of Belgium Focus Tree"
 AOEIW9_BEL_politics_p1_2:0 "Reconcile the Chamber of Representatives"
 AOEIW9_BEL_politics_p1_2_desc:0 "Chamber of Representatives has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Royal Coalition programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_BEL_politics_p1_3:0 "Reform the Belgian Senate"
 AOEIW9_BEL_politics_p1_3_desc:0 "Senate still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Royal Coalition settlement."
 AOEIW9_BEL_politics_p1_4:0 "Bind the Catholic Bloc"
 AOEIW9_BEL_politics_p1_4_desc:0 "Catholic Bloc will be tied to the Royal Coalition programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_BEL_politics_p1_5:0 "The Belgian Crown and Nation"
 AOEIW9_BEL_politics_p1_5_desc:0 "Royal Palace will be presented as part of the national political order rather than a factional institution. The Royal Coalition camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_BEL_politics_p2_2:0 "Open the Belgian Senate"
 AOEIW9_BEL_politics_p2_2_desc:0 "Access to Senate will be widened and its procedures made less dependent on closed patronage. The reform gives the Parliament Above Faction camp a legal route to broaden its support without bypassing the state."
 AOEIW9_BEL_politics_p2_3:0 "Guarantee the Catholic Bloc"
 AOEIW9_BEL_politics_p2_3_desc:0 "The position of Catholic Bloc will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Parliament Above Faction settlement."
 AOEIW9_BEL_politics_p2_4:0 "Broaden the Liberal League"
 AOEIW9_BEL_politics_p2_4_desc:0 "Liberal League will receive a wider role in consultation, administration and mobilisation. The Parliament Above Faction project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_BEL_politics_p2_5:0 "Ministers Answer to the Chambers"
 AOEIW9_BEL_politics_p2_5_desc:0 "The government will require parliamentary confidence before committing revenue or troops."
 AOEIW9_BEL_politics_p3_2:0 "Mobilise the Catholic Bloc"
 AOEIW9_BEL_politics_p3_2_desc:0 "Catholic Bloc will become an organising arm of the Corporatist State programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_BEL_politics_p3_3:0 "Break the Liberal League"
 AOEIW9_BEL_politics_p3_3_desc:0 "The independent power of Liberal League is incompatible with the Corporatist State project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_BEL_politics_p3_4:0 "Replace the Walloon Councils"
 AOEIW9_BEL_politics_p3_4_desc:0 "Walloon Councils will be removed from its gatekeeping role and replaced with officials loyal to the Corporatist State settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_BEL_politics_p3_5:0 "Labour under the Corporations"
 AOEIW9_BEL_politics_p3_5_desc:0 "The corporatists will replace independent bargaining with compulsory bodies supervised by the state."
 AOEIW9_BEL_politics_settlement:0 "King, Cabinet and Constitution"
 AOEIW9_BEL_politics_settlement_desc:0 "The struggle has fixed who appoints ministers and who may commit Belgium to war."
 AOEIW9_BEL_eco_root:0 "The Walloon Steel Basin Review"
 AOEIW9_BEL_eco_root_desc:0 "Walloon Steel Basin, Antwerp Docks and Liège Workshops do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Kingdom of Belgium can expand fastest."
 AOEIW9_BEL_eco_civ_2:0 "Rails to Antwerp Docks"
 AOEIW9_BEL_eco_civ_2_desc:0 "Rail connections serving Antwerp Docks will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_BEL_eco_civ_5:0 "More Congo Cargo through Antwerp"
 AOEIW9_BEL_eco_civ_5_desc:0 "Cranes, warehouses and customs crews will move colonial copper and rubber through Antwerp."
 AOEIW9_BEL_eco_civ_6:0 "Renew Albert Canal"
 AOEIW9_BEL_eco_civ_6_desc:0 "Albert Canal will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_BEL_eco_civ_7:0 "A Second Shift at Walloon Steel Basin"
 AOEIW9_BEL_eco_civ_7_desc:0 "Walloon Steel Basin has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_BEL_eco_civ_8:0 "Public Works at Antwerp Docks"
 AOEIW9_BEL_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Antwerp Docks will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_BEL_eco_civ_9:0 "New Machine Halls at Liège"
 AOEIW9_BEL_eco_civ_9_desc:0 "Liège workshops will add floorspace, power and heavy tools for civilian and defence orders."
 AOEIW9_BEL_eco_war_1:0 "The Brussels Credit Houses Armaments Audit"
 AOEIW9_BEL_eco_war_1_desc:0 "An armaments audit will determine which parts of Brussels Credit Houses can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_BEL_eco_war_2:0 "Congo Copper for Belgian Shells"
 AOEIW9_BEL_eco_war_2_desc:0 "Long contracts will route copper and industrial inputs from Congo into Belgian armament works."
 AOEIW9_BEL_eco_war_3:0 "Precision Tools for Albert Canal"
 AOEIW9_BEL_eco_war_3_desc:0 "Precision machine tools will be prioritised for Albert Canal, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_BEL_eco_war_4:0 "Expand Walloon Steel Basin for Rearmament"
 AOEIW9_BEL_eco_war_4_desc:0 "New military production capacity will be built around Walloon Steel Basin, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_BEL_eco_war_5:0 "Standardise Antwerp Docks"
 AOEIW9_BEL_eco_war_5_desc:0 "Factories tied to Antwerp Docks will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_BEL_eco_war_6:0 "Night Production at Liège Workshops"
 AOEIW9_BEL_eco_war_6_desc:0 "Night production will be organised at Liège Workshops with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_BEL_eco_science_1:0 "Endow Université Libre de Bruxelles"
 AOEIW9_BEL_eco_science_1_desc:0 "Stable public funding will give Université Libre de Bruxelles laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_BEL_eco_science_2:0 "New Laboratories at Liège Technical Institute"
 AOEIW9_BEL_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Liège Technical Institute. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_BEL_eco_science_3:0 "Applied Research at Royal Scientific Society"
 AOEIW9_BEL_eco_science_3_desc:0 "Royal Scientific Society will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_BEL_eco_science_4:0 "Industrial Physics at Université Libre de Bruxelles"
 AOEIW9_BEL_eco_science_4_desc:0 "Industrial physics at Université Libre de Bruxelles will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_BEL_eco_science_5:0 "Production Science at Liège Technical Institute"
 AOEIW9_BEL_eco_science_5_desc:0 "Researchers at Liège Technical Institute will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_BEL_eco_infra_2:0 "Freight Capacity at Brussels Credit Houses"
 AOEIW9_BEL_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Brussels Credit Houses will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_BEL_eco_infra_3:0 "Homes beside the Liège Works"
 AOEIW9_BEL_eco_infra_3_desc:0 "Housing and tram links will be built where expanding workshops need permanent labour."
 AOEIW9_BEL_eco_infra_4:0 "Logistics through Albert Canal"
 AOEIW9_BEL_eco_infra_4_desc:0 "Albert Canal will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_BEL_eco_final:0 "Steel, Congo Cargo and the Albert Canal"
 AOEIW9_BEL_eco_final_desc:0 "Metropolitan workshops, colonial freight and inland waterways now sustain one Belgian production system."
 AOEIW9_BEL_mil_root:0 "Review the Belgian General Staff"
 AOEIW9_BEL_mil_root_desc:0 "The Belgian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_BEL_mil_army_2:0 "Fortress Troops Field Manoeuvres"
 AOEIW9_BEL_mil_army_2_desc:0 "Large field exercises with the Fortress Troops will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_BEL_mil_army_5:0 "Motorise the Royal Military Academy in Kingdom of Belgium"
 AOEIW9_BEL_mil_army_5_desc:0 "Motor transport assigned to the Royal Military Academy will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain. For Belgium, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_BEL_mil_army_6:0 "Staff Procedures at the Belgian General Staff"
 AOEIW9_BEL_mil_army_6_desc:0 "Staff officers at the Belgian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_BEL_mil_army_7:0 "Armour Studies at the Fortress Troops"
 AOEIW9_BEL_mil_army_7_desc:0 "The Fortress Troops will study how armour can be integrated with infantry, artillery and logistics under belgian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_BEL_mil_air_1:0 "Reorganise Belgian Air Component"
 AOEIW9_BEL_mil_air_1_desc:0 "Belgian Air Component will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_BEL_mil_air_2:0 "Fighter Instruction at Evere Flying School"
 AOEIW9_BEL_mil_air_2_desc:0 "Evere Flying School will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_BEL_mil_air_3:0 "Belgian Ground Support Doctrine under National Air Command"
 AOEIW9_BEL_mil_air_3_desc:0 "National Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Belgium, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_BEL_mil_air_4:0 "Extend the Range of Belgian Air Component"
 AOEIW9_BEL_mil_air_4_desc:0 "Belgian Air Component will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Kingdom of Belgium's geography and strategic commitments."
 AOEIW9_BEL_mil_air_5:0 "Radar Networks for Evere Flying School"
 AOEIW9_BEL_mil_air_5_desc:0 "Evere Flying School will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_BEL_mil_sea_1:0 "Review Antwerp Flotilla"
 AOEIW9_BEL_mil_sea_1_desc:0 "A full review of Antwerp Flotilla will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_BEL_mil_sea_2:0 "Expand Ostend Naval Station"
 AOEIW9_BEL_mil_sea_2_desc:0 "Ostend Naval Station will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_BEL_mil_sea_3:0 "Fleet Manoeuvres with Scheldt Patrol"
 AOEIW9_BEL_mil_sea_3_desc:0 "Fleet exercises with Scheldt Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_BEL_mil_sea_4:0 "Screening Doctrine for Antwerp Flotilla"
 AOEIW9_BEL_mil_sea_4_desc:0 "Antwerp Flotilla will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_BEL_mil_sea_5:0 "Naval Aviation at Ostend Naval Station"
 AOEIW9_BEL_mil_sea_5_desc:0 "Naval aviation will be integrated with Ostend Naval Station for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_BEL_mil_final:0 "Fortified Defense"
 AOEIW9_BEL_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Kingdom of Belgium now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_BEL_dip_root:0 "Define the Low Countries Doctrine"
 AOEIW9_BEL_dip_root_desc:0 "The Kingdom of Belgium must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_BEL_dip_a_2:0 "Send a Mission on the Dutch Frontier"
 AOEIW9_BEL_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Dutch Frontier. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_BEL_dip_a_3:0 "Economic Leverage over the Dutch Frontier"
 AOEIW9_BEL_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Dutch Frontier. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_BEL_dip_a_4:0 "Staff Talks on the Dutch Frontier"
 AOEIW9_BEL_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Dutch Frontier. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_BEL_dip_a_5:0 "A Formal Warning over the Dutch Frontier"
 AOEIW9_BEL_dip_a_5_desc:0 "A formal warning over the Dutch Frontier will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_BEL_dip_b_1:0 "The Brussels–Paris Defence Convention"
 AOEIW9_BEL_dip_b_1_desc:0 "Belgium's independence will be defended through a formal security convention with France rather than through an improvised guarantee."
 AOEIW9_BEL_dip_b_2:0 "Permanent Staff Liaison"
 AOEIW9_BEL_dip_b_2_desc:0 "A permanent Belgian-French liaison mission will coordinate mobilisation timetables, intelligence and frontier planning."
 AOEIW9_BEL_dip_b_3:0 "Coordinate Meuse Procurement"
 AOEIW9_BEL_dip_b_3_desc:0 "Shared standards for artillery, ammunition and communications will make the Meuse defences a single strategic system."
 AOEIW9_BEL_dip_b_4:0 "Liège–Sedan Staff Talks"
 AOEIW9_BEL_dip_b_4_desc:0 "Regular staff talks will connect the Liège fortress system with French planning toward Sedan and the Meuse approaches."
 AOEIW9_BEL_dip_b_5:0 "Belgium within The Old Order"
 AOEIW9_BEL_dip_b_5_desc:0 "Belgium remains sovereign, but its security is now anchored in a functioning Old Order defence system."
 AOEIW9_BEL_dip_final:0 "Belgium within the Old Order"
 AOEIW9_BEL_dip_final_desc:0 "The Kingdom of Belgium's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_BRA_focus_tree:0 "Brazilian Empire Focus Tree"
 AOEIW9_BRA_politics_p1_2:0 "Reconcile the Imperial Senate"
 AOEIW9_BRA_politics_p1_2_desc:0 "Imperial Senate has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Imperial Autonomy programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_BRA_politics_p1_3:0 "Reform the Provincial Assemblies"
 AOEIW9_BRA_politics_p1_3_desc:0 "Provincial Assemblies still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Imperial Autonomy settlement."
 AOEIW9_BRA_politics_p1_4:0 "Bind the Coffee Oligarchs"
 AOEIW9_BRA_politics_p1_4_desc:0 "Coffee Oligarchs will be tied to the Imperial Autonomy programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_BRA_politics_p1_5:0 "Lisbon's Envoys at the Palace"
 AOEIW9_BRA_politics_p1_5_desc:0 "Portuguese envoys arrive in Rio expecting privileged access to the imperial court. Vargas and the provincial notables will decide how much influence an Atlantic kinship is worth."
 AOEIW9_BRA_politics_p1_6:0 "Rio Court and Nation"
 AOEIW9_BRA_politics_p1_6_desc:0 "Rio Court will be presented as part of the national political order rather than a factional institution. The Imperial Autonomy camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_BRA_politics_p2_2:0 "Open the Provincial Assemblies"
 AOEIW9_BRA_politics_p2_2_desc:0 "Access to Provincial Assemblies will be widened and its procedures made less dependent on closed patronage. The reform gives the Lusophone Compact camp a legal route to broaden its support without bypassing the state."
 AOEIW9_BRA_politics_p2_3:0 "Guarantee the Coffee Oligarchs"
 AOEIW9_BRA_politics_p2_3_desc:0 "The position of Coffee Oligarchs will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Lusophone Compact settlement."
 AOEIW9_BRA_politics_p2_4:0 "A Chamber for the Portuguese World"
 AOEIW9_BRA_politics_p2_4_desc:0 "Delegates from across the Lusophone world may petition and debate in Rio, but Brazilian deputies will write the chamber's powers. Association must rest on consent rather than court ritual."
 AOEIW9_BRA_politics_p2_5:0 "Entrust the Army Ministry"
 AOEIW9_BRA_politics_p2_5_desc:0 "Responsibility now shifts toward Army Ministry, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Lusophone Compact system can govern through delegated institutions."
 AOEIW9_BRA_politics_p2_6:0 "The Constitution of 1934"
 AOEIW9_BRA_politics_p2_6_desc:0 "Secret ballots, federal representation and social rights will be placed above palace intrigue. The empire must live under a constitution its voters can recognise."
 AOEIW9_BRA_politics_p3_2:0 "Mobilise the Coffee Oligarchs"
 AOEIW9_BRA_politics_p3_2_desc:0 "Coffee Oligarchs will become an organising arm of the Brazilian National State programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_BRA_politics_p3_3:0 "Rio Will Speak for Itself"
 AOEIW9_BRA_politics_p3_3_desc:0 "The regime dissolves the Lusophone delegates' privileges and brings Atlantic policy into the presidential circle. Foreign kinship will no longer restrain Brazilian command."
 AOEIW9_BRA_politics_p3_4:0 "Replace the Army Ministry"
 AOEIW9_BRA_politics_p3_4_desc:0 "Army Ministry will be removed from its gatekeeping role and replaced with officials loyal to the Brazilian National State settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_BRA_politics_p3_5:0 "Command the Rio Court"
 AOEIW9_BRA_politics_p3_5_desc:0 "Rio Court will answer directly to the authorities created by the Brazilian National State path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_BRA_politics_p3_6:0 "Estado Novo"
 AOEIW9_BRA_politics_p3_6_desc:0 "Congress is closed, parties are abolished and the Catete Palace claims the right to remake the nation by decree. Industrialisation and labour law will now carry the regime's signature."
 AOEIW9_BRA_politics_settlement:0 "The Crown Returns to Sao Cristovao"
 AOEIW9_BRA_politics_settlement_desc:0 "The court and government have fixed their relationship after the struggle over governors, coffee interests and the army. Ceremony at Sao Cristovao gives the imperial settlement a visible centre."
 AOEIW9_BRA_eco_root:0 "The São Paulo Machine Shops Review"
 AOEIW9_BRA_eco_root_desc:0 "São Paulo Machine Shops, Minas Gerais Mines and Rio Shipyards do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where Brazil can expand fastest."
 AOEIW9_BRA_eco_civ_2:0 "Rails to Minas Gerais Mines"
 AOEIW9_BRA_eco_civ_2_desc:0 "Rail connections serving Minas Gerais Mines will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_BRA_eco_civ_5:0 "The Central do Brasil Railways Expansion"
 AOEIW9_BRA_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Central do Brasil Railways. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_BRA_eco_civ_6:0 "Survey the Amazon"
 AOEIW9_BRA_eco_civ_6_desc:0 "River crews, engineers and doctors will chart routes and sites beyond the coastal economy. Development begins with knowing where people and freight can actually move."
 AOEIW9_BRA_eco_civ_7:0 "A Second Shift at São Paulo Machine Shops"
 AOEIW9_BRA_eco_civ_7_desc:0 "São Paulo Machine Shops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_BRA_eco_civ_8:0 "Public Works at Minas Gerais Mines"
 AOEIW9_BRA_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Minas Gerais Mines will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_BRA_eco_war_1:0 "Coffee Pays for Guns"
 AOEIW9_BRA_eco_war_1_desc:0 "Export receipts will be directed into machine tools, explosives and army contracts. The sacks on the docks must finance more than another season's price support."
 AOEIW9_BRA_eco_war_2:0 "War Orders for Central do Brasil Railways"
 AOEIW9_BRA_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Central do Brasil Railways, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_BRA_eco_war_3:0 "Machine Tools up the Amazon"
 AOEIW9_BRA_eco_war_3_desc:0 "Lathes, pumps and repair sets will travel with the new river depots. Workshops in the interior must maintain their own equipment when coastal supply fails."
 AOEIW9_BRA_eco_war_4:0 "Expand São Paulo Machine Shops for Rearmament"
 AOEIW9_BRA_eco_war_4_desc:0 "New military production capacity will be built around São Paulo Machine Shops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_BRA_eco_war_5:0 "Standardise Minas Gerais Mines"
 AOEIW9_BRA_eco_war_5_desc:0 "Factories tied to Minas Gerais Mines will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_BRA_eco_war_6:0 "Night Production at Rio Shipyards"
 AOEIW9_BRA_eco_war_6_desc:0 "Night production will be organised at Rio Shipyards with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_BRA_eco_war_7:0 "The Coffee Contracts Hold"
 AOEIW9_BRA_eco_war_7_desc:0 "The state will guarantee purchases and shipping long enough for exporters to plan around wartime disruption. In return, foreign earnings are placed at the service of mobilisation."
 AOEIW9_BRA_eco_science_1:0 "Endow University of São Paulo"
 AOEIW9_BRA_eco_science_1_desc:0 "Stable public funding will give University of São Paulo laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_BRA_eco_science_2:0 "New Laboratories at National Observatory"
 AOEIW9_BRA_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of National Observatory. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_BRA_eco_science_3:0 "Applied Research at Oswaldo Cruz Institute"
 AOEIW9_BRA_eco_science_3_desc:0 "Oswaldo Cruz Institute will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_BRA_eco_science_4:0 "Industrial Physics at University of São Paulo"
 AOEIW9_BRA_eco_science_4_desc:0 "Industrial physics at University of São Paulo will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_BRA_eco_science_5:0 "Production Science at National Observatory"
 AOEIW9_BRA_eco_science_5_desc:0 "Researchers at National Observatory will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_BRA_eco_science_6:0 "Research Grants for Oswaldo Cruz Institute"
 AOEIW9_BRA_eco_science_6_desc:0 "A national grant programme will connect Oswaldo Cruz Institute to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_BRA_eco_infra_2:0 "Clear the Coffee at Santos"
 AOEIW9_BRA_eco_infra_2_desc:0 "Extra sidings, warehouses and loading crews at Santos will break the queues that strand export cargo inland. Revenue cannot defend Brazil while it waits beside the tracks."
 AOEIW9_BRA_eco_infra_3:0 "Workers' Housing at Central do Brasil Railways"
 AOEIW9_BRA_eco_infra_3_desc:0 "Worker housing near Central do Brasil Railways will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_BRA_eco_infra_4:0 "River Depots beyond Manaus"
 AOEIW9_BRA_eco_infra_4_desc:0 "Fuel, radio and repair depots will extend regular traffic beyond Manaus. The Amazon becomes a connected interior rather than a blank promise on ministry maps."
 AOEIW9_BRA_eco_final:0 "An Integrated Brazilian Market"
 AOEIW9_BRA_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a brazilian economy able to convert regional strengths into sustained national output."
 AOEIW9_BRA_mil_root:0 "Review the Brazilian General Staff"
 AOEIW9_BRA_mil_root_desc:0 "The Brazilian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_BRA_mil_army_2:0 "Jungle Brigades Field Manoeuvres"
 AOEIW9_BRA_mil_army_2_desc:0 "Large field exercises with the Jungle Brigades will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_BRA_mil_army_5:0 "Motorise the Escola Militar"
 AOEIW9_BRA_mil_army_5_desc:0 "Motor transport assigned to the Escola Militar will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_BRA_mil_army_6:0 "Staff Procedures at the Brazilian General Staff"
 AOEIW9_BRA_mil_army_6_desc:0 "Staff officers at the Brazilian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_BRA_mil_army_7:0 "Armour Studies at the Jungle Brigades"
 AOEIW9_BRA_mil_army_7_desc:0 "The Jungle Brigades will study how armour can be integrated with infantry, artillery and logistics under brazilian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_BRA_mil_army_8:0 "Operational Planning at the Imperial Field Army"
 AOEIW9_BRA_mil_army_8_desc:0 "Operational planning with the Imperial Field Army will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_BRA_mil_army_9:0 "Guns from the Realengo Arsenal"
 AOEIW9_BRA_mil_army_9_desc:0 "The Realengo Arsenal will standardise field pieces, ammunition and training tables for the army. Units in the interior must receive weapons they can repair from the same drawings."
 AOEIW9_BRA_mil_air_1:0 "Reorganise Brazilian Air Arm"
 AOEIW9_BRA_mil_air_1_desc:0 "Brazilian Air Arm will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_BRA_mil_air_2:0 "Fighter Instruction at Campo dos Afonsos"
 AOEIW9_BRA_mil_air_2_desc:0 "Campo dos Afonsos will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_BRA_mil_air_3:0 "Ground Support Doctrine under South Atlantic Air Command"
 AOEIW9_BRA_mil_air_3_desc:0 "South Atlantic Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_BRA_mil_air_4:0 "Extend the Range of Brazilian Air Arm"
 AOEIW9_BRA_mil_air_4_desc:0 "Brazilian Air Arm will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by Brazil's geography and strategic commitments."
 AOEIW9_BRA_mil_air_5:0 "Radar Networks for Campo dos Afonsos"
 AOEIW9_BRA_mil_air_5_desc:0 "Campo dos Afonsos will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_BRA_mil_air_6:0 "Unify Command under South Atlantic Air Command"
 AOEIW9_BRA_mil_air_6_desc:0 "South Atlantic Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_BRA_mil_sea_1:0 "Review Rio Squadron"
 AOEIW9_BRA_mil_sea_1_desc:0 "A full review of Rio Squadron will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_BRA_mil_sea_2:0 "Expand Niterói Arsenal"
 AOEIW9_BRA_mil_sea_2_desc:0 "Niterói Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_BRA_mil_sea_3:0 "Fleet Manoeuvres with South Atlantic Fleet"
 AOEIW9_BRA_mil_sea_3_desc:0 "Fleet exercises with South Atlantic Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_BRA_mil_sea_4:0 "Screening Doctrine for Rio Squadron"
 AOEIW9_BRA_mil_sea_4_desc:0 "Rio Squadron will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_BRA_mil_sea_5:0 "Naval Aviation at Niterói Arsenal"
 AOEIW9_BRA_mil_sea_5_desc:0 "Naval aviation will be integrated with Niterói Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_BRA_mil_sea_6:0 "New Hulls for South Atlantic Fleet"
 AOEIW9_BRA_mil_sea_6_desc:0 "New hull standards for South Atlantic Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_BRA_mil_final:0 "Brazilian Mobile Defence Doctrine"
 AOEIW9_BRA_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. Brazil now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_BRA_dip_root:0 "Define the South Atlantic Doctrine"
 AOEIW9_BRA_dip_root_desc:0 "Brazilian Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_BRA_dip_a_2:0 "Send the Rio Delegation"
 AOEIW9_BRA_dip_a_2_desc:0 "Rio will send a permanent delegation empowered to negotiate directly with the Portuguese government."
 AOEIW9_BRA_dip_a_3:0 "A Shared Atlantic Market"
 AOEIW9_BRA_dip_a_3_desc:0 "Brazilian access to Portuguese markets and Portuguese access to Brazilian resources will be governed by reciprocal rules."
 AOEIW9_BRA_dip_a_4:0 "Escudos across the Atlantic"
 AOEIW9_BRA_dip_a_4_desc:0 "Banks in Rio and Lisbon will clear investment and shipping contracts in both currencies. The bargain makes the imperial connection visible in docks, rails and factories."
 AOEIW9_BRA_dip_a_5:0 "Brazilian Rights within the Empire"
 AOEIW9_BRA_dip_a_5_desc:0 "Recognised rights and representation are the price of making the Portuguese connection sustainable in the long term."
 AOEIW9_BRA_dip_a_6:0 "One Crown, Two Oceans"
 AOEIW9_BRA_dip_a_6_desc:0 "Rio and Lisbon ratify common rules for defence, trade and consultation while retaining separate governments. The imperial claim now carries obligations on both sides of the Atlantic."
 AOEIW9_BRA_dip_b_1:0 "Guard the South Atlantic"
 AOEIW9_BRA_dip_b_1_desc:0 "Guard the South Atlantic will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what Brazil actually wants before pressure is applied."
 AOEIW9_BRA_dip_b_2:0 "Send a Mission on Guard the South Atlantic"
 AOEIW9_BRA_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over Guard the South Atlantic. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_BRA_dip_b_3:0 "Economic Leverage over Guard the South Atlantic"
 AOEIW9_BRA_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over Guard the South Atlantic. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_BRA_dip_b_4:0 "Staff Talks on Guard the South Atlantic"
 AOEIW9_BRA_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to Guard the South Atlantic. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_BRA_dip_b_5:0 "A Formal Warning over Guard the South Atlantic"
 AOEIW9_BRA_dip_b_5_desc:0 "A formal warning over Guard the South Atlantic will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_BRA_dip_b_6:0 "Terms for Guard the South Atlantic"
 AOEIW9_BRA_dip_b_6_desc:0 "Terms for an ultimatum on Guard the South Atlantic will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_BRA_dip_final:0 "Brazil and the Lusophone World"
 AOEIW9_BRA_dip_final_desc:0 "Brazil's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_BUL_focus_tree:0 "Tsardom of Bulgaria Focus Tree"
 AOEIW9_BUL_politics_p1_2:0 "Reconcile the Bulgarian National Assembly"
 AOEIW9_BUL_politics_p1_2_desc:0 "National Assembly has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Crown and the Sobranie programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_BUL_politics_p1_3:0 "Reform the Bulgarian Officer League"
 AOEIW9_BUL_politics_p1_3_desc:0 "Officer League still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Crown and the Sobranie settlement."
 AOEIW9_BUL_politics_p1_4:0 "Bind the Agrarian Union"
 AOEIW9_BUL_politics_p1_4_desc:0 "Agrarian Union will be tied to the Crown and the Sobranie programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_BUL_politics_p1_5:0 "Tsar's Court and Nation"
 AOEIW9_BUL_politics_p1_5_desc:0 "Tsar's Court will be presented as part of the national political order rather than a factional institution. The Crown and the Sobranie camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_BUL_politics_p2_2:0 "Open the Bulgarian Officer League"
 AOEIW9_BUL_politics_p2_2_desc:0 "Access to Officer League will be widened and its procedures made less dependent on closed patronage. The reform gives the Royal Centralisation camp a legal route to broaden its support without bypassing the state."
 AOEIW9_BUL_politics_p2_3:0 "Guarantee the Agrarian Union"
 AOEIW9_BUL_politics_p2_3_desc:0 "The position of Agrarian Union will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Royal Centralisation settlement."
 AOEIW9_BUL_politics_p2_4:0 "Broaden the Sofia Ministries"
 AOEIW9_BUL_politics_p2_4_desc:0 "Sofia Ministries will receive a wider role in consultation, administration and mobilisation. The Royal Centralisation project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_BUL_politics_p2_5:0 "Restore the Tarnovo Constitution"
 AOEIW9_BUL_politics_p2_5_desc:0 "The National Assembly will restore ministerial responsibility, association and parliamentary scrutiny under Bulgaria’s historic basic law. The Crown must govern through it."
 AOEIW9_BUL_politics_p3_2:0 "Mobilise the Agrarian Union"
 AOEIW9_BUL_politics_p3_2_desc:0 "Agrarian Union will become an organising arm of the National Revival programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_BUL_politics_p3_3:0 "Break the Sofia Ministries"
 AOEIW9_BUL_politics_p3_3_desc:0 "The independent power of Sofia Ministries is incompatible with the National Revival project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_BUL_politics_p3_4:0 "Replace the Bulgarian Provincial Prefects"
 AOEIW9_BUL_politics_p3_4_desc:0 "Provincial Prefects will be removed from its gatekeeping role and replaced with officials loyal to the National Revival settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_BUL_politics_p3_5:0 "Boris Rules without Parties"
 AOEIW9_BUL_politics_p3_5_desc:0 "The Tsar confirms the ban on party organisations and chooses ministers through the palace. Sofia will be orderly because opposition has no lawful room."
 AOEIW9_BUL_politics_settlement:0 "Who Commands from Sofia?"
 AOEIW9_BUL_politics_settlement_desc:0 "Crown, assembly or officers now control appointments, police and frontier policy. Bulgaria can pursue revision under a government whose authority is clear."
 AOEIW9_BUL_eco_root:0 "The Sofia Workshops Review"
 AOEIW9_BUL_eco_root_desc:0 "Sofia Workshops, Maritsa Valley and Black Sea Commerce do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Tsardom of Bulgaria can expand fastest."
 AOEIW9_BUL_eco_civ_2:0 "Rails to Maritsa Valley"
 AOEIW9_BUL_eco_civ_2_desc:0 "Rail connections serving Maritsa Valley will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_BUL_eco_civ_5:0 "The Varna Docks Expansion"
 AOEIW9_BUL_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Varna Docks. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_BUL_eco_civ_6:0 "Put BDZ Back on Schedule"
 AOEIW9_BUL_eco_civ_6_desc:0 "Bulgarian State Railways will repair locomotives and enforce through schedules between Sofia, Plovdiv and the coast. Delayed wagons cannot support recovery."
 AOEIW9_BUL_eco_civ_7:0 "A Second Shift at Sofia Workshops"
 AOEIW9_BUL_eco_civ_7_desc:0 "Sofia Workshops has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_BUL_eco_civ_8:0 "Public Works at Maritsa Valley"
 AOEIW9_BUL_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Maritsa Valley will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_BUL_eco_civ_9:0 "Warehouses at Varna"
 AOEIW9_BUL_eco_civ_9_desc:0 "New cranes, sheds and customs crews will move Black Sea cargo through Varna. Commerce becomes capacity on the quay."
 AOEIW9_BUL_eco_war_1:0 "The Pernik Coal Basin Armaments Audit"
 AOEIW9_BUL_eco_war_1_desc:0 "An armaments audit will determine which parts of Pernik Coal Basin can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_BUL_eco_war_2:0 "War Orders for Varna Docks"
 AOEIW9_BUL_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Varna Docks, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_BUL_eco_war_3:0 "Machine Tools for the BDZ Workshops"
 AOEIW9_BUL_eco_war_3_desc:0 "Rail shops will receive common lathes, gauges and spare parts for wartime repair. Bulgaria must keep its own locomotives moving."
 AOEIW9_BUL_eco_war_4:0 "Expand Sofia Workshops for Rearmament"
 AOEIW9_BUL_eco_war_4_desc:0 "New military production capacity will be built around Sofia Workshops, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_BUL_eco_war_5:0 "Standardise Maritsa Valley"
 AOEIW9_BUL_eco_war_5_desc:0 "Factories tied to Maritsa Valley will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_BUL_eco_war_6:0 "Night Production at Black Sea Commerce"
 AOEIW9_BUL_eco_war_6_desc:0 "Night production will be organised at Black Sea Commerce with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_BUL_eco_science_1:0 "Endow Sofia University"
 AOEIW9_BUL_eco_science_1_desc:0 "Stable public funding will give Sofia University laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_BUL_eco_science_2:0 "New Laboratories at Military Technical School"
 AOEIW9_BUL_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Military Technical School. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_BUL_eco_science_3:0 "Applied Research at Bulgarian Academy"
 AOEIW9_BUL_eco_science_3_desc:0 "Bulgarian Academy will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_BUL_eco_science_4:0 "Industrial Physics at Sofia University"
 AOEIW9_BUL_eco_science_4_desc:0 "Industrial physics at Sofia University will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_BUL_eco_science_5:0 "Production Science at Military Technical School"
 AOEIW9_BUL_eco_science_5_desc:0 "Researchers at Military Technical School will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_BUL_eco_infra_2:0 "Freight Capacity at Pernik Coal Basin"
 AOEIW9_BUL_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Pernik Coal Basin will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_BUL_eco_infra_3:0 "Workers' Housing at Varna Docks"
 AOEIW9_BUL_eco_infra_3_desc:0 "Worker housing near Varna Docks will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_BUL_eco_infra_4:0 "Coal and Wagons for Mobilisation"
 AOEIW9_BUL_eco_infra_4_desc:0 "BDZ will reserve coal stocks, wagons and unloading crews for the army’s timetable. Border forces must arrive with their ammunition."
 AOEIW9_BUL_eco_final:0 "The Bulgarian Development State"
 AOEIW9_BUL_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a bulgarian economy able to convert regional strengths into sustained national output."
 AOEIW9_BUL_mil_root:0 "Review the Bulgarian General Staff"
 AOEIW9_BUL_mil_root_desc:0 "The Bulgarian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_BUL_mil_army_2:0 "Macedonian Regiments Field Manoeuvres"
 AOEIW9_BUL_mil_army_2_desc:0 "Large field exercises with the Macedonian Regiments will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_BUL_mil_army_5:0 "Motorise the Sofia War School"
 AOEIW9_BUL_mil_army_5_desc:0 "Motor transport assigned to the Sofia War School will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_BUL_mil_army_6:0 "Staff Procedures at the Bulgarian General Staff"
 AOEIW9_BUL_mil_army_6_desc:0 "Staff officers at the Bulgarian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_BUL_mil_army_7:0 "Armour Studies at the Macedonian Regiments"
 AOEIW9_BUL_mil_army_7_desc:0 "The Macedonian Regiments will study how armour can be integrated with infantry, artillery and logistics under bulgarian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_BUL_mil_air_1:0 "Reorganise Royal Bulgarian Air Force"
 AOEIW9_BUL_mil_air_1_desc:0 "Royal Bulgarian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_BUL_mil_air_2:0 "Fighter Instruction at Bozhurishte Airfield"
 AOEIW9_BUL_mil_air_2_desc:0 "Bozhurishte Airfield will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_BUL_mil_air_3:0 "Bulgarian Ground Support Doctrine under Balkan Air Command"
 AOEIW9_BUL_mil_air_3_desc:0 "Balkan Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service. For Bulgaria, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_BUL_mil_air_4:0 "Extend the Range of Royal Bulgarian Air Force"
 AOEIW9_BUL_mil_air_4_desc:0 "Royal Bulgarian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Tsardom of Bulgaria's geography and strategic commitments."
 AOEIW9_BUL_mil_air_5:0 "Radar Networks for Bozhurishte Airfield"
 AOEIW9_BUL_mil_air_5_desc:0 "Bozhurishte Airfield will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_BUL_mil_sea_1:0 "Review Varna Flotilla"
 AOEIW9_BUL_mil_sea_1_desc:0 "A full review of Varna Flotilla will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_BUL_mil_sea_2:0 "Expand Burgas Naval Station"
 AOEIW9_BUL_mil_sea_2_desc:0 "Burgas Naval Station will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_BUL_mil_sea_3:0 "Fleet Manoeuvres with Black Sea Patrol"
 AOEIW9_BUL_mil_sea_3_desc:0 "Fleet exercises with Black Sea Patrol will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_BUL_mil_sea_4:0 "Screening Doctrine for Varna Flotilla"
 AOEIW9_BUL_mil_sea_4_desc:0 "Varna Flotilla will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_BUL_mil_sea_5:0 "Naval Aviation at Burgas Naval Station"
 AOEIW9_BUL_mil_sea_5_desc:0 "Naval aviation will be integrated with Burgas Naval Station for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_BUL_mil_final:0 "Mountain Warfare"
 AOEIW9_BUL_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Tsardom of Bulgaria now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_BUL_dip_root:0 "Define the Balkan Revision Doctrine"
 AOEIW9_BUL_dip_root_desc:0 "The Tsardom of Bulgaria must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_BUL_dip_a_2:0 "Accept Italian Mediation"
 AOEIW9_BUL_dip_a_2_desc:0 "Italian mediation is imperfect, yet it offers a path to concessions without shattering the alliance."
 AOEIW9_BUL_dip_a_3:0 "Guarantees for Bulgarian Communities"
 AOEIW9_BUL_dip_a_3_desc:0 "Sofia will prioritise enforceable cultural and political guarantees for Bulgarian communities over immediate border revision."
 AOEIW9_BUL_dip_a_4:0 "Mark the Macedonian Line"
 AOEIW9_BUL_dip_a_4_desc:0 "Bulgarian and Yugoslav surveyors will mark posts, roads and disputed villages before ministers bargain. Claims must refer to the same ground."
 AOEIW9_BUL_dip_a_5:0 "The Macedonian Compromise"
 AOEIW9_BUL_dip_a_5_desc:0 "Bulgaria will accept a temporary territorial compromise in exchange for recognised minority protections and League guarantees."
 AOEIW9_BUL_dip_b_1:0 "The Dobruja Question"
 AOEIW9_BUL_dip_b_1_desc:0 "Dobruja remains a genuine Bulgarian grievance, but a war with Romania would destroy the League from within."
 AOEIW9_BUL_dip_b_2:0 "Delegates Meet at Giurgiu"
 AOEIW9_BUL_dip_b_2_desc:0 "Bulgarian and Romanian delegates will meet on the Danube to open the Dobruja talks. Shipping and minority guarantees enter the same file as the frontier."
 AOEIW9_BUL_dip_b_3:0 "Danube Trade before Revision"
 AOEIW9_BUL_dip_b_3_desc:0 "Expanded Danube commerce can create interests in stability strong enough to restrain territorial revisionism."
 AOEIW9_BUL_dip_b_4:0 "Minority Guarantees in Dobruja"
 AOEIW9_BUL_dip_b_4_desc:0 "Bulgaria will press for guarantees to Bulgarian communities as an interim settlement."
 AOEIW9_BUL_dip_b_5:0 "The Dobruja Standstill"
 AOEIW9_BUL_dip_b_5_desc:0 "Sofia will freeze its claims while the League survives, reserving the question for negotiation rather than conquest."
 AOEIW9_BUL_dip_final:0 "Sofia within the Mediterranean League"
 AOEIW9_BUL_dip_final_desc:0 "The Tsardom of Bulgaria's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_CAN_focus_tree:0 "Dominion of Canada Focus Tree"
 AOEIW9_CAN_politics_p1_2:0 "Reconcile the Canadian Privy Council"
 AOEIW9_CAN_politics_p1_2_desc:0 "Privy Council has become a source of obstruction inside the state. The government will broker a working agreement with its leaders so that the Responsible Government programme can advance without reducing the institution to a rubber stamp."
 AOEIW9_CAN_politics_p1_3:0 "Reform the Provincial Premiers"
 AOEIW9_CAN_politics_p1_3_desc:0 "Provincial Premiers still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Responsible Government settlement."
 AOEIW9_CAN_politics_p1_4:0 "Bind the Canadian Imperial Conference"
 AOEIW9_CAN_politics_p1_4_desc:0 "Imperial Conference will be tied to the Responsible Government programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_CAN_politics_p1_5:0 "Balance the Quebec Delegation"
 AOEIW9_CAN_politics_p1_5_desc:0 "Neither abolishing Quebec Delegation nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Responsible Government coalition."
 AOEIW9_CAN_politics_p1_6:0 "Parliament of Canada and Nation"
 AOEIW9_CAN_politics_p1_6_desc:0 "Parliament of Canada will be presented as part of the national political order rather than a factional institution. The Responsible Government camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_CAN_politics_p2_2:0 "Open the Provincial Premiers"
 AOEIW9_CAN_politics_p2_2_desc:0 "Access to Provincial Premiers will be widened and its procedures made less dependent on closed patronage. The reform gives the Canadian Imperial Partnership camp a legal route to broaden its support without bypassing the state."
 AOEIW9_CAN_politics_p2_3:0 "Guarantee the Canadian Imperial Conference"
 AOEIW9_CAN_politics_p2_3_desc:0 "The position of Imperial Conference will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Canadian Imperial Partnership settlement."
 AOEIW9_CAN_politics_p2_4:0 "Broaden the Quebec Delegation"
 AOEIW9_CAN_politics_p2_4_desc:0 "Quebec Delegation will receive a wider role in consultation, administration and mobilisation. The Canadian Imperial Partnership project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_CAN_politics_p2_5:0 "Entrust the Ottawa Cabinet"
 AOEIW9_CAN_politics_p2_5_desc:0 "Responsibility now shifts toward Ottawa Cabinet, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Canadian Imperial Partnership system can govern through delegated institutions."
 AOEIW9_CAN_politics_p2_6:0 "A New Charter for Dominion of Canada"
 AOEIW9_CAN_politics_p2_6_desc:0 "A new constitutional charter will turn the Canadian Imperial Partnership programme into a durable framework for the Dominion of Canada. The document defines authority, representation and the limits of emergency power."
 AOEIW9_CAN_politics_p3_2:0 "Mobilise the Canadian Imperial Conference"
 AOEIW9_CAN_politics_p3_2_desc:0 "Imperial Conference will become an organising arm of the Canadian National Course programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_CAN_politics_p3_3:0 "Break the Quebec Delegation"
 AOEIW9_CAN_politics_p3_3_desc:0 "The independent power of Quebec Delegation is incompatible with the Canadian National Course project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_CAN_politics_p3_4:0 "Replace the Ottawa Cabinet"
 AOEIW9_CAN_politics_p3_4_desc:0 "Ottawa Cabinet will be removed from its gatekeeping role and replaced with officials loyal to the Canadian National Course settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_CAN_politics_p3_5:0 "Command the Parliament of Canada"
 AOEIW9_CAN_politics_p3_5_desc:0 "Parliament of Canada will answer directly to the authorities created by the Canadian National Course path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_CAN_politics_p3_6:0 "The Canadian National Course Settlement"
 AOEIW9_CAN_politics_p3_6_desc:0 "The political struggle around A Canadian National Course reaches a formal settlement. Its terms determine which institutions retain autonomy and which are subordinated to the Canadian National Course order."
 AOEIW9_CAN_politics_settlement:0 "The Dominion Settlement"
 AOEIW9_CAN_politics_settlement_desc:0 "The chosen settlement gives Parliament of Canada, Privy Council and Provincial Premiers a defined chain of authority instead of overlapping vetoes. the Dominion of Canada can now govern through institutions that match the political order selected by the player."
 AOEIW9_CAN_eco_root:0 "The Canadian Great Lakes Industry Review"
 AOEIW9_CAN_eco_root_desc:0 "Great Lakes Industry, Canadian Pacific Railway and Montreal Engineering do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Dominion of Canada can expand fastest."
 AOEIW9_CAN_eco_civ_2:0 "Rails to Canadian Pacific Railway"
 AOEIW9_CAN_eco_civ_2_desc:0 "Rail connections serving Canadian Pacific Railway will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_CAN_eco_civ_5:0 "The Prairie Development Board Expansion"
 AOEIW9_CAN_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Prairie Development Board. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_CAN_eco_civ_6:0 "Renew Halifax Shipyards"
 AOEIW9_CAN_eco_civ_6_desc:0 "Halifax Shipyards will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_CAN_eco_civ_7:0 "A Second Shift in Canadian Great Lakes Industry"
 AOEIW9_CAN_eco_civ_7_desc:0 "Great Lakes Industry has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth. In Canada, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_CAN_eco_civ_8:0 "Public Works at Canadian Pacific Railway"
 AOEIW9_CAN_eco_civ_8_desc:0 "Housing, roads, utilities and local construction around Canadian Pacific Railway will be treated as part of the productive economy. Removing these bottlenecks makes later factory expansion cheaper and faster."
 AOEIW9_CAN_eco_war_1:0 "The Ontario Steel Belt Armaments Audit"
 AOEIW9_CAN_eco_war_1_desc:0 "An armaments audit will determine which parts of Ontario Steel Belt can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_CAN_eco_war_2:0 "War Orders for Prairie Development Board"
 AOEIW9_CAN_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Prairie Development Board, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_CAN_eco_war_3:0 "Precision Tools for Halifax Shipyards"
 AOEIW9_CAN_eco_war_3_desc:0 "Precision machine tools will be prioritised for Halifax Shipyards, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_CAN_eco_war_4:0 "Expand Canadian Great Lakes Industry for Rearmament"
 AOEIW9_CAN_eco_war_4_desc:0 "New military production capacity will be built around Great Lakes Industry, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile. In Canada, the programme is measured against local transport, labour and industrial capacity."
 AOEIW9_CAN_eco_war_5:0 "Standardise Canadian Pacific Railway"
 AOEIW9_CAN_eco_war_5_desc:0 "Factories tied to Canadian Pacific Railway will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_CAN_eco_war_6:0 "Night Production at Montreal Engineering"
 AOEIW9_CAN_eco_war_6_desc:0 "Night production will be organised at Montreal Engineering with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_CAN_eco_war_7:0 "Long-Term Contracts for Ontario Steel Belt"
 AOEIW9_CAN_eco_war_7_desc:0 "Long-term contracts will give Ontario Steel Belt a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_CAN_eco_science_1:0 "Endow National Research Council"
 AOEIW9_CAN_eco_science_1_desc:0 "Stable public funding will give National Research Council laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_CAN_eco_science_2:0 "New Laboratories at McGill Laboratories"
 AOEIW9_CAN_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of McGill Laboratories. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_CAN_eco_science_3:0 "Applied Research at University of Toronto Engineering"
 AOEIW9_CAN_eco_science_3_desc:0 "University of Toronto Engineering will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_CAN_eco_science_4:0 "Industrial Physics at National Research Council"
 AOEIW9_CAN_eco_science_4_desc:0 "Industrial physics at National Research Council will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_CAN_eco_science_5:0 "Production Science at McGill Laboratories"
 AOEIW9_CAN_eco_science_5_desc:0 "Researchers at McGill Laboratories will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_CAN_eco_science_6:0 "Research Grants for University of Toronto Engineering"
 AOEIW9_CAN_eco_science_6_desc:0 "A national grant programme will connect University of Toronto Engineering to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_CAN_eco_infra_2:0 "Freight Capacity at Ontario Steel Belt"
 AOEIW9_CAN_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Ontario Steel Belt will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_CAN_eco_infra_3:0 "Workers' Housing at Prairie Development Board"
 AOEIW9_CAN_eco_infra_3_desc:0 "Worker housing near Prairie Development Board will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_CAN_eco_infra_4:0 "Logistics through Halifax Shipyards"
 AOEIW9_CAN_eco_infra_4_desc:0 "Halifax Shipyards will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_CAN_eco_final:0 "The Dominion Industrial System"
 AOEIW9_CAN_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a canadian economy able to convert regional strengths into sustained national output."
 AOEIW9_CAN_mil_root:0 "Review the Canadian General Staff"
 AOEIW9_CAN_mil_root_desc:0 "The Canadian General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_CAN_mil_army_2:0 "Permanent Active Militia Field Manoeuvres"
 AOEIW9_CAN_mil_army_2_desc:0 "Large field exercises with the Permanent Active Militia will test mobilisation schedules, communications and combined-arms procedure under realistic conditions. The lessons will be written into training rather than left as parade-ground experience."
 AOEIW9_CAN_mil_army_5:0 "Motorise the Kingston Staff College"
 AOEIW9_CAN_mil_army_5_desc:0 "Motor transport assigned to the Kingston Staff College will be organised around supply, maintenance and operational movement instead of scattered staff cars. Motorisation is used to increase tempo without creating a fuel-and-truck sink the army cannot sustain."
 AOEIW9_CAN_mil_army_6:0 "Staff Procedures at the Canadian General Staff"
 AOEIW9_CAN_mil_army_6_desc:0 "Staff officers at the Canadian General Staff will standardise orders, maps, communications and planning cycles. Better staff work reduces the gap between a plan written at headquarters and what formations can execute in the field."
 AOEIW9_CAN_mil_army_7:0 "Armour Studies at the Permanent Active Militia"
 AOEIW9_CAN_mil_army_7_desc:0 "The Permanent Active Militia will study how armour can be integrated with infantry, artillery and logistics under canadian conditions. The objective is a usable armoured doctrine, not a handful of prestige tanks."
 AOEIW9_CAN_mil_army_8:0 "Operational Planning at the Royal Canadian Artillery"
 AOEIW9_CAN_mil_army_8_desc:0 "Operational planning with the Royal Canadian Artillery will connect mobilisation, supply and theatre objectives before war begins. Commanders are expected to plan campaigns that the transport network and reserves can actually sustain."
 AOEIW9_CAN_mil_army_9:0 "Doctrine at the Mechanized Brigade Board"
 AOEIW9_CAN_mil_army_9_desc:0 "The doctrine taught by Mechanized Brigade Board will be codified from exercises and staff studies. It gives officers a common language for manoeuvre, reinforcement and combined-arms operations."
 AOEIW9_CAN_mil_air_1:0 "Reorganise Royal Canadian Air Force"
 AOEIW9_CAN_mil_air_1_desc:0 "Royal Canadian Air Force will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_CAN_mil_air_2:0 "Fighter Instruction at Trenton Air Station"
 AOEIW9_CAN_mil_air_2_desc:0 "Trenton Air Station will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_CAN_mil_air_3:0 "Ground Support Doctrine under Commonwealth Air Schools"
 AOEIW9_CAN_mil_air_3_desc:0 "Commonwealth Air Schools will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_CAN_mil_air_4:0 "Extend the Range of Royal Canadian Air Force"
 AOEIW9_CAN_mil_air_4_desc:0 "Royal Canadian Air Force will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Dominion of Canada's geography and strategic commitments."
 AOEIW9_CAN_mil_air_5:0 "Radar Networks for Trenton Air Station"
 AOEIW9_CAN_mil_air_5_desc:0 "Trenton Air Station will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_CAN_mil_air_6:0 "Unify Command under Commonwealth Air Schools"
 AOEIW9_CAN_mil_air_6_desc:0 "Commonwealth Air Schools will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_CAN_mil_sea_1:0 "Review Royal Canadian Navy"
 AOEIW9_CAN_mil_sea_1_desc:0 "A full review of Royal Canadian Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_CAN_mil_sea_2:0 "Expand Halifax Dockyard"
 AOEIW9_CAN_mil_sea_2_desc:0 "Halifax Dockyard will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_CAN_mil_sea_3:0 "Fleet Manoeuvres with Pacific Squadron"
 AOEIW9_CAN_mil_sea_3_desc:0 "Fleet exercises with Pacific Squadron will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_CAN_mil_sea_4:0 "Screening Doctrine for Royal Canadian Navy"
 AOEIW9_CAN_mil_sea_4_desc:0 "Royal Canadian Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_CAN_mil_sea_5:0 "Naval Aviation at Halifax Dockyard"
 AOEIW9_CAN_mil_sea_5_desc:0 "Naval aviation will be integrated with Halifax Dockyard for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_CAN_mil_sea_6:0 "New Hulls for Pacific Squadron"
 AOEIW9_CAN_mil_sea_6_desc:0 "New hull standards for Pacific Squadron will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_CAN_mil_final:0 "Canadian Combined-Arms Doctrine"
 AOEIW9_CAN_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Dominion of Canada now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_CAN_dip_root:0 "Define the Northern Atlantic Doctrine"
 AOEIW9_CAN_dip_root_desc:0 "The Dominion of Canada must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_CAN_dip_a_2:0 "Send a Mission on the Imperial Connection"
 AOEIW9_CAN_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Imperial Connection. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_CAN_dip_a_3:0 "Economic Leverage over the Imperial Connection"
 AOEIW9_CAN_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Imperial Connection. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_CAN_dip_a_4:0 "Staff Talks on the Imperial Connection"
 AOEIW9_CAN_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the Imperial Connection. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_CAN_dip_a_5:0 "A Formal Warning over the Imperial Connection"
 AOEIW9_CAN_dip_a_5_desc:0 "A formal warning over the Imperial Connection will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_CAN_dip_a_6:0 "Terms for the Imperial Connection"
 AOEIW9_CAN_dip_a_6_desc:0 "Terms for an ultimatum on the Imperial Connection will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_CAN_dip_b_1:0 "The American Neighbour"
 AOEIW9_CAN_dip_b_1_desc:0 "The American Neighbour will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Dominion of Canada actually wants before pressure is applied."
 AOEIW9_CAN_dip_b_2:0 "Send a Mission on the American Neighbour"
 AOEIW9_CAN_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the American Neighbour. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_CAN_dip_b_3:0 "Economic Leverage over the American Neighbour"
 AOEIW9_CAN_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the American Neighbour. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_CAN_dip_b_4:0 "Staff Talks on the American Neighbour"
 AOEIW9_CAN_dip_b_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the American Neighbour. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_CAN_dip_b_5:0 "A Formal Warning over the American Neighbour"
 AOEIW9_CAN_dip_b_5_desc:0 "A formal warning over the American Neighbour will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_CAN_dip_b_6:0 "Terms for the American Neighbour"
 AOEIW9_CAN_dip_b_6_desc:0 "Terms for an ultimatum on the American Neighbour will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_CAN_dip_final:0 "Canada's Atlantic Commitments"
 AOEIW9_CAN_dip_final_desc:0 "The Dominion of Canada's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_CHI_focus_tree:0 "Chinese Empire Focus Tree"
 AOEIW9_CHI_eco_root:0 "The Hanyang Arsenal Review"
 AOEIW9_CHI_eco_root_desc:0 "Hanyang Arsenal, Yangtze Workshops and Manchurian Industry do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Chinese Empire can expand fastest."
 AOEIW9_CHI_eco_civ_1:0 "Survey the Hanyang Arsenal"
 AOEIW9_CHI_eco_civ_1_desc:0 "A detailed survey of Hanyang Arsenal will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_CHI_eco_civ_2:0 "Rails to Yangtze Workshops"
 AOEIW9_CHI_eco_civ_2_desc:0 "Rail connections serving Yangtze Workshops will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_CHI_eco_civ_3:0 "Capital for Manchurian Industry"
 AOEIW9_CHI_eco_civ_3_desc:0 "State-backed credit will give Manchurian Industry access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_CHI_eco_civ_4:0 "Power for Shanghai Commerce"
 AOEIW9_CHI_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Shanghai Commerce. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_CHI_eco_civ_5:0 "The Kaiping Mines Expansion"
 AOEIW9_CHI_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Kaiping Mines. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_CHI_eco_civ_6:0 "Renew National Railway Board"
 AOEIW9_CHI_eco_civ_6_desc:0 "National Railway Board will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_CHI_eco_civ_7:0 "A Second Shift at Hanyang Arsenal"
 AOEIW9_CHI_eco_civ_7_desc:0 "Hanyang Arsenal has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_CHI_eco_war_1:0 "The Shanghai Commerce Armaments Audit"
 AOEIW9_CHI_eco_war_1_desc:0 "An armaments audit will determine which parts of Shanghai Commerce can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_CHI_eco_war_2:0 "War Orders for Kaiping Mines"
 AOEIW9_CHI_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Kaiping Mines, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_CHI_eco_war_3:0 "Precision Tools for National Railway Board"
 AOEIW9_CHI_eco_war_3_desc:0 "Precision machine tools will be prioritised for National Railway Board, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_CHI_eco_war_4:0 "Expand Hanyang Arsenal for Rearmament"
 AOEIW9_CHI_eco_war_4_desc:0 "New military production capacity will be built around Hanyang Arsenal, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_CHI_eco_war_5:0 "Standardise Yangtze Workshops"
 AOEIW9_CHI_eco_war_5_desc:0 "Factories tied to Yangtze Workshops will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_CHI_eco_war_6:0 "Night Production at Manchurian Industry"
 AOEIW9_CHI_eco_war_6_desc:0 "Night production will be organised at Manchurian Industry with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_CHI_eco_war_7:0 "Long-Term Contracts for Shanghai Commerce"
 AOEIW9_CHI_eco_war_7_desc:0 "Long-term contracts will give Shanghai Commerce a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_CHI_eco_war_8:0 "Mobilise Kaiping Mines for Full Production"
 AOEIW9_CHI_eco_war_8_desc:0 "Kaiping Mines will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_CHI_eco_science_1:0 "Endow Tsinghua Institute"
 AOEIW9_CHI_eco_science_1_desc:0 "Stable public funding will give Tsinghua Institute laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_CHI_eco_science_2:0 "New Laboratories at Imperial Academy"
 AOEIW9_CHI_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Imperial Academy. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_CHI_eco_science_3:0 "Applied Research at Nanjing Engineering Bureau"
 AOEIW9_CHI_eco_science_3_desc:0 "Nanjing Engineering Bureau will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_CHI_eco_science_4:0 "Industrial Physics at Tsinghua Institute"
 AOEIW9_CHI_eco_science_4_desc:0 "Industrial physics at Tsinghua Institute will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_CHI_eco_science_5:0 "Production Science at Imperial Academy"
 AOEIW9_CHI_eco_science_5_desc:0 "Researchers at Imperial Academy will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_CHI_eco_science_6:0 "Research Grants for Nanjing Engineering Bureau"
 AOEIW9_CHI_eco_science_6_desc:0 "A national grant programme will connect Nanjing Engineering Bureau to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_CHI_eco_science_7:0 "Link Tsinghua Institute to the Factories"
 AOEIW9_CHI_eco_science_7_desc:0 "Tsinghua Institute will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_CHI_eco_infra_1:0 "Energy for Manchurian Industry"
 AOEIW9_CHI_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Manchurian Industry, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_CHI_eco_infra_2:0 "Freight Capacity at Shanghai Commerce"
 AOEIW9_CHI_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Shanghai Commerce will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_CHI_eco_infra_3:0 "Workers' Housing at Kaiping Mines"
 AOEIW9_CHI_eco_infra_3_desc:0 "Worker housing near Kaiping Mines will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_CHI_eco_infra_4:0 "Logistics through National Railway Board"
 AOEIW9_CHI_eco_infra_4_desc:0 "National Railway Board will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_CHI_eco_final:0 "Industry for a Reunified Empire"
 AOEIW9_CHI_eco_final_desc:0 "Civilian investment, research, transport and armament production are now coordinated through one economic programme. The result is a chinese economy able to convert regional strengths into sustained national output."
 AOEIW9_CHI_mil_root:0 "Review the Beiyang General Staff"
 AOEIW9_CHI_mil_root_desc:0 "The Beiyang General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms."
 AOEIW9_CHI_mil_army_1:0 "The Army Training Commission"
 AOEIW9_CHI_mil_army_1_desc:0 "China must choose between equipping broad infantry fronts and concentrating its workshops on a smaller striking reserve. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_CHI_mil_army_2:0 "The National Rifle Army"
 AOEIW9_CHI_mil_army_2_desc:0 "China must choose between equipping broad infantry fronts and concentrating its workshops on a smaller striking reserve. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
