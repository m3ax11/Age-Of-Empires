 AOEIW9_ITA_dip_b_5_desc:0 "A formal warning over Mare Nostrum will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_ITA_dip_b_6:0 "Terms for Mare Nostrum"
 AOEIW9_ITA_dip_b_6_desc:0 "Terms for an ultimatum on Mare Nostrum will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_ITA_dip_b_7:0 "The Decision on Mare Nostrum"
 AOEIW9_ITA_dip_b_7_desc:0 "The government reaches the decision point on Mare Nostrum. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_ITA_dip_final:0 "Leadership of the Mediterranean League"
 AOEIW9_ITA_dip_final_desc:0 "The Kingdom of Italy's major diplomatic files are now tied to economic leverage, staff planning and defined political objectives. Foreign policy no longer consists of disconnected reactions to each new crisis."
 AOEIW9_JAP_focus_tree:0 "Japanese Empire Focus Tree"
 AOEIW9_JAP_politics_root:0 "An Empire on the Edge of Crisis"
 AOEIW9_JAP_politics_root_desc:0 "Imperial Diet, Privy Council and Army Ministry all claim a voice in the future of the Empire of Japan. A durable political order must define their rights now, before an emergency defines them by force."
 AOEIW9_JAP_politics_p1_1:0 "The Government Prevails"
 AOEIW9_JAP_politics_p1_1_desc:0 "The cabinet will isolate the coup plotters, purge the most reckless officers and preserve the Emperor above factional politics. Japan will expand through disciplined state policy rather than government by assassination."
 AOEIW9_JAP_politics_p1_2:0 "The Elder Statesmen Bend"
 AOEIW9_JAP_politics_p1_2_desc:0 "Senior advisers will accept the cabinet's programme rather than bring another ministry down behind palace doors. Their access to the Throne remains, but obstruction now carries a public cost."
 AOEIW9_JAP_politics_p1_3:0 "Reform the Army Ministry"
 AOEIW9_JAP_politics_p1_3_desc:0 "Army Ministry still operates under procedures shaped by an older political balance. Its rules, appointments and responsibilities will be revised to make it function under the Government Prevails settlement."
 AOEIW9_JAP_politics_p1_4:0 "Bind the Navy Ministry"
 AOEIW9_JAP_politics_p1_4_desc:0 "Navy Ministry will be tied to the Government Prevails programme through appointments, budgets and formal obligations. The aim is loyalty enforced by institutions rather than another temporary political bargain."
 AOEIW9_JAP_politics_p1_5:0 "Balance the Genrō Elders"
 AOEIW9_JAP_politics_p1_5_desc:0 "Neither abolishing Genrō Elders nor surrendering to it would produce a stable government. Its influence will be balanced against the other pillars of the Government Prevails coalition."
 AOEIW9_JAP_politics_p1_6:0 "Codify the Civil Bureaucracy"
 AOEIW9_JAP_politics_p1_6_desc:0 "Custom and emergency practice around Civil Bureaucracy will be replaced with written rules. Codification fixes its place in the Government Prevails order and limits future constitutional improvisation."
 AOEIW9_JAP_politics_p1_7:0 "Imperial Diet and Nation"
 AOEIW9_JAP_politics_p1_7_desc:0 "Imperial Diet will be presented as part of the national political order rather than a factional institution. The Government Prevails camp uses that settlement to bind legitimacy and administration together."
 AOEIW9_JAP_politics_p2_1:0 "The Imperial Way"
 AOEIW9_JAP_politics_p2_1_desc:0 "The Imperial Way faction promises a spiritual restoration led by young officers, agrarian patriots and the Army. Party cabinets and industrial cliques must submit to direct imperial rule."
 AOEIW9_JAP_politics_p2_2:0 "Open the Army Ministry"
 AOEIW9_JAP_politics_p2_2_desc:0 "Access to Army Ministry will be widened and its procedures made less dependent on closed patronage. The reform gives the Imperial Way camp a legal route to broaden its support without bypassing the state."
 AOEIW9_JAP_politics_p2_3:0 "Guarantee the Navy Ministry"
 AOEIW9_JAP_politics_p2_3_desc:0 "The position of Navy Ministry will be protected by statute and political guarantees. That security is the price of bringing it firmly into the Imperial Way settlement."
 AOEIW9_JAP_politics_p2_4:0 "Broaden the Genrō Elders"
 AOEIW9_JAP_politics_p2_4_desc:0 "Genrō Elders will receive a wider role in consultation, administration and mobilisation. The Imperial Way project gains a broader social base while keeping the institution inside a defined constitutional framework."
 AOEIW9_JAP_politics_p2_5:0 "Entrust the Civil Bureaucracy"
 AOEIW9_JAP_politics_p2_5_desc:0 "Responsibility now shifts toward Civil Bureaucracy, giving it real authority over implementation rather than a ceremonial voice. The move tests whether the Imperial Way system can govern through delegated institutions."
 AOEIW9_JAP_politics_p2_6:0 "Ratify the Imperial Diet"
 AOEIW9_JAP_politics_p2_6_desc:0 "A formal act of ratification will settle the place of Imperial Diet inside the new political order. Once accepted, the Imperial Way arrangement will rest on law and procedure instead of personal understandings."
 AOEIW9_JAP_politics_p2_7:0 "Government under the Meiji Constitution"
 AOEIW9_JAP_politics_p2_7_desc:0 "Ministers will claim the constitutional powers of cabinet and Diet against informal court pressure. Imperial sanction will confirm a government that can answer for its own policy."
 AOEIW9_JAP_politics_p3_1:0 "Civilian Ascendancy"
 AOEIW9_JAP_politics_p3_1_desc:0 "The Diet, civilian ministries and constitutional advisers will reclaim authority from the services. Restrained budgets and parliamentary oversight offer Japan a future beyond permanent military emergency."
 AOEIW9_JAP_politics_p3_2:0 "Mobilise the Navy Ministry"
 AOEIW9_JAP_politics_p3_2_desc:0 "Navy Ministry will become an organising arm of the Civilian Ascendancy programme, carrying the political struggle beyond cabinet rooms and into administration and public life."
 AOEIW9_JAP_politics_p3_3:0 "Break the Genrō Elders"
 AOEIW9_JAP_politics_p3_3_desc:0 "The independent power of Genrō Elders is incompatible with the Civilian Ascendancy project. Its patronage, vetoes and organisational autonomy will be dismantled before it can block the new order."
 AOEIW9_JAP_politics_p3_4:0 "Replace the Civil Bureaucracy"
 AOEIW9_JAP_politics_p3_4_desc:0 "Civil Bureaucracy will be removed from its gatekeeping role and replaced with officials loyal to the Civilian Ascendancy settlement. Institutional continuity is sacrificed for political control."
 AOEIW9_JAP_politics_p3_5:0 "Command the Imperial Diet"
 AOEIW9_JAP_politics_p3_5_desc:0 "Imperial Diet will answer directly to the authorities created by the Civilian Ascendancy path. The focus is not symbolism but control over appointments, information and implementation."
 AOEIW9_JAP_politics_p3_6:0 "Strip the Privy Council of Its Veto"
 AOEIW9_JAP_politics_p3_6_desc:0 "Treaties and emergency ordinances will no longer be stopped by life-appointed councillors acting beyond scrutiny. Advice to the Emperor will not become a third chamber."
 AOEIW9_JAP_politics_p3_7:0 "The Diet Commands the Cabinet"
 AOEIW9_JAP_politics_p3_7_desc:0 "A ministry that loses the elected chamber must resign or face it again. Civilian ascendancy becomes a working rule of government."
 AOEIW9_JAP_politics_settlement:0 "The Emperor Names His Government"
 AOEIW9_JAP_politics_settlement_desc:0 "The contest among court, Diet and services ends when the Emperor commissions a government under rules all sides now understand. Tokyo has a chain of responsibility, however it was won."
 AOEIW9_JAP_eco_root:0 "The Tokyo-Yokohama Belt Review"
 AOEIW9_JAP_eco_root_desc:0 "Tokyo-Yokohama Belt, Osaka Arsenal and Kure Shipyards do not yet operate as parts of a single economic strategy. The government will measure capacity, transport and investment needs before deciding where the Empire of Japan can expand fastest."
 AOEIW9_JAP_eco_civ_1:0 "Survey the Tokyo-Yokohama Belt"
 AOEIW9_JAP_eco_civ_1_desc:0 "A detailed survey of Tokyo-Yokohama Belt will record plant capacity, labour, power supply and transport bottlenecks. Investment can then follow measured shortages instead of political guesswork."
 AOEIW9_JAP_eco_civ_2:0 "Rails to Osaka Arsenal"
 AOEIW9_JAP_eco_civ_2_desc:0 "Rail connections serving Osaka Arsenal will be expanded and brought into the national freight timetable. The project cuts transport delays while opening nearby districts to further construction."
 AOEIW9_JAP_eco_civ_3:0 "Capital for Kure Shipyards"
 AOEIW9_JAP_eco_civ_3_desc:0 "State-backed credit will give Kure Shipyards access to long-term capital for machinery, workshops and supporting infrastructure. The programme is designed to expand productive capacity rather than fund short-lived consumption."
 AOEIW9_JAP_eco_civ_4:0 "Power for Manchurian Industry"
 AOEIW9_JAP_eco_civ_4_desc:0 "New generating and transmission capacity will be directed toward Manchurian Industry. Reliable power allows heavier machinery, longer shifts and denser industrial development in the surrounding area."
 AOEIW9_JAP_eco_civ_5:0 "The Zaibatsu Credit Expansion"
 AOEIW9_JAP_eco_civ_5_desc:0 "Additional sites, utilities and construction capacity will be committed to Zaibatsu Credit. The expansion strengthens the civilian industrial base from which later rearmament can draw."
 AOEIW9_JAP_eco_civ_6:0 "Renew Korean Development"
 AOEIW9_JAP_eco_civ_6_desc:0 "Korean Development will receive modern equipment, revised management and better connections to suppliers. The objective is higher output from existing assets before another round of costly expansion."
 AOEIW9_JAP_eco_civ_7:0 "A Second Shift at Tokyo-Yokohama Belt"
 AOEIW9_JAP_eco_civ_7_desc:0 "Tokyo-Yokohama Belt has enough installed capacity to support longer operating hours. A second shift will raise utilisation while training the additional workforce needed for further industrial growth."
 AOEIW9_JAP_eco_war_1:0 "The Manchurian Industry Armaments Audit"
 AOEIW9_JAP_eco_war_1_desc:0 "An armaments audit will determine which parts of Manchurian Industry can be converted to military contracts without collapsing civilian supply. Machine capacity and bottlenecks will be recorded before new orders are placed."
 AOEIW9_JAP_eco_war_2:0 "War Orders for Zaibatsu Credit"
 AOEIW9_JAP_eco_war_2_desc:0 "Long-term armament contracts will be assigned to Zaibatsu Credit, giving firms the certainty to invest in tooling and trained labour. Rearmament becomes a production programme rather than a string of emergency purchases."
 AOEIW9_JAP_eco_war_3:0 "Precision Tools for Korean Development"
 AOEIW9_JAP_eco_war_3_desc:0 "Precision machine tools will be prioritised for Korean Development, improving the speed and consistency of military production. The investment raises what existing factories can sustain once orders expand."
 AOEIW9_JAP_eco_war_4:0 "Expand Tokyo-Yokohama Belt for Rearmament"
 AOEIW9_JAP_eco_war_4_desc:0 "New military production capacity will be built around Tokyo-Yokohama Belt, where suppliers and transport already exist. The expansion is intended to increase durable war output, not merely fill a temporary stockpile."
 AOEIW9_JAP_eco_war_5:0 "Standardise Osaka Arsenal"
 AOEIW9_JAP_eco_war_5_desc:0 "Factories tied to Osaka Arsenal will adopt common specifications, gauges and inspection rules. Standardisation reduces wasted changeovers and lets larger production runs hold their efficiency."
 AOEIW9_JAP_eco_war_6:0 "Night Production at Kure Shipyards"
 AOEIW9_JAP_eco_war_6_desc:0 "Night production will be organised at Kure Shipyards with proper maintenance and labour rotations. Longer hours are useful only if output can rise without destroying machinery or exhausting skilled workers."
 AOEIW9_JAP_eco_war_7:0 "Long-Term Contracts for Manchurian Industry"
 AOEIW9_JAP_eco_war_7_desc:0 "Long-term contracts will give Manchurian Industry a predictable stream of military orders, allowing investment in tooling, quality control and skilled labour. Procurement is turned into a sustained industrial relationship instead of a rush of short tenders."
 AOEIW9_JAP_eco_war_8:0 "Mobilise Zaibatsu Credit for Full Production"
 AOEIW9_JAP_eco_war_8_desc:0 "Zaibatsu Credit will be drawn fully into the armament programme through priority materials, labour allocations and production schedules. Mobilisation means coordinating output across the supply chain rather than simply ordering longer shifts."
 AOEIW9_JAP_eco_science_1:0 "Endow RIKEN Institute"
 AOEIW9_JAP_eco_science_1_desc:0 "Stable public funding will give RIKEN Institute laboratories, staff and a predictable research budget. The institution is expected to solve industrial and military problems, not merely accumulate academic prestige."
 AOEIW9_JAP_eco_science_2:0 "New Laboratories at Tokyo Imperial University"
 AOEIW9_JAP_eco_science_2_desc:0 "New laboratories and technical staff will expand the capacity of Tokyo Imperial University. The enlarged institution will work directly with industry so that research can move from paper to production."
 AOEIW9_JAP_eco_science_3:0 "Applied Research at Naval Technical Department"
 AOEIW9_JAP_eco_science_3_desc:0 "Naval Technical Department will be pushed toward applied research with clear industrial partners and measurable technical goals. Projects that can be manufactured receive priority over prestige work with no production path."
 AOEIW9_JAP_eco_science_4:0 "Industrial Physics at RIKEN Institute"
 AOEIW9_JAP_eco_science_4_desc:0 "Industrial physics at RIKEN Institute will focus on materials, measurement, electronics and processes that factories can actually use. Research becomes a tool for raising the technical ceiling of the economy."
 AOEIW9_JAP_eco_science_5:0 "Production Science at Tokyo Imperial University"
 AOEIW9_JAP_eco_science_5_desc:0 "Researchers at Tokyo Imperial University will study workflow, tooling and quality control alongside conventional engineering. Better production science should make new designs easier to build in large numbers."
 AOEIW9_JAP_eco_science_6:0 "Research Grants for Naval Technical Department"
 AOEIW9_JAP_eco_science_6_desc:0 "A national grant programme will connect Naval Technical Department to ministries and major firms. Competitive funding is intended to keep promising research moving even when individual institutions lack the budget to continue it."
 AOEIW9_JAP_eco_science_7:0 "Link RIKEN Institute to the Factories"
 AOEIW9_JAP_eco_science_7_desc:0 "RIKEN Institute will be linked directly to factory design offices, testing departments and production engineers. Research results will be judged by whether they can move into reliable mass production."
 AOEIW9_JAP_eco_infra_1:0 "Energy for Kure Shipyards"
 AOEIW9_JAP_eco_infra_1_desc:0 "Generating capacity and grid investment will be directed toward Kure Shipyards, where unreliable power is holding back productive use of existing assets. The project treats electricity as industrial infrastructure rather than a separate public-works programme."
 AOEIW9_JAP_eco_infra_2:0 "Freight Capacity at Manchurian Industry"
 AOEIW9_JAP_eco_infra_2_desc:0 "Freight yards, rolling stock and scheduling serving Manchurian Industry will be expanded. More reliable movement of coal, steel and machinery reduces shortages that would otherwise idle factories."
 AOEIW9_JAP_eco_infra_3:0 "Workers' Housing at Zaibatsu Credit"
 AOEIW9_JAP_eco_infra_3_desc:0 "Worker housing near Zaibatsu Credit will expand alongside industry instead of after it. Stable accommodation and local services make it possible to sustain a larger skilled workforce without creating an urban bottleneck."
 AOEIW9_JAP_eco_infra_4:0 "Logistics through Korean Development"
 AOEIW9_JAP_eco_infra_4_desc:0 "Korean Development will be integrated into national freight and supply planning. Rail, road and depot investment is coordinated so that industrial output can reach both civilian markets and the armed forces."
 AOEIW9_JAP_eco_final:0 "Orders for Mitsubishi and Mitsui"
 AOEIW9_JAP_eco_final_desc:0 "Shipyards, banks and heavy works in the great combines receive coordinated state orders. In return, their steel, credit and shipping answer to the mobilisation schedule."
 AOEIW9_JAP_mil_root:0 "Review the Imperial General Staff in Empire of Japan"
 AOEIW9_JAP_mil_root_desc:0 "The Imperial General Staff must turn old prestige into a force able to fight an industrial war with modern communications, logistics and combined arms. For Japan, the reform is judged by whether existing formations can use it under realistic mobilisation and supply limits."
 AOEIW9_JAP_mil_army_1:0 "The Kwantung Army Manoeuvres"
 AOEIW9_JAP_mil_army_1_desc:0 "Field exercises will test whether continental formations can move ammunition, fuel and radios as quickly as headquarters move arrows on a map. Tokyo will receive the results before approving expansion."
 AOEIW9_JAP_mil_army_2:0 "The Regimental Battle"
 AOEIW9_JAP_mil_army_2_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. Choose the infantry programme. The armoured specialisation is excluded, but tank research and production remain available."
 AOEIW9_JAP_mil_army_3:0 "Infantry Guns and Forward Observers"
 AOEIW9_JAP_mil_army_3_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_4:0 "Master the Infantry Battle"
 AOEIW9_JAP_mil_army_4_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_5:0 "Independent Tank Groups"
 AOEIW9_JAP_mil_army_5_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. Choose the armoured programme. The infantry specialisation is excluded, but infantry research and production remain available."
 AOEIW9_JAP_mil_army_6:0 "Tank Schools and Recovery Crews"
 AOEIW9_JAP_mil_army_6_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_7:0 "Exploit the Armoured Breakthrough"
 AOEIW9_JAP_mil_army_7_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_8:0 "One Supply Service"
 AOEIW9_JAP_mil_army_8_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_9:0 "All Arms Staff Exercises"
 AOEIW9_JAP_mil_army_9_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_army_10:0 "An Army Built for Its Mission"
 AOEIW9_JAP_mil_army_10_desc:0 "Japan can refine light regimental operations or invest scarce instructors and fuel in a modern armoured force. This programme develops the training, equipment or support required by our chosen army. Shared services remain available to either specialisation."
 AOEIW9_JAP_mil_air_1:0 "Reorganise Imperial Japanese Army Air Service"
 AOEIW9_JAP_mil_air_1_desc:0 "Imperial Japanese Army Air Service will be reorganised around squadrons, maintenance, pilot training and a command structure suited to sustained operations. Aircraft numbers matter only if the service can keep them flying."
 AOEIW9_JAP_mil_air_2:0 "Fighter Instruction at Naval Air Bureau"
 AOEIW9_JAP_mil_air_2_desc:0 "Naval Air Bureau will expand fighter instruction, formation flying and combat training for new pilots. Standardised schooling is intended to turn aircraft deliveries into effective squadrons rather than undertrained reserves."
 AOEIW9_JAP_mil_air_3:0 "Ground Support Doctrine under Combined Air Command"
 AOEIW9_JAP_mil_air_3_desc:0 "Combined Air Command will develop procedures for air-ground liaison, forward control and close support of field formations. The air arm learns to influence battles instead of operating as a separate prestige service."
 AOEIW9_JAP_mil_air_4:0 "Extend the Range of Imperial Japanese Army Air Service"
 AOEIW9_JAP_mil_air_4_desc:0 "Imperial Japanese Army Air Service will improve navigation, fuel planning and aircraft range so that missions can reach the distances demanded by the Empire of Japan's geography and strategic commitments."
 AOEIW9_JAP_mil_air_5:0 "Radar Networks for Naval Air Bureau"
 AOEIW9_JAP_mil_air_5_desc:0 "Naval Air Bureau will receive better radar, signals and reporting networks. Faster detection and control let limited aircraft concentrate where they are needed instead of wasting sorties on blind patrols."
 AOEIW9_JAP_mil_air_6:0 "Unify Command under Combined Air Command"
 AOEIW9_JAP_mil_air_6_desc:0 "Combined Air Command will become the centre of a unified command system for fighter, bomber and support aviation. Common tasking and logistics replace competing service channels."
 AOEIW9_JAP_mil_air_7:0 "Imperial Japanese Army Air Service Comes of Age"
 AOEIW9_JAP_mil_air_7_desc:0 "Imperial Japanese Army Air Service now has the schools, command network and operational doctrine required for a modern air arm. Further expansion can build on a functioning system rather than improvisation."
 AOEIW9_JAP_mil_sea_1:0 "Review Imperial Japanese Navy"
 AOEIW9_JAP_mil_sea_1_desc:0 "A full review of Imperial Japanese Navy will compare ships on paper with crews, maintenance, ammunition and actual readiness. The navy must know what it can keep at sea before planning a larger fleet."
 AOEIW9_JAP_mil_sea_2:0 "Expand Kure Naval Arsenal"
 AOEIW9_JAP_mil_sea_2_desc:0 "Kure Naval Arsenal will receive additional dockyard, repair and supply capacity. Expanding the shore establishment is necessary if new hulls are to become usable fleets instead of vessels waiting for maintenance."
 AOEIW9_JAP_mil_sea_3:0 "Fleet Manoeuvres with Combined Fleet"
 AOEIW9_JAP_mil_sea_3_desc:0 "Fleet exercises with Combined Fleet will test signalling, screening, gunnery and damage control under operational conditions. Lessons from the manoeuvres will feed directly into doctrine and training."
 AOEIW9_JAP_mil_sea_4:0 "Screening Doctrine for Imperial Japanese Navy"
 AOEIW9_JAP_mil_sea_4_desc:0 "Imperial Japanese Navy will formalise destroyer and cruiser screening tactics to protect larger ships and convoys. The fleet is trained to operate as a system rather than a collection of prestigious hulls."
 AOEIW9_JAP_mil_sea_5:0 "Naval Aviation at Kure Naval Arsenal"
 AOEIW9_JAP_mil_sea_5_desc:0 "Naval aviation will be integrated with Kure Naval Arsenal for reconnaissance, strike coordination and fleet air defence. Aircraft become part of maritime planning instead of an afterthought borrowed from the air force."
 AOEIW9_JAP_mil_sea_6:0 "New Hulls for Combined Fleet"
 AOEIW9_JAP_mil_sea_6_desc:0 "New hull standards for Combined Fleet will emphasise machinery, range, protection and designs the dockyards can build repeatedly. Modernisation is tied to a sustainable construction programme rather than one-off flagships."
 AOEIW9_JAP_mil_sea_7:0 "Sea Command under Imperial Japanese Navy"
 AOEIW9_JAP_mil_sea_7_desc:0 "Imperial Japanese Navy will receive the doctrine, shore support and command arrangements needed to contest the sea lanes that matter to the Empire of Japan. The objective is effective control where it counts, not symbolic global reach."
 AOEIW9_JAP_mil_final:0 "Decisive Battle"
 AOEIW9_JAP_mil_final_desc:0 "The reforms undertaken across training, logistics and specialist arms are brought into a single operational system. the Empire of Japan now fields a military doctrine built around institutions it has actually developed rather than generic prestige."
 AOEIW9_JAP_dip_root:0 "Define the Imperial Expansion Doctrine"
 AOEIW9_JAP_dip_root_desc:0 "Japanese Empire must decide which borders, markets and strategic approaches are vital enough to justify sustained diplomatic pressure."
 AOEIW9_JAP_dip_a_1:0 "The China Incident"
 AOEIW9_JAP_dip_a_1_desc:0 "The China Incident will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Empire of Japan actually wants before pressure is applied."
 AOEIW9_JAP_dip_a_2:0 "Send a Mission on the China Incident"
 AOEIW9_JAP_dip_a_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the China Incident. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_JAP_dip_a_3:0 "Economic Leverage over the China Incident"
 AOEIW9_JAP_dip_a_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the China Incident. Economic pressure is calibrated to force negotiation without committing the army prematurely."
 AOEIW9_JAP_dip_a_4:0 "Staff Talks on the China Incident"
 AOEIW9_JAP_dip_a_4_desc:0 "General staffs will compare maps, mobilisation assumptions and border contingencies connected to the China Incident. Military planning gives diplomats a realistic sense of what escalation would actually cost."
 AOEIW9_JAP_dip_a_5:0 "A Formal Warning over the China Incident"
 AOEIW9_JAP_dip_a_5_desc:0 "A formal warning over the China Incident will state the government's red lines and the consequences of ignoring them. The message is intended to remove ambiguity before a crisis becomes a war by accident."
 AOEIW9_JAP_dip_a_6:0 "Terms for the China Incident"
 AOEIW9_JAP_dip_a_6_desc:0 "Terms for an ultimatum on the China Incident will be drafted alongside mobilisation and economic contingency plans. The government will not issue demands it is unprepared to enforce."
 AOEIW9_JAP_dip_a_7:0 "The Decision on the China Incident"
 AOEIW9_JAP_dip_a_7_desc:0 "The government reaches the decision point on the China Incident. If compromise has failed, the diplomatic file now contains the political case, military preparations and economic measures required for a final confrontation."
 AOEIW9_JAP_dip_b_1:0 "The Northern Strategy"
 AOEIW9_JAP_dip_b_1_desc:0 "The Northern Strategy will be placed formally on the cabinet agenda, with diplomatic, economic and military departments required to define what the Empire of Japan actually wants before pressure is applied."
 AOEIW9_JAP_dip_b_2:0 "Send a Mission on the Northern Strategy"
 AOEIW9_JAP_dip_b_2_desc:0 "A mission will be sent to gather commitments, test the other side's room for compromise and establish a direct channel over the Northern Strategy. Negotiators are given objectives rather than a ceremonial itinerary."
 AOEIW9_JAP_dip_b_3:0 "Economic Leverage over the Northern Strategy"
 AOEIW9_JAP_dip_b_3_desc:0 "Tariffs, credit, transit rights and access to strategic goods will be used to increase leverage over the Northern Strategy. Economic pressure is calibrated to force negotiation without committing the army prematurely."
