 AOEIW16_FRA_communal_congress:0 "Communal Congress"
 AOEIW16_FRA_communal_congress_long:0 "Congress of Workers' and Soldiers' Communes"
 AOEIW16_workers_international:0 "Workers' International"
 AOEIW16_constitutional_entente:0 "Constitutional Entente"

 AOEIW9_FRA_politics_p3_1:0 "Organise the Paris Factory Committees"
 AOEIW9_FRA_politics_p3_1_desc:0 "Union delegates and socialist organisers are turning the workshops of Paris into a parallel political authority. Supporting them openly begins a confrontation the Bonapartist state cannot ignore."
 AOEIW9_FRA_politics_p3_2:0 "Call the General Strike"
 AOEIW9_FRA_politics_p3_2_desc:0 "Rail depots, mines, arsenals and factories will stop together. The strike can break the imperial administration, but every idle machine deepens the economic cost of revolution."
 AOEIW9_FRA_politics_p3_3:0 "Arm the Workers"
 AOEIW9_FRA_politics_p3_3_desc:0 "Factory guards and veterans' leagues will distribute rifles to reliable committees. The revolution gains a shield, while the state loses its monopoly on armed force."
 AOEIW9_FRA_politics_p3_4:0 "Break the Bonapartist Chain of Command"
 AOEIW9_FRA_politics_p3_4_desc:0 "Orders from the imperial ministries now compete with appeals from soldiers' councils. Breaking the old chain of command is necessary, but it will leave the army dangerously disorganised."
 AOEIW9_FRA_politics_p3_5:0 "Welcome the Military Defections"
 AOEIW9_FRA_politics_p3_5_desc:0 "Regiments in the Paris basin and industrial north are declaring for the committees. Their officers must either serve under civilian revolutionary authority or surrender their commands."
 AOEIW9_FRA_politics_p3_6:0 "Shatter the Imperial Ministries"
 AOEIW9_FRA_politics_p3_6_desc:0 "The prefectures, Senate and Bonapartist ministries have lost the means to govern. Their remaining authority will be dissolved and transferred to elected communal delegates."
 AOEIW9_FRA_politics_p3_7:0 "Congress of the French Commune"
 AOEIW9_FRA_politics_p3_7_desc:0 "Delegates from the unions, factory committees, soldiers and provinces will meet in Paris to proclaim a new France founded upon workers' power."

 AOEIW16_FRA_stabilise_factory_committees:0 "Stabilise the Factory Committees"
 AOEIW16_FRA_stabilise_factory_committees_desc:0 "Emergency seizures must become accountable administration. Elected production boards will restore schedules, settle wages and restart stalled lines."
 AOEIW16_FRA_council_production_quotas:0 "Council Production Quotas"
 AOEIW16_FRA_council_production_quotas_desc:0 "Paris and the northern industrial basin will receive coordinated quotas, machine allocations and guaranteed military orders."
 AOEIW16_FRA_mass_rifle_programme:0 "The Mass Rifle Programme"
 AOEIW16_FRA_mass_rifle_programme_desc:0 "Standard parts, simplified finishes and worker-led quality circles will let French arsenals arm a citizen army at unprecedented cost. This programme applies specifically to infantry equipment."
 AOEIW16_FRA_communal_arsenals:0 "Communal Arsenals"
 AOEIW16_FRA_communal_arsenals_desc:0 "Support equipment and artillery workshops will be reorganised around common drawings and pooled machine tools."
 AOEIW16_FRA_national_factory_congress:0 "National Factory Congress"
 AOEIW16_FRA_national_factory_congress_desc:0 "Delegates from every major industrial district will coordinate output as a national system without abolishing local shop-floor control."
 AOEIW16_FRA_maximum_efficiency_directive:0 "Maximum Efficiency Directive"
 AOEIW16_FRA_maximum_efficiency_directive_desc:0 "Long production runs, protected tooling and shared technical standards will give the Commune one of the world's highest sustainable production-efficiency ceilings."
 AOEIW16_FRA_citizen_army:0 "The Citizen Army"
 AOEIW16_FRA_citizen_army_desc:0 "The revolutionary militias will become the foundation of a mass army whose authority flows from the Commune rather than a vanished court."
 AOEIW16_FRA_militias_into_line_divisions:0 "Militias into Line Divisions"
 AOEIW16_FRA_militias_into_line_divisions_desc:0 "Training cadres will turn enthusiastic battalions into dependable infantry formations with engineers, signals and medical support."
 AOEIW16_FRA_mass_war_staff:0 "The Mass-War Staff"
 AOEIW16_FRA_mass_war_staff_desc:0 "A new general staff will plan for reinforcement, recovery and the continuous employment of a vast citizen army instead of a small professional force."
 AOEIW16_FRA_workers_aviation:0 "Workers' Aviation"
 AOEIW16_FRA_workers_aviation_desc:0 "Aircraft mechanics, pilots and factory delegates will rebuild French aviation around rapid replacement and close support of the citizen army."
 AOEIW16_FRA_replacement_airframes:0 "Replacement Airframes"
 AOEIW16_FRA_replacement_airframes_desc:0 "Simplified fighters and close-air-support aircraft will be designed for quick manufacture, field repair and replacement after losses."
 AOEIW16_FRA_naval_loyalty_convention:0 "Naval Loyalty Convention"
 AOEIW16_FRA_naval_loyalty_convention_desc:0 "Representatives of the Atlantic and Mediterranean fleets will settle the place of admirals, sailors' committees and naval bases under the Commune."
 AOEIW16_FRA_red_fleets:0 "The Red Fleets"
 AOEIW16_FRA_red_fleets_desc:0 "The navy will remain intact as a professional fighting force, but its crews and bases will serve the Commune under a new compact."
 AOEIW16_FRA_revolutionary_diplomacy:0 "Revolutionary Diplomacy"
 AOEIW16_FRA_revolutionary_diplomacy_desc:0 "The collapse of the Old Order leaves France free to cultivate workers' governments abroad and oppose hostile coalitions."
 AOEIW16_FRA_workers_international:0 "Found the Workers' International"
 AOEIW16_FRA_workers_international_desc:0 "France will establish an independent revolutionary alliance open to governments prepared to defend workers' power."
 AOEIW16_FRA_fortress_commune:0 "Fortress Commune"
 AOEIW16_FRA_fortress_commune_desc:0 "No foreign capital will dictate the revolution. France will rely upon armed neutrality, internal cohesion and the strength of its own citizen army."
 AOEIW16_FRA_arsenal_of_the_commune:0 "Arsenal of the Commune"
 AOEIW16_FRA_arsenal_of_the_commune_desc:0 "Factory councils, communal arsenals, worker aviation and a loyal fleet now sustain an immense citizen army. The revolutionary transition is complete."

 AOEIW16_FRA_strike_wave:0 "Nationwide Strike Wave"
 AOEIW16_FRA_strike_wave_desc:0 "The general strike paralyses production and administration while factory committees contest the imperial state."
 AOEIW16_FRA_revolutionary_command_crisis:0 "Revolutionary Command Crisis"
 AOEIW16_FRA_revolutionary_command_crisis_desc:0 "Competing orders, political defections and absent officers have badly disrupted army organisation and planning."
 AOEIW16_FRA_postrevolution_industry_disruption:0 "Disrupted Communal Industry"
 AOEIW16_FRA_postrevolution_industry_disruption_desc:0 "The old owners have fled or been removed, but the new production councils have not yet restored reliable output."
 AOEIW16_FRA_postrevolution_command_disruption:0 "Disrupted Revolutionary Command"
 AOEIW16_FRA_postrevolution_command_disruption_desc:0 "The imperial chain of command is gone; a credible communal command structure has yet to replace it."
 AOEIW16_FRA_admirals_compromise:0 "The Admirals' Compromise"
 AOEIW16_FRA_admirals_compromise_desc:0 "Professional admirals retain operational authority while accepting civilian oversight and elected fleet delegates."
 AOEIW16_FRA_sailors_committees:0 "Sailors' Committees Ascendant"
 AOEIW16_FRA_sailors_committees_desc:0 "Revolutionary enthusiasm is high, but committee control temporarily slows dockyards and confuses fleet organisation."
 AOEIW16_FRA_factory_councils:0 "National Network of Factory Councils"
 AOEIW16_FRA_factory_councils_desc:0 "Worker-run factories share schedules, machinery and technical knowledge through a national council system."
 AOEIW16_FRA_maximum_efficiency_directive_spirit:0 "Maximum Efficiency Directive"
 AOEIW16_FRA_maximum_efficiency_directive_spirit_desc:0 "Protected tooling and long production runs allow unusually high peak efficiency without granting a generic cost reduction to every weapon."
 AOEIW16_FRA_mass_rifle_production:0 "Mass Rifle Production"
 AOEIW16_FRA_mass_rifle_production_desc:0 "Infantry weapons use standardised parts and simplified production methods, reducing their IC cost by 15 percent without affecting tanks, aircraft or ships."
 AOEIW16_FRA_communal_arsenals_spirit:0 "Communal Arsenals"
 AOEIW16_FRA_communal_arsenals_spirit_desc:0 "Pooled drawings and machine tools reduce the cost of support equipment and artillery."
 AOEIW16_FRA_citizen_army_spirit:0 "Citizen Army"
 AOEIW16_FRA_citizen_army_spirit_desc:0 "Mass participation accelerates mobilisation and expands the pool of people available for service."
 AOEIW16_FRA_mass_war_staff_spirit:0 "Mass-War Staff"
 AOEIW16_FRA_mass_war_staff_spirit_desc:0 "The new staff specialises in infantry operations, reinforcement and recovery for a very large army."
 AOEIW16_FRA_workers_air_production:0 "Worker-Run Aircraft Production"
 AOEIW16_FRA_workers_air_production_desc:0 "Simplified small airframes make fighters and close-support aircraft inexpensive to replace, while worker inspection reduces accidents."
 AOEIW16_FRA_red_fleets_spirit:0 "Atlantic and Mediterranean Red Fleets"
 AOEIW16_FRA_red_fleets_spirit_desc:0 "A durable settlement between crews, admirals and naval bases preserves the fleet as an effective revolutionary instrument."
 AOEIW16_FRA_revolutionary_diplomacy_spirit:0 "Revolutionary Diplomatic Service"
 AOEIW16_FRA_revolutionary_diplomacy_spirit_desc:0 "The Commune maintains disciplined foreign missions able to cultivate partners and identify hostile preparations."
 AOEIW16_FRA_fortress_commune_spirit:0 "Fortress Commune"
 AOEIW16_FRA_fortress_commune_spirit_desc:0 "Armed neutrality strengthens defence and cohesion, but demands additional resources from civilian consumption."
 AOEIW16_FRA_arsenal_of_the_commune_spirit:0 "Arsenal of the Commune"
 AOEIW16_FRA_arsenal_of_the_commune_spirit_desc:0 "The mature communal system combines high factory output, rapid reinforcement and the resilience required for mass war."

 aoeiw_phase16_fra.1.t:0 "The General Strike"
 aoeiw_phase16_fra.1.d:0 "From the Paris rail depots to the mines of the north, whistles fall silent. Some delegates demand a disciplined stoppage controlled by the unions; others are already occupying workshops and removing managers."
 aoeiw_phase16_fra.1.a:0 "Keep the strike under committee discipline."
 aoeiw_phase16_fra.1.b:0 "Let the factories be seized."
 aoeiw_phase16_fra.2.t:0 "Defections in the Army"
 aoeiw_phase16_fra.2.d:0 "Whole regiments have refused orders against the workers. Technical officers offer to keep supply and communications functioning if they are protected from reprisals, while militant delegates demand a complete purge of Bonapartist command."
 aoeiw_phase16_fra.2.a:0 "Retain officers who submit to the Commune."
 aoeiw_phase16_fra.2.b:0 "Purge the Bonapartist command."
 aoeiw_phase16_fra.3.t:0 "The French Commune Proclaimed"
 aoeiw_phase16_fra.3.d:0 "Under red banners in Paris, delegates of workers, soldiers and provincial communes have abolished the Second French Empire. Maurice Thorez is entrusted with leading the Congress while the new state struggles to restore production and command."
 aoeiw_phase16_fra.3.a:0 "Long live the French Commune!"
 aoeiw_phase16_fra.4.t:0 "The Loyalty of the Fleet"
 aoeiw_phase16_fra.4.d:0 "The Atlantic and Mediterranean fleets remain in port, intact but uncertain. Admirals insist that professional command must continue; sailors' committees argue that only direct revolutionary control can guarantee loyalty."
 aoeiw_phase16_fra.4.a:0 "Negotiate a compact with the admirals."
 aoeiw_phase16_fra.4.b:0 "Entrust the ships to sailors' committees."
 aoeiw_phase16_fra.5.t:0 "The Old Order Collapses"
 aoeiw_phase16_fra.5.d:0 "France has overthrown the Bonapartist monarchy and dismantled the alliance it once led. Vienna must either rally the remaining constitutional states or prepare to face the new Commune alone."
 aoeiw_phase16_fra.5.a:0 "Form a Constitutional Entente."
 aoeiw_phase16_fra.5.b:0 "Adopt armed neutrality."
 aoeiw_phase16_fra.6.t:0 "Belgium after the French Revolution"
 aoeiw_phase16_fra.6.d:0 "The alliance that secured Belgium has vanished, and a revolutionary power now stands across the border. Brussels must choose between Austrian partnership and an independent defence."
 aoeiw_phase16_fra.6.a:0 "Join Vienna's Constitutional Entente."
 aoeiw_phase16_fra.6.b:0 "Belgium will defend itself."

 AOEIW16_old_order_betrayed:0 "Revolutionary Rupture"
 AOEIW16_revolutionary_sympathy:0 "Revolutionary Solidarity"
