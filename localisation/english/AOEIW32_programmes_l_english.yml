 AOEIW32_GER_spd_bill:0 "Housing Bonds of the Ruhr"
 AOEIW32_GER_spd_bill_spirit:0 "Housing Bonds of the Ruhr"
 AOEIW32_GER_spd_bill_desc:0 "Municipalities accelerate housing works, drawing workers and material away from armaments.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_spd_bill_spirit_desc:0 "Municipalities accelerate housing works, drawing workers and material away from armaments. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_zentrum_bill:0 "The Länder Revenue Settlement"
 AOEIW32_GER_zentrum_bill_spirit:0 "The Länder Revenue Settlement"
 AOEIW32_GER_zentrum_bill_desc:0 "The centre finances provincial services in exchange for reliable parliamentary support. More stable government costs administrative capacity.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_zentrum_bill_spirit_desc:0 "The centre finances provincial services in exchange for reliable parliamentary support. More stable government costs administrative capacity. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_liberal_bill:0 "Competitive Industrial Tenders"
 AOEIW32_GER_liberal_bill_spirit:0 "Competitive Industrial Tenders"
 AOEIW32_GER_liberal_bill_desc:0 "Open tenders remove cartel privileges and raise production ceilings, but existing contracts must be renegotiated.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_liberal_bill_spirit_desc:0 "Open tenders remove cartel privileges and raise production ceilings, but existing contracts must be renegotiated. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_conservative_bill:0 "Parliamentary Rearmament Estimates"
 AOEIW32_GER_conservative_bill_spirit:0 "Parliamentary Rearmament Estimates"
 AOEIW32_GER_conservative_bill_desc:0 "The defence committee authorises accelerated arsenal contracts and postpones civilian works to pay for them.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_conservative_bill_spirit_desc:0 "The defence committee authorises accelerated arsenal contracts and postpones civilian works to pay for them. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_cdu_bill:0 "The Social Market Credit Window"
 AOEIW32_GER_cdu_bill_spirit:0 "The Social Market Credit Window"
 AOEIW32_GER_cdu_bill_desc:0 "Regional banks finance productive investment under negotiated social guarantees. The coalition spends political capital enforcing the settlement.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_cdu_bill_spirit_desc:0 "Regional banks finance productive investment under negotiated social guarantees. The coalition spends political capital enforcing the settlement. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_dstp_bill:0 "Independent Research Endowments"
 AOEIW32_GER_dstp_bill_spirit:0 "Independent Research Endowments"
 AOEIW32_GER_dstp_bill_desc:0 "Parliament shields research grants from party patronage while new audit procedures slow ministerial decisions.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_dstp_bill_spirit_desc:0 "Parliament shields research grants from party patronage while new audit procedures slow ministerial decisions. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_kpd_bill:0 "Elected Factory Councils"
 AOEIW32_GER_kpd_bill_spirit:0 "Elected Factory Councils"
 AOEIW32_GER_kpd_bill_desc:0 "Factory delegates impose emergency production agreements. Higher output comes with confrontations over managerial authority.\n\nRequires this party in government. Costs 75 political power. Lasts 180 days; all implementation bills share a 240-day legislative budget."
 AOEIW32_GER_kpd_bill_spirit_desc:0 "Factory delegates impose emergency production agreements. Higher output comes with confrontations over managerial authority. The funded measure expires after 180 days even if the cabinet changes."
 AOEIW32_GER_implementation:0 "The Legislative Programme"
 AOEIW32_GER_implementation_desc:0 "A coalition can fund one major implementation bill per legislative budget. Only serving parties may propose their programme."
