l_english:
 AOEIW25_FRA_workers_alternative:0 "§RThe Workers' Alternative§!"
 AOEIW25_FRA_workers_alternative_desc:0 "The Republic has failed to answer the bread queues, the veterans and the factory councils. France must decide whether reform can still save the old order or whether authority should pass openly to the organised working class."
 AOEIW25_GER_workers_front:0 "§RThe German Workers' Front§!"
 AOEIW25_GER_workers_front_desc:0 "The Reich's crisis need not end in nationalist dictatorship or dynastic restoration. The unions, factory committees and republican militias can instead prepare a third, revolutionary answer."
 AOEIW_FRA_national_path_shortcut:0 "National and Imperial Paths"
 AOEIW_FRA_communist_path_shortcut:0 "French Commune"
 AOEIW_FRA_armed_forces_shortcut:0 "Armed Forces"
 AOEIW_GER_workers_path_shortcut:0 "Workers' Germany"
 AOEIW25_SOV_path_of_the_soviets:0 "§RThe Path of the Soviets§!"
 AOEIW25_SOV_path_of_the_soviets_desc:0 "Factory committees, soldiers' councils and underground party cells can turn protest into a rival state. Choosing the Soviet path commits Russia to revolutionary mobilisation and the civil war that must decide who rules the country."
