 AOEIW_SOV_denikin_path_shortcut:0 "Denikin's Russia"
 AOEIW26_ENG_cabinet_government_act:0 "The Cabinet Government Act"
 AOEIW26_ENG_cabinet_government_act_desc:0 "A written settlement will define ministerial responsibility, the power of the Commons and the constitutional limits of royal intervention."
 AOEIW26_ENG_crown_in_parliament:0 "The Crown in Parliament"
 AOEIW26_ENG_crown_in_parliament_desc:0 "The monarchy will endure as part of a parliamentary constitution, lending continuity to reform without retaining a private political command."
 AOEIW26_ENG_imperial_parliament:0 "An Imperial Parliament"
 AOEIW26_ENG_imperial_parliament_desc:0 "Representatives of Britain and the dominions will meet in a permanent federal chamber with authority over defence, trade and foreign affairs."
 AOEIW26_ENG_common_defence_treasury:0 "The Common Defence Treasury"
 AOEIW26_ENG_common_defence_treasury_desc:0 "A shared treasury and joint procurement board will turn imperial consultation into divisions, ships and aircraft available to the whole federation."
 AOEIW26_ENG_trades_union_congress:0 "Empower the Trades Union Congress"
 AOEIW26_ENG_trades_union_congress_desc:0 "Organised labour will receive a formal role in national planning and the reconstruction of relations with workers throughout the Empire."
 AOEIW26_ENG_socialise_commanding_heights:0 "Socialise the Commanding Heights"
 AOEIW26_ENG_socialise_commanding_heights_desc:0 "Coal, rail, steel and armaments will pass into public ownership, giving the People's Commonwealth the industrial base to defend itself."
 AOEIW26_JAP_imperial_conference:0 "Convene the Imperial Conference"
 AOEIW26_JAP_imperial_conference_desc:0 "Cabinet, court and service chiefs will accept a single procedure for settling policy before factional rivalry again turns violent."
 AOEIW26_JAP_cabinet_above_factions:0 "A Cabinet Above Factions"
 AOEIW26_JAP_cabinet_above_factions_desc:0 "Appointments and budgets will be controlled from the cabinet, denying both army cliques and party machines an independent veto."
 AOEIW26_JAP_showa_restoration_councils:0 "The Shōwa Restoration Councils"
 AOEIW26_JAP_showa_restoration_councils_desc:0 "Young officers and patriotic societies will carry the Imperial Way into the provinces, schools and reserve associations."
 AOEIW26_JAP_army_of_national_essence:0 "Army of the National Essence"
 AOEIW26_JAP_army_of_national_essence_desc:0 "Doctrine will place spiritual mobilisation, offensive will and obedience to the Emperor at the centre of every formation."
 AOEIW26_JAP_diet_budget_supremacy:0 "Dietary Budget Supremacy"
 AOEIW26_JAP_diet_budget_supremacy_desc:0 "No service expansion will proceed without an open appropriation passed by the Imperial Diet and defended before civilian ministers."
 AOEIW26_JAP_end_the_military_veto:0 "End the Military Veto"
 AOEIW26_JAP_end_the_military_veto_desc:0 "The services will lose their power to collapse cabinets by withholding ministers, restoring genuine civilian government."
 AOEIW26_SPR_council_of_the_spains:0 "The Council of the Spains"
 AOEIW26_SPR_council_of_the_spains_desc:0 "Castile, Catalonia, the Basque Country and the overseas viceroyalties will bargain with the Crown through a permanent council of realms."
 AOEIW26_SPR_cortes_of_the_realms:0 "The Cortes of the Realms"
 AOEIW26_SPR_cortes_of_the_realms_desc:0 "A representative Cortes will turn provincial rights and imperial obligations into a durable constitutional compact."
 AOEIW26_SPR_unify_the_national_movement:0 "Unify the National Movement"
 AOEIW26_SPR_unify_the_national_movement_desc:0 "Falangists, officers and central administrators will be fused into one chain of command under Madrid."
 AOEIW27_SPR_foral_compromise:0 "The Foral Compromise"
 AOEIW27_SPR_foral_compromise_desc:0 "The historic fueros will be recognised within a loyal union, exchanging regional guarantees for taxes, recruits and obedience to the Crown."
 AOEIW27_SPR_imperial_social_charter:0 "The Imperial Social Charter"
 AOEIW27_SPR_imperial_social_charter_desc:0 "A charter of labour rights, public works and provincial representation will make the imperial constitution tangible in factory and village alike."
 AOEIW27_SPR_caudillo_of_empire:0 "Caudillo of the Empire"
 AOEIW27_SPR_caudillo_of_empire_desc:0 "The National Movement will recognise one supreme political and military command, subordinating every provincial organisation to the imperial state."
 AOEIW27_USA_domestic_settlement:0 "Settle the American Question"
 AOEIW27_USA_domestic_settlement_desc:0 "The struggle over who governs the Republic has produced a new constitutional order. Only now can that order turn outward and define America's place in the hemisphere."
