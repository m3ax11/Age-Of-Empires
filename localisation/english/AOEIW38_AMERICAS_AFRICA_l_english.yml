l_english:
 AOEIW38_regional_programmes_category:0 "Regional Reckonings"
 AOEIW38_regional_programmes_category_desc:0 "The promises made during expansion now meet the harder tests of war, reconstruction, and regional power."

 AOEIW38_BRA_amazon_reckoning:0 "The Amazon Reckoning"
 AOEIW38_BRA_amazon_reckoning_desc:0 "Roads, garrisons, prospectors, and river communities all claim a different future for the interior. Brasília must decide whether the basin is a shared artery or a guarded redoubt."
 AOEIW38_BRA_continental_arteries:0 "Continental Arteries"
 AOEIW38_BRA_continental_arteries_desc:0 "A chain of river ports, roads, and depots will turn distance from a liability into Brazil's strategic depth."
 AOEIW38_BRA_south_atlantic_settlement:0 "A South Atlantic Settlement"
 AOEIW38_BRA_south_atlantic_settlement_desc:0 "The interior now feeds the coast. Brazil can offer its neighbours a durable maritime order backed by ships, supplies, and political weight."
 AOEIW38_CAN_arsenal_and_parliament:0 "The Arsenal and Parliament"
 AOEIW38_CAN_arsenal_and_parliament_desc:0 "Canada's factories can sustain an ocean war, but every new contract raises the question of who decides the Dominion's sacrifice and who inherits its machinery."
 AOEIW38_CAN_two_ocean_lifeline:0 "The Two-Ocean Lifeline"
 AOEIW38_CAN_two_ocean_lifeline_desc:0 "Escort groups, repair yards, and rail schedules will bind Atlantic and Pacific commitments into one national supply system."
 AOEIW38_CAN_peace_dividend:0 "Claim the Peace Dividend"
 AOEIW38_CAN_peace_dividend_desc:0 "The wartime arsenal must leave more than empty yards. Machine tools and trained workers will build the postwar Dominion."
 AOEIW38_MEX_workers_and_wells:0 "Workers and Wells"
 AOEIW38_MEX_workers_and_wells_desc:0 "National oil can finance a modern republic only if engineers, unions, and the state agree on who carries the cost."
 AOEIW38_MEX_sovereign_refineries:0 "Sovereign Refineries"
 AOEIW38_MEX_sovereign_refineries_desc:0 "Domestic refining will keep Mexican fuel under Mexican control from the wellhead to the army depot."
 AOEIW38_MEX_republic_of_workers:0 "A Republic of Workers"
 AOEIW38_MEX_republic_of_workers_desc:0 "The oil settlement can become a wider social compact, pairing industrial discipline with a place for displaced workers and technicians."
 AOEIW38_EGY_guardians_of_the_canal:0 "Guardians of the Canal"
 AOEIW38_EGY_guardians_of_the_canal_desc:0 "The canal is both Egypt's greatest bargaining chip and the route by which foreign armies arrive. Its defence must answer to Cairo."
 AOEIW38_EGY_canal_authority:0 "The Egyptian Canal Authority"
 AOEIW38_EGY_canal_authority_desc:0 "Pilots, tolls, naval stations, and maintenance crews will be placed under a permanent national authority."
 AOEIW38_EGY_canal_and_nile_settlement:0 "Canal and Nile Settlement"
 AOEIW38_EGY_canal_and_nile_settlement_desc:0 "Security at Suez is incomplete while the Nile remains a source of permanent rivalry. Egypt must pair control of passage with a workable upstream compact."
 AOEIW38_ETH_reconstruction_levy:0 "The Reconstruction Levy"
 AOEIW38_ETH_reconstruction_levy_desc:0 "Victory and survival left broken roads and isolated garrisons. A temporary levy can rebuild the realm, though the court must account for every burden it imposes."
 AOEIW38_ETH_highland_corridors:0 "Highland Corridors"
 AOEIW38_ETH_highland_corridors_desc:0 "All-weather roads and depots will make the highlands governable in peace and defensible in war."
 AOEIW38_ETH_red_sea_horizon:0 "The Red Sea Horizon"
 AOEIW38_ETH_red_sea_horizon_desc:0 "Ethiopia's recovery must reach beyond the plateau. Access to commerce and an equal voice on the Nile will secure the crown's place in the region."

 AOEIW38_BRA_frontier_bargain:0 "The Frontier Bargain"
 AOEIW38_BRA_frontier_bargain_desc:0 "Investment in the interior proceeds under a fragile compact between settlers, river communities, officers, and concession holders."
 AOEIW38_BRA_continental_arteries_spirit:0 "Continental Arteries"
 AOEIW38_BRA_continental_arteries_spirit_desc:0 "Brazil's interior transport network moves ore, troops, and machinery on schedules set in the capital."
 AOEIW38_BRA_south_atlantic_power:0 "South Atlantic Power"
 AOEIW38_BRA_south_atlantic_power_desc:0 "Brazil can sustain escorts, trade, and diplomacy across the southern ocean."
 AOEIW38_CAN_arsenal_burden:0 "The Arsenal Burden"
 AOEIW38_CAN_arsenal_burden_desc:0 "War orders keep factories busy while rationing and constitutional arguments test the country at home."
 AOEIW38_CAN_two_ocean_lifeline_spirit:0 "The Two-Ocean Lifeline"
 AOEIW38_CAN_two_ocean_lifeline_spirit_desc:0 "Integrated yards and railways keep Canadian escorts at sea on both coasts."
 AOEIW38_CAN_postwar_conversion:0 "Postwar Conversion"
 AOEIW38_CAN_postwar_conversion_desc:0 "Wartime plants are producing homes, machinery, and civilian transport instead of becoming silent monuments."
 AOEIW38_MEX_oil_compact:0 "The Oil Compact"
 AOEIW38_MEX_oil_compact_desc:0 "The state, technicians, and labour have reached a tense working agreement over the national petroleum industry."
 AOEIW38_MEX_sovereign_refineries_spirit:0 "Sovereign Refineries"
 AOEIW38_MEX_sovereign_refineries_spirit_desc:0 "Domestic refining gives Mexico control over the value and military use of its oil."
 AOEIW38_MEX_workers_republic:0 "The Productive Republic"
 AOEIW38_MEX_workers_republic_desc:0 "A broader industrial compact turns technical migration and organised labour into national strength."
 AOEIW38_EGY_canal_emergency:0 "Canal Emergency Administration"
 AOEIW38_EGY_canal_emergency_desc:0 "Civilian commerce and military defence compete for every tugboat, depot, and rail wagon around Suez."
 AOEIW38_EGY_canal_authority_spirit:0 "The Egyptian Canal Authority"
 AOEIW38_EGY_canal_authority_spirit_desc:0 "A permanent Egyptian authority coordinates passage, maintenance, and defence along the canal."
 AOEIW38_EGY_nile_settlement:0 "The Nile Settlement"
 AOEIW38_EGY_nile_settlement_desc:0 "Regular consultation has replaced threats and rumours along the river's upper reaches."
 AOEIW38_ETH_reconstruction_levy_spirit:0 "The Reconstruction Levy"
 AOEIW38_ETH_reconstruction_levy_spirit_desc:0 "A temporary national levy funds roads and repairs while slowing the recovery of household consumption."
 AOEIW38_ETH_highland_corridors_spirit:0 "Highland Corridors"
 AOEIW38_ETH_highland_corridors_spirit_desc:0 "Mountain roads, storehouses, and trained transport units bind the highlands together."
 AOEIW38_ETH_red_sea_crown:0 "A Crown Facing the Red Sea"
 AOEIW38_ETH_red_sea_crown_desc:0 "Trade access and regional diplomacy have given Ethiopia strategic reach beyond the plateau."
 AOEIW38_ETH_nile_guarantee:0 "The Nile Guarantee"
 AOEIW38_ETH_nile_guarantee_desc:0 "Recognised consultation rights protect Ethiopian development while reducing the risk of a river crisis."
 AOEIW38_ARG_federal_export_compact:0 "Federal Export Compact"
 AOEIW38_ARG_federal_export_compact_desc:0 "Madrid has recognised a larger Argentine share of customs revenue and investment planning."
 AOEIW38_PRU_andean_logistics_mission:0 "Andean Logistics Mission"
 AOEIW38_PRU_andean_logistics_mission_desc:0 "Peruvian officers and engineers now direct imperial investment through the mountain corridors."
 AOEIW38_hispanic_defence_quota:0 "Hispanic Defence Quota"
 AOEIW38_hispanic_defence_quota_desc:0 "Service to the imperial defence system brings battlefield experience and a stronger claim to self-government."
 AOEIW38_imperial_requisition:0 "Imperial Requisition"
 AOEIW38_imperial_requisition_desc:0 "Madrid has answered requests for reform with stricter quotas and closer supervision."
 AOEIW38_regional_war_cabinet:0 "Regional War Cabinet"
 AOEIW38_regional_war_cabinet_desc:0 "Civil officials, officers, and industrial planners meet under one emergency schedule."
 AOEIW38_veterans_reconstruction_board:0 "Veterans' Reconstruction Board"
 AOEIW38_veterans_reconstruction_board_desc:0 "Demobilised specialists direct their wartime knowledge toward repair, transport, and civilian industry."

 AOEIW38_BRA_map_the_interior_corridors:0 "Map the Interior Corridors"
 AOEIW38_BRA_map_the_interior_corridors_desc:0 "Surveyors will identify the missing road and depot links between the river system and the industrial coast."
 AOEIW38_BRA_invite_south_atlantic_observers:0 "Invite South Atlantic Observers"
 AOEIW38_BRA_invite_south_atlantic_observers_desc:0 "Invite Argentina and Peru to turn Brazil's maritime doctrine into a regional consultation."
 AOEIW38_CAN_expand_the_escort_pool:0 "Expand the Escort Pool"
 AOEIW38_CAN_expand_the_escort_pool_desc:0 "Rotate crews and small hulls through a unified escort reserve for the duration of the shipping emergency."
 AOEIW38_CAN_convert_the_war_plants:0 "Convert the War Plants"
 AOEIW38_CAN_convert_the_war_plants_desc:0 "Retool the arsenal before cancellation and unemployment hollow out the new industrial cities."
 AOEIW38_MEX_issue_national_oil_contracts:0 "Issue National Oil Contracts"
 AOEIW38_MEX_issue_national_oil_contracts_desc:0 "Direct refinery work toward firms that accept national pricing and labour guarantees."
 AOEIW38_MEX_receive_displaced_engineers:0 "Receive Displaced Engineers"
 AOEIW38_MEX_receive_displaced_engineers_desc:0 "Offer skilled refugees a secure home and a place in Mexico's expanding technical schools."
 AOEIW38_EGY_enforce_canal_passage_dues:0 "Enforce Canal Passage Dues"
 AOEIW38_EGY_enforce_canal_passage_dues_desc:0 "A temporary schedule of dues will finance patrols and maintenance during the shipping surge."
 AOEIW38_EGY_offer_the_nile_commission:0 "Offer the Nile Commission"
 AOEIW38_EGY_offer_the_nile_commission_desc:0 "Invite Ethiopia to replace unilateral schemes with surveys, notice periods, and a permanent negotiating table."
 AOEIW38_ETH_drive_the_highland_railway:0 "Drive the Highland Railway"
 AOEIW38_ETH_drive_the_highland_railway_desc:0 "Concentrate scarce crews and steel on the most important gap in the national transport network."
 AOEIW38_ETH_demand_a_nile_voice:0 "Demand a Nile Voice"
 AOEIW38_ETH_demand_a_nile_voice_desc:0 "Ask Cairo to recognise Ethiopia as a negotiating equal in the management of the river."
 AOEIW38_ARG_negotiate_the_export_compact:0 "Negotiate the Export Compact"
 AOEIW38_ARG_negotiate_the_export_compact_desc:0 "Request a fixed Argentine share of customs receipts and authority over reinvestment. Madrid must answer."
 AOEIW38_PRU_request_an_andean_mandate:0 "Request an Andean Mandate"
 AOEIW38_PRU_request_an_andean_mandate_desc:0 "Propose that Peruvian planners direct mountain defence and infrastructure while remaining within the Spanish imperial system."
 AOEIW38_hispanic_defence_contribution:0 "Meet the Hispanic Defence Quota"
 AOEIW38_hispanic_defence_contribution_desc:0 "Raise and equip a service contingent in exchange for a documented claim toward greater autonomy."
 AOEIW38_found_the_veterans_reconstruction_board:0 "Found the Veterans' Reconstruction Board"
 AOEIW38_found_the_veterans_reconstruction_board_desc:0 "Turn emergency logistics staff into a permanent agency for repair and civilian development."

 AOEIW38_aa.1.t:0 "The Basin Has a Price"
 AOEIW38_aa.1.d:0 "The new interior programme has forced a choice. Civilian planners want agreements with neighbouring river states; the general staff wants controlled corridors, guarded depots, and no foreign observers. Both plans can move supplies. Only one defines the political future of the basin."
 AOEIW38_aa.1.a:0 "Build a basin partnership."
 AOEIW38_aa.1.b:0 "Fortify the interior corridors."
 AOEIW38_aa.2.t:0 "Who Commands the Arsenal?"
 AOEIW38_aa.2.d:0 "The escort crisis has expanded Canadian industry faster than its constitutional habits. One camp would commit production to the ocean war and settle authority later. Another insists that parliament secure a civilian conversion plan before the contracts multiply."
 AOEIW38_aa.2.a:0 "The lifeline comes first."
 AOEIW38_aa.2.b:0 "Guarantee the home-front settlement."
 AOEIW38_aa.3.t:0 "The Petroleum Settlement"
 AOEIW38_aa.3.d:0 "Mexico controls the wells, but technicians, foreign buyers, and organised labour still determine whether oil reaches a refinery. A negotiated contract would restore confidence. Full state direction would secure sovereignty at the price of a sharper foreign reaction."
 AOEIW38_aa.3.a:0 "Offer contracts under Mexican law."
 AOEIW38_aa.3.b:0 "The nation will direct every barrel."
 AOEIW38_aa.4.t:0 "Passage and Sovereignty"
 AOEIW38_aa.4.d:0 "Every belligerent wants passage through Suez, and every embassy calls its request exceptional. The cabinet must decide whether the canal is first a fortress of sovereignty or an open route whose traffic finances Egypt's authority."
 AOEIW38_aa.4.a:0 "Egyptian security sets the schedule."
 AOEIW38_aa.4.b:0 "Keep passage open under Egyptian rules."
 AOEIW38_aa.5.t:0 "Beyond Reconstruction"
 AOEIW38_aa.5.d:0 "The first rebuilt roads have reached the military districts. Officers favour a dense defensive network across the highlands, while merchants and younger officials argue that the corridors must lead outward to the Red Sea and regional diplomacy."
 AOEIW38_aa.5.a:0 "Make the highlands unbreakable."
 AOEIW38_aa.5.b:0 "Build toward the Red Sea."
 AOEIW38_aa.10.t:0 "Brazil's South Atlantic Board"
 AOEIW38_aa.10.d:0 "Brazil has invited our government to observe a permanent board for convoy routes, port access, and emergency supply. Participation would give us a voice in the new maritime order, though it would also acknowledge Brazilian leadership."
 AOEIW38_aa.10.a:0 "Take a seat at the table."
 AOEIW38_aa.10.b:0 "We will keep our distance."
 AOEIW38_aa.20.t:0 "A War That Reaches Home"
 AOEIW38_aa.20.d:0 "The conflict now touches our shipping, workshops, and internal transport. A regional war cabinet can coordinate the burden and preserve a record of the country's service when peace returns."
 AOEIW38_aa.20.a:0 "Put the emergency schedule into effect."
 AOEIW38_aa.21.t:0 "The Peace Ledger"
 AOEIW38_aa.21.d:0 "Orders have slowed, soldiers are returning, and temporary offices are already defending their budgets. The cabinet has opened a public ledger of wartime service so that reconstruction becomes a programme rather than an afterthought."
 AOEIW38_aa.21.a:0 "Open the reconstruction debate."
 AOEIW38_aa.30.t:0 "Cairo Offers a Nile Commission"
 AOEIW38_aa.30.d:0 "Egypt proposes shared surveys and formal notice before major works on the Nile. Acceptance would give Ethiopia recognised standing; refusal would preserve freedom of action and deepen the rivalry."
 AOEIW38_aa.30.a:0 "Accept equal talks."
 AOEIW38_aa.30.b:0 "The headwaters require no permission."
 AOEIW38_aa.31.t:0 "Addis Ababa Demands a Nile Voice"
 AOEIW38_aa.31.d:0 "Ethiopia asks for equal standing over river surveys and future works. Recognition may restrain unilateral projects, but refusal could turn every dam and irrigation plan into a security crisis."
 AOEIW38_aa.31.a:0 "Recognise a standing commission."
 AOEIW38_aa.31.b:0 "Egypt's historic rights are sufficient."
 AOEIW38_aa.32.t:0 "The River Commission Convenes"
 AOEIW38_aa.32.d:0 "Surveyors from Cairo and Addis Ababa have exchanged maps and schedules under the first standing Nile commission. The agreement is narrow, but the river is no longer governed by rumour alone."
 AOEIW38_aa.32.a:0 "Let measurements replace threats."
 AOEIW38_aa.33.t:0 "The Nile Talks Fail"
 AOEIW38_aa.33.d:0 "The other government has rejected a standing settlement. Military planners now treat every upstream work and downstream mobilisation as a possible opening move."
 AOEIW38_aa.33.a:0 "Prepare for a harder river politics."
 AOEIW38_aa.40.t:0 "Mexico Offers an Oil Contract"
 AOEIW38_aa.40.d:0 "Mexico will honour national ownership while reopening contracts under Mexican labour and pricing rules. Our firms dislike the precedent, but the settlement restores a predictable flow of petroleum."
 AOEIW38_aa.40.a:0 "Accept the workable compromise."
 AOEIW38_aa.41.t:0 "Mexico Closes the Oil Door"
 AOEIW38_aa.41.d:0 "Mexico has placed extraction, refining, and allocation under direct national control. Commercial influence has narrowed, and the petroleum relationship is now openly strategic."
 AOEIW38_aa.41.a:0 "Revise our continental calculations."
 AOEIW38_aa.50.t:0 "Argentina Submits an Export Compact"
 AOEIW38_aa.50.d:0 "Buenos Aires requests a guaranteed share of customs revenue and authority to reinvest it locally. The petition promises reliable exports and defence service, but it would establish a powerful precedent for negotiated autonomy."
 AOEIW38_aa.50.a:0 "A prosperous partner strengthens the empire."
 AOEIW38_aa.50.b:0 "Madrid will set the quota."
 AOEIW38_aa.51.t:0 "Peru Requests an Andean Mandate"
 AOEIW38_aa.51.d:0 "Lima proposes local command over mountain logistics and infrastructure within the imperial system. Granting the mandate could make Andean defence effective; refusing it would preserve direct authority."
 AOEIW38_aa.51.a:0 "Approve the Andean mandate."
 AOEIW38_aa.51.b:0 "Administration remains with Madrid."
 AOEIW38_aa.52.t:0 "Madrid Accepts the Compact"
 AOEIW38_aa.52.d:0 "The imperial government has accepted a defined sphere of local planning and revenue. The agreement stops short of independence, but it makes service and authority part of the same bargain."
 AOEIW38_aa.52.a:0 "Put the new authority to work."
 AOEIW38_aa.53.t:0 "Madrid Refuses the Petition"
 AOEIW38_aa.53.d:0 "Madrid has answered the reform memorandum with requisitions and closer oversight. The order may secure immediate deliveries, but it has turned an administrative dispute into a political grievance."
 AOEIW38_aa.53.a:0 "Record the refusal."
 AOEIW38_aa.60.t:0 "Canada Presents the Arsenal Ledger"
 AOEIW38_aa.60.d:0 "Ottawa has paired its shipping and factory commitments with a constitutional memorandum. Canada asks that wartime responsibility bring a larger voice over contracts, deployment, and the conversion of its industries after peace."
 AOEIW38_aa.60.a:0 "Responsibility should carry authority."
 AOEIW38_aa.60.b:0 "The emergency permits no new bargain."

