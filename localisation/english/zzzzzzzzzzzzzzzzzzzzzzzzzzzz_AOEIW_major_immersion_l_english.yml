l_english:
 AOEIW_IMM_GER_root:0 "The Imperial Conference"
 AOEIW_IMM_GER_root_desc:0 "The empire cannot enter the coming struggle through routine decrees. Crown, army, industry and parliament must decide what kind of Germany they intend to defend."
 AOEIW_IMM_GER_federal_1:0 "The Bundesrat Faces the Kaiser"
 AOEIW_IMM_GER_federal_1_desc:0 "The kingdoms will support the crown, but not a blank cheque from Berlin. Their delegates demand a voice over taxation, mobilisation and the obligations of the Reichspakt."
 AOEIW_IMM_GER_federal_2:0 "A Bargain with the Reichstag"
 AOEIW_IMM_GER_federal_2_desc:0 "A durable empire will rest on negotiated loyalty, social peace and a parliament that shares responsibility for victory."
 AOEIW_IMM_GER_federal_3:0 "The Constitutional Empire"
 AOEIW_IMM_GER_federal_3_desc:0 "A durable empire will rest on negotiated loyalty, social peace and a parliament that shares responsibility for victory."
 AOEIW_IMM_GER_continental_1:0 "The Continental General Staff"
 AOEIW_IMM_GER_continental_1_desc:0 "Berlin will bind the continent through mobilization schedules, military missions and an integrated strategic economy."
 AOEIW_IMM_GER_continental_2:0 "Railways of Mitteleuropa"
 AOEIW_IMM_GER_continental_2_desc:0 "Berlin will bind the continent through mobilization schedules, military missions and an integrated strategic economy."
 AOEIW_IMM_GER_continental_3:0 "The Berlin System"
 AOEIW_IMM_GER_continental_3_desc:0 "Berlin will bind the continent through mobilization schedules, military missions and an integrated strategic economy."
 AOEIW_IMM_GER_weltpolitik_1:0 "Restore the Colonial Office"
 AOEIW_IMM_GER_weltpolitik_1_desc:0 "Germany will again measure its power in oceans, overseas stations and the reach of the Imperial Navy."
 AOEIW_IMM_GER_weltpolitik_2:0 "The High Seas Appropriation"
 AOEIW_IMM_GER_weltpolitik_2_desc:0 "Germany will again measure its power in oceans, overseas stations and the reach of the Imperial Navy."
 AOEIW_IMM_GER_weltpolitik_3:0 "An Empire Beyond Europe"
 AOEIW_IMM_GER_weltpolitik_3_desc:0 "Germany will again measure its power in oceans, overseas stations and the reach of the Imperial Navy."
 AOEIW_IMM_GER_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_GER_national_destiny_desc:0 "Germany has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_FRA_root:0 "The Crisis of the French State"
 AOEIW_IMM_FRA_root_desc:0 "Defeatism, imperial ambition and republican memory compete for the same ministries. France must settle who commands before Europe tests her frontiers."
 AOEIW_IMM_FRA_marshalate_1:0 "The General Staff Ultimatum"
 AOEIW_IMM_FRA_marshalate_1_desc:0 "The army argues that only a national directorate under Marshal Weygand can end cabinet paralysis and prepare France for total war."
 AOEIW_IMM_FRA_marshalate_2:0 "Proclaim the State of Siege"
 AOEIW_IMM_FRA_marshalate_2_desc:0 "The army argues that only a national directorate under Marshal Weygand can end cabinet paralysis and prepare France for total war."
 AOEIW_IMM_FRA_marshalate_3:0 "The Marshalate of France"
 AOEIW_IMM_FRA_marshalate_3_desc:0 "The army argues that only a national directorate under Marshal Weygand can end cabinet paralysis and prepare France for total war."
 AOEIW_IMM_FRA_grandeur_1:0 "The Army of Austerlitz"
 AOEIW_IMM_FRA_grandeur_1_desc:0 "The imperial state will summon metropolitan and colonial strength beneath a single vision of French grandeur."
 AOEIW_IMM_FRA_grandeur_2:0 "Mobilize the Colonial Reserve"
 AOEIW_IMM_FRA_grandeur_2_desc:0 "The imperial state will summon metropolitan and colonial strength beneath a single vision of French grandeur."
 AOEIW_IMM_FRA_grandeur_3:0 "The Second Imperial Grandeur"
 AOEIW_IMM_FRA_grandeur_3_desc:0 "The imperial state will summon metropolitan and colonial strength beneath a single vision of French grandeur."
 AOEIW_IMM_FRA_union_1:0 "A New Union Sacrée"
 AOEIW_IMM_FRA_union_1_desc:0 "A broad civic coalition can defend France without surrendering the nation to either palace or barracks."
 AOEIW_IMM_FRA_union_2:0 "The Citizen Army"
 AOEIW_IMM_FRA_union_2_desc:0 "A broad civic coalition can defend France without surrendering the nation to either palace or barracks."
 AOEIW_IMM_FRA_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_FRA_national_destiny_desc:0 "France has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_ENG_root:0 "The Conference of the Realm"
 AOEIW_IMM_ENG_root_desc:0 "The Crown, Parliament and the dominions agree that drift is no longer policy. The British world must choose the institution around which it will rally."
 AOEIW_IMM_ENG_crown_1:0 "The King and His Cabinet"
 AOEIW_IMM_ENG_crown_1_desc:0 "The sovereign will become the visible centre of government and the arbiter of a disciplined national coalition."
 AOEIW_IMM_ENG_crown_2:0 "A Royal National Government"
 AOEIW_IMM_ENG_crown_2_desc:0 "The sovereign will become the visible centre of government and the arbiter of a disciplined national coalition."
 AOEIW_IMM_ENG_crown_3:0 "The King's Peace"
 AOEIW_IMM_ENG_crown_3_desc:0 "The sovereign will become the visible centre of government and the arbiter of a disciplined national coalition."
 AOEIW_IMM_ENG_federation_1:0 "The Dominion Conference"
 AOEIW_IMM_ENG_federation_1_desc:0 "The empire will be transformed from a hierarchy of possessions into a negotiated federation of common defence."
 AOEIW_IMM_ENG_federation_2:0 "An Imperial General Staff"
 AOEIW_IMM_ENG_federation_2_desc:0 "The empire will be transformed from a hierarchy of possessions into a negotiated federation of common defence."
 AOEIW_IMM_ENG_federation_3:0 "The Federation of the Empire"
 AOEIW_IMM_ENG_federation_3_desc:0 "The empire will be transformed from a hierarchy of possessions into a negotiated federation of common defence."
 AOEIW_IMM_ENG_commons_1:0 "The Commons Assert Control"
 AOEIW_IMM_ENG_commons_1_desc:0 "Parliament will link social security to rearmament and prove that democracy can mobilize without abandoning itself."
 AOEIW_IMM_ENG_commons_2:0 "Welfare and Rearmament"
 AOEIW_IMM_ENG_commons_2_desc:0 "Parliament will link social security to rearmament and prove that democracy can mobilize without abandoning itself."
 AOEIW_IMM_ENG_commons_3:0 "The Democratic Arsenal"
 AOEIW_IMM_ENG_commons_3_desc:0 "Parliament will link social security to rearmament and prove that democracy can mobilize without abandoning itself."
 AOEIW_IMM_ENG_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_ENG_national_destiny_desc:0 "Britain has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_SOV_root:0 "The Reckoning of the Empire"
 AOEIW_IMM_SOV_root_desc:0 "The restored empire is vast but unsettled. Court, army and reformers offer incompatible answers to the same question: how shall Russia survive another continental war?"
 AOEIW_IMM_SOV_autocracy_1:0 "Empower the Imperial Chancellery"
 AOEIW_IMM_SOV_autocracy_1_desc:0 "The throne will govern through a professional chancellery, disciplined governors and an unambiguous chain of command."
 AOEIW_IMM_SOV_autocracy_2:0 "Silence the Fractured Court"
 AOEIW_IMM_SOV_autocracy_2_desc:0 "The throne will govern through a professional chancellery, disciplined governors and an unambiguous chain of command."
 AOEIW_IMM_SOV_autocracy_3:0 "An Autocracy Reforged"
 AOEIW_IMM_SOV_autocracy_3_desc:0 "The throne will govern through a professional chancellery, disciplined governors and an unambiguous chain of command."
 AOEIW_IMM_SOV_stavka_1:0 "Lessons of the Great Retreat"
 AOEIW_IMM_SOV_stavka_1_desc:0 "The army demands strategic depth, modern logistics and authority to prepare the western frontier without political interference."
 AOEIW_IMM_SOV_stavka_2:0 "The Stavka Ascendant"
 AOEIW_IMM_SOV_stavka_2_desc:0 "The army demands strategic depth, modern logistics and authority to prepare the western frontier without political interference."
 AOEIW_IMM_SOV_stavka_3:0 "The Iron Frontier"
 AOEIW_IMM_SOV_stavka_3_desc:0 "The army demands strategic depth, modern logistics and authority to prepare the western frontier without political interference."
 AOEIW_IMM_SOV_zemstvo_1:0 "Summon the Zemstvos"
 AOEIW_IMM_SOV_zemstvo_1_desc:0 "Provincial institutions and a binding charter may reconcile the peoples of the empire before coercion destroys it."
 AOEIW_IMM_SOV_zemstvo_2:0 "A Charter for the Empire"
 AOEIW_IMM_SOV_zemstvo_2_desc:0 "Provincial institutions and a binding charter may reconcile the peoples of the empire before coercion destroys it."
 AOEIW_IMM_SOV_zemstvo_3:0 "Russia Renewed"
 AOEIW_IMM_SOV_zemstvo_3_desc:0 "Provincial institutions and a binding charter may reconcile the peoples of the empire before coercion destroys it."
 AOEIW_IMM_SOV_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_SOV_national_destiny_desc:0 "Russia has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_USA_root:0 "The Continental Emergency"
 AOEIW_IMM_USA_root_desc:0 "Washington retains immense potential but no longer commands an uncontested union. The government must choose how power, industry and legitimacy will be rebuilt."
 AOEIW_IMM_USA_executive_1:0 "Emergency Executive Powers"
 AOEIW_IMM_USA_executive_1_desc:0 "A centralized executive will coordinate recovery and make reunification the unquestioned purpose of the state."
 AOEIW_IMM_USA_executive_2:0 "The Reconstruction Administration"
 AOEIW_IMM_USA_executive_2_desc:0 "A centralized executive will coordinate recovery and make reunification the unquestioned purpose of the state."
 AOEIW_IMM_USA_executive_3:0 "The Indivisible Union"
 AOEIW_IMM_USA_executive_3_desc:0 "A centralized executive will coordinate recovery and make reunification the unquestioned purpose of the state."
 AOEIW_IMM_USA_arsenal_1:0 "Reopen the Detroit Arsenal"
 AOEIW_IMM_USA_arsenal_1_desc:0 "Mass production, standardized procurement and continental infrastructure will turn surviving industry into decisive power."
 AOEIW_IMM_USA_arsenal_2:0 "The Continental War Economy"
 AOEIW_IMM_USA_arsenal_2_desc:0 "Mass production, standardized procurement and continental infrastructure will turn surviving industry into decisive power."
 AOEIW_IMM_USA_arsenal_3:0 "The Colossus Awakens"
 AOEIW_IMM_USA_arsenal_3_desc:0 "Mass production, standardized procurement and continental infrastructure will turn surviving industry into decisive power."
 AOEIW_IMM_USA_convention_1:0 "A Convention of States"
 AOEIW_IMM_USA_convention_1_desc:0 "A renewed constitutional bargain will offer estranged Americans a union worth returning to rather than merely one they fear."
 AOEIW_IMM_USA_convention_2:0 "The Second Bill of Rights"
 AOEIW_IMM_USA_convention_2_desc:0 "A renewed constitutional bargain will offer estranged Americans a union worth returning to rather than merely one they fear."
 AOEIW_IMM_USA_convention_3:0 "A Republic Reconciled"
 AOEIW_IMM_USA_convention_3_desc:0 "A renewed constitutional bargain will offer estranged Americans a union worth returning to rather than merely one they fear."
 AOEIW_IMM_USA_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_USA_national_destiny_desc:0 "America has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_ITA_root:0 "Rome Claims Its Destiny"
 AOEIW_IMM_ITA_root_desc:0 "The regime presents empire as the answer to every domestic rivalry. Palace, party and generals must now agree on what Rome will claim and who will command the attempt."
 AOEIW_IMM_ITA_corporate_1:0 "The Corporate State in Arms"
 AOEIW_IMM_ITA_corporate_1_desc:0 "The regime will fuse party, syndicates and provincial administration into a single instrument of national command."
 AOEIW_IMM_ITA_corporate_2:0 "Prefects of the New Order"
 AOEIW_IMM_ITA_corporate_2_desc:0 "The regime will fuse party, syndicates and provincial administration into a single instrument of national command."
 AOEIW_IMM_ITA_corporate_3:0 "Orders from Palazzo Venezia"
 AOEIW_IMM_ITA_corporate_3_desc:0 "Corporate chambers may advise, but final priorities now leave Mussolini's office as commands. Industry, prefects and party officials will compete to show obedience through output."
 AOEIW_IMM_ITA_mediterranean_1:0 "The Mediterranean Admiralty"
 AOEIW_IMM_ITA_mediterranean_1_desc:0 "Italy will treat the central sea as its strategic interior and build the fleet, bases and doctrine required to control it."
 AOEIW_IMM_ITA_mediterranean_2:0 "Fortify the Maritime Roads"
 AOEIW_IMM_ITA_mediterranean_2_desc:0 "Italy will treat the central sea as its strategic interior and build the fleet, bases and doctrine required to control it."
 AOEIW_IMM_ITA_mediterranean_3:0 "Mare Nostrum Command"
 AOEIW_IMM_ITA_mediterranean_3_desc:0 "Italy will treat the central sea as its strategic interior and build the fleet, bases and doctrine required to control it."
 AOEIW_IMM_ITA_monarchy_1:0 "The Crown Intervenes"
 AOEIW_IMM_ITA_monarchy_1_desc:0 "The monarchy will curb permanent mobilization and seek strength through a broader, more legitimate Italian state."
 AOEIW_IMM_ITA_monarchy_2:0 "A Statute for the Provinces"
 AOEIW_IMM_ITA_monarchy_2_desc:0 "The monarchy will curb permanent mobilization and seek strength through a broader, more legitimate Italian state."
 AOEIW_IMM_ITA_monarchy_3:0 "The National Monarchy"
 AOEIW_IMM_ITA_monarchy_3_desc:0 "The monarchy will curb permanent mobilization and seek strength through a broader, more legitimate Italian state."
 AOEIW_IMM_ITA_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_ITA_national_destiny_desc:0 "Italy has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_JAP_root:0 "The Imperial Strategic Conference"
 AOEIW_IMM_JAP_root_desc:0 "Army, navy and court planners agree only that the old compromise has expired. The emperor's ministers must choose the instrument of Japan's future."
 AOEIW_IMM_JAP_army_1:0 "The Army's Continental Thesis"
 AOEIW_IMM_JAP_army_1_desc:0 "The army will organize the empire around continental security, mass mobilization and decisive land campaigns."
 AOEIW_IMM_JAP_army_2:0 "Empower Imperial Headquarters"
 AOEIW_IMM_JAP_army_2_desc:0 "The army will organize the empire around continental security, mass mobilization and decisive land campaigns."
 AOEIW_IMM_JAP_army_3:0 "The Northern Rampart"
 AOEIW_IMM_JAP_army_3_desc:0 "The army will organize the empire around continental security, mass mobilization and decisive land campaigns."
 AOEIW_IMM_JAP_navy_1:0 "The Navy's Oceanic Thesis"
 AOEIW_IMM_JAP_navy_1_desc:0 "The navy will secure resources and strategic freedom through carriers, island bases and command of the western Pacific."
 AOEIW_IMM_JAP_navy_2:0 "The Decisive Battle Fleet"
 AOEIW_IMM_JAP_navy_2_desc:0 "The navy will secure resources and strategic freedom through carriers, island bases and command of the western Pacific."
 AOEIW_IMM_JAP_navy_3:0 "The Pacific Mandate"
 AOEIW_IMM_JAP_navy_3_desc:0 "The navy will secure resources and strategic freedom through carriers, island bases and command of the western Pacific."
 AOEIW_IMM_JAP_court_1:0 "Conference before the Throne"
 AOEIW_IMM_JAP_court_1_desc:0 "Civilian ministers and service chiefs will present one written policy before entering the imperial presence. The conference forces rival commands to expose their disagreements."
 AOEIW_IMM_JAP_court_2:0 "Rationalize the Zaibatsu"
 AOEIW_IMM_JAP_court_2_desc:0 "Civilian planners will discipline the service rivalry and place industrial capacity above factional prestige."
 AOEIW_IMM_JAP_court_3:0 "The Technocratic Empire"
 AOEIW_IMM_JAP_court_3_desc:0 "Civilian planners will discipline the service rivalry and place industrial capacity above factional prestige."
 AOEIW_IMM_JAP_national_destiny:0 "A National Destiny Chosen"
 AOEIW_IMM_JAP_national_destiny_desc:0 "Japan has resolved the institutional struggle that once divided its state. Policy can now serve a coherent national strategy."
 AOEIW_IMM_CHI_root:0 "The Mandate in Peril"
 AOEIW_IMM_CHI_root_desc:0 "The dynasty possesses a throne but not yet an uncontested nation. Court reform, national mobilization and constitutional compromise offer very different roads to survival."
 AOEIW_IMM_CHI_court_1:0 "Reform the Grand Council"
 AOEIW_IMM_CHI_court_1_desc:0 "The dynasty will rebuild central authority through a disciplined council and governors answerable directly to the throne."
 AOEIW_IMM_CHI_court_2:0 "Break the Palace Cliques"
 AOEIW_IMM_CHI_court_2_desc:0 "The dynasty will rebuild central authority through a disciplined council and governors answerable directly to the throne."
 AOEIW_IMM_CHI_court_3:0 "The Restored Mandate"
 AOEIW_IMM_CHI_court_3_desc:0 "The dynasty will rebuild central authority through a disciplined council and governors answerable directly to the throne."
 AOEIW_IMM_CHI_salvation_1:0 "A Nation under Arms"
 AOEIW_IMM_CHI_salvation_1_desc:0 "Survival requires transcending faction and turning China's population, workshops and depth into a single war effort."
 AOEIW_IMM_CHI_salvation_2:0 "Arm the Interior"
 AOEIW_IMM_CHI_salvation_2_desc:0 "Survival requires transcending faction and turning China's population, workshops and depth into a single war effort."
 AOEIW_IMM_CHI_salvation_3:0 "The War of National Salvation"
 AOEIW_IMM_CHI_salvation_3_desc:0 "Survival requires transcending faction and turning China's population, workshops and depth into a single war effort."
 AOEIW_IMM_CHI_charter_1:0 "Invite the Provincial Delegates"
 AOEIW_IMM_CHI_charter_1_desc:0 "A constitutional settlement may bind provinces and political movements to the dynasty without another cycle of civil war."
