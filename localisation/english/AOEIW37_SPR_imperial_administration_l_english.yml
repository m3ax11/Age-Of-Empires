l_english:
 AOEIW37_SPR_congress_of_cadiz:0 "The Congress of Cádiz"
 AOEIW37_SPR_congress_of_cadiz_desc:0 "Ministers from Madrid will meet Argentine and Peruvian delegates in Cádiz to decide how the restored empire governs across the Atlantic. Their answer will determine who pays for development, who commands imperial forces, and how much authority the American administrations possess."
 AOEIW37_SPR_charter_of_equal_realms:0 "Charter of Equal Realms"
 AOEIW37_SPR_charter_of_equal_realms_desc:0 "The empire can endure through negotiated obligations. Madrid will reserve foreign affairs and imperial defence while Buenos Aires and Lima receive secure budgets, local ministries, and seats in a permanent American cabinet."
 AOEIW37_SPR_viceroyal_directorate:0 "The Viceroyal Directorate"
 AOEIW37_SPR_viceroyal_directorate_desc:0 "The crown will place the two administrations under a single directorate of officers, engineers, and royal commissioners. A clear chain of command will accelerate mobilisation, though local politicians will resent the loss of influence."
 AOEIW37_SPR_rioplatense_public_works:0 "Río de la Plata Public Works"
 AOEIW37_SPR_rioplatense_public_works_desc:0 "Argentine ports carry the produce of the southern administration, but poor inland connections leave men and grain far from the quays. Joint credit from Madrid and Buenos Aires will finish the rail links around the capital and expand civilian workshops."
 AOEIW37_SPR_andean_development_corporation:0 "The Andean Development Corporation"
 AOEIW37_SPR_andean_development_corporation_desc:0 "Peru administers an immense Andean and northern territory whose mines, roads, and depots remain unevenly developed. A crown corporation headquartered in Lima will connect extraction sites to the Pacific and train a local technical service."
 AOEIW37_SPR_imperial_defence_board:0 "The Imperial Defence Board"
 AOEIW37_SPR_imperial_defence_board_desc:0 "Spanish, Argentine, and Peruvian officers will prepare one defence plan for three continents. Shared exercises and liaison staffs will give the American administrations a real role in strategy instead of treating their armies as distant auxiliaries."
 AOEIW37_SPR_two_ocean_routes:0 "Secure the Two-Ocean Routes"
 AOEIW37_SPR_two_ocean_routes_desc:0 "The Atlantic crossing and the Pacific approaches to Peru form one imperial supply problem. Escort doctrine, coastal yards, and scheduled merchant routes will let Madrid support either administration during a long war."
 AOEIW37_SPR_cabinet_of_the_americas:0 "A Cabinet of the Americas"
 AOEIW37_SPR_cabinet_of_the_americas_desc:0 "Regular meetings will bring American budgets, petitions, and military requirements into the government calendar. The cabinet gives cooperation a place to continue after the excitement of the first congress has faded."
 AOEIW37_SPR_test_the_imperial_compact:0 "Test the Imperial Compact"
 AOEIW37_SPR_test_the_imperial_compact_desc:0 "Investment has raised expectations in Buenos Aires and Lima, while the defence board has increased Madrid's demands. The crown must now settle the disputed powers that temporary agreements left unresolved."
 AOEIW37_SPR_commonwealth_of_the_spains:0 "Commonwealth of the Spains"
 AOEIW37_SPR_commonwealth_of_the_spains_desc:0 "A final statute will bind Spain and its American realms through a common crown, shared defence, and guaranteed local government. Its strength will come from institutions that survive individual ministers and viceroys."
 AOEIW37_SPR_one_crown_two_oceans:0 "One Crown Across Two Oceans"
 AOEIW37_SPR_one_crown_two_oceans_desc:0 "Madrid will proclaim an indivisible strategic command from the Atlantic to the Pacific. The American administrations will retain their local offices, but war planning, procurement, and external policy will answer directly to the crown."

 AOEIW37_SPR_unsettled_imperial_compact:0 "An Unsettled Imperial Compact"
 AOEIW37_SPR_unsettled_imperial_compact_desc:0 "The Congress of Cádiz has opened every question that decades of improvised rule avoided. Ministries delay contracts while Madrid, Buenos Aires, and Lima wait for a constitutional settlement."
 AOEIW37_SPR_chartered_empire:0 "The Chartered Empire"
 AOEIW37_SPR_chartered_empire_desc:0 "Written competences and regular consultation have replaced improvised orders. The American administrations possess room to govern, and Madrid gains partners able to carry out long programmes."
 AOEIW37_SPR_directed_empire:0 "The Directed Empire"
 AOEIW37_SPR_directed_empire_desc:0 "Royal commissioners coordinate the American administrations through unified plans and firm deadlines. Madrid gains speed and control at the cost of growing demands for local authority."
 AOEIW37_SPR_imperial_development_partner:0 "Imperial Development Partner"
 AOEIW37_SPR_imperial_development_partner_desc:0 "Spanish credit, local engineers, and guaranteed shipping contracts support a sustained programme of roads, workshops, and resource development."
 AOEIW37_SPR_imperial_defence_partner:0 "Imperial Defence Partner"
 AOEIW37_SPR_imperial_defence_partner_desc:0 "Liaison officers and shared exercises connect the local army to Spain's wider defence plan while preserving a staff familiar with the administration's own terrain."
 AOEIW37_SPR_subject_charter:0 "Chartered American Administration"
 AOEIW37_SPR_subject_charter_desc:0 "The Cádiz settlement guarantees a local budget and ministries within the Spanish commonwealth. Cooperation with Madrid now carries a clear path toward greater responsibility."
 AOEIW37_SPR_subject_directorate:0 "Viceroyal Directorate"
 AOEIW37_SPR_subject_directorate_desc:0 "Royal commissioners drive factories and recruitment through a central schedule. Output has risen, but the administration has little freedom to answer local concerns."
 AOEIW37_SPR_commonwealth_of_realms:0 "Commonwealth of the Spains"
 AOEIW37_SPR_commonwealth_of_realms_desc:0 "Spain coordinates defence, research, and commerce with its American realms through permanent common institutions. The settlement turns imperial loyalty into practical cooperation."
 AOEIW37_SPR_one_crown_two_oceans_idea:0 "One Crown Across Two Oceans"
 AOEIW37_SPR_one_crown_two_oceans_idea_desc:0 "A unified command directs troops and supplies across Spain's Atlantic and Pacific possessions. The crown can move resources quickly, though the American administrations gain little room to set their own course."
 AOEIW37_SPR_postwar_concord:0 "The Postwar Concord"
 AOEIW37_SPR_postwar_concord_desc:0 "Veterans, factories, and colonial budgets are returning to civilian priorities under a settlement agreed with Buenos Aires and Lima."
 AOEIW37_SPR_permanent_imperial_staff:0 "Permanent Imperial Staff"
 AOEIW37_SPR_permanent_imperial_staff_desc:0 "The wartime staff has become a standing institution with officers from Spain and both American administrations. Its plans keep the empire ready for another distant campaign."
 AOEIW37_SPR_imperial_war_cabinet:0 "Imperial War Cabinet"
 AOEIW37_SPR_imperial_war_cabinet_desc:0 "Madrid coordinates shipping, procurement, and operations with Buenos Aires and Lima through a single wartime cabinet."
 AOEIW37_SPR_subject_wartime_mobilisation:0 "American Imperial Mobilisation"
 AOEIW37_SPR_subject_wartime_mobilisation_desc:0 "Local factories and recruiting offices are meeting the quotas agreed by the Imperial Defence Board. The effort strengthens the armies and places strain on civilian life."

 AOEIW37_SPR_imperial_administration_category:0 "The American Realms"
 AOEIW37_SPR_imperial_administration_category_desc:0 "Argentina and Peru administer Spain's South American territories under the crown. Madrid can fund common projects and call imperial conferences, while the two administrations may seek local authority or contribute more deeply to imperial defence. Wartime mobilisation opens a postwar settlement once peace returns."
 AOEIW37_SPR_underwrite_buenos_aires_railways:0 "Underwrite the Buenos Aires Railways"
 AOEIW37_SPR_underwrite_buenos_aires_railways_desc:0 "Guarantee bonds for the final rail links into Buenos Aires. The administration gains infrastructure and a modest degree of authority over the completed network."
 AOEIW37_SPR_fund_andean_mining_corps:0 "Fund the Andean Mining Corps"
 AOEIW37_SPR_fund_andean_mining_corps_desc:0 "Provide Lima with engineers and credit for roads serving the Andean mines. The programme improves extraction research and gives the Peruvian administration responsibility for its works."
 AOEIW37_SPR_convene_american_cabinet:0 "Convene the American Cabinet"
 AOEIW37_SPR_convene_american_cabinet_desc:0 "Bring Argentine and Peruvian priorities before the government. Each session can fund one administration or calm a dispute affecting the whole imperial system."
 AOEIW37_SPR_hold_imperial_manoeuvres:0 "Hold Imperial Manoeuvres"
 AOEIW37_SPR_hold_imperial_manoeuvres_desc:0 "Spend command resources on a joint exercise with Argentine and Peruvian formations. All three staffs gain practical experience and confidence in the common defence plan."
 AOEIW37_SPR_mobilise_the_two_viceroyalties:0 "Mobilise the American Realms"
 AOEIW37_SPR_mobilise_the_two_viceroyalties_desc:0 "Activate the Imperial Defence Board, ship modern rifles across the Atlantic, and call local reservists. The mobilisation strengthens the war effort and creates obligations that must be settled after the fighting."
 AOEIW37_SPR_convene_postwar_congress:0 "Convene the Postwar Congress"
 AOEIW37_SPR_convene_postwar_congress_desc:0 "The emergency has passed, but the wartime apparatus still controls men and factories. A congress will decide whether to restore civilian priorities or preserve the common staff."
 AOEIW37_SPR_issue_reconstruction_bonds:0 "Issue Reconstruction Bonds"
 AOEIW37_SPR_issue_reconstruction_bonds_desc:0 "Use the credit of the three governments to refinance workshops, transport firms, and veterans' cooperatives after the war. The programme keeps the civilian settlement alive long after the first demobilisation orders."
 AOEIW37_SPR_rotate_imperial_staff_colleges:0 "Rotate the Imperial Staff Colleges"
 AOEIW37_SPR_rotate_imperial_staff_colleges_desc:0 "Send a new class of Spanish, Argentine, and Peruvian officers through each other's staff colleges. A permanent command must be renewed by shared training rather than preserved as a wartime relic."
 AOEIW37_ARG_petition_the_crown:0 "Petition Madrid for an Argentine Budget"
 AOEIW37_ARG_petition_the_crown_desc:0 "Ask the crown to finance a civilian project chosen in Buenos Aires. Approval brings investment and responsibility. Refusal will strengthen those who want the administration to act without Madrid."
 AOEIW37_PRU_petition_the_crown:0 "Petition Madrid for a Peruvian Arsenal"
 AOEIW37_PRU_petition_the_crown_desc:0 "Ask the crown to finance an arsenal supervised from Lima. Approval expands local industry and responsibility. Refusal will deepen doubts about the value of imperial consultation."
 AOEIW37_SPR_raise_imperial_regiments:0 "Raise Imperial Regiments"
 AOEIW37_SPR_raise_imperial_regiments_desc:0 "Commit local political influence to recruitment for the common defence plan. The administration gains military experience and accepts tighter obligations to Madrid."
 AOEIW37_SPR_assert_local_procurement:0 "Assert Local Procurement"
 AOEIW37_SPR_assert_local_procurement_desc:0 "Reserve part of the military budget for locally produced rifles. The programme builds a stockpile and proves that the administration can equip its own formations."

 AOEIW37_spr.1.t:0 "Delegates Gather in Cádiz"
 AOEIW37_spr.1.d:0 "Steamers from Buenos Aires and Lima have brought ministers, officers, railway directors, and provincial delegates to Cádiz. They agree that the American realms need roads and protection, but the first budget can favour either civilian development or the machinery of common defence."
 AOEIW37_spr.1.a:0 "Open the treasury for development."
 AOEIW37_spr.1.b:0 "Begin with a common defence plan."
 AOEIW37_spr.2.t:0 "Argentina Sends a Delegation"
 AOEIW37_spr.2.d:0 "The invitation from Cádiz has divided the Argentine ministry. Exporters welcome Spanish credit and naval protection. Provincial leaders want firm guarantees that new railways and taxes will remain under Argentine administration."
 AOEIW37_spr.2.a:0 "Negotiate as a loyal realm."
 AOEIW37_spr.2.b:0 "Demand guarantees before cooperation."
 AOEIW37_spr.3.t:0 "Peru Sends a Delegation"
 AOEIW37_spr.3.d:0 "Lima's delegation includes mining engineers, army officers, and representatives from the northern provinces. They seek capital and shipping for the Andean economy, together with a voice in any command that might send Peruvian troops abroad."
 AOEIW37_spr.3.a:0 "Take Peru's place at the congress."
 AOEIW37_spr.3.b:0 "Protect Lima's authority first."
 AOEIW37_spr.4.t:0 "The Powers of the American Realms"
 AOEIW37_spr.4.d:0 "New railways and joint exercises have made the old ambiguity impossible to maintain. Buenos Aires and Lima want control over local budgets and appointments. The royal staff argues that ships, arms, and foreign policy require a firm command from Madrid."
 AOEIW37_spr.4.a:0 "Ratify the charter and its guarantees."
 AOEIW37_spr.4.b:0 "Confirm the directorate's authority."
 AOEIW37_spr.4.c:0 "Offer emergency concessions to preserve the union."
 AOEIW37_spr.5.t:0 "The American Cabinet Meets"
 AOEIW37_spr.5.d:0 "The cabinet has assembled with a practical agenda. Buenos Aires asks for another rail appropriation, Lima wants better roads through the Andes, and the colonial ministry wants a session devoted to resolving disputes between the administrations."
 AOEIW37_spr.5.a:0 "Fund the Argentine programme."
 AOEIW37_spr.5.b:0 "Fund the Peruvian programme."
 AOEIW37_spr.5.c:0 "Use the session to settle grievances."
 AOEIW37_spr.6.t:0 "The Armies Return Home"
 AOEIW37_spr.6.d:0 "American reservists are returning to farms, mines, and workshops. Wartime procurement boards still control shipping and production, and officers from all three staffs argue that their hard-won coordination should survive the peace."
 AOEIW37_spr.6.a:0 "Restore civilian budgets under a postwar concord."
 AOEIW37_spr.6.b:0 "Keep a permanent imperial staff."
 AOEIW37_spr.7.t:0 "The Argentine Budget Petition"
 AOEIW37_spr.7.d:0 "Buenos Aires requests a crown guarantee for an industrial project chosen by its own ministry. Approval will strengthen local government and expand production. Refusal would save the Spanish treasury, but Argentine politicians are ready to use it as proof that Madrid ignores the southern realm."
 AOEIW37_spr.7.a:0 "Guarantee the Argentine bonds."
 AOEIW37_spr.7.b:0 "The imperial treasury cannot carry the cost."
 AOEIW37_spr.8.t:0 "The Peruvian Arsenal Petition"
 AOEIW37_spr.8.d:0 "Lima asks Madrid to finance an arsenal managed by Peruvian officers and engineers. The plan would equip Andean formations close to their bases and give the administration control over a larger share of military procurement."
 AOEIW37_spr.8.a:0 "Finance the arsenal in Lima."
 AOEIW37_spr.8.b:0 "Keep procurement under Madrid's control."
 AOEIW37_spr.9.t:0 "The Statutes of the Two Oceans"
 AOEIW37_spr.9.d:0 "The crown has published the final statutes governing Spain's American realms. Rail contracts, defence schedules, cabinet seats, and the authority of local ministers now rest on a permanent settlement. Governments across the Atlantic are studying what the renewed Spanish presence means for their own interests."
 AOEIW37_spr.9.a:0 "The imperial settlement enters into force."
 AOEIW37_spr.10.t:0 "Spain Reorders Its American Empire"
 AOEIW37_spr.10.d:0 "Spain has completed a permanent settlement with the Argentine and Peruvian administrations. Their ports and armies now belong to a coordinated Atlantic and Pacific system, giving Madrid a durable influence in South America. Washington must decide whether to engage this order or organize against it."
 AOEIW37_spr.10.a:0 "Open talks with Madrid and the American realms."
 AOEIW37_spr.10.b:0 "Reaffirm opposition to European power in the Americas."
 AOEIW37_spr.11.t:0 "The Spanish Settlement and Portugal"
 AOEIW37_spr.11.d:0 "Spanish shipping and military planning now link Iberia to two large American administrations. Portuguese merchants see opportunities in regular routes, while the general staff worries that Lisbon could face coordinated Spanish pressure in Europe and across the Atlantic."
 AOEIW37_spr.11.a:0 "Seek practical cooperation with Spain."
 AOEIW37_spr.11.b:0 "Prepare for a stronger Spanish position."
 AOEIW37_spr.12.t:0 "A Renewed Spanish Imperial System"
 AOEIW37_spr.12.d:0 "Madrid has concluded its long negotiation with Buenos Aires and Lima. France now faces a Spanish state able to draw industry, ships, and soldiers from a coordinated American sphere, with consequences for trade routes and the balance in Western Europe."
 AOEIW37_spr.12.a:0 "Recognize the settlement and keep channels open."
 AOEIW37_spr.12.b:0 "Treat Spanish consolidation as a strategic challenge."
 AOEIW37_spr.13.t:0 "The Final Imperial Statutes"
 AOEIW37_spr.13.d:0 "Madrid has issued the final statutes for the American realms after years of investment, exercises, and constitutional argument. Our ministers must now put the settlement into practice through local budgets, military obligations, and regular representation before the crown."
 AOEIW37_spr.13.a:0 "Ratify our place in the commonwealth."
 AOEIW37_spr.13.b:0 "Take our place in the crown's strategic command."

 AOEIW37_spr.14.t:0 "The First Orders from Cádiz"
 AOEIW37_spr.14.d:0 "The settlement chosen in Madrid has reached [ROOT.Capital.GetName]. It defines who controls appointments, budgets, and the long chain of cables crossing the Atlantic. Local ministers can now judge the arrangement by the authority it actually gives them."
 AOEIW37_spr.14.a:0 "The charter gives us room to govern."
 AOEIW37_spr.14.b:0 "The directorate expects obedience and results."
 AOEIW37_spr.15.t:0 "A Seat on the Imperial Defence Board"
 AOEIW37_spr.15.d:0 "Our officers have been offered seats beside the Spanish general and naval staffs. Madrid asks for common mobilisation tables and equipment standards. The proposal gives [ROOT.GetNameDef] a voice in imperial strategy, but it also commits our forces to plans drawn across two oceans."
 AOEIW37_spr.15.a:0 "Accept full responsibility for the common plan."
 AOEIW37_spr.15.b:0 "Reserve local operations to our own liaison staff."
 AOEIW37_spr.16.t:0 "Madrid Calls the Wartime Quota"
 AOEIW37_spr.16.d:0 "War has turned the Defence Board's tables into orders. Spanish rifles are arriving at our depots, while Madrid asks for recruits, factory shifts, and shipping on the scale promised at Cádiz. We can meet the full quota or bargain for a smaller contribution under local control."
 AOEIW37_spr.16.a:0 "Honour the full imperial commitment."
 AOEIW37_spr.16.b:0 "Negotiate a quota our government can sustain."
 AOEIW37_spr.17.t:0 "[FROM.GetNameDefCap] Answers the Mobilisation Call"
 AOEIW37_spr.17.d:0 "The reply from [FROM.Capital.GetName] has reached the Imperial War Cabinet. It records the troops, factories, and shipping that [FROM.GetNameDef] will place at the disposal of the common plan—and the limits its ministers have attached to that promise."
 AOEIW37_spr.17.a:0 "Their full commitment strengthens the common command."
 AOEIW37_spr.17.b:0 "Accept the negotiated quota and revise our plans."
 AOEIW37_spr.18.t:0 "The Peace Reaches [ROOT.Capital.GetName]"
 AOEIW37_spr.18.d:0 "The last emergency schedules have been struck from the ministry walls. The settlement in Madrid now determines whether wartime boards yield to civilian reconstruction or survive as a permanent staff linking our officers to Spain."
 AOEIW37_spr.18.a:0 "Turn the common credit toward homes and workshops."
 AOEIW37_spr.18.b:0 "Keep our officers at the common planning table."

