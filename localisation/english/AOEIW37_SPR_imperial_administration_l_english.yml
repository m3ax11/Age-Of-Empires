 AOEIW37_SPR_subject_negotiated_mobilisation:0 "Negotiated American Mobilisation"
 AOEIW37_SPR_subject_negotiated_mobilisation_desc:0 "The administration contributes troops and factory capacity under a locally negotiated quota, preserving civilian stability and a measure of control over deployment."
