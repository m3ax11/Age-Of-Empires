 aoeiw_phase20_chi.100.t:0 "The United Front Rises"
 aoeiw_phase20_chi.100.d:0 "Republican officers, Communist organisers and provincial armies have formed a single Provisional Government of the Chinese United Front. The National Salvation Council calls every Chinese movement willing to overthrow Qing rule into one army."
 aoeiw_phase20_chi.100.a:0 "Join the United Front."
 aoeiw_phase20_chi.203.t:0 "Victory over the Qing"
 aoeiw_phase20_chi.203.d:0 "The imperial field armies have collapsed. Japan forces a settlement in Manchuria and restores Puyi there as its client, while the United Front controls the rest of China. With the common enemy defeated, Chiang, Mao and the Council now contest the future of the revolution."
 aoeiw_phase20_chi.203.a:0 "China must now choose its future."
 aoeiw_phase20_chi.210.t:0 "Puyi Returns to Manchuria"
 aoeiw_phase20_chi.210.d:0 "Japanese protection has preserved an imperial government in Manchuria. Puyi accepts puppet status for the moment and orders preparations for a campaign of National Reclamation."
 aoeiw_phase20_chi.210.a:0 "The Dragon waits in the northeast."
 AOEIW21_JEHOL_ADMINISTRATION:0 "Jehol Imperial Administration"
 AOEIW21_JEHOL_ADMINISTRATION_DEF:0 "the Jehol Imperial Administration"
 AOEIW21_JEHOL_ADMINISTRATION_ADJ:0 "Jehol"
 AOEIW21_JEHOL_ADMINISTRATION_neutrality:0 "Jehol Imperial Administration"
 AOEIW21_JEHOL_ADMINISTRATION_neutrality_DEF:0 "the Jehol Imperial Administration"
 AOEIW21_JEHOL_ADMINISTRATION_neutrality_ADJ:0 "Jehol"
 aoeiw_phase20_chi.300.t:0 "Mongolia Declares Independence"
 aoeiw_phase20_chi.300.d:0 "The Mongolian state has severed its remaining ties to the Qing court. Ulaanbaatar now claims sovereignty over the Mongolian plateau and refuses all imperial orders from Beijing."
 aoeiw_phase20_chi.300.a:0 "The northern marches are lost."
