 AOEIW20_UF_uneasy_coalition:0 "Uneasy Revolutionary Coalition"
 AOEIW20_UF_uneasy_coalition_desc:0 "NRA officers, Communist cadres and provincial armies cooperate because Qing rule must fall first. Their common mobilisation is immense, but political trust remains scarce."
 AOEIW20_UF_joint_general_staff:0 "Joint General Staff"
 AOEIW20_UF_joint_general_staff_desc:0 "A combined command allocates sectors, rail transport and reserves between former rivals."
 AOEIW20_UF_national_salvation_economy:0 "National Salvation Economy"
 AOEIW20_UF_national_salvation_economy_desc:0 "Emergency workshops, dispersed production and compulsory contracts subordinate the economy to victory."
 AOEIW20_UF_final_offensive:0 "Revolutionary Final Offensive"
 AOEIW20_UF_final_offensive_desc:0 "Every formation is committed to breaking the imperial armies before the coalition fractures."
 AOEIW20_QIN_strive_for_survival:0 "Strive for Survival"
 AOEIW20_QIN_strive_for_survival_desc:0 "The dynasty has no programme beyond survival. Its officers fortify the imperial heartland and fight with the desperation of a regime facing extinction."
 AOEIW20_UF_chiang_state:0 "Centralised National Republic"
 AOEIW20_UF_chiang_state_desc:0 "Chiang subordinates the coalition to a professional army, conventional industry and a centralised republican state."
 AOEIW20_UF_mao_state:0 "Revolutionary Industrialisation"
 AOEIW20_UF_mao_state_desc:0 "Mass mobilisation, rural extraction and a crash programme of heavy industrial construction transform the revolution into a modern state."
 AOEIW20_UF_council_state:0 "The Coalition Republic"
 AOEIW20_UF_council_state_desc:0 "Neither camp can dominate. The council survives through permanent compromise and a broad national coalition."
 AOEIW20_MAN_reclamation_mandate:0 "National Reclamation"
 AOEIW20_MAN_reclamation_mandate_desc:0 "Restored by Japan in Manchuria, Puyi prepares a second campaign to impose the dynasty on China."

 AOEIW20_UF_convene_front:0 "Convene the United Front"
 AOEIW20_CHI_authority_collapses:0 "The Collapse of Qing Authority"
 AOEIW20_CHI_authority_collapses_desc:0 "The court can no longer command the army, the provinces or the revolutionary movements gathering against it. A national confrontation is imminent."
