 AOEIW20_CHI_nra:0 "National Revolutionary Army"
 AOEIW20_CHI_nra_long:0 "National Revolutionary Army and Republican Government"
 AOEIW20_CHI_ccp:0 "Communist Party of China"
 AOEIW20_CHI_ccp_long:0 "Communist Party of China and Revolutionary Base Government"
 AOEIW20_CHI_qing_court:0 "Imperial Court"
 AOEIW20_CHI_qing_court_long:0 "Great Qing Imperial Court and Loyalist Provincial Council"

 AOEIW20_CHI_mao_rural_revolutionary:0 "Leader of the Rural Revolution"
 AOEIW20_CHI_mao_rural_revolutionary_desc:0 "Mao builds power through village associations, mobile warfare and political mobilisation. This widens the revolutionary army's base, but cannot immediately replace the industry lost with China's major cities."

 AOEIW9_CHI_politics_root:0 "The Chinese Dynastic Crisis"
 AOEIW9_CHI_politics_root_desc:0 "The court's finances, provincial loyalties and command of the army are all failing at once. Puyi can purchase a costly settlement, Chiang Kai-shek can raise the National Revolutionary Army, or Mao Zedong can turn the rural revolutionary bases into a bid for all China."

 AOEIW9_CHI_politics_p1_1:0 "Seal the Forbidden City"
 AOEIW9_CHI_politics_p1_1_desc:0 "The palace guard closes the capital to revolutionary organisers and forces wavering ministers to declare themselves."
 AOEIW9_CHI_politics_p1_2:0 "Provincial Compacts"
 AOEIW9_CHI_politics_p1_2_desc:0 "Governors will defend the throne only in exchange for subsidies, appointments and guarantees of local authority."
 AOEIW9_CHI_politics_p1_3:0 "Reform the Banner Commands"
 AOEIW9_CHI_politics_p1_3_desc:0 "The old banner establishment is reorganised into reliable capital and railway-security formations."
 AOEIW9_CHI_politics_p1_4:0 "Reopen the Imperial Granaries"
 AOEIW9_CHI_politics_p1_4_desc:0 "Emergency grain purchases calm the cities and visibly bind the dynasty to public order."
 AOEIW9_CHI_politics_p1_5:0 "Purchase the Governors' Loyalty"
 AOEIW9_CHI_politics_p1_5_desc:0 "The court spends heavily to keep provincial administrations, tax offices and garrisons inside the imperial coalition."
 AOEIW9_CHI_politics_p1_6:0 "Break the Revolutionary Cells"
 AOEIW9_CHI_politics_p1_6_desc:0 "Coordinated arrests and military deployments prevent the opposition from assembling a common front."
 AOEIW9_CHI_politics_p1_7:0 "Renew the Mandate"
 AOEIW9_CHI_politics_p1_7_desc:0 "The dynasty survives without civil war, but the bargain is expensive: provincial concessions and permanent relief spending now underpin the throne."

 AOEIW9_CHI_politics_p2_1:0 "The Nanjing Officers' Circle"
 AOEIW9_CHI_politics_p2_1_desc:0 "Chiang's supporters connect academy graduates, republican organisers and sympathetic garrison officers across the lower Yangtze."
 AOEIW9_CHI_politics_p2_2:0 "Revive the Whampoa Network"
 AOEIW9_CHI_politics_p2_2_desc:0 "Personal loyalty among trained officers supplies the skeleton of a national revolutionary command."
 AOEIW9_CHI_politics_p2_3:0 "Promise Republican Institutions"
 AOEIW9_CHI_politics_p2_3_desc:0 "Provincial assemblies and civilian administrators are promised a place in a centralised republic after victory."
 AOEIW9_CHI_politics_p2_4:0 "Arsenal Committees"
 AOEIW9_CHI_politics_p2_4_desc:0 "Workers and officers quietly inventory the Wuhan arsenals and prepare to deny them to the court."
 AOEIW9_CHI_politics_p2_5:0 "Secure the Lower Yangtze"
 AOEIW9_CHI_politics_p2_5_desc:0 "Nanjing, Wuhan and the southern ports form an industrial and administrative base, but Beijing, Chongqing and the northern armies remain imperial."
 AOEIW9_CHI_politics_p2_6:0 "Mobilise the National Revolutionary Army"
 AOEIW9_CHI_politics_p2_6_desc:0 "Provincial garrisons defect in organised columns while republican arsenals issue rifles and ammunition."
 AOEIW9_CHI_politics_p2_7:0 "Raise the Blue Sky Banner"
 AOEIW9_CHI_politics_p2_7_desc:0 "Chiang openly proclaims the National Revolutionary Army. The player will command the NRA's southern and lower-Yangtze territories in a real civil war against Puyi's Great Qing."

 AOEIW9_CHI_politics_p3_1:0 "The Shaan-Gan-Ning Committees"
 AOEIW9_CHI_politics_p3_1_desc:0 "Mao's organisers bind village associations, miners and veteran cadres into a contiguous northwestern revolutionary base."
 AOEIW9_CHI_politics_p3_2:0 "Land to the Tiller"
 AOEIW9_CHI_politics_p3_2_desc:0 "Rent reduction and land redistribution turn political sympathy into manpower and local intelligence."
 AOEIW9_CHI_politics_p3_3:0 "Hide Rifles Among the Villages"
 AOEIW9_CHI_politics_p3_3_desc:0 "Small arms are dispersed through rural cells so the court cannot destroy the revolution with one raid."
 AOEIW9_CHI_politics_p3_4:0 "The Mass Line"
 AOEIW9_CHI_politics_p3_4_desc:0 "Cadres translate village grievances into practical programmes and recruit new organisers from the peasantry itself."
 AOEIW9_CHI_politics_p3_5:0 "Move the Workshops into Caves"
 AOEIW9_CHI_politics_p3_5_desc:0 "Primitive but protected workshops at Yan'an provide a small industrial core for a movement that begins far from China's great cities."
 AOEIW9_CHI_politics_p3_6:0 "Form the Red Field Armies"
 AOEIW9_CHI_politics_p3_6_desc:0 "Militia columns are grouped around veteran cadres and prepared for mobile operations against stronger regular forces."
 AOEIW9_CHI_politics_p3_7:0 "The Autumn Harvest Rises"
 AOEIW9_CHI_politics_p3_7_desc:0 "Mao declares a workers' and peasants' government. The player will command its northwestern base in a real civil war, with fewer regulars, limited aircraft and no meaningful fleet—but exceptional rural mobilisation."

 AOEIW9_CHI_politics_settlement:0 "One China Emerges"
 AOEIW9_CHI_politics_settlement_desc:0 "Only after the civil war has ended—or the dynasty has prevented it—can a single government claim the institutions, resources and armed forces of China."

 AOEIW20_CHI_dynastic_crisis:0 "The Dynastic Crisis"
 AOEIW20_CHI_dynastic_crisis_desc:0 "The imperial treasury is strained, governors bargain with every faction and revolutionary cells spread through army and countryside. The crisis will end only with a new political settlement."
 AOEIW20_CHI_costly_dynastic_settlement:0 "The Costly Imperial Compact"
 AOEIW20_CHI_costly_dynastic_settlement_desc:0 "Puyi has preserved the dynasty through relief, subsidies and provincial concessions. The realm is stable and can develop, but the permanent fiscal cost is considerable."
 AOEIW20_CHI_nra_underground:0 "The NRA Underground"
 AOEIW20_CHI_nra_underground_desc:0 "Republican officers and arsenal committees are quietly building a disciplined alternative command."
 AOEIW20_CHI_nra_civil_war_spirit:0 "National Revolutionary Mobilisation"
 AOEIW20_CHI_nra_civil_war_spirit_desc:0 "The NRA combines trained officers, southern garrisons and republican administrators. It is better organised than Mao's uprising, but must defend a long industrial corridor."
 AOEIW20_CHI_nra_reconstruction:0 "Republican Centralisation and Modernisation"
 AOEIW20_CHI_nra_reconstruction_desc:0 "Chiang's government centralises taxation, military procurement and infrastructure while promising a future constitutional order."
 AOEIW20_CHI_mao_underground:0 "Rural Revolutionary Networks"
 AOEIW20_CHI_mao_underground_desc:0 "Village associations and veteran cadres prepare a revolutionary base beyond the court's reliable administrative reach."
 AOEIW20_CHI_mao_civil_war_spirit:0 "People's War"
 AOEIW20_CHI_mao_civil_war_spirit_desc:0 "Mao's forces field cheap rifles, local militia and exceptional recovery in difficult country. They begin with weak industry, little air power and effectively no navy."
 AOEIW20_CHI_mao_reconstruction:0 "Land Reform and Primitive Accumulation"
 AOEIW20_CHI_mao_reconstruction_desc:0 "The victorious revolution draws labour, food and savings from the countryside to stabilise rule and begin rapid industrialisation. The process is powerful, disruptive and costly."
 AOEIW20_CHI_dynastic_war_machine:0 "The Imperial Loyalist Coalition"
 AOEIW20_CHI_dynastic_war_machine_desc:0 "Puyi commands most of the old regular army, the fleet and the urban state apparatus, reinforced by governors who fear revolutionary centralisation."
 AOEIW20_CHI_emergency_grain_trains:0 "Emergency Grain Trains"
 AOEIW20_CHI_emergency_grain_trains_desc:0 "Railway priority and guarded depots keep food and ammunition moving through the civil-war front."

 AOEIW20_CHI_civil_war_category:0 "The War for China"
 AOEIW20_CHI_civil_war_category_desc:0 "The revolutionary government must turn its starting territorial base into a state capable of defeating the imperial coalition."
 AOEIW20_CHI_raise_county_militias:0 "Raise the County Militias"
 AOEIW20_CHI_raise_county_militias_desc:0 "Mobilise village self-defence associations around a cadre of Red Army veterans."
 AOEIW20_CHI_expand_yanan_cave_arsenals:0 "Expand the Yan'an Cave Arsenals"
 AOEIW20_CHI_expand_yanan_cave_arsenals_desc:0 "Protected workshops will improve the revolutionary base's weak industrial position."
 AOEIW20_CHI_rally_provincial_garrisons:0 "Rally Provincial Garrisons"
 AOEIW20_CHI_rally_provincial_garrisons_desc:0 "Republican officers can bring organised garrison battalions and their stockpiles into the NRA."
 AOEIW20_CHI_secure_lower_yangtze_arsenals:0 "Secure the Lower Yangtze Arsenals"
 AOEIW20_CHI_secure_lower_yangtze_arsenals_desc:0 "Place Wuhan's military workshops and Nanjing's transport administration under central NRA command."
 AOEIW20_CHI_emergency_grain_trains_decision:0 "Run Emergency Grain Trains"
 AOEIW20_CHI_emergency_grain_trains_decision_desc:0 "Give food, ammunition and repair trains absolute priority for four months."

 aoeiw_phase20_chi.1.t:0 "The Mandate Fractures"
 aoeiw_phase20_chi.1.d:0 "Provincial governors delay revenues, republican officers form private circles and Mao's rural committees spread across the northwest. The court can no longer dismiss these as separate disorders. China's next government will be decided by preparation, allegiance and force."
 aoeiw_phase20_chi.1.a:0 "The struggle for China has begun."
 aoeiw_phase20_chi.10.t:0 "The Dynasty Endures"
 aoeiw_phase20_chi.10.d:0 "Subsidies, grain relief and the reformed banner commands have kept governors and garrisons behind Puyi. Revolutionary leaders are arrested or dispersed before they can coordinate a national rising. The Mandate survives—but its invoices will arrive for years."
 aoeiw_phase20_chi.10.a:0 "The throne will pay what survival requires."
 aoeiw_phase20_chi.20.t:0 "The National Revolutionary Army Rises"
 aoeiw_phase20_chi.20.d:0 "Nanjing declares for Chiang Kai-shek. Wuhan's arsenals, southern provincial garrisons and republican administrators follow. Puyi retains Beijing, the northern and western armies, most aircraft and almost the entire fleet. China is now divided by a genuine war for national government."
 aoeiw_phase20_chi.20.a:0 "Command the NRA."
 aoeiw_phase20_chi.30.t:0 "The Autumn Harvest Rises"
 aoeiw_phase20_chi.30.d:0 "Mao Zedong proclaims a revolutionary government from Yan'an. The Shaan-Gan-Ning base provides manpower, defensible country and cadres, but few factories and no useful fleet. Puyi retains the great cities and most regular forces. Victory must be won through mobilisation and manoeuvre."
 aoeiw_phase20_chi.30.a:0 "Command the rural revolution."
 aoeiw_phase20_chi.40.t:0 "One China Emerges"
 aoeiw_phase20_chi.40.d:0 "The rival state has collapsed and its remaining armies are disarmed or incorporated. The victor now controls China's cities, railways and provincial administrations, but reconstruction must reconcile the political promises made during the struggle with the enormous cost of modernisation."
 aoeiw_phase20_chi.40.a:0 "Begin national reconstruction."
