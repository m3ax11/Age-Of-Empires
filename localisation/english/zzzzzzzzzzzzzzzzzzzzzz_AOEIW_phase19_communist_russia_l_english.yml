l_english:
 SOV_SOVIET_UNION:0 "Union of Soviet Republics"
 SOV_SOVIET_UNION_DEF:0 "the Union of Soviet Republics"
 SOV_SOVIET_UNION_ADJ:0 "Soviet"
 AOEIW19_SOV_all_russian_congress:0 "All-Russian Congress"
 AOEIW19_SOV_all_russian_congress_long:0 "All-Russian Congress of Workers', Soldiers' and Peasants' Soviets"
 AOEIW19_union_of_revolutionary_republics:0 "Union of Revolutionary Republics"

 AOEIW19_SOV_stalin_forced_industrialiser:0 "Architect of Forced Industrialization"
 AOEIW19_SOV_stalin_forced_industrialiser_desc:0 "Stalin concentrates authority and investment on an historically severe programme of heavy industrial construction. Output rises quickly, but coercion and social strain follow."
 AOEIW19_SOV_trotsky_revolutionary_tribune:0 "Tribune of Permanent Revolution"
 AOEIW19_SOV_trotsky_revolutionary_tribune_desc:0 "Trotsky treats Russia as the base of an international revolution and demands political debate, military readiness, and relentless ideological initiative."
 AOEIW19_SOV_tukhachevsky_red_militarist:0 "The Red Militarist"
 AOEIW19_SOV_tukhachevsky_red_militarist_desc:0 "Tukhachevsky subordinates civilian politics to military modernization, deep operations, mechanization, and preparation for a continental war."

 AOEIW9_SOV_politics_p3_1:0 "The Putilov Shop Committees"
 AOEIW9_SOV_politics_p3_1_desc:0 "Metalworkers at the Putilov works revive elected shop committees. Their demands spread from wages and bread to ownership, authority, and the end of imperial rule."
 AOEIW9_SOV_politics_p3_2:0 "Bread Queues in Petrograd"
 AOEIW9_SOV_politics_p3_2_desc:0 "Food shortages turn Petrograd's queues into political assemblies. The revolutionary committees must either impose discipline or accept a spontaneous confrontation."
 AOEIW9_SOV_politics_p3_3:0 "Soldiers Elect Their Soviets"
 AOEIW9_SOV_politics_p3_3_desc:0 "Garrison companies elect delegates and refuse orders issued without their countersignature. Imperial command begins to break from below."
 AOEIW9_SOV_politics_p3_4:0 "Land to the Volosts"
 AOEIW9_SOV_politics_p3_4_desc:0 "Peasant volosts seize estates and demand redistribution. The movement can be organized through land committees or driven by immediate requisition."
 AOEIW9_SOV_politics_p3_5:0 "The Railwaymen's Committees"
 AOEIW9_SOV_politics_p3_5_desc:0 "Rail workers control the arteries of the empire. Their committees can isolate loyal garrisons, but competing local orders also disrupt food and military transport."
 AOEIW9_SOV_politics_p3_6:0 "Convene the Red Guard Congress"
 AOEIW9_SOV_politics_p3_6_desc:0 "Urban guards, soldiers' delegates, and railway detachments agree on common commands. The revolution gains armed weight before it gains a state."
 AOEIW9_SOV_politics_p3_7:0 "All Power to the Soviets"
 AOEIW9_SOV_politics_p3_7_desc:0 "The All-Russian Congress will abolish the empire and select the political programme that directs the new union. Stalin, Trotsky, and Tukhachevsky offer profoundly different futures."

 AOEIW19_SOV_congress_of_soviets:0 "Seat the Congress of Soviets"
 AOEIW19_SOV_congress_of_soviets_desc:0 "The revolutionary congress must become a government capable of issuing budgets, appointing commissars, and making its orders reach every province."
 AOEIW19_SOV_land_and_factory_decrees:0 "The Land and Factory Decrees"
 AOEIW19_SOV_land_and_factory_decrees_desc:0 "The first decrees recognize peasant redistribution and worker control while imposing national obligations for grain, labour, and military supply."
 AOEIW19_SOV_gosplan_under_the_soviets:0 "Gosplan Under the Soviets"
 AOEIW19_SOV_gosplan_under_the_soviets_desc:0 "A State Planning Commission will replace improvised factory seizures with material balances, investment schedules, and enforceable production targets."
 AOEIW19_SOV_ural_industrial_combines:0 "The Ural Industrial Combines"
 AOEIW19_SOV_ural_industrial_combines_desc:0 "Perm and Izhevsk will anchor inland combines for steel, machine tools, guns, and heavy engineering beyond the reach of an early western invasion."
 AOEIW19_SOV_railways_of_the_first_plan:0 "Railways of the First Plan"
 AOEIW19_SOV_railways_of_the_first_plan_desc:0 "Industrial growth without rail capacity produces only stranded coal and idle furnaces. Moscow and the Urals will be tied into a military freight system."
 AOEIW19_SOV_red_army_commission:0 "The Red Army Commission"
 AOEIW19_SOV_red_army_commission_desc:0 "Revolutionary legitimacy cannot substitute for staff work. Soldiers' delegates, retained specialists, and new commissars will construct a single chain of command."
 AOEIW19_SOV_universal_military_records:0 "Universal Military Records"
 AOEIW19_SOV_universal_military_records_desc:0 "Local soviets will register trained men, specialists, horses, vehicles, and replacement classes instead of conjuring armies from unrecorded population."
 AOEIW19_SOV_standardise_the_76mm:0 "Standardize the 76 Millimetre"
 AOEIW19_SOV_standardise_the_76mm_desc:0 "A limited family of 76 mm guns, common ammunition, and repairable carriages will give the mass army artillery it can actually sustain."
 AOEIW19_SOV_supply_echelons:0 "Supply Echelons of the Red Army"
 AOEIW19_SOV_supply_echelons_desc:0 "Front, army, and divisional echelons receive defined stocks and transport responsibilities. Strategic depth matters only if supplies move through it."
 AOEIW19_SOV_workers_air_fleet:0 "A Workers' Air Fleet"
 AOEIW19_SOV_workers_air_fleet_desc:0 "Aircraft plants will concentrate on fighters, close support machines, and tactical bombers that can be produced and replaced in large numbers."
 AOEIW19_SOV_rugged_frontline_airframes:0 "Rugged Front-Line Airframes"
 AOEIW19_SOV_rugged_frontline_airframes_desc:0 "Simplified structures and forgiving engines improve reliability and replacement at the accepted price of shorter operational range."
 AOEIW19_SOV_aviation_cities_beyond_the_volga:0 "Aviation Cities Beyond the Volga"
 AOEIW19_SOV_aviation_cities_beyond_the_volga_desc:0 "New air bases and dispersed workshops around Moscow, Stalingrad, and the Urals make front aviation resilient across continental distances."
 AOEIW19_SOV_union_of_revolutionary_republics:0 "Union of Revolutionary Republics"
 AOEIW19_SOV_union_of_revolutionary_republics_desc:0 "The former empire becomes a federal revolutionary union. Its republics receive formal standing while defence, planning, and foreign policy remain common."
 AOEIW19_SOV_stalin_centralise_the_party:0 "Centralize the Party Secretariat"
 AOEIW19_SOV_stalin_centralise_the_party_desc:0 "Stalin turns appointments, records, and regional secretariats into a disciplined machine able to force policy through an immense and resistant country."
 AOEIW19_SOV_stalin_first_five_year_plan:0 "Launch the First Five-Year Plan"
 AOEIW19_SOV_stalin_first_five_year_plan_desc:0 "Heavy industry, electricity, machinery, and armaments receive binding targets. The tempo is extraordinary; so are the sacrifices demanded from workers and villages."
 AOEIW19_SOV_stalin_magnitogorsk_model:0 "The Magnitogorsk Model"
 AOEIW19_SOV_stalin_magnitogorsk_model_desc:0 "New inland industrial cities will be built around integrated steelworks and military plants, reproducing the rapid concentration of real Soviet industrialization."
 AOEIW19_SOV_stalin_socialism_in_one_country:0 "Socialism in One Country"
 AOEIW19_SOV_stalin_socialism_in_one_country_desc:0 "The union will first become an industrial fortress capable of surviving alone. International ambitions yield to consolidation, defence, and productive power."
 AOEIW19_SOV_trotsky_restore_party_democracy:0 "Restore Party Democracy"
 AOEIW19_SOV_trotsky_restore_party_democracy_desc:0 "Trotsky restores organized debate inside the revolutionary movement, accepting slower unanimity in exchange for initiative and accountability."
 AOEIW19_SOV_trotsky_programme_of_the_left_opposition:0 "Programme of the Left Opposition"
 AOEIW19_SOV_trotsky_programme_of_the_left_opposition_desc:0 "Planned industrial growth will be joined to technical education, workers' oversight, and opposition to a self-protecting bureaucratic caste."
 AOEIW19_SOV_trotsky_permanent_revolution:0 "Permanent Revolution"
 AOEIW19_SOV_trotsky_permanent_revolution_desc:0 "The Russian revolution cannot be secure in isolation. Its diplomacy, propaganda, and military planning must prepare for an international struggle."
 AOEIW19_SOV_trotsky_international_red_army:0 "The International Red Army"
 AOEIW19_SOV_trotsky_international_red_army_desc:0 "Experienced revolutionaries, foreign volunteers, and politically educated officers form an army intended to fight beyond Russia as well as defend it."
 AOEIW19_SOV_tukhachevsky_army_above_faction:0 "The Army Above Faction"
 AOEIW19_SOV_tukhachevsky_army_above_faction_desc:0 "Tukhachevsky argues that military competence must stand above party caucuses. The Red Army becomes the organizing spine of the revolutionary state."
 AOEIW19_SOV_tukhachevsky_militarisation_directorate:0 "The Militarization Directorate"
 AOEIW19_SOV_tukhachevsky_militarisation_directorate_desc:0 "Industrial allocation, transport, and labour policy are placed under a permanent military-economic directorate. Civilian development is deliberately subordinated."
 AOEIW19_SOV_tukhachevsky_mechanise_deep_battle:0 "Mechanize Deep Battle"
 AOEIW19_SOV_tukhachevsky_mechanise_deep_battle_desc:0 "Successive echelons, motorized exploitation, mass artillery, and operational aviation turn Tukhachevsky's deep-operations theory into an army system."
 AOEIW19_SOV_tukhachevsky_continental_war_plan:0 "The Continental War Plan"
 AOEIW19_SOV_tukhachevsky_continental_war_plan_desc:0 "The union prepares to mobilize industry and armies for a fast-opening but prolonged continental conflict, accepting political militarization as the price."
 AOEIW19_SOV_the_army_that_endures:0 "The Army That Endures"
 AOEIW19_SOV_the_army_that_endures_desc:0 "Rapid industry, registered reserves, standardized guns, layered supply, and replaceable aircraft create a continental war machine that grows stronger as campaigns lengthen."

 AOEIW19_SOV_factory_soviet_agitation:0 "Factory Soviet Agitation"
 AOEIW19_SOV_factory_soviet_agitation_desc:0 "Shop committees spread revolutionary organization while work stoppages and divided authority reduce output."
 AOEIW19_SOV_disciplined_rationing:0 "Disciplined Revolutionary Rationing"
 AOEIW19_SOV_disciplined_rationing_desc:0 "The committees preserve order through ration cards and guarded depots, consuming administrative and civilian resources."
 AOEIW19_SOV_bread_riots:0 "The Bread Riots"
 AOEIW19_SOV_bread_riots_desc:0 "Spontaneous seizures radicalize the cities but deepen instability."
 AOEIW19_SOV_soldiers_councils:0 "Soldiers' Councils"
 AOEIW19_SOV_soldiers_councils_desc:0 "Elected delegates expand revolutionary manpower while weakening the imperial chain of command."
 AOEIW19_SOV_peasant_land_committees:0 "Peasant Land Committees"
 AOEIW19_SOV_peasant_land_committees_desc:0 "Orderly redistribution wins rural support but temporarily diverts labour and tools from construction."
 AOEIW19_SOV_forced_requisition:0 "Forced Requisition"
 AOEIW19_SOV_forced_requisition_desc:0 "Coercive seizures feed cities and armies while provoking disorder and waste."
 AOEIW19_SOV_railway_committee_disruption:0 "Railway Committee Disruption"
 AOEIW19_SOV_railway_committee_disruption_desc:0 "Rail workers can stop loyalist movements, but local control fragments national freight schedules."
 AOEIW19_SOV_red_guard_columns:0 "Red Guard Columns"
 AOEIW19_SOV_red_guard_columns_desc:0 "Armed workers provide numbers and speed before they possess divisional discipline."
 AOEIW19_SOV_postrevolution_officer_collapse:0 "Collapse of the Imperial Officer Corps"
 AOEIW19_SOV_postrevolution_officer_collapse_desc:0 "Desertion, arrest, and divided loyalty leave the new Red Army without a functioning command system."
 AOEIW19_SOV_postrevolution_industrial_seizures:0 "Uncoordinated Industrial Seizures"
 AOEIW19_SOV_postrevolution_industrial_seizures_desc:0 "Ownership changed faster than accounts, orders, or technical management."
 AOEIW19_SOV_postrevolution_supply_breakdown:0 "Breakdown of Imperial Supply"
 AOEIW19_SOV_postrevolution_supply_breakdown_desc:0 "Depots and rail districts answer to competing authorities while the army consumes whatever reaches it."
 AOEIW19_SOV_land_and_factory_decrees_spirit:0 "Land and Factory Decrees"
 AOEIW19_SOV_land_and_factory_decrees_spirit_desc:0 "Revolutionary rights are tied to grain delivery, labour registration, and national defence."
 AOEIW19_SOV_gosplan_spirit:0 "Gosplan"
 AOEIW19_SOV_gosplan_spirit_desc:0 "Material balances and compulsory targets accelerate construction while reducing civilian choice."
 AOEIW19_SOV_ural_combines_spirit:0 "Ural Industrial Combines"
 AOEIW19_SOV_ural_combines_spirit_desc:0 "Inland steel and engineering centres sustain high military output beyond the western frontier."
 AOEIW19_SOV_first_plan_railways_spirit:0 "Railways of the First Plan"
 AOEIW19_SOV_first_plan_railways_spirit_desc:0 "Industrial and military freight receive coordinated priority across the continental network."
 AOEIW19_SOV_red_army_commission_spirit:0 "Red Army Commission"
 AOEIW19_SOV_red_army_commission_spirit_desc:0 "Delegates, specialists, and commissars share a unified command system."
 AOEIW19_SOV_universal_military_records_spirit:0 "Universal Military Records"
 AOEIW19_SOV_universal_military_records_spirit_desc:0 "Every district tracks replacement classes and military specialists for sustained mobilization."
 AOEIW19_SOV_standard_76mm_spirit:0 "The Standard 76 mm"
 AOEIW19_SOV_standard_76mm_spirit_desc:0 "Common guns, shells, and carriages make mass artillery affordable and effective."
 AOEIW19_SOV_supply_echelons_spirit:0 "Red Army Supply Echelons"
 AOEIW19_SOV_supply_echelons_spirit_desc:0 "Layered stocks and transport responsibilities reduce wastage over great distances."
 AOEIW19_SOV_workers_air_fleet_spirit:0 "Workers' Air Fleet"
 AOEIW19_SOV_workers_air_fleet_spirit_desc:0 "Factories mass-produce fighters, close-support aircraft, and tactical bombers."
 AOEIW19_SOV_rugged_airframes_spirit:0 "Rugged Front-Line Airframes"
 AOEIW19_SOV_rugged_airframes_spirit_desc:0 "Simple, reliable aircraft return to service quickly but sacrifice operational range."
 AOEIW19_SOV_front_aviation_spirit:0 "Front Aviation"
 AOEIW19_SOV_front_aviation_spirit_desc:0 "Air commands are organized to move with and directly support the ground fronts."
 AOEIW19_SOV_union_of_republics_spirit:0 "Union of Soviet Republics"
 AOEIW19_SOV_union_of_republics_spirit_desc:0 "Federal forms reconcile revolutionary self-government with common planning and defence."
 AOEIW19_SOV_stalin_central_committee_spirit:0 "The Central Committee Machine"
 AOEIW19_SOV_stalin_central_committee_spirit_desc:0 "A disciplined appointment network can force decisions through the new state."
 AOEIW19_SOV_stalin_first_five_year_plan_spirit:0 "The First Five-Year Plan"
 AOEIW19_SOV_stalin_first_five_year_plan_spirit_desc:0 "Binding heavy-industry targets produce rapid growth through severe social extraction."
 AOEIW19_SOV_stalin_magnitogorsk_spirit:0 "The Magnitogorsk Model"
 AOEIW19_SOV_stalin_magnitogorsk_spirit_desc:0 "Integrated inland industrial cities concentrate steel, machines, and armaments."
 AOEIW19_SOV_stalin_socialism_one_country_spirit:0 "Socialism in One Country"
 AOEIW19_SOV_stalin_socialism_one_country_spirit_desc:0 "An industrial fortress combines consolidation, mass production, and territorial defence."
 AOEIW19_SOV_trotsky_workers_democracy_spirit:0 "Workers' Democracy"
 AOEIW19_SOV_trotsky_workers_democracy_spirit_desc:0 "Open soviet debate improves legitimacy but initially complicates industrial command."
 AOEIW19_SOV_trotsky_left_opposition_spirit:0 "Programme of the Left Opposition"
 AOEIW19_SOV_trotsky_left_opposition_spirit_desc:0 "Planning, technical education, and workers' oversight challenge bureaucratic stagnation."
 AOEIW19_SOV_trotsky_permanent_revolution_spirit:0 "Permanent Revolution"
 AOEIW19_SOV_trotsky_permanent_revolution_spirit_desc:0 "The state accepts domestic strain in order to remain ready for an international revolutionary contest."
 AOEIW19_SOV_trotsky_international_red_army_spirit:0 "International Red Army"
 AOEIW19_SOV_trotsky_international_red_army_spirit_desc:0 "Political conviction, foreign experience, and flexible command improve sustained offensive recovery."
 AOEIW19_SOV_tukhachevsky_war_council_spirit:0 "Revolutionary War Council"
 AOEIW19_SOV_tukhachevsky_war_council_spirit_desc:0 "The army becomes the coordinating institution of the revolutionary state."
 AOEIW19_SOV_tukhachevsky_militarised_economy_spirit:0 "Militarized Economy"
 AOEIW19_SOV_tukhachevsky_militarised_economy_spirit_desc:0 "Arms production and military construction take priority over civilian development and politics."
 AOEIW19_SOV_tukhachevsky_deep_battle_spirit:0 "Mechanized Deep Battle"
 AOEIW19_SOV_tukhachevsky_deep_battle_spirit_desc:0 "Successive echelons and mechanized exploitation trade logistical economy for operational rupture."
 AOEIW19_SOV_tukhachevsky_continental_war_plan_spirit:0 "Continental War Plan"
 AOEIW19_SOV_tukhachevsky_continental_war_plan_spirit_desc:0 "The entire state is arranged to begin and sustain a vast land war."
 AOEIW19_SOV_army_that_endures_spirit:0 "The Army That Endures"
 AOEIW19_SOV_army_that_endures_spirit_desc:0 "Industry, reserves, artillery, supply, and aviation replace losses faster than a continental enemy can exploit them."

 aoeiw_phase19_sov.1.t:0 "Bread Queues in Petrograd"
 aoeiw_phase19_sov.1.d:0 "Bakeries are empty while armed workers guard railway depots. The soviets must choose whether to impose ration discipline or allow the crowd to seize what it can."
 aoeiw_phase19_sov.1.a:0 "Ration cards before slogans."
 aoeiw_phase19_sov.1.b:0 "Let the queues become the revolution."
 aoeiw_phase19_sov.2.t:0 "The Land Question"
 aoeiw_phase19_sov.2.d:0 "Village assemblies are dividing estates before Petrograd can write a decree. A negotiated committee system may preserve planting; immediate requisition will feed the cities sooner."
 aoeiw_phase19_sov.2.a:0 "Recognize the peasant land committees."
 aoeiw_phase19_sov.2.b:0 "The cities and army need grain now."
 aoeiw_phase19_sov.3.t:0 "The All-Russian Congress"
 aoeiw_phase19_sov.3.d:0 "The imperial ministries have fallen and Nicholas II no longer commands the state. Delegates now choose who will turn victory into a durable revolutionary order: Stalin's centralized industrial drive, Trotsky's permanent revolution, or Tukhachevsky's militarized deep-battle state."
 aoeiw_phase19_sov.3.a:0 "Stalin will build socialism into an industrial fortress."
 aoeiw_phase19_sov.3.b:0 "Trotsky will carry the revolution beyond Russia."
 aoeiw_phase19_sov.3.c:0 "Tukhachevsky will forge the state into an army."
