 AOEIW17_GER_workers_council_congress:0 "Workers' Council Congress"
 AOEIW17_GER_workers_council_congress_long:0 "Congress of German Workers' and Soldiers' Councils"
 AOEIW17_industrial_republics_league:0 "League of Industrial Republics"

 AOEIW9_GER_politics_p3_1:0 "The Ruhr Workers Organise"
 AOEIW9_GER_politics_p3_1_desc:0 "The Ruhr's miners, railwaymen and metalworkers are turning wage committees into permanent political organisations. Their strength lies not in speeches at the Reichstag, but in their ability to stop the furnaces and rail yards on which the empire depends."
 AOEIW9_GER_politics_p3_2:0 "The Reichsrätekongress"
 AOEIW9_GER_politics_p3_2_desc:0 "Delegates pack the old Prussian chamber. The industrial unions demand binding national direction; the works councils answer that the revolution belongs to the shop floor."
 AOEIW9_GER_politics_p3_3:0 "The Rhine General Strike"
 AOEIW9_GER_politics_p3_3_desc:0 "Coal trains halt, blast furnaces cool and barges remain at their moorings. The strike can break imperial authority, but every idle shift also deprives Germany of the machines and weapons it will need afterward."
 AOEIW9_GER_politics_p3_4:0 "Arm the Red Front"
 AOEIW9_GER_politics_p3_4_desc:0 "The Roter Frontkämpferbund and factory defence groups will secure depots, bridges and council halls. Their enthusiasm is considerable; their ability to operate as a modern army is not."
 AOEIW9_GER_politics_p3_5:0 "Break Prussian Officer Rule"
 AOEIW9_GER_politics_p3_5_desc:0 "The political authority of the Prussian officer caste must end. The councils must still decide whether engineers and technical officers can serve under supervision or whether the entire command structure must be swept away."
 AOEIW9_GER_politics_p3_6:0 "Occupy the Ministries"
 AOEIW9_GER_politics_p3_6_desc:0 "Railway schedules, telegraph exchanges and armaments ledgers matter more than empty palaces. Council guards will occupy the ministries and redirect the administrative machinery toward the revolutionary congress."
 AOEIW9_GER_politics_p3_7:0 "Proclaim the Workers' Federation"
 AOEIW9_GER_politics_p3_7_desc:0 "The imperial constitution has ceased to command obedience. A federation of workers' and soldiers' councils will replace the Kaiserreich, dissolve its unequal alliance system and inherit a country shaken by strikes and command collapse."

 AOEIW17_GER_revolutionary_council:0 "All Power to the Councils!"
 AOEIW17_GER_revolutionary_council_desc:0 "The palace ministries are empty, but Germany still needs bread trains, budgets and orders that reach beyond Berlin. The councils will govern in their own name."
 AOEIW17_GER_ruhr_works_directorate:0 "Essen Must Produce"
 AOEIW17_GER_ruhr_works_directorate_desc:0 "The furnaces cannot be run from a speaker's platform. Engineers, miners and union delegates will reopen the Ruhr works under a single production pact."
 AOEIW17_GER_national_production_ledger:0 "Count Every Lathe"
 AOEIW17_GER_national_production_ledger_desc:0 "Cartel books are seized and factory delegates report every machine, skilled shift and stockpile. Contracts will follow what Germany can actually build."
 AOEIW17_GER_quota_tank_standardisation:0 "One Chassis, Ten Thousand Tanks"
 AOEIW17_GER_quota_tank_standardisation_desc:0 "The armoured programme will abandon prestige models for a few repeatable hulls and engines. The quota is unforgiving; workshops are expected to make the design work."
 AOEIW17_GER_mechanised_shift:0 "Mechanise the Factory Battalions"
 AOEIW17_GER_mechanised_shift_desc:0 "The men who defended factory gates must become mobile infantry able to keep pace with armoured formations. German vehicle works will turn council battalions into a mechanised field force."
 AOEIW17_GER_red_general_staff:0 "The Red General Staff"
 AOEIW17_GER_red_general_staff_desc:0 "The old caste is gone, but staff work remains necessary. Politically reliable commanders, railway planners and supervised specialists will build a new doctrine around movement, firepower and industrial depth."
 AOEIW17_GER_artillery_syndicates:0 "Artillery Syndicates of the Ruhr"
 AOEIW17_GER_artillery_syndicates_desc:0 "Gun works, chemical plants and shell-filling facilities will share standards and production schedules. The result will be a dependable river of guns and ammunition rather than prestige prototypes."
 AOEIW17_GER_rail_war_directorate:0 "The Revolution Runs on Rails"
 AOEIW17_GER_rail_war_directorate_desc:0 "Coal from Essen, guns from the Ruhr and troops from Berlin must arrive on the same timetable. Railwaymen and field staffs will plan the war together."
 AOEIW17_GER_workers_armoured_corps:0 "Workers' Armoured Corps"
 AOEIW17_GER_workers_armoured_corps_desc:0 "Armoured units will no longer be the private school of an aristocratic officer elite. Tank crews, motorised infantry and artillery observers will train together as a single revolutionary striking force."
 AOEIW17_GER_dessau_aviation_combine:0 "The Dessau Aviation Combine"
 AOEIW17_GER_dessau_aviation_combine_desc:0 "Dessau's aircraft works and their suppliers will be reorganised into a worker-run combine. Standard components and stable production lines will make aircraft replacement a central industrial priority."
 AOEIW17_GER_battlefield_air_brigades:0 "Battlefield Air Brigades"
 AOEIW17_GER_battlefield_air_brigades_desc:0 "Pilots and ground controllers will train alongside the armoured corps. Close air support will become flying artillery directed by the same operational plan as tanks and guns."
 AOEIW17_GER_mass_airframes:0 "Airframes by the Shift"
 AOEIW17_GER_mass_airframes_desc:0 "Fighter and attack-aircraft production will be measured by complete shifts rather than heroic individual machines. Replacement pools, dispersed components and rapid repair will keep the sky contested."
 AOEIW17_GER_equality_for_warsaw:0 "Equality for Warsaw"
 AOEIW17_GER_equality_for_warsaw_desc:0 "Poland is no longer a German subject. Berlin will offer security and industrial cooperation only on the basis of sovereign equality, leaving Warsaw to decide whether any partnership remains possible."
 AOEIW17_GER_rotterdam_protocol:0 "The Rotterdam Protocol"
 AOEIW17_GER_rotterdam_protocol_desc:0 "Ruhr coal and Dutch ports remain economically bound despite the Reichspakt's collapse. A practical protocol can preserve trade without restoring German political supremacy."
 AOEIW17_GER_kiel_sailors_councils:0 "Recognise the Kiel Sailors' Councils"
 AOEIW17_GER_kiel_sailors_councils_desc:0 "The sailors who secured Kiel demand authority over the fleet they preserved. Germany must reconcile elected committees with the technical knowledge required to keep a modern navy at sea."
 AOEIW17_GER_industrial_republics_league:0 "League of Industrial Republics"
 AOEIW17_GER_industrial_republics_league_desc:0 "The old hierarchy of emperor, clients and dependants will not return. States willing to cooperate as equals may join a defensive league built around railways, ports and mutual industrial survival."
 AOEIW17_GER_fortress_of_labour:0 "Fortress of Labour"
 AOEIW17_GER_fortress_of_labour_desc:0 "If Germany cannot trust its neighbours, it will defend the revolution behind disciplined factories, prepared frontiers and a population organised for prolonged continental war."
 AOEIW17_GER_red_high_seas_fleet:0 "The Red High Seas Fleet"
 AOEIW17_GER_red_high_seas_fleet_desc:0 "Kiel's political settlement will be translated into a reliable chain of command. The fleet will remain intact, trained and capable of protecting Germany's coasts and industrial sea routes."
 AOEIW17_GER_machine_war_state:0 "The Machine-War State"
 AOEIW17_GER_machine_war_state_desc:0 "Factory councils, armoured corps, artillery syndicates, aviation combines and railway planners now operate as one system. Revolutionary Germany has become a worker-controlled machine for sustained combined-arms war."

 AOEIW17_GER_factory_unrest:0 "Ruhr Factory Unrest"
 AOEIW17_GER_factory_unrest_desc:0 "Shop-floor committees challenge foremen, contracts and government authority across the Ruhr. Production continues, but every decision is contested."
 AOEIW17_GER_general_strike:0 "The Rhine General Strike"
 AOEIW17_GER_general_strike_desc:0 "The revolutionary strike has paralysed Germany's industrial and transport heartland. It may destroy the empire, but it cannot supply a modern army."
 AOEIW17_GER_red_front_militias:0 "Red Front Militias"
 AOEIW17_GER_red_front_militias_desc:0 "Factory guards and political veterans provide manpower and local security, but they disrupt established command and planning."
 AOEIW17_GER_supervised_technical_officers:0 "Supervised Technical Officers"
 AOEIW17_GER_supervised_technical_officers_desc:0 "Engineers and staff specialists have been retained under political supervision. Suspicion slows decisions, but essential knowledge survives."
 AOEIW17_GER_prussian_command_purged:0 "The Prussian Command Purged"
 AOEIW17_GER_prussian_command_purged_desc:0 "The old command caste has been removed wholesale. Political control is secure, while operational competence must be rebuilt from below."
 AOEIW17_GER_postrevolution_industry_disruption:0 "Dislocated Industrial Councils"
 AOEIW17_GER_postrevolution_industry_disruption_desc:0 "The owners have fled and the strike is over, but local councils lack common contracts, standards and material allocations."
 AOEIW17_GER_postrevolution_command_disruption:0 "A Broken Chain of Command"
 AOEIW17_GER_postrevolution_command_disruption_desc:0 "Imperial authority collapsed faster than a replacement command system could be constructed."
 AOEIW17_GER_council_pluralism:0 "Pluralist Works Councils"
 AOEIW17_GER_council_pluralism_desc:0 "Local councils retain wide autonomy, encouraging experimentation and legitimacy at the cost of slower central political direction."
 AOEIW17_GER_union_discipline:0 "Industrial Union Discipline"
 AOEIW17_GER_union_discipline_desc:0 "National unions impose stable production discipline, raising output while requiring negotiated material concessions to organised labour."
 AOEIW17_GER_ruhr_works_directorate_spirit:0 "Ruhr Works Directorate"
 AOEIW17_GER_ruhr_works_directorate_spirit_desc:0 "Engineers, union delegates and commissioners coordinate the Ruhr as a single armaments region."
 AOEIW17_GER_national_production_ledger_spirit:0 "National Production Ledger"
 AOEIW17_GER_national_production_ledger_spirit_desc:0 "A common accounting system lets factories sustain higher efficiency and begin new production lines with less disruption."
 AOEIW17_GER_quota_tank_standardisation_spirit:0 "Quota Tank Standardisation"
 AOEIW17_GER_quota_tank_standardisation_spirit_desc:0 "Tank IC cost: §G-15%§!\nTank reliability: §R-10%§!\n\nRadical standardisation lowers armoured-vehicle cost while rushed tolerances and inflexible quotas reduce mechanical reliability."
 AOEIW17_GER_mechanised_shift_spirit:0 "The Mechanised Shift"
 AOEIW17_GER_mechanised_shift_spirit_desc:0 "Vehicle plants and factory battalions are organised around inexpensive mechanised transport and rapid operational movement."
 AOEIW17_GER_red_general_staff_spirit:0 "Red General Staff"
 AOEIW17_GER_red_general_staff_spirit_desc:0 "Political commanders and technical planners have created a coherent revolutionary chain of command."
 AOEIW17_GER_artillery_syndicates_spirit:0 "Artillery Syndicates"
 AOEIW17_GER_artillery_syndicates_spirit_desc:0 "Common gun and ammunition standards reduce artillery cost without discounting tanks, aircraft or ships."
 AOEIW17_GER_rail_war_directorate_spirit:0 "Rail War Directorate"
 AOEIW17_GER_rail_war_directorate_spirit_desc:0 "Rail construction, supply nodes and operational timetables are coordinated for high-tempo continental warfare."
 AOEIW17_GER_workers_armoured_corps_spirit:0 "Workers' Armoured Corps"
 AOEIW17_GER_workers_armoured_corps_spirit_desc:0 "Armour, motorised infantry and artillery train as a unified revolutionary combined-arms force."
 AOEIW17_GER_workers_aviation_combine_spirit:0 "Workers' Aviation Combine"
 AOEIW17_GER_workers_aviation_combine_spirit_desc:0 "Standardised fighter and close-support production makes aircraft replacement a mass-industrial process."
 AOEIW17_GER_battlefield_air_brigades_spirit:0 "Battlefield Air Brigades"
 AOEIW17_GER_battlefield_air_brigades_spirit_desc:0 "Air-ground liaison teams turn close air support into a precise extension of artillery and armoured operations."
 AOEIW17_GER_fleet_technical_compromise:0 "Fleet Technical Compromise"
 AOEIW17_GER_fleet_technical_compromise_desc:0 "Naval engineers and officers remain under elected supervision while the fleet adapts to its new political chain of command."
 AOEIW17_GER_sailors_command:0 "Sailors' Command"
 AOEIW17_GER_sailors_command_desc:0 "Kiel's committees control appointments and operations. Revolutionary confidence is high, but fleet coordination and dockyard output suffer."
 AOEIW17_GER_red_high_seas_fleet_spirit:0 "Red High Seas Fleet"
 AOEIW17_GER_red_high_seas_fleet_spirit_desc:0 "The preserved fleet now combines political loyalty with a stable technical command and renewed dockyard support."
 AOEIW17_GER_revolutionary_diplomacy_spirit:0 "Diplomacy of Equal Republics"
 AOEIW17_GER_revolutionary_diplomacy_spirit_desc:0 "Berlin seeks industrial security through equal treaties rather than imperial clients."
 AOEIW17_GER_fortress_of_labour_spirit:0 "Fortress of Labour"
 AOEIW17_GER_fortress_of_labour_spirit_desc:0 "The workers' state accepts diplomatic isolation and organises its factories, frontiers and population for defence."
 AOEIW17_GER_machine_war_state_spirit:0 "Machine-War State"
 AOEIW17_GER_machine_war_state_spirit_desc:0 "Every arm of revolutionary Germany is integrated into a high-efficiency industrial system for sustained combined-arms warfare."

 aoeiw_phase17_ger.1.t:0 "The Berlin Council Congress"
 aoeiw_phase17_ger.1.d:0 "Delegates crowd the former parliamentary galleries while Ruhr unions demand binding national quotas and local works councils defend their autonomy. Both factions support revolution; they disagree over who will command production after victory."
 aoeiw_phase17_ger.1.a:0 "The industrial unions must impose discipline."
 aoeiw_phase17_ger.1.b:0 "Authority belongs to the local councils."
 aoeiw_phase17_ger.2.t:0 "The Officer Question"
 aoeiw_phase17_ger.2.d:0 "The Prussian command hierarchy has lost political authority, yet Germany still needs engineers, railway officers and trained staff planners. The councils must distinguish technical service from caste privilege—or remove both together."
 aoeiw_phase17_ger.2.a:0 "Retain specialists under council supervision."
 aoeiw_phase17_ger.2.b:0 "Sweep the Prussian command away."
 aoeiw_phase17_ger.3.t:0 "The German Workers' Federation"
 aoeiw_phase17_ger.3.d:0 "Imperial ministries have fallen silent. In Berlin, delegates proclaim a federation of workers' and soldiers' councils, end the monarchy and dissolve the Reichspakt's hierarchy. The revolution inherits immense factories, an intact fleet and a dangerously fractured state."
 aoeiw_phase17_ger.3.a:0 "The furnaces belong to those who work them."
 aoeiw_phase17_ger.4.t:0 "Kiel Demands a Settlement"
 aoeiw_phase17_ger.4.d:0 "The sailors who secured Kiel refuse a return to unquestioned admiralty authority. Naval engineers warn that committees cannot improvise gunnery tables, turbine maintenance or fleet logistics. A durable compromise must preserve both loyalty and competence."
 aoeiw_phase17_ger.4.a:0 "Technical command under elected supervision."
 aoeiw_phase17_ger.4.b:0 "The sailors will command their own fleet."
 aoeiw_phase17_ger.5.t:0 "The Reichspakt Collapses"
 aoeiw_phase17_ger.5.d:0 "Berlin's revolution has ended German imperial rule and, with it, Poland's subject status. Warsaw is sovereign at last. The question is whether security now requires armed distance from Germany or an equal pact with the new federation."
 aoeiw_phase17_ger.5.a:0 "Poland will guard its independence alone."
 aoeiw_phase17_ger.5.b:0 "An equal neighbour may be dealt with."
 aoeiw_phase17_ger.6.t:0 "The Ruhr Beyond the Border"
 aoeiw_phase17_ger.6.d:0 "The Reichspakt is gone, but Dutch ports and Ruhr industry remain joined by river, rail and contract. The Hague must choose between Atlantic neutrality and a strictly equal industrial accommodation with revolutionary Germany."
 aoeiw_phase17_ger.6.a:0 "Close the political door and face the Atlantic."
 aoeiw_phase17_ger.6.b:0 "Negotiate a Ruhr-Rotterdam accord."

 AOEIW17_revolutionary_betrayal:0 "Revolutionary Rupture"
 AOEIW17_equal_republics:0 "Equal Republican Relations"
 AOEIW17_pragmatic_industrial_relations:0 "Pragmatic Industrial Relations"
