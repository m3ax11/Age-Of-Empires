l_english:
 ITA_COMMUNES:0 "Federation of Italian Communes"
 ITA_COMMUNES_DEF:0 "the Federation of Italian Communes"
 ITA_COMMUNES_ADJ:0 "Italian"
 AOEIW18_ITA_council_congress:0 "Council Congress"
 AOEIW18_ITA_council_congress_long:0 "Congress of Workers', Peasants' and Sailors' Councils"
 AOEIW18_balkan_defence_compact:0 "Balkan Defence Compact"
 AOEIW18_mediterranean_workers_compact:0 "Mediterranean Workers' Compact"

 AOEIW9_ITA_politics_p3_1:0 "The Turin Factory Councils"
 AOEIW9_ITA_politics_p3_1_desc:0 "At FIAT, the railway shops and Turin's machine works, delegates are again being chosen by the benches rather than appointed from Rome. Their first demand is control of production; their second is an Italy governed by councils."
 AOEIW9_ITA_politics_p3_2:0 "Convene the Milan Chamber of Labour"
 AOEIW9_ITA_politics_p3_2_desc:0 "Milan's unions, socialist clubs and workshop delegates can turn scattered agitation into a northern revolutionary command. They must decide whether authority rests in disciplined industrial federations or autonomous municipal communes."
 AOEIW9_ITA_politics_p3_3:0 "The Lockout on the Po"
 AOEIW9_ITA_politics_p3_3_desc:0 "Owners have answered factory occupation with a coordinated lockout from Piedmont to Lombardy. The councils will answer with a general strike, accepting lost output now to deny the monarchy its industrial base."
 AOEIW9_ITA_politics_p3_4:0 "Land Committees of the Mezzogiorno"
 AOEIW9_ITA_politics_p3_4_desc:0 "A northern factory revolt cannot govern Italy while southern labourers remain beneath the latifundia. Organisers sent through Campania and Apulia must choose persuasion and cooperatives or immediate compulsory levies."
 AOEIW9_ITA_politics_p3_5:0 "Arm the Arditi del Popolo"
 AOEIW9_ITA_politics_p3_5_desc:0 "Veterans, railwaymen and neighbourhood defence groups will be organised into Red Guard formations. They can protect council halls and arsenals, but enthusiasm cannot substitute for a unified staff."
 AOEIW9_ITA_politics_p3_6:0 "Sailors at La Spezia"
 AOEIW9_ITA_politics_p3_6_desc:0 "The fleet cannot be treated as an afterthought. Sailors at La Spezia and Taranto are forming committees, while engineers and officers demand guarantees that discipline and maintenance will survive the revolution."
 AOEIW9_ITA_politics_p3_7:0 "Proclaim the Federation of Communes"
 AOEIW9_ITA_politics_p3_7_desc:0 "Delegates from factories, farms, barracks and ships will abolish the House of Savoy and proclaim a federation of Italian communes. The monarchy and its Mediterranean League cannot survive that declaration unchanged."

 AOEIW18_ITA_council_of_communes:0 "Seat the Council of Communes"
 AOEIW18_ITA_council_of_communes_desc:0 "The emergency congress must become a functioning state. Production boards, municipal delegates, agrarian committees and sailors will receive defined votes, budgets and responsibilities."
 AOEIW18_ITA_turin_national_workshops:0 "The Turin National Workshops"
 AOEIW18_ITA_turin_national_workshops_desc:0 "Turin's machine works will reopen under elected production councils, restoring disrupted output and concentrating scarce tooling on the weapons the new state can actually manufacture."
 AOEIW18_ITA_lombard_production_exchange:0 "The Lombard Production Exchange"
 AOEIW18_ITA_lombard_production_exchange_desc:0 "Milan will coordinate orders, components and rail deliveries between Lombardy's workshops. Transparent ledgers allow one cooperative's unused capacity to answer another's shortage."
 AOEIW18_ITA_reclaim_the_latifundia:0 "Reclaim the Latifundia"
 AOEIW18_ITA_reclaim_the_latifundia_desc:0 "The emergency southern policy must give way to a durable settlement. Large estates will be divided among cooperatives in exchange for grain quotas, rural roads and service in the communal army."
 AOEIW18_ITA_arsenal_of_the_po:0 "Arsenal of the Po"
 AOEIW18_ITA_arsenal_of_the_po_desc:0 "Turin metallurgy, Lombard precision shops and the Po railway corridor will be organised as one arsenal, with particular attention to guns, shells and the repair of field equipment."
 AOEIW18_ITA_peoples_army_commission:0 "The People's Army Commission"
 AOEIW18_ITA_peoples_army_commission_desc:0 "Militia delegates and retained technical officers will write a common chain of command. Political accountability remains, but orders in battle cannot be debated by every street committee."
 AOEIW18_ITA_cooperative_artillery_foundries:0 "Cooperative Artillery Foundries"
 AOEIW18_ITA_cooperative_artillery_foundries_desc:0 "Brescia, Terni and the northern metalworking cooperatives will standardise field pieces and shell production. Fewer competing models mean more guns arriving at the front."
 AOEIW18_ITA_militias_into_divisions:0 "Turn Militias into Divisions"
 AOEIW18_ITA_militias_into_divisions_desc:0 "Red Guards will be grouped into territorial divisions with regular supply tables, training cadres and reinforcement depots. The revolution needs formations that recover after battle, not merely armed crowds."
 AOEIW18_ITA_alpine_adriatic_staff:0 "The Alpine-Adriatic Staff"
 AOEIW18_ITA_alpine_adriatic_staff_desc:0 "Italy's war planning must unite Alpine defence, Adriatic ports and the railways between them. Staff schools will emphasise supply economy, prepared movement and combined coastal operations."
 AOEIW18_ITA_caproni_under_council_control:0 "Caproni under Council Control"
 AOEIW18_ITA_caproni_under_council_control_desc:0 "Caproni's plants and dispersed subcontractors will be run as an aviation combine. Standardised fighters, assault aircraft and naval bombers will replace prestigious but incompatible production runs."
 AOEIW18_ITA_littoral_strike_groups:0 "Littoral Strike Groups"
 AOEIW18_ITA_littoral_strike_groups_desc:0 "Pilots will train with coastal observers, fleet scouts and army liaison officers. The same aircraft industry must support troops ashore and strike hostile shipping across the narrow seas."
 AOEIW18_ITA_aerodromes_of_the_peninsula:0 "Aerodromes of the Peninsula"
 AOEIW18_ITA_aerodromes_of_the_peninsula_desc:0 "A chain of central and southern airfields will let replacement squadrons move rapidly between the Tyrrhenian, Adriatic and Sicilian approaches."
 AOEIW18_ITA_la_spezia_sailors_congress:0 "The La Spezia Sailors' Congress"
 AOEIW18_ITA_la_spezia_sailors_congress_desc:0 "The fleet lies intact, but its command does not. Sailors, dockworkers, engineers and surviving admirals must decide how revolutionary authority will operate aboard ship."
 AOEIW18_ITA_fleet_of_the_communes:0 "Fleet of the Communes"
 AOEIW18_ITA_fleet_of_the_communes_desc:0 "The temporary settlement will become a professional communal navy. Political legitimacy and technical competence must coexist if Italy's capital ships are to leave harbour."
 AOEIW18_ITA_control_the_central_sea:0 "Control the Central Sea"
 AOEIW18_ITA_control_the_central_sea_desc:0 "The fleet and littoral air groups will adopt a single doctrine for the waters between Sicily, Sardinia, Libya and the Italian mainland."
 AOEIW18_ITA_adriatic_congress:0 "Call an Adriatic Congress"
 AOEIW18_ITA_adriatic_congress_desc:0 "Rome will offer the former League members a public choice: relations between equal peoples or a defensive alignment built against the Italian revolution."
 AOEIW18_ITA_mediterranean_workers_compact:0 "Mediterranean Workers' Compact"
 AOEIW18_ITA_mediterranean_workers_compact_desc:0 "Governments willing to treat the Federation as an equal may join a new compact founded on mutual defence and industrial cooperation rather than Italian royal leadership."
 AOEIW18_ITA_fortress_peninsula:0 "Fortress of the Peninsula"
 AOEIW18_ITA_fortress_peninsula_desc:0 "If the Balkans close ranks against us, the communes will rely on Italy's mountains, coastlines and mobilised population. Isolation will become a defensive system rather than a diplomatic accident."
 AOEIW18_ITA_two_italies_in_arms:0 "Two Italies in Arms"
 AOEIW18_ITA_two_italies_in_arms_desc:0 "Northern workshops and southern cooperatives will no longer be rival halves of the state. Industry, manpower, airfields and ports will sustain one communal war effort from the Alps to Sicily."

 AOEIW18_ITA_factory_council_agitation:0 "Factory Council Agitation"
 AOEIW18_ITA_factory_council_agitation_desc:0 "Turin's councils are organising production workers against royal authority, disrupting output while the movement gathers strength."
 AOEIW18_ITA_po_valley_general_strike:0 "Po Valley General Strike"
 AOEIW18_ITA_po_valley_general_strike_desc:0 "Factories and rail depots across the industrial north are shut by the confrontation between owners, the state and organised labour."
 AOEIW18_ITA_red_guard_militias:0 "Red Guard Militias"
 AOEIW18_ITA_red_guard_militias_desc:0 "Armed workers defend council institutions, but decentralised command weakens planning and battlefield cohesion."
 AOEIW18_ITA_syndical_coordination:0 "Syndical Coordination"
 AOEIW18_ITA_syndical_coordination_desc:0 "National industrial federations coordinate the councils efficiently, though their administrative apparatus consumes civilian resources."
 AOEIW18_ITA_municipal_communes:0 "Municipal Communes"
 AOEIW18_ITA_municipal_communes_desc:0 "Local autonomy encourages experimentation and consent, at the cost of slower national political direction."
 AOEIW18_ITA_southern_cooperatives:0 "Southern Cooperatives"
 AOEIW18_ITA_southern_cooperatives_desc:0 "Voluntary land committees build support in the south but initially divert labour and tools away from urban industry."
 AOEIW18_ITA_forced_grain_levies:0 "Forced Grain Levies"
 AOEIW18_ITA_forced_grain_levies_desc:0 "Immediate requisition supplies the cities and army while producing resentment and administrative disruption in the countryside."
 AOEIW18_ITA_postrevolution_industry_disruption:0 "Disrupted Industrial Councils"
 AOEIW18_ITA_postrevolution_industry_disruption_desc:0 "Ownership has changed faster than accounting, orders or factory management. The new councils require a national production system."
 AOEIW18_ITA_postrevolution_command_disruption:0 "Collapse of Royal Command"
 AOEIW18_ITA_postrevolution_command_disruption_desc:0 "The monarchy's command hierarchy has dissolved, leaving militias, loyal units and technical officers without a common staff."
 AOEIW18_ITA_fleet_technical_commission:0 "Fleet Technical Commission"
 AOEIW18_ITA_fleet_technical_commission_desc:0 "Engineers and retained officers keep the fleet operational under strict council supervision, provoking political suspicion and administrative costs."
 AOEIW18_ITA_sailors_committees:0 "Sailors' Committees"
 AOEIW18_ITA_sailors_committees_desc:0 "Direct election of shipboard authority inspires crews but temporarily damages maintenance discipline and fleet organisation."
 AOEIW18_ITA_turin_national_workshops_spirit:0 "Turin National Workshops"
 AOEIW18_ITA_turin_national_workshops_spirit_desc:0 "Reopened machine works combine council discipline with a concentrated armaments programme."
 AOEIW18_ITA_lombard_production_exchange_spirit:0 "Lombard Production Exchange"
 AOEIW18_ITA_lombard_production_exchange_spirit_desc:0 "Shared ledgers and component exchanges let northern factories sustain higher and faster production runs."
 AOEIW18_ITA_agrarian_settlement_spirit:0 "Land to the Cooperatives"
 AOEIW18_ITA_agrarian_settlement_spirit_desc:0 "The southern settlement ties land redistribution to rural infrastructure, mobilisation and guaranteed deliveries."
 AOEIW18_ITA_arsenal_of_the_po_spirit:0 "Arsenal of the Po"
 AOEIW18_ITA_arsenal_of_the_po_spirit_desc:0 "The Po industrial corridor specialises in economical artillery and large-scale military output."
 AOEIW18_ITA_peoples_army_commission_spirit:0 "People's Army Commission"
 AOEIW18_ITA_peoples_army_commission_spirit_desc:0 "A common staff converts revolutionary legitimacy into workable planning, reinforcement and organisation."
 AOEIW18_ITA_cooperative_artillery_foundries_spirit:0 "Cooperative Artillery Foundries"
 AOEIW18_ITA_cooperative_artillery_foundries_spirit_desc:0 "Standardised cooperative production lowers the industrial cost of Italian artillery."
 AOEIW18_ITA_militias_into_divisions_spirit:0 "Militias into Divisions"
 AOEIW18_ITA_militias_into_divisions_spirit_desc:0 "Territorial recruitment, training cadres and reinforcement depots turn the Red Guards into a recoverable field army."
 AOEIW18_ITA_alpine_adriatic_staff_spirit:0 "Alpine-Adriatic Staff"
 AOEIW18_ITA_alpine_adriatic_staff_spirit_desc:0 "Integrated mountain, rail and coastal planning reduces waste and prepares the army for Italy's difficult geography."
 AOEIW18_ITA_caproni_council_spirit:0 "Council Aviation Combine"
 AOEIW18_ITA_caproni_council_spirit_desc:0 "Standardised fighter, close-support and naval-bomber production turns aviation replacement into an industrial programme."
 AOEIW18_ITA_littoral_strike_groups_spirit:0 "Littoral Strike Groups"
 AOEIW18_ITA_littoral_strike_groups_spirit_desc:0 "Air-ground liaison and maritime reconnaissance make Italian strike aircraft more effective over coasts and narrow seas."
 AOEIW18_ITA_fleet_of_the_communes_spirit:0 "Fleet of the Communes"
 AOEIW18_ITA_fleet_of_the_communes_spirit_desc:0 "A settled revolutionary command restores dockyard productivity, organisation and crew confidence."
 AOEIW18_ITA_control_central_sea_spirit:0 "Central Sea Doctrine"
 AOEIW18_ITA_control_central_sea_spirit_desc:0 "Fleet manoeuvre and naval aviation are coordinated for the constrained waters around the Italian peninsula."
 AOEIW18_ITA_revolutionary_diplomacy_spirit:0 "Diplomacy of Equal Shores"
 AOEIW18_ITA_revolutionary_diplomacy_spirit_desc:0 "The Federation presents cooperation as an agreement among Mediterranean peoples rather than obedience to Rome."
 AOEIW18_ITA_fortress_peninsula_spirit:0 "Fortress of the Peninsula"
 AOEIW18_ITA_fortress_peninsula_spirit_desc:0 "Political isolation is answered with mobilisation, fortified geography and preparation to defend the Italian core."
 AOEIW18_ITA_two_italies_in_arms_spirit:0 "Two Italies in Arms"
 AOEIW18_ITA_two_italies_in_arms_spirit_desc:0 "Northern industry and southern manpower now sustain a unified communal military system."

 aoeiw_phase18_ita.1.t:0 "Who Commands the Councils?"
 aoeiw_phase18_ita.1.d:0 "The Milan Chamber of Labour is packed with Turin delegates, municipal socialists and railway organisers. Industrial federations demand binding national quotas; local communes insist that the revolution cannot replace royal prefects with union officials."
 aoeiw_phase18_ita.1.a:0 "The industrial federations will coordinate the struggle."
 aoeiw_phase18_ita.1.b:0 "Authority rises from the municipal communes."
 aoeiw_phase18_ita.2.t:0 "Bread and Land in the South"
 aoeiw_phase18_ita.2.d:0 "Southern organisers report that landless labourers support the councils but distrust another government issuing orders from the north. The cities need grain immediately; the revolution needs lasting legitimacy."
 aoeiw_phase18_ita.2.a:0 "Build cooperatives before demanding quotas."
 aoeiw_phase18_ita.2.b:0 "The cities and Red Guards need grain now."
 aoeiw_phase18_ita.3.t:0 "The Monarchy Falls"
 aoeiw_phase18_ita.3.d:0 "The royal ministries are occupied, the Chamber has dispersed and council banners hang over Turin, Milan, Naples and the naval bases. The Congress abolishes the House of Savoy and declares the Federation of Italian Communes. Across the Balkans, Italy's former allies prepare their response."
 aoeiw_phase18_ita.3.a:0 "From the Alps to Sicily, the communes are free."
 aoeiw_phase18_ita.4.t:0 "The Fleet at Anchor"
 aoeiw_phase18_ita.4.d:0 "The Regia Marina remains largely intact, but committees now control docks, wireless rooms and magazines. Engineers warn that turbines and fire-control systems cannot be governed by acclamation; sailors answer that the old admirals cannot simply resume command."
 aoeiw_phase18_ita.4.a:0 "Retain the technicians under a council commission."
 aoeiw_phase18_ita.4.b:0 "Command belongs to the sailors' committees."
 aoeiw_phase18_ita.5.t:0 "Bucharest after Rome"
 aoeiw_phase18_ita.5.d:0 "The Mediterranean League has vanished with the Italian monarchy. Romanian ministers must decide whether to organise a Balkan defence compact against revolutionary influence or maintain practical relations with the new federation."
 aoeiw_phase18_ita.5.a:0 "Raise a Balkan shield against revolution."
 aoeiw_phase18_ita.5.b:0 "Open a guarded dialogue with the Italian councils."
 aoeiw_phase18_ita.6.t:0 "Belgrade and the Broken League"
 aoeiw_phase18_ita.6.d:0 "Italy no longer claims royal leadership of the Adriatic, but revolution across the sea could inspire workers and alarm officers alike. Romania offers security; Rome offers relations between peoples."
 aoeiw_phase18_ita.6.a:0 "Stand with the Balkan shield."
 aoeiw_phase18_ita.6.b:0 "Speak with the councils across the Adriatic."
 aoeiw_phase18_ita.7.t:0 "Sofia Chooses"
 aoeiw_phase18_ita.7.d:0 "The collapse of the Mediterranean League removes Bulgaria's diplomatic anchor. Sofia can join a defensive Balkan alignment or test whether trade and non-aggression with revolutionary Italy offer greater security."
 aoeiw_phase18_ita.7.a:0 "Join the defence of the Balkan order."
 aoeiw_phase18_ita.7.b:0 "Maintain dialogue with the Italian communes."

 AOEIW18_revolutionary_betrayal:0 "Revolutionary Betrayal"
 AOEIW18_mediterranean_revolution:0 "Mediterranean Workers' Dialogue"
