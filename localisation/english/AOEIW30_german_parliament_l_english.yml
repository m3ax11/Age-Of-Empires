l_english:
 AOEIW30_GER_elections_to_bundestag:0 "Elections to the Bundestag"
 AOEIW30_GER_elections_to_bundestag_desc:0 "One hundred seats are redistributed. A government needs at least 51 seats before its coalition can take office."
 AOEIW30_GER_elections_to_reichstag:0 "Elections to the Reichstag"
 AOEIW30_GER_elections_to_reichstag_desc:0 "The Kaiser permits the election of one hundred deputies. A government needs at least 51 seats and remains responsible to the Reichstag."
 AOEIW31_GER_spd_coalition_talks:0 "Give the SPD the Mandate"
 AOEIW31_GER_spd_coalition_talks_desc:0 "Ask the SPD, with [?AOEIW30_GER_spd_seats|0] seats, to lead coalition negotiations."
 AOEIW31_GER_zentrum_coalition_talks:0 "Give Zentrum the Mandate"
 AOEIW31_GER_zentrum_coalition_talks_desc:0 "Ask Zentrum, with [?AOEIW30_GER_zentrum_seats|0] seats, to lead Reichstag negotiations."
 AOEIW31_GER_dnvp_coalition_talks:0 "Give the DNVP the Mandate"
 AOEIW31_GER_dnvp_coalition_talks_desc:0 "Ask the DNVP, with [?AOEIW30_GER_dnvp_seats|0] seats, to lead Reichstag negotiations."
 AOEIW31_GER_cdu_coalition_talks:0 "Give the CDU the Mandate"
 AOEIW31_GER_cdu_coalition_talks_desc:0 "Ask the CDU, with [?AOEIW30_GER_cdu_seats|0] seats, to lead Bundestag negotiations."
 AOEIW31_GER_invite_spd:0 "Invite the SPD"
 AOEIW31_GER_invite_spd_desc:0 "The SPD contributes [?AOEIW30_GER_spd_seats|0] seats to the prospective cabinet."
 AOEIW31_GER_invite_zentrum:0 "Invite Zentrum"
 AOEIW31_GER_invite_zentrum_desc:0 "Zentrum contributes [?AOEIW30_GER_zentrum_seats|0] seats to the prospective cabinet."
 AOEIW31_GER_invite_lvp:0 "Invite the LVP"
 AOEIW31_GER_invite_lvp_desc:0 "The Liberal People's Party contributes [?AOEIW30_GER_lvp_seats|0] seats."
 AOEIW31_GER_invite_dnvp:0 "Invite the DNVP"
 AOEIW31_GER_invite_dnvp_desc:0 "The DNVP contributes [?AOEIW30_GER_dnvp_seats|0] seats; it will not sit with the SPD or KPD."
 AOEIW31_GER_invite_cdu:0 "Invite the CDU"
 AOEIW31_GER_invite_cdu_desc:0 "The CDU contributes [?AOEIW30_GER_cdu_seats|0] Bundestag seats."
 AOEIW31_GER_invite_dstp:0 "Invite the DStP"
 AOEIW31_GER_invite_dstp_desc:0 "The German State Party contributes [?AOEIW30_GER_dstp_seats|0] seats."
 AOEIW31_GER_invite_kpd:0 "Invite the KPD"
 AOEIW31_GER_invite_kpd_desc:0 "The KPD contributes [?AOEIW30_GER_kpd_seats|0] seats and will only join a compatible parliamentary-left cabinet."
 AOEIW30_GER_nominate_spd:0 "Invite the SPD"
 AOEIW30_GER_nominate_spd_desc:0 "The Social Democrats contribute [?AOEIW30_GER_spd_seats|0] seats."
 AOEIW30_GER_withdraw_spd:0 "Dismiss the SPD Delegation"
 AOEIW30_GER_withdraw_spd_desc:0 "Remove the SPD and its seats from the proposed coalition."
 AOEIW30_GER_nominate_zentrum:0 "Invite Zentrum"
 AOEIW30_GER_nominate_zentrum_desc:0 "Zentrum contributes [?AOEIW30_GER_zentrum_seats|0] Reichstag seats."
 AOEIW30_GER_withdraw_zentrum:0 "Dismiss the Zentrum Delegation"
 AOEIW30_GER_withdraw_zentrum_desc:0 "Remove Zentrum and its seats from the proposed coalition."
 AOEIW30_GER_nominate_lvp:0 "Invite the LVP"
 AOEIW30_GER_nominate_lvp_desc:0 "The Liberal People's Party contributes [?AOEIW30_GER_lvp_seats|0] seats."
 AOEIW30_GER_withdraw_lvp:0 "Dismiss the LVP Delegation"
 AOEIW30_GER_withdraw_lvp_desc:0 "Remove the LVP and its seats from the proposed coalition."
 AOEIW30_GER_nominate_dnvp:0 "Invite the DNVP"
 AOEIW30_GER_nominate_dnvp_desc:0 "The German National People's Party contributes [?AOEIW30_GER_dnvp_seats|0] Reichstag seats. It cannot govern with the SPD or KPD."
 AOEIW30_GER_withdraw_dnvp:0 "Dismiss the DNVP Delegation"
 AOEIW30_GER_withdraw_dnvp_desc:0 "Remove the DNVP and its seats from the proposed coalition."
 AOEIW30_GER_nominate_cdu:0 "Invite the CDU"
 AOEIW30_GER_nominate_cdu_desc:0 "The Christian Democratic Union contributes [?AOEIW30_GER_cdu_seats|0] Bundestag seats."
 AOEIW30_GER_withdraw_cdu:0 "Dismiss the CDU Delegation"
 AOEIW30_GER_withdraw_cdu_desc:0 "Remove the CDU and its seats from the proposed coalition."
 AOEIW30_GER_nominate_dstp:0 "Invite the DStP"
 AOEIW30_GER_nominate_dstp_desc:0 "The German State Party contributes [?AOEIW30_GER_dstp_seats|0] seats."
 AOEIW30_GER_withdraw_dstp:0 "Dismiss the DStP Delegation"
 AOEIW30_GER_withdraw_dstp_desc:0 "Remove the DStP and its seats from the proposed coalition."
 AOEIW30_GER_nominate_kpd:0 "Invite the KPD"
 AOEIW30_GER_nominate_kpd_desc:0 "The KPD contributes [?AOEIW30_GER_kpd_seats|0] seats. Only a parliamentary left coalition is negotiable."
 AOEIW30_GER_withdraw_kpd:0 "Dismiss the KPD Delegation"
 AOEIW30_GER_withdraw_kpd_desc:0 "Remove the KPD and its seats from the proposed coalition."
 AOEIW30_GER_confirm_coalition:0 "Swear In a Majority Government"
 AOEIW30_GER_confirm_coalition_desc:0 "Confirm the proposed coalition once it controls the dynamically calculated absolute majority of [?AOEIW30_GER_majority_seats|0] seats. Its party programmes appear in the focus tree and the opposition disappears."
 AOEIW30_GER_reset_coalition_talks:0 "Restart Coalition Talks"
 AOEIW30_GER_reset_coalition_talks_desc:0 "Discard the current combination without holding another election."
 AOEIW30_GER_cdu:0 "CDU in Government"
 AOEIW30_GER_cdu_desc:0 "A cross-confessional Christian Democratic Union combines the social market with federal constitutionalism."
 AOEIW30_GER_cdu_social_market:0 "The Social Market Economy"
 AOEIW30_GER_cdu_social_market_desc:0 "Competition, collective bargaining and social insurance are made pillars of reconstruction."
 AOEIW30_GER_cdu_lander_compact:0 "The Länder Compact"
 AOEIW30_GER_cdu_lander_compact_desc:0 "The federal government shares responsibility with strong state governments rather than centralising every decision in Berlin."
 AOEIW30_GER_cdu_cross_confessional_union:0 "A Cross-Confessional Union"
 AOEIW30_GER_cdu_cross_confessional_union_desc:0 "Catholic and Protestant democrats commit themselves to a common constitutional programme."
 AOEIW30_GER_cdu_federal_compromise:0 "The Federal Compromise"
 AOEIW30_GER_cdu_federal_compromise_desc:0 "The federation, Länder and municipalities receive clear responsibilities and dependable revenues."
 AOEIW30_GER_cdu_mandate_delivered:0 "Stability Through Responsibility"
 AOEIW30_GER_cdu_mandate_delivered_desc:0 "The Union delivers a durable democratic centre."
 AOEIW30_GER_dstp:0 "DStP in Government"
 AOEIW30_GER_dstp_desc:0 "The German State Party defends the liberal rule of law, professional administration and parliamentary control of the budget."
 AOEIW30_GER_dstp_civil_service:0 "A Non-Partisan Civil Service"
 AOEIW30_GER_dstp_civil_service_desc:0 "Promotion follows merit and law rather than court connections or party patronage."
 AOEIW30_GER_dstp_budget_right:0 "Parliament's Right of Supply"
 AOEIW30_GER_dstp_budget_right_desc:0 "No ministry or general staff may establish permanent expenditure outside the elected chamber."
 AOEIW30_GER_dstp_republican_compromise:0 "The Republican Constitutional Compromise"
 AOEIW30_GER_dstp_republican_compromise_desc:0 "Liberals, federalists and moderate conservatives agree on a durable separation of powers."
 AOEIW30_GER_dstp_scientific_state:0 "Science in the Service of the State"
 AOEIW30_GER_dstp_scientific_state_desc:0 "Independent institutes advise the cabinet without becoming an unelected technocracy."
 AOEIW30_GER_dstp_mandate_delivered:0 "Administer the Republic"
 AOEIW30_GER_dstp_mandate_delivered_desc:0 "Competent administration makes constitutional government visible in daily life."
 AOEIW30_GER_kpd:0 "KPD in Government"
 AOEIW30_GER_kpd_desc:0 "The KPD temporarily accepts the parliamentary road in exchange for workers' control, municipal power and extensive welfare."
 AOEIW30_GER_kpd_workers_control:0 "Workers' Control in Heavy Industry"
 AOEIW30_GER_kpd_workers_control_desc:0 "Elected works councils gain access to production, wage and investment plans."
 AOEIW30_GER_kpd_municipal_soviets:0 "Municipal Workers' Councils"
 AOEIW30_GER_kpd_municipal_soviets_desc:0 "Urban councils direct housing and supply while remaining bound by the constitution."
 AOEIW30_GER_kpd_parliamentary_front:0 "A Parliamentary Workers' Front"
 AOEIW30_GER_kpd_parliamentary_front_desc:0 "The revolutionary left binds its immediate programme to majorities in the elected chamber."
 AOEIW30_GER_kpd_red_welfare:0 "The Red Welfare Settlement"
 AOEIW30_GER_kpd_red_welfare_desc:0 "Public provision and social insurance expand greatly, even at a cost to the civilian budget."
 AOEIW30_GER_kpd_mandate_delivered:0 "Power Through the Mandate"
 AOEIW30_GER_kpd_mandate_delivered_desc:0 "The party demonstrates that organised labour can translate parliamentary power into concrete rights."
