 AOEIW34_GER_projected_results:0 "The Trail to Elections"
 AOEIW34_GER_projected_results_desc:0 "The parties continuously compete for votes. Campaign decisions alter the §Yprojected seats§!; only on election day are these values copied into the actual chamber.\n\n§YCurrent projected seats:§!\n§RSPD§!: [?AOEIW34_GER_spd_projected|0]\n§BCDU§!: [?AOEIW34_GER_cdu_projected|0]\n§2Zentrum§!: [?AOEIW34_GER_zentrum_projected|0]\n§YLVP§!: [?AOEIW34_GER_lvp_projected|0]\n§gDNVP§!: [?AOEIW34_GER_dnvp_projected|0]\n§7DStP§!: [?AOEIW34_GER_dstp_projected|0]\n§tKPD§!: [?AOEIW34_GER_kpd_projected|0]\n\nThis is §RNOT§! the current distribution. At every election the projection replaces the mandates in the Bundestag or Reichstag."
 AOEIW34_GER_divert_military_funding:0 "Divert Military Funding to Industry"
 AOEIW34_GER_divert_military_funding_desc:0 "A civilian investment programme creates immediate capacity but costs the government support among the army and public."
