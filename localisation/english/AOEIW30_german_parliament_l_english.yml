 AOEIW34_GER_kpd_propaganda:0 "§tKPD§! Campaign"
 AOEIW34_GER_party_drift_mission:0 "Movement in the Polls"
 AOEIW34_GER_party_drift_mission_desc:0 "Responsibility slowly wears down coalition parties while the opposition mobilises new voters."
 AOEIW34_GER_lvp_coalition_talks:0 "Give the LVP the Mandate"
 AOEIW34_GER_lvp_coalition_talks_desc:0 "Ask the Liberal People's Party, with [?AOEIW30_GER_lvp_seats|0] seats, to lead negotiations."
 AOEIW34_GER_dstp_coalition_talks:0 "Give the DStP the Mandate"
 AOEIW34_GER_dstp_coalition_talks_desc:0 "Ask the German State Party, with [?AOEIW30_GER_dstp_seats|0] seats, to lead negotiations."
 AOEIW34_GER_kpd_coalition_talks:0 "Give the KPD the Mandate"
 AOEIW34_GER_kpd_coalition_talks_desc:0 "Ask the KPD, with [?AOEIW30_GER_kpd_seats|0] seats, to build a parliamentary-left cabinet."
