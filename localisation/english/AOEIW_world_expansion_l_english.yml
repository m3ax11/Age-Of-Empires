l_english:
 AOEIW_world_UKR_leader:0 "Pavlo Skoropadskyi"
 AOEIW_world_UKR_general:0 "Mykhailo Omelianovych-Pavlenko"
 AOEIW_world_UKR_political_root:0 "Define the Ukrainian State"
 AOEIW_world_UKR_political_root_desc:0 "Ukraine's survival between the Black Sea, the Dnieper basin and competing empires begins with a fundamental constitutional question. Define the Ukrainian State will decide who may legitimately command the state."
 AOEIW_world_UKR_government:0 "Kyiv State Council"
 AOEIW_world_UKR_government_desc:0 "Through Kyiv State Council, ministers must turn improvised authority into offices capable of collecting revenue and enforcing law. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_representation:0 "Balance the Political Estates"
 AOEIW_world_UKR_representation_desc:0 "Balance the Political Estates brings neglected regions and social estates into the political bargain, though every concession limits the centre. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_security:0 "Secure Ukrainian State"
 AOEIW_world_UKR_security_desc:0 "Under Secure Ukrainian State, police, border guards and courts will be reorganised before factional violence can become permanent. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_settlement:0 "Ratify the National Settlement"
 AOEIW_world_UKR_settlement_desc:0 "Ratify the National Settlement converts the preceding bargains into a durable national settlement whose supporters now have something concrete to defend. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_economic_root:0 "Dnieper industrial programme"
 AOEIW_world_UKR_economic_root_desc:0 "Dnieper industrial programme identifies the bottlenecks preventing local resources and labour from serving a coherent national economy. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_railways:0 "Connect the Strategic Railways"
 AOEIW_world_UKR_railways_desc:0 "Connect the Strategic Railways links political centres, depots and export routes; the railway map will now shape both mobilisation and development. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_industry:0 "Found the National Workshops"
 AOEIW_world_UKR_industry_desc:0 "Found the National Workshops creates workshops able to repair imported machinery and gradually supply the country's own civilian and military needs. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_resources:0 "Survey the National Resources"
 AOEIW_world_UKR_resources_desc:0 "Through Survey the National Resources, surveyors and engineers will determine which deposits can be exploited without surrendering them to foreign concessions. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_UKR_economic_final_desc:0 "An Integrated Development Plan coordinates credit, transport and procurement so that separate projects reinforce one another instead of competing for scarce labour. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_military_root:0 "Ukrainian General Staff"
 AOEIW_world_UKR_military_root_desc:0 "Ukrainian General Staff establishes a permanent staff responsible for plans, mobilisation tables and the political reliability of the officer corps. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_army:0 "Codify Field Doctrine"
 AOEIW_world_UKR_army_desc:0 "Codify Field Doctrine replaces personal drill traditions with written doctrine adapted to the country's terrain, manpower and likely enemies. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_UKR_logistics_desc:0 "Establish Regional Supply Commands gives regional depots clear responsibilities and tests whether supplies can reach formations beyond the capital district. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_mobilisation:0 "Register the National Reserve"
 AOEIW_world_UKR_mobilisation_desc:0 "Register the National Reserve records reservists, transport and weapons honestly, ending the reassuring fiction of divisions that exist only on paper. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_military_final:0 "A Unified Defence System"
 AOEIW_world_UKR_military_final_desc:0 "A Unified Defence System binds staff work, reserves and logistics into a defence system capable of surviving the first shock of a modern war. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_diplomatic_root:0 "Black Sea diplomacy"
 AOEIW_world_UKR_diplomatic_root_desc:0 "Black Sea diplomacy forces the foreign ministry to define what the country needs from its neighbours before another great power defines it for them. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_UKR_patron_desc:0 "Through Renegotiate the Great-Power Relationship, dependence on a foreign sponsor is renegotiated into specific guarantees, prices and limits rather than vague loyalty. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_regional:0 "Convene the Regional Mission"
 AOEIW_world_UKR_regional_desc:0 "Convene the Regional Mission opens direct talks with nearby states over railways, borders, minorities and collective security. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_ambition:0 "Assert the National Interest"
 AOEIW_world_UKR_ambition_desc:0 "Assert the National Interest moves beyond survival and states the country's own interests, accepting that neighbours may answer with suspicion. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
 AOEIW_world_UKR_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_UKR_diplomatic_final_desc:0 "Publish the Strategic Charter publishes a coherent grand strategy linking treaties, trade routes and mobilisation commitments. This programme is shaped by Ukraine's survival between the Black Sea, the Dnieper basin and competing empires."
