 AOEIW_world_INA_leader:0 "René Robin"
 AOEIW_world_INA_general:0 "Nguyen Van Xuan"
 AOEIW_world_INA_political_root:0 "Define the Indochinese Colonial Federation"
 AOEIW_world_INA_political_root_desc:0 "Indochina's struggle to reconcile regional elites, peasants and a modern administrative state begins with a fundamental constitutional question. Define the Indochinese Colonial Federation will decide who may legitimately command the state."
 AOEIW_world_INA_government:0 "Hanoi Federal Council"
 AOEIW_world_INA_government_desc:0 "Through Hanoi Federal Council, ministers must turn improvised authority into offices capable of collecting revenue and enforcing law. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_representation:0 "Balance the Political Estates"
 AOEIW_world_INA_representation_desc:0 "Balance the Political Estates brings neglected regions and social estates into the political bargain, though every concession limits the centre. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_security:0 "Secure Indochinese Colonial Federation"
 AOEIW_world_INA_security_desc:0 "Under Secure Indochinese Colonial Federation, police, border guards and courts will be reorganised before factional violence can become permanent. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_settlement:0 "Ratify the National Settlement"
 AOEIW_world_INA_settlement_desc:0 "Ratify the National Settlement converts the preceding bargains into a durable national settlement whose supporters now have something concrete to defend. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_economic_root:0 "Mekong development programme"
 AOEIW_world_INA_economic_root_desc:0 "Mekong development programme identifies the bottlenecks preventing local resources and labour from serving a coherent national economy. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_railways:0 "Connect the Strategic Railways"
 AOEIW_world_INA_railways_desc:0 "Connect the Strategic Railways links political centres, depots and export routes; the railway map will now shape both mobilisation and development. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_industry:0 "Found the National Workshops"
 AOEIW_world_INA_industry_desc:0 "Found the National Workshops creates workshops able to repair imported machinery and gradually supply the country's own civilian and military needs. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_resources:0 "Survey the National Resources"
 AOEIW_world_INA_resources_desc:0 "Through Survey the National Resources, surveyors and engineers will determine which deposits can be exploited without surrendering them to foreign concessions. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_INA_economic_final_desc:0 "An Integrated Development Plan coordinates credit, transport and procurement so that separate projects reinforce one another instead of competing for scarce labour. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_military_root:0 "Indochinese Colonial Corps"
 AOEIW_world_INA_military_root_desc:0 "Indochinese Colonial Corps establishes a permanent staff responsible for plans, mobilisation tables and the political reliability of the officer corps. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_army:0 "Codify Field Doctrine"
 AOEIW_world_INA_army_desc:0 "Codify Field Doctrine replaces personal drill traditions with written doctrine adapted to the country's terrain, manpower and likely enemies. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_INA_logistics_desc:0 "Establish Regional Supply Commands gives regional depots clear responsibilities and tests whether supplies can reach formations beyond the capital district. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_mobilisation:0 "Register the National Reserve"
 AOEIW_world_INA_mobilisation_desc:0 "Register the National Reserve records reservists, transport and weapons honestly, ending the reassuring fiction of divisions that exist only on paper. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
 AOEIW_world_INA_military_final:0 "A Unified Defence System"
 AOEIW_world_INA_military_final_desc:0 "A Unified Defence System binds staff work, reserves and logistics into a defence system capable of surviving the first shock of a modern war. This programme is shaped by Indochina's struggle to reconcile regional elites, peasants and a modern administrative state."
