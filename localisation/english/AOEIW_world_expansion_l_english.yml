 AOEIW_world_PRU_railways:0 "Connect the Strategic Railways"
 AOEIW_world_PRU_railways_desc:0 "Connect the Strategic Railways links political centres, depots and export routes; the railway map will now shape both mobilisation and development. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_industry:0 "Found the National Workshops"
 AOEIW_world_PRU_industry_desc:0 "Found the National Workshops creates workshops able to repair imported machinery and gradually supply the country's own civilian and military needs. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_resources:0 "Survey the National Resources"
 AOEIW_world_PRU_resources_desc:0 "Through Survey the National Resources, surveyors and engineers will determine which deposits can be exploited without surrendering them to foreign concessions. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_economic_final:0 "An Integrated Development Plan"
 AOEIW_world_PRU_economic_final_desc:0 "An Integrated Development Plan coordinates credit, transport and procurement so that separate projects reinforce one another instead of competing for scarce labour. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_military_root:0 "Peruvian Imperial Army"
 AOEIW_world_PRU_military_root_desc:0 "Peruvian Imperial Army establishes a permanent staff responsible for plans, mobilisation tables and the political reliability of the officer corps. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_army:0 "Codify Field Doctrine"
 AOEIW_world_PRU_army_desc:0 "Codify Field Doctrine replaces personal drill traditions with written doctrine adapted to the country's terrain, manpower and likely enemies. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_logistics:0 "Establish Regional Supply Commands"
 AOEIW_world_PRU_logistics_desc:0 "Establish Regional Supply Commands gives regional depots clear responsibilities and tests whether supplies can reach formations beyond the capital district. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_mobilisation:0 "Register the National Reserve"
 AOEIW_world_PRU_mobilisation_desc:0 "Register the National Reserve records reservists, transport and weapons honestly, ending the reassuring fiction of divisions that exist only on paper. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_military_final:0 "A Unified Defence System"
 AOEIW_world_PRU_military_final_desc:0 "A Unified Defence System binds staff work, reserves and logistics into a defence system capable of surviving the first shock of a modern war. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_diplomatic_root:0 "Hispanic Pacific policy"
 AOEIW_world_PRU_diplomatic_root_desc:0 "Hispanic Pacific policy forces the foreign ministry to define what the country needs from its neighbours before another great power defines it for them. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_patron:0 "Renegotiate the Great-Power Relationship"
 AOEIW_world_PRU_patron_desc:0 "Through Renegotiate the Great-Power Relationship, dependence on a foreign sponsor is renegotiated into specific guarantees, prices and limits rather than vague loyalty. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_regional:0 "Convene the Regional Mission"
 AOEIW_world_PRU_regional_desc:0 "Convene the Regional Mission opens direct talks with nearby states over railways, borders, minorities and collective security. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_ambition:0 "Assert the National Interest"
 AOEIW_world_PRU_ambition_desc:0 "Assert the National Interest moves beyond survival and states the country's own interests, accepting that neighbours may answer with suspicion. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_PRU_diplomatic_final:0 "Publish the Strategic Charter"
 AOEIW_world_PRU_diplomatic_final_desc:0 "Publish the Strategic Charter publishes a coherent grand strategy linking treaties, trade routes and mobilisation commitments. This programme is shaped by Peru's effort to connect the coast, Andes and Amazonian frontier."
 AOEIW_world_NEE_leader:0 "Charles Francis Adams III"
 AOEIW_world_NEE_general:0 "George C. Marshall"
 AOEIW_world_NEE_political_root:0 "Define the Republic of New England"
 AOEIW_world_NEE_political_root_desc:0 "New England's experiment in regional government, Atlantic commerce and citizen defence begins with a fundamental constitutional question. Define the Republic of New England will decide who may legitimately command the state."
 AOEIW_world_NEE_government:0 "Boston Constitutional Convention"
 AOEIW_world_NEE_government_desc:0 "Through Boston Constitutional Convention, ministers must turn improvised authority into offices capable of collecting revenue and enforcing law. This programme is shaped by New England's experiment in regional government, Atlantic commerce and citizen defence."
 AOEIW_world_NEE_representation:0 "Balance the Political Estates"
 AOEIW_world_NEE_representation_desc:0 "Balance the Political Estates brings neglected regions and social estates into the political bargain, though every concession limits the centre. This programme is shaped by New England's experiment in regional government, Atlantic commerce and citizen defence."
 AOEIW_world_NEE_security:0 "Secure Republic of New England"
 AOEIW_world_NEE_security_desc:0 "Under Secure Republic of New England, police, border guards and courts will be reorganised before factional violence can become permanent. This programme is shaped by New England's experiment in regional government, Atlantic commerce and citizen defence."
 AOEIW_world_NEE_settlement:0 "Ratify the National Settlement"
 AOEIW_world_NEE_settlement_desc:0 "Ratify the National Settlement converts the preceding bargains into a durable national settlement whose supporters now have something concrete to defend. This programme is shaped by New England's experiment in regional government, Atlantic commerce and citizen defence."
