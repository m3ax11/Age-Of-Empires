 AOEIW_world_HEJ_regional_desc:0 "Convene the Regional Mission opens direct talks with nearby states over railways, borders, minorities and collective security. This programme is shaped by the Hashemite realm's effort to turn holy cities and desert routes into a viable state."
 AOEIW_world_HEJ_ambition:0 "Assert the National Interest"
 AOEIW_world_HEJ_ambition_desc:0 "Assert the National Interest moves beyond survival and states the country's own interests, accepting that neighbours may answer with suspicion. This programme is shaped by the Hashemite realm's effort to turn holy cities and desert routes into a viable state."
 AOEIW_world_HEJ_diplomatic_final:0 "Publish the Strategic Charter"
