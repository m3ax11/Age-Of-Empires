l_english:
 AOEIW_consolidation_crisis_category:0 "National Mobilisation"
 AOEIW_consolidation_crisis_category_desc:0 "War requires an escalating commitment of people, industry and political capital. Mobilisation produces real strength, but pushing society too far leaves lasting costs."
 AOEIW_consolidation_partial_mobilization_decision:0 "Order Partial Mobilisation"
 AOEIW_consolidation_partial_mobilization_decision_desc:0 "Call reserves and extend factory shifts. §YCost: 25 PP.§! Adds limited manpower and training bonuses at a small civilian cost."
 AOEIW_consolidation_total_mobilization_decision:0 "Declare Total Mobilisation"
 AOEIW_consolidation_total_mobilization_decision_desc:0 "Convert the economy and the population to full wartime footing. §YCost: 50 PP.§! Replaces Partial Mobilisation with stronger military and industrial bonuses and heavier stability and consumer costs."
 AOEIW_consolidation_emergency_mobilization_decision:0 "Emergency Levy"
 AOEIW_consolidation_emergency_mobilization_decision_desc:0 "Commit the last reserves. §RCost: 75 PP.§! Replaces Total Mobilisation with exceptional manpower and production at severe social and logistical cost."
 AOEIW_consolidation_war_rationing_decision:0 "Institute War Rationing"
 AOEIW_consolidation_war_rationing_decision_desc:0 "Redirect civilian fuel, food and materials to the front. §YCost: 35 PP.§! Improves supply and fuel flow while reducing public stability."
 AOEIW_consolidation_demobilize_decision:0 "Demobilise the War Economy"
 AOEIW_consolidation_demobilize_decision_desc:0 "Return soldiers and factories to peace. Removes wartime mobilisation and rationing, but adds §Y240 days§! of post-war exhaustion."
 AOEIW_consolidation_partial_mobilization:0 "Partial Mobilisation"
 AOEIW_consolidation_partial_mobilization_desc:0 "Reservists and priority industries have been called to service without yet consuming the entire civilian economy."
 AOEIW_consolidation_total_mobilization:0 "Total Mobilisation"
 AOEIW_consolidation_total_mobilization_desc:0 "The state now directs labour, industry and transport toward victory."
 AOEIW_consolidation_emergency_mobilization:0 "Emergency Levy"
 AOEIW_consolidation_emergency_mobilization_desc:0 "The final reserves are being consumed. The army grows, but society and logistics strain under the weight."
 AOEIW_consolidation_war_rationing:0 "War Rationing"
 AOEIW_consolidation_war_rationing_desc:0 "Civilian consumption is restricted so fuel and supplies reach the armed forces."
 AOEIW_consolidation_postwar_exhaustion:0 "Post-War Exhaustion"
 AOEIW_consolidation_postwar_exhaustion_desc:0 "Victory or peace has not immediately repaired the human and industrial damage of total war."
 AOEIW_consolidation_political_settlement:0 "Durable Political Settlement"
 AOEIW_consolidation_political_settlement_desc:0 "The political programme now rests on institutions capable of surviving a crisis."
 AOEIW_consolidation_industrial_programme:0 "Integrated Industrial Programme"
 AOEIW_consolidation_industrial_programme_desc:0 "Infrastructure, research and production planning have been bound into one practical development programme."
 AOEIW_consolidation_military_reform:0 "Unified General Staff System"
 AOEIW_consolidation_military_reform_desc:0 "Training, doctrine, procurement and operational planning now answer to common standards."
 AOEIW_consolidation_diplomatic_charter:0 "Strategic Diplomatic Charter"
 AOEIW_consolidation_diplomatic_charter_desc:0 "Foreign policy is supported by permanent institutions instead of improvised declarations."
 AOEIW_consolidation_chinese_logistics:0 "Grain and Rail Administration"
 AOEIW_consolidation_chinese_logistics_desc:0 "Regional depots, grain levies and rail priorities sustain the armies of national salvation."
 AOEIW_consolidation_chinese_coalition:0 "Integrated Regional Commands"
 AOEIW_consolidation_chinese_coalition_desc:0 "Regional commanders retain a voice, but manpower and operations are coordinated by the United Front."
 AOEIW_consolidation_integrate_regional_commands:0 "Integrate the Regional Commands"
 AOEIW_consolidation_integrate_regional_commands_desc:0 "Bind provincial armies into a common command structure. §YCost: 35 PP.§! Grants command power, army experience and a lasting coalition spirit."
 AOEIW_consolidation_secure_grain_and_rail:0 "Secure Grain and Rail"
 AOEIW_consolidation_secure_grain_and_rail_desc:0 "Create wartime depots and protect the inland rail arteries. §YCost: 40 PP.§! Adds a logistics spirit and 12,000 infantry weapons."
 AOEIW_consolidation_wartime_political_council:0 "Convene the Wartime Political Council"
 AOEIW_consolidation_wartime_political_council_desc:0 "Give the nationalists, communists and regional delegates a controlled forum. §YCost: 45 PP.§! Improves stability, war support and political power."
