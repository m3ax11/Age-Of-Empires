l_english:
 AOEIW38_ASIA_MIDDLE_regional_consequences_category:0 "The Regional Settlement"
 AOEIW38_ASIA_MIDDLE_regional_consequences_category_desc:0 "The first years of war settled immediate questions of survival. The harder work is to turn military choices, transport routes and diplomatic promises into a durable regional order."

 AOEIW38_ASIA_MIDDLE_MON_frontier_council:0 "Convene the Frontier Council"
 AOEIW38_ASIA_MIDDLE_MON_frontier_council_desc:0 "Maps from the army, caravan guilds and provincial administrations describe three different frontiers. A permanent council will combine them and keep policy alive after the emergency has passed."
 AOEIW38_ASIA_MIDDLE_MON_eastern_solidarity:0 "Stake Our Future on Eastern Solidarity"
 AOEIW38_ASIA_MIDDLE_MON_eastern_solidarity_desc:0 "Mongolia cannot treat the struggle across the Gobi as someone else's war. Liaison missions will align our patrols with the Chinese resistance while preserving a Mongolian voice in frontier planning."
 AOEIW38_ASIA_MIDDLE_MON_guarded_neutrality:0 "Declare a Guarded Neutrality"
 AOEIW38_ASIA_MIDDLE_MON_guarded_neutrality_desc:0 "Every army crossing the steppe will be measured by the same rule. Neutrality requires signals stations, inspected caravans and enough force to make restraint credible."
 AOEIW38_ASIA_MIDDLE_MON_three_frontier_network:0 "The Three-Frontier Network"
 AOEIW38_ASIA_MIDDLE_MON_three_frontier_network_desc:0 "Ulaanbaatar will receive daily reports from the Soviet boundary, the Gobi routes and the Manchurian approaches. Frontier policy becomes a living system instead of a single declaration."
 AOEIW38_ASIA_MIDDLE_MON_postwar_steppe_compact:0 "Write the Postwar Steppe Compact"
 AOEIW38_ASIA_MIDDLE_MON_postwar_steppe_compact_desc:0 "War has shown that Mongolia's sovereignty rests on roads, grazing rights and consultation with larger neighbours. The compact turns those lessons into a settlement built to survive the next crisis."

 AOEIW38_ASIA_MIDDLE_YEM_straits_council:0 "Seat the Bab el-Mandeb Council"
 AOEIW38_ASIA_MIDDLE_YEM_straits_council_desc:0 "Harbour masters, tribal levies, merchants and the court all hold part of the strait. A permanent council will decide how Yemen uses that position and who must answer when shipping is threatened."
 AOEIW38_ASIA_MIDDLE_YEM_open_roadstead:0 "Guarantee the Open Roadstead"
 AOEIW38_ASIA_MIDDLE_YEM_open_roadstead_desc:0 "Published pilotage rules and neutral convoy lanes can make Yemen the trusted keeper of the southern Red Sea. Foreign access will be exchanged for recognition, fees and investment."
 AOEIW38_ASIA_MIDDLE_YEM_coastal_guard:0 "Raise the Coastal Guard"
 AOEIW38_ASIA_MIDDLE_YEM_coastal_guard_desc:0 "The strait will remain open only on Yemeni terms. Signal posts, armed launches and coastal levies will give the imamate the means to enforce its proclamations."
 AOEIW38_ASIA_MIDDLE_YEM_red_sea_conference:0 "Convene the Red Sea Conference"
 AOEIW38_ASIA_MIDDLE_YEM_red_sea_conference_desc:0 "Jeddah, Massawa, Suez and Hodeidah share currents, pilgrim traffic and wartime danger. Yemen will place the coastal states at the table before distant empires divide the sea among themselves."
 AOEIW38_ASIA_MIDDLE_YEM_gateway_settlement:0 "The Gateway Settlement"
 AOEIW38_ASIA_MIDDLE_YEM_gateway_settlement_desc:0 "A customs code, defended pilot stations and a reconstruction fund bind highland authority to the coast. Bab el-Mandeb becomes a Yemeni institution with a future after the war."

 AOEIW38_ASIA_MIDDLE_MON_rotate_frontier_patrols:0 "Rotate the Frontier Patrols"
 AOEIW38_ASIA_MIDDLE_MON_rotate_frontier_patrols_desc:0 "Fresh mounted detachments will inspect wells, relay stations and caravan crossings before local knowledge grows stale."
 AOEIW38_ASIA_MIDDLE_MON_dispatch_ulan_bator_mission:0 "Dispatch the Ulaanbaatar Mission"
 AOEIW38_ASIA_MIDDLE_MON_dispatch_ulan_bator_mission_desc:0 "A standing mission to the Chinese government will exchange frontier reports without surrendering control of Mongolian policy."
 AOEIW38_ASIA_MIDDLE_MON_northern_staff_exchange:0 "Renew the Northern Staff Exchange"
 AOEIW38_ASIA_MIDDLE_MON_northern_staff_exchange_desc:0 "Soviet staff methods remain useful, but each exchange will be negotiated as cooperation between governments rather than an open-ended command."
 AOEIW38_ASIA_MIDDLE_MON_postwar_caravan_grants:0 "Issue Postwar Caravan Grants"
 AOEIW38_ASIA_MIDDLE_MON_postwar_caravan_grants_desc:0 "Road crews and herding cooperatives will restore the routes that kept distant districts supplied during the war."
 AOEIW38_ASIA_MIDDLE_YEM_register_red_sea_convoys:0 "Register Red Sea Convoys"
 AOEIW38_ASIA_MIDDLE_YEM_register_red_sea_convoys_desc:0 "Yemeni pilots will publish sailing windows and assemble small protected groups for vessels approaching the narrows."
 AOEIW38_ASIA_MIDDLE_YEM_negotiate_pilgrimage_guarantees:0 "Negotiate Pilgrimage Guarantees"
 AOEIW38_ASIA_MIDDLE_YEM_negotiate_pilgrimage_guarantees_desc:0 "Safe passage for pilgrims offers Sana'a and Riyadh a practical interest stronger than another exchange of border claims."
 AOEIW38_ASIA_MIDDLE_YEM_admit_port_concessions:0 "Admit Chartered Port Concessions"
 AOEIW38_ASIA_MIDDLE_YEM_admit_port_concessions_desc:0 "Limited leases under Yemeni law can finance a modern roadstead while keeping customs and policing in national hands."
 AOEIW38_ASIA_MIDDLE_YEM_fortify_the_pilot_stations:0 "Fortify the Pilot Stations"
 AOEIW38_ASIA_MIDDLE_YEM_fortify_the_pilot_stations_desc:0 "The observation towers guiding friendly ships can also deny the channel to a hostile landing force."
 AOEIW38_ASIA_MIDDLE_MAN_charter_the_border_markets:0 "Charter the Border Markets"
 AOEIW38_ASIA_MIDDLE_MAN_charter_the_border_markets_desc:0 "Licensed markets and inspected rail sidings will restore civilian exchange along a frontier long governed only by armies."
 AOEIW38_ASIA_MIDDLE_CHI_convene_the_reconstruction_board:0 "Convene the Reconstruction Board"
 AOEIW38_ASIA_MIDDLE_CHI_convene_the_reconstruction_board_desc:0 "Provincial engineers and national ministries will agree which shattered transport corridor must be rebuilt first."
 AOEIW38_ASIA_MIDDLE_JAP_audit_continental_obligations:0 "Audit Continental Obligations"
 AOEIW38_ASIA_MIDDLE_JAP_audit_continental_obligations_desc:0 "The army, colonial bureaux and trading houses must state what their continental commitments cost and what political end they serve."
 AOEIW38_ASIA_MIDDLE_PER_open_the_transiranian_board:0 "Open the Trans-Iranian Board"
 AOEIW38_ASIA_MIDDLE_PER_open_the_transiranian_board_desc:0 "A national board will coordinate rail capacity, customs traffic and military priority along the country's strategic corridors."
 AOEIW38_ASIA_MIDDLE_RAJ_ratify_the_service_compact:0 "Ratify the Service Compact"
 AOEIW38_ASIA_MIDDLE_RAJ_ratify_the_service_compact_desc:0 "Wartime service must yield a written division of authority among Delhi, the provinces and the princely states."
 AOEIW38_ASIA_MIDDLE_SIA_fund_the_mekong_watch:0 "Fund the Mekong Watch"
 AOEIW38_ASIA_MIDDLE_SIA_fund_the_mekong_watch_desc:0 "River patrols and provincial radios will give Bangkok warning before a foreign crisis spills across the frontier."
 AOEIW38_ASIA_MIDDLE_TUR_convene_the_straits_commission:0 "Convene the Straits Commission"
 AOEIW38_ASIA_MIDDLE_TUR_convene_the_straits_commission_desc:0 "Ankara will review passage, pilotage and wartime restrictions with every power whose commerce depends on the narrows."

 AOEIW38_ASIA_MIDDLE_MON_watch_council:0 "The Frontier Watch Council"
 AOEIW38_ASIA_MIDDLE_MON_watch_council_desc:0 "A permanent civilian-military council collates patrol reports and forces competing institutions to maintain one frontier policy."
 AOEIW38_ASIA_MIDDLE_MON_steppe_signals:0 "Steppe Signals Network"
 AOEIW38_ASIA_MIDDLE_MON_steppe_signals_desc:0 "Radio relays and trained couriers connect mobile columns to district authorities across immense distances."
 AOEIW38_ASIA_MIDDLE_MON_enduring_compact:0 "The Enduring Steppe Compact"
 AOEIW38_ASIA_MIDDLE_MON_enduring_compact_desc:0 "Security consultation, caravan investment and local administration now reinforce one another."
 AOEIW38_ASIA_MIDDLE_MON_frontier_patrol:0 "Rotating Frontier Patrols"
 AOEIW38_ASIA_MIDDLE_MON_frontier_patrol_desc:0 "Fresh patrols are mapping wells, tracks and concealed approaches throughout the border districts."
 AOEIW38_ASIA_MIDDLE_YEM_straits_administration:0 "Bab el-Mandeb Administration"
 AOEIW38_ASIA_MIDDLE_YEM_straits_administration_desc:0 "Keeping merchants, soldiers and the court at one table carries a cost, but prevents policy at the strait from drifting between rival offices."
 AOEIW38_ASIA_MIDDLE_YEM_red_sea_gateway:0 "Gateway of the Red Sea"
 AOEIW38_ASIA_MIDDLE_YEM_red_sea_gateway_desc:0 "Yemen's ports combine national customs authority, regional diplomacy and a defended shipping service."
 AOEIW38_ASIA_MIDDLE_YEM_convoy_code:0 "The Yemeni Convoy Code"
 AOEIW38_ASIA_MIDDLE_YEM_convoy_code_desc:0 "Published lanes, pilots and recognition signals make the narrows safer for commerce under Yemeni supervision."
 AOEIW38_ASIA_MIDDLE_YEM_coastal_levies:0 "The Coastal Levies"
 AOEIW38_ASIA_MIDDLE_YEM_coastal_levies_desc:0 "Local boatmen and tribal detachments man a chain of defended pilot stations."
 AOEIW38_ASIA_MIDDLE_MAN_civil_frontier:0 "Civil Frontier Administration"
 AOEIW38_ASIA_MIDDLE_MAN_civil_frontier_desc:0 "Licensed markets, magistrates and rail inspectors are replacing emergency military rule along the border."
 AOEIW38_ASIA_MIDDLE_MAN_military_cordon:0 "The Northern Cordon"
 AOEIW38_ASIA_MIDDLE_MAN_military_cordon_desc:0 "The frontier remains under a connected system of garrisons, checkpoints and prepared positions."
 AOEIW38_ASIA_MIDDLE_CHI_inland_reconstruction:0 "Inland Reconstruction Priority"
 AOEIW38_ASIA_MIDDLE_CHI_inland_reconstruction_desc:0 "National resources are directed toward the railways and depots that kept inland China in the war."
 AOEIW38_ASIA_MIDDLE_CHI_maritime_customs:0 "Reformed Maritime Customs"
 AOEIW38_ASIA_MIDDLE_CHI_maritime_customs_desc:0 "Chinese administrators are reclaiming tariff policy and using the ports to finance reconstruction."
 AOEIW38_ASIA_MIDDLE_JAP_continental_bureaux:0 "Continental Liaison Bureaux"
 AOEIW38_ASIA_MIDDLE_JAP_continental_bureaux_desc:0 "Civil administrators now mediate among the army, local authorities and industrial combines on the continent."
 AOEIW38_ASIA_MIDDLE_JAP_negotiated_ports:0 "Negotiated Port Settlements"
 AOEIW38_ASIA_MIDDLE_JAP_negotiated_ports_desc:0 "Commercial access and naval facilities are pursued through bounded agreements whose costs can be measured."
 AOEIW38_ASIA_MIDDLE_PER_corridor_state:0 "The Corridor State"
 AOEIW38_ASIA_MIDDLE_PER_corridor_state_desc:0 "Iran uses railways, oil and customs administration to profit from strategic transit while retaining control of it."
 AOEIW38_ASIA_MIDDLE_PER_guarded_sovereignty:0 "Guarded Sovereignty"
 AOEIW38_ASIA_MIDDLE_PER_guarded_sovereignty_desc:0 "Dispersed defences and a firm neutrality doctrine raise the price of foreign intervention."
 AOEIW38_ASIA_MIDDLE_RAJ_federal_war_council:0 "Federal War Council"
 AOEIW38_ASIA_MIDDLE_RAJ_federal_war_council_desc:0 "Provincial and princely representatives share responsibility for manpower, supply and the political settlement after victory."
 AOEIW38_ASIA_MIDDLE_RAJ_defence_directorate:0 "Indian Defence Directorate"
 AOEIW38_ASIA_MIDDLE_RAJ_defence_directorate_desc:0 "A centralized command extracts greater military performance while postponing arguments over constitutional power."
 AOEIW38_ASIA_MIDDLE_SIA_river_compact:0 "The River Compact"
 AOEIW38_ASIA_MIDDLE_SIA_river_compact_desc:0 "Trade, navigation and border reporting bind the Mekong provinces to a cautious regional diplomacy."
 AOEIW38_ASIA_MIDDLE_SIA_armed_balance:0 "The Armed Balance"
 AOEIW38_ASIA_MIDDLE_SIA_armed_balance_desc:0 "Thailand keeps the great powers at distance through mobile reserves and prepared frontier positions."
 AOEIW38_ASIA_MIDDLE_TUR_straits_convention:0 "Revised Straits Convention"
 AOEIW38_ASIA_MIDDLE_TUR_straits_convention_desc:0 "Clear passage rules make Turkish control of the straits predictable without making it nominal."
 AOEIW38_ASIA_MIDDLE_TUR_fortified_narrows:0 "The Fortified Narrows"
 AOEIW38_ASIA_MIDDLE_TUR_fortified_narrows_desc:0 "Coastal batteries and wartime restrictions turn legal control of the straits into military control."

 AOEIW38_asia_middle.1.t:0 "Maps on the Khural Table"
 AOEIW38_asia_middle.1.d:0 "Army officers mark possible invasion routes. Herders mark winter wells. Caravan delegates mark crossings that cannot simply be closed. The new council must turn all three maps into a policy Mongolia can sustain."
 AOEIW38_asia_middle.1.a:0 "Keep the council in permanent session."
 AOEIW38_asia_middle.2.t:0 "A Stake in the Eastern War"
 AOEIW38_asia_middle.2.d:0 "The government has declared that the fate of the Gobi frontier cannot be separated from the war in China. Liaison officers carry Mongolia's terms to every interested capital."
 AOEIW38_asia_middle.2.a:0 "Our help will carry our signature."
 AOEIW38_asia_middle.3.t:0 "Neutrality with Patrols"
 AOEIW38_asia_middle.3.d:0 "Mongolia has promised no army free passage and no neighbour a blank cheque. Patrol schedules and inspection rules have been delivered with the declaration."
 AOEIW38_asia_middle.3.a:0 "Restraint must be visible to be credible."
 AOEIW38_asia_middle.4.t:0 "Reports from Three Frontiers"
 AOEIW38_asia_middle.4.d:0 "Wireless summaries from the northern boundary, the Gobi routes and the Manchurian approaches now reach one operations room each morning. Ministers can finally respond before rumours harden into policy."
 AOEIW38_asia_middle.4.a:0 "The steppe has found its voice."
 AOEIW38_asia_middle.5.t:0 "The Compact Is Signed"
 AOEIW38_asia_middle.5.d:0 "The postwar compact protects pasture, funds caravan roads and requires consultation before foreign forces use Mongolian facilities. It gives the frontier a future beyond permanent emergency."
 AOEIW38_asia_middle.5.a:0 "Let the settlement endure."
 AOEIW38_asia_middle.10.t:0 "Mongolia Requests Frontier Consultation"
 AOEIW38_asia_middle.10.d:0 "Ulaanbaatar proposes regular liaison on troop movements, refugees and caravan routes. The mission carefully treats Mongolia as a participant, not an empty space between larger armies."
 AOEIW38_asia_middle.10.a:0 "Receive the mission as a partner."
 AOEIW38_asia_middle.10.b:0 "Keep the frontier question in our own hands."
 AOEIW38_asia_middle.11.t:0 "Mongolia Proclaims Guarded Neutrality"
 AOEIW38_asia_middle.11.d:0 "Ulaanbaatar has announced equal inspection of foreign missions and rapid reinforcement of disputed crossings. The declaration closes no door, but leaves none unattended."
 AOEIW38_asia_middle.11.a:0 "A stable frontier serves us."
 AOEIW38_asia_middle.11.b:0 "Their patrols will complicate our plans."

 AOEIW38_asia_middle.20.t:0 "The Gate at Bab el-Mandeb"
 AOEIW38_asia_middle.20.d:0 "Ships pass within sight of Yemeni hills, yet pilots, customs officers and tribal guards answer to different authorities. The new council can make the strait the organizing purpose of the state."
 AOEIW38_asia_middle.20.a:0 "Every passage must become policy."
 AOEIW38_asia_middle.21.t:0 "Rules for an Open Roadstead"
 AOEIW38_asia_middle.21.d:0 "Yemen offers neutral pilotage and convoy assembly under published fees. The guarantee invites foreign commerce while asserting that safe passage begins with Yemeni consent."
 AOEIW38_asia_middle.21.a:0 "Commerce will recognize our authority."
 AOEIW38_asia_middle.22.t:0 "The Guard Takes the Coast"
 AOEIW38_asia_middle.22.d:0 "Armed launches and shore posts now signal every vessel approaching the narrows. Great powers may dislike the inspection regime, but they can no longer ignore it."
 AOEIW38_asia_middle.22.a:0 "The coast will answer to Sana'a."
 AOEIW38_asia_middle.23.t:0 "Delegates Around the Red Sea"
 AOEIW38_asia_middle.23.d:0 "Pilgrimage traffic, contraband, mines and port reconstruction give every coastal government something concrete to negotiate. Yemen chairs the conference from a position earned through control of the southern gate."
 AOEIW38_asia_middle.23.a:0 "Turn geography into a working institution."
 AOEIW38_asia_middle.24.t:0 "Hodeidah Faces the Peace"
 AOEIW38_asia_middle.24.d:0 "Customs revenue now funds a modern roadstead, coastal defence and roads into the highlands. The institutions created for wartime passage have become the foundation of a maritime economy."
 AOEIW38_asia_middle.24.a:0 "The gateway belongs to the country behind it."
 AOEIW38_asia_middle.30.t:0 "Yemen Guarantees the Southern Passage"
 AOEIW38_asia_middle.30.d:0 "Sana'a has published a neutral convoy code for Bab el-Mandeb and requests recognition of Yemeni pilots and fees. Accepting it offers predictability at the price of acknowledging a more assertive coastal state."
 AOEIW38_asia_middle.30.a:0 "Recognize the convoy code."
 AOEIW38_asia_middle.30.b:0 "Reserve our freedom of action."
 AOEIW38_asia_middle.31.t:0 "Yemeni Guns at the Narrows"
 AOEIW38_asia_middle.31.d:0 "New patrol craft and observation posts are challenging unregistered movement through the southern Red Sea. Our naval staff must now include Yemen in every plan for the passage."
 AOEIW38_asia_middle.31.a:0 "Update the charts and watch the coast."

 AOEIW38_asia_middle.40.t:0 "The Government Beyond the Railway"
 AOEIW38_asia_middle.40.d:0 "Years of mobilization have left Manchuria's northern districts governed by overlapping railway police, army commands and civil offices. Puyi's government must decide what kind of authority will remain when emergency orders expire."
 AOEIW38_asia_middle.40.a:0 "Return the frontier to civil administration."
 AOEIW38_asia_middle.40.b:0 "Keep the cordon under military command."
 AOEIW38_asia_middle.41.t:0 "Who Owns Reconstruction?"
 AOEIW38_asia_middle.41.d:0 "The war shifted factories, people and political authority inland while the ports remained China's link to world markets. Reconstruction can entrench the inland coalition or rebuild a national customs state on the coast."
 AOEIW38_asia_middle.41.a:0 "Rebuild the inland arteries first."
 AOEIW38_asia_middle.41.b:0 "Reclaim the ports and their revenues."
 AOEIW38_asia_middle.42.t:0 "The Price of the Continental Order"
 AOEIW38_asia_middle.42.d:0 "Army headquarters, civilian bureaux and commercial combines submit incompatible accounts of Japan's continental commitments. An enduring order requires either disciplined administration or limited agreements whose costs are explicit."
 AOEIW38_asia_middle.42.a:0 "Make the liaison bureaux answer for policy."
 AOEIW38_asia_middle.42.b:0 "Trade permanent burdens for negotiated access."
 AOEIW38_asia_middle.43.t:0 "The Rails Across Iran"
 AOEIW38_asia_middle.43.d:0 "Foreign staffs see a supply corridor; merchants see a national market; the court sees a threat to sovereignty. Iran must decide whether to profit from transit or keep the routes ready to deny."
 AOEIW38_asia_middle.43.a:0 "Build a corridor state on Iranian terms."
 AOEIW38_asia_middle.43.b:0 "Prepare the country to refuse passage."
 AOEIW38_asia_middle.44.t:0 "Service and the Indian Settlement"
 AOEIW38_asia_middle.44.d:0 "Indian troops, provincial governments and princely states have carried obligations that can no longer be described as temporary. Delhi must convert wartime service into shared authority or preserve the centralized defence machine."
 AOEIW38_asia_middle.44.a:0 "Seat them in a federal war council."
 AOEIW38_asia_middle.44.b:0 "Keep defence under one directorate."
 AOEIW38_asia_middle.45.t:0 "The Kingdom Between Armies"
 AOEIW38_asia_middle.45.d:0 "War has reached every river route around Thailand. Bangkok can make navigation and intelligence-sharing the basis of a regional compact or rely on enough mobile force to keep all patrons at arm's length."
 AOEIW38_asia_middle.45.a:0 "Anchor policy in a river compact."
 AOEIW38_asia_middle.45.b:0 "Maintain an armed balance."
 AOEIW38_asia_middle.46.t:0 "The Straits After the Emergency"
 AOEIW38_asia_middle.46.d:0 "Every belligerent has demanded passage or denial, but the legal and military burden falls on Turkey. Ankara must either revise the convention through diplomacy or make the narrows physically incontestable."
 AOEIW38_asia_middle.46.a:0 "Write clearer rules with the interested powers."
 AOEIW38_asia_middle.46.b:0 "Let batteries settle what clauses cannot."
 AOEIW38_asia_middle.60.t:0 "A Neighbour Publishes Its Settlement"
 AOEIW38_asia_middle.60.d:0 "[FROM.GetNameDefCap] has converted wartime improvisation into a civil and commercial programme. Its new boards, routes and consultation rules will affect our own reconstruction."
 AOEIW38_asia_middle.60.a:0 "Work with the new institutions."
 AOEIW38_asia_middle.60.b:0 "Study the proposal before committing."
 AOEIW38_asia_middle.61.t:0 "A New Regional Security Doctrine"
 AOEIW38_asia_middle.61.d:0 "[FROM.GetNameDefCap] has made emergency controls permanent through patrols, fortifications or centralized command. Our staffs must decide whether this offers predictability or a new source of pressure."
 AOEIW38_asia_middle.61.a:0 "Maintain guarded liaison."
 AOEIW38_asia_middle.61.b:0 "Prepare our own answer."

 AOEIW38_ASIA_MIDDLE_war_council_autonomy:0 "Representation on the Federal War Council"
 AOEIW38_ASIA_MIDDLE_service_compact_autonomy:0 "Ratified wartime service compact"
 AOEIW38_ASIA_MIDDLE_frontier_consultation:0 "Frontier consultation"
 AOEIW38_ASIA_MIDDLE_frontier_suspicion:0 "Frontier suspicion"
 AOEIW38_ASIA_MIDDLE_open_straits:0 "Recognized open-straits code"
 AOEIW38_ASIA_MIDDLE_guarded_straits:0 "Guarded straits policy"
 AOEIW38_ASIA_MIDDLE_regional_conference:0 "Regional conference partner"
 AOEIW38_ASIA_MIDDLE_competing_settlement:0 "Competing regional settlement"
