l_english:
 AOEIW37_GER_imperial_federal_congress:0 "Convene the Federal Congress"
 AOEIW37_GER_imperial_federal_congress_desc:0 "The constitution has survived its first crisis, but Prussia, the kingdoms and the Reichstag still disagree over who may commit the empire abroad. A federal congress will turn the settlement into rules that can survive the next war."
 AOEIW37_GER_charters_of_the_realm:0 "Charters of the Realm"
 AOEIW37_GER_charters_of_the_realm_desc:0 "Poland, Estonia and the overseas administrations cannot be governed indefinitely through temporary orders. Development guarantees and written obligations will bind the imperial sphere more securely than arbitrary requisition."
 AOEIW37_GER_imperial_defence_council:0 "The Imperial Defence Council"
 AOEIW37_GER_imperial_defence_council_desc:0 "The crown, federal governments and general staff will meet under one roof. Common timetables and a joint mobilisation plan will make the Reichspakt a working military system."
 AOEIW37_GER_pax_germanica:0 "Pax Germanica"
 AOEIW37_GER_pax_germanica_desc:0 "Germany will present its order as a bargain: protected markets, federal rights and overwhelming collective defence. Europe must now decide whether this is stability under German leadership or hegemony in constitutional dress."

 AOEIW37_GER_congress_of_nations:0 "A Congress of Nations"
 AOEIW37_GER_congress_of_nations_desc:0 "A parliamentary Germany needs partners, not obedient satellites. Delegations from the Rhine, Danube and Baltic will be invited to negotiate economic access, arbitration and common security."
 AOEIW37_GER_european_development_bank:0 "The European Development Bank"
 AOEIW37_GER_european_development_bank_desc:0 "Reconstruction loans tied to rail, power and housing projects can make cooperation tangible. The bank will also give Germany a peaceful instrument of influence across the continent."
 AOEIW37_GER_collective_security_staff:0 "A Collective Security Staff"
 AOEIW37_GER_collective_security_staff_desc:0 "Treaties are credible only when officers have agreed on signals, supply corridors and mobilisation schedules before a crisis begins."
 AOEIW37_GER_charter_of_free_europe:0 "The Charter of Free Europe"
 AOEIW37_GER_charter_of_free_europe_desc:0 "The new charter commits Germany to arbitration, open commerce and collective defence. Rival courts may distrust Berlin's leadership, but they can no longer dismiss it as an improvised arrangement."

 AOEIW37_GER_continental_workers_congress:0 "The Continental Workers' Congress"
 AOEIW37_GER_continental_workers_congress_desc:0 "The German revolution cannot remain an island. Railway unions, miners' councils and socialist parties from across Europe will debate how solidarity can function across borders."
 AOEIW37_GER_planned_exchange_network:0 "A Planned Exchange Network"
 AOEIW37_GER_planned_exchange_network_desc:0 "Coal, machine tools and rolling stock will move through negotiated production schedules. The system exchanges some local freedom for reliable continental supply."
 AOEIW37_GER_peoples_defence_college:0 "The People's Defence College"
 AOEIW37_GER_peoples_defence_college_desc:0 "Council officers and professional soldiers will teach one doctrine together. The revolution must be defended by an army that can coordinate industry, railways and the front."
 AOEIW37_GER_union_of_european_republics:0 "Union of European Republics"
 AOEIW37_GER_union_of_european_republics_desc:0 "Berlin calls for a union of workers' republics joined by production, mutual defence and elected congresses. Foreign governments must decide whether to join this experiment or contain it."

 AOEIW37_GER_continental_new_order:0 "The Continental New Order"
 AOEIW37_GER_continental_new_order_desc:0 "Military victories have created obligations that party offices and generals can no longer manage separately. Berlin will define a single hierarchy for occupied lands, dependent regimes and war production."
 AOEIW37_GER_occupation_directorate:0 "One Order from Berlin"
 AOEIW37_GER_occupation_directorate_desc:0 "Army commands, police offices and party commissioners issue rival orders across occupied Europe. Berlin will place them under one brutal chain of command."
 AOEIW37_GER_total_armaments_command:0 "Total Armaments Command"
 AOEIW37_GER_total_armaments_command_desc:0 "Industrial priorities will be set against operational plans rather than ministerial prestige. Civilian scarcity will be accepted as the price of a fully mobilised war economy."
 AOEIW37_GER_fortress_europe:0 "Fortress Europe"
 AOEIW37_GER_fortress_europe_desc:0 "The regime will convert conquest into a defended continental system of garrisons, factories and transport corridors. Its strength is real, and so is the resistance that permanent coercion creates."

 AOEIW37_GER_continental_resource_board:0 "Oil from Ploiești, Ore from Kiruna"
 AOEIW37_GER_continental_resource_board_desc:0 "German industry depends on routes it does not fully control. Ministries must secure the wells, mines and rail corridors before the next blockade closes around them."
 AOEIW37_GER_synthetic_independence:0 "Synthetic Independence"
 AOEIW37_GER_synthetic_independence_desc:0 "Hydrogenation plants and substitute materials are expensive, but they make German mobilisation harder to strangle at sea."
 AOEIW37_GER_commercial_access:0 "Commercial Access"
 AOEIW37_GER_commercial_access_desc:0 "Long contracts and reciprocal market access can secure resources more cheaply than autarky. The policy works only while Germany remains a partner others are willing to supply."
 AOEIW37_GER_strategic_reserve:0 "Build the Strategic Reserve"
 AOEIW37_GER_strategic_reserve_desc:0 "Whatever its source, fuel and critical material must be accumulated before a crisis. Protected depots and strict accounting will keep the army moving when imports falter."

 AOEIW37_GER_operational_lessons_board:0 "Lessons Written in Blood"
 AOEIW37_GER_operational_lessons_board_desc:0 "Campaign reports are opened to officers from all three services. Failed crossings, empty fuel columns and missed air support will be studied without regard for uniform or reputation."
 AOEIW37_GER_armoured_supply_columns:0 "Armoured Supply Columns"
 AOEIW37_GER_armoured_supply_columns_desc:0 "Fast formations are useless when fuel, bridging equipment and recovery vehicles remain behind. Logistics will be designed as part of the armoured force."
 AOEIW37_GER_integrated_air_defence_grid:0 "An Integrated Air Defence Grid"
 AOEIW37_GER_integrated_air_defence_grid_desc:0 "Radar stations, fighter commands and anti-aircraft districts will share one warning network. No single service can defend the industrial heartland alone."
 AOEIW37_GER_joint_arms_directorate:0 "Stukas Over the Panzers"
 AOEIW37_GER_joint_arms_directorate_desc:0 "Air liaison teams, armour, artillery and supply columns will rehearse from the same map. Coordination must begin at the planning table and survive contact with the front."

 AOEIW37_GER_compact_beyond_the_crisis:0 "After the Founders"
 AOEIW37_GER_compact_beyond_the_crisis_desc:0 "The first generation built the continental system through crisis and war. Their successors must bind crown, chambers and dependent governments to rules that work without personal loyalty."
 AOEIW37_GER_european_commonwealth:0 "The European Commonwealth"
 AOEIW37_GER_european_commonwealth_desc:0 "Development credit, collective planning and integrated defence have given the charter substance. Germany must decide whether the commonwealth is governed primarily through its assemblies or through a permanent security staff."
 AOEIW37_GER_common_plan_fulfilled:0 "The Common Plan Fulfilled"
 AOEIW37_GER_common_plan_fulfilled_desc:0 "The workshops have fuel, the armies have a shared doctrine and the continental exchange has survived its first crises. The union must now settle how much authority remains with its republics."
 AOEIW37_GER_reckoning_of_victory:0 "The Reckoning of Victory"
 AOEIW37_GER_reckoning_of_victory_desc:0 "The guns are silent, but emergency offices still control labour, transport and occupied Europe. Victory will mean little unless the regime decides what peace is supposed to look like."

 AOEIW37_GER_federal_hegemony:0 "Federal Hegemony"
 AOEIW37_GER_federal_hegemony_desc:0 "Germany's continental leadership rests on a durable bargain between imperial authority, federal rights and protected markets. The system remains unequal, but its obligations are now written and predictable."
 AOEIW37_GER_european_charter:0 "The European Charter"
 AOEIW37_GER_european_charter_desc:0 "Arbitration, parliamentary legitimacy and shared development give Germany influence that does not depend solely on threats."
 AOEIW37_GER_continental_planning:0 "Continental Planning"
 AOEIW37_GER_continental_planning_desc:0 "A network of councils coordinates heavy industry and transport across borders. Its output is formidable, though civilian consumption bears part of the cost."
 AOEIW37_GER_fortress_europe_spirit:0 "Fortress Europe"
 AOEIW37_GER_fortress_europe_spirit_desc:0 "The continent is organised for permanent mobilisation. Factories and armies answer quickly, while coercion steadily feeds resistance beneath the surface."
 AOEIW37_GER_synthetic_independence_spirit:0 "Synthetic Independence"
 AOEIW37_GER_synthetic_independence_spirit_desc:0 "State-backed substitutes and fuel plants reduce Germany's exposure to blockade at a continuing civilian cost."
 AOEIW37_GER_commercial_access_spirit:0 "Commercial Access Policy"
 AOEIW37_GER_commercial_access_spirit_desc:0 "Stable contracts and diplomatic credit keep resources moving through markets that Germany cannot command outright."
 AOEIW37_GER_strategic_reserves:0 "Strategic Reserves"
 AOEIW37_GER_strategic_reserves_desc:0 "Dispersed depots and central accounting provide a cushion against disrupted trade and overextended supply lines."
 AOEIW37_GER_joint_arms_board:0 "The Joint Arms Board"
 AOEIW37_GER_joint_arms_board_desc:0 "The services plan operations, air support and logistics through a permanent common staff."
 AOEIW37_GER_coordinated_procurement:0 "Coordinated Procurement"
 AOEIW37_GER_coordinated_procurement_desc:0 "Shared specifications and delivery schedules reduce waste across allied arsenals."
 AOEIW37_GER_development_credit:0 "Continental Development Credit"
 AOEIW37_GER_development_credit_desc:0 "German-backed credit accelerates construction, while repayment claims a share of civilian output."
 AOEIW37_GER_workers_exchange:0 "Workers' Technical Exchange"
 AOEIW37_GER_workers_exchange_desc:0 "Engineers, foremen and union delegates share methods between the workshops of allied republics."
 AOEIW37_GER_forced_levies:0 "Continental Levies"
 AOEIW37_GER_forced_levies_desc:0 "Berlin demands recruits and industrial deliveries from dependent governments. The front receives more, but local legitimacy erodes."
 AOEIW37_GER_peace_dividend:0 "The Peace Dividend"
 AOEIW37_GER_peace_dividend_desc:0 "Closing the wartime directorates releases labour and capital for civilian reconstruction, while public appetite for another war recedes."
 AOEIW37_GER_chartered_empire:0 "The Chartered Empire"
 AOEIW37_GER_chartered_empire_desc:0 "Crown, federal chambers and dependent governments now work through published obligations. The arrangement concedes room for local government in exchange for a durable imperial framework."
 AOEIW37_GER_imperial_prerogative:0 "The Imperial Prerogative"
 AOEIW37_GER_imperial_prerogative_desc:0 "The crown has retained the final word over mobilisation and the continental sphere. Decisions arrive quickly, but dependent governments see fewer peaceful routes toward self-government."
 AOEIW37_GER_civic_commonwealth:0 "A Civic Commonwealth"
 AOEIW37_GER_civic_commonwealth_desc:0 "Committees, courts and development agencies have made the European Charter a daily practice rather than a declaration signed in Berlin."
 AOEIW37_GER_security_commonwealth:0 "The Commonwealth Security Staff"
 AOEIW37_GER_security_commonwealth_desc:0 "Civilian governments retain formal authority, while a permanent joint staff prepares the charter states to meet a hostile coalition."
 AOEIW37_GER_federal_socialism:0 "The Republics' Union"
 AOEIW37_GER_federal_socialism_desc:0 "The common plan sets continental goals, but elected councils retain authority over local production and social policy."
 AOEIW37_GER_directed_common_plan:0 "The Directed Common Plan"
 AOEIW37_GER_directed_common_plan_desc:0 "Berlin's planning directorate assigns output, transport and military priorities across the union. Coordination rises as local discretion narrows."
 AOEIW37_GER_permanent_victory_state:0 "The Permanent Victory State"
 AOEIW37_GER_permanent_victory_state_desc:0 "Emergency rule has become the regime's normal condition. The machinery of conquest remains efficient, expensive and inseparable from permanent resistance."

 AOEIW37_GER_continental_policy_category:0 "Germany's Continental Order"
 AOEIW37_GER_continental_policy_category_desc:0 "Germany's political settlement now shapes how it leads allies, treats subjects and converts victory into a lasting European order."
 AOEIW37_GER_standardise_reichspakt_procurement:0 "Standardise Allied Procurement"
 AOEIW37_GER_standardise_reichspakt_procurement_desc:0 "Ask every ally to adopt common ammunition, spare parts and delivery schedules. Each government will decide whether the savings justify German supervision."
 AOEIW37_GER_convene_subject_charters:0 "Convene the Subject Charters"
 AOEIW37_GER_convene_subject_charters_desc:0 "Offer Germany's dependent administrations development credit and a measured increase in self-government in exchange for reliable obligations."
 AOEIW37_GER_issue_continental_development_bonds:0 "Issue Continental Development Bonds"
 AOEIW37_GER_issue_continental_development_bonds_desc:0 "Offer every ally German-backed finance for railways, power stations and housing. Participating governments gain construction credit and accept Berlin's influence over the programme."
 AOEIW37_GER_exchange_workers_delegations:0 "Exchange Workers' Delegations"
 AOEIW37_GER_exchange_workers_delegations_desc:0 "Invite allied governments to receive engineers, foremen and union organisers. Friendly republics will welcome the exchange; wary governments may refuse the political risk."
 AOEIW37_GER_impose_continental_levies:0 "Impose Continental Levies"
 AOEIW37_GER_impose_continental_levies_desc:0 "Demand recruits and production from dependent governments for the duration of the war. Subjects may comply, petition for relief or force Berlin to decide how far it will press the demand."
 AOEIW37_GER_define_continental_diplomacy:0 "Review the Continental Response"
 AOEIW37_GER_define_continental_diplomacy_desc:0 "Europe has answered Germany's new order with a mixture of cooperation and resistance. Decide whether to pursue recognition through practical guarantees or prepare for a hostile coalition."
 AOEIW37_GER_close_wartime_directorates:0 "Close the Wartime Directorates"
 AOEIW37_GER_close_wartime_directorates_desc:0 "The war is over. Continuing emergency rule would keep production high, but it would also make the regime's occupation machinery permanent."
 AOEIW37_GER_subject_charter_autonomy:0 "Charters of the Realm"
 AOEIW37_GER_forced_levies_autonomy:0 "Continental Levies"

 AOEIW37_ger.1.t:0 "The Federal Congress Convenes"
 AOEIW37_ger.1.d:0 "Ministers arrive with incompatible drafts, yet all understand the alternative: another emergency decided by decree and improvisation. The final articles define how Berlin, the federal states and the armed forces will act together."
 AOEIW37_ger.1.a:0 "Authority must rest on the federal compact."
 AOEIW37_ger.1.b:0 "The crown must retain the power to decide."
 AOEIW37_ger.2.t:0 "Europe Comes to Berlin"
 AOEIW37_ger.2.d:0 "Delegates who once expected orders now enter committees with German deputies. Their suspicion remains, but negotiation itself marks how far the parliamentary settlement has travelled."
 AOEIW37_ger.2.a:0 "Make cooperation visible."
 AOEIW37_ger.3.t:0 "The Congress of Workshops"
 AOEIW37_ger.3.d:0 "Miners from the Ruhr argue with railway delegates from Warsaw and Rotterdam over prices, quotas and local control. The dispute is fierce because the proposed union is becoming real."
 AOEIW37_ger.3.a:0 "Build solidarity through practical agreements."
 AOEIW37_ger.4.t:0 "A Hierarchy for Europe"
 AOEIW37_ger.4.d:0 "Maps of occupied districts cover the old parliamentary tables. Generals demand secure supply, party officials demand political control, and industrial offices demand labour. The new order binds all three into one system."
 AOEIW37_ger.4.a:0 "Europe will serve the mobilisation."
 AOEIW37_ger.5.t:0 "Power After the Settlement"
 AOEIW37_ger.5.d:0 "Germany has defined its internal order. It must now decide whether recognition abroad will be won through credit and guarantees or secured by visible readiness for another confrontation."
 AOEIW37_ger.5.a:0 "Offer guarantees and material cooperation."
 AOEIW37_ger.5.b:0 "Keep the continent under armed vigilance."
 AOEIW37_ger.6.t:0 "Factories Turn Back to Peace"
 AOEIW37_ger.6.d:0 "Emergency offices close, ration schedules loosen and engineers return to civilian orders. The regime sacrifices part of its war machine to make victory bearable at home."
 AOEIW37_ger.6.a:0 "The state must learn how to survive peace."

 AOEIW37_ger.7.t:0 "The Compact After Its Founders"
 AOEIW37_ger.7.d:0 "The federal congress, defence council and resource board now operate without emergency improvisation. Ministers nevertheless disagree over the lesson of the past decade: some see written charters as the empire's source of strength, while the palace credits unity of command."
 AOEIW37_ger.7.a:0 "Make the charters the law of the empire."
 AOEIW37_ger.7.b:0 "Preserve the crown's final authority."
 AOEIW37_ger.8.t:0 "The Commonwealth Takes Shape"
 AOEIW37_ger.8.d:0 "The charter states share credit, military plans and an increasingly crowded calendar of assemblies. Parliament must decide whether those civilian institutions can bear the next crisis or whether the joint security staff needs wider authority."
 AOEIW37_ger.8.a:0 "Let the assemblies govern the commonwealth."
 AOEIW37_ger.8.b:0 "Entrust collective security to the joint staff."
 AOEIW37_ger.9.t:0 "Who Directs the Common Plan?"
 AOEIW37_ger.9.d:0 "Continental production targets have been met, yet success has sharpened an old dispute. Local councils claim that cooperation worked because each republic retained initiative; Berlin's planners insist that only central direction prevented chaos."
 AOEIW37_ger.9.a:0 "The union belongs to its republics."
 AOEIW37_ger.9.b:0 "One plan requires one directorate."

 AOEIW37_ger.10.t:0 "Berlin Proclaims a Federal Peace"
 AOEIW37_ger.10.d:0 "[FROM.GetNameDefCap] has offered protected markets, written charters and collective defence under German leadership. Its lawyers call the settlement federal; its critics see an empire made more durable by rules."
 AOEIW37_ger.10.a:0 "Work within the new order."
 AOEIW37_ger.10.b:0 "Guard our freedom of action."
 AOEIW37_ger.11.t:0 "The Charter of Free Europe"
 AOEIW37_ger.11.d:0 "[FROM.GetNameDefCap] invites Europe to join a charter of arbitration, development credit and collective security. Parliamentary language cannot erase German power, but it offers a different way to manage it."
 AOEIW37_ger.11.a:0 "The charter deserves a hearing."
 AOEIW37_ger.11.b:0 "German leadership remains German leadership."
 AOEIW37_ger.12.t:0 "A Union of European Republics"
 AOEIW37_ger.12.d:0 "[FROM.GetNameDefCap] calls for workers' republics to coordinate production and defence through a continental congress. Socialist movements celebrate; governments fear that trade missions will carry revolution with them."
 AOEIW37_ger.12.a:0 "Join the technical exchange."
 AOEIW37_ger.12.b:0 "Contain the German revolution."
 AOEIW37_ger.13.t:0 "Fortress Europe"
 AOEIW37_ger.13.d:0 "[FROM.GetNameDefCap] has declared its conquests a single defended system. New garrisons, rail commands and production levies make German power harder to dislodge and leave its neighbours with little room for neutrality."
 AOEIW37_ger.13.a:0 "Accommodation is the only practical course."
 AOEIW37_ger.13.b:0 "Prepare to resist German domination."
 AOEIW37_ger.14.t:0 "What Follows Victory?"
 AOEIW37_ger.14.d:0 "Demobilised soldiers return to cities still governed by ration offices and security decrees. Industrial managers argue that the emergency apparatus can rebuild Europe; party hardliners answer that dismantling it would squander everything won at the front."
 AOEIW37_ger.14.a:0 "Close the directorates and rebuild."
 AOEIW37_ger.14.b:0 "Victory has vindicated permanent mobilisation."

 AOEIW37_ger.20.t:0 "Berlin Offers a New Charter"
 AOEIW37_ger.20.d:0 "[FROM.GetNameDefCap] has offered development credit and a measured expansion of self-government in return for fixed military and economic obligations. The charter would replace arbitrary orders with written rules, though Berlin still intends to write most of them."
 AOEIW37_ger.20.a:0 "Accept the charter as a workable settlement."
 AOEIW37_ger.20.b:0 "Insist on wider local authority."
 AOEIW37_ger.22.t:0 "Berlin Demands Continental Levies"
 AOEIW37_ger.22.d:0 "German officials have presented quotas for recruits, rolling stock and factory deliveries. Compliance will keep the armies supplied and reduce our freedom of action; refusal will send the dispute directly to Berlin."
 AOEIW37_ger.22.a:0 "Meet the quotas for the duration of the war."
 AOEIW37_ger.22.b:0 "Our administration cannot bear this burden."
 AOEIW37_ger.23.t:0 "[FROM.GetNameDefCap] Resists the Levies"
 AOEIW37_ger.23.d:0 "Officials in [FROM.GetNameDef] warn that the latest demands will break their administration and provoke open resistance. The high command calls this evasion during wartime; civilian ministers advise a concession before the dispute spreads."
 AOEIW37_ger.23.a:0 "Reduce the quota and preserve the relationship."
 AOEIW37_ger.23.b:0 "The front takes precedence. Enforce it."
 AOEIW37_ger.24.t:0 "German Procurement Standards"
 AOEIW37_ger.24.d:0 "[FROM.GetNameDefCap] proposes common ammunition, vehicle parts and delivery schedules for the alliance. Adoption would ease wartime supply, while giving German offices greater influence over our contracts."
 AOEIW37_ger.24.a:0 "Adopt the common standards."
 AOEIW37_ger.24.b:0 "Retain our national specifications."
 AOEIW37_ger.25.t:0 "Continental Development Bonds"
 AOEIW37_ger.25.d:0 "Berlin offers long-term credit for railways, power stations and housing. The terms are favourable, but participating ministries must submit projects to a German-led board."
 AOEIW37_ger.25.a:0 "Put the credit to work."
 AOEIW37_ger.25.b:0 "Protect our budget from German influence."
 AOEIW37_ger.26.t:0 "Workers' Delegations Arrive"
 AOEIW37_ger.26.d:0 "Engineers and union delegates from [FROM.GetNameDef] offer production methods tested across the continental exchange. Their technical expertise is useful; their political conversations on the factory floor may be the more lasting export."
 AOEIW37_ger.26.a:0 "Welcome the technical exchange."
 AOEIW37_ger.26.b:0 "Keep political organisers out of our factories."

