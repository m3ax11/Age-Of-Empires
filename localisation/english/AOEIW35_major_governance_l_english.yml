 AOEIW35_usa.1.t:0 "Who Governs the State?"
 AOEIW35_usa.1.d:0 "The constitutional order now has to finance mobilisation across forty-eight jealous states, powerful committees and an executive claiming emergency responsibility."
 AOEIW35_usa.1.a:0 "Guarantee Congress and the States."
 AOEIW35_usa.1.b:0 "The Federal Executive must be able to decide."
 AOEIW35_usa.2.t:0 "The First Governing Crisis"
 AOEIW35_usa.2.d:0 "Governors resist federal standards while the administration argues that a continental arsenal cannot be assembled through forty-eight separate contracts."
 AOEIW35_usa.2.a:0 "Find a negotiated compromise."
 AOEIW35_usa.2.b:0 "The chain of command cannot wait."
 AOEIW35_usa.3.t:0 "The National Emergency Programme"
 AOEIW35_usa.3.d:0 "The production programme can awaken American industry immediately, but it concentrates contracts and postpones consumer recovery."
 AOEIW35_usa.3.a:0 "Carry out the programme as drafted."
 AOEIW35_usa.3.b:0 "Withdraw the harshest measures."
