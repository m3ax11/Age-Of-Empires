 AOEIW35_spr.1.t:0 "Who Governs the State?"
 AOEIW35_spr.1.d:0 "Victory over the immediate crisis has not settled the claims of Catalonia, the Basque country, the old kingdoms and the ministries in Madrid."
 AOEIW35_spr.1.a:0 "Guarantee The Historic Regions."
 AOEIW35_spr.1.b:0 "Direction from Madrid must be able to decide."
 AOEIW35_spr.2.t:0 "The First Governing Crisis"
 AOEIW35_spr.2.d:0 "Reconstruction funds have reopened every constitutional wound. Regional delegates demand guarantees before their levies and factories answer Madrid."
 AOEIW35_spr.2.a:0 "Find a negotiated compromise."
 AOEIW35_spr.2.b:0 "The chain of command cannot wait."
 AOEIW35_spr.3.t:0 "The National Emergency Programme"
 AOEIW35_spr.3.d:0 "A national reconstruction drive can restore railways and army readiness, but coercive requisitions risk renewing local resistance."
 AOEIW35_spr.3.a:0 "Carry out the programme as drafted."
 AOEIW35_spr.3.b:0 "Withdraw the harshest measures."
