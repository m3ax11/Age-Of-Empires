 AOEIW35_GER_governance_category:0 "Government and Institutional Balance"
 AOEIW35_GER_governance_category_desc:0 "The balance between Representative Institutions and Executive Authority changes stability, mobilisation and state capacity."
 AOEIW35_GER_support_left:0 "Support Representative Institutions"
 AOEIW35_GER_support_left_desc:0 "Concessions and appointments shift the institutional balance at the cost of political room for manoeuvre."
 AOEIW35_GER_support_right:0 "Support Executive Authority"
 AOEIW35_GER_support_right_desc:0 "Directives and priority funding strengthen executive authority while sharpening political resistance."
 AOEIW35_GER_launch_national_programme:0 "Launch a National Emergency Programme"
 AOEIW35_GER_launch_national_programme_desc:0 "Industry and administration accelerate for 180 days. The immediate advantage carries a country-specific political or economic price."
 AOEIW35_GER_national_programme:0 "National Emergency Programme"
 AOEIW35_GER_national_programme_desc:0 "Concentrated mobilisation produces immediate results while burdening civilian supply, stability or institutional cooperation."
 AOEIW35_ger.1.t:0 "Who Governs the State?"
 AOEIW35_ger.1.d:0 "The constitutional settlement has not ended the struggle over who truly governs Germany. Crown, chamber, party organisations and the officer corps all claim a mandate."
 AOEIW35_ger.1.a:0 "Guarantee Representative Institutions."
 AOEIW35_ger.1.b:0 "Executive Authority must be able to decide."
 AOEIW35_ger.2.t:0 "The First Governing Crisis"
 AOEIW35_ger.2.d:0 "The new order now faces its first practical test: budgets, appointments and mobilisation must be reconciled with the promises made during the struggle for power."
 AOEIW35_ger.2.a:0 "Find a negotiated compromise."
 AOEIW35_ger.2.b:0 "The chain of command cannot wait."
 AOEIW35_ger.3.t:0 "The National Emergency Programme"
 AOEIW35_ger.3.d:0 "Industrialists demand firm contracts, organised labour demands safeguards, and the general staff demands priority. The cabinet cannot satisfy all three without cost."
 AOEIW35_ger.3.a:0 "Carry out the programme as drafted."
 AOEIW35_ger.3.b:0 "Withdraw the harshest measures."
