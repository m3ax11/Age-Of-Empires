 AOEIW35_aus.1.t:0 "Who Governs the State?"
 AOEIW35_aus.1.d:0 "The Dual Monarchy survives through bargains that satisfy no nationality completely. The crown must choose whether concessions become a constitution or remain temporary privileges."
 AOEIW35_aus.1.a:0 "Guarantee The Crownlands."
 AOEIW35_aus.1.b:0 "The Ministries in Vienna must be able to decide."
 AOEIW35_aus.2.t:0 "The First Governing Crisis"
 AOEIW35_aus.2.d:0 "Hungarian ministers, Czech deputies and South Slav delegates have tied military credits to a new settlement of crownland authority."
 AOEIW35_aus.2.a:0 "Find a negotiated compromise."
 AOEIW35_aus.2.b:0 "The chain of command cannot wait."
 AOEIW35_aus.3.t:0 "The National Emergency Programme"
 AOEIW35_aus.3.d:0 "The Danubian programme can standardise rails, weapons and administration, but either Vienna or the crownlands must surrender practical authority."
 AOEIW35_aus.3.a:0 "Carry out the programme as drafted."
 AOEIW35_aus.3.b:0 "Withdraw the harshest measures."
 AOEIW35_GER_imperial_settlement:0 "Crown and Reichstag"
 AOEIW35_GER_imperial_settlement_desc:0 "The empire needs a durable division of authority between crown, chamber and federal council."
 AOEIW35_GER_imperial_institutions:0 "The Kaiser Opens the Reichstag"
 AOEIW35_GER_imperial_institutions_desc:0 "The crown will accept ministers who answer questions, defend a budget and survive a vote. In return, the chamber recognises the federal monarchy as the frame of government."
 AOEIW35_GER_imperial_executive:0 "Royal Prerogative"
 AOEIW35_GER_imperial_executive_desc:0 "The empire needs a durable division of authority between crown, chamber and federal council."
