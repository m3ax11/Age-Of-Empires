 AOEIW35_eng.1.t:0 "Who Governs the State?"
 AOEIW35_eng.1.d:0 "Westminster can no longer assume that an imperial commitment automatically binds every dominion parliament. Consultation and command must be reconciled."
 AOEIW35_eng.1.a:0 "Guarantee Parliament and Dominions."
 AOEIW35_eng.1.b:0 "The Imperial Cabinet must be able to decide."
 AOEIW35_eng.2.t:0 "The First Governing Crisis"
 AOEIW35_eng.2.d:0 "The chiefs of staff request unified direction while dominion ministers demand a voice over deployments, shipping and wartime finance."
 AOEIW35_eng.2.a:0 "Find a negotiated compromise."
 AOEIW35_eng.2.b:0 "The chain of command cannot wait."
 AOEIW35_eng.3.t:0 "The National Emergency Programme"
 AOEIW35_eng.3.d:0 "The emergency programme can protect sea lanes and accelerate shipbuilding, but civilian imports will be squeezed for the duration."
 AOEIW35_eng.3.a:0 "Carry out the programme as drafted."
 AOEIW35_eng.3.b:0 "Withdraw the harshest measures."
