 AOEIW35_sov.1.t:0 "Who Governs the State?"
 AOEIW35_sov.1.d:0 "The immense state can be governed only by bargaining with its republics and provinces or by concentrating transport, appointments and coercive power at the centre."
 AOEIW35_sov.1.a:0 "Guarantee Republics and Provinces."
 AOEIW35_sov.1.b:0 "The Central Directorate must be able to decide."
 AOEIW35_sov.2.t:0 "The First Governing Crisis"
 AOEIW35_sov.2.d:0 "Railway allocations have become a constitutional dispute. Regional delegates demand guarantees while the central ministries warn that delay will ruin mobilisation."
 AOEIW35_sov.2.a:0 "Find a negotiated compromise."
 AOEIW35_sov.2.b:0 "The chain of command cannot wait."
 AOEIW35_sov.3.t:0 "The National Emergency Programme"
 AOEIW35_sov.3.d:0 "A continental programme can bind the workshops, depots and armies together, but local consumption will suffer until the new network is established."
 AOEIW35_sov.3.a:0 "Carry out the programme as drafted."
 AOEIW35_sov.3.b:0 "Withdraw the harshest measures."
