 AOEIW35_jap.1.t:0 "Who Governs the State?"
 AOEIW35_jap.1.d:0 "Every imperial strategy becomes a contest for steel, fuel, shipping and access to the throne. The services demand a binding allocation before expansion continues."
 AOEIW35_jap.1.a:0 "Guarantee The Naval Conference."
 AOEIW35_jap.1.b:0 "The Army Directorate must be able to decide."
 AOEIW35_jap.2.t:0 "The First Governing Crisis"
 AOEIW35_jap.2.d:0 "The liaison conference has prevented open sabotage, but neither service accepts a settlement that leaves the other free to define the next war."
 AOEIW35_jap.2.a:0 "Find a negotiated compromise."
 AOEIW35_jap.2.b:0 "The chain of command cannot wait."
 AOEIW35_jap.3.t:0 "The National Emergency Programme"
 AOEIW35_jap.3.d:0 "A joint mobilisation schedule offers efficiency at the price of civilian consumption and forces both services to surrender cherished independent projects."
 AOEIW35_jap.3.a:0 "Carry out the programme as drafted."
 AOEIW35_jap.3.b:0 "Withdraw the harshest measures."
