 AOEIW35_ita.1.t:0 "Who Governs the State?"
 AOEIW35_ita.1.d:0 "The regime is an alliance of party secretaries, soldiers, industrialists and royal institutions. Their public unity hides a contest over every appointment."
 AOEIW35_ita.1.a:0 "Guarantee The Grand Council."
 AOEIW35_ita.1.b:0 "Personal Command must be able to decide."
 AOEIW35_ita.2.t:0 "The First Governing Crisis"
 AOEIW35_ita.2.d:0 "Failures in procurement have given the Grand Council an excuse to demand supervision while the executive insists that divided command caused the failures."
 AOEIW35_ita.2.a:0 "Find a negotiated compromise."
 AOEIW35_ita.2.b:0 "The chain of command cannot wait."
 AOEIW35_ita.3.t:0 "The National Emergency Programme"
 AOEIW35_ita.3.d:0 "A concentrated industrial drive can modernise the armed forces, but the railways and civilian market cannot carry every imperial promise at once."
 AOEIW35_ita.3.a:0 "Carry out the programme as drafted."
 AOEIW35_ita.3.b:0 "Withdraw the harshest measures."
