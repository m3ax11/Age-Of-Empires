 AOEIW35_fra.1.t:0 "Who Governs the State?"
 AOEIW35_fra.1.d:0 "Deputies, prefects, veterans and industrial syndicates all interpret the national settlement differently. France must decide how much authority remains in the chamber."
 AOEIW35_fra.1.a:0 "Guarantee The Chamber."
 AOEIW35_fra.1.b:0 "Executive Direction must be able to decide."
 AOEIW35_fra.2.t:0 "The First Governing Crisis"
 AOEIW35_fra.2.d:0 "Rearmament has reopened the old argument between parliamentary supervision and a government empowered to act before the next crisis reaches the frontier."
 AOEIW35_fra.2.a:0 "Find a negotiated compromise."
 AOEIW35_fra.2.b:0 "The chain of command cannot wait."
 AOEIW35_fra.3.t:0 "The National Emergency Programme"
 AOEIW35_fra.3.d:0 "A national mobilisation programme promises trained reserves and modern factories, but it will either burden consumers or weaken civilian oversight."
 AOEIW35_fra.3.a:0 "Carry out the programme as drafted."
 AOEIW35_fra.3.b:0 "Withdraw the harshest measures."
