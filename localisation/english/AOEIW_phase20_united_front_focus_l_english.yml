l_english:
 AOEIW20_UF_convene_front_desc: "Nationalists, communists and regional commanders establish a single wartime council. The compromise is fragile, but it gives the rebellion an authority able to issue orders and collect supplies."
 AOEIW20_UF_enemy_beijing_desc: "Every faction of the Front agrees on one immediate objective: the Qing imperial centre must fall before the coalition tears itself apart."
 AOEIW20_UF_coordination_desc: "Liaison missions, common radio procedures and regional timetables will let otherwise rival armies cooperate along one front."
 AOEIW20_UF_joint_staff_desc: "A unified staff will translate political agreement into operational plans and reduce the chaos of parallel commands."
 AOEIW20_UF_integrate_militias_desc: "Local defence groups are registered, reorganised and issued standard weapons, adding 300,000 men and 12,000 rifles to the national mobilisation."
 AOEIW20_UF_arms_workshops_desc: "Machine shops and railway depots around Chongqing are converted into two military factories for immediate wartime production."
 AOEIW20_UF_secure_railways_desc: "Guarded junctions and emergency repairs improve the main supply routes between the Front's interior bases."
 AOEIW20_UF_wartime_government_desc: "Temporary ministries receive the authority to requisition transport, coordinate provinces and fund the war without reopening every factional dispute."
 AOEIW20_UF_salvation_propaganda_desc: "The war is presented as a national struggle for survival rather than the private campaign of any one party."
 AOEIW20_UF_land_bread_desc: "Food guarantees and emergency tenancy measures secure rural cooperation, adding another 250,000 recruits without abandoning the countryside."
 AOEIW20_UF_discipline_officers_desc: "Common regulations and a unified chain of command curb private armies and restore authority at the front."
 AOEIW20_UF_mobilise_interior_desc: "A second mobilisation wave calls 350,000 men and releases 18,000 rifles from provincial stocks."
 AOEIW20_UF_foreign_arms_desc: "Purchasing missions and sympathetic foreign networks secure 20,000 rifles and 1,500 artillery pieces for the decisive campaign."
 AOEIW20_UF_national_salvation_economy_focus_desc: "Industry, transport and finance are brought under a crash wartime programme that improves output but increases the civilian burden."
 AOEIW20_UF_final_offensive_focus_desc: "The unified staff, new arsenals and mass mobilisation are concentrated for the final assault on the Qing regime."
 AOEIW20_UF_question_leadership_desc: "Victory removes the coalition's common enemy. China must now choose between Chiang's centralized nationalism, Mao's mass revolution and continued council government."
 AOEIW20_UF_chiang_leads_desc: "Chiang Kai-shek will turn the wartime coalition into a centralized National Revolutionary Army state. This is a permanent leader, government and national identity choice."
 AOEIW20_UF_mao_leads_desc: "Mao Zedong will convert the wartime coalition into a communist mass state committed to rural mobilisation and rapid industrialisation. This is a permanent leader, government and national identity choice."
 AOEIW20_UF_council_endures_desc: "No faction is permitted to monopolise victory. The United Front council remains the government and balances the competing revolutionary armies."
 AOEIW20_UF_chiang_army_desc: "Chiang's staff standardises training and doctrine, granting Army Experience and two land-doctrine research discounts."
 AOEIW20_UF_mao_industry_desc: "Mao's government constructs two civilian factories and accelerates two industrial technologies as the first stage of rapid revolutionary industrialisation."
 AOEIW20_UF_council_compromise_desc: "A constitutional compact stabilises the council government and turns wartime cooperation into a durable political order."
