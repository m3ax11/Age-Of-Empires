l_english:
 aoeiw_phase21_safe_super.a:0 "The world will remember."
 aoeiw_phase21_safe_super.1.t:0 "THE WAR OF IRON AND ICE"
 aoeiw_phase21_safe_super.1.d:0 "Germany and Russia have entered a war that will decide the fate of Europe. Millions now march toward a front stretching from the Baltic to the Black Sea."
 aoeiw_phase21_safe_super.2.t:0 "THE RHINE ERUPTS"
 aoeiw_phase21_safe_super.2.d:0 "Germany and France are at war. The old frontier has become the centre of the world's attention as armies mobilise on both banks of the Rhine."
 aoeiw_phase21_safe_super.3.t:0 "THE UNITED FRONT RISES"
 aoeiw_phase21_safe_super.3.d:0 "China has fractured into open civil war. Nationalists, communists and regional armies now fight to determine who will reunite the country."
 aoeiw_phase21_safe_super.4.t:0 "THE NRA UNITES CHINA"
 aoeiw_phase21_safe_super.4.d:0 "The National Revolutionary Army has prevailed. Chiang Kai-shek now claims the authority to rebuild and govern a reunited Chinese republic."
 aoeiw_phase21_safe_super.5.t:0 "THE REVOLUTION TRIUMPHS"
 aoeiw_phase21_safe_super.5.d:0 "The communist revolution has triumphed. Mao Zedong now claims the mandate to transform China and carry the revolution into a new age."
