l_english:
 AOEIW_frontier_research:0 "Frontier Technical Mission"
 AOEIW_FRONTIER_MON_khural:0 "The Khural at Ulaanbaatar"
 AOEIW_FRONTIER_MON_khural_desc:0 "The border war exposes the limits of governing scattered herding districts from the capital. Convene provincial delegates before another mobilisation."
 AOEIW_FRONTIER_MON_herders_spirit:0 "District Supply Covenants"
 AOEIW_FRONTIER_MON_herders_spirit_desc:0 "Local requisitions preserve rural confidence."
 AOEIW_FRONTIER_MON_herders:0 "A Covenant with the Herding Districts"
 AOEIW_FRONTIER_MON_herders_desc:0 "Seasonal herds cannot meet fixed requisition schedules. Local councils will manage deliveries, accepting a slower but more reliable mobilisation."
 AOEIW_FRONTIER_MON_directorate_spirit:0 "Central Requisition Directorate"
 AOEIW_FRONTIER_MON_directorate_spirit_desc:0 "A central register supports rapid mobilisation at a social cost."
 AOEIW_FRONTIER_MON_directorate:0 "A Central Mobilisation Directorate"
 AOEIW_FRONTIER_MON_directorate_desc:0 "The army wants one register of horses, reservists and stores. Central collection accelerates mobilisation but disrupts provincial life."
 AOEIW_FRONTIER_MON_veterinary:0 "Provincial Veterinary Stations"
 AOEIW_FRONTIER_MON_veterinary_desc:0 "A cavalry army begins with healthy remounts. Veterinary circuits will accompany the herds instead of waiting for them in the capital."
 AOEIW_FRONTIER_MON_registers:0 "Register the Reserve Horses"
 AOEIW_FRONTIER_MON_registers_desc:0 "Provincial officers will record mounts and fodder together, avoiding paper formations that cannot march."
 AOEIW_FRONTIER_MON_districts:0 "The Provincial Service Charter"
 AOEIW_FRONTIER_MON_districts_desc:0 "Both routes now require a permanent link between local administrations and the army supply office."
 AOEIW_FRONTIER_MON_caravans:0 "Chart the Caravan Wells"
 AOEIW_FRONTIER_MON_caravans_desc:0 "Reliable wells determine the usable roads across the steppe. Survey teams will mark the routes before construction begins."
 AOEIW_FRONTIER_MON_workshops:0 "Ulaanbaatar Repair Workshops"
 AOEIW_FRONTIER_MON_workshops_desc:0 "Imported machines need local repair capacity. A modest workshop programme is more useful than factories without spare parts."
 AOEIW_FRONTIER_MON_winter_spirit:0 "Winter Depot Network"
 AOEIW_FRONTIER_MON_winter_spirit_desc:0 "Dispersed stores reduce winter losses."
 AOEIW_FRONTIER_MON_depots:0 "Winter Fodder Depots"
 AOEIW_FRONTIER_MON_depots_desc:0 "Reserve fodder at district depots lets mounted units remain in the field when grazing fails."
 AOEIW_FRONTIER_MON_arsenal:0 "Small Arms at the Capital"
 AOEIW_FRONTIER_MON_arsenal_desc:0 "Repairing and assembling rifles establishes the first dependable domestic military supply line."
 AOEIW_FRONTIER_MON_roads:0 "A Steppe Transport Service"
 AOEIW_FRONTIER_MON_roads_desc:0 "Connect the wells, depots and repair shops under one transport timetable."
 AOEIW_FRONTIER_MON_riders:0 "The Mounted Frontier Patrol"
 AOEIW_FRONTIER_MON_riders_desc:0 "Long borders favour reconnaissance before concentration. Patrol leaders will receive authority to report and withdraw rather than die holding empty ground."
 AOEIW_FRONTIER_MON_signals:0 "Radios for the Patrol Leaders"
 AOEIW_FRONTIER_MON_signals_desc:0 "Wireless sets shorten the delay between a border incident and a decision in Ulaanbaatar."
 AOEIW_FRONTIER_MON_mobile_spirit:0 "Steppe Manoeuvre Commands"
 AOEIW_FRONTIER_MON_mobile_spirit_desc:0 "Mounted reconnaissance supports operational movement."
 AOEIW_FRONTIER_MON_mobile:0 "Mobile Steppe Columns"
 AOEIW_FRONTIER_MON_mobile_desc:0 "Small mobile columns can concentrate along surveyed routes without stripping every district of its defenders."
 AOEIW_FRONTIER_MON_airfield:0 "The Ulaanbaatar Airstrip"
 AOEIW_FRONTIER_MON_airfield_desc:0 "Even a small air arm needs maintenance sheds and a prepared landing ground."
 AOEIW_FRONTIER_MON_pilots:0 "Train Steppe Observers"
 AOEIW_FRONTIER_MON_pilots_desc:0 "Observation crews will map routes and report troop movements rather than chase a prestige bomber fleet."
 AOEIW_FRONTIER_MON_frontier:0 "The Chinese Frontier Commission"
 AOEIW_FRONTIER_MON_frontier_desc:0 "The United Front war has made every caravan politically suspect. Border commissioners must choose whether to assist the coalition or keep traffic neutral."
 AOEIW_FRONTIER_MON_solidarity:0 "Supply the United Front"
 AOEIW_FRONTIER_MON_solidarity_desc:0 "Offer a controlled delivery of rifles. The Chinese council may accept the offer; this is aid, not automatic entry into its war."
 AOEIW_FRONTIER_MON_neutral_spirit:0 "Neutral Caravan Gates"
 AOEIW_FRONTIER_MON_neutral_spirit_desc:0 "Controlled trade supports the civilian state."
 AOEIW_FRONTIER_MON_neutral:0 "Keep the Caravan Gates Neutral"
 AOEIW_FRONTIER_MON_neutral_desc:0 "Customs posts will distinguish civilian trade from military convoys. Neutrality protects the border economy but rules out the rifle mission."
 AOEIW_FRONTIER_MON_liaison:0 "Permanent Frontier Liaison"
 AOEIW_FRONTIER_MON_liaison_desc:0 "A standing liaison office will handle incidents without allowing local commanders to start a foreign war."
 AOEIW_FRONTIER_MON_academy:0 "The District Officer School"
 AOEIW_FRONTIER_MON_academy_desc:0 "Patrol reports and air observations will become teaching material for a professional cadre."
 AOEIW_FRONTIER_MON_recovery:0 "Mobile Recovery Teams"
 AOEIW_FRONTIER_MON_recovery_desc:0 "A broken truck should return to a workshop rather than be abandoned beside a caravan track."
 AOEIW_FRONTIER_MON_borderpeace:0 "A Working Border Regime"
 AOEIW_FRONTIER_MON_borderpeace_desc:0 "The commission can now coordinate trade, incident reports and winter supply on the same map."
 AOEIW_FRONTIER_MON_state:0 "A State Across the Steppe"
 AOEIW_FRONTIER_MON_state_desc:0 "Provincial agreements, transport and trained officers have finally given central decisions a practical reach beyond the capital."
 AOEIW20_QIN_strive_survival:0 "The Northern Court in Crisis"
 AOEIW20_QIN_strive_survival_desc:0 "The Qing court must keep its northern administration functioning while the United Front challenges its authority."
 AOEIW20_QIN_hold_beijing:0 "Defensive Stores for Beijing"
 AOEIW20_QIN_hold_beijing_desc:0 "Fortify Beijing only while it remains under our control; the order cannot improve an enemy-held capital."
 AOEIW20_QIN_banner_armies:0 "Audit the Banner Rolls"
 AOEIW20_QIN_banner_armies_desc:0 "Pay rolls contain men who no longer serve. Reorganising the surviving formations is safer than calling imaginary armies into existence."
 AOEIW20_QIN_northern_arsenals:0 "The Northern Arsenal Board"
 AOEIW20_QIN_northern_arsenals_desc:0 "The army needs a controlled arsenal, not a decree building factories in a province already lost."
 AOEIW_FRONTIER_MAN_rail:0 "The Mukden Railway Ledger"
 AOEIW_FRONTIER_MAN_rail_desc:0 "Separate military trains, civilian freight and concession traffic before the rail system locks up."
 AOEIW_FRONTIER_MAN_coal:0 "Fushun Coal Contracts"
 AOEIW_FRONTIER_MAN_coal_desc:0 "Mining contracts will fund repairs and supplies without pledging another province as collateral."
 AOEIW_FRONTIER_MAN_repair:0 "Railway Repair Brigades"
 AOEIW_FRONTIER_MAN_repair_desc:0 "Damaged rolling stock must return to service quickly if the northern army is to hold a coherent front."
 AOEIW_FRONTIER_MAN_cadets:0 "A Northern Cadet School"
 AOEIW_FRONTIER_MAN_cadets_desc:0 "Promotion through a common school can bridge the divide between court officers and railway security commands."
 AOEIW_FRONTIER_MAN_garrison_spirit:0 "Railway City Garrisons"
 AOEIW_FRONTIER_MAN_garrison_spirit_desc:0 "Prepared city commands anchor the defensive line."
 AOEIW_FRONTIER_MAN_garrison:0 "Hold the Railway Cities"
 AOEIW_FRONTIER_MAN_garrison_desc:0 "Concentrating the army on rail junctions trades freedom of movement for a dependable defensive system."
 AOEIW_FRONTIER_MAN_mobile_spirit:0 "Mobile Banner Reserve"
 AOEIW_FRONTIER_MAN_mobile_spirit_desc:0 "A mobile reserve restores cohesion after a breakthrough."
 AOEIW_FRONTIER_MAN_mobile:0 "A Mobile Banner Reserve"
 AOEIW_FRONTIER_MAN_mobile_desc:0 "Reserve units will counter breaches along the railway instead of distributing every battalion among fixed posts."
 AOEIW_FRONTIER_MAN_staff:0 "One Northern General Staff"
 AOEIW_FRONTIER_MAN_staff_desc:0 "Whichever doctrine prevails, railway police and field armies must report to a common operations room."
 AOEIW_FRONTIER_MAN_court:0 "The Court and the Municipalities"
 AOEIW_FRONTIER_MAN_court_desc:0 "Municipal officials can secure taxes and food more effectively than another emergency proclamation from the palace."
 AOEIW_FRONTIER_MAN_municipal_spirit:0 "Municipal Supply Guarantees"
 AOEIW_FRONTIER_MAN_municipal_spirit_desc:0 "Predictable local revenue sustains civilian production."
 AOEIW_FRONTIER_MAN_municipal:0 "Municipal Revenue Guarantees"
 AOEIW_FRONTIER_MAN_municipal_desc:0 "Leave a defined share of revenue with the towns in exchange for regular army supply contracts."
 AOEIW_FRONTIER_MAN_emergency_spirit:0 "Emergency Arsenal Contracts"
 AOEIW_FRONTIER_MAN_emergency_spirit_desc:0 "Emergency contracts divert civilian capacity."
 AOEIW_FRONTIER_MAN_emergency:0 "The Emergency Procurement Office"
 AOEIW_FRONTIER_MAN_emergency_desc:0 "Military contracts take precedence over civilian work. The arsenals gain output at the cost of local confidence."
 AOEIW_FRONTIER_MAN_granaries:0 "Protect the Winter Granaries"
 AOEIW_FRONTIER_MAN_granaries_desc:0 "Winter stocks must remain accountable to the revenue settlement, regardless of which faction controls procurement."
 AOEIW_FRONTIER_MAN_signals:0 "Signals Along the Main Line"
 AOEIW_FRONTIER_MAN_signals_desc:0 "A common signalling service will connect city garrisons, mobile reserves and railway dispatchers."
 AOEIW_FRONTIER_MAN_air:0 "Mukden Reconnaissance Flights"
 AOEIW_FRONTIER_MAN_air_desc:0 "Air observation will locate broken lines and advancing columns before headquarters commits its reserve."
 AOEIW_FRONTIER_MAN_medical_spirit:0 "Northern Evacuation Trains"
 AOEIW_FRONTIER_MAN_medical_spirit_desc:0 "Scheduled evacuation preserves trained manpower."
 AOEIW_FRONTIER_MAN_medical:0 "Evacuation Trains"
 AOEIW_FRONTIER_MAN_medical_desc:0 "Returning wounded soldiers and damaged equipment needs reserved train paths, not improvised wagons after every battle."
 AOEIW_FRONTIER_MAN_settlement:0 "The Manchurian Settlement"
 AOEIW_FRONTIER_MAN_settlement_desc:0 "Defeat has reduced the court to a Manchurian remnant under Japanese supervision. Its next policy must begin with that reality, not another free reconquest."
 AOEIW_FRONTIER_MAN_credit:0 "Accept Supervised Reconstruction Credit"
 AOEIW_FRONTIER_MAN_credit_desc:0 "Japanese credit can rebuild an arsenal quickly, but binds procurement to the protector. No territory changes hands."
 AOEIW_FRONTIER_MAN_autonomy:0 "The Municipal Reconstruction Fund"
 AOEIW_FRONTIER_MAN_autonomy_desc:0 "Retained municipal revenues rebuild civilian workshops without asking for another supervised military loan."
 AOEIW_FRONTIER_MAN_commission:0 "A Permanent Armistice Commission"
 AOEIW_FRONTIER_MAN_commission_desc:0 "Establish a channel to the United Front for missing persons and border incidents. Acceptance is a diplomatic decision, not a forced peace or alliance."
 AOEIW_FRONTIER_MAN_standards:0 "Manchurian Workshop Standards"
 AOEIW_FRONTIER_MAN_standards_desc:0 "A reduced state cannot stock every pattern of imported machine. Common standards will let fewer workshops support more units."
 AOEIW_FRONTIER_MAN_recovery_spirit:0 "Manchurian Reconstruction Service"
 AOEIW_FRONTIER_MAN_recovery_spirit_desc:0 "A reduced administration concentrates on rebuilding."
 AOEIW_FRONTIER_MAN_recovery:0 "A Viable Northern State"
 AOEIW_FRONTIER_MAN_recovery_desc:0 "The court has exchanged dreams of instant restoration for revenue, transport and a trained administration that can survive the next crisis."
 AOEIW_FRONTIER_QIN_council:0 "Convene the Qing Opposition Council"
 AOEIW_FRONTIER_QIN_council_desc:0 "An opposition administration must prove that it represents more than an alternative court faction. Its authority begins in the territory it actually governs."
 AOEIW_FRONTIER_QIN_assembly_spirit:0 "Provincial Assembly Compact"
 AOEIW_FRONTIER_QIN_assembly_spirit_desc:0 "Accountable taxation supports consent."
 AOEIW_FRONTIER_QIN_assembly:0 "Petition for a Provincial Assembly"
 AOEIW_FRONTIER_QIN_assembly_desc:0 "Provincial notables will accept taxation if they can inspect its accounts and constrain the executive."
 AOEIW_FRONTIER_QIN_command_spirit:0 "Banner Command Directorate"
 AOEIW_FRONTIER_QIN_command_spirit_desc:0 "Command centralisation accelerates military preparation."
 AOEIW_FRONTIER_QIN_command:0 "A Banner Command Directorate"
 AOEIW_FRONTIER_QIN_command_desc:0 "The officer faction demands unity of command first. Rapid mobilisation will come with a narrower political settlement."
 AOEIW_FRONTIER_QIN_accounts:0 "Publish the Provincial Accounts"
 AOEIW_FRONTIER_QIN_accounts_desc:0 "Auditors will distinguish regular taxes from private collections made in the dynasty's name."
 AOEIW_FRONTIER_QIN_charter:0 "A Charter for the Municipalities"
 AOEIW_FRONTIER_QIN_charter_desc:0 "Town councils will retain the funds needed to keep markets open during military requisitions."
 AOEIW_FRONTIER_QIN_rolls:0 "Verify the Banner Muster Rolls"
 AOEIW_FRONTIER_QIN_rolls_desc:0 "The directorate will count trained men and serviceable rifles before promising another offensive."
 AOEIW_FRONTIER_QIN_school:0 "A Directorate Staff School"
 AOEIW_FRONTIER_QIN_school_desc:0 "A small professional staff must replace rival personal orders from competing commanders."
 AOEIW_FRONTIER_QIN_compact:0 "Ratify the Governing Compact"
 AOEIW_FRONTIER_QIN_compact_desc:0 "An assembly mandate or a military directorate must now provide one enforceable set of provincial rules."
 AOEIW_FRONTIER_QIN_granary:0 "Restore the Granary Registers"
 AOEIW_FRONTIER_QIN_granary_desc:0 "Knowing where grain is stored prevents competing garrisons from requisitioning the same harvest twice."
 AOEIW_FRONTIER_QIN_workshop:0 "Provincial Machine Shops"
 AOEIW_FRONTIER_QIN_workshop_desc:0 "Local machine shops will service mills and transport before the army requisitions every skilled worker."
 AOEIW_FRONTIER_QIN_rifles:0 "Refurbish the Provincial Rifles"
 AOEIW_FRONTIER_QIN_rifles_desc:0 "Weapons from several arsenals need inspection and repair before they can equip coherent formations."
 AOEIW_FRONTIER_QIN_signals:0 "Civil and Military Telegraphs"
 AOEIW_FRONTIER_QIN_signals_desc:0 "A common telegraph register will give the government a picture of the province beyond its capital."
 AOEIW_FRONTIER_QIN_foreign:0 "Define Our Position in the Civil War"
 AOEIW_FRONTIER_QIN_foreign_desc:0 "The United Front may be an enemy of the court without being an enemy of every provincial administration. The council must choose its terms."
 AOEIW_FRONTIER_QIN_rail:0 "Connect Grain and Garrison Depots"
 AOEIW_FRONTIER_QIN_rail_desc:0 "A single transport schedule will connect stored grain to units that actually need it."
 AOEIW_FRONTIER_QIN_arsenal:0 "A Standard Provincial Arsenal"
 AOEIW_FRONTIER_QIN_arsenal_desc:0 "Concentrate repairs and ammunition production in one accountable arsenal board."
 AOEIW_FRONTIER_QIN_defence_spirit:0 "Provincial Defence Districts"
 AOEIW_FRONTIER_QIN_defence_spirit_desc:0 "Prepared defence protects provincial administration."
 AOEIW_FRONTIER_QIN_defence:0 "Defend the Provincial Seats"
 AOEIW_FRONTIER_QIN_defence_desc:0 "The army can protect administrative centres with prepared positions and local reserves."
 AOEIW_FRONTIER_QIN_field_spirit:0 "Provincial Field Reserve"
 AOEIW_FRONTIER_QIN_field_spirit_desc:0 "A trained reserve can move between threatened districts."
 AOEIW_FRONTIER_QIN_field:0 "A Unified Field Reserve"
 AOEIW_FRONTIER_QIN_field_desc:0 "A central reserve can respond beyond provincial boundaries, provided its officers share a common chain of command."
 AOEIW_FRONTIER_QIN_liaison:0 "Offer Talks to the United Front"
 AOEIW_FRONTIER_QIN_liaison_desc:0 "Dispatch delegates to discuss civilian access and prisoners. The recipient may refuse, and no provinces or alliances are granted automatically."
 AOEIW_FRONTIER_QIN_isolation:0 "Keep the Provincial Gates Closed"
 AOEIW_FRONTIER_QIN_isolation_desc:0 "The council will preserve its own food supply and decline formal cooperation with the competing coalition."
 AOEIW_FRONTIER_QIN_observers:0 "Train Telegraph and Air Observers"
 AOEIW_FRONTIER_QIN_observers_desc:0 "Observation reports must reach the staff in time to be useful, whether sent by wire or brought back by aircraft."
 AOEIW_FRONTIER_QIN_service:0 "The Provincial Supply Service"
 AOEIW_FRONTIER_QIN_service_desc:0 "Transport standards will let civilian repair crews service army vehicles without a separate stock of every part."
 AOEIW_FRONTIER_QIN_relief:0 "A Civilian Relief Administration"
 AOEIW_FRONTIER_QIN_relief_desc:0 "The foreign-policy choice still leaves refugees and damaged towns to be administered. Reopen markets under recorded rules."
 AOEIW_FRONTIER_QIN_institute:0 "The Provincial Technical Institute"
 AOEIW_FRONTIER_QIN_institute_desc:0 "Link telegraph training with workshop apprenticeships so that research produces maintainable machinery."
 AOEIW_FRONTIER_QIN_government:0 "An Administration Beyond the Court"
 AOEIW_FRONTIER_QIN_government_desc:0 "The opposition can now demonstrate an institutional alternative through taxes, workshops and public service rather than dynastic declarations alone."
 AOEIW_FRONTIER_XIC_conference:0 "The Xi’an Military Conference"
 AOEIW_FRONTIER_XIC_conference_desc:0 "Officers, merchants and provincial administrators meet over a map of the passes. The city cannot ignore the war spreading eastward."
 AOEIW_FRONTIER_XIC_officers_spirit:0 "Xi’an Defence Council"
 AOEIW_FRONTIER_XIC_officers_spirit_desc:0 "A provincial council coordinates military preparation."
 AOEIW_FRONTIER_XIC_officers:0 "The Provincial Defence Council"
 AOEIW_FRONTIER_XIC_officers_desc:0 "Put the officer corps in charge of immediate preparation while reserving civil administration to provincial offices."
 AOEIW_FRONTIER_XIC_civic_spirit:0 "Xi’an Civic Coalition"
 AOEIW_FRONTIER_XIC_civic_spirit_desc:0 "Public accounts sustain cooperation with the merchants."
 AOEIW_FRONTIER_XIC_civic:0 "A Civic Revenue Coalition"
 AOEIW_FRONTIER_XIC_civic_desc:0 "Merchants and district officials will finance emergency preparation only under public accounts and regular requisition limits."
 AOEIW_FRONTIER_XIC_drill:0 "Drill the Pass Garrisons"
 AOEIW_FRONTIER_XIC_drill_desc:0 "Garrisons must practise withdrawal and reinforcement as well as defending fixed positions."
 AOEIW_FRONTIER_XIC_staff:0 "Map the Mountain Approaches"
 AOEIW_FRONTIER_XIC_staff_desc:0 "A single operations map must replace the conflicting route books held by each commander."
 AOEIW_FRONTIER_XIC_markets:0 "Reopen the Grain Markets"
 AOEIW_FRONTIER_XIC_markets_desc:0 "Regular grain contracts will reduce the need for unpredictable military collections."
 AOEIW_FRONTIER_XIC_credit:0 "The Xi’an Reconstruction Bank"
 AOEIW_FRONTIER_XIC_credit_desc:0 "Pool merchant credit for workshops and local transport, with accounts reviewed by the coalition."
 AOEIW_FRONTIER_XIC_settlement:0 "The Provincial Service Settlement"
 AOEIW_FRONTIER_XIC_settlement_desc:0 "The chosen coalition must now coordinate military movement and civilian supplies through one service office."
 AOEIW_FRONTIER_XIC_roads:0 "The Roads through the Loess Country"
 AOEIW_FRONTIER_XIC_roads_desc:0 "Road repairs will connect district depots before seasonal damage cuts them off."
 AOEIW_FRONTIER_XIC_workshop:0 "The Xi’an Machine Cooperative"
 AOEIW_FRONTIER_XIC_workshop_desc:0 "Small repair shops can pool tools without waiting for a grand industrial complex."
 AOEIW_FRONTIER_XIC_passes_spirit:0 "Xi’an Pass Commands"
 AOEIW_FRONTIER_XIC_passes_spirit_desc:0 "Prepared approaches improve defensive endurance."
 AOEIW_FRONTIER_XIC_passes:0 "The Pass Defence System"
 AOEIW_FRONTIER_XIC_passes_desc:0 "Prepared positions and local guides favour defending the approaches rather than racing across the plains."
 AOEIW_FRONTIER_XIC_reserve_spirit:0 "Xi’an Manoeuvre Reserve"
 AOEIW_FRONTIER_XIC_reserve_spirit_desc:0 "Trained reserve formations recover and redeploy quickly."
 AOEIW_FRONTIER_XIC_reserve:0 "A Provincial Manoeuvre Reserve"
 AOEIW_FRONTIER_XIC_reserve_desc:0 "A mobile reserve can support neighbouring fronts without abandoning the provincial army’s own command structure."
 AOEIW_FRONTIER_XIC_envoys:0 "Envoys to the Chinese Council"
 AOEIW_FRONTIER_XIC_envoys_desc:0 "The United Front needs cooperation in the northwest. Xi’an can offer supplies without surrendering its provincial administration."
 AOEIW_FRONTIER_XIC_depots:0 "District Ammunition Stores"
 AOEIW_FRONTIER_XIC_depots_desc:0 "Keeping ammunition near the passes reduces the transport burden when the roads are damaged."
 AOEIW_FRONTIER_XIC_arsenal:0 "The Provincial Small-Arms Line"
 AOEIW_FRONTIER_XIC_arsenal_desc:0 "The cooperative can now support a supervised rifle and ammunition line."
 AOEIW_FRONTIER_XIC_commission:0 "The Joint Defence Commission"
 AOEIW_FRONTIER_XIC_commission_desc:0 "Supply depots and whichever doctrine was chosen now need common reporting standards."
 AOEIW_FRONTIER_XIC_aid:0 "Offer a Rifle Mission"
 AOEIW_FRONTIER_XIC_aid_desc:0 "Ask the United Front to accept an accountable rifle delivery. Its council may decline, and the transfer costs actual weapons."
 AOEIW_FRONTIER_XIC_mediation:0 "Civilian Passage Negotiations"
 AOEIW_FRONTIER_XIC_mediation_desc:0 "Offer talks on refugee passage and prisoners instead of an arms mission. These talks do not impose a ceasefire on either side."
 AOEIW_FRONTIER_XIC_relief:0 "The Refugee Relief Office"
 AOEIW_FRONTIER_XIC_relief_desc:0 "War on the eastern roads has displaced families and disrupted grain markets. A permanent office will account for shelter and deliveries."
 AOEIW_FRONTIER_XIC_airfield:0 "A Landing Ground behind the Passes"
 AOEIW_FRONTIER_XIC_airfield_desc:0 "An observation detachment needs a reliable landing ground sheltered behind the provincial approaches."
 AOEIW_FRONTIER_XIC_signals:0 "The Northwest Signals School"
 AOEIW_FRONTIER_XIC_signals_desc:0 "Train operators to connect district commands, observers and the relief office on a common network."
 AOEIW_FRONTIER_XIC_repair:0 "Mountain Transport Repair Teams"
 AOEIW_FRONTIER_XIC_repair_desc:0 "A repair service shared by the depots and arsenals keeps scarce vehicles in operation."
 AOEIW_FRONTIER_XIC_institute:0 "The Northwest Technical College"
 AOEIW_FRONTIER_XIC_institute_desc:0 "The repair teams and signals instructors can become the nucleus of a permanent technical college."
 AOEIW_FRONTIER_XIC_province:0 "Xi’an Holds Its Own"
 AOEIW_FRONTIER_XIC_province_desc:0 "A functioning provincial state can cooperate with its neighbours while keeping its own administration, workshops and defence command."
 AOEIW_frontier_contacts:0 "Chinese Frontier Missions"
 AOEIW_frontier_MON_aid:0 "Offer 500 Rifles to the United Front"
 AOEIW_frontier_MON_aid_desc:0 "Costs 35 political power. On acceptance, 500 available rifles are transferred and we gain 10 army experience. A refusal transfers nothing. The offer can be sent once."
 aoeiw_frontier.1.t:0 "A Mission from Mongolia"
 aoeiw_frontier.1.d:0 "Delegates from Ulaanbaatar offer a delivery of 500 rifles. Accepting practical assistance need not compromise the United Front’s independence."
 AOEIW_frontier_XIC_aid:0 "Offer 500 Rifles to the United Front"
 AOEIW_frontier_XIC_aid_desc:0 "Costs 35 political power. On acceptance, 500 available rifles are transferred and we gain 10 army experience. A refusal transfers nothing. The offer can be sent once."
 aoeiw_frontier.2.t:0 "A Mission from Xi’an"
 aoeiw_frontier.2.d:0 "Delegates from Xi’an offer a delivery of 500 rifles. Accepting practical assistance need not compromise the United Front’s independence."
 AOEIW_frontier_QIN_liaison:0 "Offer a Civilian Liaison Mission"
 AOEIW_frontier_QIN_liaison_desc:0 "Costs 35 political power. If both administrations agree, each gains 3% stability. No war ends and no territory changes hands. The offer can be sent once."
 aoeiw_frontier.3.t:0 "A Mission from the Qing Opposition"
 aoeiw_frontier.3.d:0 "Delegates from the Qing opposition council offer a standing office for civilian passage and border incidents. The arrangement would ease administrative tensions without changing the military situation."
 AOEIW_frontier_MAN_liaison:0 "Offer a Civilian Liaison Mission"
 AOEIW_frontier_MAN_liaison_desc:0 "Costs 35 political power. If both administrations agree, each gains 3% stability. No war ends and no territory changes hands. The offer can be sent once."
 aoeiw_frontier.4.t:0 "A Mission from Manchuria"
 aoeiw_frontier.4.d:0 "Delegates from the Manchurian administration offer a standing office for civilian passage and border incidents. The arrangement would ease administrative tensions without changing the military situation."
 AOEIW_frontier_XIC_liaison:0 "Offer a Civilian Liaison Mission"
