l_english:
 AOEIW38_EUROPE_regional_reckoning_category:0 "Europe Under Strain"
 AOEIW38_EUROPE_regional_reckoning_category_desc:0 "The continental crisis has reached ministries, ports, border posts, and colonial administrations. Plans made here will shape whether the state survives defeat and what kind of peace follows victory."

 AOEIW38_EUROPE_convene_national_war_cabinet:0 "Convene the National War Cabinet"
 AOEIW38_EUROPE_convene_national_war_cabinet_desc:0 "Bring the civil service, general staff, and economic ministries into one room and settle the strategic problem that will define the coming war."
 AOEIW38_EUROPE_low_countries_staff_convention:0 "The Meuse–Scheldt Staff Convention"
 AOEIW38_EUROPE_low_countries_staff_convention_desc:0 "Invite our neighbor to exchange mobilization timetables, refugee plans, and demolition schedules before the frontier closes."
 AOEIW38_EUROPE_northern_transit_conference:0 "Convene the Northern Transit Conference"
 AOEIW38_EUROPE_northern_transit_conference_desc:0 "The northern states must decide how merchant traffic, volunteers, refugees, and military cargo will cross waters that neutrality may no longer protect."
 AOEIW38_EUROPE_balkan_frontier_conference:0 "Convene the Balkan Frontier Conference"
 AOEIW38_EUROPE_balkan_frontier_conference_desc:0 "The peninsula's disputed frontiers cannot be wished away. A staff convention may at least keep mobilization from turning every old grievance into a new war."
 AOEIW38_EUROPE_neutral_relief_channel:0 "Open a Neutral Relief Channel"
 AOEIW38_EUROPE_neutral_relief_channel_desc:0 "Coordinate shipping lists, protected communications, and relief offices with the remaining neutral states."
 AOEIW38_EUROPE_activate_continuity_districts:0 "Activate the Continuity Districts"
 AOEIW38_EUROPE_activate_continuity_districts_desc:0 "Issue sealed succession orders, disperse duplicate records, and authorize district commands to operate if Warsaw loses contact with the field armies."
 AOEIW38_EUROPE_negotiate_imperial_war_charter:0 "Negotiate an Imperial War Charter"
 AOEIW38_EUROPE_negotiate_imperial_war_charter_desc:0 "The overseas administrations will be asked to sustain a common war effort. In return, they will receive a written voice in supply and defense policy."
 AOEIW38_EUROPE_restore_the_public_authority:0 "Restore the Public Authority"
 AOEIW38_EUROPE_restore_the_public_authority_desc:0 "Reopen the courts, recall the civil service, and turn the exile network into a legitimate reconstruction government."
 AOEIW38_EUROPE_settle_the_wartime_accounts:0 "Settle the Wartime Accounts"
 AOEIW38_EUROPE_settle_the_wartime_accounts_desc:0 "Convert emergency boards and foreign promises into a funded reconstruction settlement before wartime unity dissolves into recrimination."

 AOEIW38_EUROPE_BEL_albert_canal_command:0 "Albert Canal Command"
 AOEIW38_EUROPE_BEL_albert_canal_command_desc:0 "Engineers, fortress troops, and railway officers share a single timetable for holding the canal line and keeping Antwerp supplied."
 AOEIW38_EUROPE_BUL_revision_commission:0 "The National Revision Commission"
 AOEIW38_EUROPE_BUL_revision_commission_desc:0 "Sofia has turned revisionism into state policy, balancing territorial claims against the danger of another encirclement."
 AOEIW38_EUROPE_DEN_belts_watch:0 "The Belts Watch"
 AOEIW38_EUROPE_DEN_belts_watch_desc:0 "Coast watchers, pilots, and naval patrols guard the narrow passages on which Danish sovereignty depends."
 AOEIW38_EUROPE_FIN_motti_supply:0 "Motti Supply Columns"
 AOEIW38_EUROPE_FIN_motti_supply_desc:0 "Light columns disperse food, ammunition, and field workshops through the forests so isolated formations can keep fighting."
 AOEIW38_EUROPE_GRE_pindus_lifeline:0 "The Pindus Lifeline"
 AOEIW38_EUROPE_GRE_pindus_lifeline_desc:0 "Mountain roads, pack depots, and local guides bind the northern front to the ports and arsenals of the south."
 AOEIW38_EUROPE_HOL_archipelago_lifeline:0 "The Archipelago Lifeline"
 AOEIW38_EUROPE_HOL_archipelago_lifeline_desc:0 "The merchant marine and colonial depots are organized as one supply system able to function even if the European homeland falls."
 AOEIW38_EUROPE_IRE_emergency_neutrality:0 "Emergency Neutrality"
 AOEIW38_EUROPE_IRE_emergency_neutrality_desc:0 "Censorship, coastal observation, and quiet security cooperation protect sovereignty without publicly abandoning neutrality."
 AOEIW38_EUROPE_NOR_merchant_fleet_board:0 "Nortraship War Board"
 AOEIW38_EUROPE_NOR_merchant_fleet_board_desc:0 "Norway's dispersed merchant fleet answers to a single board that can reroute tonnage, crews, and repair work at a moment's notice."
 AOEIW38_EUROPE_POL_continuity_state:0 "The Continuity State"
 AOEIW38_EUROPE_POL_continuity_state_desc:0 "Couriers, duplicate ministries, and underground military districts ensure that occupation cannot extinguish Polish authority."
 AOEIW38_EUROPE_POR_atlantic_chain:0 "The Atlantic Chain"
 AOEIW38_EUROPE_POR_atlantic_chain_desc:0 "Lisbon, the islands, and overseas ports form a guarded chain of anchorages across the ocean."
 AOEIW38_EUROPE_ROM_oil_frontier_board:0 "Oil Frontier Board"
 AOEIW38_EUROPE_ROM_oil_frontier_board_desc:0 "The Ploiești fields, frontier railways, and army fuel reserves are administered as one strategic system."
 AOEIW38_EUROPE_SWE_armed_trade:0 "Armed Trade Policy"
 AOEIW38_EUROPE_SWE_armed_trade_desc:0 "Export contracts now carry escort plans, stockpile clauses, and the industrial safeguards needed to preserve Swedish freedom of action."
 AOEIW38_EUROPE_SWI_national_redoubt:0 "The National Redoubt"
 AOEIW38_EUROPE_SWI_national_redoubt_desc:0 "Mountain fortresses and concealed depots make clear that invading Switzerland would be costly even after the frontier cities fell."
 AOEIW38_EUROPE_YUG_federal_defence_councils:0 "Federal Defence Councils"
 AOEIW38_EUROPE_YUG_federal_defence_councils_desc:0 "Regional commanders and civil authorities receive defined responsibilities, tying the kingdom's divided institutions to a common defense plan."
 AOEIW38_EUROPE_civil_resilience:0 "Civil Resilience Programme"
 AOEIW38_EUROPE_civil_resilience_desc:0 "Municipal shelters, repair parties, and ration offices keep the rear functioning under sustained pressure."
 AOEIW38_EUROPE_operational_readiness:0 "Operational Readiness Programme"
 AOEIW38_EUROPE_operational_readiness_desc:0 "Mobilization exercises now test rail movements, reserve call-ups, and command handovers under wartime conditions."
 AOEIW38_EUROPE_regional_staff_links:0 "Regional Staff Links"
 AOEIW38_EUROPE_regional_staff_links_desc:0 "Direct liaison channels allow neighboring staffs to compare intelligence and avoid working at cross-purposes."
 AOEIW38_EUROPE_government_in_exile_network:0 "Government-in-Exile Network"
 AOEIW38_EUROPE_government_in_exile_network_desc:0 "Diplomats, clandestine officials, and military missions preserve a thread of legal authority while the homeland is occupied."
 AOEIW38_EUROPE_restored_mandate:0 "A Restored Public Mandate"
 AOEIW38_EUROPE_restored_mandate_desc:0 "Liberation has returned authority to the state, but its legitimacy now rests on reconstruction and an honest accounting of wartime sacrifice."
 AOEIW38_EUROPE_imperial_war_charter:0 "Imperial War Charter"
 AOEIW38_EUROPE_imperial_war_charter_desc:0 "A written division of shipping, defense, and supply responsibilities gives overseas administrations a stake in the common war effort."
 AOEIW38_EUROPE_reconstruction_dividend:0 "The Reconstruction Dividend"
 AOEIW38_EUROPE_reconstruction_dividend_desc:0 "Emergency institutions have become a practical programme of repaired infrastructure, productive investment, and political recovery."

 AOEIW38_europe.1.t:0 "The Cabinet Chooses Its Priority"
 AOEIW38_europe.1.BEL.d:0 "The canal line can delay an invasion, but only if Antwerp, Liège, and the railway commands follow one plan. The cabinet must choose whether its first effort protects the population or sharpens mobilization."
 AOEIW38_europe.1.BUL.d:0 "Every frontier memorandum carries the shadow of Neuilly. The cabinet has made revision a programme; it must now decide whether patience at home or readiness at the border comes first."
 AOEIW38_europe.1.DEN.d:0 "The Belts are both Denmark's shield and its vulnerability. Naval officers warn that control of the crossings will be decided before a formal declaration can reach Copenhagen."
 AOEIW38_europe.1.FIN.d:0 "Finland cannot match a great power division for division. It can, however, keep small formations supplied, mobile, and dangerous long after an invader expects resistance to collapse."
 AOEIW38_europe.1.GRE.d:0 "The Pindus roads will decide whether troops in Epirus receive shells and food before the weather closes the passes. Civil and military engineers now compete for the same scarce crews."
 AOEIW38_europe.1.HOL.d:0 "The kingdom spans seas that an enemy may sever. Ministers must prepare the merchant fleet and colonial depots to carry Dutch authority if The Hague can no longer do so."
 AOEIW38_europe.1.IRE.d:0 "Neutrality requires more than declarations. Dublin must watch its ports, protect its communications, and decide how far quiet wartime cooperation may go."
 AOEIW38_europe.1.NOR.d:0 "Norwegian ships and crews are scattered across the world's ports. A wartime board can turn that exposure into strategic reach, provided Oslo acts before the fleet is cut off."
 AOEIW38_europe.1.POL.d:0 "The republic may have to govern while retreating, fighting abroad, or living underground. Duplicate institutions are being prepared before the first ministry is lost."
 AOEIW38_europe.1.POR.d:0 "Portugal's security rests on a chain of ports from Lisbon into the Atlantic. The cabinet must make those anchorages useful without turning them into invitations for foreign occupation."
 AOEIW38_europe.1.ROM.d:0 "The oilfields draw allies, buyers, and predators toward the same frontier. Rail guards and fuel administrators demand authority to keep the army supplied if the export system breaks."
 AOEIW38_europe.1.SWE.d:0 "Iron, bearings, and shipping buy Sweden room to maneuver, but every contract creates a new pressure. Trade policy and defense planning can no longer be kept in separate ministries."
 AOEIW38_europe.1.SWI.d:0 "The plateau cannot defend every approach forever. The redoubt plan sacrifices easy access and peacetime convenience for a defensible national core."
 AOEIW38_europe.1.YUG.d:0 "A single order from Belgrade means little unless regional commanders know who supplies, reinforces, and succeeds each formation. The new councils must turn federal friction into local resilience."
 AOEIW38_europe.1.a:0 "Protect the civil fabric first."
 AOEIW38_europe.1.b:0 "Test the mobilization plan."
 AOEIW38_europe.10.t:0 "The Ministries Leave the Capital"
 AOEIW38_europe.10.d:0 "The homeland has fallen, but sealed archives, diplomatic missions, and surviving commands still answer the government. Defeat has begun a struggle over who will speak for the nation when liberation comes."
 AOEIW38_europe.10.a:0 "The state will outlive the occupation."
 AOEIW38_europe.11.t:0 "A Neighbor Falls"
 AOEIW38_europe.11.d:0 "Refugees, soldiers, and officials from [From.GetNameDef] are reaching our frontier. Offering shelter preserves a future partner; closing the crossings buys immediate security at a lasting diplomatic cost."
 AOEIW38_europe.11.a:0 "Shelter the accredited missions."
 AOEIW38_europe.11.b:0 "Guard the frontier."
 AOEIW38_europe.20.t:0 "An Invitation from [From.GetNameDef]"
 AOEIW38_europe.20.d:0 "[From.GetNameDefCap] proposes direct staff links for transit, refugee movements, and emergency supply. The convention stops short of an alliance, but no participant can later claim complete detachment from its neighbors' fate."
 AOEIW38_europe.20.a:0 "Send a working delegation."
 AOEIW38_europe.20.b:0 "Keep our freedom of action."
 AOEIW38_europe.21.t:0 "Orders for a State Without a Capital"
 AOEIW38_europe.21.d:0 "Couriers carry sealed chains of command to every military district. If Warsaw is isolated, the republic's ministries, field commands, and underground authorities will know who speaks next and where the national record is kept."
 AOEIW38_europe.21.a:0 "No occupation will erase the republic."
 AOEIW38_europe.30.t:0 "The Imperial War Charter"
 AOEIW38_europe.30.d:0 "[From.GetNameDefCap] asks us to coordinate shipping, defense, and supply under a written wartime charter. Acceptance gives this government a formal voice and measurable autonomy; refusal preserves control at the risk of an open breach."
 AOEIW38_europe.30.a:0 "Sign in return for a voice."
 AOEIW38_europe.30.b:0 "Our resources remain under local control."
 AOEIW38_europe.31.t:0 "[From.GetNameDefCap] Signs the Charter"
 AOEIW38_europe.31.d:0 "The overseas administration has accepted shared wartime planning. Its delegates now sit on the shipping and supply boards, creating obligations that will survive the war."
 AOEIW38_europe.31.a:0 "Honor the bargain."
 AOEIW38_europe.32.t:0 "[From.GetNameDefCap] Rejects the Charter"
 AOEIW38_europe.32.d:0 "The overseas administration has refused central direction. Coercion would consume authority we can scarcely spare, but the unresolved breach will shape every later constitutional negotiation."
 AOEIW38_europe.32.a:0 "Record the refusal."
 AOEIW38_europe.40.t:0 "The Public Authority Returns"
 AOEIW38_europe.40.d:0 "Courts reopen, local councils report for duty, and returning officials unlock the wartime archives. Liberation is complete only when emergency authority becomes accountable government again."
 AOEIW38_europe.40.a:0 "Begin the national accounting."
 AOEIW38_europe.41.t:0 "Authority Returns to [From.GetNameDef]"
 AOEIW38_europe.41.d:0 "The restored government of [From.GetNameDef] asks its neighbors to recognize the ministries that survived abroad and the officials now returning home. Recognition will strengthen the regional settlement; hesitation preserves room to contest its wartime claims."
 AOEIW38_europe.41.a:0 "Recognize the restored government."
 AOEIW38_europe.41.b:0 "Reserve judgment for now."
 AOEIW38_europe.50.t:0 "The Wartime Accounts"
 AOEIW38_europe.50.d:0 "The final ledgers record destroyed bridges, exhausted districts, foreign promises, and service rendered abroad. A funded settlement now turns those obligations into visible reconstruction."
 AOEIW38_europe.50.a:0 "Build the peace that was promised."
 AOEIW38_EUROPE_charter_autonomy:0 "A voice under the Imperial War Charter"
