 AOEIW9_FIN_politics_p1_1:0 "The Whites Still Remember"
 AOEIW9_FIN_politics_p1_1_desc:0 "Veterans of 1918 warn that compromise invited the Mäntsälä challenge and will invite another. They expect the president to defend the republic they believe they won with rifles."
 AOEIW9_FIN_politics_p2_1:0 "The Parliamentary Defence Coalition"
 AOEIW9_FIN_politics_p2_1_desc:0 "Forests and scattered railheads shape Finnish defence more than parade-ground numbers. Border fortifications preserve manpower; a mobile winter force needs trained cadres and reliable depots. The Parliamentary Defence Coalition places authority in representative institutions and constitutional oversight."
 AOEIW9_FIN_politics_p3_1:0 "Greater Finland Now"
 AOEIW9_FIN_politics_p3_1_desc:0 "The activists refuse to wait for another border crisis. Their maps of Karelia become a programme of mobilisation, censorship and national expansion."
 AOEIW9_FIN_eco_civ_1:0 "The Borderlands Debate: Industrial Accounts"
 AOEIW9_FIN_eco_civ_1_desc:0 "Forests and scattered railheads shape Finnish defence more than parade-ground numbers. Border fortifications preserve manpower; a mobile winter force needs trained cadres and reliable depots. The treasury must cost both Timber Export Investment and The Tampere Arsenal Orders before choosing which investment standard to fund."
