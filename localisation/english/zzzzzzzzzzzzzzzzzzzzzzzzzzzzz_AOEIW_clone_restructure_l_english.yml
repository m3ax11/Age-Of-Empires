 AOEIW9_SWE_politics_root:0 "The 1936 Defence Act"
 AOEIW9_SWE_politics_root_desc:0 "The Riksdag must decide whether neutrality can still be defended with the forces left by the disarmament years. The vote will bind welfare, industry and military service to one national plan."
 AOEIW9_SWE_politics_p1_1:0 "The King at Drottningholm"
 AOEIW9_SWE_politics_p1_1_desc:0 "The court summons officers and conservative deputies to Drottningholm. The Crown will make itself the patron of preparedness before the cabinet can claim the issue."
 AOEIW9_SWE_politics_p2_1:0 "The Riksdag’s Social Bargain"
 AOEIW9_SWE_politics_p2_1_desc:0 "Swedish ore and engineering can sustain welfare and a credible defence, but export obligations limit rapid rearmament. Baltic security depends on the relationship between industry, coastal forces and the field army. The Riksdag’s Social Bargain places authority in representative institutions and constitutional oversight."
 AOEIW9_SWE_politics_p3_1:0 "Orders from Stockholm"
 AOEIW9_SWE_politics_p3_1_desc:0 "The mobilisation faction has tired of committee reports and party bargaining. Ministries, railways and county authorities will receive one set of orders from the capital."
 AOEIW9_SWE_eco_civ_1:0 "Guns or the Folkhem?"
 AOEIW9_SWE_eco_civ_1_desc:0 "Every krona promised to a battery competes with housing, pensions and public works. The cabinet must show that national defence and the people's home can be paid for together."
 AOEIW9_SWE_mil_army_1:0 "The General Staff Faces the Riksdag"
 AOEIW9_SWE_mil_army_1_desc:0 "Officers must defend their plans before deputies who remember the cost of the last mobilisation. Doctrine will begin with an argument over the army Sweden can actually maintain."
 AOEIW9_SWE_dip_a_1:0 "Stockholm Looks to Finland"
 AOEIW9_SWE_dip_a_1_desc:0 "Events across the Gulf can no longer be treated as somebody else's frontier problem. The cabinet will decide what Swedish neutrality permits before Helsinki asks under fire."
 AOEIW9_YUG_politics_root:0 "The South Slav Settlement"
 AOEIW9_YUG_politics_root_desc:0 "Belgrade must negotiate with the constituent regions before standardising the army. Adriatic shipyards, interior railways and divided officer networks make centralisation a practical dispute, not just a slogan."
