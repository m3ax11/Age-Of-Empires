 AOEIW9_SPR_politics_root:0 "The Government of the Spanish Empire"
 AOEIW9_SPR_politics_root_desc:0 "Madrid rules an imperial state with powerful regional claims. Metropolitan arsenals and autonomous development funds offer rival ways of keeping the empire supplied without surrendering all local initiative."
 AOEIW9_SPR_politics_p1_1:0 "The Crown and the Viceroyalties"
 AOEIW9_SPR_politics_p1_1_desc:0 "The Crown will rule through restored viceroyalties, historic fueros and loyal provincial elites. Madrid retains the final word, but accepts that an empire spread across oceans cannot be governed as a single barracks."
 AOEIW9_SPR_politics_p2_1:0 "A Representative Imperial Charter"
 AOEIW9_SPR_politics_p2_1_desc:0 "A chartered Cortes will bind crown, provinces and overseas territories to written rights and common taxation. Representation offers stability, but also gives regional blocs a permanent voice in imperial policy."
 AOEIW9_SPR_politics_p3_1:0 "The Central Imperial Directorate"
 AOEIW9_SPR_politics_p3_1_desc:0 "The officer corps and Falangist administrators reject bargaining with provinces and parties. A central directorate will mobilise Spain as one imperial state, accepting resistance as the price of command."
 AOEIW9_SPR_eco_civ_1:0 "The Government of the Spanish Empire: Industrial Accounts"
 AOEIW9_SPR_eco_civ_1_desc:0 "Madrid rules an imperial state with powerful regional claims. Metropolitan arsenals and autonomous development funds offer rival ways of keeping the empire supplied without surrendering all local initiative. The treasury must cost both Viceroyal Development Funds and Metropolitan Arsenal Priority before choosing which investment standard to fund."
