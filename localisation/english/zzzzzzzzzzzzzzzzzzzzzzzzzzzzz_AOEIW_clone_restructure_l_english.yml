 AOEIW9_FIN_mil_army_1_desc:0 "The Fortified Border Army and Winter Pursuit Detachments demand different training and reserve arrangements. The staff must prepare the alternatives before the doctrine vote."
 AOEIW9_FIN_dip_a_1:0 "The Borderlands Debate: External Commitments"
 AOEIW9_FIN_dip_a_1_desc:0 "Forests and scattered railheads shape Finnish defence more than parade-ground numbers. Border fortifications preserve manpower; a mobile winter force needs trained cadres and reliable depots. Foreign commitments must leave the supply and revenue needed to honour the domestic settlement."
