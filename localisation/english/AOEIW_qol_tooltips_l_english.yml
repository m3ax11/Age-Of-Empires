l_english:
 AOEIW_QOL_TT_POLITICAL_EVENT: "§YMajor consequence:§! an event opens immediately and presents a political choice. Its effects are displayed before you commit."
 AOEIW_QOL_TT_REVOLUTION_EVENT: "§RMajor consequence:§! advances a revolutionary event chain which can change the government, national leader and available political branch."
 AOEIW_QOL_TT_DIPLOMATIC_CONFERENCE: "§YMajor consequence:§! convenes an international conference; participating governments will answer through events."
 AOEIW_QOL_TT_ADENAUER_GOVERNMENT: "§YGovernment and leader change:§! the monarchy retires, Konrad Adenauer becomes national leader and the constitutional government is installed."
 AOEIW_QOL_TT_GER_INDUSTRIAL_LEAGUE: "§YFaction change:§! creates the Industrial Republics League if Germany is independent of another faction. Eligible Polish and Dutch partners join."
 AOEIW_QOL_TT_FRA_WORKERS_INTERNATIONAL: "§YFaction change:§! France leaves strategic isolation and founds the Workers' International."
 AOEIW_QOL_TT_ITA_WORKERS_COMPACT: "§YFaction change:§! creates the Mediterranean Workers' Compact. Eligible Romanian, Yugoslav and Bulgarian partners join."
 AOEIW_QOL_TT_SOV_REVOLUTIONARY_UNION: "§YFaction change:§! founds the Union of Revolutionary Republics if Russia is not already in a faction."

 AOEIW_QOL_TT_CHINA_DYNASTIC_CRISIS: "§RMajor consequence:§! opens the Chinese Dynastic Crisis and its competing imperial, nationalist and revolutionary settlement paths."
 AOEIW_QOL_TT_CHINA_DYNASTY_VICTORY: "§YGovernment and leader change:§! Puyi is confirmed as emperor; the dynastic crisis ends at a lasting political and economic cost."
 AOEIW_QOL_TT_CHINA_NRA_PATH: "§RMajor consequence:§! begins the National Revolutionary Army route and its civil-war mobilisation events."
 AOEIW_QOL_TT_CHINA_MAO_PATH: "§RMajor consequence:§! begins Mao's revolutionary route and its civil-war mobilisation events."
 AOEIW_QOL_TT_CHINA_SETTLEMENT: "§YPostwar settlement:§! resolves the crisis according to the victorious path and unlocks the appropriate reconstruction programme."
 AOEIW_QOL_TT_CHIANG_LEADERSHIP: "§YLeader change:§! Chiang Kai-shek takes power; China adopts the NRA identity and a centralized nationalist state. This also triggers the NRA victory super event and audio."
 AOEIW_QOL_TT_MAO_LEADERSHIP: "§YLeader and government change:§! Mao Zedong takes power; China becomes communist and adopts the revolutionary identity. This also triggers the CCP victory super event and audio."
 AOEIW_QOL_TT_COUNCIL_LEADERSHIP: "§YGovernment outcome:§! the coalition council remains in power and preserves the United Front state instead of installing Chiang or Mao."

 AOEIW_QOL_TT_RAISE_REGIONAL_ARMIES: "§YOne-time mobilisation:§! adds §G300,000§! manpower, §G15,000§! infantry equipment and §G10§! Army Experience."
 AOEIW_QOL_TT_EMERGENCY_ARSENALS: "§YImmediate construction:§! adds §G2 Military Factories§! and one shared building slot in Chongqing."
 AOEIW_QOL_TT_REVOLUTIONARY_OFFENSIVE_DECISION: "§YTimed effect — 120 days:§! activates the Final Offensive national spirit."
 AOEIW_QOL_TT_INFLUENCE_INCREASE: "Moves this power bloc §Yone influence level upward§!. Only one bloc may reach a dominant position at a time."
 AOEIW_QOL_TT_INFLUENCE_DECREASE: "Moves this power bloc §Yone influence level downward§!."
