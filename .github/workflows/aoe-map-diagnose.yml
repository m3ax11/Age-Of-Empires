name: Diagnose HOI4 map integrity

on:
  push:
    branches:
      - fix/main-menu-crash-1.19
    paths:
      - .github/workflows/aoe-map-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-menu-crash-1.19
      - name: Fetch current RT56 reference
        run: git clone --depth 1 --branch Beta-Edits https://github.com/deliciousmods/1956_beta.git /tmp/rt56
      - name: Check map/state/region integrity
        shell: python
        run: |
          from pathlib import Path
          from collections import defaultdict
          import csv, hashlib, re

          root = Path('.')
          rt = Path('/tmp/rt56')

          def clean(s):
              return re.sub(r'#.*', '', s)

          def parse_definition(base):
              ids, colors, kinds = {}, defaultdict(list), {}
              with (base/'map/definition.csv').open(encoding='utf-8-sig', errors='replace', newline='') as f:
                  for n,row in enumerate(csv.reader(f, delimiter=';'),1):
                      if not row or len(row) < 5:
                          continue
                      try:
                          pid = int(row[0]); rgb = tuple(map(int,row[1:4]))
                      except ValueError:
                          continue
                      ids[pid] = (rgb,row,n)
                      colors[rgb].append(pid)
                      kinds[pid] = row[4].strip().lower()
              return ids, colors, kinds

          def block_value(text, key):
              m = re.search(rf'\b{re.escape(key)}\s*=\s*\{{([^}}]*)\}}', clean(text), re.S)
              return [int(x) for x in re.findall(r'\b\d+\b', m.group(1))] if m else []

          def scalar(text, key):
              m = re.search(rf'\b{re.escape(key)}\s*=\s*(\d+)', clean(text))
              return int(m.group(1)) if m else None

          def parse_named(base, folder, root_key):
              ids = defaultdict(list); prov_to_files = defaultdict(list); missing_id=[]
              for p in sorted((base/folder).glob('*.txt')):
                  text = p.read_text(encoding='utf-8-sig', errors='replace')
                  ident = scalar(text,'id')
                  if ident is None:
                      missing_id.append(str(p))
                  else:
                      ids[ident].append(p.name)
                  for prov in block_value(text,'provinces'):
                      prov_to_files[prov].append(p.name)
              return ids, prov_to_files, missing_id

          def digest(p):
              return hashlib.sha1(p.read_bytes()).hexdigest()

          defs, colors, kinds = parse_definition(root)
          rt_defs, rt_colors, rt_kinds = parse_definition(rt)
          states, state_provs, state_noid = parse_named(root,'history/states','state')
          regs, reg_provs, reg_noid = parse_named(root,'map/strategicregions','strategic_region')
          rt_states, rt_state_provs, _ = parse_named(rt,'history/states','state')
          rt_regs, rt_reg_provs, _ = parse_named(rt,'map/strategicregions','strategic_region')

          dup_def_colors = {c:v for c,v in colors.items() if len(v)>1 and c != (0,0,0)}
          dup_state_ids = {i:v for i,v in states.items() if len(v)>1}
          dup_reg_ids = {i:v for i,v in regs.items() if len(v)>1}
          unknown_state_provs = sorted(set(state_provs)-set(defs))
          unknown_reg_provs = sorted(set(reg_provs)-set(defs))
          multi_state = {p:v for p,v in state_provs.items() if len(v)>1}
          multi_reg = {p:v for p,v in reg_provs.items() if len(v)>1}
          land = {p for p,k in kinds.items() if k == 'land'}
          missing_land_state = sorted(land-set(state_provs))
          non_lake = {p for p,k in kinds.items() if k != 'lake'}
          missing_region = sorted(non_lake-set(reg_provs))

          print('=== AOE MAP COUNTS ===')
          print('definition', len(defs), 'max', max(defs) if defs else None)
          print('states', len(states), 'state province refs', len(state_provs))
          print('regions', len(regs), 'region province refs', len(reg_provs))
          print('=== RT56 COUNTS ===')
          print('definition', len(rt_defs), 'max', max(rt_defs) if rt_defs else None)
          print('states', len(rt_states), 'state province refs', len(rt_state_provs))
          print('regions', len(rt_regs), 'region province refs', len(rt_reg_provs))

          checks = {
              'duplicate definition colors': dup_def_colors,
              'state files without id': state_noid,
              'region files without id': reg_noid,
              'duplicate state ids': dup_state_ids,
              'duplicate region ids': dup_reg_ids,
              'state refs unknown provinces': unknown_state_provs,
              'region refs unknown provinces': unknown_reg_provs,
              'provinces in multiple states': multi_state,
              'provinces in multiple regions': multi_reg,
              'land provinces missing state': missing_land_state,
              'non-lake provinces missing region': missing_region,
          }
          print('=== STRUCTURAL FINDINGS ===')
          for name,val in checks.items():
              n = len(val)
              sample = list(val.items())[:12] if isinstance(val,dict) else list(val)[:20]
              print(f'{name}: {n} sample={sample}')

          print('=== TOP-LEVEL MAP DIFFERENCES VS CURRENT RT56 ===')
          ours = {p.name:p for p in (root/'map').iterdir() if p.is_file()}
          theirs = {p.name:p for p in (rt/'map').iterdir() if p.is_file()}
          names = sorted(set(ours)|set(theirs))
          diffs=[]
          for name in names:
              if name not in ours or name not in theirs or digest(ours[name]) != digest(theirs[name]):
                  diffs.append(name)
          print('different files:', len(diffs), diffs)

          ours_sr={p.name:digest(p) for p in (root/'map/strategicregions').glob('*.txt')}
          rt_sr={p.name:digest(p) for p in (rt/'map/strategicregions').glob('*.txt')}
          sr_names=set(ours_sr)|set(rt_sr)
          sr_diff=sorted(n for n in sr_names if ours_sr.get(n)!=rt_sr.get(n))
          print('strategic region file counts:', len(ours_sr), len(rt_sr))
          print('strategic region differences:', len(sr_diff), 'sample=', sr_diff[:30])

          severe = sum(len(x) for x in [state_noid,reg_noid,dup_state_ids,dup_reg_ids,unknown_state_provs,unknown_reg_provs,multi_state,multi_reg,missing_land_state,missing_region])
          print('SEVERE_STRUCTURAL_FINDINGS=', severe)
          if severe:
              raise SystemExit(2)
